    const data = {"index": 15, "chapterId": "61c089909f1e9c3ce2baa412", "chapter": "Circle", "exam": "MHT CET", "subject": "Mathematics", "totalTopics": 15, "totalQuestions": 125, "downloadTime": "2026-10-08 20:42:54", "topics": [{"index": 1, "topicId": "65a263390279619d9d8a3d35", "title": "General Equation of 2nd degree curve", "totalQuestions": 6, "questions": [{"_id": "6a44d31c8c30a4553e1be04b", "type": "singleCorrect", "question": {"text": "The centre and radius of the circle $(a+1)x^2 + 3y^2 - 6x + 9y + a + 4 = 0$ are respectively ...", "image": null}, "options": [{"id": "FF3C3", "label": "A", "text": "$\\left(-1, \\dfrac{3}{2}\\right), \\dfrac{\\sqrt{5}}{2}$", "isCorrect": false, "image": null}, {"id": "jLqsa", "label": "B", "text": "$\\left(-1, -\\dfrac{3}{2}\\right), \\dfrac{\\sqrt{5}}{2}$", "isCorrect": false, "image": null}, {"id": "9woQo", "label": "C", "text": "$\\left(1, -\\dfrac{3}{2}\\right), \\dfrac{\\sqrt{5}}{2}$", "isCorrect": true, "image": null}, {"id": "kkR1s", "label": "D", "text": "$\\left(1, \\dfrac{3}{2}\\right), \\dfrac{\\sqrt{5}}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the given equation to represent a circle, the coefficients of $x^2$ and $y^2$ must be equal.<br><br>$a + 1 = 3 \\Rightarrow a = 2$<br><br>Substituting $a = 2$ into the given equation:<br><br>$3x^2 + 3y^2 - 6x + 9y + 6 = 0$<br><br>Dividing by $3$, we get the standard form of the circle:<br><br>$x^2 + y^2 - 2x + 3y + 2 = 0$<br><br>Comparing with $x^2 + y^2 + 2gx + 2fy + c = 0$, we have $2g = -2$, $2f = 3$, and $c = 2$.<br><br>The centre of the circle is $(-g, -f) = \\left(1, -\\dfrac{3}{2}\\right)$.<br><br>The radius of the circle is $r = \\sqrt{g^2 + f^2 - c} = \\sqrt{(-1)^2 + \\left(\\dfrac{3}{2}\\right)^2 - 2} = \\sqrt{1 + \\dfrac{9}{4} - 2} = \\sqrt{\\dfrac{5}{4}} = \\dfrac{\\sqrt{5}}{2}$.<br><br>Answer: $\\left(1, -\\dfrac{3}{2}\\right), \\dfrac{\\sqrt{5}}{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be339", "type": "singleCorrect", "question": {"text": "If the equation $3x^2 + (3 - p)xy + qy^2 - 2px = 8pq$ represents a circle, then the area (in sq. units) of this circle is", "image": null}, "options": [{"id": "WL515", "label": "A", "text": "$5\\pi$", "isCorrect": false, "image": null}, {"id": "e2W00", "label": "B", "text": "$9\\pi$", "isCorrect": false, "image": null}, {"id": "kkINh", "label": "C", "text": "$25\\pi$", "isCorrect": true, "image": null}, {"id": "LaVIp", "label": "D", "text": "$81\\pi$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a general second-degree equation $ax^2 + 2hxy + by^2 + 2gx + 2fy + c = 0$ to represent a circle, the coefficient of $xy$ must be zero and the coefficients of $x^2$ and $y^2$ must be equal.<br><br>From the given equation $3x^2 + (3 - p)xy + qy^2 - 2px = 8pq$, we have:<br><br>Coefficient of $xy = 0 \\Rightarrow 3 - p = 0 \\Rightarrow p = 3$<br><br>Coefficient of $x^2 = \\text{Coefficient of } y^2 \\Rightarrow q = 3$<br><br>Substituting $p = 3$ and $q = 3$ into the given equation:<br><br>$3x^2 + 3y^2 - 6x = 72$<br><br>Dividing by $3$, we get:<br><br>$x^2 + y^2 - 2x - 24 = 0$<br><br>Comparing this with the standard equation of a circle $x^2 + y^2 + 2gx + 2fy + c = 0$, we get $g = -1$, $f = 0$, and $c = -24$.<br><br>The radius of the circle is $r = \\sqrt{g^2 + f^2 - c} = \\sqrt{(-1)^2 + 0^2 - (-24)} = \\sqrt{25} = 5$.<br><br>The area of the circle is $\\pi r^2 = \\pi (5)^2 = 25\\pi$.<br><br>Answer: $25\\pi$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622c0279619d9d8a3261", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "If $\\lambda$ is the perpendicular distance of a point $\\mathrm{P}$ on the circle $x^2+y^2+2 x+2 y-3=0$, from the line $2 x+y+13=0$, then maximum possible value of $\\lambda$ is", "image": null}, "options": [{"id": "p2QEh", "text": "$2 \\sqrt{5}$", "image": null, "isCorrect": false}, {"id": "y9dIk", "text": "$3 \\sqrt{5}$", "image": null, "isCorrect": true}, {"id": "pXrqZ", "text": "$4 \\sqrt{5}$", "image": null, "isCorrect": false}, {"id": "bEVGt", "text": "$\\sqrt{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation of the circle is $x^2+y^2+2 x+2 y-3=0$\nWhich can be written as: $(x+1)^2+(y+1)^2=5$ It is a circle with centre $(-1,-1)$ and radius $\\sqrt{5}$ Given line is: $2 x+y+13=0$\nTo find the required distance, we find the equation of a line perpendicular to the given line, and passing through the centre of the given circle.\n$\\therefore \\quad$ Equation of this line is: $(y+1)=\\frac{1}{2}(x+1)$ i.e., $x=2 y+1$\nNow, we find the points where line $x=2 y+1$ intersects the circle $x^2+y^2+2 x+2 y-3=0$\n$$\n\\begin{array}{ll}\n\\therefore & (2 y+1)^2+y^2+2(2 y+1)+2 y-3=0 \\\\\n\\therefore & 4 y^2+4 y+1+y^2+4 y+2+2 y-3=0 \\\\\n\\therefore & 5 y^2+10 y=0 \\\\\n\\therefore & y(y+2)=0 \\\\\n\\therefore & y=0 \\text { or } y=-2 \\\\\n\\therefore & x=1 \\text { or } x=-3\n\\end{array}\n$$\n$\\therefore \\quad(1,0)$ and $(-3,-2)$ are the points on the circle, and one of them is at the maximum distance from the given line.\n$$\n\\begin{array}{ll}\n\\therefore & \\mathrm{d}_1=\\left|\\frac{2(1)+(0)+13}{\\sqrt{4+1}}\\right| \\text { and } \\mathrm{d}_2=\\left|\\frac{2(-3)+(-2)+13}{\\sqrt{4+1}}\\right| \\\\\n\\therefore & \\mathrm{d}_1=\\frac{15}{\\sqrt{5}}=3 \\sqrt{5} \\quad \\text { and } \\mathrm{d}_2=\\frac{5}{\\sqrt{5}}=\\sqrt{5} \\\\\n\\therefore & \\lambda=3 \\sqrt{5}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262180279619d9d8a31c0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "If a circle passes through points $(4,0)$ and $(0,2)$ and its centre lies on $\\mathrm{Y}$-axis. If the radius of the circle is $r$, then the value of $r^2-r+1$ is", "image": null}, "options": [{"id": "n3rBp", "text": "$25$", "image": null, "isCorrect": false}, {"id": "xnS7b", "text": "$21$", "image": null, "isCorrect": true}, {"id": "Hrui5", "text": "$20$", "image": null, "isCorrect": false}, {"id": "sdI7p", "text": "$10$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $(0, y)$ be the centre of the circle.\n$\\begin{aligned}\n& \\therefore \\quad \\sqrt{(0-4)^2+(y-0)^2}=\\sqrt{(0-0)^2+(y-2)^2} \\\\\n& \\therefore \\quad 16+y^2=(y-2)^2 \\\\\n& \\therefore \\quad 16+y^2=y^2-4 y+4 \\\\\n& \\begin{aligned}\n\\therefore & y=-3 \\\\\n\\therefore & \\text { centre of the circle is }(0,-3) . \\\\\n\\therefore & \\text { Radius of the circle }=\\mathrm{r}=\\sqrt{(0-0)^2+(-3-2)^2} \\\\\n& =5 \\text { units } \\\\\n\\therefore & \\mathrm{r}^2-\\mathrm{r}+1=25-5+1=21\n\\end{aligned}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f10279619d9d8a3091", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "The parametric equations of the circle $x^2+y^2+2 x-4 y-4=0$ are", "image": null}, "options": [{"id": "pk5EL", "text": "$x=-1+3 \\cos \\theta, y=2+3 \\sin \\theta$", "image": null, "isCorrect": true}, {"id": "wWkOI", "text": "$x=1+3 \\cos \\theta, y=-2+3 \\sin \\theta$", "image": null, "isCorrect": false}, {"id": "fjSCq", "text": "$x=-1+3 \\sin \\theta, y=-2+3 \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "a0lc5", "text": "$x=1+3 \\sin \\theta, y=-2+3 \\cos \\theta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation of circle is\n$\\begin{aligned}\n& x^2+y^2+2 x-4 y-4=0 \\\\\n& \\Rightarrow\\left(x^2+2 x+1\\right)+\\left(y^2-4 y+4\\right)-4-5=0 \\\\\n& \\Rightarrow(x+1)^2+(y-2)^2=3^2\n\\end{aligned}$\n$\\therefore \\quad$ Parametric equation of circle is\n$x=-1+3 \\cos \\theta, y=2+3 \\sin \\theta$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a50279619d9d8a2e32", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Let $a$ and $b$ two non-zero real numbers. The equation\n$\\left(a x^2+b y^2+c\\right)\\left(x^2-5 x y+6 y^2\\right)$\nFour straight lines, when $c=0$ and $a, b$ are of the same sign.", "image": null}, "options": [{"id": "qsVxx", "text": "A circle and an ellipse, when $a$ and $b$ are of the same sign and $c$ is of sign opposite to that of $a$", "image": null, "isCorrect": false}, {"id": "sJsnc", "text": "two straight lines and a hyperbola when $a$ and $b$ are of the same sign and $c$ is of sign", "image": null, "isCorrect": false}, {"id": "TTMHE", "text": "Opposite to that of $a$", "image": null, "isCorrect": false}, {"id": "YEhy0", "text": "two straight lines and a circle, when $a=b$ and $c$ is of sign opposite to that of $a$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\because a=b$ and $c$ is of opposite sign\n$\\Rightarrow a x^2+b y^2+c=0$ will represent a circle $x^2-5 x y+6 y^2$ represent a pair of straight line passing through the origin\nHence, option ' $\\mathrm{D}$ ' is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263380279619d9d8a3d28", "title": "Equation of Circle & its intercept", "totalQuestions": 46, "questions": [{"_id": "6abb885515a9fc0fc8c142b4", "type": "singleCorrect", "question": {"text": "The equations of the lines passing through the center of circle $x^2 + y^2 - 4x - 10y - 7 = 0$ and intersecting the line $3x - y - 1 = 0$ at an angle $\\dfrac{\\pi}{4}$ is...", "image": null}, "options": [{"id": "RXZ9T", "label": "A", "text": "$2y = x + 8$ or $y = 9 - 2x$", "isCorrect": true, "image": null}, {"id": "5tO1u", "label": "B", "text": "$x + 2y = 8$ or $2x - y = 9$", "isCorrect": false, "image": null}, {"id": "Be43O", "label": "C", "text": "$x + 2y + 8 = 0$ or $y - 2x = 9$", "isCorrect": false, "image": null}, {"id": "Smwxn", "label": "D", "text": "$2y - x + 8 = 0$ or $2x - y = 9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The center of the given circle $x^2 + y^2 - 4x - 10y - 7 = 0$ is $(2, 5)$.<br><br>The slope of the given line $3x - y - 1 = 0$ is $m_1 = 3$.<br><br>Let the slope of the required line be $m$. Since the angle between the required line and the given line is $\\dfrac{\\pi}{4}$, we have:<br><br>$\\tan\\left(\\dfrac{\\pi}{4}\\right) = \\left| \\dfrac{m - m_1}{1 + m m_1} \\right|$<br><br>$1 = \\left| \\dfrac{m - 3}{1 + 3m} \\right|$<br><br>$m - 3 = \\pm (1 + 3m)$<br><br>Taking the positive sign:<br>$m - 3 = 1 + 3m \\Rightarrow 2m = -4 \\Rightarrow m = -2$<br><br>Taking the negative sign:<br>$m - 3 = -1 - 3m \\Rightarrow 4m = 2 \\Rightarrow m = \\dfrac{1}{2}$<br><br>The required lines pass through the center $(2, 5)$.<br><br>Equation of the line with slope $m = -2$:<br>$y - 5 = -2(x - 2)$<br>$y = 9 - 2x$<br><br>Equation of the line with slope $m = \\dfrac{1}{2}$:<br>$y - 5 = \\dfrac{1}{2}(x - 2)$<br>$2y - 10 = x - 2$<br>$2y = x + 8$<br><br>The equations of the required lines are $2y = x + 8$ and $y = 9 - 2x$.<br><br>Answer: $2y = x + 8$ or $y = 9 - 2x$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b415a9fc0fc8c14639", "type": "singleCorrect", "question": {"text": "The equation of a circle whose center is at $(3, -4)$ and the line $12x - 5y - 17 = 0$ cuts the circle at $A$ and $B$, where $l(AB) = 6$ is ...", "image": null}, "options": [{"id": "0kNw9", "label": "A", "text": "$x^2 + y^2 - 6x + 8y + 7 = 0$", "isCorrect": true, "image": null}, {"id": "z0QZ2", "label": "B", "text": "$x^2 + y^2 - 6x + 8y - 7 = 0$", "isCorrect": false, "image": null}, {"id": "RBNJd", "label": "C", "text": "$x^2 + y^2 + 6x + 8y + 7 = 0$", "isCorrect": false, "image": null}, {"id": "pm46x", "label": "D", "text": "$x^2 + y^2 - 6x - 8y - 7 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The center of the circle is $C(3, -4)$.<br><br>The perpendicular distance $d$ from the center $C(3, -4)$ to the line $12x - 5y - 17 = 0$ is given by:<br><br>$d = \\dfrac{|12(3) - 5(-4) - 17|}{\\sqrt{12^2 + (-5)^2}}$<br><br>$d = \\dfrac{|36 + 20 - 17|}{13} = \\dfrac{39}{13} = 3$<br><br>The length of the chord is given by $2\\sqrt{r^2 - d^2} = 6$, where $r$ is the radius of the circle.<br><br>$\\sqrt{r^2 - 3^2} = 3$<br><br>$r^2 - 9 = 9 \\Rightarrow r^2 = 18$<br><br>The equation of the circle is:<br><br>$(x - 3)^2 + (y + 4)^2 = 18$<br><br>$x^2 - 6x + 9 + y^2 + 8y + 16 = 18$<br><br>$x^2 + y^2 - 6x + 8y + 7 = 0$<br><br>Answer: $x^2 + y^2 - 6x + 8y + 7 = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888415a9fc0fc8c14477", "type": "singleCorrect", "question": {"text": "The equation of a circle with origin as centre and passing through the vertices of an equilateral triangle whose median is of length $3a$ is", "image": null}, "options": [{"id": "4LuEo", "label": "A", "text": "$x^2 + y^2 = 9a^2$", "isCorrect": false, "image": null}, {"id": "ADV46", "label": "B", "text": "$x^2 + y^2 = 16a^2$", "isCorrect": false, "image": null}, {"id": "AG9E5", "label": "C", "text": "$x^2 + y^2 = 4a^2$", "isCorrect": true, "image": null}, {"id": "YVeD0", "label": "D", "text": "$x^2 + y^2 = a^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For an equilateral triangle, the circumcentre and the centroid coincide.<br><br>The centroid divides the median in the ratio $2:1$.<br><br>The radius of the circumcircle, $R$, is the distance from the centroid to any vertex, which is $\\dfrac{2}{3}$ of the length of the median.<br><br>Given the length of the median is $3a$.<br><br>$R = \\dfrac{2}{3} \\times 3a = 2a$<br><br>The centre of the circle is the origin $(0, 0)$.<br><br>The equation of the circle is $x^2 + y^2 = R^2$.<br><br>Substituting $R = 2a$, we get $x^2 + y^2 = 4a^2$.<br><br>Answer: $x^2 + y^2 = 4a^2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886615a9fc0fc8c1435a", "type": "singleCorrect", "question": {"text": "The Cartesian coordinates of a point P with parameter $\\theta = \\dfrac{5\\pi}{6}$ on the circle $x^2 + y^2 - 2x + 4y + 1 = 0$ are...", "image": null}, "options": [{"id": "Z2QGA", "label": "A", "text": "$(1, 0)$", "isCorrect": false, "image": null}, {"id": "b19k6", "label": "B", "text": "$(0, -2 + \\sqrt{3})$", "isCorrect": false, "image": null}, {"id": "Z01XA", "label": "C", "text": "$(-1, -2)$", "isCorrect": false, "image": null}, {"id": "Dki4G", "label": "D", "text": "$(-\\sqrt{3} + 1, -1)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the circle is $x^2 + y^2 - 2x + 4y + 1 = 0$.<br><br>Rewriting it in standard form by completing the square:<br><br>$(x^2 - 2x + 1) + (y^2 + 4y + 4) = 1 + 4 - 1$<br><br>$(x - 1)^2 + (y + 2)^2 = 4$<br><br>The center of the circle is $(h, k) = (1, -2)$ and the radius is $r = 2$.<br><br>The parametric equations of the circle are given by:<br><br>$x = h + r \\cos \\theta$<br><br>$y = k + r \\sin \\theta$<br><br>Substituting $h = 1$, $k = -2$, $r = 2$, and $\\theta = \\dfrac{5\\pi}{6}$:<br><br>$x = 1 + 2 \\cos\\left(\\dfrac{5\\pi}{6}\\right) = 1 + 2 \\left(-\\dfrac{\\sqrt{3}}{2}\\right) = 1 - \\sqrt{3}$<br><br>$y = -2 + 2 \\sin\\left(\\dfrac{5\\pi}{6}\\right) = -2 + 2 \\left(\\dfrac{1}{2}\\right) = -1$<br><br>The Cartesian coordinates of the point P are $(-\\sqrt{3} + 1, -1)$.<br><br>Answer: $(-\\sqrt{3} + 1, -1)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883515a9fc0fc8c14189", "type": "singleCorrect", "question": {"text": "The standard parametric equations of the circle $x^2+y^2-4x-6y-12=0$ are ...", "image": null}, "options": [{"id": "NMPds", "label": "A", "text": "$x=2+5\\cos\\theta, y=3+5\\sin\\theta$", "isCorrect": true, "image": null}, {"id": "PUBp5", "label": "B", "text": "$x=-2+5\\cos\\theta, y=-3+5\\sin\\theta$", "isCorrect": false, "image": null}, {"id": "22vb6", "label": "C", "text": "$x=2+12\\cos\\theta, y=3+12\\sin\\theta$", "isCorrect": false, "image": null}, {"id": "PfhF7", "label": "D", "text": "$x=3+5\\cos\\theta, y=2+5\\sin\\theta$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the circle is $x^2+y^2-4x-6y-12=0$.<br><br>Rewriting the equation by completing the square:<br><br>$(x^2-4x+4) + (y^2-6y+9) = 12+4+9$<br><br>$(x-2)^2 + (y-3)^2 = 25$<br><br>Comparing this with the standard form $(x-h)^2 + (y-k)^2 = r^2$, we get the center $(h, k) = (2, 3)$ and the radius $r = 5$.<br><br>The standard parametric equations of a circle are given by $x = h + r\\cos\\theta$ and $y = k + r\\sin\\theta$.<br><br>Substituting the values of $h$, $k$, and $r$, we get:<br><br>$x = 2 + 5\\cos\\theta$<br><br>$y = 3 + 5\\sin\\theta$<br><br>Answer: $x=2+5\\cos\\theta, y=3+5\\sin\\theta$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ac8c30a4553e1bdb9b", "type": "singleCorrect", "question": {"text": "The equation of a circle whose center lies on $x + 2y = 0$ and touching the lines $3x - 4y + 8 = 0$ and $3x - 4y - 28 = 0$ is", "image": null}, "options": [{"id": "RsI3l", "label": "A", "text": "$(x - 2)^2 + (y + 1)^2 = 324$", "isCorrect": false, "image": null}, {"id": "AK1tG", "label": "B", "text": "$(x - 2)^2 + (y - 1)^2 = 324$", "isCorrect": false, "image": null}, {"id": "YLEpB", "label": "C", "text": "$5(x - 2)^2 + 5(y + 1)^2 = 324$", "isCorrect": false, "image": null}, {"id": "i0vHi", "label": "D", "text": "$25(x - 2)^2 + 25(y + 1)^2 = 324$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given lines $3x - 4y + 8 = 0$ and $3x - 4y - 28 = 0$ are parallel. The distance between them is the diameter of the circle.<br><br>Diameter $= \\dfrac{|8 - (-28)|}{\\sqrt{3^2 + (-4)^2}} = \\dfrac{36}{5}$<br><br>Radius $r = \\dfrac{18}{5}$<br><br>The center of the circle lies on the line parallel to and midway between the two given lines. The equation of this midway line is:<br><br>$3x - 4y + \\dfrac{8 + (-28)}{2} = 0 \\Rightarrow 3x - 4y - 10 = 0$<br><br>The center also lies on the given line $x + 2y = 0$.<br><br>Solving $3x - 4y - 10 = 0$ and $x + 2y = 0$, we substitute $x = -2y$:<br><br>$3(-2y) - 4y - 10 = 0 \\Rightarrow -10y = 10 \\Rightarrow y = -1$<br><br>Substituting $y = -1$ in $x = -2y$, we get $x = 2$.<br><br>The center of the circle is $(2, -1)$.<br><br>The equation of the circle is:<br><br>$(x - 2)^2 + (y + 1)^2 = \\left(\\dfrac{18}{5}\\right)^2$<br><br>$(x - 2)^2 + (y + 1)^2 = \\dfrac{324}{25}$<br><br>$25(x - 2)^2 + 25(y + 1)^2 = 324$<br><br>Answer: $25(x - 2)^2 + 25(y + 1)^2 = 324$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3558c30a4553e1be2a3", "type": "singleCorrect", "question": {"text": "The equation of the circle which passes through the points $(2, 3)$ and $(4, 5)$ and whose centre lies on a straight line $4x - y - 3 = 0$, is", "image": null}, "options": [{"id": "UKipt", "label": "A", "text": "$(x - 1)^2 + (y - 6)^2 = 10$", "isCorrect": false, "image": null}, {"id": "D3YEU", "label": "B", "text": "$(x - 3)^2 + (y - 4)^2 = 2$", "isCorrect": false, "image": null}, {"id": "Bo4ED", "label": "C", "text": "$x^2 + (y - 7)^2 = 20$", "isCorrect": false, "image": null}, {"id": "H7043", "label": "D", "text": "$(x - 2)^2 + (y - 5)^2 = 4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the centre of the circle be $(h, k)$.<br><br>Since the centre lies on the line $4x - y - 3 = 0$, we have $4h - k - 3 = 0 \\Rightarrow k = 4h - 3$.<br><br>The circle passes through the points $(2, 3)$ and $(4, 5)$, so the distance from the centre to both points is equal to the radius $r$.<br><br>$(h - 2)^2 + (k - 3)^2 = (h - 4)^2 + (k - 5)^2$<br><br>$-4h + 4 - 6k + 9 = -8h + 16 - 10k + 25$<br><br>$4h + 4k = 28 \\Rightarrow h + k = 7$<br><br>Substituting $k = 4h - 3$ into the above equation:<br><br>$h + 4h - 3 = 7 \\Rightarrow 5h = 10 \\Rightarrow h = 2$<br><br>Then $k = 4(2) - 3 = 5$.<br><br>The centre of the circle is $(2, 5)$.<br><br>The radius squared is $r^2 = (2 - 2)^2 + (5 - 3)^2 = 4$.<br><br>The equation of the circle is $(x - 2)^2 + (y - 5)^2 = 4$.<br><br>Answer: $(x - 2)^2 + (y - 5)^2 = 4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3478c30a4553e1be20d", "type": "singleCorrect", "question": {"text": "If the circles $x^2 + y^2 = 16$ and $x^2 + y^2 + 2ax + 4y + 4 = 0$ touch each other internally then $a =$", "image": null}, "options": [{"id": "zbnPK", "label": "A", "text": "$\\dfrac{2}{3}$", "isCorrect": false, "image": null}, {"id": "IxWD7", "label": "B", "text": "$\\dfrac{1}{56}$", "isCorrect": false, "image": null}, {"id": "beS8s", "label": "C", "text": "$\\dfrac{-2}{3}$", "isCorrect": false, "image": null}, {"id": "JJzdU", "label": "D", "text": "$\\dfrac{3}{2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For the first circle $x^2 + y^2 = 16$, the center is $C_1(0, 0)$ and the radius is $r_1 = 4$.<br><br>For the second circle $x^2 + y^2 + 2ax + 4y + 4 = 0$, the center is $C_2(-a, -2)$ and the radius is $r_2 = \\sqrt{a^2 + 2^2 - 4} = |a|$.<br><br>Since the two circles touch each other internally, the distance between their centers is equal to the difference of their radii:<br><br>$C_1C_2 = |r_1 - r_2|$<br><br>$\\sqrt{(-a - 0)^2 + (-2 - 0)^2} = |4 - |a||$<br><br>$\\sqrt{a^2 + 4} = |4 - |a||$<br><br>Squaring both sides:<br><br>$a^2 + 4 = 16 + a^2 - 8|a|$<br><br>$8|a| = 12$<br><br>$|a| = \\dfrac{3}{2}$<br><br>$a = \\pm \\dfrac{3}{2}$<br><br>From the given options, $a = \\dfrac{3}{2}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c98c30a4553e1bdcc7", "type": "singleCorrect", "question": {"text": "If a circle passes through the points $(2,3)$ and $(4,5)$ and its center lies on the straight line $y - 4x + 3 = 0$, then its equation is......", "image": null}, "options": [{"id": "UbVLd", "label": "A", "text": "$x^2 + y^2 - 4x - 10y + 25 = 0$", "isCorrect": true, "image": null}, {"id": "hP3K2", "label": "B", "text": "$x^2 + y^2 - 4x - 10y - 25 = 0$", "isCorrect": false, "image": null}, {"id": "RI90q", "label": "C", "text": "$x^2 + y^2 - 4x + 10y - 25 = 0$", "isCorrect": false, "image": null}, {"id": "Cdsfs", "label": "D", "text": "$x^2 + y^2 + 25 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the equation of the circle be $x^2 + y^2 + 2gx + 2fy + c = 0$.<br><br>The center of the circle is $(-g, -f)$.<br><br>Since the center lies on the line $y - 4x + 3 = 0$:<br><br>$-f - 4(-g) + 3 = 0$<br><br>$4g - f + 3 = 0$<br><br>The circle passes through $(2, 3)$, so substituting $x = 2, y = 3$:<br><br>$2^2 + 3^2 + 2g(2) + 2f(3) + c = 0$<br><br>$4g + 6f + c + 13 = 0$<br><br>The circle passes through $(4, 5)$, so substituting $x = 4, y = 5$:<br><br>$4^2 + 5^2 + 2g(4) + 2f(5) + c = 0$<br><br>$8g + 10f + c + 41 = 0$<br><br>Subtracting the equation for $(2, 3)$ from the equation for $(4, 5)$:<br><br>$(8g - 4g) + (10f - 6f) + (c - c) + (41 - 13) = 0$<br><br>$4g + 4f + 28 = 0$<br><br>$g + f + 7 = 0$<br><br>From the condition $4g - f + 3 = 0$, we have $f = 4g + 3$. Substituting this value:<br><br>$g + (4g + 3) + 7 = 0$<br><br>$5g + 10 = 0$<br><br>$g = -2$<br><br>Substituting the value of $g$ to find $f$:<br><br>$f = 4(-2) + 3 = -5$<br><br>Substituting the values of $g$ and $f$ to find $c$:<br><br>$4(-2) + 6(-5) + c + 13 = 0$<br><br>$-8 - 30 + c + 13 = 0$<br><br>$c - 25 = 0$<br><br>$c = 25$<br><br>The equation of the circle is:<br><br>$x^2 + y^2 + 2(-2)x + 2(-5)y + 25 = 0$<br><br>$x^2 + y^2 - 4x - 10y + 25 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29f8c30a4553e1bdb05", "type": "singleCorrect", "question": {"text": "The equation of the circle concentric with circle $x^2 + y^2 - 6x + 7 = 0$ and which touches the line $x + y + 3 = 0$ is ....", "image": null}, "options": [{"id": "nEKJo", "label": "A", "text": "$x^2 + y^2 - 6x + 9 = 0$", "isCorrect": false, "image": null}, {"id": "R5Odr", "label": "B", "text": "$x^2 + y^2 - 6x - 9 = 0$", "isCorrect": true, "image": null}, {"id": "XiAfz", "label": "C", "text": "$x^2 + y^2 - 6x + 3 = 0$", "isCorrect": false, "image": null}, {"id": "rUJ88", "label": "D", "text": "$x^2 + y^2 - 6x - 3 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given circle is $x^2 + y^2 - 6x + 7 = 0$.<br><br>Its center is $(3, 0)$.<br><br>The required circle is concentric with the given circle, so its center is also $(3, 0)$.<br><br>The required circle touches the line $x + y + 3 = 0$.<br><br>The radius $r$ of the required circle is the perpendicular distance from the center $(3, 0)$ to the line $x + y + 3 = 0$.<br><br>$r = \\dfrac{|3 + 0 + 3|}{\\sqrt{1^2 + 1^2}} = \\dfrac{6}{\\sqrt{2}} = 3\\sqrt{2}$<br><br>The equation of the required circle is $(x - 3)^2 + (y - 0)^2 = r^2$.<br><br>$(x - 3)^2 + y^2 = (3\\sqrt{2})^2$<br><br>$x^2 - 6x + 9 + y^2 = 18$<br><br>$x^2 + y^2 - 6x - 9 = 0$<br><br>Answer: $x^2 + y^2 - 6x - 9 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ba8c30a4553e1bdc31", "type": "singleCorrect", "question": {"text": "The equation of a circle which passes through the points $(2,3)$ and $(4,5)$ and whose center lies on the straight line $y - 4x + 3 = 0$ is", "image": null}, "options": [{"id": "0sp1e", "label": "A", "text": "$x^2 + y^2 - 4x - 10y + 25 = 0$", "isCorrect": true, "image": null}, {"id": "tKExV", "label": "B", "text": "$x^2 + y^2 - 4x - 10y - 25 = 0$", "isCorrect": false, "image": null}, {"id": "l6nBb", "label": "C", "text": "$x^2 + y^2 - 4x + 10y - 25 = 0$", "isCorrect": false, "image": null}, {"id": "Ip7m0", "label": "D", "text": "$x^2 + y^2 + 4x - 10y + 25 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the center of the circle be $(h, k)$.<br><br>Since the center lies on the line $y - 4x + 3 = 0$, we have:<br>$k - 4h + 3 = 0 \\Rightarrow k = 4h - 3$<br><br>The circle passes through $(2,3)$ and $(4,5)$, so the distance from the center to both points is equal to the radius $r$.<br>$(h - 2)^2 + (k - 3)^2 = (h - 4)^2 + (k - 5)^2$<br><br>Expanding both sides:<br>$h^2 - 4h + 4 + k^2 - 6k + 9 = h^2 - 8h + 16 + k^2 - 10k + 25$<br><br>Simplifying the equation:<br>$4h + 4k = 28 \\Rightarrow h + k = 7$<br><br>Substituting $k = 4h - 3$ into the above equation:<br>$h + 4h - 3 = 7 \\Rightarrow 5h = 10 \\Rightarrow h = 2$<br><br>Then, $k = 4(2) - 3 = 5$.<br>The center of the circle is $(2, 5)$.<br><br>The radius squared is:<br>$r^2 = (2 - 2)^2 + (5 - 3)^2 = 4$<br><br>The equation of the circle is:<br>$(x - 2)^2 + (y - 5)^2 = 4$<br>$x^2 - 4x + 4 + y^2 - 10y + 25 = 4$<br>$x^2 + y^2 - 4x - 10y + 25 = 0$<br><br>Answer: $x^2 + y^2 - 4x - 10y + 25 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c03bf9280d7f9932e80", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If one of the diameters of the circle, given by the equation $x^2+y^2-4 x+6 y-12=0$, is a chord of a circle, 'S', whose centre is at $(-3,2)$, then the length of radius of ' $S$ ' is ______ units.", "image": null}, "options": [{"id": "5TALM", "text": "5", "image": null, "isCorrect": false}, {"id": "6LdXf", "text": "$5 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "BN7pQ", "text": "$5 \\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "gFIDJ", "text": "10", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the given circle is $x^2+y^2-4x+6y-12=0$.<br><br>Its centre is $C_1(2, -3)$ and radius is $r_1 = \\sqrt{2^2 + (-3)^2 - (-12)} = \\sqrt{4 + 9 + 12} = 5$.<br><br>The diameter of this circle is a chord of the required circle $S$. The midpoint of this chord is the centre of the first circle, $C_1(2, -3)$.<br><br>The centre of circle $S$ is given as $C_2(-3, 2)$.<br><br>The distance between the centres $C_1$ and $C_2$ is $d = \\sqrt{(-3 - 2)^2 + (2 - (-3))^2} = \\sqrt{25 + 25} = \\sqrt{50}$.<br><br>In the right-angled triangle formed by the centre $C_2$, the midpoint of the chord $C_1$, and an endpoint of the chord, the hypotenuse is the radius $R$ of circle $S$.<br><br>Using Pythagoras theorem:<br><br>$R^2 = d^2 + r_1^2$<br><br>$R^2 = (\\sqrt{50})^2 + 5^2 = 50 + 25 = 75$<br><br>$R = \\sqrt{75} = 5\\sqrt{3}$ units.<br><br>Answer: $5 \\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8ebf9280d7f9932a56", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let the circle with centre at origin pass through the vertices of an equilateral triangle $A B C$. If $A \\equiv(2,4)$, then the length of the median through A is", "image": null}, "options": [{"id": "9Mcha", "text": "$2 \\sqrt{5}$ units", "image": null, "isCorrect": false}, {"id": "JaIMR", "text": "$3 \\sqrt{5}$ units", "image": null, "isCorrect": true}, {"id": "NQTOb", "text": "$4 \\sqrt{5}$ units", "image": null, "isCorrect": false}, {"id": "Ykmqc", "text": "$6 \\sqrt{5}$ units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The circumcentre of the equilateral triangle $ABC$ is at the origin $O(0,0)$.<br><br>For an equilateral triangle, the circumcentre and the centroid coincide. Thus, the centroid $G$ is at $(0,0)$.<br><br>The distance from vertex $A(2,4)$ to the centroid $G(0,0)$ is given by:<br><br>$AG = \\sqrt{2^2 + 4^2} = \\sqrt{20} = 2\\sqrt{5}$<br><br>The centroid divides the median of a triangle in the ratio $2:1$. Therefore, the length of the median through $A$ is $\\dfrac{3}{2}$ times the distance $AG$.<br><br>Length of the median $= \\dfrac{3}{2} \\times 2\\sqrt{5} = 3\\sqrt{5}$ units.<br><br>Answer: $3 \\sqrt{5}$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3dbf9280d7f9932765", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The number of integral values of $K$ for which $x^2+\\mathrm{y}^2+\\mathrm{k} x+(1-\\mathrm{k}) \\mathrm{y}+5=0$ represents a circle whose radius cannot exceed 5, is", "image": null}, "options": [{"id": "mSlgb", "text": "$10$", "image": null, "isCorrect": true}, {"id": "pmOqk", "text": "$15$", "image": null, "isCorrect": false}, {"id": "rHzOw", "text": "$14$", "image": null, "isCorrect": false}, {"id": "PqTDS", "text": "$12$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the circle is $x^2 + y^2 + kx + (1-k)y + 5 = 0$.<br><br>Comparing this with the general equation of a circle $x^2 + y^2 + 2gx + 2fy + c = 0$, we get:<br>$g = \\dfrac{k}{2}$, $f = \\dfrac{1-k}{2}$, and $c = 5$.<br><br>The radius of the circle is given by $r = \\sqrt{g^2 + f^2 - c}$.<br>For the equation to represent a real circle, we must have $r^2 > 0$.<br>Also, it is given that the radius cannot exceed $5$, so $r \\le 5 \\Rightarrow r^2 \\le 25$.<br><br>Thus, we have the inequality:<br>$0 < g^2 + f^2 - c \\le 25$<br><br>Substituting the values of $g$, $f$, and $c$:<br>$0 < \\left(\\dfrac{k}{2}\\right)^2 + \\left(\\dfrac{1-k}{2}\\right)^2 - 5 \\le 25$<br><br>$0 < \\dfrac{k^2 + 1 - 2k + k^2}{4} - 5 \\le 25$<br><br>$0 < \\dfrac{2k^2 - 2k - 19}{4} \\le 25$<br><br>Multiplying the entire inequality by $4$:<br>$0 < 2k^2 - 2k - 19 \\le 100$<br><br>This gives us two separate inequalities to solve:<br><br>1) $2k^2 - 2k - 19 > 0$<br>The roots of the equation $2k^2 - 2k - 19 = 0$ are $k = \\dfrac{2 \\pm \\sqrt{4 - 4(2)(-19)}}{4} = \\dfrac{1 \\pm \\sqrt{39}}{2}$.<br>Since $\\sqrt{39} \\approx 6.24$, the roots are approximately $-2.62$ and $3.62$.<br>For the quadratic to be positive, $k < -2.62$ or $k > 3.62$.<br>Since $k$ is an integer, $k \\le -3$ or $k \\ge 4$.<br><br>2) $2k^2 - 2k - 19 \\le 100$<br>$2k^2 - 2k - 119 \\le 0$<br>The roots of the equation $2k^2 - 2k - 119 = 0$ are $k = \\dfrac{2 \\pm \\sqrt{4 - 4(2)(-119)}}{4} = \\dfrac{1 \\pm \\sqrt{239}}{2}$.<br>Since $\\sqrt{239} \\approx 15.46$, the roots are approximately $-7.23$ and $8.23$.<br>For the quadratic to be less than or equal to zero, $-7.23 \\le k \\le 8.23$.<br>Since $k$ is an integer, $-7 \\le k \\le 8$.<br><br>Taking the intersection of the two conditions for integer $k$:<br>$k \\in \\{-7, -6, -5, -4, -3\\} \\cup \\{4, 5, 6, 7, 8\\}$<br><br>The number of integral values of $k$ is $5 + 5 = 10$.<br><br>Answer: $10$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2abf9280d7f99326d3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation of the circle passing through the point $(1,1)$ and having two diameters along the pair of lines $x^2-y^2-2 x+4 y-3=0$ is", "image": null}, "options": [{"id": "pZn8O", "text": "$(x+2)^2+(y-2)^2=4$", "image": null, "isCorrect": false}, {"id": "0MS4o", "text": "$(x-3)^2+(y-1)^2=4$", "image": null, "isCorrect": false}, {"id": "W2gLB", "text": "$(x-1)^2+(y-2)^2=1$", "image": null, "isCorrect": true}, {"id": "7W41P", "text": "$(x+1)^2+(y+2)^2=1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the pair of lines is $x^2 - y^2 - 2x + 4y - 3 = 0$.<br><br>This can be rewritten by completing the squares:<br><br>$(x^2 - 2x + 1) - (y^2 - 4y + 4) = 0$<br><br>$(x - 1)^2 - (y - 2)^2 = 0$<br><br>$[(x - 1) - (y - 2)][(x - 1) + (y - 2)] = 0$<br><br>The two diameters are along the lines $x - y + 1 = 0$ and $x + y - 3 = 0$.<br><br>The intersection point of the diameters gives the center of the circle. Solving these two equations, we get the center as $(1, 2)$.<br><br>The circle passes through the point $(1, 1)$. The radius $r$ is the distance between the center $(1, 2)$ and the point $(1, 1)$.<br><br>$r = \\sqrt{(1 - 1)^2 + (2 - 1)^2} = \\sqrt{0 + 1} = 1$<br><br>The equation of the circle with center $(1, 2)$ and radius $1$ is:<br><br>$(x - 1)^2 + (y - 2)^2 = 1$<br><br>Answer: $(x-1)^2+(y-2)^2=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214260aee93fa0796de5d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "If the sides of a rectangle are given by the equations $x=-2, x=6, y=-2, y=5$, then the equation of the circle, drawn on the diagonal of this rectangle as its diameter, is", "image": null}, "options": [{"id": "A8xDz", "text": "$x^2+y^2+4 x+3 y+22=0$", "image": null, "isCorrect": false}, {"id": "ILPeK", "text": "$x^2+y^2-4 x+3 y-22=0$", "image": null, "isCorrect": false}, {"id": "gBcfg", "text": "$x^2+y^2-4 x-3 y-22=0$", "image": null, "isCorrect": true}, {"id": "IlyDe", "text": "$x^2+y^2+4 x-3 y+22=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The sides of the rectangle are given by the lines $x = -2$, $x = 6$, $y = -2$, and $y = 5$.<br><br>The vertices of the rectangle are the points of intersection of these lines. The coordinates of the opposite vertices forming a diagonal are $(-2, -2)$ and $(6, 5)$.<br><br>The equation of a circle with the line segment joining $(x_1, y_1)$ and $(x_2, y_2)$ as its diameter is given by:<br><br>$(x - x_1)(x - x_2) + (y - y_1)(y - y_2) = 0$<br><br>Substituting the coordinates $(-2, -2)$ and $(6, 5)$ into the diameter form:<br><br>$(x - (-2))(x - 6) + (y - (-2))(y - 5) = 0$<br><br>$(x + 2)(x - 6) + (y + 2)(y - 5) = 0$<br><br>$x^2 - 6x + 2x - 12 + y^2 - 5y + 2y - 10 = 0$<br><br>$x^2 + y^2 - 4x - 3y - 22 = 0$<br><br>Answer: $x^2+y^2-4 x-3 y-22=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214000aee93fa0796dd36", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "The parametric equations of the circle $x^2+y^2-a x-b y=0$ are", "image": null}, "options": [{"id": "4tYS4", "text": "$x=\\frac{\\mathrm{a}}{2}+\\frac{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}{2} \\cos \\theta, y=\\frac{\\mathrm{b}}{2}+\\frac{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}{2} \\sin \\theta$", "image": null, "isCorrect": true}, {"id": "ZGBtx", "text": "$x=\\frac{-\\mathrm{a}}{2}+\\frac{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}{4} \\sin \\theta, y=\\frac{-\\mathrm{b}}{2}+\\frac{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}{4} \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "uXRLL", "text": "$x=\\frac{\\mathrm{a}}{2}+\\sqrt{\\frac{\\mathrm{a}^2+\\mathrm{b}^2}{2}} \\sin \\theta, y=\\frac{\\mathrm{b}}{2}+\\sqrt{\\frac{\\mathrm{a}^2+\\mathrm{b}^2}{2}} \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "RAHcS", "text": "$x=\\frac{\\mathrm{a}}{2}+\\frac{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}{4} \\cos \\theta, y=\\frac{\\mathrm{b}}{2}+\\frac{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}{4} \\sin \\theta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the circle is $x^2 + y^2 - ax - by = 0$.<br><br>Rearranging the terms to complete the square:<br><br>$\\left(x^2 - ax + \\dfrac{a^2}{4}\\right) + \\left(y^2 - by + \\dfrac{b^2}{4}\\right) = \\dfrac{a^2}{4} + \\dfrac{b^2}{4}$<br><br>$\\left(x - \\dfrac{a}{2}\\right)^2 + \\left(y - \\dfrac{b}{2}\\right)^2 = \\dfrac{a^2 + b^2}{4}$<br><br>Comparing this with the standard form $(x - h)^2 + (y - k)^2 = r^2$, we get the center $(h, k) = \\left(\\dfrac{a}{2}, \\dfrac{b}{2}\\right)$ and radius $r = \\dfrac{\\sqrt{a^2 + b^2}}{2}$.<br><br>The parametric equations of a circle are given by $x = h + r \\cos \\theta$ and $y = k + r \\sin \\theta$.<br><br>Substituting the values of $h$, $k$, and $r$:<br><br>$x = \\dfrac{a}{2} + \\dfrac{\\sqrt{a^2 + b^2}}{2} \\cos \\theta$<br><br>$y = \\dfrac{b}{2} + \\dfrac{\\sqrt{a^2 + b^2}}{2} \\sin \\theta$<br><br>Answer: $x=\\frac{\\mathrm{a}}{2}+\\frac{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}{2} \\cos \\theta, y=\\frac{\\mathrm{b}}{2}+\\frac{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}{2} \\sin \\theta$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c60aee93fa0796db6d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The abscissae of the two points A and B are the roots of the equation $x^2+2 \\mathrm{a} x-\\mathrm{b}^2=0$ and their ordinates are roots of the equation $y^2+2 p y-q^2=0$. Then the equation of the circle with AB as diameter is given by", "image": null}, "options": [{"id": "v6c3c", "text": "$x^2+y^2-2 \\mathrm{a} x-2 \\mathrm{p} y+\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null, "isCorrect": false}, {"id": "EdgvB", "text": "$x^2+y^2-2 \\mathrm{a} x-2 \\mathrm{p} y-\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null, "isCorrect": false}, {"id": "bmZ4J", "text": "$x^2+y^2+2 \\mathrm{a} x+2 \\mathrm{p} y+\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null, "isCorrect": false}, {"id": "Yl2JJ", "text": "$x^2+y^2+2 \\mathrm{a} x+2 \\mathrm{p} y-\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the coordinates of points A and B be $(x_1, y_1)$ and $(x_2, y_2)$ respectively.<br><br>Since $x_1$ and $x_2$ are the roots of the equation $x^2 + 2\\mathrm{a}x - \\mathrm{b}^2 = 0$, we have:<br>$x_1 + x_2 = -2\\mathrm{a}$<br>$x_1 x_2 = -\\mathrm{b}^2$<br><br>Similarly, since $y_1$ and $y_2$ are the roots of the equation $y^2 + 2\\mathrm{p}y - \\mathrm{q}^2 = 0$, we have:<br>$y_1 + y_2 = -2\\mathrm{p}$<br>$y_1 y_2 = -\\mathrm{q}^2$<br><br>The equation of a circle with points A and B as the extremities of its diameter is given by:<br>$(x - x_1)(x - x_2) + (y - y_1)(y - y_2) = 0$<br><br>Expanding the terms, we get:<br>$x^2 - (x_1 + x_2)x + x_1 x_2 + y^2 - (y_1 + y_2)y + y_1 y_2 = 0$<br><br>Substituting the sum and product of the roots:<br>$x^2 - (-2\\mathrm{a})x + (-\\mathrm{b}^2) + y^2 - (-2\\mathrm{p})y + (-\\mathrm{q}^2) = 0$<br><br>Simplifying the equation:<br>$x^2 + y^2 + 2\\mathrm{a}x + 2\\mathrm{p}y - (\\mathrm{b}^2 + \\mathrm{q}^2) = 0$<br><br>Answer: $x^2+y^2+2 \\mathrm{a} x+2 \\mathrm{p} y-\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b60aee93fa0796daef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The equation of the circle, concentric with the circle $x^2+y^2-6 x-4 y-12=0$ and touching the X -axis is", "image": null}, "options": [{"id": "5I3G5", "text": "$x^2+y^2-6 x-4 y+5=0$", "image": null, "isCorrect": false}, {"id": "0GkOo", "text": "$x^2+y^2-6 x-4 y+17=0$", "image": null, "isCorrect": false}, {"id": "gCDZG", "text": "$x^2+y^2-6 x-4 y+9=0$", "image": null, "isCorrect": true}, {"id": "odx9c", "text": "$x^2+y^2-6 x-4 y+4=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given circle is $x^2+y^2-6 x-4 y-12=0$<br><br>The center of the given circle is $(3, 2)$<br><br>Since the required circle is concentric with the given circle, its center is also $(3, 2)$<br><br>The required circle touches the X-axis, so its radius is equal to the y-coordinate of the center<br><br>$r = 2$<br><br>The equation of the required circle is $(x-3)^2 + (y-2)^2 = 2^2$<br><br>$x^2 - 6x + 9 + y^2 - 4y + 4 = 4$<br><br>$x^2 + y^2 - 6x - 4y + 9 = 0$<br><br>Answer: $x^2+y^2-6 x-4 y+9=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a00aee93fa0796da42", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "The equation of the circle, the end points of whose diameter are the centres of the circles $x^2+y^2+6 x-14 y+5=0$ and $x^2+y^2-4 x+10 y-4=0$ is", "image": null}, "options": [{"id": "5svt0", "text": "$x^2+y^2-x-2 y+41=0$", "image": null, "isCorrect": false}, {"id": "XiaMS", "text": "$x^2+y^2+x-2 y+41=0$", "image": null, "isCorrect": false}, {"id": "vOKnd", "text": "$x^2+y^2+x-2 y-41=0$", "image": null, "isCorrect": true}, {"id": "uFLlc", "text": "$x^2+y^2-x+2 y-41=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The center of the first circle $x^2+y^2+6x-14y+5=0$ is $C_1(-3, 7)$.<br><br>The center of the second circle $x^2+y^2-4x+10y-4=0$ is $C_2(2, -5)$.<br><br>The required circle has $C_1$ and $C_2$ as the end points of its diameter. Using the diametric form of the circle equation:<br><br>$(x - x_1)(x - x_2) + (y - y_1)(y - y_2) = 0$<br><br>$(x + 3)(x - 2) + (y - 7)(y + 5) = 0$<br><br>$x^2 + x - 6 + y^2 - 2y - 35 = 0$<br><br>$x^2 + y^2 + x - 2y - 41 = 0$<br><br>Answer: $x^2+y^2+x-2 y-41=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213920aee93fa0796d9d0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The equation of the circle which passes through the centre of the circle $x^2+y^2+8 x+10 y-7=0$ and concentric which the circle $2 x^2+2 y^2-8 x-12 y-9=0$ is", "image": null}, "options": [{"id": "ivveF", "text": "$x^2+y^2-4 x-6 y+77=0$", "image": null, "isCorrect": false}, {"id": "aviSY", "text": "$x^2+y^2-4 x-6 y-89=0$", "image": null, "isCorrect": false}, {"id": "B4Jwl", "text": "$x^2+y^2-4 x-6 y+97=0$", "image": null, "isCorrect": false}, {"id": "6c9Lg", "text": "$x^2+y^2-4 x-6 y-87=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The centre of the first circle $x^2+y^2+8x+10y-7=0$ is $(-4, -5)$.<br><br>The second circle is $2x^2+2y^2-8x-12y-9=0$, which can be written as $x^2+y^2-4x-6y-\\dfrac{9}{2}=0$.<br><br>The centre of this circle is $(2, 3)$.<br><br>Since the required circle is concentric with the second circle, its centre is also $(2, 3)$.<br><br>The required circle passes through $(-4, -5)$. The square of its radius $r$ is the square of the distance between $(2, 3)$ and $(-4, -5)$.<br><br>$r^2 = (-4-2)^2 + (-5-3)^2 = 36 + 64 = 100$<br><br>The equation of the required circle is $(x-2)^2 + (y-3)^2 = 100$.<br><br>$x^2 - 4x + 4 + y^2 - 6y + 9 = 100$<br><br>$x^2 + y^2 - 4x - 6y - 87 = 0$<br><br>Answer: $x^2+y^2-4 x-6 y-87=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213550aee93fa0796d7fb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The equation of the concentric circle, with the circle $C_1$ having equation $x^2+y^2-6 x-4 y-12=0$ and having double area compared to the area of $\\mathrm{C}_1$, is", "image": null}, "options": [{"id": "tU6jn", "text": "$x^2+y^2-6 x-4 y=27$", "image": null, "isCorrect": false}, {"id": "FtkkF", "text": "$x^2+y^2-6 x-4 y=13$", "image": null, "isCorrect": false}, {"id": "pgFID", "text": "$x^2+y^2-6 x-4 y=50$", "image": null, "isCorrect": false}, {"id": "7lLUT", "text": "$x^2+y^2-6 x-4 y=37$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given circle $C_1$ has the equation $x^2+y^2-6x-4y-12=0$.<br><br>The center of $C_1$ is $(3, 2)$ and its radius is $r_1 = \\sqrt{3^2 + 2^2 - (-12)} = \\sqrt{9 + 4 + 12} = 5$.<br><br>The area of $C_1$ is $\\pi r_1^2 = 25\\pi$.<br><br>Let the required circle be $C_2$. Since it is concentric with $C_1$, its center is also $(3, 2)$.<br><br>The area of $C_2$ is double the area of $C_1$, so the area of $C_2$ is $2 \\times 25\\pi = 50\\pi$.<br><br>Let $r_2$ be the radius of $C_2$. Then $\\pi r_2^2 = 50\\pi \\Rightarrow r_2^2 = 50$.<br><br>The equation of $C_2$ is $(x - 3)^2 + (y - 2)^2 = 50$.<br><br>Expanding this equation gives $x^2 - 6x + 9 + y^2 - 4y + 4 = 50$.<br><br>$x^2 + y^2 - 6x - 4y = 37$.<br><br>Answer: $x^2+y^2-6 x-4 y=37$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625e0279619d9d8a33f8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "The abscissae of two points $\\mathrm{A}$ and $\\mathrm{B}$ are the roots of the equation $x^2+2 a x-b^2=0$ and their ordinates are roots of the equation $y^2+2 \\mathrm{p} y-\\mathrm{q}^2=0$. Then the equation of the circle with $\\mathrm{AB}$ as diameter is given by", "image": null}, "options": [{"id": "GKOXi", "text": "$x^2+y^2-2 \\mathrm{a} x-2 \\mathrm{p} y+\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null, "isCorrect": false}, {"id": "l5n5v", "text": "$x^2+y^2-2 \\mathrm{a} x-2 \\mathrm{p} y-\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null, "isCorrect": false}, {"id": "WduNs", "text": "$x^2+y^2+2 \\mathrm{a} x+2 \\mathrm{p} y+\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null, "isCorrect": false}, {"id": "HBVG1", "text": "$x^2+y^2+2 \\mathrm{a} x+2 \\mathrm{p} y-\\left(\\mathrm{b}^2+\\mathrm{q}^2\\right)=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $\\mathrm{A} \\equiv\\left(x_1, y_1\\right)$ and $\\mathrm{B} \\equiv\\left(x_2, y_2\\right)$.\nAccording to the given condition,\n$x_1+x_2=-2 \\mathrm{a}, x_1 x_2=-\\mathrm{b}^2$\n$y_1+y_2=-2 \\mathrm{p}, y_1 y_2=-\\mathrm{q}^2$\nThe equation of the circle with $\\mathrm{A}\\left(x_1, y_1\\right)$ and $\\mathrm{B}\\left(x_2, y_2\\right)$ as the end points of diameter is\n$\\left(x-x_1\\right)\\left(x-x_2\\right)+\\left(y-y_1\\right)\\left(y-y_2\\right)=0$\n$\\Rightarrow x^2+y^2-x\\left(x_1+x_2\\right)-y\\left(y_1+y_2\\right)+x_1 x_2+y_1 y_2=0$\n$\\Rightarrow x^2+y^2+2 \\mathrm{a} x+2 \\mathrm{p} y-\\mathrm{b}^2-\\mathrm{q}^2=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c90279619d9d8a2f53", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "18. The sides of a rectangle are given by the equations $x=-2, x=4, y=-2$ and $y=5$\nThen the equation of the circle, whose centre is the point of intersection of the diagonals, lying within the rectangle and touching only two opposite sides, is", "image": null}, "options": [{"id": "Z2nU1", "text": "$x^2+y^2+2 x+3 y+9=0$", "image": null, "isCorrect": false}, {"id": "oANu5", "text": "$x^2+y^2-2 x+3 y+9=0$", "image": null, "isCorrect": false}, {"id": "wV2jf", "text": "$x^2+y^2+2 x-3 y-9=0$", "image": null, "isCorrect": false}, {"id": "CweZm", "text": "$x^2+y^2-2 x-3 y-9=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given equations of the sides are $x=-2$, $x=4, y=-2, y=5$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/pX5GEqfw6UGxyaqpcwQXTcXXLPUBBntZ2y44-9VSSRs.original.fullsize.png\"><br>\n$\\therefore \\quad$ According to the given condition, centre of the required circle is $P$.\n$\\therefore \\quad$ The co-ordinates of $\\mathrm{P}$ are $\\left(1, \\frac{3}{2}\\right)$.\nAs circle touches only 2 opposite sides, its radius is either 3.5 units or 3 units.\n$\\therefore \\quad$ Equation of the required circle is\n$\\begin{aligned}\n& x^2+y^2-2 x-3 y-\\frac{23}{4}=0 \\text { or } \\\\\n& x^2+y^2-2 x-3 y-9=0\n\\end{aligned}$\n$\\therefore \\quad$ Option (D) is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261810279619d9d8a2d19", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The equation of a circle, which passes through the centre of the circle $x^2+y^2+8 x+10 y-7=0$ and is concentric with the circle. $2 x^2+2 y^2-8 x-12 y-9=0$, is", "image": null}, "options": [{"id": "CYps5", "text": "$x^2+y^2-4 x+6 y-87=0$", "image": null, "isCorrect": false}, {"id": "BQ7KM", "text": "$x^2+y^2+4 x+6 y-87=0$", "image": null, "isCorrect": false}, {"id": "MEVjK", "text": "$x^2+y^2+4 x+6 y+87=0$", "image": null, "isCorrect": false}, {"id": "4HGYR", "text": "$x^2+y^2-4 x-6 y-87=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The required circle is concentric with the circle\n$$\n2 x^2+2 y^2-8 x-12 y-9=0\n$$\ni.e, centre is at $(2,3)$ and passes through the centre of the circle\n$$\nx^2+y^2+8 x+10 y-7=0\n$$\ni.e., through $(-4,-5)$\nHence, the required equation is\n$$\n\\begin{aligned}\n& (x-2)^2+(y-3)^2=(2+4)^2+(3+5)^2 \\\\\n& \\Rightarrow x^2+y^2-4 x-6 y-87=0\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261690279619d9d8a2c5a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "The parametric equations of the curve $x^2+y^2-a x-b y=0$ are", "image": null}, "options": [{"id": "DhDJa", "text": "$x=\\frac{a}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\cos \\theta, y=-\\frac{b}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\sin \\theta$", "image": null, "isCorrect": false}, {"id": "Y4FiZ", "text": "$x=-\\frac{a}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\cos \\theta, y=\\frac{b}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\sin \\theta$", "image": null, "isCorrect": false}, {"id": "1lL4c", "text": "$x=-\\frac{a}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\cos \\theta, y=-\\frac{b}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\sin \\theta$", "image": null, "isCorrect": false}, {"id": "psMYt", "text": "$x=\\frac{a}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\cos \\theta, y=\\frac{b}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\sin \\theta$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& x^2+y^2-a x-b y=0 \\\\\n& \\Rightarrow\\left(x-\\frac{a}{2}\\right)^2+\\left(y-\\frac{b}{2}\\right)^2=\\frac{a^2+b^2}{4}\n\\end{aligned}$\nwhich is circle having centre $\\equiv(h, k) \\equiv\\left(\\frac{a}{2}, \\frac{b}{2}\\right)$\n$\\text { and radius }=r=\\sqrt{\\frac{a^2+b^2}{4}}$\nIts parametric equation is\n$\\begin{aligned}\n& x=h+r \\cos \\theta=\\frac{a}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\cos \\theta \\\\\n& y=k+r \\sin \\theta=\\frac{b}{2}+\\sqrt{\\frac{a^2+b^2}{4}} \\sin \\theta\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261570279619d9d8a2bc5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "The parametric equations of the circle $x^2+y^2-6 x-2 y+9=0$ are", "image": null}, "options": [{"id": "ni3xQ", "text": "$x=1+\\cos \\theta, y=3+\\sin \\theta$", "image": null, "isCorrect": false}, {"id": "ny7Yj", "text": "$x=3+\\cos \\theta, y=1+\\sin \\theta$", "image": null, "isCorrect": true}, {"id": "fOhYj", "text": "$x=3+\\sin \\theta, y=1+\\cos \\theta$", "image": null, "isCorrect": false}, {"id": "G6gFW", "text": "$x=3+\\sin \\theta, y=1+\\cos \\theta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& x^2+y^2-6 x-2 y+9=0 \\Rightarrow(x-3)^2+(y-1)^2=1^2 \\Rightarrow x-3=\\cos \\theta \\quad \\text { and } \\\\\n& y-1=\\sin \\theta\n\\end{aligned}$\nHence, parametric equation is $x=3+\\cos \\theta$ and $y=1+\\sin \\theta$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261350279619d9d8a2aac", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "If the lines $2 x-3 y=5$ and $3 x-4 y=7$ are the diameters of a circle of area154sq $\\cdot$ units, then equation of the circle is $\\left(\\right.$ Take $\\left.\\pi=\\frac{22}{7}\\right)$", "image": null}, "options": [{"id": "DgoN0", "text": "$x^2+y^2-2 x+2 y-47=0$", "image": null, "isCorrect": true}, {"id": "CDGRA", "text": "$x^2+y^2-2 x+2 y-49=0$", "image": null, "isCorrect": false}, {"id": "xP3zT", "text": "$x^2+y^2-2 x-2 y-47=0$", "image": null, "isCorrect": false}, {"id": "K0DSK", "text": "$x^2+y^2-2 x-2 y-49=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Centre is point of intersection of $2 x-3 y=5$ and $3 x-4 y=7$\n$i \\cdot e \\cdot(1,-1)$\nand radius $r$ is such that $\\pi r^2=154 \\Rightarrow r=7$\nHence, the required equation is\n$\\begin{aligned} & (x-1)^2+(y+1)^2=7^2 \\\\ \\Rightarrow & x^2+y^2-2 x+2 y-47=0\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261240279619d9d8a2a27", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "If the line $3 x-4 y-7=0$ and $2 x-3 y-5=0$ pass through diameters of a circle of area $49 \\pi$ square units, then the equation of the circle is", "image": null}, "options": [{"id": "hYtBz", "text": "$x^2+y^2-2 x+2 y-47=0$", "image": null, "isCorrect": true}, {"id": "6rcWg", "text": "$x^2+y^2+2 x-2 y-51=0$", "image": null, "isCorrect": false}, {"id": "L6o8f", "text": "$x^2+y^2-2 x+2 y+51=0$", "image": null, "isCorrect": false}, {"id": "mwHWl", "text": "$x^2+y^2+2 x+2 y+47=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Centre of the circle is the point of intersection of the diameters\n$3 x-4 y-7=0$ and $2 x-3 y-5=0$\nwhich is $(1,-1)$ and $r=7$\n$\\begin{aligned} & (x-1)^2+(y+1)^2=7^2 \\\\ & \\Rightarrow x^2+y^2-2 x+2 y-47=0\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610e0279619d9d8a2976", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "The equation of circle passing through the points $(1,-2)$ and $(4,-3)$ and whose centre lies on the line $3 x+2 y=7$ is", "image": null}, "options": [{"id": "8sdU5", "text": "$x^2+y^2+6 x-2 y-5=0$", "image": null, "isCorrect": false}, {"id": "6UMU8", "text": "$x^2+y^2-6 x-2 y+5=0$", "image": null, "isCorrect": false}, {"id": "jmxPo", "text": "$x^2+y^2+6 x+2 y-5=0$", "image": null, "isCorrect": false}, {"id": "3IFcI", "text": "$x^2+y^2-6 x+2 y+5=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the equation of the required circle be $x^2+y^2+2 g x+2 f y-C=0$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/mGK7KtEo5Tgz3kq8sfL1kHXm0yQQbQ5g-Fq8spY_xU0.original.fullsize.png\">\nfrom (iii) + (iv)\n$9 g=-27 \\Rightarrow g=-3$\nthen $f=1$ and $c=5$\nSo, the required equation is $x^2+y^2-6 x+2 y+5=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e70279619d9d8a283b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "The equation of the circle whose centre lies on the line $x-4 y=1$ and which passes through the points $(3,7)$ and $(5,5)$ is", "image": null}, "options": [{"id": "oQcCR", "text": "$x^2+y^2+6 x-2 y+90=0$", "image": null, "isCorrect": false}, {"id": "5XJtk", "text": "$x^2+y^2+6 x+2 y+90=0$", "image": null, "isCorrect": false}, {"id": "HjPkI", "text": "$x^2+y^2+6 x+2 y-90=0$", "image": null, "isCorrect": true}, {"id": "CeRkk", "text": "$x^2+y^2-6 x+2 y-90=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the equation of the circle be $x^2+y^2+2 g x+2 f y+c=0$\n$\\because$ its centre lies on $\\mathrm{x}-4 \\mathrm{y}=1$\n$\\Rightarrow-\\mathrm{g}-4(-\\mathrm{f})=1$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/o4gNZzs3a5xYV1dh9MkHeVmZhOc80cmYDaB-f963wpk.original.fullsize.png\">\n$\\because$ it passes through $(3,7)$\n$\\Rightarrow 3^2+7^2+2 \\mathrm{~g} \\times 3+2 \\mathrm{f} \\times 7+\\mathrm{c}=0$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/0I9N9B0Kqp6Qx3Jq4RLgQxxYoD9aGUfUenWJcVv-pTo.original.fullsize.png\">\nAlso it passes through $(5,5)$\n$\\Rightarrow 5^2+5^2+2 g \\times 5+2 f \\times 5+c=0$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/E11iZ-6iiSt2_gJ45YnLSjn73T7lcqxn_16G3XLhprY.original.fullsize.png\">\nfrom (iii) - (ii)\n$4 g-4 f=8 \\Rightarrow g-f=2$\n$$\n\\begin{aligned}\n& \\Rightarrow \\mathrm{f}=1 \\\\\n& \\Rightarrow \\mathrm{g}=3 \\\\\n& \\Rightarrow \\mathrm{c}=-90\n\\end{aligned}\n$$\nSo, the equation of required circle is $x^2+y^2+6 x+2 y-90=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260780279619d9d8a24bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "The equation of a circle that passes through the origin and cut off intercept -2 and 3 on the $\\mathrm{X}$-axis and $\\mathrm{Y}$-axis respectively is", "image": null}, "options": [{"id": "1yLG6", "text": "$x^2+y^2-2 x+3 y=0$", "image": null, "isCorrect": false}, {"id": "0lUTh", "text": "$x^2+y^2+2 x+3 y=0$", "image": null, "isCorrect": false}, {"id": "G3W0e", "text": "$x^2+y^2+2 x-3 y=0$", "image": null, "isCorrect": true}, {"id": "O71qD", "text": "$x^2+y^2-2 x-3 y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The circle passes through the points $(0,0),(-2,0)$ and $(0,3)$.\nWe have $x^2+y^2+2 g x+2 f y+c=0$\n$$\n\\therefore \\mathrm{c}=0\n$$\n$\\ldots[\\because$ It passes through $(0,0)]$\n$$\n\\therefore \\mathrm{x}^2+\\mathrm{y}^2+2 \\mathrm{gx}+2 \\mathrm{fy}=0\n$$\n$$\n\\therefore(-2)^2+2 \\mathrm{~g}(-2)=0 \\quad \\Rightarrow 4-4 \\mathrm{~g}=0 \\quad \\Rightarrow \\mathrm{g}=1\n$$\n$$\n\\text { Also }(3)^2+2 \\mathrm{f}(3)=0 \\quad \\Rightarrow 6 \\mathrm{f}=-9 \\quad \\Rightarrow \\mathrm{f}=\\frac{-3}{2}\n$$\nThus centre $\\equiv\\left(-1, \\frac{3}{2}\\r
