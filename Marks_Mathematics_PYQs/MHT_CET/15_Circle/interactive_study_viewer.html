 r=5\n\\end{aligned}$\n$\\mathrm{y}=2 \\mathrm{x}$ is a chord of given circle.\nPoint of intersection of chord and circle is\n$\\mathrm{x}^2-10 \\mathrm{x}+25+4 \\mathrm{x}^2=25 \\quad \\Rightarrow \\mathrm{y}=0,4$\nThus end points of the chord are $(0,0)$ and $(2,4)$\nMid point of the chord $=\\left(\\frac{2}{2}, \\frac{4}{2}\\right)=(1,2)$ and\nlength of chord $=\\sqrt{(2)^2+(4)^2}=\\sqrt{20}$ is the diameter of required circle.\n\nHence equation of required circle is $(x-1)+(y-2)=\\left(\\frac{\\sqrt{20}}{2}\\right)^2$ i.e. $x^2+y^2-2 x-4 y=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc20279619d9d8a1f06", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "The radius of the circle passing through the points $(5,7),(2,-2)$ and $(-2,0)$ is", "image": null}, "options": [{"id": "SrN9K", "text": "2 units", "image": null, "isCorrect": false}, {"id": "Mrd2Y", "text": "5 units", "image": null, "isCorrect": true}, {"id": "42wMd", "text": "4 units", "image": null, "isCorrect": false}, {"id": "CnAlU", "text": "3 Units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\nLet $(\\mathrm{h}, \\mathrm{k})$ be the center of the circle which passes through $(5,7),(2,-2)$ and $(-2,0)$ $\\therefore(h-2)^{2}+(k+2)^{2}=(h+2)^{2}+k^{2}$\n$\\therefore-4 \\mathrm{~h}+4+4 \\mathrm{k}+4=4 \\mathrm{~h}+4 \\quad \\Rightarrow 8 \\mathrm{~h}-4 \\mathrm{k}=4 \\quad \\Rightarrow 2 \\mathrm{~h}-\\mathrm{k}=1$...(1)\nAlso $(\\mathrm{h}-5)^{2}+(\\mathrm{k}-7)^{2}=(\\mathrm{h}+2)^{2}+\\mathrm{k}^{2}$\n$\\therefore-10 \\mathrm{~h}+25-14 \\mathrm{k}+49=4 \\mathrm{~h}+4 \\Rightarrow 14 \\mathrm{~h}+14 \\mathrm{k}=70 \\Rightarrow \\mathrm{h}+\\mathrm{k}=5$...(2)\nSolving $(1)$ and $(2)$, we get, $\\mathrm{h}=2, \\mathrm{k}=3 \\Rightarrow$ centre $=(2,3)$\n$\\therefore$ Radius $=3-(-2)=5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 14, "topicId": "65a263390279619d9d8a3d2f", "title": "Coaxial systems of circles", "totalQuestions": 2, "questions": [{"_id": "6792143b0aee93fa0796df06", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The equation of the circle, concentric with the circle $2 x^2+2 y^2-6 x+8 y+1=0$ and double of its area is", "image": null}, "options": [{"id": "Qcwy2", "text": "$2 x^2+2 y^2-6 x+8 y+11=0$", "image": null, "isCorrect": false}, {"id": "vTWPe", "text": "$2 x^2+2 y^2-6 x+8 y-11=0$", "image": null, "isCorrect": false}, {"id": "CJAd5", "text": "$4 x^2+4 y^2-12 x+16 y-21=0$", "image": null, "isCorrect": true}, {"id": "ZTJF1", "text": "$4 x^2+4 y^2-12 x+16 y+21=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the circle is $2x^2 + 2y^2 - 6x + 8y + 1 = 0$.<br><br>Dividing by $2$, we get the standard form:<br><br>$x^2 + y^2 - 3x + 4y + \\dfrac{1}{2} = 0$<br><br>The center of this circle is $\\left(\\dfrac{3}{2}, -2\\right)$ and the square of its radius is:<br><br>$r_1^2 = g^2 + f^2 - c = \\left(-\\dfrac{3}{2}\\right)^2 + (2)^2 - \\dfrac{1}{2} = \\dfrac{9}{4} + 4 - \\dfrac{1}{2} = \\dfrac{23}{4}$<br><br>The new circle is concentric with the given circle, so its center is also $\\left(\\dfrac{3}{2}, -2\\right)$.<br><br>Since the area of the new circle is double the area of the given circle, its radius squared will be double:<br><br>$r_2^2 = 2r_1^2 = 2 \\times \\dfrac{23}{4} = \\dfrac{23}{2}$<br><br>The equation of the new circle is:<br><br>$\\left(x - \\dfrac{3}{2}\\right)^2 + (y + 2)^2 = r_2^2$<br><br>$x^2 - 3x + \\dfrac{9}{4} + y^2 + 4y + 4 = \\dfrac{23}{2}$<br><br>$x^2 + y^2 - 3x + 4y + \\dfrac{25}{4} - \\dfrac{46}{4} = 0$<br><br>$x^2 + y^2 - 3x + 4y - \\dfrac{21}{4} = 0$<br><br>Multiplying the entire equation by $4$, we get:<br><br>$4x^2 + 4y^2 - 12x + 16y - 21 = 0$<br><br>Answer: $4 x^2+4 y^2-12 x+16 y-21=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f180279619d9d8a19be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The equation of the circle concentric with the circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn></math> and touching", "image": null}, "options": [{"id": "MCT48", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "T9mpO", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>9</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "fmibY", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "9e1b5", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>9</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation a circle <br/><math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn></math> …. (i) <br/>Centre of circle (i) is (3, 2) <br/>Equation of circle concentric with circle (i) and touching the Y-axis is <br/><math><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow>< rrectValue": null, "solution": {"text": "The radius of the circle is the perpendicular distance from the centre $(3,4)$ to the line $5x + 12y - 11 = 0$.<br><br>$r = \\dfrac{|5(3) + 12(4) - 11|}{\\sqrt{5^2 + 12^2}}$<br><br>$r = \\dfrac{|15 + 48 - 11|}{\\sqrt{25 + 144}}$<br><br>$r = \\dfrac{52}{13} = 4$<br><br>The equation of the circle with centre $(3,4)$ and radius $4$ is given by:<br><br>$(x - 3)^2 + (y - 4)^2 = 4^2$<br><br>$x^2 - 6x + 9 + y^2 - 8y + 16 = 16$<br><br>$x^2 + y^2 - 6x - 8y + 9 = 0$<br><br>Answer: $x^2+y^2-6 x-8 y+9=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260af0279619d9d8a267a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "If a circle passes through the points $(0,0),(0, y)$, then the coordinates of its centre are", "image": null}, "options": [{"id": "gPl32", "text": "$\\left(\\frac{-x}{2}, \\frac{y}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "fD9DS", "text": "$\\left(\\frac{x}{2}, \\frac{y}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "B9nvF", "text": "$\\left(\\frac{-x}{2}, \\frac{-y}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "DLzHM", "text": "$\\left(\\frac{x}{2}, \\frac{-y}{2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $(h, k)$ be the centre of circle\n$$\n\\begin{aligned}\n& \\therefore \\sqrt{(\\mathrm{h}-0)^2+(\\mathrm{k}-0)^2}=\\     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
