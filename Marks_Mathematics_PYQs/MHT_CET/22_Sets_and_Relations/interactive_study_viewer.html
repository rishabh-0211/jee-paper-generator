/semantics></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5b0279619d9d8a13c3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The chances to fail in Physics are $20 \\%$ and the chances to fail in Mathematics are $10 \\% .$ What are the chances to fail in at least one subject?", "image": null}, "options": [{"id": "gxNLv", "text": "$28 \\%$", "image": null, "isCorrect": true}, {"id": "thl1S", "text": "$38 \\%$", "image": null, "isCorrect": false}, {"id": "mW8N0", "text": "$72 \\%$", "image": null, "isCorrect": false}, {"id": "9bgkl", "text": "$82 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $P(A)=\\frac{20}{100}=\\frac{1}{5}, P(B)=\\frac{10}{100}=\\frac{1}{10}$\nSince, event are independent and we have to\n$$\n\\text { find } \\begin{aligned}\nP(A&\\cup B)=P(A)+P(B)-P(A) \\cdot P(B) \\\\\n&=\\frac{1}{5}+\\frac{1}{10}-\\frac{1}{5} \\cdot \\frac{1}{10} \\\\\n&=\\frac{3}{10}-\\frac{1}{50}=\\frac{14}{50}=\\frac{14}{50} \\times 100=28 \\%\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263440279619d9d8a3da6", "title": "Questions on number of relations and sets", "totalQuestions": 8, "questions": [{"_id": "6792143b0aee93fa0796df03", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Let $S$ be a non-empty subset of $\\mathbb{R}$. Consider the following statement:\r\np : There is a rational number $x \\in \\mathrm{~S}$ such that $x\\gt0$.\r\nWhich of the following statements is the negation of the statement p?", "image": null}, "options": [{"id": "J8i4u", "text": "There is a rational number $x \\in \\mathrm{~S}$ such that $x \\leq 0$.", "image": null, "isCorrect": false}, {"id": "y4DJz", "text": "There is no rational number $x \\in \\mathrm{~S}$ such that $x \\leq 0$.", "image": null, "isCorrect": false}, {"id": "vnxsi", "text": "Every rational number $x \\in \\mathrm{~S}$ satisfies $x \\leq 0$.", "image": null, "isCorrect": true}, {"id": "fZEs3", "text": "$x \\in \\mathrm{~S}$ and $x \\leq 0 \\Rightarrow x$ is not a rational number.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement is $p : \\exists x \\in \\mathrm{S}$ such that $x$ is a rational number and $x > 0$.<br><br>The negation of an existential quantifier ($\\exists$) is the universal quantifier ($\\forall$). The negation of the inequality $x > 0$ is $x \\leq 0$.<br><br>Therefore, the negation of the statement $p$ is $\\sim p : \\forall x \\in \\mathrm{S}$, if $x$ is a rational number, then $x \\leq 0$.<br><br>This can be written in words as: Every rational number $x \\in \\mathrm{S}$ satisfies $x \\leq 0$.<br><br>Answer: Every rational number $x \\in \\mathrm{~S}$ satisfies $x \\leq 0$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214130aee93fa0796ddc9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "If $n(A)=4, n(B)=2$. Then the number of subsets of the set $\\mathrm{A} \\times \\mathrm{B}$ each having at least 3 elements are", "image": null}, "options": [{"id": "nrJrV", "text": "275", "image": null, "isCorrect": false}, {"id": "2TQ4H", "text": "510", "image": null, "isCorrect": false}, {"id": "fTjOY", "text": "219", "image": null, "isCorrect": true}, {"id": "6JcnY", "text": "256", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $n(A) = 4$ and $n(B) = 2$<br><br>The number of elements in $A \\times B$ is $n(A \\times B) = n(A) \\times n(B) = 4 \\times 2 = 8$<br><br>The total number of subsets of $A \\times B$ is $2^8 = 256$<br><br>The number of subsets having at least 3 elements is the total number of subsets minus the number of subsets having 0, 1, or 2 elements.<br><br>Number of subsets with at least 3 elements $= 2^8 - (^{8}C_{0} + ^{8}C_{1} + ^{8}C_{2})$<br><br>$^{8}C_{0} = 1$<br><br>$^{8}C_{1} = 8$<br><br>$^{8}C_{2} = \\dfrac{8 \\times 7}{2} = 28$<br><br>Number of subsets with at least 3 elements $= 256 - (1 + 8 + 28) = 256 - 37 = 219$<br><br>Answer: 219", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260450279619d9d8a2325", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Let $\\mathrm{A}=[\\mathrm{a}, \\mathrm{b}, \\mathrm{c}, \\mathrm{d}], \\mathrm{B}=[1,2,3]$. Relation $\\mathrm{R}_1, \\mathrm{R}_2, \\mathrm{R}_4$ are as follows:\n$$\n\\begin{aligned}\n& \\mathrm{R}_1=[(\\mathrm{a}, 1),(\\mathrm{b}, 2),(\\mathrm{c}, 1),(\\mathrm{d}, 2)] \\\\\n& \\mathrm{R}_2=[(\\mathrm{a}, 1),(\\mathrm{b}, 1),(\\mathrm{c}, 1),(\\mathrm{d}, 1)] \\\\\n& \\mathrm{R}_3=[(\\mathrm{a}, 2),(\\mathrm{b}, 3),(\\mathrm{c}, 2),(\\mathrm{d}, 2)] \\\\\n& \\mathrm{R}_4=[(\\mathrm{a}, 1),(\\mathrm{b}, 2),(\\mathrm{a}, 2),(\\mathrm{d}, 3)], \\text { then }\n\\end{aligned}\n$$", "image": null}, "options": [{"id": "Ehmx8", "text": "only $\\mathrm{R}_3$ and $\\mathrm{R}_4$ are not functions", "image": null, "isCorrect": false}, {"id": "TszmV", "text": "only $R_1$ and $R_2$ are not functions", "image": null, "isCorrect": false}, {"id": "7MYKv", "text": "only $\\mathrm{R}_3$ is not a function", "image": null, "isCorrect": false}, {"id": "hDSDR", "text": "only $\\mathrm{R}_4$ is not a function", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We find that in $R_4, f(a)=1$ and $f(a)=2$. Hence $R_4$ is not a function.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttemp     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
