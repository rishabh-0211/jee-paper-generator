    const data = {"index": 9, "chapterId": "61c0899d246631a8c96d9fe8", "chapter": "Quadratic Equation", "exam": "MHT CET", "subject": "Mathematics", "totalTopics": 5, "totalQuestions": 27, "downloadTime": "2026-10-08 20:42:39", "topics": [{"index": 1, "topicId": "65a2634e0279619d9d8a3e05", "title": "Relation between Roots and Coefficients", "totalQuestions": 20, "questions": [{"_id": "6abb88d715a9fc0fc8c14771", "type": "singleCorrect", "question": {"text": "If two sides of a triangle are the roots of the equation $x^2 - \\sqrt{10}\\,x + 2 = 0$ and angle between them is $60^\\circ$, then the third side is", "image": null}, "options": [{"id": "Csl0o", "label": "A", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "S0T6d", "label": "B", "text": "$2$", "isCorrect": true, "image": null}, {"id": "AiooG", "label": "C", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "C3YzN", "label": "D", "text": "$3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the two sides be $a$ and $b$.<br><br>Since $a$ and $b$ are the roots of the equation $x^2 - \\sqrt{10}x + 2 = 0$, we have:<br><br>$a + b = \\sqrt{10}$<br><br>$ab = 2$<br><br>Let the angle between the sides $a$ and $b$ be $C = 60^\\circ$.<br><br>Using the cosine rule for the third side $c$:<br><br>$c^2 = a^2 + b^2 - 2ab \\cos C$<br><br>$c^2 = (a + b)^2 - 2ab - 2ab \\cos 60^\\circ$<br><br>Substituting the values:<br><br>$c^2 = (\\sqrt{10})^2 - 2(2) - 2(2) \\left(\\dfrac{1}{2}\\right)$<br><br>$c^2 = 10 - 4 - 2$<br><br>$c^2 = 4$<br><br>Since $c > 0$, we get $c = 2$.<br><br>Answer: $2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3018c30a4553e1bdf20", "type": "singleCorrect", "question": {"text": "Let $a$ be an integer selected at random from the set $\\{0, 1, 2, 3, \\ldots, 9\\}$. The probability that the equation $ax^2 - ax + 1 = 0$ has real roots is ...", "image": null}, "options": [{"id": "KKtXX", "label": "A", "text": "$\\dfrac{3}{5}$", "isCorrect": true, "image": null}, {"id": "NPEv8", "label": "B", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "TviME", "label": "C", "text": "$\\dfrac{2}{5}$", "isCorrect": false, "image": null}, {"id": "Nxr5k", "label": "D", "text": "$\\dfrac{5}{9}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The total number of possible values for $a$ from the set $\\{0, 1, 2, 3, \\ldots, 9\\}$ is $10$.<br><br>For the equation $ax^2 - ax + 1 = 0$ to have real roots, we consider two cases:<br><br>If $a = 0$, the equation becomes $1 = 0$, which has no roots.<br><br>If $a \\neq 0$, the equation is a quadratic equation. For it to have real roots, its discriminant must be non-negative.<br><br>$D = (-a)^2 - 4(a)(1) \\geq 0$<br><br>$a^2 - 4a \\geq 0$<br><br>$a(a - 4) \\geq 0$<br><br>Since $a \\in \\{1, 2, 3, \\ldots, 9\\}$, the condition $a(a - 4) \\geq 0$ is satisfied when $a \\geq 4$.<br><br>The favorable values of $a$ are $4, 5, 6, 7, 8, 9$.<br><br>The number of favorable outcomes is $6$.<br><br>The required probability is $\\dfrac{6}{10} = \\dfrac{3}{5}$.<br><br>Answer: $\\dfrac{3}{5}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ff 6ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3478c30a4553e1be20b", "type": "singleCorrect", "question": {"text": "If $\\tan A$ and $\\tan B$ are the roots of the equation $5x^2 - 4x + 1 = 0$, then the value of $A + B$ is...", "image": null}, "options": [{"id": "kj85w", "label": "A", "text": "$\\dfrac{\\pi}{6}$", "isCorrect": false, "image": null}, {"id": "1FFVi", "label": "B", "text": "$\\dfrac{\\pi}{4}$", "isCorrect": true, "image": null}, {"id": "XemIK", "label": "C", "text": "$\\dfrac{\\pi}{3}$", "isCorrect": false, "image": null}, {"id": "ngmWl", "label": "D", "text": "$\\dfrac{\\pi}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given that $\\tan A$ and $\\tan B$ are the roots of the quadratic equation $5x^2 - 4x + 1 = 0$.<br><br>Sum of the roots:<br>$\\tan A + \\tan B = -\\dfrac{-4}{5} = \\dfrac{4}{5}$<br><br>Product of the roots:<br>$\\tan A \\tan B = \\dfrac{1}{5}$<br><br>Using the trigonometric identity for the tangent of a sum:<br>$\\tan(A + B) = \\dfrac{\\tan A + \\tan B}{1 - \\tan A \\tan B}$<br><br>Substituting the values of the sum and product of the roots:<br>$\\tan(A + B) = \\dfrac{\\dfrac{4}{5}}{1 - \\dfrac{1}{5}}$<br><br>$\\tan(A + B) = \\dfrac{\\dfrac{4}{5}}{\\dfrac{4}{5}} = 1$<br><br>Therefore, $A + B = \\dfrac{\\pi}{4}$<br><br>Answer: $\\dfrac{\\pi}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29f8c30a4553e1bdb0a", "type": "singleCorrect", "question": {"text": "The quadratic polynomial $p(x)$ has roots $1$ and $\\alpha$, while quadratic polynomial $q(x)$ has roots $1$ and $\\beta$. Let $\\alpha$ and $\\beta$ be the roots of $r(x) = p(x) + q(x)$. Then $\\lim_{x\\to\\infty}\\left[\\sqrt{p(x)} - \\sqrt{q(x)}\\right] =$", "image": null}, "options": [{"id": "PSpaz", "label": "A", "text": "$0$", "isCorrect": true, "image": null}, {"id": "Qw3g6", "label": "B", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "DfYiI", "label": "C", "text": "$1$", "isCorrect": false, "image": null}, {"id": "rXNcj", "label": "D", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the quadratic polynomials be $p(x) = a(x-1)(x-\\alpha)$ and $q(x) = b(x-1)(x-\\beta)$.<br><br>Given $r(x) = p(x) + q(x)$, we can evaluate $r(x)$ at $x = 1$:<br>$r(1) = p(1) + q(1) = 0 + 0 = 0$<br><br>Since the roots of $r(x)$ are given as $\\alpha$ and $\\beta$, and $r(1) = 0$, one of the roots must be $1$. Without loss of generality, let $\\alpha = 1$.<br><br>Then $p(x) = a(x-1)^2$.<br>Since the roots of $r(x)$ are $1$ and $\\beta$, we can write $r(x) = (a+b)(x-1)(x-\\beta)$.<br><br>Substitute $p(x)$, $q(x)$, and $r(x)$ into $r(x) = p(x) + q(x)$:<br>$(a+b)(x-1)(x-\\beta) = a(x-1)^2 + b(x-1)(x-\\beta)$<br><br>Dividing by $(x-1)$ for $x \\neq 1$:<br>$(a+b)(x-\\beta) = a(x-1) + b(x-\\beta)$<br>$ax - a\\beta + bx - b\\beta = ax - a + bx - b\\beta$<br>$-a\\beta = -a \\Rightarrow a(\\beta - 1) = 0$<br><br>Since $p(x)$ is a quadratic polynomial, its leading coefficient $a \\neq 0$, which gives $\\beta = 1$.<br>Thus, $\\alpha = \\beta = 1$.<br><br>This implies $p(x) = a(x-1)^2$ and $q(x) = b(x-1)^2$.<br><br>We are required to find:<br>$\\lim_{x\\to\\infty} \\left[\\sqrt{p(x)} - \\sqrt{q(x)}\\right] = \\lim_{x\\to\\infty} \\left[\\sqrt{a(x-1)^2} - \\sqrt{b(x-1)^2}\\right] = \\lim_{x\\to\\infty} (\\sqrt{a} - \\sqrt{b})(x-1)$<br><br>For this limit to exist and be a finite value (as per the given options), we must have $a = b$. <br>Therefore, $\\sqrt{a} - \\sqrt{b} = 0$, and the limit evaluates to $0$.<br><br>Answer: $0$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc3bf9280d7f9932c34", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "With usual notations in $\\triangle \\mathrm{ABC}$, if $\\angle \\mathrm{B}=\\frac{\\pi}{2}$, and $\\tan \\frac{\\mathrm{A}}{2}, \\tan \\frac{\\mathrm{C}}{2}$ are roots of equation $\\mathrm{p} x^2+\\mathrm{q} x+\\mathrm{r}=0$, $\\mathrm{p} \\neq 0$, then", "image": null}, "options": [{"id": "HTETz", "text": "$\\mathrm{p}+\\mathrm{q}=\\mathrm{r}$", "image": null, "isCorrect": true}, {"id": "BvQxv", "text": "$r+p=q$", "image": null, "isCorrect": false}, {"id": "uYCvi", "text": "$r=p$", "image": null, "isCorrect": false}, {"id": "jSWZL", "text": "$\\mathrm{p}=\\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\triangle \\mathrm{ABC}$, $\\mathrm{A} + \\mathrm{B} + \\mathrm{C} = \\pi$.<br><br>Given $\\angle \\mathrm{B} = \\dfrac{\\pi}{2}$, we have $\\mathrm{A} + \\mathrm{C} = \\dfrac{\\pi}{2}$.<br><br>Dividing by $2$, we get $\\dfrac{\\mathrm{A}}{2} + \\dfrac{\\mathrm{C}}{2} = \\dfrac{\\pi}{4}$.<br><br>Taking $\\tan$ on both sides:<br><br>$\\tan \\left( \\dfrac{\\mathrm{A}}{2} + \\dfrac{\\mathrm{C}}{2} \\right) = \\tan \\dfrac{\\pi}{4}$<br><br>$\\dfrac{\\tan \\dfrac{\\mathrm{A}}{2} + \\tan \\dfrac{\\mathrm{C}}{2}}{1 - \\tan \\dfrac{\\mathrm{A}}{2} \\tan \\dfrac{\\mathrm{C}}{2}} = 1$<br><br>Since $\\tan \\dfrac{\\mathrm{A}}{2}$ and $\\tan \\dfrac{\\mathrm{C}}{2}$ are roots of $\\mathrm{p} x^2 + \\mathrm{q} x + \\mathrm{r} = 0$, we have:<br><br>Sum of roots: $\\tan \\dfrac{\\mathrm{A}}{2} + \\tan \\dfrac{\\mathrm{C}}{2} = -\\dfrac{\\mathrm{q}}{\\mathrm{p}}$<br><br>Product of roots: $\\tan \\dfrac{\\mathrm{A}}{2} \\tan \\dfrac{\\mathrm{C}}{2} = \\dfrac{\\mathrm{r}}{\\mathrm{p}}$<br><br>Substituting these values in the formula:<br><br>$\\dfrac{-\\dfrac{\\mathrm{q}}{\\mathrm{p}}}{1 - \\dfrac{\\mathrm{r}}{\\mathrm{p}}} = 1$<br><br>$\\dfrac{-\\mathrm{q}}{\\mathrm{p} - \\mathrm{r}} = 1$<br><br>$-\\mathrm{q} = \\mathrm{p} - \\mathrm{r}$<br><br>$\\mathrm{p} + \\mathrm{q} = \\mathrm{r}$<br><br>Answer: $\\mathrm{p}+\\mathrm{q}=\\mathrm{r}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b41bf9280d7f993278c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)=2 x^3+\\mathrm{m} x^2-13 x+\\mathrm{n}$ and 2,3 are the roots of the equation $\\mathrm{f}(x)=0$ then the value of $4 \\mathrm{~m}+5 \\mathrm{n}$ is", "image": null}, "options": [{"id": "9yiAn", "text": "$30$", "image": null, "isCorrect": false}, {"id": "bgJi7", "text": "$100$", "image": null, "isCorrect": false}, {"id": "wKgP7", "text": "$130$", "image": null, "isCorrect": true}, {"id": "uBiyb", "text": "$150$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = 2x^3 + \\mathrm{m}x^2 - 13x + \\mathrm{n}$.<br><br>Since $2$ and $3$ are roots of the equation $\\mathrm{f}(x) = 0$, we have $\\mathrm{f}(2) = 0$ and $\\mathrm{f}(3) = 0$.<br><br>Substituting $x = 2$:<br>$\\mathrm{f}(2) = 2(2)^3 + \\mathrm{m}(2)^2 - 13(2) + \\mathrm{n} = 0$<br>$16 + 4\\mathrm{m} - 26 + \\mathrm{n} = 0$<br>$4\\mathrm{m} + \\mathrm{n} = 10$<br><br>Substituting $x = 3$:<br>$\\mathrm{f}(3) = 2(3)^3 + \\mathrm{m}(3)^2 - 13(3) + \\mathrm{n} = 0$<br>$54 + 9\\mathrm{m} - 39 + \\mathrm{n} = 0$<br>$9\\mathrm{m} + \\mathrm{n} = -15$<br><br>Subtracting the first equation from the second equation:<br>$(9\\mathrm{m} + \\mathrm{n}) - (4\\mathrm{m} + \\mathrm{n}) = -15 - 10$<br>$5\\mathrm{m} = -25$<br>$\\mathrm{m} = -5$<br><br>Substituting $\\mathrm{m} = -5$ into $4\\mathrm{m} + \\mathrm{n} = 10$:<br>$4(-5) + \\mathrm{n} = 10$<br>$-20 + \\mathrm{n} = 10$<br>$\\mathrm{n} = 30$<br><br>Now, finding the value of $4\\mathrm{m} + 5\\mathrm{n}$:<br>$4\\mathrm{m} + 5\\mathrm{n} = 4(-5) + 5(30)$<br>$= -20 + 150$<br>$= 130$<br><br>Answer: $130$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1ebf9280d7f9932667", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The value of ' $a$ ' so that the sum of squares of the roots of the equation $x^2-(a-2) x-a+1=0$ assumes the least value is", "image": null}, "options": [{"id": "HAqhS", "text": "$2$", "image": null, "isCorrect": false}, {"id": "q3jb0", "text": "$1$", "image": null, "isCorrect": true}, {"id": "hrWNu", "text": "$4$", "image": null, "isCorrect": false}, {"id": "c4Y0l", "text": "$0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the roots of the given quadratic equation be $\\alpha$ and $\\beta$.<br><br>From the equation $x^2 - (a-2)x - a + 1 = 0$, we have:<br>$\\alpha + \\beta = a - 2$<br>$\\alpha \\beta = -a + 1$<br><br>The sum of the squares of the roots is given by:<br>$\\alpha^2 + \\beta^2 = (\\alpha + \\beta)^2 - 2\\alpha \\beta$<br><br>Substituting the values of the sum and product of the roots:<br>$\\alpha^2 + \\beta^2 = (a - 2)^2 - 2(-a + 1)$<br>$\\alpha^2 + \\beta^2 = a^2 - 4a + 4 + 2a - 2$<br>$\\alpha^2 + \\beta^2 = a^2 - 2a + 2$<br><br>Completing the square for the expression in terms of $a$:<br>$\\alpha^2 + \\beta^2 = (a^2 - 2a + 1) + 1$<br>$\\alpha^2 + \\beta^2 = (a - 1)^2 + 1$<br><br>Since the square of a real number is always non-negative, $(a - 1)^2 \\ge 0$.<br>The expression assumes its least value when $(a - 1)^2 = 0$, which gives $a = 1$.<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b19bf9280d7f9932649", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If triangle $A B C$ is a right angled at $A$ and $\\tan \\frac{B}{2}, \\tan \\frac{C}{2}$ are roots of the equation $a x^2+b x+c=0, a \\neq 0$, then", "image": null}, "options": [{"id": "rDtWA", "text": "$a+c=b$", "image": null, "isCorrect": false}, {"id": "hDX39", "text": "$a+b=c$", "image": null, "isCorrect": true}, {"id": "5slkQ", "text": "$\\mathrm{b}+\\mathrm{c}=a$", "image": null, "isCorrect": false}, {"id": "FTI8Y", "text": "$a+c=2 b$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In triangle $ABC$, $A = 90^\\circ$.<br><br>$B + C = 180^\\circ - 90^\\circ = 90^\\circ$<br><br>$\\dfrac{B}{2} + \\dfrac{C}{2} = 45^\\circ$<br><br>Taking tangent on both sides:<br><br>$\\tan\\left(\\dfrac{B}{2} + \\dfrac{C}{2}\\right) = \\tan 45^\\circ$<br><br>$\\dfrac{\\tan \\dfrac{B}{2} + \\tan \\dfrac{C}{2}}{1 - \\tan \\dfrac{B}{2} \\tan \\dfrac{C}{2}} = 1$<br><br>Since $\\tan \\dfrac{B}{2}$ and $\\tan \\dfrac{C}{2}$ are roots of $ax^2 + bx + c = 0$, we have:<br><br>Sum of roots: $\\tan \\dfrac{B}{2} + \\tan \\dfrac{C}{2} = -\\dfrac{b}{a}$<br><br>Product of roots: $\\tan \\dfrac{B}{2} \\tan \\dfrac{C}{2} = \\dfrac{c}{a}$<br><br>Substituting these values in the formula:<br><br>$\\dfrac{-\\dfrac{b}{a}}{1 - \\dfrac{c}{a}} = 1$<br><br>$\\dfrac{-b}{a - c} = 1$<br><br>$-b = a - c$<br><br>$a + b = c$<br><br>Answer: $a+b=c$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214020aee93fa0796dd40", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "In a $\\triangle \\mathrm{PQR}, \\mathrm{m} \\angle \\mathrm{R}=\\frac{\\pi}{2}$. If $\\tan \\left(\\frac{\\mathrm{P}}{2}\\right)$ and $\\tan \\left(\\frac{\\mathrm{Q}}{2}\\right)$ are the roots of the equation $a x^2+b x+c=0(a \\neq 0)$, then", "image": null}, "options": [{"id": "xlDQ1", "text": "$\\mathrm{a}+\\mathrm{b}=\\mathrm{c}$", "image": null, "isCorrect": true}, {"id": "ZydoK", "text": "$\\mathrm{b}+\\mathrm{c}=\\mathrm{a}$", "image": null, "isCorrect": false}, {"id": "cbXB9", "text": "$\\quad \\mathrm{a}+\\mathrm{c}=\\mathrm{b}$", "image": null, "isCorrect": false}, {"id": "T5t1Q", "text": "$\\mathrm{b}=\\mathrm{c}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\triangle PQR$, $P + Q + R = \\pi$.<br><br>Since $R = \\dfrac{\\pi}{2}$, we have $P + Q = \\dfrac{\\pi}{2}$.<br><br>Dividing by $2$, we get $\\dfrac{P}{2} + \\dfrac{Q}{2} = \\dfrac{\\pi}{4}$.<br><br>Taking $\\tan$ on both sides:<br><br>$\\tan\\left(\\dfrac{P}{2} + \\dfrac{Q}{2}\\right) = \\tan\\left(\\dfrac{\\pi}{4}\\right)$<br><br>$\\dfrac{\\tan\\left(\\dfrac{P}{2}\\right) + \\tan\\left(\\dfrac{Q}{2}\\right)}{1 - \\tan\\left(\\dfrac{P}{2}\\right)\\tan\\left(\\dfrac{Q}{2}\\right)} = 1$<br><br>Since $\\tan\\left(\\dfrac{P}{2}\\right)$ and $\\tan\\left(\\dfrac{Q}{2}\\right)$ are roots of $ax^2 + bx + c = 0$, we have:<br><br>Sum of roots $= \\tan\\left(\\dfrac{P}{2}\\right) + \\tan\\left(\\dfrac{Q}{2}\\right) = -\\dfrac{b}{a}$<br><br>Product of roots $= \\tan\\left(\\dfrac{P}{2}\\right)\\tan\\left(\\dfrac{Q}{2}\\right) = \\dfrac{c}{a}$<br><br>Substituting these values in the formula:<br><br>$\\dfrac{-\\dfrac{b}{a}}{1 - \\dfrac{c}{a}} = 1$<br><br>$\\dfrac{-b}{a - c} = 1$<br><br>$-b = a - c$<br><br>$a + b = c$<br><br>Answer: $\\mathrm{a}+\\mathrm{b}=\\mathrm{c}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b20aee93fa0796dad2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Let $\\alpha, \\beta$ be the roots of the equation $x^2-p x+r=0$ and $\\dfrac{\\alpha}{2}, 2 \\beta$ be the roots of the equation $x^2-\\mathrm{q} x+\\mathrm{r}=0$. Then the value of r is", "image": null}, "options": [{"id": "OSucW", "text": "$\\dfrac{2}{9}(p-q)(2 q-p)$", "image": null, "isCorrect": false}, {"id": "VBVBN", "text": "$\\dfrac{2}{9}(q-p)(2 p-q)$", "image": null, "isCorrect": false}, {"id": "JZjqs", "text": "$\\dfrac{2}{9}(q-2 p)(2 q-p)$", "image": null, "isCorrect": false}, {"id": "F8keI", "text": "$\\dfrac{2}{9}(2 p-q)(2 q-p)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For the equation $x^2 - px + r = 0$, the sum and product of the roots are:<br>$\\alpha + \\beta = p$<br>$\\alpha \\beta = r$<br><br>For the equation $x^2 - qx + r = 0$, the sum and product of the roots are:<br>$\\dfrac{\\alpha}{2} + 2\\beta = q \\Rightarrow \\alpha + 4\\beta = 2q$<br>$\\left(\\dfrac{\\alpha}{2}\\right)(2\\beta) = r \\Rightarrow \\alpha \\beta = r$<br><br>We have a system of two linear equations in terms of $\\alpha$ and $\\beta$:<br>$\\alpha + \\beta = p$<br>$\\alpha + 4\\beta = 2q$<br><br>Subtracting the first equation from the second, we get:<br>$3\\beta = 2q - p \\Rightarrow \\beta = \\dfrac{2q - p}{3}$<br><br>Substituting the value of $\\beta$ into the first equation:<br>$\\alpha + \\dfrac{2q - p}{3} = p$<br>$\\alpha = p - \\dfrac{2q - p}{3} = \\dfrac{3p - 2q + p}{3} = \\dfrac{4p - 2q}{3} = \\dfrac{2(2p - q)}{3}$<br><br>Since $r = \\alpha \\beta$, we multiply the values of $\\alpha$ and $\\beta$:<br>$r = \\left[\\dfrac{2(2p - q)}{3}\\right] \\left[\\dfrac{2q - p}{3}\\right]$<br><br>$r = \\dfrac{2}{9}(2p - q)(2q - p)$<br><br>Answer: $\\dfrac{2}{9}(2 p-q)(2 q-p)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213690aee93fa0796d896", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Let $\\alpha$ and $\\beta$ be two real roots of the equation $(\\mathrm{k}+1) \\tan ^2 x-\\sqrt{2} \\lambda \\tan x=(1-\\mathrm{k})$ where $\\mathrm{k}(\\neq-1)$ and $\\lambda$ are real numbers. If $\\tan ^2(\\alpha+\\beta)=50$, then a value of $\\lambda$ is", "image": null}, "options": [{"id": "SUJSX", "text": "$5 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "EtqKi", "text": "$10 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "JBt4f", "text": "10", "image": null, "isCorrect": true}, {"id": "t363U", "text": "5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation can be rewritten as a quadratic in $\\tan x$:<br><br>$(k+1) \\tan^2 x - \\sqrt{2} \\lambda \\tan x + (k-1) = 0$<br><br>Since $\\alpha$ and $\\beta$ are the roots of the equation, $\\tan \\alpha$ and $\\tan \\beta$ are the roots of this quadratic equation.<br><br>Sum of roots: $\\tan \\alpha + \\tan \\beta = \\dfrac{\\sqrt{2} \\lambda}{k+1}$<br><br>Product of roots: $\\tan \\alpha \\tan \\beta = \\dfrac{k-1}{k+1}$<br><br>Using the trigonometric identity for $\\tan(\\alpha+\\beta)$:<br><br>$\\tan(\\alpha+\\beta) = \\dfrac{\\tan \\alpha + \\tan \\beta}{1 - \\tan \\alpha \\tan \\beta}$<br><br>Substituting the sum and product of the roots, we get:<br><br>$\\tan(\\alpha+\\beta) = \\dfrac{\\dfrac{\\sqrt{2} \\lambda}{k+1}}{1 - \\dfrac{k-1}{k+1}}$<br><br>$\\tan(\\alpha+\\beta) = \\dfrac{\\sqrt{2} \\lambda}{(k+1) - (k-1)} = \\dfrac{\\sqrt{2} \\lambda}{2} = \\dfrac{\\lambda}{\\sqrt{2}}$<br><br>It is given that $\\tan^2(\\alpha+\\beta) = 50$. Substituting the value obtained:<br><br>$\\left(\\dfrac{\\lambda}{\\sqrt{2}}\\right)^2 = 50$<br><br>$\\dfrac{\\lambda^2}{2} = 50$<br><br>$\\lambda^2 = 100$<br><br>$\\lambda = \\pm 10$<br><br>Thus, a possible value of $\\lambda$ is $10$.<br><br>Answer: 10", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213690aee93fa0796d893", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The equation $(\\operatorname{cosp}-1) x^2+(\\operatorname{cosp}) x+\\sin \\mathrm{p}=0$ in the variable $x$, has real roots. Then p can take any value in the interval", "image": null}, "options": [{"id": "5IfbD", "text": "$(0,2 \\pi)$", "image": null, "isCorrect": false}, {"id": "rlcG8", "text": "$(-\\pi, 0)$", "image": null, "isCorrect": false}, {"id": "eSoiK", "text": "$\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "b5TXq", "text": "$(0, \\pi)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For the given quadratic equation to have real roots, its discriminant must be greater than or equal to zero.<br><br>$D = b^2 - 4ac \\ge 0$<br><br>Substituting the coefficients from the equation $(\\cos p - 1) x^2 + (\\cos p) x + \\sin p = 0$:<br><br>$D = \\cos^2 p - 4(\\cos p - 1)\\sin p \\ge 0$<br><br>$D = \\cos^2 p + 4\\sin p(1 - \\cos p) \\ge 0$<br><br>We know that for all real $p$, $\\cos^2 p \\ge 0$ and $1 - \\cos p \\ge 0$.<br><br>For $D$ to be guaranteed non-negative, it is sufficient that $\\sin p > 0$, because then the term $4\\sin p(1 - \\cos p)$ will also be non-negative.<br><br>The condition $\\sin p > 0$ is satisfied when $p$ lies in the first or second quadrant, i.e., $p \\in (0, \\pi)$.<br><br>Thus, for any $p \\in (0, \\pi)$, $D > 0$ and the equation will always have real roots.<br><br>Answer: $(0, \\pi)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213660aee93fa0796d87d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The equation $(\\operatorname{cosp}-1) x^2+(\\operatorname{cosp}) x+\\operatorname{sinp}=0$ in the variable $x$, has real roots. Then p can take any value in the interval", "image": null}, "options": [{"id": "6Jmh8", "text": "$(0,2 \\pi)$", "image": null, "isCorrect": false}, {"id": "PohDC", "text": "$(-\\pi, 0)$", "image": null, "isCorrect": false}, {"id": "cvPcr", "text": "$\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "lD7CW", "text": "$(0, \\pi)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given equation is $(\\cos p - 1) x^2 + (\\cos p) x + \\sin p = 0$.<br><br>For the equation to have real roots, its discriminant must be greater than or equal to zero:<br><br>$D = b^2 - 4ac \\ge 0$<br><br>$D = \\cos^2 p - 4(\\cos p - 1)\\sin p \\ge 0$<br><br>$D = \\cos^2 p + 4\\sin p(1 - \\cos p) \\ge 0$<br><br>We know that for all real $p$, $\\cos^2 p \\ge 0$ and $1 - \\cos p \\ge 0$.<br><br>For $p \\in (0, \\pi)$, $\\sin p > 0$.<br><br>Therefore, $4\\sin p(1 - \\cos p) > 0$ for all $p \\in (0, \\pi)$.<br><br>Thus, $D > 0$ for all $p \\in (0, \\pi)$, which guarantees real roots.<br><br>Let us check the other intervals by taking specific values of $p$:<br><br>For $p = -\\dfrac{\\pi}{2}$ (which lies in $(-\\pi, 0)$ and $\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$):<br><br>$D = \\cos^2\\left(-\\dfrac{\\pi}{2}\\right) + 4\\sin\\left(-\\dfrac{\\pi}{2}\\right)\\left(1 - \\cos\\left(-\\dfrac{\\pi}{2}\\right)\\right) = 0 + 4(-1)(1 - 0) = -4 < 0$<br><br>For $p = \\dfrac{3\\pi}{2}$ (which lies in $(0, 2\\pi)$):<br><br>$D = \\cos^2\\left(\\dfrac{3\\pi}{2}\\right) + 4\\sin\\left(\\dfrac{3\\pi}{2}\\right)\\left(1 - \\cos\\left(\\dfrac{3\\pi}{2}\\right)\\right) = 0 + 4(-1)(1 - 0) = -4 < 0$<br><br>Since $D < 0$ for these values, the roots are not real. This eliminates the intervals $(0, 2\\pi)$, $(-\\pi, 0)$, and $\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$.<br><br>Hence, $p$ can take any value in the interval $(0, \\pi)$.<br><br>Answer: $(0, \\pi)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c90279619d9d8a2f58", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "In $\\triangle \\mathrm{ABC}$, with tustal notations, $\\mathrm{m} \\angle \\mathrm{C}=\\frac{\\pi}{2}$, if $\\tan \\left(\\frac{\\mathrm{A}}{2}\\right)$ and $\\tan \\left(\\frac{\\mathrm{B}}{2}\\right)$ are the roots of the equation. $\\mathrm{a}_1 x^2+\\mathrm{b}_1 x+\\mathrm{c}_1=0\\left(\\mathrm{a}_1 \\neq 0\\right)$, then", "image": null}, "options": [{"id": "s3hWb", "text": "$a_1+b_1=c_1$", "image": null, "isCorrect": true}, {"id": "1HNjM", "text": "$b_1+c_1=a_1$", "image": null, "isCorrect": false}, {"id": "2PaH3", "text": "$\\mathrm{a}_1+\\mathrm{c}_1-\\mathrm{b}_1$", "image": null, "isCorrect": false}, {"id": "MwVHm", "text": "$b_1=c_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} \n& \\text { In } \\triangle \\mathrm{ABC}, \\\\\n& \\angle \\mathrm{A}+\\angle \\mathrm{B}+\\angle \\mathrm{C}=180^{\\circ} \\\\\n\\therefore \\quad & \\angle \\mathrm{A}+\\frac{\\pi}{2}+\\angle \\mathrm{B}=180^{\\circ} \\\\\n\\therefore \\quad & \\angle \\mathrm{A}+\\angle \\mathrm{B}=\\frac{\\pi}{2} \\\\\n\\therefore \\quad & \\frac{\\angle \\mathrm{A}}{2}+\\frac{\\angle \\mathrm{B}}{2}=\\frac{\\pi}{4}\n\\end{array}$\n$\\tan \\left(\\frac{A}{2}\\right)$ and $\\tan \\left(\\frac{B}{2}\\right)$ are roots of equation $\\mathrm{a}_1 x^2+\\mathrm{b}_1 x+\\mathrm{c}_1=0 ... [Given]$\n$\\begin{aligned} & \\therefore \\quad \\text { Sum of roots }=\\frac{-b_1}{a_1} \\\\ & \\tan \\left(\\frac{A}{2}\\right)+\\tan \\left(\\frac{B}{2}\\right)=\\frac{-b_1}{a_1}\\end{aligned}$\nAlso, $\\tan \\left(\\frac{\\mathrm{A}}{2}\\right) \\cdot \\tan \\left(\\frac{\\mathrm{B}}{2}\\right)=\\frac{\\mathrm{c}_1}{\\mathrm{a}_1}$\nUsing $\\tan \\left(\\frac{\\mathrm{A}}{2}+\\frac{\\mathrm{B}}{2}\\right)=\\frac{\\tan \\frac{\\mathrm{A}}{2}+\\tan \\frac{\\mathrm{B}}{2}}{1-\\tan \\frac{\\mathrm{A}}{2} \\tan \\frac{\\mathrm{B}}{2}}$, we get\n$\\begin{aligned}\n& \\tan \\left(\\frac{\\pi}{4}\\right)=\\frac{\\frac{-b_1}{a_1}}{1-\\frac{c_1}{a_1}} \\\\\n& 1=\\frac{-b_1}{a_1-c_1} \\\\\n& a_1-c_1=-b_1 \\\\\n& a_1+b_1=c_1\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2601e0279619d9d8a21e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:0 )", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The Number of values of $C$ that satisfy the conclusion of Rolle's theorem in case of following function $\\mathrm{f}(x)=\\sin 2 \\pi x, x \\in[-1,1]$ is", "image": null}, "options": [{"id": "JdDpg", "text": "02", "image": null, "isCorrect": false}, {"id": "rZQVF", "text": "04", "image": null, "isCorrect": true}, {"id": "x60MD", "text": "03", "image": null, "isCorrect": false}, {"id": "EcoF7", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = \\sin 2\\pi x$ on $[-1, 1]$.<br><br>$f(x)$ is continuous on $[-1, 1]$ and differentiable on $(-1, 1)$.<br><br>$f(-1) = \\sin(-2\\pi) = 0$ and $f(1) = \\sin(2\\pi) = 0$, so $f(-1) = f(1)$.<br><br>By Rolle's theorem, there exists at least one $c \\in (-1, 1)$ such that $f'(c) = 0$.<br><br>$f'(x) = 2\\pi \\cos 2\\pi x$<br><br>$f'(c) = 2\\pi \\cos 2\\pi c = 0$<br><br>$\\cos 2\\pi c = 0$<br><br>$2\\pi c = \\pm \\dfrac{\\pi}{2}, \\pm \\dfrac{3\\pi}{2}, \\pm \\dfrac{5\\pi}{2}, \\dots$<br><br>$c = \\pm \\dfrac{1}{4}, \\pm \\dfrac{3}{4}, \\pm \\dfrac{5}{4}, \\dots$<br><br>Since $c \\in (-1, 1)$, the possible values of $c$ are $-\\dfrac{3}{4}, -\\dfrac{1}{4}, \\dfrac{1}{4}, \\dfrac{3}{4}$.<br><br>Thus, there are $4$ values of $c$ that satisfy Rolle's theorem.<br><br>Answer: 04", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f050279619d9d8a1922", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "short  "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $x=-2+\\sqrt{-3}$, then the value of $2 x^4+5 x^3+7 x^2-x+38$ is equal to", "image": null}, "options": [{"id": "lOxzG", "text": "$1$", "image": null, "isCorrect": false}, {"id": "PhiBW", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "nKYN9", "text": "$3$", "image": null, "isCorrect": true}, {"id": "iROHS", "text": "$5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $x = -2 + \\sqrt{-3}$<br><br>$x + 2 = \\sqrt{-3}$<br><br>Squaring both sides, we get:<br><br>$(x + 2)^2 = -3$<br><br>$x^2 + 4x + 4 = -3$<br><br>$x^2 + 4x + 7 = 0$<br><br>Now, we divide the given polynomial $2x^4 + 5x^3 + 7x^2 - x + 38$ by $x^2 + 4x + 7$:<br><br>$2x^4 + 5x^3 + 7x^2 - x + 38 = 2x^2(x^2 + 4x + 7) - 3x^3 - 7x^2 - x + 38$<br><br>$= 2x^2(x^2 + 4x + 7) - 3x(x^2 + 4x + 7) + 5x^2 + 20x + 38$<br><br>$= 2x^2(x^2 + 4x + 7) - 3x(x^2 + 4x + 7) + 5(x^2 + 4x + 7) + 3$<br><br>$= (2x^2 - 3x + 5)(x^2 + 4x + 7) + 3$<br><br>Substituting $x^2 + 4x + 7 = 0$ into the expression:<br><br>$= (2x^2 - 3x + 5)(0) + 3 = 3$<br><br>Answer: $3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262720279619d9d8a3495", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The equation $x^3+x-1=0$ has", "image": null}, "options": [{"id": "YIyVK", "text": "no real root.", "image": null, "isCorrect": false}, {"id": "WpJ54", "text": "exactly two real roots.", "image": null, "isCorrect": false}, {"id": "Aoh5M", "text": "exactly one real root.", "image": null, "isCorrect": true}, {"id": "GhaHy", "text": "more than two real roots.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{f}(x)=x^3+x-1$\nA root of $\\mathrm{f}(x)$ exists, if $\\mathrm{f}(x)=0$ for at least one value of $x$.\n$$\n\\begin{aligned}\n& \\mathrm{f}(0)=-1 < 0 \\\\\n& \\mathrm{f}(1)=1>0\n\\end{aligned}\n$$\n$\\therefore \\quad$ By intermediate value theorem, there has to be a point ' $c$ ' between 0 and 1 such that $\\mathrm{f}(x)=0$.\n$\\therefore \\quad$ The given equation has exactly one real root.\nAlternate Method:\nLet $\\mathrm{f}(x)=x^3+x-1$\n$$\n\\begin{array}{ll}\n\\therefore \\quad \\mathrm{f}^{\\prime}(x)=3 x^2+1 \\\\\n\\quad \\Rightarrow \\mathrm{f}^{\\prime}(x)>0 \\quad \\forall x \\in \\mathrm{R}\n\\end{array}\n$$\n$\\Rightarrow \\mathrm{f}(x)$ is an increasing function.\n$\\Rightarrow \\mathrm{f}(x)$ intersects $\\mathrm{X}$-axis at only one point.\n$\\therefore \\quad$ The given equation has exactly one real root.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "679216930aee93fa0796e19b", "title": "Range of Quadratic Function", "totalQuestions": 2, "questions": [{"_id": "6a44d33c8c30a4553e1be19a", "type": "singleCorrect", "question": {"text": "A ball is thrown in the air. Its height at any time $t$ is given by $h = 3 + 14t - 5t^2$, then the maximum height it can reach", "image": null}, "options": [{"id": "xom4O", "label": "A", "text": "$12.9$", "isCorrect": false, "image": null}, {"id": "AOnKo", "label": "B", "text": "$12.8$", "isCorrect": true, "image": null}, {"id": "FecNb", "label": "C", "text": "$12.7$", "isCorrect": false, "image": null}, {"id": "V0t4G", "label": "D", "text": "$12.6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $h = 3 + 14t - 5t^2$<br><br>Differentiating with respect to $t$:<br><br>$\\dfrac{dh}{dt} = 14 - 10t$<br><br>For maximum height, $\\dfrac{dh}{dt} = 0$:<br><br>$14 - 10t = 0 \\Rightarrow t = 1.4$<br><br>Substituting $t = 1.4$ in the equation for $h$:<br><br>$h_{max} = 3 + 14(1.4) - 5(1.4)^2$<br><br>$h_{max} = 3 + 19.6 - 5(1.96)$<br><br>$h_{max} = 22.6 - 9.8 = 12.8$<br><br>Answer: $12.8$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213550aee93fa0796d7f6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The number of roots of the equation, $(81)^{\\sin ^2 x}+(81)^{\\cos ^2 x}=30$ in the interval $[0, \\pi]$, is equal to", "image": null}, "options": [{"id": "nrtLz", "text": "4", "image": null, "isCorrect": true}, {"id": "OJGT0", "text": "8", "image": null, "isCorrect": false}, {"id": "S5uP2", "text": "3", "image": null, "isCorrect": false}, {"id": "cw9i3", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $(81)^{\\sin^2 x} + (81)^{\\cos^2 x} = 30$<br><br>Since $\\cos^2 x = 1 - \\sin^2 x$, the equation can be written as:<br><br>$(81)^{\\sin^2 x} + (81)^{1 - \\sin^2 x} = 30$<br><br>$(81)^{\\sin^2 x} + \\dfrac{81}{(81)^{\\sin^2 x}} = 30$<br><br>Let $y = (81)^{\\sin^2 x}$. Substituting this in the equation:<br><br>$y + \\dfrac{81}{y} = 30$<br><br>$y^2 - 30y + 81 = 0$<br><br>$(y - 27)(y - 3) = 0$<br><br>$y = 27$ or $y = 3$<br><br>Case 1: $y = 27$<br><br>$(81)^{\\sin^2 x} = 27$<br><br>$3^{4\\sin^2 x} = 3^3$<br><br>$4\\sin^2 x = 3 \\Rightarrow \\sin^2 x = \\dfrac{3}{4}$<br><br>Since $x \\in [0, \\pi]$, $\\sin x \\ge 0$, which gives $\\sin x = \\dfrac{\\sqrt{3}}{2}$<br><br>$x = \\dfrac{\\pi}{3}, \\dfrac{2\\pi}{3}$<br><br>Case 2: $y = 3$<br><br>$(81)^{\\sin^2 x} = 3$<br><br>$3^{4\\sin^2 x} = 3^1$<br><br>$4\\sin^2 x = 1 \\Rightarrow \\sin^2 x = \\dfrac{1}{4}$<br><br>Since $x \\in [0, \\pi]$, $\\sin x \\ge 0$, which gives $\\sin x = \\dfrac{1}{2}$<br><br>$x = \\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}$<br><br>The roots in the interval $[0, \\pi]$ are $\\dfrac{\\pi}{6}, \\dfrac{\\pi}{3}, \\dfrac{2\\pi}{3}, \\dfrac{5\\pi}{6}$.<br><br>The number of roots is $4$.<br><br>Answer: 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "679216930aee93fa0796e19c", "title": "Descartes Rule of Sign", "totalQuestions": 1, "questions": [{"_id": "679214140aee93fa0796ddd1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The equation $\\mathrm{e}^{\\sin x}-\\mathrm{e}^{-\\sin x}=4$ has _______ solutions.", "image": null}, "options": [{"id": "uEdnK", "text": "2", "image": null, "isCorrect": false}, {"id": "mWaOA", "text": "4", "image": null, "isCorrect": false}, {"id": "yZTeJ", "text": "3", "image": null, "isCorrect": false}, {"id": "gqrdH", "text": "no", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $y = \\mathrm{e}^{\\sin x}$. The given equation becomes $y - \\dfrac{1}{y} = 4$.<br><br>$y^2 - 4y - 1 = 0$<br><br>$y = \\dfrac{4 \\pm \\sqrt{16 - 4(1)(-1)}}{2} = 2 \\pm \\sqrt{5}$<br><br>Since $y = \\mathrm{e}^{\\sin x} > 0$, we must have $y = 2 + \\sqrt{5}$.<br><br>We know that $-1 \\le \\sin x \\le 1$, which implies $\\dfrac{1}{\\mathrm{e}} \\le \\mathrm{e}^{\\sin x} \\le \\mathrm{e}$.<br><br>The maximum possible value of $\\mathrm{e}^{\\sin x}$ is $\\mathrm{e} \\approx 2.718$.<br><br>However, $2 + \\sqrt{5} \\approx 4.236$, which is strictly greater than $\\mathrm{e}$.<br><br>Therefore, there is no real value of $x$ satisfying the equation, meaning it has no solution.<br><br>Answer: no", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
