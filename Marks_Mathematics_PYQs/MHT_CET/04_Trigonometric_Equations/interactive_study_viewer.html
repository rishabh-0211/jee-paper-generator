    const data = {"index": 4, "chapterId": "61c089c0d2438c7f08a20757", "chapter": "Trigonometric Equations", "exam": "MHT CET", "subject": "Mathematics", "totalTopics": 3, "totalQuestions": 122, "downloadTime": "2026-10-08 20:42:22", "topics": [{"index": 1, "topicId": "65a2634d0279619d9d8a3e00", "title": "Basic", "totalQuestions": 38, "questions": [{"_id": "6abb885715a9fc0fc8c142c2", "type": "singleCorrect", "question": {"text": "If $\\alpha$ and $\\beta$ are the solutions of $2\\cos\\theta = 1$ in the interval $[0, 2\\pi)$, then the solutions of $2\\cos\\theta + \\cos(\\alpha + \\beta) = 0$ in the interval $[0, 2\\pi)$ are...", "image": null}, "options": [{"id": "vj8N6", "label": "A", "text": "$\\dfrac{\\pi}{3},\\,\\dfrac{5\\pi}{3}$", "isCorrect": false, "image": null}, {"id": "ZDS0p", "label": "B", "text": "$\\dfrac{2\\pi}{3},\\,\\dfrac{4\\pi}{3}$", "isCorrect": true, "image": null}, {"id": "JMdio", "label": "C", "text": "$0,\\,\\pi$", "isCorrect": false, "image": null}, {"id": "oHIuh", "label": "D", "text": "$\\dfrac{\\pi}{2},\\,\\dfrac{3\\pi}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $2\\cos\\theta = 1$, we have $\\cos\\theta = \\dfrac{1}{2}$.<br><br>The solutions in the interval $[0, 2\\pi)$ are $\\alpha = \\dfrac{\\pi}{3}$ and $\\beta = \\dfrac{5\\pi}{3}$.<br><br>Calculating the sum $\\alpha + \\beta = \\dfrac{\\pi}{3} + \\dfrac{5\\pi}{3} = 2\\pi$.<br><br>The given equation is $2\\cos\\theta + \\cos(\\alpha + \\beta) = 0$.<br><br>Substituting the value of $\\alpha + \\beta$, we get $2\\cos\\theta + \\cos(2\\pi) = 0$.<br><br>Since $\\cos(2\\pi) = 1$, the equation becomes $2\\cos\\theta + 1 = 0$, which gives $\\cos\\theta = -\\dfrac{1}{2}$.<br><br>The solutions for $\\cos\\theta = -\\dfrac{1}{2}$ in the interval $[0, 2\\pi)$ are $\\theta = \\pi - \\dfrac{\\pi}{3} = \\dfrac{2\\pi}{3}$ and $\\theta = \\pi + \\dfrac{\\pi}{3} = \\dfrac{4\\pi}{3}$.<br><br>Answer: $\\dfrac{2\\pi}{3},\\,\\dfrac{4\\pi}{3}$", "image": nu dfrac{\\pi}{2}$.<br><br>Case 2: $2\\sin^2 x - 1 = 0 \\Rightarrow \\sin^2 x = \\dfrac{1}{2}$<br><br>$\\sin^2 x = \\sin^2 \\dfrac{\\pi}{4}$<br><br>$x = m\\pi \\pm \\dfrac{\\pi}{4}$, where $m \\in \\mathbb{Z}$<br><br>Comparing with $x = m\\pi \\pm \\beta$, we get $\\beta = \\dfrac{\\pi}{4}$.<br><br>The roots of the required quadratic equation are $\\alpha = \\dfrac{\\pi}{2}$ and $\\beta = \\dfrac{\\pi}{4}$.<br><br>Sum of roots: $S = \\dfrac{\\pi}{2} + \\dfrac{\\pi}{4} = \\dfrac{3\\pi}{4}$<br><br>Product of roots: $P = \\dfrac{\\pi}{2} \\times \\dfrac{\\pi}{4} = \\dfrac{\\pi^2}{8}$<br><br>The quadratic equation is $x^2 - Sx + P = 0$<br><br>$x^2 - \\dfrac{3\\pi}{4}x + \\dfrac{\\pi^2}{8} = 0$<br><br>$8x^2 - 6\\pi x + \\pi^2 = 0$<br><br>Answer: $8x^2 - 6\\pi x + \\pi^2 = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883715a9fc0fc8c14196", "type": "singleCorrect", "question": {"text": "If $\\sin x\\cos x=\\dfrac{1}{4}$, then the general solution of the equation is ...", "image": null}, "options": [{"id": "NZ8m5", "label": "A", "text": "$x=\\dfrac{n\\pi}{2}+(-1)^n\\dfrac{\\pi}{6}, n\\in Z$", "isCorrect": false, "image": null}, {"id": "thuQO", "label": "B", "text": "$x=\\dfrac{n\\pi}{2}+(-1)^n\\dfrac{\\pi}{12}, n\\in Z$", "isCorrect": true, "image": null}, {"id": "wIRPl", "label": "C", "text": "$x=\\dfrac{n\\pi}{4}+(-1)^n\\dfrac{\\pi}{12}, n\\in Z$", "isCorrect": false, "image": null}, {"id": "38Unl", "label": "D", "text": "$x=\\dfrac{n\\pi}{2}+(-1)^n\\dfrac{\\pi}{3}, n\\in Z$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\sin x \\cos x = \\dfrac{1}{4}$<br><br>Multiplying both sides by $2$, we get<br><br>$2 \\sin x \\cos x = \\dfrac{1}{2}$<br><br>$\\sin 2x = \\dfrac{1}{2}$<br><br>$\\sin 2x = \\sin \\dfrac{\\pi}{6}$<br><br>The general solution for $\\sin \\theta = \\sin \\alpha$ is $\\theta = n\\pi + (-1)^n \\alpha$, where $n \\in Z$.<br><br>$2x = n\\pi + (-1)^n \\dfrac{\\pi}{6}$<br><br>$x = \\dfrac{n\\pi}{2} + (-1)^n \\dfrac{\\pi}{12}, n \\in Z$<br><br>Answer: $x=\\dfrac{n\\pi}{2}+(-1)^n\\dfrac{\\pi}{12}, n\\in Z$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883515a9fc0fc8c14187", "type": "singleCorrect", "question": {"text": "If $\\tan\\theta+\\tan 2\\theta+\\tan 3\\theta=\\tan\\theta\\tan 2\\theta\\tan 3\\theta$, then the most general value of $\\theta$ for which all terms in the equation are defined is ...", "image": null}, "options": [{"id": "4Kl4A", "label": "A", "text": "$\\theta=\\dfrac{n\\pi}{6}, n\\in Z$", "isCorrect": false, "image": null}, {"id": "G9Xel", "label": "B", "text": "$\\theta=\\dfrac{n\\pi}{3}, n\\in Z$", "isCorrect": true, "image": null}, {"id": "BJFCt", "label": "C", "text": "$\\theta=\\dfrac{n\\pi}{2}, n\\in Z$", "isCorrect": false, "image": null}, {"id": "AXcpX", "label": "D", "text": "$\\theta=n\\pi\\pm\\dfrac{\\pi}{3}, n\\in Z$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation is $\\tan\\theta + \\tan 2\\theta + \\tan 3\\theta = \\tan\\theta \\tan 2\\theta \\tan 3\\theta$<br><br>Rearranging the terms, we get:<br><br>$\\tan\\theta + \\tan 2\\theta = -\\tan 3\\theta (1 - \\tan\\theta \\tan 2\\theta)$<br><br>For the terms in the equation to be defined, $\\tan 3\\theta$ must be defined, which means $3\\theta \\neq (2k+1)\\dfrac{\\pi}{2}$, so $\\theta \\neq (2k+1)\\dfrac{\\pi}{6}$.<br><br>If $1 - \\tan\\theta \\tan 2\\theta = 0$, then $\\tan\\theta \\left(\\dfrac{2\\tan\\theta}{1-\\tan^2\\theta}\\right) = 1 \\Rightarrow 3\\tan^2\\theta = 1 \\Rightarrow \\theta = k\\pi \\pm \\dfrac{\\pi}{6}$.<br><br>For these values, $3\\theta = 3k\\pi \\pm \\dfrac{\\pi}{2}$, making $\\tan 3\\theta$ undefined. Thus, $1 - \\tan\\theta \\tan 2\\theta \\neq 0$.<br><br>Dividing both sides by $1 - \\tan\\theta \\tan 2\\theta$, we get:<br><br>$\\dfrac{\\tan\\theta + \\tan 2\\theta}{1 - \\tan\\theta \\tan 2\\theta} = -\\tan 3\\theta$<br><br>$\\Rightarrow \\tan(\\theta + 2\\theta) = -\\tan 3\\theta$<br><br>$\\Rightarrow \\tan 3\\theta = -\\tan 3\\theta$<br><br>$\\Rightarrow 2\\tan 3\\theta = 0$<br><br>$\\Rightarrow \\tan 3\\theta = 0$<br><br>$\\Rightarrow 3\\theta = n\\pi$<br><br>$\\Rightarrow \\theta = \\dfrac{n\\pi}{3}, n \\in Z$<br><br>For $\\theta = \\dfrac{n\\pi}{3}$, the terms $\\tan\\theta$, $\\tan 2\\theta$, and $\\tan 3\\theta$ are all defined.<br><br>Answer: $\\theta=\\dfrac{n\\pi}{3}, n\\in Z$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3658c30a4553e1be345", "type": "singleCorrect", "question": {"text": "The general solution of $\\cos 4\\theta = \\cos 3\\theta$ is $\\theta = $.....", "image": null}, "options": [{"id": "SZSsg", "label": "A", "text": "$\\dfrac{2n\\pi}{7}, n \\in Z$", "isCorrect": true, "image": null}, {"id": "lDgza", "label": "B", "text": "$\\dfrac{2n\\pi}{5}, n \\in Z$", "isCorrect": false, "image": null}, {"id": "diWRa", "label": "C", "text": "$n\\pi, n \\in Z$", "isCorrect": false, "image": null}, {"id": "1Zzwj", "label": "D", "text": "$\\dfrac{4n\\pi}{3}, n \\in Z$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation is $\\cos 4\\theta = \\cos 3\\theta$.<br><br>Using the general solution for $\\cos x = \\cos y$, we have $x = 2n\\pi \\pm y$, where $n \\in Z$.<br><br>$4\\theta = 2n\\pi \\pm 3\\theta$<br><br>Taking the positive sign:<br><br>$4\\theta = 2n\\pi + 3\\theta \\Rightarrow \\theta = 2n\\pi$<br><br>Taking the negative sign:<br><br>$4\\theta = 2n\\pi - 3\\theta \\Rightarrow 7\\theta = 2n\\pi \\Rightarrow \\theta = \\dfrac{2n\\pi}{7}$<br><br>Since $\\theta = 2n\\pi$ is a subset of $\\theta = \\dfrac{2n\\pi}{7}$ (which occurs when $n$ is a multiple of $7$), the complete general solution is $\\theta = \\dfrac{2n\\pi}{7}, n \\in Z$.<br><br>Answer: $\\dfrac{2n\\pi}{7}, n \\in Z$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bb8c30a4553e1bdc3b", "type": "singleCorrect", "question": {"text": "The principal solutions of $\\text{cosec}(\\theta) = -2$ are...", "image": null}, "options": [{"id": "5zzGy", "label": "A", "text": "$\\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}$", "isCorrect": false, "image": null}, {"id": "RvnFx", "label": "B", "text": "$\\dfrac{5\\pi}{6}, \\dfrac{7\\pi}{6}$", "isCorrect": false, "image": null}, {"id": "xmxaV", "label": "C", "text": "$\\dfrac{7\\pi}{6}, \\dfrac{11\\pi}{6}$", "isCorrect": true, "image": null}, {"id": "Q2IDJ", "label": "D", "text": "$\\dfrac{\\pi}{6}, \\dfrac{11\\pi}{6}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\text{cosec}(\\theta) = -2$<br><br>$\\Rightarrow \\sin(\\theta) = -\\dfrac{1}{2}$<br><br>We know that $\\sin\\left(\\dfrac{\\pi}{6}\\right) = \\dfrac{1}{2}$.<br><br>Since $\\sin(\\theta)$ is negative in the third and fourth quadrants, the principal solutions in the interval $[0, 2\\pi)$ are given by:<br><br>$\\theta = \\pi + \\dfrac{\\pi}{6} = \\dfrac{7\\pi}{6}$<br><br>$\\theta = 2\\pi - \\dfrac{\\pi}{6} = \\dfrac{11\\pi}{6}$<br><br>The principal solutions are $\\dfrac{7\\pi}{6}$ and $\\dfrac{11\\pi}{6}$.<br><br>Answer: $\\dfrac{7\\pi}{6}, \\dfrac{11\\pi}{6}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c06bf9280d7f9932e99", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The general solutions of the equation $\\tan ^2 \\theta+\\sec 2 \\theta=1$ are", "image": null}, "options": [{"id": "Bi35n", "text": "$n \\pi, n \\pi \\pm \\frac{\\pi}{3}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": true}, {"id": "imx55", "text": "$n \\pi, n \\pi \\pm \\frac{\\pi}{4}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "xX6qH", "text": "$\\frac{n \\pi}{4}, \\frac{n \\pi}{4} \\pm \\frac{\\pi}{3}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "kF2Da", "text": "$\\mathrm{n} \\pi, \\mathrm{n} \\pi \\pm \\frac{\\pi}{6}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation: $\\tan^2 \\theta + \\sec 2\\theta = 1$<br><br>We know that $\\sec 2\\theta = \\dfrac{1}{\\cos 2\\theta} = \\dfrac{1 + \\tan^2 \\theta}{1 - \\tan^2 \\theta}$.<br><br>Substituting this into the given equation, we get:<br><br>$\\tan^2 \\theta + \\dfrac{1 + \\tan^2 \\theta}{1 - \\tan^2 \\theta} = 1$<br><br>Let $\\tan^2 \\theta = t$. The equation becomes:<br><br>$t + \\dfrac{1 + t}{1 - t} = 1$<br><br>Multiplying both sides by $1 - t$ (assuming $t \\neq 1$):<br><br>$t(1 - t) + 1 + t = 1 - t$<br><br>$t - t^2 + 1 + t = 1 - t$<br><br>$-t^2 + 2t + 1 = 1 - t$<br><br>$t^2 - 3t = 0$<br><br>$t(t - 3) = 0$<br><br>This gives $t = 0$ or $t = 3$.<br><br>Case 1: $t = 0$<br>$\\tan^2 \\theta = 0 \\Rightarrow \\tan \\theta = 0$<br>$\\theta = n\\pi$, where $n \\in \\mathbb{Z}$<br><br>Case 2: $t = 3$<br>$\\tan^2 \\theta = 3$<br>$\\tan^2 \\theta = (\\sqrt{3})^2 = \\tan^2 \\left(\\dfrac{\\pi}{3}\\right)$<br>$\\theta = n\\pi \\pm \\dfrac{\\pi}{3}$, where $n \\in \\mathbb{Z}$<br><br>Thus, the general solutions are $n\\pi$ and $n\\pi \\pm \\dfrac{\\pi}{3}$ for $n \\in \\mathbb{Z}$.<br><br>Answer: $n \\pi, n \\pi \\pm \\frac{\\pi}{3}, n \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd0bf9280d7f9932cac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\tan (\\pi \\cos \\theta)=\\cot (\\pi \\sin \\theta)$, then $\\sin \\left(\\frac{\\pi}{4}+\\theta\\right)=$", "image": null}, "options": [{"id": "gpO1w", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "4MT3r", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "pGALa", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "Xflvu", "text": "$\\frac{1}{2 \\sqrt{2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $\\tan (\\pi \\cos \\theta) = \\cot (\\pi \\sin \\theta)$<br><br>We can write this as:<br><br>$\\tan (\\pi \\cos \\theta) = \\tan \\left(\\dfrac{\\pi}{2} - \\pi \\sin \\theta\\right)$<br><br>Equating the angles for the general solution:<br><br>$\\pi \\cos \\theta = n\\pi + \\dfrac{\\pi}{2} - \\pi \\sin \\theta$<br><br>Dividing the entire equation by $\\pi$:<br><br>$\\cos \\theta = n + \\dfrac{1}{2} - \\sin \\theta$<br><br>$\\cos \\theta + \\sin \\theta = n + \\dfrac{1}{2}$<br><br>Multiplying both sides by $\\dfrac{1}{\\sqrt{2}}$:<br><br>$\\dfrac{1}{\\sqrt{2}} \\cos \\theta + \\dfrac{1}{\\sqrt{2}} \\sin \\theta = \\dfrac{1}{\\sqrt{2}} \\left(n + \\dfrac{1}{2}\\right)$<br><br>$\\sin \\dfrac{\\pi}{4} \\cos \\theta + \\cos \\dfrac{\\pi}{4} \\sin \\theta = \\dfrac{2n + 1}{2\\sqrt{2}}$<br><br>$\\sin \\left(\\dfrac{\\pi}{4} + \\theta\\right) = \\dfrac{2n + 1}{2\\sqrt{2}}$<br><br>Since the maximum value of $\\sin \\left(\\dfrac{\\pi}{4} + \\theta\\right)$ is $1$ and the minimum is $-1$, the valid integer values for $n$ are $0$ and $-1$.<br><br>For $n = 0$:<br><br>$\\sin \\left(\\dfrac{\\pi}{4} + \\theta\\right) = \\dfrac{1}{2\\sqrt{2}}$<br><br>For $n = -1$:<br><br>$\\sin \\left(\\dfrac{\\pi}{4} + \\theta\\right) = -\\dfrac{1}{2\\sqrt{2}}$<br><br>From the given options, $\\dfrac{1}{2\\sqrt{2}}$ is the correct choice.<br><br>Answer: $\\frac{1}{2 \\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc0bf9280d7f9932c1a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The common principal solution of the equations $\\sin \\theta=-\\frac{1}{2}$ and $\\tan \\theta=\\frac{1}{\\sqrt{3}}$ is", "image": null}, "options": [{"id": "xUBkL", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "Hyh29", "text": "$\\frac{5 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "cYmuS", "text": "$\\frac{7 \\pi}{6}$", "image": null, "isCorrect": true}, {"id": "HxD8c", "text": "$\\frac{11 \\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equations are $\\sin \\theta = -\\dfrac{1}{2}$ and $\\tan \\theta = \\dfrac{1}{\\sqrt{3}}$.<br><br>For $\\sin \\theta = -\\dfrac{1}{2}$, $\\theta$ lies in the third or fourth quadrant.<br>The principal solutions are $\\theta = \\pi + \\dfrac{\\pi}{6} = \\dfrac{7\\pi}{6}$ and $\\theta = 2\\pi - \\dfrac{\\pi}{6} = \\dfrac{11\\pi}{6}$.<br><br>For $\\tan \\theta = \\dfrac{1}{\\sqrt{3}}$, $\\theta$ lies in the first or third quadrant.<br>The principal solutions are $\\theta = \\dfrac{\\pi}{6}$ and $\\theta = \\pi + \\dfrac{\\pi}{6} = \\dfrac{7\\pi}{6}$.<br><br>The common principal solution satisfying both equations is $\\theta = \\dfrac{7\\pi}{6}$.<br><br>Answer: $\\frac{7 \\pi}{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871baebf9280d7f9932b8c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The principal solution of $(5+3 \\sin \\theta)(2 \\cos \\theta+1)=0$ are", "image": null}, "options": [{"id": "lpAti", "text": "$\\frac{-\\pi}{3}, \\frac{2 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "7hFFC", "text": "$\\frac{2 \\pi}{3}, \\frac{5 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "Yy6l3", "text": "$\\frac{2 \\pi}{3}, \\frac{4 \\pi}{3}$", "image": null, "isCorrect": true}, {"id": "00Wtt", "text": "$\\frac{2 \\pi}{3}, \\frac{7 \\pi}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $(5+3 \\sin \\theta)(2 \\cos \\theta+1)=0$.<br><br>This gives $5+3 \\sin \\theta = 0$ or $2 \\cos \\theta+1 = 0$.<br><br>For $5+3 \\sin \\theta = 0$, we get $\\sin \\theta = -\\dfrac{5}{3}$.<br><br>Since $-1 \\le \\sin \\theta \\le 1$, this equation has no real solution.<br><br>For $2 \\cos \\theta+1 = 0$, we get $\\cos \\theta = -\\dfrac{1}{2}$.<br><br>We know that $\\cos \\left( \\pi - \\dfrac{\\pi}{3} \\right) = -\\dfrac{1}{2}$ and $\\cos \\left( \\pi + \\dfrac{\\pi}{3} \\right) = -\\dfrac{1}{2}$.<br><br>Thus, $\\cos \\theta = \\cos \\dfrac{2\\pi}{3}$ and $\\cos \\theta = \\cos \\dfrac{4\\pi}{3}$.<br><br>The principal solutions are $\\theta = \\dfrac{2\\pi}{3}$ and $\\theta = \\dfrac{4\\pi}{3}$.<br><br>Answer: $\\frac{2 \\pi}{3}, \\frac{4 \\pi}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871badbf9280d7f9932b7f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\sec x+\\tan x=2, \\quad 0 < x < \\frac{\\pi}{2}$ then $\\sin \\frac{x}{4}$", "image": null}, "options": [{"id": "r3efW", "text": "$\\frac{1}{\\sqrt{10+3 \\sqrt{10}}}$", "image": null, "isCorrect": false}, {"id": "M7OG5", "text": "$\\frac{1}{\\sqrt{2(10+3 \\sqrt{10})}}$", "image": null, "isCorrect": true}, {"id": "17vTR", "text": "$\\frac{1}{\\sqrt{10-3 \\sqrt{10}}}$", "image": null, "isCorrect": false}, {"id": "XiruD", "text": "$\\frac{1}{2 \\sqrt{10-3 \\sqrt{10}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\sec x + \\tan x = 2$<br><br>We know that $\\sec^2 x - \\tan^2 x = 1$, which gives $(\\sec x - \\tan x)(\\sec x + \\tan x) = 1$<br><br>$\\sec x - \\tan x = \\dfrac{1}{2}$<br><br>Adding the two equations, we get:<br><br>$2 \\sec x = 2 + \\dfrac{1}{2} = \\dfrac{5}{2}$<br><br>$\\sec x = \\dfrac{5}{4} \\Rightarrow \\cos x = \\dfrac{4}{5}$<br><br>Using the half-angle formula $\\cos x = 2 \\cos^2 \\dfrac{x}{2} - 1$:<br><br>$2 \\cos^2 \\dfrac{x}{2} = 1 + \\dfrac{4}{5} = \\dfrac{9}{5}$<br><br>$\\cos^2 \\dfrac{x}{2} = \\dfrac{9}{10}$<br><br>Since $0 < x < \\dfrac{\\pi}{2}$, we have $0 < \\dfrac{x}{2} < \\dfrac{\\pi}{4}$, so $\\cos \\dfrac{x}{2} > 0$:<br><br>$\\cos \\dfrac{x}{2} = \\dfrac{3}{\\sqrt{10}}$<br><br>Using the half-angle formula again $\\cos \\dfrac{x}{2} = 1 - 2 \\sin^2 \\dfrac{x}{4}$:<br><br>$2 \\sin^2 \\dfrac{x}{4} = 1 - \\dfrac{3}{\\sqrt{10}} = \\dfrac{\\sqrt{10} - 3}{\\sqrt{10}}$<br><br>$\\sin^2 \\dfrac{x}{4} = \\dfrac{\\sqrt{10} - 3}{2 \\sqrt{10}} = \\dfrac{10 - 3 \\sqrt{10}}{20}$<br><br>Multiplying the numerator and the denominator by $10 + 3 \\sqrt{10}$:<br><br>$\\sin^2 \\dfrac{x}{4} = \\dfrac{(10 - 3 \\sqrt{10})(10 + 3 \\sqrt{10})}{20(10 + 3 \\sqrt{10})} = \\dfrac{100 - 90}{20(10 + 3 \\sqrt{10})} = \\dfrac{10}{20(10 + 3 \\sqrt{10})} = \\dfrac{1}{2(10 + 3 \\sqrt{10})}$<br><br>Since $0 < \\dfrac{x}{4} < \\dfrac{\\pi}{8}$, $\\sin \\dfrac{x}{4} > 0$:<br><br>$\\sin \\dfrac{x}{4} = \\dfrac{1}{\\sqrt{2(10 + 3 \\sqrt{10})}}$<br><br>Answer: $\\frac{1}{\\sqrt{2(10+3 \\sqrt{10})}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b61bf9280d7f99328ab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\sin \\left(\\frac{\\pi}{4} \\cot \\theta\\right)=\\cos \\left(\\frac{\\pi}{4} \\tan \\theta\\right)$, then the general solution of $\\theta$ is", "image": null}, "options": [{"id": "xr2sj", "text": "$\\mathrm{n} \\pi+\\frac{\\pi}{4}, \\quad \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": true}, {"id": "bHQIB", "text": "$\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{6}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "FHcmm", "text": "$2 n \\pi \\pm \\frac{\\pi}{4}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "jC9Bu", "text": "$2 \\mathrm{n} \\pi \\pm 3 \\frac{\\pi}{4}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\sin \\left(\\dfrac{\\pi}{4} \\cot \\theta\\right) = \\cos \\left(\\dfrac{\\pi}{4} \\tan \\theta\\right)$<br><br>We can write $\\cos \\left(\\dfrac{\\pi}{4} \\tan \\theta\\right)$ as $\\sin \\left(\\dfrac{\\pi}{2} - \\dfrac{\\pi}{4} \\tan \\theta\\right)$.<br><br>Equating the angles for the principal solution:<br><br>$\\dfrac{\\pi}{4} \\cot \\theta = \\dfrac{\\pi}{2} - \\dfrac{\\pi}{4} \\tan \\theta$<br><br>Dividing the entire equation by $\\dfrac{\\pi}{4}$:<br><br>$\\cot \\theta = 2 - \\tan \\theta$<br><br>$\\dfrac{1}{\\tan \\theta} + \\tan \\theta = 2$<br><br>$\\tan^2 \\theta - 2\\tan \\theta + 1 = 0$<br><br>$(\\tan \\theta - 1)^2 = 0$<br><br>$\\tan \\theta = 1$<br><br>$\\tan \\theta = \\tan \\dfrac{\\pi}{4}$<br><br>The general solution for $\\tan \\theta = \\tan \\alpha$ is $\\theta = n\\pi + \\alpha$.<br><br>$\\theta = n\\pi + \\dfrac{\\pi}{4}, n \\in \\mathbb{Z}$<br><br>Answer: $\\mathrm{n} \\pi+\\frac{\\pi}{4}, \\quad \\mathrm{n} \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b30bf9280d7f99326fa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\tan 3 \\theta=\\cot \\theta$ Then $\\theta=$", "image": null}, "options": [{"id": "WeSfv", "text": "$\\frac{(2 n+1) \\pi}{8}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": true}, {"id": "cRQwk", "text": "$\\frac{(2 n+1) \\pi}{4}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "kLX8u", "text": "$\\frac{(\\mathrm{n}+2) \\pi}{3}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "ZDxq4", "text": "$\\mathrm{n} \\pi, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\tan 3\\theta = \\cot \\theta$<br><br>$\\tan 3\\theta = \\tan\\left(\\dfrac{\\pi}{2} - \\theta\\right)$<br><br>Using the general solution for $\\tan x = \\tan y$, which is $x = n\\pi + y$ for $n \\in \\mathbb{Z}$:<br><br>$3\\theta = n\\pi + \\dfrac{\\pi}{2} - \\theta$<br><br>$4\\theta = n\\pi + \\dfrac{\\pi}{2}$<br><br>$4\\theta = \\dfrac{(2n+1)\\pi}{2}$<br><br>$\\theta = \\dfrac{(2n+1)\\pi}{8}, n \\in \\mathbb{Z}$<br><br>Answer: $\\frac{(2 n+1) \\pi}{8}, n \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214020aee93fa0796dd3f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "The general solution of $\\sin x+\\cos x=1$ is", "image": null}, "options": [{"id": "JP9g8", "text": "$x=2 \\mathrm{n} \\pi, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "7PJza", "text": "$\\quad x=2 \\mathrm{n} \\pi+\\frac{\\pi}{2}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "asRtj", "text": "$\\quad x=\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{4}-\\frac{\\pi}{4}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": true}, {"id": "H8fYt", "text": "not existing", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $\\sin x + \\cos x = 1$.<br><br>Dividing both sides by $\\sqrt{1^2 + 1^2} = \\sqrt{2}$, we get<br><br>$\\dfrac{1}{\\sqrt{2}} \\sin x + \\dfrac{1}{\\sqrt{2}} \\cos x = \\dfrac{1}{\\sqrt{2}}$<br><br>$\\sin x \\cos \\dfrac{\\pi}{4} + \\cos x \\sin \\dfrac{\\pi}{4} = \\dfrac{1}{\\sqrt{2}}$<br><br>$\\sin\\left(x + \\dfrac{\\pi}{4}\\right) = \\sin \\dfrac{\\pi}{4}$<br><br>Using the general solution for $\\sin \\theta = \\sin \\alpha$, which is $\\theta = n\\pi + (-1)^n \\alpha$ for $n \\in \\mathbb{Z}$, we get<br><br>$x + \\dfrac{\\pi}{4} = n\\pi + (-1)^n \\dfrac{\\pi}{4}$<br><br>$x = n\\pi + (-1)^n \\dfrac{\\pi}{4} - \\dfrac{\\pi}{4}$, where $n \\in \\mathbb{Z}$.<br><br>Answer: $\\quad x=\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{4}-\\frac{\\pi}{4}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c60aee93fa0796db6a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "If for certain $x, 3 \\cos x \\neq 2 \\sin x$, then the general solution of, $\\sin ^2 x-\\cos 2 x=2-\\sin 2 x$, is", "image": null}, "options": [{"id": "jMJni", "text": "$(2 \\mathrm{n}+1) \\dfrac{\\pi}{2}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": true}, {"id": "XlR6z", "text": "$\\quad(2 \\mathrm{n}+1) \\dfrac{\\pi}{4}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "yuSlO", "text": "$\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\dfrac{\\pi}{3}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "x4ERz", "text": "$\\dfrac{n \\pi}{2}+1, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation: $\\sin^2 x - \\cos 2x = 2 - \\sin 2x$<br><br>Using the identities $\\cos 2x = \\cos^2 x - \\sin^2 x$ and $\\sin 2x = 2\\sin x \\cos x$:<br><br>$\\sin^2 x - (\\cos^2 x - \\sin^2 x) = 2 - 2\\sin x \\cos x$<br><br>$2\\sin^2 x - \\cos^2 x = 2(\\sin^2 x + \\cos^2 x) - 2\\sin x \\cos x$<br><br>$2\\sin^2 x - \\cos^2 x = 2\\sin^2 x + 2\\cos^2 x - 2\\sin x \\cos x$<br><br>$3\\cos^2 x - 2\\sin x \\cos x = 0$<br><br>$\\cos x (3\\cos x - 2\\sin x) = 0$<br><br>Since it is given that $3\\cos x \\neq 2\\sin x$, we have $3\\cos x - 2\\sin x \\neq 0$.<br><br>Therefore, $\\cos x = 0$.<br><br>The general solution is $x = (2n+1)\\dfrac{\\pi}{2}$, where $n \\in \\mathbb{Z}$.<br><br>Answer: $(2 \\mathrm{n}+1) \\dfrac{\\pi}{2}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b70aee93fa0796daf4", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The smallest positive value of $x$ in degrees satisfying the equation $\\tan \\left(x+100^{\\circ}\\right)=\\tan \\left(x+50^{\\circ}\\right) \\tan (x) \\tan \\left(x-50^{\\circ}\\right)$ is", "image": null}, "options": [{"id": "5QxKm", "text": "$30^{\\circ}$", "image": null, "isCorrect": true}, {"id": "N0Jrg", "text": "$15^{\\circ}$", "image": null, "isCorrect": false}, {"id": "Xw7wG", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "sPDTe", "text": "$60^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation:<br><br>$\\tan(x+100^{\\circ}) = \\tan(x+50^{\\circ}) \\tan x \\tan(x-50^{\\circ})$<br><br>Since $\\tan(x+100^{\\circ}) = \\tan(x+100^{\\circ}-180^{\\circ}) = \\tan(x-80^{\\circ})$, we can rewrite the equation as:<br><br>$\\dfrac{\\tan(x-80^{\\circ})}{\\tan x} = \\tan(x+50^{\\circ}) \\tan(x-50^{\\circ})$<br><br>Converting to sine and cosine:<br><br>$\\dfrac{\\sin(x-80^{\\circ}) \\cos x}{\\cos(x-80^{\\circ}) \\sin x} = \\dfrac{\\sin(x+50^{\\circ}) \\sin(x-50^{\\circ})}{\\cos(x+50^{\\circ}) \\cos(x-50^{\\circ})}$<br><br>Multiplying the numerator and denominator of the LHS by $2$ and using the product-to-sum formulas $2\\sin A \\cos B = \\sin(A+B) + \\sin(A-B)$, $\\sin(A+B)\\sin(A-B) = \\dfrac{\\cos 2B - \\cos 2A}{2}$, and $\\cos(A+B)\\cos(A-B) = \\dfrac{\\cos 2B + \\cos 2A}{2}$:<br><br>$\\dfrac{\\sin(2x-80^{\\circ}) - \\sin 80^{\\circ}}{\\sin(2x-80^{\\circ}) + \\sin 80^{\\circ}} = \\dfrac{\\cos 100^{\\circ} - \\cos 2x}{\\cos 100^{\\circ} + \\cos 2x}$<br><br>Applying componendo and dividendo $\\left(\\text{if } \\dfrac{a-b}{a+b} = \\dfrac{c-d}{c+d}, \\text{ then } \\dfrac{a}{b} = \\dfrac{c}{d}\\right)$:<br><br>$\\dfrac{\\sin(2x-80^{\\circ})}{-\\sin 80^{\\circ}} = \\dfrac{\\cos 100^{\\circ}}{-\\cos 2x}$<br><br>$\\sin(2x-80^{\\circ}) \\cos 2x = \\sin 80^{\\circ} \\cos 100^{\\circ}$<br><br>Multiplying both sides by $2$:<br><br>$2 \\sin(2x-80^{\\circ}) \\cos 2x = 2 \\sin 80^{\\circ} \\cos 100^{\\circ}$<br><br>$\\sin(4x-80^{\\circ}) + \\sin(-80^{\\circ}) = \\sin(180^{\\circ}) + \\sin(-20^{\\circ})$<br><br>$\\sin(4x-80^{\\circ}) - \\sin 80^{\\circ} = -\\sin 20^{\\circ}$<br><br>$\\sin(4x-80^{\\circ}) = \\sin 80^{\\circ} - \\sin 20^{\\circ}$<br><br>Using the identity $\\sin C - \\sin D = 2 \\cos\\left(\\dfrac{C+D}{2}\\right) \\sin\\left(\\dfrac{C-D}{2}\\right)$:<br><br>$\\sin 80^{\\circ} - \\sin 20^{\\circ} = 2 \\cos 50^{\\circ} \\sin 30^{\\circ} = 2 \\cos 50^{\\circ} \\left(\\dfrac{1}{2}\\right) = \\cos 50^{\\circ} = \\sin 40^{\\circ}$<br><br>Thus, we have:<br><br>$\\sin(4x-80^{\\circ}) = \\sin 40^{\\circ}$<br><br>The general solution is $4x - 80^{\\circ} = n(180^{\\circ}) + (-1)^n 40^{\\circ}$.<br><br>For the smallest positive value of $x$, we take $n=0$:<br><br>$4x - 80^{\\circ} = 40^{\\circ}$<br><br>$4x = 120^{\\circ} \\Rightarrow x = 30^{\\circ}$<br><br>Answer: $30^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b50aee93fa0796dae7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The number of integral values of $k$, for which the equation $7 \\cos x+5 \\sin x=2 \\mathrm{k}+1$ has a solution, is", "image": null}, "options": [{"id": "TUWoT", "text": "4", "image": null, "isCorrect": false}, {"id": "eOTuN", "text": "8", "image": null, "isCorrect": true}, {"id": "qYJ22", "text": "10", "image": null, "isCorrect": false}, {"id": "vq8ur", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is $7 \\cos x + 5 \\sin x = 2k + 1$.<br><br>We know that the range of the expression $a \\cos x + b \\sin x$ is $[-\\sqrt{a^2 + b^2}, \\sqrt{a^2 + b^2}]$.<br><br>For $7 \\cos x + 5 \\sin x$, the range is $[-\\sqrt{7^2 + 5^2}, \\sqrt{7^2 + 5^2}] = [-\\sqrt{74}, \\sqrt{74}]$.<br><br>For the equation to have a solution, $2k + 1$ must lie within this range:<br><br>$-\\sqrt{74} \\le 2k + 1 \\le \\sqrt{74}$<br><br>Since $\\sqrt{74} \\approx 8.6$, we can write:<br><br>$-8.6 \\le 2k + 1 \\le 8.6$<br><br>Subtracting $1$ from all sides:<br><br>$-9.6 \\le 2k \\le 7.6$<br><br>Dividing by $2$:<br><br>$-4.8 \\le k \\le 3.8$<br><br>Since $k$ must be an integer, the possible values for $k$ are $-4, -3, -2, -1, 0, 1, 2, 3$.<br><br>The number of integral values of $k$ is $8$.<br><br>Answer: 8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a40aee93fa0796da64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "The general solution of $\\sin x-3 \\sin 2 x+\\sin 3 x=\\cos x-3 \\cos 2 x+\\cos 3 x$ is", "image": null}, "options": [{"id": "zgiRO", "text": "$x=\\mathrm{n} \\pi+\\dfrac{\\pi}{4}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "mHqRw", "text": "$x=2 \\mathrm{n} \\pi+\\dfrac{\\pi}{4}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "LCLcM", "text": "$x=\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\dfrac{\\pi}{4}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "D9Cbd", "text": "$x=\\dfrac{\\mathrm{n} \\pi}{2}+\\dfrac{\\pi}{8}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equation:<br><br>$\\sin x - 3 \\sin 2x + \\sin 3x = \\cos x - 3 \\cos 2x + \\cos 3x$<br><br>Grouping the terms:<br><br>$(\\sin 3x + \\sin x) - 3 \\sin 2x = (\\cos 3x + \\cos x) - 3 \\cos 2x$<br><br>Using the sum-to-product formulas $\\sin C + \\sin D = 2 \\sin \\dfrac{C+D}{2} \\cos \\dfrac{C-D}{2}$ and $\\cos C + \\cos D = 2 \\cos \\dfrac{C+D}{2} \\cos \\dfrac{C-D}{2}$:<br><br>$2 \\sin 2x \\cos x - 3 \\sin 2x = 2 \\cos 2x \\cos x - 3 \\cos 2x$<br><br>Factoring out $\\sin 2x$ and $\\cos 2x$:<br><br>$\\sin 2x (2 \\cos x - 3) = \\cos 2x (2 \\cos x - 3)$<br><br>Since $\\cos x \\le 1$, $2 \\cos x - 3 \\neq 0$ for any real $x$. Dividing both sides by $2 \\cos x - 3$:<br><br>$\\sin 2x = \\cos 2x$<br><br>$\\tan 2x = 1$<br><br>The general solution is:<br><br>$2x = n\\pi + \\dfrac{\\pi}{4}, n \\in \\mathbb{Z}$<br><br>$x = \\dfrac{n\\pi}{2} + \\dfrac{\\pi}{8}, n \\in \\mathbb{Z}$<br><br>Answer: $x=\\dfrac{\\mathrm{n} \\pi}{2}+\\dfrac{\\pi}{8}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138c0aee93fa0796d9a3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The Solution set of the equation $\\sin ^2 \\theta-\\cos \\theta=\\dfrac{1}{4}$ in the interval $[0,2 \\pi]$ is", "image": null}, "options": [{"id": "HaYo7", "text": "$\\left\\{\\dfrac{\\pi}{6}, \\dfrac{5 \\pi}{6}\\right\\}$", "image": null, "isCorrect": false}, {"id": "2iYMz", "text": "$\\left\\{\\dfrac{\\pi}{3}, \\dfrac{5 \\pi}{3}\\right\\}$", "image": null, "isCorrect": true}, {"id": "a7pEQ", "text": "$\\left\\{\\dfrac{\\pi}{3}, \\dfrac{2 \\pi}{3}\\right\\}$", "image": null, "isCorrect": false}, {"id": "Ts00j", "text": "$\\left\\{\\dfrac{2 \\pi}{3}, \\dfrac{4 \\pi}{3}\\right\\}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $\\sin^2 \\theta - \\cos \\theta = \\dfrac{1}{4}$<br><br>Using the identity $\\sin^2 \\theta = 1 - \\cos^2 \\theta$, we get:<br><br>$1 - \\cos^2 \\theta - \\cos \\theta = \\dfrac{1}{4}$<br><br>$4 - 4\\cos^2 \\theta - 4\\cos \\theta = 1$<br><br>$4\\cos^2 \\theta + 4\\cos \\theta - 3 = 0$<br><br>$4\\cos^2 \\theta + 6\\cos \\theta - 2\\cos \\theta - 3 = 0$<br><br>$2\\cos \\theta(2\\cos \\theta + 3) - 1(2\\cos \\theta + 3) = 0$<br><br>$(2\\cos \\theta - 1)(2\\cos \\theta + 3) = 0$<br><br>$\\cos \\theta = \\dfrac{1}{2}$ or $\\cos \\theta = -\\dfrac{3}{2}$<br><br>Since $-1 \\le \\cos \\theta \\le 1$, the value $\\cos \\theta = -\\dfrac{3}{2}$ is rejected.<br><br>$\\cos \\theta = \\dfrac{1}{2}$<br><br>In the interval $[0, 2\\pi]$, the solutions are $\\theta = \\dfrac{\\pi}{3}$ and $\\theta = 2\\pi - \\dfrac{\\pi}{3} = \\dfrac{5\\pi}{3}$.<br><br>The solution set is $\\left\\{\\dfrac{\\pi}{3}, \\dfrac{5\\pi}{3}\\right\\}$.<br><br>Answer: $\\left\\{\\dfrac{\\pi}{3}, \\dfrac{5 \\pi}{3}\\right\\}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213570aee93fa0796d80a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "If $\\theta$ and $\\alpha$ are not odd multiples of $\\dfrac{\\pi}{2}$ then $\\tan \\theta=\\tan \\alpha$ implies general solution is", "image": null}, "options": [{"id": "dbCXY", "text": "$\\quad \\theta=\\alpha+\\dfrac{\\mathrm{n} \\pi}{2}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "00sAI", "text": "$\\quad \\theta=\\alpha+\\dfrac{3 \\mathrm{n} \\pi}{2}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "VDRxM", "text": "$\\quad \\theta=\\mathrm{n} \\pi+\\alpha, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": true}, {"id": "xGR3n", "text": "$\\theta=\\dfrac{n \\pi}{4}+\\alpha, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $\\tan \\theta = \\tan \\alpha$.<br><br>$\\Rightarrow \\dfrac{\\sin \\theta}{\\cos \\theta} = \\dfrac{\\sin \\alpha}{\\cos \\alpha}$<br><br>$\\Rightarrow \\sin \\theta \\cos \\alpha = \\cos \\theta \\sin \\alpha$<br><br>$\\Rightarrow \\sin \\theta \\cos \\alpha - \\cos \\theta \\sin \\alpha = 0$<br><br>$\\Rightarrow \\sin(\\theta - \\alpha) = 0$<br><br>The general solution for $\\sin x = 0$ is $x = n\\pi$, where $n \\in \\mathbb{Z}$.<br><br>$\\Rightarrow \\theta - \\alpha = n\\pi$<br><br>$\\Rightarrow \\theta = n\\pi + \\alpha$, where $n \\in \\mathbb{Z}$.<br><br>Answer: $\\quad \\theta=\\mathrm{n} \\pi+\\alpha, \\mathrm{n} \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213420aee93fa0796d764", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", $n \\in \\mathbb{Z}$.<br><br>Therefore, $\\theta = n \\pi + (-1)^n \\dfrac{\\pi}{3}, n \\in \\mathbb{Z}$.<br><br>Answer: $\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\dfrac{\\pi}{3}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262730279619d9d8a34a4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The principal solutions of the equation $\\sec x+\\tan x=2 \\cos x$ are", "image": null}, "options": [{"id": "vP7Va", "text": "$\\frac{\\pi}{6}, \\frac{5 \\pi}{6}$", "image": null, "isCorrect": true}, {"id": "MXQn3", "text": "$\\frac{\\pi}{6}, \\frac{\\pi}{20}$", "image": null, "isCorrect": false}, {"id": "sDNPh", "text": "$\\frac{\\pi}{6}, \\frac{2 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "MhCEY", "text": "$\\frac{\\pi}{6}, \\frac{\\pi}{12}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is defined for $x \\neq \\frac{\\pi}{2}, \\frac{3 \\pi}{2}$.\nNow, $\\tan x+\\sec x=2 \\cos x$\n$$\n\\begin{aligned}\n& \\Rightarrow \\frac{\\sin x}{\\cos x}+\\frac{1}{\\cos x}=2 \\cos x \\\\\n& \\Rightarrow(\\sin x+1)=2 \\cos ^2 x \\\\\n& \\Rightarrow(\\sin x+1)=2\\left(1-\\sin ^2 x\\right) \\\\\n& \\Rightarrow(\\sin x+1)=2(1-\\sin x)(1+\\sin x) \\\\\n& \\Rightarrow(1+\\sin x)[2(1-\\sin x)-1]=0 \\\\\n& \\Rightarrow 2(1-\\sin x)-1=0 \\\\\n& \\quad \\ldots\\left[\\begin{array}{r}\n\\sin x \\neq-1 \\text { otherwise } \\cos x=0 \\text { and } \\\\\n\\tan x, \\sec x \\text { will be undefined }\n\\end{array}\\right] \\\\\n& \\Rightarrow \\sin x=\\frac{1}{2} \\quad \\\\\n& \\Rightarrow x=\\frac{\\pi}{6}, \\frac{5 \\pi}{6} \\text { in }(0,2 \\pi)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262510279619d9d8a338f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "The general solution of the equation $3 \\sec ^2 \\theta=2 \\operatorname{cosec} \\theta$ is", "image": null}, "options": [{"id": "W1gZb", "text": "$\\mathrm{n} \\pi+\\frac{\\pi}{4}, \\mathrm{n} \\in \\mathrm{Z}$", "image": null, "isCorrect": false}, {"id": "NIsui", "text": "$2 \\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{12}, \\mathrm{n} \\in \\mathrm{Z}$", "image": null, "isCorrect": false}, {"id": "LySCt", "text": "$\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{6}, \\mathrm{n} \\in \\mathrm{Z}$", "image": null, "isCorrect": true}, {"id": "1l68z", "text": "$\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{3}, \\mathrm{n} \\in \\mathrm{Z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& 3 \\sec ^2 \\theta=2 \\operatorname{cosec} \\theta \\\\\n& \\Rightarrow \\frac{3}{\\cos ^2 \\theta}=\\frac{2}{\\sin \\theta} \\\\\n& \\Rightarrow \\frac{3}{1-\\sin ^2 \\theta}=\\frac{2}{\\sin \\theta} \\\\\n& \\Rightarrow 2 \\sin ^2 \\theta+3 \\sin \\theta-2=0 \\\\\n& \\Rightarrow(2 \\sin \\theta-1)(\\sin \\theta+2)=0 \\\\\n& \\Rightarrow \\sin \\theta=\\frac{1}{2}\n\\end{aligned}\n$$\nor $\\sin \\theta=-2$, which is not possible\n$$\n\\begin{aligned}\n\\therefore \\quad \\sin \\theta & =\\frac{1}{2}=\\sin \\frac{\\pi}{6} \\\\\n\\Rightarrow \\theta & =\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{6}, \\mathrm{n} \\in Z\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622a0279619d9d8a3255", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "If general solution of $\\cos ^2 \\theta-2 \\sin \\theta+\\frac{1}{4}=0$ is $\\theta=\\frac{\\mathrm{n} \\pi}{\\mathrm{A}}+(-1)^{\\mathrm{n}} \\frac{\\pi}{\\mathrm{B}}, \\mathrm{n} \\in \\mathrm{Z}$, then $\\mathrm{A}+\\mathrm{B}$ has the value", "image": null}, "options": [{"id": "BF6Mn", "text": "7", "image": null, "isCorrect": true}, {"id": "XpfgB", "text": "6", "image": null, "isCorrect": false}, {"id": "vt7Uy", "text": "1", "image": null, "isCorrect": false}, {"id": "eMxyb", "text": "-7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\cos ^2 \\theta-2 \\sin \\theta+\\frac{1}{4}=0 \\\\ \\therefore \\quad & \\left(1-\\sin ^2 \\theta\\right)-2 \\sin \\theta+\\frac{1}{4}=0 \\\\ \\therefore \\quad & \\sin ^2 \\theta+2 \\sin \\theta-\\frac{5}{4}=0 \\\\ Correct": true}, {"id": "l26Vc", "text": "$3$", "image": null, "isCorrect": false}, {"id": "9u62t", "text": "$36$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{\\tan 3 x-1}{\\tan 3 x+1}=\\sqrt{3} \\\\ \\therefore \\quad & \\frac{\\tan 3 x-\\tan \\frac{\\pi}{4}}{1+(\\tan 3 x)\\left(\\tan \\frac{\\pi}{4}\\right)}=\\sqrt{3} \\\\ \\therefore \\quad & \\tan \\left(3 x-\\frac{\\pi}{4}\\right)=\\tan \\left(\\frac{\\pi}{3}\\right) \\\\ \\therefore \\quad & 3 x-\\frac{\\pi}{4}=n \\pi+\\frac{\\pi}{3}\\end{aligned}$\n$\\begin{aligned}\n& \\therefore \\quad 3 x=\\mathrm{n} \\pi+\\frac{\\pi}{3}+\\frac{\\pi}{4} \\\\\n& \\therefore \\quad 3 x=\\mathrm{n} \\pi+\\frac{7 \\pi}{12} \\\\\n& \\therefore \\quad x=\\frac{\\mathrm{n} \\pi}{3}+\\frac{7 \\pi}{36} \\\\\n&\n\\end{aligned}$\nComparing with $\\frac{\\mathrm{n} \\pi}{\\mathrm{p}}+\\frac{7 \\pi}{\\mathrm{q}}$, we get\n$\\begin{aligned}\n& \\mathrm{p}=3, \\mathrm{q}=36 \\\\\n\\therefore \\quad & \\frac{\\mathrm{p}}{\\mathrm{q}}=\\frac{3}{36}=\\frac{1}{12}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261900279619d9d8a2d97", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The principal solutions of $\\cot x+\\sqrt{3}=0$ are", "image": null}, "options": [{"id": "zzhYa", "text": "$\\frac{5 \\pi}{6}, \\frac{11 \\pi}{6}$", "image": null, "isCorrect": true}, {"id": "m7Z8P", "text": "$\\frac{\\pi}{6}, \\frac{7 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "eCofo", "text": "$\\frac{\\pi}{6}, \\frac{5 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "UkHKT", "text": "$\\frac{5 \\pi}{6}, \\frac{7 \\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\cot x+\\sqrt{3}=0 \\\\ & \\Rightarrow \\cot x=-\\sqrt{3} \\\\ & \\Rightarrow x=\\pi-\\frac{\\pi}{6} \\text { or } 2 \\pi-\\frac{\\pi}{6} \\\\ & \\Rightarrow x=\\frac{5 \\pi}{6} \\text { or } \\frac{11 \\pi}{6}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261470279619d9d8a2b42", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "The value of $4 \\cos ^3 20^{\\circ}$ is", "image": null}, "options": [{"id": "HqHrT", "text": "$-\\frac{1}{2}-\\cos 20^{\\circ}$", "image": null, "isCorrect": false}, {"id": "si9Nt", "text": "$-\\frac{1}{2}+3 \\cos 20^{\\circ}$", "image": null, "isCorrect": false}, {"id": "Ng481", "text": "$\\frac{1}{2}+3 \\cos 20^{\\circ}$", "image": null, "isCorrect": true}, {"id": "MSWxk", "text": "$\\frac{1}{2}-3 \\cos 20^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & 4 \\cos ^3 20^{\\circ}=\\cos \\left(3 \\times 20^{\\circ}\\right)+3 \\cos 20^{\\circ}\\left[\\because 4 \\cos ^3 \\theta=\\cos 3 \\theta+3 \\cos \\theta\\right] \\\\ & \\Rightarrow 4 \\cos ^3 20^{\\circ}=\\cos 60^{\\circ}+3 \\cos 20^{\\circ}=\\frac{1}{2}+3 \\cos 20^{\\circ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261370279619d9d8a2abe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "Let $\\cos (\\alpha+\\beta)=\\frac{4}{5}$ and $\\sin (\\alpha-\\beta)=\\frac{5}{13}$, where $0 \\leq \\alpha, \\beta \\leq \\frac{\\pi}{4}$, then $\\tan 2 \\alpha=$", "image": null}, "options": [{"id": "qT4Vw", "text": "$\\frac{19}{12}$", "image": null, "isCorrect": false}, {"id": "2ErHZ", "text": "$\\frac{56}{33}$", "image": null, "isCorrect": true}, {"id": "26Ht3", "text": "$\\frac{25}{16}$", "image": null, "isCorrect": false}, {"id": "HyVbO", "text": "$\\frac{20}{7}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\cos (\\alpha+\\beta)=\\frac{4}{5} \\Rightarrow \\tan (\\alpha+\\beta)=\\frac{3}{4} \\\\ & \\sin (\\alpha-\\beta)=\\frac{5}{13} \\Rightarrow \\tan (\\alpha-\\beta)=\\frac{5}{12} \\\\ & \\tan 2 \\alpha=\\tan \\{(\\alpha+\\beta)+(\\alpha-\\beta)\\}=\\frac{\\tan (\\alpha+\\beta)+\\tan (\\alpha-\\beta)}{1-\\tan (\\alpha+\\beta) \\cdot \\tan (\\alpha-\\beta)} \\\\ & =\\frac{\\frac{3}{4}+\\frac{5}{12}}{1-\\frac{3}{4} \\times \\frac{5}{12}}=\\frac{56}{33}\\end{aligned}$", "image": null}, "videoSolution": null, "syl CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b30279619d9d8a269f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "If $3 \\sin \\theta=2 \\sin 3 \\theta$ and $0 < \\theta < \\pi$, then $\\sin \\theta=$", "image": null}, "options": [{"id": "PX5OU", "text": "$\\frac{\\sqrt{2}}{\\sqrt{5}}$", "image": null, "isCorrect": false}, {"id": "Mf2rR", "text": "$\\frac{\\sqrt{3}}{2 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "ZE2cr", "text": "$\\frac{\\sqrt{2}}{3}$", "image": null, "isCorrect": false}, {"id": "Klp1M", "text": "$\\frac{\\sqrt{3}}{\\sqrt{5}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& 3 \\sin \\theta=2 \\sin 3 \\theta \\\\\n& \\quad=2\\left(3 \\sin \\theta-4 \\sin ^2 \\theta\\right) \\\\\n& \\therefore 8 \\sin ^3 \\theta-3 \\sin \\theta=0 \\\\\n& \\therefore \\sin \\theta\\left(8 \\sin ^2 \\theta-3\\right)=0 \\\\\n& \\therefore \\sin \\theta=0 \\text { or } \\sin \\theta= \\pm \\sqrt{\\frac{3}{8}}= \\pm \\frac{\\sqrt{3}}{2 \\sqrt{2}}\n\\end{aligned}\n$$\nSince, $0 < \\theta < \\pi$, we write $\\sin \\theta=\\frac{\\sqrt{3}}{2 \\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609f0279619d9d8a2601", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "If $\\mathrm{a} \\sin \\theta=\\mathrm{b} \\cos \\theta$, where $\\mathrm{a}, \\mathrm{b} \\neq 0$, then $\\mathrm{a} \\cos 2 \\theta+\\mathrm{b} \\sin 2 \\theta=$", "image": null}, "options": [{"id": "T0ryJ", "text": "ab", "image": null, "isCorrect": false}, {"id": "kRKIQ", "text": "a", "image": null, "isCorrect": true}, {"id": "C0zkW", "text": "b", "image": null, "isCorrect": false}, {"id": "DGfZM", "text": "$\\frac{\\mathrm{a}}{\\mathrm{b}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & a \\sin \\theta=b \\cos \\theta \\Rightarrow \\tan \\theta=\\frac{b}{a} \\\\ & a \\cos 2 \\theta+b \\sin 2 \\theta \\\\ & =a\\left(\\frac{1-\\tan ^2 \\theta}{1+\\tan ^2 \\theta}\\right)+b\\left(\\frac{2 \\tan \\theta}{1+\\tan ^2 \\theta}\\right) \\\\ & =a\\left[\\frac{1-\\left(\\frac{b^2}{a^2}\\right)}{1+\\left(\\frac{b^2}{a^2}\\right)}\\right]+b\\left[\\frac{2\\left(\\frac{b}{a}\\right)}{1+\\left(\\frac{b^2}{a^2}\\right)}\\right]=a\\left(\\frac{a^2-b^2}{a^2+b^2}\\right)+b\\left(\\frac{2 b}{a} \\times \\frac{a^2}{a^2+b^2}\\right) \\\\ & =\\frac{a\\left(a^2-b^2\\right)}{a^2+b^2}+\\frac{b(2 a b)}{a^2+b^2}=\\frac{a^3-a b^2+2 a b^2}{a^2+b^2} \\\\ & =\\frac{a^3+a b^2}{a^2+b^2}=\\frac{a\\left(a^2+b^2\\right)}{a^2+b^2}=a\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608d0279619d9d8a256c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "If $2 \\cos \\theta=x+\\frac{1}{x}$, then $2 \\cos 3 \\theta=$", "image": null}, "options": [{"id": "4Ayzw", "text": "$x^3-\\frac{1}{x^3}$", "image": null, "isCorrect": false}, {"id": "eq2jS", "text": "$\\left(\\mathrm{x}+\\frac{1}{\\mathrm{x}}\\right)^3$", "image": null, "isCorrect": false}, {"id": "629uq", "text": "$x+\\frac{1}{x}$", "image": null, "isCorrect": false}, {"id": "09w2k", "text": "$x^3+\\frac{1}{x^3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { We have } \\cos \\theta=\\frac{1}{2}\\left(x+\\frac{1}{x}\\right) \\\\ & 2 \\cos 3 \\theta \\\\ & =2\\left[4 \\cos ^3 \\theta-3 \\cos \\theta\\right]=2\\left\\{4\\left[\\left(\\frac{1}{2}\\right)\\left(x+\\frac{1}{x}\\right)\\right]^3-\\left[3\\left(\\frac{1}{2}\\right)\\left(x+\\frac{1}{x}\\right)\\right]\\right\\} \\\\ & =2\\left[\\left(\\frac{1}{2}\\right)\\left(x^3+\\frac{1}{x^3}\\right)+3\\left(x+\\frac{1}{x}\\right)\\right]-3\\left(x+\\frac{1}{x}\\right)=x^3+\\frac{1}{x^3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260090279619d9d8a2136", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "The general solution of $\\frac{1-\\cos 2 x}{1+\\cos 2 x}=3$ is", "image": null}, "options": [{"id": "YG2Rf", "text": "$x=2 n \\pi \\pm \\frac{\\pi}{3}, n \\in Z$", "image": null, "isCorrect": false}, {"id": "I3Nd5", "text": "$\\quad x=n \\pi \\pm \\frac{\\pi}{6} \\quad, n \\in Z$", "image": null, "isCorrect": false}, {"id": "FwlJE", "text": "$x=2 \\mathrm{n} \\pi \\pm \\frac{\\pi}{6}, \\mathrm{n} \\in \\mathrm{Z}$", "image": null, "isCorrect": false}, {"id": "Ms4Il", "text": "$x=\\mathrm{n} \\pi \\pm \\frac{\\pi}{3}, \\mathrm{n} \\in \\mathrm{z}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\frac{1-\\cos 2 x}{1+\\cos 2 x}=3 \\Rightarrow \\frac{2 \\sin ^{2} x}{2 \\cos ^{2} x}=3$\n$\\therefore \\tan ^{2} x=3 \\Rightarrow \\tan ^{2} x=\\tan ^{2} \\frac{\\pi}{3} \\Rightarrow x=n \\pi \\pm \\frac{\\pi}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff70279619d9d8a20ab", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The principal solutions of $\\cot x=\\sqrt{3}$ are", "image": null}, "options": [{"id": "Q85lm", "text": "$\\frac{\\pi}{4}, \\frac{5 \\pi}{4}$", "image": null, "isCorrect": false}, {"id": "WA7kg", "text": "$\\frac{\\pi}{6}, \\frac{7 \\pi}{6}$", "image": null, "isCorrect": true}, {"id": "D7i7D", "text": "$\\frac{\\pi}{6}, \\frac{5 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "zAQNx", "text": "$\\frac{\\pi}{3}, \\frac{7 \\pi}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\nThe given equation is $\\cot \\theta=\\sqrt{3}$ which is same $\\tan \\theta=\\frac{1}{\\sqrt{3}}$.\nWe know that, $\\tan \\frac{\\pi}{6}=\\frac{1}{\\sqrt{3}}$ and $\\tan (\\pi+\\theta)=\\tan \\theta$\n$\\therefore \\tan \\frac{\\pi}{6}=\\tan \\left(\\pi+\\frac{\\pi}{6}\\right)=\\tan \\frac{7 \\pi}{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe30279619d9d8a200b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The principal solutions of $\\cos 2 x=\\frac{-1}{2}$ are", "image": null}, "options": [{"id": "FMS1d", "text": "$x=\\frac{-2 \\pi}{3}, x=\\frac{4 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "kA0tv", "text": "$x=\\frac{\\pi}{3}, \\quad x=\\frac{2 \\pi}{3}$", "image": null, "isCorrect": true}, {"id": "kcY3y", "text": "$x=\\frac{-\\pi}{3}, \\quad x=\\frac{5 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "4EkMI", "text": "$x=\\frac{\\pi}{3}, \\quad x=\\frac{7 \\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\n$\\begin{aligned} & \\cos 2 x=\\frac{-1}{2} \\\\ \\therefore & \\frac{-1}{2}=\\cos \\left(\\pi-\\frac{\\pi}{3}\\right)-\\cos \\left(\\pi+\\frac{\\pi}{3}\\right) \\Rightarrow \\frac{-1}{2}-\\cos \\frac{2 \\pi}{3}-\\cos \\frac{4 \\pi}{3} \\\\ \\therefore & 2 x=\\frac{2 \\pi}{3} \\text { or } 2 x=\\frac{4 \\pi}{3} \\Rightarrow x=\\frac{\\pi}{3} \\text { or } \\frac{2 \\pi}{3} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f3d0279619d9d8a1adf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "If $2 \\sin ^{2} x+7 \\cos x=5$, then permissible value of $\\cos x$ is", "image": null}, "options": [{"id": "G80k9", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "qr6fC", "text": "0", "image": null, "isCorrect": false}, {"id": "ylNDq", "text": "1", "image": null, "isCorrect": false}, {"id": "g8Cdd", "text": "$-\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $2 \\cos ^{2} \\theta+3 \\cos \\theta=2$\n$2 \\cos ^{2} \\theta+4 \\cos \\theta-\\cos \\theta-2=0 \\Rightarrow 2 \\cos \\theta(\\cos \\theta+2)-1(\\cos \\theta+2)=0$\n$(2 \\cos \\theta-1)(\\cos \\theta+2)=0$\n$\\therefore \\cos \\theta=\\frac{1}{2},-2$ (Impossible) $\\Rightarrow \\cos \\theta=\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f060279619d9d8a1929", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "Which of the following function has period 2?", "image": null}, "options": [{"id": "T1rau", "text": "<math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mi>x</mi></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "h68A3", "text": "<math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mi>x</mi></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "pCsBp", "text": "<math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>π</mi><mi>x</mi></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "Quvsc", "text": "<math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>π</mi><mi>x</mi></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Key Idea Use period of <math><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>k</mi><mi>θ</mi></math> is <math><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>k</mi></mrow></mfrac></math> .<br /><math><mo>∴</mo></math> Period of <math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>π</mi><mi>x</mi></mrow></mfenced></mrow></mrow></math> is <math><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>π</mi></mrow></mfrac><mo>=</mo><mn>2</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2634d0279619d9d8a3dff", "title": "Solving Trigonometric Equation", "totalQuestions": 76, "questions": [{"_id": "6abb884715a9fc0fc8c1422e", "type": "singleCorrect", "question": {"text": "The general solution of the equation $4 \\sin x \\cos x + 2 \\sin x + 2 \\cos x + 1 = 0$, where $n \\in Z$ is:", "image": null}, "options": [{"id": "AEOzO", "label": "A", "text": "$x = 2n\\pi \\pm \\dfrac{2\\pi}{3}$ or $n\\pi + (-1)^n \\dfrac{7\\pi}{6}$", "isCorrect": true, "image": null}, {"id": "DYLpb", "label": "B", "text": "$x = 2n\\pi \\pm \\dfrac{\\pi}{3}$ or $n\\pi - (-1)^n \\dfrac{5\\pi}{6}$", "isCorrect": false, "image": null}, {"id": "Sv8Mz", "label": "C", "text": "$x = 2n\\pi + \\dfrac{\\pi}{3}$ or $n\\pi + (-1)^n \\dfrac{7\\pi}{6}$", "isCorrect": false, "image": null}, {"id": "FgJ3U", "label": "D", "text": "$x = 2n\\pi - \\dfrac{\\pi}{3}$ or $n\\pi + (-1)^n \\dfrac{7\\pi}{6}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation is $4 \\sin x \\cos x + 2 \\sin x + 2 \\cos x + 1 = 0$.<br><br>Grouping the terms, we get:<br><br>$2 \\sin x (2 \\cos x + 1) + 1 (2 \\cos x + 1) = 0$<br><br>$(2 \\sin x + 1)(2 \\cos x + 1) = 0$<br><br>This gives two possible cases:<br><br>Case 1: $2 \\cos x + 1 = 0$<br><br>$\\cos x = -\\dfrac{1}{2}$<br><br>$\\cos x = \\cos\\left(\\dfrac{2\\pi}{3}\\right)$<br><br>The general solution is $x = 2n\\pi \\pm \\dfrac{2\\pi}{3}$, where $n \\in Z$.<br><br>Case 2: $2 \\sin x + 1 = 0$<br><br>$\\sin x = -\\dfrac{1}{2}$<br><br>$\\sin x = \\sin\\left(\\dfrac{7\\pi}{6}\\right)$<br><br>The general solution is $x = n\\pi + (-1)^n \\dfrac{7\\pi}{6}$, where $n \\in Z$.<br><br>Therefore, the general solution is $x = 2n\\pi \\pm \\dfrac{2\\pi}{3}$ or $n\\pi + (-1)^n \\dfrac{7\\pi}{6}$.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885515a9fc0fc8c142b3", "type": "singleCorrect", "question": {"text": "If $x \\in (0, 2\\pi)$ satisfies the equation $\\cos x + \\sin x = \\frac{1}{2}$, then the sum of all distinct values of $\\tan x$ is...", "image": null}, "options": [{"id": "AOOuC", "label": "A", "text": "$-\\dfrac{8}{3}$", "isCorrect": true, "image": null}, {"id": "H7Tfn", "label": "B", "text": "$0$", "isCorrect": false, "image": null}, {"id": "pqfGC", "label": "C", "text": "$\\dfrac{2\\sqrt{7}}{3}$", "isCorrect": false, "image": null}, {"id": "kWelj", "label": "D", "text": "$\\dfrac{8}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the equation $\\cos x + \\sin x = \\dfrac{1}{2}$.<br><br>Squaring both sides:<br><br>$(\\cos x + \\sin x)^2 = \\left(\\dfrac{1}{2}\\right)^2$<br><br>$\\cos^2 x + \\sin^2 x + 2 \\sin x \\cos x = \\dfrac{1}{4}$<br><br>$1 + \\sin 2x = \\dfrac{1}{4}$<br><br>$\\sin 2x = -\\dfrac{3}{4}$<br><br>Expressing $\\sin 2x$ in terms of $\\tan x$:<br><br>$\\dfrac{2 \\tan x}{1 + \\tan^2 x} = -\\dfrac{3}{4}$<br><br>$8 \\tan x = -3(1 + \\tan^2 x)$<br><br>$8 \\tan x = -3 - 3 \\tan^2 x$<br><br>$3 \\tan^2 x + 8 \\tan x + 3 = 0$<br><br>This is a quadratic equation in $\\tan x$. Let its roots be $\\tan x_1$ and $\\tan x_2$.<br><br>For any real root $p$ of this equation, there exist angles in $(0, 2\\pi)$ such that $\\tan x = p$, providing solutions for both $\\cos x + \\sin x = \\dfrac{1}{2}$ and $\\cos x + \\sin x = -\\dfrac{1}{2}$ in different quadrants. Thus, both roots correspond to valid distinct values of $\\tan x$ for the original equation.<br><br>The sum of all distinct values of $\\tan x$ is the sum of the roots of the quadratic equation.<br><br>$\\text{Sum of roots} = -\\dfrac{8}{3}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887615a9fc0fc8c143ee", "type": "singleCorrect", "question": {"text": "The number of solutions of $\\cos 2x = \\cos x$ in the interval $[0, 2\\pi]$ is", "image": null}, "options": [{"id": "4s6Y3", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "4Q0m3", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "931ji", "label": "C", "text": "$4$", "isCorrect": true, "image": null}, {"id": "gk7Ix", "label": "D", "text": "$6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation is $\\cos 2x = \\cos x$.<br><br>Using the identity $\\cos 2x = 2\\cos^2 x - 1$, we get:<br><br>$2\\cos^2 x - 1 = \\cos x$<br><br>$2\\cos^2 x - \\cos x - 1 = 0$<br><br>$(2\\cos x + 1)(\\cos x - 1) = 0$<br><br>$\\cos x = 1$ or $\\cos x = -\\dfrac{1}{2}$<br><br>For $x \\in [0, 2\\pi]$:<br><br>$\\cos x = 1 \\Rightarrow x = 0, 2\\pi$<br><br>$\\cos x = -\\dfrac{1}{2} \\Rightarrow x = \\dfrac{2\\pi}{3}, \\dfrac{4\\pi}{3}$<br><br>The solutions are $x = 0, \\dfrac{2\\pi}{3}, \\dfrac{4\\pi}{3}, 2\\pi$.<br><br>The number of solutions is $4$.<br><br>Answer: $4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888615a9fc0fc8c14484", "type": "singleCorrect", "question": {"text": "The general solution of the equation $\\tan x + \\sec x = 2\\cos x$ is", "image": null}, "options": [{"id": "Up5vL", "label": "A", "text": "$x = n\\pi + (-1)^n\\left(\\dfrac{\\pi}{3}\\right),\\quad n \\in Z$", "isCorrect": false, "image": null}, {"id": "yGMz7", "label": "B", "text": "$x = n\\pi + (-1)^{n+1}\\left(\\dfrac{\\pi}{2}\\right),\\quad n \\in Z$", "isCorrect": false, "image": null}, {"id": "sPd6O", "label": "C", "text": "$x = n\\pi + (-1)^n\\left(\\dfrac{\\pi}{4}\\right),\\quad n \\in Z$", "isCorrect": false, "image": null}, {"id": "2oXGW", "label": "D", "text": "$x = n\\pi + (-1)^n\\left(\\dfrac{\\pi}{6}\\right),\\quad n \\in Z$", "isCorrect": true, "i
