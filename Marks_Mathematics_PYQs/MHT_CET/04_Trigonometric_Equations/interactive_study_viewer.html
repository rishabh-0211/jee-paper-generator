\circ}-\\mathrm{A}\\right) \\\\ & =\\sin \\left[\\left(72^{\\circ}-\\mathrm{A}\\right)-\\left(18^{\\circ}-\\mathrm{A}\\right)\\right] \\\\ & =\\sin 54^{\\circ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622a0279619d9d8a3251", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "The solution set of $8 \\cos ^2 \\theta+14 \\cos \\theta+5=0$, in the interval $[0,2 \\pi]$, is", "image": null}, "options": [{"id": "p3ESM", "text": "$\\left\\{\\frac{\\pi}{3}, \\frac{2 \\pi}{3}\\right\\}$", "image": null, "isCorrect": false}, {"id": "eyagY", "text": "$\\left\\{\\frac{\\pi}{3}, \\frac{4 \\pi}{3}\\right\\}$", "image": null, "isCorrect": false}, {"id": "VNTrQ", "text": "$\\left\\{\\frac{2 \\pi}{3}, \\frac{4 \\pi}{3}\\right\\}$", "image": null, "isCorrect": true}, {"id": "mHvrd", "text": "$\\left\\{\\frac{2 \\pi}{3}, \\frac{5 \\pi}{3}\\right\\}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{ll} \n& 8 \\cos ^2 \\theta+14 \\cos \\theta+5=0 \\\\\n\\therefore \\quad & 8 \\cos ^2 \\theta+10 \\cos \\theta+4 \\cos \\theta+5=0 \\\\\n\\therefore \\quad & 2 \\cos \\theta(4 \\cos \\theta+5)+1(4 \\cos \\theta+5)=0 \\\\\n\\therefore \\quad & (2 \\cos \\theta+1)(4 \\cos \\theta+5)=0 \\\\\n\\therefore \\quad & \\cos \\theta=\\frac{-1}{2} \\text { or } \\cos \\theta=\\frac{-5}{4}\n\\end{array}\n$$\nBut $\\cos \\theta=\\frac{-5}{4}$ is not possible as $\\cos \\theta \\in[-1,1]$ for all values of $\\theta$.\n$$\n\\begin{aligned}\n& \\therefore \\quad \\cos \\theta=\\frac{-1}{2} \\\\\n& \\therefore \\quad \\theta \\in\\left\\{\\frac{2 \\pi}{3}, \\frac{4 \\pi}{3}\\right\\}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622a0279619d9d8a3250", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "If $\\tan \\theta=\\frac{\\sin \\alpha-\\cos \\alpha}{\\sin \\alpha+\\cos \\alpha}, 0 \\leq \\alpha \\leq \\frac{\\pi}{2}$, then the value of $\\cos 2 \\theta$ is", "image": null}, "options": [{"id": "owbxZ", "text": "$\\cos 2 \\alpha$", "image": null, "isCorrect": false}, {"id": "ZxuBT", "text": "$\\sin \\alpha$", "image": null, "isCorrect": false}, {"id": "Z6fkR", "text": "$\\cos \\alpha$", "image": null, "isCorrect": false}, {"id": "rq84B", "text": "$\\sin 2 \\alpha$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\tan \\theta=\\frac{\\sin \\alpha-\\cos \\alpha}{\\sin \\alpha+\\cos \\alpha} \\\\ & \\frac{\\sin \\theta}{\\cos \\theta}=\\frac{\\sin \\alpha-\\cos \\alpha}{\\sin \\alpha+\\cos \\alpha} \\\\ \\therefore \\quad & \\sin \\alpha \\sin \\theta+\\cos \\alpha \\sin \\theta=\\sin \\alpha \\cos \\theta-\\cos \\alpha \\cos \\theta \\\\ \\therefore \\quad & \\cos \\alpha \\cos \\theta+\\sin \\alpha \\sin \\theta=\\sin \\alpha \\cos \\theta-\\cos \\alpha \\sin \\theta \\\\ \\therefore \\quad & \\cos (\\alpha-\\theta)=\\sin (\\alpha-\\theta) \\\\ \\therefore \\quad & \\alpha-\\theta=\\frac{\\pi}{4} \\\\ \\therefore \\quad & \\theta=\\alpha-\\frac{\\pi}{4} \\\\ \\therefore \\quad & 2 \\theta=2 \\alpha-\\frac{\\pi}{2} \\\\ \\therefore \\quad & \\cos 2 \\theta=\\cos \\left(2 \\alpha-\\frac{\\pi}{2}\\right) \\\\ & =\\cos \\left[\\because 0 \\leq \\alpha \\leq \\frac{\\pi}{2}\\right] \\\\ & \\left.=\\cos \\left(\\frac{\\pi}{2}-2 \\alpha\\right)\\right] \\quad \\ldots[\\because \\cos (-\\theta)=\\cos \\theta] \\\\ \\therefore \\quad & \\cos 2 \\theta=\\sin 2 \\alpha\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262160279619d9d8a31b1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "If $\\cos x+\\cos y-\\cos (x+y)=\\frac{3}{2}$, then", "image": null}, "options": [{"id": "ACaQ2", "text": "$x+y=0$", "image": null, "isCorrect": false}, {"id": "mB9ZP", "text": "$x=2 y$", "image": null, "isCorrect": false}, {"id": "1FOjU", "text": "$x=y$", "image": null, "isCorrect": true}, {"id": "eTZAD", "text": "$2 x=y$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\cos x+\\cos y-\\cos (x+y)=\\frac{3}{2}$\n$\\begin{array}{r}\n\\therefore \\quad 2 \\cos \\left(\\frac{x+y}{2}\\right) \\cos \\left(\\frac{x-y}{2}\\right)-\\left(2 \\cos ^2\\left(\\frac{x+y}{2}\\right)-1\\right)=\\frac{3}{2} \\\\\n\\quad \\cdots\\left[\\begin{array}{l}\n\\because \\cos \\alpha+\\cos \\beta=2 \\cos \\left(\\frac{\\alpha+\\beta}{2}\\right) \\cos \\left(\\frac{\\alpha-\\beta}{2}\\right) \\text { and } \\\\\n\\cos \\theta=2 \\cos ^2\\left(\\frac{\\theta}{2}\\right)-1\n\\end{array}\\right]\n\\end{array}$\n$\\begin{aligned} & \\therefore \\quad 2 \\cos \\left(\\frac{x+y}{2}\\right) \\cos \\left(\\frac{x-y}{2}\\right)-2 \\cos ^2\\left(\\frac{x+y}{2}\\right)=\\frac{3}{2}-1 \\\\ & \\therefore \\quad 2 \\cos \\left(\\frac{x+y}{2}\\right) \\cos \\left(\\frac{x-y}{2}\\right)-2 \\cos ^2\\left(\\frac{x+y}{2}\\right)=\\frac{1}{2} \\\\ & \\therefore \\quad 4 \\cos ^2\\left(\\frac{x+y}{2}\\right)-4 \\cos \\left(\\frac{x+y}{2}\\right) \\cos \\left(\\frac{x-y}{2}\\right)+1=0\\end{aligned}$\nSubstituting $\\cos \\left(\\frac{x+y}{2}\\right)=\\mathrm{t}$, we get\n$4 \\mathrm{t}^2-4 \\mathrm{t} \\cos \\left(\\frac{x-y}{2}\\right)+1=0$\nAs $t$ is real, we get $b^2-4 a c \\geq 0$\n$\\begin{aligned}\n& \\Rightarrow\\left[-4 \\cos \\left(\\frac{x-y}{2}\\right)\\right]^2-4 \\times 4 \\times 1 \\geq 0 \\\\\n& \\Rightarrow 16 \\cos ^2\\left(\\frac{x-y}{2}\\right)-16 \\geq 0 \\\\\n& \\Rightarrow \\cos ^2\\left(\\frac{x-y}{2}\\right) \\geq 1 \\\\\n& \\Rightarrow \\cos ^2\\left(\\frac{x-y}{2}\\right)=1\n\\end{aligned}$\n$\\ldots[\\because-1 \\leq \\cos \\theta \\leq 1$, for all values of $\\theta]$\n$\\begin{aligned}\n& \\Rightarrow \\frac{x-y}{2}=0 \\\\\n& \\Rightarrow x=y\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261df0279619d9d8a2fff", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The number of solutions of $\\tan x+\\sec x=2 \\cos x$ in $[0,2 \\pi]$ are", "image": null}, "options": [{"id": "Irsj5", "text": "6", "image": null, "isCorrect": false}, {"id": "Bc7mb", "text": "4", "image": null, "isCorrect": false}, {"id": "KPCgU", "text": "3", "image": null, "isCorrect": false}, {"id": "mfbhh", "text": "2", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given equation is defined for $x \\neq \\frac{\\pi}{2}, \\frac{3 \\pi}{2}$.\nNow, $\\tan x+\\sec x=2 \\cos x$\n$\\Rightarrow \\frac{\\sin x}{\\cos x}+\\frac{1}{\\cos x}=2 \\cos x$\n$\\Rightarrow(\\sin x+1)=2 \\cos ^2 x$\n$\\Rightarrow(\\sin x+1)=2\\left(1-\\sin ^2 x\\right)$\n$\\Rightarrow(\\sin x+1)=2(1-\\sin x)(1+\\sin x)$\n$\\Rightarrow(1+\\sin x)[2(1-\\sin x)-1]=0$\n$\\Rightarrow 2(1-\\sin x)-1=0$\n$\\ldots\\left[\\begin{array}{r}\n\\because \\sin x \\neq-1 \\text { otherwise } \\cos x=0 \\text { and } \\\\\n\\tan x, \\sec x \\text { will be undefined }\n\\end{array}\\right]$\n$\\Rightarrow \\sin x=\\frac{1}{2}$\n$\\Rightarrow x=\\frac{\\pi}{6}, \\frac{5 \\pi}{6}$ in $(0,2 \\pi)$\n$\\therefore \\quad$ number of solutions $=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261de0279619d9d8a2ffc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The number of possible solutions of $\\sin \\theta+\\sin 4 \\theta+\\sin 7 \\theta=0, \\theta \\in(0, \\pi)$ are", "image": null}, "options": [{"id": "EsmXO", "text": "3", "image": null, "isCorrect": false}, {"id": "jrx6S", "text": "4", "image": null, "isCorrect": false}, {"id": "M3hIP", "text": "6", "image": null, "isCorrect": true}, {"id": "KD5OK", "text": "8", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\sin 7 \\theta+\\sin \\theta+\\sin 4 \\theta=0 \\\\\n& \\Rightarrow 2 \\sin 4 \\theta \\cos 3 \\theta+\\sin 4 \\theta=0 \\\\\n& \\Rightarrow \\sin 4 \\theta(2 \\cos 3 \\theta+1)=0 \\\\\n& \\Rightarrow \\sin 4 \\theta=0 \\quad \\text { or } \\cos 3 \\theta=\\frac{-1}{2} \\\\\n& \\Rightarrow \\sin 4 \\theta=0 \\quad \\text { or } \\cos 3 \\theta=\\cos \\left(\\frac{2 \\pi}{3}\\right) \\\\\n& \\Rightarrow 4 \\theta=\\mathrm{n} \\pi \\quad \\text { or } 3 \\theta=2 \\mathrm{n} \\pi \\pm \\frac{2 \\pi}{3} \\\\\n& \\Rightarrow \\theta=\\frac{\\mathrm{n} \\pi}{4} \\quad \\text { or } \\quad \\theta=\\frac{2 \\mathrm{n} \\pi}{3} \\pm \\frac{2 \\pi}{9} \\\\\n& \\quad \\theta=\\frac{2 \\pi}{9}, \\frac{\\pi}{4}, \\frac{4 \\pi}{9}, \\frac{\\pi}{2}, \\frac{3 \\pi}{4}, \\frac{8 \\pi}{9} \\ldots[\\because \\theta \\in(0, \\pi)]\n\\end{aligned}$\n$\\therefore \\quad$ Number of solutions $=6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b90279619d9d8a2ed3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "If $\\cos ^{-1} x-\\cos ^{-1} \\frac{y}{3}=\\alpha$, where $-1 \\leq x \\leq 1$, $-3 \\leq y \\leq 3, x \\leq \\frac{y}{3}$, then for all $x, y$ $9 x^2-6 x y \\cos \\alpha+y^2$ is equal to", "image": null}, "options": [{"id": "abjio", "text": "$\\sin ^2 \\alpha$", "image": null, "isCorrect": false}, {"id": "HNamg", "text": "$3\\sin ^2 \\alpha$", "image": null, "isCorrect": false}, {"id": "tB04E", "text": "$9\\sin ^2 \\alpha$", "image": null, "isCorrect": true}, {"id": "UrYar", "text": "$\\frac{4}{9} \\sin ^2 \\alpha$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\cos ^{-1} a-\\cos ^{-1} b=\\cos ^{-1}\\left(a b+\\sqrt{1-a^2} \\cdot \\sqrt{1-b^2}\\right) \\\\\n& \\therefore \\quad \\cos ^{-1} x-\\cos ^{-1} \\frac{y}{3} \\\\\n& =\\cos ^{-1}\\left(\\frac{x y}{3}+\\sqrt{1-x^2} \\cdot \\sqrt{1-\\frac{y^2}{9}}\\right)=\\alpha \\\\\n& \\therefore \\quad \\frac{x y}{3}+\\frac{\\sqrt{1-x^2} \\cdot \\sqrt{9-y^2}}{3}=\\cos \\alpha \\\\\n& \\quad x y+\\sqrt{1-x^2} \\cdot \\sqrt{9-y^2}=3 \\cos \\alpha \\\\\n& x y-3 \\cos \\alpha=-\\sqrt{1-x^2} \\cdot \\sqrt{9-y^2}\n\\end{aligned}$\nsquaring on both sides, we get\n$\\begin{aligned}\n& x^2 y^2-6 x y \\cos \\alpha+9 \\cos ^2 \\alpha=\\left(1-x^2\\right)\\left(9-y^2\\right) \\\\\n& x^2 y^2-6 x y \\cos \\alpha+9 \\cos ^2 \\alpha=9-y^2-9 x^2+x^2 y^2\n\\end{aligned}$\ni.e., $9 x^2-6 x y \\cos \\alpha+y^2=9 \\sin ^2 \\alpha$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a50279619d9d8a2e33", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "If $\\tan A=\\frac{1}{2}, \\tan B=\\frac{1}{3}$ then $\\tan (A+2 B)$ has the value", "image": null}, "options": [{"id": "qMF5c", "text": "2", "image": null, "isCorrect": true}, {"id": "D0SSd", "text": "3", "image": null, "isCorrect": false}, {"id": "xSVnc", "text": "4", "image": null, "isCorrect": false}, {"id": "E9tfT", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\tan A=\\frac{1}{2}, \\tan B=\\frac{1}{3}$\n[given] we have $\\tan 2 B=\\frac{2 \\tan B}{1-\\tan ^2 B}=\\frac{3}{4}$\n$\\because \\tan (A+2 B)=\\frac{\\tan A+\\tan 2 B}{1-\\tan A \\cdot \\tan 2 B}=\\frac{\\frac{1}{2}+\\frac{3}{4}}{1-\\frac{1}{2} \\times \\frac{3}{4}}=\\frac{\\frac{5}{4}}{\\frac{5}{8}}=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a40279619d9d8a2e30", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The principal solutions of the equation $\\sqrt{3} \\operatorname{cosec} X+2=0$ are", "image": null}, "options": [{"id": "7CLqG", "text": "$\\frac{2 \\pi}{3}, \\frac{5 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "NPkwY", "text": "$\\frac{4 \\pi}{3}, \\frac{5 \\pi}{3}$", "image": null, "isCorrect": true}, {"id": "wPdwH", "text": "$\\frac{\\pi}{3}, \\frac{2 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "FLuja", "text": "$\\frac{2 \\pi}{3}, \\frac{4 \\pi}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\sqrt{3} \\operatorname{cosec} x+2 \\\\ & \\Rightarrow \\sin x=-\\frac{\\sqrt{3}}{2}=-\\sin \\frac{\\pi}{3} \\\\ & \\Rightarrow x=\\pi+\\frac{\\pi}{3} \\text { or } 2 \\pi-\\frac{\\pi}{3} \\\\ & \\Rightarrow x=\\frac{4 \\pi}{3} \\text { or } \\frac{5 \\pi}{3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261930279619d9d8a2da9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "If $\\sin \\left(\\cot ^{-1}(x+1)\\right)=\\cos \\left(\\tan ^{-1} x\\right)$, then the value of $x$ is equal to", "image": null}, "options": [{"id": "i0egD", "text": "$-\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "BoLaJ", "text": "$-\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "oGWTT", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "TWmZe", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\sin \\left(\\cot ^{-1}(x+1)\\right)=\\cos \\left(\\tan ^{-1} x\\right) \\\\ & \\Rightarrow \\operatorname{sinsin}^{-1}\\left\\{\\frac{1}{\\sqrt{(x+1)^2+1}}\\right\\}=\\operatorname{coscos}^{-1}\\left\\{\\frac{1}{\\sqrt{x^2+1}}\\right\\} \\\\ & \\Rightarrow \\sqrt{x^2+1}=\\sqrt{x^2+2 x+2} \\\\ & \\Rightarrow x=\\frac{-1}{2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616b0279619d9d8a2c6c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "$\\tan \\left\\{\\frac{1}{2} \\cos ^{-1} \\frac{\\sqrt{5}}{3}\\right\\}$ has the value", "image": null}, "options": [{"id": "aHvQp", "text": "$\\frac{\\sqrt{5}}{6}$", "image": null, "isCorrect": false}, {"id": "y9VNG", "text": "$\\frac{\\sqrt{5}}{6}$", "image": null, "isCorrect": false}, {"id": "Wltkb", "text": "$\\frac{3-\\sqrt{5}}{2}$", "image": null, "isCorrect": true}, {"id": "wP2UP", "text": "$\\frac{3+\\sqrt{5}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\frac{1}{2} \\cos ^{-1} \\frac{\\sqrt{5}}{3}=\\theta$\n$\\cos 2 \\theta=\\frac{\\sqrt{5}}{3}$\nNow $\\tan \\left\\{\\frac{1}{2} \\cos ^{-1} \\frac{\\sqrt{5}}{3}\\right\\}$\n$\\begin{aligned}\n& =\\tan \\theta=\\sqrt{\\frac{1-\\cos 2 \\theta}{1+\\cos 2 \\theta}}=\\sqrt{\\frac{1-\\frac{\\sqrt{5}}{3}}{1+\\frac{\\sqrt{5}}{3}}}=\\sqrt{\\frac{3-\\sqrt{5}}{3+\\sqrt{5}}} \\\\\n& =\\sqrt{\\frac{3-\\sqrt{5}}{3+\\sqrt{5}} \\times \\frac{3-\\sqrt{5}}{3+\\sqrt{5}}}=\\sqrt{\\frac{(3-\\sqrt{5})^2}{3^2-5}}=\\frac{3-\\sqrt{5}}{2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261470279619d9d8a2b40", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "The value of $\\cos ^{-1}\\left(\\tan \\left(\\frac{7 \\pi}{4}\\right)\\right)$ is", "image": null}, "options": [{"id": "PXPZ8", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "dPGxi", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "fO2Ls", "text": "$\\pi$", "image": null, "isCorrect": true}, {"id": "UB5gm", "text": "$\\frac{2 \\pi}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\cos ^{-1}\\left(\\tan \\frac{7 \\pi}{4}\\right)=\\cos ^{-1} \\tan \\left(2 \\pi-\\frac{\\pi}{4}\\right)=\\cos -1\\left(-\\tan \\frac{\\pi}{4}\\right) \\\\ & =\\cos ^{-1}(-1) \\\\ & =\\pi\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261350279619d9d8a2ab2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "The principal solutions of $\\tan 3 \\theta=-1$ are", "image": null}, "options": [{"id": "DH7vy", "text": "$\\left\\{\\frac{\\pi}{4}, \\frac{7 \\pi}{12}, \\frac{11 \\pi}{12}, \\frac{5 \\pi}{4}, \\frac{19 \\pi}{12}, \\frac{23 \\pi}{12}\\right\\}$", "image": null, "isCorrect": true}, {"id": "IgBPH", "text": "$\\left\\{\\frac{\\pi}{4}, \\frac{7 \\pi}{12}, \\frac{11 \\pi}{12}, \\frac{\\pi}{16}, \\frac{19 \\pi}{12}, \\frac{23 \\pi}{24}\\right\\}$", "image": null, "isCorrect": false}, {"id": "kD0SA", "text": "$\\left\\{\\frac{\\pi}{4}, \\frac{\\pi}{12}\\right\\}$", "image": null, "isCorrect": false}, {"id": "EAn2j", "text": "$\\left\\{\\frac{\\pi}{4}, \\frac{\\pi}{12}, \\frac{13 \\pi}{12}, \\frac{7 \\pi}{4}, \\frac{19 \\pi}{4}, \\frac{23 \\pi}{12}\\right\\}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\tan 3 \\theta=-1=\\tan \\frac{3 \\pi}{4} \\\\ & \\Rightarrow 3 \\theta=n \\pi \\pm \\frac{3 \\pi}{4} \\\\ & \\Rightarrow \\theta=\\frac{n \\pi}{3} \\pm \\frac{\\pi}{4} \\\\ & \\Rightarrow \\theta \\in\\left\\{\\frac{\\pi}{4}, \\frac{7 \\pi}{12}, \\frac{11 \\pi}{12}, \\frac{15 \\pi}{2}, \\frac{19 \\pi}{12}, \\frac{23 \\pi}{12}\\right\\}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261230279619d9d8a2a1c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "If $\\cot (A+B)=0$, then $\\sin (A+2 B)$ is equal to", "image": null}, "options": [{"id": "LMS9f", "text": "$\\sin 2 A$", "image": null, "isCorrect": false}, {"id": "hfITG", "text": "$\\cos A$", "image": null, "isCorrect": false}, {"id": "KzLA7", "text": "$\\sin A$", "image": null, "isCorrect": true}, {"id": "PmISI", "text": "$\\cos 2 A$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\cot (A+B)=0 \\Rightarrow A+B=(2 n+1) \\frac{\\pi}{2} \\Rightarrow B=(2 n+1) \\frac{\\pi}{2}-A$\nNow, $\\sin (A+2 B)=\\sin (A+(2 n+1) \\pi-2 A)$\n$=\\sin ((2 n+1) \\pi-A)=\\sin A$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c40279619d9d8a2727", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "The principal solution of $\\cot x=\\sqrt{3}$ are", "image": null}, "options": [{"id": "Pd1Cn", "text": "$\\frac{\\pi}{6}, \\frac{5 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "wmC0t", "text": "$\\frac{\\pi}{4}, \\frac{5 \\pi}{4}$", "image": null, "isCorrect": false}, {"id": "8bi9Q", "text": "$\\frac{\\pi}{6}, \\frac{7 \\pi}{6}$", "image": null, "isCorrect": true}, {"id": "nxOMA", "text": "$\\frac{\\pi}{3}, \\frac{7 \\pi}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\cot x=\\sqrt{3} \\quad \\Rightarrow \\quad \\tan x=\\frac{1}{\\sqrt{3}} \\\\ & \\therefore \\frac{1}{\\sqrt{3}}=\\tan \\left(\\pi+\\frac{\\pi}{6}\\right)=\\tan \\left(\\frac{\\pi}{6}\\right) \\\\ & \\Rightarrow \\frac{1}{\\sqrt{3}}=\\tan \\left(\\frac{7 \\pi}{6}\\right)=\\tan \\left(\\frac{\\pi}{6}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260af0279619d9d8a2680", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "If $\\tan ^{-1}\\left[\\frac{\\sqrt{1+x^2}-\\sqrt{1-x^2}}{\\sqrt{1+x^2}+\\sqrt{1-x^2}}\\right]=\\alpha$, then the value of $\\sin 2 \\alpha$ is", "image": null}, "options": [{"id": "knVv4", "text": "$x^3$", "image": null, "isCorrect": false}, {"id": "y0kqt", "text": "$\\sqrt{\\mathrm{x}}$", "image": null, "isCorrect": false}, {"id": "PCtTh", "text": "$\\mathrm{x}$", "image": null, "isCorrect": false}, {"id": "ZKXr6", "text": "$\\mathrm{x}^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have $\\tan \\alpha=\\left[\\frac{\\sqrt{1+x^2}-\\sqrt{1-x^2}}{\\sqrt{1+x^2}+\\sqrt{1-x^2}}\\right]$\nPut $x^2=\\cos \\theta$\n$$\n\\begin{aligned}\n& \\therefore \\tan \\alpha=\\frac{\\sqrt{2 \\cos ^2 \\frac{\\theta}{2}-\\sqrt{2 \\sin ^2 \\frac{\\theta}{2}}}}{\\sqrt{2 \\cos ^2 \\frac{\\theta}{2}+\\sqrt{2 \\sin ^2 \\frac{\\theta}{2}}}} \\\\\n& \\therefore \\tan \\alpha=\\frac{\\cos \\frac{\\theta}{2}-\\sin \\frac{\\theta}{2}}{\\cos \\frac{\\theta}{2}-\\sin \\frac{\\theta}{2}}=\\frac{1-\\tan \\frac{\\theta}{2}}{1+\\tan \\frac{\\theta}{2}}=\\tan \\left(\\frac{\\pi}{4}-\\frac{\\theta}{2}\\right) \\\\\n& \\therefore \\alpha=\\frac{\\pi}{4}-\\frac{\\theta}{2} \\Rightarrow 2 \\alpha=\\frac{\\pi}{2}-\\theta \\\\\n& \\therefore \\sin 2 \\alpha=\\sin \\left(\\frac{\\pi}{2}-\\theta\\right)=\\cos \\theta=x^2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260570279619d9d8a23b5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "If $\\frac{\\cos (A+B)}{\\cos (A-B)}=\\frac{\\sin (C+D)}{\\sin (C-D)}$, then $\\tan A \\tan B \\tan C=$", "image": null}, "options": [{"id": "wQDVg", "text": "0", "image": null, "isCorrect": false}, {"id": "08fBv", "text": "$\\tan \\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "iFRNR", "text": "$\\cot D$", "image": null, "isCorrect": false}, {"id": "e7z8R", "text": "$-\\tan D$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\frac{\\cos (A+B)}{\\cos (A-B)}=\\frac{\\sin (C+D)}{\\sin (C-D)}\n$$\nBy Componendo - Dividendo, we write\n$$\n\\begin{aligned}\n& \\frac{\\cos (A+B)+\\cos (A-B)}{\\cos (A+B)-\\cos (A-B)}=\\frac{\\sin (C+D)+\\sin (C-D)}{\\sin (C+D)-\\sin (C-D)} \\\\\n& \\frac{2 \\cos A \\cos B}{-2 \\sin A \\sin B}=\\frac{2 \\sin C \\cos D}{2 \\cos C \\sin D} \\\\\n& \\therefore \\frac{1}{-\\tan A \\tan B}=\\frac{\\tan C}{\\tan D} \\Rightarrow \\tan A \\tan B \\tan C=-\\tan D\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260520279619d9d8a238e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "If $2 \\sin \\left(\\theta+\\frac{\\pi}{3}\\right)=\\cos \\left(\\theta-\\frac{\\pi}{6}\\right)$, then $\\tan \\theta$", "image": null}, "options": [{"id": "ZDQie", "text": "$\\frac{-1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "Rxj01", "text": "$-\\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "Jiwtj", "text": "$\\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "LRIEC", "text": "$\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& 2 \\sin \\left(\\theta+\\frac{\\pi}{3}\\right)=\\cos \\left(\\theta-\\frac{\\pi}{6}\\right) \\\\\n& 2\\left[\\sin \\theta \\cos \\frac{\\pi}{3}+\\cos \\theta \\sin \\frac{\\pi}{3}\\right]=\\left(\\cos \\theta \\cos \\frac{\\pi}{6}+\\sin \\theta \\sin \\frac{\\pi}{6}\\right) \\\\\n& \\therefore 2\\left(\\frac{\\sin \\theta}{2}+\\frac{\\sqrt{3} \\cos \\theta}{2}\\right)=\\left(\\frac{\\sqrt{3} \\cos \\theta}{2}+\\frac{\\sin \\theta}{2}\\right) \\\\\n& \\therefore\\left(\\frac{\\sin \\theta}{2}+\\frac{\\sqrt{3} \\cos \\theta}{2}\\right)=0 \\Rightarrow \\sin \\theta+\\sqrt{3} \\cos \\theta=0 \\Rightarrow \\tan \\theta=-\\sqrt{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260420279619d9d8a230a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "If $\\sec x=\\frac{25}{24}$ and $x$ lies in first quadrant, then $\\sin \\frac{x}{2}+\\cos \\frac{x}{2}=$", "image": null}, "options": [{"id": "gnyyN", "text": "$\\frac{6}{5 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "G9qsW", "text": "$\\frac{8}{5 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "vKtgu", "text": "$\\frac{7}{5 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "IgYSd", "text": "$\\frac{1}{5 \\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $\\cos x=\\frac{24}{25} \\Rightarrow \\sin x=\\frac{7}{25} \\ldots\\left[\\because x\\right.$ lies in $1^{\\text {st }}$ quadrant $]$ Also $\\left(\\sin \\frac{x}{2}+\\cos \\frac{x}{2}\\right)^2=1+\\sin x=1+\\frac{7}{25}=\\frac{32}{25}$\n$$\n\\therefore \\sin \\frac{x}{2}+\\cos \\frac{x}{2}=\\sqrt{\\frac{32}{25}}=\\frac{4 \\sqrt{2}}{5}=\\frac{8}{5 \\sqrt{2}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260410279619d9d8a2300", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "The principal solutions of $\\sqrt{3} \\sec x+2=0$ are", "image": null}, "options": [{"id": "PIuka", "text": "$\\frac{\\pi}{6}, \\frac{5 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "hBEKc", "text": "$\\frac{5 \\pi}{6}, \\frac{7 \\pi}{6}$", "image": null, "isCorrect": true}, {"id": "fBjv5", "text": "$\\frac{\\pi}{3}, \\frac{2 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "st3KZ", "text": "$\\frac{2 \\pi}{3}, \\frac{4 \\pi}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\sqrt{3} \\sec x+2=0 \\\\\n& \\therefore \\sec x=\\frac{-2}{\\sqrt{3}} \\Rightarrow \\cos x=\\frac{-\\sqrt{3}}{2} \\\\\n& \\therefore \\cos x=\\cos \\left(\\pi-\\frac{\\pi}{6}\\right)=\\cos \\left(\\pi+\\frac{\\pi}{6}\\right) \\Rightarrow x=\\frac{5 \\pi}{6}, \\frac{7 \\pi}{6}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260310279619d9d8a2282", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "If $x \\in\\left(0, \\frac{\\pi}{2}\\right)$ and $x$ satisfies the equation $\\sin x \\cos x=\\frac{1}{4}$, then the values of $x$ are", "image": null}, "options": [{"id": "mEzrZ", "text": "$\\frac{\\pi}{12}, \\frac{5 \\pi}{12}$", "image": null, "isCorrect": true}, {"id": "qFSTM", "text": "$\\frac{\\pi}{8}, \\frac{3 \\pi}{8}$", "image": null, "isCorrect": false}, {"id": "5FsYd", "text": "$\\frac{\\pi}{8}, \\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "YczG2", "text": "$\\frac{\\pi}{6}, \\frac{\\pi}{12}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\sin x \\cos x=\\frac{1}{4} \\\\ & \\therefore 2 \\sin x \\cos x=\\frac{2}{4}=\\frac{1}{2} \\Rightarrow \\sin 2 x=\\frac{1}{2}=\\sin 30^{\\circ} \\\\ & \\therefore 2 x=30^{\\circ}=\\frac{\\pi}{6} \\Rightarrow x=\\frac{\\pi}{12} \\\\ & \\therefore x=\\frac{\\pi}{2} \\pm \\frac{\\pi}{12} \\Rightarrow x=\\frac{\\pi}{2}+\\frac{\\pi}{12} \\text { or } x=\\frac{\\pi}{2}-\\frac{\\pi}{12} \\\\ & \\therefore x=\\frac{7 \\pi}{12} \\text { or } \\frac{5 \\pi}{12} \\Rightarrow x=\\frac{\\pi}{12}, \\frac{\\pi}{12} \\quad \\ldots\\left[\\because x \\in\\left(0, \\frac{\\pi}{2}\\right)\\right]\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff60279619d9d8a20a4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "If $2 \\cos ^{2} \\theta+3 \\cos \\theta=2$, then permissible value of $\\cos \\theta$ is", "image": null}, "options": [{"id": "cBn6L", "text": "0", "image": null, "isCorrect": false}, {"id": "EhkqX", "text": "1", "image": null, "isCorrect": false}, {"id": "hI2pd", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "4Xl1B", "text": "$\\frac{-1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\nWe have $2 \\cos ^{2} \\theta+3 \\cos \\theta=2$\n$2 \\cos ^{2} \\theta+4 \\cos \\theta-\\cos \\theta-2=0 \\Rightarrow 2 \\cos \\theta(\\cos \\theta+2)-1(\\cos \\theta+2)=0$\n$(2 \\cos \\theta-1)(\\cos \\theta+2)=0$\n$\\therefore \\cos \\theta=\\frac{1}{2},-2($ Impossible $) \\Rightarrow \\cos \\theta=\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe80279619d9d8a2034", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The general solutions of $\\sin ^{2} x \\cdot \\sec x=\\tan x-\\sin x+1$ is", "image": null}, "options": [{"id": "K0mfy", "text": "$x=n \\pi+(-1)^{n} \\frac{\\pi}{4}$ or $x=m \\pi+\\frac{3 \\pi}{4} ; m, n \\in z$", "image": null, "isCorrect": fals rac{2 \\sqrt{2}}{3}\\right)\\right] \\Rightarrow \\sin (x+y)+\\cos (x+y)=\\frac{2 \\sqrt{2}}{3}$\nDifferentiating both sides. w.r.t. $\\mathrm{x}$\n$\\begin{array}{l}\n\\cos (x+y)\\left(1+\\frac{d y}{d x}\\right)-s \\\\\nx+y=\\tan ^{-1}(1)=\\frac{\\pi}{4}\n\\end{array}$\nDifferentiating w.r.t. $x$, we get\n$1+\\frac{d y}{d x}=0 \\Rightarrow \\frac{d y}{d x}=-1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fad0279619d9d8a1e65", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "If $\\sin x+\\sin ^{2} x=1$, then $\\cos ^{8} x+2 \\cos ^{6} x+\\cos ^{4} x$ is", "image": null}, "options": [{"id": "hGixM", "text": "3", "image": null, "isCorrect": false}, {"id": "iVuV1", "text": "2", "image": null, "isCorrect": false}, {"id": "9NUbZ", "text": "1", "image": null, "isCorrect": true}, {"id": "hf3oF", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\sin x+\\sin ^{2} x=1 \\Rightarrow \\sin x=1-\\sin ^{2} x$\n$\\begin{aligned} \\therefore \\sin x=\\cos ^{2} x \\Rightarrow \\sin ^{2} x &=\\cos ^{4} x \\\\ \\cos ^{8} x+2 \\cos ^{6} x+\\cos ^{4} x &=\\left(\\cos ^{4} x+\\cos ^{2} x\\right)^{2} \\\\ &=\\left(\\sin ^{2} x+\\cos ^{2} x\\right)^{2}=1 \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e" rmal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>x</mi><mo>=</mo><mn>0</mn><mo>,</mo></mrow></mrow></mrow></mrow></math> where <math><mi>π</mi><mo>&lt;</mo><mi>x</mi><mo>&lt;</mo><mn>2</mn><mi>π</mi></math> are", "image": null}, "options": [{"id": "3D3o1", "text": "<math > <mrow>  <mfrac>   <mrow>    <mn>7</mn><mi>&#x03C0;</mi>   </mrow>   <mn>8</mn>  </mfrac>  <mo>,</mo><mfrac>   <mrow>    <mn>11</mn><mi>&#x03C0;</mi>   </mrow>   <mn>8</mn>  </mfrac>   </mrow></math>", "image": null, "isCorrect": false}, {"id": "67B64", "text": "<math > <mrow>  <mfrac>   <mrow>    <mn>9</mn><mi>&#x03C0;</mi>   </mrow>   <mn>8</mn>  </mfrac>  <mo>,</mo><mi>&#x00A0;</mi><mfrac>   <mrow>    <mn>13</mn><mi>&#x03C0;</mi>   </mrow>   <mn>8</mn>  </mfrac>   </mrow></math>", "image": null, "isCorrect": false}, {"id": "j8bYI", "text": "<math > <mrow>  <mfrac>   <mrow>    <mn>11</mn><mi>&#x03C0;</mi>   </mrow>   <mn>8</mn>  </mfrac>  <mo>,</mo><mi>&#x00A0;</mi><mfrac>   <mrow>    <mn>15</mn><mi>&#x03C0;</mi>   </mrow>   <mn>8</mn>  </mfrac>   </mrow></math>", "image": null, "isCorrect": true}, {"id": "3JQOi", "text": "<math > <mrow>  <mfrac>   <mrow>    <mn>15</mn><mi>&#x03C0;</mi>   </mrow>   <mn>8</mn>  </mfrac>  <mo>,</mo><mi>&#x00A0;</mi><mfrac>   <mrow>    <mn>19</mn><mi>&#x03C0;</mi>   </mrow>   <mn>8</mn>  </mfrac>   </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,<br /><math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>x</mi></mrow></mrow><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>x</mi></mrow></mrow><mo>=</mo><mn>0</mn></math> .<br />Multiplying by <math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></math> on both side,<br /><math><mo>∴</mo><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>x</mi></mrow></mrow><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>x</mi></mrow></mrow><mo>=</mo><mn>0</mn></math><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mn>2</mn><mi>x</mi></mrow></mfenced><mo>=</mo><mn>0</mn></mrow></mrow></math><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mn>2</mn><mi>x</mi><mo>+</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mi>n</mi><mi>π</mi></math><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>x</mi><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>4</mn><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mi>π</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>x</mi><mo>=</mo><mfrac><mrow><mn>11</mn><mi>π</mi></mrow><mrow><mn>8</mn></mrow></mfrac><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&nbsp;</mi><mfrac><mrow><mn>15</mn><mi>π</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2634e0279619d9d8a3e01", "title": "Solving Trigonometric Inequalities", "totalQuestions": 8, "questions": [{"_id": "6792143b0aee93fa0796df04", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The number of values of $x$ in the interval $(0,5 \\pi)$ satisfying the equation $3 \\sin ^2 x-7 \\sin x+2=0$", "image": null}, "options": [{"id": "YyUxi", "text": "0", "image": null, "isCorrect": false}, {"id": "Ocusy", "text": "5", "image": null, "isCorrect": false}, {"id": "JYcHn", "text": "6", "image": null, "isCorrect": true}, {"id": "78A1y", "text": "10", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation: $3 \\sin^2 x - 7 \\sin x + 2 = 0$<br><br>Factorizing the quadratic equation in terms of $\\sin x$:<br><br>$3 \\sin^2 x - 6 \\sin x - \\sin x + 2 = 0$<br><br>$3 \\sin x (\\sin x - 2) - 1 (\\sin x - 2) = 0$<br><br>$(3 \\sin x - 1)(\\sin x - 2) = 0$<br><br>$\\sin x = \\dfrac{1}{3}$ or $\\sin x = 2$<br><br>Since the range of $\\sin x$ is $[-1, 1]$, $\\sin x = 2$ is not possible. Thus, we only consider $\\sin x = \\dfrac{1}{3}$.<br><br>We need to find the number of solutions in the interval $(0, 5\\pi)$.<br><br>In the interval $(0, \\pi)$, $\\sin x = \\dfrac{1}{3}$ has $2$ solutions (one in the first quadrant and one in the second quadrant).<br><br>In the interval $(\\pi, 2\\pi)$, $\\sin x$ is negative, so there are $0$ solutions.<br><br>In the interval $(2\\pi, 3\\pi)$, $\\sin x = \\dfrac{1}{3}$ has $2$ solutions.<br><br>In the interval $(3\\pi, 4\\pi)$, $\\sin x$ is negative, so there are $0$ solutions.<br><br>In the interval $(4\\pi, 5\\pi)$, $\\sin x = \\dfrac{1}{3}$ has $2$ solutions.<br><br>Total number of solutions in $(0, 5\\pi)$ is $2 + 0 + 2 + 0 + 2 = 6$.<br><br>Answer: 6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143a0aee93fa0796defb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Let $P=\\{\\theta / \\sin \\theta-\\cos \\theta=\\sqrt{2} \\cos \\theta\\}$ and $Q=\\{\\theta / \\sin \\theta+\\cos \\theta=\\sqrt{2} \\sin \\theta\\}$ be two sets, then", "image": null}, "options": [{"id": "m2tcJ", "text": "$\\mathrm{P} \\subset \\mathrm{Q}$ and $\\mathrm{Q}-\\mathrm{P} \\neq \\phi$", "image": null, "isCorrect": false}, {"id": "mpd0z", "text": "$\\mathrm{Q} \\not \\subset \\mathrm{P}$", "image": null, "isCorrect": false}, {"id": "q2tgP", "text": "$\\mathrm{P} \\not \\subset \\mathrm{Q}$", "image": null, "isCorrect": false}, {"id": "hMZ34", "text": "$\\quad \\mathrm{P}=\\mathrm{Q}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For set $P$:<br><br>$\\sin \\theta - \\cos \\theta = \\sqrt{2} \\cos \\theta$<br><br>$\\sin \\theta = (\\sqrt{2} + 1) \\cos \\theta$<br><br>$\\tan \\theta = \\sqrt{2} + 1$<br><br>For set $Q$:<br><br>$\\sin \\theta + \\cos \\theta = \\sqrt{2} \\sin \\theta$<br><br>$\\cos \\theta = (\\sqrt{2} - 1) \\sin \\theta$<br><br>$\\tan \\theta = \\dfrac{1}{\\sqrt{2} - 1}$<br><br>Rationalizing the denominator:<br><br>$\\tan \\theta = \\dfrac{\\sqrt{2} + 1}{(\\sqrt{2} - 1)(\\sqrt{2} + 1)} = \\sqrt{2} + 1$<br><br>Since the conditions for both sets simplify to $\\tan \\theta = \\sqrt{2} + 1$, the elements of both sets are identical.<br><br>Therefore, $P = Q$.<br><br>Answer: $\\quad \\mathrm{P}=\\mathrm{Q}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214260aee93fa0796de5e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The solution set of the equation $\\tan x+\\sec x=2 \\cos x$, in the interval $[0,2 \\pi]$ is", "image": null}, "options": [{"id": "SdSo4", "text": "$\\left\\{\\frac{\\pi}{6}, \\frac{7 \\pi}{6}\\right\\}$", "image": null, "isCorrect": false}, {"id": "wfbkD", "text": "$\\left\\{\\frac{5 \\pi}{6}, \\frac{7 \\pi}{6}\\right\\}$", "image": null, "isCorrect": false}, {"id": "S1phK", "text": "$\\left\\{\\frac{\\pi}{6}, \\frac{5 \\pi}{6}\\right\\}$", "image": null, "isCorrect": true}, {"id": "gAuIX", "text": "$\\left\\{\\frac{5 \\pi}{6}, \\frac{11 \\pi}{6}\\right\\}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is $\\tan x + \\sec x = 2 \\cos x$.<br><br>Rewriting in terms of sine and cosine:<br><br>$\\dfrac{\\sin x}{\\cos x} + \\dfrac{1}{\\cos x} = 2 \\cos x$<br><br>$\\dfrac{\\sin x + 1}{\\cos x} = 2 \\cos x$<br><br>Assuming $\\cos x \\neq 0$, multiplying both sides by $\\cos x$ gives:<br><br>$\\sin x + 1 = 2 \\cos^2 x$<br><br>Using the identity $\\cos^2 x = 1 - \\sin^2 x$:<br><br>$\\sin x + 1 = 2(1 - \\sin^2 x)$<br><br>$\\sin x + 1 = 2 - 2 \\sin^2 x$<br><br>$2 \\sin^2 x + \\sin x - 1 = 0$<br><br>Factorizing the quadratic equation:<br><br>$(2 \\sin x - 1)(\\sin x + 1) = 0$<br><br>This gives $\\sin x = \\dfrac{1}{2}$ or $\\sin x = -1$.<br><br>If $\\sin x = -1$, then $\\cos x = 0$, which makes $\\tan x$ and $\\sec x$ undefined. Thus, $\\sin x = -1$ is rejected.<br><br>For $\\sin x = \\dfrac{1}{2}$ in the interval $[0, 2\\pi]$:<br><br>$x = \\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}$<br><br>The solution set is $\\left\\{\\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}\\right\\}$.<br><br>Answer: $\\left\\{\\frac{\\pi}{6}, \\frac{5 \\pi}{6}\\right\\}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b30aee93fa0796dad5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Let $2 \\sin ^2 x+3 \\sin x-2\\gt0$ and $x^2-x-2 \\lt 0$ ( $x$ is measured in radians).\r\nThen $x$ lies in the interval", "image": null}, "options": [{"id": "MT2nr", "text": "$\\left(\\dfrac{\\pi}{6}, \\dfrac{5 \\pi}{6}\\right)$", "image": null, "isCorrect": false}, {"id": "j6x75", "text": "$\\left(-1, \\dfrac{5 \\pi}{6}\\right)$", "image": null, "isCorrect": false}, {"id": "9lWPh", "text": "$(-1,2)$", "image": null, "isCorrect": false}, {"id": "actat", "text": "$\\left(\\dfrac{\\pi}{6}, 2\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given the inequality $x^2 - x - 2 < 0$<br><br>$(x - 2)(x + 1) < 0$<br><br>$x \\in (-1, 2)$<br><br>Now, considering the trigonometric inequality $2 \\sin^2 x + 3 \\sin x - 2 > 0$<br><br>$2 \\sin^2 x + 4 \\sin x - \\sin x - 2 > 0$<br><br>$2 \\sin x (\\sin x + 2) - 1 (\\sin x + 2) > 0$<br><br>$(2 \\sin x - 1)(\\sin x + 2) > 0$<br><br>Since $-1 \\le \\sin x \\le 1$, we have $\\sin x + 2 > 0$ for all real $x$.<br><br>Therefore, $2 \\sin x - 1 > 0$<br><br>$\\sin x > \\dfrac{1}{2}$<br><br>The general solution for this inequality is $x \\in \\left(2n\\pi + \\dfrac{\\pi}{6}, 2n\\pi + \\dfrac{5\\pi}{6}\\right)$ for any integer $n$.<br><br>For $n = 0$, the interval is $\\left(\\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}\\right)$.<br><br>We need to find the intersection of $x \\in (-1, 2)$ and $x \\in \\left(\\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}\\right)$.<br><br>Since $\\dfrac{\\pi}{6} \\approx 0.52$ and $\\dfrac{5\\pi}{6} \\approx 2.62$, the value $2$ lies between $\\dfrac{\\pi}{6}$ and $\\dfrac{5\\pi}{6}$.<br><br>Taking the intersection of $(-1, 2)$ and $\\left(\\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}\\right)$, we get $x \\in \\left(\\dfrac{\\pi}{6}, 2\\right)$.<br><br>Answer: $\\left(\\dfrac{\\pi}{6}, 2\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213560aee93fa0796d7fd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Let $2 \\sin ^2 x+3 \\sin x-2\\gt0$ and $x^2-x-2 \\lt 0$. ( $x$ is measured in radians). The $x$ lies in the interval", "image": null}, "options": [{"id": "TzZVu", "text": "$\\left(\\dfrac{\\pi}{6}, \\dfrac{5 \\pi}{6}\\right)$", "image": null, "isCorrect": false}, {"id": "bhhiq", "text": "$\\left(-1, \\dfrac{5 \\pi}{6}\\right)$", "image": null, "isCorrect": false}, {"id": "MNWOU", "text": "$(-1,2)$", "image": null, "isCorrect": false}, {"id": "nwWfk", "text": "$\\left(\\dfrac{\\pi}{6}, 2\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $x^2 - x - 2 < 0$<br><br>$(x - 2)(x + 1) < 0$<br><br>$x \\in (-1, 2)$<br><br>Also given $2 \\sin^2 x + 3 \\sin x - 2 > 0$<br><br>$(2 \\sin x - 1)(\\sin x + 2) > 0$<br><br>Since $\\sin x + 2 > 0$ for all real $x$, we have:<br><br>$2 \\sin x - 1 > 0 \\Rightarrow \\sin x > \\dfrac{1}{2}$<br><br>The solution for $\\sin x > \\dfrac{1}{2}$ in the principal domain is $x \\in \\left(\\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}\\right)$.<br><br>We need the intersection of $x \\in (-1, 2)$ and $x \\in \\left(\\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}\\right)$.<br><br>Since $\\dfrac{\\pi}{6} \\approx 0.52$ and $\\dfrac{5\\pi}{6} \\approx 2.62$, the value $2$ lies between $\\dfrac{\\pi}{6}$ and $\\dfrac{5\\pi}{6}$.<br><br>Therefore, the common interval is $\\left(\\dfrac{\\pi}{6}, 2\\right)$.<br><br>Answer: $\\left(\\dfrac{\\pi}{6}, 2\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132d0aee93fa0796d6b9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The value of $\\cos \\left(2 \\cos ^{-1} x+\\sin ^{-1} x\\right)$ at $x=\\dfrac{1}{5}$, where $0 \\leq \\cos ^{-1} x \\leq \\pi$ and $-\\dfrac{\\pi}{2} \\leq \\sin ^{-1} x \\leq \\dfrac{\\pi}{2}$, is", "image": null}, "options": [{"id": "Re1yC", "text": "$\\dfrac{\\sqrt{6}}{5}$", "image": null, "isCorrect": false}, {"id": "Kfg2q", "text": "$-\\dfrac{\\sqrt{6}}{5}$", "image": null, "isCorrect": false}, {"id": "q5wi2", "text": "$\\dfrac{2 \\sqrt{6}}{5}$", "image": null, "isCorrect": false}, {"id": "Fzvjn", "text": "$-\\dfrac{2 \\sqrt{6}}{5}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given expression is $\\cos \\left(2 \\cos ^{-1} x+\\sin ^{-1} x\\right)$<br><br>Using the inverse trigonometric identity $\\cos^{-1} x + \\sin^{-1} x = \\dfrac{\\pi}{2}$, the expression can be rewritten as:<br><br>$\\cos \\left(\\cos ^{-1} x + \\left(\\cos ^{-1} x + \\sin ^{-1} x\\right)\\right)$<br><br>$= \\cos \\left(\\cos ^{-1} x + \\dfrac{\\pi}{2}\\right)$<br><br>Using $\\cos \\left(\\dfrac{\\pi}{2} + \\theta\\right) = -\\sin \\theta$, we get:<br><br>$= -\\sin \\left(\\cos ^{-1} x\\right)$<br><br>Since $\\sin(\\cos^{-1} x) = \\sqrt{1 - x^2}$ for $x \\in [-1, 1]$, the expression becomes:<br><br>$= -\\sqrt{1 - x^2}$<br><br>Substituting $x = \\dfrac{1}{5}$:<br><br>$= -\\sqrt{1 - \\left(\\dfrac{1}{5}\\right)^2}$<br><br>$= -\\sqrt{1 - \\dfrac{1}{25}}$<br><br>$= -\\sqrt{\\dfrac{24}{25}}$<br><br>$= -\\dfrac{2\\sqrt{6}}{5}$<br><br>Answer: $-\\dfrac{2 \\sqrt{6}}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262160279619d9d8a31ae", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "If $\\mathrm{a}$ and $\\mathrm{b}$ are positive number such that $\\mathrm{a}>\\mathrm{b}$, then the minimum value of $a \\sec \\theta-b \\tan \\theta\\left(0 < \\theta < \\frac{\\pi}{2}\\right)$ is", "image": null}, "options": [{"id": "K3Idh", "text": "$\\frac{1}{\\sqrt{a^2-b^2}}$", "image": null, "isCorrect": false}, {"id": "Bd1Br", "text": "$\\frac{1}{\\sqrt{a^2+b^2}}$", "image": null, "isCorrect": false}, {"id": "OlTk7", "text": "$\\sqrt{a^2+b^2}$", "image": null, "isCorrect": false}, {"id": "5GmyD", "text": "$\\sqrt{a^2-b^2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { let } \\mathrm{f}(\\theta)=\\mathrm{a} \\sec \\theta-b \\tan \\theta \\\\ & \\therefore \\quad \\mathrm{f}^{\\prime}(\\theta)=\\mathrm{a} \\sec \\theta \\tan \\theta-b \\sec ^2 \\theta \\\\ & \\quad=\\sec \\theta(\\mathrm{a} \\tan \\theta-\\mathrm{b} \\sec \\theta) \\\\ & \\therefore \\quad \\mathrm{f}^{\\prime}(\\theta)=0 \\Rightarrow \\sec \\theta(\\mathrm{a} \\tan \\theta-\\mathrm{b} \\sec \\theta)=0 \\\\ & \\Rightarrow \\mathrm{a} \\tan \\theta-\\mathrm{b} \\sec \\theta=0 \\quad \\ldots\\left[\\text { As } 0 < \\pi < \\frac{\\pi}{2}, \\sec \\theta \\neq 0\\right] \\\\ & \\\\ & \\Rightarrow \\mathrm{a} \\sin \\theta-b=0 \\quad \\ldots\\left[\\text { As } 0 < \\pi < \\frac{\\pi}{2}, \\cos \\theta \\neq 0\\right]\\end{aligned}$\n$\\begin{aligned}\n& \\Rightarrow \\sin \\theta=\\frac{b}{a} \\\\\n& \\Rightarrow \\sec \\theta=\\frac{a}{\\sqrt{a^2-b^2}} \\text { and } \\tan \\theta=\\frac{b}{\\sqrt{a^2-b^2}}\n\\end{aligned}$\nNow,\n$\\begin{aligned}\n& \\mathrm{f}^{\\prime \\prime}(\\theta)=\\sec \\theta \\tan \\theta(\\mathrm{a} \\tan \\theta-\\mathrm{b} \\sec \\theta) \\\\\n& +\\sec \\theta\\left(a \\sec ^2 \\theta-b \\sec \\theta \\tan \\theta\\right) \\\\\n& =\\mathrm{a} \\tan ^2 \\theta \\sec \\theta-\\mathrm{b} \\sec ^2 \\theta \\tan \\theta \\\\\n& +a \\sec ^3 \\theta-b \\sec ^2 \\theta \\tan \\theta \\\\\n& =a \\sec \\theta\\left(\\tan ^2 \\theta+\\sec ^2 \\theta\\right) \\\\\n& =a \\sec \\theta\\left(1+2 \\tan ^2 \\theta\\right) \\\\\n& >0 \\quad \\ldots\\left[\\because \\text { a is positive and } 0 < \\theta < \\frac{\\pi}{2}\\right] \\\\\n&\n\\end{aligned}$\n$\\therefore \\\\f(\\theta)$ is minimum when $\\sin \\theta=\\frac{b}{a}$.\n$\\begin{aligned}\\therefore \\\n& \\text { Minimum value of } f(\\theta) \\\\\n& =a\\left(\\frac{a}{\\sqrt{a^2-b^2}}\\right)-b\\left(\\frac{b}{\\sqrt{a^2-b^2}}\\right) \\quad \\ldots[\\text { From (i) }] \\\\\n& =\\frac{a^2-b^2}{\\sqrt{a^2-b^2}} \\\\\n& =\\sqrt{a^2-b^2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a10279619d9d8a2e16", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The set of all possible values of $\\theta$ in the interval $(0, \\pi)$ for which the points $(1,2)$ and $(\\sin \\theta, \\cos \\theta)$ lie on the same side of the line $x+y=1$, is <img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2YHsCwGH_sOS3PnUI5HKcdWkXdDC0_6yPzLkH9pfCTA.original.fullsize.png\"><br>.", "image": null}, "options": [{"id": "xYCMK", "text": "$\\left(0, \\frac{\\pi}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "6WnOl", "text": "$\\left(0, \\frac{\\pi}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "rjsk7", "text": "$\\left(0, \\frac{3 \\pi}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "TV8mY", "text": "$\\left(\\frac{\\pi}{4}, \\frac{3 \\pi}{4}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "for lying on the same side $(\\sin \\theta+\\cos \\theta-1)(1+2-1)>0$\n$\\begin{aligned}\n& \\Rightarrow \\sin \\theta+\\cos \\theta>1 \\\\\n& \\Rightarrow \\frac{1}{\\sqrt{2}} \\sin \\theta+\\frac{1}{\\sqrt{2}} \\cos \\theta>\\frac{1}{\\sqrt{2}}\n\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/7obTIOC-1a3-7e6CH0Lpr8zC4Q9Nl4OmV-1j9i33Rns.original.fullsize.png\"><br>\n$\\begin{aligned} & \\Rightarrow \\sin \\left(\\theta+\\frac{\\pi}{4}\\right)>\\frac{1}{\\sqrt{2}} \\\\ & \\Rightarrow \\frac{\\pi}{4} < \\theta+\\frac{\\pi}{4} < \\frac{3 \\pi}{4} \\\\ & \\Rightarrow 0 < \\theta < \\frac{\\pi}{2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
