mage": null}], "correctValue": null, "solution": {"text": "The given equation is $\\tan x + \\sec x = 2\\cos x$.<br><br>Rewriting in terms of sine and cosine, we get:<br><br>$\\dfrac{\\sin x}{\\cos x} + \\dfrac{1}{\\cos x} = 2\\cos x$<br><br>For the equation to be defined, $\\cos x \\neq 0$. Multiplying both sides by $\\cos x$ gives:<br><br>$\\sin x + 1 = 2\\cos^2 x$<br><br>Using the identity $\\cos^2 x = 1 - \\sin^2 x$, we have:<br><br>$\\sin x + 1 = 2(1 - \\sin^2 x)$<br><br>$2\\sin^2 x + \\sin x - 1 = 0$<br><br>Factoring the quadratic equation in terms of $\\sin x$:<br><br>$(2\\sin x - 1)(\\sin x + 1) = 0$<br><br>This yields $\\sin x = \\dfrac{1}{2}$ or $\\sin x = -1$.<br><br>If $\\sin x = -1$, then $\\cos x = 0$, which makes $\\tan x$ and $\\sec x$ undefined. Thus, we reject $\\sin x = -1$.<br><br>For $\\sin x = \\dfrac{1}{2}$, the principal value is $\\dfrac{\\pi}{6}$.<br><br>The general solution is:<br><br>$x = n\\pi + (-1)^n\\left(\\dfrac{\\pi}{6}\\right), \\quad n \\in Z$<br><br>Answer: $x = n\\pi + (-1)^n\\left(\\dfrac{\\pi}{6}\\right),\\quad n \\in Z$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c615a9fc0fc8c146dd", "type": "singleCorrect", "question": {"text": "If $\\sin x, 1, \\cos 2x$ are in G.P., then the general solution for $x$ is ...", "image": null}, "options": [{"id": "xQpdy", "label": "A", "text": "$n\\pi + (-1)^n \\left(\\dfrac{\\pi}{3}\\right), n \\in \\mathbb{Z}$", "isCorrect": false, "image": null}, {"id": "7IMYT", "label": "B", "text": "$2n\\pi + (-1)^n \\left(\\dfrac{\\pi}{2}\\right), n \\in \\mathbb{Z}$", "isCorrect": false, "image": null}, {"id": "uUdor", "label": "C", "text": "$n\\pi + (-1)^{n+1}\\left(\\dfrac{\\pi}{2}\\right), n \\in \\mathbb{Z}$", "isCorrect": true, "image": null}, {"id": "KHTHe", "label": "D", "text": "$2n\\pi + (-1)^n + \\left(\\dfrac{\\pi}{4}\\right), n \\in \\mathbb{Z}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\sin x, 1, \\cos 2x$ are in G.P.<br><br>$(1)^2 = \\sin x \\cdot \\cos 2x$<br><br>$1 = \\sin x (1 - 2\\sin^2 x)$<br><br>$2\\sin^3 x - \\sin x + 1 = 0$<br><br>$(\\sin x + 1)(2\\sin^2 x - 2\\sin x + 1) = 0$<br><br>For the quadratic factor $2\\sin^2 x - 2\\sin x + 1 = 0$, the discriminant is $D = (-2)^2 - 4(2)(1) = -4 < 0$. Thus, it has no real roots.<br><br>Therefore, we must have:<br><br>$\\sin x + 1 = 0$<br><br>$\\sin x = -1$<br><br>$\\sin x = \\sin\\left(-\\dfrac{\\pi}{2}\\right)$<br><br>The general solution is $x = n\\pi + (-1)^n \\left(-\\dfrac{\\pi}{2}\\right) = n\\pi + (-1)^{n+1} \\left(\\dfrac{\\pi}{2}\\right), n \\in \\mathbb{Z}$.<br><br>Answer: $n\\pi + (-1)^{n+1}\\left(\\dfrac{\\pi}{2}\\right), n \\in \\mathbb{Z}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3578c30a4553e1be2b2", "type": "singleCorrect", "question": {"text": "The general solution of $\\cos x + \\sin x = \\cos 2x + \\sin 2x$ is $x = np\\pi$ or $x = \\dfrac{nq\\pi}{3} + \\dfrac{\\pi}{6}$ for $n \\in Z$ then $p : q = $", "image": null}, "options": [{"id": "b1Rf1", "label": "A", "text": "$1:1$", "isCorrect": true, "image": null}, {"id": "8O6uR", "label": "B", "text": "$1:2$", "isCorrect": false, "image": null}, {"id": "jV6pZ", "label": "C", "text": "$2:3$", "isCorrect": false, "image": null}, {"id": "lQLJ5", "label": "D", "text": "$2:1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation: $\\cos x + \\sin x = \\cos 2x + \\sin 2x$<br><br>Dividing both sides by $\\sqrt{2}$, we get:<br><br>$\\dfrac{1}{\\sqrt{2}}\\cos x + \\dfrac{1}{\\sqrt{2}}\\sin x = \\dfrac{1}{\\sqrt{2}}\\cos 2x + \\dfrac{1}{\\sqrt{2}}\\sin 2x$<br><br>$\\cos\\left(x - \\dfrac{\\pi}{4}\\right) = \\cos\\left(2x - \\dfrac{\\pi}{4}\\right)$<br><br>The general solution for $\\cos \\theta = \\cos \\alpha$ is $\\theta = 2n\\pi \\pm \\alpha$, where $n \\in Z$.<br><br>Therefore, $2x - \\dfrac{\\pi}{4} = 2n\\pi \\pm \\left(x - \\dfrac{\\pi}{4}\\right)$<br><br>Taking the positive sign:<br><br>$2x - \\dfrac{\\pi}{4} = 2n\\pi + x - \\dfrac{\\pi}{4}$<br><br>$x = 2n\\pi$<br><br>Comparing this with $x = np\\pi$, we get $p = 2$.<br><br>Taking the negative sign:<br><br>$2x - \\dfrac{\\pi}{4} = 2n\\pi - x + \\dfrac{\\pi}{4}$<br><br>$3x = 2n\\pi + \\dfrac{\\pi}{2}$<br><br>$x = \\dfrac{2n\\pi}{3} + \\dfrac{\\pi}{6}$<br><br>Comparing this with $x = \\dfrac{nq\\pi}{3} + \\dfrac{\\pi}{6}$, we get $q = 2$.<br><br>Thus, the ratio $p : q = 2 : 2 = 1 : 1$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3578c30a4553e1be2b0", "type": "singleCorrect", "question": {"text": "The number of common solutions of the pair of equations $2\\sin^2\\theta - 2\\cos^2\\theta + 1 = 0$ and $2\\sin^2\\theta + 3\\sin\\theta - 2 = 0$ in the interval $[0, 2\\pi]$, is", "image": null}, "options": [{"id": "vKJsp", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "yTGip", "label": "B", "text": "$2$", "isCorrect": true, "image": null}, {"id": "ouYC0", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "zric7", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the second equation:<br><br>$2\\sin^2\\theta + 3\\sin\\theta - 2 = 0$<br><br>$(2\\sin\\theta - 1)(\\sin\\theta + 2) = 0$<br><br>Since $\\sin\\theta \\in [-1, 1]$, $\\sin\\theta = -2$ is rejected. Thus, $\\sin\\theta = \\dfrac{1}{2}$.<br><br>Given the first equation:<br><br>$2\\sin^2\\theta - 2\\cos^2\\theta + 1 = 0$<br><br>$2\\sin^2\\theta - 2(1 - \\sin^2\\theta) + 1 = 0$<br><br>$4\\sin^2\\theta - 1 = 0$<br><br>$\\sin^2\\theta = \\dfrac{1}{4} \\Rightarrow \\sin\\theta = \\pm \\dfrac{1}{2}$<br><br>The common solution for both equations is $\\sin\\theta = \\dfrac{1}{2}$.<br><br>In the interval $[0, 2\\pi]$, the solutions for $\\sin\\theta = \\dfrac{1}{2}$ are $\\theta = \\dfrac{\\pi}{6}$ and $\\theta = \\dfrac{5\\pi}{6}$.<br><br>Therefore, the number of common solutions is $2$.<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3028c30a4553e1bdf2f", "type": "singleCorrect", "question": {"text": "Let $x \\in [0, 6\\pi]$ satisfy the equation $\\cos x - \\sin x = -1$. If $x = k\\left(\\dfrac{\\pi}{3}\\right)$ where $k \\in N$, then find the number of possible values of $k$ is .....", "image": null}, "options": [{"id": "H6lIQ", "label": "A", "text": "$3$", "isCorrect": true, "image": null}, {"id": "jQMng", "label": "B", "text": "$4$", "isCorrect": false, "image": null}, {"id": "WtNKm", "label": "C", "text": "$6$", "isCorrect": false, "image": null}, {"id": "WmYTY", "label": "D", "text": "$8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation: $\\cos x - \\sin x = -1$<br><br>$\\Rightarrow \\cos x + 1 = \\sin x$<br><br>Squaring both sides:<br><br>$\\cos^2 x + 2\\cos x + 1 = \\sin^2 x$<br><br>$\\Rightarrow \\cos^2 x + 2\\cos x + 1 = 1 - \\cos^2 x$<br><br>$\\Rightarrow 2\\cos^2 x + 2\\cos x = 0$<br><br>$\\Rightarrow 2\\cos x(\\cos x + 1) = 0$<br><br>$\\Rightarrow \\cos x = 0$ or $\\cos x = -1$<br><br>If $\\cos x = 0$, substituting in the original equation gives $\\sin x = 1$.<br><br>$\\Rightarrow x = 2n\\pi + \\dfrac{\\pi}{2} = (4n+1)\\dfrac{\\pi}{2}$<br><br>Equating with $x = k\\left(\\dfrac{\\pi}{3}\\right)$, we get $k\\left(\\dfrac{\\pi}{3}\\right) = (4n+1)\\dfrac{\\pi}{2} \\Rightarrow k = \\dfrac{3(4n+1)}{2}$<br><br>Since $k \\in N$, this yields no integer solutions for $k$.<br><br>If $\\cos x = -1$, substituting in the original equation gives $\\sin x = 0$.<br><br>$\\Rightarrow x = (2n+1)\\pi$<br><br>Equating with $x = k\\left(\\dfrac{\\pi}{3}\\right)$, we get $k\\left(\\dfrac{\\pi}{3}\\right) = (2n+1)\\pi \\Rightarrow k = 3(2n+1)$<br><br>Since $x \\in [0, 6\\pi]$, the possible values of $x$ are $\\pi, 3\\pi, 5\\pi$.<br><br>For $x = \\pi$, $k = 3$<br><br>For $x = 3\\pi$, $k = 9$<br><br>For $x = 5\\pi$, $k = 15$<br><br>All these values of $k$ are natural numbers.<br><br>Thus, there are $3$ possible values of $k$.<br><br>Answer: $3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ca8c30a4553e1bdcd6", "type": "singleCorrect", "question": {"text": "If the equation $\\sin 3\\theta - \\cos^2\\theta = \\dfrac{1}{4}$ and $\\theta \\in [0, \\pi]$, then the number of solutions is...", "image": null}, "options": [{"id": "lPfkS", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "n5uXm", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "HBgzk", "label": "C", "text": "$4$", "isCorrect": true, "image": null}, {"id": "nlvI6", "label": "D", "text": "$6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation: $\\sin 3\\theta - \\cos^2\\theta = \\dfrac{1}{4}$<br><br>Using the identities $\\sin 3\\theta = 3\\sin\\theta - 4\\sin^3\\theta$ and $\\cos^2\\theta = 1 - \\sin^2\\theta$, we get:<br><br>$3\\sin\\theta - 4\\sin^3\\theta - (1 - \\sin^2\\theta) = \\dfrac{1}{4}$<br><br>Multiplying by $4$ and rearranging the terms:<br><br>$12\\sin\\theta - 16\\sin^3\\theta - 4 + 4\\sin^2\\theta = 1$<br><br>$16\\sin^3\\theta - 4\\sin^2\\theta - 12\\sin\\theta + 5 = 0$<br><br>Let $\\sin\\theta = x$. Since $\\theta \\in [0, \\pi]$, we must have $x \\in [0, 1]$. The equation becomes:<br><br>$16x^3 - 4x^2 - 12x + 5 = 0$<br><br>By inspection, $x = \\dfrac{1}{2}$ is a root. Factoring out $(2x - 1)$:<br><br>$(2x - 1)(8x^2 + 2x - 5) = 0$<br><br>The roots are $x = \\dfrac{1}{2}$ and the solutions to $8x^2 + 2x - 5 = 0$. Using the quadratic formula:<br><br>$x = \\dfrac{-2 \\pm \\sqrt{4 - 4(8)(-5)}}{16} = \\dfrac{-2 \\pm \\sqrt{164}}{16} = \\dfrac{-1 \\pm \\sqrt{41}}{8}$<br><br>Since $\\sqrt{41} \\approx 6.4$, the roots are approximately $x \\approx 0.675$ and $x \\approx -0.925$.<br><br>The valid values for $x = \\sin\\theta$ in the interval $[0, 1]$ are $x = \\dfrac{1}{2}$ and $x = \\dfrac{\\sqrt{41} - 1}{8}$.<br><br>For each value of $\\sin\\theta \\in (0, 1)$, there are exactly $2$ solutions in the interval $[0, \\pi]$.<br><br>Therefore, the total number of solutions is $2 + 2 = 4$.<br><br>Answer: $4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d88c30a4553e1bdd69", "type": "singleCorrect", "question": {"text": "The general solution of the equation $\\cot\\theta \\cdot \\cot 2\\theta = 1$ is...", "image": null}, "options": [{"id": "sWI0l", "label": "A", "text": "$\\theta = n\\pi \\pm \\dfrac{\\pi}{6}, n \\in Z$", "isCorrect": true, "image": null}, {"id": "8fvqs", "label": "B", "text": "$\\theta = n\\pi \\pm \\dfrac{\\pi}{3}, n \\in Z$", "isCorrect": false, "image": null}, {"id": "nVfkn", "label": "C", "text": "$\\theta = n\\pi \\pm \\dfrac{\\pi}{4}, n \\in Z$", "isCorrect": false, "image": null}, {"id": "LYhmm", "label": "D", "text": "$\\theta = n\\pi \\pm \\dfrac{\\pi}{8}, n \\in Z$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation is $\\cot\\theta \\cdot \\cot 2\\theta = 1$<br><br>Writing in terms of $\\tan\\theta$:<br><br>$\\dfrac{1}{\\tan\\theta} \\cdot \\dfrac{1 - \\tan^2\\theta}{2\\tan\\theta} = 1$<br><br>$1 - \\tan^2\\theta = 2\\tan^2\\theta$<br><br>$3\\tan^2\\theta = 1$<br><br>$\\tan^2\\theta = \\dfrac{1}{3}$<br><br>$\\tan^2\\theta = \\tan^2\\left(\\dfrac{\\pi}{6}\\right)$<br><br>Using the general solution for $\\tan^2\\theta = \\tan^2\\alpha$, which is $\\theta = n\\pi \\pm \\alpha, n \\in Z$, we get:<br><br>$\\theta = n\\pi \\pm \\dfrac{\\pi}{6}, n \\in Z$<br><br>Answer: $\\theta = n\\pi \\pm \\dfrac{\\pi}{6}, n \\in Z$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33a8c30a4553e1be186", "type": "singleCorrect", "question": {"text": "If $0 \\leq x \\leq \\dfrac{\\pi}{2}$ , then the number of values of $x$ for which $\\sin x - \\sin 2x + \\sin 3x = 0$ is", "image": null}, "options": [{"id": "WyKaz", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "fshef", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "PS5uZ", "label": "C", "text": "$3$", "isCorrect": true, "image": null}, {"id": "pjGAd", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation is $\\sin x - \\sin 2x + \\sin 3x = 0$<br><br>Grouping the terms, we get $(\\sin 3x + \\sin x) - \\sin 2x = 0$<br><br>Using the formula $\\sin C + \\sin D = 2 \\sin\\left(\\dfrac{C+D}{2}\\right) \\cos\\left(\\dfrac{C-D}{2}\\right)$, we have:<br><br>$2 \\sin 2x \\cos x - \\sin 2x = 0$<br><br>$\\sin 2x (2 \\cos x - 1) = 0$<br><br>This gives $\\sin 2x = 0$ or $\\cos x = \\dfrac{1}{2}$<br><br>For $\\sin 2x = 0$, since $0 \\leq x \\leq \\dfrac{\\pi}{2}$, we have $0 \\leq 2x \\leq \\pi$. Thus, $2x = 0$ or $2x = \\pi$, which gives $x = 0$ or $x = \\dfrac{\\pi}{2}$.<br><br>For $\\cos x = \\dfrac{1}{2}$, since $0 \\leq x \\leq \\dfrac{\\pi}{2}$, we get $x = \\dfrac{\\pi}{3}$.<br><br>The possible values of $x$ are $0, \\dfrac{\\pi}{3}, \\dfrac{\\pi}{2}$.<br><br>Therefore, the number of values of $x$ is $3$.<br><br>Answer: $3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e68c30a4553e1bde07", "type": "singleCorrect", "question": {"text": "If $\\sec 4\\theta - \\sec 2\\theta = 2$, then $\\theta =$", "image": null}, "options": [{"id": "aBcs9", "label": "A", "text": "$n\\pi + \\dfrac{\\pi}{8}, \\dfrac{n\\pi}{5} + \\dfrac{\\pi}{6}, n \\in Z$", "isCorrect": false, "image": null}, {"id": "RrKfq", "label": "B", "text": "$n\\pi + \\dfrac{\\pi}{6}, \\dfrac{n\\pi}{5} + \\dfrac{\\pi}{8}, n \\in Z$", "isCorrect": false, "image": null}, {"id": "URmzB", "label": "C", "text": "$n\\pi + \\dfrac{\\pi}{2}, \\dfrac{n\\pi}{5} + \\dfrac{\\pi}{10}, n \\in Z$", "isCorrect": true, "image": null}, {"id": "zeCxL", "label": "D", "text": "$n\\pi + \\dfrac{\\pi}{3}, n\\pi + \\dfrac{\\pi}{10}, n \\in Z$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation: $\\sec 4\\theta - \\sec 2\\theta = 2$<br><br>$\\Rightarrow \\dfrac{1}{\\cos 4\\theta} - \\dfrac{1}{\\cos 2\\theta} = 2$<br><br>$\\Rightarrow \\cos 2\\theta - \\cos 4\\theta = 2 \\cos 4\\theta \\cos 2\\theta$<br><br>Using the formula $2 \\cos A \\cos B = \\cos(A+B) + \\cos(A-B)$:<br><br>$\\Rightarrow \\cos 2\\theta - \\cos 4\\theta = \\cos 6\\theta + \\cos 2\\theta$<br><br>$\\Rightarrow -\\cos 4\\theta = \\cos 6\\theta$<br><br>$\\Rightarrow \\cos 6\\theta + \\cos 4\\theta = 0$<br><br>Using the formula $\\cos C + \\cos D = 2 \\cos\\left(\\dfrac{C+D}{2}\\right) \\cos\\left(\\dfrac{C-D}{2}\\right)$:<br><br>$\\Rightarrow 2 \\cos 5\\theta \\cos \\theta = 0$<br><br>$\\Rightarrow \\cos 5\\theta = 0$ or $\\cos \\theta = 0$<br><br>For $\\cos \\theta = 0$, we get $\\theta = n\\pi + \\dfrac{\\pi}{2}, n \\in Z$<br><br>For $\\cos 5\\theta = 0$, we get $5\\theta = n\\pi + \\dfrac{\\pi}{2} \\Rightarrow \\theta = \\dfrac{n\\pi}{5} + \\dfrac{\\pi}{10}, n \\in Z$<br><br>Both sets of solutions are valid as they do not make $\\cos 2\\theta = 0$ or $\\cos 4\\theta = 0$.<br><br>Answer: $n\\pi + \\dfrac{\\pi}{2}, \\dfrac{n\\pi}{5} + \\dfrac{\\pi}{10}, n \\in Z$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 3, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31e8c30a4553e1be058", "type": "singleCorrect", "question": {"text": "If $\\cos(p\\theta) + \\cos(q\\theta) = 0$ and $p \\neq q$, then the general value of $\\theta$ (where n is any integer) is...", "image": null}, "options": [{"id": "Qab9Y", "label": "A", "text": "$\\dfrac{(3n+1)\\pi}{p - q}$", "isCorrect": false, "image": null}, {"id": "LR0WG", "label": "B", "text": "$\\dfrac{(2n+1)\\pi}{p \\pm q}$", "isCorrect": true, "image": null}, {"id": "K9RYH", "label": "C", "text": "$\\dfrac{(n \\pm 1)\\pi}{p \\pm q}$", "isCorrect": false, "image": null}, {"id": "NHb8Y", "label": "D", "text": "$\\dfrac{(n+2)\\pi}{p + q}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\cos(p\\theta) + \\cos(q\\theta) = 0$<br><br>Using the formula $\\cos C + \\cos D = 2\\cos\\left(\\dfrac{C+D}{2}\\right)\\cos\\left(\\dfrac{C-D}{2}\\right)$:<br><br>$2\\cos\\left(\\dfrac{p+q}{2}\\theta\\right)\\cos\\left(\\dfrac{p-q}{2}\\theta\\right) = 0$<br><br>This implies either $\\cos\\left(\\dfrac{p+q}{2}\\theta\\right) = 0$ or $\\cos\\left(\\dfrac{p-q}{2}\\theta\\right) = 0$<br><br>If $\\cos\\left(\\dfrac{p+q}{2}\\theta\\right) = 0$, then $\\dfrac{p+q}{2}\\theta = (2n+1)\\dfrac{\\pi}{2}$, where $n$ is an integer.<br><br>$\\theta = \\dfrac{(2n+1)\\pi}{p+q}$<br><br>If $\\cos\\left(\\dfrac{p-q}{2}\\theta\\right) = 0$, then $\\dfrac{p-q}{2}\\theta = (2n+1)\\dfrac{\\pi}{2}$, where $n$ is an integer.<br><br>$\\theta = \\dfrac{(2n+1)\\pi}{p-q}$<br><br>Combining both cases, the general value of $\\theta$ is $\\dfrac{(2n+1)\\pi}{p \\pm q}$<br><br>Answer: $\\dfrac{(2n+1)\\pi}{p \\pm q}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a08c30a4553e1bdb11", "type": "singleCorrect", "question": {"text": "The general solution of $\\cos\\theta - \\sin\\theta = 1$ is", "image": null}, "options": [{"id": "9Ka3F", "label": "A", "text": "$\\theta = 2n\\pi - \\dfrac{\\pi}{2}$ or $\\theta = 2n\\pi, n\\in Z$", "isCorrect": true, "image": null}, {"id": "PIelg", "label": "B", "text": "$\\theta = n\\pi - \\dfrac{\\pi}{2}$ or $\\theta = n\\pi, n\\in Z$", "isCorrect": false, "image": null}, {"id": "YzXyg", "label": "C", "text": "$\\theta = n\\dfrac{\\pi}{2} - \\pi$ or $\\theta = n\\dfrac{\\pi}{2}, n\\in Z$", "isCorrect": false, "image": null}, {"id": "Gq1zg", "label": "D", "text": "$\\theta = 2n\\pi + \\dfrac{\\pi}{2}$ or $\\theta = n\\pi, n\\in Z$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation is $\\cos\\theta - \\sin\\theta = 1$<br><br>Dividing both sides by $\\sqrt{1^2 + (-1)^2} = \\sqrt{2}$<br><br>$\\dfrac{1}{\\sqrt{2}}\\cos\\theta - \\dfrac{1}{\\sqrt{2}}\\sin\\theta = \\dfrac{1}{\\sqrt{2}}$<br><br>$\\cos\\theta \\cos\\dfrac{\\pi}{4} - \\sin\\theta \\sin\\dfrac{\\pi}{4} = \\dfrac{1}{\\sqrt{2}}$<br><br>$\\cos\\left(\\theta + \\dfrac{\\pi}{4}\\right) = \\cos\\dfrac{\\pi}{4}$<br><br>$\\theta + \\dfrac{\\pi}{4} = 2n\\pi \\pm \\dfrac{\\pi}{4}, n \\in Z$<br><br>Taking the positive sign:<br><br>$\\theta + \\dfrac{\\pi}{4} = 2n\\pi + \\dfrac{\\pi}{4} \\Rightarrow \\theta = 2n\\pi$<br><br>Taking the negative sign:<br><br>$\\theta + \\dfrac{\\pi}{4} = 2n\\pi - \\dfrac{\\pi}{4} \\Rightarrow \\theta = 2n\\pi - \\dfrac{\\pi}{2}$<br><br>Thus, $\\theta = 2n\\pi$ or $\\theta = 2n\\pi - \\dfrac{\\pi}{2}, n \\in Z$.<br><br>Answer: $\\theta = 2n\\pi - \\dfrac{\\pi}{2}$ or $\\theta = 2n\\pi, n\\in Z$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3748c30a4553e1be3e9", "type": "singleCorrect", "question": {"text": "The number of solutions in $\\left[0, \\dfrac{\\pi}{2}\\right)$ of the equation $\\cos 3x \\cdot \\tan 5x = \\sin 7x$ is", "image": null}, "options": [{"id": "x4mMh", "label": "A", "text": "$4$", "isCorrect": false, "image": null}, {"id": "gzjvo", "label": "B", "text": "$5$", "isCorrect": false, "image": null}, {"id": "bwTg9", "label": "C", "text": "$7$", "isCorrect": false, "image": null}, {"id": "1VPVu", "label": "D", "text": "$6$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given equation: $\\cos 3x \\cdot \\tan 5x = \\sin 7x$<br><br>$\\cos 3x \\cdot \\dfrac{\\sin 5x}{\\cos 5x} = \\sin 7x$<br><br>$2 \\sin 5x \\cos 3x = 2 \\sin 7x \\cos 5x$<br><br>Using the identity $2 \\sin A \\cos B = \\sin(A+B) + \\sin(A-B)$:<br><br>$\\sin 8x + \\sin 2x = \\sin 12x + \\sin 2x$<br><br>$\\sin 12x - \\sin 8x = 0$<br><br>Using the identity $\\sin C - \\sin D = 2 \\sin\\left(\\dfrac{C-D}{2}\\right) \\cos\\left(\\dfrac{C+D}{2}\\right)$:<br><br>$2 \\sin 2x \\cos 10x = 0$<br><br>This gives $\\sin 2x = 0$ or $\\cos 10x = 0$.<br><br>For $\\sin 2x = 0$, $2x = n\\pi \\Rightarrow x = \\dfrac{n\\pi}{2}$.<br><br>Since $x \\in \\left[0, \\dfrac{\\pi}{2}\\right)$, the only solution is $x = 0$.<br><br>For $\\cos 10x = 0$, $10x = (2k+1)\\dfrac{\\pi}{2} \\Rightarrow x = (2k+1)\\dfrac{\\pi}{20}$.<br><br>Since $x \\in \\left[0, \\dfrac{\\pi}{2}\\right)$, we have $0 \\leq (2k+1)\\dfrac{\\pi}{20} < \\dfrac{\\pi}{2} \\Rightarrow 0 \\leq 2k+1 < 10$.<br><br>The possible values for $2k+1$ are $1, 3, 5, 7, 9$.<br><br>This gives $x = \\dfrac{\\pi}{20}, \\dfrac{3\\pi}{20}, \\dfrac{5\\pi}{20}, \\dfrac{7\\pi}{20}, \\dfrac{9\\pi}{20}$.<br><br>We must also ensure that $\\tan 5x$ is defined, which means $\\cos 5x \\neq 0$.<br><br>$\\cos 5x = 0 \\Rightarrow 5x = (2m+1)\\dfrac{\\pi}{2} \\Rightarrow x = (4m+2)\\dfrac{\\pi}{20}$.<br><br>Since $2k+1$ is always odd and $4m+2$ is always even, none of our solutions make $\\cos 5x = 0$.<br><br>Thus, all $1 + 5 = 6$ solutions are valid.<br><br>Answer: $6$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf5bf9280d7f9932dff", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $1-\\cos \\theta=\\sin \\theta \\cdot \\sin \\frac{\\theta}{2}$, then the value of $\\theta$ is", "image": null}, "options": [{"id": "sWtqC", "text": "$2 \\mathrm{n} \\pi, 4 \\mathrm{n} \\pi, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": true}, {"id": "LKCec", "text": "$\\frac{n \\pi}{2}, \\frac{n \\pi}{3}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "gDbjA", "text": "$(2 n+1) \\frac{\\pi}{2}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "qJuft", "text": "$(2 n-1) \\frac{\\pi}{4}, n \\in \\mathbb{Z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation: $1 - \\cos \\theta = \\sin \\theta \\cdot \\sin \\dfrac{\\theta}{2}$<br><br>Using the half-angle formulas $1 - \\cos \\theta = 2 \\sin^2 \\dfrac{\\theta}{2}$ and $\\sin \\theta = 2 \\sin \\dfrac{\\theta}{2} \\cos \\dfrac{\\theta}{2}$, we get:<br><br>$2 \\sin^2 \\dfrac{\\theta}{2} = \\left(2 \\sin \\dfrac{\\theta}{2} \\cos \\dfrac{\\theta}{2}\\right) \\sin \\dfrac{\\theta}{2}$<br><br>$2 \\sin^2 \\dfrac{\\theta}{2} = 2 \\sin^2 \\dfrac{\\theta}{2} \\cos \\dfrac{\\theta}{2}$<br><br>$2 \\sin^2 \\dfrac{\\theta}{2} - 2 \\sin^2 \\dfrac{\\theta}{2} \\cos \\dfrac{\\theta}{2} = 0$<br><br>$2 \\sin^2 \\dfrac{\\theta}{2} \\left(1 - \\cos \\dfrac{\\theta}{2}\\right) = 0$<br><br>This gives two cases:<br><br>Case 1: $\\sin^2 \\dfrac{\\theta}{2} = 0$<br>$\\Rightarrow \\sin \\dfrac{\\theta}{2} = 0$<br>$\\Rightarrow \\dfrac{\\theta}{2} = n\\pi$<br>$\\Rightarrow \\theta = 2n\\pi$, where $n \\in \\mathbb{Z}$<br><br>Case 2: $1 - \\cos \\dfrac{\\theta}{2} = 0$<br>$\\Rightarrow \\cos \\dfrac{\\theta}{2} = 1$<br>$\\Rightarrow \\dfrac{\\theta}{2} = 2n\\pi$<br>$\\Rightarrow \\theta = 4n\\pi$, where $n \\in \\mathbb{Z}$<br><br>Thus, the values of $\\theta$ are $2n\\pi$ and $4n\\pi$ for $n \\in \\mathbb{Z}$.<br><br>Answer: $2 \\mathrm{n} \\pi, 4 \\mathrm{n} \\pi, \\mathrm{n} \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf1bf9280d7f9932dd9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The number of values of $x$ in interval $[0,5 \\pi]$ satisfying the equation $3 \\sin ^2 x-7 \\sin x+2=0$ is", "image": null}, "options": [{"id": "XUlfY", "text": "6", "image": null, "isCorrect": true}, {"id": "tRxwK", "text": "0", "image": null, "isCorrect": false}, {"id": "QSV1s", "text": "5", "image": null, "isCorrect": false}, {"id": "thGTY", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is $3 \\sin^2 x - 7 \\sin x + 2 = 0$.<br><br>Factorizing the quadratic equation in terms of $\\sin x$:<br><br>$3 \\sin^2 x - 6 \\sin x - \\sin x + 2 = 0$<br><br>$3 \\sin x (\\sin x - 2) - 1 (\\sin x - 2) = 0$<br><br>$(3 \\sin x - 1)(\\sin x - 2) = 0$<br><br>This gives $\\sin x = \\dfrac{1}{3}$ or $\\sin x = 2$.<br><br>Since the range of $\\sin x$ is $[-1, 1]$, $\\sin x = 2$ is not possible.<br><br>Therefore, we only consider $\\sin x = \\dfrac{1}{3}$.<br><br>We need to find the number of solutions in the interval $[0, 5\\pi]$.<br><br>The interval $[0, 5\\pi]$ can be divided into three parts: $[0, 2\\pi]$, $[2\\pi, 4\\pi]$, and $[4\\pi, 5\\pi]$.<br><br>In $[0, 2\\pi]$, the equation $\\sin x = \\dfrac{1}{3}$ has $2$ solutions (one in the first quadrant and one in the second quadrant).<br><br>In $[2\\pi, 4\\pi]$, the equation $\\sin x = \\dfrac{1}{3}$ has $2$ solutions.<br><br>In $[4\\pi, 5\\pi]$, the equation $\\sin x = \\dfrac{1}{3}$ has $2$ solutions.<br><br>Total number of solutions is $2 + 2 + 2 = 6$.<br><br>Answer: 6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be6bf9280d7f9932d6f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $0 \\leqslant x \\leqslant \\pi$ and $81^{\\sin ^2 x}+81^{\\cos ^2 x}=30$\nThen $x$ takes the value", "image": null}, "options": [{"id": "m6bMu", "text": "$\\frac{\\pi}{6}, \\frac{\\pi}{3}$", "image": null, "isCorrect": true}, {"id": "4yU5S", "text": "$\\frac{\\pi}{3}, \\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "Ijflp", "text": "$\\frac{5 \\pi}{6}, \\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "96If8", "text": "$\\frac{2 \\pi}{3}, \\frac{\\pi}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $81^{\\sin^2 x} + 81^{\\cos^2 x} = 30$<br><br>Using the identity $\\cos^2 x = 1 - \\sin^2 x$, the equation becomes:<br><br>$81^{\\sin^2 x} + 81^{1 - \\sin^2 x} = 30$<br><br>$81^{\\sin^2 x} + \\dfrac{81}{81^{\\sin^2 x}} = 30$<br><br>Let $y = 81^{\\sin^2 x}$. The equation transforms into a quadratic equation:<br><br>$y + \\dfrac{81}{y} = 30$<br><br>$y^2 - 30y + 81 = 0$<br><br>$(y - 27)(y - 3) = 0$<br><br>So, $y = 3$ or $y = 27$<br><br>Case 1: $y = 3$<br><br>$81^{\\sin^2 x} = 3$<br><br>$(3^4)^{\\sin^2 x} = 3^1$<br><br>$4\\sin^2 x = 1 \\Rightarrow \\sin^2 x = \\dfrac{1}{4}$<br><br>Since $0 \\leqslant x \\leqslant \\pi$, $\\sin x = \\dfrac{1}{2}$<br><br>$\\Rightarrow x = \\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}$<br><br>Case 2: $y = 27$<br><br>$81^{\\sin^2 x} = 27$<br><br>$(3^4)^{\\sin^2 x} = 3^3$<br><br>$4\\sin^2 x = 3 \\Rightarrow \\sin^2 x = \\dfrac{3}{4}$<br><br>Since $0 \\leqslant x \\leqslant \\pi$, $\\sin x = \\dfrac{\\sqrt{3}}{2}$<br><br>$\\Rightarrow x = \\dfrac{\\pi}{3}, \\dfrac{2\\pi}{3}$<br><br>The possible values of $x$ are $\\dfrac{\\pi}{6}, \\dfrac{\\pi}{3}, \\dfrac{2\\pi}{3}, \\dfrac{5\\pi}{6}$. Among the given options, $\\dfrac{\\pi}{6}$ and $\\dfrac{\\pi}{3}$ are correct.<br><br>Answer: $\\frac{\\pi}{6}, \\frac{\\pi}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb1bf9280d7f9932b9d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The number of values of $x$ in the interval $[0,3 \\pi]$ satisfying the equation $2 \\sin ^2 x+5 \\sin x-3=0$ is", "image": null}, "options": [{"id": "3n8qz", "text": "6", "image": null, "isCorrect": false}, {"id": "X5mm5", "text": "1", "image": null, "isCorrect": false}, {"id": "B59I5", "text": "2", "image": null, "isCorrect": false}, {"id": "Jj7sA", "text": "4", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equation is $2 \\sin^2 x + 5 \\sin x - 3 = 0$<br><br>Let $\\sin x = t$, then the equation becomes:<br><br>$2t^2 + 5t - 3 = 0$<br><br>$2t^2 + 6t - t - 3 = 0$<br><br>$2t(t + 3) - 1(t + 3) = 0$<br><br>$(2t - 1)(t + 3) = 0$<br><br>$\\Rightarrow t = \\dfrac{1}{2}$ or $t = -3$<br><br>Since $-1 \\le \\sin x \\le 1$, $\\sin x = -3$ is not possible.<br><br>Therefore, $\\sin x = \\dfrac{1}{2}$<br><br>We need to find the number of solutions in the interval $[0, 3\\pi]$. The sine function is positive in the first and second quadrants.<br><br>In the interval $[0, 2\\pi]$, the solutions are:<br><br>$x = \\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}$<br><br>In the interval $[2\\pi, 3\\pi]$, the solutions are:<br><br>$x = 2\\pi + \\dfrac{\\pi}{6} = \\dfrac{13\\pi}{6}$<br><br>$x = 2\\pi + \\dfrac{5\\pi}{6} = \\dfrac{17\\pi}{6}$<br><br>Thus, there are $4$ values of $x$ satisfying the given equation in the interval $[0, 3\\pi]$.<br><br>Answer: 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9ebf9280d7f9932af2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The number of values of $x$ in the interval $[0,3 \\pi]$ satisfying the equation $2 \\sin ^2 x+5 \\sin x-3=0$ is", "image": null}, "options": [{"id": "tVyEo", "text": "4", "image": null, "isCorrect": true}, {"id": "p0Awk", "text": "6", "image": null, "isCorrect": false}, {"id": "sAod8", "text": "2", "image": null, "isCorrect": false}, {"id": "xRN7R", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $2 \\sin^2 x + 5 \\sin x - 3 = 0$.<br><br>Let $\\sin x = t$. The equation becomes:<br><br>$2t^2 + 5t - 3 = 0$<br><br>$2t^2 + 6t - t - 3 = 0$<br><br>$2t(t + 3) - 1(t + 3) = 0$<br><br>$(2t - 1)(t + 3) = 0$<br><br>$\\Rightarrow t = \\dfrac{1}{2}$ or $t = -3$<br><br>Since $-1 \\le \\sin x \\le 1$, the value $\\sin x = -3$ is rejected.<br><br>Therefore, $\\sin x = \\dfrac{1}{2}$.<br><br>We need to find the number of solutions in the interval $[0, 3\\pi]$. The sine function is positive in the first and second quadrants, which correspond to the intervals $[0, \\pi]$ and $[2\\pi, 3\\pi]$ within the given range.<br><br>In $[0, \\pi]$, $\\sin x = \\dfrac{1}{2}$ gives $x = \\dfrac{\\pi}{6}$ and $x = \\dfrac{5\\pi}{6}$.<br><br>In $[2\\pi, 3\\pi]$, $\\sin x = \\dfrac{1}{2}$ gives $x = 2\\pi + \\dfrac{\\pi}{6} = \\dfrac{13\\pi}{6}$ and $x = 2\\pi + \\dfrac{5\\pi}{6} = \\dfrac{17\\pi}{6}$.<br><br>Thus, there are exactly $4$ values of $x$ satisfying the given equation.<br><br>Answer: 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b73bf9280d7f9932956", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The number of solutions of $16^{\\sin ^2 x}+16^{\\cos ^2 x}=10$ in $0 \\leqslant x \\leqslant 2 \\pi$ are", "image": null}, "options": [{"id": "YElJI", "text": "$8$", "image": null, "isCorrect": true}, {"id": "DRwYC", "text": "$10$", "image": null, "isCorrect": false}, {"id": "QKqur", "text": "$6$", "image": null, "isCorrect": false}, {"id": "Gqgav", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $16^{\\sin ^2 x}+16^{\\cos ^2 x}=10$.<br><br>Since $\\cos^2 x = 1 - \\sin^2 x$, the equation can be written as:<br><br>$16^{\\sin ^2 x} + 16^{1 - \\sin ^2 x} = 10$<br><br>$16^{\\sin ^2 x} + \\dfrac{16}{16^{\\sin ^2 x}} = 10$<br><br>Let $16^{\\sin ^2 x} = y$. The equation becomes:<br><br>$y + \\dfrac{16}{y} = 10$<br><br>$y^2 - 10y + 16 = 0$<br><br>$(y - 2)(y - 8) = 0$<br><br>$\\Rightarrow y = 2$ or $y = 8$<br><br>Case 1: $y = 2$<br><br>$16^{\\sin ^2 x} = 2$<br><br>$(2^4)^{\\sin ^2 x} = 2^1$<br><br>$2^{4\\sin ^2 x} = 2^1$<br><br>$4\\sin ^2 x = 1 \\Rightarrow \\sin ^2 x = \\dfrac{1}{4}$<br><br>$\\Rightarrow \\sin x = \\pm \\dfrac{1}{2}$<br><br>In the interval $0 \\leqslant x \\leqslant 2\\pi$, $\\sin x = \\pm \\dfrac{1}{2}$ gives $4$ solutions: $x = \\dfrac{\\pi}{6}, \\dfrac{5\\pi}{6}, \\dfrac{7\\pi}{6}, \\dfrac{11\\pi}{6}$.<br><br>Case 2: $y = 8$<br><br>$16^{\\sin ^2 x} = 8$<br><br>$(2^4)^{\\sin ^2 x} = 2^3$<br><br>$2^{4\\sin ^2 x} = 2^3$<br><br>$4\\sin ^2 x = 3 \\Rightarrow \\sin ^2 x = \\dfrac{3}{4}$<br><br>$\\Rightarrow \\sin x = \\pm \\dfrac{\\sqrt{3}}{2}$<br><br>In the interval $0 \\leqslant x \\leqslant 2\\pi$, $\\sin x = \\pm \\dfrac{\\sqrt{3}}{2}$ gives $4$ solutions: $x = \\dfrac{\\pi}{3}, \\dfrac{2\\pi}{3}, \\dfrac{4\\pi}{3}, \\dfrac{5\\pi}{3}$.<br><br>Total number of solutions = $4 + 4 = 8$.<br><br>Answer: $8$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3ebf9280d7f9932774", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The possible values of $\\theta \\in(0, \\pi)$ such that $\\sin \\theta+\\sin (4 \\theta)+\\sin (7 \\theta)=0$ are", "image": null}, "options": [{"id": "yN0Jr", "text": "$\\frac{\\pi}{4}, \\frac{5 \\pi}{12}, \\frac{\\pi}{2}, \\frac{2 \\pi}{3}, \\frac{3 \\pi}{4}, \\frac{8 \\pi}{9}$", "image": null, "isCorrect": false}, {"id": "aqxSq", "text": "$\\frac{2 \\pi}{9}, \\frac{\\pi}{4}, \\frac{\\pi}{2}, \\frac{2 \\pi}{3}, \\frac{3 \\pi}{4}, \\frac{35 \\pi}{36}$", "image": null, "isCorrect": false}, {"id": "m0htf", "text": "$\\frac{2 \\pi}{9}, \\frac{\\pi}{4}, \\frac{\\pi}{2}, \\frac{2 \\pi}{3}, \\frac{3 \\pi}{4}, \\frac{8 \\pi}{10}$", "image": null, "isCorrect": false}, {"id": "46r2m", "text": "$\\frac{2 \\pi}{9}, \\frac{\\pi}{4}, \\frac{4 \\pi}{9}, \\frac{\\pi}{2}, \\frac{3 \\pi}{4}, \\frac{8 \\pi}{9}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equation: $\\sin \\theta + \\sin(4\\theta) + \\sin(7\\theta) = 0$<br><br>Rearranging the terms:<br><br>$(\\sin(7\\theta) + \\sin \\theta) + \\sin(4\\theta) = 0$<br><br>Using the formula $\\sin A + \\sin B = 2 \\sin\\left(\\dfrac{A+B}{2}\\right) \\cos\\left(\\dfrac{A-B}{2}\\right)$:<br><br>$2 \\sin(4\\theta) \\cos(3\\theta) + \\sin(4\\theta) = 0$<br><br>$\\sin(4\\theta) [2 \\cos(3\\theta) + 1] = 0$<br><br>This gives two cases:<br><br>$\\sin(4\\theta) = 0$ or $2 \\cos(3\\theta) + 1 = 0$<br><br>For $\\sin(4\\theta) = 0$, since $\\theta \\in (0, \\pi)$, $4\\theta \\in (0, 4\\pi)$.<br><br>$4\\theta = \\pi, 2\\pi, 3\\pi$<br><br>$\\theta = \\dfrac{\\pi}{4}, \\dfrac{\\pi}{2}, \\dfrac{3\\pi}{4}$<br><br>For $2 \\cos(3\\theta) + 1 = 0$, $\\cos(3\\theta) = -\\dfrac{1}{2}$.<br><br>Since $\\theta \\in (0, \\pi)$, $3\\theta \\in (0, 3\\pi)$.<br><br>$3\\theta = \\dfrac{2\\pi}{3}, \\dfrac{4\\pi}{3}, \\dfrac{8\\pi}{3}$<br><br>$\\theta = \\dfrac{2\\pi}{9}, \\dfrac{4\\pi}{9}, \\dfrac{8\\pi}{9}$<br><br>Combining all the values, we get:<br><br>$\\theta \\in \\left\\{ \\dfrac{2\\pi}{9}, \\dfrac{\\pi}{4}, \\dfrac{4\\pi}{9}, \\dfrac{\\pi}{2}, \\dfrac{3\\pi}{4}, \\dfrac{8\\pi}{9} \\right\\}$<br><br>Answer: $\\frac{2 \\pi}{9}, \\frac{\\pi}{4}, \\frac{4 \\pi}{9}, \\frac{\\pi}{2}, \\frac{3 \\pi}{4}, \\frac{8 \\pi}{9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214390aee93fa0796def1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The general solution of the equation $\\sqrt{3} \\cos \\theta+\\sin \\theta=\\sqrt{2}$ is", "image": null}, "options": [{"id": "OUr2Q", "text": "$\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{2}+\\frac{\\pi}{6}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "GDLrR", "text": "$\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{2}-\\frac{\\pi}{6}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}, {"id": "pLLdy", "text": "$\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{4}-\\frac{\\pi}{3}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": true}, {"id": "ITyfq", "text": "$\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{4}+\\frac{\\pi}{3}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $\\sqrt{3} \\cos \\theta + \\sin \\theta = \\sqrt{2}$<br><br>Dividing both sides by $\\sqrt{(\\sqrt{3})^2 + (1)^2} = 2$, we get:<br><br>$\\dfrac{\\sqrt{3}}{2} \\cos \\theta + \\dfrac{1}{2} \\sin \\theta = \\dfrac{\\sqrt{2}}{2}$<br><br>$\\sin \\theta \\cos \\dfrac{\\pi}{3} + \\cos \\theta \\sin \\dfrac{\\pi}{3} = \\dfrac{1}{\\sqrt{2}}$<br><br>$\\sin \\left( \\theta + \\dfrac{\\pi}{3} \\right) = \\sin \\dfrac{\\pi}{4}$<br><br>The general solution of $\\sin x = \\sin \\alpha$ is $x = n\\pi + (-1)^n \\alpha$, where $n \\in \\mathbb{Z}$.<br><br>$\\theta + \\dfrac{\\pi}{3} = n\\pi + (-1)^n \\dfrac{\\pi}{4}$<br><br>$\\theta = n\\pi + (-1)^n \\dfrac{\\pi}{4} - \\dfrac{\\pi}{3}, n \\in \\mathbb{Z}$<br><br>Answer: $\\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\frac{\\pi}{4}-\\frac{\\pi}{3}, \\mathrm{n} \\in \\mathbb{Z}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142a0aee93fa0796de7d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "In a triangle ABC , with usual notations, $\\frac{\\cos B+\\cos C}{b+c}+\\frac{\\cos A}{a}$ has the value", "image": null}, "options": [{"id": "NPZ1P", "text": "$\\frac{1}{\\mathrm{~b}+\\mathrm{c}}$", "image": null, "isCorrect": false}, {"id": "kWH9v", "text": "$\\cdot \\frac{1}{\\mathrm{~b}}$", "image": null, "isCorrect": false}, {"id": "kqTEj", "text": "$\\frac{1}{\\mathrm{c}}$", "image": null, "isCorrect": false}, {"id": "PxS5n", "text": "$\\frac{1}{\\mathrm{a}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using the Sine Rule, $a = k \\sin A$, $b = k \\sin B$, and $c = k \\sin C$.<br><br>Consider the first term of the given expression:<br><br>$\\dfrac{\\cos B + \\cos C}{b+c} = \\dfrac{\\cos B + \\cos C}{k(\\sin B + \\sin C)}$<br><br>Using the sum-to-product formulas:<br><br>$\\dfrac{\\cos B + \\cos C}{b+c} = \\dfrac{2 \\cos\\left(\\dfrac{B+C}{2}\\right) \\cos\\left(\\dfrac{B-C}{2}\\right)}{k \\left[ 2 \\sin\\left(\\dfrac{B+C}{2}\\right) \\cos\\left(\\dfrac{B-C}{2}\\right) \\right]}$<br><br>$\\dfrac{\\cos B + \\cos C}{b+c} = \\dfrac{1}{k} \\cot\\left(\\dfrac{B+C}{2}\\right)$<br><br>Since $A + B + C = \\pi$, we have $\\dfrac{B+C}{2} = \\dfrac{\\pi}{2} - \\dfrac{A}{2}$.<br><br>$\\dfrac{\\cos B + \\cos C}{b+c} = \\dfrac{1}{k} \\cot\\left(\\dfrac{\\pi}{2} - \\dfrac{A}{2}\\right) = \\dfrac{1}{k} \\tan\\left(\\dfrac{A}{2}\\right)$<br><br>Now, add the second term $\\dfrac{\\cos A}{a} = \\dfrac{\\cos A}{k \\sin A}$:<br><br>$\\dfrac{\\cos B + \\cos C}{b+c} + \\dfrac{\\cos A}{a} = \\dfrac{1}{k} \\left[ \\tan\\left(\\dfrac{A}{2}\\right) + \\cot A \\right]$<br><br>Expressing in terms of sine and cosine:<br><br>$= \\dfrac{1}{k} \\left[ \\dfrac{\\sin(A/2)}{\\cos(A/2)} + \\dfrac{\\cos^2(A/2) - \\sin^2(A/2)}{2 \\sin(A/2) \\cos(A/2)} \\right]$<br><br>$= \\dfrac{1}{k} \\left[ \\dfrac{2 \\sin^2(A/2) + \\cos^2(A/2) - \\sin^2(A/2)}{2 \\sin(A/2) \\cos(A/2)} \\right]$<br><br>$= \\dfrac{1}{k} \\left[ \\dfrac{\\sin^2(A/2) + \\cos^2(A/2)}{\\sin A} \\right]$<br><br>$= \\dfrac{1}{k \\sin A}$<br><br>Since $a = k \\sin A$, the expression simplifies to:<br><br>$\\dfrac{1}{a}$<br><br>Answer: $\\frac{1}{\\mathrm{a}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214170aee93fa0796dde5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "If the equation $\\cos ^4 \\theta+\\sin ^4 \\theta+\\lambda=0$. has real solutions for $\\theta$, then $\\lambda$ lies in the interval", "image": null}, "options": [{"id": "eaSyG", "text": "$\\left(-\\frac{5}{4},-1\\right)$", "image": null, "isCorrect": false}, {"id": "LEDSO", "text": "$\\left[-\\frac{3}{2},-\\frac{5}{4}\\right]$", "image": null, "isCorrect": false}, {"id": "Gt0Ox", "text": "$\\left(-\\frac{1}{2},-\\frac{1}{4}\\right]$.", "image": null, "isCorrect": false}, {"id": "xdTRt", "text": "$\\left[-1,-\\frac{1}{2}\\right]$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given equation is $\\cos^4 \\theta + \\sin^4 \\theta + \\lambda = 0$.<br><br>We can rewrite the expression $\\cos^4 \\theta + \\sin^4 \\theta$ as:<br>$\\cos^4 \\theta + \\sin^4 \\theta = (\\cos^2 \\theta + \\sin^2 \\theta)^2 - 2\\sin^2 \\theta \\cos^2 \\theta$<br><br>Since $\\cos^2 \\theta + \\sin^2 \\theta = 1$, this simplifies to:<br>$1 - 2\\sin^2 \\theta \\cos^2 \\theta$<br><br>Using the double angle identity $\\sin 2\\theta = 2\\sin \\theta \\cos \\theta$, we have $2\\sin^2 \\theta \\cos^2 \\theta = \\dfrac{1}{2} \\sin^2 2\\theta$.<br><br>Thus, the equation becomes:<br>$1 - \\dfrac{1}{2} \\sin^2 2\\theta + \\lambda = 0$<br><br>Rearranging for $\\lambda$, we get:<br>$\\lambda = \\dfrac{1}{2} \\sin^2 2\\theta - 1$<br><br>For real values of $\\theta$, the range of $\\sin^2 2\\theta$ is $[0, 1]$.<br><br>Substituting the minimum value ($0$):<br>$\\lambda_{min} = \\dfrac{1}{2}(0) - 1 = -1$<br><br>Substituting the maximum value ($1$):<br>$\\lambda_{max} = \\dfrac{1}{2}(1) - 1 = -\\dfrac{1}{2}$<br><br>Therefore, $\\lambda$ must lie in the interval $\\left[-1, -\\dfrac{1}{2}\\right]$.<br><br>Answer: $\\left[-1,-\\frac{1}{2}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214160aee93fa0796dde1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Let $a, b, c$ be three non-zero real numbers such that the equation $\\sqrt{3} \\mathrm{a} \\cos x+2 b \\sin x=c$, $x \\in\\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ has two distinct real roots $\\alpha$ and $\\beta$ with $\\alpha+\\beta=\\frac{\\pi}{3}$. Then the value of $\\frac{b}{a}$ is", "image": null}, "options": [{"id": "3Fq3D", "text": "$0.1$", "image": null, "isCorrect": false}, {"id": "3TeGR", "text": "0.5", "image": null, "isCorrect": true}, {"id": "35PaP", "text": "$-0.5$", "image": null, "isCorrect": false}, {"id": "41JR9", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the equation $\\sqrt{3} a \\cos x + 2 b \\sin x = c$, since $\\alpha$ and $\\beta$ are its roots, we have:<br><br>$\\sqrt{3} a \\cos \\alpha + 2 b \\sin \\alpha = c$<br><br>$\\sqrt{3} a \\cos \\beta + 2 b \\sin \\beta = c$<br><br>Subtracting the second equation from the first gives:<br><br>$\\sqrt{3} a (\\cos \\alpha - \\cos \\beta) + 2 b (\\sin \\alpha - \\sin \\beta) = 0$<br><br>Using the sum-to-product formulas:<br><br>$\\sqrt{3} a \\left( -2 \\sin\\left(\\dfrac{\\alpha+\\beta}{2}\\right) \\sin\\left(\\dfrac{\\alpha-\\beta}{2}\\right) \\right) + 2 b \\left( 2 \\cos\\left(\\dfrac{\\alpha+\\beta}{2}\\right) \\sin\\left(\\dfrac{\\alpha-\\beta}{2}\\right) \\right) = 0$<br><br>Since $\\alpha$ and $\\beta$ are distinct roots, $\\sin\\left(\\dfrac{\\alpha-\\beta}{2}\\right) \\neq 0$. Dividing the entire equation by $2 \\sin\\left(\\dfrac{\\alpha-\\beta}{2}\\right)$ yields:<br><br>$-\\sqrt{3} a \\sin\\left(\\dfrac{\\alpha+\\beta}{2}\\right) + 2 b \\cos\\left(\\dfrac{\\alpha+\\beta}{2}\\right) = 0$<br><br>We are given that $\\alpha + \\beta = \\dfrac{\\pi}{3}$, which means $\\dfrac{\\alpha+\\beta}{2} = \\dfrac{\\pi}{6}$. Substituting this value into the equation:<br><br>$-\\sqrt{3} a \\sin\\left(\\dfrac{\\pi}{6}\\right) + 2 b \\cos\\left(\\dfrac{\\pi}{6}\\right) = 0$<br><br>$-\\sqrt{3} a \\left(\\dfrac{1}{2}\\right) + 2 b \\left(\\dfrac{\\sqrt{3}}{2}\\right) = 0$<br><br>$-\\sqrt{3} a + 2 \\sqrt{3} b = 0$<br><br>$2 \\sqrt{3} b = \\sqrt{3} a$<br><br>$\\dfrac{b}{a} = \\dfrac{1}{2} = 0.5$<br><br>Answer: 0.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214160aee93fa0796dddb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The number of integral values of k for which the equation $7 \\cos x+5 \\sin x=2 \\mathrm{k}+1$ has a solution, is", "image": null}, "options": [{"id": "jtJuS", "text": "4", "image": null, "isCorrect": false}, {"id": "B3hbC", "text": "8", "image": null, "isCorrect": true}, {"id": "oFSlQ", "text": "10", "image": null, "isCorrect": false}, {"id": "hdYM6", "text": "12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The maximum and minimum values of $a \\cos x + b \\sin x$ are $\\sqrt{a^2 + b^2}$ and $-\\sqrt{a^2 + b^2}$ respectively.<br><br>For the expression $7 \\cos x + 5 \\sin x$, we have $a = 7$ and $b = 5$.<br><br>$-\\sqrt{7^2 + 5^2} \\le 7 \\cos x + 5 \\sin x \\le \\sqrt{7^2 + 5^2}$<br><br>$-\\sqrt{74} \\le 2k + 1 \\le \\sqrt{74}$<br><br>Since $8 < \\sqrt{74} < 9$, we can approximate $\\sqrt{74} \\approx 8.6$.<br><br>$-8.6 \\le 2k + 1 \\le 8.6$<br><br>Subtracting $1$ from all sides:<br><br>$-9.6 \\le 2k \\le 7.6$<br><br>Dividing by $2$:<br><br>$-4.8 \\le k \\le 3.8$<br><br>Since $k$ is an integer, the possible values of $k$ are $-4, -3, -2, -1, 0, 1, 2, 3$.<br><br>The number of integral values of $k$ is $8$.<br><br>Answer: 8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c70aee93fa0796db70", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The numerical value of $\\tan \\left(2 \\tan ^{-1}\\left(\\dfrac{1}{5}\\right)+\\dfrac{\\pi}{4}\\right)$", "image": null}, "options": [{"id": "gQAkK", "text": "$\\dfrac{-7}{17}$", "image": null, "isCorrect": false}, {"id": "Lb5dx", "text": "$\\dfrac{-17}{7}$", "image": null, "isCorrect": false}, {"id": "EH4SV", "text": "$\\dfrac{17}{7}$", "image": null, "isCorrect": true}, {"id": "cbPQb", "text": "$\\dfrac{7}{17}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\theta = 2 \\tan^{-1}\\left(\\dfrac{1}{5}\\right)$<br><br>Using the formula $2 \\tan^{-1} x = \\tan^{-1} \\left(\\dfrac{2x}{1 - x^2}\\right)$ for $|x| < 1$:<br><br>$\\theta = \\tan^{-1} \\left(\\dfrac{2 \\times \\dfrac{1}{5}}{1 - \\left(\\dfrac{1}{5}\\right)^2}\\right) = \\tan^{-1} \\left(\\dfrac{\\dfrac{2}{5}}{\\dfrac{24}{25}}\\right) = \\tan^{-1} \\left(\\dfrac{5}{12}\\right)$<br><br>Thus, $\\tan \\theta = \\dfrac{5}{12}$<br><br>The given expression is $\\tan \\left(\\theta + \\dfrac{\\pi}{4}\\right)$<br><br>Using the identity $\\tan(A + B) = \\dfrac{\\tan A + \\tan B}{1 - \\tan A \\tan B}$:<br><br>$\\tan \\left(\\theta + \\dfrac{\\pi}{4}\\right) = \\dfrac{\\tan \\theta + \\tan \\dfrac{\\pi}{4}}{1 - \\tan \\theta \\tan \\dfrac{\\pi}{4}}$<br><br>Substituting $\\tan \\theta = \\dfrac{5}{12}$ and $\\tan \\dfrac{\\pi}{4} = 1$:<br><br>$\\tan \\left(\\theta + \\dfrac{\\pi}{4}\\right) = \\dfrac{\\dfrac{5}{12} + 1}{1 - \\dfrac{5}{12} \\times 1} = \\dfrac{\\dfrac{17}{12}}{\\dfrac{7}{12}} = \\dfrac{17}{7}$<br><br>Answer: $\\dfrac{17}{7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a10aee93fa0796da4b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "If $\\alpha+\\beta=\\dfrac{\\pi}{2}$ and $\\beta+\\gamma=\\alpha$, then $\\tan \\alpha$ equals", "image": null}, "options": [{"id": "7JPDX", "text": "$2(\\tan \\beta+\\tan \\gamma)$", "image": null, "isCorrect": false}, {"id": "rwmaC", "text": "$\\tan \\beta+\\tan \\gamma$", "image": null, "isCorrect": false}, {"id": "13QYi", "text": "$\\tan \\beta+2 \\tan \\gamma$", "image": null, "isCorrect": true}, {"id": "2wFkI", "text": "$2 \\tan \\beta+\\tan \\gamma$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\alpha + \\beta = \\dfrac{\\pi}{2}$, we have $\\tan \\alpha = \\cot \\beta$, which gives $\\tan \\alpha \\tan \\beta = 1$.<br><br>From $\\beta + \\gamma = \\alpha$, we get $\\gamma = \\alpha - \\beta$.<br><br>Taking tangent on both sides:<br><br>$\\tan \\gamma = \\tan(\\alpha - \\beta)$<br><br>$\\tan \\gamma = \\dfrac{\\tan \\alpha - \\tan \\beta}{1 + \\tan \\alpha \\tan \\beta}$<br><br>Substituting $\\tan \\alpha \\tan \\beta = 1$ in the denominator:<br><br>$\\tan \\gamma = \\dfrac{\\tan \\alpha - \\tan \\beta}{1 + 1}$<br><br>$2 \\tan \\gamma = \\tan \\alpha - \\tan \\beta$<br><br>$\\tan \\alpha = \\tan \\beta + 2 \\tan \\gamma$<br><br>Answer: $\\tan \\beta+2 \\tan \\gamma$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213920aee93fa0796d9d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If $\\mathrm{A}\\gt\\mathrm{B}$ and $\\tan \\mathrm{A}-\\tan \\mathrm{B}=x$ and $\\cot \\mathrm{B}-\\cot \\mathrm{A}=y$, then $\\cot (\\mathrm{A}-\\mathrm{B})=$", "image": null}, "options": [{"id": "PcNme", "text": "$\\dfrac{1}{y}-\\dfrac{1}{x}$", "image": null, "isCorrect": false}, {"id": "0qkzx", "text": "$\\dfrac{1}{x}-\\dfrac{1}{y}$", "image": null, "isCorrect": false}, {"id": "3EjTG", "text": "$\\dfrac{1}{x}+\\dfrac{1}{y}$", "image": null, "isCorrect": true}, {"id": "1cNTx", "text": "$\\dfrac{x y}{x-y}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\tan \\mathrm{A} - \\tan \\mathrm{B} = x$<br><br>And $\\cot \\mathrm{B} - \\cot \\mathrm{A} = y$<br><br>$\\dfrac{1}{\\tan \\mathrm{B}} - \\dfrac{1}{\\tan \\mathrm{A}} = y$<br><br>$\\dfrac{\\tan \\mathrm{A} - \\tan \\mathrm{B}}{\\tan \\mathrm{A} \\tan \\mathrm{B}} = y$<br><br>Substituting $\\tan \\mathrm{A} - \\tan \\mathrm{B} = x$, we get:<br><br>$\\dfrac{x}{\\tan \\mathrm{A} \\tan \\mathrm{B}} = y$<br><br>$\\tan \\mathrm{A} \\tan \\mathrm{B} = \\dfrac{x}{y}$<br><br>We know that $\\cot(\\mathrm{A}-\\mathrm{B}) = \\dfrac{1}{\\tan(\\mathrm{A}-\\mathrm{B})}$<br><br>$\\tan(\\mathrm{A}-\\mathrm{B}) = \\dfrac{\\tan \\mathrm{A} - \\tan \\mathrm{B}}{1 + \\tan \\mathrm{A} \\tan \\mathrm{B}}$<br><br>Substituting the values of $(\\tan \\mathrm{A} - \\tan \\mathrm{B})$ and $\\tan \\mathrm{A} \\tan \\mathrm{B}$:<br><br>$\\tan(\\mathrm{A}-\\mathrm{B}) = \\dfrac{x}{1 + \\dfrac{x}{y}} = \\dfrac{xy}{x+y}$<br><br>Therefore, $\\cot(\\mathrm{A}-\\mathrm{B}) = \\dfrac{x+y}{xy} = \\dfrac{1}{x} + \\dfrac{1}{y}$<br><br>Answer: $\\dfrac{1}{x}+\\dfrac{1}{y}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213670aee93fa0796d884", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The number of all values of $\\theta$ in the interval $\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$ satisfying the equation $(1-\\tan \\theta)(1+\\tan \\theta) \\sec ^2 \\theta+2 \\tan ^2 \\theta=0$ is", "image": null}, "options": [{"id": "FUcyA", "text": "1", "image": null, "isCorrect": false}, {"id": "vLCpX", "text": "0", "image": null, "isCorrect": false}, {"id": "RqUO8", "text": "2", "image": null, "isCorrect": true}, {"id": "JZWsq", "text": "infinitely many.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is $(1-\\tan \\theta)(1+\\tan \\theta) \\sec ^2 \\theta+2 \\tan ^2 \\theta=0$<br><br>Using the algebraic identity $(a-b)(a+b) = a^2 - b^2$ and the trigonometric identity $\\sec^2 \\theta = 1 + \\tan^2 \\theta$, we get:<br><br>$(1-\\tan^2 \\theta)(1+\\tan^2 \\theta) + 2\\tan^2 \\theta = 0$<br><br>$1 - \\tan^4 \\theta + 2\\tan^2 \\theta = 0$<br><br>$\\tan^4 \\theta - 2\\tan^2 \\theta - 1 = 0$<br><br>Let $\\tan^2 \\theta = t$. The equation becomes a quadratic in $t$:<br><br>$t^2 - 2t - 1 = 0$<br><br>Solving for $t$ using the quadratic formula:<br><br>$t = \\dfrac{2 \\pm \\sqrt{4 - 4(1)(-1)}}{2} = \\dfrac{2 \\pm \\sqrt{8}}{2} = 1 \\pm \\sqrt{2}$<br><br>Since $t = \\tan^2 \\theta \\ge 0$, we reject the negative root $t = 1 - \\sqrt{2}$.<br><br>Thus, $\\tan^2 \\theta = 1 + \\sqrt{2}$<br><br>$\\tan \\theta = \\pm \\sqrt{1 + \\sqrt{2}}$<br><br>In the interval $\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$, the function $\\tan \\theta$ takes every real value exactly once. Since we have two distinct real values for $\\tan \\theta$, there are exactly 2 values of $\\theta$ that satisfy the given equation.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213400aee93fa0796d751", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "If $\\alpha+\\beta+\\gamma=\\pi$, then the expression $\\sin ^2 \\alpha+\\sin ^2 \\beta-\\sin ^2 \\gamma$ has the value", "image": null}, "options": [{"id": "WxyXW", "text": "$2 \\sin \\alpha \\sin \\beta \\sin \\gamma$", "image": null, "isCorrect": false}, {"id": "6TotM", "text": "$2 \\cos \\alpha \\sin \\beta \\sin \\gamma$", "image": null, "isCorrect": false}, {"id": "khK4d", "text": "$2 \\sin \\alpha \\cos \\beta \\sin \\gamma$", "image": null, "isCorrect": false}, {"id": "IJfdN", "text": "$2 \\sin \\alpha \\sin \\beta \\cos \\gamma$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given expression is $\\sin^2 \\alpha + \\sin^2 \\beta - \\sin^2 \\gamma$.<br><br>Using the identity $\\sin^2 A - \\sin^2 B = \\sin(A+B)\\sin(A-B)$, we can write:<br><br>$\\sin^2 \\alpha - \\sin^2 \\gamma = \\sin(\\alpha+\\gamma)\\sin(\\alpha-\\gamma)$<br><br>Since $\\alpha+\\beta+\\gamma = \\pi$, we have $\\alpha+\\gamma = \\pi-\\beta$.<br><br>Therefore, $\\sin(\\alpha+\\gamma) = \\sin(\\pi-\\beta) = \\sin \\beta$.<br><br>Substituting this back into the expression:<br><br>$\\sin^2 \\alpha + \\sin^2 \\beta - \\sin^2 \\gamma = \\sin^2 \\beta + \\sin \\beta \\sin(\\alpha-\\gamma)$<br><br>Taking $\\sin \\beta$ common:<br><br>$= \\sin \\beta [\\sin \\beta + \\sin(\\alpha-\\gamma)]$<br><br>Again using $\\sin \\beta = \\sin(\\alpha+\\gamma)$ inside the bracket:<br><br>$= \\sin \\beta [\\sin(\\alpha+\\gamma) + \\sin(\\alpha-\\gamma)]$<br><br>Using the sum-to-product formula $\\sin(A+B) + \\sin(A-B) = 2 \\sin A \\cos B$:<br><br>$= \\sin \\beta [2 \\sin \\alpha \\cos \\gamma]$<br><br>$= 2 \\sin \\alpha \\sin \\beta \\cos \\gamma$<br><br>Answer: $2 \\sin \\alpha \\sin \\beta \\cos \\gamma$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132d0aee93fa0796d6bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The length of the longest interval, in which the function $3 \\sin x-4 \\sin ^3 x$ is increasing, is", "image": null}, "options": [{"id": "NCsBt", "text": "$\\dfrac{\\pi}{3}$", "image": null, "isCorrect": true}, {"id": "vvezX", "text": "$\\dfrac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "2zAsf", "text": "$\\dfrac{3 \\pi}{2}$", "image": null, "isCorrect": false}, {"id": "PzP25", "text": "$\\pi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given function is $f(x) = 3 \\sin x - 4 \\sin^3 x$<br><br>Using the triple angle formula, we can write $f(x) = \\sin 3x$<br><br>For the function to be increasing, its derivative must be greater than or equal to zero, $f'(x) \\ge 0$<br><br>$f'(x) = 3 \\cos 3x \\ge 0$<br><br>$\\cos 3x \\ge 0$<br><br>The general solution for $\\cos \\theta \\ge 0$ is $-\\dfrac{\\pi}{2} + 2n\\pi \\le \\theta \\le \\dfrac{\\pi}{2} + 2n\\pi$, where $n$ is an integer.<br><br>$-\\dfrac{\\pi}{2} + 2n\\pi \\le 3x \\le \\dfrac{\\pi}{2} + 2n\\pi$<br><br>$-\\dfrac{\\pi}{6} + \\dfrac{2n\\pi}{3} \\le x \\le \\dfrac{\\pi}{6} + \\dfrac{2n\\pi}{3}$<br><br>The length of each such interval is $\\left(\\dfrac{\\pi}{6} + \\dfrac{2n\\pi}{3}\\right) - \\left(-\\dfrac{\\pi}{6} + \\dfrac{2n\\pi}{3}\\right) = \\dfrac{\\pi}{3}$<br><br>Thus, the length of the longest interval in which the function is increasing is $\\dfrac{\\pi}{3}$.<br><br>Answer: $\\dfrac{\\pi}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262880279619d9d8a354b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "If a $\\cos 2 \\theta+b \\sin 2 \\theta=c$ has $\\alpha$ and $\\beta$ as its roots, then the value of $\\tan \\alpha+\\tan \\beta$ is", "image": null}, "options": [{"id": "grpZZ", "text": "$\\frac{2 b}{c+a}$", "image": null, "isCorrect": true}, {"id": "taoPz", "text": "$\\frac{2 a}{b+c}$", "image": null, "isCorrect": false}, {"id": "tKQgg", "text": "$\\frac{b}{c+a}$", "image": null, "isCorrect": false}, {"id": "29fgS", "text": "$\\frac{a}{b+c}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { We have, } \\mathrm{a} \\cos 2 \\theta+\\mathrm{b} \\sin 2 \\theta=\\mathrm{c} \\\\ & \\Rightarrow \\mathrm{a}\\left(\\frac{1-\\tan ^2 \\theta}{1+\\tan ^2 \\theta}\\right)+\\mathrm{b}\\left(\\frac{2 \\tan \\theta}{1+\\tan ^2 \\theta}\\right)=\\mathrm{c} \\\\ & \\Rightarrow \\mathrm{a}-\\mathrm{a} \\tan ^2 \\theta+2 \\mathrm{~b} \\tan \\theta=\\mathrm{c}+\\mathrm{c} \\tan ^2 \\theta \\\\ & \\Rightarrow-(\\mathrm{a}+\\mathrm{c}) \\tan ^2 \\theta+2 \\mathrm{~b} \\tan \\theta+(\\mathrm{a}-\\mathrm{c})=0 \\\\ & \\therefore \\quad \\tan \\alpha+\\tan \\beta=-\\frac{2 \\mathrm{~b}}{-(\\mathrm{c}+\\mathrm{a})}=\\frac{2 \\mathrm{~b}}{\\mathrm{c}+\\mathrm{a}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262720279619d9d8a349b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "If $\\sin (\\theta-\\alpha), \\sin \\theta$ and $\\sin (\\theta+\\alpha)$ are in H.P., then the value of $\\cos 2 \\theta$ is", "image": null}, "options": [{"id": "ogLBs", "text": "$1+4 \\cos ^2 \\frac{\\alpha}{2}$", "image": null, "isCorrect": false}, {"id": "aDOj0", "text": "$1-4 \\cos ^2 \\frac{\\alpha}{2}$", "image": null, "isCorrect": true}, {"id": "6J2LN", "text": "$-1-4 \\cos ^2 \\frac{\\alpha}{2}$", "image": null, "isCorrect": false}, {"id": "ECocb", "text": "$-1+4 \\cos ^2 \\frac{\\alpha}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\sin (\\theta-\\alpha), \\sin \\theta$ and $\\sin (\\theta+\\alpha)$ are in H.P. $\\Rightarrow \\frac{1}{\\sin (\\theta-\\alpha)}, \\frac{1}{\\sin \\theta}, \\frac{1}{\\sin (\\theta+\\alpha)}$ will be in A.P.\n$$\n\\therefore \\quad \\frac{2}{\\sin \\theta}=\\frac{1}{\\sin (\\theta-\\alpha)}+\\frac{1}{\\sin (\\theta+\\alpha)}\n$$\n$\\begin{aligned} & \\Rightarrow \\frac{2}{\\sin \\theta}=\\frac{\\sin (\\theta+\\alpha)+\\sin (\\theta-\\alpha)}{\\sin (\\theta-\\alpha) \\sin (\\theta+\\alpha)} \\\\ & \\Rightarrow \\frac{2}{\\sin \\theta}=\\frac{2 \\sin \\theta \\cos \\alpha}{\\sin ^2 \\theta-\\sin ^2 \\alpha} \\\\ & \\Rightarrow \\sin ^2 \\theta-\\sin ^2 \\alpha=\\sin ^2 \\theta \\cos \\alpha \\\\ & \\Rightarrow \\sin ^2 \\theta(1-\\cos \\alpha)=\\sin ^2 \\alpha \\\\ & \\Rightarrow \\sin ^2 \\theta\\left(2 \\sin ^2 \\frac{\\alpha}{2}\\right)=4 \\sin ^2 \\frac{\\alpha}{2} \\cos ^2 \\frac{\\alpha}{2} \\\\ & \\Rightarrow 1-\\cos ^2 \\theta=2 \\cos ^2 \\frac{\\alpha}{2} \\\\ & \\Rightarrow \\cos ^2 \\theta=1-2 \\cos ^2 \\frac{\\alpha}{2} \\\\ & \\Rightarrow 2 \\cos ^2 \\theta-1=1-4 \\cos ^2 \\frac{\\alpha}{2} \\\\ & \\Rightarrow \\cos 2 \\theta=1-4 \\cos ^2 \\frac{\\alpha}{2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262620279619d9d8a3417", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "The solutions of $\\sin x+\\sin 5 x=\\sin 3 x$ in $\\left(0, \\frac{\\pi}{2}\\right)$ are", "image": null}, "options": [{"id": "uhatD", "text": "$\\frac{\\pi}{4}, \\frac{\\pi}{10}$", "image": null, "isCorrect": false}, {"id": "uwfDb", "text": "$\\frac{\\pi}{6}, \\frac{\\pi}{3}$", "image": null, "isCorrect": true}, {"id": "dC4qh", "text": "$\\frac{\\pi}{4}, \\frac{\\pi}{12}$", "image": null, "isCorrect": false}, {"id": "XJiA8", "text": "$\\frac{\\pi}{8}, \\frac{\\pi}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\sin x+\\sin 5 x=\\sin 3 x \\\\ & \\Rightarrow 2 \\sin 3 x \\cos 2 x=\\sin 3 x \\\\ & \\Rightarrow \\sin 3 x(2 \\cos 2 x-1)=0 \\\\ & \\Rightarrow \\sin 3 x=0 \\text { or } \\cos 2 x=\\frac{1}{2}=\\cos \\frac{\\pi}{3} \\\\ & \\Rightarrow 3 x=\\mathrm{n} \\pi \\text { or } 2 x=2 \\mathrm{n} \\pi \\pm \\frac{\\pi}{3} \\\\ & \\Rightarrow x=\\frac{\\mathrm{n} \\pi}{3} \\text { or } x=\\mathrm{n} \\pi \\pm \\frac{\\pi}{6}\\end{aligned}$\n$\\Rightarrow x=\\frac{\\pi}{3}, \\frac{\\pi}{6} \\quad \\quad \\ldots\\left[\\because x \\in\\left(0, \\frac{\\pi}{2}\\right)\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624d0279619d9d8a336f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "The value of $\\begin{aligned} \\cos \\left(18^{\\circ}-\\mathrm{A}\\right) \\cdot \\cos ( & \\left.18^{\\circ}+\\mathrm{A}\\right) \\\\ & -\\cos \\left(72^{\\circ}-\\mathrm{A}\\right) \\cos \\left(72^{\\circ}+\\mathrm{A}\\right) \\text { is }\\end{aligned}$", "image": null}, "options": [{"id": "Jt9Jl", "text": "$\\cos 72^{\\circ}$", "image": null, "isCorrect": false}, {"id": "AJvz9", "text": "$\\sin 54^{\\circ}$", "image": null, "isCorrect": true}, {"id": "N9mzt", "text": "$\\sin 18^{\\circ}$", "image": null, "isCorrect": false}, {"id": "Q51Er", "text": "$\\cos 54^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\cos \\left(18^{\\circ}-\\mathrm{A}\\right) \\cos \\left(18^{\\circ}+\\mathrm{A}\\right) \\\\ & \\quad-\\cos \\left(72^{\\circ}-\\mathrm{A}\\right) \\cos \\left(72^{\\circ}+\\mathrm{A}\\right) \\\\ & =\\cos \\left(18^{\\circ}-\\mathrm{A}\\right) \\cos \\left[90^{\\circ}-\\left(72^{\\circ}-\\mathrm{A}\\right)\\right] \\\\ & \\quad-\\cos \\left(72^{\\circ}-\\mathrm{A}\\right) \\cos \\left[90^{\\circ}-\\left(18^{\\circ}-\\mathrm{A}\\right)\\right] \\\\ & =\\sin \\left(72^{\\circ}-\\mathrm{A}\\right) \\cos \\left(18^{\\circ}-\\mathrm{A}\\right) \\\\ & \\quad \\quad-\\cos \\left(72^{\\circ}-\\mathrm{A}\\right) \\sin \\left(18^{\
