  <script>
    const data = {"index": 20, "chapterId": "61c089adb180dc3526fa9e4c", "chapter": "Mathematical Reasoning", "exam": "MHT CET", "subject": "Mathematics", "totalTopics": 1, "totalQuestions": 265, "downloadTime": "2026-10-08 20:43:11", "topics": [{"index": 1, "topicId": "65a263410279619d9d8a3d84", "title": "Mathematical Reasoning", "totalQuestions": 265, "questions": [{"_id": "6abb88d615a9fc0fc8c1476e", "type": "singleCorrect", "question": {"text": "The logical statement $\\sim [(p \\rightarrow q) \\leftrightarrow (p \\wedge \\sim q)]$ is", "image": null}, "options": [{"id": "FELMf", "label": "A", "text": "a fallacy", "isCorrect": false, "image": null}, {"id": "EReJn", "label": "B", "text": "equivalent to $p \\wedge q$", "isCorrect": false, "image": null}, {"id": "vYKBJ", "label": "C", "text": "equivalent to $p \\vee q$", "isCorrect": false, "image": null}, {"id": "CnF5R", "label": "D", "text": "a tautology", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $X \\equiv p \\rightarrow q$.<br><br>The negation of $X$ is $\\sim (p \\rightarrow q) \\equiv p \\wedge \\sim q$.<br><br>The given logical statement can be written as $\\sim [X \\leftrightarrow \\sim X]$.<br><br>The biconditional statement $X \\leftrightarrow \\sim X$ is always false, which means it is a contradiction (fallacy).<br><br>The negation of a contradiction is always true.<br><br>Therefore, the given statement is a tautology.<br><br>Answer: a tautology", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88d615a9fc0fc8c1476d", "type": "singleCorrect", "question": {"text": "If $p, q, r$ are statements with truth values F, T, F respectively then the truth values of $(p \\wedge q) \\leftrightarrow \\sim p$ and $q \\rightarrow (p \\vee \\sim r)$ are respectively _____", "image": null}, "options": [{"id": "tD84A", "label": "A", "text": "T, F", "isCorrect": false, "image": null}, {"id": "19qUf", "label": "B", "text": "T, T", "isCorrect": false, "image": null}, {"id": "rpLDR", "label": "C", "text": "F, F", "isCorrect": false, "image": null}, {"id": "iELEg", "label": "D", "text": "F, T", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $p = F$, $q = T$, $r = F$.<br><br>For the first statement $(p \\wedge q) \\leftrightarrow \\sim p$:<br>$p \\wedge q \\equiv F \\wedge T \\equiv F$<br>$\\sim p \\equiv \\sim F \\equiv T$<br>Therefore, $(p \\wedge q) \\leftrightarrow \\sim p \\equiv F \\leftrightarrow T \\equiv F$.<br><br>For the second statement $q \\rightarrow (p \\vee \\sim r)$:<br>$\\sim r \\equiv \\sim F \\equiv T$<br>$p \\vee \\sim r \\equiv F \\vee T \\equiv T$<br>Therefore, $q \\rightarrow (p \\vee \\sim r) \\equiv T \\rightarrow T \\equiv T$.<br><br>The truth values are F and T respectively.<br><br>Answer: F, T", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a515a9fc0fc8c145ad", "type": "singleCorrect", "question": {"text": "The statement pattern $[p \\wedge (q \\vee r)] \\vee [\\sim r \\wedge \\sim q \\wedge p]$ is equivalent to _____", "image": null}, "options": [{"id": "JzhHt", "label": "A", "text": "$q \\vee r$", "isCorrect": false, "image": null}, {"id": "TflEh", "label": "B", "text": "$p \\vee r$", "isCorrect": false, "image": null}, {"id": "0zFyO", "label": "C", "text": "$r$", "isCorrect": false, "image": null}, {"id": "aV4Ae", "label": "D", "text": "$p$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given statement pattern: $[p \\wedge (q \\vee r)] \\vee [\\sim r \\wedge \\sim q \\wedge p]$<br><br>Using commutative law on the second bracket:<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge (\\sim q \\wedge \\sim r)]$<br><br>Using De Morgan's law on $(\\sim q \\wedge \\sim r)$:<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge \\sim (q \\vee r)]$<br><br>Using distributive law:<br><br>$p \\wedge [(q \\vee r) \\vee \\sim (q \\vee r)]$<br><br>Since $x \\vee \\sim x \\equiv T$ (Tautology), we get:<br><br>$p \\wedge T$<br><br>Since $p \\wedge T \\equiv p$, the statement pattern is equivalent to $p$.<br><br>Answer: $p$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a515a9fc0fc8c145ac", "type": "singleCorrect", "question": {"text": "Consider the following statements -<br>(i) If a person is social, then he is happy.<br>(ii) If a person is not social, then he is not happy.<br>(iii) If a person is not happy, then he is not social.<br>(iv) If a person is happy, then he is social.<br>Which of the above statements are equivalent?", "image": null}, "options": [{"id": "scgLZ", "label": "A", "text": "(i) and (iv), (ii) and (iii)", "isCorrect": false, "image": null}, {"id": "8qKrV", "label": "B", "text": "(i) and (iii), (ii) and (iv)", "isCorrect": true, "image": null}, {"id": "6uZfQ", "label": "C", "text": "(i) and (ii), (iii) and (iv)", "isCorrect": false, "image": null}, {"id": "RLsMM", "label": "D", "text": "(i) and (iii), (i) and (iv)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"A person is social\" and $q$ be the statement \"A person is happy\".<br><br>The given statements can be written in symbolic form as:<br>(i) $p \\rightarrow q$<br>(ii) $\\sim p \\rightarrow \\sim q$<br>(iii) $\\sim q \\rightarrow \\sim p$<br>(iv) $q \\rightarrow p$<br><br>A conditional statement is logically equivalent to its contrapositive.<br><br>The contrapositive of $p \\rightarrow q$ is $\\sim q \\rightarrow \\sim p$. Thus, statement (i) is equivalent to statement (iii).<br><br>The contrapositive of $\\sim p \\rightarrow \\sim q$ is $\\sim (\\sim q) \\rightarrow \\sim (\\sim p)$, which simplifies to $q \\rightarrow p$. Thus, statement (ii) is equivalent to statement (iv).<br><br>Therefore, (i) and (iii) are equivalent, and (ii) and (iv) are equivalent.<br><br>Answer: (i) and (iii), (ii) and (iv)", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a515a9fc0fc8c145ab", "type": "singleCorrect", "question": {"text": "The negation of the statement $(p \\wedge \\sim q) \\to (\\sim p \\vee r)$ is equivalent to:", "image": null}, "options": [{"id": "a8kJb", "label": "A", "text": "$(p \\wedge \\sim q) \\wedge (\\sim r)$", "isCorrect": true, "image": null}, {"id": "VEpGl", "label": "B", "text": "$(p \\vee \\sim q) \\wedge (p \\wedge \\sim r)$", "isCorrect": false, "image": null}, {"id": "BdgfO", "label": "C", "text": "$(\\sim p \\vee q) \\vee (p \\wedge \\sim r)$", "isCorrect": false, "image": null}, {"id": "NdSWb", "label": "D", "text": "$(p \\wedge \\sim q) \\vee (p \\wedge \\sim r)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement is $(p \\wedge \\sim q) \\to (\\sim p \\vee r)$.<br><br>The negation of an implication $X \\to Y$ is $X \\wedge \\sim Y$.<br><br>Here, $X = p \\wedge \\sim q$ and $Y = \\sim p \\vee r$.<br><br>The negation of the given statement is $(p \\wedge \\sim q) \\wedge \\sim (\\sim p \\vee r)$.<br><br>Using De Morgan's Law, $\\sim (\\sim p \\vee r) \\equiv p \\wedge \\sim r$.<br><br>Substituting this back, we get $(p \\wedge \\sim q) \\wedge (p \\wedge \\sim r)$.<br><br>Using the associative law and the idempotent law $p \\wedge p \\equiv p$, this simplifies to $p \\wedge \\sim q \\wedge \\sim r$.<br><br>This can be grouped as $(p \\wedge \\sim q) \\wedge (\\sim r)$.<br><br>Answer: $(p \\wedge \\sim q) \\wedge (\\sim r)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884615a9fc0fc8c14229", "type": "singleCorrect", "question": {"text": "The statement pattern $p \\rightarrow (q \\rightarrow p) \\equiv$", "image": null}, "options": [{"id": "A8IIU", "label": "A", "text": "$p \\rightarrow (p \\rightarrow q)$", "isCorrect": false, "image": null}, {"id": "HnR0t", "label": "B", "text": "$p \\rightarrow (p \\wedge q)$", "isCorrect": false, "image": null}, {"id": "VhdxN", "label": "C", "text": "$p \\rightarrow (p \\leftrightarrow q)$", "isCorrect": false, "image": null}, {"id": "IWAJD", "label": "D", "text": "$p \\rightarrow (p \\vee q)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given statement pattern is $p \\rightarrow (q \\rightarrow p)$.<br><br>Using the logical equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$, we can simplify the expression:<br><br>$p \\rightarrow (q \\rightarrow p) \\equiv \\sim p \\vee (\\sim q \\vee p)$<br><br>Using the associative and commutative laws:<br><br>$\\equiv (\\sim p \\vee p) \\vee \\sim q$<br><br>Since $\\sim p \\vee p \\equiv T$ (a tautology):<br><br>$\\equiv T \\vee \\sim q \\equiv T$<br><br>Thus, the given statement pattern is a tautology.<br><br>Now, checking the given options:<br><br>For $p \\rightarrow (p \\rightarrow q)$:<br>$\\equiv \\sim p \\vee (\\sim p \\vee q) \\equiv \\sim p \\vee q$ (Not a tautology)<br><br>For $p \\rightarrow (p \\wedge q)$:<br>$\\equiv \\sim p \\vee (p \\wedge q) \\equiv (\\sim p \\vee p) \\wedge (\\sim p \\vee q) \\equiv T \\wedge (\\sim p \\vee q) \\equiv \\sim p \\vee q$ (Not a tautology)<br><br>For $p \\rightarrow (p \\leftrightarrow q)$:<br>If $p$ is True and $q$ is False, $p \\leftrightarrow q$ is False. Then $T \\rightarrow F$ is False. (Not a tautology)<br><br>For $p \\rightarrow (p \\vee q)$:<br>$\\equiv \\sim p \\vee (p \\vee q) \\equiv (\\sim p \\vee p) \\vee q \\equiv T \\vee q \\equiv T$<br><br>Since $p \\rightarrow (p \\vee q)$ is also a tautology, it is logically equivalent to $p \\rightarrow (q \\rightarrow p)$.<br><br>Answer: $p \\rightarrow (p \\vee q)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884615a9fc0fc8c14227", "type": "singleCorrect", "question": {"text": "The negation of the inverse of $\\sim p \\rightarrow q$ is equivalent to:", "image": null}, "options": [{"id": "cvf1t", "label": "A", "text": "$\\sim q \\rightarrow p$", "isCorrect": false, "image": null}, {"id": "2BMYV", "label": "B", "text": "$\\sim q \\wedge p$", "isCorrect": false, "image": null}, {"id": "MhGvX", "label": "C", "text": "$\\sim p \\wedge \\sim q$", "isCorrect": false, "image": null}, {"id": "qBJ4K", "label": "D", "text": "$p \\wedge q$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given statement is $\\sim p \\rightarrow q$.<br><br>The inverse of a conditional statement $A \\rightarrow B$ is $\\sim A \\rightarrow \\sim B$.<br><br>Substituting $A = \\sim p$ and $B = q$, the inverse of the given statement is $\\sim(\\sim p) \\rightarrow \\sim q$, which simplifies to $p \\rightarrow \\sim q$.<br><br>We need to find the negation of this inverse, which is $\\sim(p \\rightarrow \\sim q)$.<br><br>Using the logical equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$, we can rewrite the inverse as $p \\rightarrow \\sim q \\equiv \\sim p \\vee \\sim q$.<br><br>Now, applying the negation:<br><br>$\\sim(\\sim p \\vee \\sim q)$<br><br>By De Morgan's laws, this is equivalent to $p \\wedge q$.<br><br>Answer: $p \\wedge q$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885615a9fc0fc8c142bf", "type": "singleCorrect", "question": {"text": "The statement $(p \\wedge (\\sim q)) \\vee ((\\sim p) \\wedge q) \\vee ((\\sim p) \\wedge (\\sim q))$ is equivalent to :", "image": null}, "options": [{"id": "j9oqV", "label": "A", "text": "$(p \\vee q)$", "isCorrect": false, "image": null}, {"id": "X9SWF", "label": "B", "text": "$p \\vee (\\sim q)$", "isCorrect": false, "image": null}, {"id": "gktsm", "label": "C", "text": "$\\sim p \\vee q$", "isCorrect": false, "image": null}, {"id": "cgvdi", "label": "D", "text": "$\\sim p \\vee \\sim q$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given expression is $(p \\wedge (\\sim q)) \\vee ((\\sim p) \\wedge q) \\vee ((\\sim p) \\wedge (\\sim q))$<br><br>Taking $(\\sim p)$ common from the last two terms using the distributive law, we get:<br><br>$(p \\wedge (\\sim q)) \\vee ((\\sim p) \\wedge (q \\vee (\\sim q)))$<br><br>Since $q \\vee (\\sim q)$ is a tautology (True), the expression becomes:<br><br>$(p \\wedge (\\sim q)) \\vee (\\sim p)$<br><br>Applying the distributive law again:<br><br>$(p \\vee (\\sim p)) \\wedge ((\\sim q) \\vee (\\sim p))$<br><br>Since $p \\vee (\\sim p)$ is a tautology (True), the expression simplifies to:<br><br>$(\\sim q) \\vee (\\sim p)$<br><br>By commutative law, this is equivalent to:<br><br>$\\sim p \\vee \\sim q$<br><br>Answer: $\\sim p \\vee \\sim q$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885615a9fc0fc8c142be", "type": "singleCorrect", "question": {"text": "Let $A = \\{1, 2, 3, \\ldots, 10\\}$. Consider the following statements:<br>$p: \\forall x \\in A,\\,x^2 - x > 0$<br>$q: \\exists x \\in A$, such that $x + 10 = 20$<br>Then the truth values of $p$ and $q$ are respectively ____", "image": null}, "options": [{"id": "NNl4D", "label": "A", "text": "$T,\\,T$", "isCorrect": false, "image": null}, {"id": "fgAg2", "label": "B", "text": "$T,\\,F$", "isCorrect": false, "image": null}, {"id": "jYI5x", "label": "C", "text": "$F,\\,T$", "isCorrect": true, "image": null}, {"id": "4BnNr", "label": "D", "text": "$F,\\,F$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\{1, 2, 3, \\ldots, 10\\}$.<br><br>For statement $p$: $\\forall x \\in A,\\,x^2 - x > 0$.<br>When $x = 1$, $x^2 - x = 1^2 - 1 = 0$, which is not greater than $0$.<br>Thus, statement $p$ is False ($F$).<br><br>For statement $q$: $\\exists x \\in A$, such that $x + 10 = 20$.<br>When $x = 10$, $x + 10 = 10 + 10 = 20$. Since $10 \\in A$, the statement is satisfied.<br>Thus, statement $q$ is True ($T$).<br><br>The truth values of $p$ and $q$ are respectively $F,\\,T$.<br><br>Answer: $F,\\,T$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885615a9fc0fc8c142bd", "type": "singleCorrect", "question": {"text": "If the compound statement $(p \\wedge \\sim q) \\rightarrow (q \\vee \\sim r)$ is false then which of the following statements is a true ?", "image": null}, "options": [{"id": "OwRlY", "label": "A", "text": "$(p \\wedge r) \\rightarrow q$", "isCorrect": false, "image": null}, {"id": "vPibB", "label": "B", "text": "$(\\sim p \\vee q) \\rightarrow r$", "isCorrect": true, "image": null}, {"id": "iMTI0", "label": "C", "text": "$(p \\rightarrow q) \\wedge r$", "isCorrect": false, "image": null}, {"id": "trAaB", "label": "D", "text": "$p \\rightarrow (q \\wedge r)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given compound statement is $(p \\wedge \\sim q) \\rightarrow (q \\vee \\sim r)$.<br><br>An implication $A \\rightarrow B$ is false if and only if $A$ is true and $B$ is false.<br><br>Therefore, $p \\wedge \\sim q$ is true and $q \\vee \\sim r$ is false.<br><br>For $p \\wedge \\sim q$ to be true, both $p$ and $\\sim q$ must be true. This gives $p$ is True (T) and $q$ is False (F).<br><br>For $q \\vee \\sim r$ to be false, both $q$ and $\\sim r$ must be false. Since $q$ is already False, $\\sim r$ must be False, which gives $r$ is True (T).<br><br>Thus, the truth values are $p = T$, $q = F$, and $r = T$.<br><br>Now, evaluating the given options:<br><br>Option 1: $(p \\wedge r) \\rightarrow q \\equiv (T \\wedge T) \\rightarrow F \\equiv T \\rightarrow F \\equiv F$<br><br>Option 2: $(\\sim p \\vee q) \\rightarrow r \\equiv (F \\vee F) \\rightarrow T \\equiv F \\rightarrow T \\equiv T$<br><br>Option 3: $(p \\rightarrow q) \\wedge r \\equiv (T \\rightarrow F) \\wedge T \\equiv F \\wedge T \\equiv F$<br><br>Option 4: $p \\rightarrow (q \\wedge r) \\equiv T \\rightarrow (F \\wedge T) \\equiv T \\rightarrow F \\equiv F$<br><br>Only the statement in the second option is true.<br><br>Answer: $(\\sim p \\vee q) \\rightarrow r$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b515a9fc0fc8c14643", "type": "singleCorrect", "question": {"text": "Let $p$: switch $S_1$ is closed, $q$: switch $S_2$ is closed.<br>Then, the equivalent symbolic form for the following circuit is:<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/15_may_shift_1__q113_d1.png\" />", "image": null}, "options": [{"id": "pt92F", "label": "A", "text": "$\\sim p \\wedge \\sim q$", "isCorrect": false, "image": null}, {"id": "iCUVa", "label": "B", "text": "$p \\wedge q$", "isCorrect": false, "image": null}, {"id": "WCmlS", "label": "C", "text": "$p \\vee q$", "isCorrect": false, "image": null}, {"id": "CrL7S", "label": "D", "text": "$\\sim p \\vee \\sim q$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $p$ represent the switch $S_1$ being closed and $q$ represent the switch $S_2$ being closed.<br><br>The switches $S_1'$ and $S_2'$ represent the negations $\\sim p$ and $\\sim q$ respectively.<br><br>The given circuit consists of three parallel branches. The logical expression for the circuit is the disjunction (OR) of the expressions for each branch:<br><br>Top branch: $S_1$ and $S_2'$ in series $\\rightarrow p \\wedge \\sim q$<br><br>Middle branch: $S_1'$ and $S_2$ in series $\\rightarrow \\sim p \\wedge q$<br><br>Bottom branch: $S_1'$ and $S_2'$ in series $\\rightarrow \\sim p \\wedge \\sim q$<br><br>The equivalent symbolic form for the entire circuit is:<br><br>$(p \\wedge \\sim q) \\vee (\\sim p \\wedge q) \\vee (\\sim p \\wedge \\sim q)$<br><br>Simplifying the expression by taking $\\sim p$ common from the last two terms:<br><br>$(p \\wedge \\sim q) \\vee [\\sim p \\wedge (q \\vee \\sim q)]$<br><br>Since $q \\vee \\sim q$ is a tautology (True), the expression becomes:<br><br>$(p \\wedge \\sim q) \\vee \\sim p$<br><br>Using the distributive law:<br><br>$(p \\vee \\sim p) \\wedge (\\sim q \\vee \\sim p)$<br><br>Since $p \\vee \\sim p$ is True, the expression simplifies to:<br><br>$\\sim q \\vee \\sim p$<br><br>This is equivalent to $\\sim p \\vee \\sim q$.<br><br>Answer: $\\sim p \\vee \\sim q$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b515a9fc0fc8c14642", "type": "singleCorrect", "question": {"text": "If $p \\to (\\sim p \\vee q)$ is false, then the truth values of $p, q$ are:", "image": null}, "options": [{"id": "CdwSt", "label": "A", "text": "$T, F$", "isCorrect": true, "image": null}, {"id": "G7vxp", "label": "B", "text": "$F, T$", "isCorrect": false, "image": null}, {"id": "92OkF", "label": "C", "text": "$F, F$", "isCorrect": false, "image": null}, {"id": "HTEii", "label": "D", "text": "$T, T$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The implication $A \\to B$ is false if and only if $A$ is true and $B$ is false.<br><br>For the given statement $p \\to (\\sim p \\vee q)$ to be false, $p$ must be true ($T$) and $(\\sim p \\vee q)$ must be false ($F$).<br><br>Since $p$ is true, $\\sim p$ is false.<br><br>For the disjunction $(\\sim p \\vee q)$ to be false, both of its components must be false. Since $\\sim p$ is already false, $q$ must also be false ($F$).<br><br>Therefore, the truth values of $p$ and $q$ are $T$ and $F$ respectively.<br><br>Answer: $T, F$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b515a9fc0fc8c14641", "type": "singleCorrect", "question": {"text": "The logical expression $[\\sim(p \\to q) \\wedge (q \\to p)] \\vee \\sim(p \\leftrightarrow q)$ is equivalent to:", "image": null}, "options": [{"id": "QiMPN", "label": "A", "text": "$p \\leftrightarrow q$", "isCorrect": false, "image": null}, {"id": "zJUNx", "label": "B", "text": "$(p \\vee q) \\wedge \\sim(p \\wedge q)$", "isCorrect": true, "image": null}, {"id": "H88by", "label": "C", "text": "$\\sim p \\vee \\sim q$", "isCorrect": false, "image": null}, {"id": "GSB46", "label": "D", "text": "$p \\wedge q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We first simplify the term $\\sim(p \\to q) \\wedge (q \\to p)$.<br><br>Since $p \\to q \\equiv \\sim p \\vee q$, its negation is $\\sim(p \\to q) \\equiv p \\wedge \\sim q$.<br><br>Also, $q \\to p \\equiv \\sim q \\vee p$.<br><br>Taking their intersection:<br><br>$\\sim(p \\to q) \\wedge (q \\to p) \\equiv (p \\wedge \\sim q) \\wedge (\\sim q \\vee p) \\equiv p \\wedge \\sim q$<br><br>Next, we expand the second term $\\sim(p \\leftrightarrow q)$.<br><br>The biconditional $p \\leftrightarrow q \\equiv (p \\wedge q) \\vee (\\sim p \\wedge \\sim q)$.<br><br>Its negation is $\\sim(p \\leftrightarrow q) \\equiv (p \\wedge \\sim q) \\vee (\\sim p \\wedge q)$.<br><br>Now, substituting these into the given logical expression:<br><br>$[\\sim(p \\to q) \\wedge (q \\to p)] \\vee \\sim(p \\leftrightarrow q) \\equiv (p \\wedge \\sim q) \\vee [ (p \\wedge \\sim q) \\vee (\\sim p \\wedge q) ]$<br><br>By the idempotent law, $(p \\wedge \\sim q) \\vee (p \\wedge \\sim q) \\equiv p \\wedge \\sim q$.<br><br>Thus, the expression simplifies to:<br><br>$(p \\wedge \\sim q) \\vee (\\sim p \\wedge q)$<br><br>Now we evaluate the given options to find the equivalent expression. Expanding the second option:<br><br>$(p \\vee q) \\wedge \\sim(p \\wedge q) \\equiv (p \\vee q) \\wedge (\\sim p \\vee \\sim q)$<br><br>Using the distributive law:<br><br>$\\equiv (p \\wedge \\sim p) \\vee (p \\wedge \\sim q) \\vee (q \\wedge \\sim p) \\vee (q \\wedge \\sim q)$<br><br>Since $p \\wedge \\sim p$ and $q \\wedge \\sim q$ are both false ($F$), this reduces to:<br><br>$\\equiv F \\vee (p \\wedge \\sim q) \\vee (\\sim p \\wedge q) \\vee F$<br><br>$\\equiv (p \\wedge \\sim q) \\vee (\\sim p \\wedge q)$<br><br>This perfectly matches our simplified expression.<br><br>Answer: $(p \\vee q) \\wedge \\sim(p \\wedge q)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887615a9fc0fc8c143eb", "type": "singleCorrect", "question": {"text": "$[(p \\wedge q) \\vee (\\sim r \\vee \\sim s \\vee \\sim t)] \\wedge [(p \\wedge q) \\vee (r \\wedge s \\wedge t)] \\equiv$", "image": null}, "options": [{"id": "YKEZt", "label": "A", "text": "$\\sim p \\wedge q$", "isCorrect": false, "image": null}, {"id": "09sWt", "label": "B", "text": "$p \\vee q$", "isCorrect": false, "image": null}, {"id": "esbEZ", "label": "C", "text": "$p \\wedge q$", "isCorrect": true, "image": null}, {"id": "HT37N", "label": "D", "text": "$p \\vee \\sim q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $A = p \\wedge q$ and $B = r \\wedge s \\wedge t$.<br><br>By De Morgan's law, $\\sim B = \\sim(r \\wedge s \\wedge t) = \\sim r \\vee \\sim s \\vee \\sim t$.<br><br>The given expression can be rewritten as:<br><br>$[A \\vee \\sim B] \\wedge [A \\vee B]$<br><br>Using the distributive law, this is equivalent to:<br><br>$A \\vee (\\sim B \\wedge B)$<br><br>Since $\\sim B \\wedge B$ is always false ($F$), the expression simplifies to:<br><br>$A \\vee F \\equiv A$<br><br>Substituting back $A = p \\wedge q$, the given expression is equivalent to $p \\wedge q$.<br><br>Answer: $p \\wedge q$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887615a9fc0fc8c143ea", "type": "singleCorrect", "question": {"text": "Let p, q, r be three logical statements. Consider the compound statements<br>$S_1: [(p \\to q) \\wedge \\sim q] \\to r$ and<br>$S_2: (p \\vee q) \\vee r$<br>Then which of the following is not true?", "image": null}, "options": [{"id": "4VJpp", "label": "A", "text": "If $S_2$ is True, then $S_1$ is True.", "isCorrect": false, "image": null}, {"id": "yZKZi", "label": "B", "text": "If $S_2$ is False, then $S_1$ is False.", "isCorrect": false, "image": null}, {"id": "p8O2z", "label": "C", "text": "If $S_1$ is False, then $S_2$ is False.", "isCorrect": false, "image": null}, {"id": "G7vqE", "label": "D", "text": "If $S_2$ is False, then $S_1$ is True.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $S_1: [(p \\to q) \\wedge \\sim q] \\to r$<br><br>Using the logical equivalence $p \\to q \\equiv \\sim p \\vee q$, we can simplify the premise of $S_1$:<br><br>$(p \\to q) \\wedge \\sim q \\equiv (\\sim p \\vee q) \\wedge \\sim q$<br><br>By the distributive law:<br><br>$(\\sim p \\vee q) \\wedge \\sim q \\equiv (\\sim p \\wedge \\sim q) \\vee (q \\wedge \\sim q)$<br><br>Since $q \\wedge \\sim q$ is always False, we get:<br><br>$(\\sim p \\wedge \\sim q) \\vee \\text{False} \\equiv \\sim p \\wedge \\sim q$<br><br>Now, substitute this back into $S_1$:<br><br>$S_1 \\equiv (\\sim p \\wedge \\sim q) \\to r$<br><br>Using the implication equivalence $A \\to B \\equiv \\sim A \\vee B$:<br><br>$S_1 \\equiv \\sim(\\sim p \\wedge \\sim q) \\vee r$<br><br>By De Morgan's law:<br><br>$S_1 \\equiv (p \\vee q) \\vee r$<br><br>We are given $S_2: (p \\vee q) \\vee r$.<br><br>Thus, $S_1$ and $S_2$ are logically equivalent ($S_1 \\equiv S_2$). They will always have the exact same truth values for any combination of $p, q,$ and $r$.<br><br>Therefore, if $S_2$ is False, $S_1$ must also be False. The statement \"If $S_2$ is False, then $S_1$ is True\" is not true.<br><br>Answer: If $S_2$ is False, then $S_1$ is True.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887615a9fc0fc8c143e9", "type": "singleCorrect", "question": {"text": "The negation of converse of \"I can travel by train if I get my ticket reserved\" is", "image": null}, "options": [{"id": "tdZHh", "label": "A", "text": "I get my ticket reserved and I cannot travel by train.", "isCorrect": false, "image": null}, {"id": "pbREo", "label": "B", "text": "I get my ticket not reserved and I can travel by train.", "isCorrect": false, "image": null}, {"id": "etika", "label": "C", "text": "I cannot travel by train and I get my ticket reserved.", "isCorrect": false, "image": null}, {"id": "CloRj", "label": "D", "text": "I can travel by train and I get my ticket not reserved", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $p$ be the statement: \"I get my ticket reserved\".<br>Let $q$ be the statement: \"I can travel by train\".<br><br>The given statement is \"I can travel by train if I get my ticket reserved\", which can be written as \"If $p$ then $q$\", i.e., $p \\rightarrow q$.<br><br>The converse of $p \\rightarrow q$ is $q \\rightarrow p$.<br><br>The negation of the converse is $\\sim(q \\rightarrow p)$.<br><br>Using the logical equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$, we have:<br>$q \\rightarrow p \\equiv \\sim q \\vee p$<br><br>Therefore, the negation is:<br>$\\sim(q \\rightarrow p) \\equiv \\sim(\\sim q \\vee p) \\equiv q \\wedge \\sim p$<br><br>Translating $q \\wedge \\sim p$ back into words, we get: \"I can travel by train and I get my ticket not reserved\".<br><br>Answer: I can travel by train and I get my ticket not reserved", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888615a9fc0fc8c14482", "type": "singleCorrect", "question": {"text": "A statement logically equivalent to the statement pattern $\\sim[(p \\rightarrow \\sim q) \\wedge (\\sim q \\vee p)]$ is", "image": null}, "options": [{"id": "dez1r", "label": "A", "text": "$p \\wedge q$", "isCorrect": false, "image": null}, {"id": "JziJe", "label": "B", "text": "$p \\vee q$", "isCorrect": false, "image": null}, {"id": "qcV0g", "label": "C", "text": "$p$", "isCorrect": false, "image": null}, {"id": "1yp3l", "label": "D", "text": "$q$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given statement pattern is $\\sim[(p \\rightarrow \\sim q) \\wedge (\\sim q \\vee p)]$.<br><br>Using the logical equivalence $p \\rightarrow \\sim q \\equiv \\sim p \\vee \\sim q$, the expression inside the square brackets becomes:<br><br>$(\\sim p \\vee \\sim q) \\wedge (\\sim q \\vee p)$<br><br>By the commutative property, this can be written as:<br><br>$(\\sim q \\vee \\sim p) \\wedge (\\sim q \\vee p)$<br><br>Using the distributive law, this simplifies to:<br><br>$\\sim q \\vee (\\sim p \\wedge p)$<br><br>Since $\\sim p \\wedge p \\equiv F$ (where $F$ is a contradiction), we get:<br><br>$\\sim q \\vee F \\equiv \\sim q$<br><br>Substituting this back into the original statement pattern, we get:<br><br>$\\sim[\\sim q] \\equiv q$<br><br>Answer: $q$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888515a9fc0fc8c14481", "type": "singleCorrect", "question": {"text": "The truth values of logical statements $p, q, r$ are T, T and F respectively. If $*$ and $\\#$ are symbolic logical connectives such that $(p\\,\\#\\,r) \\rightarrow (\\sim q\\,\\#\\,r)$ is false and $(\\sim p\\,*\\,q) \\leftrightarrow (\\sim q\\,\\#\\,r)$ is true, then $*$ and $\\#$ are respectively ____", "image": null}, "options": [{"id": "whFhq", "label": "A", "text": "$\\wedge, \\vee$", "isCorrect": true, "image": null}, {"id": "0X3wL", "label": "B", "text": "$\\vee, \\wedge$", "isCorrect": false, "image": null}, {"id": "uh2HV", "label": "C", "text": "$\\rightarrow, \\vee$", "isCorrect": false, "image": null}, {"id": "1VNdR", "label": "D", "text": "$\\wedge, \\rightarrow$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $p \\equiv T$, $q \\equiv T$, $r \\equiv F$.<br><br>The statement $(p\\,\\#\\,r) \\rightarrow (\\sim q\\,\\#\\,r)$ is false.<br><br>An implication $A \\rightarrow B$ is false only when $A$ is true and $B$ is false.<br><br>Thus, $p\\,\\#\\,r \\equiv T$ and $\\sim q\\,\\#\\,r \\equiv F$.<br><br>Substituting the truth values, $T\\,\\#\\,F \\equiv T$ and $F\\,\\#\\,F \\equiv F$.<br><br>From the given options, the disjunction ($\\vee$) satisfies these conditions since $T \\vee F \\equiv T$ and $F \\vee F \\equiv F$. Therefore, $\\#$ is $\\vee$.<br><br>It is also given that $(\\sim p\\,*\\,q) \\leftrightarrow (\\sim q\\,\\#\\,r)$ is true.<br><br>Since $\\sim q\\,\\#\\,r \\equiv F$, for the biconditional to be true, $\\sim p\\,*\\,q$ must also be false.<br><br>Substituting the truth values, $F\\,*\\,T \\equiv F$.<br><br>From the given options, the conjunction ($\\wedge$) satisfies this condition since $F \\wedge T \\equiv F$. If $*$ were $\\rightarrow$, $F \\rightarrow T \\equiv T$, which does not satisfy the condition.<br><br>Therefore, $*$ is $\\wedge$ and $\\#$ is $\\vee$.<br><br>Answer: $\\wedge, \\vee$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888515a9fc0fc8c1447f", "type": "singleCorrect", "question": {"text": "If $p \\wedge q$ is F and $p \\rightarrow q$ is F, then the truth values of $p$ and $q$ respectively are", "image": null}, "options": [{"id": "MGHZT", "label": "A", "text": "both are true", "isCorrect": false, "image": null}, {"id": "KgU2T", "label": "B", "text": "T, F", "isCorrect": true, "image": null}, {"id": "LSC8g", "label": "C", "text": "F, T", "isCorrect": false, "image": null}, {"id": "sd5Yt", "label": "D", "text": "both are false", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $p \\rightarrow q$ is F.<br><br>The conditional statement $p \\rightarrow q$ is false if and only if $p$ is T and $q$ is F.<br><br>Checking the first condition with these truth values, we get $p \\wedge q \\equiv \\text{T} \\wedge \\text{F} \\equiv \\text{F}$, which satisfies the given condition that $p \\wedge q$ is F.<br><br>Thus, the truth values of $p$ and $q$ are T and F respectively.<br><br>Answer: T, F", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889615a9fc0fc8c14517", "type": "singleCorrect", "question": {"text": "The compound statement $[\\sim (p \\rightarrow q) \\vee \\sim (p \\wedge r)] \\wedge p$ is logically equivalent to:", "image": null}, "options": [{"id": "EPhDy", "label": "A", "text": "$p \\wedge q \\wedge r$", "isCorrect": false, "image": null}, {"id": "wjmpC", "label": "B", "text": "$\\sim p \\vee \\sim q \\vee \\sim r$", "isCorrect": false, "image": null}, {"id": "hs9NO", "label": "C", "text": "$p \\wedge (\\sim q \\vee \\sim r)$", "isCorrect": true, "image": null}, {"id": "KG51O", "label": "D", "text": "$p \\wedge \\sim (q \\wedge \\sim r)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement is $[\\sim (p \\rightarrow q) \\vee \\sim (p \\wedge r)] \\wedge p$.<br><br>Using the logical equivalence $p \\rightarrow q \\equiv \\sim p \\vee q$, we have:<br>$\\sim (p \\rightarrow q) \\equiv \\sim (\\sim p \\vee q) \\equiv p \\wedge \\sim q$<br><br>Using De Morgan's law, we have:<br>$\\sim (p \\wedge r) \\equiv \\sim p \\vee \\sim r$<br><br>Substituting these into the given statement, we get:<br>$[(p \\wedge \\sim q) \\vee (\\sim p \\vee \\sim r)] \\wedge p$<br><br>Applying the distributive law, this is equivalent to:<br>$((p \\wedge \\sim q) \\wedge p) \\vee ((\\sim p \\vee \\sim r) \\wedge p)$<br><br>Simplifying each term:<br>$(p \\wedge \\sim q) \\wedge p \\equiv p \\wedge \\sim q$<br>$(\\sim p \\vee \\sim r) \\wedge p \\equiv (\\sim p \\wedge p) \\vee (\\sim r \\wedge p) \\equiv F \\vee (p \\wedge \\sim r) \\equiv p \\wedge \\sim r$<br><br>The expression simplifies to:<br>$(p \\wedge \\sim q) \\vee (p \\wedge \\sim r)$<br><br>Taking $p$ common using the distributive law, we get:<br>$p \\wedge (\\sim q \\vee \\sim r)$<br><br>Answer: $p \\wedge (\\sim q \\vee \\sim r)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889515a9fc0fc8c14516", "type": "singleCorrect", "question": {"text": "The negation of the contrapositive of the statement $(p \\vee q) \\rightarrow r$ is logically equivalent to..", "image": null}, "options": [{"id": "hiQR6", "label": "A", "text": "$\\sim r \\rightarrow (\\sim p \\wedge \\sim q)$", "isCorrect": false, "image": null}, {"id": "awW7n", "label": "B", "text": "$\\sim r \\wedge (p \\vee q)$", "isCorrect": true, "image": null}, {"id": "nFlp8", "label": "C", "text": "$\\sim r \\rightarrow (p \\vee q)$", "isCorrect": false, "image": null}, {"id": "1uw8t", "label": "D", "text": "$r \\wedge (\\sim p \\vee q)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement is $(p \\vee q) \\rightarrow r$.<br><br>The contrapositive of a conditional statement $A \\rightarrow B$ is $\\sim B \\rightarrow \\sim A$.<br><br>So, the contrapositive of $(p \\vee q) \\rightarrow r$ is $\\sim r \\rightarrow \\sim (p \\vee q)$.<br><br>Using the equivalence $X \\rightarrow Y \\equiv \\sim X \\vee Y$, the contrapositive can be written as:<br><br>$\\sim (\\sim r) \\vee \\sim (p \\vee q) \\equiv r \\vee \\sim (p \\vee q)$<br><br>The negation of this contrapositive is:<br><br>$\\sim (r \\vee \\sim (p \\vee q))$<br><br>Using De Morgan's laws, we get:<br><br>$\\sim r \\wedge \\sim (\\sim (p \\vee q)) \\equiv \\sim r \\wedge (p \\vee q)$<br><br>Answer: $\\sim r \\wedge (p \\vee q)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889515a9fc0fc8c14515", "type": "singleCorrect", "question": {"text": "The dual of the statement pattern $(p \\wedge q) \\wedge \\sim (p \\vee q)$ is a:", "image": null}, "options": [{"id": "pE3eV", "label": "A", "text": "tautology", "isCorrect": true, "image": null}, {"id": "CuXfW", "label": "B", "text": "contradiction", "isCorrect": false, "image": null}, {"id": "dFcM7", "label": "C", "text": "logically equivalent to $\\sim p \\wedge q$", "isCorrect": false, "image": null}, {"id": "Ba3vU", "label": "D", "text": "logically equivalent to $q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement pattern is $(p \\wedge q) \\wedge \\sim (p \\vee q)$.<br><br>The dual of a statement pattern is obtained by replacing $\\wedge$ with $\\vee$ and $\\vee$ with $\\wedge$.<br><br>The dual of the given statement pattern is $(p \\vee q) \\vee \\sim (p \\wedge q)$.<br><br>Using De Morgan's Law, $\\sim (p \\wedge q) \\equiv \\sim p \\vee \\sim q$.<br><br>Substituting this, we get $(p \\vee q) \\vee (\\sim p \\vee \\sim q)$.<br><br>Rearranging the terms, we get $(p \\vee \\sim p) \\vee (q \\vee \\sim q)$.<br><br>Since $p \\vee \\sim p \\equiv t$ and $q \\vee \\sim q \\equiv t$, we get $t \\vee t \\equiv t$.<br><br>Thus, the dual is a tautology.<br><br>Answer: tautology", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886615a9fc0fc8c14355", "type": "singleCorrect", "question": {"text": "The dual of the statement pattern $\\sim p \\rightarrow \\sim(\\sim p \\rightarrow q)$ is...", "image": null}, "options": [{"id": "S1Uge", "label": "A", "text": "$p \\vee (p \\rightarrow \\sim q)$", "isCorrect": false, "image": null}, {"id": "m1Goq", "label": "B", "text": "$\\sim p \\vee (p \\rightarrow \\sim q)$", "isCorrect": false, "image": null}, {"id": "mMSYW", "label": "C", "text": "$p \\wedge (p \\rightarrow \\sim q)$", "isCorrect": true, "image": null}, {"id": "BNuXu", "label": "D", "text": "$p \\wedge (\\sim p \\rightarrow \\sim q)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement pattern is $\\sim p \\rightarrow \\sim(\\sim p \\rightarrow q)$.<br><br>Using the logical equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$, we can simplify the inner implication:<br><br>$\\sim p \\rightarrow q \\equiv \\sim(\\sim p) \\vee q \\equiv p \\vee q$<br><br>Substituting this back, the statement becomes:<br><br>$\\sim p \\rightarrow \\sim(p \\vee q)$<br><br>Using De Morgan's law, $\\sim(p \\vee q) \\equiv \\sim p \\wedge \\sim q$, so the statement is:<br><br>$\\sim p \\rightarrow (\\sim p \\wedge \\sim q)$<br><br>Applying the implication equivalence again:<br><br>$\\sim(\\sim p) \\vee (\\sim p \\wedge \\sim q) \\equiv p \\vee (\\sim p \\wedge \\sim q)$<br><br>To find the dual of a statement, we replace $\\vee$ with $\\wedge$ and $\\wedge$ with $\\vee$. The dual of the above statement is:<br><br>$p \\wedge (\\sim p \\vee \\sim q)$<br><br>Now, checking the given options, we can rewrite $p \\wedge (\\sim p \\vee \\sim q)$ by converting the disjunction back to an implication:<br><br>$\\sim p \\vee \\sim q \\equiv p \\rightarrow \\sim q$<br><br>Therefore, the dual can be written as:<br><br>$p \\wedge (p \\rightarrow \\sim q)$<br><br>Answer: $p \\wedge (p \\rightarrow \\sim q)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886615a9fc0fc8c14354", "type": "singleCorrect", "question": {"text": "If the statement pattern $(p \\vee \\sim q) \\wedge (\\sim p \\vee q)$ is true, then which of the following is true?", "image": null}, "options": [{"id": "9k72h", "label": "A", "text": "$p = T, q = F$", "isCorrect": false, "image": null}, {"id": "bpb0Q", "label": "B", "text": "both $p$ and $q$ have the same truth value", "isCorrect": true, "image": null}, {"id": "iKQ5f", "label": "C", "text": "$p \\rightarrow \\sim q$ is a contradiction", "isCorrect": false, "image": null}, {"id": "XEJ4U", "label": "D", "text": "$p = F, q = T$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement pattern is $(p \\vee \\sim q) \\wedge (\\sim p \\vee q)$.<br><br>We know the logical equivalence $p \\rightarrow q \\equiv \\sim p \\vee q$ and $q \\rightarrow p \\equiv \\sim q \\vee p \\equiv p \\vee \\sim q$.<br><br>Substituting these into the given expression, we get:<br><br>$(q \\rightarrow p) \\wedge (p \\rightarrow q)$<br><br>This is the definition of the biconditional statement $p \\leftrightarrow q$.<br><br>The statement $p \\leftrightarrow q$ is true if and only if both $p$ and $q$ have the same truth value (i.e., both are true or both are false).<br><br>Therefore, both $p$ and $q$ must have the same truth value.<br><br>Answer: both $p$ and $q$ have the same truth value", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886615a9fc0fc8c14353", "type": "singleCorrect", "question": {"text": "Consider the following statements:<br>(i) $\\sim(p \\wedge \\sim q)$<br>(ii) $(p \\rightarrow q) \\leftrightarrow (\\sim q \\rightarrow \\sim p)$<br>Result 1 : (i) and (ii) are logically equivalent<br>Result 2 : (ii) is a contradiction<br>then which of the following is correct?", "image": null}, "options": [{"id": "XCgTp", "label": "A", "text": "Result 1 is true, Result 2 is true", "isCorrect": false, "image": null}, {"id": "RtlYz", "label": "B", "text": "Result 1 is true, Result 2 is false", "isCorrect": false, "image": null}, {"id": "o1eZf", "label": "C", "text": "Result 1 is false, Result 2 is true", "isCorrect": false, "image": null}, {"id": "nT2He", "label": "D", "text": "Result 1 is false, Result 2 is false", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Statement (i) can be simplified using De Morgan's laws:<br><br>$\\sim(p \\wedge \\sim q) \\equiv \\sim p \\vee q \\equiv p \\rightarrow q$<br><br>Statement (ii) is given by:<br><br>$(p \\rightarrow q) \\leftrightarrow (\\sim q \\rightarrow \\sim p)$<br><br>We know that $\\sim q \\rightarrow \\sim p$ is the contrapositive of $p \\rightarrow q$, which means they are logically equivalent. Therefore, the biconditional statement $(p \\rightarrow q) \\leftrightarrow (\\sim q \\rightarrow \\sim p)$ is always true, making it a tautology.<br><br>Evaluating Result 1:<br>Statement (i) is $p \\rightarrow q$, which is not a tautology (it is false when $p$ is true and $q$ is false). Statement (ii) is a tautology. Since they do not have the same truth values for all assignments, they are not logically equivalent. Thus, Result 1 is false.<br><br>Evaluating Result 2:<br>Statement (ii) is a tautology, which means it is always true. A contradiction is a statement that is always false. Thus, Result 2 is false.<br><br>Both Result 1 and Result 2 are false.<br><br>Answer: Result 1 is false, Result 2 is false", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c615a9fc0fc8c146d9", "type": "singleCorrect", "question": {"text": "The switching circuit for the logical expression $(p \\wedge q) \\vee \\sim(p \\wedge q)$ is simplified and found to be equivalent to a circuit with:", "image": null}, "options": [{"id": "RawAJ", "label": "A", "text": "Two switches in series", "isCorrect": false, "image": null}, {"id": "NBlkW", "label": "B", "text": "Two switches in parallel", "isCorrect": false, "image": null}, {"id": "srXOo", "label": "C", "text": "A single switch", "isCorrect": false, "image": null}, {"id": "yycXc", "label": "D", "text": "The lamp always glows", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $r = p \\wedge q$.<br><br>The given logical expression becomes $r \\vee \\sim r$.<br><br>By the complement law of Boolean algebra, $r \\vee \\sim r = \\text{True}$ (or $1$).<br><br>Since the logical value is always True regardless of the states of the switches $p$ and $q$, the circuit is always closed.<br><br>Thus, the current always flows and the lamp always glows.<br><br>Answer: The lamp always glows", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c515a9fc0fc8c146d8", "type": "singleCorrect", "question": {"text": "The negation of the statement \"She will earn money if she works\" is...", "image": null}, "options": [{"id": "reMsW", "label": "A", "text": "She works and she will earn money", "isCorrect": false, "image": null}, {"id": "jlueC", "label": "B", "text": "She works and she will not earn money", "isCorrect": true, "image": null}, {"id": "jMiG3", "label": "C", "text": "She will earn money and she works.", "isCorrect": false, "image": null}, {"id": "dl219", "label": "D", "text": "She will earn money and she does not work.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"She works\".<br><br>Let $q$ be the statement \"She will earn money\".<br><br>The given statement \"She will earn money if she works\" can be rewritten as \"If she works, then she will earn money\", which is represented as $p \\rightarrow q$.<br><br>The negation of an implication $p \\rightarrow q$ is given by $\\sim(p \\rightarrow q)$.<br><br>Since $p \\rightarrow q \\equiv \\sim p \\vee q$, its negation is:<br><br>$\\sim(\\sim p \\vee q) \\equiv p \\wedge \\sim q$<br><br>The statement $p \\wedge \\sim q$ translates to \"She works and she will not earn money\".<br><br>Answer: She works and she will not earn money", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c515a9fc0fc8c146d7", "type": "singleCorrect", "question": {"text": "The inverse of a statement $(p \\vee q) \\to r$ is", "image": null}, "options": [{"id": "8xncF", "label": "A", "text": "$(p \\vee q) \\vee \\sim r$", "isCorrect": true, "image": null}, {"id": "8lN6s", "label": "B", "text": "$(p \\vee q) \\vee r$", "isCorrect": false, "image": null}, {"id": "nk57X", "label": "C", "text": "$(p \\vee q) \\to \\sim r$", "isCorrect": false, "image": null}, {"id": "9cl0n", "label": "D", "text": "$(p \\wedge q) \\vee \\sim r$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The inverse of a conditional statement $A \\to B$ is $\\sim A \\to \\sim B$.<br><br>For the given statement $(p \\vee q) \\to r$, we have $A = p \\vee q$ and $B = r$.<br><br>The inverse is $\\sim (p \\vee q) \\to \\sim r$.<br><br>Using the logical equivalence $X \\to Y \\equiv \\sim X \\vee Y$, we can rewrite the inverse as:<br><br>$\\sim (\\sim (p \\vee q)) \\vee \\sim r$<br><br>$(p \\vee q) \\vee \\sim r$<br><br>Answer: $(p \\vee q) \\vee \\sim r$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883615a9fc0fc8c14193", "type": "singleCorrect", "question": {"text": "Symbolic form of the circuit<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/12_may_shift_1__q113_d1_v3.png\" /><br>is equivalent to .........", "image": null}, "options": [{"id": "JeZue", "label": "A", "text": "$p\\to q$", "isCorrect": false, "image": null}, {"id": "EgVXq", "label": "B", "text": "$p\\vee q$", "isCorrect": false, "image": null}, {"id": "aE0zY", "label": "C", "text": "$\\sim(p\\wedge q)$", "isCorrect": false, "image": null}, {"id": "t12Xs", "label": "D", "text": "$q\\to p$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $p$ and $q$ represent the switches $S_1$ and $S_2$ respectively.<br><br>The switches $S_1'$ and $S_2'$ are represented by $\\sim p$ and $\\sim q$.<br><br>The given circuit consists of three parallel branches. The symbolic logic expression is:<br><br>$p \\vee (\\sim p \\wedge \\sim q) \\vee (p \\wedge q)$<br><br>Rearranging the terms, we get:<br><br>$\\equiv p \\vee (p \\wedge q) \\vee (\\sim p \\wedge \\sim q)$<br><br>By the absorption law, $p \\vee (p \\wedge q) \\equiv p$. The expression simplifies to:<br><br>$\\equiv p \\vee (\\sim p \\wedge \\sim q)$<br><br>Applying the distributive law:<br><br>$\\equiv (p \\vee \\sim p) \\wedge (p \\vee \\sim q)$<br><br>Since $p \\vee \\sim p \\equiv T$:<br><br>$\\equiv T \\wedge (p \\vee \\sim q)$<br><br>By the identity law:<br><br>$\\equiv p \\vee \\sim q$<br><br>$\\equiv \\sim q \\vee p$<br><br>This is logically equivalent to the conditional statement $q \\rightarrow p$.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883615a9fc0fc8c14192", "type": "singleCorrect", "question": {"text": "The dual statement of \"$x=1$ only if $x^2=x$\" is", "image": null}, "options": [{"id": "xlqOC", "label": "A", "text": "$x=1$ and $x^2=x$", "isCorrect": false, "image": null}, {"id": "00xvo", "label": "B", "text": "$x\\neq 1$ or $x^2=x$", "isCorrect": false, "image": null}, {"id": "jyjeb", "label": "C", "text": "$x\\neq 1$ and $x^2=x$", "isCorrect": true, "image": null}, {"id": "8hylJ", "label": "D", "text": "$x=1$ or $x^2\\neq x$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"$x=1$\" and $q$ be the statement \"$x^2=x$\".<br><br>The given statement \"$p$ only if $q$\" is logically equivalent to $p \\rightarrow q$.<br><br>We know that the conditional statement $p \\rightarrow q$ is logically equivalent to $\\sim p \\vee q$.<br><br>The dual of a compound statement is obtained by replacing the disjunction ($\\vee$) with conjunction ($\\wedge$) and vice versa.<br><br>Therefore, the dual of $\\sim p \\vee q$ is $\\sim p \\wedge q$.<br><br>Translating this back into words, $\\sim p \\wedge q$ corresponds to \"$x \\neq 1$ and $x^2=x$\".<br><br>Answer: $x\\neq 1$ and $x^2=x$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883615a9fc0fc8c14191", "type": "singleCorrect", "question": {"text": "If the truth values of $p, q, r, s$ are respectively $T, F, F, T$ then the truth values of the compound statements $\\sim(p\\to\\sim q)$ and $(\\sim r\\wedge s)\\to(p\\wedge\\sim q)$ are respectively ... and .....", "image": null}, "options": [{"id": "gzwrE", "label": "A", "text": "$F, F$", "isCorrect": false, "image": null}, {"id": "vJEzC", "label": "B", "text": "$T, T$", "isCorrect": false, "image": null}, {"id": "L7Up7", "label": "C", "text": "$F, T$", "isCorrect": true, "image": null}, {"id": "pBLQw", "label": "D", "text": "$T, F$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $p = T$, $q = F$, $r = F$, $s = T$.<br><br>For the first statement $\\sim(p \\to \\sim q)$:<br>$\\sim q = \\sim F = T$<br>$p \\to \\sim q = T \\to T = T$<br>$\\sim(p \\to \\sim q) = \\sim T = F$<br><br>For the second statement $(\\sim r \\wedge s) \\to (p \\wedge \\sim q)$:<br>$\\sim r = \\sim F = T$<br>$\\sim r \\wedge s = T \\wedge T = T$<br>$p \\wedge \\sim q = T \\wedge T = T$<br>$(\\sim r \\wedge s) \\to (p \\wedge \\sim q) = T \\to T = T$<br><br>The truth values are $F$ and $T$ respectively.<br><br>Answer: $F, T$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ad8c30a4553e1bdba4", "type": "singleCorrect", "question": {"text": "If $\\sim p \\vee q$ is false then which of the following is correct?", "image": null}, "options": [{"id": "TiD0B", "label": "A", "text": "$p \\leftrightarrow q$ is $T$", "isCorrect": false, "image": null}, {"id": "MurbR", "label": "B", "text": "$p \\rightarrow q$ is $T$", "isCorrect": false, "image": null}, {"id": "wxHR5", "label": "C", "text": "$q \\rightarrow p$ is $T$", "isCorrect": true, "image": null}, {"id": "2p3UX", "label": "D", "text": "$q \\rightarrow p$ is $F$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\sim p \\vee q$ is false.<br><br>A disjunction is false only when both of its components are false.<br><br>Therefore, $\\sim p$ is false and $q$ is false.<br><br>This implies $p$ is true ($T$) and $q$ is false ($F$).<br><br>Checking the given options:<br><br>$p \\leftrightarrow q \\equiv T \\leftrightarrow F \\equiv F$<br><br>$p \\rightarrow q \\equiv T \\rightarrow F \\equiv F$<br><br>$q \\rightarrow p \\equiv F \\rightarrow T \\equiv T$<br><br>Thus, $q \\rightarrow p$ is $T$.<br><br>Answer: $q \\rightarrow p$ is $T$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ad8c30a4553e1bdba3", "type": "singleCorrect", "question": {"text": "The contrapositive of $\\sim q \\rightarrow p$ is equivalent to", "image": null}, "options": [{"id": "zcRHE", "label": "A", "text": "$p \\rightarrow q$", "isCorrect": false, "image": null}, {"id": "gYKJR", "label": "B", "text": "$p \\wedge q$", "isCorrect": false, "image": null}, {"id": "sYBrT", "label": "C", "text": "$p \\vee q$", "isCorrect": true, "image": null}, {"id": "Xdk0p", "label": "D", "text": "$\\sim p \\rightarrow \\sim q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The contrapositive of a conditional statement $A \\rightarrow B$ is $\\sim B \\rightarrow \\sim A$.<br><br>For the given statement $\\sim q \\rightarrow p$, the contrapositive is $\\sim p \\rightarrow \\sim (\\sim q)$.<br><br>This simplifies to $\\sim p \\rightarrow q$.<br><br>Using the logical equivalence $X \\rightarrow Y \\equiv \\sim X \\vee Y$, we get:<br><br>$\\sim p \\rightarrow q \\equiv \\sim (\\sim p) \\vee q \\equiv p \\vee q$.<br><br>Answer: $p \\vee q$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3568c30a4553e1be2ad", "type": "singleCorrect", "question": {"text": "Consider the following statements.<br>$p$: If $3^4 > 4^3$, then $3^3 > 4^4$<br>$q$: The roots of the equation $x^2 - 2x + 2 = 0$ are real if and only if Mumbai is in Maharashtra.<br>$r$: Statement $p$ is true or statement $q$ is false.<br>Which of the following has truth value T (true)?", "image": null}, "options": [{"id": "uXECl", "label": "A", "text": "$(p \\vee q) \\wedge r$", "isCorrect": false, "image": null}, {"id": "gyYsm", "label": "B", "text": "$p \\vee (q \\wedge r)$", "isCorrect": false, "image": null}, {"id": "00dxQ", "label": "C", "text": "$p \\wedge (q \\vee r)$", "isCorrect": false, "image": null}, {"id": "j2eR8", "label": "D", "text": "$(p \\wedge q) \\vee r$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Evaluate the truth value of statement $p$:<br>$3^4 = 81$ and $4^3 = 64$, so $3^4 > 4^3$ is True (T).<br>$3^3 = 27$ and $4^4 = 256$, so $3^3 > 4^4$ is False (F).<br>Statement $p$ is of the form $T \\rightarrow F$, which is False. Thus, $p \\equiv F$.<br><br>Evaluate the truth value of statement $q$:<br>The discriminant of $x^2 - 2x + 2 = 0$ is $D = 4 - 8 = -4 < 0$, so the roots are not real. This part is False (F).<br>\"Mumbai is in Maharashtra\" is True (T).<br>Statement $q$ is of the form $F \\leftrightarrow T$, which is False. Thus, $q \\equiv F$.<br><br>Evaluate the truth value of statement $r$:<br>\"Statement $p$ is true\" is False (since $p \\equiv F$).<br>\"Statement $q$ is false\" is True (since $q \\equiv F$).<br>Statement $r$ is of the form $F \\vee T$, which is True. Thus, $r \\equiv T$.<br><br>Now, check the truth values of the given options:<br>$(p \\vee q) \\wedge r \\equiv (F \\vee F) \\wedge T \\equiv F \\wedge T \\equiv F$<br>$p \\vee (q \\wedge r) \\equiv F \\vee (F \\wedge T) \\equiv F \\vee F \\equiv F$<br>$p \\wedge (q \\vee r) \\equiv F \\wedge (F \\vee T) \\equiv F \\wedge T \\equiv F$<br>$(p \\wedge q) \\vee r \\equiv (F \\wedge F) \\vee T \\equiv F \\vee T \\equiv T$<br><br>Therefore, $(p \\wedge q) \\vee r$ has the truth value T.<br><br>Answer: $(p \\wedge q) \\vee r$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3568c30a4553e1be2ac", "type": "singleCorrect", "question": {"text": "Which of the following is/are not true ?<br>I) If 1 is not a prime number, then 2 is not a prime number.<br>II) e is a vowel and $12 \\times 3 = 36$<br>III) It is not true that 14 is a composite number and 3 is even number.<br>IV) $\\sqrt{5}$ is an irrational number, but $3 + \\sqrt{5}$ is a complex number.", "image": null}, "options": [{"id": "d2sdV", "label": "A", "text": "Only I and IV", "isCorrect": false, "image": null}, {"id": "HWB4W", "label": "B", "text": "Only I", "isCorrect": true, "image": null}, {"id": "bQkci", "label": "C", "text": "Only II and III", "isCorrect": false, "image": null}, {"id": "2IehI", "label": "D", "text": "Only I, II and IV", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let us evaluate the truth value of each statement:<br><br>Statement I: \"If $1$ is not a prime number, then $2$ is not a prime number.\"<br>This is a conditional statement of the form $p \\rightarrow q$.<br>$p$: $1$ is not a prime number (True).<br>$q$: $2$ is not a prime number (False, since $2$ is a prime number).<br>The truth value of $T \\rightarrow F$ is False. Thus, Statement I is not true.<br><br>Statement II: \"e is a vowel and $12 \\times 3 = 36$\"<br>This is a conjunction of the form $p \\wedge q$.<br>$p$: e is a vowel (True).<br>$q$: $12 \\times 3 = 36$ (True).<br>The truth value of $T \\wedge T$ is True. Thus, Statement II is true.<br><br>Statement III: \"It is not true that $14$ is a composite number and $3$ is even number.\"<br>This is of the form $\\sim(p \\wedge q)$.<br>$p$: $14$ is a composite number (True).<br>$q$: $3$ is an even number (False).<br>The truth value of $p \\wedge q$ is $T \\wedge F \\equiv F$.<br>Therefore, $\\sim(F)$ is True. Thus, Statement III is true.<br><br>Statement IV: \"$\\sqrt{5}$ is an irrational number, but $3 + \\sqrt{5}$ is a complex number.\"<br>The word \"but\" acts as a logical \"and\" ($\\wedge$).<br>$p$: $\\sqrt{5}$ is an irrational number (True).<br>$q$: $3 + \\sqrt{5}$ is a complex number (True, since every real number is a complex number with an imaginary part of $0$).<br>The truth value of $T \\wedge T$ is True. Thus, Statement IV is true.<br><br>Therefore, only Statement I is not true.<br><br>Answer: Only I", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3568c30a4553e1be2ab", "type": "singleCorrect", "question": {"text": "The negation of the inverse of the statement $\\sim p \\vee \\sim q$ is...", "image": null}, "options": [{"id": "gIqDu", "label": "A", "text": "$p \\wedge q$", "isCorrect": false, "image": null}, {"id": "XTCay", "label": "B", "text":
