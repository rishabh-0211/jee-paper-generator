:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The statement pattern $[(p \\rightarrow q) \\wedge \\sim q] \\rightarrow r$ is a tautology when $r$ is equivalent to", "image": null}, "options": [{"id": "9jWOE", "text": "$\\mathrm{p} \\wedge \\sim \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "UIpD0", "text": "$q \\vee p$", "image": null, "isCorrect": false}, {"id": "bcHRY", "text": "$\\mathrm{p} \\wedge \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "5Vx6l", "text": "$\\sim \\mathrm{q}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given statement pattern is $[(p \\rightarrow q) \\wedge \\sim q] \\rightarrow r$.<br><br>Consider the antecedent: $(p \\rightarrow q) \\wedge \\sim q$.<br><br>Using the logical equivalence $p \\rightarrow q \\equiv \\sim p \\vee q$, we get:<br><br>$(p \\rightarrow q) \\wedge \\sim q \\equiv (\\sim p \\vee q) \\wedge \\sim q$<br><br>By distributive law:<br><br>$(\\sim p \\vee q) \\wedge \\sim q \\equiv (\\sim p \\wedge \\sim q) \\vee (q \\wedge \\sim q)$<br><br>Since $q \\wedge \\sim q \\equiv F$, we have:<br><br>$(\\sim p \\wedge \\sim q) \\vee F \\equiv \\sim p \\wedge \\sim q$<br><br>Thus, the given statement pattern simplifies to $(\\sim p \\wedge \\sim q) \\rightarrow r$.<br><br>For this conditional statement to be a tautology, the consequent $r$ must be true whenever the antecedent $\\sim p \\wedge \\sim q$ is true. If $\\sim p \\wedge \\sim q$ is true, then both $\\sim p$ and $\\sim q$ are true.<br><br>Checking the given options, if $r \\equiv \\sim q$, the statement pattern becomes $(\\sim p \\wedge \\sim q) \\rightarrow \\sim q$.<br><br>Using the conditional equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$:<br><br>$(\\sim p \\wedge \\sim q) \\rightarrow \\sim q \\equiv \\sim(\\sim p \\wedge \\sim q) \\vee \\sim q$<br><br>By De Morgan's law:<br><br>$\\equiv (p \\vee q) \\vee \\sim q$<br><br>By associative law:<br><br>$\\equiv p \\vee (q \\vee \\sim q)$<br><br>Since $q \\vee \\sim q \\equiv T$ (tautology):<br><br>$\\equiv p \\vee T \\equiv T$<br><br>Hence, the statement pattern is a tautology when $r$ is equivalent to $\\sim q$.<br><br>Answer: $\\sim \\mathrm{q}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214510aee93fa0796dfaf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "The statement $\\sim(p \\leftrightarrow \\sim q)$ is", "image": null}, "options": [{"id": "VAs9y", "text": "equivalent to $\\mathrm{p} \\leftrightarrow \\mathrm{q}$", "image": null, "isCorrect": true}, {"id": "AUTE6", "text": "a fallacy", "image": null, "isCorrect": false}, {"id": "puSFs", "text": "a tautology", "image": null, "isCorrect": false}, {"id": "lv1Zx", "text": "equivalent to $\\sim \\mathrm{p} \\leftrightarrow \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Constructing the truth table for the given logical statements:<br><br><table><tr><td>$p$</td><td>$q$</td><td>$\\sim q$</td><td>$p \\leftrightarrow \\sim q$</td><td>$\\sim(p \\leftrightarrow \\sim q)$</td><td>$p \\leftrightarrow q$</td></tr><tr><td>T</td><td>T</td><td>F</td><td>F</td><td>T</td><td>T</td></tr><tr><td>T</td><td>F</td><td>T</td><td>T</td><td>F</td><td>F</td></tr><tr><td>F</td><td>T</td><td>F</td><td>T</td><td>F</td><td>F</td></tr><tr><td>F</td><td>F</td><td>T</td><td>F</td><td>T</td><td>T</td></tr></table><br><br>From the truth table, the entries in the columns for $\\sim(p \\leftrightarrow \\sim q)$ and $p \\leftrightarrow q$ are identical.<br><br>Therefore, $\\sim(p \\leftrightarrow \\sim q) \\equiv p \\leftrightarrow q$.<br><br>Answer: equivalent to $\\mathrm{p} \\leftrightarrow \\mathrm{q}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144c0aee93fa0796df88", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Truth values of $p \\rightarrow r$ is $F$ and $p \\leftrightarrow q$ is $F$. Then the truth values of $(\\sim p \\vee q) \\rightarrow(p \\vee \\sim q)$ and $(p \\wedge \\sim q) \\rightarrow(\\sim p \\wedge q)$ are respectively", "image": null}, "options": [{"id": "1wn7f", "text": "$\\mathrm{T}, \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "mtgZP", "text": "$\\mathrm{F}, \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "Qu8sE", "text": "$\\mathrm{T}, \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "8oQ6w", "text": "$\\mathrm{F}, \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $p \\rightarrow r$ is $F$, which implies $p$ is $T$ and $r$ is $F$.<br><br>Given $p \\leftrightarrow q$ is $F$. Since $p$ is $T$, $q$ must be $F$.<br><br>Thus, $p = T$, $q = F$, $r = F$.<br><br>For the first expression: $(\\sim p \\vee q) \\rightarrow (p \\vee \\sim q)$<br><br>Substituting the truth values:<br><br>$(\\sim T \\vee F) \\rightarrow (T \\vee \\sim F)$<br><br>$(F \\vee F) \\rightarrow (T \\vee T)$<br><br>$F \\rightarrow T \\equiv T$<br><br>For the second expression: $(p \\wedge \\sim q) \\rightarrow (\\sim p \\wedge q)$<br><br>Substituting the truth values:<br><br>$(T \\wedge \\sim F) \\rightarrow (\\sim T \\wedge F)$<br><br>$(T \\wedge T) \\rightarrow (F \\wedge F)$<br><br>$T \\rightarrow F \\equiv F$<br><br>The truth values are $T$ and $F$ respectively.<br><br>Answer: $\\mathrm{T}, \\mathrm{F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214380aee93fa0796deea", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The proposition $(\\sim p) \\vee(p \\wedge \\sim q)$ is equivalent to", "image": null}, "options": [{"id": "aIcjf", "text": "$\\mathrm{p} \\wedge(\\sim \\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "aK8Gs", "text": "$\\mathrm{p} \\rightarrow(\\sim \\mathrm{q})$", "image": null, "isCorrect": true}, {"id": "G1cOZ", "text": "$\\mathrm{p} \\vee(\\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "s8YHT", "text": "$\\mathrm{q} \\rightarrow \\mathrm{p}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given proposition is $(\\sim p) \\vee (p \\wedge \\sim q)$.<br><br>Using the distributive law:<br><br>$\\equiv (\\sim p \\vee p) \\wedge (\\sim p \\vee \\sim q)$<br><br>Since $\\sim p \\vee p \\equiv T$ (Tautology):<br><br>$\\equiv T \\wedge (\\sim p \\vee \\sim q)$<br><br>Using the identity law:<br><br>$\\equiv \\sim p \\vee \\sim q$<br><br>Using the conditional equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$:<br><br>$\\equiv p \\rightarrow (\\sim q)$<br><br>Answer: $\\mathrm{p} \\rightarrow(\\sim \\mathrm{q})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142a0aee93fa0796de7f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "If p : The total prime numbers between 2 to 100 are 26 .\r\nq : Zero is a complex number.\r\nr : Least common multiple (L.C.M.) of 6 and 7 is 6 .\r\nThen which of the following is correct?", "image": null}, "options": [{"id": "eBLdt", "text": "$(p \\wedge q) \\rightarrow r$ has truth value False.", "image": null, "isCorrect": false}, {"id": "wcJ6B", "text": "$(\\mathrm{p} \\rightarrow \\mathrm{q}) \\rightarrow \\mathrm{r}$ has truth value True.", "image": null, "isCorrect": false}, {"id": "YXBHN", "text": "$(p \\vee q) \\leftrightarrow r$ has truth value False.", "image": null, "isCorrect": true}, {"id": "WdGFc", "text": "$(\\mathrm{p} \\rightarrow \\mathrm{q}) \\rightarrow(\\mathrm{q} \\rightarrow \\mathrm{p})$ has truth value True.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The truth values of the given statements are evaluated as follows:<br><br>Statement p: The total prime numbers between 2 to 100 are 26.<br>There are exactly 25 prime numbers up to 100. Thus, the truth value of p is False (F).<br><br>Statement q: Zero is a complex number.<br>Zero can be written in the form $0 + 0i$, which makes it a complex number. Thus, the truth value of q is True (T).<br><br>Statement r: Least common multiple (L.C.M.) of 6 and 7 is 6.<br>The L.C.M. of 6 and 7 is 42. Thus, the truth value of r is False (F).<br><br>Now, we substitute the truth values $p \\equiv F$, $q \\equiv T$, and $r \\equiv F$ into the given options:<br><br>For $(p \\wedge q) \\rightarrow r$:<br>$(F \\wedge T) \\rightarrow F \\equiv F \\rightarrow F \\equiv T$<br><br>For $(p \\rightarrow q) \\rightarrow r$:<br>$(F \\rightarrow T) \\rightarrow F \\equiv T \\rightarrow F \\equiv F$<br><br>For $(p \\vee q) \\leftrightarrow r$:<br>$(F \\vee T) \\leftrightarrow F \\equiv T \\leftrightarrow F \\equiv F$<br><br>For $(p \\rightarrow q) \\rightarrow (q \\rightarrow p)$:<br>$(F \\rightarrow T) \\rightarrow (T \\rightarrow F) \\equiv T \\rightarrow F \\equiv F$<br><br>The only option that correctly matches the evaluated truth value is $(p \\vee q) \\leftrightarrow r$, which has a truth value of False.<br><br>Answer: $(p \\vee q) \\leftrightarrow r$ has truth value False.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214250aee93fa0796de59", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The contrapositive of the inverse of $\\mathrm{p} \\rightarrow(\\mathrm{p} \\rightarrow \\mathrm{q})$ is", "image": null}, "options": [{"id": "bXVfr", "text": "$(\\sim \\mathrm{p} \\wedge \\mathrm{q}) \\rightarrow \\mathrm{p}$", "image": null, "isCorrect": false}, {"id": "LpPCi", "text": "$(\\sim \\mathrm{p} \\vee \\mathrm{q}) \\rightarrow \\mathrm{p}$", "image": null, "isCorrect": true}, {"id": "wwncD", "text": "$\\mathrm{p} \\rightarrow(\\sim \\mathrm{p} \\vee \\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "7AZYX", "text": "$(p \\vee q) \\rightarrow p$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the given statement be $A \\rightarrow B$, where $A \\equiv \\mathrm{p}$ and $B \\equiv \\mathrm{p} \\rightarrow \\mathrm{q}$.<br><br>The inverse of $A \\rightarrow B$ is $\\sim A \\rightarrow \\sim B$.<br><br>The contrapositive of the inverse $\\sim A \\rightarrow \\sim B$ is $\\sim(\\sim B) \\rightarrow \\sim(\\sim A)$, which simplifies to $B \\rightarrow A$.<br><br>Substituting $A$ and $B$ back, we get $(\\mathrm{p} \\rightarrow \\mathrm{q}) \\rightarrow \\mathrm{p}$.<br><br>Using the logical equivalence $\\mathrm{p} \\rightarrow \\mathrm{q} \\equiv \\sim \\mathrm{p} \\vee \\mathrm{q}$, the expression becomes $(\\sim \\mathrm{p} \\vee \\mathrm{q}) \\rightarrow \\mathrm{p}$.<br><br>Answer: $(\\sim \\mathrm{p} \\vee \\mathrm{q}) \\rightarrow \\mathrm{p}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214150aee93fa0796ddd3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "If $p \\rightarrow(q \\vee r)$ is false, then the truth values of $\\mathrm{p}, \\mathrm{q}, \\mathrm{r}$ are respectively", "image": null}, "options": [{"id": "kLbU1", "text": "F,F,F", "image": null, "isCorrect": false}, {"id": "T2v4a", "text": "T, T, F", "image": null, "isCorrect": false}, {"id": "jSfCO", "text": "T, F, F", "image": null, "isCorrect": true}, {"id": "rPpDb", "text": "$\\mathrm{F}, \\mathrm{T}, \\mathrm{T}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement is $p \\rightarrow (q \\vee r)$.<br><br>It is given that $p \\rightarrow (q \\vee r)$ is false.<br><br>A conditional statement $X \\rightarrow Y$ is false only when $X$ is true and $Y$ is false.<br><br>Therefore, $p$ is true (T) and $q \\vee r$ is false (F).<br><br>The disjunction $q \\vee r$ is false only when both $q$ and $r$ are false.<br><br>Therefore, $q$ is false (F) and $r$ is false (F).<br><br>The truth values of $p, q, r$ are T, F, F respectively.<br><br>Answer: T, F, F", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214140aee93fa0796ddcc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Contrapositive of the statement.\r\n'If two numbers are equal, then their squares are equal' is", "image": null}, "options": [{"id": "XDof3", "text": "If the squares of two numbers are equal, then the numbers are not equal.", "image": null, "isCorrect": false}, {"id": "vcaof", "text": "If the squares of two numbers are not equal, then the numbers are equal.", "image": null, "isCorrect": false}, {"id": "nHkQd", "text": "If the squares of two numbers are not equal, then the numbers are not equal.", "image": null, "isCorrect": true}, {"id": "hWa3G", "text": "If the squares of two numbers are equal, then the numbers are equal.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p$ be the statement 'Two numbers are equal'.<br><br>Let $q$ be the statement 'Their squares are equal'.<br><br>The given statement is in the form $p \\rightarrow q$.<br><br>The contrapositive of the conditional statement $p \\rightarrow q$ is $\\sim q \\rightarrow \\sim p$.<br><br>Here, $\\sim q$ is 'The squares of two numbers are not equal' and $\\sim p$ is 'The numbers are not equal'.<br><br>Therefore, the contrapositive statement is 'If the squares of two numbers are not equal, then the numbers are not equal'.<br><br>Answer: If the squares of two numbers are not equal, then the numbers are not equal.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214040aee93fa0796dd50", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "The following statement $(\\mathrm{p} \\rightarrow \\mathrm{q}) \\rightarrow((\\sim \\mathrm{p} \\rightarrow \\mathrm{q}) \\rightarrow \\mathrm{q})$ is", "image": null}, "options": [{"id": "1C2lK", "text": "a fallacy.", "image": null, "isCorrect": false}, {"id": "sy2e9", "text": "equivalent to $(\\sim \\mathrm{p}) \\rightarrow \\mathrm{q}$.", "image": null, "isCorrect": false}, {"id": "EglBb", "text": "equivalent to $\\mathrm{p} \\rightarrow(\\sim \\mathrm{q})$.", "image": null, "isCorrect": false}, {"id": "zhIfw", "text": "a tautology.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given statement is $(p \\rightarrow q) \\rightarrow ((\\sim p \\rightarrow q) \\rightarrow q)$.<br><br>Consider the second part of the statement: $(\\sim p \\rightarrow q) \\rightarrow q$.<br><br>Using the logical equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$, we get:<br><br>$\\sim p \\rightarrow q \\equiv p \\vee q$<br><br>Substituting this back, we have:<br><br>$(p \\vee q) \\rightarrow q \\equiv \\sim(p \\vee q) \\vee q$<br><br>Using De Morgan's law, we get:<br><br>$\\sim(p \\vee q) \\vee q \\equiv (\\sim p \\wedge \\sim q) \\vee q$<br><br>Using the distributive law, we get:<br><br>$(\\sim p \\vee q) \\wedge (\\sim q \\vee q)$<br><br>Since $\\sim q \\vee q \\equiv T$ (a tautology), the expression simplifies to:<br><br>$(\\sim p \\vee q) \\wedge T \\equiv \\sim p \\vee q$<br><br>We know that $\\sim p \\vee q \\equiv p \\rightarrow q$.<br><br>Therefore, the original statement becomes:<br><br>$(p \\rightarrow q) \\rightarrow (p \\rightarrow q)$<br><br>Any statement of the form $X \\rightarrow X$ is always true.<br><br>Thus, the given statement is a tautology.<br><br>Answer: a tautology.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ff0aee93fa0796dd2b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Contrapositive of the statement\r\n'If two numbers are not equal, then their squares are not equal', is", "image": null}, "options": [{"id": "EvpXY", "text": "If the squares of two numbers are not equal, then the numbers are equal.", "image": null, "isCorrect": false}, {"id": "9gPAA", "text": "If the squares of two numbers are equal, then the numbers are not equal.", "image": null, "isCorrect": false}, {"id": "ecJAQ", "text": "If the squares of two numbers are equal, then the numbers are equal.", "image": null, "isCorrect": true}, {"id": "sQl0x", "text": "If the squares of two numbers are not equal, then the numbers are not equal.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p$ be the statement 'Two numbers are not equal'.<br><br>Let $q$ be the statement 'Their squares are not equal'.<br><br>The given statement is in the form $p \\rightarrow q$.<br><br>The contrapositive of the conditional statement $p \\rightarrow q$ is $\\sim q \\rightarrow \\sim p$.<br><br>Here, $\\sim q$ is 'The squares of two numbers are equal' and $\\sim p$ is 'The numbers are equal'.<br><br>Therefore, the contrapositive is 'If the squares of two numbers are equal, then the numbers are equal'.<br><br>Answer: If the squares of two numbers are equal, then the numbers are equal.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ed0aee93fa0796dca1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Let p : A man is judge.\r\n$\\mathrm{q}: \\mathrm{He}$ is honest.\r\nThe inverse of $p \\rightarrow q$ is", "image": null}, "options": [{"id": "2ckA6", "text": "If a man is judge, then he is honest.", "image": null, "isCorrect": false}, {"id": "kjNid", "text": "If a man is not judge, then he is not honest.", "image": null, "isCorrect": true}, {"id": "UcFK6", "text": "If a man is honest, then he is judge.", "image": null, "isCorrect": false}, {"id": "G3QCJ", "text": "If a man is not honest then, he is not judge.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>$p$: A man is judge.<br>$q$: He is honest.<br><br>The given statement is $p \\rightarrow q$.<br>The inverse of the conditional statement $p \\rightarrow q$ is $\\sim p \\rightarrow \\sim q$.<br><br>$\\sim p$: A man is not judge.<br>$\\sim q$: He is not honest.<br><br>Therefore, the inverse statement $\\sim p \\rightarrow \\sim q$ is \"If a man is not judge, then he is not honest.\"<br><br>Answer: If a man is not judge, then he is not honest.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ed0aee93fa0796dc9c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Let $\\mathrm{p}, \\mathrm{q}$ and r be the statements\r\np : X is an equilateral triangle\r\n$\\mathrm{q}: \\mathrm{X}$ is isosceles triangle\r\n$r: q \\vee \\sim p$,\r\nthen the equivalent statement of $r$ is", "image": null}, "options": [{"id": "Ca4IU", "text": "If X is not an equilateral triangle, then X is not an isosceles triangle", "image": null, "isCorrect": false}, {"id": "qeqtP", "text": "X is neither isosceles nor equilateral triangle", "image": null, "isCorrect": false}, {"id": "TEA7s", "text": "X is isosceles but not an equilateral triangle", "image": null, "isCorrect": false}, {"id": "AdEv8", "text": "If X is not an isosceles triangle, then X is not an equilateral triangle.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given statements:<br>$p$: X is an equilateral triangle<br>$q$: X is an isosceles triangle<br>$r$: $q \\vee \\sim p$<br><br>We know that the logical expression $q \\vee \\sim p$ can be rewritten using the commutative law as $\\sim p \\vee q$.<br><br>Using the conditional equivalence $\\sim A \\vee B \\equiv A \\rightarrow B$, we get:<br>$\\sim p \\vee q \\equiv p \\rightarrow q$<br><br>The contrapositive of $p \\rightarrow q$ is $\\sim q \\rightarrow \\sim p$, which is logically equivalent to it.<br><br>Translating $\\sim q \\rightarrow \\sim p$ into words, we get:<br>\"If X is not an isosceles triangle, then X is not an equilateral triangle.\"<br><br>This matches the given option.<br><br>Answer: If X is not an isosceles triangle, then X is not an equilateral triangle.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213df0aee93fa0796dc2c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "If $(p \\wedge \\sim r) \\rightarrow(\\sim p \\vee q)$ has truth value False, then truth values of $p, q, r$ are respectively.", "image": null}, "options": [{"id": "01o4B", "text": "F, F, T", "image": null, "isCorrect": false}, {"id": "EhnGB", "text": "F, T, F", "image": null, "isCorrect": false}, {"id": "K7Rew", "text": "T, F, F", "image": null, "isCorrect": true}, {"id": "6mamw", "text": "$\\quad \\mathrm{T}, \\mathrm{T}, \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement is $(p \\wedge \\sim r) \\rightarrow (\\sim p \\vee q)$.<br><br>An implication $A \\rightarrow B$ is False if and only if $A$ is True and $B$ is False.<br><br>Therefore, $p \\wedge \\sim r$ must be True, and $\\sim p \\vee q$ must be False.<br><br>For $p \\wedge \\sim r$ to be True, both $p$ and $\\sim r$ must be True. This gives $p = \\text{T}$ and $r = \\text{F}$.<br><br>For $\\sim p \\vee q$ to be False, both $\\sim p$ and $q$ must be False. Since $p = \\text{T}$, $\\sim p$ is already False. This gives $q = \\text{F}$.<br><br>Thus, the truth values of $p, q, r$ are T, F, F respectively.<br><br>Answer: T, F, F", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213de0aee93fa0796dc27", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "The converse of \"If 3 is a prime number, then 3 is odd.\" is", "image": null}, "options": [{"id": "Ueltx", "text": "If 3 is odd then it is a prime number.", "image": null, "isCorrect": true}, {"id": "ogVGl", "text": "If 3 is not a prime number then 3 is even.", "image": null, "isCorrect": false}, {"id": "IvHVI", "text": "If 3 is a prime number then 3 is even.", "image": null, "isCorrect": false}, {"id": "JVKHd", "text": "If 3 is not a prime number then 3 is not odd.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"$3$ is a prime number\" and $q$ be the statement \"$3$ is odd\".<br><br>The given statement is of the form $p \\rightarrow q$.<br><br>The converse of the conditional statement $p \\rightarrow q$ is $q \\rightarrow p$.<br><br>Therefore, the converse of the given statement is \"If $3$ is odd, then it is a prime number\".<br><br>Answer: If 3 is odd then it is a prime number.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213da0aee93fa0796dc0c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "The expression $((p \\wedge q) \\vee(p \\vee \\sim q)) \\wedge(\\sim p \\wedge \\sim q)$ is equivalent to", "image": null}, "options": [{"id": "748aE", "text": "$\\mathrm{p} \\wedge \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "k10cc", "text": "$\\mathrm{p} \\vee \\sim \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "lU7aT", "text": "$\\mathrm{p} \\wedge \\sim \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "MUMQm", "text": "$(\\sim p) \\wedge(\\sim q)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given expression: $((p \\wedge q) \\vee (p \\vee \\sim q)) \\wedge (\\sim p \\wedge \\sim q)$<br><br>Using the associative property, the first part can be written as:<br>$((p \\wedge q) \\vee p) \\vee \\sim q$<br><br>Using the absorption law, $(p \\wedge q) \\vee p = p$.<br>So, the first part simplifies to $p \\vee \\sim q$.<br><br>Now, substitute this back into the original expression:<br>$(p \\vee \\sim q) \\wedge (\\sim p \\wedge \\sim q)$<br><br>Using the distributive law:<br>$(p \\wedge (\\sim p \\wedge \\sim q)) \\vee (\\sim q \\wedge (\\sim p \\wedge \\sim q))$<br><br>Using the associative and commutative properties:<br>$(p \\wedge \\sim p \\wedge \\sim q) \\vee (\\sim p \\wedge (\\sim q \\wedge \\sim q))$<br><br>Since $p \\wedge \\sim p = F$ (False) and $\\sim q \\wedge \\sim q = \\sim q$:<br>$(F \\wedge \\sim q) \\vee (\\sim p \\wedge \\sim q)$<br><br>$F \\vee (\\sim p \\wedge \\sim q) = \\sim p \\wedge \\sim q$<br><br>Answer: $(\\sim p) \\wedge(\\sim q)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cb0aee93fa0796db92", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The inverse of $p \\rightarrow(q \\rightarrow r)$ is logically equivalent to", "image": null}, "options": [{"id": "ZZFkJ", "text": "$\\mathrm{p} \\rightarrow(\\mathrm{q} \\rightarrow \\mathrm{r})$", "image": null, "isCorrect": false}, {"id": "7Kb9O", "text": "$(\\mathrm{q} \\rightarrow \\mathrm{r}) \\rightarrow \\sim \\mathrm{p}$", "image": null, "isCorrect": false}, {"id": "G2xdW", "text": "$(p \\vee q) \\rightarrow r$", "image": null, "isCorrect": false}, {"id": "pKWo2", "text": "$(\\mathrm{q} \\rightarrow \\mathrm{r}) \\rightarrow \\mathrm{p}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given statement is $p \\rightarrow (q \\rightarrow r)$.<br><br>The inverse of a conditional statement $A \\rightarrow B$ is $\\sim A \\rightarrow \\sim B$.<br><br>Therefore, the inverse of $p \\rightarrow (q \\rightarrow r)$ is $\\sim p \\rightarrow \\sim(q \\rightarrow r)$.<br><br>Using the property that a conditional statement is logically equivalent to its contrapositive ($X \\rightarrow Y \\equiv \\sim Y \\rightarrow \\sim X$), we get:<br><br>$\\sim p \\rightarrow \\sim(q \\rightarrow r) \\equiv \\sim(\\sim(q \\rightarrow r)) \\rightarrow \\sim(\\sim p)$<br><br>$\\equiv (q \\rightarrow r) \\rightarrow p$<br><br>Answer: $(\\mathrm{q} \\rightarrow \\mathrm{r}) \\rightarrow \\mathrm{p}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c60aee93fa0796db66", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Negation of the statement \"The payment will be made if and only if the work is finished in time.\" is", "image": null}, "options": [{"id": "rEbXe", "text": "The work is finished in time and the payment is not made.", "image": null, "isCorrect": false}, {"id": "hxXqd", "text": "The payment is made and the work is not finished in time.", "image": null, "isCorrect": false}, {"id": "dPCqq", "text": "The work is finished in time and the payment is not made, or the payment is made and the work is finished in time.", "image": null, "isCorrect": false}, {"id": "x0ff8", "text": "Either the work is finished in time and the payment is not made, or the payment is made and the work is not finished in time.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"The payment will be made\".<br><br>Let $q$ be the statement \"The work is finished in time\".<br><br>The given statement is of the form $p \\leftrightarrow q$.<br><br>The negation of $p \\leftrightarrow q$ is $\\sim(p \\leftrightarrow q)$.<br><br>Using the logical equivalence $p \\leftrightarrow q \\equiv (p \\rightarrow q) \\wedge (q \\rightarrow p)$, we get:<br><br>$\\sim(p \\leftrightarrow q) \\equiv \\sim((p \\rightarrow q) \\wedge (q \\rightarrow p))$<br><br>$\\equiv \\sim(p \\rightarrow q) \\vee \\sim(q \\rightarrow p)$<br><br>$\\equiv (p \\wedge \\sim q) \\vee (q \\wedge \\sim p)$<br><br>Translating this back to English:<br><br>$p \\wedge \\sim q$: The payment is made and the work is not finished in time.<br><br>$q \\wedge \\sim p$: The work is finished in time and the payment is not made.<br><br>Therefore, the negation is \"Either the work is finished in time and the payment is not made, or the payment is made and the work is not finished in time.\"<br><br>Answer: Either the work is finished in time and the payment is not made, or the payment is made and the work is not finished in time.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b40aee93fa0796dade", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Negation of the statement ' Horses have wings if and only if crows have tails. ' is", "image": null}, "options": [{"id": "0Eu4b", "text": "Horses have wings but crows do not have tails.\r\nor crows have tails but horses do not have wings.", "image": null, "isCorrect": true}, {"id": "wWL2t", "text": "Horses do not have wings if and only if crows do not have tails.", "image": null, "isCorrect": false}, {"id": "6ziYt", "text": "Horses do not have wings and crows have tails.\r\nor Horses have wings and crows have tails.", "image": null, "isCorrect": false}, {"id": "FHzJg", "text": "Horses do not have wings and crows do not have tails.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p$ be the statement 'Horses have wings'.<br><br>Let $q$ be the statement 'Crows have tails'.<br><br>The given statement is of the form $p \\leftrightarrow q$.<br><br>The negation of $p \\leftrightarrow q$ is $\\sim(p \\leftrightarrow q)$.<br><br>We know that $p \\leftrightarrow q \\equiv (p \\rightarrow q) \\wedge (q \\rightarrow p)$.<br><br>Therefore, $\\sim(p \\leftrightarrow q) \\equiv \\sim((p \\rightarrow q) \\wedge (q \\rightarrow p))$<br><br>$\\equiv \\sim(p \\rightarrow q) \\vee \\sim(q \\rightarrow p)$<br><br>$\\equiv (p \\wedge \\sim q) \\vee (q \\wedge \\sim p)$<br><br>This translates to: 'Horses have wings and crows do not have tails, or crows have tails and horses do not have wings'.<br><br>Since the word 'but' is logically equivalent to 'and', the statement can be written as: 'Horses have wings but crows do not have tails, or crows have tails but horses do not have wings'.<br><br>Answer: Horses have wings but crows do not have tails.\r\nor crows have tails but horses do not have wings.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b20aee93fa0796dad1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "If $\\mathrm{p} \\rightarrow(\\sim \\mathrm{p} \\vee \\sim \\mathrm{q})$ is false, then the truth values of $p$ and $q$ are respectively", "image": null}, "options": [{"id": "TdZAv", "text": "F, F", "image": null, "isCorrect": false}, {"id": "VoKS3", "text": "$\\mathrm{F}, \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "wZdge", "text": "$\\mathrm{T}, \\mathrm{T}$", "image": null, "isCorrect": true}, {"id": "2rjtN", "text": "$\\mathrm{T}, \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement is $p \\rightarrow (\\sim p \\vee \\sim q)$.<br><br>We know that an implication $X \\rightarrow Y$ is false if and only if $X$ is true and $Y$ is false.<br><br>Therefore, $p$ must be true (T) and the expression $(\\sim p \\vee \\sim q)$ must be false (F).<br><br>Since $p$ is true, $\\sim p$ is false (F).<br><br>For the disjunction $(\\sim p \\vee \\sim q)$ to be false, both of its components must be false. This means $\\sim q$ must also be false (F).<br><br>Since $\\sim q$ is false, $q$ must be true (T).<br><br>Hence, the truth values of $p$ and $q$ are T and T respectively.<br><br>Answer: $\\mathrm{T}, \\mathrm{T}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a50aee93fa0796da69", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Let $p, q, r$ be three statements such that the truth value of $(p \\wedge q) \\rightarrow(\\sim q \\vee r)$ is $F$. Then the truth values of $p, q, r$ are respectively", "image": null}, "options": [{"id": "ONbzU", "text": "T, F, T.", "image": null, "isCorrect": false}, {"id": "Qpk9p", "text": "$\\mathrm{T}, \\mathrm{T}, \\mathrm{T}$.", "image": null, "isCorrect": false}, {"id": "4aq9F", "text": "F, T, F.", "image": null, "isCorrect": false}, {"id": "hHKTy", "text": "$T, T, F$.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given statement is $(p \\wedge q) \\rightarrow (\\sim q \\vee r)$.<br><br>We are given that the truth value of this statement is F.<br><br>An implication $X \\rightarrow Y$ is F if and only if $X$ is T and $Y$ is F.<br><br>Therefore, $p \\wedge q$ is T and $\\sim q \\vee r$ is F.<br><br>For $p \\wedge q$ to be T, both $p$ and $q$ must be T. Thus, $p$ is T and $q$ is T.<br><br>For $\\sim q \\vee r$ to be F, both $\\sim q$ and $r$ must be F.<br><br>Since $q$ is T, $\\sim q$ is F, which is consistent. Thus, $r$ must be F.<br><br>The truth values of $p, q, r$ are T, T, F respectively.<br><br>Answer: $T, T, F$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a10aee93fa0796da4a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Consider the statements given by following :\n(A) If $3+3=7$, then $4+3=8$.\n(B) If $5+3=8$, then earth is flat.\n(C) If both $(\\mathrm{A})$ and $(\\mathrm{B})$ are true, then $5+6=17$.\nThen which of the following statements is correct?", "image": null}, "options": [{"id": "MMcOh", "text": "(A) is true while (B) and (C) are false.", "image": null, "isCorrect": false}, {"id": "LSQsT", "text": "(A) and (C) are true while (B) is false.", "image": null, "isCorrect": true}, {"id": "7tykl", "text": "(A) and (B) are false, while (C) is true.", "image": null, "isCorrect": false}, {"id": "laxU2", "text": "(A) is false but (B) and (C) are true.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A conditional statement $p \\rightarrow q$ is false if and only if $p$ is true and $q$ is false. In all other cases, it is true.<br><br>Statement (A): The premise $3+3=7$ is false and the conclusion $4+3=8$ is false. Since a false premise implies anything, $F \\rightarrow F$ is True. Thus, (A) is True.<br><br>Statement (B): The premise $5+3=8$ is true and the conclusion \"earth is flat\" is false. Since $T \\rightarrow F$ is False, statement (B) is False.<br><br>Statement (C): The premise is \"both (A) and (B) are true\". Since (B) is false, this premise is false. The conclusion $5+6=17$ is also false. Since $F \\rightarrow F$ is True, statement (C) is True.<br><br>Therefore, (A) and (C) are true while (B) is false.<br><br>Answer: (A) and (C) are true while (B) is false.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138f0aee93fa0796d9bc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If the statements $p, q$ and $r$ have the truth values $F, T, F$ respectively, then the truth values of the statement patterns $(p \\wedge \\sim q) \\rightarrow r$ and $(p \\vee q) \\rightarrow r$ are respectively", "image": null}, "options": [{"id": "oQNBZ", "text": "$\\mathrm{T}, \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "9ETM9", "text": "$\\mathrm{T}, \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "97l8O", "text": "$\\mathrm{F}, \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "ojBGn", "text": "F, F", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the truth values $p = F$, $q = T$, and $r = F$.<br><br>For the first statement pattern $(p \\wedge \\sim q) \\rightarrow r$:<br>Substituting the truth values, we get $(F \\wedge \\sim T) \\rightarrow F$.<br>Since $\\sim T = F$, this becomes $(F \\wedge F) \\rightarrow F$.<br>As $F \\wedge F = F$, the expression simplifies to $F \\rightarrow F$, which evaluates to $T$.<br><br>For the second statement pattern $(p \\vee q) \\rightarrow r$:<br>Substituting the truth values, we get $(F \\vee T) \\rightarrow F$.<br>As $F \\vee T = T$, the expression simplifies to $T \\rightarrow F$, which evaluates to $F$.<br><br>The truth values of the given statement patterns are $T$ and $F$ respectively.<br><br>Answer: $\\mathrm{T}, \\mathrm{F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138f0aee93fa0796d9ba", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The inverse of $[p \\wedge(\\sim q)] \\rightarrow r$ is", "image": null}, "options": [{"id": "87zh0", "text": "$\\sim \\mathrm{r} \\rightarrow(\\sim \\mathrm{p} \\vee \\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "vkSfn", "text": "$\\mathrm{r} \\rightarrow(\\sim \\mathrm{p} \\wedge \\sim \\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "aioXK", "text": "$(\\sim p \\vee q) \\rightarrow \\sim r$", "image": null, "isCorrect": true}, {"id": "k6KBX", "text": "$\\mathrm{r} \\rightarrow(\\mathrm{p} \\wedge \\mathrm{q})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement is $[p \\wedge (\\sim q)] \\rightarrow r$.<br><br>The inverse of a conditional statement $X \\rightarrow Y$ is $\\sim X \\rightarrow \\sim Y$.<br><br>Here, $X = p \\wedge (\\sim q)$ and $Y = r$.<br><br>The inverse is $\\sim [p \\wedge (\\sim q)] \\rightarrow \\sim r$.<br><br>By De Morgan's law, $\\sim [p \\wedge (\\sim q)] \\equiv \\sim p \\vee \\sim (\\sim q) \\equiv \\sim p \\vee q$.<br><br>Thus, the inverse is $(\\sim p \\vee q) \\rightarrow \\sim r$.<br><br>Answer: $(\\sim p \\vee q) \\rightarrow \\sim r$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137f0aee93fa0796d93d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "If $(p \\wedge \\sim q) \\wedge(p \\wedge r) \\rightarrow \\sim p \\vee q$ is false, then the truth values of $p, q$ and $r$ are respectively", "image": null}, "options": [{"id": "8D7zA", "text": "$\\mathrm{T}, \\mathrm{T}, \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "S9pz4", "text": "F, F, F", "image": null, "isCorrect": false}, {"id": "IUDet", "text": "T, F, T", "image": null, "isCorrect": true}, {"id": "rc9gL", "text": "$F, T, F$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement is $(p \\wedge \\sim q) \\wedge (p \\wedge r) \\rightarrow \\sim p \\vee q$.<br><br>A conditional statement $X \\rightarrow Y$ is false if and only if $X$ is true and $Y$ is false.<br><br>Therefore, $(p \\wedge \\sim q) \\wedge (p \\wedge r)$ must be true and $\\sim p \\vee q$ must be false.<br><br>For $\\sim p \\vee q$ to be false, both $\\sim p$ and $q$ must be false. This implies that $p$ is true (T) and $q$ is false (F).<br><br>For $(p \\wedge \\sim q) \\wedge (p \\wedge r)$ to be true, both $p \\wedge \\sim q$ and $p \\wedge r$ must be true.<br><br>Since $p$ is true, for $p \\wedge r$ to be true, $r$ must be true (T).<br><br>Thus, the truth values of $p, q$, and $r$ are T, F, and T respectively.<br><br>Answer: T, F, T", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213790aee93fa0796d910", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The statement pattern $[p \\wedge(q \\vee r)] \\vee[\\sim r \\wedge \\sim q \\wedge p]$ is equivalent to", "image": null}, "options": [{"id": "gWrcG", "text": "$q \\vee r$", "image": null, "isCorrect": false}, {"id": "YjQ42", "text": "$\\mathrm{p} \\vee \\mathrm{r}$.", "image": null, "isCorrect": false}, {"id": "PRX31", "text": "q", "image": null, "isCorrect": false}, {"id": "e7a2a", "text": "p", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given statement pattern is $[p \\wedge (q \\vee r)] \\vee [\\sim r \\wedge \\sim q \\wedge p]$.<br><br>Using the commutative law, we can rewrite the second term:<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge (\\sim q \\wedge \\sim r)]$<br><br>Applying De Morgan's law to $(\\sim q \\wedge \\sim r)$, we get $\\sim (q \\vee r)$:<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge \\sim (q \\vee r)]$<br><br>Using the distributive law, we can factor out $p$:<br><br>$p \\wedge [(q \\vee r) \\vee \\sim (q \\vee r)]$<br><br>By the complement law, $(q \\vee r) \\vee \\sim (q \\vee r)$ is a tautology $T$.<br><br>Substituting this back, we get:<br><br>$p \\wedge T$<br><br>By the identity law, $p \\wedge T$ is equivalent to $p$.<br><br>Answer: p", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136b0aee93fa0796d8a6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "$\\sim[(p \\vee \\sim q) \\rightarrow(p \\wedge \\sim q)] \\equiv$", "image": null}, "options": [{"id": "Zy2vy", "text": "$(p \\wedge \\sim q) \\wedge(\\sim p \\vee q)$", "image": null, "isCorrect": false}, {"id": "rZ1WR", "text": "$(p \\wedge \\sim q) \\wedge(\\sim p \\wedge q)$", "image": null, "isCorrect": false}, {"id": "xNbgu", "text": "$(p \\vee \\sim q) \\wedge(\\sim p \\vee q)$", "image": null, "isCorrect": true}, {"id": "nnD5F", "text": "$(p \\vee \\sim q) \\vee(\\sim p \\vee q)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the property of implication, $A \\rightarrow B \\equiv \\sim A \\vee B$.<br><br>The negation of implication is $\\sim(A \\rightarrow B) \\equiv A \\wedge \\sim B$.<br><br>Let $A = p \\vee \\sim q$ and $B = p \\wedge \\sim q$.<br><br>The given expression is $\\sim(A \\rightarrow B)$, which is equivalent to $A \\wedge \\sim B$.<br><br>Substituting $A$ and $B$, we get $(p \\vee \\sim q) \\wedge \\sim(p \\wedge \\sim q)$.<br><br>Using De Morgan's law, $\\sim(p \\wedge \\sim q) \\equiv \\sim p \\vee q$.<br><br>Therefore, the expression is equivalent to $(p \\vee \\sim q) \\wedge (\\sim p \\vee q)$.<br><br>Answer: $(p \\vee \\sim q) \\wedge(\\sim p \\vee q)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213580aee93fa0796d80f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Consider the following statements p : the switch $\\mathrm{S}_1$ is closed. q : the switch $\\mathrm{S}_2$ is closed.\r\n$r$ : the switch $\\mathrm{S}_3$ is closed.\r\nThen the switching circuit represented by the statement $(\\mathrm{p} \\wedge \\mathrm{q}) \\vee(\\sim \\mathrm{p} \\wedge(\\sim \\mathrm{q} \\vee \\mathrm{p} \\vee \\mathrm{r}))$ is", "image": null}, "options": [{"id": "OgdM3", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/9Q9z1uPAYCBliDjbiOA0fzLkQgdtW3OIffS0rLTQHac.original.fullsize_2.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "4JJvj", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/8bJYK6j_IG2H2zBsqvdNHKvAs52Cy8GO0QGpqQf01jw.original.fullsize_2.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "HKZOc", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/ib-8v9whkr-ZM3QMufcAHA7tbma19rBE-IUlMSUTiKk.original.fullsize_2.png\"/><br/>", "image": null, "isCorrect": true}, {"id": "P8x8S", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/i09kq0PcbmNsV1dX4Hrh-zA2hQ6zea1gUQNhhcyTsoY.original.fullsize_2.png\"/><br/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given logical statement is $(p \\wedge q) \\vee (\\sim p \\wedge (\\sim q \\vee p \\vee r))$.<br><br>The $\\vee$ operator between $(p \\wedge q)$ and $\\sim p \\wedge (\\sim q \\vee p \\vee r)$ indicates two main branches connected in parallel.<br><br>The first branch $(p \\wedge q)$ represents switches $S_1$ and $S_2$ connected in series.<br><br>The second branch $\\sim p \\wedge (\\sim q \\vee p \\vee r)$ represents switch $S_1'$ connected in series with a parallel combination of three switches.<br><br>The expression $(\\sim q \\vee p \\vee r)$ represents switches $S_2'$, $S_1$, and $S_3$ connected in parallel.<br><br>Comparing this with the given options, the third circuit diagram matches this arrangement perfectly. The upper branch contains $S_1$ and $S_2$ in series, and the lower branch contains $S_1'$ in series with a parallel group of $S_2'$, $S_1$, and $S_3$.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/ib-8v9whkr-ZM3QMufcAHA7tbma19rBE-IUlMSUTiKk.original.fullsize_2.png\"/><br/>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213530aee93fa0796d7e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "If p and q are statements, then $\\qquad$ is a contingency.", "image": null}, "options": [{"id": "dpu3Y", "text": "$\\mathrm{p} \\wedge \\sim \\mathrm{p}$", "image": null, "isCorrect": false}, {"id": "FzLND", "text": "$\\mathrm{p} \\vee \\sim \\mathrm{p}$", "image": null, "isCorrect": false}, {"id": "9PDlR", "text": "$\\mathrm{p} \\vee \\mathrm{q}$", "image": null, "isCorrect": true}, {"id": "7Ext4", "text": "$(\\mathrm{p} \\wedge(\\mathrm{p} \\rightarrow \\mathrm{q})) \\rightarrow \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A contingency is a proposition that is neither a tautology nor a contradiction.<br><br>Evaluating the given options:<br><br>$p \\wedge \\sim p$ is always false, hence it is a contradiction.<br><br>$p \\vee \\sim p$ is always true, hence it is a tautology.<br><br>$p \\vee q$ can be true or false depending on the truth values of $p$ and $q$. For example, if $p$ is true and $q$ is true, $p \\vee q$ is true. If $p$ is false and $q$ is false, $p \\vee q$ is false. Thus, it is a contingency.<br><br>$(p \\wedge (p \\rightarrow q)) \\rightarrow q \\equiv (p \\wedge (\\sim p \\vee q)) \\rightarrow q \\equiv (p \\wedge q) \\rightarrow q \\equiv \\sim(p \\wedge q) \\vee q \\equiv \\sim p \\vee \\sim q \\vee q \\equiv \\sim p \\vee T \\equiv T$. This is a tautology.<br><br>Therefore, $p \\vee q$ is a contingency.<br><br>Answer: $\\mathrm{p} \\vee \\mathrm{q}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213450aee93fa0796d77c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which one of the following is the pair of equivalent circuits?\r\ni. <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/MbmTgGFjmWsfKLDcsiHMsmYHh1I6Vt4Jv5WKfiI_8HA.original.fullsize.png\"/><br/>ii.<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/QKLtKR_WcrnT8j5gANUWGJcCh-kWrMEUSLVe5eNOkhU.original.fullsize.png\"/><br/>iii.<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/ocg70W1Uen--kUHaf4-hiSSfEvfqI97s-04W6lZkHDs.original.fullsize.png\"/><br/>iv.<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/5CV2EHOcxHlzu8y9JiRzT4n3SKwCh7V34Tb8hyRSiTo.original.fullsize.png\"/><br/>v.<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/JeEiaBIX03tkrvYDl9W7waSmKcpuQBHcARQUVrpjv8Q.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "79dfc", "text": "(i) and (ii)", "image": null, "isCorrect": false}, {"id": "DqbdY", "text": "(ii) and (iv)", "image": null, "isCorrect": false}, {"id": "FgVk8", "text": "(iii) and (v)", "image": null, "isCorrect": false}, {"id": "NEmLR", "text": "(i) and (iii)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let us determine the Boolean expression for each circuit by representing series connections with AND ($\text{$\\land$}$) and parallel connections with OR ($\text{$\\lor$}$).<br><br>For circuit (i):<br>The upper branch has switches $S_1$ and $S_2$ in series, which gives $S_1 \\land S_2$.<br>The lower branch has switches $S_1$ and $S_3$ in series, which gives $S_1 \\land S_3$.<br>These two branches are in parallel, so the equivalent expression is:<br>$Y_1 = (S_1 \\land S_2) \\lor (S_1 \\land S_3)$<br>Using the distributive law, this simplifies to:<br>$Y_1 = S_1 \\land (S_2 \\lor S_3)$<br><br>For circuit (ii):<br>The upper branch has switch $S_1$.<br>The lower branch has switches $S_2$ and $S_3$ in series, giving $S_2 \\land S_3$.<br>These branches are in parallel, so the expression is:<br>$Y_2 = S_1 \\lor (S_2 \\land S_3)$<br><br>For circuit (iii):<br>Switches $S_2$ and $S_3$ are in parallel, giving $(S_2 \\lor S_3)$.<br>This combination is in series with switch $S_1$, so the expression is:<br>$Y_3 = S_1 \\land (S_2 \\lor S_3)$<br><br>For circuit (iv):<br>All three switches are in series, so the expression is:<br>$Y_4 = S_1 \\land S_2 \\land S_3$<br><br>For circuit (v):<br>The upper branch has $S_1$ and $S_2$ in series, giving $S_1 \\land S_2$.<br>The lower branch has switch $S_3$.<br>These branches are in parallel, so the expression is:<br>$Y_5 = (S_1 \\land S_2) \\lor S_3$<br><br>Comparing the Boolean expressions, we get $Y_1 = Y_3$. Therefore, circuits (i) and (iii) are equivalent.<br><br>Answer: (i) and (iii)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213440aee93fa0796d774", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The negation of contrapositive of the statement $\\mathrm{p} \\rightarrow(\\sim \\mathrm{q} \\wedge \\mathrm{r})$ is", "image": null}, "options": [{"id": "0rF5f", "text": "$(\\sim q \\vee \\sim r) \\wedge \\sim p$", "image": null, "isCorrect": false}, {"id": "UuQ1N", "text": "$(q \\vee \\sim r) \\wedge p$", "image": null, "isCorrect": true}, {"id": "3waiS", "text": "$(q \\wedge \\sim r) \\vee p$", "image": null, "isCorrect": false}, {"id": "mMv76", "text": "$\\quad(\\sim q \\wedge \\sim r) \\vee \\sim p$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the given statement be $A \\rightarrow B$, where $A = p$ and $B = \\sim q \\wedge r$.<br><br>The contrapositive of $A \\rightarrow B$ is $\\sim B \\rightarrow \\sim A$.<br><br>The negation of the contrapositive is $\\sim(\\sim B \\rightarrow \\sim A)$.<br><br>Using the logical equivalence $\\sim(X \\rightarrow Y) \\equiv X \\wedge \\sim Y$, we get:<br><br>$\\sim(\\sim B \\rightarrow \\sim A) \\equiv \\sim B \\wedge \\sim(\\sim A) \\equiv \\sim B \\wedge A$<br><br>Substituting $A = p$ and $B = \\sim q \\wedge r$, we obtain:<br><br>$\\sim(\\sim q \\wedge r) \\wedge p$<br><br>Using De Morgan's law, $\\sim(\\sim q \\wedge r) \\equiv q \\vee \\sim r$.<br><br>Therefore, the required statement is $(q \\vee \\sim r) \\wedge p$.<br><br>Answer: $(q \\vee \\sim r) \\wedge p$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213310aee93fa0796d6dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "If statement I : If the work is not finished on time, the contractor is in trouble.\r\nstatement II : Either the work is finished on time or the contractor is in trouble. then", "image": null}, "options": [{"id": "XfJ8X", "text": "statement II is negation of statement I.", "image": null, "isCorrect": false}, {"id": "0X9kX", "text": "statement II is converse of statement I.", "image": null, "isCorrect": false}, {"id": "1dph0", "text": "statement II and statement I are equivalent.", "image": null, "isCorrect": true}, {"id": "kuCc9", "text": "statement II is an inverse of statement I.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"The work is finished on time\".<br>Let $q$ be the statement \"The contractor is in trouble\".<br><br>Statement I can be written as: $\\sim p \\rightarrow q$<br>Statement II can be written as: $p \\vee q$<br><br>Using the logical equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$, we can rewrite Statement I as:<br>$\\sim p \\rightarrow q \\equiv \\sim(\\sim p) \\vee q \\equiv p \\vee q$<br><br>Since both statements reduce to $p \\vee q$, Statement I and Statement II are logically equivalent.<br><br>Answer: statement II and statement I are equivalent.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213300aee93fa0796d6d1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "If the statement $p \\vee \\sim(q \\wedge r)$ is false; then the truth values of $p, q$ and $r$ are respectively", "image": null}, "options": [{"id": "9QrLh", "text": "$\\mathrm{F}, \\mathrm{T}, \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "D3k0P", "text": "$\\mathrm{F}, \\mathrm{T}, \\mathrm{T}$", "image": null, "isCorrect": true}, {"id": "dRQLQ", "text": "$T, F, F$", "image": null, "isCorrect": false}, {"id": "CvzQ0", "text": "$F, F, T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement is $p \\vee \\sim(q \\wedge r)$.<br><br>It is given that this statement is false.<br><br>A disjunction $A \\vee B$ is false if and only if both $A$ and $B$ are false.<br><br>Therefore, $p$ is false and $\\sim(q \\wedge r)$ is false.<br><br>Since $\\sim(q \\wedge r)$ is false, $q \\wedge r$ must be true.<br><br>A conjunction $A \\wedge B$ is true if and only if both $A$ and $B$ are true.<br><br>Therefore, $q$ is true and $r$ is true.<br><br>The truth values of $p, q$, and $r$ are F, T, and T respectively.<br><br>Answer: $\\mathrm{F}, \\mathrm{T}, \\mathrm{T}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "qu nStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262700279619d9d8a348c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The negation of the statement \"The number is an odd number if and only if it is divisible by $3$ . \"", "image": null}, "options": [{"id": "MJpZ5", "text": "(A) The number is an odd number but not divisible by 3 or the number is divisible by 3 but not odd.", "image": null, "isCorrect": true}, {"id": "V4Gds", "text": "The number is not an odd number iff it is not divisible by 3 .", "image": null, "isCorrect": false}, {"id": "xXT3J", "text": "The number is not an odd number but it is divisible by 3 .", "image": null, "isCorrect": false}, {"id": "MbohF", "text": "The number is not an odd number or is not divisible by 3 but the number is divisible by $3$ or odd.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{p}$ : The number is an odd number,\n$\\mathrm{q}:$ The number is divisible by 3\n$$\n\\sim(p \\leftrightarrow q) \\equiv(p \\wedge \\sim q) \\vee(q \\wedge \\sim p)\n$$\n$\\therefore \\quad$ The negation of the given statement is \"The number is an odd number but not divisible by 3 or the number is divisible by 3 but not odd'.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262630279619d9d8a341b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "If $\\mathrm{q}$ is false and $\\mathrm{p} \\wedge \\mathrm{q} \\leftrightarrow \\mathrm{r}$ is true, then is a tautology.", "image": null}, "options": [{"id": "0mYrg", "text": "$\\mathrm{p} \\vee \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "c6N9B", "text": "$(\\mathrm{p} \\wedge \\mathrm{r}) \\rightarrow \\mathrm{p} \\vee \\mathrm{r}$", "image": null, "isCorrect": true}, {"id": "XaFCL", "text": "$(\\mathrm{p} \\vee \\mathrm{r}) \\rightarrow \\mathrm{p} \\wedge \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "ImWTA", "text": "$\\mathrm{p} \\wedge \\mathrm{r}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{q}$ is false and $\\mathrm{p} \\wedge \\mathrm{q} \\leftrightarrow \\mathrm{r}$ is true\n$\\Rightarrow p \\wedge q \\equiv F$ and $r \\equiv F$\n$\\Rightarrow \\mathrm{p} \\equiv \\mathrm{T}$ or $\\mathrm{F}, \\mathrm{q} \\equiv \\mathrm{F}$ and $\\mathrm{r} \\equiv \\mathrm{F}$\n(1) $\\mathrm{p} \\vee \\mathrm{r} \\equiv \\mathrm{T}$ or $\\mathrm{F}$\n(2) $(\\mathrm{p} \\wedge \\mathrm{r}) \\rightarrow(\\mathrm{p} \\vee \\mathrm{r}) \\equiv \\mathrm{F} \\rightarrow(\\mathrm{T}$ or $\\mathrm{F}) \\equiv \\mathrm{T}$\n(3) $(\\mathrm{p} \\vee \\mathrm{r}) \\rightarrow(\\mathrm{p} \\wedge \\mathrm{r}) \\equiv(\\mathrm{T}$ or $\\mathrm{F}) \\rightarrow \\mathrm{F} \\equiv \\mathrm{T}$ or $\\mathrm{F}$\n(4) $\\mathrm{p} \\wedge \\mathrm{r} \\equiv \\mathrm{F}$", "image": null}, "videoSolution": null, "syllabusCate gation of above statement is $(p \\wedge \\sim q) \\vee(q \\wedge \\sim p)$\n$\\therefore$Option (D) is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b80279619d9d8a2ece", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The negation of the statement $(p \\wedge q) \\rightarrow(\\sim p \\vee r)$ is", "image": null}, "options": [{"id": "moPF5", "text": "$\\mathrm{p} \\vee \\mathrm{q} \\vee \\sim \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "w6bZe", "text": "$\\mathrm{p} \\wedge \\mathrm{q} \\wedge \\approx \\mathrm{r}$", "image": null, "isCorrect": true}, {"id": "V8fej", "text": "$\\sim p \\vee q \\wedge r$", "image": null, "isCorrect": false}, {"id": "wmrI5", "text": "$\\sim \\mathrm{p} \\vee \\sim \\mathrm{q} \\vee \\sim \\mathrm{r}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\sim[(p \\wedge q) \\rightarrow(\\sim p \\vee r)] \\\\ & \\equiv(p \\wedge q) \\wedge \\sim(\\sim p \\vee r) \\ldots[\\because \\sim(p \\rightarrow q) \\equiv p \\wedge \\sim q] \\\\ & \\equiv p \\wedge q \\wedge p \\wedge \\sim r \\quad \\ldots[\\text { Associative Law }] \\\\ & \\equiv p \\wedge q \\wedge \\sim r \\quad \\ldots[\\text { Idempotent Law }]\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b60279619d9d8a2ebc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "If truth values of statements $p, q$ are true, and $r$, $s$ are false, then the truth values of the following statement patterns are respectively\n$\\mathrm{a}: \\sim(\\mathrm{p} \\wedge \\sim \\mathrm{r}) \\vee(\\sim \\mathrm{q} \\vee \\mathrm{s})$\n$\\mathrm{b}:(\\sim \\mathrm{q} \\wedge \\sim \\mathrm{r}) \\leftrightarrow(\\mathrm{p} \\vee \\mathrm{s})$\n$c:(\\sim p \\vee q) \\rightarrow(r \\wedge \\sim s)$", "image": null}, "options": [{"id": "XIldV", "text": "$T,F,F$", "image": null, "isCorrect": false}, {"id": "2ePEe", "text": "$F,F,F$", "image": null, "isCorrect": true}, {"id": "S1kj2", "text": "$F,T,T$", "image": null, "isCorrect": false}, {"id": "zQz0X", "text": "$T,F,T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "a.\n$\\begin{aligned}\n& \\sim(\\mathrm{p} \\wedge \\sim \\mathrm{r}) \\vee(\\sim \\mathrm{q} \\vee \\mathrm{s}) \\\\\n& \\equiv \\sim(\\mathrm{T} \\wedge \\sim \\mathrm{F}) \\vee(\\sim \\mathrm{T} \\vee \\mathrm{F}) \\\\\n& \\equiv(\\mathrm{F} \\vee \\mathrm{F}) \\vee(\\mathrm{F} \\vee \\mathrm{F}) \\\\\n& \\equiv \\mathrm{F} \\vee \\mathrm{F} \\\\\n& \\equiv \\mathrm{F}\n\\end{aligned}$\nb.\n$\\begin{aligned}\n& (\\sim \\mathrm{q} \\wedge \\sim \\mathrm{r}) \\leftrightarrow(\\mathrm{p} \\vee \\mathrm{s}) \\\\\n& \\equiv(\\sim \\mathrm{T} \\wedge \\sim \\mathrm{F}) \\leftrightarrow(\\mathrm{T} \\vee \\mathrm{F}) \\\\\n& \\equiv \\mathrm{F} \\leftrightarrow \\mathrm{T} \\\\\n& \\equiv \\mathrm{F}\n\\end{aligned}$\nc.\n$\\begin{aligned}\n& (\\sim p \\vee q) \\rightarrow(r \\wedge \\sim s) \\\\\n& \\equiv(\\sim T \\vee T) \\rightarrow(F \\wedge \\sim F) \\\\\n& \\equiv(F \\vee T) \\rightarrow(F \\wedge T) \\\\\n& \\equiv T \\rightarrow F \\\\\n& \\equiv F\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a70279619d9d8a2e41", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The inverse of statement pattern $(p \\vee q) \\rightarrow(p \\wedge q)$ is", "image": null}, "options": [{"id": "h0lwg", "text": "$(\\sim p \\vee \\sim q) \\rightarrow(\\sim p \\wedge \\sim q)$", "image": null, "isCorrect": false}, {"id": "vIl96", "text": "$(p \\wedge q) \\rightarrow(p \\vee q)$", "image": null, "isCorrect": true}, {"id": "XBYJC", "text": "$(p \\wedge q) \\rightarrow(p \\vee q)$", "image": null, "isCorrect": false}, {"id": "ojnKX", "text": "$\\sim(p \\vee q) \\rightarrow(p \\wedge q)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\because \\text { inverse of } p \\rightarrow q \\text { is } \\sim p \\rightarrow \\sim q \\\\ & \\Rightarrow \\text { inverse of } p \\vee q \\rightarrow p \\wedge q \\\\ & \\equiv \\sim(p \\vee q) \\rightarrow \\sim(p \\wedge q) \\\\ & \\equiv(\\sim p \\wedge \\sim q) \\rig
