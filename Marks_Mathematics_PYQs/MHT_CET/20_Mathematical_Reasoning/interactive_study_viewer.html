 "$\\sim p \\wedge q$", "isCorrect": false, "image": null}, {"id": "cdFP5", "label": "C", "text": "$\\sim p \\wedge \\sim q$", "isCorrect": true, "image": null}, {"id": "aHPUJ", "label": "D", "text": "$p \\vee q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement is $\\sim p \\vee \\sim q$.<br><br>We know that a disjunction $A \\vee B$ can be expressed as a conditional statement $\\sim A \\rightarrow B$.<br><br>Thus, the statement $\\sim p \\vee \\sim q$ can be written as $p \\rightarrow \\sim q$.<br><br>The inverse of a conditional statement $A \\rightarrow B$ is $\\sim A \\rightarrow \\sim B$.<br><br>Therefore, the inverse of $p \\rightarrow \\sim q$ is $\\sim p \\rightarrow \\sim(\\sim q)$, which simplifies to $\\sim p \\rightarrow q$.<br><br>Converting this inverse back to a logical disjunction, we get $\\sim(\\sim p) \\vee q \\equiv p \\vee q$.<br><br>The negation of this inverse is $\\sim(p \\vee q)$.<br><br>By De Morgan's Law, $\\sim(p \\vee q) \\equiv \\sim p \\wedge \\sim q$.<br><br>Answer: $\\sim p \\wedge \\sim q$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30f8c30a4553e1bdfbf", "type": "singleCorrect", "question": {"text": "If the truth value of $[(p \\vee q) \\wedge (q \\to r) \\wedge (\\sim r)] \\to (p \\wedge q)$ is false, then which of the following is <strong>NOT</strong> true?", "image": null}, "options": [{"id": "K4NUC", "label": "A", "text": "Truth value of $p \\to q$ is False", "isCorrect": false, "image": null}, {"id": "QKAB3", "label": "B", "text": "Truth value of $p \\to r$ is False.", "isCorrect": false, "image": null}, {"id": "0mTcl", "label": "C", "text": "Truth value of $(\\sim q) \\to p$ is False.", "isCorrect": true, "image": null}, {"id": "cZWEO", "label": "D", "text": "The truth value of $(\\sim p) \\wedge r$ is False.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given that the truth value of $[(p \\vee q) \\wedge (q \\to r) \\wedge (\\sim r)] \\to (p \\wedge q)$ is False.<br><br>An implication $A \\to B$ is False if and only if $A$ is True and $B$ is False. Therefore, the antecedent $(p \\vee q) \\wedge (q \\to r) \\wedge (\\sim r)$ is True and the consequent $p \\wedge q$ is False.<br><br>For the antecedent to be True, each of its conjuncts must be True:<br>1) $\\sim r$ is True $\\Rightarrow r$ is False.<br>2) $q \\to r$ is True. Since $r$ is False, $q$ must be False (otherwise $T \\to F$ would be False).<br>3) $p \\vee q$ is True. Since $q$ is False, $p$ must be True.<br><br>Checking the consequent: $p \\wedge q \\equiv T \\wedge F \\equiv F$, which is consistent.<br><br>Thus, the truth values are: $p$ is True, $q$ is False, and $r$ is False.<br><br>Now, evaluating the given options:<br>1) $p \\to q \\equiv T \\to F \\equiv F$. The statement \"Truth value of $p \\to q$ is False\" is True.<br>2) $p \\to r \\equiv T \\to F \\equiv F$. The statement \"Truth value of $p \\to r$ is False\" is True.<br>3) $(\\sim q) \\to p \\equiv (\\sim F) \\to T \\equiv T \\to T \\equiv T$. The statement \"Truth value of $(\\sim q) \\to p$ is False\" is False.<br>4) $(\\sim p) \\wedge r \\equiv (\\sim T) \\wedge F \\equiv F \\wedge F \\equiv F$. The statement \"The truth value of $(\\sim p) \\wedge r$ is False\" is True.<br><br>Therefore, the statement in the third option is NOT true.<br><br>Answer: Truth value of $(\\sim q) \\to p$ is False.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30f8c30a4553e1bdfbe", "type": "singleCorrect", "question": {"text": "If p, q, r are simple propositions with truth values T, F, T respectively, then which of the following is not a true statement?", "image": null}, "options": [{"id": "mXqhy", "label": "A", "text": "$[q \\wedge (p \\to q)] \\to p$", "isCorrect": false, "image": null}, {"id": "oojJN", "label": "B", "text": "$(p \\wedge q) \\to (q \\vee \\sim p)$", "isCorrect": false, "image": null}, {"id": "iHM6B", "label": "C", "text": "$[(\\sim p \\vee q) \\wedge \\sim r] \\leftrightarrow p$", "isCorrect": true, "image": null}, {"id": "7MDKn", "label": "D", "text": "$(p \\wedge q) \\vee (\\sim q \\vee r)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $p = T$, $q = F$, $r = T$.<br><br>Evaluating the first option:<br>$[q \\wedge (p \\to q)] \\to p \\equiv [F \\wedge (T \\to F)] \\to T \\equiv [F \\wedge F] \\to T \\equiv F \\to T \\equiv T$<br><br>Evaluating the second option:<br>$(p \\wedge q) \\to (q \\vee \\sim p) \\equiv (T \\wedge F) \\to (F \\vee F) \\equiv F \\to F \\equiv T$<br><br>Evaluating the third option:<br>$[(\\sim p \\vee q) \\wedge \\sim r] \\leftrightarrow p \\equiv [(F \\vee F) \\wedge F] \\leftrightarrow T \\equiv [F \\wedge F] \\leftrightarrow T \\equiv F \\leftrightarrow T \\equiv F$<br><br>Evaluating the fourth option:<br>$(p \\wedge q) \\vee (\\sim q \\vee r) \\equiv (T \\wedge F) \\vee (T \\vee T) \\equiv F \\vee T \\equiv T$<br><br>The statement in the third option is not true.<br><br>Answer: $[(\\sim p \\vee q) \\wedge \\sim r] \\leftrightarrow p$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30f8c30a4553e1bdfbd", "type": "singleCorrect", "question": {"text": "If $\\sim p \\to q$ is false and $q \\leftrightarrow r$ is false, then the truth value of $(p, q, r)$ is...", "image": null}, "options": [{"id": "b4Ziw", "label": "A", "text": "$(T, F, T)$", "isCorrect": false, "image": null}, {"id": "EbVHK", "label": "B", "text": "$(F, T, F)$", "isCorrect": false, "image": null}, {"id": "IAMTE", "label": "C", "text": "$(F, F, T)$", "isCorrect": true, "image": null}, {"id": "u250w", "label": "D", "text": "$(F, T, T)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The implication $\\sim p \\to q$ is given as false.<br><br>An implication $A \\to B$ is false if and only if $A$ is true and $B$ is false.<br><br>Therefore, $\\sim p$ is true and $q$ is false.<br><br>Since $\\sim p$ is true, $p$ must be false ($F$). Thus, $p = F$ and $q = F$.<br><br>The biconditional $q \\leftrightarrow r$ is given as false.<br><br>A biconditional $A \\leftrightarrow B$ is false if and only if $A$ and $B$ have opposite truth values.<br><br>Since $q$ is false, $r$ must be true ($T$).<br><br>The truth values of $(p, q, r)$ are $(F, F, T)$.<br><br>Answer: $(F, F, T)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3018c30a4553e1bdf29", "type": "singleCorrect", "question": {"text": "The simplified switching circuit for the following circuit is<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_1__q113_d1.png\" />", "image": null}, "options": [{"id": "FzpEK", "label": "A", "text": "<img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_1__q113_d2.png\" />", "isCorrect": true, "image": null}, {"id": "353WN", "label": "B", "text": "<img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_1__q113_d3.png\" />", "isCorrect": false, "image": null}, {"id": "MELVE", "label": "C", "text": "<img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_1__q113_d4.png\" />", "isCorrect": false, "image": null}, {"id": "btVnM", "label": "D", "text": "<img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_1__q113_d5.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $p, q, r$ represent the switches $S_1, S_2, S_3$ respectively.<br><br>The Boolean expression for the top branch is $p \\wedge (q \\vee r)$.<br><br>The Boolean expression for the bottom branch is $\\sim r \\wedge \\sim q \\wedge p$, which can be rewritten as $p \\wedge (\\sim q \\wedge \\sim r)$.<br><br>The total circuit is the parallel combination of these two branches, so the expression is:<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge (\\sim q \\wedge \\sim r)]$<br><br>Using De Morgan's Law, $\\sim q \\wedge \\sim r \\equiv \\sim(q \\vee r)$.<br><br>Substituting this, we get:<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge \\sim(q \\vee r)]$<br><br>Using the distributive law, we can factor out $p$:<br><br>$p \\wedge [(q \\vee r) \\vee \\sim(q \\vee r)]$<br><br>Since $A \\vee \\sim A \\equiv T$ (where $T$ represents a closed circuit or tautology), we have:<br><br>$p \\wedge T \\equiv p$<br><br>This means the simplified circuit consists only of the switch $S_1$.<br><br>Answer: <img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_1__q113_d2.png\" />", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3018c30a4553e1bdf28", "type": "singleCorrect", "question": {"text": "The logical statement $(p \\vee q) \\wedge [(\\sim p \\wedge q) \\vee (p \\wedge \\sim q)] \\wedge \\sim q$ is logically equivalent to ...", "image": null}, "options": [{"id": "dlrVr", "label": "A", "text": "$p \\wedge \\sim q$", "isCorrect": true, "image": null}, {"id": "kU91H", "label": "B", "text": "$\\sim p \\wedge q$", "isCorrect": false, "image": null}, {"id": "JoQJA", "label": "C", "text": "$p \\wedge q$", "isCorrect": false, "image": null}, {"id": "lQnKJ", "label": "D", "text": "$\\sim p \\vee \\sim q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given statement: $(p \\vee q) \\wedge [(\\sim p \\wedge q) \\vee (p \\wedge \\sim q)] \\wedge \\sim q$<br><br>Consider the part $[(\\sim p \\wedge q) \\vee (p \\wedge \\sim q)] \\wedge \\sim q$<br><br>Using distributive law:<br><br>$= ((\\sim p \\wedge q) \\wedge \\sim q) \\vee ((p \\wedge \\sim q) \\wedge \\sim q)$<br><br>$= (\\sim p \\wedge (q \\wedge \\sim q)) \\vee (p \\wedge (\\sim q \\wedge \\sim q))$<br><br>$= (\\sim p \\wedge F) \\vee (p \\wedge \\sim q)$<br><br>$= F \\vee (p \\wedge \\sim q)$<br><br>$= p \\wedge \\sim q$<br><br>Now, substitute this back into the original statement:<br><br>$= (p \\vee q) \\wedge (p \\wedge \\sim q)$<br><br>Using distributive law:<br><br>$= (p \\wedge (p \\wedge \\sim q)) \\vee (q \\wedge (p \\wedge \\sim q))$<br><br>$= ((p \\wedge p) \\wedge \\sim q) \\vee (p \\wedge (q \\wedge \\sim q))$<br><br>$= (p \\wedge \\sim q) \\vee (p \\wedge F)$<br><br>$= (p \\wedge \\sim q) \\vee F$<br><br>$= p \\wedge \\sim q$<br><br>Answer: $p \\wedge \\sim q$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3018c30a4553e1bdf27", "type": "singleCorrect", "question": {"text": "Which of the following logical statements is a tautology?", "image": null}, "options": [{"id": "pgcSb", "label": "A", "text": "$[(p \\rightarrow q) \\wedge \\sim q] \\rightarrow \\sim p$", "isCorrect": true, "image": null}, {"id": "mwYuS", "label": "B", "text": "$(p \\rightarrow q) \\wedge (p \\wedge \\sim q)$", "isCorrect": false, "image": null}, {"id": "4wYNG", "label": "C", "text": "$[(p \\vee q) \\wedge \\sim p] \\wedge \\sim q$", "isCorrect": false, "image": null}, {"id": "RUu6A", "label": "D", "text": "$[(p \\vee \\sim q) \\vee (\\sim p \\wedge q)] \\wedge r$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Consider the first option: $[(p \\rightarrow q) \\wedge \\sim q] \\rightarrow \\sim p$<br><br>Using logical equivalences, we know that $p \\rightarrow q \\equiv \\sim p \\vee q$.<br><br>Substituting this into the premise:<br>$(p \\rightarrow q) \\wedge \\sim q \\equiv (\\sim p \\vee q) \\wedge \\sim q$<br>$\\equiv (\\sim p \\wedge \\sim q) \\vee (q \\wedge \\sim q)$<br>$\\equiv (\\sim p \\wedge \\sim q) \\vee F$<br>$\\equiv \\sim p \\wedge \\sim q$<br><br>Now, substituting this back into the original statement:<br>$(\\sim p \\wedge \\sim q) \\rightarrow \\sim p$<br>$\\equiv \\sim(\\sim p \\wedge \\sim q) \\vee \\sim p$<br>$\\equiv (p \\vee q) \\vee \\sim p$<br>$\\equiv (p \\vee \\sim p) \\vee q$<br>$\\equiv T \\vee q \\equiv T$<br><br>Since the final truth value is always True ($T$), this statement is a tautology.<br><br>Checking the other options for completeness:<br>$(p \\rightarrow q) \\wedge (p \\wedge \\sim q) \\equiv (\\sim p \\vee q) \\wedge \\sim(\\sim p \\vee q) \\equiv F$ (Contradiction)<br><br>$[(p \\vee q) \\wedge \\sim p] \\wedge \\sim q \\equiv (q \\wedge \\sim p) \\wedge \\sim q \\equiv \\sim p \\wedge (q \\wedge \\sim q) \\equiv F$ (Contradiction)<br><br>$[(p \\vee \\sim q) \\vee (\\sim p \\wedge q)] \\wedge r \\equiv [(p \\vee \\sim q \\vee \\sim p) \\wedge (p \\vee \\sim q \\vee q)] \\wedge r \\equiv (T \\wedge T) \\wedge r \\equiv r$ (Not a tautology)<br><br>Answer: $[(p \\rightarrow q) \\wedge \\sim q] \\rightarrow \\sim p$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f38c30a4553e1bde93", "type": "singleCorrect", "question": {"text": "In a switching circuit, if the combination $(S_1 \\wedge S_2)$ is connected in parallel to the combination $(S_1' \\wedge S_2')$, then the room is lit only when $\\ldots$", "image": null}, "options": [{"id": "heMjc", "label": "A", "text": "$S_1$ is ON and $S_2$ is OFF", "isCorrect": false, "image": null}, {"id": "l6P1b", "label": "B", "text": "$S_1$ is OFF and $S_2$ is ON", "isCorrect": false, "image": null}, {"id": "Mv2kI", "label": "C", "text": "$S_1$ and $S_2$ both ON or $S_1$ and $S_2$ both OFF", "isCorrect": true, "image": null}, {"id": "1vcM2", "label": "D", "text": "The room is always lit.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The boolean expression for the given switching circuit is $(S_1 \\wedge S_2) \\vee (S_1' \\wedge S_2')$.<br><br>Let $p$ and $q$ represent the truth values of switches $S_1$ and $S_2$ respectively.<br><br>The room is lit when the expression $(p \\wedge q) \\vee (\\sim p \\wedge \\sim q)$ evaluates to True.<br><br>This expression is True if and only if both $p$ and $q$ are True, or both $p$ and $q$ are False.<br><br>Thus, the room is lit only when $S_1$ and $S_2$ are both ON, or $S_1$ and $S_2$ are both OFF.<br><br>Answer: $S_1$ and $S_2$ both ON or $S_1$ and $S_2$ both OFF", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f38c30a4553e1bde92", "type": "singleCorrect", "question": {"text": "If the truth value of the statement pattern $(\\sim p \\wedge q) \\vee (\\sim p \\wedge \\sim q) \\vee (p \\wedge \\sim q)$ is $F$, then the truth values of $(p \\vee \\sim q)$ and $(p \\to q)$ are $\\ldots$ respectively.", "image": null}, "options": [{"id": "82edJ", "label": "A", "text": "$F, F$", "isCorrect": false, "image": null}, {"id": "ETfjY", "label": "B", "text": "$F, T$", "isCorrect": false, "image": null}, {"id": "6CIAv", "label": "C", "text": "$T, T$", "isCorrect": true, "image": null}, {"id": "GcmC0", "label": "D", "text": "$T, F$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement pattern is $(\\sim p \\wedge q) \\vee (\\sim p \\wedge \\sim q) \\vee (p \\wedge \\sim q)$.<br><br>Simplifying the first two terms using the distributive law:<br><br>$(\\sim p \\wedge q) \\vee (\\sim p \\wedge \\sim q) \\equiv \\sim p \\wedge (q \\vee \\sim q) \\equiv \\sim p \\wedge T \\equiv \\sim p$<br><br>The statement pattern then becomes:<br><br>$\\sim p \\vee (p \\wedge \\sim q)$<br><br>Using the distributive law again:<br><br>$(\\sim p \\vee p) \\wedge (\\sim p \\vee \\sim q) \\equiv T \\wedge (\\sim p \\vee \\sim q) \\equiv \\sim p \\vee \\sim q$<br><br>It is given that the truth value of this pattern is $F$.<br><br>$\\sim p \\vee \\sim q \\equiv F$<br><br>This is possible only when both $\\sim p$ and $\\sim q$ are $F$.<br><br>Thus, $p \\equiv T$ and $q \\equiv T$.<br><br>Now, substituting the truth values of $p$ and $q$ into the required expressions:<br><br>$p \\vee \\sim q \\equiv T \\vee F \\equiv T$<br><br>$p \\to q \\equiv T \\to T \\equiv T$<br><br>The truth values are $T, T$ respectively.<br><br>Answer: $T, T$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f38c30a4553e1bde91", "type": "singleCorrect", "question": {"text": "The minimum number of switches in the simplified form of the following switching circuit is<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_2__q111_d1.png\" />", "image": null}, "options": [{"id": "M74dk", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "qUn3M", "label": "B", "text": "$1$", "isCorrect": false, "image": null}, {"id": "Pl7Yd", "label": "C", "text": "$2$", "isCorrect": true, "image": null}, {"id": "6AOfW", "label": "D", "text": "$3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the switches $S_1, S_2, S_3$ be represented by boolean variables $p, q, r$ respectively. Then $S_1', S_2'$ represent their complements $p', q'$.<br><br>The given switching circuit consists of three parallel branches. We can write the boolean expression for the circuit as:<br>$L = (S_1 \\cdot S_2) + (S_1' \\cdot S_2) + (S_3 \\cdot S_2')$<br><br>Substituting the variables, we get:<br>$L = (p \\cdot q) + (p' \\cdot q) + (r \\cdot q')$<br><br>Now, we simplify the boolean expression:<br>Factor out $q$ from the first two terms:<br>$L = q \\cdot (p + p') + r \\cdot q'$<br><br>Since $p + p' = 1$ (a boolean variable and its complement always sum to 1):<br>$L = q \\cdot 1 + r \\cdot q'$<br>$L = q + q' \\cdot r$<br><br>Using the distributive law $A + A'B = A + B$, we can further simplify:<br>$L = (q + q') \\cdot (q + r)$<br>$L = 1 \\cdot (q + r)$<br>$L = q + r$<br><br>Converting back to the switch notation, the simplified expression is:<br>$L = S_2 + S_3$<br><br>This simplified expression represents two switches ($S_2$ and $S_3$) connected in parallel. Therefore, the minimum number of switches in the simplified form is $2$.<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32b8c30a4553e1be0eb", "type": "singleCorrect", "question": {"text": "The correct logical equivalence from the following is /are ___<br>(I) $p \\to (q \\to r) \\equiv (p \\wedge q) \\to r$<br>(II) $(p \\to q) \\to r \\equiv p \\to (q \\vee r)$<br>(III) $(p \\to q) \\to r \\equiv (p \\to r) \\wedge (\\sim q \\to r)$<br>(IV) $p \\to (q \\to r) \\equiv q \\to (p \\to r)$", "image": null}, "options": [{"id": "n7AIr", "label": "A", "text": "only (I) and (II)", "isCorrect": false, "image": null}, {"id": "ShJDc", "label": "B", "text": "only (III) and (IV)", "isCorrect": false, "image": null}, {"id": "nm7TU", "label": "C", "text": "only (II) and (IV)", "isCorrect": false, "image": null}, {"id": "xOlYr", "label": "D", "text": "only (I) and (IV)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using the property $A \\to B \\equiv \\sim A \\vee B$, we evaluate each statement.<br><br>For (I):<br>$p \\to (q \\to r) \\equiv \\sim p \\vee (\\sim q \\vee r) \\equiv (\\sim p \\vee \\sim q) \\vee r \\equiv \\sim(p \\wedge q) \\vee r \\equiv (p \\wedge q) \\to r$<br>Statement (I) is correct.<br><br>For (II):<br>$(p \\to q) \\to r \\equiv (\\sim p \\vee q) \\to r \\equiv \\sim(\\sim p \\vee q) \\vee r \\equiv (p \\wedge \\sim q) \\vee r \\equiv (p \\vee r) \\wedge (\\sim q \\vee r)$<br>$p \\to (q \\vee r) \\equiv \\sim p \\vee q \\vee r$<br>Statement (II) is incorrect.<br><br>For (III):<br>$(p \\to q) \\to r \\equiv (p \\vee r) \\wedge (\\sim q \\vee r)$<br>$(p \\to r) \\wedge (\\sim q \\to r) \\equiv (\\sim p \\vee r) \\wedge (q \\vee r)$<br>Statement (III) is incorrect.<br><br>For (IV):<br>$p \\to (q \\to r) \\equiv \\sim p \\vee \\sim q \\vee r$<br>$q \\to (p \\to r) \\equiv \\sim q \\vee (\\sim p \\vee r) \\equiv \\sim p \\vee \\sim q \\vee r$<br>Statement (IV) is correct.<br><br>Therefore, only (I) and (IV) are correct.<br><br>Answer: only (I) and (IV)", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32b8c30a4553e1be0ea", "type": "singleCorrect", "question": {"text": "The contrapositive of the statement pattern $[p \\vee (p \\to q)] \\to (p \\wedge \\sim q)$ is", "image": null}, "options": [{"id": "oqkLL", "label": "A", "text": "$(p \\wedge \\sim q) \\to [p \\wedge (p \\to q)]$", "isCorrect": false, "image": null}, {"id": "apKbx", "label": "B", "text": "$(\\sim p \\wedge \\sim q) \\to [\\sim p \\wedge (p \\to \\sim q)]$", "isCorrect": false, "image": null}, {"id": "uGe3w", "label": "C", "text": "$(\\sim p \\vee q) \\wedge [\\sim p \\vee (p \\wedge \\sim q)]$", "isCorrect": false, "image": null}, {"id": "FkOA5", "label": "D", "text": "$(\\sim p \\vee q) \\to [\\sim p \\wedge (p \\wedge \\sim q)]$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the given statement be $X \\to Y$, where $X = p \\vee (p \\to q)$ and $Y = p \\wedge \\sim q$.<br><br>The contrapositive of $X \\to Y$ is $\\sim Y \\to \\sim X$.<br><br>First, we find $\\sim Y$:<br>$\\sim Y = \\sim (p \\wedge \\sim q) = \\sim p \\vee q$<br><br>Next, we find $\\sim X$:<br>$\\sim X = \\sim [p \\vee (p \\to q)]$<br>Using De Morgan's Law, we get:<br>$\\sim X = \\sim p \\wedge \\sim (p \\to q)$<br><br>Since $p \\to q \\equiv \\sim p \\vee q$, its negation is $\\sim (p \\to q) \\equiv p \\wedge \\sim q$.<br>Substituting this back, we get:<br>$\\sim X = \\sim p \\wedge (p \\wedge \\sim q)$<br><br>Therefore, the contrapositive $\\sim Y \\to \\sim X$ is:<br>$(\\sim p \\vee q) \\to [\\sim p \\wedge (p \\wedge \\sim q)]$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32b8c30a4553e1be0e9", "type": "singleCorrect", "question": {"text": "The negation of the converse of $p \\vee q$ is", "image": null}, "options": [{"id": "tPJQ6", "label": "A", "text": "$\\sim p \\vee q$", "isCorrect": false, "image": null}, {"id": "sLNhi", "label": "B", "text": "$p \\wedge q$", "isCorrect": true, "image": null}, {"id": "NtKII", "label": "C", "text": "$p \\vee \\sim q$", "isCorrect": false, "image": null}, {"id": "KVJNI", "label": "D", "text": "$\\sim p \\wedge \\sim q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The statement $p \\vee q$ can be expressed as a conditional statement: $\\sim p \\rightarrow q$.<br><br>The converse of a conditional statement $A \\rightarrow B$ is $B \\rightarrow A$.<br><br>Therefore, the converse of $\\sim p \\rightarrow q$ is $q \\rightarrow \\sim p$.<br><br>The statement $q \\rightarrow \\sim p$ is logically equivalent to $\\sim q \\vee \\sim p$.<br><br>The negation of this converse is $\\sim(q \\rightarrow \\sim p) \\equiv \\sim(\\sim q \\vee \\sim p)$.<br><br>Using De Morgan's laws, $\\sim(\\sim q \\vee \\sim p) \\equiv q \\wedge p \\equiv p \\wedge q$.<br><br>Answer: $p \\wedge q$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3488c30a4553e1be217", "type": "singleCorrect", "question": {"text": "Which of the following statements is/are False?<br>$S_1 : \\exists\\, n \\in N$, such that $n^2 + n + 2$ is divisible by 4.<br>$S_2 : \\exists\\, x \\in N$, such that $x - 17 < 20$.<br>$S_3 : \\forall\\, n \\in N, \\quad x^2 + 3x - 10 = 0$.<br>$S_4 : \\forall\\, n \\in N, \\quad n^2 \\geq 1$.", "image": null}, "options": [{"id": "gmVHn", "label": "A", "text": "$S_1$ and $S_2$.", "isCorrect": false, "image": null}, {"id": "X20RS", "label": "B", "text": "$S_1$ and $S_3$.", "isCorrect": false, "image": null}, {"id": "R3vWJ", "label": "C", "text": "Only $S_3$.", "isCorrect": true, "image": null}, {"id": "IYWI5", "label": "D", "text": "$S_2$ and $S_4$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For $S_1$: Let $n = 1 \\in N$. Then $n^2 + n + 2 = 1^2 + 1 + 2 = 4$, which is divisible by $4$. Thus, there exists at least one natural number satisfying the condition, making $S_1$ true.<br><br>For $S_2$: Let $x = 1 \\in N$. Then $x - 17 = 1 - 17 = -16$, which is strictly less than $20$. Thus, there exists at least one natural number satisfying the condition, making $S_2$ true.<br><br>For $S_3$: The statement asserts that for all natural numbers, the equation $x^2 + 3x - 10 = 0$ holds. However, $x^2 + 3x - 10 = (x + 5)(x - 2) = 0$ is only satisfied for $x = 2$ and $x = -5$. It does not hold for all natural numbers (for example, $x = 1$ gives $-6 \\neq 0$). Thus, $S_3$ is false.<br><br>For $S_4$: The set of natural numbers is $N = \\{1, 2, 3, \\dots\\}$. For any $n \\in N$, we have $n \\geq 1$, which implies $n^2 \\geq 1$. Thus, $S_4$ is true.<br><br>Therefore, only statement $S_3$ is false.<br><br>Answer: Only $S_3$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3488c30a4553e1be216", "type": "singleCorrect", "question": {"text": "The negation of $(p \\wedge q) \\rightarrow ((p \\vee r) \\rightarrow\\, \\sim q)$ is equivalent to ...", "image": null}, "options": [{"id": "VB3iG", "label": "A", "text": "$p \\wedge q$", "isCorrect": true, "image": null}, {"id": "XIHaa", "label": "B", "text": "$p \\wedge\\, \\sim r$", "isCorrect": false, "image": null}, {"id": "e4o7J", "label": "C", "text": "$q \\wedge (p \\vee r)$", "isCorrect": false, "image": null}, {"id": "WYtHy", "label": "D", "text": "$\\sim p \\wedge\\, \\sim q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the given statement be $S \\equiv (p \\wedge q) \\rightarrow ((p \\vee r) \\rightarrow \\sim q)$.<br><br>The negation of a conditional statement $X \\rightarrow Y$ is $X \\wedge \\sim Y$.<br><br>$\\sim S \\equiv (p \\wedge q) \\wedge \\sim((p \\vee r) \\rightarrow \\sim q)$<br><br>Applying the negation rule again to the second part:<br><br>$\\sim S \\equiv (p \\wedge q) \\wedge ((p \\vee r) \\wedge \\sim(\\sim q))$<br><br>$\\sim S \\equiv (p \\wedge q) \\wedge ((p \\vee r) \\wedge q)$<br><br>Using the associative and idempotent laws ($q \\wedge q \\equiv q$):<br><br>$\\sim S \\equiv p \\wedge q \\wedge (p \\vee r)$<br><br>Using the absorption law, $p \\wedge (p \\vee r) \\equiv p$:<br><br>$\\sim S \\equiv (p \\wedge (p \\vee r)) \\wedge q$<br><br>$\\sim S \\equiv p \\wedge q$<br><br>Answer: $p \\wedge q$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3488c30a4553e1be215", "type": "singleCorrect", "question": {"text": "The statement pattern $[(p \\wedge q) \\rightarrow (\\sim p \\vee r)] \\vee [(\\sim p \\vee r) \\rightarrow (p \\wedge q)]$ is", "image": null}, "options": [{"id": "DhltY", "label": "A", "text": "a contradiction", "isCorrect": false, "image": null}, {"id": "hdNyT", "label": "B", "text": "a tautology", "isCorrect": true, "image": null}, {"id": "nk3wu", "label": "C", "text": "equivalent to $(p \\wedge q) \\vee r$.", "isCorrect": false, "image": null}, {"id": "FMu7i", "label": "D", "text": "equivalent to $(p \\vee q)$ .", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $A = p \\wedge q$ and $B = \\sim p \\vee r$.<br><br>The given statement pattern can be written as $(A \\rightarrow B) \\vee (B \\rightarrow A)$.<br><br>Using the logical equivalence $X \\rightarrow Y \\equiv \\sim X \\vee Y$, the expression becomes:<br><br>$(\\sim A \\vee B) \\vee (\\sim B \\vee A)$<br><br>Using the commutative and associative properties of disjunction, we can rearrange the terms as:<br><br>$(\\sim A \\vee A) \\vee (\\sim B \\vee B)$<br><br>We know that for any statement $X$, $\\sim X \\vee X \\equiv T$ (where $T$ represents a tautology).<br><br>Substituting this into the expression, we get:<br><br>$T \\vee T \\equiv T$<br><br>Therefore, the given statement pattern is a tautology.<br><br>Answer: a tautology", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ca8c30a4553e1bdcd0", "type": "singleCorrect", "question": {"text": "If the statements<br>p: If voltage increases then current decreases.<br>q : If voltage does not increases then current does not decreases.<br>r : If current decreases then voltage increases.<br>s : If current does not decreases then voltage does not increases.<br>then which of the following pairs of statements having same meaning", "image": null}, "options": [{"id": "SAOJs", "label": "A", "text": "p, q and r, s", "isCorrect": false, "image": null}, {"id": "bMl6f", "label": "B", "text": "p, r and q, s", "isCorrect": false, "image": null}, {"id": "vy09I", "label": "C", "text": "p, s and q, r", "isCorrect": true, "image": null}, {"id": "BTIGC", "label": "D", "text": "no pair having same meaning", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $V$ be the statement \"voltage increases\".<br><br>Let $C$ be the statement \"current decreases\".<br><br>The given statements can be represented symbolically as:<br><br>$p : V \\rightarrow C$<br><br>$q : \\sim V \\rightarrow \\sim C$<br><br>$r : C \\rightarrow V$<br><br>$s : \\sim C \\rightarrow \\sim V$<br><br>A conditional statement is logically equivalent to its contrapositive ($A \\rightarrow B \\equiv \\sim B \\rightarrow \\sim A$).<br><br>The contrapositive of statement $p$ ($V \\rightarrow C$) is $\\sim C \\rightarrow \\sim V$, which is exactly statement $s$. Thus, $p$ and $s$ are logically equivalent.<br><br>The contrapositive of statement $q$ ($\\sim V \\rightarrow \\sim C$) is $C \\rightarrow V$, which is exactly statement $r$. Thus, $q$ and $r$ are logically equivalent.<br><br>Therefore, the pairs of statements having the same meaning are $p, s$ and $q, r$.<br><br>Answer: p, s and q, r", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ca8c30a4553e1bdccf", "type": "singleCorrect", "question": {"text": "If $p \\to (q \\vee \\sim r)$ is false, then the truth values of $(p \\leftrightarrow q) \\wedge r$ and $\\sim p \\to \\sim q$ are :", "image": null}, "options": [{"id": "XAWjf", "label": "A", "text": "$T, T$", "isCorrect": false, "image": null}, {"id": "mqk9R", "label": "B", "text": "$T, F$", "isCorrect": false, "image": null}, {"id": "znOkX", "label": "C", "text": "$F, T$", "isCorrect": true, "image": null}, {"id": "qrTKw", "label": "D", "text": "$F, F$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $p \\to (q \\vee \\sim r)$ is false.<br><br>An implication $A \\to B$ is false if and only if $A$ is true and $B$ is false.<br><br>Thus, $p$ is $T$ and $q \\vee \\sim r$ is $F$.<br><br>For a disjunction $q \\vee \\sim r$ to be false, both components must be false. Therefore, $q$ is $F$ and $\\sim r$ is $F$, which means $r$ is $T$.<br><br>We have the truth values: $p = T$, $q = F$, $r = T$.<br><br>Evaluating the first expression $(p \\leftrightarrow q) \\wedge r$ :<br>$(T \\leftrightarrow F) \\wedge T \\equiv F \\wedge T \\equiv F$<br><br>Evaluating the second expression $\\sim p \\to \\sim q$ :<br>$\\sim T \\to \\sim F \\equiv F \\to T \\equiv T$<br><br>The truth values are $F$ and $T$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d88c30a4553e1bdd66", "type": "singleCorrect", "question": {"text": "If the truth value of the compound statement $[(p \\leftrightarrow q) \\wedge (q \\to r) \\wedge \\sim r] \\to (p \\wedge \\sim q)$ is false, then the truth values of the statement patterns $(p \\to q) \\leftrightarrow (q \\to r)$ and $\\sim(p \\vee r) \\to (q \\wedge p)$ are, respectively ...", "image": null}, "options": [{"id": "KnoLz", "label": "A", "text": "$(T, T)$", "isCorrect": false, "image": null}, {"id": "KOExG", "label": "B", "text": "$(T, F)$", "isCorrect": true, "image": null}, {"id": "VgLh1", "label": "C", "text": "$(F, T)$", "isCorrect": false, "image": null}, {"id": "OIGXU", "label": "D", "text": "$(F, F)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given compound statement is $[(p \\leftrightarrow q) \\wedge (q \\to r) \\wedge \\sim r] \\to (p \\wedge \\sim q)$.<br><br>An implication $X \\to Y$ is false if and only if $X$ is true and $Y$ is false.<br><br>Thus, $(p \\leftrightarrow q) \\wedge (q \\to r) \\wedge \\sim r$ is true and $p \\wedge \\sim q$ is false.<br><br>For the conjunction $(p \\leftrightarrow q) \\wedge (q \\to r) \\wedge \\sim r$ to be true, each of its components must be true:<br>$\\sim r$ is true $\\Rightarrow r = F$<br>$q \\to r$ is true $\\Rightarrow q \\to F$ is true $\\Rightarrow q = F$<br>$p \\leftrightarrow q$ is true $\\Rightarrow p \\leftrightarrow F$ is true $\\Rightarrow p = F$<br><br>Checking the second part with these values: $p \\wedge \\sim q = F \\wedge T = F$, which satisfies the condition that $Y$ is false.<br><br>So, the truth values are $p = F$, $q = F$, $r = F$.<br><br>Now, evaluating the first statement pattern:<br>$(p \\to q) \\leftrightarrow (q \\to r)$<br>$= (F \\to F) \\leftrightarrow (F \\to F)$<br>$= T \\leftrightarrow T = T$<br><br>Evaluating the second statement pattern:<br>$\\sim(p \\vee r) \\to (q \\wedge p)$<br>$= \\sim(F \\vee F) \\to (F \\wedge F)$<br>$= \\sim F \\to F$<br>$= T \\to F = F$<br><br>The truth values are $T$ and $F$, respectively.<br><br>Answer: $(T, F)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d88c30a4553e1bdd65", "type": "singleCorrect", "question": {"text": "The negation of the contrapositive of the statement $(p \\vee \\sim q) \\to (p \\wedge \\sim q)$ is", "image": null}, "options": [{"id": "9ig9T", "label": "A", "text": "$(p \\wedge \\sim q) \\vee (\\sim p \\wedge \\sim q)$", "isCorrect": false, "image": null}, {"id": "NwSPM", "label": "B", "text": "$(\\sim p \\wedge q) \\vee (p \\wedge \\sim q)$", "isCorrect": false, "image": null}, {"id": "y3F50", "label": "C", "text": "$(\\sim p \\vee \\sim q) \\wedge (p \\vee q)$", "isCorrect": false, "image": null}, {"id": "COSgK", "label": "D", "text": "$(\\sim p \\vee q) \\wedge (p \\vee \\sim q)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The contrapositive of a conditional statement $X \\to Y$ is logically equivalent to the statement itself.<br><br>Therefore, the negation of the contrapositive of $X \\to Y$ is logically equivalent to the negation of $X \\to Y$.<br><br>The negation of $X \\to Y$ is $X \\wedge \\sim Y$.<br><br>Given the statement $(p \\vee \\sim q) \\to (p \\wedge \\sim q)$, we have $X = p \\vee \\sim q$ and $Y = p \\wedge \\sim q$.<br><br>The negation of the statement is:<br><br>$X \\wedge \\sim Y = (p \\vee \\sim q) \\wedge \\sim (p \\wedge \\sim q)$<br><br>By De Morgan's laws, $\\sim (p \\wedge \\sim q) \\equiv \\sim p \\vee q$.<br><br>Substituting this back, we get:<br><br>$(p \\vee \\sim q) \\wedge (\\sim p \\vee q)$<br><br>Rearranging the terms, this is identical to $(\\sim p \\vee q) \\wedge (p \\vee \\sim q)$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33b8c30a4553e1be194", "type": "singleCorrect", "question": {"text": "Simplest form of the following switching circuit is<br><img style=\"width: 350px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_1__q132_d1.png\" />", "image": null}, "options": [{"id": "Fo1hN", "label": "A", "text": "<img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_1__q132_d2.png\" />", "isCorrect": false, "image": null}, {"id": "GOp3N", "label": "B", "text": "<img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_1__q132_d3.png\" />", "isCorrect": true, "image": null}, {"id": "btV0J", "label": "C", "text": "<img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_1__q132_d4.png\" />", "isCorrect": false, "image": null}, {"id": "CHy1k", "label": "D", "text": "<img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_1__q132_d5.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $p$ represent the switch $S_1$ and $q$ represent the switch $S_2$.<br><br>The given switching circuit consists of three parallel branches. The logical expression for the entire circuit is:<br><br>$E = (p \\land q) \\lor (p \\land \\sim q) \\lor (\\sim p \\land q)$<br><br>We can simplify this boolean expression by grouping the first two terms:<br><br>$E = [p \\land (q \\lor \\sim q)] \\lor (\\sim p \\land q)$<br><br>Since $q \\lor \\sim q$ is always true (a tautology, denoted as $T$), we have:<br><br>$E = (p \\land T) \\lor (\\sim p \\land q)$<br><br>$E = p \\lor (\\sim p \\land q)$<br><br>Applying the distributive law:<br><br>$E = (p \\lor \\sim p) \\land (p \\lor q)$<br><br>Again, since $p \\lor \\sim p$ is a tautology ($T$):<br><br>$E = T \\land (p \\lor q)$<br><br>$E = p \\lor q$<br><br>This simplified logical expression represents a circuit where switches $S_1$ and $S_2$ are connected in parallel.<br><br>Answer: <img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_1__q132_d3.png\" />", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e78c30a4553e1bde0f", "type": "singleCorrect", "question": {"text": "The dual of the statement pattern $(p \\wedge \\sim q) \\longrightarrow (q \\wedge \\sim p)$ is equivalent to", "image": null}, "options": [{"id": "nf67i", "label": "A", "text": "$\\sim(p \\rightarrow q) \\wedge (q \\rightarrow p)$", "isCorrect": false, "image": null}, {"id": "X4PSt", "label": "B", "text": "$(p \\rightarrow q) \\wedge \\sim(q \\rightarrow p)$", "isCorrect": true, "image": null}, {"id": "MEAYl", "label": "C", "text": "$(\\sim p \\rightarrow q) \\wedge (q \\rightarrow p)$", "isCorrect": false, "image": null}, {"id": "JePGE", "label": "D", "text": "$(q \\rightarrow p) \\vee (\\sim p \\rightarrow \\sim q)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "First, convert the given statement pattern into logical connectives $\\vee$, $\\wedge$, and $\\sim$.<br><br>$(p \\wedge \\sim q) \\longrightarrow (q \\wedge \\sim p) \\equiv \\sim(p \\wedge \\sim q) \\vee (q \\wedge \\sim p)$<br><br>Applying De Morgan's Law, we get:<br><br>$\\equiv (\\sim p \\vee q) \\vee (q \\wedge \\sim p)$<br><br>To find the dual of the statement, replace $\\vee$ with $\\wedge$ and $\\wedge$ with $\\vee$:<br><br>Dual $\\equiv (\\sim p \\wedge q) \\wedge (q \\vee \\sim p)$<br><br>Since $(\\sim p \\wedge q)$ implies $(q \\vee \\sim p)$, their conjunction simplifies to:<br><br>Dual $\\equiv \\sim p \\wedge q$<br><br>Now, evaluating the given options to find the equivalent expression:<br><br>For the second option:<br><br>$(p \\rightarrow q) \\wedge \\sim(q \\rightarrow p)$<br><br>$\\equiv (\\sim p \\vee q) \\wedge \\sim(\\sim q \\vee p)$<br><br>$\\equiv (\\sim p \\vee q) \\wedge (q \\wedge \\sim p)$<br><br>Since $(q \\wedge \\sim p)$ implies $(\\sim p \\vee q)$, their conjunction simplifies to:<br><br>$\\equiv q \\wedge \\sim p$<br><br>$\\equiv \\sim p \\wedge q$<br><br>This matches the simplified dual statement.<br><br>Answer: $(p \\rightarrow q) \\wedge \\sim(q \\rightarrow p)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e58c30a4553e1bddf5", "type": "singleCorrect", "question": {"text": "Negation of the statement \"If an integer is greater than 4 and less than 5, then it is a multiple of 3\", is", "image": null}, "options": [{"id": "nCpiY", "label": "A", "text": "An integer is not greater than 4 but less than 5 and it is a multiple of 3.", "isCorrect": false, "image": null}, {"id": "icNKY", "label": "B", "text": "If an integer is not greater than 4 and less than 5 then it is not a multiple of 3.", "isCorrect": false, "image": null}, {"id": "ebyq6", "label": "C", "text": "An integer is greater than 4 and less than 5 but it is not a multiple of 3.", "isCorrect": true, "image": null}, {"id": "zTvfg", "label": "D", "text": "An integer is not greater than 4 and not less than 5 but it is not a multiple of 3.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"An integer is greater than 4 and less than 5\".<br><br>Let $q$ be the statement \"it is a multiple of 3\".<br><br>The given statement is of the form $p \\rightarrow q$.<br><br>The negation of an implication $p \\rightarrow q$ is given by $\\sim(p \\rightarrow q) \\equiv p \\wedge \\sim q$.<br><br>Therefore, the negation of the given statement is \"An integer is greater than 4 and less than 5 but it is not a multiple of 3\".<br><br>Answer: An integer is greater than 4 and less than 5 but it is not a multiple of 3.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31d8c30a4553e1be054", "type": "singleCorrect", "question": {"text": "The dual of the converse of the inverse of the logical statement $p \\to (q \\to r)$ is equivalent to...", "image": null}, "options": [{"id": "IUGKP", "label": "A", "text": "$\\sim [p \\vee (r \\to q)]$", "isCorrect": true, "image": null}, {"id": "dKlxG", "label": "B", "text": "$p \\vee (r \\to q)$", "isCorrect": false, "image": null}, {"id": "ev05A", "label": "C", "text": "$\\sim [p \\vee (q \\to r)]$", "isCorrect": false, "image": null}, {"id": "btkia", "label": "D", "text": "$p \\vee (q \\to r)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement is $p \\to (q \\to r)$.<br><br>The inverse of a conditional statement $A \\to B$ is $\\sim A \\to \\sim B$.<br><br>The converse of $C \\to D$ is $D \\to C$.<br><br>Thus, the converse of the inverse of $A \\to B$ is $\\sim B \\to \\sim A$, which is the contrapositive of the original statement.<br><br>For $p \\to (q \\to r)$, the converse of the inverse is:<br><br>$\\sim (q \\to r) \\to \\sim p$<br><br>We can simplify this using the equivalence $X \\to Y \\equiv \\sim X \\vee Y$:<br><br>$\\sim (q \\to r) \\to \\sim p \\equiv (q \\to r) \\vee \\sim p$<br><br>$\\equiv (\\sim q \\vee r) \\vee \\sim p$<br><br>$\\equiv \\sim p \\vee \\sim q \\vee r$<br><br>To find the dual of a logical expression, we replace $\\vee$ with $\\wedge$ and $\\wedge$ with $\\vee$ (while keeping the literals unchanged).<br><br>The dual of $(\\sim p \\vee \\sim q \\vee r)$ is $(\\sim p \\wedge \\sim q \\wedge r)$.<br><br>Now, we check the given options to find which one is equivalent to $\\sim p \\wedge \\sim q \\wedge r$.<br><br>Evaluating the first option:<br><br>$\\sim [p \\vee (r \\to q)] \\equiv \\sim [p \\vee (\\sim r \\vee q)]$<br><br>Using De Morgan's laws:<br><br>$\\equiv \\sim p \\wedge \\sim (\\sim r \\vee q)$<br><br>$\\equiv \\sim p \\wedge (r \\wedge \\sim q)$<br><br>$\\equiv \\sim p \\wedge \\sim q \\wedge r$<br><br>This matches the dual of the converse of the inverse.<br><br>Answer: $\\sim [p \\vee (r \\to q)]$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31d8c30a4553e1be053", "type": "singleCorrect", "question": {"text": "The statements p, q and r have truth values True, False and False respectively. The truth values of a logical statement $[\\sim(p \\wedge \\sim q) \\vee (q \\vee \\sim r)]$ and its dual are, respectively.....", "image": null}, "options": [{"id": "MuRR8", "label": "A", "text": "True, True", "isCorrect": false, "image": null}, {"id": "Y4XvM", "label": "B", "text": "True, False", "isCorrect": true, "image": null}, {"id": "Gngwg", "label": "C", "text": "False, True", "isCorrect": false, "image": null}, {"id": "nfV0u", "label": "D", "text": "False, False", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $p = T$, $q = F$, $r = F$.<br><br>The logical statement is $S = [\\sim(p \\wedge \\sim q) \\vee (q \\vee \\sim r)]$.<br><br>Substituting the truth values:<br>$p \\wedge \\sim q = T \\wedge \\sim F = T \\wedge T = T$<br>$\\sim(p \\wedge \\sim q) = \\sim T = F$<br>$q \\vee \\sim r = F \\vee \\sim F = F \\vee T = T$<br><br>Therefore, $S = F \\vee T = T$.<br><br>The dual of the statement $S$ is obtained by replacing $\\wedge$ with $\\vee$ and $\\vee$ with $\\wedge$.<br><br>The dual statement is $S^* = [\\sim(p \\vee \\sim q) \\wedge (q \\wedge \\sim r)]$.<br><br>Substituting the truth values:<br>$p \\vee \\sim q = T \\vee \\sim F = T \\vee T = T$<br>$\\sim(p \\vee \\sim q) = \\sim T = F$<br>$q \\wedge \\sim r = F \\wedge \\sim F = F \\wedge T = F$<br><br>Therefore, $S^* = F \\wedge F = F$.<br><br>The truth values of the statement and its dual are True and False respectively.<br><br>Answer: True, False", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29f8c30a4553e1bdb0e", "type": "singleCorrect", "question": {"text": "If the truth value of the compound statement<br>$[(p \\vee q) \\wedge (q \\rightarrow r) \\wedge (\\sim r)] \\rightarrow (p \\wedge q)$ is false, then the truth values of $p \\rightarrow q$ and $q \\rightarrow p$ are respectively...", "image": null}, "options": [{"id": "x8x9n", "label": "A", "text": "$(F, T)$", "isCorrect": true, "image": null}, {"id": "xVPdD", "label": "B", "text": "$(T, F)$", "isCorrect": false, "image": null}, {"id": "8Cg3z", "label": "C", "text": "$(T, T)$", "isCorrect": false, "image": null}, {"id": "AJb6V", "label": "D", "text": "$(F, F)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $X = (p \\vee q) \\wedge (q \\rightarrow r) \\wedge (\\sim r)$ and $Y = p \\wedge q$.<br><br>The truth value of $X \\rightarrow Y$ is given as False.<br><br>An implication $X \\rightarrow Y$ is False if and only if $X$ is True and $Y$ is False.<br><br>For $X$ to be True, all its conjuncts must be True:<br>1) $\\sim r$ is True $\\Rightarrow r$ is False ($F$).<br>2) $q \\rightarrow r$ is True. Since $r$ is False, $q$ must be False ($F$).<br>3) $p \\vee q$ is True. Since $q$ is False, $p$ must be True ($T$).<br><br>Checking $Y$: $p \\wedge q = T \\wedge F = F$, which satisfies the condition that $Y$ is False.<br><br>Thus, the truth values are $p = T$, $q = F$, and $r = F$.<br><br>Now, evaluating the required statements:<br>$p \\rightarrow q \\equiv T \\rightarrow F \\equiv F$<br>$q \\rightarrow p \\equiv F \\rightarrow T \\equiv T$<br><br>The truth values of $p \\rightarrow q$ and $q \\rightarrow p$ are respectively $F$ and $T$.<br><br>Answer: $(F, T)$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29f8c30a4553e1bdb0d", "type": "singleCorrect", "question": {"text": "Which of the following statements is logically equivalent to $\\sim(p \\leftrightarrow q)$ ?", "image": null}, "options": [{"id": "b45em", "label": "A", "text": "$\\sim p \\rightarrow q$", "isCorrect": false, "image": null}, {"id": "BfRgg", "label": "B", "text": "$\\sim p \\leftrightarrow \\sim q$", "isCorrect": false, "image": null}, {"id": "6yqLl", "label": "C", "text": "$\\sim(q \\rightarrow \\sim p)$", "isCorrect": false, "image": null}, {"id": "eRZFh", "label": "D", "text": "$p \\leftrightarrow \\sim q$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The logical equivalence of the biconditional statement is given by:<br><br>$p \\leftrightarrow q \\equiv (p \\rightarrow q) \\wedge (q \\rightarrow p)$<br><br>Taking the negation of both sides:<br><br>$\\sim(p \\leftrightarrow q) \\equiv \\sim((p \\rightarrow q) \\wedge (q \\rightarrow p))$<br><br>Using De Morgan's laws:<br><br>$\\equiv \\sim(p \\rightarrow q) \\vee \\sim(q \\rightarrow p)$<br><br>Since $p \\rightarrow q \\equiv \\sim p \\vee q$, we get:<br><br>$\\equiv \\sim(\\sim p \\vee q) \\vee \\sim(\\sim q \\vee p)$<br><br>Applying De Morgan's laws again:<br><br>$\\equiv (p \\wedge \\sim q) \\vee (q \\wedge \\sim p)$<br><br>Now, evaluating the expression $p \\leftrightarrow \\sim q$:<br><br>$p \\leftrightarrow \\sim q \\equiv (p \\rightarrow \\sim q) \\wedge (\\sim q \\rightarrow p)$<br><br>$\\equiv (\\sim p \\vee \\sim q) \\wedge (q \\vee p)$<br><br>Using the distributive law:<br><br>$\\equiv (\\sim p \\wedge q) \\vee (\\sim p \\wedge p) \\vee (\\sim q \\wedge q) \\vee (\\sim q \\wedge p)$<br><br>Since $\\sim p \\wedge p \\equiv F$ and $\\sim q \\wedge q \\equiv F$:<br><br>$\\equiv (\\sim p \\wedge q) \\vee (p \\wedge \\sim q)$<br><br>Comparing the two results, we conclude that $\\sim(p \\leftrightarrow q) \\equiv p \\leftrightarrow \\sim q$.<br><br>Answer: $p \\leftrightarrow \\sim q$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3728c30a4553e1be3d6", "type": "singleCorrect", "question": {"text": "Consider the statement patterns<br>A. $(q \\rightarrow p) \\vee (p \\rightarrow q)$<br>B. $(\\sim p \\vee \\sim q) \\leftrightarrow \\sim (p \\wedge q)$<br>C. $[(p \\vee q) \\wedge \\sim p] \\wedge \\sim q$<br>D. $(p \\wedge q) \\wedge (\\sim p \\vee \\sim q)$<br>then statement patterns", "image": null}, "options": [{"id": "u8Xph", "label": "A", "text": "A and B are contradictions, C and D are tautologies.", "isCorrect": false, "image": null}, {"id": "W9OHf", "label": "B", "text": "A and B are tautologies, C and D are contradictions.", "isCorrect": true, "image": null}, {"id": "18jyk", "label": "C", "text": "A, B, C, D all are tautologies.", "isCorrect": false, "image": null}, {"id": "74fed", "label": "D", "text": "A, B, C, D all are contradictions.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For statement pattern A:<br>$(q \\rightarrow p) \\vee (p \\rightarrow q) \\equiv (\\sim q \\vee p) \\vee (\\sim p \\vee q) \\equiv (\\sim q \\vee q) \\vee (\\sim p \\vee p) \\equiv T \\vee T \\equiv T$<br>Thus, A is a tautology.<br><br>For statement pattern B:<br>By De Morgan's Law, $\\sim (p \\wedge q) \\equiv \\sim p \\vee \\sim q$.<br>The statement becomes $(\\sim p \\vee \\sim q) \\leftrightarrow (\\sim p \\vee \\sim q)$, which is of the form $X \\leftrightarrow X \\equiv T$.<br>Thus, B is a tautology.<br><br>For statement pattern C:<br>$[(p \\vee q) \\wedge \\sim p] \\wedge \\sim q \\equiv [(p \\wedge \\sim p) \\vee (q \\wedge \\sim p)] \\wedge \\sim q \\equiv [F \\vee (q \\wedge \\sim p)] \\wedge \\sim q \\equiv (q \\wedge \\sim p) \\wedge \\sim q \\equiv \\sim p \\wedge (q \\wedge \\sim q) \\equiv \\sim p \\wedge F \\equiv F$<br>Thus, C is a contradiction.<br><br>For statement pattern D:<br>$(p \\wedge q) \\wedge (\\sim p \\vee \\sim q) \\equiv (p \\wedge q) \\wedge \\sim (p \\wedge q)$, which is of the form $X \\wedge \\sim X \\equiv F$.<br>Thus, D is a contradiction.<br><br>Therefore, A and B are tautologies, while C and D are contradictions.<br><br>Answer: A and B are tautologies, C and D are contradictions.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3718c30a4553e1be3cf", "type": "singleCorrect", "question": {"text": "The statement pattern $(p \\wedge q) \\rightarrow (r \\vee \\sim s)$ is false. Then the truth values of $p, q, r$ and $s$ are respectively", "image": null}, "options": [{"id": "2M6ss", "label": "A", "text": "T, F, T, T", " "label": "B", "text": "$\\exists x \\in A$ such that $x + 2 < 9$.", "isCorrect": false, "image": null}, {"id": "pOmVv", "label": "C", "text": "$\\forall x \\in A, x + 6 \\geq 10$.", "isCorrect": true, "image": null}, {"id": "LKWA8", "label": "D", "text": "$\\exists x \\in A$ such that $x + 6 < 10$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\{1, 2, 3, 4, 5, 6\\}$.<br><br>Checking the first option: $\\exists x \\in A$ such that $x + 3 = 9 \\Rightarrow x = 6$. Since $6 \\in A$, this statement is true.<br><br>Checking the second option: $\\exists x \\in A$ such that $x + 2 < 9 \\Rightarrow x < 7$. Since $1 \\in A$ satisfies this, the statement is true.<br><br>Checking the third option: $\\forall x \\in A, x + 6 \\geq 10 \\Rightarrow x \\geq 4$. This statement is false because for $x = 1, 2, 3 \\in A$, the condition $x \\geq 4$ is not satisfied.<br><br>Checking the fourth option: $\\exists x \\in A$ such that $x + 6 < 10 \\Rightarrow x < 4$. Since $1, 2, 3 \\in A$ satisfy this, the statement is true.<br><br>The statement which is not true is $\\forall x \\in A, x + 6 \\geq 10$.<br><br>Answer: $\\forall x \\in A, x + 6 \\geq 10$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3648c30a4553e1be341", "type": "singleCorrect", "question": {"text": "Consider the following statements<br>$r$: If $p \\rightarrow q$ is false then $p \\vee q$ is false.<br>$s$: If $p \\leftrightarrow q$ is false then $p \\vee q$ is false.<br>The truth values of $r \\rightarrow s$ and $s \\rightarrow r$ are respectively ____", "image": null}, "options": [{"id": "Fzg8c", "label": "A", "text": "T, T", "isCorrect": true, "image": null}, {"id": "DEd9Q", "label": "B", "text": "T, F", "isCorrect": false, "image": null}, {"id": "QAXw0", "label": "C", "text": "F, T", "isCorrect": false, "image": null}, {"id": "1ueYP", "label": "D", "text": "F, F", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let us evaluate the truth value of statement $r$.<br>The premise is \"$p \\rightarrow q$ is false\". The implication $p \\rightarrow q$ is false only when $p$ is True (T) and $q$ is False (F).<br>For $p = \\text{T}$ and $q = \\text{F}$, the value of $p \\vee q$ is $\\text{T} \\vee \\text{F} = \\text{T}$ (True).<br>However, statement $r$ claims that $p \\vee q$ is false. Since the conclusion is false when the premise is true, statement $r$ is False (F).<br><br>Now, let us evaluate the truth value of statement $s$.<br>The premise is \"$p \\leftrightarrow q$ is false\". The biconditional $p \\leftrightarrow q$ is false when $p$ and $q$ have opposite truth values. This gives two cases:<br>Case 1: $p = \\text{T}$ and $q = \\text{F}$. Here, $p \\vee q = \\text{T} \\vee \\text{F} = \\text{T}$.<br>Case 2: $p = \\text{F}$ and $q = \\text{T}$. Here, $p \\vee q = \\text{F} \\vee \\text{T} = \\text{T}$.<br>In both cases, $p \\vee q$ is True. Statement $s$ claims that $p \\vee q$ is false, which is incorrect. Thus, statement $s$ is also False (F).<br><br>Since both statements $r$ and $s$ are False:<br>The truth value of $r \\rightarrow s$ is $\\text{F} \\rightarrow \\text{F}$, which is True (T).<br>The truth value of $s \\rightarrow r$ is $\\text{F} \\rightarrow \\text{F}$, which is True (T).<br><br>Therefore, the truth values of $r \\rightarrow s$ and $s \\rightarrow r$ are T and T respectively.<br><br>Answer: T, T", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bb8c30a4553e1bdc3a", "type": "singleCorrect", "question": {"text": "If the truth value of the compound statement $[(p \\vee q) \\wedge (q \\rightarrow r) \\wedge (\\sim r)] \\rightarrow (p \\wedge q)$ is False then the truth values of $p \\rightarrow q$ and $q \\rightarrow p$ are respectively......", "image": null}, "options": [{"id": "Lykni", "label": "A", "text": "$(T, T)$", "isCorrect": false, "image": null}, {"id": "V6T4V", "label": "B", "text": "$(T, F)$", "isCorrect": false, "image": null}, {"id": "NNVCd", "label": "C", "text": "$(F, T)$", "isCorrect": true, "image": null}, {"id": "fhxD5", "label": "D", "text": "$(F, F)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The compound statement $X \\rightarrow Y$ is False if and only if $X$ is True and $Y$ is False.<br><br>Here, $X = (p \\vee q) \\wedge (q \\rightarrow r) \\wedge (\\sim r)$ and $Y = p \\wedge q$.<br><br>Since $X$ is True, each of its components must be True:<br>1) $\\sim r$ is True $\\Rightarrow r$ is False.<br>2) $q \\rightarrow r$ is True. Since $r$ is False, $q$ must be False.<br>3) $p \\vee q$ is True. Since $q$ is False, $p$ must be True.<br><br>Checking $Y$: $p \\wedge q = T \\wedge F = F$, which satisfies the condition that $Y$ is False.<br><br>Thus, $p = T$ and $q = F$.<br><br>Now, we evaluate $p \\rightarrow q$ and $q \\rightarrow p$:<br>$p \\rightarrow q = T \\rightarrow F = F$<br>$q \\rightarrow p = F \\rightarrow T = T$<br><br>The truth values are $(F, T)$.<br><br>Answer: $(F, T)$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bb8c30a4553e1bdc38", "type": "singleCorrect", "question": {"text": "The statement pattern $(p \\vee q) \\rightarrow \\sim r$ is logically equivalent to", "image": null}, "options": [{"id": "fR4GM", "label": "A", "text": "$(\\sim p \\vee \\sim q) \\vee \\sim r$", "isCorrect": false, "image": null}, {"id": "xUMD7", "label": "B", "text": "$(\\sim p \\wedge \\sim q) \\wedge \\sim r$", "isCorrect": false, "image": null}, {"id": "5iDkV", "label": "C", "text": "$(\\sim p \\wedge \\sim q) \\vee \\sim r$", "isCorrect": true, "image": null}, {"id": "I7Po2", "label": "D", "text": "$(\\sim p \\vee \\sim q) \\wedge \\sim r$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given statement pattern is $(p \\vee q) \\rightarrow \\sim r$.<br><br>Using the logical equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$, the expression can be rewritten by taking $A = p \\vee q$ and $B = \\sim r$.<br><br>$(p \\vee q) \\rightarrow \\sim r \\equiv \\sim(p \\vee q) \\vee \\sim r$<br><br>Applying De Morgan's law, $\\sim(p \\vee q) \\equiv \\sim p \\wedge \\sim q$.<br><br>Substituting this into the expression yields:<br><br>$(\\sim p \\wedge \\sim q) \\vee \\sim r$<br><br>Answer: $(\\sim p \\wedge \\sim q) \\vee \\sim r$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c05bf9280d7f9932e8b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If p : switch $\\mathrm{s}_1$ is closed, q : switch $\\mathrm{s}_2$ is closed then correct interpretation from the following circuit is\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/em7kPaHh5PMfFc29E30_DKmk9NS4AH1tmOJlg94-J_s.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "61ngo", "text": "The lamp is always on", "image": null, "isCorrect": false}, {"id": "bU4ER", "text": "The lamp is always off", "image": null, "isCorrect": true}, {"id": "DhlbZ", "text": "Symbolic form is $\\mathrm{p} \\vee(\\sim \\mathrm{p} \\wedge \\sim \\mathrm{q}) \\vee \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "DOPke", "text": "is equivalent to $\\mathrm{p} \\vee \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"switch $\\mathrm{S}_1$ is closed\" and $q$ be the statement \"switch $\\mathrm{S}_2$ is closed\".<br>Then, $\\sim p$ represents \"switch $\\mathrm{S}_1'$ is closed\" and $\\sim q$ represents \"switch $\\mathrm{S}_2'$ is closed\".<br><br>From the given circuit diagram, we can observe that:<br>1. Switch $\\mathrm{S}_1$ is in series with the rest of the circuit.<br>2. Switches $\\mathrm{S}_1'$ and $\\mathrm{S}_2'$ are in parallel with each other.<br>3. Switch $\\mathrm{S}_2$ is in series with the preceding combination.<br><br>The symbolic form of the given switching circuit is:<br>$p \\wedge (\\sim p \\vee \\sim q) \\wedge q$<br><br>Now, let's simplify this logical expression:<br>$p \\wedge (\\sim p \\vee \\sim q) \\wedge q$<br>By commutative and associative laws, we can rearrange the terms:<br>$\\equiv (p \\wedge q) \\wedge (\\sim p \\vee \\sim q)$<br><br>Using De Morgan's Law, we know that $(\\sim p \\vee \\sim q) \\equiv \\sim(p \\wedge q)$. Substituting this into the expression:<br>$\\equiv (p \\wedge q) \\wedge \\sim(p \\wedge q)$<br><br>This is of the form $r \\wedge \\sim r$, which is a contradiction and is always False ($\\mathrm{F}$).<br>$\\equiv \\mathrm{F}$<br><br>Since the logical expression is always False, the circuit is always open regardless of the states of the switches. Therefore, current will never flow through the circuit, and the lamp is always off.<br><br>Answer: The lamp is always off", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c01bf9280d7f9932e6c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "he
