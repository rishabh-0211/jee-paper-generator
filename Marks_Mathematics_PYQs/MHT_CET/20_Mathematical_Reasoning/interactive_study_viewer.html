ldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The negation of statement pattern $(p \\wedge \\sim q) \\rightarrow(p \\vee \\sim q)$ is", "image": null}, "options": [{"id": "x2M9K", "text": "a tautology", "image": null, "isCorrect": false}, {"id": "yl0fA", "text": "a contingency", "image": null, "isCorrect": false}, {"id": "WxWb8", "text": "a contradiction", "image": null, "isCorrect": true}, {"id": "6rEWi", "text": "equivalent to $\\mathrm{p} \\vee \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the given statement pattern be $S \\equiv (p \\wedge \\sim q) \\rightarrow (p \\vee \\sim q)$.<br><br>The negation of an implication $A \\rightarrow B$ is $A \\wedge \\sim B$.<br><br>$\\sim S \\equiv (p \\wedge \\sim q) \\wedge \\sim(p \\vee \\sim q)$<br><br>Using De Morgan's law, $\\sim(p \\vee \\sim q) \\equiv \\sim p \\wedge q$.<br><br>$\\sim S \\equiv (p \\wedge \\sim q) \\wedge (\\sim p \\wedge q)$<br><br>Using commutative and associative laws:<br><br>$\\sim S \\equiv (p \\wedge \\sim p) \\wedge (q \\wedge \\sim q)$<br><br>Since $p \\wedge \\sim p \\equiv F$ and $q \\wedge \\sim q \\equiv F$:<br><br>$\\sim S \\equiv F \\wedge F \\equiv F$<br><br>Thus, the negation of the given statement pattern is a contradiction.<br><br>Answer: a contradiction", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf4bf9280d7f9932dfc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An alternative equivalent circuit for the circuit <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/PC8MIZozvEmHEsUhESX-7WB0XEBD1PvXIms9SQuK2jU.original.fullsize.png\"><br> is", "image": null}, "options": [{"id": "ggXox", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/W9xERPITNm5qidk5s6gToYIgBEBdc0w0oaEJfzyc9TU.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "qSrJi", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/z4c75GbmHXaon_NWToda8O4xTS8Gg954UjfDGou0Y7A.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "n8WIk", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/1PJ0qDnvp2ncdWpL2WmbYfc1Mvd-RYKM7z386jU-scM.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "tUxgZ", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/5JaEmD3E_nb3jgMTEJ0RdcQom_0yMl7AdCO2dpamXJw.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p, q, r$ represent the switches $S_1, S_2, S_3$ respectively.<br><br>The given circuit consists of two parallel branches:<br>The upper branch has switches $S_1$ and $S_2$ in series, which is represented by $p \\land q$.<br>The lower branch has switches $S_1$ and $S_3$ in series, which is represented by $p \\land r$.<br><br>Since these two branches are connected in parallel, the symbolic form of the given circuit is:<br>$(p \\land q) \\lor (p \\land r)$<br><br>By using the distributive law of logic, we can simplify this expression:<br>$(p \\land q) \\lor (p \\land r) \\equiv p \\land (q \\lor r)$<br><br>This simplified logical expression represents a circuit where switch $S_1$ (corresponding to $p$) is connected in series with a parallel combination of switches $S_2$ and $S_3$ (corresponding to $q \\lor r$).<br><br>Looking at the given options, this arrangement exactly matches the circuit shown in the second option.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/W9xERPITNm5qidk5s6gToYIgBEBdc0w0oaEJfzyc9TU.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf0bf9280d7f9932dd7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Consider the following statements\n$p: 2$ is an even prime number\nq : If $\\mathrm{z}_1=2-i, \\mathrm{z}_2=-2+i \\quad$ where $i=\\sqrt{-1}$, then $\\operatorname{Im}\\left[\\frac{1}{z_1 \\stackrel{}{\\bar{z}_2}}\\right]=-\\frac{1}{5}$\n$r: \\tan \\left(-945^{\\circ}\\right)=-1$\nthen which of the following has truth value True.", "image": null}, "options": [{"id": "vK7rI", "text": "$(p \\rightarrow q) \\leftrightarrow(q \\wedge r)$", "image": null, "isCorrect": true}, {"id": "8SHAz", "text": "$\\mathrm{q} \\leftrightarrow \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "ZqvS1", "text": "$p \\rightarrow q$", "image": null, "isCorrect": false}, {"id": "0Sm8K", "text": "$(\\mathrm{p} \\rightarrow \\mathrm{r}) \\leftrightarrow \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Statement $p$: $2$ is an even prime number. This is True, so $p \\equiv T$.<br><br>Statement $q$: Given $z_1 = 2 - i$ and $z_2 = -2 + i$, we have $\\bar{z}_2 = -2 - i$.<br>$z_1 \\bar{z}_2 = (2 - i)(-2 - i) = -(2 - i)(2 + i) = -(4 - i^2) = -5$.<br>$\\dfrac{1}{z_1 \\bar{z}_2} = -\\dfrac{1}{5} + 0i$.<br>$\\operatorname{Im}\\left[\\dfrac{1}{z_1 \\bar{z}_2}\\right] = 0 \\neq -\\dfrac{1}{5}$. This is False, so $q \\equiv F$.<br><br>Statement $r$: $\\tan(-945^{\\circ}) = -\\tan(945^{\\circ}) = -\\tan(2 \\times 360^{\\circ} + 225^{\\circ}) = -\\tan(225^{\\circ}) = -\\tan(180^{\\circ} + 45^{\\circ}) = -\\tan(45^{\\circ}) = -1$. This is True, so $r \\equiv T$.<br><br>Evaluating the given options:<br>For $(p \\rightarrow q) \\leftrightarrow (q \\wedge r)$:<br>$p \\rightarrow q \\equiv T \\rightarrow F \\equiv F$<br>$q \\wedge r \\equiv F \\wedge T \\equiv F$<br>$F \\leftrightarrow F \\equiv T$.<br><br>For $q \\leftrightarrow r$:<br>$F \\leftrightarrow T \\equiv F$.<br><br>For $p \\rightarrow q$:<br>$T \\rightarrow F \\equiv F$.<br><br>For $(p \\rightarrow r) \\leftrightarrow q$:<br>$p \\rightarrow r \\equiv T \\rightarrow T \\equiv T$<br>$T \\leftrightarrow F \\equiv F$.<br><br>The only expression with a truth value of True is $(p \\rightarrow q) \\leftrightarrow (q \\wedge r)$.<br><br>Answer: $(p \\rightarrow q) \\leftrightarrow(q \\wedge r)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be2bf9280d7f9932d46", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If p, q, r, s are statements, where, $p: A^2-B^2=(A-B)(A+B) ; A, B$ are matrices, $A B \\neq B A$\nq: $5 \\leqslant 5$\nr: ${ }^8 \\mathrm{C}_1+{ }^8 \\mathrm{C}_2+{ }^8 \\mathrm{C}_3+\\ldots \\ldots \\ldots . .+{ }^8 \\mathrm{C}_8=256$\ns: Maximum value of ${ }^8 \\mathrm{C}_{\\mathrm{r}}$ is 70 then the statement from the following having truth value true is ....", "image": null}, "options": [{"id": "psDpM", "text": "$(\\mathrm{p} \\wedge \\sim \\mathrm{r}) \\vee(\\sim \\mathrm{q} \\wedge \\sim \\mathrm{s})$", "image": null, "isCorrect": false}, {"id": "XzocW", "text": "$(\\mathrm{p} \\vee \\sim q) \\leftrightarrow(\\sim \\mathrm{r} \\rightarrow \\mathrm{s})$", "image": null, "isCorrect": false}, {"id": "p63r7", "text": "$(\\mathrm{p} \\leftrightarrow \\mathrm{q}) \\wedge(\\sim \\mathrm{p} \\vee \\sim \\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "NCxmK", "text": "$(\\mathrm{s} \\vee \\sim \\mathrm{p}) \\leftrightarrow(\\sim \\mathrm{p} \\wedge \\sim \\mathrm{r})$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Statement p: For matrices $A$ and $B$, $(A-B)(A+B) = A^2 + AB - BA - B^2$. Since $AB \\neq BA$, $A^2 + AB - BA - B^2 \\neq A^2 - B^2$. Thus, the truth value of p is F.<br><br>Statement q: $5 \\leqslant 5$ is a true statement. Thus, the truth value of q is T.<br><br>Statement r: We know that $\\sum_{i=0}^{n} {}^{n}C_{i} = 2^n$. Therefore, ${}^{8}C_{1} + {}^{8}C_{2} + \\dots + {}^{8}C_{8} = 2^8 - {}^{8}C_{0} = 256 - 1 = 255$. The statement claims it is $256$, so the truth value of r is F.<br><br>Statement s: The maximum value of ${}^{n}C_{r}$ for an even $n$ occurs at $r = \\dfrac{n}{2}$. For $n=8$, the maximum is ${}^{8}C_{4} = \\dfrac{8 \\times 7 \\times 6 \\times 5}{4 \\times 3 \\times 2 \\times 1} = 70$. Thus, the truth value of s is T.<br><br>Now, substituting the truth values (p = F, q = T, r = F, s = T) into the given options:<br><br>First option: $(\\mathrm{p} \\wedge \\sim \\mathrm{r}) \\vee (\\sim \\mathrm{q} \\wedge \\sim \\mathrm{s}) \\equiv (\\text{F} \\wedge \\text{T}) \\vee (\\text{F} \\wedge \\text{F}) \\equiv \\text{F} \\vee \\text{F} \\equiv \\text{F}$<br><br>Second option: $(\\mathrm{p} \\vee \\sim \\mathrm{q}) \\leftrightarrow (\\sim \\mathrm{r} \\rightarrow \\mathrm{s}) \\equiv (\\text{F} \\vee \\text{F}) \\leftrightarrow (\\text{T} \\rightarrow \\text{T}) \\equiv \\text{F} \\leftrightarrow \\text{T} \\equiv \\text{F}$<br><br>Third option: $(\\mathrm{p} \\leftrightarrow \\mathrm{q}) \\wedge (\\sim \\mathrm{p} \\vee \\sim \\mathrm{q}) \\equiv (\\text{F} \\leftrightarrow \\text{T}) \\wedge (\\text{T} \\vee \\text{F}) \\equiv \\text{F} \\wedge \\text{T} \\equiv \\text{F}$<br><br>Fourth option: $(\\mathrm{s} \\vee \\sim \\mathrm{p}) \\leftrightarrow (\\sim \\mathrm{p} \\wedge \\sim \\mathrm{r}) \\equiv (\\text{T} \\vee \\text{T}) \\leftrightarrow (\\text{T} \\wedge \\text{T}) \\equiv \\text{T} \\leftrightarrow \\text{T} \\equiv \\text{T}$<br><br>Only the fourth statement has a truth value of True.<br><br>Answer: $(\\mathrm{s} \\vee \\sim \\mathrm{p}) \\leftrightarrow(\\sim \\mathrm{p} \\wedge \\sim \\mathrm{r})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be1bf9280d7f9932d40", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following statement is a tautology?", "image": null}, "options": [{"id": "YayrM", "text": "$(\\sim q \\wedge p) \\wedge(p \\wedge \\sim p)$", "image": null, "isCorrect": false}, {"id": "zkutP", "text": "$(\\mathrm{p} \\wedge \\mathrm{q}) \\wedge(\\sim \\mathrm{p} \\wedge \\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "aC7ma", "text": "$[(\\sim q) \\wedge p] \\wedge q$", "image": null, "isCorrect": false}, {"id": "o2wvn", "text": "$(\\sim q \\wedge p) \\vee(p \\vee \\sim p)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let us evaluate each option by using the laws of logic.<br><br>For the first option:<br>$(\\sim q \\wedge p) \\wedge (p \\wedge \\sim p)$<br>Since $p \\wedge \\sim p \\equiv F$ (contradiction), we have:<br>$(\\sim q \\wedge p) \\wedge F \\equiv F$<br><br>For the second option:<br>$(p \\wedge q) \\wedge (\\sim p \\wedge q)$<br>Using associative and commutative laws:<br>$(p \\wedge \\sim p) \\wedge (q \\wedge q) \\equiv F \\wedge q \\equiv F$<br><br>For the third option:<br>$[(\\sim q) \\wedge p] \\wedge q$<br>Using associative and commutative laws:<br>$(\\sim q \\wedge q) \\wedge p \\equiv F \\wedge p \\equiv F$<br><br>For the fourth option:<br>$(\\sim q \\wedge p) \\vee (p \\vee \\sim p)$<br>Since $p \\vee \\sim p \\equiv T$ (tautology), we have:<br>$(\\sim q \\wedge p) \\vee T \\equiv T$<br><br>Since the truth value of the fourth statement is always True, it is a tautology.<br><br>Answer: $(\\sim q \\wedge p) \\vee(p \\vee \\sim p)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd2bf9280d7f9932cbc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Consider statements $\\mathrm{p}: \\mathrm{S}_1$ is closed; $\\mathrm{q}: \\mathrm{S}_2$ is closed; $\\mathrm{r}: \\mathrm{S}_3$ is closed. The simplified equivalent circuit diagram and its logical statement for the switching circuit is respectively.\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/yhGUtCjbl_d3kCeHoZUCScJ2UN4ohh2nVKUf2l57Qfw.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "sWtWc", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/KYrlNGIgSZ7k3d_qKbok1Z-8ANuzazZXzRpC9kQ9Feo.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "52OcS", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/H_K6PzzS7Uynn8yybX_mlaDN8kV7wTE2rvBIKcEsb5w.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "rxi7i", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/PjU634ZMeqC2fZZzMA67-Z0EcYqJ7Q2ixupA2CWcNoQ.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "Wb6YS", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/OpVZENWMrJO52rHoGr_10TLsJODEraSdg08Xeoj4KGE.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p$, $q$, and $r$ represent the statements that switches $S_1$, $S_2$, and $S_3$ are closed, respectively. Then $\\sim p$ and $\\sim q$ represent that switches $S_1'$ and $S_2'$ are closed.<br><br>The given circuit consists of three parts connected in series. We can write the logical expression for each part:<br><br>Part 1: Three parallel branches containing $(S_1' \\text{ and } S_2')$, $S_1$, and $S_2$.<br>Logical expression: $(\\sim p \\wedge \\sim q) \\vee p \\vee q$<br>Using De Morgan's law, this becomes $\\sim(p \\vee q) \\vee (p \\vee q)$, which is of the form $\\sim X \\vee X \\equiv T$ (a tautology, meaning it is always closed).<br><br>Part 2: Switch $S_3$ in series.<br>Logical expression: $r$<br><br>Part 3: Two parallel branches containing $(S_1 \\text{ and } S_2)$ and $(S_1' \\text{ and } S_2)$.<br>Logical expression: $(p \\wedge q) \\vee (\\sim p \\wedge q)$<br>Using the distributive law, this becomes $(p \\vee \\sim p) \\wedge q \\equiv T \\wedge q \\equiv q$.<br><br>The complete logical expression for the circuit is the series combination (conjunction) of these three parts:<br>$T \\wedge r \\wedge q \\equiv q \\wedge r$<br><br>The simplified logical statement is $q \\wedge r$, which corresponds to a circuit with switches $S_2$ and $S_3$ connected in series.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/PjU634ZMeqC2fZZzMA67-Z0EcYqJ7Q2ixupA2CWcNoQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd2bf9280d7f9932cbb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the truth value of the expression $[(p \\vee q) \\wedge(q \\rightarrow r) \\wedge(\\sim r)] \\rightarrow(p \\wedge q)$ is False then truth values of $p, q, r$ are respectively.", "image": null}, "options": [{"id": "7vaTv", "text": "T, T, T", "image": null, "isCorrect": false}, {"id": "NuZla", "text": "T, F, F", "image": null, "isCorrect": true}, {"id": "Mpi18", "text": "F, F, F", "image": null, "isCorrect": false}, {"id": "UatOQ", "text": "F, T, T", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the given statement be $A \\rightarrow B$, where $A = (p \\vee q) \\wedge (q \\rightarrow r) \\wedge (\\sim r)$ and $B = p \\wedge q$.<br><br>For an implication $A \\rightarrow B$ to be False, the antecedent $A$ must be True and the consequent $B$ must be False.<br><br>Therefore, $(p \\vee q) \\wedge (q \\rightarrow r) \\wedge (\\sim r)$ is True and $p \\wedge q$ is False.<br><br>For the conjunction $(p \\vee q) \\wedge (q \\rightarrow r) \\wedge (\\sim r)$ to be True, each of its components must be True.<br><br>$\\sim r$ is True $\\Rightarrow r$ is False (F).<br><br>$q \\rightarrow r$ is True. Since $r$ is False, $q$ must be False (F) because True $\\rightarrow$ False is False.<br><br>$p \\vee q$ is True. Since $q$ is False, $p$ must be True (T).<br><br>Checking the consequent $B$: $p \\wedge q = \\text{T} \\wedge \\text{F} = \\text{F}$, which satisfies the condition that $B$ is False.<br><br>Thus, the truth values of $p, q, r$ are T, F, F respectively.<br><br>Answer: T, F, F", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc2bf9280d7f9932c28", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{p} \\equiv$ The switch $\\mathrm{S}_1$ is closed, $\\mathrm{q} \\equiv$ The switch $\\mathrm{S}_2$ is closed, $\\mathrm{r} \\equiv$ switch $S_3$ is closed, then symbolic form of following switching circuit is equivalent to\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/EYH48F9ZS4dPeT789Ai9UNAa7HkINcMDX7WkGXp2iA0.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "QaEhF", "text": "p", "image": null, "isCorrect": true}, {"id": "1jM6i", "text": "q", "image": null, "isCorrect": false}, {"id": "fn4NW", "text": "$\\mathrm{p} \\wedge \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "vBqUJ", "text": "$\\mathrm{p} \\vee \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p$, $q$, and $r$ represent the switches $S_1$, $S_2$, and $S_3$ respectively.<br><br>The switches $S_2'$ and $S_3'$ represent $\\sim q$ and $\\sim r$ respectively.<br><br>In the given circuit, the top branch consists of switch $S_1$ in series with a parallel combination of $S_2$ and $S_3$. Its symbolic form is $p \\wedge (q \\vee r)$.<br><br>The bottom branch consists of switches $S_3'$, $S_2'$, and $S_1$ in series. Its symbolic form is $\\sim r \\wedge \\sim q \\wedge p$.<br><br>Since the top and bottom branches are connected in parallel, the symbolic form of the entire circuit is given by the disjunction of the two branches:<br><br>$[p \\wedge (q \\vee r)] \\vee [\\sim r \\wedge \\sim q \\wedge p]$<br><br>Using the commutative law, we can rewrite the second term:<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge (\\sim q \\wedge \\sim r)]$<br><br>Applying De Morgan's law to the second term ($\\sim q \\wedge \\sim r \\equiv \\sim(q \\vee r)$):<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge \\sim(q \\vee r)]$<br><br>Using the distributive law, we can factor out $p$:<br><br>$p \\wedge [(q \\vee r) \\vee \\sim(q \\vee r)]$<br><br>By the complement law, any statement disjoined with its negation is a tautology (True, denoted as $T$), so $(q \\vee r) \\vee \\sim(q \\vee r) \\equiv T$:<br><br>$p \\wedge T$<br><br>By the identity law, $p \\wedge T \\equiv p$.<br><br>Thus, the given switching circuit is equivalent to $p$.<br><br>Answer: p", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc0bf9280d7f9932c18", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Consider the following three statements\n(A) If $3+2=7$ then $4+3=8$.\n(B) If $5+2=7$ then earth is flat.\n(C) If both (A) and (B) are true then $5+6=11$.\nWhich of the following statements is correct?", "image": null}, "options": [{"id": "28faB", "text": "(A) and (C) are true while (B) is false.", "image": null, "isCorrect": true}, {"id": "kOLlz", "text": "(A) is true while (B) and (C) are false.", "image": null, "isCorrect": false}, {"id": "0ynQf", "text": "(A) is false but (B) and (C) are true.", "image": null, "isCorrect": false}, {"id": "Xfqsg", "text": "(A) is false while (C) is true.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Statement (A) is of the form $p \\rightarrow q$, where $p$ is \"$3+2=7$\" (False) and $q$ is \"$4+3=8$\" (False). Since $F \\rightarrow F$ is True, statement (A) is True.<br><br>Statement (B) is of the form $p \\rightarrow q$, where $p$ is \"$5+2=7$\" (True) and $q$ is \"earth is flat\" (False). Since $T \\rightarrow F$ is False, statement (B) is False.<br><br>Statement (C) is of the form $p \\rightarrow q$, where $p$ is \"both (A) and (B) are true\". Since (A) is True and (B) is False, $p$ is False. The statement $q$ is \"$5+6=11$\" (True). Since $F \\rightarrow T$ is True, statement (C) is True.<br><br>Thus, (A) and (C) are true while (B) is false.<br><br>Answer: (A) and (C) are true while (B) is false.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb0bf9280d7f9932b97", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The negation of the statement \"The triangle is an equilateral or isosceles triangle and the triangle is not isosceles and it is right angled\" is", "image": null}, "options": [{"id": "AuCUx", "text": "The triangle is not an equilateral or not an isosceles triangle or it is not an isosceles or it is not right angled", "image": null, "isCorrect": false}, {"id": "HRvcm", "text": "The triangle is not an equilateral triangle or not isosceles triangle and it is isosceles or it is not right angled", "image": null, "isCorrect": false}, {"id": "nn9KY", "text": "If the triangle is an equilateral triangle or an isosceles triangle then it is an isosceles triangle or not right angled", "image": null, "isCorrect": true}, {"id": "Ck2kn", "text": "If the triangle is an equilateral triangle or an isosceles triangle then it is not isosceles triangle and it is not right angled", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the simple statements be:<br>$p$: The triangle is an equilateral triangle.<br>$q$: The triangle is an isosceles triangle.<br>$r$: The triangle is right angled.<br><br>The given statement in symbolic form is:<br>$(p \\lor q) \\land (\\sim q \\land r)$<br><br>The negation of the statement is:<br>$\\sim [ (p \\lor q) \\land (\\sim q \\land r) ]$<br><br>Using De Morgan's law $\\sim (A \\land B) \\equiv \\sim A \\lor \\sim B$, we get:<br>$\\sim (p \\lor q) \\lor \\sim (\\sim q \\land r)$<br><br>Using De Morgan's law again on the second bracket, $\\sim (\\sim q \\land r) \\equiv q \\lor \\sim r$, we get:<br>$\\sim (p \\lor q) \\lor (q \\lor \\sim r)$<br><br>Using the conditional equivalence $\\sim A \\lor B \\equiv A \\rightarrow B$, this can be rewritten as:<br>$(p \\lor q) \\rightarrow (q \\lor \\sim r)$<br><br>Translating this back into words, we get:<br>\"If the triangle is an equilateral triangle or an isosceles triangle then it is an isosceles triangle or not right angled.\"<br><br>Answer: If the triangle is an equilateral triangle or an isosceles triangle then it is an isosceles triangle or not right angled", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb0bf9280d7f9932b95", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the statements $\\mathrm{p}, \\mathrm{q}$ and r are true, false and true statements respectively, then the truth value of the statement pattern $[\\sim q \\wedge(p \\vee \\sim q) \\wedge \\sim r] \\vee p$ and the truth value of its dual statement respectively are", "image": null}, "options": [{"id": "3PD96", "text": "T, T", "image": null, "isCorrect": true}, {"id": "qFF4I", "text": "F, T", "image": null, "isCorrect": false}, {"id": "Cf9cU", "text": "T, F", "image": null, "isCorrect": false}, {"id": "HWAct", "text": "F, F", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the truth values: $p \\equiv T$, $q \\equiv F$, and $r \\equiv T$.<br><br>The given statement pattern is:<br>$[\\sim q \\wedge (p \\vee \\sim q) \\wedge \\sim r] \\vee p$<br><br>Substituting the truth values into the pattern:<br>$\\sim q \\equiv \\sim F \\equiv T$<br>$p \\vee \\sim q \\equiv T \\vee T \\equiv T$<br>$\\sim r \\equiv \\sim T \\equiv F$<br><br>The expression inside the square bracket evaluates to:<br>$T \\wedge T \\wedge F \\equiv F$<br><br>The entire statement pattern evaluates to:<br>$F \\vee p \\equiv F \\vee T \\equiv T$<br><br>The dual of a statement pattern is obtained by replacing $\\wedge$ with $\\vee$ and $\\vee$ with $\\wedge$. The dual of the given statement pattern is:<br>$[\\sim q \\vee (p \\wedge \\sim q) \\vee \\sim r] \\wedge p$<br><br>Substituting the truth values into the dual pattern:<br>$\\sim q \\equiv T$<br>$p \\wedge \\sim q \\equiv T \\wedge T \\equiv T$<br>$\\sim r \\equiv F$<br><br>The expression inside the square bracket evaluates to:<br>$T \\vee T \\vee F \\equiv T$<br><br>The entire dual statement pattern evaluates to:<br>$T \\wedge p \\equiv T \\wedge T \\equiv T$<br><br>Therefore, the truth values of the statement pattern and its dual are T and T respectively.<br><br>Answer: T, T", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba0bf9280d7f9932b07", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Number of switches in alternative equivalent simple circuit for the circuit is (are)\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/zAUZ80cUPe-1e38PVDjmzdalaFif6_aLGo79wrFl6OY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "fArxV", "text": "0", "image": null, "isCorrect": false}, {"id": "IQh1K", "text": "1", "image": null, "isCorrect": true}, {"id": "X80WU", "text": "2", "image": null, "isCorrect": false}, {"id": "YPt4V", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p, q, r$ represent the statements that switches $S_1, S_2, S_3$ are closed, respectively. Then $S_1 \\equiv p$, $S_2 \\equiv q$, $S_3 \\equiv r$, $S_2' \\equiv \\sim q$, and $S_3' \\equiv \\sim r$.<br><br>From the given circuit diagram:<br>The top branch has switch $S_1$ in series with a parallel combination of $S_2'$ and $S_3'$. Its logical expression is $p \\land (\\sim q \\lor \\sim r)$.<br>The bottom branch has switches $S_2, S_3$, and $S_1$ in series. Its logical expression is $q \\land r \\land p$.<br><br>Since the top and bottom branches are connected in parallel, the logical expression for the entire circuit is:<br>$L = [p \\land (\\sim q \\lor \\sim r)] \\lor (q \\land r \\land p)$<br><br>Now, we simplify this logical expression:<br>$L = [p \\land (\\sim q \\lor \\sim r)] \\lor [p \\land (q \\land r)]$ (Commutative law)<br>$L = p \\land [(\\sim q \\lor \\sim r) \\lor (q \\land r)]$ (Distributive law)<br><br>Using De Morgan's Law, $\\sim q \\lor \\sim r = \\sim(q \\land r)$:<br>$L = p \\land [\\sim(q \\land r) \\lor (q \\land r)]$<br><br>Using the Complement Law, $\\sim A \\lor A = T$ (where $T$ is a tautology or a closed circuit):<br>$L = p \\land T$<br><br>Using the Identity Law, $p \\land T = p$:<br>$L = p$<br><br>The simplified expression is $p$, which represents a single switch $S_1$.<br>Therefore, the alternative equivalent simple circuit contains only $1$ switch.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9ebf9280d7f9932af0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Consider the statements given by following\n(A) If $4+3=8$, then $5+3=9$\n(B) If $6+4=10$, then moon is flat\n(C) If both (A) and (B) are true, then $5+6=17$\nThen which of the following statement is correct?", "image": null}, "options": [{"id": "OJxmz", "text": "(A) is true while (B) and (C) are false", "image": null, "isCorrect": false}, {"id": "ten5u", "text": "(A) and (B) are false, while (c) is true", "image": null, "isCorrect": false}, {"id": "ia8nZ", "text": "(A) and (C) are true, while (B) is false", "image": null, "isCorrect": true}, {"id": "Y7QfN", "text": "(A) is false, but (B) and (C) are true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us evaluate the truth value of each statement.<br><br>Statement (A): If $4+3=8$, then $5+3=9$.<br>The hypothesis $4+3=8$ is False (F) and the conclusion $5+3=9$ is False (F).<br>For a conditional statement $p \\rightarrow q$, if $p$ is F and $q$ is F, the statement is True (T).<br>Thus, (A) is True.<br><br>Statement (B): If $6+4=10$, then moon is flat.<br>The hypothesis $6+4=10$ is True (T) and the conclusion \"moon is flat\" is False (F).<br>For a conditional statement $p \\rightarrow q$, if $p$ is T and $q$ is F, the statement is False (F).<br>Thus, (B) is False.<br><br>Statement (C): If both (A) and (B) are true, then $5+6=17$.<br>The hypothesis \"both (A) and (B) are true\" is False (F) because (B) is False.<br>The conclusion $5+6=17$ is False (F).<br>Since the hypothesis is F and the conclusion is F, the conditional statement is True (T).<br>Thus, (C) is True.<br><br>Therefore, (A) and (C) are true, while (B) is false.<br><br>Answer: (A) and (C) are true, while (B) is false", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b91bf9280d7f9932a76", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The contrapositive of the statement $\\sim p \\vee(q \\wedge \\sim r)$ is", "image": null}, "options": [{"id": "Ce2DZ", "text": "$\\mathrm{p} \\rightarrow \\mathrm{q} \\wedge \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "0klO1", "text": "$(q \\wedge r) \\rightarrow p$", "image": null, "isCorrect": false}, {"id": "SHsO2", "text": "$\\sim \\mathrm{q} \\vee \\sim \\mathrm{r} \\rightarrow \\mathrm{p}$", "image": null, "isCorrect": false}, {"id": "ND0vl", "text": "$(\\mathrm{r} \\vee \\sim \\mathrm{q}) \\rightarrow \\sim \\mathrm{p}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given statement is $\\sim p \\vee (q \\wedge \\sim r)$.<br><br>Using the logical equivalence $A \\rightarrow B \\equiv \\sim A \\vee B$, the statement can be written as an implication:<br><br>$p \\rightarrow (q \\wedge \\sim r)$<br><br>The contrapositive of an implication $A \\rightarrow B$ is $\\sim B \\rightarrow \\sim A$.<br><br>Therefore, the contrapositive of $p \\rightarrow (q \\wedge \\sim r)$ is:<br><br>$\\sim (q \\wedge \\sim r) \\rightarrow \\sim p$<br><br>Using De Morgan's law, $\\sim (q \\wedge \\sim r) \\equiv \\sim q \\vee \\sim(\\sim r) \\equiv \\sim q \\vee r \\equiv r \\vee \\sim q$.<br><br>Thus, the contrapositive is $(r \\vee \\sim q) \\rightarrow \\sim p$.<br><br>Answer: $(\\mathrm{r} \\vee \\sim \\mathrm{q}) \\rightarrow \\sim \\mathrm{p}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b91bf9280d7f9932a70", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is the negation of the statement \" For all $\\mathrm{M}>0$, there exist $x \\in s$ such that $x \\geqslant \\mathrm{M}$ \"", "image": null}, "options": [{"id": "ifiEA", "text": "$\\exists \\mathrm{M}>0$ such that $x \\geqslant \\mathrm{M}$ for all $x \\in \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "mlhRz", "text": "$\\exists \\mathrm{M}>0, \\exists x \\in \\mathrm{~s}$ such that $x \\geqslant \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "HSQS9", "text": "$\\exists \\mathrm{M}>0$ such that $x < \\mathrm{M}$ for all $x \\in \\mathrm{~s}$", "image": null, "isCorrect": true}, {"id": "80crC", "text": "$\\exists \\mathrm{M}>0$, there exist $x \\in \\mathrm{~s}$ such that $x < \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement can be written in logical notation as:<br><br>$\\forall \\mathrm{M} > 0, \\exists x \\in s$ such that $x \\geqslant \\mathrm{M}$<br><br>To find the negation of a quantified statement, we change the universal quantifier \"for all\" ($\\forall$) to the existential quantifier \"there exists\" ($\\exists$), and vice versa. We also negate the condition.<br><br>The negation of $\\forall \\mathrm{M} > 0$ is $\\exists \\mathrm{M} > 0$.<br><br>The negation of $\\exists x \\in s$ is $\\forall x \\in s$ (or \"for all $x \\in s$\").<br><br>The negation of the condition $x \\geqslant \\mathrm{M}$ is $x < \\mathrm{M}$.<br><br>Combining these, the negation of the entire statement is:<br><br>$\\exists \\mathrm{M} > 0$ such that $x < \\mathrm{M}$ for all $x \\in s$<br><br>Answer: $\\exists \\mathrm{M}>0$ such that $x < \\mathrm{M}$ for all $x \\in \\mathrm{~s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b81bf9280d7f99329df", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If p : switch $\\mathrm{S}_1$ is closed, q : switch $\\mathrm{S}_2$ is closed, r : switch $\\mathrm{S}_3$ closed, then the symbolic form of the following switching circuit is equivalent to Switching Circuit :\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/NLIh2ycMp07N-An8G2BXAT-0LRqRhqBxigJ0uXWDroM.original.fullsize.png\">", "image": null}, "options": [{"id": "umaI5", "text": "$\\mathrm{p} \\wedge(\\mathrm{q} \\vee \\mathrm{r})$", "image": null, "isCorrect": true}, {"id": "UoWVH", "text": "$q \\vee r$", "image": null, "isCorrect": false}, {"id": "ZzTOQ", "text": "p", "image": null, "isCorrect": false}, {"id": "MwNxt", "text": "$(\\sim \\mathrm{q} \\wedge \\sim \\mathrm{r})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $p, q, r$ represent the switches $S_1, S_2, S_3$ respectively.<br><br>The given circuit consists of two main branches connected in parallel.<br><br>The upper branch has switch $S_1$ in series with a parallel combination of $S_2$ and $S_3$. Its symbolic form is $p \\wedge (q \\vee r)$.<br><br>The lower branch has switches $S_3, S_2$, and $S_1$ connected in series. Its symbolic form is $r \\wedge q \\wedge p$, which can be written as $p \\wedge (q \\wedge r)$.<br><br>Since the two branches are in parallel, the total symbolic form of the circuit is the disjunction of the two branches:<br><br>$[p \\wedge (q \\vee r)] \\vee [p \\wedge (q \\wedge r)]$<br><br>Using the distributive law, we can factor out $p$:<br><br>$= p \\wedge [(q \\vee r) \\vee (q \\wedge r)]$<br><br>Since $(q \\wedge r)$ implies $(q \\vee r)$, their disjunction is simply $(q \\vee r)$. Thus, $(q \\vee r) \\vee (q \\wedge r) = q \\vee r$.<br><br>Therefore, the simplified symbolic form is:<br><br>$= p \\wedge (q \\vee r)$<br><br>Answer: $\\mathrm{p} \\wedge(\\mathrm{q} \\vee \\mathrm{r})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7ebf9280d7f99329c5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "p : If 7 is an odd number then 7 is divisible by 2\nq : If 7 is prime number then 7 is an odd number\nIf $V_1$ and $V_2$ are respective truth values of contrapositive of $p$ and $q$ then $\\left(V_1, V_2\\right) \\equiv$", "image": null}, "options": [{"id": "gkTa8", "text": "$(\\mathrm{T}, \\mathrm{T})$", "image": null, "isCorrect": false}, {"id": "VAMf1", "text": "$(\\mathrm{T}, \\mathrm{F})$", "image": null, "isCorrect": false}, {"id": "4AruT", "text": "$(\\mathrm{F}, \\mathrm{T})$", "image": null, "isCorrect": true}, {"id": "0TnO3", "text": "$(F, F)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the statement \"7 is an odd number\" and $s$ be the statement \"7 is divisible by 2\".<br>The truth value of $r$ is T and the truth value of $s$ is F.<br>Statement $p$ is $r \\rightarrow s$, which is $T \\rightarrow F \\equiv F$.<br>Since the contrapositive of a conditional statement is logically equivalent to the original statement, the truth value of the contrapositive of $p$ is $V_1 = F$.<br><br>Let $u$ be the statement \"7 is a prime number\" and $v$ be the statement \"7 is an odd number\".<br>The truth value of $u$ is T and the truth value of $v$ is T.<br>Statement $q$ is $u \\rightarrow v$, which is $T \\rightarrow T \\equiv T$.<br>Similarly, the truth value of the contrapositive of $q$ is $V_2 = T$.<br><br>Therefore, $(V_1, V_2) \\equiv (F, T)$.<br><br>Answer: $(\\mathrm{F}, \\mathrm{T})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b70bf9280d7f993293a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following statements has the truth value T ?\nA: cube roots of unity are in Geometric progression and their sum is 1\nB: $4+7>10$ iff $2+8 < 10$\nC: $\\exists x \\in \\mathbb{N}$ such that $x^2-3 x+2=0$ and $\\exists \\mathrm{n} \\in \\mathbb{N}$ such that n is an odd number\nD : $3+\\mathrm{i}$ is a complex number or $\\sqrt{2}+\\sqrt{3}=\\sqrt{5}$", "image": null}, "options": [{"id": "3atN4", "text": "only A", "image": null, "isCorrect": false}, {"id": "04LAm", "text": "B, C & D", "image": null, "isCorrect": false}, {"id": "RA2El", "text": "both A and C", "image": null, "isCorrect": false}, {"id": "ZgNhr", "text": "both C and D", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let us evaluate the truth value of each statement:<br><br>Statement A: The cube roots of unity are $1, \\omega, \\omega^2$. Their sum is $1 + \\omega + \\omega^2 = 0$. Since the statement claims their sum is $1$, it is False (F).<br><br>Statement B: $4+7 > 10$ is True (T) and $2+8 < 10$ is False (F). The biconditional statement (iff) between a True and a False statement is False. Hence, statement B is False (F).<br><br>Statement C: The equation $x^2-3x+2=0$ gives $x=1$ and $x=2$, both of which are natural numbers. Thus, $\\exists x \\in \\mathbb{N}$ such that $x^2-3x+2=0$ is True (T). Also, there exist odd natural numbers (e.g., $n=1$), so $\\exists n \\in \\mathbb{N}$ such that $n$ is an odd number is True (T). The conjunction (and) of two True statements is True. Hence, statement C is True (T).<br><br>Statement D: $3+\\mathrm{i}$ is a complex number, which is True (T). $\\sqrt{2}+\\sqrt{3}=\\sqrt{5}$ is False (F). The disjunction (or) of a True and a False statement is True. Hence, statement D is True (T).<br><br>Therefore, both statements C and D have the truth value T.<br><br>Answer: both C and D", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6ebf9280d7f993292b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the truth value of the statement pattern $[\\mathrm{p} \\wedge \\sim \\mathrm{r}] \\rightarrow \\sim \\mathrm{r} \\wedge \\mathrm{q}$ is False, then which of the following has truth value False?", "image": null}, "options": [{"id": "fOXXi", "text": "$(p \\vee r) \\rightarrow \\sim r$", "image": null, "isCorrect": false}, {"id": "Q3Np9", "text": "$(r \\vee q) \\rightarrow \\sim p$", "image": null, "isCorrect": false}, {"id": "YaIZS", "text": "$\\sim(p \\vee q) \\rightarrow \\sim r$", "image": null, "isCorrect": false}, {"id": "qAKNW", "text": "$\\sim(r \\vee q) \\rightarrow \\sim p$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The statement pattern $[p \\wedge \\sim r] \\rightarrow (\\sim r \\wedge q)$ is False.<br><br>An implication $A \\rightarrow B$ is False if and only if $A$ is True and $B$ is False.<br><br>Therefore, $p \\wedge \\sim r$ is True and $\\sim r \\wedge q$ is False.<br><br>For $p \\wedge \\sim r$ to be True, both $p$ and $\\sim r$ must be True. This gives $p \\equiv \\text{T}$ and $r \\equiv \\text{F}$.<br><br>Since $\\sim r$ is True, for $\\sim r \\wedge q$ to be False, $q$ must be False. This gives $q \\equiv \\text{F}$.<br><br>Thus, the truth values are $p \\equiv \\text{T}$, $q \\equiv \\text{F}$, and $r \\equiv \\text{F}$.<br><br>Now, checking the given options:<br><br>For $(p \\vee r) \\rightarrow \\sim r$: $(\\text{T} \\vee \\text{F}) \\rightarrow \\text{T} \\equiv \\text{T} \\rightarrow \\text{T} \\equiv \\text{T}$<br><br>For $(r \\vee q) \\rightarrow \\sim p$: $(\\text{F} \\vee \\text{F}) \\rightarrow \\text{F} \\equiv \\text{F} \\rightarrow \\text{F} \\equiv \\text{T}$<br><br>For $\\sim(p \\vee q) \\rightarrow \\sim r$: $\\sim(\\text{T} \\vee \\text{F}) \\rightarrow \\text{T} \\equiv \\text{F} \\rightarrow \\text{T} \\equiv \\text{T}$<br><br>For $\\sim(r \\vee q) \\rightarrow \\sim p$: $\\sim(\\text{F} \\vee \\text{F}) \\rightarrow \\text{F} \\equiv \\text{T} \\rightarrow \\text{F} \\equiv \\text{F}$<br><br>The statement pattern $\\sim(r \\vee q) \\rightarrow \\sim p$ has truth value False.<br><br>Answer: $\\sim(r \\vee q) \\rightarrow \\sim p$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b62bf9280d7f99328b1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The correct simplified circuit diagram for the logical statement $[\\{\\mathrm{q} \\wedge(\\sim \\mathrm{q} \\vee \\mathrm{r})\\} \\wedge\\{\\sim \\mathrm{p} \\vee(\\mathrm{p} \\wedge \\sim \\mathrm{r})\\}] \\vee(\\mathrm{p} \\wedge \\mathrm{r})$ where $\\mathrm{p}, \\mathrm{q}, \\mathrm{r}$ represent switches $\\mathrm{s}_1, \\mathrm{~s}_2, \\mathrm{~s}_3$ respectively.", "image": null}, "options": [{"id": "C0R9M", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/OfjrV4j8wHJscLMacnhOAoS3U7NYTt1nWY-N_H-C6Po.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "YbC0Z", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Ij-ieO0lfEr0yxzHqTiS0GtrK3C0sIaQjRqC6ZcpFqQ.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "7gy0z", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/CS1WyGoSLbb0FoB02NMmiotdVXQ8ycYYsrluk9wkE_U.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "lLlIr", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Ar6X_auE82BGh1UhGupRdoJZcgmT6o_vpfqAxWob7Tw.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given logical statement is:<br>$[\\{q \\wedge (\\sim q \\vee r)\\} \\wedge \\{\\sim p \\vee (p \\wedge \\sim r)\\}] \\vee (p \\wedge r)$<br><br>Let us simplify the expression step by step.<br><br>First, simplify the term $q \\wedge (\\sim q \\vee r)$ using the distributive law:<br>$q \\wedge (\\sim q \\vee r) \\equiv (q \\wedge \\sim q) \\vee (q \\wedge r)$<br>Since $q \\wedge \\sim q \\equiv F$ (False), we get:<br>$F \\vee (q \\wedge r) \\equiv q \\wedge r$<br><br>Next, simplify the term $\\sim p \\vee (p \\wedge \\sim r)$ using the distributive law:<br>$\\sim p \\vee (p \\wedge \\sim r) \\equiv (\\sim p \\vee p) \\wedge (\\sim p \\vee \\sim r)$<br>Since $\\sim p \\vee p \\equiv T$ (True), we get:<br>$T \\wedge (\\sim p \\vee \\sim r) \\equiv \\sim p \\vee \\sim r$<br><br>Now, substitute these simplified terms back into the first square bracket:<br>$[\\{q \\wedge (\\sim q \\vee r)\\} \\wedge \\{\\sim p \\vee (p \\wedge \\sim r)\\}]$<br>$\\equiv (q \\wedge r) \\wedge (\\sim p \\vee \\sim r)$<br>$\\equiv (q \\wedge r \\wedge \\sim p) \\vee (q \\wedge r \\wedge \\sim r)$<br>Since $r \\wedge \\sim r \\equiv F$, the second term becomes $F$:<br>$\\equiv (q \\wedge r \\wedge \\sim p) \\vee F \\equiv \\sim p \\wedge q \\wedge r$<br><br>Now, substitute this into the complete expression:<br>$(\\sim p \\wedge q \\wedge r) \\vee (p \\wedge r)$<br><br>Factor out $r$ using the distributive law:<br>$\\equiv r \\wedge ((\\sim p \\wedge q) \\vee p)$<br>$\\equiv r \\wedge ((\\sim p \\vee p) \\wedge (q \\vee p))$<br>$\\equiv r \\wedge (T \\wedge (p \\vee q))$<br>$\\equiv r \\wedge (p \\vee q)$<br><br>In terms of switching circuits, $p, q, r$ represent switches $S_1, S_2, S_3$ respectively. <br>The logical connective $\\vee$ represents a parallel combination, and $\\wedge$ represents a series combination.<br>Thus, $r \\wedge (p \\vee q)$ corresponds to switch $S_3$ in series with the parallel combination of switches $S_1$ and $S_2$.<br><br>This arrangement is correctly shown in the second circuit diagram.<br><br>Answer: \n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Ij-ieO0lfEr0yxzHqTiS0GtrK3C0sIaQjRqC6ZcpFqQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b61bf9280d7f99328ae", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\{(p \\wedge \\sim q) \\wedge(p \\wedge r)\\} \\rightarrow \\sim p \\vee q$ has truth value false then truth values of the statements p, q, r are respectively", "image": null}, "options": [{"id": "toFog", "text": "$\\mathrm{T}, \\mathrm{T}, \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "zJS6n", "text": "$\\mathrm{F}, \\mathrm{F}, \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "oN3LO", "text": "$\\mathrm{F}, \\mathrm{F}, \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "ChW3H", "text": "$\\mathrm{T}, \\mathrm{F}, \\mathrm{T}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given statement is $\\{(p \\wedge \\sim q) \\wedge(p \\wedge r)\\} \\rightarrow \\sim p \\vee q$.<br><br>An implication $X \\rightarrow Y$ is false if and only if $X$ is true and $Y$ is false.<br><br>Therefore, we have:<br>$(p \\wedge \\sim q) \\wedge (p \\wedge r) \\equiv \\text{T}$<br>$\\sim p \\vee q \\equiv \\text{F}$<br><br>From $\\sim p \\vee q \\equiv \\text{F}$, both $\\sim p$ and $q$ must be false. <br>This gives $p \\equiv \\text{T}$ and $q \\equiv \\text{F}$.<br><br>From $(p \\wedge \\sim q) \\wedge (p \\wedge r) \\equiv \\text{T}$, all components connected by $\\wedge$ must be true.<br>This implies $p \\wedge r \\equiv \\text{T}$.<br><br>Since $p \\equiv \\text{T}$, we must have $r \\equiv \\text{T}$.<br><br>Thus, the truth values of $p, q, r$ are T, F, T respectively.<br><br>Answer: $\\mathrm{T}, \\mathrm{F}, \\mathrm{T}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b50bf9280d7f9932823", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the statement pattern $(p \\wedge q) \\rightarrow(r \\vee \\sim s)$ is false, then the truth values of p, q, r and s are respectively.", "image": null}, "options": [{"id": "JsE0A", "text": "$\\mathrm{T}, \\mathrm{F}, \\mathrm{T}, \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "SP9dA", "text": "$\\mathrm{T}, \\mathrm{T}, \\mathrm{T}, \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "REMH8", "text": "$\\mathrm{T}, \\mathrm{T}, \\mathrm{F}, \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "ICcTn", "text": "$\\mathrm{T}, \\mathrm{T}, \\mathrm{F}, \\mathrm{T}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given statement pattern is $(p \\wedge q) \\rightarrow (r \\vee \\sim s)$.<br><br>It is given that the statement pattern is false.<br><br>A conditional statement $A \\rightarrow B$ is false if and only if $A$ is true and $B$ is false.<br><br>Therefore, $(p \\wedge q)$ is true and $(r \\vee \\sim s)$ is false.<br><br>For $(p \\wedge q)$ to be true, both $p$ and $q$ must be true. Thus, $p \\equiv \\mathrm{T}$ and $q \\equiv \\mathrm{T}$.<br><br>For $(r \\vee \\sim s)$ to be false, both $r$ and $\\sim s$ must be false. Thus, $r \\equiv \\mathrm{F}$ and $\\sim s \\equiv \\mathrm{F}$.<br><br>Since $\\sim s \\equiv \\mathrm{F}$, we get $s \\equiv \\mathrm{T}$.<br><br>The truth values of $p, q, r, s$ are respectively $\\mathrm{T}, \\mathrm{T}, \\mathrm{F}, \\mathrm{T}$.<br><br>Answer: $\\mathrm{T}, \\mathrm{T}, \\mathrm{F}, \\mathrm{T}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b50bf9280d7f993281f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The logical statement $[\\sim(\\sim \\mathrm{p} \\vee \\mathrm{q}) \\vee(\\mathrm{p} \\wedge \\mathrm{r})] \\wedge(\\sim \\mathrm{q} \\wedge \\mathrm{r})$ is equivalent to", "image": null}, "options": [{"id": "1Lzfa", "text": "$(p \\wedge r) \\wedge \\sim q$", "image": null, "isCorrect": true}, {"id": "cbnI2", "text": "$(\\sim \\mathrm{p} \\wedge \\sim \\mathrm{q}) \\wedge \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "2Qki2", "text": "$\\sim \\mathrm{p} \\vee \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "JYOWR", "text": "$(p \\wedge \\sim q) \\vee r$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement is $[\\sim(\\sim p \\vee q) \\vee (p \\wedge r)] \\wedge (\\sim q \\wedge r)$.<br><br>Using De Morgan's law, $\\sim(\\sim p \\vee q) \\equiv p \\wedge \\sim q$.<br><br>The statement becomes $[(p \\wedge \\sim q) \\vee (p \\wedge r)] \\wedge (\\sim q \\wedge r)$.<br><br>Using the distributive law, $(p \\wedge \\sim q) \\vee (p \\wedge r) \\equiv p \\wedge (\\sim q \\vee r)$.<br><br>Substituting this back, we get $p \\wedge (\\sim q \\vee r) \\wedge (\\sim q \\wedge r)$.<br><br>Using the associative law, this is $p \\wedge [(\\sim q \\vee r) \\wedge (\\sim q \\wedge r)]$.<br><br>Using the distributive law on the second part:<br><br>$(\\sim q \\vee r) \\wedge (\\sim q \\wedge r) \\equiv (\\sim q \\wedge (\\sim q \\wedge r)) \\vee (r \\wedge (\\sim q \\wedge r))$<br><br>$\\equiv (\\sim q \\wedge r) \\vee (\\sim q \\wedge r) \\equiv \\sim q \\wedge r$.<br><br>Therefore, the entire statement simplifies to $p \\wedge (\\sim q \\wedge r)$, which can be rearranged as $(p \\wedge r) \\wedge \\sim q$.<br><br>Answer: $(p \\wedge r) \\wedge \\sim q$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b40bf9280d7f9932787", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equivalent statement of \" If three vertices of a triangle are represented by cube roots of unity, then the triangle is an equilateral triangle \" is", "image": null}, "options": [{"id": "ZTA9V", "text": "Three vertices of a triangle are represented by cube roots of unity and the triangle is not an equilaterals triangle.", "image": null, "isCorrect": false}, {"id": "Xp4oR", "text": "If a triangle is an equilateral triangle then the three vertices of a triangle are represented by cube roots of unity.", "image": null, "isCorrect": false}, {"id": "ZCNv0", "text": "If three vertices of triangle are not represented by cube roots of unity then the triangle is not an equilateral triangle.", "image": null, "isCorrect": false}, {"id": "nOlRh", "text": "If a triangle is not an equilateral triangle then the three vertices of the triangle can not be represented by cube roots of unity.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $p$ be the statement \"Three vertices of a triangle are represented by cube roots of unity\".<br><br>Let $q$ be the statement \"The triangle is an equilateral triangle\".<br><br>The given statement is a conditional statement of the form $p \\rightarrow q$.<br><br>The logically equivalent statement of an implication $p \\rightarrow q$ is its contrapositive, which is $\\sim q \\rightarrow \\sim p$.<br><br>Here, $\\sim q$ is \"A triangle is not an equilateral triangle\".<br><br>And $\\sim p$ is \"The three vertices of the triangle can not be represented by cube roots of unity\".<br><br>Therefore, the equivalent statement is \"If a triangle is not an equilateral triangle then the three vertices of the triangle can not be represented by cube roots of unity\".<br><br>Answer: If a triangle is not an equilateral triangle then the three vertices of the triangle can not be represented by cube roots of unity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b40bf9280d7f9932785", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The negation of $(p \\wedge \\sim q) \\rightarrow(p \\vee \\sim q)$ is", "image": null}, "options": [{"id": "2y8tD", "text": "a tautology", "image": null, "isCorrect": false}, {"id": "tksCX", "text": "a contingency", "image": null, "isCorrect": false}, {"id": "gcHWH", "text": "a contradiction", "image": null, "isCorrect": true}, {"id": "8HQZj", "text": "equivalent to $\\mathrm{p} \\wedge \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the given statement be $S \\equiv (p \\wedge \\sim q) \\rightarrow (p \\vee \\sim q)$.<br><br>The negation of $S$ is $\\sim S \\equiv \\sim ((p \\wedge \\sim q) \\rightarrow (p \\vee \\sim q))$.<br><br>Using the logical equivalence $\\sim (X \\rightarrow Y) \\equiv X \\wedge \\sim Y$, we get:<br><br>$\\sim S \\equiv (p \\wedge \\sim q) \\wedge \\sim (p \\vee \\sim q)$<br><br>Using De Morgan's Law, $\\sim (p \\vee \\sim q) \\equiv \\sim p \\wedge q$.<br><br>Substituting this into the expression:<br><br>$\\sim S \\equiv (p \\wedge \\sim q) \\wedge (\\sim p \\wedge q)$<br><br>Using the commutative and associative laws of conjunction:<br><br>$\\sim S \\equiv (p \\wedge \\sim p) \\wedge (q \\wedge \\sim q)$<br><br>Since $p \\wedge \\sim p \\equiv F$ and $q \\wedge \\sim q \\equiv F$, where $F$ denotes a contradiction:<br><br>$\\sim S \\equiv F \\wedge F \\equiv F$<br><br>Thus, the negation of the given statement is a contradiction.<br><br>Answer: a contradiction", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2cbf9280d7f99326df", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The logically equivalent statement of $(\\sim p \\wedge q) \\vee(\\sim p \\wedge \\sim q) \\vee(p \\wedge \\sim q)$ is", "image": null}, "options": [{"id": "SwpCh", "text": "$(\\sim \\mathrm{p}) \\wedge \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "L3QA6", "text": "$(\\sim p) \\vee(\\sim q)$", "image": null, "isCorrect": true}, {"id": "5Ojxk", "text": "$(\\sim p) \\wedge(\\sim q)$", "image": null, "isCorrect": false}, {"id": "3FN9g", "text": "$\\mathrm{p} \\vee \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given logical expression is $(\\sim p \\wedge q) \\vee (\\sim p \\wedge \\sim q) \\vee (p \\wedge \\sim q)$.<br><br>Consider the first two terms: $(\\sim p \\wedge q) \\vee (\\sim p \\wedge \\sim q)$.<br><br>By the distributive law, this is equivalent to $\\sim p \\wedge (q \\vee \\sim q)$.<br><br>Since $q \\vee \\sim q \\equiv T$ (tautology), this becomes $\\sim p \\wedge T \\equiv \\sim p$.<br><br>Substituting this back into the original expression, we get:<br><br>$\\sim p \\vee (p \\wedge \\sim q)$<br><br>Applying the distributive law again, this is equivalent to:<br><br>$(\\sim p \\vee p) \\wedge (\\sim p \\vee \\sim q)$<br><br>Since $\\sim p \\vee p \\equiv T$, this becomes:<br><br>$T \\wedge (\\sim p \\vee \\sim q) \\equiv \\sim p \\vee \\sim q$<br><br>Thus, the logically equivalent statement is $(\\sim p) \\vee (\\sim q)$.<br><br>Answer: $(\\sim p) \\vee(\\sim q)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2cbf9280d7f99326de", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If a statement $q$ has truth value False and $(p \\wedge q) \\leftrightarrow r$ has truth value True then which of the following has truth value true?", "image": null}, "options": [{"id": "G51wQ", "text": "$\\mathrm{p} \\wedge \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "4vX4q", "text": "$\\mathrm{p} \\vee \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "PAdmP", "text": "$\\mathrm{p} \\wedge \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "SFOR9", "text": "$(p \\wedge r) \\rightarrow(p \\vee r)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $q \\equiv F$.<br><br>The truth value of $p \\wedge q$ is $F$ for any truth value of $p$.<br><br>Given $(p \\wedge q) \\leftrightarrow r \\equiv T$.<br><br>Substituting $p \\wedge q \\equiv F$, we get $F \\leftrightarrow r \\equiv T$.<br><br>For a biconditional statement to be true, both components must have the same truth value. This implies $r \\equiv F$.<br><br>Now evaluating the given options:<br><br>For $p \\wedge q$, since $q \\equiv F$, $p \\wedge q \\equiv F$.<br><br>For $p \\vee r$, since $r \\equiv F$, $p \\vee r \\equiv p \\vee F \\equiv p$ (not always true).<br><br>For $p \\wedge r$, since $r \\equiv F$, $p \\wedge r \\equiv p \\wedge F \\equiv F$.<br><br>For $(p \\wedge r) \\rightarrow (p \\vee r)$, since $r \\equiv F$, $p \\wedge r \\equiv F$. The implication becomes $F \\rightarrow (p \\vee F) \\equiv F \\rightarrow p$. An implication with a false antecedent is always true, so $F \\rightarrow p \\equiv T$.<br><br>Therefore, $(p \\wedge r) \\rightarrow (p \\vee r)$ has the truth value True.<br><br>Answer: $(p \\wedge r) \\rightarrow(p \\vee r)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1bbf9280d7f9932653", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following are pairs of equivalent circuits\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Ie_zY2sCT9VD7IvAX9kmo0oRBFi73_gZlconqJYsx64.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "1Shku", "text": "(A) and (B)", "image": null, "isCorrect": false}, {"id": "4WoW8", "text": "(B) and (D)", "image": null, "isCorrect": false}, {"id": "JRcxS", "text": "(C) and (E)", "image": null, "isCorrect": false}, {"id": "timyw", "text": "(A) and (C)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the switches $S_1, S_2, S_3$ be represented by logical statements $p, q, r$ respectively. A series connection corresponds to the logical AND ($\\wedge$) operation, and a parallel connection corresponds to the logical OR ($\\vee$) operation.<br><br>For circuit (A), the upper branch has $S_1$ and $S_2$ in series ($p \\wedge q$) and the lower branch has $S_1$ and $S_3$ in series ($p \\wedge r$). These two branches are connected in parallel, so the logical expression is $(p \\wedge q) \\vee (p \\wedge r)$.<br><br>For circuit (B), the upper branch has $S_1$ ($p$) and the lower branch has $S_2$ and $S_3$ in series ($q \\wedge r$). These are in parallel, so the expression is $p \\vee (q \\wedge r)$.<br><br>For circuit (C), switch $S_1$ ($p$) is in series with the parallel combination of $S_2$ and $S_3$ ($q \\vee r$). The logical expression is $p \\wedge (q \\vee r)$.<br><br>For circuit (D), all three switches are in series, so the expression is $p \\wedge q \\wedge r$.<br><br>For circuit (E), the upper branch has $S_1$ and $S_2$ in series ($p \\wedge q$) and the lower branch has $S_3$ ($r$). These are in parallel, so the expression is $(p \\wedge q) \\vee r$.<br><br>By the distributive law of logic, we know that:<br>$(p \\wedge q) \\vee (p \\wedge r) \\equiv p \\wedge (q \\vee r)$<br><br>This shows that the logical expression for circuit (A) is equivalent to the logical expression for circuit (C). Therefore, circuits (A) and (C) are equivalent.<br><br>Answer: (A) and (C)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b17bf9280d7f9932638", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The last column in the truth table of the statement pattern $[p \\rightarrow(q \\wedge \\sim p)] \\vee[(p \\vee \\sim q) \\wedge p]$ is", "image": null}, "options": [{"id": "LweZF", "text": "TTTF", "image": null, "isCorrect": false}, {"id": "CG8gC", "text": "TFFF", "image": null, "isCorrect": false}, {"id": "mnS5B", "text": "TTTT", "image": null, "isCorrect": true}, {"id": "gQZOg", "text": "FFTT", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given statement pattern is $[p \\rightarrow(q \\wedge \\sim p)] \\vee[(p \\vee \\sim q) \\wedge p]$.<br><br>Consider the first part of the statement pattern: $p \\rightarrow (q \\wedge \\sim p)$.<br>Using the conditional law $A \\rightarrow B \\equiv \\sim A \\vee B$, we get:<br>$p \\rightarrow (q \\wedge \\sim p) \\equiv \\sim p \\vee (q \\wedge \\sim p)$<br>By the distributive law, this becomes:<br>$\\equiv (\\sim p \\vee q) \\wedge (\\sim p \\vee \\sim p)$<br>$\\equiv (\\sim p \\vee q) \\wedge \\sim p$<br>By the absorption law, this simplifies to $\\sim p$.<br><br>Now consider the second part of the statement pattern: $(p \\vee \\sim q) \\wedge p$.<br>By the absorption law, $(p \\vee \\sim q) \\wedge p \\equiv p$.<br><br>Substituting these simplified forms back into the original statement pattern, we get:<br>$[p \\rightarrow(q \\wedge \\sim p)] \\vee[(p \\vee \\sim q) \\wedge p] \\equiv \\sim p \\vee p$<br><br>By the complement law, $\\sim p \\vee p \\equiv T$.<br>Thus, the given statement pattern is a tautology. Since there are two statement letters ($p$ and $q$), the truth table has 4 rows, and every entry in the last column will be $T$.<br><br>Therefore, the last column is TTTT.<br><br>Answer: TTTT", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b09bf9280d7f99325d1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Consider the three statements -\n$\\mathrm{p}: \\forall \\mathrm{n} \\in \\mathbb{N}, 10 \\mathrm{n}-3$ is a prime number, when n is not divisible by 3 .\n$\\mathrm{q}: \\frac{2}{\\sqrt{3}}, \\frac{-2}{\\sqrt{3}}, \\frac{-1}{\\sqrt{3}}$ are the direction cosines of a directed line.\n$\\mathrm{r}: \\sin x$ is an increasing function in the interval $\\left[\\frac{-\\pi}{2}, \\frac{\\pi}{2}\\right]$.\nThen which of the following statement pattern has truth value true?", "image": null}, "options": [{"id": "GE4Gq", "text": "$(p \\wedge q) \\leftrightarrow r$", "image": null, "isCorrect": false}, {"id": "uzXU6", "text": "$(p \\rightarrow q) \\rightarrow \\sim r$", "image": null, "isCorrect": false}, {"id": "4ucXQ", "text": "$(\\sim p \\vee q) \\wedge r$", "image": null, "isCorrect": true}, {"id": "BThN2", "text": "$(\\sim \\mathrm{p} \\wedge \\sim \\mathrm{q}) \\leftrightarrow \\sim \\mathrm{r}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For statement $p$: Let $n = 8$. Here, $n$ is not divisible by $3$. However, $10(8) - 3 = 77$, which is not a prime number. Thus, the truth value of $p$ is $F$.<br><br>For statement $q$: The sum of squares of direction cosines $l, m, n$ of a line must be $1$. Here, $l^2 + m^2 + n^2 = \\left(\\dfrac{2}{\\sqrt{3}}\\right)^2 + \\left(\\dfrac{-2}{\\sqrt{3}}\\right)^2 + \\left(\\dfrac{-1}{\\sqrt{3}}\\right)^2 = \\dfrac{4}{3} + \\dfrac{4}{3} + \\dfrac{1}{3} = 3 \\neq 1$. Thus, the truth value of $q$ is $F$.<br><br>For statement $r$: Let $f(x) = \\sin x$. Then $f'(x) = \\cos x$. For $x \\in \\left[\\dfrac{-\\pi}{2}, \\dfrac{\\pi}{2}\\right]$, $\\cos x \\ge 0$, which means $f(x)$ is an increasing function. Thus, the truth value of $r$ is $T$.<br><br>Evaluating the given statement patterns:<br><br>$(p \\wedge q) \\leftrightarrow r \\equiv (F \\wedge F) \\leftrightarrow T \\equiv F \\leftrightarrow T \\equiv F$<br><br>$(p \\rightarrow q) \\rightarrow \\sim r \\equiv (F \\rightarrow F) \\rightarrow \\sim T \\equiv T \\rightarrow F \\equiv F$<br><br>$(\\sim p \\vee q) \\wedge r \\equiv (\\sim F \\vee F) \\wedge T \\equiv (T \\vee F) \\wedge T \\equiv T \\wedge T \\equiv T$<br><br>$(\\sim p \\wedge \\sim q) \\leftrightarrow \\sim r \\equiv (\\sim F \\wedge \\sim F) \\leftrightarrow \\sim T \\equiv (T \\wedge T) \\leftrightarrow F \\equiv T \\leftrightarrow F \\equiv F$<br><br>The statement pattern $(\\sim p \\vee q) \\wedge r$ has the truth value $T$.<br><br>Answer: $(\\sim p \\vee q) \\wedge r$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b04bf9280d7f99325aa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09
