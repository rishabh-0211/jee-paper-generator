ite then truth values of <math><mi>p</mi><mo>→</mo><mi>q</mi></math> and <math><mi>p</mi><mo>↔</mo><mi>q</mi></math> are ____ and _____ respectively.", "image": null}, "options": [{"id": "HyZHD", "text": "<math > <mrow>  <mi>F</mi><mo>,</mo><mi>F</mi> </mrow></math>", "image": null, "isCorrect": false}, {"id": "v8vaQ", "text": "<math > <mrow>  <mi>T</mi><mo>,</mo><mi>F</mi> </mrow></math>", "image": null, "isCorrect": false}, {"id": "7hjf1", "text": "<math > <mrow>  <mi>F</mi><mo>,</mo><mi>T</mi> </mrow></math>", "image": null, "isCorrect": false}, {"id": "oD4C6", "text": "<math > <mrow>  <mi>T</mi><mo>,</mo><mi>T</mi> </mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "P : Every square is a rectangle <math><mo>→</mo><mi>T</mi></math><br />q : Every rhombus is a kite <math><mo>→</mo><mi>T</mi></math><br /><math><mo>∴</mo><mi>p</mi><mo>→</mo><mi>q</mi><mo>≡</mo><mi>T</mi></math><br /><math><mi>p</mi><mo>↔</mo><mi>q</mi><mo>≡</mo><mi>T</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e960279619d9d8a15a7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The value of $(1+\\Delta)(1-\\nabla)$ is", "image": null}, "options": [{"id": "97nm6", "text": "0", "image": null, "isCorrect": false}, {"id": "Fszh5", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "w6O3x", "text": "1", "image": null, "isCorrect": true}, {"id": "Ton3I", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have, $(1+\\Delta)(1-\\nabla) f(x)$\n$$\n\\begin{array}{l}\n=(1+\\Delta)\\{(1-\\nabla) f(x)\\} \\\\\n=(1+\\Delta)\\{f(x)-\\nabla f(x)\\} \\\\\n=(1+\\Delta)[f(x)-\\{f(x)-f(x-h)\\}] \\\\\n=(1+\\Delta) f(x-h)=E f(x-h) \\\\\n\\quad[\\because(E=1+\\Delta)] \\\\\n=f(x)=1 \\cdot f(x)\n\\end{array}\n$$\nThus, $(1+\\Delta)(1-\\nabla) f(x)=1 \\cdot f(x)$, for any function $f(x)$.\n$$\n\\therefore \\quad(1+\\Delta)(1+\\nabla)=1\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e960279619d9d8a15a6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "For the circuit show below, the Boolean polynomial is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/D0fkh4WOwwH80pDH7EHgeKoOSrlZCC8QJP6MQlIIdBU.original.fullsize.png\">", "image": null}, "options": [{"id": "cOdQm", "text": "$(\\sim p \\vee q) \\vee(p \\vee \\sim q)$", "image": null, "isCorrect": false}, {"id": "tSpEr", "text": "$(\\sim p \\wedge q) \\wedge(p \\wedge q)$", "image": null, "isCorrect": false}, {"id": "A14ju", "text": "$(\\sim p \\wedge \\sim q) \\wedge(q \\wedge p)$", "image": null, "isCorrect": false}, {"id": "zcdZV", "text": "$(\\sim p \\wedge q) \\vee(p \\wedge \\sim q)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Since, $\\sim p$ and $q$ both switch also are in series\n$$\n\\Rightarrow \\quad(\\sim p \\wedge q)\n$$\nand $p$ and $\\sim q$ both switch also are in series\n$$\n\\Rightarrow \\quad(p \\wedge \\sim q)\n$$\nBoth Eqs. (i) and (ii) are parallel switch\n$$\n\\Rightarrow \\quad(\\sim p \\wedge q) \\vee(p \\wedge \\sim q)\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e960279619d9d8a15a5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "In a Boolean Algebra $B$, for all $x$, $y$ in $B$, $x \\wedge(x \\vee y)$ is equal to", "image": null}, "options": [{"id": "jHuZl", "text": "$y$", "image": null, "isCorrect": false}, {"id": "8EV6L", "text": "$x$", "image": null, "isCorrect": true}, {"id": "YZe1C", "text": "1", "image": null, "isCorrect": false}, {"id": "6RJND", "text": "0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$x \\wedge(x \\vee y)$\n$=(x \\wedge x) \\vee(x \\wedge y)$ by distribution law'\n$=x \\vee(x \\wedge y)$ 'by idempotent law'\n$=(x \\vee f)$ 'by contradiction law'\n$=x$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e960279619d9d8a15a4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The inverse of the proposition $(p \\wedge-q) \\Rightarrow r$ is", "image": null}, "options": [{"id": "O3V3S", "text": "$\\sim r \\Rightarrow \\sim p \\vee q$", "image": null, "isCorrect": false}, {"id": "Tp1c5", "text": "$\\sim p \\vee q \\Rightarrow \\sim r$", "image": null, "isCorrect": true}, {"id": "N5F9N", "text": "$r \\Rightarrow p \\wedge \\sim q$", "image": null, "isCorrect": false}, {"id": "0v2Yx", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Inverse of $p \\Rightarrow q$ is $\\sim p \\Rightarrow \\sim q$\n$\\therefore$ Inverse of $(p \\wedge \\sim q) \\Rightarrow \\mathrm{r}$ is\n$$\n\\sim(p \\wedge \\sim q) \\Rightarrow \\sim r\n$$\ni.e., $\\quad(\\sim p \\vee q) \\Rightarrow \\wedge \\sim r$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e960279619d9d8a15a3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The propositions $(p \\Rightarrow \\sim p) \\wedge(\\sim p \\Rightarrow p)$ is a", "image": null}, "options": [{"id": "WuXFj", "text": "tautology and contradiction", "image": null, "isCorrect": false}, {"id": "qgnFJ", "text": "neither tautology nor contradiction", "image": null, "isCorrect": false}, {"id": "pcENc", "text": "contradiction", "image": null, "isCorrect": true}, {"id": "Gv4SK", "text": "tautology", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{c|c|c|c|c}\n\\hlinep & \\sim p & p \\Rightarrow \\sim p & \\sim p \\Rightarrow p & (p \\Rightarrow \\sim p) \\wedge(\\sim p \\Rightarrow p) \\\\\n\\hline \\mathrm{T} & \\mathrm{F} & \\mathrm{F} & \\mathrm{T} & \\mathrm{F} \\\\\n\\mathrm{F} & \\mathrm{T} & \\mathrm{T} & \\mathrm{F} & \\mathrm{F} \\\\\n\\hline\n\\end{array}\nClearly,$(p \\Rightarrow \\sim p) \\wedge(\\sim p \\Rightarrow p)$ is a\ncontradiction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e820279619d9d8a1504", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "$(p \\wedge q) \\vee \\sim p$ is equivalent to", "image": null}, "options": [{"id": "nu6AC", "text": "$\\sim p \\wedge q$", "image": null, "isCorrect": false}, {"id": "6c5rU", "text": "$\\sim p \\vee q$", "image": null, "isCorrect": true}, {"id": "2uz0g", "text": "$p \\wedge q$", "image": null, "isCorrect": false}, {"id": "Du5lb", "text": "$p \\vee q$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$(p \\wedge q) \\vee \\sim p=\\sim p \\vee(p \\wedge q)$\n[By commutative law] $\\begin{array}{lr}=(\\sim p \\vee p) \\wedge(\\sim p \\vee q) & \\text { [By distributive law] } \\\\ =(p \\vee \\sim p) \\wedge(\\sim p \\vee q) & \\text { [By commutative law] }\\end{array}$\n$=t \\wedge(\\sim p \\vee q)$\n[By complement law]\n$=\\sim p \\vee q$\n[By identity law]", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e820279619d9d8a1503", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "If $p, q, r$ are single propositions with truth values $T, F, F, \\quad$ then the truth value of $(p \\wedge \\sim q) \\rightarrow(\\sim p \\vee r)$ is", "image": null}, "options": [{"id": "xu2Wv", "text": "$T$", "image": null, "isCorrect": false}, {"id": "OUN7z", "text": "$\\bar{F}$", "image": null, "isCorrect": true}, {"id": "lIeFb", "text": "Cannot find", "image": null, "isCorrect": false}, {"id": "g1BkF", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{c|c|c|c|c|c|c|c}\n\\hlinep & q & r & \\sim q & \\sim p & p \\wedge \\sim q & \\sim p \\vee r & (p \\wedge \\sim q) \\rightarrow \\\\\n& & & & & & & (\\sim p \\vee r) \\\\\n\\hlineT & F & F & T & F & T & F & F \\\\\n\\hline\n\\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e810279619d9d8a14fc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00  null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4b0279619d9d8a134b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "In the usual notation the value of $\\Delta \\nabla$ is equal to", "image": null}, "options": [{"id": "3zQty", "text": "$\\Delta-\\nabla$", "image": null, "isCorrect": true}, {"id": "T9kRF", "text": "$\\Delta+\\nabla$", "image": null, "isCorrect": false}, {"id": "DajVn", "text": "$\\nabla-\\Delta$", "image": null, "isCorrect": false}, {"id": "LNT3R", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Now, $\\Delta \\nabla f(x)=\\Delta[f(x)-f(x-h)]$\n$\\therefore$\n$$\n\\begin{aligned}\n&=\\Delta f(x)-\\Delta f(x-h) \\\\\n&=\\Delta f(x)-[f(x)-f(x-h)] \\\\\n&=\\Delta f(x)-\\nabla f(x) \\\\\n\\Delta \\nabla &=\\Delta-\\nabla\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4b0279619d9d8a1349", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Which of the following statement has the truth value ' $F^{\\prime}$ ?", "image": null}, "options": [{"id": "DPRqj", "text": "A quadratic equation has always a real root", "image": null, "isCorrect": true}, {"id": "5S7TB", "text": "The number of ways of seating 2 persons in two chairs out of $n$ persons in $P(n, 2)$.", "image": null, "isCorrect": false}, {"id": "O131l", "text": "The cube roots of unity are in GP", "image": null, "isCorrect": false}, {"id": "f2sRX", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The roots of a quadratic equation can be imaginary.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
