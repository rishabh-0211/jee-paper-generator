"options": [{"id": "elkJ3", "text": "$x^2-x+2=0$", "image": null, "isCorrect": false}, {"id": "QRpR2", "text": "$x^2-3 x+2=0$", "image": null, "isCorrect": true}, {"id": "7WjNm", "text": "$x^2+x+2=0$", "image": null, "isCorrect": false}, {"id": "IQg0W", "text": "$x^2+3 x+2=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & m=\\lim _{x \\rightarrow 0} \\frac{x \\log (1+2 x)}{x \\cdot \\tan x}=\\lim _{x \\rightarrow 0} \\frac{\\frac{\\log (1+2 x)}{2 x} \\cdot 2 x}{\\frac{\\tan x}{x} \\cdot x}=2 \\\\ & n=\\lim _{x \\rightarrow 0} \\frac{\\log x+\\log \\left(\\frac{1+x}{x}\\right)}{x}=\\lim _{x \\rightarrow 0} \\frac{\\log \\left(x \\times \\frac{1+x}{x}\\right)}{x} \\\\ & =\\lim _{x \\rightarrow 0} \\frac{\\log (1+x)}{x}=1\\end{aligned}$\nnow, required quadratic equation is\n$x^2-(m+n) x+m n=0$\n$\\Rightarrow x^2-3 x+2=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261100279619d9d8a2987", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "$\\lim _{n \\rightarrow \\infty} n\\left(\\sqrt{n^2+9}-n\\right)=$", "image": null}, "options": [{"id": "mZvjb", "text": "$\\frac{9}{4}$", "image": null, "isCorrect": false}, {"id": "2Dlsj", "text": "$9$", "image": null, "isCorrect": false}, {"id": "rLbbu", "text": "$\\frac{9}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "AUNdm", "text": "$\\frac{9}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\lim _{n \\rightarrow \\infty} n\\left(\\sqrt{n^2+9}-n\\right)$\n$\\lim _{n \\rightarrow \\infty} \\frac{n\\left(n^2+9-n^2\\right)}{\\sqrt{n^2+9}+n}$\n$\\lim _{n \\rightarrow \\infty} \\frac{9}{\\sqrt{1+\\frac{9}{n^2}}+1}=\\frac{9}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260eb0279619d9d8a285a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Let $\\mathrm{f}(\\mathrm{x})=5-|\\mathrm{x}-2|$ and $\\mathrm{g}(\\mathrm{x})=|\\mathrm{x}+1|, \\mathrm{x} \\in \\mathrm{R}$. If $\\mathrm{f}(\\mathrm{x})$ attains maximum value at $\\alpha$ and $g(x)$ attains minimum value at $\\beta$, then $\\lim _{x \\rightarrow-\\alpha \\beta} \\frac{(x-1)\\left(x^2-5 x+6\\right)}{\\left(x^2-6 x+8\\right)}$ is equal to", "image": null}, "options": [{"id": "kb61D", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "7e57c", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "ZH4cg", "text": "$-\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "OWM1a", "text": "$-\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{f}(\\mathrm{x})=5-|\\mathrm{x}-2|$ is maximum at $\\mathrm{x}=2 \\Rightarrow \\alpha=2$\n$\\mathrm{g}(\\mathrm{x})=|\\mathrm{x}+1|$ is minimum at $\\mathrm{x}=-1 \\Rightarrow \\beta=-1$\nNow $\\lim _{x \\rightarrow-\\alpha \\beta} \\frac{(x-1)\\left(x^2-5 x+6\\right)}{\\left(x^2-6 x+8\\right)}=\\lim _{x \\rightarrow-(2)(-1)} \\frac{(x-1)(x-2)(x-3)}{(x-2)(x-4)}$\n$\\begin{aligned} & =\\lim _{x \\rightarrow 2} \\frac{(x-1)(x-3)}{x-4} \\\\ & =\\frac{(2-1)(2-3)}{2-4} \\\\ & =\\frac{1}{2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b40279619d9d8a26a6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow x}\\left[\\frac{\\sqrt{x}-1}{\\log x}\\right]=$", "image": null}, "options": [{"id": "cOjxx", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "aX7u6", "text": "$2$", "image": null, "isCorrect": false}, {"id": "sCk2K", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "M4tWK", "text": "$-\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\lim _{x \\rightarrow x}\\left[\\frac{\\sqrt{x}-1}{\\log x}\\right] \\\\\n& =\\lim _{x \\rightarrow 1} \\frac{\\frac{1}{2 \\sqrt{x}}}{\\left(\\frac{1}{x}\\right)} \\\\\n& =\\frac{1}{2}\n\\end{aligned}\n$$\n... [L' Hospital rule]", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609f0279619d9d8a25fe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow 1} \\frac{a b^x-a^x b}{x^2-1}=$", "image": null}, "options": [{"id": "d9UKG", "text": "$\\frac{-\\mathrm{ab}}{2} \\log \\left(\\frac{\\mathrm{b}}{\\mathrm{a}}\\right)$", "image": null, "isCorrect": false}, {"id": "dnni0", "text": "$\\frac{\\mathrm{ab}}{2} \\log \\left(\\frac{\\mathrm{b}}{\\mathrm{a}}\\right)$", "image": null, "isCorrect": true}, {"id": "zRNae", "text": "$a b \\log \\left(\\frac{b}{a}\\right)$", "image": null, "isCorrect": false}, {"id": "yPVbq", "text": "$-a b \\log \\left(\\frac{b}{a}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\lim _{x \\rightarrow 1} \\frac{a b^x-a^x b}{x^2-1}=L$\n$$\n\\begin{aligned}\n& \\Rightarrow L=\\lim _{x \\rightarrow 1} \\frac{\\left(a b^x \\log b\\right)-\\left(a^x \\log a \\cdot b\\right)}{2 x} \\\\\n& =\\frac{a b \\log b-a b \\log a}{2}=\\frac{a b}{2} \\log \\left(\\frac{b}{a}\\right)\n\\end{aligned}\n$$\n... [L' Hospital rule]", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608d0279619d9d8a256a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 2}(x-1)^{\\frac{1}{3 x-6}}=$", "image": null}, "options": [{"id": "UekRb", "text": "$\\mathrm{e}^2$", "image": null, "isCorrect": false}, {"id": "1x05E", "text": "$\\mathrm{e}^3$", "image": null, "isCorrect": false}, {"id": "xuaFU", "text": "$\\mathrm{e}^{\\frac{1}{3}}$", "image": null, "isCorrect": true}, {"id": "fGaQX", "text": "$\\mathrm{e}^{\\frac{1}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 2}(x-1)^{\\frac{1}{3 x-6}} \\\\ & =\\lim _{x \\rightarrow 2}(x-2+1)^{\\frac{1}{3(x-2)}}=\\lim _{x \\rightarrow 2}\\left\\{[1+(x-2)]^{\\frac{1}{(x-2)}}\\right\\}^{\\frac{1}{3}}=e^{\\frac{1}{3}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260680279619d9d8a243a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "If $\\lim _{\\mathrm{x} \\rightarrow 5} \\frac{\\mathrm{x}^{\\mathrm{k}}-5^{\\mathrm{k}}}{\\mathrm{x}-5}=500$, then the value of $\\mathrm{k}$, where $\\mathrm{k} \\in \\mathrm{N}$ is", "image": null}, "options": [{"id": "mGskI", "text": "5", "image": null, "isCorrect": false}, {"id": "p9pv9", "text": "3", "image": null, "isCorrect": false}, {"id": "pJMAP", "text": "4", "image": null, "isCorrect": true}, {"id": "iaPFU", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 5} \\frac{x^k-5^k}{x-5}=500 \\\\ & \\therefore(k)(5)^{k-1}=500 \\\\ & =4(125)=4(5)^3=4(5)^{4-1} \\\\ & \\therefore k=4\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260520279619d9d8a238d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "$$\n\\lim _{x \\rightarrow 1} \\frac{(2 x-3)(\\sqrt{x}-1)}{2 x^2+x-3}=\n$$", "image": null}, "options": [{"id": "UbiSy", "text": "$\\frac{1}{5}$", "image": null, "isCorrect": false}, {"id": "iEnFX", "text": "$\\frac{1}{10}$", "image": null, "isCorrect": false}, {"id": "YYnRV", "text": "$\\frac{-1}{10}$", "image": null, "isCorrect": true}, {"id": "qNx8e", "text": "$\\frac{-1}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\lim _{x \\rightarrow 1} \\frac{(2 x-3)(\\sqrt{x}-1)}{2 x^2+x-3} \\\\\n& \\lim _{x \\rightarrow 1} \\frac{(2 x-3)(\\sqrt{x}-1)}{(x-1)(2 x+3)}=\\lim _{x \\rightarrow 1} \\frac{(2 x-3)(\\sqrt{x}-1)}{(\\sqrt{x}-1)(\\sqrt{x}+1)(2 x+3)} \\\\\n& \\lim _{x \\rightarrow 1} \\frac{(2 x-3)}{(\\sqrt{x}+1)(2 x+3)}=\\frac{-1}{2(5)}=\\frac{-1}{10}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602e0279619d9d8a2266", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow \\infty}\\left(\\sqrt{x^2+5 x-7}-x\\right)=$", "image": null}, "options": [{"id": "44wYI", "text": "$\\frac{7}{2}$", "image": null, "isCorrect": false}, {"id": "cwhLj", "text": "$5$", "image": null, "isCorrect": false}, {"id": "bj4Ep", "text": "$\\frac{5}{2}$", "image": null, "isCorrect": true}, {"id": "6i5ox", "text": "$6$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\lim _{x \\rightarrow \\infty} \\sqrt{x^2+5-7}-x \\\\\n& =\\lim _{x \\rightarrow \\infty} \\frac{\\left(\\sqrt{x^2+5 x-7}\\right)\\left(\\sqrt{x^2+5 x-7+x}\\right)}{\\left(\\sqrt{x^2+5 x-7+x}\\right)} \\\\\n& =\\lim _{x \\rightarrow \\infty} \\frac{x^2+5 x-7-x^2}{\\left(\\sqrt{x^2+5 x-7+x}\\right)}\n\\end{aligned}\n$$\nDividing numerator and denominator by $\\mathrm{x}$, we get\n$$\n=\\lim _{x \\rightarrow \\infty} \\frac{5-\\frac{7}{x}}{\\left(\\sqrt{1+\\frac{5}{x}-\\frac{7}{x^2}+1}\\right)}=\\frac{5}{\\sqrt{1}+1}=\\frac{5}{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e930279619d9d8a158e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "If $G(x)=-\\sqrt{25-x^{2}}$, then $\\lim _{x \\rightarrow 1} \\frac{G(x)-G(t)}{x-1}$ is", "image": null}, "options": [{"id": "ddRDx", "text": "$\\frac{1}{24}$", "image": null, "isCorrect": false}, {"id": "cG2lD", "text": "$\\frac{1}{5}$", "image": null, "isCorrect": false}, {"id": "UjN4J", "text": "$-\\sqrt{24}$", "image": null, "isCorrect": false}, {"id": "7ZJoA", "text": "None of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow 1} \\frac{G(x)-G(1)}{x-1}=\\lim _{x \\rightarrow 1} G^{\\prime}(x)$\n$$\n\\begin{array}{l}\n=\\lim _{x \\rightarrow 1}-\\frac{1}{2 \\sqrt{25-x^{2}}}(-2 x) \\\\\n=\\frac{1}{\\sqrt{24}}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e820279619d9d8a1506", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The value of $\\lim _{x \\rightarrow \\infty} \\frac{1+2+3 \\ldots+n}{n^{2}}$ is", "image": null}, "options": [{"id": "cxFum", "text": "1", "image": null, "isCorrect": false}, {"id": "GhdE5", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "abdT1", "text": "0", "image": null, "isCorrect": false}, {"id": "RG30X", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim _{n \\rightarrow \\infty} \\frac{1+2+3+\\ldots+n}{n^{2}}=\\lim _{n \\rightarrow \\infty} \\frac{n(n+1)}{2 n^{2}}$\n$=\\lim _{n \\rightarrow \\infty} \\frac{\\left(1+\\frac{1}{n}\\right)}{2}=\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e710279619d9d8a147a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "If $\\lim _{x \\rightarrow 0} \\frac{\\left(e^{k x}-1\\right) \\sin k x}{x^{2}}=4$, then $k$ is equal to", "image": null}, "options": [{"id": "ghbhf", "text": "2", "image": null, "isCorrect": false}, {"id": "okIPR", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "ohqzC", "text": "$\\pm 2$", "image": null, "isCorrect": true}, {"id": "8hfMl", "text": "$\\pm 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 0} \\frac{\\left(e^{k x}-1\\right) \\sin k x}{x^{2}}=4 \\\\ & \\Rightarrow \\quad \\lim _{x \\rightarrow 0}\\left[\\frac{e^{k x} \\sin k x}{x^{2}}-\\frac{\\sin k x}{x^{2}}\\right]=4 \\\\ & \\Rightarrow \\lim _{x \\rightarrow 0}\\left[\\frac{e^{k x} \\cos k x \\cdot k+k e^{k x} \\sin k x}{2 x}-\\frac{k \\cos k x}{2 x}\\right]=4 \\\\ & \\Rightarrow \\lim _{x \\rightarrow 0}\\left[\\frac{k^{2} e^{k x} \\cos k x-k^{2} e^{k x} \\sin k x+k^{2} e^{k x} \\sin k x}{+k^{2} e^{k x} \\cos k x}{2}\\right.\\\\ & \\Rightarrow \\frac{k^{2}-0+0+k^{2}}{2}+0=4 \\\\ & \\Rightarrow \\quad k^{2}=4 \\\\ & \\Rightarrow \\quad k=\\pm 2 \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6e0279619d9d8a145f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Given $f(x)=\\frac{a x+b}{x+1}, \\lim _{x \\rightarrow \\infty} f(x)=1 \\quad$ and\n$\\lim _{x \\rightarrow 0} f(x)=2$, then $f(-2)$ is", "image": null}, "options": [{"id": "tOg1a", "text": "0", "image": null, "isCorrect": true}, {"id": "8aZoi", "text": "1", "image": null, "isCorrect": false}, {"id": "pNHXQ", "text": "$\\overline{2}$", "image": null, "isCorrect": false}, {"id": "SFyS5", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $\\lim _{x \\rightarrow \\infty} f(x)=1$\n$\\Rightarrow \\quad \\lim _{x \\rightarrow \\infty} \\frac{a x+b}{x+1}=1$\n$\\Rightarrow \\quad \\lim _{x \\rightarrow \\infty} \\frac{a+\\frac{b}{x}}{1+\\frac{1}{x}}=1$\n$\\Rightarrow \\quad a=1$\n$\\Rightarrow \\quad \\lim _{x \\rightarrow 0} f(x)=2$\n$\\Rightarrow \\quad \\lim _{x \\rightarrow 0} \\frac{a x+b}{x+1}=2$\n$\\Rightarrow \\quad b=2$\n$\\Rightarrow \\quad \\begin{aligned} \\Rightarrow[\\sin (\\log x)&+\\cos (\\log x)] d x \\\\=& \\int \\frac{d}{d x}\\{x \\sin (\\log x)\\} d x \\\\ &=x \\sin (\\log x)+c \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2633b0279619d9d8a3d4b", "title": "Trigonometric and Inverse Trigonometric limits", "totalQuestions": 25, "questions": [{"_id": "6abb88a515a9fc0fc8c145a8", "type": "singleCorrect", "question": {"text": "The value of $\\lim_{x \\to \\frac{\\pi}{4}} \\left[\\dfrac{4 - (\\cos x + \\sin x)^4}{1 - \\sin 2x}\\right]$ is equal to", "image": null}, "options": [{"id": "RjUL1", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "EAsSt", "label": "B", "text": "$4$", "isCorrect": true, "image": null}, {"id": "Wn5QN", "label": "C", "text": "$6$", "isCorrect": false, "image": null}, {"id": "8yAIV", "label": "D", "text": "$8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\to \\dfrac{\\pi}{4}} \\dfrac{4 - (\\cos x + \\sin x)^4}{1 - \\sin 2x}$<br><br>We know that $(\\cos x + \\sin x)^2 = \\cos^2 x + \\sin^2 x + 2\\sin x \\cos x = 1 + \\sin 2x$<br><br>Therefore, $(\\cos x + \\sin x)^4 = (1 + \\sin 2x)^2$<br><br>Substituting this in the limit, we get:<br><br>$L = \\lim_{x \\to \\dfrac{\\pi}{4}} \\dfrac{4 - (1 + \\sin 2x)^2}{1 - \\sin 2x}$<br><br>Using $a^2 - b^2 = (a - b)(a + b)$, the numerator can be factored as:<br><br>$4 - (1 + \\sin 2x)^2 = (2 - (1 + \\sin 2x))(2 + (1 + \\sin 2x)) = (1 - \\sin 2x)(3 + \\sin 2x)$<br><br>So the limit becomes:<br><br>$L = \\lim_{x \\to \\dfrac{\\pi}{4}} \\dfrac{(1 - \\sin 2x)(3 + \\sin 2x)}{1 - \\sin 2x}$<br><br>Canceling the common factor $(1 - \\sin 2x)$ for $x \\neq \\dfrac{\\pi}{4}$:<br><br>$L = \\lim_{x \\to \\dfrac{\\pi}{4}} (3 + \\sin 2x)$<br><br>Substituting $x = \\dfrac{\\pi}{4}$:<br><br>$L = 3 + \\sin\\left(2 \\times \\dfrac{\\pi}{4}\\right) = 3 + \\sin\\left(\\dfrac{\\pi}{2}\\right)$<br><br>$L = 3 + 1 = 4$<br><br>Answer: $4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884615a9fc0fc8c14224", "type": "singleCorrect", "question": {"text": "$\\lim\\limits_{x \\to \\frac{\\pi}{2}} \\dfrac{[1 - \\tan(\\frac{x}{2})](1 - \\sin x)}{[1 + \\tan(\\frac{x}{2})](\\pi - 2x)^3} =$", "image": null}, "options": [{"id": "bp8eU", "label": "A", "text": "$\\dfrac{1}{32}$", "isCorrect": true, "image": null}, {"id": "Cn745", "label": "B", "text": "$\\dfrac{1}{16}$", "isCorrect": false, "image": null}, {"id": "hBDSD", "label": "C", "text": "$\\dfrac{1}{8}$", "isCorrect": false, "image": null}, {"id": "tOtj4", "label": "D", "text": "$\\dfrac{1}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $L = \\lim\\limits_{x \\to \\dfrac{\\pi}{2}} \\dfrac{1 - \\tan\\left(\\dfrac{x}{2}\\right)}{1 + \\tan\\left(\\dfrac{x}{2}\\right)} \\cdot \\dfrac{1 - \\sin x}{(\\pi - 2x)^3}$<br><br>Using the trigonometric identity \\dfrac{1 - \\tan \\theta}{1 + \\tan \\theta} = \\tan\\left(\\dfrac{\\pi}{4} - \\theta\\right), we can rewrite the expression as:<br><br>$L = \\lim\\limits_{x \\to \\dfrac{\\pi}{2}} \\dfrac{\\tan\\left(\\dfrac{\\pi}{4} - \\dfrac{x}{2}\\right) (1 - \\sin x)}{(\\pi - 2x)^3}$<br><br>Substitute $x = \\dfrac{\\pi}{2} - y$. As $x \\to \\dfrac{\\pi}{2}$, $y \\to 0$.<br><br>The terms in the limit become:<br><br>$\\dfrac{\\pi}{4} - \\dfrac{x}{2} = \\dfrac{\\pi}{4} - \\dfrac{1}{2}\\left(\\dfrac{\\pi}{2} - y\\right) = \\dfrac{y}{2}$<br><br>$1 - \\sin x = 1 - \\sin\\left(\\dfrac{\\pi}{2} - y\\right) = 1 - \\cos y$<br><br>$\\pi - 2x = \\pi - 2\\left(\\dfrac{\\pi}{2} - y\\right) = 2y$<br><br>Substituting these into the limit:<br><br>$L = \\lim\\limits_{y \\to 0} \\dfrac{\\tan\\left(\\dfrac{y}{2}\\right) (1 - \\cos y)}{(2y)^3}$<br><br>Using $1 - \\cos y = 2\\sin^2\\left(\\dfrac{y}{2}\\right)$:<br><br>$L = \\lim\\limits_{y \\to 0} \\dfrac{\\tan\\left(\\dfrac{y}{2}\\right) \\cdot 2\\sin^2\\left(\\dfrac{y}{2}\\right)}{8y^3}$<br><br>$L = \\lim\\limits_{y \\to 0} \\dfrac{1}{4} \\cdot \\dfrac{\\tan\\left(\\dfrac{y}{2}\\right)}{y} \\cdot \\dfrac{\\sin^2\\left(\\dfrac{y}{2}\\right)}{y^2}$<br><br>$L = \\dfrac{1}{4} \\cdot \\lim\\limits_{y \\to 0} \\left( \\dfrac{1}{2} \\dfrac{\\tan\\left(\\dfrac{y}{2}\\right)}{\\dfrac{y}{2}} \\right) \\cdot \\lim\\limits_{y \\to 0} \\left( \\dfrac{1}{2} \\dfrac{\\sin\\left(\\dfrac{y}{2}\\right)}{\\dfrac{y}{2}} \\right)^2$<br><br>Since $\\lim\\limits_{\\theta \\to 0} \\dfrac{\\tan \\theta}{\\theta} = 1$ and $\\lim\\limits_{\\theta \\to 0} \\dfrac{\\sin \\theta}{\\theta} = 1$:<br><br>$L = \\dfrac{1}{4} \\cdot \\dfrac{1}{2} \\cdot \\left(\\dfrac{1}{2}\\right)^2 = \\dfrac{1}{4} \\cdot \\dfrac{1}{2} \\cdot \\dfrac{1}{4} = \\dfrac{1}{32}$<br><br>Answer: $\\dfrac{1}{32}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885615a9fc0fc8c142bb", "type": "singleCorrect", "question": {"text": "Let $f(x)$ be a function continuous at $x = 0$, defined for $x \\neq 0$ as $f(x) = \\dfrac{1 - \\cos(1 - \\cos(6x))}{x^2 \\sin^2(3x)}$. Then the value of $f(0)$ is...", "image": null}, "options": [{"id": "AifSe", "label": "A", "text": "$9$", "isCorrect": false, "image": null}, {"id": "CG54i", "label": "B", "text": "$18$", "isCorrect": true, "image": null}, {"id": "8rsvV", "label": "C", "text": "$36$", "isCorrect": false, "image": null}, {"id": "tcfoW", "label": "D", "text": "$162$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $f(x)$ is continuous at $x = 0$, $f(0) = \\lim_{x \\rightarrow 0} f(x)$.<br><br>$f(x) = \\dfrac{1 - \\cos(1 - \\cos(6x))}{x^2 \\sin^2(3x)}$<br><br>Using the trigonometric identity $1 - \\cos \\theta = 2 \\sin^2\\left(\\dfrac{\\theta}{2}\\right)$, we get $1 - \\cos(6x) = 2 \\sin^2(3x)$.<br><br>Substituting this into the numerator:<br><br>$1 - \\cos(2 \\sin^2(3x)) = 2 \\sin^2(\\sin^2(3x))$<br><br>The function becomes:<br><br>$f(x) = \\dfrac{2 \\sin^2(\\sin^2(3x))}{x^2 \\sin^2(3x)}$<br><br>Multiplying and dividing the expression by $\\sin^2(3x)$:<br><br>$f(x) = 2 \\left( \\dfrac{\\sin(\\sin^2(3x))}{\\sin^2(3x)} \\right)^2 \\times \\dfrac{\\sin^2(3x)}{x^2}$<br><br>Taking the limit as $x \\rightarrow 0$:<br><br>$\\lim_{x \\rightarrow 0} \\dfrac{\\sin(\\sin^2(3x))}{\\sin^2(3x)} = 1$<br><br>$\\lim_{x \\rightarrow 0} \\dfrac{\\sin^2(3x)}{x^2} = \\lim_{x \\rightarrow 0} \\left( \\dfrac{\\sin(3x)}{3x} \\times 3 \\right)^2 = 9$<br><br>Therefore, $f(0) = 2 \\times (1)^2 \\times 9 = 18$.<br><br>Answer: $18$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889515a9fc0fc8c14512", "type": "singleCorrect", "question": {"text": "$\\lim_{x \\to 0} \\dfrac{1 - \\cos(1 - \\cos x)}{x^4} = $", "image": null}, "options": [{"id": "NWpzD", "label": "A", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "s4drK", "label": "B", "text": "$\\dfrac{1}{6}$", "isCorrect": false, "image": null}, {"id": "RnCWt", "label": "C", "text": "$\\dfrac{1}{10}$", "isCorrect": false, "image": null}, {"id": "ROHbD", "label": "D", "text": "$\\dfrac{1}{8}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\lim_{x \\to 0} \\dfrac{1 - \\cos(1 - \\cos x)}{x^4}$<br><br>Multiplying and dividing by $(1 - \\cos x)^2$:<br><br>$= \\lim_{x \\to 0} \\dfrac{1 - \\cos(1 - \\cos x)}{(1 - \\cos x)^2} \\times \\dfrac{(1 - \\cos x)^2}{x^4}$<br><br>$= \\lim_{x \\to 0} \\dfrac{1 - \\cos(1 - \\cos x)}{(1 - \\cos x)^2} \\times \\left( \\dfrac{1 - \\cos x}{x^2} \\right)^2$<br><br>Using the standard limit $\\lim_{\\theta \\to 0} \\dfrac{1 - \\cos \\theta}{\\theta^2} = \\dfrac{1}{2}$, where $\\theta = 1 - \\cos x \\to 0$ as $x \\to 0$:<br><br>$= \\dfrac{1}{2} \\times \\left( \\dfrac{1}{2} \\right)^2$<br><br>$= \\dfrac{1}{2} \\times \\dfrac{1}{4} = \\dfrac{1}{8}$<br><br>Answer: $\\dfrac{1}{8}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883615a9fc0fc8c1418e", "type": "singleCorrect", "question": {"text": "$\\lim_{x\\to 1}\\left[\\dfrac{2^{2x-2}-2^x+1}{\\sin^2(x-1)}\\right]=$", "image": null}, "options": [{"id": "LYloE", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "AAtPX", "label": "B", "text": "$(\\log 2)^2$", "isCorrect": true, "image": null}, {"id": "XLRhi", "label": "C", "text": "$\\log 2$", "isCorrect": false, "image": null}, {"id": "geMe0", "label": "D", "text": "$2\\log 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $x - 1 = t$. As $x \\rightarrow 1$, $t \\rightarrow 0$.<br><br>Substituting $x = t + 1$ in the given limit, we get:<br><br>$\\lim_{t\\to 0} \\dfrac{2^{2(t+1)-2} - 2^{t+1} + 1}{\\sin^2 t}$<br><br>$= \\lim_{t\\to 0} \\dfrac{2^{2t} - 2 \\cdot 2^t + 1}{\\sin^2 t}$<br><br>$= \\lim_{t\\to 0} \\dfrac{(2^t - 1)^2}{\\sin^2 t}$<br><br>Multiplying and dividing by $t^2$:<br><br>$= \\lim_{t\\to 0} \\left( \\dfrac{2^t - 1}{t} \\right)^2 \\left( \\dfrac{t}{\\sin t} \\right)^2$<br><br>Using the standard limits $\\lim_{t\\to 0} \\dfrac{a^t - 1}{t} = \\log a$ and $\\lim_{t\\to 0} \\dfrac{t}{\\sin t} = 1$:<br><br>$= (\\log 2)^2 \\times (1)^2$<br><br>$= (\\log 2)^2$<br><br>Answer: $(\\log 2)^2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3018c30a4553e1bdf24", "type": "singleCorrect", "question": {"text": "The value of $\\lim\\limits_{x \\to 0}\\left(\\dfrac{8}{x^8}\\right)\\left[1 - \\cos\\dfrac{x^2}{2} - \\cos\\dfrac{x^2}{4} + \\cos\\dfrac{x^2}{2}\\cdot\\cos\\dfrac{x^2}{4}\\right]$ is equal to ...", "image": null}, "options": [{"id": "hWiz1", "label": "A", "text": "$\\dfrac{1}{8}$", "isCorrect": false, "image": null}, {"id": "QuKdK", "label": "B", "text": "$\\dfrac{1}{32}$", "isCorrect": true, "image": null}, {"id": "kaBST", "label": "C", "text": "$\\dfrac{1}{16}$", "isCorrect": false, "image": null}, {"id": "coJt6", "label": "D", "text": "$0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given expression inside the limit can be factored as:<br><br>$\\left(1 - \\cos\\dfrac{x^2}{2}\\right)\\left(1 - \\cos\\dfrac{x^2}{4}\\right)$<br><br>The limit becomes:<br><br>$\\lim\\limits_{x \\to 0} \\dfrac{8}{x^8} \\left(1 - \\cos\\dfrac{x^2}{2}\\right)\\left(1 - \\cos\\dfrac{x^2}{4}\\right)$<br><br>Using the standard limit $\\lim\\limits_{\\theta \\to 0} \\dfrac{1 - \\cos \\theta}{\\theta^2} = \\dfrac{1}{2}$, we can rewrite the expression as:<br><br>$\\lim\\limits_{x \\to 0} \\dfrac{8}{x^8} \\left( \\dfrac{1 - \\cos\\dfrac{x^2}{2}}{\\left(\\dfrac{x^2}{2}\\right)^2} \\cdot \\dfrac{x^4}{4} \\right) \\left( \\dfrac{1 - \\cos\\dfrac{x^2}{4}}{\\left(\\dfrac{x^2}{4}\\right)^2} \\cdot \\dfrac{x^4}{16} \\right)$<br><br>Evaluating the standard limits:<br><br>$= \\lim\\limits_{x \\to 0} \\dfrac{8}{x^8} \\left( \\dfrac{1}{2} \\cdot \\dfrac{x^4}{4} \\right) \\left( \\dfrac{1}{2} \\cdot \\dfrac{x^4}{16} \\right)$<br><br>$= \\lim\\limits_{x \\to 0} \\dfrac{8}{x^8} \\left( \\dfrac{x^4}{8} \\right) \\left( \\dfrac{x^4}{32} \\right)$<br><br>$= \\lim\\limits_{x \\to 0} \\dfrac{8}{x^8} \\cdot \\dfrac{x^8}{256}$<br><br>$= \\dfrac{8}{256} = \\dfrac{1}{32}$<br><br>Answer: $\\dfrac{1}{32}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33b8c30a4553e1be196", "type": "singleCorrect", "question": {"text": "$\\displaystyle\\lim_{x \\to 0}\\dfrac{(5^x - 1)^4\\,\\text{cosec}\\,(x\\log 5)}{\\tan(x\\log 5) \\cdot \\log(1 + x^2\\log 25)} = \\ldots\\ldots$", "image": null}, "options": [{"id": "dmpjM", "label": "A", "text": "$5\\log 5$", "isCorrect": false, "image": null}, {"id": "WR1Ry", "label": "B", "text": "$\\log\\sqrt{5}$", "isCorrect": true, "image": null}, {"id": "v6Zgg", "label": "C", "text": "$(\\log 5)^2$", "isCorrect": false, "image": null}, {"id": "gZL30", "label": "D", "text": "$\\dfrac{1}{4}\\log 5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given limit is:<br><br>$\\displaystyle\\lim_{x \\to 0}\\dfrac{(5^x - 1)^4\\,\\text{cosec}\\,(x\\log 5)}{\\tan(x\\log 5) \\cdot \\log(1 + x^2\\log 25)}$<br><br>Rewriting $\\text{cosec}\\,(x\\log 5)$ as $\\dfrac{1}{\\sin(x\\log 5)}$, we get:<br><br>$\\displaystyle\\lim_{x \\to 0}\\dfrac{(5^x - 1)^4}{\\sin(x\\log 5) \\cdot \\tan(x\\log 5) \\cdot \\log(1 + x^2\\log 25)}$<br><br>Dividing the numerator and the denominator by $x^4$:<br><br>$\\displaystyle\\lim_{x \\to 0}\\dfrac{\\left(\\dfrac{5^x - 1}{x}\\right)^4}{\\left(\\dfrac{\\sin(x\\log 5)}{x}\\right) \\cdot \\left(\\dfrac{\\tan(x\\log 5)}{x}\\right) \\cdot \\left(\\dfrac{\\log(1 + x^2\\log 25)}{x^2}\\right)}$<br><br>Using the standard limits $\\displaystyle\\lim_{x \\to 0}\\dfrac{a^x - 1}{x} = \\log a$, $\\displaystyle\\lim_{x \\to 0}\\dfrac{\\sin(kx)}{x} = k$, $\\displaystyle\\lim_{x \\to 0}\\dfrac{\\tan(kx)}{x} = k$, and $\\displaystyle\\lim_{x \\to 0}\\dfrac{\\log(1 + kx)}{x} = k$, we evaluate the limits of the individual terms:<br><br>Numerator limit $= (\\log 5)^4$<br><br>Denominator limit $= (\\log 5) \\cdot (\\log 5) \\cdot (\\log 25)$<br><br>Since $\\log 25 = \\log(5^2) = 2\\log 5$, the denominator limit becomes:<br><br>$(\\log 5) \\cdot (\\log 5) \\cdot (2\\log 5) = 2(\\log 5)^3$<br><br>Substituting these back into the expression:<br><br>$\\text{Limit} = \\dfrac{(\\log 5)^4}{2(\\log 5)^3} = \\dfrac{1}{2}\\log 5$<br><br>Using the property of logarithms $m\\log n = \\log(n^m)$:<br><br>$\\text{Limit} = \\log(5^{1/2}) = \\log\\sqrt{5}$<br><br>Answer: $\\log\\sqrt{5}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214170aee93fa0796dde3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow \\frac{\\pi}{2}} \\frac{\\left(1-\\tan \\left(\\frac{x}{2}\\right)\\right)(1-\\sin x)}{\\left(1+\\tan \\left(\\frac{x}{2}\\right)\\right)(\\pi-2 x)^3}$ is", "image": null}, "options": [{"id": "XUpnd", "text": "0", "image": null, "isCorrect": false}, {"id": "nHv15", "text": "$\\frac{1}{32}$", "image": null, "isCorrect": true}, {"id": "3n9vA", "text": "$\\frac{1}{8}$", "image": null, "isCorrect": false}, {"id": "K3g3f", "text": "$\\frac{1}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $x = \\dfrac{\\pi}{2} - h$. As $x \\rightarrow \\dfrac{\\pi}{2}$, $h \\rightarrow 0$.<br><br>We can simplify the expression using trigonometric identities:<br><br>$\\dfrac{1-\\tan\\left(\\dfrac{x}{2}\\right)}{1+\\tan\\left(\\dfrac{x}{2}\\right)} = \\tan\\left(\\dfrac{\\pi}{4} - \\dfrac{x}{2}\\right)$<br><br>Substituting $x = \\dfrac{\\pi}{2} - h$, we get:<br><br>$\\tan\\left(\\dfrac{\\pi}{4} - \\left(\\dfrac{\\pi}{4} - \\dfrac{h}{2}\\right)\\right) = \\tan\\left(\\dfrac{h}{2}\\right)$<br><br>For the other terms in the limit:<br><br>$1 - \\sin x = 1 - \\sin\\left(\\dfrac{\\pi}{2} - h\\right) = 1 - \\cos h = 2\\sin^2\\left(\\dfrac{h}{2}\\right)$<br><br>$(\\pi - 2x)^3 = (\\pi - (\\pi - 2h))^3 = (2h)^3 = 8h^3$<br><br>Substituting these into the original limit:<br><br>$L = \\lim_{h \\rightarrow 0} \\dfrac{\\tan\\left(\\dfrac{h}{2}\\right) \\cdot 2\\sin^2\\left(\\dfrac{h}{2}\\right)}{8h^3}$<br><br>$L = \\dfrac{1}{4} \\lim_{h \\rightarrow 0} \\left(\\dfrac{\\tan\\left(\\dfrac{h}{2}\\right)}{h}\\right) \\left(\\dfrac{\\sin\\left(\\dfrac{h}{2}\\right)}{h}\\right)^2$<br><br>$L = \\dfrac{1}{4} \\lim_{h \\rightarrow 0} \\left(\\dfrac{\\tan\\left(\\dfrac{h}{2}\\right)}{\\dfrac{h}{2}} \\cdot \\dfrac{1}{2}\\right) \\left(\\dfrac{\\sin\\left(\\dfrac{h}{2}\\right)}{\\dfrac{h}{2}} \\cdot \\dfrac{1}{2}\\right)^2$<br><br>Using the standard limits $\\lim_{\\theta \\rightarrow 0} \\dfrac{\\tan \\theta}{\\theta} = 1$ and $\\lim_{\\theta \\rightarrow 0} \\dfrac{\\sin \\theta}{\\theta} = 1$:<br><br>$L = \\dfrac{1}{4} \\left(1 \\cdot \\dfrac{1}{2}\\right) \\left(1 \\cdot \\dfrac{1}{2}\\right)^2$<br><br>$L = \\dfrac{1}{4} \\cdot \\dfrac{1}{2} \\cdot \\dfrac{1}{4} = \\dfrac{1}{32}$<br><br>Answer: $\\frac{1}{32}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214000aee93fa0796dd31", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{x \\tan 2 x-2 x \\tan x}{(1-\\cos 2 x)^2}$ is", "image": null}, "options": [{"id": "u7pcW", "text": "2", "image": null, "isCorrect": false}, {"id": "bGceb", "text": "-2", "image": null, "isCorrect": false}, {"id": "NJNGO", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "4G0Nr", "text": "$-\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\rightarrow 0} \\dfrac{x \\tan 2x - 2x \\tan x}{(1 - \\cos 2x)^2}$<br><br>Using the trigonometric identity $1 - \\cos 2x = 2 \\sin^2 x$, the denominator becomes:<br><br>$(2 \\sin^2 x)^2 = 4 \\sin^4 x$<br><br>For the numerator, using the formula $\\tan 2x = \\dfrac{2 \\tan x}{1 - \\tan^2 x}$:<br><br>$x \\tan 2x - 2x \\tan x = x \\left( \\dfrac{2 \\tan x}{1 - \\tan^2 x} - 2 \\tan x \\right)$<br><br>$= 2x \\tan x \\left( \\dfrac{1 - (1 - \\tan^2 x)}{1 - \\tan^2 x} \\right)$<br><br>$= \\dfrac{2x \\tan^3 x}{1 - \\tan^2 x}$<br><br>Substituting these back into the limit:<br><br>$L = \\lim_{x \\rightarrow 0} \\dfrac{\\dfrac{2x \\tan^3 x}{1 - \\tan^2 x}}{4 \\sin^4 x}$<br><br>$L = \\lim_{x \\rightarrow 0} \\dfrac{2x \\tan^3 x}{4 \\sin^4 x (1 - \\tan^2 x)}$<br><br>$L = \\lim_{x \\rightarrow 0} \\dfrac{1}{2 (1 - \\tan^2 x)} \\cdot \\left( \\dfrac{x}{\\sin x} \\right) \\cdot \\left( \\dfrac{\\tan x}{\\sin x} \\right)^3$<br><br>Since $\\lim_{x \\rightarrow 0} \\dfrac{x}{\\sin x} = 1$ and $\\lim_{x \\rightarrow 0} \\dfrac{\\tan x}{\\sin x} = \\lim_{x \\rightarrow 0} \\dfrac{1}{\\cos x} = 1$:<br><br>$L = \\dfrac{1}{2(1 - 0)} \\cdot 1 \\cdot 1^3 = \\dfrac{1}{2}$<br><br>Answer: $\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b60aee93fa0796daed", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow \\dfrac{\\pi}{2}} \\dfrac{(1-\\sin x)\\left(8 x^3-\\pi^3\\right) \\cos x}{(\\pi-2 x)^4}$", "image": null}, "options": [{"id": "60SQ9", "text": "$\\dfrac{\\pi^2}{16}$", "image": null, "isCorrect": false}, {"id": "aWptG", "text": "$\\dfrac{3 \\pi^2}{16}$", "image": null, "isCorrect": false}, {"id": "dWtfk", "text": "$\\dfrac{-3 \\pi^2}{16}$", "image": null, "isCorrect": true}, {"id": "uxVdB", "text": "$\\dfrac{-\\pi^2}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $x = \\dfrac{\\pi}{2} - t$. As $x \\rightarrow \\dfrac{\\pi}{2}$, $t \\rightarrow 0$.<br><br>The given limit can be rewritten by substituting $x$:<br><br>$L = \\lim_{t \\rightarrow 0} \\dfrac{(1-\\cos t)\\left(8\\left(\\dfrac{\\pi}{2}-t\\right)^3-\\pi^3\\right)\\sin t}{(2t)^4}$<br><br>Using the identity $a^3 - b^3 = (a-b)(a^2+ab+b^2)$, we can factor $8x^3 - \\pi^3$ as $(2x)^3 - \\pi^3 = (2x-\\pi)(4x^2+2\\pi x+\\pi^2)$.<br><br>Substituting $2x-\\pi = -2t$ and evaluating the limit of the quadratic factor as $x \\rightarrow \\dfrac{\\pi}{2}$:<br><br>$\\lim_{x \\rightarrow \\dfrac{\\pi}{2}} (4x^2+2\\pi x+\\pi^2) = 4\\left(\\dfrac{\\pi^2}{4}\\right) + 2\\pi\\left(\\dfrac{\\pi}{2}\\right) + \\pi^2 = 3\\pi^2$<br><br>Now, substituting these into the limit expression:<br><br>$L = \\lim_{t \\rightarrow 0} \\dfrac{(1-\\cos t)(-2t)(3\\pi^2)\\sin t}{16t^4}$<br><br>$L = \\dfrac{-6\\pi^2}{16} \\lim_{t \\rightarrow 0} \\left(\\dfrac{1-\\cos t}{t^2}\\right) \\left(\\dfrac{\\sin t}{t}\\right)$<br><br>Using the standard limits $\\lim_{t \\rightarrow 0} \\dfrac{1-\\cos t}{t^2} = \\dfrac{1}{2}$ and $\\lim_{t \\rightarrow 0} \\dfrac{\\sin t}{t} = 1$:<br><br>$L = \\dfrac{-3\\pi^2}{8} \\times \\dfrac{1}{2} \\times 1 = \\dfrac{-3\\pi^2}{16}$<br><br>Answer: $\\dfrac{-3 \\pi^2}{16}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137f0aee93fa0796d93b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\dfrac{(1-\\cos 2 x)(3+\\cos x)}{x \\tan 4 x}$ has the value", "image": null}, "options": [{"id": "EwLkd", "text": "2", "image": null, "isCorrect": true}, {"id": "rENLl", "text": "$\\dfrac{1}{2}$", "image": null, "isCorrect": false}, {"id": "bcfuN", "text": "4", "image": null, "isCorrect": false}, {"id": "9TRbo", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given limit is $\\lim _{x \\rightarrow 0} \\dfrac{(1-\\cos 2 x)(3+\\cos x)}{x \\tan 4 x}$<br><br>Using the trigonometric identity $1 - \\cos 2x = 2 \\sin^2 x$, the expression becomes:<br><br>$\\lim _{x \\rightarrow 0} \\dfrac{2 \\sin^2 x (3+\\cos x)}{x \\tan 4 x}$<br><br>Multiplying and dividing by $x$ and $4$, we can rearrange the terms as:<br><br>$\\lim _{x \\rightarrow 0} 2 \\left(\\dfrac{\\sin x}{x}\\right)^2 \\cdot \\dfrac{4x}{\\tan 4 x} \\cdot \\dfrac{1}{4} \\cdot (3+\\cos x)$<br><br>Using the standard limits $\\lim _{x \\rightarrow 0} \\dfrac{\\sin x}{x} = 1$ and $\\lim _{x \\rightarrow 0} \\dfrac{\\tan kx}{kx} = 1$, we get:<br><br>$2 \\times (1)^2 \\times 1 \\times \\dfrac{1}{4} \\times (3+\\cos 0)$<br><br>$= 2 \\times 1 \\times \\dfrac{1}{4} \\times (3+1)$<br><br>$= 2 \\times \\dfrac{1}{4} \\times 4 = 2$<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213450aee93fa0796d77b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\dfrac{\\sin \\left(\\pi \\cos ^2 x\\right)}{x^2}$ is equal to", "image": null}, "options": [{"id": "rNcrs", "text": "1", "image": null, "isCorrect": false}, {"id": "HfGsk", "text": "$-\\pi$", "image": null, "isCorrect": false}, {"id": "bAODa", "text": "$\\pi$", "image": null, "isCorrect": true}, {"id": "3juZy", "text": "$\\dfrac{\\pi}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim_{x \\rightarrow 0} \\dfrac{\\sin (\\pi \\cos^2 x)}{x^2}$<br><br>Using the identity $\\cos^2 x = 1 - \\sin^2 x$, we get:<br><br>$\\sin(\\pi \\cos^2 x) = \\sin(\\pi(1 - \\sin^2 x)) = \\sin(\\pi - \\pi \\sin^2 x)$<br><br>Since $\\sin(\\pi - \\theta) = \\sin \\theta$, this simplifies to:<br><br>$\\sin(\\pi \\cos^2 x) = \\sin(\\pi \\sin^2 x)$<br><br>The limit becomes:<br><br>$\\lim_{x \\rightarrow 0} \\dfrac{\\sin(\\pi \\sin^2 x)}{x^2}$<br><br>Multiplying and dividing the expression by $\\pi \\sin^2 x$:<br><br>$\\lim_{x \\rightarrow 0} \\left( \\dfrac{\\sin(\\pi \\sin^2 x)}{\\pi \\sin^2 x} \\right) \\cdot \\pi \\cdot \\left( \\dfrac{\\sin x}{x} \\right)^2$<br><br>As $x \\rightarrow 0$, $\\pi \\sin^2 x \\rightarrow 0$. Using the standard limit $\\lim_{\\theta \\rightarrow 0} \\dfrac{\\sin \\theta}{\\theta} = 1$:<br><br>$1 \\cdot \\pi \\cdot (1)^2 = \\pi$<br><br>Answer: $\\pi$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262610279619d9d8a340e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "$$\n\\lim _{x \\rightarrow 0} \\frac{\\sqrt{1+x \\sin x}-\\sqrt{\\cos x}}{\\tan ^2 \\frac{x}{2}}=\n$$", "image": null}, "options": [{"id": "zP7Pm", "text": "1", "image": null, "isCorrect": false}, {"id": "qRffa", "text": "2", "image": null, "isCorrect": false}, {"id": "a017V", "text": "3", "image": null, "isCorrect": true}, {"id": "d9E5q", "text": "$-1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 0} \\frac{\\sqrt{1+x \\sin x}-\\sqrt{\\cos x}}{\\tan ^2 \\frac{x}{2}} \\\\ & =\\lim _{x \\rightarrow 0} \\frac{1+x \\sin x-\\cos x}{\\tan ^2 \\frac{x}{2}(\\sqrt{1+x \\sin x}+\\sqrt{\\cos x})}\\end{aligned}$\n$\\begin{aligned} & =\\lim _{x \\rightarrow 0} \\frac{x \\sin x+2 \\sin ^2 \\frac{x}{2}}{\\tan ^2 \\frac{x}{2}(\\sqrt{1+x \\sin x}+\\sqrt{\\cos x})} \\\\ & =\\lim _{x \\rightarrow 0} \\frac{\\frac{\\sin x}{x}+\\frac{2 \\sin ^2 \\frac{x}{2}}{x^2}}{\\frac{\\tan ^2 \\frac{x}{2}}{x^2}(\\sqrt{1+x \\sin x}+\\sqrt{\\cos x})}\\end{aligned}$\n$=\\lim _{x \\rightarrow 0}\\left(\\frac{\\frac{\\sin x}{x}+\\frac{2 \\sin ^2 \\frac{x}{2}}{\\frac{x^2}{4}} \\times \\frac{1}{4}}{\\frac{\\tan ^2 \\frac{x}{2}}{\\frac{x^2}{4}} \\times \\frac{1}{4}(\\sqrt{1+x \\sin x}+\\sqrt{\\cos x})}\\right)$\n$\\begin{aligned} & =\\frac{1+2 \\times 1 \\times \\frac{1}{4}}{1 \\times \\frac{1}{4}(\\sqrt{1+0}+\\sqrt{1})} \\\\ & =3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262390279619d9d8a32cb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{x \\cot 4 x}{\\sin ^2 x \\cdot \\cot ^2(2 x)}$ is equal to", "image": null}, "options": [{"id": "s7g7j", "text": "$0$", "image": null, "isCorrect": false}, {"id": "2H84i", "text": "$1$", "image": null, "isCorrect": true}, {"id": "8BcC4", "text": "$4$", "image": null, "isCorrect": false}, {"id": "M5mDv", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\lim _{x \\rightarrow 0} \\frac{x \\cot 4 x}{\\sin ^2 x \\cot ^2(2 x)} & =\\lim _{x \\rightarrow 0} \\frac{x \\tan ^2 2 x}{\\sin ^2 x \\tan 4 x} \\\\ & =\\lim _{x \\rightarrow 0} \\frac{4\\left(\\frac{\\tan 2 x}{2 x}\\right)^2}{4\\left(\\frac{\\sin x}{x}\\right)^2\\left(\\frac{\\tan 4 x}{4 x}\\right)} \\\\ & =1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622c0279619d9d8a325f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow 4} \\frac{\\cos 7 x^{\\circ}-\\cos 2 x^{\\circ}}{x^2}$ is", "image": null}, "options": [{"id": "57PKP", "text": "$\\frac{-45}{2} \\pi^2$", "image": null, "isCorrect": false}, {"id": "pVcQK", "text": "$\\frac{-45}{2} \\pi$", "image": null, "isCorrect": false}, {"id": "tKBRJ", "text": "$\\frac{-\\pi^2}{1440}$", "image": null, "isCorrect": true}, {"id": "LfuAH", "text": "$\\frac{-\\pi^2}{2880}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 0} \\frac{\\cos 7 x^{\\circ}-\\cos 2 x^{\\circ}}{x^2} \\\\ & =\\lim _{x \\rightarrow 0} \\frac{\\cos \\left(\\frac{7 \\pi}{180}\\right) x-\\cos \\left(\\frac{2 \\pi}{180}\\right) x}{x^2} \\\\ & =\\frac{\\left(\\frac{2 \\pi}{180}\\right)^2-\\left(\\frac{7 \\pi}{180}\\right)^2}{2} \\\\ & \\quad \\ldots\\left[\\because \\lim _{x \\rightarrow 0} \\frac{\\cos m x-\\cos n x}{x^2}=\\frac{n^2-m^2}{2}\\right] \\\\ & =\\frac{-\\pi^2}{1440}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b70279619d9d8a2ec7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow \\frac{\\pi}{2}} \\frac{\\cot x-\\cos x}{(\\pi-2 x)^3}$ equals", "image": null}, "options": [{"id": "S8642", "text": "$\\frac{1}{24}$", "image": null, "isCorrect": false}, {"id": "4pMZz", "text": "$\\frac{1}{16}$", "image": null, "isCorrect": true}, {"id": "AHBdQ", "text": "$\\frac{1}{8}$", "image": null, "isCorrect": false}, {"id": "OHZMC", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\text { Let } \\mathrm{I} & =\\lim _{x \\rightarrow \\frac{\\pi}{2}} \\frac{\\cot x-\\cos x}{(\\pi-2 x)^3} \\\\ & =\\lim _{x \\rightarrow \\frac{\\pi}{2}} \\frac{\\cos x(1-\\sin x)}{\\sin x(\\pi-2 x)^3} \\\\ \\text { Put } x & =\\frac{\\pi}{2}-\\mathrm{h} \\\\ \\therefore \\quad \\pi-2 x & =2 \\mathrm{~h} \\\\ \\text { As } x & \\rightarrow \\frac{\\pi}{2}, \\mathrm{~h} \\rightarrow 0\\end{aligned}$\n$\\begin{aligned} \\therefore \\quad I & =\\lim _{h \\rightarrow 0} \\frac{\\cos \\left(\\frac{\\pi}{2}-h\\right)\\left(1-\\sin \\left(\\frac{\\pi}{2}-h\\right)\\right)}{\\sin \\left(\\frac{\\pi}{2}-h\\right)(2 h)^3} \\\\ & =\\lim _{h \\rightarrow 0} \\frac{\\sin h \\cdot 2 \\sin ^2\\left(\\frac{h}{2}\\right)}{\\cosh \\cdot 8 h^3} \\\\ & =\\frac{2}{8} \\lim _{h \\rightarrow 0} \\frac{\\sin h}{h} \\times \\lim _{h \\rightarrow 0} \\frac{\\sin ^2 \\frac{h}{2}}{\\frac{h^2}{4} \\cdot 4} \\\\ & =\\frac{2}{8}(1) \\times(1) \\times \\frac{1}{4} \\\\ & =\\frac{1}{16}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616c0279619d9d8a2c73", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{\\sin \\left(\\pi \\cos ^2 x\\right)}{x^2}$ is equal to", "image": null}, "options": [{"id": "yQiQd", "text": "$-\\pi$", "image"
