}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30f8c30a4553e1bdfba", "type": "singleCorrect", "question": {"text": "If $\\lim_{x \\to 1} \\dfrac{x^3 + ax^2 + bx + c}{x^2 - 2x + 1} = 2026$ then the value of $a - c$ is...", "image": null}, "options": [{"id": "aj1aX", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "M5fnq", "label": "B", "text": "$1$", "isCorrect": false, "image": null}, {"id": "d1Jno", "label": "C", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "X2NEI", "label": "D", "text": "$-2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x) = x^3 + ax^2 + bx + c$.<br><br>For the limit to exist and be finite, the denominator $(x-1)^2$ must be a factor of the numerator $f(x)$.<br><br>Let $f(x) = (x-1)^2(x-k)$.<br><br>Expanding this, we get $f(x) = (x^2-2x+1)(x-k) = x^3 - (k+2)x^2 + (2k+1)x - k$.<br><br>Comparing the coefficients, we have $a = -(k+2)$ and $c = -k$.<br><br>The limit is given by $\\lim_{x \\to 1} \\dfrac{(x-1)^2(x-k)}{(x-1)^2} = \\lim_{x \\to 1} (x-k) = 1-k$.<br><br>Given that the limit is $2026$, we have $1-k = 2026 \\Rightarrow k = -2025$.<br><br>We need to find the value of $a-c$.<br><br>$a-c = -(k+2) - (-k) = -k - 2 + k = -2$.<br><br>Answer: $-2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bb8c30a4553e1bdc36", "type": "singleCorrect", "question": {"text": "The value of $\\lim_{x \\to 3} \\dfrac{[x] - 3}{x - 3}$, where $[\\cdot]$ denotes the greatest integer function, is.....", "image": null}, "options": [{"id": "eRIu9", "label": "A", "text": "$\\infty$", "isCorrect": false, "image": null}, {"id": "Qbgm0", "label": "B", "text": "$1$", "isCorrect": false, "image": null}, {"id": "1hBVC", "label": "C", "text": "$0$", "isCorrect": false, "image": null}, {"id": "IHmSU", "label": "D", "text": "does not exist", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Evaluate the left-hand limit (LHL) and right-hand limit (RHL) at $x = 3$.<br><br>For LHL, let $x \\to 3^{-}$. Then $[x] = 2$.<br><br>LHL $= \\lim_{x \\to 3^{-}} \\dfrac{[x] - 3}{x - 3} = \\lim_{x \\to 3^{-}} \\dfrac{2 - 3}{x - 3} = \\lim_{x \\to 3^{-}} \\dfrac{-1}{x - 3} = \\infty$<br><br>For RHL, let $x \\to 3^{+}$. Then $[x] = 3$.<br><br>RHL $= \\lim_{x \\to 3^{+}} \\dfrac{[x] - 3}{x - 3} = \\lim_{x \\to 3^{+}} \\dfrac{3 - 3}{x - 3} = \\lim_{x \\to 3^{+}} 0 = 0$<br><br>Since LHL $\\neq$ RHL, the limit does not exist.<br><br>Answer: does not exist", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c02bf9280d7f9932e73", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Define $\\mathrm{f}(x)=\\left\\{\\begin{array}{cl}\\mathrm{b}-\\mathrm{a} x & , \\text { if } x < 2 \\\\ 3 & , \\text { if } x=2 \\\\ \\mathrm{a}+2 \\mathrm{~b} x & , \\text { if } x>2\\end{array}\\right.$ and if $\\lim _{x \\rightarrow 2} \\mathrm{f}(x)$ exists, then $\\frac{\\mathrm{a}}{\\mathrm{b}}=$", "image": null}, "options": [{"id": "BvATy", "text": "1", "image": null, "isCorrect": false}, {"id": "TFuD0", "text": "-1", "image": null, "isCorrect": true}, {"id": "9hCgr", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "m7Za7", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $\\lim_{x \\rightarrow 2} \\mathrm{f}(x)$ to exist, the left-hand limit (LHL) and right-hand limit (RHL) at $x = 2$ must be equal.<br><br>$\\text{LHL} = \\lim_{x \\rightarrow 2^-} \\mathrm{f}(x) = \\lim_{x \\rightarrow 2^-} (\\mathrm{b} - \\mathrm{a}x) = \\mathrm{b} - 2\\mathrm{a}$<br><br>$\\text{RHL} = \\lim_{x \\rightarrow 2^+} \\mathrm{f}(x) = \\lim_{x \\rightarrow 2^+} (\\mathrm{a} + 2\\mathrm{b}x) = \\mathrm{a} + 4\\mathrm{b}$<br><br>Equating LHL and RHL:<br><br>$\\mathrm{b} - 2\\mathrm{a} = \\mathrm{a} + 4\\mathrm{b}$<br><br>$-3\\mathrm{a} = 3\\mathrm{b}$<br><br>$\\mathrm{a} = -\\mathrm{b}$<br><br>$\\dfrac{\\mathrm{a}}{\\mathrm{b}} = -1$<br><br>Answer: -1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd2bf9280d7f9932cb9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the function $\\mathrm{f}(x)=\\left\\{\\begin{array}{cl}\\frac{\\cos a x-\\cos b x}{\\cos c x-\\cos b x} & , \\text { if } x \\neq 0 \\\\ -1 & , \\text { if } x=0\\end{array}\\right.$ is continuous at $x=0$, then $a^2, b^2, c^2$ are in", "image": null}, "options": [{"id": "CdDuQ", "text": "Geometric progression", "image": null, "isCorrect": false}, {"id": "qI4Kk", "text": "Arithmetic progression", "image": null, "isCorrect": true}, {"id": "3Ck1Z", "text": "Harmonic progression", "image": null, "isCorrect": false}, {"id": "iqFzy", "text": "Arithmetico-Geometric progression", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the function to be continuous at $x=0$, we must have $\\lim_{x \\to 0} \\mathrm{f}(x) = \\mathrm{f}(0)$.<br><br>$\\lim_{x \\to 0} \\dfrac{\\cos ax - \\cos bx}{\\cos cx - \\cos bx} = -1$<br><br>Dividing the numerator and the denominator by $x^2$, we get:<br><br>$\\lim_{x \\to 0} \\dfrac{\\dfrac{1 - \\cos bx}{x^2} - \\dfrac{1 - \\cos ax}{x^2}}{\\dfrac{1 - \\cos bx}{x^2} - \\dfrac{1 - \\cos cx}{x^2}} = -1$<br><br>Using the standard limit $\\lim_{x \\to 0} \\dfrac{1 - \\cos kx}{x^2} = \\dfrac{k^2}{2}$, we can evaluate the limit as:<br><br>$\\dfrac{\\dfrac{b^2}{2} - \\dfrac{a^2}{2}}{\\dfrac{b^2}{2} - \\dfrac{c^2}{2}} = -1$<br><br>$\\dfrac{b^2 - a^2}{b^2 - c^2} = -1$<br><br>$b^2 - a^2 = -b^2 + c^2$<br><br>$2b^2 = a^2 + c^2$<br><br>This is the condition for an Arithmetic Progression. Therefore, $a^2, b^2, c^2$ are in Arithmetic Progression.<br><br>Answer: Arithmetic progression", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b81bf9280d7f99329e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\quad \\mathbf{f}(x)=\\left\\{\\begin{array}{cl}\\frac{1-\\cos 4 x}{x^2} & \\text { if } x < 0 \\\\ a & \\text { if } x=0 \\\\ \\frac{\\sqrt{x}}{(16+\\sqrt{x})^{\\frac{1}{2}}-4} & \\text { if } x>0\\end{array}\\right.$ is continuous at $x=0$ Then $a=$", "image": null}, "options": [{"id": "5fu13", "text": "$4$", "image": null, "isCorrect": false}, {"id": "2OqPV", "text": "$8$", "image": null, "isCorrect": true}, {"id": "5ETfU", "text": "$-4$", "image": null, "isCorrect": false}, {"id": "9X5q9", "text": "$-8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the function to be continuous at $x=0$, the left-hand limit (LHL), right-hand limit (RHL), and the value of the function at $x=0$ must be equal.<br><br>Evaluating the left-hand limit (LHL) at $x=0$:<br>$\\lim_{x \\to 0^-} f(x) = \\lim_{x \\to 0^-} \\dfrac{1 - \\cos 4x}{x^2}$<br><br>Using the trigonometric identity $1 - \\cos \\theta = 2 \\sin^2 \\left(\\dfrac{\\theta}{2}\\right)$:<br>$\\lim_{x \\to 0^-} \\dfrac{2 \\sin^2 2x}{x^2} = 2 \\lim_{x \\to 0^-} \\left( \\dfrac{\\sin 2x}{x} \\right)^2$<br><br>Multiplying and dividing by $4$ inside the limit:<br>$2 \\lim_{x \\to 0^-} \\left( \\dfrac{\\sin 2x}{2x} \\times 2 \\right)^2 = 2 \\times (1 \\times 2)^2 = 2 \\times 4 = 8$<br><br>Evaluating the right-hand limit (RHL) at $x=0$:<br>$\\lim_{x \\to 0^+} f(x) = \\lim_{x \\to 0^+} \\dfrac{\\sqrt{x}}{\\sqrt{16 + \\sqrt{x}} - 4}$<br><br>Rationalizing the denominator by multiplying the numerator and denominator by $\\sqrt{16 + \\sqrt{x}} + 4$:<br>$\\lim_{x \\to 0^+} \\dfrac{\\sqrt{x} (\\sqrt{16 + \\sqrt{x}} + 4)}{(\\sqrt{16 + \\sqrt{x}})^2 - 4^2}$<br><br>$\\Rightarrow \\lim_{x \\to 0^+} \\dfrac{\\sqrt{x} (\\sqrt{16 + \\sqrt{x}} + 4)}{16 + \\sqrt{x} - 16}$<br><br>$\\Rightarrow \\lim_{x \\to 0^+} \\dfrac{\\sqrt{x} (\\sqrt{16 + \\sqrt{x}} + 4)}{\\sqrt{x}}$<br><br>Canceling $\\sqrt{x}$ and substituting $x = 0$:<br>$\\lim_{x \\to 0^+} (\\sqrt{16 + \\sqrt{x}} + 4) = \\sqrt{16 + 0} + 4 = 4 + 4 = 8$<br><br>Since the function is continuous at $x=0$, we have:<br>$f(0) = \\lim_{x \\to 0} f(x)$<br><br>$a = 8$<br><br>Answer: $8$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b50bf9280d7f9932824", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)= \\begin{cases}\\frac{8^x-4^x-2^x+1}{x^2}, & \\text { if } x>0 \\\\ \\mathrm{e}^x \\sin x+x+\\lambda \\log 4, & \\text { if } x \\leqslant 0\\end{cases}$ is continuous at $x=0$ then the value of $1000 \\mathrm{e}^\\lambda=$", "image": null}, "options": [{"id": "x518X", "text": "$1000$", "image": null, "isCorrect": false}, {"id": "39bMG", "text": "$3000$", "image": null, "isCorrect": false}, {"id": "NvihL", "text": "$2000$", "image": null, "isCorrect": true}, {"id": "eLte1", "text": "$4000$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the function to be continuous at $x=0$, the right-hand limit (RHL) must equal the left-hand limit (LHL) at $x=0$.<br><br>First, evaluating the right-hand limit:<br>$\\lim_{x \\to 0^+} f(x) = \\lim_{x \\to 0^+} \\dfrac{8^x - 4^x - 2^x + 1}{x^2}$<br><br>Factorizing the numerator:<br>$8^x - 4^x - 2^x + 1 = 4^x(2^x - 1) - 1(2^x - 1) = (4^x - 1)(2^x - 1)$<br><br>So, the limit becomes:<br>$\\lim_{x \\to 0^+} \\left( \\dfrac{4^x - 1}{x} \\right) \\left( \\dfrac{2^x - 1}{x} \\right)$<br><br>Using the standard limit $\\lim_{x \\to 0} \\dfrac{a^x - 1}{x} = \\log a$, we get:<br>$\\lim_{x \\to 0^+} f(x) = (\\log 4)(\\log 2)$<br><br>Now, evaluating the left-hand limit:<br>$\\lim_{x \\to 0^-} f(x) = \\lim_{x \\to 0^-} (\\mathrm{e}^x \\sin x + x + \\lambda \\log 4)$<br><br>Substituting $x = 0$:<br>$\\lim_{x \\to 0^-} f(x) = \\mathrm{e}^0 \\sin 0 + 0 + \\lambda \\log 4 = \\lambda \\log 4$<br><br>Equating the LHL and RHL for continuity:<br>$\\lambda \\log 4 = (\\log 4)(\\log 2)$<br><br>$\\lambda = \\log 2$<br><br>We need to find the value of $1000 \\mathrm{e}^\\lambda$:<br>$1000 \\mathrm{e}^\\lambda = 1000 \\mathrm{e}^{\\log 2} = 1000 \\times 2 = 2000$<br><br>Answer: $2000$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1bbf9280d7f9932658", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{|x|}{|x|+x^2}=$", "image": null}, "options": [{"id": "2Rkoy", "text": "$0$", "image": null, "isCorrect": false}, {"id": "KxbWH", "text": "$1$", "image": null, "isCorrect": true}, {"id": "jO5fu", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "c9Sjl", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given limit is $\\lim_{x \\rightarrow 0} \\dfrac{|x|}{|x|+x^2}$<br><br>Since $x^2 = |x|^2$, the expression can be written as $\\dfrac{|x|}{|x|+|x|^2}$<br><br>For $x \\neq 0$, we can divide the numerator and denominator by $|x|$:<br><br>$\\dfrac{|x|}{|x|(1+|x|)} = \\dfrac{1}{1+|x|}$<br><br>Taking the limit as $x \\rightarrow 0$:<br><br>$\\lim_{x \\rightarrow 0} \\dfrac{1}{1+|x|} = \\dfrac{1}{1+0} = 1$<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136a0aee93fa0796d89c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "For each $x \\in \\mathbb{R}$, Let $[x]$ represent greatest integer function, then $\\lim _{x \\rightarrow 0^{-}} \\dfrac{x([x]+|x|) \\sin [x]}{|x|}$ is equal to", "image": null}, "options": [{"id": "4WT1a", "text": "0", "image": null, "isCorrect": false}, {"id": "agQpI", "text": "1", "image": null, "isCorrect": false}, {"id": "6WKdM", "text": "$\\sin 1$", "image": null, "isCorrect": false}, {"id": "DflOY", "text": "$-\\sin 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For $x \\rightarrow 0^{-}$, $-1 < x < 0$.<br><br>In this interval, $[x] = -1$ and $|x| = -x$.<br><br>Substituting these values into the given limit:<br><br>$\\lim _{x \\rightarrow 0^{-}} \\dfrac{x(-1 - x) \\sin(-1)}{-x}$<br><br>Using $\\sin(-1) = -\\sin 1$, the expression becomes:<br><br>$\\lim _{x \\rightarrow 0^{-}} \\dfrac{x(1 + x) \\sin 1}{-x}$<br><br>Canceling $x$ from the numerator and denominator:<br><br>$\\lim _{x \\rightarrow 0^{-}} -(1 + x) \\sin 1$<br><br>Evaluating the limit as $x \\rightarrow 0^{-}$:<br><br>$-(1 + 0) \\sin 1 = -\\sin 1$<br><br>Answer: $-\\sin 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262510279619d9d8a3389", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "If $\\mathrm{f}(x)=3 x^{10}-7 x^8+5 x^6-21 x^3+3 x^2-7$, then $\\lim _{\\alpha \\rightarrow 0} \\frac{f(1-\\alpha)-f(1)}{\\alpha^3+3 \\alpha}=$", "image": null}, "options": [{"id": "5sKh1", "text": "$\\frac{53}{3}$", "image": null, "isCorrect": true}, {"id": "tH7tJ", "text": "$\\frac{-53}{3}$", "image": null, "isCorrect": false}, {"id": "E1hOB", "text": "$\\frac{52}{3}$", "image": null, "isCorrect": false}, {"id": "0LtF0", "text": "$\\frac{-52}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{f}(x)=3 x^{10}-7 x^8+5 x^6-21 x^3+3 x^2-7 \\\\\n\\therefore \\quad & \\mathrm{f}^{\\prime}(x)=30 x^9-56 x^7+30 x^5-63 x^2+6 x \\\\\n& \\Rightarrow \\mathrm{f}^{\\prime}(1)=30-56+30-63+6=-53\n\\end{aligned}\n$$\nNow, $\\lim _{\\alpha \\rightarrow 0} \\frac{f(1-\\alpha)-f(1)}{\\alpha^3+3 \\alpha}$\n$$\n\\begin{aligned}\n& =-\\lim _{\\alpha \\rightarrow 0} \\frac{f(1-\\alpha)-f(1)}{(1-\\alpha)-1} \\times \\frac{1}{\\alpha^2+3} \\\\\n& =-f^{\\prime}(1) \\times \\frac{1}{3}=\\frac{53}{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262010279619d9d8a310c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "The left-hand derivative of $\\mathrm{f}(x)=[x] \\sin (\\pi x)$, at $x=\\mathrm{k}, \\mathrm{k}$ is an integer and $[\\cdot]$ is the greatest integer function, is", "image": null}, "options": [{"id": "GLjDO", "text": "$(-1)^{\\mathrm{k}}(\\mathrm{k}-1) \\pi$", "image": null, "isCorrect": true}, {"id": "7WYyM", "text": "$(-1)^{\\mathrm{k}-1}(\\mathrm{k}-1) \\pi$", "image": null, "isCorrect": false}, {"id": "A17HJ", "text": "$(-1)^{\\mathrm{k}} \\mathrm{k} \\pi$", "image": null, "isCorrect": false}, {"id": "7ifSC", "text": "$(-1)^{\\mathrm{k}-1} \\mathrm{k} \\pi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} f(x)= & {[x] \\sin (\\pi x) } \\\\ \\text { LHD } & =\\lim _{h \\rightarrow 0} \\frac{f(k-h)-f(k)}{-h} \\\\ & =\\lim _{h \\rightarrow 0} \\frac{[k-h] \\sin \\pi(k-h)-[k] \\sin k \\pi}{-h} \\\\ & =\\lim _{h \\rightarrow 0} \\frac{(k-1) \\sin (k \\pi-\\pi h)-k \\sin k \\pi}{-h} \\\\ & =\\lim _{h \\rightarrow 0} \\frac{(-1)^{k+1}(k-1) \\sinh \\pi-0}{-h} \\quad \\ldots[\\because k \\in I] \\\\ & =(-1)^k(k-1) \\pi\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261cc0279619d9d8a2f69", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 3} \\frac{(1-\\cos 2 x) \\cdot \\sin 5 x}{x^2 \\sin 3 x}$ is", "image": null}, "options": [{"id": "2p2DL", "text": "$\\frac{10}{3}$", "image": null, "isCorrect": true}, {"id": "4uKK3", "text": "$\\frac{5}{3}$", "image": null, "isCorrect": false}, {"id": "iKuwy", "text": "$\\frac{5}{6}$", "image": null, "isCorrect": false}, {"id": "MYtrz", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 0} \\frac{(1-\\cos 2 x) \\sin 5 x}{x^2 \\sin 3 x} \\\\ & \\lim _{x \\rightarrow 0} \\frac{(1-\\cos 2 x) \\sin 5 x \\cdot x}{x^3 \\cdot \\sin 3 x} \\\\ & \\lim _{x \\rightarrow 0} \\frac{2 \\sin ^2 x}{x^2} \\cdot \\frac{\\sin 5 x}{x} \\cdot \\frac{x}{\\sin 3 x} \\\\ & =2\\left(\\lim _{x \\rightarrow 0} \\frac{\\sin x}{x}\\right)^2 \\cdot 5\\left(\\lim _{x \\rightarrow 0} \\frac{\\sin 5 x}{5 x}\\right) \\cdot \\frac{1}{3}\\left(\\frac{1}{\\lim _{x \\rightarrow 0} \\frac{\\sin 3 x}{3 x}}\\right) \\\\ & =2 \\times 1 \\times 5 \\times 1 \\times \\frac{1}{3} \\times 1=\\frac{10}{3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261930279619d9d8a2dae", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "If $f(x)=[x]-\\left[\\frac{x}{4}\\right], x \\in R$\nWhere $[x]$ denotes the greatest integer less than or equal to $x$, then", "image": null}, "options": [{"id": "FqxJg", "text": "$\\lim _{x \\rightarrow 4^{-}} f(x)$ exists, but $\\lim _{x \\rightarrow 4^{+}} f(x)$ does not exist.", "image": null, "isCorrect": false}, {"id": "lCrQd", "text": "$f(x)$ is continuous at $x=4$.", "image": null, "isCorrect": true}, {"id": "78JbD", "text": "$\\lim _{x \\rightarrow 4^{+}} f(x)$ exists, but $\\lim _{x \\rightarrow 4^{-}} f(x)$ does not exist.", "image": null, "isCorrect": false}, {"id": "9zewp", "text": "Both $\\lim _{x \\rightarrow 4^{-}} f(x)$ and $\\lim _{x \\rightarrow 4^{+}} f(x)$ exist, but are not equal.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 4^{-}} f(x)=\\left[4^{-}\\right]-\\left[\\frac{4^{-}}{4}\\right]=3-0=3 \\text { and } \\\\ & \\lim _{x \\rightarrow 4^{+}} f(x)=\\left[4^{+}\\right]-\\left[\\frac{4^{+}}{4}\\right]=4-1=3 \\\\ & f(4)=[4]-\\left[\\frac{4}{4}\\right]=4-1=3 \\\\ & \\because \\lim _{x \\rightarrow 4^{-}} f(x)=\\lim _{x \\rightarrow 4^{+}} f(x)=f(4) \\\\ & \\Rightarrow f(x) ; \\text { continuous at } x=4\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2618e0279619d9d8a2d82", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Mrs. Rajni deposited Rs. 10,0000 in a bank that pays $4 \\%$ interest compounded continuously then the amount she gets after 10 years is Rs. approximately.\n(given $e^{(0.4)}=1.49182$ )", "image": null}, "options": [{"id": "lhDIl", "text": "$15150$", "image": null, "isCorrect": false}, {"id": "NgWt6", "text": "$16000$", "image": null, "isCorrect": false}, {"id": "ze22h", "text": "$14918$", "image": null, "isCorrect": true}, {"id": "pDxiR", "text": "$13000$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\because A=P\\left(1+\\frac{R}{100}\\right) \\\\ & \\Rightarrow A=10000\\left(1+\\frac{4}{100}\\right)^{10}=10000 \\times e^{\\frac{4}{100} \\times 10} \\\\ & \\Rightarrow A=10000 \\times e^{0.4}=14918 \\quad\\left[\\because \\lim _{x \\rightarrow 0}(1+x)^{\\frac{1}{x}}=e\\right]\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261440279619d9d8a2b2a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{2 x}{|x|+x^2}=$", "image": null}, "options": [{"id": "0uOoE", "text": "Limit exists", "image": null, "isCorrect": false}, {"id": "wY0ao", "text": "Limit does not exists", "image": null, "isCorrect": true}, {"id": "TAodE", "text": "$2$", "image": null, "isCorrect": false}, {"id": "YAe6N", "text": "$-2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow 0} \\frac{2 x}{|x|+x^2}$\nL.H.L $\\lim _{x \\rightarrow 0^{-}} \\frac{2 x}{-x+x^2}=\\lim _{x \\rightarrow 0^{-}} \\frac{2}{-1+x}=-\\infty$\nR.H.L $\\lim _{x \\rightarrow 0^{+}} \\frac{2 x}{x+x^2}=\\lim _{x \\rightarrow 0^{+}} \\frac{2}{1+x}=\\infty$\n$\\because$ L.H.L $\\neq$ R.H.L $\\Rightarrow$ limit does not exist", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261230279619d9d8a2a19", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "If $\\lim _{x \\rightarrow 1} \\frac{x^2-a x+b}{(x-1)}=5$, then $(a+b)$ is equal to", "image": null}, "options": [{"id": "PtIqV", "text": "$-3$", "image": null, "isCorrect": false}, {"id": "MHvb4", "text": "$-4$", "image": null, "isCorrect": false}, {"id": "hwT7P", "text": "$7$", "image": null, "isCorrect": false}, {"id": "7TZYK", "text": "$-7$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/sCr7eNemBVHhIbn8bvG_ejsXqExDhRTsk57uq9DZsT4.original.fullsize.png\">\nApplying $\\Rightarrow a=-3$ Hospital's rule\n$\\begin{aligned} & \\Rightarrow 2 \\times 1-a=5 \\\\ & \\Rightarrow a=-3\\end{aligned}$\nfrom (1) $b=-4$\n$\\Rightarrow a+b=-7$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2633c0279619d9d8a3d4d", "title": "Algebraic and Rational Limits", "totalQuestions": 54, "questions": [{"_id": "6abb88d615a9fc0fc8c1476a", "type": "singleCorrect", "question": {"text": "If $f(9) = 36$, $u(9) = 9$, $f'(9) = 12$, $u'(9) = 4$, then $\\displaystyle\\lim_{x\\to 9} \\dfrac{\\sqrt{f(x)} - 2\\sqrt{u(x)}}{\\sqrt{x} - 3} = \\ldots$", "image": null}, "options": [{"id": "5JbZY", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "F2DTK", "label": "B", "text": "$-2$", "isCorrect": true, "image": null}, {"id": "AA7aa", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "q52A2", "label": "D", "text": "Does not exist", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given limit is $\\displaystyle\\lim_{x\\to 9} \\dfrac{\\sqrt{f(x)} - 2\\sqrt{u(x)}}{\\sqrt{x} - 3}$<br><br>Substituting $x = 9$, the expression takes the form $\\dfrac{\\sqrt{f(9)} - 2\\sqrt{u(9)}}{\\sqrt{9} - 3} = \\dfrac{\\sqrt{36} - 2\\sqrt{9}}{3 - 3} = \\dfrac{6 - 6}{0} = \\dfrac{0}{0}$<br><br>Applying L'Hospital's rule, differentiating the numerator and the denominator with respect to $x$:<br><br>$\\displaystyle\\lim_{x\\to 9} \\dfrac{\\dfrac{f'(x)}{2\\sqrt{f(x)}} - \\dfrac{2u'(x)}{2\\sqrt{u(x)}}}{\\dfrac{1}{2\\sqrt{x}}}$<br><br>Substituting $x = 9$ into the expression:<br><br>$\\dfrac{\\dfrac{f'(9)}{2\\sqrt{f(9)}} - \\dfrac{u'(9)}{\\sqrt{u(9)}}}{\\dfrac{1}{2\\sqrt{9}}}$<br><br>Substituting the given values $f(9) = 36$, $u(9) = 9$, $f'(9) = 12$, and $u'(9) = 4$:<br><br>$\\dfrac{\\dfrac{12}{2\\sqrt{36}} - \\dfrac{4}{\\sqrt{9}}}{\\dfrac{1}{2\\sqrt{9}}}$<br><br>$\\dfrac{\\dfrac{12}{12} - \\dfrac{4}{3}}{\\dfrac{1}{6}}$<br><br>$\\dfrac{1 - \\dfrac{4}{3}}{\\dfrac{1}{6}}$<br><br>$\\dfrac{-\\dfrac{1}{3}}{\\dfrac{1}{6}} = -2$<br><br>Answer: $-2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885615a9fc0fc8c142ba", "type": "singleCorrect", "question": {"text": "If $k > 5$ and $\\lim_{x \\to 0} \\dfrac{k^{2x} + 25^x - 2 \\cdot (5k)^x}{\\tan 3x \\cdot \\ln(1 + 3x)} = \\lim_{n \\to \\infty} \\dfrac{(n+1)! + n!}{(n+1)! - n!}$, then value of $k$ is...", "image": null}, "options": [{"id": "ioAwh", "label": "A", "text": "$e^{15}$", "isCorrect": false, "image": null}, {"id": "4u6Tv", "label": "B", "text": "$5e$", "isCorrect": false, "image": null}, {"id": "GYI9n", "label": "C", "text": "$3e^{9/2}$", "isCorrect": false, "image": null}, {"id": "q3frY", "label": "D", "text": "$5e^3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Evaluating the right-hand side limit:<br><br>$\\lim_{n \\to \\infty} \\dfrac{(n+1)! + n!}{(n+1)! - n!} = \\lim_{n \\to \\infty} \\dfrac{n!(n+1 + 1)}{n!(n+1 - 1)} = \\lim_{n \\to \\infty} \\dfrac{n+2}{n} = \\lim_{n \\to \\infty} \\left(1 + \\dfrac{2}{n}\\right) = 1$<br><br>Evaluating the left-hand side limit:<br><br>$\\lim_{x \\to 0} \\dfrac{k^{2x} + 25^x - 2 \\cdot (5k)^x}{\\tan 3x \\cdot \\ln(1 + 3x)}$<br><br>The numerator can be written as:<br><br>$k^{2x} + 5^{2x} - 2 \\cdot k^x \\cdot 5^x = (k^x - 5^x)^2$<br><br>Dividing the numerator and the denominator by $x^2$:<br><br>$\\lim_{x \\to 0} \\dfrac{\\left(\\dfrac{k^x - 5^x}{x}\\right)^2}{\\left(\\dfrac{\\tan 3x}{x}\\right) \\cdot \\left(\\dfrac{\\ln(1 + 3x)}{x}\\right)}$<br><br>Using standard limits $\\lim_{x \\to 0} \\dfrac{a^x - b^x}{x} = \\ln\\left(\\dfrac{a}{b}\\right)$, $\\lim_{x \\to 0} \\dfrac{\\tan ax}{x} = a$, and $\\lim_{x \\to 0} \\dfrac{\\ln(1 + ax)}{x} = a$:<br><br>$\\dfrac{\\left(\\ln\\left(\\dfrac{k}{5}\\right)\\right)^2}{3 \\cdot 3} = \\dfrac{1}{9} \\left(\\ln\\left(\\dfrac{k}{5}\\right)\\right)^2$<br><br>Equating the left-hand side and the right-hand side:<br><br>$\\dfrac{1}{9} \\left(\\ln\\left(\\dfrac{k}{5}\\right)\\right)^2 = 1$<br><br>$\\left(\\ln\\left(\\dfrac{k}{5}\\right)\\right)^2 = 9$<br><br>$\\ln\\left(\\dfrac{k}{5}\\right) = \\pm 3$<br><br>Since $k > 5$, $\\dfrac{k}{5} > 1$, which implies $\\ln\\left(\\dfrac{k}{5}\\right) > 0$.<br><br>$\\ln\\left(\\dfrac{k}{5}\\right) = 3$<br><br>$\\dfrac{k}{5} = e^3$<br><br>$k = 5e^3$<br><br>Answer: $5e^3$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887515a9fc0fc8c143e6", "type": "singleCorrect", "question": {"text": "If $\\displaystyle\\lim_{x \\to \\infty}\\left[\\dfrac{x^3 + 1}{x^2 + 1} - (ax + b)\\right] = 2$ then", "image": null}, "options": [{"id": "eJ3vz", "label": "A", "text": "$a = 1,\\ b = 1$", "isCorrect": false, "image": null}, {"id": "QMR05", "label": "B", "text": "$a = 1,\\ b = -1$", "isCorrect": false, "image": null}, {"id": "hzV15", "label": "C", "text": "$a = 1,\\ b = -2$", "isCorrect": true, "image": null}, {"id": "m48sG", "label": "D", "text": "$a = 1,\\ b = 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given limit is $\\lim_{x \\to \\infty}\\left[\\dfrac{x^3 + 1}{x^2 + 1} - (ax + b)\\right] = 2$<br><br>Simplifying the expression inside the limit:<br><br>$\\dfrac{x^3 + 1 - (ax + b)(x^2 + 1)}{x^2 + 1}$<br><br>$= \\dfrac{x^3(1 - a) - bx^2 - ax + (1 - b)}{x^2 + 1}$<br><br>For the limit to be finite as $x \\to \\infty$, the degree of the numerator must not exceed the degree of the denominator. Since the denominator is of degree $2$, the coefficient of $x^3$ in the numerator must be zero.<br><br>$1 - a = 0 \\Rightarrow a = 1$<br><br>Substituting $a = 1$ into the limit expression:<br><br>$\\lim_{x \\to \\infty} \\dfrac{-bx^2 - x + (1 - b)}{x^2 + 1} = 2$<br><br>Dividing the numerator and the denominator by $x^2$:<br><br>$\\lim_{x \\to \\infty} \\dfrac{-b - \\dfrac{1}{x} + \\dfrac{1 - b}{x^2}}{1 + \\dfrac{1}{x^2}} = 2$<br><br>$-b = 2 \\Rightarrow b = -2$<br><br>Therefore, $a = 1$ and $b = -2$.<br><br>Answer: $a = 1,\\ b = -2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888515a9fc0fc8c1447c", "type": "singleCorrect", "question": {"text": "If $f(x) = \\dfrac{ax - 3}{5x + 7}$ and $\\lim_{x \\to 0} f(x) \\cdot \\lim_{x \\to \\infty} f(x) = 3$ then $a = \\ldots$", "image": null}, "options": [{"id": "2sLbu", "label": "A", "text": "$35$", "isCorrect": false, "image": null}, {"id": "iYpHX", "label": "B", "text": "$-35$", "isCorrect": true, "image": null}, {"id": "uRInY", "label": "C", "text": "$15$", "isCorrect": false, "image": null}, {"id": "BVUJ3", "label": "D", "text": "$\\dfrac{21}{5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = \\dfrac{ax - 3}{5x + 7}$<br><br>Evaluating the first limit:<br><br>$\\lim_{x \\to 0} f(x) = \\lim_{x \\to 0} \\dfrac{ax - 3}{5x + 7} = -\\dfrac{3}{7}$<br><br>Evaluating the second limit:<br><br>$\\lim_{x \\to \\infty} f(x) = \\lim_{x \\to \\infty} \\dfrac{ax - 3}{5x + 7} = \\lim_{x \\to \\infty} \\dfrac{a - \\dfrac{3}{x}}{5 + \\dfrac{7}{x}} = \\dfrac{a}{5}$<br><br>According to the given condition:<br><br>$\\lim_{x \\to 0} f(x) \\cdot \\lim_{x \\to \\infty} f(x) = 3$<br><br>$\\left(-\\dfrac{3}{7}\\right) \\cdot \\left(\\dfrac{a}{5}\\right) = 3$<br><br>$-\\dfrac{3a}{35} = 3$<br><br>$a = -35$<br><br>Answer: $-35$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886515a9fc0fc8c14350", "type": "singleCorrect", "question": {"text": "The value of $\\lim_{x \\to \\infty} \\left(\\sqrt[3]{x^3 + 6x^2 + 1} - x\\right)$ is:", "image": null}, "options": [{"id": "pyV4Z", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "YGIL1", "label": "B", "text": "$1$", "isCorrect": false, "image": null}, {"id": "k7ZvQ", "label": "C", "text": "$2$", "isCorrect": true, "image": null}, {"id": "IX2zF", "label": "D", "text": "$\\infty$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\to \\infty} \\left(\\sqrt[3]{x^3 + 6x^2 + 1} - x\\right)$<br><br>Taking $x$ common from the cube root, we get:<br><br>$L = \\lim_{x \\to \\infty} x \\left( \\left( 1 + \\dfrac{6}{x} + \\dfrac{1}{x^3} \\right)^{1/3} - 1 \\right)$<br><br>Using the binomial expansion $(1 + t)^n = 1 + nt + \\dfrac{n(n-1)}{2!}t^2 + \\dots$ for $|t| < 1$, where $t = \\dfrac{6}{x} + \\dfrac{1}{x^3}$ and $n = \\dfrac{1}{3}$:<br><br>$L = \\lim_{x \\to \\infty} x \\left( 1 + \\dfrac{1}{3} \\left( \\dfrac{6}{x} + \\dfrac{1}{x^3} \\right) + \\dots - 1 \\right)$<br><br>$L = \\lim_{x \\to \\infty} x \\left( \\dfrac{2}{x} + \\dfrac{1}{3x^3} + \\dots \\right)$<br><br>$L = \\lim_{x \\to \\infty} \\left( 2 + \\dfrac{1}{3x^2} + \\dots \\right)$<br><br>As $x \\to \\infty$, the terms containing $\\dfrac{1}{x}$ and higher powers approach zero.<br><br>$L = 2$<br><br>Answer: $2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ad8c30a4553e1bdba0", "type": "singleCorrect", "question": {"text": "The value of $\\lim\\limits_{n \\to \\infty}\\left[\\dfrac{1}{1 - n^2} + \\dfrac{2}{1 - n^2} + \\ldots + \\dfrac{n}{1 - n^2}\\right]^3$ is", "image": null}, "options": [{"id": "j0BfW", "label": "A", "text": "$8$", "isCorrect": false, "image": null}, {"id": "SNQMq", "label": "B", "text": "$-8$", "isCorrect": false, "image": null}, {"id": "uN2tM", "label": "C", "text": "$\\dfrac{1}{8}$", "isCorrect": false, "image": null}, {"id": "Kv97A", "label": "D", "text": "$\\dfrac{-1}{8}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $L = \\lim\\limits_{n \\to \\infty}\\left[\\dfrac{1}{1 - n^2} + \\dfrac{2}{1 - n^2} + \\ldots + \\dfrac{n}{1 - n^2}\\right]^3$<br><br>The expression inside the bracket can be simplified by taking the common denominator:<br><br>$S_n = \\dfrac{1 + 2 + \\ldots + n}{1 - n^2}$<br><br>Using the sum of the first $n$ natural numbers, $1 + 2 + \\ldots + n = \\dfrac{n(n+1)}{2}$:<br><br>$S_n = \\dfrac{\\dfrac{n(n+1)}{2}}{1 - n^2}$<br><br>$S_n = \\dfrac{n(n+1)}{2(1 - n)(1 + n)}$<br><br>$S_n = \\dfrac{n}{2(1 - n)}$<br><br>Taking the limit as $n \\to \\infty$:<br><br>$\\lim\\limits_{n \\to \\infty} S_n = \\lim\\limits_{n \\to \\infty} \\dfrac{n}{2(1 - n)} = \\lim\\limits_{n \\to \\infty} \\dfrac{1}{2\\left(\\dfrac{1}{n} - 1\\right)} = -\\dfrac{1}{2}$<br><br>Therefore, the required limit is:<br><br>$L = \\left(-\\dfrac{1}{2}\\right)^3 = -\\dfrac{1}{8}$<br><br>Answer: $\\dfrac{-1}{8}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3018c30a4553e1bdf25", "type": "singleCorrect", "question": {"text": "If the function $f(x) = \\dfrac{2\\sqrt{2} - (\\cos x + \\sin x)^3}{1 - \\sin 2x}$ is continuous at $x = \\dfrac{\\pi}{4}$, then the value of $f\\left(\\dfrac{\\pi}{4}\\right)$ is ...", "image": null}, "options": [{"id": "AEGhl", "label": "A", "text": "$\\dfrac{3\\sqrt{2}}{2}$", "isCorrect": true, "image": null}, {"id": "bBnyD", "label": "B", "text": "$\\dfrac{5\\sqrt{2}}{2}$", "isCorrect": false, "image": null}, {"id": "bFtxE", "label": "C", "text": "$0$", "isCorrect": false, "image": null}, {"id": "ODksQ", "label": "D", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $f(x)$ is continuous at $x = \\dfrac{\\pi}{4}$, we have $f\\left(\\dfrac{\\pi}{4}\\right) = \\lim_{x \\to \\pi/4} f(x)$.<br><br>Let $t = \\cos x + \\sin x$. As $x \\to \\dfrac{\\pi}{4}$, $t \\to \\cos\\left(\\dfrac{\\pi}{4}\\right) + \\sin\\left(\\dfrac{\\pi}{4}\\right) = \\sqrt{2}$.<br><br>Squaring both sides, $t^2 = (\\cos x + \\sin x)^2 = \\cos^2 x + \\sin^2 x + 2\\sin x \\cos x = 1 + \\sin 2x$.<br><br>This gives $\\sin 2x = t^2 - 1$.<br><br>Substituting these into the limit:<br><br>$\\lim_{x \\to \\pi/4} \\dfrac{2\\sqrt{2} - (\\cos x + \\sin x)^3}{1 - \\sin 2x} = \\lim_{t \\to \\sqrt{2}} \\dfrac{2\\sqrt{2} - t^3}{1 - (t^2 - 1)} = \\lim_{t \\to \\sqrt{2}} \\dfrac{2\\sqrt{2} - t^3}{2 - t^2}$<br><br>This is a $\\dfrac{0}{0}$ form. Applying L'Hopital's rule:<br><br>$\\lim_{t \\to \\sqrt{2}} \\dfrac{-3t^2}{-2t} = \\lim_{t \\to \\sqrt{2}} \\dfrac{3t}{2} = \\dfrac{3\\sqrt{2}}{2}$<br><br>Alternatively, by factorizing:<br><br>$\\lim_{t \\to \\sqrt{2}} \\dfrac{(\\sqrt{2} - t)(2 + \\sqrt{2}t + t^2)}{(\\sqrt{2} - t)(\\sqrt{2} + t)} = \\lim_{t \\to \\sqrt{2}} \\dfrac{2 + \\sqrt{2}t + t^2}{\\sqrt{2} + t} = \\dfrac{2 + 2 + 2}{\\sqrt{2} + \\sqrt{2}} = \\dfrac{6}{2\\sqrt{2}} = \\dfrac{3\\sqrt{2}}{2}$<br><br>Thus, $f\\left(\\dfrac{\\pi}{4}\\right) = \\dfrac{3\\sqrt{2}}{2}$.<br><br>Answer: $\\dfrac{3\\sqrt{2}}{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f38c30a4553e1bde8e", "type": "singleCorrect", "question": {"text": "If $\\lim\\limits_{x \\to k} \\dfrac{x^3 - k^3}{x^2 - k^2} = \\lim\\limits_{x \\to 0} \\dfrac{1 - \\cos(2x)}{x \\sin x}$, then the value of $k$ is $\\ldots$", "image": null}, "options": [{"id": "zNt4a", "label": "A", "text": "$\\dfrac{4}{3}$", "isCorrect": true, "image": null}, {"id": "xAQuH", "label": "B", "text": "$\\dfrac{3}{4}$", "isCorrect": false, "image": null}, {"id": "5C5zV", "label": "C", "text": "$\\dfrac{8}{3}$", "isCorrect": false, "image": null}, {"id": "YNlY9", "label": "D", "text": "$\\dfrac{3}{8}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Evaluating the left hand side limit:<br><br>$\\lim\\limits_{x \\to k} \\dfrac{x^3 - k^3}{x^2 - k^2} = \\lim\\limits_{x \\to k} \\dfrac{(x - k)(x^2 + xk + k^2)}{(x - k)(x + k)}$<br><br>$= \\dfrac{k^2 + k^2 + k^2}{k + k} = \\dfrac{3k^2}{2k} = \\dfrac{3k}{2}$<br><br>Evaluating the right hand side limit:<br><br>$\\lim\\limits_{x \\to 0} \\dfrac{1 - \\cos(2x)}{x \\sin x} = \\lim\\limits_{x \\to 0} \\dfrac{2 \\sin^2 x}{x \\sin x}$<br><br>$= \\lim\\limits_{x \\to 0} 2 \\left(\\dfrac{\\sin x}{x}\\right) = 2(1) = 2$<br><br>Equating both the limits:<br><br>$\\dfrac{3k}{2} = 2$<br><br>$k = \\dfrac{4}{3}$<br><br>Answer: $\\dfrac{4}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32b8c30a4553e1be0e6", "type": "singleCorrect", "question": {"text": "If $\\lim\\limits_{x \\to \\infty}\\left[\\dfrac{x^2+x+1}{x+1} - ax - b\\right] = 3$, then $a - b = $...", "image": null}, "options": [{"id": "5bW3K", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "koCuW", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "axVWj", "label": "C", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "RQ0qi", "label": "D", "text": "$4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given limit is $\\lim\\limits_{x \\to \\infty}\\left[\\dfrac{x^2+x+1}{x+1} - ax - b\\right] = 3$<br><br>Taking the LCM, we get:<br><br>$\\lim\\limits_{x \\to \\infty}\\left[\\dfrac{x^2+x+1 - ax(x+1) - b(x+1)}{x+1}\\right] = 3$<br><br>$\\lim\\limits_{x \\to \\infty}\\left[\\dfrac{(1-a)x^2 + (1-a-b)x + (1-b)}{x+1}\\right] = 3$<br><br>For the limit to be finite as $x \\to \\infty$, the degree of the numerator must be less than or equal to the degree of the denominator. Therefore, the coefficient of $x^2$ in the numerator must be zero.<br><br>$1 - a = 0 \\Rightarrow a = 1$<br><br>Substituting $a = 1$ in the limit expression:<br><br>$\\lim\\limits_{x \\to \\infty}\\left[\\dfrac{-bx + (1-b)}{x+1}\\right] = 3$<br><br>Dividing the numerator and the denominator by $x$:<br><br>$\\lim\\limits_{x \\to \\infty}\\left[\\dfrac{-b + \\dfrac{1-b}{x}}{1 + \\dfrac{1}{x}}\\right] = 3$<br><br>$-b = 3 \\Rightarrow b = -3$<br><br>We need to find the value of $a - b$:<br><br>$a - b = 1 - (-3) = 4$<br><br>Answer: $4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c98c30a4553e1bdccc", "type": "singleCorrect", "question": {"text": "If $\\lim\\limits_{x \\to 1} \\dfrac{\\sin(3x^2 - 4x + 1) - x^2 + 1}{2x^3 - 7x^2 + ax + b} = -2$, then the quadratic equation having roots $a$ and $b$ is", "image": null}, "options": [{"id": "gyP2d", "label": "A", "text": "$x^2 + 5x - 24 = 0$", "isCorrect": false, "image": null}, {"id": "FOy26", "label": "B", "text": "$x^2 - 5x + 24 = 0$", "isCorrect": false, "image": null}, {"id": "3DtWu", "label": "C", "text": "$x^2 - 5x - 24 = 0$", "isCorrect": true, "image": null}, {"id": "Kkb26", "label": "D", "text": "$x^2 + 5x + 24 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given limit is $\\lim\\limits_{x \\to 1} \\dfrac{\\sin(3x^2 - 4x + 1) - x^2 + 1}{2x^3 - 7x^2 + ax + b} = -2$<br><br>Let $N(x) = \\sin(3x^2 - 4x + 1) - x^2 + 1$ and $D(x) = 2x^3 - 7x^2 + ax + b$.<br><br>As $x \\to 1$, $N(1) = \\sin(0) - 1 + 1 = 0$.<br><br>For the limit to exist and be finite, the denominator must also approach $0$ as $x \\to 1$.<br><br>$D(1) = 2(1)^3 - 7(1)^2 + a(1) + b = 0 \\Rightarrow a + b = 5$<br><br>Applying L'Hopital's rule, we differentiate the numerator and the denominator:<br><br>$N'(x) = (6x - 4)\\cos(3x^2 - 4x + 1) - 2x$<br><br>$D'(x) = 6x^2 - 14x + a$<br><br>As $x \\to 1$, $N'(1) = 2\\cos(0) - 2 = 0$.<br><br>Since $N'(1) = 0$ and the limit is a non-zero finite value, $D'(1)$ must also be $0$.<br><br>$D'(1) = 6(1)^2 - 14(1) + a = 0 \\Rightarrow a = 8$<br><br>Substituting $a = 8$ into $a + b = 5$, we get $b = -3$.<br><br>Applying L'Hopital's rule again to verify the limit:<br><br>$N''(x) = -(6x - 4)^2\\sin(3x^2 - 4x + 1) + 6\\cos(3x^2 - 4x + 1) - 2$<br><br>$D''(x) = 12x - 14$<br><br>$\\lim\\limits_{x \\to 1} \\dfrac{N''(x)}{D''(x)} = \\dfrac{0 + 6 - 2}{12 - 14} = \\dfrac{4}{-2} = -2$, which matches the given limit.<br><br>The roots of the required quadratic equation are $a = 8$ and $b = -3$.<br><br>The sum of the roots is $a + b = 5$.<br><br>The product of the roots is $ab = 8 \\times (-3) = -24$.<br><br>The quadratic equation is $x^2 - (a + b)x + ab = 0$, which gives $x^2 - 5x - 24 = 0$.<br><br>Answer: $x^2 - 5x - 24 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 3, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e58c30a4553e1bddf2", "type": "singleCorrect", "question": {"text": "If $\\lim\\limits_{x \\to \\infty} \\dfrac{(2x-1)^{19} \\cdot (3x+2)^{11}}{(6x-5)^{30}} = 2^a \\cdot 3^b$, then $a + b =$", "image": null}, "options": [{"id": "PuB8l", "label": "A", "text": "$-30$", "isCorrect": true, "image": null}, {"id": "hhp4r", "label": "B", "text": "$-11$", "isCorrect": false, "image": null}, {"id": "pogGL", "label": "C", "text": "$-19$", "isCorrect": false, "image": null}, {"id": "yfTQi", "label": "D", "text": "$30$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\lim\\limits_{x \\to \\infty} \\dfrac{(2x-1)^{19} \\cdot (3x+2)^{11}}{(6x-5)^{30}}$<br><br>Dividing the numerator and the denominator by $x^{30}$:<br><br>$\\lim\\limits_{x \\to \\infty} \\dfrac{\\left(2 - \\dfrac{1}{x}\\right)^{19} \\left(3 + \\dfrac{2}{x}\\right)^{11}}{\\left(6 - \\dfrac{5}{x}\\right)^{30}}$<br><br>As $x \\to \\infty$, $\\dfrac{1}{x} \\to 0$. The limit evaluates to:<br><br>$\\dfrac{2^{19} \\cdot 3^{11}}{6^{30}}$<br><br>Substituting $6 = 2 \\cdot 3$:<br><br>$\\dfrac{2^{19} \\cdot 3^{11}}{2^{30} \\cdot 3^{30}} = 2^{19 - 30} \\cdot 3^{11 - 30} = 2^{-11} \\cdot 3^{-19}$<br><br>Comparing with $2^a \\cdot 3^b$, we get $a = -11$ and $b = -19$.<br><br>Therefore, $a + b = -11 - 19 = -30$.<br><br>Answer: $-30$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29f8c30a4553e1bdb08", "type": "singleCorrect", "question": {"text": "The value of $\\lim_{n\\to\\infty} \\dfrac{(n+2)! + (n+1)!}{(n+2)! - (n+1)!}$ is ____", "image": null}, "options": [{"id": "WU1sX", "label": "A", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "5a9qp", "label": "B", "text": "$0$", "isCorrect": false, "image": null}, {"id": "Yw3zd", "label": "C", "text": "$1$", "isCorrect": true, "image": null}, {"id": "chUOs", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given limit is $\\lim_{n\\to\\infty} \\dfrac{(n+2)! + (n+1)!}{(n+2)! - (n+1)!}$<br><br>Taking $(n+1)!$ common from both numerator and denominator:<br><br>$\\lim_{n\\to\\infty} \\dfrac{(n+1)![(n+2) + 1]}{(n+1)![(n+2) - 1]}$<br><br>Cancelling $(n+1)!$ from numerator and denominator:<br><br>$\\lim_{n\\to\\infty} \\dfrac{n+3}{n+1}$<br><br>Dividing numerator and denominator by $n$:<br><br>$\\lim_{n\\to\\infty} \\dfrac{1 + \\dfrac{3}{n}}{1 + \\dfrac{1}{n}}$<br><br>As $n \\to \\infty$, $\\dfrac{1}{n} \\to 0$. Substituting the limit:<br><br>$\\dfrac{1 + 0}{1 + 0} = 1$<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3768c30a4553e1be3fe", "type": "singleCorrect", "question": {"text": "$\\displaystyle\\lim_{x \\to 0}\\left[\\dfrac{\\log|2 + x| - \\log|2 - x|}{\\tan x}\\right] = $ .......", "image": null}, "options": [{"id": "LUdBD", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "CK94Y", "label": "B", "text": "$0$", "isCorrect": false, "image": null}, {"id": "CoqfL", "label": "C", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "yXXLw", "label": "D", "text": "$1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "As $x \\to 0$, $2+x > 0$ and $2-x > 0$, so the absolute value signs can be removed:<br><br>$\\lim_{x \\to 0} \\dfrac{\\log(2 + x) - \\log(2 - x)}{\\tan x}$<br><br>This limit is of the form $\\dfrac{0}{0}$. Applying L'Hospital's rule by differentiating the numerator and the denominator with respect to $x$:<br><br>$\\lim_{x \\to 0} \\dfrac{\\dfrac{1}{2 + x} - \\dfrac{1}{2 - x}(-1)}{\\sec^2 x}$<br><br>$= \\lim_{x \\to 0} \\dfrac{\\dfrac{1}{2 + x} + \\dfrac{1}{2 - x}}{\\sec^2 x}$<br><br>Substituting $x = 0$:<br><br>$= \\dfrac{\\dfrac{1}{2} + \\dfrac{1}{2}}{1} = 1$<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3648c30a4553e1be33e", "type": "singleCorrect", "question": {"text": "$\\lim_{x \\to 1} \\left[\\dfrac{x-2}{x^2-x} - \\dfrac{1}{x^3 - 3x^2 + 2x}\\right] = $", "image": null}, "options": [{"id": "Vnd0S", "label": "A", "text": "$3$", "isCorrect": false, "image": null}, {"id": "BtswS", "label": "B", "text": "$4$", "isCorrect": false, "image": null}, {"id": "T2TLD", "label": "C", "text": "$2$", "isCorrect": true, "image": null}, {"id": "cpQdG", "label": "D", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given limit is $\\lim_{x \\to 1} \\left[\\dfrac{x-2}{x^2-x} - \\dfrac{1}{x^3 - 3x^2 + 2x}\\right]$<br><br>Factorizing the denominators, we get:<br><br>$= \\lim_{x \\to 1} \\left[\\dfrac{x-2}{x(x-1)} - \\dfrac{1}{x(x-1)(x-2)}\\right]$<br><br>Taking the common denominator $x(x-1)(x-2)$:<br><br>$= \\lim_{x \\to 1} \\left[\\dfrac{(x-2)^2 - 1}{x(x-1)(x-2)}\\right]$<br><br>Expanding the numerator:<br><br>$= \\lim_{x \\to 1} \\left[\\dfrac{x^2 - 4x + 4 - 1}{x(x-1)(x-2)}\\right]$<br><br>$= \\lim_{x \\to 1} \\left[\\dfrac{x^2 - 4x + 3}{x(x-1)(x-2)}\\right]$<br><br>Factorizing the numerator:<br><br>$= \\lim_{x \\to 1} \\left[\\dfrac{(x-1)(x-3)}{x(x-1)(x-2)}\\right]$<br><br>Canceling the common factor $(x-1)$ since $x \\to 1$ implies $x \\neq 1$:<br><br>$= \\lim_{x \\to 1} \\dfrac{x-3}{x(x-2)}$<br><br>Substituting $x = 1$ into the simplified expression:<br><br>$= \\dfrac{1-3}{1(1-2)} = \\dfrac{-2}{-1} = 2$<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c02bf9280d7f9932e71", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)=\\left\\{\\begin{array}{cc}\\frac{9^x-2 \\cdot 3^x+1}{\\log (1+3 x) \\cdot \\tan 2 x} & , \\text { if } x \\neq 0 \\\\ \\mathrm{a}(\\log \\mathrm{b})^{\\mathrm{c}} & , \\text { if } x=0\\end{array}\\right.$ is continuous at $x=0$, then $\\mathrm{a}+\\mathrm{b}+\\mathrm{c}=$", "image": null}, "options": [{"id": "iGQcB", "text": "$\\frac{31}{6}$", "image": null, "isCorrect": true}, {"id": "6Sjr4", "text": "$\\frac{1}{6}$", "image": null, "isCorrect": false}, {"id": "dTjB7", "text": "$\\frac{5}{6}$", "image": null, "isCorrect": false}, {"id": "86hVz", "text": "$\\frac{3}{20}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the function $f(x)$ is continuous at $x=0$, we have:<br><br>$\\lim_{x \\to 0} f(x) = f(0)$<br><br>$\\lim_{x \\to 0} \\dfrac{9^x - 2 \\cdot 3^x + 1}{\\log(1+3x) \\cdot \\tan 2x} = a(\\log b)^c$<br><br>The numerator can be written as a perfect square:<br><br>$9^x - 2 \\cdot 3^x + 1 = (3^x)^2 - 2 \\cdot 3^x + 1 = (3^x - 1)^2$<br><br>Now, divide the numerator and the denominator by $x^2$:<br><br>$\\lim_{x \\to 0} \\dfrac{\\left(\\dfrac{3^x - 1}{x}\\right)^2}{\\left(\\dfrac{\\log(1+3x)}{x}\\right) \\cdot \\left(\\dfrac{\\tan 2x}{x}\\right)} = a(\\log b)^c$<br><br>Using the standard limits $\\lim_{x \\to 0} \\dfrac{k^x - 1}{x} = \\log k$, $\\lim_{x \\to 0} \\dfrac{\\log(1+kx)}{x} = k$, and $\\lim_{x \\to 0} \\dfrac{\\tan kx}{x} = k$, we get:<br><br>$\\dfrac{(\\log 3)^2}{3 \\cdot 2} = a(\\log b)^c$<br><br>$\\dfrac{1}{6}(\\log 3)^2 = a(\\log b)^c$<br><br>Comparing both sides, we get:<br><br>$a = \\dfrac{1}{6}$, $b = 3$, $c = 2$<br><br>Therefore, the value of $a + b + c$ is:<br><br>$a + b + c = \\dfrac{1}{6} + 3 + 2 = \\dfrac{1}{6} + 5 = \\dfrac{31}{6}$<br><br>Answer: $\\frac{31}{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be2bf9280d7f9932d48", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{\\mathrm{e}^{x^2}-\\cos 3 x}{\\sin x \\log (1+2 x)}=$", "image": null}, "options": [{"id": "PjO4m", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "wzXtA", "text": "$\\frac{-3}{2}$", "image": null, "isCorrect": false}, {"id": "wIqmO", "text": "$\\frac{11}{4}$", "image": null, "isCorrect": true}, {"id": "xhJZX", "text": "$\\frac{-11}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Divide the numerator and the denominator by $x^2$:<br><br>$\\lim_{x \\rightarrow 0} \\dfrac{\\dfrac{e^{x^2} - \\cos 3x}{x^2}}{\\dfrac{\\sin x}{x} \\cdot \\dfrac{\\log(1+2x)}{x}}$<br><br>Rewrite the numerator by adding and subtracting $1$:<br><br>$\\lim_{x \\rightarrow 0} \\dfrac{\\dfrac{e^{x^2} - 1}{x^2} + \\dfrac{1 - \\cos 3x}{x^2}}{\\dfrac{\\sin x}{x} \\cdot \\dfrac{\\log(1+2x)}{2x} \\cdot 2}$<br><br>Using standard limits $\\lim_{x \\rightarrow 0} \\dfrac{e^x - 1}{x} = 1$, $\\lim_{x \\rightarrow 0} \\dfrac{1 - \\cos ax}{x^2} = \\dfrac{a^2}{2}$, $\\lim_{x \\rightarrow 0} \\dfrac{\\sin x}{x} = 1$, and $\\lim_{x \\rightarrow 0} \\dfrac{\\log(1+x)}{x} = 1$:<br><br>Numerator limit: $\\lim_{x \\rightarrow 0} \\dfrac{e^{x^2} - 1}{x^2} + \\lim_{x \\rightarrow 0} \\dfrac{1 - \\cos 3x}{x^2} = 1 + \\dfrac{3^2}{2} = 1 + \\dfrac{9}{2} = \\dfrac{11}{2}$<br><br>Denominator limit: $\\lim_{x \\rightarrow 0} \\dfrac{\\sin x}{x} \\cdot \\lim_{x \\rightarrow 0} \\dfrac{\\log(1+2x)}{2x} \\cdot 2 = 1 \\cdot 1 \\cdot 2 = 2$<br><br>Dividing the limits, we get:<br><br>$\\dfrac{\\dfrac{11}{2}}{2} = \\dfrac{11}{4}$<br><br>Answer: $\\frac{11}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd4bf9280d7f9932cd1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow \\infty} \\frac{(2 x+1)^{50}+(2 x+2)^{50}+(2 x+3)^{50}+\\cdots \\cdots+(2 x+100)^{50}}{(2 x)^{50}+(10)^{50}}=\\cdots$", "image": null}, "options": [{"id": "jHFBo", "text": "50", "image": null, "isCorrect": false}, {"id": "aBbk2", "text": "100", "image": null, "isCorrect": true}, {"id": "a7Keq", "text": "25", "image": null, "isCorrect": false}, {"id": "p9DCx", "text": "200", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Divide the numerator and the denominator by $(2x)^{50}$ to get:<br><br>$\\lim _{x \\rightarrow \\infty} \\dfrac{\\left(1+\\dfrac{1}{2 x}\\right)^{50}+\\left(1+\\dfrac{2}{2 x}\\right)^{50}+\\cdots+\\left(1+\\dfrac{100}{2 x}\\right)^{50}}{1+\\left(\\dfrac{10}{2 x}\\right)^{50}}$<br><br>As $x \\rightarrow \\infty$, the terms $\\dfrac{1}{2x}, \\dfrac{2}{2x}, \\dots, \\dfrac{100}{2x}$ and $\\dfrac{10}{2x}$ all approach $0$.<br><br>Substituting these limits into the expression, each of the $100$ terms in the numerator approaches $1^{50} = 1$.<br><br>The denominator approaches $1 + 0 = 1$.<br><br>Therefore, the limit evaluates to:<br><br>$\\dfrac{1 + 1 + \\cdots + 1 \\text{ (100 times)}}{1} = \\dfrac{100}{1} = 100$<br><br>Answer: 100", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbfbf9280d7f9932c17", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{63^x-9^x-7^x+1}{\\sqrt{2}-\\sqrt{1+\\cos x}}=\\ldots$.", "image": null}, "options": [{"id": "zvv3s", "text": "$\\frac{4 \\sqrt{2}}{\\log 7 \\cdot \\log 9}$", "image": null, "isCorrect": false}, {"id": "WsuCa", "text": "$4 \\sqrt{2} \\log 7 \\cdot \\log 9$", "image": null, "isCorrect": true}, {"id": "riKHs", "text": "$4 \\sqrt{2} \\log 63$", "image": null, "isCorrect": false}, {"id": "1zwW7", "text": "$\\frac{\\log 7 \\cdot \\log 9}{4 \\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given limit is $\\lim_{x \\rightarrow 0} \\dfrac{63^x-9^x-7^x+1}{\\sqrt{2}-\\sqrt{1+\\cos x}}$.<br><br>Factorizing the numerator:<br>$63^x - 9^x - 7^x + 1 = 9^x \\cdot 7^x - 9^x - 7^x + 1 = (9^x - 1)(7^x - 1)$<br><br>Rationalizing the denominator by multiplying the numerator and the denominator by $\\sqrt{2} + \\sqrt{1 + \\cos x}$:<br>$\\lim_{x \\rightarrow 0} \\dfrac{(9^x - 1)(7^x - 1)(\\sqrt{2} + \\sqrt{1 + \\cos x})}{2 - (1 + \\cos x)}$<br><br>$= \\lim_{x \\rightarrow 0} \\dfrac{(9^x - 1)(7^x - 1)(\\sqrt{2} + \\sqrt{1 + \\cos x})}{1 - \\cos x}$<br><br>Dividing the numerator and the denominator by $x^2$:<br>$= \\lim_{x \\rightarrow 0} \\dfrac{\\dfrac{9^x - 1}{x} \\cdot \\dfrac{7^x - 1}{x} \\cdot (\\sqrt{2} + \\sqrt{1 + \\cos x})}{\\dfrac{1 - \\cos x}{x^2}}$<br><br>Using the standard limits $\\lim_{x \\rightarrow 0} \\dfrac{a^x - 1}{x} = \\log a$ and $\\lim_{x \\rightarrow 0} \\dfrac{1 - \\cos x}{x^2} = \\dfrac{1}{2}$:<br>$= \\dfrac{\\log 9 \\cdot \\log 7 \\cdot (\\sqrt{2} + \\sqrt{1 + 1})}{\\dfrac{1}{2}}$<br><br>$= \\dfrac{\\log 9 \\cdot \\log 7 \\cdot 2\\sqrt{2}}{\\dfrac{1}{2}}$<br><br>$= 4\\sqrt{2} \\log 7 \\cdot \\log 9$<br><br>Answer: $4 \\sqrt{2} \\log 7 \\cdot \\log 9$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb1bf9280d7f9932b9e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow 5^-} \\frac{\\sqrt{2-2 \\cos \\left(x^2-12 x+35\\right)}}{(x-5)}=\\ldots \\ldots$", "image": null}, "options": [{"id": "N3T4i", "text": "$\\frac{2}{-5}$", "image": null, "isCorrect": false}, {"id": "5luHp", "text": "$-2$", "image": null, "isCorrect": true}, {"id": "CkKoP", "text": "$\\frac{-1}{2}$", "image": null, "isCorrect": false}, {"id": "Og1hu", "text": "$-5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given limit is $\\lim_{x \\to 5^-} \\dfrac{\\sqrt{2-2 \\cos(x^2-12x+35)}}{x-5}$<br><br>Using the half-angle formula $1 - \\cos \\theta = 2 \\sin^2\\left(\\dfrac{\\theta}{2}\\right)$, we get:<br><br>$\\lim_{x \\to 5^-} \\dfrac{\\sqrt{4 \\sin^2\\left(\\dfrac{x^2-12x+35}{2}\\right)}}{x-5}$<br><br>$\\lim_{x \\to 5^-} \\dfrac{2 \\left| \\sin\\left(\\dfrac{(x-5)(x-7)}{2}\\right) \\right|}{x-5}$<br><br>As $x \\to 5^-$, $x < 5$. Therefore, $x-5 < 0$ and $x-7 < 0$.<br><br>This implies $(x-5)(x-7) > 0$, so for values of $x$ close to $5$, $\\dfrac{(x-5)(x-7)}{2}$ is a small positive angle, and its sine is positive.<br><br>Thus, $\\left| \\sin\\left(\\dfrac{(x-5)(x-7)}{2}\\right) \\right| = \\sin\\left(\\dfrac{(x-5)(x-7)}{2}\\right)$.<br><br>The limit becomes:<br><br>$\\lim_{x \\to 5^-} \\dfrac{2 \\sin\\left(\\dfrac{(x-5)(x-7)}{2}\\right)}{x-5}$<br><br>Multiply and divide by $\\dfrac{x-7}{2}$:<br><br>$\\lim_{x \\to 5^-} 2 \\left[ \\dfrac{\\sin\\left(\\dfrac{(x-5)(x-7)}{2}\\right)}{\\dfrac{(x-5)(x-7)}{2}} \\right] \\times \\left( \\dfrac{x-7}{2} \\right)$<br><br>Using the standard limit $\\lim_{\\theta \\to 0} \\dfrac{\\sin \\theta}{\\theta} = 1$, we get:<br><br>$2 \\times 1 \\times \\left( \\dfrac{5-7}{2} \\right) = 2 \\times \\left( \\dfrac{-2}{2} \\right) = -2$<br><br>Answer: $-2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb0bf9280d7f9932b99", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)=\\frac{\\sin \\left(\\pi \\cos ^2 x\\right)}{3 x^2}, x \\neq 0$ is continuous at $x=0$ then $\\mathrm{f}(0)=$", "image": null}, "options": [{"id": "3vqvw", "text": "0", "image": null, "isCorrect": false}, {"id": "JXQUR", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": true}, {"id": "wryUl", "text": "$\\frac{-\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "2RSkz", "text": "$\\frac{3}{\\pi}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since $\\mathrm{f}(x)$ is continuous at $x=0$, we have $\\mathrm{f}(0) = \\lim_{x \\to 0} \\mathrm{f}(x)$.<br><br>$\\mathrm{f}(0) = \\lim_{x \\to 0} \\dfrac{\\sin(\\pi \\cos^2 x)}{3x^2}$<br><br>Using the identity $\\cos^2 x = 1 - \\sin^2 x$, we get:<br><br>$\\mathrm{f}(0) = \\lim_{x \\to 0} \\dfrac{\\sin(\\pi(1 - \\sin^2 x))}{3x^2}$<br><br>$\\mathrm{f}(0) = \\lim_{x \\to 0} \\dfrac{\\sin(\\pi - \\pi \\sin^2 x)}{3x^2}$<br><br>Since $\\sin(\\pi - \\theta) = \\sin \\theta$, this becomes:<br><br>$\\mathrm{f}(0) = \\lim_{x \\to 0} \\dfrac{\\sin(\\pi \\sin^2 x)}{3x^2}$<br><br>Multiplying and dividing by $\\pi \\sin^2 x$:<br><br>$\\mathrm{f}(0) = \\lim_{x \\to 0} \\left[ \\dfrac{\\sin(\\pi \\sin^2 x)}{\\pi \\sin^2 x} \\times \\dfrac{\\pi \\sin^2 x}{3x^2} \\right]$<br><br>As $x \\to 0$, $\\pi \\sin^2 x \\to 0$. Using the standard limit $\\lim_{\\theta \\to 0} \\dfrac{\\sin \\theta}{\\theta} = 1$:<br><br>$\\mathrm{f}(0) = 1 \\times \\dfrac{\\pi}{3} \\lim_{x \\to 0} \\left( \\dfrac{\\sin x}{x} \\right)^2$<br><br>$\\mathrm{f}(0) = \\dfrac{\\pi}{3} \\times (1)^2 = \\dfrac{\\pi}{3}$<br><br>Answer: $\\frac{\\pi}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8ebf9280d7f9932a5a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)=\\frac{10^x+7^x-14^x-5^x}{1-\\cos x}, x \\neq 0$ is continuous at $x=0$, then the value of $f(0)$ is", "image": null}, "options": [{"id": "fhXjX", "text": "$\\log 2\\left[\\log \\left(\\frac{5}{7}\\right)\\right]$", "image": null, "isCorrect": false}, {"id": "kuaWR", "text": "$\\log 4\\left[\\log \\left(\\frac{5}{7}\\right)\\right]$", "image": null, "isCorrect": true}, {"id": "mtpqZ", "text": "$\\log 2\\left[\\log \\left(\\frac{7}{5}\\right)\\right]$", "image": null, "isCorrect": false}, {"id": "Ehl0n", "text": "$\\log 4\\left[\\log \\left(\\frac{7}{5}\\right)\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the function is continuous at $x=0$, we have $f(0) = \\lim_{x \\to 0} f(x)$.<br><br>$\\lim_{x \\to 0} \\dfrac{10^x + 7^x - 14^x - 5^x}{1 - \\cos x}$<br><br>Factorizing the numerator:<br><br>$10^x + 7^x - 14^x - 5^x = 2^x 5^x - 5^x - 2^x 7^x + 7^x$<br><br>$= 5^x(2^x - 1) - 7^x(2^x - 1)$<br><br>$= (5^x - 7^x)(2^x - 1)$<br><br>Substituting this back into the limit and dividing the numerator and the denominator by $x^2$:<br><br>$\\lim_{x \\to 0} \\dfrac{\\dfrac{5^x - 7^x}{x} \\cdot \\dfrac{2^x - 1}{x}}{\\dfrac{1 - \\cos x}{x^2}}$<br><br>Using the standard limits $\\lim_{x \\to 0} \\dfrac{a^x - 1}{x} = \\log a$ and $\\lim_{x \\to 0} \\dfrac{1 - \\cos x}{x^2} = \\dfrac{1}{2}$:<br><br>$\\lim_{x \\to 0} \\dfrac{5^x - 7^x}{x} = \\lim_{x \\to 0} \\dfrac{(5^x - 1) - (7^x - 1)}{x} = \\log 5 - \\log 7 = \\log\\left(\\dfrac{5}{7}\\right)$<br><br>$\\lim_{x \\to 0} \\dfrac{2^x - 1}{x} = \\log 2$<br><br>Therefore, the limit evaluates to:<br><br>$f(0) = \\dfrac{\\log\\left(\\dfrac{5}{7}\\right) \\cdot \\log 2}{\\dfrac{1}{2}}$<br><br>$f(0) = 2 \\log 2 \\left[ \\log\\left(\\dfrac{5}{7}\\right) \\right]$<br><br>$f(0) = \\log(2^2) \\left[ \\log\\left(\\dfrac{5}{7}\\right) \\right] = \\log 4 \\left[ \\log\\left(\\dfrac{5}{7}\\right) \\right]$<br><br>Answer: $\\log 4\\left[\\log \\left(\\frac{5}{7}\\right)\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8ebf9280d7f9932a59", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow 2} \\frac{x+3 x^2+5 x^3+7 x^4-166}{x-2}=$", "image": null}, "options": [{"id": "bqaCS", "text": "167", "image": null, "isCorrect": false}, {"id": "VvzfC", "text": "267", "image": null, "isCorrect": false}, {"id": "Eul0J", "text": "287", "image": null, "isCorrect": false}, {"id": "fmewy", "text": "297", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\rightarrow 2} \\dfrac{x+3 x^2+5 x^3+7 x^4-166}{x-2}$<br><br>Substituting $x = 2$ gives $\\dfrac{0}{0}$ form.<br><br>Applying L'Hospital's rule, we differentiate the numerator and the denominator with respect to $x$:<br><br>$L = \\lim_{x \\rightarrow 2} \\dfrac{\\dfrac{d}{dx}(x+3 x^2+5 x^3+7 x^4-166)}{\\dfrac{d}{dx}(x-2)}$<br><br>$L = \\lim_{x \\rightarrow 2} \\dfrac{1 + 6x + 15x^2 + 28x^3}{1}$<br><br>Substituting $x = 2$:<br><br>$L = 1 + 6(2) + 15(2)^2 + 28(2)^3$<br><br>$L = 1 + 12 + 15(4) + 28(8)$<br><br>$L = 1 + 12 + 60 + 224$<br><br>$L = 297$<br><br>Answer: 297", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5dbf9280d7f9932898", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21
