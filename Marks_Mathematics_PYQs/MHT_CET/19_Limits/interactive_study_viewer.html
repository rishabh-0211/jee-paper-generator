 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)= \\begin{cases}\\frac{8^x-4^x-2^x+1^x}{x^2} & , \\text { if } x>0 \\\\ \\mathrm{e}^x \\sin x+i x+\\lambda \\log 4 & , \\text { if } x \\leqslant 0, i \\in \\mathbb{R}\\end{cases}$\nis continuous at $x=0$, then the value of $500 e^\\lambda$ is", "image": null}, "options": [{"id": "ALdT4", "text": "$1000$", "image": null, "isCorrect": true}, {"id": "0bcOW", "text": "$2000$", "image": null, "isCorrect": false}, {"id": "p8Iy3", "text": "$4000$", "image": null, "isCorrect": false}, {"id": "Pd2XK", "text": "$3000$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $x > 0$, the function is $f(x) = \\dfrac{8^x - 4^x - 2^x + 1^x}{x^2} = \\dfrac{8^x - 4^x - 2^x + 1}{x^2}$.<br><br>The right-hand limit at $x = 0$ is:<br><br>$\\lim_{x \\to 0^+} f(x) = \\lim_{x \\to 0^+} \\dfrac{4^x(2^x - 1) - 1(2^x - 1)}{x^2}$<br><br>$\\lim_{x \\to 0^+} f(x) = \\lim_{x \\to 0^+} \\dfrac{(4^x - 1)(2^x - 1)}{x^2}$<br><br>$\\lim_{x \\to 0^+} f(x) = \\lim_{x \\to 0^+} \\left( \\dfrac{4^x - 1}{x} \\right) \\left( \\dfrac{2^x - 1}{x} \\right) = (\\log 4)(\\log 2)$<br><br>For $x \\leqslant 0$, the function is $f(x) = e^x \\sin x + ix + \\lambda \\log 4$.<br><br>The left-hand limit at $x = 0$ is:<br><br>$\\lim_{x \\to 0^-} f(x) = e^0 \\sin 0 + i(0) + \\lambda \\log 4 = \\lambda \\log 4$<br><br>Since $f(x)$ is continuous at $x = 0$, the left-hand limit and right-hand limit must be equal:<br><br>$\\lambda \\log 4 = (\\log 4)(\\log 2)$<br><br>$\\lambda = \\log 2$<br><br>The value of $500 e^\\lambda$ is:<br><br>$500 e^{\\log 2} = 500 \\times 2 = 1000$<br><br>Answer: $1000$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4cbf9280d7f99327fc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow \\infty} \\frac{\\mathrm{e}^{x^4}-1}{\\mathrm{e}^{x^4}+1}=$", "image": null}, "options": [{"id": "b7Xet", "text": "$1$", "image": null, "isCorrect": true}, {"id": "St7AX", "text": "e", "image": null, "isCorrect": false}, {"id": "UjcLe", "text": "$\\frac{1}{\\mathrm{e}}$", "image": null, "isCorrect": false}, {"id": "XPRWA", "text": "not defined", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\rightarrow \\infty} \\dfrac{\\mathrm{e}^{x^4}-1}{\\mathrm{e}^{x^4}+1}$<br><br>Dividing the numerator and the denominator by $\\mathrm{e}^{x^4}$:<br><br>$L = \\lim_{x \\rightarrow \\infty} \\dfrac{1 - \\dfrac{1}{\\mathrm{e}^{x^4}}}{1 + \\dfrac{1}{\\mathrm{e}^{x^4}}}$<br><br>As $x \\rightarrow \\infty$, $x^4 \\rightarrow \\infty$, which implies $\\mathrm{e}^{x^4} \\rightarrow \\infty$ and $\\dfrac{1}{\\mathrm{e}^{x^4}} \\rightarrow 0$.<br><br>Substituting this in the limit expression:<br><br>$L = \\dfrac{1 - 0}{1 + 0} = 1$<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b40bf9280d7f9932789", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\lim _{x \\rightarrow 0} \\frac{\\left(7^x-1\\right)^4}{\\tan \\left(\\frac{x}{\\mathrm{k}}\\right) \\cdot \\log \\left(1+\\frac{x^2}{3}\\right) \\cdot \\sin 4 x}=3(\\log 7)^3$, then $\\mathrm{k}=$", "image": null}, "options": [{"id": "ogYfs", "text": "$4(\\log 7)^{-1}$", "image": null, "isCorrect": true}, {"id": "3OZDn", "text": "$\\frac{1}{4}(\\log 7)^{-1}$", "image": null, "isCorrect": false}, {"id": "m2SaS", "text": "$4 \\log \\left(\\frac{1}{7}\\right)$", "image": null, "isCorrect": false}, {"id": "0La0C", "text": "$\\frac{1}{4} \\log 7$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given limit is:<br><br>$\\lim _{x \\rightarrow 0} \\dfrac{\\left(7^x-1\\right)^4}{\\tan \\left(\\dfrac{x}{\\mathrm{k}}\\right) \\cdot \\log \\left(1+\\dfrac{x^2}{3}\\right) \\cdot \\sin 4 x} = 3(\\log 7)^3$<br><br>Dividing the numerator and the denominator by $x^4$, we get:<br><br>$\\lim _{x \\rightarrow 0} \\dfrac{\\left(\\dfrac{7^x-1}{x}\\right)^4}{\\left(\\dfrac{\\tan (x/\\mathrm{k})}{x}\\right) \\cdot \\left(\\dfrac{\\log (1+x^2/3)}{x^2}\\right) \\cdot \\left(\\dfrac{\\sin 4 x}{x}\\right)}$<br><br>Using standard limits $\\lim _{x \\rightarrow 0} \\dfrac{a^x-1}{x} = \\log a$, $\\lim _{x \\rightarrow 0} \\dfrac{\\tan \\theta}{\\theta} = 1$, $\\lim _{x \\rightarrow 0} \\dfrac{\\log(1+x)}{x} = 1$, and $\\lim _{x \\rightarrow 0} \\dfrac{\\sin \\theta}{\\theta} = 1$:<br><br>Numerator limit: $\\lim _{x \\rightarrow 0} \\left(\\dfrac{7^x-1}{x}\\right)^4 = (\\log 7)^4$<br><br>Denominator limit:<br><br>$\\lim _{x \\rightarrow 0} \\dfrac{\\tan (x/\\mathrm{k})}{x/\\mathrm{k}} \\cdot \\dfrac{1}{\\mathrm{k}} = \\dfrac{1}{\\mathrm{k}}$<br><br>$\\lim _{x \\rightarrow 0} \\dfrac{\\log (1+x^2/3)}{x^2/3} \\cdot \\dfrac{1}{3} = \\dfrac{1}{3}$<br><br>$\\lim _{x \\rightarrow 0} \\dfrac{\\sin 4 x}{4 x} \\cdot 4 = 4$<br><br>The limit of the denominator is $\\dfrac{1}{\\mathrm{k}} \\cdot \\dfrac{1}{3} \\cdot 4 = \\dfrac{4}{3\\mathrm{k}}$<br><br>Substituting these back into the expression:<br><br>$\\dfrac{(\\log 7)^4}{\\dfrac{4}{3\\mathrm{k}}} = \\dfrac{3\\mathrm{k}(\\log 7)^4}{4}$<br><br>Equating this to the given value:<br><br>$\\dfrac{3\\mathrm{k}(\\log 7)^4}{4} = 3(\\log 7)^3$<br><br>$\\dfrac{\\mathrm{k} \\log 7}{4} = 1$<br><br>$\\mathrm{k} = \\dfrac{4}{\\log 7} = 4(\\log 7)^{-1}$<br><br>Answer: $4(\\log 7)^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2dbf9280d7f99326e5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{\\mathrm{e}^{\\tan x}-\\mathrm{e}^x}{\\tan x-x}=$", "image": null}, "options": [{"id": "m0UZi", "text": "$1$", "image": null, "isCorrect": true}, {"id": "IY0BC", "text": "$0$", "image": null, "isCorrect": false}, {"id": "79WlT", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "jIod7", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given limit is $\\lim_{x \\rightarrow 0} \\dfrac{e^{\\tan x} - e^x}{\\tan x - x}$<br><br>Taking $e^x$ common in the numerator:<br><br>$= \\lim_{x \\rightarrow 0} \\dfrac{e^x (e^{\\tan x - x} - 1)}{\\tan x - x}$<br><br>$= \\lim_{x \\rightarrow 0} e^x \\times \\lim_{x \\rightarrow 0} \\dfrac{e^{\\tan x - x} - 1}{\\tan x - x}$<br><br>Since $\\tan x - x \\rightarrow 0$ as $x \\rightarrow 0$, we use the standard limit $\\lim_{t \\rightarrow 0} \\dfrac{e^t - 1}{t} = 1$.<br><br>$= e^0 \\times 1$<br><br>$= 1$<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1bbf9280d7f9932657", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)=\\frac{(27-2 x)^{\\frac{1}{3}}-3}{9-3(243+5 x)^{\\frac{1}{5}}}, x \\neq 0$ is continuous at $x=0$, then the value of $f(0)$ is", "image": null}, "options": [{"id": "JEdna", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "eqegi", "text": "$6$", "image": null, "isCorrect": false}, {"id": "FlB2r", "text": "$2$", "image": null, "isCorrect": true}, {"id": "0LphA", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since $f(x)$ is continuous at $x=0$, $f(0) = \\lim_{x \\to 0} f(x)$.<br><br>$f(0) = \\lim_{x \\to 0} \\dfrac{(27-2x)^{1/3} - 3}{9 - 3(243+5x)^{1/5}}$<br><br>This is a $\\dfrac{0}{0}$ form. Applying L'Hospital's rule, we differentiate the numerator and the denominator with respect to $x$:<br><br>$f(0) = \\lim_{x \\to 0} \\dfrac{\\dfrac{1}{3}(27-2x)^{-2/3}(-2)}{-3 \\times \\dfrac{1}{5}(243+5x)^{-4/5}(5)}$<br><br>$f(0) = \\lim_{x \\to 0} \\dfrac{-\\dfrac{2}{3}(27-2x)^{-2/3}}{-3(243+5x)^{-4/5}}$<br><br>Substituting $x=0$:<br><br>$f(0) = \\dfrac{-\\dfrac{2}{3}(27)^{-2/3}}{-3(243)^{-4/5}}$<br><br>Using $27 = 3^3$ and $243 = 3^5$:<br><br>$f(0) = \\dfrac{-\\dfrac{2}{3} \\times (3^3)^{-2/3}}{-3 \\times (3^5)^{-4/5}}$<br><br>$f(0) = \\dfrac{-\\dfrac{2}{3} \\times 3^{-2}}{-3 \\times 3^{-4}}$<br><br>$f(0) = \\dfrac{-\\dfrac{2}{3} \\times \\dfrac{1}{9}}{-3 \\times \\dfrac{1}{81}}$<br><br>$f(0) = \\dfrac{-\\dfrac{2}{27}}{-\\dfrac{1}{27}} = 2$<br><br>Answer: $2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b04bf9280d7f99325a9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow 3} \\frac{(84-x)^{\\frac{1}{4}}-3}{x-3}$ is", "image": null}, "options": [{"id": "OEBwO", "text": "$\\frac{-1}{108}$", "image": null, "isCorrect": true}, {"id": "H3XdG", "text": "$\\frac{-1}{84}$", "image": null, "isCorrect": false}, {"id": "YxhPc", "text": "$\\frac{-1}{27}$", "image": null, "isCorrect": false}, {"id": "4PvGv", "text": "$\\frac{-1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\rightarrow 3} \\dfrac{(84-x)^{\\dfrac{1}{4}}-3}{x-3}$<br><br>Let $y = 84 - x$. As $x \\rightarrow 3$, $y \\rightarrow 81$.<br><br>Also, $x - 3 = 81 - y = -(y - 81)$.<br><br>Substituting these in the limit, we get:<br><br>$L = \\lim_{y \\rightarrow 81} \\dfrac{y^{\\dfrac{1}{4}} - 81^{\\dfrac{1}{4}}}{-(y - 81)}$<br><br>$L = - \\lim_{y \\rightarrow 81} \\dfrac{y^{\\dfrac{1}{4}} - 81^{\\dfrac{1}{4}}}{y - 81}$<br><br>Using the standard limit $\\lim_{x \\rightarrow a} \\dfrac{x^n - a^n}{x - a} = n a^{n-1}$:<br><br>$L = - \\dfrac{1}{4} (81)^{\\dfrac{1}{4} - 1}$<br><br>$L = - \\dfrac{1}{4} (81)^{-\\dfrac{3}{4}}$<br><br>$L = - \\dfrac{1}{4} (3^4)^{-\\dfrac{3}{4}}$<br><br>$L = - \\dfrac{1}{4} \\times 3^{-3} = - \\dfrac{1}{4} \\times \\dfrac{1}{27} = \\dfrac{-1}{108}$<br><br>Answer: $\\frac{-1}{108}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144d0aee93fa0796df8e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "$\\lim _{y \\rightarrow 0} \\frac{\\sqrt{1+\\sqrt{1+y^4}}-\\sqrt{2}}{y^4}=$", "image": null}, "options": [{"id": "XoSjP", "text": "0", "image": null, "isCorrect": false}, {"id": "k2thD", "text": "$\\frac{1}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "S2zw8", "text": "$\\frac{1}{4 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "wgE7z", "text": "$\\frac{1}{2 \\sqrt{2}(\\sqrt{2}+1)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rationalizing the numerator by multiplying and dividing by $\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2}$:<br><br>$\\lim_{y \\rightarrow 0} \\dfrac{\\sqrt{1+\\sqrt{1+y^4}}-\\sqrt{2}}{y^4}$<br><br>$= \\lim_{y \\rightarrow 0} \\dfrac{(\\sqrt{1+\\sqrt{1+y^4}}-\\sqrt{2})(\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2})}{y^4(\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2})}$<br><br>$= \\lim_{y \\rightarrow 0} \\dfrac{1+\\sqrt{1+y^4}-2}{y^4(\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2})}$<br><br>$= \\lim_{y \\rightarrow 0} \\dfrac{\\sqrt{1+y^4}-1}{y^4(\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2})}$<br><br>Rationalizing the numerator again by multiplying and dividing by $\\sqrt{1+y^4}+1$:<br><br>$= \\lim_{y \\rightarrow 0} \\dfrac{(\\sqrt{1+y^4}-1)(\\sqrt{1+y^4}+1)}{y^4(\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2})(\\sqrt{1+y^4}+1)}$<br><br>$= \\lim_{y \\rightarrow 0} \\dfrac{1+y^4-1}{y^4(\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2})(\\sqrt{1+y^4}+1)}$<br><br>$= \\lim_{y \\rightarrow 0} \\dfrac{y^4}{y^4(\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2})(\\sqrt{1+y^4}+1)}$<br><br>$= \\lim_{y \\rightarrow 0} \\dfrac{1}{(\\sqrt{1+\\sqrt{1+y^4}}+\\sqrt{2})(\\sqrt{1+y^4}+1)}$<br><br>Substituting $y = 0$:<br><br>$= \\dfrac{1}{(\\sqrt{1+\\sqrt{1+0}}+\\sqrt{2})(\\sqrt{1+0}+1)}$<br><br>$= \\dfrac{1}{(\\sqrt{2}+\\sqrt{2})(1+1)}$<br><br>$= \\dfrac{1}{(2\\sqrt{2})(2)}$<br><br>$= \\dfrac{1}{4\\sqrt{2}}$<br><br>Answer: $\\frac{1}{4 \\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143a0aee93fa0796def8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The value of $\\lim _{x \\rightarrow 0}\\left((\\sin x)^{\\frac{1}{x}}+\\left(\\frac{1}{x}\\right)^{\\sin x}\\right)$, where $x\\gt0$ is", "image": null}, "options": [{"id": "BKePJ", "text": "0", "image": null, "isCorrect": false}, {"id": "oN7sw", "text": "-1", "image": null, "isCorrect": false}, {"id": "1IJrO", "text": "1", "image": null, "isCorrect": true}, {"id": "YZ1u8", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the given limit be $L = L_1 + L_2$, where $L_1 = \\lim_{x \\rightarrow 0^+} (\\sin x)^{\\dfrac{1}{x}}$ and $L_2 = \\lim_{x \\rightarrow 0^+} \\left(\\dfrac{1}{x}\\right)^{\\sin x}$.<br><br>For $L_1$, as $x \\rightarrow 0^+$, $\\sin x \\rightarrow 0^+$ and $\\dfrac{1}{x} \\rightarrow \\infty$.<br><br>Thus, $L_1$ is of the form $0^{\\infty}$, which evaluates to $0$. So, $L_1 = 0$.<br><br>For $L_2$, let $y = \\left(\\dfrac{1}{x}\\right)^{\\sin x}$. Taking the natural logarithm on both sides:<br><br>$\\ln y = \\sin x \\ln\\left(\\dfrac{1}{x}\\right) = -\\sin x \\ln x$<br><br>Taking the limit as $x \\rightarrow 0^+$:<br><br>$\\lim_{x \\rightarrow 0^+} \\ln y = \\lim_{x \\rightarrow 0^+} \\left( -\\dfrac{\\sin x}{x} \\cdot x \\ln x \\right)$<br><br>We know that $\\lim_{x \\rightarrow 0^+} \\dfrac{\\sin x}{x} = 1$ and $\\lim_{x \\rightarrow 0^+} x \\ln x = 0$.<br><br>$\\lim_{x \\rightarrow 0^+} \\ln y = -1 \\times 0 = 0$<br><br>Therefore, $L_2 = \\lim_{x \\rightarrow 0^+} y = e^0 = 1$.<br><br>The required limit is $L = L_1 + L_2 = 0 + 1 = 1$.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142a0aee93fa0796de80", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 2} \\frac{3^x+3^{3-x}-12}{3^{3-x}-3^{\\frac{x}{2}}}=$", "image": null}, "options": [{"id": "cbljs", "text": "$-\\frac{4}{3}$", "image": null, "isCorrect": true}, {"id": "fmnMi", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": false}, {"id": "bX8OE", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "sX0s3", "text": "$-\\frac{4}{9}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $3^{\\dfrac{x}{2}} = t$. As $x \\rightarrow 2$, $t \\rightarrow 3$.<br><br>The given limit can be rewritten in terms of $t$ as:<br><br>$\\lim_{t \\rightarrow 3} \\dfrac{t^2 + \\dfrac{27}{t^2} - 12}{\\dfrac{27}{t^2} - t}$<br><br>Multiplying the numerator and the denominator by $t^2$, we get:<br><br>$\\lim_{t \\rightarrow 3} \\dfrac{t^4 - 12t^2 + 27}{27 - t^3}$<br><br>Factorizing the numerator and the denominator:<br><br>$\\lim_{t \\rightarrow 3} \\dfrac{(t^2 - 9)(t^2 - 3)}{(3 - t)(9 + 3t + t^2)}$<br><br>$\\lim_{t \\rightarrow 3} \\dfrac{(t - 3)(t + 3)(t^2 - 3)}{-(t - 3)(t^2 + 3t + 9)}$<br><br>Canceling the common factor $(t - 3)$ since $t \\neq 3$:<br><br>$\\lim_{t \\rightarrow 3} \\dfrac{(t + 3)(t^2 - 3)}{-(t^2 + 3t + 9)}$<br><br>Substituting $t = 3$ into the simplified expression:<br><br>$\\dfrac{(3 + 3)(3^2 - 3)}{-(3^2 + 3(3) + 9)}$<br><br>$\\dfrac{6 \\times 6}{-27} = -\\dfrac{36}{27} = -\\dfrac{4}{3}$<br><br>Answer: $-\\frac{4}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ec0aee93fa0796dc95", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow 2}\\left(\\frac{5^x+5^{3-x}-30}{5^{3-x}-5^{\\frac{x}{2}}}\\right)=$", "image": null}, "options": [{"id": "3TZhx", "text": "$\\frac{-16}{3}$", "image": null, "isCorrect": false}, {"id": "e1v9E", "text": "$\\frac{8}{3}$", "image": null, "isCorrect": false}, {"id": "18ZWu", "text": "$\\frac{-8}{3}$", "image": null, "isCorrect": true}, {"id": "VI15G", "text": "$\\frac{16}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $5^{\\dfrac{x}{2}} = t$. As $x \\rightarrow 2$, $t \\rightarrow 5$.<br><br>The given limit can be rewritten in terms of $t$ as:<br><br>$\\lim_{t \\rightarrow 5} \\dfrac{t^2 + \\dfrac{125}{t^2} - 30}{\\dfrac{125}{t^2} - t}$<br><br>Multiplying the numerator and the denominator by $t^2$, we get:<br><br>$\\lim_{t \\rightarrow 5} \\dfrac{t^4 - 30t^2 + 125}{125 - t^3}$<br><br>Factorizing the numerator and the denominator:<br><br>$\\lim_{t \\rightarrow 5} \\dfrac{(t^2 - 25)(t^2 - 5)}{-(t^3 - 125)}$<br><br>$\\lim_{t \\rightarrow 5} \\dfrac{(t - 5)(t + 5)(t^2 - 5)}{-(t - 5)(t^2 + 5t + 25)}$<br><br>Cancelling the common factor $(t - 5)$ since $t \\neq 5$:<br><br>$\\lim_{t \\rightarrow 5} \\dfrac{(t + 5)(t^2 - 5)}{-(t^2 + 5t + 25)}$<br><br>Substituting $t = 5$ into the simplified expression:<br><br>$\\dfrac{(5 + 5)(5^2 - 5)}{-(5^2 + 5(5) + 25)}$<br><br>$\\dfrac{10 \\times 20}{-(25 + 25 + 25)}$<br><br>$\\dfrac{200}{-75} = \\dfrac{-8}{3}$<br><br>Answer: $\\frac{-8}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213dd0aee93fa0796dc20", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\dfrac{9^x-4^x}{x\\left(9^x+4^x\\right)}=$", "image": null}, "options": [{"id": "cRxCK", "text": "$\\quad \\log \\left(\\dfrac{3}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "A5tTX", "text": "$\\dfrac{1}{2} \\log \\left(\\dfrac{3}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "yJQcd", "text": "$\\quad 2 \\log \\left(\\dfrac{3}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "lUjW0", "text": "$2 \\log \\left(\\dfrac{9}{4}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim_{x \\rightarrow 0} \\dfrac{9^x-4^x}{x\\left(9^x+4^x\\right)}$<br><br>$= \\lim_{x \\rightarrow 0} \\dfrac{1}{9^x+4^x} \\times \\left( \\dfrac{9^x-1}{x} - \\dfrac{4^x-1}{x} \\right)$<br><br>Using the standard limit $\\lim_{x \\rightarrow 0} \\dfrac{a^x-1}{x} = \\log a$,<br><br>$= \\dfrac{1}{9^0+4^0} \\times (\\log 9 - \\log 4)$<br><br>$= \\dfrac{1}{1+1} \\times \\log \\left(\\dfrac{9}{4}\\right)$<br><br>$= \\dfrac{1}{2} \\log \\left(\\left(\\dfrac{3}{2}\\right)^2\\right)$<br><br>$= \\dfrac{1}{2} \\times 2 \\log \\left(\\dfrac{3}{2}\\right)$<br><br>$= \\log \\left(\\dfrac{3}{2}\\right)$<br><br>Answer: $\\quad \\log \\left(\\dfrac{3}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a10aee93fa0796da47", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "If $\\lim _{x \\rightarrow \\infty}\\left(\\dfrac{x^2+x+1}{x+1}-a x-b\\right)=4$ then", "image": null}, "options": [{"id": "fe7be", "text": "$\\mathrm{a}=1, \\mathrm{~b}=4$", "image": null, "isCorrect": false}, {"id": "A2fsZ", "text": "$\\mathrm{a}=1, \\mathrm{~b}=-4$", "image": null, "isCorrect": true}, {"id": "Iz1xg", "text": "$\\quad \\mathrm{a}=2, \\mathrm{~b}=-3$", "image": null, "isCorrect": false}, {"id": "dahXJ", "text": "$\\mathrm{a}=2, \\mathrm{~b}=3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow \\infty}\\left(\\dfrac{x^2+x+1}{x+1}-a x-b\\right)=4$<br><br>$\\lim _{x \\rightarrow \\infty}\\left(\\dfrac{x^2+x+1 - (ax+b)(x+1)}{x+1}\\right)=4$<br><br>$\\lim _{x \\rightarrow \\infty}\\left(\\dfrac{x^2(1-a) + x(1-a-b) + (1-b)}{x+1}\\right)=4$<br><br>For the limit to be finite, the degree of the numerator must be less than or equal to the degree of the denominator. Therefore, the coefficient of $x^2$ must be zero.<br><br>$1 - a = 0 \\Rightarrow a = 1$<br><br>Substituting $a = 1$ into the limit expression:<br><br>$\\lim _{x \\rightarrow \\infty}\\left(\\dfrac{-bx + 1-b}{x+1}\\right)=4$<br><br>Dividing the numerator and denominator by $x$:<br><br>$\\lim _{x \\rightarrow \\infty}\\left(\\dfrac{-b + \\dfrac{1-b}{x}}{1 + \\dfrac{1}{x}}\\right) = -b$<br><br>Given that the limit is $4$, we have:<br><br>$-b = 4 \\Rightarrow b = -4$<br><br>Thus, $a = 1$ and $b = -4$.<br><br>Answer: $\\mathrm{a}=1, \\mathrm{~b}=-4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213900aee93fa0796d9c2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If $\\lim _{x \\rightarrow 1} \\dfrac{x^2-\\mathrm{a} x+\\mathrm{b}}{x-1}=7$, then $\\mathrm{a}+\\mathrm{b}$ is equal to", "image": null}, "options": [{"id": "9k8I9", "text": "-1", "image": null, "isCorrect": false}, {"id": "AHFCf", "text": "1", "image": null, "isCorrect": false}, {"id": "GTqjY", "text": "-11", "image": null, "isCorrect": true}, {"id": "YiSO8", "text": "11", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the limit to exist and be finite, the numerator must be zero when $x = 1$.<br><br>$1^2 - a(1) + b = 0 \\Rightarrow b = a - 1$<br><br>Substituting $b = a - 1$ into the limit:<br><br>$\\lim_{x \\rightarrow 1} \\dfrac{x^2 - ax + a - 1}{x - 1} = 7$<br><br>$\\lim_{x \\rightarrow 1} \\dfrac{(x^2 - 1) - a(x - 1)}{x - 1} = 7$<br><br>$\\lim_{x \\rightarrow 1} \\dfrac{(x - 1)(x + 1 - a)}{x - 1} = 7$<br><br>$\\lim_{x \\rightarrow 1} (x + 1 - a) = 7$<br><br>$1 + 1 - a = 7 \\Rightarrow a = -5$<br><br>Substituting $a = -5$ into $b = a - 1$:<br><br>$b = -5 - 1 = -6$<br><br>Therefore, $a + b = -5 - 6 = -11$<br><br>Answer: -11", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132d0aee93fa0796d6be", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "If $\\mathrm{f}(x)=\\dfrac{1+\\cos \\pi x}{\\pi(1-x)^2}$, for $x \\neq 1$ is continuous at $x=1$, then $\\mathrm{f}(1)$ is equal to", "image": null}, "options": [{"id": "9iQiO", "text": "$\\dfrac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "86s6K", "text": "$\\dfrac{2}{\\pi}$", "image": null, "isCorrect": false}, {"id": "iegRH", "text": "$\\dfrac{\\pi^2}{4}$", "image": null, "isCorrect": false}, {"id": "Ujie1", "text": "$\\dfrac{4}{\\pi^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since $\\mathrm{f}(x)$ is continuous at $x=1$, $\\mathrm{f}(1) = \\lim_{x \\to 1} \\mathrm{f}(x)$<br><br>$\\mathrm{f}(1) = \\lim_{x \\to 1} \\dfrac{1+\\cos \\pi x}{\\pi(1-x)^2}$<br><br>Let $x = 1 - h$. As $x \\to 1$, $h \\to 0$.<br><br>$\\mathrm{f}(1) = \\lim_{h \\to 0} \\dfrac{1+\\cos(\\pi(1-h))}{\\pi h^2}$<br><br>$\\mathrm{f}(1) = \\lim_{h \\to 0} \\dfrac{1-\\cos(\\pi h)}{\\pi h^2}$<br><br>$\\mathrm{f}(1) = \\lim_{h \\to 0} \\dfrac{2\\sin^2\\left(\\dfrac{\\pi h}{2}\\right)}{\\pi h^2}$<br><br>$\\mathrm{f}(1) = \\lim_{h \\to 0} \\dfrac{2}{\\pi} \\left( \\dfrac{\\sin\\left(\\dfrac{\\pi h}{2}\\right)}{\\dfrac{\\pi h}{2}} \\right)^2 \\left( \\dfrac{\\pi^2}{4} \\right)$<br><br>$\\mathrm{f}(1) = \\dfrac{2}{\\pi} (1) \\left( \\dfrac{\\pi^2}{4} \\right) = \\dfrac{\\pi}{2}$<br><br>Answer: $\\dfrac{\\pi}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132c0aee93fa0796d6b7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The value of $\\lim _{x \\rightarrow 0} \\dfrac{x}{|x|+x^2}$ is .", "image": null}, "options": [{"id": "g21c0", "text": "1", "image": null, "isCorrect": false}, {"id": "8UjZu", "text": "-1", "image": null, "isCorrect": false}, {"id": "y1YxU", "text": "0", "image": null, "isCorrect": false}, {"id": "u1TPN", "text": "does not exist.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Evaluating the right-hand limit as $x \\rightarrow 0^+$:<br><br>For $x > 0$, $|x| = x$.<br><br>$\\lim _{x \\rightarrow 0^+} \\dfrac{x}{x+x^2} = \\lim _{x \\rightarrow 0^+} \\dfrac{x}{x(1+x)} = \\lim _{x \\rightarrow 0^+} \\dfrac{1}{1+x} = 1$<br><br>Evaluating the left-hand limit as $x \\rightarrow 0^-$:<br><br>For $x < 0$, $|x| = -x$.<br><br>$\\lim _{x \\rightarrow 0^-} \\dfrac{x}{-x+x^2} = \\lim _{x \\rightarrow 0^-} \\dfrac{x}{x(-1+x)} = \\lim _{x \\rightarrow 0^-} \\dfrac{1}{-1+x} = -1$<br><br>Since the left-hand limit is not equal to the right-hand limit, the limit does not exist.<br><br>Answer: does not exist.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262010279619d9d8a3108", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow 2}\\left[\\frac{1}{x-2}-\\frac{2}{x^3-3 x^2+2 x}\\right]$ is equal to", "image": null}, "options": [{"id": "DhEH9", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "9j98E", "text": "$\\frac{-2}{3}$", "image": null, "isCorrect": false}, {"id": "eDBxw", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": true}, {"id": "qZJg5", "text": "$\\frac{-3}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 2}\\left[\\frac{1}{x-2}-\\frac{2}{x\\left(x^2-3 x+2\\right)}\\right] \\\\ & =\\lim _{x \\rightarrow 2}\\left[\\frac{1}{(x-2)}-\\frac{2}{x(x-2)(x-1)}\\right] \\\\ & =\\lim _{x \\rightarrow 2}\\left[\\frac{x^2-x-2}{x(x-1)(x-2)}\\right] \\\\ & =\\lim _{x \\rightarrow 2} \\frac{(x-2)(x+1)}{x(x-1)(x-2)} \\\\ & =\\lim _{x \\rightarrow 2} \\frac{x+1}{x(x-1)} \\\\ & =\\frac{3}{2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f10279619d9d8a3093", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow a} \\frac{\\sqrt{a+2 x}-\\sqrt{3 x}}{\\sqrt{3 a+x}-2 \\sqrt{x}}=$", "image": null}, "options": [{"id": "TMy3Z", "text": "$\\frac{1}{3 \\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "ZYpRV", "text": "$\\frac{2}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "IcBFH", "text": "$\\frac{2}{3 \\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "p3j81", "text": "$\\frac{-2}{3 \\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow a} \\frac{\\sqrt{a+2 x}-\\sqrt{3 x}}{\\sqrt{3 a+x}-2 \\sqrt{x}} \\\\ & =\\lim _{x \\rightarrow a} \\frac{(\\sqrt{a+2 x}-\\sqrt{3 x})(\\sqrt{a+2 x}+\\sqrt{3 x})(\\sqrt{3 a+x}+2 \\sqrt{x})}{(\\sqrt{3 a+x}-2 \\sqrt{x})(\\sqrt{3 a+x}+2 \\sqrt{x})(\\sqrt{a+2 x}+\\sqrt{3 x})} \\\\ & =\\lim _{x \\rightarrow a} \\frac{(a+2 x-3 x)(\\sqrt{3 a+x}+2 \\sqrt{x})}{(3 a+x-4 x)(\\sqrt{a+2 x}+\\sqrt{3 x})} \\\\ & =\\frac{(\\sqrt{3 a+a}+2 \\sqrt{a})}{3(\\sqrt{a+2 a}+\\sqrt{3 a})} \\\\ & =\\frac{1}{3} \\cdot \\frac{(2 \\sqrt{a}+2 \\sqrt{a})}{(\\sqrt{3 a}+\\sqrt{3 a})} \\\\ & =\\frac{4 \\sqrt{a}}{6 \\sqrt{3 a}} \\\\ & =\\frac{2}{3 \\sqrt{3}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261db0279619d9d8a2fe0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The value of $\\lim _{x \\rightarrow a} \\frac{\\sqrt{a+2 x}-\\sqrt{3 x}}{\\sqrt{3 a+x}-2 \\sqrt{x}}$ is", "image": null}, "options": [{"id": "i5q0f", "text": "$\\frac{1}{3 \\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "oDMgO", "text": "$\\frac{2}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "RcvrX", "text": "$\\frac{2}{3 \\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "dXrkK", "text": "$\\frac{4}{3 \\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow a} \\frac{\\sqrt{a+2 x}-\\sqrt{3 x}}{\\sqrt{3 a+x}-2 \\sqrt{x}} \\\\ & =\\lim _{x \\rightarrow a} \\frac{(\\sqrt{a+2 x}-\\sqrt{3 x})(\\sqrt{a+2 x}+\\sqrt{3 x})(\\sqrt{3 a+x}+2 \\sqrt{x})}{(\\sqrt{3 a+x}-2 \\sqrt{x})(\\sqrt{3 a+x}+2 \\sqrt{x})(\\sqrt{a+2 x}+\\sqrt{3 x})} \\\\ & =\\lim _{x \\rightarrow a} \\frac{(a+2 x-3 x)(\\sqrt{3 a+x}+2 \\sqrt{x})}{(3 a+x-4 x)(\\sqrt{a+2 x}+\\sqrt{3 x})} \\\\ & =\\lim _{x \\rightarrow a} \\frac{(a-x)(\\sqrt{3 a+x}+2 \\sqrt{x})}{3(a-x)(\\sqrt{a+2 x}+\\sqrt{3 x})}\\end{aligned}$\n$\\begin{aligned}\n& =\\frac{1}{3} \\cdot \\frac{(\\sqrt{3 a+a}+2 \\sqrt{a})}{(\\sqrt{a+2 a}+\\sqrt{3 a})} \\\\\n& =\\frac{4 \\sqrt{a}}{3 \\times 2 \\times \\sqrt{3} \\cdot \\sqrt{a}} \\\\\n& =\\frac{2}{3 \\sqrt{3}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a20279619d9d8a2e1d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "6
