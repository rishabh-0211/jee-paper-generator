w \\infty\\right]$\n$=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5b0279619d9d8a13c4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{\\cos a x-\\cos b x}{x^{2}}$ is equal to", "image": null}, "options": [{"id": "suOj4", "text": "$\\frac{a^{2}-b^{2}}{2}$", "image": null, "isCorrect": false}, {"id": "5OmHC", "text": "$\\frac{b^{2}-a^{2}}{2}$", "image": null, "isCorrect": true}, {"id": "OTSwy", "text": "$a^{2}-b^{2}$", "image": null, "isCorrect": false}, {"id": "8yQre", "text": "$b^{2}-a^{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow 0} \\frac{\\cos a x-\\cos b x}{x^{2}}$\n$=\\lim _{x \\rightarrow 0} \\frac{-a \\sin a x+b \\sin b x}{2 x}$ (using L'Hospital's rule)\n$=\\lim _{x \\rightarrow 0} \\frac{-a^{2} \\cos a x+b^{2} \\sin b x}{2}$\n$=\\frac{b^{2}-a^{2}}{2}$ (using L'Hospital's rule)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e470279619d9d8a1328", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The value of $\\lim _{x \\rightarrow 0} \\frac{\\cos (\\sin x)-\\cos x}{x^{4}}$ is equal to", "image": null}, "options": [{"id": "bK2Fv", "text": "$1 / 5$", "image": null, "isCorrect": false}, {"id": "nEH0y", "text": "$1 / 6$", "image": null, "isCorrect": true}, {"id": "4kxYY", "text": "$1 / 4$", "image": null, "isCorrect": false}, {"id": "5cBpb", "text": "$1 / 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{l}\n\\lim _{x \\rightarrow 0} \\frac{\\cos (\\sin x)-\\cos x}{x^{4}} \\\\\n=\\lim _{x \\rightarrow 0} \\frac{2 \\sin \\left(\\frac{x+\\sin x}{2}\\right) \\sin \\left(\\frac{x-\\sin x}{2}\\right)}{x^{4}} \\\\\n=2 \\lim _{x \\rightarrow 0}\\left[\\frac{\\sin \\left(\\frac{x+\\sin x}{2}\\right)}{\\left(\\frac{x+\\sin x}{2}\\right)} \\times \\frac{\\sin \\left(\\frac{x-\\sin x}{2}\\right)}{\\left(\\frac{x-\\sin x}{2}\\right)}\\right. \\\\\n\\left.\\times\\left(\\frac{x+\\sin x}{2 x}\\right)\\left(\\frac{x-\\sin x}{2 x^{3}}\\right)\\right] \\\\\n=2 \\lim _{x \\rightarrow 0}\\left[\\frac{\\sin \\left(\\frac{x+\\sin x}{2}\\right)}{\\frac{x+\\sin x}{2}} \\times \\frac{\\sin \\left(\\frac{x-\\sin x}{2}\\right)}{\\frac{x-\\sin x}{2}}\\right. \\\\\n=\\lim _{x \\rightarrow 0} \\frac{x-\\sin x}{x^{3}}=\\lim _{x \\rightarrow 0} \\frac{x-\\left(x-\\frac{x^{3}}{3 !}+\\frac{x^{5}}{5 !}-\\ldots\\right)}{x^{3}} \\\\\n=\\lim _{x \\rightarrow 0}\\left(\\frac{1}{3 !}-\\frac{x^{2}}{5 !}+\\ldots\\right)=\\frac{1}{6}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2633c0279619d9d8a3d4e", "title": "Exponential and logarithmic limits", "totalQuestions": 13, "questions": [{"_id": "6abb88b515a9fc0fc8c1463e", "type": "singleCorrect", "question": {"text": "$\\lim\\limits_{h \\to 0} \\dfrac{\\log_e(1 + 2h) - 2\\log_e(1 + h)}{h^2}$", "image": null}, "options": [{"id": "TQGEV", "label": "A", "text": "$-1$", "isCorrect": true, "image": null}, {"id": "XNafR", "label": "B", "text": "$\\infty$", "isCorrect": false, "image": null}, {"id": "Yc2t2", "label": "C", "text": "$e$", "isCorrect": false, "image": null}, {"id": "wl8PA", "label": "D", "text": "$\\dfrac{1}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given limit is of the form $\\dfrac{0}{0}$.<br><br>Applying L'Hospital's rule by differentiating the numerator and the denominator with respect to $h$:<br><br>$\\lim\\limits_{h \\to 0} \\dfrac{\\dfrac{2}{1 + 2h} - \\dfrac{2}{1 + h}}{2h}$<br><br>Simplifying the numerator:<br><br>$\\dfrac{2}{1 + 2h} - \\dfrac{2}{1 + h} = \\dfrac{2(1 + h) - 2(1 + 2h)}{(1 + 2h)(1 + h)} = \\dfrac{-2h}{(1 + 2h)(1 + h)}$<br><br>Substituting this back into the limit:<br><br>$\\lim\\limits_{h \\to 0} \\dfrac{-2h}{2h(1 + 2h)(1 + h)}$<br><br>Canceling $2h$ from the numerator and the denominator:<br><br>$\\lim\\limits_{h \\to 0} \\dfrac{-1}{(1 + 2h)(1 + h)}$<br><br>Substituting $h = 0$:<br><br>$\\dfrac{-1}{(1 + 0)(1 + 0)} = -1$<br><br>Answer: $-1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888515a9fc0fc8c1447d", "type": "singleCorrect", "question": {"text": "If the function $f(x)$ is defined as below<br>$f(x) = \\begin{cases} \\dfrac{(3^x + 3^{-x} - 2)\\log(1 + 4x)}{(1 - \\cos 4x)\\tan(2x)}, & x \\neq 0 \\\\ \\dfrac{(\\log p)^r}{q}, & x = 0 \\end{cases}$<br>is continuous at $x = 0$ then $p + q - r = \\ldots$", "image": null}, "options": [{"id": "SM2EG", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "fi5wC", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "KUG10", "label": "C", "text": "$5$", "isCorrect": true, "image": null}, {"id": "fnwPW", "label": "D", "text": "$7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For $f(x)$ to be continuous at $x = 0$, we must have $\\lim_{x \\to 0} f(x) = f(0)$.<br><br>$\\lim_{x \\to 0} \\dfrac{(3^x + 3^{-x} - 2)\\log(1 + 4x)}{(1 - \\cos 4x)\\tan(2x)}$<br><br>$= \\lim_{x \\to 0} \\dfrac{3^{-x}(3^x - 1)^2 \\log(1 + 4x)}{2\\sin^2(2x)\\tan(2x)}$<br><br>Dividing and multiplying by appropriate powers of $x$ to use standard limits:<br><br>$= \\lim_{x \\to 0} 3^{-x} \\left(\\dfrac{3^x - 1}{x}\\right)^2 \\cdot \\dfrac{\\log(1 + 4x)}{4x} \\cdot \\dfrac{(2x)^2}{\\sin^2(2x)} \\cdot \\dfrac{2x}{\\tan(2x)} \\cdot \\dfrac{4x^3}{2(2x)^2(2x)}$<br><br>Using the standard limits $\\lim_{x \\to 0} \\dfrac{a^x - 1}{x} = \\log a$, $\\lim_{x \\to 0} \\dfrac{\\log(1+x)}{x} = 1$, $\\lim_{x \\to 0} \\dfrac{\\sin x}{x} = 1$, and $\\lim_{x \\to 0} \\dfrac{\\tan x}{x} = 1$:<br><br>$= 1 \\cdot (\\log 3)^2 \\cdot 1 \\cdot 1^2 \\cdot 1 \\cdot \\dfrac{4}{16}$<br><br>$= \\dfrac{(\\log 3)^2}{4}$<br><br>Given $f(0) = \\dfrac{(\\log p)^r}{q}$, we equate the two values:<br><br>$\\dfrac{(\\log 3)^2}{4} = \\dfrac{(\\log p)^r}{q}$<br><br>Comparing the terms, we get $p = 3$, $q = 4$, and $r = 2$.<br><br>Therefore, $p + q - r = 3 + 4 - 2 = 5$.<br><br>Answer: $5$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3568c30a4553e1be2a8", "type": "singleCorrect", "question": {"text": "$\\lim\\limits_{x \\to 0}\\left[\\dfrac{x \\cdot \\log(1 + 4x)}{\\left(e^{4x} - 1\\right)^2}\\right] = \\cdots$", "image": null}, "options": [{"id": "uqjGQ", "label": "A", "text": "$\\dfrac{1}{4}$", "isCorrect": true, "image": null}, {"id": "Fhn0t", "label": "B", "text": "$\\dfrac{1}{16}$", "isCorrect": false, "image": null}, {"id": "eqUmk", "label": "C", "text": "$\\dfrac{1}{3}$", "isCorrect": false, "image": null}, {"id": "KR1d6", "label": "D", "text": "$\\dfrac{1}{9}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\lim\\limits_{x \\to 0} \\left[ \\dfrac{x \\cdot \\log(1 + 4x)}{\\left(e^{4x} - 1\\right)^2} \\right]$<br><br>Multiplying and dividing by appropriate powers of $4x$:<br><br>$= \\lim\\limits_{x \\to 0} \\left[ \\dfrac{x \\cdot \\dfrac{\\log(1 + 4x)}{4x} \\cdot 4x}{\\left(\\dfrac{e^{4x} - 1}{4x} \\cdot 4x\\right)^2} \\right]$<br><br>$= \\lim\\limits_{x \\to 0} \\left[ \\dfrac{4x^2 \\cdot \\dfrac{\\log(1 + 4x)}{4x}}{16x^2 \\cdot \\left(\\dfrac{e^{4x} - 1}{4x}\\right)^2} \\right]$<br><br>$= \\dfrac{4}{16} \\cdot \\dfrac{\\lim\\limits_{x \\to 0} \\dfrac{\\log(1 + 4x)}{4x}}{\\left(\\lim\\limits_{x \\to 0} \\dfrac{e^{4x} - 1}{4x}\\right)^2}$<br><br>Using the standard limits $\\lim\\limits_{u \\to 0} \\dfrac{\\log(1 + u)}{u} = 1$ and $\\lim\\limits_{u \\to 0} \\dfrac{e^u - 1}{u} = 1$:<br><br>$= \\dfrac{1}{4} \\cdot \\dfrac{1}{(1)^2} = \\dfrac{1}{4}$<br><br>Answer: $\\dfrac{1}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d78c30a4553e1bdd62", "type": "singleCorrect", "question": {"text": "If $\\lim\\limits_{x \\to 0}\\dfrac{45^x - 9^x - 5^x + 1}{(k^x - 1)(3^x - 1)} = 2$, then the value of $k$ is ...", "image": null}, "options": [{"id": "6G6N3", "label": "A", "text": "$45$", "isCorrect": false, "image": null}, {"id": "8HmRF", "label": "B", "text": "$9$", "isCorrect": false, "image": null}, {"id": "Yq8QW", "label": "C", "text": "$5$", "isCorrect": true, "image": null}, {"id": "qDbL4", "label": "D", "text": "$3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given limit is $\\lim\\limits_{x \\to 0}\\dfrac{45^x - 9^x - 5^x + 1}{(k^x - 1)(3^x - 1)} = 2$<br><br>Factorizing the numerator:<br><br>$45^x - 9^x - 5^x + 1 = 9^x(5^x - 1) - 1(5^x - 1) = (9^x - 1)(5^x - 1)$<br><br>Substituting this back into the limit:<br><br>$\\lim\\limits_{x \\to 0}\\dfrac{(9^x - 1)(5^x - 1)}{(k^x - 1)(3^x - 1)} = 2$<br><br>Dividing the numerator and the denominator by $x^2$:<br><br>$\\lim\\limits_{x \\to 0}\\dfrac{\\dfrac{9^x - 1}{x} \\cdot \\dfrac{5^x - 1}{x}}{\\dfrac{k^x - 1}{x} \\cdot \\dfrac{3^x - 1}{x}} = 2$<br><br>Using the standard limit $\\lim\\limits_{x \\to 0}\\dfrac{a^x - 1}{x} = \\ln a$, we get:<br><br>$\\dfrac{\\ln 9 \\cdot \\ln 5}{\\ln k \\cdot \\ln 3} = 2$<br><br>Since $\\ln 9 = \\ln(3^2) = 2 \\ln 3$, the equation becomes:<br><br>$\\dfrac{2 \\ln 3 \\cdot \\ln 5}{\\ln k \\cdot \\ln 3} = 2$<br><br>$\\dfrac{2 \\ln 5}{\\ln k} = 2$<br><br>$\\ln k = \\ln 5$<br><br>$k = 5$<br><br>Answer: $5$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31d8c30a4553e1be050", "type": "singleCorrect", "question": {"text": "If $\\lim\\limits_{x \\to 0} \\dfrac{(4^x - 1)^3}{\\tan\\left(\\dfrac{x}{4}\\right)\\log\\left(1 + \\dfrac{x^2}{3}\\right)} = 96(\\log a)^b$, then $(a + b) = $", "image": null}, "options": [{"id": "rLFrT", "label": "A", "text": "$5$", "isCorrect": true, "image": null}, {"id": "PfVle", "label": "B", "text": "$7$", "isCorrect": false, "image": null}, {"id": "wgZzr", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "Ytu4R", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given limit is $\\lim\\limits_{x \\to 0} \\dfrac{(4^x - 1)^3}{\\tan\\left(\\dfrac{x}{4}\\right)\\log\\left(1 + \\dfrac{x^2}{3}\\right)}$.<br><br>Dividing the numerator and the denominator by $x^3$, we get:<br><br>$\\lim\\limits_{x \\to 0} \\dfrac{\\left(\\dfrac{4^x - 1}{x}\\right)^3}{\\dfrac{\\tan\\left(\\dfrac{x}{4}\\right)}{x} \\cdot \\dfrac{\\log\\left(1 + \\dfrac{x^2}{3}\\right)}{x^2}}$<br><br>Using the standard limits $\\lim\\limits_{x \\to 0} \\dfrac{a^x - 1}{x} = \\log a$, $\\lim\\limits_{x \\to 0} \\dfrac{\\tan x}{x} = 1$, and $\\lim\\limits_{x \\to 0} \\dfrac{\\log(1 + x)}{x} = 1$, we can rewrite the limit as:<br><br>$\\lim\\limits_{x \\to 0} \\dfrac{\\left(\\dfrac{4^x - 1}{x}\\right)^3}{\\dfrac{\\tan\\left(\\dfrac{x}{4}\\right)}{\\dfrac{x}{4}} \\cdot \\dfrac{1}{4} \\cdot \\dfrac{\\log\\left(1 + \\dfrac{x^2}{3}\\right)}{\\dfrac{x^2}{3}} \\cdot \\dfrac{1}{3}}$<br><br>Evaluating the limits, we get:<br><br>$\\dfrac{(\\log 4)^3}{1 \\cdot \\dfrac{1}{4} \\cdot 1 \\cdot \\dfrac{1}{3}} = 12(\\log 4)^3$<br><br>Since $\\log 4 = \\log(2^2) = 2\\log 2$, we have:<br><br>$12(2\\log 2)^3 = 12 \\cdot 8(\\log 2)^3 = 96(\\log 2)^3$<br><br>Comparing this with the given expression $96(\\log a)^b$, we get $a = 2$ and $b = 3$.<br><br>Therefore, $a + b = 2 + 3 = 5$.<br><br>Answer: $5$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213560aee93fa0796d7fc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Let $\\alpha(a)$ and $\\beta(a)$ be the roots of the equation $(\\sqrt[3]{1+a}-1) x^2+(\\sqrt{1+a}-1) x+(\\sqrt[6]{1+a}-1)=0$ where $a\\gt-1$ then $\\lim _{a \\rightarrow 0^{+}} \\alpha(a)$ and $\\lim _{a \\rightarrow 0^{+}} \\beta(a)$ respectively are", "image": null}, "options": [{"id": "L4DoQ", "text": "1 and $-\\dfrac{5}{2}$", "image": null, "isCorrect": false}, {"id": "cosp4", "text": "-1 and $-\\dfrac{1}{2}$", "image": null, "isCorrect": true}, {"id": "CZB29", "text": "2 and $-\\dfrac{7}{2}$", "image": null, "isCorrect": false}, {"id": "1nJ8T", "text": "3 and $-\\dfrac{9}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $1+a = t^6$. As $a \\rightarrow 0^{+}$, $t \\rightarrow 1$.<br><br>Substituting this in the given equation, we get:<br><br>$(t^2-1) x^2+(t^3-1) x+(t-1)=0$<br><br>Since $t \\rightarrow 1$, $t \\neq 1$. Dividing the entire equation by $t-1$, we get:<br><br>$(t+1) x^2+(t^2+t+1) x+1=0$<br><br>Taking the limit as $t \\rightarrow 1$, the equation becomes:<br><br>$(1+1) x^2+(1^2+1+1) x+1=0$<br><br>$2x^2+3x+1=0$<br><br>Factorizing the quadratic equation:<br><br>$2x^2+2x+x+1=0$<br><br>$(2x+1)(x+1)=0$<br><br>The roots are $x=-1$ and $x=-\\dfrac{1}{2}$.<br><br>Thus, $\\lim _{a \\rightarrow 0^{+}} \\alpha(a)$ and $\\lim _{a \\rightarrow 0^{+}} \\beta(a)$ are $-1$ and $-\\dfrac{1}{2}$.<br><br>Answer: -1 and $-\\dfrac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262750279619d9d8a34ae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow \\infty} x^3\\left\\{\\sqrt{x^2+\\sqrt{1+x^4}}-x \\sqrt{2}\\right\\}=$", "image": null}, "options": [{"id": "PPGIf", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "i4Wua", "text": "$\\frac{1}{4 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "CQf5m", "text": "$\\frac{-1}{4 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "xCAQl", "text": "$\\frac{-1}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow \\infty} x^3\\left(\\sqrt{x^2+\\sqrt{1+x^4}}-x \\sqrt{2}\\right) \\\\ & =\\lim _{x \\rightarrow \\infty} \\frac{x^3\\left(x^2+\\sqrt{1+x^4}-2 x^2\\right)}{\\sqrt{x^2+\\sqrt{1+x^4}}+x \\sqrt{2}} \\\\ & =\\lim _{x \\rightarrow \\infty} \\frac{x^3\\left(\\sqrt{1+x^4}-x^2\\right)}{\\sqrt{x^2+\\sqrt{1+x^4}}+x \\sqrt{2}} \\\\ & =\\lim _{x \\rightarrow \\infty} \\frac{x^3\\left(1+x^4-x^4\\right)}{\\left(\\sqrt{x^2+\\sqrt{1+x^4}}+x \\sqrt{2}\\right)\\left(\\sqrt{1+x^4}+x^2\\right)}\\end{aligned}$\n$\\begin{aligned} & =\\lim _{x \\rightarrow \\infty} \\frac{x^3}{x^3\\left(\\sqrt{1+\\sqrt{\\frac{1}{x^4}+1}+\\sqrt{2}}\\right)\\left(\\sqrt{\\frac{1}{x^4}+1}+1\\right)} \\\\ & =\\lim _{x \\rightarrow \\infty} \\frac{1}{\\left(\\sqrt{1+\\sqrt{\\frac{1}{x^4}+1}+\\sqrt{2}}\\right)\\left(\\sqrt{\\frac{1}{x^4}+1}+1\\right)} \\\\ & =\\frac{1}{(\\sqrt{1+1}+\\sqrt{2})(1+1)} \\\\ & =\\frac{1}{4 \\sqrt{2}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615b0279619d9d8a2be3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow 1} \\frac{2^{2 x-2}-2^x+1}{\\sin ^2(x-1)}=$", "image": null}, "options": [{"id": "BfvRM", "text": "$\\frac{1}{2}(\\log 2)^2$", "image": null, "isCorrect": false}, {"id": "A9J8p", "text": "$(\\log 2)^2$", "image": null, "isCorrect": true}, {"id": "qnlRn", "text": "$2 \\log 2$", "image": null, "isCorrect": false}, {"id": "qb3GS", "text": "$2(\\log 2)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 1} \\frac{2^{2 x-2}-2^x+1}{\\sin ^2(x-1)}=\\lim _{x \\rightarrow 1} \\frac{\\left(2^{x-1}-1\\right)^2}{\\sin ^2(x-1)}=\\lim _{x \\rightarrow 1} \\frac{\\frac{\\left(2^{x-1}-1\\right)^2}{(x-1)^2}}{\\frac{\\sin ^2(x-1)}{(x-1)^2}} \\\\ & =\\frac{(\\log 2)^2}{1^2}=(\\log 2)^2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260fd0279619d9d8a28e8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow 0} \\frac{27^x-9^x-3^x+1}{\\sqrt{5}-\\sqrt{4+\\cos x}}=$", "image": null}, "options": [{"id": "G4Y0P", "text": "$8 \\sqrt{5} \\log 3$", "image": null, "isCorrect": false}, {"id": "EV2VZ", "text": "$16 \\sqrt{5} \\log 3$", "image": null, "isCorrect": false}, {"id": "ZG221", "text": "$8 \\sqrt{5}(\\log 3)^2$", "image": null, "isCorrect": true}, {"id": "mYGA3", "text": "$\\sqrt{5}(\\log 3)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 0} \\frac{27^x-9^x-3^x+1}{\\sqrt{5}-\\sqrt{4+\\cos x}}=\\lim _{x \\rightarrow 0} \\frac{\\left(9^x-1\\right)\\left(3^x-1\\right)}{5-(4+\\cos x)}\\{\\sqrt{5}+\\sqrt{4+\\cos x}\\} \\\\ & =\\lim _{x \\rightarrow 0} \\frac{\\left(9^x-1\\right)\\left(3^x+1\\right)}{1-\\cos x} \\cdot\\{\\sqrt{5}+\\sqrt{4+\\cos x}\\} \\\\ & =\\lim _{x \\rightarrow 0} \\frac{\\left(9^x-1\\right)\\left(3^x-1\\right)}{2 \\sin ^2\\left(\\frac{x}{2}\\right)} \\cdot\\{\\sqrt{5}+\\sqrt{4+\\cos x}\\} \\\\ & =\\lim _{x \\rightarrow 0} \\frac{\\left(\\frac{9^x-1}{x}\\right)\\left(\\frac{3^x-1}{x}\\right)}{2 \\times \\frac{\\sin ^2 \\frac{x}{2}}{\\frac{x^2}{4}} \\times \\frac{1}{4}} \\cdot\\{\\sqrt{5}+\\sqrt{4+\\cos x}\\}\\end{aligned}$\n$\\begin{aligned} & =\\frac{\\log 9 \\cdot \\log 3}{\\frac{1}{2}}\\{\\sqrt{5}+\\sqrt{5}\\} \\\\ & =2 \\log 9 \\cdot \\log 3 \\cdot(2 \\sqrt{5}) \\\\ & =8 \\sqrt{5}(\\log 3)^2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260080279619d9d8a2133", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "If $\\mathrm{f}(x)=\\left(\\frac{2^{x}-1}{1-3^{x}}\\right)$, for $\\mathrm{x} \\neq 0$ is continuous at $x=0$, then $\\mathrm{f}(0)=$", "image": null}, "options": [{"id": "fYVZb", "text": "$\\cdot \\log 3$", "image": null, "isCorrect": false}, {"id": "fi145", "text": "$\\frac{-(\\log 2)}{(\\log 3)}$", "image": null, "isCorrect": true}, {"id": "0d2vU", "text": "$\\frac{(\\log 2)}{(\\log 3)}$", "image": null, "isCorrect": false}, {"id": "rP9rL", "text": "$-\\log 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f(0)=\\lim _{x \\rightarrow 0} \\frac{2^{x}-1}{-\\left(3^{x}-1\\right)}=-\\frac{\\lim _{x \\rightarrow 0} \\frac{2^{x}-1}{x}}{\\lim _{x \\rightarrow 0} \\frac{3^{x}-1}{x}}=\\frac{-\\log 2}{\\log 3}$\n\n$$\nf(0)=\\lim _{x \\rightarrow 0} \\frac{2^{x}-1}{-\\left(3^{x}-1\\right)}=-\\frac{\\lim _{x \\rightarrow 0} \\frac{2^{x}-1}{x}}{\\lim _{x \\rightarrow 0} \\frac{3^{x}-1}{x}}=\\frac{-\\log 2}{\\log 3}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea80279619d9d8a1638", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "$\\lim _{x \\rightarrow 0}\\left(\\frac{3^{x}-1}{x}\\right)$ is equal to", "image": null}, "options": [{"id": "4Yhzq", "text": "$2 \\log 3$", "image": null, "isCorrect": false}, {"id": "WGTBb", "text": "$3 \\log 3$", "image": null, "isCorrect": false}, {"id": "iH0go", "text": "$\\log 3$", "image": null, "isCorrect": true}, {"id": "WARuB", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow 0}\\left(\\frac{3^{x}-1}{x}\\right) \\quad\\left(\\frac{0}{0}\\right.$ form $)$\nUsing L' Hospital's rule, $=\\lim _{x \\rightarrow 0} \\frac{3^{x} \\log 3-0}{1}=3^{0} \\log 3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7e0279619d9d8a14e2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The value of $\\lim _{x \\rightarrow 0} \\frac{15^{x}-5^{x}-3^{x}+1}{1-\\cos 2 x}$ is", "image": null}, "options": [{"id": "wNUan", "text": "$\\frac{(\\log 3)(\\log 5)}{2}$", "image": null, "isCorrect": true}, {"id": "a1RRY", "text": "$2(\\log 3)(\\log 5)$", "image": null, "isCorrect": false}, {"id": "Fjd4Z", "text": "$\\frac{\\log 3+\\log 5}{2}$", "image": null, "isCorrect": false}, {"id": "9sk1D", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow 0} \\frac{15^{x}-5^{x}-3^{x}+1}{1-\\cos 2 x}$\n$=\\lim _{x \\rightarrow 0} \\frac{\\left(3^{x}-1\\right)\\left(5^{x}-1\\right)}{1-1+2 \\sin ^{2} x}$\n$\\quad=\\lim _{x \\rightarrow 0}\\left(\\frac{3^{x}-1}{x}\\right)\\left(\\frac{5^{x}-1}{x}\\right)\\left(\\frac{x^{2}}{2 \\sin ^{2} x}\\right)$\n$=\\frac{1}{2}(\\log 3)(\\log 5) \\cdot 1$\n$\\quad\\left[\\because \\lim _{x \\rightarrow 0}\\left(\\frac{a^{x}-b^{x}}{x}\\right)=\\log \\left(\\frac{a}{b}\\right)\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6e0279619d9d8a1460", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "$\\lim _{x \\rightarrow 1}(\\log e x)^{1 / \\log x}$ is equal to", "image": null}, "options": [{"id": "foXez", "text": "$e^{-1}$", "image": null, "isCorrect": false}, {"id": "sOsMX", "text": "$e$", "image": null, "isCorrect": true}, {"id": "m9GqW", "text": "$e^{2}$", "image": null, "isCorrect": false}, {"id": "QesMx", "text": "0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\lim _{x \\rightarrow 1}(\\log e x)^{1 / \\log x} &=\\lim _{x \\rightarrow 1}[\\log e+\\log x]^{1 / \\log x} \\\\ &=\\lim _{x \\rightarrow 1}[1+\\log x]^{1 / \\log x} \\\\ &=e^{\\lim _{x \\rightarrow 1} \\frac{\\log x}{\\log x}}=e \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2633b0279619d9d8a3d4c", "title": "Special Forms", "totalQuestions": 9, "questions": [{"_id": "6abb885915a9fc0fc8c142db", "type": "singleCorrect", "question": {"text": "If $\\lim_{x \\to 0}\\left(\\dfrac{f(x)}{x^2}\\right)$ exists finitely and $\\lim_{x \\to 0}\\left(1 + x + \\dfrac{f(x)}{x}\\right)^{1/x} = e^3$, then $\\int f(x) \\cdot \\log x\\,dx$ is equal to:", "image": null}, "options": [{"id": "65mzO", "label": "A", "text": "$\\dfrac{2}{9}x^3(3\\log x - 1) + c$", "isCorrect": true, "image": null}, {"id": "bQagx", "label": "B", "text": "$\\dfrac{1}{9}x^3(3\\log x - 1) + c$", "isCorrect": false, "image": null}, {"id": "ua9wI", "label": "C", "text": "$\\dfrac{2}{9}x^3(3\\log x + 1) + c$", "isCorrect": false, "image": null}, {"id": "0QZOj", "label": "D", "text": "$\\dfrac{2}{9}x^3(3\\log x - 1/3) + c$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given that $\\lim_{x \\to 0}\\left(\\dfrac{f(x)}{x^2}\\right)$ exists finitely, let $\\lim_{x \\to 0}\\dfrac{f(x)}{x^2} = L$.<br><br>Then $\\lim_{x \\to 0}\\dfrac{f(x)}{x} = \\lim_{x \\to 0}\\left(x \\cdot \\dfrac{f(x)}{x^2}\\right) = 0 \\cdot L = 0$.<br><br>The given limit is of the form $1^{\\infty}$:<br><br>$\\lim_{x \\to 0}\\left(1 + x + \\dfrac{f(x)}{x}\\right)^{1/x} = e^{\\lim_{x \\to 0} \\dfrac{1}{x} \\left(1 + x + \\dfrac{f(x)}{x} - 1\\right)}$<br><br>$= e^{\\lim_{x \\to 0} \\left(1 + \\dfrac{f(x)}{x^2}\\right)} = e^{1 + L}$<br><br>We are given that this limit is equal to $e^3$.<br><br>$e^{1 + L} = e^3 \\Rightarrow 1 + L = 3 \\Rightarrow L = 2$<br><br>Thus, $\\lim_{x \\to 0}\\dfrac{f(x)}{x^2} = 2$. For the integral to match the given options, we take $f(x) = 2x^2$.<br><br>Now, we evaluate the integral $\\int f(x) \\log x \\,dx = \\int 2x^2 \\log x \\,dx$.<br><br>Using integration by parts, taking $\\log x$ as the first function and $2x^2$ as the second function:<br><br>$\\int 2x^2 \\log x \\,dx = \\log x \\int 2x^2 \\,dx - \\int \\left( \\dfrac{d}{dx}(\\log x) \\int 2x^2 \\,dx \\right) dx$<br><br>$= \\log x \\left(\\dfrac{2x^3}{3}\\right) - \\int \\dfrac{1}{x} \\left(\\dfrac{2x^3}{3}\\right) dx$<br><br>$= \\dfrac{2}{3}x^3 \\log x - \\int \\dfrac{2}{3}x^2 \\,dx$<br><br>$= \\dfrac{2}{3}x^3 \\log x - \\dfrac{2}{9}x^3 + c$<br><br>$= \\dfrac{2}{9}x^3(3\\log x - 1) + c$<br><br>Answer: $\\dfrac{2}{9}x^3(3\\log x - 1) + c$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9ebf9280d7f9932aee", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let $\\mathrm{A}=\\lim _{\\mathrm{x} \\rightarrow 0^{+}}\\left(1+\\tan ^2 \\sqrt{x}\\right)^{\\frac{1}{2 x}}$, then $\\log _{\\mathrm{e}} \\mathrm{A}=$", "image": null}, "options": [{"id": "S07Ou", "text": "2", "image": null, "isCorrect": false}, {"id": "4heIL", "text": "1", "image": null, "isCorrect": false}, {"id": "TXF0S", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "ho6XK", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{A} = \\lim_{\\mathrm{x} \\rightarrow 0^{+}} \\left(1+\\tan^2 \\sqrt{x}\\right)^{\\dfrac{1}{2x}}$<br><br>As $x \\rightarrow 0^{+}$, the limit is of the form $1^{\\infty}$.<br><br>Using the standard result $\\lim_{x \\rightarrow a} (1+f(x))^{g(x)} = e^{\\lim_{x \\rightarrow a} f(x)g(x)}$ for $1^{\\infty}$ forms:<br><br>$\\mathrm{A} = e^{\\lim_{x \\rightarrow 0^{+}} \\left(\\tan^2 \\sqrt{x}\\right) \\left(\\dfrac{1}{2x}\\right)}$<br><br>$\\mathrm{A} = e^{\\dfrac{1}{2} \\lim_{x \\rightarrow 0^{+}} \\left(\\dfrac{\\tan \\sqrt{x}}{\\sqrt{x}}\\right)^2}$<br><br>Since $\\lim_{\\theta \\rightarrow 0} \\dfrac{\\tan \\theta}{\\theta} = 1$, we get:<br><br>$\\mathrm{A} = e^{\\dfrac{1}{2} (1)^2} = e^{\\dfrac{1}{2}}$<br><br>Taking the natural logarithm on both sides:<br><br>$\\log_{\\mathrm{e}} \\mathrm{A} = \\log_{\\mathrm{e}} \\left(e^{\\dfrac{1}{2}}\\right) = \\dfrac{1}{2}$<br><br>Answer: $\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7ebf9280d7f99329c6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow 1}\\left(\\log _3 3 x\\right)^{\\log _x 8}=\\ldots$", "image": null}, "options": [{"id": "YAYS3", "text": "$e^{\\log _3 8}$", "image": null, "isCorrect": true}, {"id": "WRQpq", "text": "$\\log _8 3$", "image": null, "isCorrect": false}, {"id": "2ScdV", "text": "$e^{\\log _8 3}$", "image": null, "isCorrect": false}, {"id": "Fw7he", "text": "$\\log _3 8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\rightarrow 1} (\\log_3 3x)^{\\log_x 8}$<br><br>Using the properties of logarithms, we can write $\\log_3 3x = \\log_3 3 + \\log_3 x = 1 + \\log_3 x$.<br><br>Also, using the change of base formula, $\\log_x 8 = \\dfrac{\\log_3 8}{\\log_3 x}$.<br><br>Substituting these into the limit, we get:<br><br>$L = \\lim_{x \\rightarrow 1} (1 + \\log_3 x)^{\\dfrac{\\log_3 8}{\\log_3 x}}$<br><br>Let $t = \\log_3 x$. As $x \\rightarrow 1$, $t \\rightarrow 0$. The limit becomes:<br><br>$L = \\lim_{t \\rightarrow 0} (1 + t)^{\\dfrac{\\log_3 8}{t}}$<br><br>$L = \\lim_{t \\rightarrow 0} \\left[ (1 + t)^{\\dfrac{1}{t}} \\right]^{\\log_3 8}$<br><br>Using the standard limit $\\lim_{t \\rightarrow 0} (1 + t)^{\\dfrac{1}{t}} = e$, we obtain:<br><br>$L = e^{\\log_3 8}$<br><br>Answer: $e^{\\log _3 8}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b71bf9280d7f9932947", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{x \\rightarrow \\infty}\\left(\\frac{x+8}{x+1}\\right)^{x+5}=\\ldots$", "image": null}, "options": [{"id": "UHlfy", "text": "$e^4$", "image": null, "isCorrect": false}, {"id": "3N0Zr", "text": "$\\mathrm{e}^5$", "image": null, "isCorrect": false}, {"id": "lnRM4", "text": "$\\mathrm{e}^{11}$", "image": null, "isCorrect": false}, {"id": "UQJ5e", "text": "$\\mathrm{e}^7$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\rightarrow \\infty} \\left(\\dfrac{x+8}{x+1}\\right)^{x+5}$<br><br>Rewriting the expression inside the limit:<br><br>$L = \\lim_{x \\rightarrow \\infty} \\left(1 + \\dfrac{7}{x+1}\\right)^{x+5}$<br><br>This is of the form $1^\\infty$. Using the standard result $\\lim_{x \\rightarrow \\infty} (1 + f(x))^{g(x)} = e^{\\lim_{x \\rightarrow \\infty} f(x)g(x)}$ where $f(x) \\rightarrow 0$ and $g(x) \\rightarrow \\infty$, we get:<br><br>$L = e^{\\lim_{x \\rightarrow \\infty} \\left(\\dfrac{7}{x+1}\\right)(x+5)}$<br><br>$L = e^{\\lim_{x \\rightarrow \\infty} \\dfrac{7(x+5)}{x+1}}$<br><br>Dividing the numerator and the denominator by $x$:<br><br>$L = e^{\\lim_{x \\rightarrow \\infty} \\dfrac{7(1+5/x)}{1+1/x}}$<br><br>As $x \\rightarrow \\infty$, $\\dfrac{1}{x} \\rightarrow 0$.<br><br>$L = e^{\\dfrac{7(1+0)}{1+0}} = e^7$<br><br>Answer: $\\mathrm{e}^7$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213dc0aee93fa0796dc17", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "If $\\mathrm{f}(x)=\\left(\\dfrac{1+\\tan x}{1+\\sin x}\\right)^{\\operatorname{cosec} x}$ is continuous at $x=0$, then $f(0)$ is equal to", "image": null}, "options": [{"id": "EWeQq", "text": "0", "image": null, "isCorrect": false}, {"id": "Fmv30", "text": "1", "image": null, "isCorrect": true}, {"id": "5Ontd", "text": "e", "image": null, "isCorrect": false}, {"id": "2KMiQ", "text": "$\\dfrac{1}{\\mathrm{e}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since $f(x)$ is continuous at $x=0$, $f(0) = \\lim_{x \\to 0} f(x)$.<br><br>$f(0) = \\lim_{x \\to 0} \\left(\\dfrac{1+\\tan x}{1+\\sin x}\\right)^{\\operatorname{cosec} x}$<br><br>This limit is of the form $1^{\\infty}$. Using the standard result $\\lim_{x \\to a} u(x)^{v(x)} = e^{\\lim_{x \\to a} v(x)(u(x)-1)}$:<br><br>$f(0) = e^{\\lim_{x \\to 0} \\operatorname{cosec} x \\left(\\dfrac{1+\\tan x}{1+\\sin x} - 1\\right)}$<br><br>$f(0) = e^{\\lim_{x \\to 0} \\dfrac{1}{\\sin x} \\left(\\dfrac{\\tan x - \\sin x}{1+\\sin x}\\right)}$<br><br>$f(0) = e^{\\lim_{x \\to 0} \\dfrac{1}{\\sin x} \\dfrac{\\sin x (1 - \\cos x)}{\\cos x (1+\\sin x)}}$<br><br>$f(0) = e^{\\lim_{x \\to 0} \\dfrac{1 - \\cos x}{\\cos x (1+\\sin x)}}$<br><br>Substituting $x = 0$:<br><br>$f(0) = e^{\\dfrac{1 - 1}{1(1+0)}} = e^0 = 1$<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2617b0279619d9d8a2cef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow 2}\\left(\\frac{5 x-8}{8-3 x}\\right)^{\\frac{3}{2 x-4}}=$", "image": null}, "options": [{"id": "QEzOK", "text": "$e^{5 / 2}$", "image": null, "isCorrect": false}, {"id": "QW0G8", "text": "$\\mathrm{e}^{3 / 2}$", "image": null, "isCorrect": false}, {"id": "ed78r", "text": "$\\mathrm{e}^2$", "image": null, "isCorrect": false}, {"id": "D0Zug", "text": "$\\mathrm{e}^6$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 2}\\left(\\frac{5 x-8}{8-3 x}\\right) \\frac{3}{2 x-4}=e^{\\lim _{x \\rightarrow 2}\\left(\\frac{5 x-8}{8-3 x}-1\\right) \\times \\frac{3}{2 x-4}} \\\\ & =e^{\\lim _{x \\rightarrow 2} \\frac{8(x-2) \\times 3}{(8-3 x) 2(x-2)}}=e^6 \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261320279619d9d8a2a96", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "$\\lim _{x \\rightarrow 0}\\left(\\frac{1+\\tan x}{1+\\sin x}\\right)^{\\operatorname{cosec} x}=$", "image": null}, "options": [{"id": "LmL6I", "text": "$0$", "image": null, "isCorrect": false}, {"id": "2dd7C", "text": "$1$", "image": null, "isCorrect": true}, {"id": "GE6J3", "text": "e", "image": null, "isCorrect": false}, {"id": "0a5YK", "text": "$\\frac{1}{\\mathrm{e}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow 0}\\left(\\frac{1+\\tan x}{1+\\sin x}\\right)^{\\operatorname{cosec} x}=e^{\\lim _{x \\rightarrow 0}\\left(\\frac{1+\\tan x}{1+\\sin x}-1\\right) \\operatorname{cosec} x} \\\\ & =e^{\\lim _{x \\rightarrow 0}\\left\\{\\frac{\\tan x-\\sin x}{1+\\sin x} \\cdot \\frac{1}{\\sin x}\\right\\}} \\\\ & \\left.=e^{\\lim _{x \\rightarrow 0}\\left\\{\\frac{\\frac{1}{\\cos x}-1}{1+\\sin x}\\right.}\\right\\} \\\\ & =\\mathrm{e}^0=1 \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e930279619d9d8a158c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "If $a, b, c$ and $d$ are positive, then\nis equal", "image": null}, "options": [{"id": "qYxxc", "text": "$e^{d / b}$", "image": null, "isCorrect": true}, {"id": "qND9k", "text": "$e^{c / a}$", "image": null, "isCorrect": false}, {"id": "d4JqE", "text": "$e^{(c+d) /(a+b)}$", "image": null, "isCorrect": false}, {"id": "6o1ri", "text": "$\\underline{e}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$L=\\lim _{x \\rightarrow \\infty}\\left(1+\\frac{1}{a+b x}\\right)^{c+d x} \\quad\\left[\\right.$ form $\\left.(1)^{\\infty}\\right]$\n$$\n\\begin{aligned}\n&=e^{\\lim _{x \\rightarrow \\infty} \\frac{c+d x}{a+b x}}=e^{\\lim _{x \\rightarrow \\infty} \\frac{c / x+d}{a / x+b}} \\\\\n=& e^{\\frac{0+d}{0+b}}=e^{d / b}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e480279619d9d8a1333", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The value of $\\lim _{x \\rightarrow \\infty}\\left(\\frac{x^{2}-2 x+1}{x^{2}-4 x+2}\\right)^{x}$ is", "image": null}, "options": [{"id": "mff1y", "text": "$e^{2}$", "image": null, "isCorrect": true}, {"id": "3NFYM", "text": "$e^{-2}$", "image": null, "isCorrect": false}, {"id": "Wu8Im", "text": "$e^{6}$", "image": null, "isCorrect": false}, {"id": "nq7eq", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow \\infty}\\left(\\frac{x^{2}-2 x+1}{x^{2}-4 x+2}\\right)^{x} \\\\ &=\\lim _{x \\rightarrow \\infty}\\left(1+\\frac{2 x-1}{x^{2}-4 x+2}\\right)^{x} \\\\ &=e^{\\lim _{x \\rightarrow-\\infty}\\left(\\frac{x(2 x-1)}{x^{2}-4 x+2}\\right)}=e^{2} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a2633c0279619d9d8a3d4f", "title": "Miscellaneous", "totalQuestions": 5, "questions": [{"_id": "68871bf5bf9280d7f9932e00", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{n \\rightarrow \\infty} \\frac{1}{n^3+1}+\\frac{4}{n^3+1}+\\frac{9}{n^3+1}+\\ldots \\ldots \\ldots \\ldots+\\frac{n^2}{n^3+1}=$", "image": null}, "options": [{"id": "rpxlM", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": true}, {"id": "9yfev", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "OjDmf", "text": "$\\frac{1}{6}$", "image": null, "isCorrect": false}, {"id": "GVNvq", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given limit can be written as:<br><br>$\\lim_{n \\rightarrow \\infty} \\sum_{k=1}^{n} \\dfrac{k^2}{n^3+1}$<br><br>Since the denominator is common, we can write it as:<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{1}{n^3+1} \\sum_{k=1}^{n} k^2$<br><br>Using the formula for the sum of squares of the first $n$ natural numbers, $\\sum_{k=1}^{n} k^2 = \\dfrac{n(n+1)(2n+1)}{6}$:<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{n(n+1)(2n+1)}{6(n^3+1)}$<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{2n^3 + 3n^2 + n}{6n^3 + 6}$<br><br>Dividing the numerator and denominator by $n^3$:<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{2 + \\dfrac{3}{n} + \\dfrac{1}{n^2}}{6 + \\dfrac{6}{n^3}}$<br><br>As $n \\rightarrow \\infty$, $\\dfrac{1}{n} \\rightarrow 0$. Thus, the limit evaluates to:<br><br>$\\dfrac{2 + 0 + 0}{6 + 0} = \\dfrac{2}{6} = \\dfrac{1}{3}$<br><br>Answer: $\\frac{1}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b62bf9280d7f99328b2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\lim _{n \\rightarrow \\infty}\\left[\\frac{1}{1-\\mathrm{n}^4}+\\frac{8}{1-\\mathrm{n}^4}+\\ldots \\ldots \\ldots \\ldots . .+\\frac{\\mathrm{n}^3}{1-\\mathrm{n}^4}\\right]=$", "image": null}, "options": [{"id": "Y8tG1", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "iLZbq", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "B9AYv", "text": "$-\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "VDp9K", "text": "$-\\frac{1}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given limit can be written as:<br><br>$\\lim_{n \\rightarrow \\infty} \\left[ \\dfrac{1^3 + 2^3 + \\ldots + n^3}{1-n^4} \\right]$<br><br>Using the formula for the sum of cubes of the first $n$ natural numbers, $\\sum_{k=1}^n k^3 = \\left( \\dfrac{n(n+1)}{2} \\right)^2$, we get:<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{\\left( \\dfrac{n(n+1)}{2} \\right)^2}{1-n^4}$<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{n^2(n+1)^2}{4(1-n^4)}$<br><br>Dividing the numerator and the denominator by $n^4$:<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{n^4 \\left(1 + \\dfrac{1}{n}\\right)^2}{4n^4 \\left(\\dfrac{1}{n^4} - 1\\right)}$<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{\\left(1 + \\dfrac{1}{n}\\right)^2}{4 \\left(\\dfrac{1}{n^4} - 1\\right)}$<br><br>As $n \\rightarrow \\infty$, $\\dfrac{1}{n} \\rightarrow 0$ and $\\dfrac{1}{n^4} \\rightarrow 0$. Substituting these values:<br><br>$\\dfrac{(1 + 0)^2}{4(0 - 1)} = -\\dfrac{1}{4}$<br><br>Answer: $-\\frac{1}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c70aee93fa0796db6f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "$\\mathrm{S}_1=\\sum_{\\mathrm{r}=1}^{\\mathrm{n}} \\mathrm{r}, \\mathrm{S}_2=\\sum_{\\mathrm{r}=1}^{\\mathrm{n}} \\mathrm{r}^2$ and $\\mathrm{S}_3=\\sum_{\\mathrm{r}=1}^{\\mathrm{n}} \\mathrm{r}^3$, then the value of $\\lim _{n \\rightarrow \\infty} \\dfrac{s_1\\left(1+\\dfrac{s_3}{4}\\right)}{s_2^2}$ is", "image": null}, "options": [{"id": "Tt9Gb", "text": "$\\dfrac{9}{16}$", "image": null, "isCorrect": false}, {"id": "d058j", "text": "$\\dfrac{9}{2}$", "image": null, "isCorrect": false}, {"id": "L5FXz", "text": "$\\dfrac{9}{32}$", "image": null, "isCorrect": true}, {"id": "WbXXh", "text": "$\\dfrac{9}{8}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The sums of the first $n$ natural numbers, their squares, and their cubes are given by:<br><br>$S_1 = \\sum_{r=1}^n r = \\dfrac{n(n+1)}{2}$<br><br>$S_2 = \\sum_{r=1}^n r^2 = \\dfrac{n(n+1)(2n+1)}{6}$<br><br>$S_3 = \\sum_{r=1}^n r^3 = \\dfrac{n^2(n+1)^2}{4}$<br><br>Substitute these into the given limit expression:<br><br>$\\lim_{n \\rightarrow \\infty} \\dfrac{S_1\\left(1+\\dfrac{S_3}{4}\\right)}{S_2^2} = \\lim_{n \\rightarrow \\infty} \\dfrac{\\dfrac{n(n+1)}{2} \\left(1 + \\dfrac{n^2(n+1)^2}{16}\\right)}{\\left(\\dfrac{n(n+1)(2n+1)}{6}\\right)^2}$<br><br>Simplifying the expression:<br><br>$= \\lim_{n \\rightarrow \\infty} \\dfrac{18}{n(n+1)(2n+1)^2} \\left(1 + \\dfrac{n^2(n+1)^2}{16}\\right)$<br><br>Separating into two limits:<br><br>$= \\lim_{n \\rightarrow \\infty} \\dfrac{18}{n(n+1)(2n+1)^2} + \\lim_{n \\rightarrow \\infty} \\dfrac{18 n^2(n+1)^2}{16 n(n+1)(2n+1)^2}$<br><br>The first term approaches $0$ as $n \\rightarrow \\infty$. For the second term, simplifying the fraction gives:<br><br>$= 0 + \\lim_{n \\rightarrow \\infty} \\dfrac{9 n(n+1)}{8 (2n+1)^2}$<br><br>Dividing the numerator and the denominator by $n^2$:<br><br>$= \\lim_{n \\rightarrow \\infty} \\dfrac{9 \\left(1 + \\dfrac{1}{n}\\right)}{8 \\left(2 + \\dfrac{1}{n}\\right)^2}$<br><br>As $n \\rightarrow \\infty$, $\\dfrac{1}{n} \\rightarrow 0$, yielding:<br><br>$= \\dfrac{9(1)}{8(2)^2} = \\dfrac{9}{32}$<br><br>Answer: $\\dfrac{9}{32}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262160279619d9d8a31af", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "If $l=\\lim _{x \\rightarrow 0} \\frac{x}{|x|+x^2}$, then the value of $l$ is", "image": null}, "options": [{"id": "cQgd6", "text": "$1$", "image": null, "isCorrect": false}, {"id": "khRJh", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "uQ5om", "text": "$2$", "image": null, "isCorrect": false}, {"id": "tq999", "text": "non-existant", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $\\mathrm{f}(x)=\\frac{x}{|x|+x^2}$\n$\\begin{aligned}\n& \\lim _{x \\rightarrow 0^{-}} \\mathrm{f}(x)=\\lim _{x \\rightarrow 0} \\frac{x}{-x+x^2}=\\lim _{x \\rightarrow 0} \\frac{1}{-1+x}=-1 \\\\\n& \\lim _{x \\rightarrow 0^{+}} \\mathrm{f}(x)=\\lim _{x \\rightarrow 0} \\frac{x}{x+x^2}=\\lim _{x \\rightarrow 0} \\frac{1}{1+x}=1\n\\end{aligned}$\nHere, $\\lim _{x \\rightarrow 0^{-}} \\mathrm{f}(x) \\neq \\lim _{x \\rightarrow 0^{+}} \\mathrm{f}(x)$\n$\\therefore \\quad$ Value of $l$ is non-existant", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260400279619d9d8a22f9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "If $a=\\lim _{n \\rightarrow \\infty} \\frac{1+2+3+\\ldots+n}{n^2}$ and $b=\\lim _{n \\rightarrow \\infty} \\frac{1^2+2^2+3^2+\\ldots+n^2}{n^3}$, then", "image": null}, "options": [{"id": "4VDrh", "text": "$a=b$", "image": null, "isCorrect": false}, {"id": "2YNXm", "text": "$2 \\mathrm{a}=3 \\mathrm{~b}$", "image": null, "isCorrect": true}, {"id": "nHWDR", "text": "$a=2 b$", "image": null, "isCorrect": false}, {"id": "CKA5z", "text": "$3 \\mathrm{a}=2 \\mathrm{~b}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& a=\\lim _{n \\rightarrow \\infty} \\frac{1+2+3+\\ldots+n}{n^2} \\\\\n& =\\lim _{n \\rightarrow \\infty} \\frac{n(n+1)}{2(n)(n)}=\\lim _{n \\rightarrow \\infty}\\left(\\frac{1}{2}\\right)\\left(\\frac{n+1}{n}\\right)=\\frac{1}{2} \\lim _{n \\rightarrow \\infty}\\left(1+\\frac{1}{n}\\right)=\\frac{1}{2} \\\\\n& b=\\lim _{n \\rightarrow \\infty} \\frac{1^2+2^2+3^2+\\ldots .+n^2}{n^3} \\\\\n& =\\lim _{n \\rightarrow \\infty} \\frac{n(n+1)(2 n+1)}{6 n^3}=\\lim _{n \\rightarrow \\infty} \\frac{2 n^2+3 n+1}{6 n^2} \\\\\n& =\\lim _{n \\rightarrow \\infty}\\left(\\frac{1}{6}\\right)\\left(2+\\frac{3}{n}+\\frac{1}{n^2}\\right)=\\frac{2}{6}=\\frac{1}{3}\n\\end{aligned}\n$$\nThus $\\mathrm{a}=\\frac{1}{2}$ and $\\mathrm{b}=\\frac{1}{3} \\Rightarrow 2 \\mathrm{a}=3 \\mathrm{~b}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "6abb890415a9fc0fc8c14799", "title": "Continuity", "totalQuestions": 1, "questions": [{"_id": "6abb88d615a9fc0fc8c1476b", "type": "singleCorrect", "question": {"text": "If $f(x) = \\dfrac{10^x + 7^x - 14^x - 5^x}{1 - \\cos x}$, for $x \\neq 0$ and $f(0) = k$ is continuous at $x = 0$, then the value of $k$ is _____", "image": null}, "options": [{"id": "NTumv", "label": "A", "text": "$\\log 4\\, \\log \\dfrac{7}{5}$", "isCorrect": false, "image": null}, {"id": "iqXu6", "label": "B", "text": "$\\log 4\\, \\log \\dfrac{5}{7}$", "isCorrect": true, "image": null}, {"id": "I21oR", "label": "C", "text": "$\\log \\dfrac{5}{7}$", "isCorrect": false, "image": null}, {"id": "efl8w", "label": "D", "text": "$\\log 2\\, \\log \\dfrac{5}{7}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = \\dfrac{10^x + 7^x - 14^x - 5^x}{1 - \\cos x}$<br><br>Factorizing the numerator:<br><br>$10^x + 7^x - 14^x - 5^x = 5^x(2^x - 1) - 7^x(2^x - 1) = (5^x - 7^x)(2^x - 1)$<br><br>Since $f(x)$ is continuous at $x = 0$, $f(0) = \\lim_{x \\rightarrow 0} f(x)$.<br><br>$k = \\lim_{x \\rightarrow 0} \\dfrac{(5^x - 7^x)(2^x - 1)}{1 - \\cos x}$<br><br>Dividing the numerator and the denominator by $x^2$:<br><br>$k = \\lim_{x \\rightarrow 0} \\dfrac{\\dfrac{5^x - 7^x}{x} \\cdot \\dfrac{2^x - 1}{x}}{\\dfrac{1 - \\cos x}{x^2}}$<br><br>Using the standard limits $\\lim_{x \\rightarrow 0} \\dfrac{a^x - b^x}{x} = \\log \\dfrac{a}{b}$, $\\lim_{x \\rightarrow 0} \\dfrac{a^x - 1}{x} = \\log a$, and $\\lim_{x \\rightarrow 0} \\dfrac{1 - \\cos x}{x^2} = \\dfrac{1}{2}$:<br><br>$k = \\dfrac{\\log \\left(\\dfrac{5}{7}\\right) \\cdot \\log 2}{\\dfrac{1}{2}}$<br><br>$k = 2 \\log 2 \\cdot \\log \\dfrac{5}{7}$<br><br>$k = \\log 4 \\cdot \\log \\dfrac{5}{7}$<br><br>Answer: $\\log 4\\, \\log \\dfrac{5}{7}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
