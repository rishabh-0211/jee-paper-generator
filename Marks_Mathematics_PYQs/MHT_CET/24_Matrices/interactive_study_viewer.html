"image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3028c30a4553e1bdf2b", "type": "singleCorrect", "question": {"text": "If $A = [a_{ij}]_{3\\times3}$, where $a_{ij} = \\begin{cases} 1, & \\text{if } i+j \\text{ is even} \\\\ 0, & \\text{if } i+j \\text{ is odd} \\end{cases}$, then $\\text{adj}(A) = \\ldots$ ..", "image": null}, "options": [{"id": "NWLkp", "label": "A", "text": "$\\begin{bmatrix} 0 & 1 & 0 \\\\ 1 & 0 & 1 \\\\ 0 & 1 & 0 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "3IimC", "label": "B", "text": "$\\begin{bmatrix} 1 & 0 & -1 \\\\ 0 & 0 & 0 \\\\ -1 & 0 & 1 \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "3KhdW", "label": "C", "text": "$\\begin{bmatrix} 0 & 1 & 0 \\\\ 1 & 1 & 1 \\\\ 0 & 1 & 0 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "YmqeN", "label": "D", "text": "$\\begin{bmatrix} 0 & 0 & 1 \\\\ 0 & 1 & 1 \\\\ 1 & 1 & 1 \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = [a_{ij}]_{3\\times3}$ where $a_{ij} = 1$ if $i+j$ is even, and $0$ if $i+j$ is odd.<br><br>Constructing the matrix $A$:<br><br>$A = \\begin{bmatrix} 1 & 0 & 1 \\\\ 0 & 1 & 0 \\\\ 1 & 0 & 1 \\end{bmatrix}$<br><br>The adjoint of $A$ is the transpose of the cofactor matrix $C$. Calculating the cofactors $C_{ij} = (-1)^{i+j} M_{ij}$:<br><br>$C_{11} = 1, C_{12} = 0, C_{13} = -1$<br><br>$C_{21} = 0, C_{22} = 0, C_{23} = 0$<br><br>$C_{31} = -1, C_{32} = 0, C_{33} = 1$<br><br>The cofactor matrix is $C = \\begin{bmatrix} 1 & 0 & -1 \\\\ 0 & 0 & 0 \\\\ -1 & 0 & 1 \\end{bmatrix}$.<br><br>Taking the transpose of $C$ gives the adjoint matrix:<br><br>$\\text{adj}(A) = C^T = \\begin{bmatrix} 1 & 0 & -1 \\\\ 0 & 0 & 0 \\\\ -1 & 0 & 1 \\end{bmatrix}$<br><br>Answer: $\\begin{bmatrix} 1 & 0 & -1 \\\\ 0 & 0 & 0 \\\\ -1 & 0 & 1 \\end{bmatrix}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32b8c30a4553e1be0ed", "type": "singleCorrect", "question": {"text": "Let $A = \\begin{bmatrix} \\cos\\alpha & -\\sin\\alpha & 0 \\\\ \\sin\\alpha & \\cos\\alpha & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$. If $B = \\text{adj}\\,A$, then the matrix $B^{-1}$ is equal to...", "image": null}, "options": [{"id": "znBTN", "label": "A", "text": "$I$", "isCorrect": false, "image": null}, {"id": "qDTBO", "label": "B", "text": "$A^{-1}$", "isCorrect": false, "image": null}, {"id": "EWO7o", "label": "C", "text": "$-A$", "isCorrect": false, "image": null}, {"id": "gsMMr", "label": "D", "text": "$A$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The determinant of matrix $A$ is given by<br><br>$|A| = \\cos\\alpha(\\cos\\alpha - 0) - (-\\sin\\alpha)(\\sin\\alpha - 0) + 0$<br><br>$|A| = \\cos^2\\alpha + \\sin^2\\alpha = 1$<br><br>We know the property of adjoint of a matrix:<br><br>$A(\\text{adj}\\,A) = |A|I$<br><br>Substituting $|A| = 1$, we get<br><br>$A(\\text{adj}\\,A) = I$<br><br>$\\Rightarrow \\text{adj}\\,A = A^{-1}$<br><br>It is given that $B = \\text{adj}\\,A$, so<br><br>$B = A^{-1}$<br><br>Taking the inverse on both sides, we obtain<br><br>$B^{-1} = (A^{-1})^{-1} = A$<br><br>Answer: $A$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33b8c30a4553e1be193", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 5a & -b \\\\ 3 & 2 \\end{bmatrix}$ and $A\\,(\\text{adj }A) = AA^T$, Then $5a + b =$", "image": null}, "options": [{"id": "QbNeO", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "75neR", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "OYjTc", "label": "C", "text": "$5$", "isCorrect": true, "image": null}, {"id": "UeOQk", "label": "D", "text": "$\\dfrac{15}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} 5a & -b \\\\ 3 & 2 \\end{bmatrix}$.<br><br>Using the property $A(\\text{adj } A) = |A|I$, the given equation becomes $AA^T = |A|I$.<br><br>$|A| = (5a)(2) - (-b)(3) = 10a + 3b$<br><br>$AA^T = \\begin{bmatrix} 5a & -b \\\\ 3 & 2 \\end{bmatrix} \\begin{bmatrix} 5a & 3 \\\\ -b & 2 \\end{bmatrix} = \\begin{bmatrix} 25a^2 + b^2 & 15a - 2b \\\\ 15a - 2b & 13 \\end{bmatrix}$<br><br>Equating $AA^T$ to $|A|I$:<br><br>$\\begin{bmatrix} 25a^2 + b^2 & 15a - 2b \\\\ 15a - 2b & 13 \\end{bmatrix} = \\begin{bmatrix} 10a + 3b & 0 \\\\ 0 & 10a + 3b \\end{bmatrix}$<br><br>From the off-diagonal elements:<br><br>$15a - 2b = 0 \\Rightarrow b = \\dfrac{15a}{2}$<br><br>From the bottom-right elements:<br><br>$10a + 3b = 13$<br><br>Substituting $b = \\dfrac{15a}{2}$ into the equation:<br><br>$10a + 3\\left(\\dfrac{15a}{2}\\right) = 13$<br><br>$\\dfrac{20a + 45a}{2} = 13$<br><br>$\\dfrac{65a}{2} = 13 \\Rightarrow a = \\dfrac{26}{65} = \\dfrac{2}{5}$<br><br>Substituting $a = \\dfrac{2}{5}$ to find $b$:<br><br>$b = \\dfrac{15}{2} \\left(\\dfrac{2}{5}\\right) = 3$<br><br>$5a + b = 5\\left(\\dfrac{2}{5}\\right) + 3 = 2 + 3 = 5$<br><br>Answer: $5$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31d8c30a4553e1be056", "type": "singleCorrect", "question": {"text": "Let $A = \\begin{bmatrix} 2k-1 & 1 & 1 \\\\ 0 & 2k-1 & 1 \\\\ 0 & 0 & 2k-1 \\end{bmatrix}$ and $B = \\begin{bmatrix} 0 & 2k-1 & 1 \\\\ 1-2k & 0 & k \\\\ -1 & -k & 0 \\end{bmatrix}$ where k is a real number. If $\\det(\\text{adj} A) + \\det(\\text{adj} B) = 11^6$, then the value of $k - 5$ is equal to...", "image": null}, "options": [{"id": "uf5A3", "label": "A", "text": "$1$", "isCorrect": true, "image": null}, {"id": "cwXNk", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "S8QIW", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "81n7L", "label": "D", "text": "$6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The determinant of the upper triangular matrix $A$ is the product of its diagonal elements:<br><br>$|A| = (2k-1)^3$<br><br>The matrix $B$ is a skew-symmetric matrix of odd order ($3 \\times 3$), so its determinant is zero:<br><br>$|B| = 0$<br><br>Using the property $|\\text{adj} M| = |M|^{n-1}$ for a matrix of order $n$, we have:<br><br>$|\\text{adj} A| = |A|^2 = ((2k-1)^3)^2 = (2k-1)^6$<br><br>$|\\text{adj} B| = |B|^2 = 0$<br><br>Given $|\\text{adj} A| + |\\text{adj} B| = 11^6$, we get:<br><br>$(2k-1)^6 + 0 = 11^6$<br><br>$2k-1 = \\pm 11$<br><br>$2k = 12 \\Rightarrow k = 6$<br><br>$2k = -10 \\Rightarrow k = -5$<br><br>Checking the given options for the value of $k - 5$:<br><br>If $k = 6$, $k - 5 = 6 - 5 = 1$<br><br>If $k = -5$, $k - 5 = -5 - 5 = -10$<br><br>Since $-10$ is not among the options, we take $k = 6$, which gives $1$.<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a08c30a4553e1bdb10", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} \\sec\\theta & -\\tan\\theta \\\\ -\\tan\\theta & \\sec\\theta \\end{bmatrix}$, $\\theta \\in \\left(0, \\dfrac{\\pi}{2}\\right)$ such that $A + adj\\,A = 4I$, then $\\theta =$", "image": null}, "options": [{"id": "NZZwc", "label": "A", "text": "$\\dfrac{\\pi}{12}$", "isCorrect": false, "image": null}, {"id": "Yw0Gd", "label": "B", "text": "$\\dfrac{\\pi}{6}$", "isCorrect": false, "image": null}, {"id": "LzaaK", "label": "C", "text": "$\\dfrac{\\pi}{3}$", "isCorrect": true, "image": null}, {"id": "7dtaw", "label": "D", "text": "$\\dfrac{\\pi}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} \\sec\\theta & -\\tan\\theta \\\\ -\\tan\\theta & \\sec\\theta \\end{bmatrix}$<br><br>The adjoint of a $2 \\times 2$ matrix $\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}$ is $\\begin{bmatrix} d & -b \\\\ -c & a \\end{bmatrix}$.<br><br>$adj\\,A = \\begin{bmatrix} \\sec\\theta & \\tan\\theta \\\\ \\tan\\theta & \\sec\\theta \\end{bmatrix}$<br><br>$A + adj\\,A = \\begin{bmatrix} \\sec\\theta & -\\tan\\theta \\\\ -\\tan\\theta & \\sec\\theta \\end{bmatrix} + \\begin{bmatrix} \\sec\\theta & \\tan\\theta \\\\ \\tan\\theta & \\sec\\theta \\end{bmatrix} = \\begin{bmatrix} 2\\sec\\theta & 0 \\\\ 0 & 2\\sec\\theta \\end{bmatrix}$<br><br>Given $A + adj\\,A = 4I$, we have:<br><br>$\\begin{bmatrix} 2\\sec\\theta & 0 \\\\ 0 & 2\\sec\\theta \\end{bmatrix} = \\begin{bmatrix} 4 & 0 \\\\ 0 & 4 \\end{bmatrix}$<br><br>$2\\sec\\theta = 4 \\Rightarrow \\sec\\theta = 2$<br><br>Since $\\theta \\in \\left(0, \\dfrac{\\pi}{2}\\right)$, $\\theta = \\dfrac{\\pi}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c05bf9280d7f9932e90", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $A=\\left[\\begin{array}{rrr}1 & -2 & 2 \\\\ 0 & 2 & -3 \\\\ 3 & -2 & 4\\end{array}\\right]$ then $A(I+\\operatorname{adj} A)=$", "image": null}, "options": [{"id": "TZJ8K", "text": "$\\left[\\begin{array}{rrr}9 & -2 & 2 \\\\ 0 & 10 & -3 \\\\ 3 & -2 & 11\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "tfegm", "text": "$\\left[\\begin{array}{ccr}8 & -2 & 2 \\\\ 0 & 9 & -3 \\\\ 3 & -2 & 10\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "7jkjU", "text": "$\\left[\\begin{array}{rrr}9 & -2 & 2 \\\\ 0 & 10 & -3 \\\\ 3 & -2 & 12\\end{array}\\right]$", "image": null, "isCorrect": true}, {"id": "QEbAi", "text": "$\\left[\\begin{array}{crr}3 & 2 & -2 \\\\ 0 & 10 & 3 \\\\ -3 & 2 & 12\\end{array}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The determinant of matrix $A$ is given by:<br><br>$|A| = 1(8 - 6) - (-2)(0 - (-9)) + 2(0 - 6)$<br><br>$|A| = 1(2) + 2(9) + 2(-6) = 2 + 18 - 12 = 8$<br><br>Using the property of matrices, $A(\\operatorname{adj} A) = |A|I$.<br><br>We need to find the value of $A(I + \\operatorname{adj} A)$:<br><br>$A(I + \\operatorname{adj} A) = AI + A(\\operatorname{adj} A)$<br><br>$A(I + \\operatorname{adj} A) = A + |A|I$<br><br>Substituting $|A| = 8$, we get:<br><br>$A + 8I = \\left[\\begin{array}{rrr}1 & -2 & 2 \\\\ 0 & 2 & -3 \\\\ 3 & -2 & 4\\end{array}\\right] + \\left[\\begin{array}{rrr}8 & 0 & 0 \\\\ 0 & 8 & 0 \\\\ 0 & 0 & 8\\end{array}\\right]$<br><br>$A + 8I = \\left[\\begin{array}{rrr}9 & -2 & 2 \\\\ 0 & 10 & -3 \\\\ 3 & -2 & 12\\end{array}\\right]$<br><br>Answer: $\\left[\\begin{array}{rrr}9 & -2 & 2 \\\\ 0 & 10 & -3 \\\\ 3 & -2 & 12\\end{array}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc0bf9280d7f9932c19", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{A}=\\left[\\begin{array}{cc}5 a & -\\mathrm{b} \\\\ 3 & 2\\end{array}\\right]$ and A.adj $\\mathrm{A}=\\mathrm{AA}^{\\mathrm{T}}$, then $5 a+\\mathrm{b}=$", "image": null}, "options": [{"id": "sSyzs", "text": "7", "image": null, "isCorrect": false}, {"id": "xdeIZ", "text": "9", "image": null, "isCorrect": false}, {"id": "MRDY2", "text": "13", "image": null, "isCorrect": false}, {"id": "yB4l1", "text": "5", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $\\mathrm{A} = \\begin{bmatrix} 5a & -b \\\\ 3 & 2 \\end{bmatrix}$<br><br>We know that $\\mathrm{A} \\cdot \\text{adj}(\\mathrm{A}) = |\\mathrm{A}| \\mathrm{I}$<br><br>$|\\mathrm{A}| = (5a)(2) - (-b)(3) = 10a + 3b$<br><br>$\\mathrm{A} \\cdot \\text{adj}(\\mathrm{A}) = \\begin{bmatrix} 10a + 3b & 0 \\\\ 0 & 10a + 3b \\end{bmatrix}$<br><br>Now, calculate $\\mathrm{A}\\mathrm{A}^{\\mathrm{T}}$:<br><br>$\\mathrm{A}\\mathrm{A}^{\\mathrm{T}} = \\begin{bmatrix} 5a & -b \\\\ 3 & 2 \\end{bmatrix} \\begin{bmatrix} 5a & 3 \\\\ -b & 2 \\end{bmatrix} = \\begin{bmatrix} 25a^2 + b^2 & 15a - 2b \\\\ 15a - 2b & 9 + 4 \\end{bmatrix} = \\begin{bmatrix} 25a^2 + b^2 & 15a - 2b \\\\ 15a - 2b & 13 \\end{bmatrix}$<br><br>Since $\\mathrm{A} \\cdot \\text{adj}(\\mathrm{A}) = \\mathrm{A}\\mathrm{A}^{\\mathrm{T}}$, we equate the corresponding elements:<br><br>$15a - 2b = 0 \\Rightarrow b = \\dfrac{15a}{2}$<br><br>$10a + 3b = 13$<br><br>Substituting $b = \\dfrac{15a}{2}$ into the second equation:<br><br>$10a + 3\\left(\\dfrac{15a}{2}\\right) = 13$<br><br>$\\dfrac{20a + 45a}{2} = 13$<br><br>$\\dfrac{65a}{2} = 13 \\Rightarrow 65a = 26 \\Rightarrow a = \\dfrac{26}{65} = \\dfrac{2}{5}$<br><br>Now, find $b$:<br><br>$b = \\dfrac{15}{2} \\times \\dfrac{2}{5} = 3$<br><br>Therefore, $5a + b = 5\\left(\\dfrac{2}{5}\\right) + 3 = 2 + 3 = 5$<br><br>Answer: 5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9ebf9280d7f9932af1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $A=\\left[\\begin{array}{rrr}1 & -1 & 1 \\\\ 0 & 2 & -3 \\\\ 2 & 1 & 0\\end{array}\\right], B=\\operatorname{adj} A$ and $C=5 A$, then $\\frac{|\\operatorname{adj} B|}{|C|}=$", "image": null}, "options": [{"id": "gbT5i", "text": "2", "image": null, "isCorrect": false}, {"id": "UWzGD", "text": "4", "image": null, "isCorrect": false}, {"id": "GISSi", "text": "1", "image": null, "isCorrect": true}, {"id": "8IpJ4", "text": "5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The determinant of matrix $A$ is calculated as:<br><br>$|A| = 1(2 \\times 0 - (-3) \\times 1) - (-1)(0 \\times 0 - (-3) \\times 2) + 1(0 \\times 1 - 2 \\times 2)$<br><br>$|A| = 1(3) + 1(6) + 1(-4) = 3 + 6 - 4 = 5$<br><br>We are given $B = \\operatorname{adj} A$. Using the property of determinants, $|\\operatorname{adj} A| = |A|^{n-1}$, where $n$ is the order of the matrix. Here, $n = 3$.<br><br>$|B| = |\\operatorname{adj} A| = |A|^{3-1} = |A|^2$<br><br>Now, we need to find $|\\operatorname{adj} B|$:<br><br>$|\\operatorname{adj} B| = |B|^{n-1} = |B|^2$<br><br>Substituting $|B| = |A|^2$, we get:<br><br>$|\\operatorname{adj} B| = (|A|^2)^2 = |A|^4 = 5^4$<br><br>We are also given $C = 5A$. Using the property $|kA| = k^n|A|$:<br><br>$|C| = |5A| = 5^3|A| = 5^3 \\times 5 = 5^4$<br><br>Finally, the required ratio is:<br><br>$\\dfrac{|\\operatorname{adj} B|}{|C|} = \\dfrac{5^4}{5^4} = 1$<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5dbf9280d7f9932897", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let $A$ be a non-singular matrix of order $n$ and $|A|=k$, then $(\\operatorname{adj} A)^{-1}$ is", "image": null}, "options": [{"id": "ttLTt", "text": "$\\frac{\\mathrm{A}}{\\mathrm{k}}$", "image": null, "isCorrect": true}, {"id": "YlPv7", "text": "$\\mathrm{k}^{\\mathrm{n}-1}(\\operatorname{adj} \\mathrm{~A})$", "image": null, "isCorrect": false}, {"id": "D8TJr", "text": "$\\mathrm{k}^{\\mathrm{n}-2} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "hdcmE", "text": "kA", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that for a non-singular matrix $A$,<br><br>$A(\\operatorname{adj} A) = |A|I$<br><br>Post-multiplying both sides by $(\\operatorname{adj} A)^{-1}$, we get<br><br>$A(\\operatorname{adj} A)(\\operatorname{adj} A)^{-1} = |A|I(\\operatorname{adj} A)^{-1}$<br><br>$A = |A|(\\operatorname{adj} A)^{-1}$<br><br>Given $|A| = k$, substituting this value yields<br><br>$A = k(\\operatorname{adj} A)^{-1}$<br><br>$(\\operatorname{adj} A)^{-1} = \\dfrac{A}{k}$<br><br>Answer: $\\frac{\\mathrm{A}}{\\mathrm{k}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4fbf9280d7f9932816", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The third element in the second row of adjoint of a matrix $\\mathrm{A}=\\left[\\mathrm{a}_{\\mathrm{ij}}\\right]_{3 \\times 3}\\left(\\right.$ where $\\left.\\mathrm{a}_{\\mathrm{ij}}=2 \\mathrm{i}+\\mathrm{j}\\right)$ is", "image": null}, "options": [{"id": "B3z5m", "text": "$2$", "image": null, "isCorrect": false}, {"id": "1dlxe", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "DP4ro", "text": "$4$", "image": null, "isCorrect": true}, {"id": "lYr4S", "text": "$-4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The elements of the matrix $A = [a_{ij}]_{3 \\times 3}$ are given by $a_{ij} = 2i + j$.<br><br>Constructing the matrix $A$:<br>$a_{11} = 2(1) + 1 = 3$, $a_{12} = 2(1) + 2 = 4$, $a_{13} = 2(1) + 3 = 5$<br>$a_{21} = 2(2) + 1 = 5$, $a_{22} = 2(2) + 2 = 6$, $a_{23} = 2(2) + 3 = 7$<br>$a_{31} = 2(3) + 1 = 7$, $a_{32} = 2(3) + 2 = 8$, $a_{33} = 2(3) + 3 = 9$<br><br>Thus, $A = \\begin{bmatrix} 3 & 4 & 5 \\\\ 5 & 6 & 7 \\\\ 7 & 8 & 9 \\end{bmatrix}$.<br><br>The adjoint of matrix $A$, denoted as $\\text{adj}(A)$, is the transpose of the cofactor matrix $C$.<br>The third element in the second row of $\\text{adj}(A)$ corresponds to the element at position $(2, 3)$ in $\\text{adj}(A)$.<br>Since $\\text{adj}(A) = C^T$, the element at position $(2, 3)$ in $\\text{adj}(A)$ is the element at position $(3, 2)$ in the cofactor matrix $C$, which is $C_{32}$.<br><br>The cofactor $C_{32}$ is given by $(-1)^{3+2} M_{32}$, where $M_{32}$ is the minor of $a_{32}$.<br>Deleting the third row and second column of $A$, we get the minor $M_{32}$:<br>$M_{32} = \\begin{vmatrix} 3 & 5 \\\\ 5 & 7 \\end{vmatrix} = (3 \\times 7) - (5 \\times 5) = 21 - 25 = -4$<br><br>Therefore, the cofactor is:<br>$C_{32} = -(-4) = 4$<br><br>Answer: $4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214270aee93fa0796de63", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "If $A=\\left[\\begin{array}{cc}5 a & -b \\\\ 3 & 2\\end{array}\\right]$ and $A \\cdot \\operatorname{adj} A=AA^T$, then $5 \\mathrm{a}+\\mathrm{b}$ is equal to", "image": null}, "options": [{"id": "XxPWe", "text": "-1", "image": null, "isCorrect": false}, {"id": "pbU3E", "text": "5", "image": null, "isCorrect": true}, {"id": "XQvuR", "text": "3", "image": null, "isCorrect": false}, {"id": "OtqIC", "text": "13", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} 5a & -b \\\\ 3 & 2 \\end{bmatrix}$.<br><br>We know that $A \\cdot \\operatorname{adj} A = |A| I$.<br><br>$|A| = (5a)(2) - (-b)(3) = 10a + 3b$<br><br>So, $A \\cdot \\operatorname{adj} A = \\begin{bmatrix} 10a + 3b & 0 \\\\ 0 & 10a + 3b \\end{bmatrix}$<br><br>Now, calculate $A A^T$:<br><br>$A A^T = \\begin{bmatrix} 5a & -b \\\\ 3 & 2 \\end{bmatrix} \\begin{bmatrix} 5a & 3 \\\\ -b & 2 \\end{bmatrix} = \\begin{bmatrix} 25a^2 + b^2 & 15a - 2b \\\\ 15a - 2b & 13 \\end{bmatrix}$<br><br>Since $A \\cdot \\operatorname{adj} A = A A^T$, we equate the corresponding elements:<br><br>$15a - 2b = 0 \\Rightarrow b = \\dfrac{15a}{2}$<br><br>$10a + 3b = 13$<br><br>Substituting the value of $b$ into the second equation:<br><br>$10a + 3\\left(\\dfrac{15a}{2}\\right) = 13$<br><br>$10a + \\dfrac{45a}{2} = 13$<br><br>$\\dfrac{65a}{2} = 13 \\Rightarrow a = \\dfrac{26}{65} = \\dfrac{2}{5}$<br><br>Now, find $b$:<br><br>$b = \\dfrac{15}{2} \\times \\dfrac{2}{5} = 3$<br><br>Therefore, the value of $5a + b$ is:<br><br>$5a + b = 5\\left(\\dfrac{2}{5}\\right) + 3 = 2 + 3 = 5$<br><br>Answer: 5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262720279619d9d8a3497", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Let $A=\\left[\\begin{array}{cc}2 & -1 \\\\ 0 & 2\\end{array}\\right]$.\nIf $\\mathrm{B}=\\mathrm{I}-{ }^3 \\mathrm{C}_1(\\operatorname{adj} \\mathrm{A})+{ }^3 \\mathrm{C}_2(\\operatorname{adj} \\mathrm{A})^2-{ }^3 \\mathrm{C}_3(\\operatorname{adj} \\mathrm{A})^3$, then the sum of all elements of the matrix $B$ is", "image": null}, "options": [{"id": "hecmW", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "Se8s5", "text": "$-3$", "image": null, "isCorrect": false}, {"id": "5Icif", "text": "$-4$", "image": null, "isCorrect": false}, {"id": "G1b7G", "text": "$-5$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\mathrm{B} & =\\mathrm{I}-{ }^3 \\mathrm{C}_1(\\operatorname{adj} \\mathrm{A})+{ }^3 \\mathrm{C}_2(\\operatorname{adj} \\mathrm{A})^2-{ }^3 \\mathrm{C}_3(\\operatorname{adj} \\mathrm{A})^3 \\\\\n& =\\mathrm{I}-3 \\operatorname{adj} \\mathrm{A}+3(\\operatorname{adj} \\mathrm{A})^2-1(\\operatorname{adj} \\mathrm{A})^3 \\\\\n& =(\\mathrm{I}-\\operatorname{adj} \\mathrm{A})^3 \\\\\n\\operatorname{adj} \\mathrm{A} & =\\left[\\begin{array}{ll}\n2 & 1 \\\\\n0 & 2\n\\end{array}\\right] \\\\\n\\therefore \\quad \\mathrm{B} & =\\left(\\left[\\begin{array}{ll}\n1 & 0 \\\\\n0 & 1\n\\end{array}\\right]-\\left[\\begin{array}{ll}\n2 & 1 \\\\\n0 & 2\n\\end{array}\\right]\\right)^3 \\\\\n& =\\left[\\begin{array}{rr}\n-1 & -1 \\\\\n0 & -1\n\\end{array}\\right] \\\\\n& =\\left[\\begin{array}{rr}\n-1 & -1 \\\\\n0 & -1\n\\end{array}\\righ ></mrow></msub><msub><mrow><mi>A</mi></mrow><mrow><mn>22</mn></mrow></msub><mo>+</mo><msub><mrow><mi>a</mi></mrow><mrow><mn>13</mn></mrow></msub><msub><mrow><mi>A</mi></mrow><mrow><mn>23</mn></mrow></msub><mo>=</mo><mn>1</mn><mo>×</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn></mrow></mfenced><mo>+</mo><mn>1</mn><mo>×</mo><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>+</mo><mn>0</mn><mo>×</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e470279619d9d8a132a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "If $A$ is a square matrix of order $n \\times n$, then $\\operatorname{adj}(\\operatorname{adj} A)$ is equal to", "image": null}, "options": [{"id": "hOcl8", "text": "| $\\left.A\\right|^{n} A$", "image": null, "isCorrect": false}, {"id": "nYdgH", "text": "$|A|^{n-1} A$", "image": null, "isCorrect": false}, {"id": "bPU1V", "text": "$|A|^{n-2} A$", "image": null, "isCorrect": true}, {"id": "Hxnsl", "text": "$|A|^{n-3} A$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For any square matrix $B$, we have $B(\\operatorname{adj} B)=|B| I_{n}$\nOn taking $B=\\operatorname{adj} A$, we get $(\\operatorname{adj} A)[\\operatorname{adj}(\\operatorname{adj} A)]=|\\operatorname{adj} A| I_{n}$\n$$\n\\Rightarrow \\quad \\operatorname{adj} A[\\operatorname{adj}(\\operatorname{adj} A)]=|A|^{n-1} I_{n}\n$$\n$\\left(\\because|\\operatorname{adj} A|=|A|^{n-1}\\right)$\n$\\Rightarrow(A \\operatorname{adj} A)[\\operatorname{adj}(\\operatorname{adj} A)]=|A|^{n-1} A$\n$\\Rightarrow\\left(|A| I_{n}\\right)[\\operatorname{adj}(\\operatorname{adj} A)]=|A|^{n-1} A$\n$\\Rightarrow$\n$(\\operatorname{adj} A)=|A|^{n-2} A$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2633c0279619d9d8a3d53", "title": "Inverse of a Matrix", "totalQuestions": 104, "questions": [{"_id": "6abb88a515a9fc0fc8c145ae", "type": "singleCorrect", "question": {"text": "The sum of the matrix $\\begin{bmatrix} 2 & -3 \\\\ 5 & -7 \\end{bmatrix}$ and its multiplicative inverse is", "image": null}, "options": [{"id": "Kq2D8", "label": "A", "text": "$\\begin{bmatrix} 2 & -3 \\\\ 5 & -7 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "XoNA2", "label": "B", "text": "$\\begin{bmatrix} -7 & 3 \\\\ -5 & 2 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "aoNmI", "label": "C", "text": "$\\begin{bmatrix} -5 & 0 \\\\ 0 & -5 \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "xLZNB", "label": "D", "text": "$\\begin{bmatrix} 1 & 0 \\\\ 0 & 1 \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $A = \\begin{bmatrix} 2 & -3 \\\\ 5 & -7 \\end{bmatrix}$<br><br>The determinant of $A$ is $|A| = (2)(-7) - (-3)(5) = -14 + 15 = 1$<br><br>The multiplicative inverse of $A$ is $A^{-1} = \\dfrac{1}{|A|} \\text{adj}(A) = \\begin{bmatrix} -7 & 3 \\\\ -5 & 2 \\end{bmatrix}$<br><br>The sum of the matrix and its inverse is $A + A^{-1} = \\begin{bmatrix} 2 & -3 \\\\ 5 & -7 \\end{bmatrix} + \\begin{bmatrix} -7 & 3 \\\\ -5 & 2 \\end{bmatrix} = \\begin{bmatrix} -5 & 0 \\\\ 0 & -5 \\end{bmatrix}$<br><br>Answer: $\\begin{bmatrix} -5 & 0 \\\\ 0 & -5 \\end{bmatrix}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884615a9fc0fc8c1422a", "type": "singleCorrect", "question": {"text": "Let $A = \\begin{bmatrix} 1 & 2 \\\\ -5 & 1 \\end{bmatrix}$ and $A^{-1} = xA + yI$, then the pair $(x,y) = \\cdots$", "image": null}, "options": [{"id": "g7uya", "label": "A", "text": "$\\left(\\dfrac{1}{11}, \\dfrac{2}{11}\\right)$", "isCorrect": false, "image": null}, {"id": "r6iad", "label": "B", "text": "$\\left(\\dfrac{1}{11}, -\\dfrac{2}{11}\\right)$", "isCorrect": false, "image": null}, {"id": "o7qvJ", "label": "C", "text": "$\\left(-\\dfrac{1}{11}, -\\dfrac{2}{11}\\right)$", "isCorrect": false, "image": null}, {"id": "Qhh8J", "label": "D", "text": "$\\left(-\\dfrac{1}{11}, \\dfrac{2}{11}\\right)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The characteristic equation of matrix $A$ is given by $|A - \\lambda I| = 0$.<br><br>$\\begin{vmatrix} 1 - \\lambda & 2 \\\\ -5 & 1 - \\lambda \\end{vmatrix} = 0$<br><br>$(1 - \\lambda)^2 + 10 = 0$<br><br>$\\lambda^2 - 2\\lambda + 11 = 0$<br><br>By the Cayley-Hamilton theorem, every square matrix satisfies its own characteristic equation. Thus,<br><br>$A^2 - 2A + 11I = 0$<br><br>Multiplying both sides by $A^{-1}$, we get:<br><br>$A - 2I + 11A^{-1} = 0$<br><br>$11A^{-1} = -A + 2I$<br><br>$A^{-1} = -\\dfrac{1}{11}A + \\dfrac{2}{11}I$<br><br>Comparing this with the given equation $A^{-1} = xA + yI$, we obtain:<br><br>$x = -\\dfrac{1}{11}, y = \\dfrac{2}{11}$<br><br>The pair $(x,y)$ is $\\left(-\\dfrac{1}{11}, \\dfrac{2}{11}\\right)$.<br><br>Answer: $\\left(-\\dfrac{1}{11}, \\dfrac{2}{11}\\right)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884615a9fc0fc8c14228", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 2 & -3 \\\\ 5 & -7 \\end{bmatrix}$, then $A - A^{-1} =$", "image": null}, "options": [{"id": "Sj5aA", "label": "A", "text": "$\\begin{bmatrix} -9 & 6 \\\\ -10 & 9 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "sahw8", "label": "B", "text": "$\\begin{bmatrix} 9 & -6 \\\\ 10 & -9 \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "eRRdN", "label": "C", "text": "$\\begin{bmatrix} -9 & 10 \\\\ -6 & 9 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "1RIeJ", "label": "D", "text": "$\\begin{bmatrix} 9 & -10 \\\\ 6 & -9 \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} 2 & -3 \\\\ 5 & -7 \\end{bmatrix}$<br><br>The determinant of $A$ is $|A| = (2)(-7) - (-3)(5) = -14 + 15 = 1$<br><br>The inverse of $A$ is $A^{-1} = \\dfrac{1}{|A|} \\begin{bmatrix} -7 & 3 \\\\ -5 & 2 \\end{bmatrix} = \\begin{bmatrix} -7 & 3 \\\\ -5 & 2 \\end{bmatrix}$<br><br>Now, $A - A^{-1} = \\begin{bmatrix} 2 & -3 \\\\ 5 & -7 \\end{bmatrix} - \\begin{bmatrix} -7 & 3 \\\\ -5 & 2 \\end{bmatrix}$<br><br>$A - A^{-1} = \\begin{bmatrix} 2 - (-7) & -3 - 3 \\\\ 5 - (-5) & -7 - 2 \\end{bmatrix} = \\begin{bmatrix} 9 & -6 \\\\ 10 & -9 \\end{bmatrix}$<br><br>Answer: $\\begin{bmatrix} 9 & -6 \\\\ 10 & -9 \\end{bmatrix}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885615a9fc0fc8c142c1", "type": "singleCorrect", "question": {"text": "If $A^{-1} = \\begin{bmatrix} 1 & 0 & -4 \\\\ 0 & -1 & 2 \\\\ -1 & 2 & 1 \\end{bmatrix} = \\dfrac{\\text{adj}(A)}{k}$, then $k$ is a root of the equation...", "image": null}, "options": [{"id": "KrSLJ", "label": "A", "text": "$x^2 + 1 = 0$", "isCorrect": false, "image": null}, {"id": "bIaLX", "label": "B", "text": "$x^2 - 1 = 0$", "isCorrect": true, "image": null}, {"id": "kc4xG", "label": "C", "text": "$x^2 - 2 = 0$", "isCorrect": false, "image": null}, {"id": "kG62H", "label": "D", "text": "$x^2 - x + 1 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We know that $A^{-1} = \\dfrac{\\text{adj}(A)}{|A|}$.<br><br>Given $A^{-1} = \\dfrac{\\text{adj}(A)}{k}$, we get $k = |A|$.<br><br>The determinant of $A^{-1}$ is given by:<br><br>$|A^{-1}| = \\begin{vmatrix} 1 & 0 & -4 \\\\ 0 & -1 & 2 \\\\ -1 & 2 & 1 \\end{vmatrix}$<br><br>$|A^{-1}| = 1(-1 - 4) - 0 + (-4)(0 - 1)$<br><br>$|A^{-1}| = -5 + 4 = -1$<br><br>Since $|A| = \\dfrac{1}{|A^{-1}|}$, we have:<br><br>$k = |A| = \\dfrac{1}{-1} = -1$<br><br>Now, substituting $x = -1$ in the given options, we find that it satisfies the equation $x^2 - 1 = 0$.<br><br>Answer: $x^2 - 1 = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887615a9fc0fc8c143ed", "type": "singleCorrect", "question": {"text": "If the matrix $A = \\begin{bmatrix} 1 & 2 & 3 \\\\ 1 & 1 & 5 \\\\ 2 & 4 & 7 \\end{bmatrix}$ and its inverse is $A^{-1} = \\begin{bmatrix} a & c & -7 \\\\ b & -1 & c \\\\ -2 & 0 & 1 \\end{bmatrix}$, then ....", "image": null}, "options": [{"id": "fzclt", "label": "A", "text": "$a = 13,\\ b = -3,\\ c = 0$", "isCorrect": false, "image": null}, {"id": "JURnJ", "label": "B", "text": "$a = 13,\\ b = 3,\\ c = -2$", "isCorrect": false, "image": null}, {"id": "tGJtH", "label": "C", "text": "$a = 13,\\ b = -7,\\ c = 2$", "isCorrect": false, "image": null}, {"id": "tdqT0", "label": "D", "text": "$a = 13,\\ b = -3,\\ c = 2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Since $A A^{-1} = I$, we can multiply the matrices and equate the corresponding elements to the identity matrix.<br><br>$A A^{-1} = \\begin{bmatrix} 1 & 2 & 3 \\\\ 1 & 1 & 5 \\\\ 2 & 4 & 7 \\end{bmatrix} \\begin{bmatrix} a & c & -7 \\\\ b & -1 & c \\\\ -2 & 0 & 1 \\end{bmatrix} = \\begin{bmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$<br><br>Multiplying the first row of $A$ with the second column of $A^{-1}$:<br>$1(c) + 2(-1) + 3(0) = 0 \\Rightarrow c - 2 = 0 \\Rightarrow c = 2$<br><br>Multiplying the second row of $A$ with the first column of $A^{-1}$:<br>$1(a) + 1(b) + 5(-2) = 0 \\Rightarrow a + b = 10$<br><br>Multiplying the first row of $A$ with the first column of $A^{-1}$:<br>$1(a) + 2(b) + 3(-2) = 1 \\Rightarrow a + 2b = 7$<br><br>Subtracting the equation $a + b = 10$ from $a + 2b = 7$:<br>$(a + 2b) - (a + b) = 7 - 10 \\Rightarrow b = -3$<br><br>Substituting $b = -3$ into $a + b = 10$:<br>$a - 3 = 10 \\Rightarrow a = 13$<br><br>Therefore, $a = 13$, $b = -3$, and $c = 2$.<br><br>Answer: $a = 13,\\ b = -3,\\ c = 2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888615a9fc0fc8c14483", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 4 & 5 \\\\ 2 & 1 \\end{bmatrix}$, then $A^{-1} =$", "image": null}, "options": [{"id": "eZ181", "label": "A", "text": "$\\dfrac{1}{6}(A - 4I)$", "isCorrect": false, "image": null}, {"id": "47iiW", "label": "B", "text": "$\\dfrac{1}{6}(A + 5I)$", "isCorrect": false, "image": null}, {"id": "JmNyj", "label": "C", "text": "$\\dfrac{1}{6}(A + 4I)$", "isCorrect": false, "image": null}, {"id": "AUIQd", "label": "D", "text": "$\\dfrac{1}{6}(A - 5I)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The characteristic equation of matrix $A$ is given by $|A - \\lambda I| = 0$.<br><br>$(4 - \\lambda)(1 - \\lambda) - 10 = 0$<br><br>$\\lambda^2 - 5\\lambda - 6 = 0$<br><br>By the Cayley-Hamilton theorem, every square matrix satisfies its own characteristic equation. Substituting $A$ for $\\lambda$, we get:<br><br>$A^2 - 5A - 6I = 0$<br><br>Multiplying both sides by $A^{-1}$, we obtain:<br><br>$A - 5I - 6A^{-1} = 0$<br><br>$6A^{-1} = A - 5I$<br><br>$A^{-1} = \\dfrac{1}{6}(A - 5I)$<br><br>Answer: $\\dfrac{1}{6}(A - 5I)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888515a9fc0fc8c14480", "type": "singleCorrect", "question": {"text": "If $A^{-1} = \\begin{bmatrix} 3 & -1 & 1 \\\\ -15 & 6 & -5 \\\\ 5 & -2 & 2 \\end{bmatrix}$ and $B = \\begin{bmatrix} 1 & 2 & -2 \\\\ -1 & 3 & 0 \\\\ 0 & -2 & 1 \\end{bmatrix}$, then $(AB)^{-1} =$", "image": null}, "options": [{"id": "hiafa", "label": "A", "text": "$\\begin{bmatrix} 9 & -3 & 5 \\\\ -2 & 1 & 0 \\\\ 1 & 0 & 2 \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "Bx0bB", "label": "B", "text": "$\\begin{bmatrix} 9 & 3 & -5 \\\\ -2 & -1 & 0 \\\\ 1 & 0 & 2 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "28lah", "label": "C", "text": "$\\begin{bmatrix} 9 & -3 & 5 \\\\ -2 & -1 & 0 \\\\ 1 & 0 & -2 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "JSBut", "label": "D", "text": "$\\begin{bmatrix} 9 & -3 & 5 \\\\ -2 & 1 & 0 \\\\ 1 & 0 & -2 \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the property of the inverse of a product of matrices, $(AB)^{-1} = B^{-1} A^{-1}$.<br><br>First, we find $B^{-1}$. The determinant of $B$ is:<br>$|B| = 1(3 - 0) - 2(-1 - 0) - 2(2 - 0) = 3 + 2 - 4 = 1$<br><br>The cofactor matrix of $B$ is calculated as follows:<br>$C_{11} = 3, C_{12} = 1, C_{13} = 2$<br>$C_{21} = 2, C_{22} = 1, C_{23} = 2$<br>$C_{31} = 6, C_{32} = 2, C_{33} = 5$<br><br>The adjoint of $B$ is the transpose of the cofactor matrix:<br>$\\text{adj}(B) = \\begin{bmatrix} 3 & 2 & 6 \\ 1 & 1 & 2 \\ 2 & 2 & 5 \\end{bmatrix}$<br><br>Since $|B| = 1$, $B^{-1} = \\dfrac{1}{|B|} \\text{adj}(B) = \\begin{bmatrix} 3 & 2 & 6 \\ 1 & 1 & 2 \\ 2 & 2 & 5 \\end{bmatrix}$.<br><br>Now, substituting $B^{-1}$ and $A^{-1}$ into the formula:<br>$(AB)^{-1} = B^{-1} A^{-1} = \\begin{bmatrix} 3 & 2 & 6 \\ 1 & 1 & 2 \\ 2 & 2 & 5 \\end{bmatrix} \\begin{bmatrix} 3 & -1 & 1 \\ -15 & 6 & -5 \\ 5 & -2 & 2 \\end{bmatrix}$<br><br>Multiplying the two matrices:<br>$(AB)^{-1} = \\begin{bmatrix} 3(3) + 2(-15) + 6(5) & 3(-1) + 2(6) + 6(-2) & 3(1) + 2(-5) + 6(2) \\ 1(3) + 1(-15) + 2(5) & 1(-1) + 1(6) + 2(-2) & 1(1) + 1(-5) + 2(2) \\ 2(3) + 2(-15) + 5(5) & 2(-1) + 2(6) + 5(-2) & 2(1) + 2(-5) + 5(2) \\end{bmatrix}$<br><br>$(AB)^{-1} = \\begin{bmatrix} 9 - 30 + 30 & -3 + 12 - 12 & 3 - 10 + 12 \\ 3 - 15 + 10 & -1 + 6 - 4 & 1 - 5 + 4 \\ 6 - 30 + 25 & -2 + 12 - 10 & 2 - 10 + 10 \\end{bmatrix}$<br><br>$(AB)^{-1} = \\begin{bmatrix} 9 & -3 & 5 \\ -2 & 1 & 0 \\ 1 & 0 & 2 \\end{bmatrix}$<br><br>Answer: $\\begin{bmatrix} 9 & -3 & 5 \\\\ -2 & 1 & 0 \\\\ 1 & 0 & 2 \\end{bmatrix}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889615a9fc0fc8c14519", "type": "singleCorrect", "question": {"text": "Let $A = \\begin{bmatrix} 2 & 1 \\\\ 3 & 2 \\end{bmatrix}$ and $B = \\begin{bmatrix} -1 & -1 \\\\ 1 & 1 \\end{bmatrix}$. If the variables $x$ and $y$ satisfy the matrix equation $(A^{-1} + B)\\begin{bmatrix} x \\\\ y \\end{bmatrix} = \\begin{bmatrix} 0 \\\\ -2 \\end{bmatrix}$, then the value of $x + 3y$ is......", "image": null}, "options": [{"id": "2sIZR", "label": "A", "text": "$8$", "isCorrect": false, "image": null}, {"id": "yUbmp", "label": "B", "text": "$10$", "isCorrect": true, "image": null}, {"id": "oCdVS", "label": "C", "text": "$12$", "isCorrect": false, "image": null}, {"id": "9e2Jp", "label": "D", "text": "$14$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} 2 & 1 \\\\ 3 & 2 \\end{bmatrix}$, the determinant is $|A| = 2(2) - 1(3) = 1$.<br><br>The inverse of $A$ is $A^{-1} = \\begin{bmatrix} 2 & -1 \\\\ -3 & 2 \\end{bmatrix}$.<br><br>Adding $B = \\begin{bmatrix} -1 & -1 \\\\ 1 & 1 \\end{bmatrix}$ to $A^{-1}$ gives:<br><br>$A^{-1} + B = \\begin{bmatrix} 2 & -1 \\\\ -3 & 2 \\end{bmatrix} + \\begin{bmatrix} -1 & -1 \\\\ 1 & 1 \\end{bmatrix} = \\begin{bmatrix} 1 & -2 \\\\ -2 & 3 \\end{bmatrix}$<br><br>The given matrix equation is $(A^{-1} + B)\\begin{bmatrix} x \\\\ y \\end{bmatrix} = \\begin{bmatrix} 0 \\\\ -2 \\end{bmatrix}$.<br><br>Substituting the matrix $A^{-1} + B$ yields:<br><br>$\\begin{bmatrix} 1 & -2 \\\\ -2 & 3 \\end{bmatrix} \\begin{bmatrix} x \\\\ y \\end{bmatrix} = \\begin{bmatrix} 0 \\\\ -2 \\end{bmatrix}$<br><br>This results in the system of linear equations:<br><br>$x - 2y = 0 \\Rightarrow x = 2y$<br><br>$-2x + 3y = -2$<br><br>Substituting $x = 2y$ into the second equation gives:<br><br>$-2(2y) + 3y = -2$<br><br>$-4y + 3y = -2 \\Rightarrow -y = -2 \\Rightarrow y = 2$<br><br>Using $y = 2$, we get $x = 2(2) = 4$.<br><br>The value of $x + 3y$ is $4 + 3(2) = 10$.<br><br>Answer: $10$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889615a9fc0fc8c14518", "type": "singleCorrect", "question": {"text": "If matrix $\\begin{pmatrix} x & 1 & 2 \\\\ 2 & 4 & x \\\\ -3 & 3 & 2 \\end{pmatrix}$ is non-invertible matrix and distinct values of $x$ are $a$ and $b$ then $9(a^2 + b^2) = \\cdots\\cdots\\cdots$", "image": null}, "options": [{"id": "AmiN8", "label": "A", "text": "$271$", "isCorrect": false, "image": null}, {"id": "sBeCQ", "label": "B", "text": "$721$", "isCorrect": false, "image": null}, {"id": "pM0yt", "label": "C", "text": "$217$", "isCorrect": true, "image": null}, {"id": "bgrX5", "label": "D", "text": "$-278$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a matrix to be non-invertible, its determinant must be zero.<br><br>$\\begin{vmatrix} x & 1 & 2 \\\\ 2 & 4 & x \\\\ -3 & 3 & 2 \\end{vmatrix} = 0$<br><br>Expanding along the first row:<br><br>$x(4 \\times 2 - 3 \\times x) - 1(2 \\times 2 - (-3) \\times x) + 2(2 \\times 3 - (-3) \\times 4) = 0$<br><br>$x(8 - 3x) - 1(4 + 3x) + 2(6 + 12) = 0$<br><br>$8x - 3x^2 - 4 - 3x + 36 = 0$<br><br>$-3x^2 + 5x + 32 = 0$<br><br>$3x^2 - 5x - 32 = 0$<br><br>Since $a$ and $b$ are the distinct roots of this quadratic equation, using the sum and product of roots:<br><br>$a + b = \\dfrac{5}{3}$<br><br>$ab = -\\dfrac{32}{3}$<br><br>We need to find the value of $9(a^2 + b^2)$:<br><br>$9(a^2 + b^2) = 9((a + b)^2 - 2ab)$<br><br>$9(a^2 + b^2) = 9\\left(\\left(\\dfrac{5}{3}\\right)^2 - 2\\left(-\\dfrac{32}{3}\\right)\\right)$<br><br>$9(a^2 + b^2) = 9\\left(\\dfrac{25}{9} + \\dfrac{64}{3}\\right)$<br><br>$9(a^2 + b^2) = 25 + 3 \\times 64$<br><br>$9(a^2 + b^2) = 25 + 192 = 217$<br><br>Answer: $217$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886615a9fc0fc8c14356", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 1 & 3 \\\\ 2 & 1 \\end{bmatrix}$, then the determinant of $(A^2 - 2A)^{-1}$ is...", "image": null}, "options": [{"id": "Xqje2", "label": "A", "text": "$\\dfrac{1}{5}$", "isCorrect": false, "image": null}, {"id": "RRcQF", "label": "B", "text": "$25$", "isCorrect": false, "image": null}, {"id": "xu7SE", "label": "C", "text": "$\\dfrac{1}{25}$", "isCorrect": true, "image": null}, {"id": "htzVD", "label": "D", "text": "$-25$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} 1 & 3 \\\\ 2 & 1 \\end{bmatrix}$<br><br>The characteristic equation of matrix $A$ is given by $\\lambda^2 - (\\text{Tr}(A))\\lambda + |A| = 0$<br><br>Here, $\\text{Tr}(A) = 1 + 1 = 2$ and $|A| = 1(1) - 3(2) = -5$<br><br>So, the characteristic equation is $\\lambda^2 - 2\\lambda - 5 = 0$<br><br>By the Cayley-Hamilton theorem, every square matrix satisfies its own characteristic equation. Thus:<br><br>$A^2 - 2A - 5I = 0$<br><br>$A^2 - 2A = 5I$<br><br>Taking the determinant on both sides for a $2 \\times 2$ matrix:<br><br>$|A^2 - 2A| = |5I| = 5^2 |I| = 25$<br><br>We need to find the determinant of $(A^2 - 2A)^{-1}$:<br><br>$|(A^2 - 2A)^{-1}| = \\dfrac{1}{|A^2 - 2A|} = \\dfrac{1}{25}$<br><br>Answer: $\\dfrac{1}{25}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c615a9fc0fc8c146db", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 1 & 2 & 2 \\\\ 2 & 1 & 2 \\\\ 2 & 2 & 1 \\end{bmatrix}$ and $A^{-1} = xA + yI$, then the values of $x$ and $y$ are...", "image": null}, "options": [{"id": "IveiP", "label": "A", "text": "$x = \\dfrac{1}{5}, y = \\dfrac{-4}{5}$", "isCorrect": true, "image": null}, {"id": "ooTX9", "label": "B", "text": "$x = \\dfrac{-1}{5}, y = \\dfrac{4}{5}$", "isCorrect": false, "image": null}, {"id": "m5MoJ", "label": "C", "text": "$x = \\dfrac{1}{5}, y = \\dfrac{4}{5}$", "isCorrect": false, "image": null}, {"id": "L00ol", "label": "D", "text": "$x = 1, y = -4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The characteristic equation of matrix $A$ is given by $|A - \\lambda I| = 0$.<br><br>$\\begin{vmatrix} 1-\\lambda & 2 & 2 \\\\ 2 & 1-\\lambda & 2 \\\\ 2 & 2 & 1-\\lambda \\end{vmatrix} = 0$<br><br>Expanding the determinant, we get:<br><br>$(1-\\lambda)[(1-\\lambda)^2 - 4] - 2[2(1-\\lambda) - 4] + 2[4 - 2(1-\\lambda)] = 0$<br><br>$(1-\\lambda)(\\lambda^2 - 2\\lambda - 3) + 4\\lambda + 4 + 4\\lambda + 4 = 0$<br><br>$(1-\\lambda)(\\lambda - 3)(\\lambda + 1) + 8(\\lambda + 1) = 0$<br><br>$(\\lambda + 1)[-\\lambda^2 + 4\\lambda - 3 + 8] = 0$<br><br>$-(\\lambda + 1)(\\lambda^2 - 4\\lambda - 5) = 0$<br><br>$-(\\lambda + 1)^2(\\lambda - 5) = 0$<br><br>The minimal polynomial of the symmetric matrix $A$ is the product of distinct linear factors corresponding to its eigenvalues, which is $(\\lambda + 1)(\\lambda - 5) = \\lambda^2 - 4\\lambda - 5 = 0$.<br><br>By the Cayley-Hamilton theorem, $A$ satisfies its minimal polynomial:<br><br>$A^2 - 4A - 5I = 0$<br><br>Multiplying the entire equation by $A^{-1}$, we get:<br><br>$A - 4I - 5A^{-1} = 0$<br><br>$5A^{-1} = A - 4I$<br><br>$A^{-1} = \\dfrac{1}{5}A - \\dfrac{4}{5}I$<br><br>Comparing this with the given equation $A^{-1} = xA + yI$, we obtain:<br><br>$x = \\dfrac{1}{5}, y = \\dfrac{-4}{5}$<br><br>Answer: $x = \\dfrac{1}{5}, y = \\dfrac{-4}{5}$", "image": null}, "level": 3, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c615a9fc0fc8c146da", "type": "singleCorrect", "question": {"text": "If the matrix $A = \\begin{bmatrix} 3 & -5 \\\\ 4 & -7 \\end{bmatrix}$ and $A^{-1} = \\begin{bmatrix} 7 & -5 \\\\ 4 & a \\end{bmatrix}$, then the value of $a$ is...", "image": null}, "options": [{"id": "Lto69", "label": "A", "text": "$-3$", "isCorrect": true, "image": null}, {"id": "sBxwS", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "m0jMw", "label": "C", "text": "$5$", "isCorrect": false, "image": null}, {"id": "dFxUe", "label": "D", "text": "$-5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} 3 & -5 \\\\\\\\ 4 & -7 \\end{bmatrix}$<br><br>The determinant of $A$ is $|A| = (3)(-7) - (-5)(4) = -21 + 20 = -1$<br><br>The inverse of a $2 \\times 2$ matrix $\\begin{bmatrix} p & q \\\\\\\\ r & s \\end{bmatrix}$ is $\\dfrac{1}{ps - qr} \\begin{bmatrix} s & -q \\\\\\\\ -r & p \\end{bmatrix}$<br><br>$A^{-1} = \\dfrac{1}{-1} \\begin{bmatrix} -7 & 5 \\\\\\\\ -4 & 3 \\end{bmatrix} = \\begin{bmatrix} 7 & -5 \\\\\\\\ 4 & -3 \\end{bmatrix}$<br><br>Comparing this with the given $A^{-1} = \\begin{bmatrix} 7 & -5 \\\\\\\\ 4 & a \\end{bmatrix}$, we get $a = -3$<br><br>Answer: $-3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883615a9fc0fc8c14195", "type": "singleCorrect", "question": {"text": "If $A=\\begin{bmatrix}\\sin\\alpha & -\\cos\\alpha\\\\\\cos\\alpha & \\sin\\alpha\\end{bmatrix}$ and $S=\\left\\{\\alpha:\\alpha\\in\\left(\\dfrac{\\pi}{2},\\dfrac{3\\pi}{2}\\right), A+A^{-1}=I\\right\\}$, then $\\alpha=$ ...", "image": null}, "options": [{"id": "UjEj0", "label": "A", "text": "$\\dfrac{2\\pi}{3}$", "isCorrect": false, "image": null}, {"id": "z47UU", "label": "B", "text": "$\\dfrac{3\\pi}{4}$", "isCorrect": false, "image": null}, {"id": "3ZEA8", "label": "C", "text": "$\\dfrac{5\\pi}{6}$", "isCorrect": true, "image": null}, {"id": "eyljk", "label": "D", "text": "$\\pi$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} \\sin\\alpha & -\\cos\\alpha \\\\ \\cos\\alpha & \\sin\\alpha \\end{bmatrix}$<br><br>The determinant of $A$ is $|A| = \\sin^2\\alpha - (-\\cos^2\\alpha) = \\sin^2\\alpha + \\cos^2\\alpha = 1$.<br><br>The inverse of $A$ is given by:<br><br>$A^{-1} = \\dfrac{1}{|A|} \\text{adj}(A) = \\begin{bmatrix} \\sin\\alpha & \\cos\\alpha \\\\ -\\cos\\alpha & \\sin\\alpha \\end{bmatrix}$<br><br>We are given that $A + A^{-1} = I$. Substituting the matrices, we get:<br><br>$\\begin{bmatrix} \\sin\\alpha & -\\cos\\alpha \\\\ \\cos\\alpha & \\sin\\alpha \\end{bmatrix} + \\begin{bmatrix} \\sin\\alpha & \\cos\\alpha \\\\ -\\cos\\alpha & \\sin\\alpha \\end{bmatrix} = \\begin{bmatrix} 1 & 0 \\\\ 0 & 1 \\end{bmatrix}$<br><br>$\\begin{bmatrix} 2\\sin\\alpha & 0 \\\\ 0 & 2\\sin\\alpha \\end{bmatrix} = \\begin{bmatrix} 1 & 0 \\\\ 0 & 1 \\end{bmatrix}$<br><br>Equating the corresponding elements, we obtain:<br><br>$2\\sin\\alpha = 1 \\Rightarrow \\sin\\alpha = \\dfrac{1}{2}$<br><br>Since $\\alpha \\in \\left( \\dfrac{\\pi}{2}, \\dfrac{3\\pi}{2} \\right)$, the angle must lie in the second or third quadrant. The sine function is positive in the second quadrant, so:<br><br>$\\alpha = \\pi - \\dfrac{\\pi}{6} = \\dfrac{5\\pi}{6}$<br><br>Answer: $\\dfrac{5\\pi}{6}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ad8c30a4553e1bdba6", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 1 & -5 \\\\ -2 & 4 \\end{bmatrix}$, then $A^{-1} =$", "image": null}, "options": [{"id": "DRRbD", "label": "A", "text": "$-\\dfrac{1}{6}\\begin{bmatrix} -4 & 5 \\\\ 2 & -1 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "TVkmd", "label": "B", "text": "$\\dfrac{1}{14}\\begin{bmatrix} -1 & 5 \\\\ 2 & -4 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "0fJLQ", "label": "C", "text": "$\\dfrac{1}{14}\\begin{bmatrix} 4 & 5 \\\\ 2 & 1 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "kjVgV", "label": "D", "text": "$-\\dfrac{1}{6}\\begin{bmatrix} 4 & 5 \\\\ 2 & 1 \\end{bmatrix}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} 1 & -5 \\\\ -2 & 4 \\end{bmatrix}$<br><br>The determinant of $A$ is $|A| = (1)(4) - (-5)(-2) = 4 - 10 = -6$<br><br>The adjoint of $A$ is obtained by interchanging the diagonal elements and changing the signs of the off-diagonal elements:<br><br>$\\text{adj}(A) = \\begin{bmatrix} 4 & 5 \\\\ 2 & 1 \\end{bmatrix}$<br><br>The inverse of the matrix is given by $A^{-1} = \\dfrac{1}{|A|} \\text{adj}(A)$<br><br>$A^{-1} = -\\dfrac{1}{6} \\begin{bmatrix} 4 & 5 \\\\ 2 & 1 \\end{bmatrix}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3568c30a4553e1be2ae", "type": "singleCorrect", "question": {"text": "Let $A = \\begin{bmatrix} a & 1 \\\\ 1 & b \\end{bmatrix}$, where $a$ and $b$ are the roots of the equation $x^2 - 4x + 2 = 0$. If $A + A^{-1} = kI_2$, then the value of $k$ is ____", "image": null}, "options": [{"id": "KL5lF", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "cawQs", "label": "B", "text": "$2\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "Cji1U", "label": "C", "text": "$4$", "isCorrect": true, "image": null}, {"id": "gebcx", "label": "D", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} a & 1 \\\\ 1 & b \\end{bmatrix}$<br><br>Since $a$ and $b$ are roots of $x^2 - 4x + 2 = 0$, we have $a + b = 4$ and $ab = 2$.<br><br>The determinant of $A$ is $|A| = ab - 1 = 2 - 1 = 1$.<br><br>The inverse of $A$ is $A^{-1} = \\dfrac{1}{|A|} \\begin{bmatrix} b & -1 \\\\ -1 & a \\end{bmatrix} = \\begin{bmatrix} b & -1 \\\\ -1 & a \\end{bmatrix}$.<br><br>Now, $A + A^{-1} = \\begin{bmatrix} a & 1 \\\\ 1 & b \\end{bmatrix} + \\begin{bmatrix} b & -1 \\\\ -1 & a \\end{bmatrix} = \\begin{bmatrix} a+b & 0 \\\\ 0 & a+b \\end{bmatrix}$.<br><br>Substituting $a + b = 4$, we get $A + A^{-1} = \\begin{bmatrix} 4 & 0 \\\\ 0 & 4 \\end{bmatrix} = 4I_2$.<br><br>Comparing with $A + A^{-1} = kI_2$, we get $k = 4$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3108c30a4553e1bdfc0", "type": "singleCorrect", "question": {"text": "The inverse of the matrix $A = \\begin{bmatrix} 2 & -1 & 4 \\\\ 4 & -3 & 1 \\\\ 1 & 2 & 1 \\end{bmatrix}$ is $B = \\dfrac{1}{37}\\begin{bmatrix} -5 & 9 & 11 \\\\ -3 & -2 & 14 \\\\ 11 & -5 & k \\end{bmatrix}$, then the value of $k$ is...", "image": null}, "options": [{"id": "djANZ", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "Y7jgZ", "label": "B", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "R645F", "label": "C", "text": "$2$", "isCorrect": false, "image": null}, {"id": "nNlVt", "label": "D", "text": "$-2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Since $B$ is the inverse of $A$, we have $AB = I$, which implies $A(37B) = 37I$.<br><br>The element in the first row and third column of the matrix $37I$ is $0$.<br><br>Multiplying the first row of $A$ with the third column of $37B$, we get:<br><br>$2(11) + (-1)(14) + 4(k) = 0$<br><br>$22 - 14 + 4k = 0$<br><br>$8 + 4k = 0$<br><br>$k = -2$<br><br>Alternatively, multiplying the third row of $A$ with the third column of $37B$ gives the element in the third row and third column of $37I$, which is $37$:<br><br>$1(11) + 2(14) + 1(k) = 37$<br><br>$11 + 28 + k = 37$<br><br>$39 + k = 37$<br><br>$k = -2$<br><br>Answer: $-2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3028c30a4553e1bdf2a", "type": "singleCorrect", "question": {"text": "The inverse of matrix $\\begin{bmatrix} 1+pq & p & 0 \\\\ q & 1+pq & p \\\\ 0 & q & 1 \\end{bmatrix}$ is ...", "image": null}, "options": [{"id": "viMjk", "label": "A", "text": "$\\begin{bmatrix} 1+pq & p & 0 \\\\ q & 1+pq & p \\\\ 0 & q & 1 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "6gQbw", "label": "B", "text": "$\\begin{bmatrix} 1 & p & p^2 \\\\ q & 1+pq & p+p^2q \\\\ q^2 & q+pq^2 & 1+pq+p^2q^2 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "0WC8o", "label": "C", "text": "$\\begin{bmatrix} 1 & -p & p^2 \\\\ -q & 1+pq & -(p+p^2q) \\\\ q^2 & -(q+pq^2) & 1+pq+p^2q^2 \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "rqbCT", "label": "D", "text": "$\\begin{bmatrix} 1 & -p & p^2 \\\\ -q & 1+pq & p+p^2q \\\\ q^2 & q+pq^2 & 1+pq+p^2q^2 \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the given matrix be $A = \\begin{bmatrix} 1+pq & p & 0 \\\\ q & 1+pq & p \\\\ 0 & q & 1 \\end{bmatrix}$.<br><br>The inverse of matrix $A$ is given by $A^{-1} = \\dfrac{1}{|A|}\\text{adj}(A)$.<br><br>First, evaluate the determinant of $A$:<br><br>$|A| = (1+pq)[(1+pq)(1) - (p)(q)] - p[q(1) - (p)(0)] + 0$<br><br>$|A| = (1+pq)[1 + pq - pq] - p[q]$<br><br>$|A| = (1+pq)(1) - pq = 1 + pq - pq = 1$<br><br>Since $|A| = 1$, the inverse matrix is $A^{-1} = \\text{adj}(A)$.<br><br>To find the adjoint of $A$, we calculate the cofactors of each element:<br><br>$C_{11} = (1+pq)(1) - pq = 1$<br><br>$C_{12} = -(q(1) - 0) = -q$<br><br>$C_{13} = q(q) - 0 = q^2$<br><br>$C_{21} = -(p(1) - 0) = -p$<br><br>$C_{22} = (1+pq)(1) - 0 = 1+pq$<br><br>$C_{23} = -((1+pq)q - 0) = -(q + pq^2)$<br><br>$C_{31} = p(p) - 0 = p^2$<br><br>$C_{32} = -((1+pq)p - 0) = -(p + p^2q)$<br><br>$C_{33} = (1+pq)^2 - pq = 1 + 2pq + p^2q^2 - pq = 1 + pq + p^2q^2$<br><br>The adjoint matrix is the transpose of the cofactor matrix:<br><br>$\\text{adj}(A) = \\begin{bmatrix} C_{11} & C_{21} & C_{31} \\\\ C_{12} & C_{22} & C_{32} \\\\ C_{13} & C_{23} & C_{33} \\end{bmatrix} = \\begin{bmatrix} 1 & -p & p^2 \\\\ -q & 1+pq & -(p+p^2q) \\\\ q^2 & -(q+pq^2) & 1+pq+p^2q^2 \\end{bmatrix}$<br><br>Therefore, $A^{-1} = \\begin{bmatrix} 1 & -p & p^2 \\\\ -q & 1+pq & -(p+p^2q) \\\\ q^2 & -(q+pq^2) & 1+pq+p^2q^2 \\end{bmatrix}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f48c30a4553e1bde95", "type": "singleCorrect", "question": {"text": "If matrix A and its inverse $A^{-1}$ are given by $A = \\begin{bmatrix} 0 & 1 & 2 \\\\ 1 & 2 & 3 \\\\ 3 & x & 1 \\end{bmatrix}$ and $A^{-1} = \\begin{bmatrix} \\dfrac{1}{2} & -\\dfrac{1}{2} & \\dfrac{1}{2} \\\\ -4 & 3 & y \\\\ \\dfrac{5}{2} & -\\dfrac{3}{2} & \\dfrac{1}{2} \\end{bmatrix}$, then the polar co-ordinates of the points whose Cartesian co-ordinates are $(x, y)$ are $\\ldots$", "image": null}, "options": [{"id": "rC7HW", "label": "A", "text": "$\\left(2, \\dfrac{7\\pi}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "hVY2S", "label": "B", "text": "$\\left(\\sqrt{2}, \\dfrac{\\pi}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "8D6A0", "label": "C", "text": "$\\left(\\sqrt{2}, \\dfrac{7\\pi}{4}\\right)$", "isCorrect": true, "image": null}, {"id": "mVYAp", "label": "D", "text": "$\\left(2, \\dfrac{\\pi}{4}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $A A^{-1} = I$, the product of the first row of $A$ and the third column of $A^{-1}$ must be $0$.<br><br>$0 \\times \\dfrac{1}{2} + 1 \\times y + 2 \\times \\dfrac{1}{2} = 0 \\Rightarrow y + 1 = 0 \\Rightarrow y = -1$<br><br>Similarly, the product of the third row of $A$ and the first column of $A^{-1}$ must be $0$.<br><br>$3 \\times \\dfrac{1}{2} + x \\times (-4) + 1 \\times \\dfrac{5}{2} = 0 \\Rightarrow 4 - 4x = 0 \\Rightarrow x = 1$<br><br>The Cartesian coordinates are $(x, y) = (1, -1)$.<br><br>The polar coordinates $(r, \\theta)$ are given by $r = \\sqrt{x^2 + y^2}$ and $\\tan \\theta = \\dfrac{y}{x}$.<br><br>$r = \\sqrt{1^2 + (-1)^2} = \\sqrt{2}$<br><br>Since the point $(1, -1)$ lies in the fourth quadrant, $\\theta = 2\\pi - \\dfrac{\\pi}{4} = \\dfrac{7\\pi}{4}$.<br><br>Thus, the polar coordinates are $\\left(\\sqrt{2}, \\dfrac{7\\pi}{4}\\right)$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32b8c30a4553e1be0ec", "type": "singleCorrect", "question": {"text": "Let $A = \\begin{bmatrix} 3 & -4 \\\\ 1 & -1 \\end{bmatrix}$ and $B = \\begin{bmatrix} 6 & -13 \\\\ 5 & -10 \\end{bmatrix}$ be two matrices. If the variables $x$ and $y$ satisfy the matrix equation $((A^{-1})^2 + B)\\begin{bmatrix} x \\\\ y \\end{bmatrix} = \\begin{bmatrix} 0 \\\\ 0 \\end{bmatrix}$, then the ordered pair $(x, y) = $", "image": null}, "options": [{"id": "Y4Shg", "label": "A", "text": "$(3, 5)$", "isCorrect": false, "image": null}, {"id": "XR9fH", "label": "B", "text": "$(10, 7)$", "isCorrect": false, "image": null}, {"id": "g5yDC", "label": "C", "text": "$(4, 6)$", "isCorrect": false, "image": null}, {"id": "7a4nC", "label": "D", "text": "$(5, 3)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} 3 & -4 \\\\ 1 & -1 \\end{bmatrix}$<br><br>Determinant of $A$ is $|A| = (3)(-1) - (-4)(1) = 1$<br><br>The inverse of $A$ is $A^{-1} = \\dfrac{1}{|A|} \\begin{bmatrix} -1 & 4 \\\\ -1 & 3 \\end{bmatrix} = \\begin{bmatrix} -1 & 4 \\\\ -1 & 3 \\end{bmatrix}$<br><br>Now, $(A^{-1})^2 = \\begin{bmatrix} -1 & 4 \\\\ -1 & 3 \\end{bmatrix} \\begin{bmatrix} -1 & 4 \\\\ -1 & 3 \\end{bmatrix} = \\begin{bmatrix} 1 - 4 & -4 + 12 \\\\ 1 - 3 & -4 + 9 \\end{bmatrix} = \\begin{bmatrix} -3 & 8 \\\\ -2 & 5 \\end{bmatrix}$<br><br>Adding matrix $B$:<br><br>$(A^{-1})^2 + B = \\begin{bmatrix} -3 & 8 \\\\ -2 & 5 \\end{bmatrix} + \\begin{bmatrix} 6 & -13 \\\\ 5 & -10 \\end{bmatrix} = \\begin{bmatrix} 3 & -5 \\\\ 3 & -5 \\end{bmatrix}$<br><br>The given matrix equation is $((A^{-1})^2 + B)\\begin{bmatrix} x \\\\ y \\end{bmatrix} = \\begin{bmatrix} 0 \\\\ 0 \\end{bmatrix}$<br><br>$\\begin{bmatrix} 3 & -5 \\\\ 3 & -5 \\end{bmatrix} \\begin{bmatrix} x \\\\ y \\end{bmatrix} = \\begin{bmatrix} 0 \\\\ 0 \\end{bmatrix}$<br><br>This gives the equation $3x - 5y = 0 \\Rightarrow 3x = 5y$<br><br>Checking the given options, the ordered pair $(5, 3)$ satisfies this equation since $3(5) - 5(3) = 0$.<br><br>Answer: $(5, 3)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3488c30a4553e1be219", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 1 & -\\tan\\dfrac{\\theta}{2} \\\\ \\tan\\dfrac{\\theta}{2} & 1 \\end{bmatrix}$ and $B = \\begin{bmatrix} 1 & \\tan\\dfrac{\\theta}{2} \\\\ -\\tan\\dfrac{\\theta}{2} & 1 \\end{bmatrix}$ then $A^{-1}B$ is equal to", "image": null}, "options": [{"id": "KopK5", "label": "A", "text": "$\\begin{bmatrix} \\cos\\theta & \\sin\\theta \\\\ -\\sin\\theta & \\cos\\theta \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "pswtG", "label": "B", "text": "$\\begin{bmatrix} \\cos\\theta & -\\sin\\theta \\\\ \\sin\\theta & \\cos\\theta \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "6n7TM", "label": "C", "text": "$\\begin{bmatrix} \\sin\\theta & -\\cos\\theta \\\\ \\cos\\theta & \\sin\\theta \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "kI6aK", "label": "D", "text": "$\\begin{bmatrix} \\cos\\theta & \\sin\\theta \\\\ \\sin\\theta & \\cos\\theta \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $t = \\tan\\dfrac{\\theta}{2}$.<br><br>The given matrices can be written as:<br>$A = \\begin{bmatrix} 1 & -t \\\\ t & 1 \\end{bmatrix}$ and $B = \\begin{bmatrix} 1 & t \\\\ -t & 1 \\end{bmatrix}$<br><br>The determinant of $A$ is $|A| = 1(1) - (-t)(t) = 1 + t^2$.<br><br>The adjugate of $A$ is $\\text{adj}(A) = \\begin{bmatrix} 1 & t \\\\ -t & 1 \\end{bmatrix}$.<br><br>Therefore, the inverse of $A$ is:<br>$A^{-1} = \\dfrac{1}{|A|} \\text{adj}(A) = \\dfrac{1}{1+t^2} \\begin{bmatrix} 1 & t \\\\ -t & 1 \\end{bmatrix}$<br><br>Now, multiply $A^{-1}$ and $B$:<br>$A^{-1}B = \\dfrac{1}{1+t^2} \\begin{bmatrix} 1 & t \\\\ -t & 1 \\end{bmatrix} \\begin{bmatrix} 1 & t \\\\ -t & 1 \\end{bmatrix}$<br><br>$A^{-1}B = \\dfrac{1}{1+t^2} \\begin{bmatrix} 1(1) + t(-t) & 1(t) + t(1) \\\\ -t(1) + 1(-t) & -t(t) + 1(1) \\end{bmatrix}$<br><br>$A^{-1}B = \\dfrac{1}{1+t^2} \\begin{bmatrix} 1 - t^2 & 2t \\\\ -2t & 1 - t^2 \\end{bmatrix}$<br><br>$A^{-1}B = \\begin{bmatrix} \\dfrac{1-t^2}{1+t^2} & \\dfrac{2t}{1+t^2} \\\\ \\dfrac{-2t}{1+t^2} & \\dfrac{1-t^2}{1+t^2} \\end{bmatrix}$<br><br>Using the half-angle trigonometric identities $\\cos\\theta = \\dfrac{1 - \\tan^2\\dfrac{\\theta}{2}}{1 + \\tan^2\\dfrac{\\theta}{2}}$ and $\\sin\\theta = \\dfrac{2\\tan\\dfrac{\\theta}{2}}{1 + \\tan^2\\dfrac{\\theta}{2}}$, we get:<br><br>$A^{-1}B = \\begin{bmatrix} \\cos\\theta & \\sin\\theta \\\\ -\\sin\\theta & \\cos\\theta \\end{bmatrix}$<br><br>Answer: $\\begin{bmatrix} \\cos\\theta & \\sin\\theta \\\\ -\\sin\\theta & \\cos\\theta \\end{bmatrix}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ca8c30a4553e1bdcd1", "type": "singleCorrect", "question": {"text": "If $A$ is a non-singular matrix and $A^2 - A + I = 0$, then $A^{-1} = \\ldots$", "image": null}, "options": [{"id": "toQcH", "label": "A", "text": "$A$", "isCorrect": false, "image": null}, {"id": "MBO66", "label": "B", "text": "$A - I$", "isCorrect": false, "image": null}, {"id": "FA98L", "label": "C", "text": "$I - A$", "isCorrect": true, "image": null}, {"id": "NcvD8", "label": "D", "text": "$A + I$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A^2 - A + I = 0$<br><br>Multiplying both sides by $A^{-1}$, we get<br><br>$A^{-1}(A^2 - A + I) = 0$<br><br>$A - I + A^{-1} = 0$<br><br>$A^{-1} = I - A$<br><br>Answer: $I - A$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33d8c30a4553e1be1a6", "type": "sin
