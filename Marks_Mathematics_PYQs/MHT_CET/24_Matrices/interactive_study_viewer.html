ible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3488c30a4553e1be218", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 3 & 0 & 0 \\\\ 0 & -5 & 0 \\\\ 0 & 0 & 7 \\end{bmatrix}$; $B = \\begin{bmatrix} -1 & 0 & 0 \\\\ 0 & 2 & 0 \\\\ 0 & 0 & 4 \\end{bmatrix}$ then, $(2A + 3B)^{-1} =$ _______", "image": null}, "options": [{"id": "67KAF", "label": "A", "text": "$\\begin{bmatrix} \\dfrac{1}{3} & 0 & 0 \\\\ 0 & -\\dfrac{1}{4} & 0 \\\\ 0 & 0 & \\dfrac{1}{26} \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "1ppW2", "label": "B", "text": "$\\begin{bmatrix} \\dfrac{1}{3} & 0 & 0 \\\\ 0 & \\dfrac{1}{4} & 0 \\\\ 0 & 0 & \\dfrac{1}{26} \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "5LLBl", "label": "C", "text": "$\\begin{bmatrix} \\dfrac{1}{3} & 0 & 0 \\\\ 0 & \\dfrac{1}{4} & 0 \\\\ 0 & 0 & -\\dfrac{1}{26} \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "Li6YK", "label": "D", "text": "$\\begin{bmatrix} -\\dfrac{1}{3} & 0 & 0 \\\\ 0 & \\dfrac{1}{4} & 0 \\\\ 0 & 0 & -\\dfrac{1}{26} \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$A = \\begin{bmatrix} 3 & 0 & 0 \\\\ 0 & -5 & 0 \\\\ 0 & 0 & 7 \\end{bmatrix}$<br><br>$B = \\begin{bmatrix} -1 & 0 & 0 \\\\ 0 & 2 & 0 \\\\ 0 & 0 & 4 \\end{bmatrix}$<br><br>$2A = \\begin{bmatrix} 6 & 0 & 0 \\\\ 0 & -10 & 0 \\\\ 0 & 0 & 14 \\end{bmatrix}$<br><br>$3B = \\begin{bmatrix} -3 & 0 & 0 \\\\ 0 & 6 & 0 \\\\ 0 & 0 & 12 \\end{bmatrix}$<br><br>$2A + 3B = \\begin{bmatrix} 6 - 3 & 0 & 0 \\\\ 0 & -10 + 6 & 0 \\\\ 0 & 0 & 14 + 12 \\end{bmatrix} = \\begin{bmatrix} 3 & 0 & 0 \\\\ 0 & -4 & 0 \\\\ 0 & 0 & 26 \\end{bmatrix}$<br><br>The inverse of a diagonal matrix is obtained by taking the reciprocal of its diagonal elements.<br><br>$(2A + 3B)^{-1} = \\begin{bmatrix} \\dfrac{1}{3} & 0 & 0 \\\\ 0 & -\\dfrac{1}{4} & 0 \\\\ 0 & 0 & \\dfrac{1}{26} br>$\\begin{bmatrix} 4 + 2x + y & -4 - x \\\\ 0 & 4 + 2x + y \\end{bmatrix} = \\begin{bmatrix} 0 & 0 \\\\ 0 & 0 \\end{bmatrix}$<br><br>Equating the corresponding elements to zero:<br><br>$-4 - x = 0 \\Rightarrow x = -4$<br><br>$4 + 2x + y = 0$<br><br>Substituting $x = -4$ into the second equation:<br><br>$4 + 2(-4) + y = 0 \\Rightarrow y = 4$<br><br>Answer: $x = -4,\\ y = 4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3768c30a4553e1be3fc", "type": "singleCorrect", "question": {"text": "Let $A = \\begin{bmatrix} -5 & -3 \\\\ 2 & 1 \\end{bmatrix}$. The Row transformation $R_1 \\rightarrow R_1 + 3R_2$ will transform matrix A into", "image": null}, "options": [{"id": "3B0kB", "label": "A", "text": "an upper triangular matrix", "isCorrect": false, "image": null}, {"id": "R7dgP", "label": "B", "text": "a lower triangular matrix", "isCorrect": true, "image": null}, {"id": "q5fOG", "label": "C", "text": "an identity matrix", "isCorrect": false, "image": null}, {"id": "PnXgX", "label": "D", "text": "a singular matrix", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} -5 & -3 \\\\ 2 & 1 \\end{bmatrix}$<br><br>Applying the row transformation $R_1 \\rightarrow R_1 + 3R_2$, the elements of the first row become:<br><br>$a_{11} = -5 + 3(2) = 1$<br><br>$a_{12} = -3 + 3(1) = 0$<br><br>The transforme ow A_{31}+A_{32}+A_{33}=0\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260440279619d9d8a231b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "If $A^{-1}=\\left[\\begin{array}{lll}3 & 2 & 6 \\\\ 1 & 1 & 2 \\\\ 2 & 5 & 5\\end{array}\\right]$, then $A=$", "image": null}, "options": [{"id": "Nj3Go", "text": "$\\left[\\begin{array}{ccc}-5 & 20 & -2 \\\\ -1 & 3 & 0 \\\\ 3 & -11 & 1\\end{array}\\right]$", "image": null, "isCorrect": true}, {"id": "QvgYS", "text": "$\\left[\\begin{array}{ccc}-5 & 20 & 2 \\\\ -1 & 3 & 0 \\\\ 3 & 11 & 1\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "ApsnN", "text": "$\\left[\\begin{array}{ccc}-5 & 20 & 2 \\\\ 1 & 3 & 0 \\\\ 3 & 11 & -1\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "TzNEr", "text": "$\\left[\\begin{array}{ccc}-5 & 20 & -2 \\\\ 1 & 3 & 0 \\\\ 3 & 11 & 1\\end{array}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{A}^{-1} \\mathrm{~A}=\\mathrm{I}$\n$$\n\\begin{aligned}\n& {\\left[\\begin{array}{lll}\n3 & 2 & 6 \\\\\n1 & 1 & 2 \\\\\n2 & 5 & 5\n\\end{array}\\right] A=\\left[\\begin{array}{ccc}\n1 & 0 & 0 \\\\\n0 & 1 & 0 \\\\\n0 & 0 & 1\n\\end{array}\\right]} \\\\\n& R_2 \\rightarrow 3 R_2-R_1 \\text { and } R_3 \\rightarrow 3 R_3-2 R_1 \\\\\n& {\\left[\\begin{array}{ccc}\n3 & 2 & 6 \\\\\n0 & 1 & 0 \\\\\n0 & 11 & 3\n\\end{array}\\right] A=\\left[\\begin{array}{ccc}\n1 & 0 & 0 \\\\\n-1 & 3 & 0 \\\\\n-2 & 0 & 3\n\\end{array}\\right]} \\\\\n& R_1 \\rightarrow R_1-2 R_2 \\text { and } R_3 \\rightarrow R_3-11 R_2\n\\end{aligned}\n$$\n\n\n$$\n\\begin{aligned}\n& {\\left[\\begin{array}{lll}\n3 & 0 & 6 \\\\\n0 & 1 & 0 \\\\\n0 & 0 & 3\n\\end{array}\\right] A=\\left[\\begin{array}{ccc}\n3 & - & 0 \\\\\n-1 & 3 & 0 \\\\\n9 & -33 & 3\n\\end{array}\\right]} \\\\\n& \\mathrm{R}_1 \\rightarrow \\mathrm{R}_1-2 \\mathrm{R}_3 \\\\\n& {\\left[\\begin{array}{lll}\n3 & 0 & 0 \\\\\n0 & 1 & 0 \\\\\n0 & 0 & 3\n\\end{array}\\right] \\mathrm{A}=\\left[\\begin{array}{ccc}\n-15 & 60 & -6 \\\\\n-1 & 3 & 0 \\\\\n9 & -33 & 3\n\\end{array}\\right]} \\\\\n& \\mathrm{R}_1 \\rightarrow \\frac{1}{3} \\mathrm{R}_1 \\text { and } \\mathrm{R}_3 \\rightarrow \\frac{1}{3} \\mathrm{R}_3 \\\\\n& {\\left[\\begin{array}{lll}\n1 & 0 & 0 \\\\\n0 & 1 & 0 \\\\\n0 & 0 & 1\n\\end{array}\\right] \\mathrm{A}=\\left[\\begin{array}{ccc}\n-5 & 20 & -2 \\\\\n-1 & 3 & 0 \\\\\n3 & -11 & 1\n\\end{array}\\right]}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e830279619d9d8a1507", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "If matrix $A=\\left[\\begin{array}{ll}a & b \\\\ c & d\\end{array}\\right]$, then $|A|^{-1}$ is equal to", "image": null}, "options": [{"id": "Sjv4B", "text": "$a d-b c$", "image": null, "isCorrect": false}, {"id": "m9P0X", "text": "$\\frac{1}{a d-b c}$", "image": null, "isCorrect": true}, {"id": "ocaB1", "text": "$\\frac{1}{a d-b c}\\left[\\begin{array}{rr}d & -b \\\\ -c & a\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "HFWpZ", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $\\quad A=\\left[\\begin{array}{ll}a & b \\\\ c & d\\end{array}\\right]$\n$$\n\\begin{array}{l}\n|A|=a d-b c \\\\\n|A|^{-1}=\\frac{1}{a d-b c}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5f0279619d9d8a13e2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The solution of the equation\n$\\left[\\begin{array}{rrr}1 & 0 & 1 \\\\ -1 & 1 & 0 \\\\ 0 & -1 & 1\\end{array}\\right]\\left[\\begin{array}{l}x \\\\ y \\\\ z\\end{array}\\right]=\\left[\\begin{array}{l}1 \\\\ 1 \\\\ 2\\end{array}\\right]$ is $(x, y, z)=$", "image": null}, "options": [{"id": "GSCt8", "text": "$(1,1,1)$", "image": null, "isCorrect": false}, {"id": "zhGD1", "text": "$(0,-1,2)$", "image": null, "isCorrect": false}, {"id": "H6nn5", "text": "$(-1,2,2)$", "image": null, "isCorrect": false}, {"id": "db1wY", "text": "$(-1,0,2)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\left[\\begin{array}{rrr}\n1 & 0 & 1 \\\\\n-1 & 1 & 0 \\\\\n0 & -1 & 1\n\\end{array}\\right]\\left[\\begin{array}{l}\nx \\\\\ny \\\\\nz\n\\end{array}\\right]=\\left[\\begin{array}{l}\n1 \\\\\n1 \\\\\n2\n\\end{array}\\right] \\\\\n\\Rightarrow\\left[\\begin{array}{r}\nx+0 y+z \\\\\n-x+y+0 z \\\\\n0 x-y+z\n\\end{array}\\right]=\\left[\\begin{array}{l}\n1 \\\\\n1 \\\\\n2\n\\end{array}\\right] \\\\\n\\Rightarrow \\quad x+z=1, \\\\\n-x+y=1\n\\end{aligned}\n$$\nand $\\quad-y+z=2$\nOn solving these equations, we get\n$$\nx=-1, y=0, z=2\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2633c0279619d9d8a3d51", "title": "Product of Matrices", "totalQuestions": 20, "questions": [{"_id": "6abb88d715a9fc0fc8c14770", "type": "singleCorrect", "question": {"text": "Let $X = \\begin{bmatrix} 4 & 2 \\\\ -1 & 3 \\end{bmatrix}$, $Y = \\begin{bmatrix} -1 & 2 \\\\ 1 & -3 \\end{bmatrix}$, then $(XY)^{-1}$ is equal to", "image": null}, "options": [{"id": "buuA6", "label": "A", "text": "$\\begin{bmatrix} \\dfrac{11}{14} & \\dfrac{-2}{14} \\\\ \\dfrac{-4}{14} & \\dfrac{-2}{14} \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "jyj4j", "label": "B", "text": "$\\begin{bmatrix} \\dfrac{-11}{14} & \\dfrac{2}{14} \\\\ \\dfrac{-4}{14} & \\dfrac{-2}{14} \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "ioU2x", "label": "C", "text": "$\\begin{bmatrix} \\dfrac{-11}{14} & \\dfrac{-2}{14} \\\\ \\dfrac{4}{14} & \\dfrac{-2}{14} \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "tqfm4", "label": "D", "text": "$\\begin{bmatrix} \\dfrac{-11}{14} & \\dfrac{-2}{14} \\\\ \\dfrac{-4}{14} & \\dfrac{-2}{14} \\end{bmatrix}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "First, we find the product of matrices $X$ and $Y$:<br><br>$XY = \\begin{bmatrix} 4 & 2 \\\\ -1 & 3 \\end{bmatrix} \\begin{bmatrix} -1 & 2 \\\\ 1 & -3 \\end{bmatrix}$<br><br>$XY = \\begin{bmatrix} 4(-1) + 2(1) & 4(2) + 2(-3) \\\\ -1(-1) + 3(1) & -1(2) + 3(-3) \\end{bmatrix}$<br><br>$XY = \\begin{bmatrix} -2 & 2 \\\\ 4 & -11 \\end{bmatrix}$<br><br>Next, we find the determinant of $XY$:<br><br>$|XY| = (-2)(-11) - (2)(4) = 22 - 8 = 14$<br><br>The adjugate of $XY$ is obtained by interchanging the diagonal elements and changing the signs of the off-diagonal elements:<br><br>$\\text{adj}(XY) = \\begin{bmatrix} -11 & -2 \\\\ -4 & -2 \\end{bmatrix}$<br><br>The inverse of $XY$ is given by $(XY)^{-1} = \\dfrac{1}{|XY|} \\text{adj}(XY)$:<br><br>$(XY)^{-1} = \\dfrac{1}{14} \\begin{bmatrix} -11 & -2 \\\\ -4 & -2 \\end{bmatrix} = \\begin{bmatrix} \\dfrac{-11}{14} & \\dfrac{-2}{14} \\\\ \\dfrac{-4}{14} & \\dfrac{-2}{14} \\end{bmatrix}$<br><br>Answer: $\\begin{bmatrix} \\dfrac{-11}{14} & \\dfrac{-2}{14} \\\\ \\dfrac{-4}{14} & \\dfrac{-2}{14} \\end{bmatrix}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88d615a9fc0fc8c1476f", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 1 & -1 & 1 \\\\ 2 & -1 & 0 \\\\ 1 & 0 & 0 \\end{bmatrix}$, then which of the following is not true?", "image": null}, "options": [{"id": "mIVx9", "label": "A", "text": "$A^{-1} = A^2$", "isCorrect": false, "image": null}, {"id": "jUC6x", "label": "B", "text": "$A^2$ is a triangular matrix.", "isCorrect": true, "image": null}, {"id": "Wzo4Y", "label": "C", "text": "$A$ is a non-singular matrix.", "isCorrect": false, "image": null}, {"id": "qVmTj", "label": "D", "text": "$A^3$ is an identity matrix.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Evaluating the determinant of $A$:<br><br>$|A| = 1(0 - 0) - (-1)(0 - 0) + 1(0 - (-1)) = 1$<br><br>Since $|A| \\neq 0$, $A$ is a non-singular matrix.<br><br>Evaluating $A^2$:<br><br>$A^2 = \\begin{bmatrix} 1 & -1 & 1 \\\\ 2 & -1 & 0 \\\\ 1 & 0 & 0 \\end{bmatrix} \\begin{bmatrix} 1 & -1 & 1 \\\\ 2 & -1 & 0 \\\\ 1 & 0 & 0 \\end{bmatrix} = \\begin{bmatrix} 0 & 0 & 1 \\\\ 0 & -1 & 2 \\\\ 1 & -1 & 1 \\end{bmatrix}$<br><br>Since elements both above and below the principal diagonal are non-zero, $A^2$ is not a triangular matrix.<br><br>Evaluating $A^3$:<br><br>$A^3 = A^2 A = \\begin{bmatrix} 0 & 0 & 1 \\\\ 0 & -1 & 2 \\\\ 1 & -1 & 1 \\end{bmatrix} \\begin{bmatrix} 1 & -1 & 1 \\\\ 2 & -1 & 0 \\\\ 1 & 0 & 0 \\end{bmatrix} = \\begin{bmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix} = I$<br><br>Since $A^3 = I$, multiplying both sides by $A^{-1}$ gives $A^2 = A^{-1}$.<br><br>Therefore, the only incorrect statement is that $A^2$ is a triangular matrix.<br><br>Answer: $A^2$ is a triangular matrix.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884715a9fc0fc8c1422b", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} -\\dfrac{1}{2} & -\\dfrac{\\sqrt{3}}{2} \\\\ \\dfrac{\\sqrt{3}}{2} & -\\dfrac{1}{2} \\end{bmatrix}$, the value of $|\\text{Adj}(A^{2026})|$ is equal to:", "image": null}, "options": [{"id": "61Lbg", "label": "A", "text": "$1$", "isCorrect": true, "image": null}, {"id": "ydI6C", "label": "B", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "Ppo6q", "label": "C", "text": "$-\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "nDgXb", "label": "D", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The determinant of matrix $A$ is given by:<br><br>$|A| = \\begin{vmatrix} -\\dfrac{1}{2} & -\\dfrac{\\sqrt{3}}{2} \\\\ \\dfrac{\\sqrt{3}}{2} & -\\dfrac{1}{2} \\end{vmatrix} = \\left(-\\dfrac{1}{2}\\right)\\left(-\\dfrac{1}{2}\\right) - \\left(-\\dfrac{\\sqrt{3}}{2}\\right)\\left(\\dfrac{\\sqrt{3}}{2}\\right)$<br><br>$|A| = \\dfrac{1}{4} + \\dfrac{3}{4} = 1$<br><br>Using the property of determinants, $|A^k| = |A|^k$<br><br>$|A^{2026}| = (1)^{2026} = 1$<br><br>For a matrix $M$ of order $n$, the determinant of its adjoint is given by $|\\text{Adj}(M)| = |M|^{n-1}$<br><br>Since $A$ is a $2 \\times 2$ matrix, $n = 2$<br><br>$|\\text{Adj}(A^{2026})| = |A^{2026}|^{2-1} = |A^{2026}| = 1$<br><br>Answer: $1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885615a9fc0fc8c142c0", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 0 & 1 & 2 \\\\ 1 & 2 & 3 \\\\ 3 & a & 1 \\end{bmatrix}$ and $A^{-1} = \\begin{bmatrix} \\dfrac{1}{2} & -\\dfrac{1}{2} & \\dfrac{1}{2} \\\\ -4 & 3 & c \\\\ \\dfrac{5}{2} & -\\dfrac{3}{2} & \\dfrac{1}{2} \\end{bmatrix}$, then ...", "image": null}, "options": [{"id": "geRpJ", "label": "A", "text": "$a = 1,\\,c = 1$", "isCorrect": false, "image": null}, {"id": "CR7rZ", "label": "B", "text": "$a = 1,\\,c = -1$", "isCorrect": true, "image": null}, {"id": "kGKSu", "label": "C", "text": "$a = 1,\\,c = 2$", "isCorrect": false, "image": null}, {"id": "mvv5d", "label": "D", "text": "$a = -1,\\,c = 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the property $A A^{-1} = I$, the product of the matrix $A$ and its inverse $A^{-1}$ must yield the identity matrix.<br><br>Equating the element in the first row and third column of $A A^{-1}$ to $0$:<br><br>$0 \\times \\dfrac{1}{2} + 1 \\times c + 2 \\times \\dfrac{1}{2} = 0$<br><br>$c + 1 = 0 \\Rightarrow c = -1$<br><br>Equating the element in the third row and first column of $A A^{-1}$ to $0$:<br><br>$3 \\times \\dfrac{1}{2} + a \\times (-4) + 1 \\times \\dfrac{5}{2} = 0$<br><br>$\\dfrac{3}{2} - 4a + \\dfrac{5}{2} = 0$<br><br>$4 - 4a = 0 \\Rightarrow a = 1$<br><br>Therefore, $a = 1$ and $c = -1$.<br><br>Answer: $a = 1,\\,c = -1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3578c30a4553e1be2af", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 3 & 2 & 6 \\\\ 1 & 1 & 2 \\\\ 2 & 2 & 5 \\end{bmatrix}$, $B = \\begin{bmatrix} 1 \\\\ 0 \\\\ 1 \\end{bmatrix}$ such that $XA = B^T$ and $A^{-1}Y = B$, then $XY = $", "image": null}, "options": [{"id": "SA9hK", "label": "A", "text": "$[-1]$", "isCorrect": false, "image": null}, {"id": "M61G9", "label": "B", "text": "$[1]$", "isCorrect": false, "image": null}, {"id": "s3SVI", "label": "C", "text": "$[-2]$", "isCorrect": false, "image": null}, {"id": "1KxqP", "label": "D", "text": "$[2]$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $XA = B^T$<br><br>Post-multiplying by $A^{-1}$, we get $X = B^T A^{-1}$<br><br>Given $A^{-1}Y = B$<br><br>Pre-multiplying by $A$, we get $Y = AB$<br><br>Now, $XY = (B^T A^{-1})(AB)$<br><br>Using the associative property of matrix multiplication, $XY = B^T (A^{-1}A) B$<br><br>$XY = B^T I B = B^T B$<br><br>Substituting the given matrix $B$, we get:<br><br>$XY = \\begin{bmatrix} 1 & 0 & 1 \\end{bmatrix} \\begin{bmatrix} 1 \\\\ 0 \\\\ 1 \\end{bmatrix}$<br><br>$XY = [1 \\times 1 + 0 \\times 0 + 1 \\times 1] = [2]$<br><br>Answer: $[2]$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d88c30a4553e1bdd68", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 2 & 3 \\\\ 5 & -2 \\end{bmatrix}$, $B^{-1} = \\begin{bmatrix} \\dfrac{1}{5} & \\dfrac{2}{5} \\\\ \\dfrac{2}{5} & -\\dfrac{1}{5} \\end{bmatrix}$, then $(AB)^{-1} = $", "image": null}, "options": [{"id": "gbBJq", "label": "A", "text": "$\\dfrac{1}{95}\\begin{bmatrix} 8 & -1 \\\\ -1 & 12 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "UjmkU", "label": "B", "text": "$\\dfrac{1}{95}\\begin{bmatrix} 12 & -1 \\\\ -1 & 8 \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "6bKfW", "label": "C", "text": "$\\dfrac{1}{95}\\begin{bmatrix} -12 & 1 \\\\ 1 & -8 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "s7JoH", "label": "D", "text": "$\\dfrac{1}{95}\\begin{bmatrix} -8 & 1 \\\\ 1 & -12 \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the reversal law for the inverse of a product of matrices, we have:<br><br>$(AB)^{-1} = B^{-1}A^{-1}$<br><br>First, we find the inverse of matrix $A$. The determinant of $A$ is:<br><br>$|A| = (2)(-2) - (3)(5) = -4 - 15 = -19$<br><br>The adjugate of $A$ is obtained by swapping the diagonal elements and changing the signs of the off-diagonal elements:<br><br>$\\text{adj}(A) = \\begin{bmatrix} -2 & -3 \\\\ -5 & 2 \\end{bmatrix}$<br><br>Thus, $A^{-1}$ is given by:<br><br>$A^{-1} = \\dfrac{1}{|A|} \\text{adj}(A) = \\dfrac{1}{-19} \\begin{bmatrix} -2 & -3 \\\\ -5 & 2 \\end{bmatrix} = \\dfrac{1}{19} \\begin{bmatrix} 2 & 3 \\\\ 5 & -2 \\end{bmatrix}$<br><br>We are given $B^{-1} = \\begin{bmatrix} \\dfrac{1}{5} & \\dfrac{2}{5} \\\\ \\dfrac{2}{5} & -\\dfrac{1}{5} \\end{bmatrix} = \\dfrac{1}{5} \\begin{bmatrix} 1 & 2 \\\\ 2 & -1 \\end{bmatrix}$.<br><br>Now, we compute $(AB)^{-1}$ by multiplying $B^{-1}$ and $A^{-1}$:<br><br>$(AB)^{-1} = B^{-1}A^{-1} = \\left( \\dfrac{1}{5} \\begin{bmatrix} 1 & 2 \\\\ 2 & -1 \\end{bmatrix} \\right) \\left( \\dfrac{1}{19} \\begin{bmatrix} 2 & 3 \\\\ 5 & -2 \\end{bmatrix} \\right)$<br><br>$(AB)^{-1} = \\dfrac{1}{95} \\begin{bmatrix} 1 & 2 \\\\ 2 & -1 \\end{bmatrix} \\begin{bmatrix} 2 & 3 \\\\ 5 & -2 \\end{bmatrix}$<br><br>Performing the matrix multiplication:<br><br>$(AB)^{-1} = \\dfrac{1}{95} \\begin{bmatrix} (1)(2) + (2)(5) & (1)(3) + (2)(-2) \\\\ (2)(2) + (-1)(5) & (2)(3) + (-1)(-2) \\end{bmatrix}$<br><br>$(AB)^{-1} = \\dfrac{1}{95} \\begin{bmatrix} 2 + 10 & 3 - 4 \\\\ 4 - 5 & 6 + 2 \\end{bmatrix} = \\dfrac{1}{95} \\begin{bmatrix} 12 & -1 \\\\ -1 & 8 \\end{bmatrix}$<br><br>Answer: $\\dfrac{1}{95}\\begin{bmatrix} 12 & -1 \\\\ -1 & 8 \\end{bmatrix}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e98c30a4553e1bde22", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 3 & 1 \\\\ -1 & 2 \\end{bmatrix}$, $C = \\begin{bmatrix} 7 & 3 \\\\ 0 & 6 \\end{bmatrix}$ and $AB = C$, then the inverse of matrix B is", "image": null}, "options": [{"id": "fbKh7", "label": "A", "text": "$\\dfrac{1}{42}\\begin{bmatrix} 3 & 0 \\\\ -1 & 2 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "emwXF", "label": "B", "text": "$\\dfrac{1}{6}\\begin{bmatrix} 3 & 0 \\\\ -1 & 2 \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "d0z0X", "label": "C", "text": "$\\dfrac{1}{42}\\begin{bmatrix} 6 & 3 \\\\ -1 & 2 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "MXXPV", "label": "D", "text": "$\\dfrac{1}{6}\\begin{bmatrix} 7 & 3 \\\\ -1 & 3 \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $AB = C$<br><br>Taking inverse on both sides, we get $(AB)^{-1} = C^{-1}$<br><br>$B^{-1}A^{-1} = C^{-1}$<br><br>Multiplying both sides by $A$ on the right, we get $B^{-1} = C^{-1}A$<br><br>We have $C = \\begin{bmatrix} 7 & 3 \\\\ 0 & 6 \\end{bmatrix}$<br><br>$|C| = 7(6) - 3(0) = 42$<br><br>$C^{-1} = \\dfrac{1}{42}\\begin{bmatrix} 6 & -3 \\\\ 0 & 7 \\end{bmatrix}$<br><br>Now, $B^{-1} = \\dfrac{1}{42}\\begin{bmatrix} 6 & -3 \\\\ 0 & 7 \\end{bmatrix}\\begin{bmatrix} 3 & 1 \\\\ -1 & 2 \\end{bmatrix}$<br><br>$B^{-1} = \\dfrac{1}{42}\\begin{bmatrix} 18+3 & 6-6 \\\\ 0-7 & 0+14 \\end{bmatrix}$<br><br>$B^{-1} = \\dfrac{1}{42}\\begin{bmatrix} 21 & 0 \\\\ -7 & 14 \\end{bmatrix}$<br><br>$B^{-1} = \\dfrac{7}{42}\\begin{bmatrix} 3 & 0 \\\\ -1 & 2 \\end{bmatrix} = \\dfrac{1}{6}\\begin{bmatrix} 3 & 0 \\\\ -1 & 2 \\end{bmatrix}$<br><br>Answer: $\\dfrac{1}{6}\\begin{bmatrix} 3 & 0 \\\\ -1 & 2 \\end{bmatrix}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31d8c30a4553e1be055", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} \\cos\\theta & -\\sin\\theta \\\\ \\sin\\theta & \\cos\\theta \\end{bmatrix}$, then the matrix $A^{-3}$ when $\\theta = \\dfrac{\\pi}{6}$ is equal to...", "image": null}, "options": [{"id": "kAKas", "label": "A", "text": "$\\begin{bmatrix} 0 & 1 \\\\ -1 & 0 \\end{bmatrix}$", "isCorrect": true, "image": null}, {"id": "YOHxS", "label": "B", "text": "$\\begin{bmatrix} 0 & 1 \\\\ 1 & 0 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "WHavr", "label": "C", "text": "$\\begin{bmatrix} 0 & -1 \\\\ 1 & 0 \\end{bmatrix}$", "isCorrect": false, "image": null}, {"id": "RJVQG", "label": "D", "text": "$\\begin{bmatrix} 1 & 0 \\\\ 0 & 1 \\end{bmatrix}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} \\cos\\theta & -\\sin\\theta \\\\ \\sin\\theta & \\cos\\theta \\end{bmatrix}$<br><br>Using the property of rotation matrices, $A^n = \\begin{bmatrix} \\cos n\\theta & -\\sin n\\theta \\\\ \\sin n\\theta & \\cos n\\theta \\end{bmatrix}$ for any integer $n$.<br><br>For $n = -3$, we have:<br><br>$A^{-3} = \\begin{bmatrix} \\cos(-3\\theta) & -\\sin(-3\\theta) \\\\ \\sin(-3\\theta) & \\cos(-3\\theta) \\end{bmatrix}$<br><br>Since $\\cos(-x) = \\cos x$ and $\\sin(-x) = -\\sin x$, this simplifies to:<br><br>$A^{-3} = \\begin{bmatrix} \\cos 3\\theta & \\sin 3\\theta \\\\ -\\sin 3\\theta & \\cos 3\\theta \\end{bmatrix}$<br><br>Substituting $\\theta = \\dfrac{\\pi}{6}$, we get $3\\theta = \\dfrac{\\pi}{2}$:<br><br>$A^{-3} = \\begin{bmatrix} \\cos\\dfrac{\\pi}{2} & \\sin\\dfrac{\\pi}{2} \\\\ -\\sin\\dfrac{\\pi}{2} & \\cos\\dfrac{\\pi}{2} \\end{bmatrix}$<br><br>$A^{-3} = \\begin{bmatrix} 0 & 1 \\\\ -1 & 0 \\end{bmatrix}$<br><br>Answer: $\\begin{bmatrix} 0 & 1 \\\\ -1 & 0 \\end{bmatrix}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214380aee93fa0796dee9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Let $\\mathrm{A}=\\left[\\begin{array}{ll}x & 1 \\\\ 1 & 0\\end{array}\\right], x \\in \\mathbb{R}^{+}$and $\\mathrm{A}^4=\\left[\\mathrm{a}_{\\mathrm{ij}}\\right]_2$.\r\nIf $\\mathrm{a}_{11}=109$, then $\\left(\\mathrm{A}^4\\right)^{-1}=$", "image": null}, "options": [{"id": "R3wvE", "text": "$\\left[\\begin{array}{ll}109 & 33 \\\\ 33 & 10\\end{array}\\right]$.", "image": null, "isCorrect": false}, {"id": "wLQY8", "text": "$\\left[\\begin{array}{ll}10 & 33 \\\\ 33 & 10\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "OU9lk", "text": "$\\left[\\begin{array}{cc}10 & 33 \\\\ 33 & 109\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "gE6NX", "text": "$\\left[\\begin{array}{cc}10 & -33 \\\\ -33 & 109\\end{array}\\right]$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $A = \\begin{bmatrix} x & 1 \\\\ 1 & 0 \\end{bmatrix}$.<br><br>First, we find $A^2$:<br>$A^2 = \\begin{bmatrix} x & 1 \\\\ 1 & 0 \\end{bmatrix} \\begin{bmatrix} x & 1 \\\\ 1 & 0 \\end{bmatrix} = \\begin{bmatrix} x^2+1 & x \\\\ x & 1 \\end{bmatrix}$<br><br>Next, we find $A^4 = (A^2)^2$:<br>$A^4 = \\begin{bmatrix} x^2+1 & x \\\\ x & 1 \\end{bmatrix} \\begin{bmatrix} x^2+1 & x \\\\ x & 1 \\end{bmatrix} = \\begin{bmatrix} (x^2+1)^2 + x^2 & x(x^2+1) + x \\\\ x(x^2+1) + x & x^2 + 1 \\end{bmatrix}$<br><br>We are given that the first element of $A^4$ is $a_{11} = 109$.<br>$(x^2+1)^2 + x^2 = 109$<br>$x^4 + 2x^2 + 1 + x^2 = 109$<br>$x^4 + 3x^2 - 108 = 0$<br>$(x^2 + 12)(x^2 - 9) = 0$<br><br>Since $x \\in \\mathbb{R}^{+}$, $x^2$ must be positive, so $x^2 = 9$, which gives $x = 3$.<br><br>Now, substituting $x = 3$ into the elements of $A^4$:<br>$a_{11} = 109$<br>$a_{12} = 3(9+1) + 3 = 33$<br>$a_{21} = 33$<br>$a_{22} = 9 + 1 = 10$<br><br>Thus, $A^4 = \\begin{bmatrix} 109 & 33 \\\\ 33 & 10 \\end{bmatrix}$.<br><br>The determinant of $A^4$ is $|A^4| = (109)(10) - (33)(33) = 1090 - 1089 = 1$.<br><br>The inverse of a $2 \\times 2$ matrix $\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}$ is $\\dfrac{1}{ad-bc} \\begin{bmatrix} d & -b \\\\ -c & a \\end{bmatrix}$.<br><br>Therefore, $(A^4)^{-1} = \\dfrac{1}{1} \\begin{bmatrix} 10 & -33 \\\\ -33 & 109 \\end{bmatrix} = \\begin{bmatrix} 10 & -33 \\\\ -33 & 109 \\end{bmatrix}$.<br><br>Answer: $\\left[\\begin{array}{cc}10 & -33 \\\\ -33 & 109\\end{array}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214140aee93fa0796ddcd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Let A and B be $3 \\times 3$ real matrices such that A is symmetric matrix and $B$ is skew-symmetric matrix. Then the system of linear equations $\\left(A^2 B^2-B^2 A^2\\right) X=0$. where $X$ is $3 \\times 1$ column matrix of unknown variables and O is a $3 \\times 1$ null matrix, has", "image": null}, "options": [{"id": "M3w2P", "text": "a unique solution", "image": null, "isCorrect": false}, {"id": "ThvGV", "text": "exactly two solutions", "image": null, "isCorrect": false}, {"id": "b6cbE", "text": "no solution", "image": null, "isCorrect": false}, {"id": "FD3hp", "text": "infinitely many solutions", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $M = A^2 B^2 - B^2 A^2$.<br><br>Taking the transpose of $M$, we get:<br><br>$M^T = (A^2 B^2 - B^2 A^2)^T$<br><br>$M^T = (A^2 B^2)^T - (B^2 A^2)^T$<br><br>$M^T = (B^2)^T (A^2)^T - (A^2)^T (B^2)^T$<br><br>Since $A$ is a symmetric matrix, $A^T = A$, which implies $(A^2)^T = A^2$.<br><br>Since $B$ is a skew-symmetric matrix, $B^T = -B$, which implies $(B^2)^T = (-B)^2 = B^2$.<br><br>Substituting these into the equation for $M^T$:<br><br>$M^T = B^2 A^2 - A^2 B^2 = -(A^2 B^2 - B^2 A^2) = -M$<br><br>This shows that $M$ is a skew-symmetric matrix. The order of $M$ is $3 \\times 3$, which is an odd order.<br><br>The determinant of a skew-symmetric matrix of odd order is always zero. Therefore, $|M| = 0$.<br><br>The given system of equations is $MX = 0$, which is a homogeneous system of linear equations. Since the determinant of the coefficient matrix $M$ is zero, the system has non-trivial solutions.<br><br>A homogeneous system of linear equations with non-trivial solutions always has infinitely many solutions.<br><br>Answer: infinitely many solutions", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213790aee93fa0796d90d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Suppose A is any $3 \\times 3$ non-singular matrix and $(\\mathrm{A}-3 \\mathrm{I})(\\mathrm{A}-5 \\mathrm{I})=0$ where $\\mathrm{I}=\\mathrm{I}_3$ and $\\mathrm{O}=\\mathrm{O}_3$. Here $\\mathrm{O}_3$ represent zero matrix of order 3 and $\\mathrm{I}_3$ is an identity matrix of order 3 . If $\\alpha \\mathrm{A}+\\beta \\mathrm{A}^{-1}=4 \\mathrm{I}$, then $\\alpha+\\beta$ is equal to", "image": null}, "options": [{"id": "G3gxy", "text": "13", "image": null, "isCorrect": false}, {"id": "gJ2EH", "text": "7", "image": null, "isCorrect": false}, {"id": "vBpwT", "text": "12", "image": null, "isCorrect": false}, {"id": "clNE4", "text": "8", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given the equation $(A - 3I)(A - 5I) = O$<br><br>Expanding the product, we get:<br><br>$A^2 - 5A - 3A + 15I = O$<br><br>$A^2 - 8A + 15I = O$<br><br>Since $A$ is a non-singular matrix, its inverse $A^{-1}$ exists. Multiplying the entire equation by $A^{-1}$, we obtain:<br><br>$A - 8I + 15A^{-1} = O$<br><br>$A + 15A^{-1} = 8I$<br><br>To match the given form $\\alpha A + \\beta A^{-1} = 4I$, we divide the equation by $2$:<br><br>$\\dfrac{1}{2}A + \\dfrac{15}{2}A^{-1} = 4I$<br><br>Comparing this with $\\alpha A + \\beta A^{-1} = 4I$, we find:<br><br>$\\alpha = \\dfrac{1}{2}$ and $\\beta = \\dfrac{15}{2}$<br><br>Therefore, the sum $\\alpha + \\beta$ is:<br><br>$\\alpha + \\beta = \\dfrac{1}{2} + \\dfrac{15}{2} = \\dfrac{16}{2} = 8$<br><br>Answer: 8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213680aee93fa0796d88a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "For the system $x-y+z=4,2 x+y-3 z=0$, $x+y+z=2$, the values of $x, y, z$ respectively are given by", "image": null}, "options": [{"id": "x2F3c", "text": "$2,1,1$", "image": null, "isCorrect": false}, {"id": "pbMbm", "text": "$2,-1,1$", "image": null, "isCorrect": true}, {"id": "oSeZi", "text": "$2,1,-1$", "image": null, "isCorrect": false}, {"id": "rWGt6", "text": "$-2,1,1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given system of equations is:<br>$x - y + z = 4$<br>$2x + y - 3z = 0$<br>$x + y + z = 2$<br><br>Subtracting the first equation from the third equation:<br>$(x + y + z) - (x - y + z) = 2 - 4$<br>$2y = -2$<br>$y = -1$<br><br>Substituting $y = -1$ into the first equation:<br>$x - (-1) + z = 4$<br>$x + z = 3$<br><br>Substituting $y = -1$ into the second equation:<br>$2x + (-1) - 3z = 0$<br>$2x - 3z = 1$<br><br>Multiplying $x + z = 3$ by $3$ and adding to $2x - 3z = 1$:<br>$3(x + z) + (2x - 3z) = 3(3) + 1$<br>$3x + 3z + 2x - 3z = 9 + 1$<br>$5x = 10$<br>$x = 2$<br><br>Substituting $x = 2$ into $x + z = 3$:<br>$2 + z = 3$<br>$z = 1$<br><br>The values of $x, y, z$ are $2, -1, 1$ respectively.<br><br>Answer: $2,-1,1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623e0279619d9d8a32f3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "If $\\mathrm{A}=\\left[\\begin{array}{cc}2 \\mathrm{a} & -3 \\mathrm{~b} \\\\ 3 & 2\\end{array}\\right]$ and $\\mathrm{A} \\cdot \\operatorname{adj} \\mathrm{A}=\\mathrm{AA}^{\\mathrm{T}}$, then $2 a+3 b$ is", "image": null}, "options": [{"id": "6ie1K", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "SuTDZ", "text": "$1$", "image": null, "isCorrect": false}, {"id": "i5I3N", "text": "$5$", "image": null, "isCorrect": true}, {"id": "Yx5cw", "text": "$-5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & A=\\left[\\begin{array}{cc}2 a & -3 b \\\\ 3 & 2\\end{array}\\right] \\\\ & A \\cdot \\operatorname{adj} A=\\left[\\begin{array}{cc}2 a & -3 b \\\\ 3 & 2\\end{array}\\right]\\left[\\begin{array}{cc}2 & 3 b \\\\ -3 & 2 a\\end{array}\\right] \\\\ & =\\left[\\begin{array}{cc}4 a+9 b & 0 \\\\ 0 & 9 b+4 a\\end{array}\\right] \\\\ & A \\cdot A^T=\\left[\\begin{array}{cc}2 a & -3 b \\\\ 3 & 2\\end{array}\\right]\\left[\\begin{array}{cc}2 a & 3 \\\\ -3 b & 2\\end{array}\\right] \\\\ & =\\left[\\begin{array}{cc}4 a^2+9 b^2 & 6 a-6 b \\\\ 6 a-6 b & 13\\end{array}\\right] \\\\ & \\therefore \\quad \\mathrm{A} \\cdot \\operatorname{adj} \\mathrm{A}=\\mathrm{A} \\cdot \\mathrm{A}^{\\mathrm{T}} \\\\ & \\Rightarrow\\left[\\begin{array}{cc}4 a+9 b & 0 \\\\ 0 & 4 a+9 b\\end{array}\\right]=\\left[\\begin{array}{cc}4 a^2+9 b^2 & 6 a-6 b \\\\ 6 a-6 b & 13\\end{array}\\right] \\\\ & \\Rightarrow \\mathrm{a}=\\mathrm{b} \\text { and } 4 \\mathrm{a}+9 \\mathrm{~b}=13 \\\\ & \\Rightarrow \\mathrm{a}=\\mathrm{b}=1 \\\\ & \\Rightarrow 2 a+3 b=5 \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261cc0279619d9d8a2f6c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Let $\\mathrm{A}=\\left[\\begin{array}{ccc}1 & 1 & 1 \\\\ 0 & 1 & 3 \\\\ 1 & -2 & 1\\end{array}\\right], \\mathrm{B}=\\left[\\begin{array}{c}6 \\\\ 11 \\\\ 0\\end{array}\\right]$ and $\\mathrm{X}-\\left[\\begin{array}{l}\\mathrm{a} \\\\ \\mathrm{b} \\\\ \\mathrm{c}\\end{array}\\right]$, if $\\mathrm{AX}=\\mathrm{B}$, then the value of $2 \\mathrm{a}+\\mathrm{b}+2 \\mathrm{c}$ is", "image": null}, "options": [{"id": "CBKk2", "text": "10", "image": null, "isCorrect": true}, {"id": "13gv5", "text": "8", "image": null, "isCorrect": false}, {"id": "rJCfO", "text": "6", "image": null, "isCorrect": false}, {"id": "9hS0S", "text": "12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{AX}=\\mathrm{B} \\\\ & {\\left[\\begin{array}{ccc}1 & 1 & 1 \\\\ 0 & 1 & 3 \\\\ 1 & -2 & 1\\end{array}\\right]\\left[\\begin{array}{l}a \\\\ b \\\\ c\\end{array}\\right]=\\left[\\begin{array}{c}6 \\\\ 11 \\\\ 0\\end{array}\\right]} \\\\ & \\therefore \\quad a+b+c=6 ...(i)\\\\ & \\mathrm{~b}+3 \\mathrm{c}=11 ...(ii)\\\\ & a-2 b+c=0 \\\\ & \\text { i.e., } a+c=2 b ...(iii)\\\\ & \\text { From (i) and (ii), we get } b=2 \\\\ & \\text { From (ii), } c=3 \\\\ & \\text { From (i), } a=1 \\\\ & \\therefore \\quad 2 \\mathrm{a}+\\mathrm{b}+2 \\mathrm{c}=2(1)+2+2(3)=10 \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a40279619d9d8a2e2b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "If $\\mathrm{A}$ is non-singular matrix of order 3 such that $(A-2 \\mathrm{I})(A-4 \\mathrm{I})=0$, then $\\frac{1}{6} A+\\frac{4}{3} A^{-1}$ is (where I is a unit matrix of order 3 and 0 is a null matrix of order 3)", "image": null}, "options": [{"id": "QeVcL", "text": "6I", "image": null, "isCorrect": false}, {"id": "6xz7Y", "text": "I", "image": null, "isCorrect": true}, {"id": "x0OOL", "text": "0", "image": null, "isCorrect": false}, {"id": "uPOIn", "text": "2I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & (A-2 \\mathrm{I})(A-4 \\mathrm{I})=0 \\\\ & \\Rightarrow A^2-6 A+8 \\mathrm{I}=0 \\\\ & \\Rightarrow A^2+8 \\mathrm{I}=6 A \\\\ & \\Rightarrow A^2 A^{-1}+8 \\mathrm{I} A^{-1}=6 A A^{-1} \\\\ & \\Rightarrow A+8 A^{-1}=6 \\mathrm{I} \\\\ & \\Rightarrow \\frac{1}{6} A+\\frac{4}{3} A^{-1}=\\mathrm{I}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true d", "lastPracticed": null}, {"_id": "65a260d60279619d9d8a27b2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "If $\\mathrm{AX}=\\mathrm{B}$, where $\\mathrm{A}=\\left[\\begin{array}{ccc}1 & -1 & 1 \\\\ 2 & 1 & -3 \\\\ 1 & 2 & 1\\end{array}\\right], \\mathrm{X}=\\left[\\begin{array}{l}\\mathrm{x} \\\\ \\mathrm{y} \\\\ \\mathrm{z}\\end{array}\\right], \\mathrm{B}=\\left[\\begin{array}{l}4 \\\\ 0 \\\\ 2\\end{array}\\right]$, then $2 x+y-z=0$", "image": null}, "options": [{"id": "UuAJ5", "text": "2", "image": null, "isCorrect": true}, {"id": "qybnD", "text": "1", "image": null, "isCorrect": false}, {"id": "YizVm", "text": "4", "image": null, "isCorrect": false}, {"id": "DGrUY", "text": "-2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & {\\left[\\begin{array}{ccc}1 & -1 & 1 \\\\ 2 & 1 & -3 \\\\ 1 & 2 & 1\\end{array}\\right]\\left[\\begin{array}{l}\\mathrm{x} \\\\ \\mathrm{y} \\\\ \\mathrm{z}\\end{array}\\right]=\\left[\\begin{array}{l}4 \\\\ 0 \\\\ 2\\end{array}\\right]} \\\\ & \\mathrm{R}_3 \\rightarrow \\mathrm{R}_3-\\mathrm{R}_1 \\text { and } \\mathrm{R}_2 \\rightarrow \\mathrm{R}_2-2 \\mathrm{R}_1 \\\\ & {\\left[\\begin{array}{ccc}1 & -1 & 1 \\\\ 0 & 3 & -5 \\\\ 0 & 2 & 0\\end{array}\\right]\\left[\\begin{array}{l}\\mathrm{x} \\\\ \\mathrm{y} \\\\ \\mathrm{z}\\end{array}\\right]=\\left[\\begin{array}{c}4 \\\\ -8 \\\\ -2\\end{array}\\right]}\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/O4ecgd3-ULY6eiCaH94oZ33Cnk-34QF5duC6OBDx0-E.original.fullsize.png\"><br>\n$\\begin{array}{lll}\\therefore & y=-1 & \\ldots[\\operatorname{from}(3)] \\\\ \\therefore & -3-5 z=-8 \\quad \\Rightarrow z=1 & \\ldots[\\operatorname{from}(2)] \\\\ \\therefore & x-(-1)+1=4 \\Rightarrow x=2 & \\ldots[\\operatorname{from}(1)] \\\\ \\therefore & 2 x+y-z=2(2)-1-1=2 & \\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fad0279619d9d8a1e61", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "If $A=\\left[\\begin{array}{cc}1 & 0 \\\\ -1 & 7\\end{array}\\right], I=\\left[\\begin{array}{cc}1 & 0 \\\\ 0 & 1\\end{array}\\right]$ and $A^{2}=8 A+k I$, then the value of $K$ is", "image": null}, "options": [{"id": "fvSr8", "text": "$\\frac{1}{7}$", "image": null, "isCorrect": false}, {"id": "ZHCIj", "text": "$\\frac{-1}{7}$", "image": null, "isCorrect": false}, {"id": "kBg5g", "text": "$-7$", "image": null, "isCorrect": true}, {"id": "gmtGR", "text": "7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\nA^{2}=A \\times A=\\left[\\begin{array}{cc}\n1 & 0 \\\\\n-1 & 7\n\\end{array}\\right]\\left[\\begin{array}{cc}\n1 & 0 \\\\\n-1 & 7\n\\end{array}\\right]=\\left[\\begin{array}{cc}\n1 & 0 \\\\\n-8 & 49\n\\end{array}\\right]\n$$\nGiven $A^{2}=8 A+K I$\n$$\n\\begin{aligned}\n&=8\\left[\\begin{array}{cc}\n1 & 0 \\\\\n-1 & 7\n\\end{array}\\right]+\\mathrm{k}\\left[\\begin{array}{ll}\n1 & 0 \\\\\n0 & 1\n\\end{array}\\right]=\\left[\\begin{array}{cc}\n8 & 0 \\\\\n-8 & 56\n\\end{array}\\right]+\\left[\\begin{array}{cc}\n\\mathrm{k} & 0 \\\\\n0 & \\mathrm{k}\n\\end{array}\\right] \\\\\n\\therefore \\quad\\left[\\begin{array}{cc}\n1 & 0 \\\\\n-8 & 49\n\\end{array}\\right] &=\\left[\\begin{array}{cc}\n8+\\mathrm{k} & 0 \\\\\n-8 & 56+\\mathrm{k}\n\\end{array}\\right] \\Rightarrow 8+\\mathrm{k}=1 \\Rightarrow \\mathrm{k}=-7\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6d0279619d9d8a1452", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "$A=\\left[\\begin{array}{rr}\\cos \\theta & -\\sin \\theta \\\\ \\sin \\theta & \\cos \\theta\\end{array}\\right]$ and $A B=B A=I$, then $B$ is\nequal to", "image": null}, "options": [{"id": "heF8X", "text": "$\\left[\\begin{array}{rr}-\\cos \\theta & \\sin \\theta \\\\ \\sin \\theta & \\cos \\theta\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "gP662", "text": "$\\left[\\begin{array}{rr}\\cos \\theta & \\sin \\theta \\\\ -\\sin \\theta & \\cos \\theta\\end{array}\\right]$", "image": null, "isCorrect": true}, {"id": "q45tH", "text": "$\\left[\\begin{array}{rr}-\\sin \\theta & \\cos \\theta \\\\ \\cos \\theta & \\sin \\theta\\end{array}\\right]$", "image": null, "isCorrect": false}, {"id": "Gflbl", "text": "$\\left[\\begin{array}{rr}\\sin \\theta & -\\cos \\theta \\\\ -\\cos \\theta & \\sin \\theta\\end{array}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $A=\\left[\\begin{array}{rr}\\cos \\theta & -\\sin \\theta \\\\ \\sin \\theta & \\cos \\theta\\end{array}\\right]$\nand $\\quad A B=B A=I$\n$\\Rightarrow B=A^{-1} I=A^{-1}$\n$=\\frac{1}{\\cos ^{2} \\theta+\\sin ^{2} \\theta}\\left[\\begin{array}{rr}\\cos \\theta & \\sin \\theta \\\\ -\\sin \\theta & \\cos \\theta\\end{array}\\right]$\n$\\Rightarrow B=\\left[\\begin{array}{rr}\\cos \\theta & \\sin \\theta \\\\ -\\sin \\theta & \\cos \\theta\\end{array}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e470279619d9d8a1329", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "If $A=\\left[\\begin{array}{cc}\\cos ^{2} \\alpha & \\cos \\alpha \\sin \\alpha \\\\ \\cos \\alpha \\sin \\alpha & \\sin ^{2} \\alpha\\end{array}\\right]$\nand\n$B=\\left[\\begin{array}{cc}\\cos ^{2} \\beta & \\cos \\beta \\sin \\beta \\\\ \\cos \\beta \\sin \\beta & \\sin ^{2} \\beta\\end{array}\\right]$ are two matrices\nsuch that the product $A B$ is null matrix, then $\\alpha-\\beta$ is", "image": null}, "options": [{"id": "EiBvV", "text": "0", "image": null, "isCorrect": true}, {"id": "OXeJL", "text": "multiple of $\\pi$", "image": null, "isCorrect": false}, {"id": "4nkjl", "text": "an odd multiple of $\\pi / 2$", "image": null, "isCorrect": false}, {"id": "hASPM", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $A B=O$\n$\\Rightarrow \\alpha-\\beta$ is an odd multiple of $\\pi / 2$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2633c0279619d9d8a3d52", "title": "Adjoint and its Properties", "totalQuestions": 44, "questions": [{"_id": "6abb88b615a9fc0fc8c14645", "type": "singleCorrect", "question": {"text": "If $A = \\begin{bmatrix} 1 & -1 & 1 \\\\ 0 & 2 & -3 \\\\ 2 & 1 & 0 \\end{bmatrix}$, $B = \\text{adj}\\ A$ and $C = 5A$, then the value of $\\dfrac{|\\text{adj}\\ B|}{|C|}$ is:", "image": null}, "options": [{"id": "kOxB0", "label": "A", "text": "$25$", "isCorrect": false, "image": null}, {"id": "hAcuB", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "lc527", "label": "C", "text": "$1$", "isCorrect": true, "image": null}, {"id": "R0hwT", "label": "D", "text": "$5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The determinant of matrix $A$ is calculated as:<br><br>$|A| = 1(0 - (-3)) - (-1)(0 - (-6)) + 1(0 - 4)$<br><br>$|A| = 3 + 6 - 4 = 5$<br><br>Given $B = \\text{adj}\\ A$, we need to find $|\\text{adj}\\ B|$, which is $|\\text{adj}(\\text{adj}\\ A)|$. For a matrix of order $n$, the property is $|\\text{adj}(\\text{adj}\\ A)| = |A|^{(n-1)^2}$.<br><br>Since the order of matrix $A$ is $n = 3$:<br><br>$|\\text{adj}\\ B| = |A|^{(3-1)^2} = |A|^4$<br><br>$|\\text{adj}\\ B| = 5^4 = 625$<br><br>Given $C = 5A$, the determinant of $C$ is found using the property $|kA| = k^n |A|$:<br><br>$|C| = |5A| = 5^3 |A|$<br><br>$|C| = 125 \\times 5 = 625$<br><br>The required ratio is:<br><br>$\\dfrac{|\\text{adj}\\ B|}{|C|} = \\dfrac{625}{625} = 1$<br><br>Answer: $1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883615a9fc0fc8c14194", "type": "singleCorrect", "question": {"text": "Let $A$ be an invertible matrix. Identify the correct statement(s) from the following.<br>(I) $A(\\text{adj }A^{-1})=\\dfrac{1}{|A|}A^2$ (II) $(\\text{adj }A^{-1})^{-1}=\\dfrac{1}{|A|}A^{-1}$ (III) $(\\text{adj }A)=\\dfrac{1}{|A|}A^{-1}$", "image": null}, "options": [{"id": "yQ2ES", "label": "A", "text": "only (I)", "isCorrect": true, "image": null}, {"id": "NrAH4", "label": "B", "text": "only (I) and (II)", "isCorrect": false, "image": null}, {"id": "xDlCP", "label": "C", "text": "only (III)", "isCorrect": false, "image": null}, {"id": "kNlau", "label": "D", "text": "only (II) and (III)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For any invertible matrix $M$, we have $\\text{adj } M = |M| M^{-1}$.<br><br>Replacing $M$ with $A^{-1}$, we get $\\text{adj } A^{-1} = |A^{-1}| (A^{-1})^{-1} = \\dfrac{1}{|A|} A$.<br><br>Checking statement (I):<br>$A(\\text{adj } A^{-1}) = A \\left( \\dfrac{1}{|A|} A \\right) = \\dfrac{1}{|A|} A^2$.<br>Thus, statement (I) is correct.<br><br>Checking statement (II):<br>$(\\text{adj } A^{-1})^{-1} = \\left( \\dfrac{1}{|A|} A \\right)^{-1} = |A| A^{-1}$.<br>Thus, statement (II) is incorrect.<br><br>Checking statement (III):<br>$\\text{adj } A = |A| A^{-1}$.<br>Thus, statement (III) is incorrect.<br><br>Therefore, only statement (I) is correct.<br><br>Answer: only (I)", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id":
