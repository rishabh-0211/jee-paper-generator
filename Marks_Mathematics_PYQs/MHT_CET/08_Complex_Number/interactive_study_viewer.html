rrow \\mathrm{z}=-\\sqrt{3}+\\mathrm{i}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2634a0279619d9d8a3de2", "title": "Polar and Euler Form", "totalQuestions": 6, "questions": [{"_id": "6abb88b415a9fc0fc8c1463b", "type": "singleCorrect", "question": {"text": "If $n \\in Z$, then the value of $\\dfrac{2^n}{(1+i)^{2n}} + \\dfrac{2^n}{(1-i)^{2n}} + \\dfrac{(1+i)^{2n} + (1-i)^{2n}}{2^n}$ is equal to", "image": null}, "options": [{"id": "C5q0x", "label": "A", "text": "$4\\cos\\left(\\dfrac{n\\pi}{2}\\right)$", "isCorrect": true, "image": null}, {"id": "eF3pW", "label": "B", "text": "$2(n+1)\\cos\\left(\\dfrac{n\\pi}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "i3EPo", "label": "C", "text": "$2[1 + (-1)^n]$", "isCorrect": false, "image": null}, {"id": "NsCJg", "label": "D", "text": "$2(n+2)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We know that $(1+i)^2 = 1 + i^2 + 2i = 2i$ and $(1-i)^2 = 1 + i^2 - 2i = -2i$.<br><br>Raising both to the power of $n$, we get:<br>$(1+i)^{2n} = (2i)^n = 2^n i^n$<br>$(1-i)^{2n} = (-2i)^n = 2^n (-i)^n$<br><br>Substituting these into the given expression:<br>$\\dfrac{2^n}{2^n i^n} + \\dfrac{2^n}{2^n (-i)^n} + \\dfrac{2^n i^n + 2^n (-i)^n}{2^n}$<br><br>$= \\dfrac{1}{i^n} + \\dfrac{1}{(-i)^n} + i^n + (-i)^n$<br><br>Since $\\dfrac{1}{i} = -i$ and $\\dfrac{1}{-i} = i$, the expression simplifies to:<br>$(-i)^n + i^n + i^n + (-i)^n = 2(i^n + (-i)^n)$<br><br>Using De Moivre's theorem:<br>$i^n = \\left(\\cos\\dfrac{\\pi}{2} + i\\sin\\dfrac{\\pi}{2}\\right)^n = \\cos\\dfrac{n\\pi}{2} + i\\sin\\dfrac{n\\pi}{2}$<br>$(-i)^n = \\left(\\cos\\left(-\\dfrac{\\pi}{2}\\right) + i\\sin\\left(-\\dfrac{\\pi}{2}\\right)\\right)^n = \\cos\\dfrac{n\\pi}{2} - i\\sin\\dfrac{n\\pi}{2}$<br><br>Adding these gives:<br>$i^n + (-i)^n = 2\\cos\\dfrac{n\\pi}{2}$<br><br>Therefore, the value of the given expression is:<br>$2 \\times 2\\cos\\dfrac{n\\pi}{2} = 4\\cos\\dfrac{n\\pi}{2}$<br><br>Answer: $4\\cos\\left(\\dfrac{n\\pi}{2}\\right)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889515a9fc0fc8c1450f", "type": "singleCorrect", "question": {"text": "If $z_1 = 3 \\cdot e^{\\dfrac{5\\pi}{12}i}$ and $z_2 = 4 \\cdot e^{\\dfrac{\\pi}{12}i}$ then $z_1 \\cdot z_2 = \\cdots\\cdots$", "image": null}, "options": [{"id": "1uINK", "label": "A", "text": "$12$", "isCorrect": false, "image": null}, {"id": "ns9pp", "label": "B", "text": "$12i$", "isCorrect": true, "image": null}, {"id": "Lt9Un", "label": "C", "text": "$e^{\\dfrac{\\pi}{2}i}$", "isCorrect": false, "image": null}, {"id": "hvhNb", "label": "D", "text": "$e^{\\dfrac{\\pi}{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $z_1 = 3 \\cdot e^{\\dfrac{5\\pi}{12}i}$ and $z_2 = 4 \\cdot e^{\\dfrac{\\pi}{12}i}$<br><br>$z_1 \\cdot z_2 = \\left(3 \\cdot e^{\\dfrac{5\\pi}{12}i}\\right) \\cdot \\left(4 \\cdot e^{\\dfrac{\\pi}{12}i}\\right)$<br><br>$z_1 \\cdot z_2 = 12 \\cdot e^{\\left(\\dfrac{5\\pi}{12} + \\dfrac{\\pi}{12}\\right)i}$<br><br>$z_1 \\cdot z_2 = 12 \\cdot e^{\\dfrac{6\\pi}{12}i} = 12 \\cdot e^{\\dfrac{\\pi}{2}i}$<br><br>Using Euler's formula, $e^{\\dfrac{\\pi}{2}i} = \\cos\\left(\\dfrac{\\pi}{2}\\right) + i\\sin\\left(\\dfrac{\\pi}{2}\\right) = i$<br><br>$z_1 \\cdot z_2 = 12i$<br><br>Answer: $12i$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886515a9fc0fc8c1434d", "type": "singleCorrect", "question": {"text": "If $z = \\dfrac{\\sqrt{3} + i}{2}$, then the value of $z^{69}$ is", "image": null}, "options": [{"id": "LiGkc", "label": "A", "text": "$-i$", "isCorrect": true, "image": null}, {"id": "g37do", "label": "B", "text": "$i$", "isCorrect": false, "image": null}, {"id": "qkZie", "label": "C", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "N1Rmn", "label": "D", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $z = \\dfrac{\\sqrt{3} + i}{2}$<br><br>Expressing $z$ in polar form:<br><br>$z = \\cos\\left(\\dfrac{\\pi}{6}\\right) + i\\sin\\left(\\dfrac{\\pi}{6}\\right) = e^{i\\pi/6}$<br><br>Using De Moivre's theorem to find $z^{69}$:<br><br>$z^{69} = \\left(e^{i\\pi/6}\\right)^{69} = e^{i 69\\pi/6} = e^{i 23\\pi/2}$<br><br>Expanding using Euler's formula:<br><br>$z^{69} = \\cos\\left(\\dfrac{23\\pi}{2}\\right) + i\\sin\\left(\\dfrac{23\\pi}{2}\\right)$<br><br>Since $\\dfrac{23\\pi}{2} = 10\\pi + \\dfrac{3\\pi}{2}$:<br><br>$z^{69} = \\cos\\left(10\\pi + \\dfrac{3\\pi}{2}\\right) + i\\sin\\left(10\\pi + \\dfrac{3\\pi}{2}\\right)$<br><br>$z^{69} = \\cos\\left(\\dfrac{3\\pi}{2}\\right) + i\\sin\\left(\\dfrac{3\\pi}{2}\\right)$<br><br>$z^{69} = 0 + i(-1) = -i$<br><br>Answer: $-i$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bb8c30a4553e1bdc33", "type": "singleCorrect", "question": {"text": "If $-1 + \\sqrt{-3} = r e^{i\\theta}$, then the value of $\\theta$ is", "image": null}, "options": [{"id": "ldV4P", "label": "A", "text": "$-\\dfrac{2\\pi}{3}$", "isCorrect": false, "image": null}, {"id": "tYbj4", "label": "B", "text": "$\\dfrac{\\pi}{3}$", "isCorrect": false, "image": null}, {"id": "HFFZR", "label": "C", "text": "$-\\dfrac{\\pi}{3}$", "isCorrect": false, "image": null}, {"id": "gI643", "label": "D", "text": "$\\dfrac{2\\pi}{3}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given complex number is $z = -1 + \\sqrt{-3} = -1 + i\\sqrt{3}$.<br><br>Let $z = r e^{i\\theta}$, where $r = |z|$ and $\\theta = \\arg(z)$.<br><br>The real part $x = -1$ and the imaginary part $y = \\sqrt{3}$.<br><br>Since $x < 0$ and $y > 0$, the complex number lies in the second quadrant.<br><br>The principal argument $\\theta$ is given by $\\pi - \\tan^{-1}\\left(\\left|\\dfrac{y}{x}\\right|\\right)$.<br><br>$\\theta = \\pi - \\tan^{-1}(\\sqrt{3}) = \\pi - \\dfrac{\\pi}{3} = \\dfrac{2\\pi}{3}$.<br><br>Answer: $\\dfrac{2\\pi}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615b0279619d9d8a2be9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "The Cartesian form of complex number $z=4\\left(\\cos 300^{\\circ}\\right)$, where $i=\\sqrt{1}$ is", "image": null}, "options": [{"id": "Fj4Yr", "text": "$2-2 \\sqrt{3} i$", "image": null, "isCorrect": true}, {"id": "t3p7L", "text": "$1+\\sqrt{3} i$", "image": null, "isCorrect": false}, {"id": "aB2lP", "text": "$1-\\sqrt{3} i$", "image": null, "isCorrect": false}, {"id": "lV4fN", "text": "$2+2 \\sqrt{3} i$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$4\\left(\\cos 300^{\\circ}+i \\sin 300^{\\circ}\\right)=4\\left(\\frac{1}{2}-\\frac{\\sqrt{3}}{2} i\\right)=2-2 \\sqrt{3} i$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261230279619d9d8a2a1d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "The polar co-ordinates of the point, whose Cartesian co-ordinates are $(-2 \\sqrt{3}, 2)$, are", "image": null}, "options": [{"id": "Ejnj1", "text": "$\\left(4,\\left(\\frac{11 \\pi}{12}\\right)\\right)$", "image": null, "isCorrect": false}, {"id": "ZXtts", "text": "$\\left(4,\\left(\\frac{5 \\pi}{6}\\right)\\right)$", "image": null, "isCorrect": true}, {"id": "0yxF5", "text": "$\\left(4,\\left(\\frac{3 \\pi}{4}\\right)\\right)$", "image": null, "isCorrect": false}, {"id": "rnEKu", "text": "$\\left(4,\\left(\\frac{2 \\pi}{3}\\right)\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & x=-2 \\sqrt{3} \\text { and } y=2 \\\\ & r=\\sqrt{x^2+y^2}=\\sqrt{12+4}=4 \\\\ & \\theta=\\pi-\\tan ^{-1}\\left|\\frac{2}{-2 \\sqrt{3}}\\right|=\\pi-\\tan ^{-1} \\frac{1}{\\sqrt{3}}=\\pi-\\frac{\\pi}{6}=\\frac{5 \\pi}{6}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2634b0279619d9d8a3de3", "title": "De Moivres Theorem", "totalQuestions": 6, "questions": [{"_id": "6a44d3018c30a4553e1bdf21", "type": "singleCorrect", "question": {"text": "The smallest positive integer $n$ for which $\\dfrac{(1 + i)^n}{(1 - i)^{n-2}}$ is a real number, is ...", "image": null}, "options": [{"id": "mwjVy", "label": "A", "text": "$1$", "isCorrect": true, "image": null}, {"id": "bBOHy", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "oMNGB", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "2WuCK", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given expression is $\\dfrac{(1 + i)^n}{(1 - i)^{n-2}}$.<br><br>This can be rewritten as $\\left(\\dfrac{1 + i}{1 - i}\\right)^n (1 - i)^2$.<br><br>Simplifying the term inside the bracket:<br><br>$\\dfrac{1 + i}{1 - i} = \\dfrac{(1 + i)^2}{(1 - i)(1 + i)} = \\dfrac{1 + i^2 + 2i}{1^2 - i^2} = \\dfrac{2i}{2} = i$<br><br>Simplifying the second term:<br><br>$(1 - i)^2 = 1 + i^2 - 2i = -2i$<br><br>Substituting these back into the expression, we get:<br><br>$i^n (-2i) = -2 i^{n+1}$<br><br>For this expression to be a real number, $i^{n+1}$ must be a real number. This is possible only when the exponent $n+1$ is an even integer.<br><br>$n + 1 = 2k$, where $k$ is an integer.<br><br>$n = 2k - 1$<br><br>To find the smallest positive integer $n$, substitute $k = 1$:<br><br>$n = 2(1) - 1 = 1$<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3478c30a4553e1be20f", "type": "singleCorrect", "question": {"text": "$\\dfrac{(\\cos 2\\theta + i\\sin 2\\theta)^7}{(\\cos 4\\theta + i\\sin 4\\theta)^3} =$", "image": null}, "options": [{"id": "DjUf3", "label": "A", "text": "$\\cos 2\\theta + i\\sin 2\\theta$", "isCorrect": true, "image": null}, {"id": "P1FZj", "label": "B", "text": "$(\\cos 2\\theta + i\\sin 2\\theta)^4$", "isCorrect": false, "image": null}, {"id": "JxKED", "label": "C", "text": "$\\cos 4\\theta + i\\sin 4\\theta$", "isCorrect": false, "image": null}, {"id": "hPmuz", "label": "D", "text": "$(\\cos 4\\theta + i\\sin 4\\theta)^{-2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using De Moivre's theorem, $(\\cos \\theta + i\\sin \\theta)^n = \\cos n\\theta + i\\sin n\\theta$.<br><br>The numerator is $(\\cos 2\\theta + i\\sin 2\\theta)^7 = \\cos 14\\theta + i\\sin 14\\theta$.<br><br>The denominator is $(\\cos 4\\theta + i\\sin 4\\theta)^3 = \\cos 12\\theta + i\\sin 12\\theta$.<br><br>The given expression becomes $\\dfrac{\\cos 14\\theta + i\\sin 14\\theta}{\\cos 12\\theta + i\\sin 12\\theta}$.<br><br>Using the property $\\dfrac{\\cos \\alpha + i\\sin \\alpha}{\\cos \\beta + i\\sin \\beta} = \\cos(\\alpha - \\beta) + i\\sin(\\alpha - \\beta)$, we get:<br><br>$\\cos(14\\theta - 12\\theta) + i\\sin(14\\theta - 12\\theta) = \\cos 2\\theta + i\\sin 2\\theta$.<br><br>Answer: $\\cos 2\\theta + i\\sin 2\\theta$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d78c30a4553e1bdd5f", "type": "singleCorrect", "question": {"text": "If $n$ is a positive integer, then $(1 + i\\sqrt{3})^{2n} + (1 - i\\sqrt{3})^{2n}$ is equal to .........", "image": null}, "options": [{"id": "1hQKc", "label": "A", "text": "$2^{2n+1}\\cos\\left(\\dfrac{2n\\pi}{3}\\right)$", "isCorrect": true, "image": null}, {"id": "yuUMn", "label": "B", "text": "$2^{2n}\\cos\\left(\\dfrac{n\\pi}{3}\\right)$", "isCorrect": false, "image": null}, {"id": "3HCAh", "label": "C", "text": "$2^{2n+1}\\cos\\left(\\dfrac{n\\pi}{3}\\right)$", "isCorrect": false, "image": null}, {"id": "O5vOi", "label": "D", "text": "$2^n\\cos\\left(\\dfrac{2n\\pi}{3}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $z = 1 + i\\sqrt{3}$.<br><br>Converting to polar form, we have $r = \\sqrt{1^2 + (\\sqrt{3})^2} = 2$ and $\\theta = \\tan^{-1}(\\sqrt{3}) = \\dfrac{\\pi}{3}$.<br><br>Thus, $1 + i\\sqrt{3} = 2\\left(\\cos\\dfrac{\\pi}{3} + i\\sin\\dfrac{\\pi}{3}\\right)$.<br><br>Similarly, $1 - i\\sqrt{3} = 2\\left(\\cos\\dfrac{\\pi}{3} - i\\sin\\dfrac{\\pi}{3}\\right)$.<br><br>Using De Moivre's theorem, we get:<br><br>$(1 + i\\sqrt{3})^{2n} = 2^{2n}\\left(\\cos\\dfrac{2n\\pi}{3} + i\\sin\\dfrac{2n\\pi}{3}\\right)$<br><br>$(1 - i\\sqrt{3})^{2n} = 2^{2n}\\left(\\cos\\dfrac{2n\\pi}{3} - i\\sin\\dfrac{2n\\pi}{3}\\right)$<br><br>Adding the two expressions:<br><br>$(1 + i\\sqrt{3})^{2n} + (1 - i\\sqrt{3})^{2n} = 2^{2n}\\left(2\\cos\\dfrac{2n\\pi}{3}\\right) = 2^{2n+1}\\cos\\dfrac{2n\\pi}{3}$.<br><br>Answer: $2^{2n+1}\\cos\\left(\\dfrac{2n\\pi}{3}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b41bf9280d7f993278b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The value of $\\frac{(\\cos \\theta+i \\sin \\theta)^4}{(\\sin \\theta+i \\cos \\theta)^5}=$ where $i=\\sqrt{-1}$", "image": null}, "options": [{"id": "BYcXQ", "text": "$\\cos \\theta-i \\sin \\theta$", "image": null, "isCorrect": false}, {"id": "VPJ7O", "text": "$\\cos 9 \\theta-\\mathrm{i} \\sin 9 \\theta$", "image": null, "isCorrect": false}, {"id": "kZI1D", "text": "$\\sin \\theta-i \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "522Oy", "text": "$\\sin 9 \\theta-i \\cos 9 \\theta$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using Euler's formula, $\\cos \\theta + i \\sin \\theta = e^{i\\theta}$.<br><br>The numerator is $(\\cos \\theta + i \\sin \\theta)^4 = (e^{i\\theta})^4 = e^{i4\\theta}$.<br><br>For the denominator, we factor out $i$:<br><br>$\\sin \\theta + i \\cos \\theta = i(\\cos \\theta - i \\sin \\theta) = i e^{-i\\theta}$<br><br>Thus, the denominator is $(\\sin \\theta + i \\cos \\theta)^5 = (i e^{-i\\theta})^5 = i^5 e^{-i5\\theta} = i e^{-i5\\theta}$.<br><br>Substituting these into the given expression:<br><br>$\\dfrac{(\\cos \\theta+i \\sin \\theta)^4}{(\\sin \\theta+i \\cos \\theta)^5} = \\dfrac{e^{i4\\theta}}{i e^{-i5\\theta}}$<br><br>$= \\dfrac{1}{i} e^{i4\\theta} e^{i5\\theta} = -i e^{i9\\theta}$<br><br>$= -i (\\cos 9\\theta + i \\sin 9\\theta)$<br><br>$= -i \\cos 9\\theta - i^2 \\sin 9\\theta$<br><br>$= \\sin 9\\theta - i \\cos 9\\theta$<br><br>Answer: $\\sin 9 \\theta-i \\cos 9 \\theta$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b07bf9280d7f99325c3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\begin{aligned} & \\mathrm{f}(x)=(\\cos x+\\mathrm{i} \\sin x) \\cdot(\\cos 3 x+\\mathrm{i} \\sin 3 x) \\cdots \\cdots[\\cos (2 \\mathrm{n}-1) x+\\mathrm{i} \\sin (2 \\mathrm{n}-1) x], \\\\ & \\mathrm{n} \\in \\mathbb{N} \\text { Then } \\mathrm{f}^{\\prime \\prime}(x)=,(\\text { Where } i=\\sqrt{-1})\\end{aligned}$", "image": null}, "options": [{"id": "h64Pp", "text": "$\\mathrm{n}^2 \\mathrm{f}(x)$", "image": null, "isCorrect": false}, {"id": "sPnhs", "text": "$-\\mathrm{n}^4 \\mathrm{f}(x)$", "image": null, "isCorrect": true}, {"id": "9esEG", "text": "$-\\mathrm{n}^2 \\mathrm{f}(x)$", "image": null, "isCorrect": false}, {"id": "9CJfH", "text": "$\\mathrm{n}^4 \\mathrm{f}(x)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Euler's formula, $\\cos \\theta + \\mathrm{i} \\sin \\theta = e^{\\mathrm{i}\\theta}$.<br><br>$\\mathrm{f}(x) = e^{\\mathrm{i}x} \\cdot e^{\\mathrm{i}3x} \\cdots e^{\\mathrm{i}(2\\mathrm{n}-1)x}$<br><br>$\\mathrm{f}(x) = e^{\\mathrm{i}(1 + 3 + 5 + \\dots + (2\\mathrm{n}-1))x}$<br><br>The sum of the first $\\mathrm{n}$ odd natural numbers is $\\mathrm{n}^2$.<br><br>$\\mathrm{f}(x) = e^{\\mathrm{i}\\mathrm{n}^2 x}$<br><br>Differentiating with respect to $x$:<br><br>$\\mathrm{f}^{\\prime}(x) = \\mathrm{i} \\mathrm{n}^2 e^{\\mathrm{i}\\mathrm{n}^2 x}$<br><br>Differentiating again with respect to $x$:<br><br>$\\mathrm{f}^{\\prime\\prime}(x) = (\\mathrm{i} \\mathrm{n}^2)^2 e^{\\mathrm{i}\\mathrm{n}^2 x}$<br><br>$\\mathrm{f}^{\\prime\\prime}(x) = \\mathrm{i}^2 \\mathrm{n}^4 e^{\\mathrm{i}\\mathrm{n}^2 x}$<br><br>Since $\\mathrm{i}^2 = -1$ and $e^{\\mathrm{i}\\mathrm{n}^2 x} = \\mathrm{f}(x)$:<br><br>$\\mathrm{f}^{\\prime\\prime}(x) = -\\mathrm{n}^4 \\mathrm{f}(x)$<br><br>Answer: $-\\mathrm{n}^4 \\mathrm{f}(x)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262060279619d9d8a312f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "If $\\mathrm{z}=x+\\mathrm{i} y$ and $\\mathrm{z}^{1 / 3}=\\mathrm{p}+\\mathrm{iq}$, where $x, y, \\mathrm{p}$, $\\mathrm{q} \\in \\mathrm{R}$ and $\\mathrm{i}=\\sqrt{-1}$, then value of $\\left(\\frac{x}{\\mathrm{p}}+\\frac{y}{\\mathrm{q}}\\right)$ is", "image": null}, "options": [{"id": "pTSd3", "text": "$p^2-q^2$", "image": null, "isCorrect": false}, {"id": "aPn7J", "text": "$4\\left(p^2-q^2\\right)$", "image": null, "isCorrect": true}, {"id": "fNapy", "text": "$\\mathrm{p}^2+\\mathrm{q}^2$", "image": null, "isCorrect": false}, {"id": "MMFxM", "text": "$4\\left(p^2+q^2\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{z}^{\\frac{1}{3}}=\\mathrm{p}+\\mathrm{iq} \\\\ & \\Rightarrow \\mathrm{z}=(\\mathrm{p}+\\mathrm{iq})^3 \\\\ & \\Rightarrow x+\\mathrm{i} y=\\mathrm{p}^3+3 \\mathrm{p}^2 \\mathrm{qi}+3 \\mathrm{p}(\\mathrm{iq})^2+(\\mathrm{iq})^3 \\\\ & \\Rightarrow x+\\mathrm{i} y=\\left(\\mathrm{p}^3-3 \\mathrm{pq}^2\\right)+\\left(3 \\mathrm{p}^2 \\mathrm{q}-\\mathrm{q}^3\\right) \\mathrm{i} \\\\ & \\Rightarrow x=\\mathrm{p}^3-3 \\mathrm{pq}^2 \\text { and } y=3 \\mathrm{p}^2 \\mathrm{q}-\\mathrm{q}^3 \\\\ & \\\\ & \\Rightarrow \\frac{x}{\\mathrm{p}}=\\mathrm{p}^2-3 \\mathrm{q}^2 \\text { and } \\frac{y}{\\mathrm{q}}=3 \\mathrm{p}^2-\\mathrm{q}^2 \\\\ & \\therefore \\quad\\left(\\frac{x}{\\mathrm{p}}+\\frac{y}{\\mathrm{q}}\\right)=4 \\mathrm{p}^2-4 \\mathrm{q}^2=4\\left(\\mathrm{p}^2-\\mathrm{q}^2\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6a44d3a18c30a4553e1be406", "title": "Rotation Theorem", "totalQuestions": 1, "questions": [{"_id": "6a44d30e8c30a4553e1bdfb3", "type": "singleCorrect", "question": {"text": "Point A$(5, 12)$ rotated about the origin O in the XY-plane through an angle of $30^\\circ$ in the anticlockwise direction to a new position B. The ordinate of point B is...", "image": null}, "options": [{"id": "vR882", "label": "A", "text": "$6\\sqrt{3} + \\dfrac{5}{2}$", "isCorrect": true, "image": null}, {"id": "t7bVa", "label": "B", "text": "$\\dfrac{5\\sqrt{3}}{2} - 6$", "isCorrect": false, "image": null}, {"id": "tmaEY", "label": "C", "text": "$\\dfrac{5\\sqrt{3}}{2} + 6$", "isCorrect": false, "image": null}, {"id": "enMfy", "label": "D", "text": "$6\\sqrt{3} - \\dfrac{5}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the coordinates of point A be $(x, y) = (5, 12)$.<br><br>When a point $(x, y)$ is rotated about the origin by an angle $\\theta$ in the anticlockwise direction, the new coordinates $(x', y')$ are given by:<br><br>$x' = x \\cos\\theta - y \\sin\\theta$<br><br>$y' = x \\sin\\theta + y \\cos\\theta$<br><br>Substituting $x = 5$, $y = 12$, and $\\theta = 30^\\circ$ to find the ordinate $y'$ of the new point B:<br><br>$y' = 5 \\sin 30^\\circ + 12 \\cos 30^\\circ$<br><br>$y' = 5 \\left(\\dfrac{1}{2}\\right) + 12 \\left(\\dfrac{\\sqrt{3}}{2}\\right)$<br><br>$y' = \\dfrac{5}{2} + 6\\sqrt{3}$<br><br>The ordinate of point B is $6\\sqrt{3} + \\dfrac{5}{2}$.<br><br>Answer: $6\\sqrt{3} + \\dfrac{5}{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a2634a0279619d9d8a3dde", "title": "Cube Root of Unity", "totalQuestions": 18, "questions": [{"_id": "6abb88d615a9fc0fc8c14767", "type": "singleCorrect", "question": {"text": "If $\\alpha$ and $\\beta$ are complex cube roots of unity, then the difference between the values of $\\alpha^2 + \\beta^2 + \\alpha\\beta$ and $\\alpha^4 + \\beta^4 + \\alpha^{-1}\\beta^{-1}$ is", "image": null}, "options": [{"id": "feztU", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "LA0RQ", "label": "B", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "hg8gR", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "J7oqL", "label": "D", "text": "$0$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $\\alpha = \\omega$ and $\\beta = \\omega^2$, where $\\omega$ is a complex cube root of unity.<br><br>We know that $\\omega^3 = 1$ and $1 + \\omega + \\omega^2 = 0$.<br><br>The first expression is $\\alpha^2 + \\beta^2 + \\alpha\\beta$.<br><br>Substituting the values, we get $\\omega^2 + (\\omega^2)^2 + \\omega(\\omega^2) = \\omega^2 + \\omega^4 + \\omega^3$.<br><br>Since $\\omega^4 = \\omega$ and $\\omega^3 = 1$, this becomes $\\omega^2 + \\omega + 1 = 0$.<br><br>The second expression is $\\alpha^4 + \\beta^4 + \\alpha^{-1}\\beta^{-1}$.<br><br>Substituting the values, we get $\\omega^4 + (\\omega^2)^4 + (\\omega)^{-1}(\\omega^2)^{-1} = \\omega^4 + \\omega^8 + \\omega^{-3}$.<br><br>Since $\\omega^4 = \\omega$, $\\omega^8 = \\omega^2$, and $\\omega^{-3} = 1$, this becomes $\\omega + \\omega^2 + 1 = 0$.<br><br>The difference between the two expressions is $0 - 0 = 0$.<br><br>Answer: $0$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884515a9fc0fc8c14221", "type": "singleCorrect", "question": {"text": "If $w = -\\dfrac{1}{2} + \\dfrac{i\\sqrt{3}}{2}$, then the value of $\\begin{vmatrix} 1 & 1 & 1 \\\\ 1 & -1-w^2 & w^2 \\\\ 1 & w^2 & w^4 \\end{vmatrix}$ is...", "image": null}, "options": [{"id": "bJQ4B", "label": "A", "text": "$3w(w+1)$", "isCorrect": false, "image": null}, {"id": "jVzgv", "label": "B", "text": "$3w(w-1)$", "isCorrect": true, "image": null}, {"id": "NQ2XS", "label": "C", "text": "$-3w(w-1)$", "isCorrect": false, "image": null}, {"id": "bPBn8", "label": "D", "text": "$-3w(w+1)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $w = -\\dfrac{1}{2} + \\dfrac{i\\sqrt{3}}{2}$, $w$ is a complex cube root of unity.<br><br>Thus, $w^3 = 1$ and $1 + w + w^2 = 0$.<br><br>From this, we have $-1 - w^2 = w$ and $w^4 = w^3 \\cdot w = w$.<br><br>Substituting these into the given determinant:<br><br>$\\Delta = \\begin{vmatrix} 1 & 1 & 1 \\\\\\\\ 1 & w & w^2 \\\\\\\\ 1 & w^2 & w \\end{vmatrix}$<br><br>Applying the column operation $C_1 \\rightarrow C_1 + C_2 + C_3$, we get:<br><br>$\\Delta = \\begin{vmatrix} 3 & 1 & 1 \\\\\\\\ 1+w+w^2 & w & w^2 \\\\\\\\ 1+w^2+w & w^2 & w \\end{vmatrix}$<br><br>Since $1 + w + w^2 = 0$, this simplifies to:<br><br>$\\Delta = \\begin{vmatrix} 3 & 1 & 1 \\\\\\\\ 0 & w & w^2 \\\\\\\\ 0 & w^2 & w \\end{vmatrix}$<br><br>Expanding along the first column:<br><br>$\\Delta = 3(w^2 - w^4)$<br><br>Since $w^4 = w$, we get:<br><br>$\\Delta = 3(w^2 - w) = 3w(w - 1)$<br><br>Answer: $3w(w-1)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885515a9fc0fc8c142b7", "type": "singleCorrect", "question": {"text": "If $\\omega$ is a complex cube root of unity, then the value of the expression $(1 - \\omega + \\omega^2)^7 + (1 + \\omega - \\omega^2)^7$ is equal to...", "image": null}, "options": [{"id": "BkCOC", "label": "A", "text": "$128$", "isCorrect": true, "image": null}, {"id": "Vmljv", "label": "B", "text": "$-128$", "isCorrect": false, "image": null}, {"id": "1Sl6o", "label": "C", "text": "$128\\omega$", "isCorrect": false, "image": null}, {"id": "mkkgn", "label": "D", "text": "$0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $\\omega$ is a complex cube root of unity, $1 + \\omega + \\omega^2 = 0$ and $\\omega^3 = 1$.<br><br>From this, we have $1 + \\omega^2 = -\\omega$ and $1 + \\omega = -\\omega^2$.<br><br>Substituting these into the given expression:<br><br>$(1 - \\omega + \\omega^2)^7 + (1 + \\omega - \\omega^2)^7 = (-\\omega - \\omega)^7 + (-\\omega^2 - \\omega^2)^7$<br><br>$= (-2\\omega)^7 + (-2\\omega^2)^7$<br><br>$= -128\\omega^7 - 128\\omega^{14}$<br><br>Using $\\omega^3 = 1$, we get $\\omega^7 = (\\omega^3)^2 \\cdot \\omega = \\omega$ and $\\omega^{14} = (\\omega^3)^4 \\cdot \\omega^2 = \\omega^2$.<br><br>The expression becomes:<br><br>$= -128\\omega - 128\\omega^2$<br><br>$= -128(\\omega + \\omega^2)$<br><br>Since $\\omega + \\omega^2 = -1$, we get:<br><br>$= -128(-1) = 128$<br><br>Answer: $128$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3568c30a4553e1be2a5", "type": "singleCorrect", "question": {"text": "If $w$ is a complex cube root of unity , then the value of $w^{10} - w^7 + w^5 - w^2 + 1$ is.", "image": null}, "options": [{"id": "GATGA", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "ETgsA", "label": "B", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "RWgqW", "label": "C", "text": "$1$", "isCorrect": true, "image": null}, {"id": "DWGFi", "label": "D", "text": "$w$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $w$ is a complex cube root of unity, $w^3 = 1$ and $1 + w + w^2 = 0$.<br><br>Simplifying each term using $w^3 = 1$:<br><br>$w^{10} = (w^3)^3 \\cdot w = 1 \\cdot w = w$<br><br>$w^7 = (w^3)^2 \\cdot w = 1 \\cdot w = w$<br><br>$w^5 = w^3 \\cdot w^2 = 1 \\cdot w^2 = w^2$<br><br>Substituting these values into the given expression:<br><br>$w^{10} - w^7 + w^5 - w^2 + 1 = w - w + w^2 - w^2 + 1$<br><br>$= 0 + 0 + 1 = 1$<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0e3", "type": "singleCorrect", "question": {"text": "The value of $\\left(\\dfrac{-1+i\\sqrt{3}}{2}\\right)^{18} + \\left(\\dfrac{-1-i\\sqrt{3}}{2}\\right)^{18}$ is", "image": null}, "options": [{"id": "755Zv", "label": "A", "text": "$2$", "isCorrect": true, "image": null}, {"id": "sjh5W", "label": "B", "text": "$35$", "isCorrect": false, "image": null}, {"id": "9W6IO", "label": "C", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "7FnvN", "label": "D", "text": "$\\dfrac{\\sqrt{3}}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\omega = \\dfrac{-1+i\\sqrt{3}}{2}$ and $\\omega^2 = \\dfrac{-1-i\\sqrt{3}}{2}$ be the complex cube roots of unity.<br><br>The given expression can be written as $\\omega^{18} + (\\omega^2)^{18}$.<br><br>Since $\\omega^3 = 1$, we have $\\omega^{18} = (\\omega^3)^6 = 1^6 = 1$.<br><br>Similarly, $(\\omega^2)^{18} = \\omega^{36} = (\\omega^3)^{12} = 1^{12} = 1$.<br><br>Therefore, the value of the expression is $1 + 1 = 2$.<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c98c30a4553e1bdcc9", "type": "singleCorrect", "question": {"text": "If $\\alpha$ and $\\beta$ are the distinct roots of the equation $x^2 - x + 1 = 0$, then the value of $\\alpha^{200} + \\beta^{206} + 2$ is equal to", "image": null}, "options": [{"id": "rMM43", "label": "A", "text": "$1$", "isCorrect": true, "image": null}, {"id": "sPEcA", "label": "B", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "QhfAM", "label": "C", "text": "$0$", "isCorrect": false, "image": null}, {"id": "vNnhY", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation: $x^2 - x + 1 = 0$<br><br>Multiplying both sides by $(x + 1)$, we get:<br><br>$(x + 1)(x^2 - x + 1) = 0$<br><br>$x^3 + 1 = 0 \\Rightarrow x^3 = -1$<br><br>Since $\\alpha$ and $\\beta$ are roots of $x^2 - x + 1 = 0$, they satisfy the equation $x^3 = -1$.<br><br>Therefore, $\\alpha^3 = -1$ and $\\beta^3 = -1$.<br><br>Now, evaluating the given expression $\\alpha^{200} + \\beta^{206} + 2$ :<br><br>$\\alpha^{200} = (\\alpha^3)^{66} \\cdot \\alpha^2 = (-1)^{66} \\cdot \\alpha^2 = \\alpha^2$<br><br>$\\beta^{206} = (\\beta^3)^{68} \\cdot \\beta^2 = (-1)^{68} \\cdot \\beta^2 = \\beta^2$<br><br>Substituting these values, the expression becomes $\\alpha^2 + \\beta^2 + 2$.<br><br>From the given quadratic equation, the sum of roots $\\alpha + \\beta = 1$ and the product of roots $\\alpha \\beta = 1$.<br><br>Using the identity $\\alpha^2 + \\beta^2 = (\\alpha + \\beta)^2 - 2\\alpha\\beta$ :<br><br>$\\alpha^2 + \\beta^2 = (1)^2 - 2(1) = -1$<br><br>Therefore, $\\alpha^{200} + \\beta^{206} + 2 = -1 + 2 = 1$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e58c30a4553e1bddfa", "type": "singleCorrect", "question": {"text": "If $\\omega$ is a complex cube root of unity, then the value of $\\sin\\left[\\pi(\\omega^{10} + \\omega^{23}) - \\dfrac{\\pi}{4}\\right] =$", "image": null}, "options": [{"id": "fti5f", "label": "A", "text": "$-\\dfrac{\\sqrt{3}}{2}$", "isCorrect": false, "image": null}, {"id": "p2u9G", "label": "B", "text": "$-\\dfrac{1}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "WNip0", "label": "C", "text": "$\\dfrac{1}{\\sqrt{2}}$", "isCorrect": true, "image": null}, {"id": "uV1Yu", "label": "D", "text": "$\\dfrac{\\sqrt{3}}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $\\omega$ is a complex cube root of unity, $\\omega^3 = 1$ and $1 + \\omega + \\omega^2 = 0$.<br><br>$\\omega^{10} = (\\omega^3)^3 \\cdot \\omega = \\omega$<br><br>$\\omega^{23} = (\\omega^3)^7 \\cdot \\omega^2 = \\omega^2$<br><br>$\\omega^{10} + \\omega^{23} = \\omega + \\omega^2 = -1$<br><br>Substituting this into the given expression:<br><br>$\\sin\\left[\\pi(\\omega^{10} + \\omega^{23}) - \\dfrac{\\pi}{4}\\right] = \\sin\\left(-\\pi - \\dfrac{\\pi}{4}\\right)$<br><br>$= \\sin\\left(-\\dfrac{5\\pi}{4}\\right)$<br><br>$= -\\sin\\left(\\pi + \\dfrac{\\pi}{4}\\right)$<br><br>$= -\\left(-\\sin\\dfrac{\\pi}{4}\\right)$<br><br>$= \\dfrac{1}{\\sqrt{2}}$<br><br>Answer: $\\dfrac{1}{\\sqrt{2}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31d8c30a4553e1be04d", "type": "singleCorrect", "question": {"text": "If $\\omega$ is a complex cube root of unity, then the value of the expression $2\\left(1+\\dfrac{1}{\\omega}\\right)\\left(1+\\dfrac{1}{\\omega^2}\\right) + 3\\left(2+\\dfrac{1}{\\omega}\\right)\\left(2+\\dfrac{1}{\\omega^2}\\right) + \\ldots + (n+1)\\left(n+\\dfrac{1}{\\omega}\\right)\\left(n+\\dfrac{1}{\\omega^2}\\right)$ is...", "image": null}, "options": [{"id": "PsqoZ", "label": "A", "text": "$\\left[\\dfrac{n(n+1)}{2}\\right]^2 + n$", "isCorrect": true, "image": null}, {"id": "iR9QZ", "label": "B", "text": "$\\left[\\dfrac{n(n+1)}{2}\\right]^2 - n$", "isCorrect": false, "image": null}, {"id": "2EgQ6", "label": "C", "text": "$\\left[\\dfrac{n(n+1)}{2}\\right]^2$", "isCorrect": false, "image": null}, {"id": "klP9i", "label": "D", "text": "$\\left[\\dfrac{n(n-1)}{2}\\right]^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The general term of the given series is $T_k = (k+1)\\left(k+\\dfrac{1}{\\omega}\\right)\\left(k+\\dfrac{1}{\\omega^2}\\right)$.<br><br>Since $\\omega^3 = 1$, we have $\\dfrac{1}{\\omega} = \\omega^2$ and $\\dfrac{1}{\\omega^2} = \\omega$.<br><br>$T_k = (k+1)(k+\\omega^2)(k+\\omega)$<br><br>$T_k = (k+1)(k^2 + k(\\omega+\\omega^2) + \\omega^3)$<br><br>Using $1+\\omega+\\omega^2 = 0 \\Rightarrow \\omega+\\omega^2 = -1$ and $\\omega^3 = 1$, we get:<br><br>$T_k = (k+1)(k^2 - k + 1)$<br><br>$T_k = k^3 + 1$<br><br>The sum of the series up to $n$ terms is:<br><br>$S_n = \\sum_{k=1}^n T_k = \\sum_{k=1}^n (k^3 + 1)$<br><br>$S_n = \\sum_{k=1}^n k^3 + \\sum_{k=1}^n 1$<br><br>$S_n = \\left[\\dfrac{n(n+1)}{2}\\right]^2 + n$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29f8c30a4553e1bdb07", "type": "singleCorrect", "question": {"text": "If $x = \\sqrt{-1-\\sqrt{-1-\\sqrt{-1-\\ldots\\infty}}}$, where $\\omega$ is a non-real complex cube root of unity, then the value of $x$ is...", "image": null}, "options": [{"id": "OltmM", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "aS2DZ", "label": "B", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "9lQGd", "label": "C", "text": "$-\\omega$", "isCorrect": false, "image": null}, {"id": "ULXl5", "label": "D", "text": "$\\omega^2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $x = \\sqrt{-1-\\sqrt{-1-\\sqrt{-1-\\ldots\\infty}}}$<br><br>Squaring both sides, we get:<br><br>$x^2 = -1 - \\sqrt{-1-\\sqrt{-1-\\ldots\\infty}}$<br><br>$x^2 = -1 - x$<br><br>$x^2 + x + 1 = 0$<br><br>Solving this quadratic equation, we get:<br><br>$x = \\dfrac{-1 \\pm \\sqrt{1 - 4}}{2} = \\dfrac{-1 \\pm i\\sqrt{3}}{2}$<br><br>Thus, $x = \\omega$ or $x = \\omega^2$, where $\\omega$ is a non-real complex cube root of unity.<br><br>Among the given options, $\\omega^2$ is the correct choice.<br><br>Answer: $\\omega^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3648c30a4553e1be33b", "type": "singleCorrect", "question": {"text": "If $\\alpha$ and $\\beta$ are the roots of the equation $x^2 + x + 1 = 0$ then $\\alpha^{2026} + \\beta^{2026} = $", "image": null}, "options": [{"id": "H9eK6", "label": "A", "text": "$-1$", "isCorrect": true, "image": null}, {"id": "lseDL", "label": "B", "text": "$0$", "isCorrect": false, "image": null}, {"id": "W4Hw6", "label": "C", "text": "$1$", "isCorrect": false, "image": null}, {"id": "4hJ3B", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The roots of the equation $x^2 + x + 1 = 0$ are the complex cube roots of unity, $\\omega$ and $\\omega^2$.<br><br>Let $\\alpha = \\omega$ and $\\beta = \\omega^2$.<br><br>Substituting the values of $\\alpha$ and $\\beta$ into the given expression gives $\\omega^{2026} + (\\omega^2)^{2026} = \\omega^{2026} + \\omega^{4052}$.<br><br>Since $\\omega^3 = 1$, dividing the exponents by $3$ yields the remainders.<br><br>$2026 = 3 \\times 675 + 1 \\Rightarrow \\omega^{2026} = \\omega$<br><br>$4052 = 3 \\times 1350 + 2 \\Rightarrow \\omega^{4052} = \\omega^2$<br><br>Therefore, $\\alpha^{2026} + \\beta^{2026} = \\omega + \\omega^2$.<br><br>Using the property $1 + \\omega + \\omega^2 = 0$, we get $\\omega + \\omega^2 = -1$.<br><br>Thus, $\\alpha^{2026} + \\beta^{2026} = -1$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c02bf9280d7f9932e78", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The area of the triangle whose vertices are $i, \\omega$ and $\\omega^2$ is (Where $\\omega$ is a complex cube root of unity other than $1, \\mathrm{i}$ is an imaginary number) ______ sq.units", "image": null}, "options": [{"id": "EjQV9", "text": "$\\frac{3 \\sqrt{3}}{4}$", "image": null, "isCorrect": false}, {"id": "c1DVV", "text": "$\\frac{\\sqrt{3}}{2}$", "image": null, "isCorrect": false}, {"id": "9mEDa", "text": "$\\frac{3 \\sqrt{3}}{2}$", "image": null, "isCorrect": false}, {"id": "MzKxl", "text": "$\\frac{\\sqrt{3}}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The vertices of the triangle in the complex plane are $z_1 = i$, $z_2 = \\omega$, and $z_3 = \\omega^2$.<br><br>The coordinates of these vertices are:<br>$z_1 = (0, 1)$<br>$z_2 = \\left(-\\dfrac{1}{2}, \\dfrac{\\sqrt{3}}{2}\\right)$<br>$z_3 = \\left(-\\dfrac{1}{2}, -\\dfrac{\\sqrt{3}}{2}\\right)$<br><br>The base of the triangle is the distance between $z_2$ and $z_3$:<br>$\\text{Base} = |z_2 - z_3| = |\\omega - \\omega^2| = \\left| i\\sqrt{3} \\right| = \\sqrt{3}$<br><br>The line joining $z_2$ and $z_3$ is vertical and has the equation $x = -\\dfrac{1}{2}$.<br><br>The height of the triangle is the perpendicular distance from $z_1(0, 1)$ to the line $x = -\\dfrac{1}{2}$:<br>$\\text{Height} = \\left| 0 - \\left(-\\dfrac{1}{2}\\right) \\right| = \\dfrac{1}{2}$<br><br>The area of the triangle is:<br>$\\text{Area} = \\dfrac{1}{2} \\times \\text{Base} \\times \\text{Height} = \\dfrac{1}{2} \\times \\sqrt{3} \\times \\dfrac{1}{2} = \\dfrac{\\sqrt{3}}{4}$ sq. units.<br><br>Answer: $\\frac{\\sqrt{3}}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ca0aee93fa0796db86", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "If $\\mathrm{w}=\\dfrac{-1+\\mathrm{i} \\sqrt{3}}{2}$, where $\\mathrm{i}=\\sqrt{-1}$, then the value of $\\left(3+w+3 w^2\\right)^4$ is", "image": null}, "options": [{"id": "EPaAv", "text": "16", "image": null, "isCorrect": false}, {"id": "dDj0S", "text": "-16", "image": null, "isCorrect": false}, {"id": "KoRhs", "text": "16 w", "image": null, "isCorrect": true}, {"id": "N6uZH", "text": "$16 w^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $w = \\dfrac{-1+\\mathrm{i} \\sqrt{3}}{2}$, which is the complex cube root of unity.<br><br>We know the properties of the cube root of unity: $1 + w + w^2 = 0$ and $w^3 = 1$.<br><br>Consider the expression $(3 + w + 3w^2)^4$.<br><br>Rearranging the terms inside the bracket:<br><br>$3 + w + 3w^2 = 3(1 + w^2) + w$<br><br>Using $1 + w^2 = -w$, we get:<br><br>$3(-w) + w = -3w + w = -2w$<br><br>Now, substitute this back into the given expression:<br><br>$(-2w)^4 = 16w^4$<br><br>Since $w^3 = 1$, we have $w^4 = w^3 \\cdot w = 1 \\cdot w = w$.<br><br>Therefore, the value is $16w$.<br><br>Answer: 16 w", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136b0aee93fa0796d8a7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "If $z^2+z+1=0$ then $\\left(z^3+\\dfrac{1}{z^3}\\right)^2+\\left(z^4+\\dfrac{1}{z^4}\\right)^2=$ where $\\mathrm{z}=\\mathrm{w}=$ complex cube root of unity", "image": null}, "options": [{"id": "EZwoz", "text": "4", "image": null, "isCorrect": false}, {"id": "SrQLi", "text": "1", "image": null, "isCorrect": false}, {"id": "eTEqi", "text": "5", "image": null, "isCorrect": true}, {"id": "Zn817", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $z^2+z+1=0$, the roots are the complex cube roots of unity, so $z = \\omega$ or $z = \\omega^2$.<br><br>We know that $\\omega^3 = 1$ and $1 + \\omega + \\omega^2 = 0$.<br><br>For $z = \\omega$, the first term is $z^3 + \\dfrac{1}{z^3} = \\omega^3 + \\dfrac{1}{\\omega^3} = 1 + 1 = 2$.<br><br>The second term is $z^4 + \\dfrac{1}{z^4} = \\omega^4 + \\dfrac{1}{\\omega^4}$.<br><br>Since $\\omega^3 = 1$, we have $\\omega^4 = \\omega$.<br><br>Thus, $\\omega^4 + \\dfrac{1}{\\omega^4} = \\omega + \\dfrac{1}{\\omega} = \\omega + \\omega^2$.<br><br>Using $1 + \\omega + \\omega^2 = 0$, we get $\\omega + \\omega^2 = -1$.<br><br>Substituting these values into the given expression:<br><br>$\\left(z^3+\\dfrac{1}{z^3}\\right)^2+\\left(z^4+\\dfrac{1}{z^4}\\right)^2 = (2)^2 + (-1)^2 = 4 + 1 = 5$.<br><br>Answer: 5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262050279619d9d8a3129", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Let $\\omega \\neq 1$ be a cube root of unity and $S$ be the set of all non-singular matrices of the form $\\left[\\begin{array}{ccc}1 & a & b \\\\ \\omega & 1 & c \\\\ \\omega^2 & \\omega & 1\\end{array}\\right]$ where each of $a, b$ and $c$ is either $\\omega$ or $\\omega^2$, then the number of distinct matrices in the set $\\mathrm{S}$ is", "image": null}, "options": [{"id": "QImmm", "text": "$2$", "image": null, "isCorrect": true}, {"id": "yJ4mv", "text": "$6$", "image": null, "isCorrect": false}, {"id": "NOiZM", "text": "$4$", "image": null, "isCorrect": false}, {"id": "VzKi2", "text": "$8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $A=\\left[\\begin{array}{ccc}1 & a & b \\\\ \\omega & 1 & c \\\\ \\omega^2 & \\omega & 1\\end{array}\\right]$ For non-singular matrix\n$$\n\\begin{aligned}\n& |\\mathrm{A}| \\neq 0 \\\\\n& \\Rightarrow\\left|\\begin{array}{ccc}\n1 & \\mathrm{a} & \\mathrm{b} \\\\\n\\omega & 1 & \\mathrm{c} \\\\\n\\omega^2 & \\omega & 1\n\\end{array}\\right| \\neq 0\n\\end{aligned}\n$$\n$$\n\\begin{aligned}\n& \\Rightarrow 1(1-\\omega c)-a\\left(\\omega-\\omega^2 c\\right)+b(0) \\neq 0 \\\\\n& \\Rightarrow 1(1-\\omega c)-a \\omega(1-\\omega c) \\neq 0 \\\\\n& \\Rightarrow(1-\\omega c)(1-a \\omega) \\neq 0 \\\\\n& \\Rightarrow c \\neq \\frac{1}{\\omega} \\text { and } a \\neq \\frac{1}{\\omega} \\\\\n& \\Rightarrow c \\neq \\omega^2 \\text { and } a \\neq \\omega^2 \\quad \\ldots\\left[\\because \\omega^3=1\\right]\n\\end{aligned}\n$$\n\nSo possible value of a and $\\mathrm{c}$ is $\\omega$ only and $\\mathrm{b}$ can take values $\\omega$ or $\\omega^2$.\n$\\therefore \\quad$ The possible number of distinct matrices $=2$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2618f0279619d9d8a2d8c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "If $\\alpha$ and $\\beta$ are the complex cube roots of unity, then $\\alpha^3+\\beta^3+\\alpha^{-2} \\times \\beta^{-2}$ is equal to", "image": null}, "options": [{"id": "3eTsq", "text": "$1$", "image": null, "isCorrect": false}, {"id": "iJqp8", "text": "$-3$", "image": null, "isCorrect": false}, {"id": "TwI9I", "text": "$3$", "image": null, "isCorrect": true}, {"id": "8668f", "text": "$0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\alpha^3+\\beta^3+\\alpha^{-2} \\cdot \\beta^{-2}=\\alpha^3+\\beta^3+\\frac{1}{\\alpha^2 \\beta^2} \\\\ & =\\omega^3+\\omega^6+\\frac{1}{\\omega^2 \\omega^4}=1+1+1=3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261460279619d9d8a2b3a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "If $\\alpha$ and $\\beta$ are imaginary cube roots of units then value of $\\alpha^4+\\beta^{28}+\\frac{1}{\\alpha \\beta}$ is", "image": null}, "options": [{"id": "KIR3J", "text": "$1$", "image": null, "isCorrect": false}, {"id": "ITwuI", "text": "$0$", "image": null, "isCorrect": true}, {"id": "GXQ6k", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "mWZeF", "text": "$2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\alpha=\\omega, \\beta=\\omega^2$\nNow $\\alpha^4+\\beta^{28}+\\frac{1}{\\alpha \\beta}$\n$\\begin{aligned} & =\\omega^4+\\left(\\omega^2\\right)^{28}+\\frac{1}{\\omega \\omega^2} \\\\ & =\\omega^4+\\omega^{56}+\\frac{1}{\\omega^3} \\\\ & =\\omega+\\omega^2+\\frac{1}{1} \\\\ & \\left.=0 \\quad \\quad \\quad \\text { [as } \\omega^3=1\\right]\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608c0279619d9d8a2561", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "If $\\omega$ is the complex cube root of unity, the\n$$\n\\left(3+5 \\omega+3 \\omega^2\\right)^2+\\left(3+3 \\omega+5 \\omega^2\\right)^2=\n$$", "image": null}, "options": [{"id": "z8uir", "text": "-1", "image": null, "isCorrect": false}, {"id": "BDbp7", "text": "0", "image": null, "isCorrect": false}, {"id": "7AdaD", "text": "4", "image": null, "isCorrect": false}, {"id": "WcP9d", "text": "-4", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\left(3+5 \\omega+3 \\omega^2\\right)^2+\\left(3+3 \\omega+5 \\omega^2\\right)^2 \\\\ & =\\left(3+3 \\omega+3 \\omega^2+2 \\omega\\right)^2+\\left(3+3 \\omega+3 \\omega^2+2 \\omega^2\\right)^2 \\\\ & =\\left[3\\left(1+\\omega+\\omega^2\\right)+2 \\omega\\right]^2+\\left[3\\left(1+\\omega+\\omega^2\\right)+2 \\omega^2\\right]^2 \\\\ & =(3(0)+2 \\omega)^2+\\left[3(0)+2 \\omega^2\\right]^2=4 \\omega^2+4 \\omega^4 \\\\ & =4 \\omega^2\\left(1+\\omega^2\\right)=4 \\omega^2(-\\omega) \\\\ & =-4 \\omega^2=-4\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260430279619d9d8a230e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "If $\\omega$ is complex cube root of unity and $(1+\\omega)^7=\\mathrm{A}+\\mathrm{B} \\omega$, then values of A and B are, respectively.", "image": null}, "options": [{"id": "xxGiY", "text": "0,1", "image": null, "isCorrect": false}, {"id": "SIhtU", "text": "1,0", "image": null, "isCorrect": false}, {"id": "eEggB", "text": "1,1", "image": null, "isCorrect": true}, {"id": "763I6", "text": "$-1,1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & (1+\\omega)^7=\\mathrm{A}+\\mathrm{B} \\omega \\\\ & \\therefore \\mathrm{A}+\\mathrm{B} \\omega=\\left(-\\omega^2\\right)^7 \\quad \\ldots\\left(\\because 1+\\omega+\\omega^2=0\\right] \\\\ & =(-1) \\omega^{14}=-\\omega^{12} \\omega^2=-\\omega^2=(1+\\omega) \\\\ & \\therefore A=1, B=1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "65a2634a0279619d9d8a3de0", "title": "Locus Based on Distance Formula", "totalQuestions": 6, "questions": [{"_id": "6abb88a515a9fc0fc8c145a5", "type": "singleCorrect", "question": {"text": "If $|z - 5i| = |z + 3|$, where $z$ is a complex number, then the equation of the locus of $z$ in Cartesian coordinates is ...", "image": null}, "options": [{"id": "Ojg1M", "label": "A", "text": "$3x + 5y - 8 = 0$", "isCorrect": true, "image": null}, {"id": "2XsWJ", "label": "B", "text": "$3x - 5y - 8 = 0$", "isCorrect": false, "image": null}, {"id": "VcAnk", "label": "C", "text": "$-3x + 5y - 8 = 0$", "isCorrect": false, "image": null}, {"id": "RToS4", "label": "D", "text": "$3x + 5y + 8 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $z = x + iy$.<br><br>Substituting $z$ in the given equation $|z - 5i| = |z + 3|$, we get:<br><br>$|x + iy - 5i| = |x + iy + 3|$<br><br>$|x + i(y - 5)| = |(x + 3) + iy|$<br><br>Squaring both sides:<br><br>$x^2 + (y - 5)^2 = (x + 3)^2 + y^2$<br><br>$x^2 + y^2 - 10y + 25 = x^2 + 6x + 9 + y^2$<br><br>$-10y + 25 = 6x + 9$<br><br>$6x + 10y - 16 = 0$<br><br>Dividing by $2$, we get the locus of $z$ as:<br><br>$3x + 5y - 8 = 0$<br><br>Answer: $3x + 5y - 8 = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b71bf9280d7f9932949", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{z}=x+$ iy is a complex number, then the equation $\\left|\\frac{\\mathrm{z}+i}{\\mathrm{z}-i}\\right|=\\sqrt{3}$ represents the", "image": null}, "options": [{"id": "jZwmT", "text": "circle with centre $(2,0)$ and radius $\\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "LRUwF", "text": "circle with centre $(0,2)$ and radius $\\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "43YRM", "text": "circle with centre $(0,0)$ and radius $\\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "WoFkF", "text": "circle with centre $(0,-2)$ and radius $\\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $\\left|\\dfrac{z+i}{z-i}\\right| = \\sqrt{3}$<br><br>Substituting $z = x + iy$:<br><br>$\\left|\\dfrac{x + i(y+1)}{x + i(y-1)}\\right| = \\sqrt{3}$<br><br>$|x + i(y+1)|^2 = 3|x + i(y-1)|^2$<br><br>$x^2 + (y+1)^2 = 3[x^2 + (y-1)^2]$<br><br>$x^2 + y^2 + 2y + 1 = 3(x^2 + y^2 - 2y + 1)$<br><br>$2x^2 + 2y^2 - 8y + 2 = 0$<br><br>$x^2 + y^2 - 4y + 1 = 0$<br><br>$x^2 + (y-2)^2 = 3$<br><br>This represents a circle with centre $(0, 2)$ and radius $\\sqrt{3}$.<br><br>Answer: circle with centre $(0,2)$ and radius $\\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5ebf9280d7f99328a0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The locus of the points represented by $|z+3|-|z-3|=6$, where $z$ is a complex number, is ....", "image": null}, "options": [{"id": "JfIhN", "text": "Circle with radius 1 unit", "image": null, "isCorrect": false}, {"id": "p6gf7", "text": "Straight line with slope 1.", "image": null, "isCorrect": false}, {"id": "SKFqC", "text": "Parabola with focus $(1,0)$", "image": null, "isCorrect": false}, {"id": "jihCY", "text": "A ray on the X-axis", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $z = x + iy$.<br><br>The given equation is $|z+3| - |z-3| = 6$.<br><br>This represents the difference of distances of a point $P(z)$ from two fixed points $A(-3, 0)$ and $B(3, 0)$.<br><br>The distance between $A$ and $B$ is $AB = |3 - (-3)| = 6$.<br><br>The given equation can be written as $PA - PB = AB$.<br><br>This condition is satisfied if and only if the points $P, B, A$ are collinear and $B$ lies between $P$ and $A$.<br><br>Since $A$ is at $(-3, 0)$ and $B$ is at $(3, 0)$, $P$ must lie on the X-axis to the right of $B(3, 0)$.<br><br>Therefore, the locus of $z$ is a ray on the X-axis starting from $(3, 0)$ and extending towards positive infinity.<br><br>Answer: A ray on the X-axis", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2dbf9280d7f99326ea", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation $|z+1-i|=|z-1+i|$ represents a (where $z$ is a complex number)", "image": null}, "options": [{"id": "RxyNX", "text": "Straight line passing through the origin and the first and third quadrant.", "image": null, "isCorrect": true}, {"id": "NgbqA", "text": "Straight line passing through the origin and the second and fourth quadrant.", "image": null, "isCorrect": false}, {"id": "HyYEx", "text": "Straight line passing through the point $(1,-1)$ and having slope -1 .", "image": null, "isCorrect": false}, {"id": "qmTHQ", "text": "Straight line passing through the point $(2,1)$ and having slope $\\frac{1}{2}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $z = x + iy$.<br><br>The given equation is $|z+1-i|=|z-1+i|$.<br><br>Substituting $z = x + iy$, we get:<br><br>$|x + iy + 1 - i| = |x + iy - 1 + i|$<br><br>$|(x + 1) + i(y - 1)| = |(x - 1) + i(y + 1)|$<br><br>Squaring both sides, we get:<br><br>$(x + 1)^2 + (y - 1)^2 = (x - 1)^2 + (y + 1)^2$<br><br>$x^2 + 2x + 1 + y^2 - 2y + 1 = x^2 - 2x + 1 + y^2 + 2y + 1$<br><br>$2x - 2y = -2x + 2y$<br><br>$4x = 4y$<br><br>$y = x$<br><br>This represents a straight line passing through the origin with a slope of $1$. Since the slope is positive, the line passes through the first and third quadrants.<br><br>Answer: Straight line passing through the origin and the first and third quadrant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213420aee93fa0796d763", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "If $\\mathrm{P}(x, y)$ denotes $\\mathrm{z}=x+\\mathrm{i} y x, y \\in \\mathbb{R}$ and $\\mathrm{i}=\\sqrt{-1}$ in Argand's plane and $\\left|\\dfrac{z-1}{z+2 i}\\right|=1$, then the locus of $P$ is", "image": null}, "options": [{"id": "ZkM96", "text": "parabola", "image": null, "isCorrect": false}, {"id": "PDMHJ", "text": "hyperbola", "image": null, "isCorrect": false}, {"id": "dD5Gi", "text": "circle", "image": null, "isCorrect": false}, {"id": "3FXjo", "text": "straight line", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given the equation $\\left|\\dfrac{z-1}{z+2 i}\\right|=1$<br><br>This can be rewritten as $|z-1| = |z+2i|$<br><br>Let $z = x + iy$. Substituting this into the equation, we get:<br><br>$|x + iy - 1| = |x + iy + 2i|$<br><br>$|(x-1) + iy| = |x + i(y+2)|$<br><br>Squaring both sides:<br><br>$(x-1)^2 + y^2 = x^2 + (y+2)^2$<br><br>$x^2 - 2x + 1 + y^2 = x^2 + y^2 + 4y + 4$<br><br>$-2x + 1 = 4y + 4$<br><br>$2x + 4y + 3 = 0$<br><br>This is a linear equation in $x$ and $y$, which represents a straight line.<br><br>Alternatively, $|z-z_1| = |z-z_2|$ represents the perpendicular bisector of the line segment joining the points $z_1$ and $z_2$ in the Argand plane, which is always a straight line.<br><br>Answer: straight line", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b10279619d9d8a268a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "If $\\mathrm{z}=\\mathrm{x}+$ iy satisfies the condition $|\\mathrm{z}+1|=1$, then $\\mathrm{z}$ lies on the", "image": null}, "options": [{"id": "tw7aE", "text": "parabola with vertex $(0,0)$", "image": null, "isCorrect": false}, {"id": "7lla2", "text": "circle with centre $(-1,0)$ and radius 1", "image": null, "isCorrect": true}, {"id": "oZquW", "text": "circle with centre $(1,0)$ and radius 1", "image": null, "isCorrect": false}, {"id": "N1EsY", "text": "Y-axis", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{z}=\\mathrm{x}+$ iy and $|\\mathrm{z}+1|=1$\n$$\n\\begin{aligned}\n& \\therefore|(\\mathrm{x}+1)+\\mathrm{iy}|=1 \\\\\n& \\therefore \\sqrt{(\\mathrm{x}+1)^2+\\mathrm{y}^2}=1 \\Rightarrow(\\mathrm{x}+1)^2+\\mathrm{y}^2=1\n\\end{aligned}\n$$\nThis is an equation of a circle with centre $(-1,0)$ and radius 1 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "65a2634a0279619d9d8a3de1", "title": "Geometry of Complex Number", "totalQuestions": 8, "questions": [{"_id": "68871bbfbf9280d7f9932c16", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A particle $P$ starts from the point $Z_0=1+2 i$ where $i=\\sqrt{-1}$. It moves first horizontally away from the origin by 5 units and then vertically upwards parallel to positive $y$-axis by 3 units to reach a point $Z_1$. From $Z_1$ the particle moves $\\sqrt{2}$ units in the direction of vector $\\hat{i}+\\hat{j}$ and then it moves through an angle $\\frac{\\pi}{2}$ in anticlockwise direction on a circle with centre at origin to reach at point $Z_2$, then $Z_2=$", "image": null}, "options": [{"id": "VqiiB", "text": "$6+7 i$", "image": null, "isCorrect": false}, {"id": "JTYoy", "text": "$-7+6 i$", "image": null, "isCorrect": false}, {"id": "bpWom", "text": "$-6+7 i$", "image": null, "isCorrect": true}, {"id": "KYPt1", "text": "$7-6 i$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial position of the particle is $Z_0 = 1 + 2i$.<br><br>The particle moves horizontally away from the origin by 5 units. Since the real part of $Z_0$ is positive, moving away from the origin horizontally means moving in the positive real direction. The new position is $(1 + 5) + 2i = 6 + 2i$.<br><br>It then moves vertically upwards by 3 units. The new position is $Z_1 = 6 + (2 + 3)i = 6 + 5i$.<br><br>From $Z_1$, the particle moves $\\sqrt{2}$ units in the direction of the vector $\\hat{i} + \\hat{j}$. The unit vector in this direction is $\\dfrac{1 + i}{\\sqrt{2}}$.<br><br>The displacement is $\\sqrt{2} \\times \\dfrac{1 + i}{\\sqrt{2}} = 1 + i$.<br><br>The position after this displacement is $Z_1' = (6 + 5i) + (1 + i) = 7 + 6i$.<br><br>Finally, the particle moves through an angle $\\dfrac{\\pi}{2}$ in the anticlockwise direction on a circle with its centre at the origin. This corresponds to a rotation of the position vector by $\\dfrac{\\pi}{2}$ about the origin, which is equivalent to multiplying by $e^{i\\pi/2} = i$.<br><br>Therefore, $Z_2 = (7 + 6i) \\times i = 7i + 6i^2 = -6 + 7i$.<br><br>Answer: $-6+7 i$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1dbf9280d7f993265f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\frac{z-1}{2 z+1}$ is an imaginary number and if it represents a circle then its radius is", "image": null}, "options": [{"id": "xfhjb", "text": "$\\frac{9}{16}$ units", "image": null, "isCorrect": false}, {"id": "qfhZD", "text": "$\\frac{3}{4}$ units", "image": null, "isCorrect": true}, {"id": "rc9EJ", "text": "$\\frac{1}{4}$ units", "image": null, "isCorrect": false}, {"id": "Lt7e7", "text": "$\\frac{1}{2}$ units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $z = x + iy$.<br><br>The given complex number is $w = \\dfrac{z-1}{2z+1}$.<br><br>Substituting $z = x + iy$ into the expression:<br><br>$w = \\dfrac{x + iy - 1}{2(x + iy) + 1} = \\dfrac{(x-1) + iy}{(2x+1) + i(2y)}$<br><br>To find the real part, multiply the numerator and denominator by the complex conjugate of the denominator:<br><br>$w = \\dfrac{((x-1) + iy)((2x+1) - i(2y))}{(2x+1)^2 + (2y)^2}$<br><br>The real part of $w$ is:<br><br>$\\text{Re}(w) = \\dfrac{(x-1)(2x+1) + y(2y)}{(2x+1)^2 + 4y^2}$<br><br>Since $w$ is an imaginary number, its real part must be zero:<br><br>$(x-1)(2x+1) + 2y^2 = 0$<br><br>$2x^2 - x - 1 + 2y^2 = 0$<br><br>Dividing by $2$, we get the equation of the circle:<br><br>$x^2 + y^2 - \\dfrac{1}{2}x - \\dfrac{1}{2} = 0$<br><br>Comparing this with the general equation of a circle $x^2 + y^2 + 2gx + 2fy + c = 0$, we have:<br><br>$2g = -\\dfrac{1}{2} \\Rightarrow g = -\\dfrac{1}{4}$<br><br>$2f = 0 \\Rightarrow f = 0$<br><br>$c = -\\dfrac{1}{2}$<br><br>The radius of the circle is given by $r = \\sqrt{g^2 + f^2 - c}$:<br><br>$r = \\sqrt{\\left(-\\dfrac{1}{4}\\right)^2 + 0^2 - \\left(-\\dfrac{1}{2}\\right)}$<br><br>$r = \\sqrt{\\dfrac{1}{16} + \\dfrac{1}{2}} = \\sqrt{\\dfrac{1 + 8}{16}} = \\sqrt{\\dfrac{9}{16}} = \\dfrac{3}{4}$ units<br><
