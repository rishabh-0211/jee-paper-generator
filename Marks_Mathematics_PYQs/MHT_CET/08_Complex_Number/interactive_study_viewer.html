br>Answer: $\\frac{3}{4}$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143e0aee93fa0796df18", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Let $\\mathrm{z}=x+\\mathrm{i} y$ be a complex number, where $x$ and $y$ are integers and $\\mathrm{i}=\\sqrt{-1}$. Then the area of the rectangle whose vertices are the roots of the equation $z \\bar{z}^3+\\bar{z} z^3=350$ is", "image": null}, "options": [{"id": "AKw5B", "text": "48", "image": null, "isCorrect": true}, {"id": "3mDDT", "text": "32", "image": null, "isCorrect": false}, {"id": "AOhFb", "text": "40", "image": null, "isCorrect": false}, {"id": "uE6xt", "text": "80", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the equation $z \\bar{z}^3 + \\bar{z} z^3 = 350$<br><br>Factoring out $z \\bar{z}$, we get:<br><br>$z \\bar{z} (\\bar{z}^2 + z^2) = 350$<br><br>Let $z = x + \\mathrm{i}y$. Then $z \\bar{z} = x^2 + y^2$.<br><br>Also, $z^2 + \\bar{z}^2 = (x + \\mathrm{i}y)^2 + (x - \\mathrm{i}y)^2 = (x^2 - y^2 + 2\\mathrm{i}xy) + (x^2 - y^2 - 2\\mathrm{i}xy) = 2(x^2 - y^2)$<br><br>Substituting these into the equation:<br><br>$(x^2 + y^2) \\cdot 2(x^2 - y^2) = 350$<br><br>$(x^2 + y^2)(x^2 - y^2) = 175$<br><br>Since $x$ and $y$ are integers, $x^2 + y^2$ and $x^2 - y^2$ must be integer factors of $175$. Also, $x^2 + y^2 \\geq x^2 - y^2$ and both are positive.<br><br>The factor pairs of $175$ are $(175, 1)$, $(35, 5)$, and $(25, 7)$.<br><br>Checking the pairs for $(x^2 + y^2, x^2 - y^2)$:<br><br>If $x^2 + y^2 = 175$ and $x^2 - y^2 = 1$, adding them gives $2x^2 = 176 \\Rightarrow x^2 = 88$ (not a perfect square).<br><br>If $x^2 + y^2 = 35$ and $x^2 - y^2 = 5$, adding them gives $2x^2 = 40 \\Rightarrow x^2 = 20$ (not a perfect square).<br><br>If $x^2 + y^2 = 25$ and $x^2 - y^2 = 7$, adding them gives $2x^2 = 32 \\Rightarrow x^2 = 16$.<br><br>Substituting $x^2 = 16$ into $x^2 + y^2 = 25$ gives $y^2 = 9$.<br><br>Since $x^2 = 16$ and $y^2 = 9$, we have $x = \\pm 4$ and $y = \\pm 3$.<br><br>The roots of the equation are the four vertices of a rectangle in the complex plane: $(4, 3)$, $(-4, 3)$, $(-4, -3)$, and $(4, -3)$.<br><br>The length of the rectangle is $4 - (-4) = 8$.<br><br>The width of the rectangle is $3 - (-3) = 6$.<br><br>The area of the rectangle is $8 \\times 6 = 48$.<br><br>Answer: 48", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214270aee93fa0796de68", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "If the complex number $\\mathrm{z}=x+\\mathrm{i} y$, where $\\mathrm{i}=\\sqrt{-1}$, satisfies the condition $|z+1|=1$, then $z$ lies on", "image": null}, "options": [{"id": "bfd6J", "text": "X -axis.", "image": null, "isCorrect": false}, {"id": "6bNJY", "text": "circle with centre $(1,0)$ and radius 1 unit.", "image": null, "isCorrect": false}, {"id": "I4Cc1", "text": "circle with centre $(-1,0)$ and radius 1 unit.", "image": null, "isCorrect": true}, {"id": "b79bK", "text": "Y-axis.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the condition $|z+1|=1$.<br><br>Substituting $z = x + \\mathrm{i}y$, we get:<br><br>$|x + \\mathrm{i}y + 1| = 1$<br><br>$|(x + 1) + \\mathrm{i}y| = 1$<br><br>Using the definition of the modulus of a complex number, we have:<br><br>$\\sqrt{(x + 1)^2 + y^2} = 1$<br><br>Squaring both sides gives:<br><br>$(x + 1)^2 + y^2 = 1$<br><br>This represents the equation of a circle in the form $(x - h)^2 + (y - k)^2 = r^2$, where $(h, k)$ is the centre and $r$ is the radius.<br><br>Comparing the equations, we get the centre as $(-1, 0)$ and the radius as $1$ unit.<br><br>Therefore, $z$ lies on a circle with centre $(-1, 0)$ and radius $1$ unit.<br><br>Answer: circle with centre $(-1,0)$ and radius 1 unit.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213910aee93fa0796d9c8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If $\\left|\\dfrac{\\mathrm{z}}{1+\\mathrm{i}}\\right|=2$, where $\\mathrm{z}=x+\\mathrm{i} y, \\mathrm{i}=\\sqrt{-1}$ represents a circle, then centre ' $C$ ' and radius ' $r$ ' of the circle are", "image": null}, "options": [{"id": "FUUT6", "text": "$\\mathrm{C} \\equiv(3,0), \\mathrm{r}=4$", "image": null, "isCorrect": false}, {"id": "qwBXg", "text": "$\\mathrm{C} \\equiv(6,0), \\mathrm{r}=2$", "image": null, "isCorrect": false}, {"id": "35vA4", "text": "$\\mathrm{C} \\equiv(0,3), \\mathrm{r}=8$", "image": null, "isCorrect": false}, {"id": "hFNE7", "text": "$\\mathrm{C} \\equiv(0,0), \\mathrm{r}=2 \\sqrt{2}$.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equation is $\\left|\\dfrac{z}{1+\\mathrm{i}}\\right| = 2$<br><br>Using the property of modulus, $\\left|\\dfrac{z_1}{z_2}\\right| = \\dfrac{|z_1|}{|z_2|}$<br><br>$\\dfrac{|z|}{|1+\\mathrm{i}|} = 2$<br><br>Since $|1+\\mathrm{i}| = \\sqrt{1^2 + 1^2} = \\sqrt{2}$<br><br>$\\dfrac{|z|}{\\sqrt{2}} = 2$<br><br>$|z| = 2\\sqrt{2}$<br><br>Substituting $z = x + \\mathrm{i}y$, we get $\\sqrt{x^2 + y^2} = 2\\sqrt{2}$<br><br>$x^2 + y^2 = 8$<br><br>This represents a circle with centre at $(0,0)$ and radius $2\\sqrt{2}$.<br><br>Therefore, $\\mathrm{C} \\equiv (0,0)$ and $\\mathrm{r} = 2\\sqrt{2}$.<br><br>Answer: $\\mathrm{C} \\equiv(0,0), \\mathrm{r}=2 \\sqrt{2}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623b0279619d9d8a32e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "If $|z-2+i| \\leq 2$, then the difference between the greatest and least value of $|z|$ is $(\\mathrm{i}=\\sqrt{-1})$", "image": null}, "options": [{"id": "xLBZP", "text": "$2 \\sqrt{5}+4$", "image": null, "isCorrect": false}, {"id": "UqxlT", "text": "$2 \\sqrt{5}$", "image": null, "isCorrect": false}, {"id": "ULTGw", "text": "$4$", "image": null, "isCorrect": true}, {"id": "miuiz", "text": "$8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Note that $\\left|z_1-z_2\\right| \\geq|| z_1|-| z_2||$\n$$\n\\begin{array}{ll}\n\\therefore \\quad & |z-2+i| \\leq 2 \\\\\n& \\Rightarrow|| z|-| 2-i|| \\leq 2 \\\\\n& \\Rightarrow-2 \\leq|z|-|2-i| \\leq 2\n\\end{array}\n$$\n$$\n\\begin{aligned}\n& \\Rightarrow-2 \\leq|z|-\\sqrt{4+1} \\leq 2 \\\\\n& \\Rightarrow-2 \\leq|z|-\\sqrt{5} \\leq 2 \\\\\n& \\Rightarrow \\sqrt{5}-2 \\leq|z| \\leq 2+\\sqrt{5}\n\\end{aligned}\n$$\n$\\Rightarrow$ Largest value of $|z|$ is ' $2+\\sqrt{5}$ ' and the least value is ' $\\sqrt{5}-2$ '\n$\\therefore \\quad$ Required difference $=2+\\sqrt{5}-(\\sqrt{5}-2)=4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261dc0279619d9d8a2fec", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "If $\\mathrm{w}=\\frac{\\mathrm{z}}{\\mathrm{z}-\\frac{1}{3} \\mathrm{i}}$ and $|\\mathrm{w}|=1, \\mathrm{i}=\\sqrt{-1}$, then $\\mathrm{z}$ lies on", "image": null}, "options": [{"id": "cXubm", "text": "circle.", "image": null, "isCorrect": false}, {"id": "q8Xx8", "text": "line.", "image": null, "isCorrect": true}, {"id": "peyjg", "text": "parabola.", "image": null, "isCorrect": false}, {"id": "T1vij", "text": "ellipse.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& w=\\frac{z}{z-\\frac{1}{3} i} \\\\\n& \\Rightarrow w=\\frac{3 z}{3 z-i}\n\\end{aligned}$\nApplying mod on both sides, we get\n$\\begin{aligned}\n& |w|=\\frac{3|z|}{|3 z-i|} \\\\\n& \\Rightarrow 3|z|=|3 z-i| \\quad \\ldots[|w|=1]\n\\end{aligned}$\nConsider $\\mathrm{z}=\\mathrm{a}+\\mathrm{ib}$\n$\\begin{aligned}\n& \\Rightarrow 3|a+i b|=|3 a+3 i b-i| \\\\\n& \\Rightarrow 3|a+i b|=|3 a+(3 b-1) i| \\\\\n& \\Rightarrow 3\\left(\\sqrt{a^2+b^2}\\right)=\\left(\\sqrt{9 a^2+(3 b-1)^2}\\right) \\\\\n& \\Rightarrow 9 a^2+9 b^2=9 a^2+9 b^2-6 b+1 \\\\\n& \\Rightarrow 6 b-1=0\n\\end{aligned}$\n$\\therefore \\quad$ The above equation represents a straight line.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c20279619d9d8a2717", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "If amplitude of $(z-2-3 i)$ is $\\frac{3 \\pi}{4}$, then locus of $z$ is (where $\\mathrm{z}=\\mathrm{x}+$ iy)", "image": null}, "options": [{"id": "g5DQG", "text": "$x+y=1$", "image": null, "isCorrect": false}, {"id": "F5RQB", "text": "$x+y=5$", "image": null, "isCorrect": true}, {"id": "ydEFL", "text": "$x-y=-5$", "image": null, "isCorrect": false}, {"id": "0yuEc", "text": "$x-y=1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Amplitude of $(z-2-3 i)$ is $\\frac{3 \\pi}{4}$ and we have $z=x+$ iy\n$\\therefore \\operatorname{Amp}[(\\mathrm{x}-2)+\\mathrm{i}(\\mathrm{y}-3)]$ is $\\frac{3 \\pi}{4}$\n$\\therefore \\tan ^{-1}\\left(\\frac{\\mathrm{y}-3}{\\mathrm{x}-2}\\right)=\\frac{3 \\pi}{4} \\Rightarrow \\tan \\left(\\frac{3 \\pi}{4}\\right)=\\frac{\\mathrm{y}-3}{\\mathrm{x}-2}$\n$\\therefore-1=\\frac{y-3}{x-2} \\Rightarrow-x+2=y-3 \\Rightarrow x+y=5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
