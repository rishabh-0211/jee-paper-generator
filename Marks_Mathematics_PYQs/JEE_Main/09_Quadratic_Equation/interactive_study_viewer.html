"level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-16T09:00:00.000Z", "isVisible": true, "shortName": "2018 (16 Apr Online)", "title": "JEE Main 2018 (16 Apr Online)"}], "question": {"text": "If an angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;of a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>A</mi><mi>B</mi><mi>C</mi></math> satisfies <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>cos</mi><mi>A</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>, then the roots of the quadratic equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>27</mn><mi>x</mi><mo>+</mo><mn>20</mn><mo>=</mo><mn>0</mn></math> are", "image": null}, "options": [{"id": "MXu3J", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sec</mi><mi>A</mi><mo>,</mo><mo>&#160;</mo><mi>cot</mi><mi>A</mi></math>", "image": null, "isCorrect": false}, {"id": "bLiv5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sec</mi><mi>A</mi><mo>,</mo><mo>&#160;</mo><mi>tan</mi><mi>A</mi></math>", "image": null, "isCorrect": true}, {"id": "IkViL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>A</mi><mo>,</mo><mo>&#160;</mo><mi>cos</mi><mi>A</mi></math>", "image": null, "isCorrect": false}, {"id": "zAH8Q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>A</mi><mo>,</mo><mo>&#160;</mo><mi>sec</mi><mi>A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>We have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>cos</mi><mi>A</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>cos</mi><mi>A</mi><mo>=</mo><mo>-</mo><mfrac><mn>3</mn><mn>5</mn></mfrac></math></p><p>Clearly,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mn>90</mn><mo>&#176;</mo><mo>,</mo><mn>180</mn><mo>&#176;</mo></mrow></mfenced></math></p><p>Now, roots of equation</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>27</mn><mi>x</mi><mo>+</mo><mn>20</mn><mo>=</mo><mn>0</mn></math>&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>27</mn><mo>&#177;</mo><msqrt><mn>729</mn><mo>-</mo><mn>720</mn></msqrt></mrow><mn>18</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>27</mn><mo>&#177;</mo><mn>3</mn></mrow><mn>18</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mo>-</mo><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>,</mo><mo>&#160;</mo><mo>-</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p><p>Then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>=</mo><mi>sec</mi><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>=</mo><mi>tan</mi><mi>A</mi></math>.</p><p>Hence, the roots are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sec</mi><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>A</mi></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-16T09:00:00.000Z", "isVisible": true, "shortName": "2018 (16 Apr Online)", "title": "JEE Main 2018 (16 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d663a9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-16T09:00:00.000Z", "isVisible": true, "shortName": "2018 (16 Apr Online)", "title": "JEE Main 2018 (16 Apr Online)"}], "question": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>,</mo><mi>q</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;be real numbers <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>&#8800;</mo><mi>q</mi><mo>,</mo><mi>r</mi><mo>&#8800;</mo><mn>0</mn></mrow></mfenced></math>, such that the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mi>x</mi><mo>+</mo><mi>p</mi></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mi>x</mi><mo>+</mo><mi>q</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>r</mi></mfrac></math> are equal in magnitude but opposite in sign, then the sum of squares of these roots is equal to", "image": null}, "options": [{"id": "GLc95", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": true}, {"id": "sV4cU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>p</mi><mn>2</mn></msup><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "y6Jei", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfenced separators=\"|\"><mrow><msup><mi>p</mi><mn>2</mn></msup><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "JQjwx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#160;</mi><msup><mi>p</mi><mn>2</mn></msup><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given quadratic equation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mi>x</mi><mo>+</mo><mi>p</mi><mi>&#160;</mi></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mi>x</mi><mo>+</mo><mi>q</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>r</mi></mfrac></math>.</p><p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math>&nbsp;be the&nbsp;roots of given equation.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mi>p</mi><mo>+</mo><mi>q</mi></mrow></mfenced><mi>r</mi><mo>=</mo><mfenced><mrow><mi>x</mi><mo>+</mo><mi>p</mi></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>+</mo><mi>q</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>+</mo><mi>q</mi><mo>-</mo><mn>2</mn><mi>r</mi></mrow></mfenced><mi>x</mi><mo>+</mo><mi>p</mi><mi>q</mi><mo>-</mo><mi>p</mi><mi>r</mi><mo>-</mo><mi>q</mi><mi>r</mi><mo>=</mo><mn>0</mn></math></p><p>Now, sum of roots <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mo>-</mo><mi>b</mi></mrow><mi>a</mi></mfrac><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>+</mo><mi>q</mi><mo>-</mo><mn>2</mn><mi>r</mi></mrow></mfenced></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>+</mo><mi>q</mi><mo>-</mo><mn>2</mn><mi>r</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math>&nbsp; &nbsp; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo></math>Given that roots are equal in magnitude and opposite in sign)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mo>+</mo><mi>q</mi><mo>=</mo><mn>2</mn><mi>r</mi><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>Product of roots <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mfrac><mi>c</mi><mi>a</mi></mfrac><mo>=</mo><mi>p</mi><mi>q</mi><mo>-</mo><mi>p</mi><mi>r</mi><mo>-</mo><mi>q</mi><mi>r</mi></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>2</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><msup><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>&#945;</mi><mi>&#946;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>-</mo><mn>2</mn><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>p</mi><mi>q</mi><mo>-</mo><mi>p</mi><mi>r</mi><mo>-</mo><mi>q</mi><mi>r</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>2</mn><mi>p</mi><mi>q</mi><mo>+</mo><mn>2</mn><mi>r</mi><mfenced separators=\"|\"><mrow><mi>p</mi><mo>+</mo><mi>q</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>2</mn><mi>p</mi><mi>q</mi><mo>+</mo><msup><mfenced separators=\"|\"><mrow><mi>p</mi><mo>+</mo><mi>q</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mi>p</mi><mn>2</mn></msup><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo></math>&nbsp;from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mn>1</mn></mfenced></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi>p</mi><mn>2</mn></msup><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-16T09:00:00.000Z", "isVisible": true, "shortName": "2018 (16 Apr Online)", "title": "JEE Main 2018 (16 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66352", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr)", "title": "JEE Main 2018 (15 Apr)"}], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mi>B</mi></math> are the roots of the quadratic equation&nbsp;<math><mn>3</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>10</mn><mi>x</mi><mo>-</mo><mn>25</mn><mo>=</mo><mn>0</mn></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>sin</mi><mn>2</mn></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>-</mo><mn>10</mn><mi>sin</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mi>cos</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>-</mo><mn>25</mn><msup><mi>cos</mi><mn>2</mn></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced></math> is :", "image": null}, "options": [{"id": "AEP9h", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>25</mn></math>", "image": null, "isCorrect": true}, {"id": "90t96", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>", "image": null, "isCorrect": false}, {"id": "AX5PP", "text": "<math><mo>-</mo><mn>10</mn></math>", "image": null, "isCorrect": false}, {"id": "VbYEz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Since, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mi>B</mi></math> are roots of the equation <math><mn>3</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>10</mn><mi>x</mi><mo>-</mo><mn>25</mn><mo>=</mo><mn>0</mn></math>.</p><p>So,&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>A</mi></mrow></mrow><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>B</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>&nbsp;and&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>A</mi></mrow></mrow><mo>.</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>B</mi></mrow></mrow><mo>=</mo><mo>-</mo><mfrac><mrow><mn>25</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>tan</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>tan</mi><mo>&#8289;</mo><mi>A</mi><mo>+</mo><mi>tan</mi><mo>&#8289;</mo><mi>B</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi>tan</mi><mo>&#8289;</mo><mi>A</mi><mo>.</mo><mi>tan</mi><mo>&#8289;</mo><mi>B</mi></mrow></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mfrac><mn>10</mn><mn>3</mn></mfrac></mstyle><mrow><mn>1</mn><mo>+</mo><mfrac><mn>25</mn><mn>3</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mn>10</mn><mn>28</mn></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>14</mn></mfrac></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mfenced><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mo>&#177;</mo><mn>5</mn></mrow><msqrt><mn>221</mn></msqrt></mfrac><mo>&#38;</mo><mo>&#160;</mo><mi>cos</mi><mfenced><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mo>&#177;</mo><mn>14</mn></mrow><msqrt><mn>221</mn></msqrt></mfrac></math></p><p>(Note&nbsp;that either both are negative or both positive)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mn>3</mn><msup><mi>sin</mi><mn>2</mn></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>-</mo><mn>10</mn><mi>sin</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>.</mo><mi>cos</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>-</mo><mn>25</mn><msup><mi>cos</mi><mn>2</mn></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>&#215;</mo><mfrac><mn>25</mn><mn>221</mn></mfrac><mo>-</mo><mfrac><mrow><mn>10</mn><mo>&#215;</mo><mn>5</mn><mo>&#215;</mo><mn>14</mn></mrow><mn>221</mn></mfrac><mo>-</mo><mn>25</mn><mo>&#215;</mo><mfrac><msup><mn>14</mn><mn>2</mn></msup><mn>221</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>25</mn><mn>221</mn></mfrac><mfenced separators=\"|\"><mrow><mn>3</mn><mo>-</mo><mn>28</mn><mo>-</mo><mn>196</mn></mrow></mfenced><mo>=</mo><mo>-</mo><mn>25</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr)", "title": "JEE Main 2018 (15 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6634c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr)", "title": "JEE Main 2018 (15 Apr)"}], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>&#8712;</mo><mi>R</mi></math> is such that the sum of the cubes of the roots of the equation&nbsp;<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mi>x</mi><mo>+</mo><mfenced separators=\"|\"><mrow><mn>10</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math> is minimum, then the magnitude of the difference of the roots of this equation is :", "image": null}, "options": [{"id": "qoLzZ", "text": "<math><mn>4</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "tgMzN", "text": "<math><mn>20</mn></math>", "image": null, "isCorrect": false}, {"id": "sRw24", "text": "<math><mn>2</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "b4lmT", "text": "<math><mn>2</mn><msqrt><mn>7</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mi>x</mi><mo>+</mo><mfenced separators=\"|\"><mrow><mn>10</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><mi>&#955;</mi><mo>-</mo><mn>2</mn><mo>&#38;</mo><mo>&#160;</mo><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mn>10</mn><mo>-</mo><mi>&#955;</mi><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>Let roots are <math><mi>&#945;</mi><mi>&#160;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&#160;</mi><mi>&#946;</mi></math>.</p><p><math><mo>&#8658;</mo><mi>&#160;</mi><msup><mrow><mi>&#945;</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>+</mo><msup><mrow><mi>&#946;</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><mn>3</mn><mi>&#945;</mi><mi>&#946;</mi><mo>(</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>)</mo></math></p><p><math><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>&#955;</mi><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><mn>3</mn><mfenced separators=\"|\"><mrow><mn>10</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mo>(</mo><mi>&#955;</mi><mo>-</mo><mn>2</mn><mo>)</mo></math></p><p><math><mo>=</mo><mi>&#160;</mi><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><msup><mrow><mn>6</mn><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>12</mn><mi>&#955;</mi><mo>-</mo><mn>8</mn><mo>-</mo><mn>3</mn><mo>(</mo><mn>10</mn><mi>&#955;</mi><mo>-</mo><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>20</mn><mo>+</mo><mn>2</mn><mi>&#955;</mi><mo>)</mo></math></p><p><math><mo>=</mo><mi>&#160;</mi><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><msup><mrow><mn>3</mn><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>24</mn><mi>&#955;</mi><mo>+</mo><mn>52</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>z</mi></mrow><mrow><mi>d</mi><mi>&#955;</mi></mrow></mfrac><mo>=</mo><mn>3</mn><msup><mi>&#955;</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>&#955;</mi><mo>-</mo><mn>24</mn><mo>=</mo><mn>3</mn><mfenced><mrow><msup><mi>&#955;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>8</mn></mrow></mfenced></math>&nbsp;(where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi><mo>=</mo><msup><mi>&#945;</mi><mn>3</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>3</mn></msup></math>)</p><p>For maximum and critical points, derivative must be zero.</p><p><math><mo>&#8658;</mo><mi>&#160;</mi><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>8</mn><mo>=</mo><mn>0</mn></math></p><p><math><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>&#955;</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>&#955;</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mo>-</mo><mn>2,</mn><mo>&#160;</mo><mn>4</mn></math></p><p>Now,&nbsp;<math><mfrac><mrow><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>z</mi></mrow><mrow><mi>d</mi><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>6</mn><mi>&#955;</mi><mo>-</mo><mn>6</mn></math></p><p>For&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>&#955;</mi><mo>=</mo><mo>-</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfrac><mrow><msup><mi>d</mi><mn>2</mn></msup><mi>z</mi></mrow><mrow><mi>d</mi><msup><mi>&#955;</mi><mn>2</mn></msup></mrow></mfrac><mo>&#60;</mo><mn>0</mn><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>3</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>3</mn></msup></math>&nbsp;is maximum and</p><p>For&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>&#955;</mi><mo>=</mo><mn>4</mn><mo>)</mo><mo>,</mo><mo>&#160;</mo><mfrac><mrow><msup><mi>d</mi><mn>2</mn></msup><mi>z</mi></mrow><mrow><mi>d</mi><msup><mi>&#955;</mi><mn>2</mn></msup></mrow></mfrac><mo>&#62;</mo><mn>0</mn><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>3</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>3</mn></msup></math>&nbsp;is minimum.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>Equation will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>6</mn><mo>=</mo><mn>0</mn></math>.</p><p>Using quadratic formula, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#177;</mo><msqrt><msup><mfenced><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>4</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mn>6</mn></msqrt></mrow><mrow><mn>2</mn><mo>&#215;</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#177;</mo><msqrt><mo>-</mo><mn>20</mn></msqrt></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#177;</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mi>i</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>&#177;</mo><msqrt><mn>5</mn></msqrt><mi>i</mi></math></p><p>Thus, difference of roots is&nbsp;<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mn>2</mn><msqrt><mn>5</mn></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr)", "title": "JEE Main 2018 (15 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66297", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09: rect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>+</mo><mn>5</mn></msqrt><mo>=</mo><mi>x</mi><mo>-</mo><mn>3</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>We know that for a quadratic expression&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>,</mo><mo>&#160;</mo><mi>a</mi><mo>&#62;</mo><mn>0</mn><mo>,</mo></math> if discriminant i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mo>=</mo><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi><mo>&#60;</mo><mn>0</mn><mo>,</mo></math>&nbsp;then the quadratic is always positive for all real values of the variable.</p><p>Now, consider&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>+</mo><mn>5</mn></math></p><p>We have, discriminant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi><mo>=</mo><mn>1</mn><mo>-</mo><mn>4</mn><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><mn>5</mn><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>+</mo><mn>5</mn><mo>&#62;</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mo>&#8704;</mo><mo>&#160;</mo><mi>x</mi><mo>&#8712;</mo><mi>R</mi></math></p><p>Squaring <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced><mo>,</mo></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>+</mo><mn>5</mn><mo>=</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>+</mo><mn>5</mn><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>9</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>7</mn><mi>x</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>x</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mfenced><mrow><mn>2</mn><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mo>-</mo><mn>4</mn><mi mathvariant=\"normal\">,</mi><mo>&#160;</mo><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>But&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>3</mn><mo>&#60;</mo><mn>0</mn></math>&nbsp;for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mo>-</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>Hence, the equation has no solution.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "The sum of the roots of the equation, $\\mathrm{x}^2+|2 \\mathrm{x}-3|-4=0$, is:", "image": null}, "options": [{"id": "bjCwo", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "KYljZ", "text": "\n$-2$\n", "image": null, "isCorrect": false}, {"id": "xRNM1", "text": "\n$\\sqrt{2}$\n", "image": null, "isCorrect": true}, {"id": "oLtFt", "text": "\n$-\\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n&x^2+|2 x-3|-4=0 \\\\\n&|2 x-3|=\\left\\{\\begin{array}{lll}\n(2 x-3) & \\text { if } & \\mathrm{x}>\\frac{3}{2} \\\\\n-(2 x-3) & \\text { if } & \\mathrm{x} < \\frac{3}{2}\n\\end{array}\\right.\n\\end{aligned}\n$$\n\n$$\n\\begin{aligned}\n&\\text { for } x>\\frac{3}{2}, \\quad x^2+2 x-3-4=0 \\\\\n&x^2+2 x-7=0 \\\\\n&x=\\frac{-2 \\pm \\sqrt{4+28}}{2} \\\\\n&=\\frac{-2 \\pm 4 \\sqrt{2}}{2}=-1 \\pm 2 \\sqrt{2} \\\\\n&\\text { Here } x=2 \\sqrt{2}-1 \\\\\n&\\left\\{2 \\sqrt{2}-1 < \\frac{3}{2}\\right\\} \\\\\n&\\text { for } x < \\frac{3}{2} \\\\\n&x^2-2 x+3-4=0 \\\\\n&\\Rightarrow x^2-2 x-1=0 \\\\\n&\\Rightarrow x=\\frac{2 \\pm \\sqrt{4+4}}{2}=\\frac{2 \\pm 2 \\sqrt{2}}{2}=1 \\pm \\sqrt{2} \\\\\n&\\text { Here } x=1-\\sqrt{2} \\quad\\left\\{(1-\\sqrt{2}) < \\frac{3}{2}\\right\\}\n\\end{aligned}\n$$\nSum of roots: $(2 \\sqrt{2}-1)+(1-\\sqrt{2})=\\sqrt{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e03", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "If $\\alpha$ and $\\beta$ are roots of the equation, $x^2-4 \\sqrt{2} k x+2 e^{4 \\ln k}-1=0$ for some $k$, and $\\alpha^2+\\beta^2=66$, then $\\alpha^3+\\beta^3$ is equal to:", "image": null}, "options": [{"id": "6jYsp", "text": "\n$248 \\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "zM41Q", "text": "\n$280 \\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "UZyn7", "text": "\n$-32 \\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "sc0dw", "text": "\n$-280 \\sqrt{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$x^2-4 \\sqrt{2} k x+2 e^{4 \\ln k}-1=0$ or, $x^2-4 \\sqrt{2} k x+2 k^4-1=0$ $\\alpha+\\beta=4 \\sqrt{2} k$ and $\\alpha \\cdot \\beta=2 k^4-1$ Squaring both sides, we get\n$$\n\\begin{aligned}\n&(\\alpha+\\beta)^2=(4 \\sqrt{2} k)^2 \\\\\n&\\Rightarrow \\alpha^2+\\beta^2+2 \\alpha \\beta=32 k^2 \\\\\n&66+2 \\alpha \\beta=32 k^2 \\\\\n&66+2\\left(2 k^4-1\\right)=32 k^2 \\\\\n&66+4 k^4-2=32 k^2 \\\\\n&\\Rightarrow 4 k^4-32 k^2+64=0 \\\\\n&\\text { or, } k^4-8 k^2+16=0 \\\\\n&\\Rightarrow\\left(k^2\\right)^2-8 k^2+16=0 \\\\\n&\\Rightarrow\\left(k^2-4\\right)\\left(k^2-4\\right)=0 \\\\\n&\\Rightarrow k^2=4, k^2=4 \\\\\n&\\Rightarrow k=\\pm 2\n\\end{aligned}\n$$\nNow, $\\alpha^3+\\beta^3=(\\alpha+\\beta)\\left(\\alpha^2+\\beta^2-\\alpha \\beta\\right)$\n$$\n\\therefore \\alpha^3+\\beta^3=(4 \\sqrt{2} k)\\left[66-\\left(2 k^4-1\\right)\\right]\n$$\nPutting $k=-2,(k=+2$ cannot be taken because it does not satisfy the above equation)\n$\\therefore \\alpha^3+\\beta^3=(4 \\sqrt{2}(-2))\\left[66-2(-2)^4-1\\right]$\n$\\alpha^3+\\beta^3=(-8 \\sqrt{2})(66-32+1)=$\n$(-8 \\sqrt{2})(35)$\n$\\therefore \\alpha^3+\\beta^3=-280 \\sqrt{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id":
