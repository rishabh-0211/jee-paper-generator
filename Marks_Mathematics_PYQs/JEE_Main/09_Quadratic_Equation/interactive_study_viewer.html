mo>|</mo><mi>x</mi><msup><mo>|</mo><mn>2</mn></msup><mo>-</mo><mn>2</mn><mo>|</mo><mi>x</mi><mo>|</mo><mo>+</mo><mo>|</mo><mi>&#955;</mi><mo>-</mo><mn>3</mn><mo>|</mo><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>|</mo><mi>&#955;</mi><mo>-</mo><mn>3</mn><mo>|</mo><mo>=</mo><mfenced open=\"|\" close=\"|\"><mi>x</mi></mfenced><mfenced><mrow><mn>2</mn><mo>-</mo><mfenced open=\"|\" close=\"|\"><mi>x</mi></mfenced></mrow></mfenced></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>3</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>,</p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>4</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>, then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn></math></p><p>So, maximum value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>&#955;</mi><mo>=</mo><mn>5</mn></math>&nbsp;when&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>4</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e32", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi><mfenced><mrow><mi>&#945;</mi><mo>&#62;</mo><mi>&#946;</mi></mrow></mfenced></math>&nbsp;be the roots of the quadratic equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>x</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>n</mi></msub><mo>=</mo><msup><mi>&#945;</mi><mi>n</mi></msup><mo>-</mo><msup><mi>&#946;</mi><mi>n</mi></msup><mo>,</mo><mi>n</mi><mo>&#8712;</mo><mi mathvariant=\"normal\">&#8469;</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>P</mi><mn>15</mn></msub><msub><mi>P</mi><mn>16</mn></msub><mo>-</mo><msub><mi>P</mi><mn>14</mn></msub><msub><mi>P</mi><mn>16</mn></msub><mo>-</mo><msubsup><mi>P</mi><mn>15</mn><mn>2</mn></msubsup><mo>+</mo><msub><mi>P</mi><mn>14</mn></msub><msub><mi>P</mi><mn>15</mn></msub></mrow><mrow><msub><mi>P</mi><mn>13</mn></msub><msub><mi>P</mi><mn>14</mn></msub></mrow></mfrac></math>&nbsp;is equal to _____.", "image": null}, "options": [], "correctValue": "16", "solution": {"text": "<blockquote><p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>n</mi></msub><mo>=</mo><msup><mi>&#945;</mi><mi mathvariant=\"normal\">n</mi></msup><mo>-</mo><msup><mi>&#946;</mi><mi mathvariant=\"normal\">n</mi></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>&#946;</mi></math>&nbsp;are roots of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>x</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math></p><p>Now putting&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>-</mo><mn>1</mn></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>n</mi></msub><mo>=</mo><msup><mi>&#945;</mi><mi mathvariant=\"normal\">n</mi></msup><mo>-</mo><msup><mi>&#946;</mi><mi mathvariant=\"normal\">n</mi></msup></math>&nbsp;we get,&nbsp;&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msub><mo>=</mo><mfenced><mrow><msup><mi>&#945;</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>-</mo><msup><mi>&#946;</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>Now subtracting&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>n</mi></msub><mo>-</mo><msub><mi>P</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msub></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>n</mi></msub><mo>-</mo><msub><mi>P</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msub><mo>=</mo><mfenced><mrow><msup><mi>&#945;</mi><mi>n</mi></msup><mo>-</mo><msup><mi>&#946;</mi><mi>n</mi></msup></mrow></mfenced><mo>-</mo><mfenced><mrow><msup><mi>&#945;</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>-</mo><msup><mi>&#946;</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>P</mi><mi>n</mi></msub><mo>-</mo><msub><mi>P</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msub><mo>=</mo><msup><mi>&#945;</mi><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msup><mfenced><mrow><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mi>&#945;</mi></mrow></mfenced><mo>-</mo><msup><mi>&#946;</mi><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msup><mfenced><mrow><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><mi>&#946;</mi></mrow></mfenced></math></p><p>Now using the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mi>&#945;</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><mi>&#946;</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>n</mi></msub><mo>-</mo><msub><mi>P</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msub><mo>=</mo><mn>4</mn><mfenced><mrow><msup><mi>&#945;</mi><mrow><mi mathvariant=\"normal\">n</mi><mo>-</mo><mn>2</mn></mrow></msup><mo>-</mo><msup><mi>&#946;</mi><mrow><mi mathvariant=\"normal\">n</mi><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>n</mi></msub><mo>-</mo><msub><mi>P</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msub><mo>=</mo><mn>4</mn><msub><mi>P</mi><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msub></math></p><p>Now putting the value in given expression&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>P</mi><mn>15</mn></msub><msub><mi>P</mi><mn>16</mn></msub><mo>-</mo><msub><mi>P</mi><mn>14</mn></msub><msub><mi>P</mi><mn>16</mn></msub><mo>-</mo><msubsup><mi>P</mi><mn>15</mn><mn>2</mn></msubsup><mo>+</mo><msub><mi>P</mi><mn>14</mn></msub><msub><mi>P</mi><mn>15</mn></msub></mrow><mrow><msub><mi>P</mi><mn>13</mn></msub><msub><mi>P</mi><mn>14</mn></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>16</mn></msub><mfenced><mrow><msub><mi>P</mi><mn>15</mn></msub><mo>-</mo><msub><mi>P</mi><mn>14</mn></msub></mrow></mfenced><mo>-</mo><msub><mi>P</mi><mn>15</mn></msub><mfenced><mrow><msub><mi>P</mi><mn>15</mn></msub><mo>-</mo><msub><mi>P</mi><mn>14</mn></msub></mrow></mfenced></mrow><mrow><msub><mi>P</mi><mn>13</mn></msub><msub><mi>P</mi><mn>14</mn></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfenced><mrow><msub><mi>P</mi><mn>15</mn></msub><mo>-</mo><msub><mi>P</mi><mn>14</mn></msub></mrow></mfenced><mfenced><mrow><msub><mi>P</mi><mn>16</mn></msub><mo>-</mo><msub><mi>P</mi><mn>15</mn></msub></mrow></mfenced></mrow><mrow><msub><mi>P</mi><mn>13</mn></msub><msub><mi>P</mi><mn>14</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mfenced><mrow><mn>4</mn><msub><mi>P</mi><mn>13</mn></msub></mrow></mfenced><mfenced><mrow><mn>4</mn><msub><mi>P</mi><mn>14</mn></msub></mrow></mfenced></mrow><mrow><msub><mi>P</mi><mn>13</mn></msub><msub><mi>P</mi><mn>14</mn></msub></mrow></mfrac><mo>=</mo><mn>16</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67cb6", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></math> be the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><msqrt><mn>2</mn></msqrt><mi>x</mi><mo>+</mo><msqrt><mn>6</mn></msqrt><mo>=</mo><mn>0</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>&#945;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mn>1</mn><mo>,</mo><mfrac><mn>1</mn><msup><mi>&#946;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mn>1</mn></math>&nbsp;be the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>a</mi><mi>x</mi><mo>+</mo><mi>b</mi><mo>=</mo><mn>0</mn></math>. Then the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mfenced><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mi>x</mi><mo>+</mo><mfenced><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;are :", "image": null}, "options": [{"id": "DXFk2", "text": "non-real complex numbers", "isCorrect": false, "image": null}, {"id": "Y37uJ", "text": "real and both negative", "isCorrect": true, "image": null}, {"id": "1a5MV", "text": "real and both positive", "isCorrect": false, "image": null}, {"id": "v6Fw2", "text": "real and exactly one of them is positive", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></math> be the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><msqrt><mn>2</mn></msqrt><mi>x</mi><mo>+</mo><msqrt><mn>6</mn></msqrt><mo>=</mo><mn>0</mn></math>&nbsp;</p><p>So sum of roots will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></math>&nbsp;and product of roots will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><msqrt><mn>6</mn></msqrt></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math></p><p>And also given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>&#945;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>&#946;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mn>1</mn></math>&nbsp;are roots of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>a</mi><mi>x</mi><mo>+</mo><mi>b</mi><mo>=</mo><mn>0</mn></math></p><p>So sum of roots will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>a</mi><mo>=</mo><mfrac><mn>1</mn><msup><mi>&#945;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mn>1</mn><mo>+</mo><mfrac><mn>1</mn><msup><mi>&#946;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><msup><mi>&#945;</mi><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mi>&#946;</mi><mn>2</mn></msup></mfrac><mo>-</mo><mn>2</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>And similarly product of roots will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mo>=</mo><mfrac><mn>1</mn><msup><mi>&#945;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>&#946;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mn>1</mn><mo>+</mo><mfrac><mn>1</mn><mrow><msup><mi>&#945;</mi><mn>2</mn></msup><msup><mi>&#946;</mi><mn>2</mn></msup></mrow></mfrac><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>Now adding equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mn>2</mn></mfenced></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>+</mo><mi>b</mi><mo>=</mo><mfrac><mn>1</mn><msup><mfenced><mrow><mi>&#945;</mi><mi>&#946;</mi></mrow></mfenced><mn>2</mn></msup></mfrac><mo>-</mo><mn>1</mn><mo>=</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>-</mo><mn>1</mn><mo>=</mo><mo>-</mo><mfrac><mn>5</mn><mn>6</mn></mfrac></math>&nbsp;{as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><msqrt><mn>6</mn></msqrt></math>}</p><p>Now putting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>+</mo><mi>b</mi></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mfenced><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mi>x</mi><mo>+</mo><mfenced><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mfenced><mrow><mo>-</mo><mfrac><mn>5</mn><mn>6</mn></mfrac><mo>-</mo><mn>2</mn></mrow></mfenced><mi>x</mi><mo>+</mo><mfenced><mrow><mn>2</mn><mo>-</mo><mfrac><mn>5</mn><mn>6</mn></mfrac></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>17</mn><mi>x</mi><mo>+</mo><mn>7</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mo>-</mo><mfrac><mn>7</mn><mn>3</mn></mfrac><mo>,</mo><mi>x</mi><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math> are the roots, both roots are real and negative.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67c78", "previousYearPapers": [{"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07- </mn></math></p><p>Also&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>3</mn><msup><mfenced><mrow><msub><mi>log</mi><mn>3</mn></msub><mn>5</mn></mrow></mfenced><mfrac><mn>1</mn><mn>3</mn></mfrac></msup></msup><mo>-</mo><msup><mn>5</mn><msup><mfenced><mrow><msub><mi>log</mi><mn>5</mn></msub><mn>3</mn></mrow></mfenced><mfrac><mn>2</mn><mn>3</mn></mfrac></msup></msup><mo>=</mo><msup><mn>5</mn><msup><mfenced><mrow><msub><mi>log</mi><mn>5</mn></msub><mn>3</mn></mrow></mfenced><mfrac><mn>2</mn><mn>3</mn></mfrac></msup></msup><mo>-</mo><msup><mn>5</mn><msup><mfenced><mrow><msub><mi>log</mi><mn>5</mn></msub><mn>3</mn></mrow></mfenced><mfrac><mn>2</mn><mn>3</mn></mfrac></msup></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn></math></p><p>So, given equation becomes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi>x</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>&nbsp;</p><p>i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><mn>5</mn><mo>;</mo><mo>&#160;</mo><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>3</mn></math></p><p>Now if the roots are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mfrac><mn>1</mn><mi>&#946;</mi></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>+</mo><mfrac><mn>1</mn><mi>&#945;</mi></mfrac></math></p><p>i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#945;</mi><mi>&#946;</mi><mo>+</mo><mn>1</mn></mrow><mi>&#946;</mi></mfrac><mo>&#38;</mo><mfrac><mrow><mi>&#945;</mi><mi>&#946;</mi><mo>+</mo><mn>1</mn></mrow><mi>&#945;</mi></mfrac></math>&nbsp;</p><p>i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><mi>&#946;</mi></mfrac><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><mi>&#945;</mi></mfrac></math></p><p>Then let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><mi>&#945;</mi></mfrac><mo>=</mo><mi>t</mi><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><mi>t</mi></mfrac></math></p><p>As&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi>&#945;</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><mi>t</mi></mfrac></mfenced><mn>2</mn></msup><mo>-</mo><mn>5</mn><mfenced><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><mi>t</mi></mfrac></mfenced><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>4</mn><msup><mi>t</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mn>10</mn><mi>t</mi></mfrac><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><msup><mi>t</mi><mn>2</mn></msup><mo>-</mo><mn>10</mn><mi>t</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math></p><p>i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>10</mn><mi>x</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>&nbsp;is the required equation.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6783a", "previousYearPapers": [{"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>,</mo><mi>b</mi></math> be two non-zero real numbers. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> are the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>8</mn><mi>a</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi><mo>=</mo><mn>0</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>s</mi></math> are the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>12</mn><mi>b</mi><mi>x</mi><mo>+</mo><mn>6</mn><mi>b</mi><mo>=</mo><mn>0</mn></math>, such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>p</mi></mfrac><mo>,</mo><mfrac><mn>1</mn><mi>q</mi></mfrac><mo>,</mo><mfrac><mn>1</mn><mi>r</mi></mfrac><mo>,</mo><mfrac><mn>1</mn><mrow><mo>&#160;</mo><mi>s</mi></mrow></mfrac></math> are in A.P., then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>-</mo><msup><mi>b</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is equal to _____ .", "image": null}, "options": [], "correctValue": "38", "solution": {"text": "<blockquote><p>Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>,</mo><mo>&#160;</mo><mi>r</mi></math> are roots of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>8</mn><mi>a</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi><mo>=</mo><mn>0</mn></math> and</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mo>,</mo><mi>s</mi></math> are the roots of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>12</mn><mi>b</mi><mi>x</mi><mo>+</mo><mn>6</mn><mi>b</mi><mo>=</mo><mn>0</mn></math>&nbsp;</p><p>So the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>8</mn><mi>a</mi><mi>x</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>&nbsp;has roots <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>p</mi></mfrac><mo>,</mo><mfrac><mn>1</mn><mi>r</mi></mfrac></math> and</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi>b</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>12</mn><mi>b</mi><mi>x</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>&nbsp;has roots&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>q</mi></mfrac><mo>,</mo><mfrac><mn>1</mn><mi>s</mi></mfrac></math>.</p><p>Given that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>p</mi></mfrac><mo>,</mo><mfrac><mn>1</mn><mi>q</mi></mfrac><mo>,</mo><mfrac><mn>1</mn><mi>r</mi></mfrac><mo>,</mo><mfrac><mn>1</mn><mi>s</mi></mfrac></math> are in A.P.</p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>p</mi></mfrac><mo>=</mo><mi>&#945;</mi><mo>-</mo><mn>3</mn><mi>&#946;</mi><mo>,</mo><mfrac><mn>1</mn><mi>q</mi></mfrac><mo>=</mo><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi><mo>,</mo><mfrac><mn>1</mn><mi>r</mi></mfrac><mo>=</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>s</mi></mfrac><mo>=</mo><mi>&#945;</mi><mo>+</mo><mn>3</mn><mi>&#946;</mi></math></p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>p</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mi>r</mi></mfrac><mo>=</mo><mn>2</mn><mi>&#945;</mi><mo>-</mo><mn>2</mn><mi>&#946;</mi><mo>=</mo><mn>4</mn></math>&nbsp;and</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>q</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><mo>=</mo><mn>2</mn><mi>&#945;</mi><mo>+</mo><mn>2</mn><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>2</mn></math></p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>=</mo><mo>-</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math></p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>p</mi></mfrac><mo>=</mo><mn>5</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mi>q</mi></mfrac><mo>=</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mi>r</mi></mfrac><mo>=</mo><mo>-</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><mo>=</mo><mo>-</mo><mn>4</mn></math></p><p>Now&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>p</mi></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mi>r</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>a</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mn>5</mn><mo>&#8658;</mo><mfrac><mn>1</mn><mi>a</mi></mfrac><mo>=</mo><mo>-</mo><mn>10</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>q</mi></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mn>6</mn><mi>b</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mn>8</mn><mo>&#8658;</mo><mfrac><mn>1</mn><mi>b</mi></mfrac><mo>=</mo><mo>-</mo><mn>48</mn></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>-</mo><msup><mi>b</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>10</mn><mo>+</mo><mn>48</mn><mo>=</mo><mn>38</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "2395338a0cd44d14885dad689abebefc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/51YhaVJh1f88t.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/51YhaVJh1f88t.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67ed1", "previousYearPapers": [{"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;be a root of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>x</mi><mn>4</mn></msup><mo>=</mo><mn>0</mn></math>. Then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>1011</mn></msup><mo>+</mo><msup><mi>&#945;</mi><mn>2022</mn></msup><mo>-</mo><msup><mi>&#945;</mi><mn>3033</mn></msup></math> is equal to:", "image": null}, "options": [{"id": "KcXJK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "isCorrect": true, "image": null}, {"id": "Xp6T6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>", "isCorrect": false, "image": null}, {"id": "goOzG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><mi>&#945;</mi frac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi></math></p><p>Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mo>+</mo><mi>f</mi><mfenced><mn>3</mn></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi><mo>+</mo><mi>c</mi><mo>+</mo><mn>9</mn><mi>a</mi><mo>+</mo><mn>3</mn><mi>b</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><mn>13</mn><mi>a</mi><mo>+</mo><mi>b</mi><mo>+</mo><mn>2</mn><mi>c</mi><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p>Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn></math>&nbsp;is a root of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mn>0</mn></math>. So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>-</mo><mi>b</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>ii</mi></mfenced></math></p><p>On solving equations&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math>&nbsp;&amp;&nbsp;<mat  null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d678f0", "previousYearPapers": [{"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "For a natural number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>, let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mi>n</mi></msub><mo>=</mo><msup><mn>19</mn><mi>n</mi></msup><mo>-</mo><msup><mn>12</mn><mi>n</mi></msup></math>. Then, the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>31</mn><msub><mi>&#945;</mi><mn>9</mn></msub><mo>-</mo><msub><mi>&#945;</mi><mn>10</mn></msub></mrow><mrow><mn>57</mn><msub><mi>&#945;</mi><mn>8</mn></msub></mrow></mfrac></math>&nbsp;is ______", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>2</mn></msub></math>&nbsp;are roots of the quadratic&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math></p><p>then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>r</mi><mn>1</mn></msub><mi>n</mi></msup><mo>=</mo><mn>31</mn><msup><msub><mi>r</mi><mn>1</mn></msub><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msup><mo>-</mo><mn>228</mn><msup><msub><mi>r</mi><mn>1</mn></msub><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>r</mi><mn>2</mn></msub><mi>n</mi></msup><mo>=</mo><mn>31</mn><msup><msub><mi>r</mi><mn>2</mn></msub><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msup><mo>-</mo><mn>228</mn><msup><msub><mi>r</mi><mn>2</mn></msub><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>r</mi><mn>1</mn></msub><mi>n</mi></msup><mo>-</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mi>n</mi></msup><mo>=</mo><mn>31</mn><mfenced><mrow><msup><msub><mi>r</mi><mn>1</mn></msub><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msup><mo>-</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mo>-</mo><mn>228</mn><mfenced><mrow><msup><msub><mi>r</mi><mn>1</mn></msub><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>-</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>Or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mi>n</mi></msub><mo>-</mo><mn>31</mn><msub><mi>a</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msub><mo>+</mo><mn>228</mn><msub><mi>a</mi><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msub><mo>=</mo><mn>0</mn></math>&nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><msup><msub><mi>r</mi><mn>1</mn></msub><mi>n</mi></msup><mo>-</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mi>n</mi></msup></math></p><p>Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>19</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mn>12</mn></math>&nbsp;are&nbsp;the&nbsp;roots of the quadratic <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>31</mn><mi>x</mi><mo>+</mo><mn>228</mn><mo>=</mo><mn>0</mn></math>&nbsp;</p><p>we know, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mi>n</mi></msub><mo>-</mo><mn>31</mn><msub><mi>a</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msub><mo>+</mo><mn>228</mn><msub><mi>a</mi><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msub><mo>=</mo><mn>0</mn></math></p><p>Now, for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>10</mn><mo>,</mo><mo>&#160;&#160;</mo><msub><mi>&#945;</mi><mn>10</mn></msub><mo>-</mo><mn>31</mn><msub><mi>&#945;</mi><mn>3</mn></msub><mo>+</mo><mn>228</mn><msub><mi>&#945;</mi><mn>8</mn></msub><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>31</mn><msub><mi>&#945;</mi><mn>9</mn></msub><mo>-</mo><msub><mi>&#945;</mi><mn>10</mn></msub></mrow><mrow><mn>57</mn><msub><mi>&#945;</mi><mn>8</mn></msub></mrow></mfrac><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67775", "previousYearPapers": [{"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the sum of the squares of the reciprocals of the roots <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math>&nbsp;of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>&#955;</mi><mi>x</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><msup><mfenced><mrow><msup><mi>&#945;</mi><mn>3</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>3</mn></msup></mrow></mfenced><mn>2</mn></msup></math>&nbsp;is equal to", "image": null}, "options": [{"id": "PuxtM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>46</mn></math>", "isCorrect": false, "image": null}, {"id": "ialdm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn></math>", "isCorrect": false, "image": null}, {"id": "UAF8h", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn></math>", "isCorrect": true, "image": null}, {"id": "iqJfe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>&#945;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>&#946;</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>15</mn></math></p><p>For equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>&#955;</mi><mi>x</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>&#955;</mi></mrow><mn>3</mn></mfrac></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>9</mn></mfrac></math></p><p>then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>2</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><msup><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>&#945;</mi><mi>&#946;</mi></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msup><mi>&#955;</mi><mn>2</mn></msup><mn>9</mn></mfrac><mo>-</mo><mn>2</mn><mfenced><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac></mfenced><mo>=</mo><mfrac><msup><mi>&#955;</mi><mn>2</mn></msup><mn>9</mn></mfrac><mo>+</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><msup><mi>&#955;</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn></mrow><mn>9</mn></mfrac></math></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>&#945;</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>&#946;</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>15</mn><mo>&#8658;</mo><mfrac><mrow><msup><mi>&#945;</mi><mn>2</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>2</mn></msup></mrow><mrow><msup><mi>&#945;</mi><mn>2</mn></msup><msup><mi>&#946;</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>15</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><msup><mi>&#955;</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn></mrow><mn>9</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mrow><msup><mi>&#945;</mi><mn>2</mn></msup><msup><mi>&#946;</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>15</mn></math>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><msup><mi>&#955;</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn></mrow><mn>9</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>9</mn></mfrac></mstyle></mfrac><mo>=</mo><mn>15</mn></math></p> e": "2021 (01 Sep Shift 2)", "title": "JEE Main 2021 (01 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The number of pairs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced></math>&nbsp;of real numbers, such that whenever <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> is a root of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>a</mi><mi>x</mi><mo>+</mo><mi>b</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math>&nbsp;is also a root of this equation, is :", "image": null}, "options": [{"id": "yAAU5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "isCorrect": true, "image": null}, {"id": "cVreh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "isCorrect": false, "image": null}, {"id": "dCCMj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "isCorrect": false, "image": null}, {"id": "hiCse", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Consider the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>a</mi><mi>x</mi><mo>+</mo><mi>b</mi><mo>=</mo><mn>0</mn></math></p><p>It has two roots (not necessarily real&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math>)</p><p>Either&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mi>&#946;</mi></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#8800;</mo><mi>&#946;</mi></math></p><p><strong>Case (1)</strong> If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mi>&#946;</mi></math>, then it is repeated root. Given than&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math>&nbsp;is also root</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mfenced><mrow><mi>&#945;</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#945;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>2</mn></math></p><p>When&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>2</mn></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mo>-</mo><mn>4</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math></p><p><strong>Case (2)</strong> If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#8800;</mo><mi>&#946;</mi></math>, then four possibilities are there</p><p><strong>(I)</strong>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math></p><p>Here&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math></p><p>Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mo>-</mo><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mo>,</mo><mi>&#945;</mi><mi>&#946;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math></p><p><strong>(II)</strong>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math></p><p>Then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi><mo>=</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>=</mo><mfenced><mrow><mi>&#946;</mi><mo>-</mo><mi>&#945;</mi></mrow></mfenced><mfenced><mrow><mi>&#946;</mi><mo>+</mo><mi>&#945;</mi></mrow></mfenced></math></p><p>Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#8800;</mo><mi>&#946;</mi></math>&nbsp;we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>+</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><msup><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>&#945;</mi><mi>&#946;</mi><mo>-</mo><mn>4</mn></math></p><p>Thus&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mo>=</mo><mn>1</mn><mo>-</mo><mn>2</mn><mi>&#945;</mi><mi>&#946;</mi><mo>-</mo><mn>4</mn></math>&nbsp;which implies</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>. Therefore&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mo>-</mo><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mo>,</mo><mi>&#945;</mi><mi>&#946;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><strong>(III)</strong>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mo>=</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#8800;</mo><mi>&#946;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#945;</mi><mo>=</mo><mo>-</mo><mi>&#946;</mi></math></p><p>Thus&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>2</mn><mo>,</mo><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>,</mo><mi>&#946;</mi><mo>=</mo><mn>1</mn></math></p><p>Therefore&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><strong>(IV)</strong>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mo>=</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#8800;</mo><mi>&#946;</mi></math>&nbsp;is same as (III)</p><p>Therefore we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>&nbsp;pairs of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced></math></p><p>Which are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mo>-</mo><mn>4</mn><mo>,</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf821", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-09-01T14:00:00.000Z", "isVisible": true, "shortName": "2021 (01 Sep Shift 2)", "title": "JEE Main 2021 (01 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d675b6", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVi , "text": "<math><mn>8</mn><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "kscQA", "text": "<math><mn>8</mn><msqrt><mn>5</mn></msqrt></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Let, the&nbsp;roots of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfenced><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>+</mo><msup><mfenced><mrow><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>0</mn></math>&nbsp;are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> and <math><mi>&#946;</mi></math></p><p>We know that the sum and product of roots of a quadratic equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>a</mi><mo>&#8800;</mo><mn>0</mn></math>&nbsp;are respectively&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mi>b</mi><mi>a</mi></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>c</mi><mi>a</mi></mfrac><mo>.</mo></math>&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><mfrac><mn>3</mn><mrow><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mfrac><msup><mfenced><mrow><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mfenced><mrow><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfenced></mfrac><mo>=</mo><mfenced><mrow><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></math> is maximum,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>m</mi><mo>=</mo><mn>0</mn></math></p><p><math><mo>&#8756;</mo></math>&nbsp;the equation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mn>1</mn></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>3</mn></msup><mo>-</mo><msup><mi>&#946;</mi><mn>3</mn></msup><mo>=</mo><mfenced separators=\"|\"><mrow><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><msup><mi>&#945;</mi><mn>2</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>+</mo><mi>&#945;</mi><mi>&#946;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><msup><mfenced separators=\"|\"><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>&#945;</mi><mi>&#946;</mi></msqrt><mfenced separators=\"|\"><mrow><msup><mfenced separators=\"|\"><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mi>&#945;</mi><mi>&#946;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mn>9</mn><mo>-</mo><mn>4</mn></msqrt><mo>&#160;</mo><mfenced separators=\"|\"><mrow><mn>9</mn><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><msqrt><mn>5</mn></msqrt><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d664b5", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 1)", "title": "JEE Main 2019 (09 Apr Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Let <math><mi>p</mi><mo>,</mo><mi>&#160;</mi><mi>q</mi><mo>&#8712;</mo><mi>&#160;</mi><mi>Q</mi><mi>&#160;</mi><mo>.</mo></math> If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></math> is a root of the quadratic equation <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mi>p</mi><mi>x</mi><mo>+</mo><mi>q</mi><mo>=</mo><mn>0</mn><mo>,</mo></math> then&nbsp;", "image": null}, "options": [{"id": "6LYYt", "text": "<math><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>–</mo><mn>4</mn><mi>q</mi><mo>+</mo><mn>12</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "FU2uU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>q</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mi>p</mi><mo>+</mo><mn>14</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "jQixV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mo>&#8211;</mo><mn>4</mn><mi>q</mi><mo>&#8211;</mo><mn>12</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": true, "image": null}, {"id": "kHKvp", "text": "<math><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>–</mo><mn>4</mn><mi>p</mi><mo>–</mo><mn>16</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>In given equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>p</mi><mi>x</mi><mo>+</mo><mi>q</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>p</mi><mo>,</mo><mo>&#160;</mo><mi>q</mi><mo>&#8712;</mo><mi>Q</mi><mo>.</mo></math></p><p>And, we know that the irrational roots of a quadratic equation exist in conjugate pair, if the coefficients are rational.</p><p>Thus,&nbsp;if one root of the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>p</mi><mi>x</mi><mo>+</mo><mi>q</mi><mo>=</mo><mn>0</mn></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>-</mo><msqrt><mn>3</mn></msqrt><mo>,</mo></math>&nbsp;then, the other root will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt><mo>.</mo></math></p><p>We know that the sum and product of the roots of a quadratic equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;are respectively&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mi>b</mi><mi>a</mi></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>c</mi><mi>a</mi></mfrac><mo>.</mo></math></p><p>Therefore, the sum of roots&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>2</mn><mo>-</mo><msqrt><mn>3</mn></msqrt><mo>=</mo><mo>-</mo><mi>p</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mo>=</mo><mo>-</mo><mn>4</mn></math></p><p>And, the product of roots&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mfenced><mrow><mn>2</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mo>=</mo><mi>q</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>q</mi><mo>=</mo><msup><mn>2</mn><mn>2</mn></msup><mo>-</mo><msup><mfenced><msqrt><mn>3</mn></msqrt></mfenced><mn>2</mn></msup><mo>=</mo><mn>1</mn></math></p><p>Thus,&nbsp;we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>q</mi><mo>-</mo><mn>12</mn><mo>=</mo><msup><mfenced><mrow><mo>-</mo><mn>4</mn></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>4</mn><mo>&#215;</mo><mn>1</mn><mo>-</mo><mn>12</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>16</mn><mo>-</mo><mn>16</mn><mo>=</mo><mn>0</mn><mo>.</mo></math></p><p>Thus, the answer is,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>q</mi><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 1)", "title": "JEE Main 2019 (09 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66472", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The number of integral values of <math><mi>m</mi></math> for which the equation, <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mfenced separator ht),$ and\r\n\r\n$\\alpha < \\beta .$ Then $\\sum_{n=0}^{\\infty}\\left(\\alpha^{n}+\\frac{(-1)^{n}}{\\beta^{n}}\\right)$ is equal to :", "image": null}, "options": [{"id": "Igxiu", "text": "$\\frac{1}{1-\\cos \\theta}-\\frac{1}{1+\\sin \\theta}$", "isCorrect": false, "image": null}, {"id": "AQPJc", "text": "$\\frac{1}{1+\\cos \\theta}+\\frac{1}{1-\\sin \\theta}$", "isCorrect": false, "image": null}, {"id": "tPHlI", "text": "$\\frac{1}{1-\\cos \\theta}+\\frac{1}{1+\\sin \\theta}$", "isCorrect": true, "image": null}, {"id": "5rFJM", "text": "$\\frac{1}{1+\\cos \\theta}-\\frac{1}{1-\\sin \\theta}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$x^{2} \\sin \\theta-x(\\sin \\theta \\cdot \\cos \\theta+1)+\\cos \\theta=0$.\r\n\r\n$x^{2} \\sin \\theta-x \\sin \\theta \\cdot \\cos \\theta-x+\\cos \\theta=0$\r\n\r\n$x \\sin \\theta(x-\\cos \\theta)-1(x-\\cos \\theta)=0$\r\n\r\n$(x-\\cos \\theta)(x \\sin \\theta-1)=0$\r\n\r\n$\\therefore x=\\cos \\theta, \\operatorname{cosec} \\theta, \\theta \\in\\left(0,45^{\\circ}\\right)$\r\n\r\n$\\therefore \\alpha=\\cos \\theta, \\beta=\\operatorname{cosec} \\theta$\r\n\r\n$\\sum_{n=0}^{\\infty} \\alpha^{n}=1+\\cos \\theta+\\cos ^{2} \\theta+\\ldots \\infty=\\frac{1}{1-\\cos \\theta}$\r\n\r\n$\\sum_{n=0}^{\\infty} \\frac{(-1)^{n}}{\\beta^{n}}=1-\\frac{1}{\\operatorname{cosec} \\theta}+\\frac{1}{\\operatorname{cosec}^{2} \\theta}-\\frac{1}{\\operatorname{cosec}^{3} \\theta}+\\ldots \\infty$\r\n\r\n$=1-\\sin \\theta+\\sin ^{2} \\theta-\\sin ^{3} \\theta+\\ldots \\infty$\r\n\r\n$=\\frac{1}{1+\\sin \\theta}$\r\n\r\n$\\therefore \\quad \\sum_{n=0}^{\\infty}\\left(\\alpha^{n}+\\frac{(-1)^{n}}{\\beta^{n}}\\right)=\\sum_{n=0}^{\\infty} \\alpha^{n}+\\sum_{n=0}^{\\infty} \\frac{(-1)^{n}}{\\beta^{n}}$\r\n\r\n$=\\frac{1}{1-\\cos \\theta}+\\frac{1}{1+\\sin \\theta} .$", "image": null}, "videoSolution": {"videoId": "98bf5da48a134758b4415c447a548162", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505  Sum of the roots $=-\\frac{k}{81}$\r\n\r\n$\\therefore \\quad \\alpha+\\beta=-\\frac{k}{81} \\Rightarrow \\frac{4}{3}+\\frac{64}{27}=-\\frac{k}{81}$\r\n\r\n$\\Rightarrow \\quad k=-300$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d665be", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The number of all possible positive integral value of <math><mi>&#945;</mi></math> for which the roots of the quadratic equation&nbsp;<math><mn>6</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>11</mn><mi>x</mi><mo>+</mo><mi>&#945;</mi><mo>=</mo><mn>0</mn></math> are rational numbers is:", "image": null}, "options": [{"id": "bmc9C", "text": "<math><mn>5</mn></math>", "isCorrect": false, "image": null}, {"id": "9yNVg", "text": "<math><mn>3</mn></math>", "isCorrect": true, "image": null}, {"id": "pXiH5", "text": "<math><mn>4</mn></math>", "isCorrect": false, "image": null}, {"id": "zBNnO", "text": "<math><mn>2</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>For&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>,&nbsp;we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mo>=</mo><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi
