mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>v</mi></mrow></mfenced></math></p><p>Hence, on taking the intersection of all the above inequalities, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mfrac><mn>49</mn><mn>4</mn></mfrac><mo>,</mo><mi>&#160;</mi><mn>24</mn></mrow></mfenced><mo>.</mo></math><br /><br />Case <math><mo>-</mo><mi>I</mi><mi>I</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>-</mo><mn>5</mn><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>c</mi><mo>&#60;</mo><mn>5</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>v</mi></mfenced></math></p><p>Then, the graph of the quadratic is shown below</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/pwjejsjfraighlufurgrcpuwbgfvjpoiqtnasdczbmartybolf.png\" /><br /><br />Hence, we have&nbsp;<math><mi>f</mi><mfenced separators=\"|\"><mrow><mn>0</mn></mrow></mfenced><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>c</mi><mo>&#60;</mo><mn>4</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>v</mi><mi>i</mi></mrow></mfenced></math></p><p>And,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced separators=\"|\"><mn>2</mn></mfenced><mo>&#62;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>c</mi><mo>&#62;</mo><mn>24</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>v</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>Also,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced separators=\"|\"><mn>3</mn></mfenced><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>c</mi><mo>&#60;</mo><mfrac><mn>49</mn><mn>4</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>v</mi><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>Hence, on taking the intersection of all the above inequalities, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>c</mi><mo>&#8712;</mo><mi>&#981;</mi></math></p><p>Hence, <math><mi>c</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>49</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>,</mo><mi>&#160;</mi><mn>24</mn></mrow></mfenced></math></p><p>Hence, the total number of element in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d665d2", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "If both the roots of the quadratic equation <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>m</mi><mi>x</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math> are real and distinct and they lie in the interval <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>&#160;</mi><mn>5</mn></mrow></mfenced><mo>,</mo></math> then <math><mi>m</mi></math> lies in the interval:<br /><br />Note: In the actual JEE paper interval was <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>&#160;</mi><mn>5</mn></mrow></mfenced></math>", "image": null}, "options": [{"id": "V4sb3", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>5</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "6q2no", "text": "<math><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi> </mi><mn>4</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "DZsS1", "text": "<math><mo>(</mo><mn>5</mn><mo>,</mo><mi> </mi><mn>6</mn><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "yvLSs", "text": "<math><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi> </mi><mn>5</mn></mrow></mfenced></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given roots of <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>m</mi><mi>x</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math> are distinct and lies in <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>&#160;</mi><mn>5</mn></mrow></mfenced><mo>,</mo></math> Following conditions must be true<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>i</mi><mo>)</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mo>&#62;</mo><mn>0</mn><mo>&#8658;</mo><msup><mi>m</mi><mn>2</mn></msup><mo>-</mo><mn>16</mn><mo>&#62;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>m</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mfenced><mrow><mi>m</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mo>&#62;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>m</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mi>&#8734;</mi><mo>,</mo><mi>&#160;</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mo>&#8746;</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi>&#160;</mi><mi>&#8734;</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>i</mi><mi>i</mi><mo>)</mo></math> <math><mi>f</mi><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>&#62;</mo><mn>0</mn><mo>&#8658;</mo><mi>m</mi><mo>&#60;</mo><mn>5</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>i</mi><mi>i</mi><mi>i</mi><mo>)</mo></math> <math><mi>f</mi><mfenced separators=\"|\"><mrow><mn>5</mn></mrow></mfenced><mo>&#62;</mo><mn>0</mn><mo>&#8658;</mo><mi>m</mi><mo>&#60;</mo><mfrac><mrow><mn>29</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mi>&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>i</mi><mi>v</mi><mo>)</mo></math> <math><mn>1</mn><mo>&#60;</mo><mo>-</mo><mfrac><mrow><mi>b</mi></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac><mo>&#60;</mo><mn>5</mn><mo>&#8658;</mo><mn>2</mn><mo>&#60;</mo><mi>m</mi><mo>&#60;</mo><mn>10</mn></math><br /><br />Taking intersection of all conditions, we get <math><mi>m</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi>&#160;</mi><mn>5</mn></mrow></mfenced></math><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a8075e17-6564-4f9a-b182-69e91ed46a96-image.png\" style=\"width: 285px; height: 215px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b99", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "The real number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> for which the equation, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mi>k</mi><mo>=</mo><mn>0</mn></math>&nbsp;has two distinct real roots in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn><mo>]</mo></math>&nbsp;belongs to", "image": null}, "options": [{"id": "y3jIW", "text": "lies between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>.", "image": null, "isCorrect": false}, {"id": "vtBwY", "text": "does not exist.", "image": null, "isCorrect": true}, {"id": "qwBfb", "text": "lies between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>.", "image": null, "isCorrect": false}, {"id": "1bSRD", "text": "lies between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mn>2</mn><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mi>x</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn></math><br /><br />As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>&#62;</mo><mn>0</mn></math> &nbsp;for all <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>f</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;is a strictly increasing function for all&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>.<br /><br />Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;cannot have more than one root.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a8e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "Consider a quadratic equation $a x^2+b x+c=0$, where $2 a+3 b+6 c=0$ and let $g(x)=a \\frac{x^3}{3}+b \\frac{x^2}{2}+c x$.\nStatement 1: The quadratic equation has at least one root in the interval $(0,1)$.\nStatement 2: The Rolle's theorem is applicable to function $g(x)$ on the interval $[0,1]$.", "image": null}, "options": [{"id": "MMqsE", "text": "\nStatement 1 is false, Statement 2 is true.\n", "image": null, "isCorrect": false}, {"id": "w5I68", "text": "\nStatement 1 is true, Statement 2 is false.\n", "image": null, "isCorrect": false}, {"id": "AYypx", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is not a correct explanation for Statement 1.\n", "image": null, "isCorrect": false}, {"id": "N8In2", "text": "\nStatement 1 is true, Statement 2 is true, , Statement 2 is a correct explanation for Statement 1.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $g(x)=\\frac{a x^3}{3}+b \\cdot \\frac{x^2}{2}+c x$\n$$\n\\mathrm{g}^{\\prime}(x)=a x^2+b x+c\n$$\nGiven: $a x^2+b x+c=0$ and $2 a+3 b+6 c=0$\nStatement-2:\n(i) $g(0)=0$ and $g(1)$\n\n$$\n\\begin{aligned}\n& =\\frac{a}{3}+\\frac{b}{2}+c=\\frac{2 a+3 b+6 c}{6} \\\\\n& =\\frac{0}{6}=0 \\\\\n& \\Rightarrow g(0)=g(1)\n\\end{aligned}\n$$\n(ii) $g$ is continuous on $[0,1]$ and differentiable on $(0,1)$\n$\\therefore$ By Rolle's theorem $\\exists k \\in(0,1)$ such that $g^{\\prime}(k)=0$\nThis holds the statement 2. Also, from statement-2, we can say $a x^2+b x+c=0$ has at least one root in $(0,1)$.\nThus statement-1 and 2 both are true and statement-2 is a correct explanation for statement-1.", "image": null}, "videoSolution": null, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65815", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}], "question": {"text": "If the difference between the roots of the equation $x^2+a x+1=0$ is less than $\\sqrt{5}$, then the set of possible values of $a$ is", "image": null}, "options": [{"id": "MAmlA", "text": "\n$(-3,3)$\n", "image": null, "isCorrect": true}, {"id": "6oAef", "text": "\n$(-3, \\infty)$\n", "image": null, "isCorrect": false}, {"id": "CmCNJ", "text": "\n$(3, \\infty)$\n", "image": null, "isCorrect": false}, {"id": "dficm", "text": "\n$(-\\infty,-3)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$x^2+a x+1=0$\n$\\alpha+\\beta=-a \\quad \\alpha \\beta=1$\n$|\\alpha-\\beta|=\\sqrt{(\\alpha+\\beta)^2-4 \\alpha \\beta}$\n$|\\alpha-\\beta|=\\sqrt{a^2-4}$\n$\\sqrt{a^2-4} < \\sqrt{5}$\n$a^2-4 < 5$\n$a^2-9 < 0$\n$a \\in(-3,3)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65780", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "All the values of $m$ for which both roots of the equations $x^2-2 m x+m^2-1=0$ are greater than $-2$ but less than 4 , lie in the interval", "image": null}, "options": [{"id": "qrRW7", "text": "\n−2  < m < 0", "image": null, "isCorrect": false}, {"id": "xpUJ7", "text": "\nm > 3\n", "image": null, "isCorrect": false}, {"id": "gcfjx", "text": "\n−1  < m < 3", "image": null, "isCorrect": true}, {"id": "K1Wip", "text": "\n1  < m < 4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation $x^2-2 m x+m^2-1=0$\n$$\n\\begin{aligned}\n& (x-m)^2-1=0 \\\\\n& (x-m+1)(x-m-1)=0 \\\\\n& x=m-1, m+1 \\\\\n& -2 < m-1 \\text { and } m+1 < 4\n\\end{aligned}\n$$\n$m>-1$ and $m < 3$\n$-1 < m < 3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65704", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "If both the roots of the quadratic equation $x^2-2 k x+k^2+k-5=0$ are less than 5 , then $\\mathrm{k}$ lies in the interval", "image": null}, "options": [{"id": "8Dtdw", "text": "\n$(5,6]$\n", "image": null, "isCorrect": false}, {"id": "0bKwq", "text": "\n$(6, \\infty)$\n", "image": null, "isCorrect": false}, {"id": "No7wp", "text": "\n$(-\\infty, 4)$\n", "image": null, "isCorrect": true}, {"id": "g7Uu0", "text": "\n$[4,5]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\frac{-b}{2 a} < 5 \\\\\n& f(5)>0 \\\\\n& \\Rightarrow k \\in(-\\infty, 4) .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65457", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "If $2 a+3 b+6 c=0(a, b, c \\in R)$ then the quadratic equation $a x^2+b x+c=0$ has", "image": null}, "options": [{"id": "G776q", "text": "\nat least one root in [0, 1]\n", "image": null, "isCorrect": true}, {"id": "Eg0Vb", "text": "\nat least one root in [2, 3]\n", "image": null, "isCorrect": false}, {"id": "QdIrU", "text": "\nat least one root in [4, 5]\n", "image": null, "isCorrect": false}, {"id": "CDdN3", "text": "\nnone of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x)=\\frac{a x^3}{3}+\\frac{b x^2}{2}+c x \\Rightarrow f(0)=0$ and $f(1)=\\frac{a}{3}+\\frac{b}{2}+c=\\frac{2 a+3 b+6 c}{6}=0$\nAlso $f(x)$ is continuous and differentiable in $[0,1]$ and $\\left[0,1]\\right.$. So by Rolle's theorem, $f^{\\prime}(x)=0$. i.e. $a x^2+b x+c=0$ has at least one root in $[0,1]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "648b5a73417cc3fb48d692c8", "title": "N degree equation", "totalQuestions": 25, "questions": [{"_id": "6983c1a98bfdbb243563978a", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $\\mathrm{S}=\\left\\{x^{3}+a x^{2}+b x+c: a, b, c \\in \\mathrm{~N}\\right.$ and $\\left.a, b, c \\leq 20\\right\\}$ be a set of polynomials. Then the number of polynomials in S, which are divisible by $x^{2}+2$, is", "image": null}, "options": [{"id": "64v3M", "text": "10", "isCorrect": true, "image": null}, {"id": "OtZhM", "text": "20", "isCorrect": false, "image": null}, {"id": "mJeeM", "text": "6", "isCorrect": false, "image": null}, {"id": "76O4B", "text": "120", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "If $x^2 + 2$ divides $x^3 + ax^2 + bx + c$, write $x^3 + ax^2 + bx + c = (x^2 + 2)(x + k)$.<br>Expanding: $x^3 + kx^2 + 2x + 2k$.<br>Comparing coefficients: $a = k$, $b = 2$, $c = 2a$.<br>Constraints: $a \\in \\mathbb{N}$, $a \\leq 20$, and $c = 2a \\leq 20 \\Rightarrow a \\leq 10$.<br>So $a \\in \\{1, 2, 3, ..., 10\\}$, giving 10 polynomials.", "image": null}, "videoSolution": {"videoId": "1f090316fb0649659eca2c04b0b3cd0a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HNkcFfGZn5W3S.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HNkcFfGZn5W3S.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1a38bfdbb2435639742", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The smallest positive integral value of $a$, for which all the roots of $x^{4}-a x^{2}+9=0$ are real and distinct, is equal to", "image": null}, "options": [{"id": "xv6eV", "text": "4", "isCorrect": false, "image": null}, {"id": "ZOFle", "text": "9", "isCorrect": false, "image": null}, {"id": "umxxU", "text": "3", "isCorrect": false, "image": null}, {"id": "UzL9R", "text": "7", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $t = x^2$, so the equation becomes $t^2 - at + 9 = 0$.<br>For all four roots of the original equation to be real and distinct, both roots of this quadratic must be positive and distinct.<br>Discriminant $> 0$: $a^2 - 36 > 0 \\Rightarrow |a| > 6$. Since $a > 0$, we need $a > 6$.<br>Product of roots $= 9 > 0$ and sum of roots $= a > 0$, so both roots are positive.<br>The smallest positive integer satisfying $a > 6$ is $a = 7$.", "image": null}, "videoSolution": {"videoId": "ab04e277e0a6473ba2823f81aa66a73d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HwsUStDAV6KnC.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HwsUStDAV6KnC.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1978bfdbb24356396ad", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The sum of all the real solutions of the equation <br> $\\log _{(x+3)}\\left(6 x^{2}+28 x+30\\right)=5-2 \\log _{(6 x+10)}\\left(x^{2}+6 x+9\\right)$ is equal to", "image": null}, "options": [{"id": "4ZWfc", "text": "2", "isCorrect": false, "image": null}, {"id": "kktAA", "text": "1", "isCorrect": false, "image": null}, {"id": "r1lCn", "text": "0", "isCorrect": true, "image": null}, {"id": "K08fj", "text": "4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Note $6x^2+28x+30 = 2(3x+5)(x+3)$,<br>$x^2+6x+9 = (x+3)^2$,<br>$6x+10 = 2(3x+5)$.<br>Let $a = \\log_{(x+3)}[2(3x+5)]$. Then LHS $= a + 1$ and $\\log_{2(3x+5)}(x+3)^2 = \\frac{2}{a}$.<br>Equation becomes $a + 1 = 5 - \\frac{4}{a}$, i.e., $a^2 - 4a + 4 = 0 \\Rightarrow a = 2$.<br>So $\\log_{(x+3)}[2(3x+5)] = 2 \\Rightarrow (x+3)^2 = 6x+10 \\Rightarrow x^2 = 1 \\Rightarrow x = 1$ or $x = -1$.<br>Both satisfy domain conditions (bases $> 0$, $\\neq 1$; arguments $> 0$).<br>Sum $= 1 + (-1) = 0$.", "image": null}, "videoSolution": {"videoId": "1fa6a232f5734ae0b338ac9200df8f9c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lBnQAcibUWFMi.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lBnQAcibUWFMi.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1928bfdbb2435639666", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "If $\\alpha$ and $\\beta(\\alpha<\\beta)$ are the roots of the equation $(-2+\\sqrt{3})(|\\sqrt{x}-3|)+(x-6 \\sqrt{x})+(9-2 \\sqrt{3})=0, x \\geqslant 0$, then $\\sqrt{\\frac{\\beta}{\\alpha}}+\\sqrt{\\alpha \\beta}$ is equal to :", "image": null}, "options": [{"id": "8606544595", "text": "8", "isCorrect": false, "image": null}, {"id": "8606544598", "text": "11", "isCorrect": false, "image": null}, {"id": "8606544596", "text": "9", "isCorrect": false, "image": null}, {"id": "8606544597", "text": "10", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $t = \\sqrt{x} \\geq 0$. The equation becomes $(-2+\\sqrt{3})|t-3| + (t^2 - 6t) + (9 - 2\\sqrt{3}) = 0$.<br>Since $t^2 - 6t + 9 = (t-3)^2$, we get $(t-3)^2 + (\\sqrt{3}-2)|t-3| - 2\\sqrt{3} = 0$.<br>Let $u = |t-3| \\geq 0$: $u^2 + (\\sqrt{3}-2)u - 2\\sqrt{3} = 0$.<br>Discriminant $= (\\sqrt{3}-2)^2 + 8\\sqrt{3} = 7 + 4\\sqrt{3} = (2+\\sqrt{3})^2$.<br>$u = \\frac{(2-\\sqrt{3}) \\pm (2+\\sqrt{3})}{2}$, giving $u = 2$ or $u = -\\sqrt{3}$ (rejected).<br>$|t-3| = 2 \\Rightarrow t = 5$ or $t = 1$, so $x = 25$ or $x = 1$.<br>$\\alpha = 1, \\beta = 25$.<br>$\\sqrt{\\beta/\\alpha} + \\sqrt{\\alpha\\beta} = \\sqrt{25} + \\sqrt{25} = 5 + 5 = 10$.", "image": null}, "videoSolution": {"videoId": "b2232c58224e4c3a8d8c9513b1cf841c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/R2rjt1tKEmPIk.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/R2rjt1tKEmPIk.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1918bfdbb243563965d", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "A building construction work can be completed by two masons A and B together in 22.5 days. Mason A alone can complete the construction work in 24 days less than mason B alone. Then mason A alone will complete the construction work in :", "image": null}, "options": [{"id": "8606544600", "text": "30 days", "isCorrect": false, "image": null}, {"id": "8606544601", "text": "36 days", "isCorrect": true, "image": null}, {"id": "8606544599", "text": "24 days", "isCorrect": false, "image": null}, {"id": "8606544602", "text": "42 days", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let A take $a$ days and B take $a + 24$ days.<br>Together: $\\frac{1}{a} + \\frac{1}{a+24} = \\frac{1}{22.5} = \\frac{2}{45}$.<br>$\\frac{2a+24}{a(a+24)} = \\frac{2}{45}$<br>$45(2a+24) = 2a(a+24)$<br>$90a + 1080 = 2a^2 + 48a$<br>$a^2 - 21a - 540 = 0$<br>$(a-36)(a+15) = 0 \\Rightarrow a = 36$.<br>Mason A alone completes the work in 36 days.", "image": null}, "videoSolution": {"videoId": "08ad9dbcb2ba49b98647ce255dda87e4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/A0KEEsYsPu2Dj.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/A0KEEsYsPu2Dj.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": >±</mo><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>t</mi><mo>≈</mo><mn>2</mn><mo>.</mo><mn>73</mn><mo>,</mo><mo> </mo><mo>-</mo><mn>0</mn><mo>.</mo><mn>73</mn><mfenced><mtext>not possible</mtext></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>t</mi><mo>≈</mo><mn>2</mn><mo>.</mo><mn>73</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>e</mi><mrow><mi>sin</mi><mi>x</mi></mrow></msup><mo>≈</mo><mn>2</mn><mo>.</mo><mn>73</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>sin</mi><mi>x</mi><mo>≈</mo><msub><mi>log</mi><mi>e</mi></msub><mfenced><mrow><mn>2</mn><mo>.</mo><mn>73</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>sin</mi><mi>x</mi><mo>&gt;</mo><mn>1</mn><mo>→</mo><mtext>Not possible</mtext></math></p><p>So no solutions will be possible for the given equation.</p>", "image": null}, "videoSolution": {"videoId": "e85bb8c75d4b4ff9876ad5ea63e8b207", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/2r7FsZ26UrbyP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/2r7FsZ26UrbyP.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-16T11:44:29.217Z"}, {"_id": "6682bd31ba0e94a3c4025b1a", "type": "numerical", "level": 2, "questionLabels": [], "question": {"text": "The number of real solutions of the equation \\(x\\left(x^2+3|x|+5|x-1|+6|x-2|\\right)=0\\) is ______.", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<blockquote><p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mfenced><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mo>|</mo><mi>x</mi><mo>|</mo><mo>+</mo><mn>5</mn><mo>|</mo><mi>x</mi><mo>-</mo><mn>1</mn><mo>|</mo><mo>+</mo><mn>6</mn><mo>|</mo><mi>x</mi><mo>-</mo><mn>2</mn><mo>|</mo></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mn>0</mn><mo> </mo><mtext>or</mtext><mo> </mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mo>|</mo><mi>x</mi><mo>|</mo><mo>+</mo><mn>5</mn><mo>|</mo><mi>x</mi><mo>-</mo><mn>1</mn><mo>|</mo><mo>+</mo><mn>6</mn><mo>|</mo><mi>x</mi><mo>-</mo><mn>2</mn><mo>|</mo><mo>=</mo><mn>0</mn></math></p><p>We know that sum of all positive terms can never be zero,</p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mo>|</mo><mi>x</mi><mo>|</mo><mo>+</mo><mn>5</mn><mo>|</mo><mi>x</mi><mo>-</mo><mn>1</mn><mo>|</mo><mo>+</mo><mn>6</mn><mo>|</mo><mi>x</mi><mo>-</mo><mn>2</mn><mo>|</mo></math> can never be zero for any value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>,</p><p>So there is no value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> which satisfies the above equation<br/>Hence, only solution is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>, i.e. number of solution is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> .</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-16T11:49:34.961Z"}, {"_id": "648b5a71417cc3fb48d685ed", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}], "question": {"text": "The number of points, where the curve&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><msup><mi>e</mi><mrow><mn>8</mn><mi>x</mi></mrow></msup><mo>-</mo><msup><mi>e</mi><mrow><mn>6</mn><mi>x</mi></mrow></msup><mo>-</mo><mn>3</mn><msup><mi>e</mi><mrow><mn>4</mn><mi>x</mi></mrow></msup><mo>-</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mn>1</mn><mo>,</mo><mi>x</mi><mo>&#8712;</mo><mi mathvariant=\"normal\">&#8477;</mi></math>&nbsp;cuts&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis, is equal to............<br />&nbsp;", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mrow><mn>8</mn><mi>x</mi></mrow></msup><mo>-</mo><msup><mi>e</mi><mrow><mn>6</mn><mi>x</mi></mrow></msup><mo>-</mo><mn>3</mn><msup><mi>e</mi><mrow><mn>4</mn><mi>x</mi></mrow></msup><mo>-</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>e</mi><mrow><mn>4</mn><mi>x</mi></mrow></msup><mo>-</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>-</mo><mn>3</mn><mo>-</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>4</mn><mi>x</mi></mrow></msup></mfrac><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>e</mi><mrow><mn>4</mn><mi>x</mi></mrow></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>4</mn><mi>x</mi></mrow></msup></mfrac><mo>+</mo><mn>2</mn><mo>-</mo><mfenced><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup></mfrac></mrow></mfenced><mo>=</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup></mfrac></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mfenced><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup></mfrac></mrow></mfenced><mo>=</mo><mn>3</mn></math></p><p>Now let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup></mfrac></mrow></mfenced><mo>=</mo><mi>t</mi></math></p><p>So, the equation becomes</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>t</mi><mn>2</mn></msup><mo>-</mo><mi>t</mi><mo>-</mo><mn>5</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>21</mn></msqrt></mrow><mn>2</mn></mfrac></math>, ignoring negative sign as exponential function are positive,</p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>21</mn></msqrt></mrow><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>e</mi><mrow><mn>4</mn><mi>x</mi></mrow></msup><mo>-</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>21</mn></msqrt></mrow><mn>2</mn></mfrac><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>&nbsp;which is quadratic equation in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup></math>&nbsp;with upward parabola,&nbsp;</p><p>Now by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>.</mo><mi>M</mi><mo>&#8805;</mo><mi>G</mi><mo>.</mo><mi>M</mi></math>&nbsp;we get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup></mfrac><mo>&#8805;</mo><mn>2</mn></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>21</mn></msqrt></mrow><mn>2</mn></mfrac><mo>&#62;</mo><mn>2</mn></math>, hence it will cut at two distinct point,</p><p>Hence, there will be two solution.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68424", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>,</mo><mo>&#160;</mo><mi>&#947;</mi></math>&nbsp;be the three&nbsp; roots of the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>=</mo><mo>-</mo><mi>&#945;</mi></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>3</mn></msup><mo>+</mo><mn>2</mn><msup><mi>c</mi><mn>3</mn></msup><mo>-</mo><mn>3</mn><msup><mi>&#945;</mi><mn>3</mn></msup><mo>-</mo><mn>6</mn><msup><mi>&#946;</mi><mn>3</mn></msup><mo>-</mo><mn>8</mn><msup><mi>&#947;</mi><mn>3</mn></msup></math>&nbsp;is equal to&nbsp;", "image": null}, "options": [{"id": "cepjt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>155</mn><mn>8</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "767A0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn></math>", "image": null, "isCorrect": false}, {"id": "8lJ7N", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>169</mn><mn>8</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "yWw6N", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>19</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>Given that roots of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>,</mo><mo>&#160;</mo><mi>&#947;</mi></math></p><p>Also given that</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>=</mo><mo>-</mo><mi>&#945;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p>Now let us apply the relation between the roots of the cubic equation with the coefficients.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>+</mo><mi>&#947;</mi><mo>=</mo><mn>0</mn><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mi>&#946;</mi><mi>&#947;</mi><mo>=</mo><mo>-</mo><mi>c</mi><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>iii</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced><mn>1</mn></mfenced><mo>=</mo><mo>-</mo><mi>c</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>c</mi><mo>=</mo><mn>1</mn><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>iv</mi><mo>)</mo></math></p><p>On substituting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>&nbsp;in eq&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math>&nbsp;we get,</p><p><math xmlns=\"http: 3.org/1998/Math/MathML\"><mi>t</mi><mo>-</mo><mfrac><mn>1</mn><mi>t</mi></mfrac><mo>=</mo><mi>z</mi></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><mn>8</mn><mi>z</mi><mo>+</mo><mn>15</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>z</mi><mo>=</mo><mo>-</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>5</mn></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>-</mo><mfrac><mn>1</mn><mi>t</mi></mfrac><mo>=</mo><mo>-</mo><mn>3</mn></math>&nbsp; or&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>-</mo><mfrac><mn>1</mn><mi>t</mi></mfrac><mo>=</mo><mo>-</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>t</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>&nbsp; or&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><mi>t</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>3</mn><mo>&#177;</mo><msqrt><mn>13</mn></msqrt></mrow><mn>2</mn></mfrac><mo>,</mo><mfrac><mrow><mo>-</mo><mn>5</mn><mo>&#177;</mo><msqrt><mn>29</mn></msqrt></mrow><mn>2</mn></mfrac></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mi>x</mi></msup><mo>=</mo><mfrac><mrow><mo>-</mo><mn>3</mn><mo>+</mo><msqrt><mn>13</mn></msqrt></mrow><mn>2</mn></mfrac><mo>,</mo><mfrac><mrow><mo>-</mo><mn>5</mn><mo>+</mo><msqrt><mn>29</mn></msqrt></mrow><mn>2</mn></mfrac><mo>=</mo><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></math>&nbsp;(rejecting negative values as exponential is positive function)</p><p>And both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>3</mn><mo>+</mo> o><msub><mi>&#945;</mi><mn>7</mn></msub></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mn>1</mn></msub><mo>,</mo><msub><mi>&#945;</mi><mn>2</mn></msub><mo>,</mo><mo>&#8230;</mo><mo>,</mo><msub><mi>&#945;</mi><mn>7</mn></msub></math> be the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>7</mn></msup><mo>+</mo><mn>3</mn><msup><mi>x</mi><mn>5</mn></msup><mo>-</mo><mn>13</mn><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>15</mn><mi>x</mi><mo>=</mo><mn>0</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>1</mn></msub></mfenced><mo>&#8805;</mo><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>2</mn></msub></mfenced><mo>&#8805;</mo><mo>&#8230;</mo><mo>&#8805;</mo><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>7</mn></msub></mfenced></math>.<br />Then, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mn>1</mn></msub><msub><mi>&#945;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#945;</mi><mn>3</mn></msub><msub><mi>&#945;</mi><mn>4</mn></msub><mo>+</mo><msub><mi>&#945;</mi><mn>5</mn></msub><msub><mi>&#945;</mi><mn>6</mn></msub></math>&nbsp;is equal to _______", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<p>Given:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>7</mn></msup><mo>+</mo><mn>3</mn><msup><mi>x</mi><mn>5</mn></msup><mo>-</mo><mn>13</mn><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>15</mn><mi>x</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mfenced><mrow><msup><mi>x</mi><mn>6</mn></msup><mo>+</mo><mn>3</mn><msup><mi>x</mi><mn>4</mn></msup><mo>-</mo><mn>13</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>15</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>&nbsp;is one of the root.</p><p>Now,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>x</mi><mn>6</mn></msup><mo>+</mo><mn>3</mn><msup><mi>x</mi><mn>4</mn></msup><mo>-</mo><mn>13</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>15</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p>Put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mi>t</mi></math>, then we have</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>t</mi><mn>3</mn></msup><mo>+</mo><mn>3</mn><msup><mi>t</mi><mn>2</mn></msup><mo>-</mo><mn>13</mn><mi>t</mi><mo>-</mo><mn>15</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>t</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mfenced><mrow><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>t</mi><mo>+</mo><mn>5</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>t</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mfenced><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mfenced><mrow><mi>t</mi><mo>+</mo><mn>5</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>3</mn><mo>,</mo><mi>t</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>,</mo><mi>t</mi><mo>=</mo><mo>-</mo><mn>5</mn></math></p><p>Now we are getting&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><mo>,</mo><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mo>-</mo><mn>1</mn><mo>,</mo><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mo>-</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mo>&#177;</mo><msqrt><mn>3</mn></msqrt><mo>,</mo><mo>&#160;</mo><mo>&#177;</mo><mi>i</mi><mo>,</mo><mo>&#177;</mo><msqrt><mn>5</mn></msqrt><mi>i</mi></math></p><p>From the given condition <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>1</mn></msub></mfenced><mo>&#8805;</mo><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>2</mn></msub></mfenced><mo>&#8805;</mo><mo>&#8230;</mo><mo>.</mo><mo>&#8805;</mo><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>7</mn></msub></mfenced></math></p><p>We can clearly say that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>7</mn></msub></mfenced><mo>=</mo><mn>0</mn></math> and</p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>6</mn></msub></mfenced><mo>=</mo><msqrt><mn>5</mn></msqrt><mo>=</mo><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>5</mn></msub></mfenced></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>4</mn></msub></mfenced><mo>=</mo><msqrt><mn>3</mn></msqrt><mo>=</mo><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>3</mn></msub></mfenced></math>&nbsp;and&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>2</mn></msub></mfenced><mo>=</mo><mn>1</mn><mo>=</mo><mfenced close=\"|\" open=\"|\"><msub><mi>&#945;</mi><mn>1</mn></msub></mfenced></math></p><p>So we can have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mn>1</mn></msub><mo>=</mo><msqrt><mn>5</mn></msqrt><mi>i</mi><mo>,</mo><mo>&#160;</mo><msub><mi>&#945;</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><msqrt><mn>5</mn></msqrt><mi>i</mi><mo>,</mo><mo>&#160;</mo><msub><mi>&#945;</mi><mn>3</mn></msub><mo>=</mo><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mn>4</mn></msub><mo>=</mo><mo>-</mo><msqrt><mn>3</mn></msqrt><mo>,</mo><mo>&#160;</mo><msub><mi>&#945;</mi><mn>     function selectTopic(index) {

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);

            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `

            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">

              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);

    function renderAllMath(target) {

        try {
          renderMathInElement(el, {
