  <script>
    const data = {"index": 9, "chapterId": "61602525fb63982f7225f1d8", "chapter": "Quadratic Equation", "exam": "JEE Main", "subject": "Mathematics", "totalTopics": 7, "totalQuestions": 199, "downloadTime": "2026-10-08 20:37:48", "topics": [{"index": 1, "topicId": "648b5a73417cc3fb48d692c3", "title": "Relation between Roots and Coefficients", "totalQuestions": 135, "questions": [{"_id": "69d8073d81239f6567c4f368", "type": "singleCorrect", "question": {"text": "Consider the quadratic equation $(n^2 - 2n + 2)x^2 - 3x + (n^2 - 2n + 2)^2 = 0$, $n \\in \\mathbb{R}$. Let $\\alpha$ be the minimum value of the product of its roots and $\\beta$ be the maximum value of the sum of its roots. Then the sum of the first six terms of the G.P., whose first term is $\\alpha$ and the common ratio is $\\dfrac{\\alpha}{\\beta}$, is :", "image": null}, "options": [{"id": "ZV4Az", "text": "$\\dfrac{61}{37}$", "isCorrect": false, "image": null}, {"id": "N5Wwz", "text": "$\\dfrac{121}{81}$", "isCorrect": false, "image": null}, {"id": "qdTis", "text": "$\\dfrac{364}{243}$", "isCorrect": true, "image": null}, {"id": "zzSe3", "text": "$\\dfrac{1093}{729}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given quadratic equation is $(n^2 - 2n + 2)x^2 - 3x + (n^2 - 2n + 2)^2 = 0$.<br><br>Let $k = n^2 - 2n + 2 = (n-1)^2 + 1$. Since $(n-1)^2 \\ge 0$ for all $n \\in \\mathbb{R}$, the minimum value of $k$ is $1$ at $n=1$.<br><br>The product of the roots is given by $P = \\dfrac{(n^2 - 2n + 2)^2}{n^2 - 2n + 2} = n^2 - 2n + 2 = k$.<br><br>The minimum value of the product of the roots is $\\alpha = \\min(k) = 1$.<br><br>The sum of the roots is given by $S = \\dfrac{3}{n^2 - 2n + 2} = \\dfrac{3}{k}$.<br><br>The maximum value of the sum of the roots occurs when $k$ is minimum. Thus, $\\beta = \\max\\left(\\dfrac{3}{k}\\right) = \\dfrac{3}{1} = 3$.<br><br>We are given a Geometric Progression (G.P.) whose first term is $a = \\alpha = 1$ and common ratio is $r = \\dfrac{\\alpha}{\\beta} = \\dfrac{1}{3}$.<br><br>The sum of the first six terms of this G.P. is:<br><br>$S_6 = a \\dfrac{1 - r^6}{1 - r} = 1 \\cdot \\dfrac{1 - \\left(\\dfrac{1}{3}\\right)^6}{1 - \\dfrac{1}{3}}$<br><br>$S_6 = \\dfrac{1 - \\dfrac{1}{729}}{\\dfrac{2}{3}} = \\dfrac{\\dfrac{728}{729}}{\\dfrac{2}{3}}$<br><br>$S_6 = \\dfrac{728}{729} \\times \\dfrac{3}{2} = \\dfrac{364}{243}$<br><br>Answer: $\\dfrac{364}{243}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "13e4dd85c6d24c91810aca045989df08", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HyFT5fcXxOkIq.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HyFT5fcXxOkIq.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074a81239f6567c4f3fe", "type": "singleCorrect", "question": {"text": "Let one root of the quadratic equation in $x$: $(k^2 - 15k + 27)x^2 + 9(k-1)x + 18 = 0$ be twice the other. Then the length of the latus rectum of the parabola $y^2 = 6kx$ is equal to:", "image": null}, "options": [{"id": "hJQCB", "text": "$4$", "isCorrect": false, "image": null}, {"id": "XKMTu", "text": "$6$", "isCorrect": false, "image": null}, {"id": "LJx8j", "text": "$8$", "isCorrect": false, "image": null}, {"id": "0ekvc", "text": "$12$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the roots of the given quadratic equation be $\\alpha$ and $2\\alpha$.<br><br>Sum of the roots:<br>$\\alpha + 2\\alpha = \\dfrac{-9(k-1)}{k^2 - 15k + 27}$<br>$3\\alpha = \\dfrac{-9(k-1)}{k^2 - 15k + 27} \\Rightarrow \\alpha = \\dfrac{-3(k-1)}{k^2 - 15k + 27}$<br><br>Product of the roots:<br>$\\alpha \\cdot 2\\alpha = \\dfrac{18}{k^2 - 15k + 27}$<br>$2\\alpha^2 = \\dfrac{18}{k^2 - 15k + 27} \\Rightarrow \\alpha^2 = \\dfrac{9}{k^2 - 15k + 27}$<br><br>Substituting the value of $\\alpha$ from the sum into the product equation:<br>$\\left( \\dfrac{-3(k-1)}{k^2 - 15k + 27} \\right)^2 = \\dfrac{9}{k^2 - 15k + 27}$<br><br>$\\dfrac{9(k-1)^2}{(k^2 - 15k + 27)^2} = \\dfrac{9}{k^2 - 15k + 27}$<br><br>Since $k^2 - 15k + 27 \\neq 0$, we can simplify to:<br>$(k-1)^2 = k^2 - 15k + 27$<br><br>$k^2 - 2k + 1 = k^2 - 15k + 27$<br><br>$13k = 26 \\Rightarrow k = 2$<br><br>The equation of the parabola is $y^2 = 6kx$. Substituting $k = 2$, we get:<br>$y^2 = 12x$<br><br>The length of the latus rectum of a parabola $y^2 = 4ax$ is $4a$, which is the coefficient of $x$.<br><br>Therefore, the length of the latus rectum is $12$.<br><br>Answer: $12$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "b3a156f503bc4f74b705f926d2c23024", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/83x584ghTvyPr.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/83x584ghTvyPr.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075d81239f6567c4f4de", "type": "singleCorrect", "question": {"text": "Let $\\alpha, \\beta$ be the roots of the equation $x^2 - x + p = 0$ and $\\gamma, \\delta$ be the roots the equation $x^2 - 4x + q = 0$; $p, q \\in \\mathbf{Z}$. If $\\alpha, \\beta, \\gamma, \\delta$ are in G.P., then $|p + q|$ equals :", "image": null}, "options": [{"id": "5UbXE", "text": "$16$", "isCorrect": false, "image": null}, {"id": "lYoKx", "text": "$32$", "isCorrect": false, "image": null}, {"id": "FyKU9", "text": "$34$", "isCorrect": true, "image": null}, {"id": "l8F1e", "text": "$38$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\alpha = a, \\beta = ar, \\gamma = ar^2, \\delta = ar^3$ be the terms of the G.P.<br><br>From the given quadratic equations, the sum of the roots are:<br><br>$\\alpha + \\beta = 1 \\Rightarrow a(1 + r) = 1$<br><br>$\\gamma + \\delta = 4 \\Rightarrow ar^2(1 + r) = 4$<br><br>Dividing the second equation by the first equation:<br><br>$\\dfrac{ar^2(1 + r)}{a(1 + r)} = \\dfrac{4}{1}$<br><br>$r^2 = 4 \\Rightarrow r = 2$ or $r = -2$<br><br>If $r = 2$, then $a(1 + 2) = 1 \\Rightarrow a = \\dfrac{1}{3}$.<br><br>The product of the roots of the first equation is $p = \\alpha \\beta = a^2 r = \\left(\\dfrac{1}{3}\\right)^2 \\times 2 = \\dfrac{2}{9}$. Since $p \\in \\mathbf{Z}$, $r = 2$ is rejected.<br><br>If $r = -2$, then $a(1 - 2) = 1 \\Rightarrow a = -1$.<br><br>The product of the roots of the first equation is $p = \\alpha \\beta = a^2 r = (-1)^2 \\times (-2) = -2$.<br><br>The product of the roots of the second equation is $q = \\gamma \\delta = (ar^2)(ar^3) = a^2 r^5 = (-1)^2 \\times (-2)^5 = -32$.<br><br>Both $p$ and $q$ are integers, which satisfies the given condition.<br><br>Therefore, $|p + q| = |-2 - 32| = |-34| = 34$.<br><br>Answer: $34$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "2ad62ea7c87c4f6b9a32acb73cbc51df", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cKELM9qT6BHHX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cKELM9qT6BHHX.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073081239f6567c4f2d6", "type": "singleCorrect", "question": {"text": "Let $\\tan A, \\tan B$, where $A, B \\in \\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$, be the roots of the quadratic equation $x^2 - 2x - 5 = 0$. Then $20\\sin^2\\left(\\dfrac{A+B}{2}\\right)$ is equal to:", "image": null}, "options": [{"id": "K4g7k", "text": "$10 + \\sqrt{10}$", "isCorrect": false, "image": null}, {"id": "fsYZH", "text": "$10 - 2\\sqrt{10}$", "isCorrect": false, "image": null}, {"id": "lF2wM", "text": "$10 - 3\\sqrt{10}$", "isCorrect": true, "image": null}, {"id": "fIaAP", "text": "$10 - \\sqrt{10}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given that $\\tan A$ and $\\tan B$ are the roots of the quadratic equation $x^2 - 2x - 5 = 0$.<br><br>Sum of the roots: $\\tan A + \\tan B = 2$<br><br>Product of the roots: $\\tan A \\tan B = -5$<br><br>Using the tangent addition formula:<br><br>$\\tan(A+B) = \\dfrac{\\tan A + \\tan B}{1 - \\tan A \\tan B} = \\dfrac{2}{1 - (-5)} = \\dfrac{2}{6} = \\dfrac{1}{3}$<br><br>Since $A, B \\in \\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$ and their product $\\tan A \\tan B = -5 < 0$, one angle is positive and the other is negative. This implies $A+B \\in \\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$.<br><br>Since $\\tan(A+B) = \\dfrac{1}{3} > 0$, the angle $A+B$ must lie in the first quadrant, i.e., $A+B \\in \\left(0, \\dfrac{\\pi}{2}\\right)$. Thus, $\\cos(A+B)$ is positive.<br><br>$\\cos(A+B) = \\dfrac{1}{\\sqrt{1 + \\tan^2(A+B)}} = \\dfrac{1}{\\sqrt{1 + \\left(\\dfrac{1}{3}\\right)^2}} = \\dfrac{3}{\\sqrt{10}}$<br><br>We need to find the value of $20\\sin^2\\left(\\dfrac{A+B}{2}\\right)$. Using the half-angle identity $\\sin^2\\theta = \\dfrac{1 - \\cos(2\\theta)}{2}$:<br><br>$20\\sin^2\\left(\\dfrac{A+B}{2}\\right) = 20 \\left( \\dfrac{1 - \\cos(A+B)}{2} \\right) = 10(1 - \\cos(A+B))$<br><br>Substituting the value of $\\cos(A+B)$:<br><br>$10\\left(1 - \\dfrac{3}{\\sqrt{10}}\\right) = 10 - \\dfrac{30}{\\sqrt{10}} = 10 - 3\\sqrt{10}$<br><br>Answer: $10 - 3\\sqrt{10}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "50b740008907443fbb0adb7903de6b66", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/AfrUiyTyuo8qb.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/AfrUiyTyuo8qb.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073081239f6567c4f2d1", "type": "singleCorrect", "question": {"text": "Let $a, b \\in \\mathbb{C}$. Let $\\alpha, \\beta$ be the roots of the equation $x^2 + ax + b = 0$. If $\\beta - \\alpha = \\sqrt{11}$ and $\\beta^2 - \\alpha^2 = 3i\\sqrt{11}$, then $(\\beta^3 - \\alpha^3)^2$ is equal to:", "image": null}, "options": [{"id": "2NZzE", "text": "$160$", "isCorrect": false, "image": null}, {"id": "ehBNV", "text": "$176$", "isCorrect": true, "image": null}, {"id": "4jNoq", "text": "$194$", "isCorrect": false, "image": null}, {"id": "WpMDR", "text": "$187$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\beta - \\alpha = \\sqrt{11}$ and $\\beta^2 - \\alpha^2 = 3i\\sqrt{11}$<br><br>$\\beta + \\alpha = \\dfrac{\\beta^2 - \\alpha^2}{\\beta - \\alpha} = \\dfrac{3i\\sqrt{11}}{\\sqrt{11}} = 3i$<br><br>Using the identity $(\\beta - \\alpha)^2 = (\\beta + \\alpha)^2 - 4\\alpha\\beta$<br><br>$(\\sqrt{11})^2 = (3i)^2 - 4\\alpha\\beta$<br><br>$11 = -9 - 4\\alpha\\beta$<br><br>$4\\alpha\\beta = -20 \\Rightarrow \\alpha\\beta = -5$<br><br>Now, $\\beta^3 - \\alpha^3 = (\\beta - \\alpha)(\\beta^2 + \\alpha\\beta + \\alpha^2)$<br><br>$\\beta^3 - \\alpha^3 = (\\beta - \\alpha)((\\beta + \\alpha)^2 - \\alpha\\beta)$<br><br>$\\beta^3 - \\alpha^3 = \\sqrt{11}((3i)^2 - (-5))$<br><br>$\\beta^3 - \\alpha^3 = \\sqrt{11}(-9 + 5) = -4\\sqrt{11}$<br><br>Squaring both sides, we get:<br><br>$(\\beta^3 - \\alpha^3)^2 = (-4\\sqrt{11})^2 = 16 \\times 11 = 176$<br><br>Answer: $176$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "b7e781eb6a624166a8bc0a3a5545895f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/tgTJHkpOALDxv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/tgTJHkpOALDxv.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074381239f6567c4f3b5", "type": "singleCorrect", "question": {"text": "If $\\alpha=1$ and $\\beta=1+i\\sqrt{2}$, where $i=\\sqrt{-1}$ are two roots of the equation $x^3+ax^2+bx+c=0$, $a,b,c \\in \\mathbb{R}$, then $\\int_{-1}^{1}(x^3+ax^2+bx+c)dx$ is equal to:", "image": null}, "options": [{"id": "97nJF", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "PPB3F", "text": "$-4$", "isCorrect": false, "image": null}, {"id": "gH9vj", "text": "$-8$", "isCorrect": true, "image": null}, {"id": "LCYQ4", "text": "$-10$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $a, b, c \\in \\mathbb{R}$, the complex roots of the equation $x^3+ax^2+bx+c=0$ must occur in conjugate pairs.<br><br>Given roots are $\\alpha = 1$ and $\\beta = 1+i\\sqrt{2}$.<br><br>The third root must be $\\gamma = 1-i\\sqrt{2}$.<br><br>The polynomial is given by:<br><br>$x^3+ax^2+bx+c = (x-1)(x-(1+i\\sqrt{2}))(x-(1-i\\sqrt{2}))$<br><br>$= (x-1)((x-1)^2 - (i\\sqrt{2})^2)$<br><br>$= (x-1)(x^2 - 2x + 1 + 2)$<br><br>$= (x-1)(x^2 - 2x + 3)$<br><br>$= x^3 - 3x^2 + 5x - 3$<br><br>We need to evaluate the integral:<br><br>$I = \\int_{-1}^{1} (x^3 - 3x^2 + 5x - 3) dx$<br><br>Using the property of definite integrals $\\int_{-a}^{a} f(x) dx = 0$ for odd functions and $2\\int_{0}^{a} f(x) dx$ for even functions:<br><br>$I = \\int_{-1}^{1} x^3 dx - 3\\int_{-1}^{1} x^2 dx + 5\\int_{-1}^{1} x dx - 3\\int_{-1}^{1} 1 dx$<br><br>$I = 0 - 3(2)\\int_{0}^{1} x^2 dx + 0 - 3(2)\\int_{0}^{1} 1 dx$<br><br>$I = -6 \\left[ \\dfrac{x^3}{3} \\right]_{0}^{1} - 6 \\left[ x \\right]_{0}^{1}$<br><br>$I = -6 \\left( \\dfrac{1}{3} \\right) - 6(1)$<br><br>$I = -2 - 6 = -8$<br><br>Answer: $-8$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "1dba34382a0d4940998a9beaca1237ea", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/waJ21WW1h2vgf.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/waJ21WW1h2vgf.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8072981239f6567c4f286", "type": "singleCorrect", "question": {"text": "Let $\\alpha, \\beta$ be the roots of the equation $x^2 - 3x + r = 0$, and $\\dfrac{\\alpha}{2}, 2\\beta$ be the roots of the equation $x^2 + 3x + r = 0$. If the roots of the equation $x^2 + 6x = m$ are $2\\alpha + \\beta + 2r$ and $\\alpha - 2\\beta - \\dfrac{r}{2}$, then $m$ is equal to:", "image": null}, "options": [{"id": "kQN4D", "text": "$-135$", "isCorrect": false, "image": null}, {"id": "QI4HV", "text": "$-567$", "isCorrect": false, "image": null}, {"id": "UhPEO", "text": "$135$", "isCorrect": false, "image": null}, {"id": "KDCCI", "text": "$567$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "From the first equation $x^2 - 3x + r = 0$, the sum and product of the roots are:<br><br>$\\alpha + \\beta = 3$<br><br>$\\alpha \\beta = r$<br><br>From the second equation $x^2 + 3x + r = 0$, the sum and product of the roots are:<br><br>$\\dfrac{\\alpha}{2} + 2\\beta = -3$<br><br>$\\left(\\dfrac{\\alpha}{2}\\right)(2\\beta) = r \\Rightarrow \\alpha \\beta = r$<br><br>We have a system of linear equations in terms of $\\alpha$ and $\\beta$:<br><br>$\\alpha + \\beta = 3$<br><br>$\\alpha + 4\\beta = -6$<br><br>Subtracting the first equation from the second gives:<br><br>$3\\beta = -9 \\Rightarrow \\beta = -3$<br><br>Substituting $\\beta = -3$ into $\\alpha + \\beta = 3$ gives:<br><br>$\\alpha = 6$<br><br>Now, we can find $r$:<br><br>$r = \\alpha \\beta = 6 \\times (-3) = -18$<br><br>The roots of the third equation $x^2 + 6x - m = 0$ are given as $2\\alpha + \\beta + 2r$ and $\\alpha - 2\\beta - \\dfrac{r}{2}$. Let us calculate their values:<br><br>$R_1 = 2(6) + (-3) + 2(-18) = 12 - 3 - 36 = -27$<br><br>$R_2 = 6 - 2(-3) - \\dfrac{-18}{2} = 6 + 6 + 9 = 21$<br><br>The product of the roots of the equation $x^2 + 6x - m = 0$ is $-m$. Therefore:<br><br>$-m = R_1 R_2 = (-27)(21)$<br><br>$-m = -567 \\Rightarrow m = 567$<br><br>Answer: $567$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "5283f9a6ee7843d8aeb48d63eab2cd86", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/B9oUFT0aX4lwQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/B9oUFT0aX4lwQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1aa8bfdbb2435639795", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "If $\\alpha, \\beta$, where $\\alpha<\\beta$, are the roots of the equation $\\lambda x^{2}-(\\lambda+3) x+3=0$ such that $\\frac{1}{\\alpha}-\\frac{1}{\\beta}=\\frac{1}{3}$, then the sum of all possible values of $\\lambda$ is", "image": null}, "options": [{"id": "BPlFD", "text": "8", "isCorrect": false, "image": null}, {"id": "uyv5L", "text": "6", "isCorrect": true, "image": null}, {"id": "fOBGA", "text": "2", "isCorrect": false, "image": null}, {"id": "RBhzk", "text": "4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\alpha + \\beta = \\frac{\\lambda+3}{\\lambda}$, $\\alpha\\beta = \\frac{3}{\\lambda}$.<br>$\\frac{1}{\\alpha} - \\frac{1}{\\beta} = \\frac{\\beta - \\alpha}{\\alpha\\beta} = \\frac{1}{3}$, so $\\beta - \\alpha = \\frac{\\alpha\\beta}{3} = \\frac{1}{\\lambda}$.<br>$(\\beta - \\alpha)^2 = (\\alpha+\\beta)^2 - 4\\alpha\\beta$:<br>$\\frac{1}{\\lambda^2} = \\frac{(\\lambda+3)^2}{\\lambda^2} - \\frac{12}{\\lambda}$<br>$1 = (\\lambda+3)^2 - 12\\lambda = \\lambda^2 - 6\\lambda + 9$<br>$\\lambda^2 - 6\\lambda + 8 = 0 \\Rightarrow \\lambda = 2$ or $\\lambda = 4$.<br>Both values satisfy $\\alpha < \\beta$ (verified). Sum $= 2 + 4 = 6$.", "image": null}, "videoSolution": {"videoId": "5c427a3ee65e4fb28ceadf8b21c4294f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/BlwNECAxYJAif.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/BlwNECAxYJAif.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c18c8bfdbb2435639623", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $\\alpha, \\beta$ be the roots of the quadratic equation $12 x^{2}-20 x+3 \\lambda=0, \\lambda \\in \\mathbf{Z}$. If $\\frac{1}{2} \\leqslant|\\beta-\\alpha| \\leqslant \\frac{3}{2}$, then the sum of all possible values of $\\lambda$ is :", "image": null}, "options": [{"id": "UQ3B6", "text": "1", "isCorrect": false, "image": null}, {"id": "pxwGA", "text": "6", "isCorrect": false, "image": null}, {"id": "GewWC", "text": "3", "isCorrect": true, "image": null}, {"id": "V5S84", "text": "4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For $12x^2-20x+3\\lambda=0$: $\\alpha+\\beta=\\frac{5}{3}$, $\\alpha\\beta=\\frac{\\lambda}{4}$.<br>$|\\beta-\\alpha|=\\frac{\\sqrt{25-9\\lambda}}{3}$<br>Given $\\frac{1}{2}\\leq\\frac{\\sqrt{25-9\\lambda}}{3}\\leq\\frac{3}{2}$<br>$\\frac{9}{4}\\leq 25-9\\lambda\\leq\\frac{81}{4}$<br>From left: $\\lambda\\leq\\frac{91}{36}\\approx 2.53$<br>From right: $\\lambda\\geq\\frac{19}{36}\\approx 0.53$<br>Since $\\lambda\\in\\mathbb{Z}$: $\\lambda\\in\\{1,2\\}$. Sum $=3$.", "image": null}, "videoSolution": {"videoId": "3b49098897f045e88f73e1be388cb3cf", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/iJe7JQCfe1sQd.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/iJe7JQCfe1sQd.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1778bfdbb2435639532", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f9  & x=\\frac{-2 \\pm \\sqrt{4+28}}{2}=-1 \\pm 2 \\sqrt{2}\\end{aligned}$\nOnly $2 \\sqrt{2}-1$ is acceptable root\nFor $x < \\frac{3}{2}$\n$x^2-2 x+3-4=0$\n$\\begin{aligned}\n& x^2-2 x-1=0 \\\\\n& x=\\frac{2 \\pm \\sqrt{4+4}}{2}=1 \\pm \\sqrt{2}\n\\end{aligned}$\nOnly $1-\\sqrt{2}$ is acceptable\nSum of the square $=(1-\\sqrt{2})^2+(2 \\sqrt{2}-1)^2$\n$=6(2-\\sqrt{2})$", "image": null}, "videoSolution": {"videoId": "8a5c86ec09bc4bcb801f1384cfbc48cf", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/rs7TyHBZGSmzo.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/rs7TyHBZGSmzo.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d9760e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-28T09:00:00.000Z", "isVisible": true, "shortName": "2025 (28 Jan Shift 1)", "title": "JEE Main 2025 (28 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee8ec8b73881fdaea0eb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d97609", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T14:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 2)", "title": "JEE Main 2025 (22 Jan Shift 2)"}], "question": {"text": "Let $\\alpha_\\theta$ and $\\beta_\\theta$ be the distinct roots of $2 x^2+(\\cos \\theta) x-1=0, \\theta \\in(0,2 \\pi)$. If m and M are the minimum and the maximum values of $\\alpha_\\theta^4+\\beta_\\theta^4$, then $16(M+m)$ equals :", "image": null}, "options": [{"id": "ldYeN", "text": "24", "image": null, "isCorrect": false}, {"id": "Ca0lN", "text": "25", "image": null, "isCorrect": true}, {"id": "hufMP", "text": "17", "image": null, "isCorrect": false}, {"id": "Sgt1D", "text": "27", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & 2 x^2+(\\cos \\theta) x-1=0 \\\\ & \\alpha_\\theta+\\beta_\\theta=\\frac{-\\cos \\theta}{2} \\\\ & \\alpha_\\theta \\cdot \\beta_\\theta=\\frac{-1}{2} \\\\ & \\alpha_\\theta^2+\\beta_\\theta^2=\\left(\\alpha_\\theta+\\beta_\\theta\\right)^2-2 \\alpha_\\theta \\beta_\\theta \\frac{\\cos ^2 \\theta}{4}+1\\end{aligned}$\n$\\begin{aligned}\n& \\alpha_\\theta^4+\\beta_\\theta^4=\\left(a_\\theta^2+\\beta_\\theta^2\\right)^2-2 \\alpha_\\theta^2 \\beta_\\theta^2=\\left(\\frac{\\cos ^2 \\theta}{4}+1\\right)^2-\\frac{2}{4} \\\\\n& =\\left(\\frac{\\cos ^2 \\theta}{4}+1\\right)^2-\\frac{1}{2}\n\\end{aligned}$\n\nMaximum when $\\cos \\theta=1$\n$\\begin{aligned}\n& M=\\left(\\frac{1}{4}+1\\right)^2-\\frac{1}{2} \\\\\n& M=\\frac{17}{16}\n\\end{aligned}$\n\nMinimum when $\\cos \\theta=0$\n$\\begin{aligned}\n& m=1-\\frac{1}{2}=\\frac{1}{2} \\\\\n& 16(M+m)=16\\left(\\frac{17}{16}+\\frac{1}{2}\\right)=25\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "0620a573021047b6b9b439bda1417737", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/DO1Qt7xSsEe9y.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/DO1Qt7xSsEe9y.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d97609", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T14:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 2)", "title": "JEE Main 2025 (22 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446760970e6e9ab542d2c0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda71", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 2)", "title": "JEE Main 2024 (09 Apr Shift 2)"}], "question": {"text": "Let $\\alpha, \\beta ; \\alpha>\\beta$, be the roots of the equation $x^2-\\sqrt{2} x-\\sqrt{3}=0$. Let $\\mathrm{P}_n=\\alpha^n-\\beta^n, n \\in \\mathrm{N}$. Then $(11 \\sqrt{3}-10 \\sqrt{2}) \\mathrm{P}_{10}+(11 \\sqrt{2}+10) \\mathrm{P}_{11}-11 \\mathrm{P}_{12}$ is equal to", "image": null}, "options": [{"id": "7PKPs", "text": "$10 \\sqrt{3} \\mathrm{P}_9$", "image": null, "isCorrect": true}, {"id": "1lZEg", "text": "$11 \\sqrt{3} P_9$", "image": null, "isCorrect": false}, {"id": "uqkY9", "text": "$10 \\sqrt{2} \\mathrm{P}_9$", "image": null, "isCorrect": false}, {"id": "LV52i", "text": "$11 \\sqrt{2} \\mathrm{P}_9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\mathrm{x}^2-\\sqrt{2 \\mathrm{x}}-\\sqrt{3}=0\\left\\langle_\\beta^\\alpha\\right. \\\\\n& \\alpha^{\\mathrm{n}+2}-\\sqrt{2} \\alpha^{\\mathrm{n}+1}-\\sqrt{3} \\alpha^{\\mathrm{n}}=0 \\\\\n& \\text { and } \\beta^{\\mathrm{n}+2}-\\sqrt{2} \\beta^{\\mathrm{n}+1}-\\sqrt{3} \\beta^{\\mathrm{n}}=0\n\\end{aligned}$<br />Subtracting\n$\\begin{aligned}\n& \\left(\\alpha^{\\mathrm{n}+2}-\\beta^{\\mathrm{n}+2}\\right)-\\sqrt{2}\\left(\\alpha^{\\mathrm{n}+1}-\\beta^{\\mathrm{n}+1}\\right)-\\sqrt{3}\\left(\\alpha^{\\mathrm{n}}-\\beta^{\\mathrm{n}}\\right)=0 \\\\\n& \\Rightarrow \\mathrm{P}_{\\mathrm{n}+2}-\\sqrt{2} \\mathrm{P}_{\\mathrm{n}+1}-\\sqrt{3} \\mathrm{P}_{\\mathrm{n}}=0\n\\end{aligned}$\n$\\begin{aligned} & \\text { Put } \\mathrm{n}=10 \\\\ & \\mathrm{P}_{12}-\\sqrt{2} \\mathrm{P}_{11}-\\sqrt{3} \\mathrm{P}_{10}=0 \\\\ & \\mathrm{n}=9 \\\\ & \\mathrm{P}_{11}-\\sqrt{2} \\mathrm{P}_{10}-\\sqrt{3} \\mathrm{P}_9=0 \\\\ & 11\\left(\\sqrt{3} \\cdot \\mathrm{P}_{10}+\\sqrt{2} \\mathrm{P}_{11}-\\mathrm{P}_{11}\\right)-10\\left(\\sqrt{2} \\mathrm{P}_{10}-\\mathrm{P}_{11}\\right) \\\\ & =0-10\\left(-\\sqrt{3} \\mathrm{P}_9\\right)=10 \\sqrt{3} \\mathrm{P}_9\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda71", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 2)", "title": "JEE Main 2024 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446757970e6e9ab542d26d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}], "question": {"text": "Let $\\alpha, \\beta$ be the roots of the equation $x^2+2 \\sqrt{2} x-1=0$. The quadratic equation, whose roots are $\\alpha^4+\\beta^4$ and $\\frac{1}{10}\\left(\\alpha^6+\\beta^6\\right)$, is :", "image": null}, "options": [{"id": "ORUHt", "text": "$x^2-190 x+9466=0$", "image": null, "isCorrect": false}, {"id": "VCCNc", "text": "$x^2-180 x+9506=0$", "image": null, "isCorrect": false}, {"id": "yEV3p", "text": "$x^2-195 x+9506=0$", "image": null, "isCorrect": true}, {"id": "qKf7B", "text": "$x^2-195 x+9466=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & x^2+2 \\sqrt{2} x-1=0 \\\\ & \\alpha+\\beta=-2 \\sqrt{2} \\\\ & \\alpha \\beta=-1 \\\\ & \\alpha^4+\\beta^4=\\left(\\alpha^2+\\beta^2\\right)^2-2 \\alpha^2 \\beta^2 \\\\ & =\\left((\\alpha+\\beta)^2-2 \\alpha \\beta\\right)^2-2(\\alpha \\beta)^2 \\\\ & =(8+2)^2-2(-1)^2 \\\\ & =100-2=98 \\\\ & \\alpha^6+\\beta^6=\\left(\\alpha^3+\\beta^3\\right)^2-2 \\alpha^3 \\beta^3 \\\\ & =\\left((\\alpha+\\beta)\\left((\\alpha+\\beta)^2-3 \\alpha \\beta\\right)^2-2(\\alpha \\beta)^3\\right.\\end{aligned}$\n$\\begin{aligned} & =(-2 \\sqrt{2}(8+3))^2+2 \\\\ & =(8)(121)+2=970 \\\\ & \\frac{1}{10}\\left(\\alpha^6+\\beta^6\\right)=97 \\\\ & x^2-(98+97) x+(98)(97)=0 \\\\ & \\Rightarrow x^2-195 x+9506=0\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446742970e6e9ab542d1ac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 1)", "title": "JEE Main 2024 (08 Apr Shift 1)"}], "question": {"text": "The sum of all the solutions of the equation $(8)^{2 x}-16 \\cdot(8)^x+48=0$ is :", "image": null}, "options": [{"id": "UqsAt", "text": "$1+\\log _8(6)$", "image": null, "isCorrect": true}, {"id": "clPdj", "text": "$1+\\log _6(8)$", "image": null, "isCorrect": false}, {"id": "x7nMq", "text": "$\\log _8(6)$", "image": null, "isCorrect": false}, {"id": "aoitr", "text": "$\\log _8(4)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & (8)^{2 x}-16 \\cdot(8)^x+48=0 \\\\ & \\text { Put } 8^{\\mathrm{x}}=\\mathrm{t} \\\\ & \\mathrm{t}^2-16+48=0 \\\\ & \\Rightarrow \\mathrm{t}=4 \\text { or } \\mathrm{t}=12 \\\\ & \\Rightarrow 8^x=4 \\quad 8^x=12 \\\\ & \\Rightarrow \\mathrm{x}=\\log _8 \\mathrm{x} \\quad \\mathrm{x}=\\log _8 12 \\\\ & \\end{aligned}$\nsum of solution $=\\log _8 4+\\log _8 12$\n$\\begin{aligned} & =\\log _8 48=\\log _8(6.8) \\\\ & =1+\\log _8 6\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 1)", "title": "JEE Main 2024 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644673b970e6e9ab542d16c", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 2)", "title": "JEE Main 2024 (06 Apr Shift 2)"}], "question": {"text": "Let $\\alpha, \\beta$ be roots of $x^2+\\sqrt{2} x-8=0$. If $\\mathrm{U}_{\\mathrm{n}}=\\alpha^{\\mathrm{n}}+\\beta^n$, then $\\frac{\\mathrm{U}_{10}+\\sqrt{2} \\mathrm{U}_9}{2 \\mathrm{U}_8}$ is equal to______", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "$\\begin{aligned} & \\frac{\\alpha^{10}+\\beta^{10}+\\sqrt{2}\\left(\\alpha^9+\\beta^9\\right)}{2\\left(\\alpha^8+\\beta^8\\right)} \\\\ & \\frac{\\alpha^8\\left(\\alpha^2+\\sqrt{2} \\alpha\\right)+\\beta^8\\left(\\beta^2+\\sqrt{2} \\beta\\right)}{2\\left(\\alpha^8+\\beta^8\\right)} \\\\ & \\frac{8 \\alpha^8+8 \\beta^8}{2\\left(\\alpha^8+\\beta^8\\right)}=4\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 2)", "title": "JEE Main 2024 (06 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644672f970e6e9ab542d0fd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 1)", "title": "JEE Main 2024 (06 Apr Shift 1)"}], "question": {"text": "Let $\\alpha, \\beta$ be the distinct roots of the equation $x^2-\\left(t^2-5 t+6\\right) x+1=0, t \\in \\mathbb{R}$ and $a_n=\\alpha^n+\\beta^n$. Then the minimum value of $\\frac{a_{2023}+a_{2025}}{a_{2024}}$ is", "image": null}, "options": [{"id": "AzeNX", "text": "$-1 / 4$", "image": null, "isCorrect": false}, {"id": "0xvwB", "text": "$-1 / 4$", "image": null, "isCorrect": true}, {"id": "NycMQ", "text": "$-1 / 2$", "image": null, "isCorrect": false}, {"id": "7e9V8", "text": "$1 / 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "by newton's theorem\n$\\begin{aligned}\n& \\mathrm{a}_{\\mathrm{n}+2}-\\left(\\mathrm{t}^2-5 \\mathrm{t}+6\\right) \\mathrm{a}_{\\mathrm{n}+1}+\\mathrm{a}_{\\mathrm{n}}=0 \\\\\n& \\therefore \\mathrm{a}_{2025}+\\mathrm{a}_{2023}=\\left(\\mathrm{t}^2-5 \\mathrm{t}+6\\right) \\mathrm{a}_{2024} \\\\\n& \\therefore \\frac{\\mathrm{a}_{2025}+\\mathrm{a}_{2023}}{\\mathrm{a}_{2024}}=\\mathrm{t}^2-5 \\mathrm{t}+6 \\\\\n& \\because \\mathrm{t}^2-5 \\mathrm{t}+6=\\left(\\mathrm{t}-\\frac{5}{2}\\right)^2-\\frac{1}{4} \\\\\n& \\therefore \\text { minimum value }=-\\frac{1}{4}\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "278c05a5ffdb466f8c25e4685168315f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/I1INp78BQu11G.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/I1INp78BQu11G.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 1)", "title": "JEE Main 2024 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446727970e6e9ab542d0b3", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}], "question": {"text": "The number of real solutions of the equation $x|x+5|+2|x+7|-2=0$ is_________", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "Case I : $x \\geq-5$\n$\\begin{aligned}\n& x^2+5 x+2 x+12=0 \\\\\n& x^2+7 x+12=0 \\\\\n& x=-3,-4\n\\end{aligned}$\nCase II : $-7 < \\mathrm{x} < -5$\n$-x^2-5 x+2 x+14-2=0$\n$\\begin{aligned}\n& -x^2-3 x+12=0 \\\\\n& x=\\frac{-3 \\pm \\sqrt{9+48}}{2} \\\\\n& =\\frac{-3 \\pm \\sqrt{57}}{2} \\\\\n& x=\\frac{-3-\\sqrt{57}}{2}, \\frac{-3+\\sqrt{57}}{2} \\text { (rejected) }\n\\end{aligned}$\nCase III : $\\mathrm{x} \\leq-7$\n$\\begin{aligned}\n& -x^2-5 x-2 x-14-2=0 \\\\\n& x^2+7 x+16=0 \\\\\n& D=49-64 < 0\n\\end{aligned}$\nNo solutions\nNo. of solutions $=3$", "image": null}, "videoSolution": {"videoId": "ea604ba4b6e54c108d363da8c0601f2f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/a4Be9dklZ22Mw.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/a4Be9dklZ22Mw.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446708970e6e9ab542cf93", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}], "question": {"text": "If 2 and 6 are the roots of the equation $a x^2+b x+1=0$, then the quadratic equation, whose roots are $\\frac{1}{2 a+b}$ and $\\frac{1}{6 a+b}$, is :", "image": null}, "options": [{"id": "E2rsy", "text": "$2 x^2+11 x+12=0$", "image": null, "isCorrect": false}, {"id": "LJs2D", "text": "$x^2+8 x+12=0$", "image": null, "isCorrect": true}, {"id": "jxsIx", "text": "$4 x^2+14 x+12=0$", "image": null, "isCorrect": false}, {"id": "XqHtB", "text": "$x^2+10 x+16=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Sum }=8=-\\frac{b}{a} \\\\ & \\text { Product }=12=\\frac{1}{a} \\quad \\Rightarrow a=\\frac{1}{12} \\\\ & b=-\\frac{2}{3} \\\\ & 2 a+b=\\frac{2}{12}-\\frac{2}{3}=-\\frac{1}{2} \\\\ & 6 a+b=\\frac{6}{12}-\\frac{2}{3}=-\\frac{1}{6} \\\\ & \\text { sum }=-8 \\\\ & P=12 \\\\ & x^2+8 x+12=0\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd31ba0e94a3c4025b19", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>β</mi></math> be the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>q</mi><mi>x</mi><mo>−</mo><mi>r</mi><mo>=</mo><mn>0</mn></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>≠</mo><mn>0</mn></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>,</mo><mo> </mo><mi>q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> be the consecutive terms of a non-constant G.P and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>α</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mi>β</mi></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>α</mi><mo>−</mo><mi>β</mi></mrow></mfenced><mn>2</mn></msup></math> is:", "image": null}, "options": [{"id": "ynR7Q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>80</mn><mn>9</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "6ycNE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math>", "image": null, "isCorrect": false}, {"id": "XpZkl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>20</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "8cfEH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo> </mo><mtext>and</mtext><mo> </mo><mi>β</mi></math> be the roots of equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>q</mi><mi>x</mi><mo>-</mo><mi>r</mi><mo>=</mo><mn>0</mn></math></p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>+</mo><mi>β</mi><mo>=</mo><mo>-</mo><mfrac><mi>q</mi><mi>p</mi></mfrac><mo>,</mo><mo> </mo><mi>α</mi><mi>β</mi><mo>=</mo><mo>-</mo><mfrac><mi>r</mi><mi>p</mi></mfrac></math></p><p>It is given that, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>α</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mi>β</mi></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mstyle displaystyle=\"true\"><mi>α</mi><mo>+</mo><mi>β</mi></mstyle><mstyle displaystyle=\"true\"><mi>α</mi><mi>β</mi></mstyle></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn></mstyle><mstyle displaystyle=\"true\"><mn>4</mn></mstyle></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mstyle displaystyle=\"true\"><mi>q</mi></mstyle><mstyle displaystyle=\"true\"><mi>r</mi></mstyle></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn></mstyle><mstyle displaystyle=\"true\"><mn>4</mn></mstyle></mfrac></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>,</mo><mi>q</mi><mo>,</mo><mi>r</mi></math> are in GP</p><p>So, common ratio of this GP will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>q</mi><mi>p</mi></mfrac><mo>=</mo><mfrac><mi>r</mi><mi>q</mi></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>p</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>q</mi><mi>x</mi><mo>-</mo><mi>r</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mi>q</mi><mi>p</mi></mfrac><mi>x</mi><mo>-</mo><mfrac><mi>r</mi><mi>p</mi></mfrac><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn> YQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-16T11:56:43.059Z"}, {"_id": "6682bd31ba0e94a3c4025b18", "type": "numerical", "level": 2, "questionLabels": [], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>,</mo><mi>b</mi><mo>,</mo><mi>c</mi></math> be the length of three sides of a triangle satisfying the condition <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup></mrow></mfenced><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><mi>b</mi><mfenced><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow></mfenced></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mfenced><mrow><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mn>0</mn></math>. If the set of all possible values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> is in the interval <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>α</mi><mo>,</mo><mi>β</mi></mrow></mfenced><mo>,</mo></math> then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mfenced><mrow><msup><mi>α</mi><mn>2</mn></msup><mo>+</mo><msup><mi>β</mi><mn>2</mn></msup></mrow></mfenced></math> is equal to _______.", "image": null}, "options": [], "correctValue": "36", "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup></mrow></mfenced><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><mi>b</mi><mfenced><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow></mfenced><mi>x</mi><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>a</mi><mn>2</mn></msup><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><mi>a</mi><mi>b</mi><mi>x</mi><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><mi>b</mi><mi>c</mi><mi>x</mi><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mfenced><mrow><mi>a</mi><mi>x</mi><mo>−</mo><mi>b</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>b</mi><mi>x</mi><mo>−</mo><mi>c</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mi>x</mi><mo>−</mo><mi>b</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo> </mo><mi>b</mi><mi>x</mi><mo>−</mo><mi>c</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mi>x</mi><mo>=</mo><mi>b</mi><mo>,</mo><mo> </mo><mi>b</mi><mi>x</mi><mo>=</mo><mi>c</mi></math></p><p>Now, we know that the sum of two sides is always greater than the third side of a triangle,</p><p>Now, taking <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>+</mo><mi>b</mi><mo>&gt;</mo><mi>c</mi></math> we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mo>+</mo><mi>a</mi><mi>x</mi><mo>&gt;</mo><mi>b</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mo>+</mo><mi>a</mi><mi>x</mi><mo>&gt;</mo><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mi>x</mi><mo>−</mo><mn>1</mn><mo>&lt;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mn>1</mn><mo>-</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mo>&lt;</mo><mi>x</mi><mo>&lt;</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>Similarly, for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mo>+</mo><mi>c</mi><mo>&gt;</mo><mi>a</mi></math> we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>-</mo><mn>1</mn><mo>&gt;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>∈</mo><mfenced><mrow><mo>-</mo><mo>∞</mo><mo>,</mo><mfrac><mrow><mo>−</mo><mn>1</mn><mo>−</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac></mrow></mfenced><mo>∪</mo><mfenced><mrow><mfrac><mrow><mo>−</mo><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mo>,</mo><mo>∞</mo></mrow></mfenced><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>And for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>+</mo><mi>a</mi><mo>&gt;</mo><mi>b</mi></math> we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>&gt;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>∈</mo><mi>R</mi><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>So, from the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced><mo> </mo><mo>&amp;</mo><mo> </mo><mfenced><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math> we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>∈</mo><mfenced><mrow><mfrac><mrow><mo>-</mo><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>α</mi><mo>=</mo><mfrac><mrow><msqrt><mn>5</mn></msqrt><mo>−</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>,</mo><mo> </mo><mi>β</mi><mo>=</mo><mfrac><mrow><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>1</mn></mrow><mn>2</mn></mfrac></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mfenced><mrow><msup><mi>α</mi><mn>2</mn></msup><mo>+</mo><msup><mi>β</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mn>12</mn><mfenced><mfrac><mrow><msup><mfenced><mrow><msqrt><mn>5</mn></msqrt><mo>−</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></mrow><mn>4</mn></mfrac></mfenced><mo>=</mo><mn>36</mn></math></p>", "image": null}, "videoSolution": {"videoId": "d382f83af2454be68a2600887a4282fa", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/QMmhq2lMrXhk5.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/QMmhq2lMrXhk5.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-16T12:17:51.882Z"}, {"_id": "6682bd31ba0e94a3c4025b17", "type": "singleCorrect", "level": 3, "questionLabels": [], "question": {"text": "<p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&lt;</mo><mi>c</mi><mo>&lt;</mo><mi>b</mi><mo>&lt;</mo><mi>a</mi></math>, let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>–</mo><mn>2</mn><mi>c</mi><mo>)</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi>b</mi><mo>+</mo><mi>c</mi><mo>–</mo><mn>2</mn><mi>a</mi><mo>)</mo><mi>x</mi><mo>+</mo><mo>(</mo><mi>c</mi><mo>+</mo><mi>a</mi><mo>–</mo><mn>2</mn><mi>b</mi><mo>)</mo><mo>=</mo><mn>0</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>≠</mo><mn>1</mn></math> be one of its root. Then, among the two statements</p><p>(I) If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>∈</mo><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mo> </mo><mn>0</mn></mrow></mfenced></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> cannot be the geometric mean of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math>.</p><p>(II) If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>∈</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo> </mo><mn>1</mn></mrow></mfenced></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> may be the geometric mean of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math>.</p>", "image": null}, "options": [{"id": "SmIqA", "text": "Both (I) and (II) are true", "image": null, "isCorrect": true}, {"id": "DSIVo", "text": "Neither (I) nor (II) is true", "image": null, "isCorrect": false}, {"id": "rDYc6", "text": "Only (II) is true", "image": null, "isCorrect": false}, {"id": "CrWbA", "text": "Only (I) is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mo>(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>–</mo><mn>2</mn><mi>c</mi><mo>)</mo><mo> </mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi>b</mi><mo>+</mo><mi>c</mi><mo>–</mo><mn>2</mn><mi>a</mi><mo>)</mo><mo> </mo><mi>x</mi><mo>+</mo><mo>(</mo><mi>c</mi><mo>+</mo><mi>a</mi><mo>–</mo><mn>2</mn><mi>b</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>f</mi><mo>(</mo><mn>1</mn><mo>)</mo><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>–</mo><mn>2</mn><mi>c</mi><mo>+</mo><mi>b</mi><mo>+</mo><mi>c</mi><mo>–</mo><mn>2</mn><mi>a</mi><mo>+</mo><mi>c</mi><mo>+</mo><mi>a</mi><mo>–</mo><mn>2</mn><mi>b</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>f</mi><mo>(</mo><mn>1</mn><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p>Using product of roots,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>α</mi><mo>·</mo><mn>1</mn><mo>=</mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>α</mi><mo>=</mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac></math></p><p>If, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mo>&lt;</mo><mi>α</mi><mo>&lt;</mo><mn>0</mn></math></p><p>Statement-I:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>-</mo><mn>1</mn><mo>&lt;</mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac><mo>&lt;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>b</mi><mo>+</mo><mi>c</mi><mo>&lt;</mo><mn>2</mn><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mo>&gt;</mo><mfrac><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow><mn>2</mn></mfrac></math></p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> cannot be G.M. between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math>. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mtext>as</mtext><mo> </mo><mi>A</mi><mo>.</mo><mi>M</mi><mo>≥</mo><mi>G</mi><mo>.</mo><mi>M</mi></mrow></mfenced></math></p><p>So, statement I is correct.</p><p>Statement-II:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>0</mn><mo>&lt;</mo><mi>α</mi><mo>&lt;</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>0</mn><mo>&lt;</mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac><mo>&lt;</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac><mo>&gt;</mo><mn>0</mn><mo> </mo><mo>&amp;</mo><mo> </mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac><mo>&lt;</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac><mo>&gt;</mo><mn>0</mn><mo> </mo><mo>&amp;</mo><mo> </mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi><mo>-</mo><mi>a</mi><mo>-</mo><mi>b</mi><mo>+</mo><mn>2</mn><mi>c</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac><mo>&lt;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac><mo>&gt;</mo><mn>0</mn><mo> </mo><mo>&amp;</mo><mo> </mo><mfrac><mrow><mn>3</mn><mi>c</mi><mo>-</mo><mn>3</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfrac><mo>&lt;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>b</mi><mo>&lt;</mo><mfrac><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow><mn>2</mn></mfrac><mo> </mo><mo>&amp;</mo><mo> </mo><mi>b</mi><mo>&gt;</mo><mi>c</mi></math>  </p><p>Therefore, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> may be the G.M. between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math>. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mtext>as</mtext><mo> </mo><mi>A</mi><mo>.</mo><mi>M</mi><mo>≥</mo><mi>G</mi><mo>.</mo><mi>M</mi></mrow></mfenced></math></p><p>So, statement II is also correct.</p>", "image": null}, "videoSolution": {"videoId": "45535940b2324c3db8f8d0cd8683d8d8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/0K8GRq6Si7LdU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/0K8GRq6Si7LdU.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}], "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-16T12:18:28.528Z"}, {"_id": "6682bd30ba0e94a3c4025b16", "type": "numerical", "level": 3, "questionLabels": [], "question": {"text": "Let \\(\\alpha, \\beta \\in\\) be roots of equation \\(x^2-70 x+\\lambda=0\\), where \\(\\frac{\\lambda}{2}, \\frac{\\lambda}{3} \\notin\\). If \\(\\lambda\\) assumes the minimum possible value, then \\(\\frac{(\\sqrt{\\alpha-1}+\\sqrt{\\beta-1})(\\lambda+35)}{\\boldsymbol{|\\alpha-\\beta|}}\\) is equal to :", "image": null}, "options": [], "correctValue": "60", "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>70</mn><mi>x</mi><mo>+</mo><mi>λ</mi><mo>=</mo><mn>0</mn></math></p><p>Sum of the roots will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>+</mo><mi>β</mi><mo>=</mo><mn>70</mn></math></p><p>Product of roots will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mi>β</mi><mo>=</mo><mi>λ</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>α</mi><mo>(</mo><mn>70</mn><mo>-</mo><mi>α</mi><mo>)</mo><mo>=</mo><mi>λ</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>d</mi><mi>λ</mi></mrow><mrow><mi>d</mi><mi>α</mi></mrow></mfrac><mo>=</mo><mn>70</mn><mo>-</mo><mn>2</mn><mi>α</mi></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>λ</mi></math> is increasing for all <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>≤</mo><mn>35</mn></math></p><p>And <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> does not divide <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>λ</mi></math> so taking  <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>=</mo><mn>5</mn></math> we get, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>β</mi><mo>=</mo><mn>70</mn><mo>-</mo><mi>α</mi><mo>=</mo><mn>65</mn></math> </p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>As</mtext><mo> </mo><mtext>for</mtext><mo> </mo><mi>α</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo> </mo><mi>β</mi><mo>=</mo><mn>69</mn><mo> </mo><mo>&amp;</mo><mo> </mo><mtext>for</mtext><mo> </mo><mi>α</mi><mo>=</mo><mn>4</mn><mo>,</mo><mo> </mo><mi>β</mi><mo>=</mo><mn>66</mn></math> which is not possible as they are multiple of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo> </mo><mo>&amp;</mo><mo> </mo><mn>3</mn></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>=</mo><mn>5</mn><mo>,</mo><mo> </mo><mi>β</mi><mo>=</mo><mn>65</mn><mo>,</mo><mo> </mo><mi>λ</mi><mo>=</mo><mn>325</mn></math></p><p>Now solving,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mfenced><mrow><msqrt><mi>α</mi><mo>-</mo><mn>1</mn></msqrt><mo>+</mo><msqrt><mi>β</mi><mo>-</mo><mn>1</mn></msqrt></mrow></mfenced><mfenced><mrow><mi>λ</mi><mo>+</mo><mn>35</mn></mrow></mfenced></mrow><mrow><mo>|</mo><mi>α</mi><mo>-</mo><mi>β</mi><mo>|</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfenced><mrow><msqrt><mn>5</mn><mo>-</mo><mn>1</mn></msqrt><mo>+</mo><msqrt><mn>65</mn><mo>-</mo><mn>1</mn></msqrt></mrow></mfenced><mfenced><mrow><mn>325</mn><mo>+</mo><mn>35</mn></mrow></mfenced></mrow><mrow><mo>|</mo><mn>5</mn><mo>-</mo><mn>65</mn><mo>|</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfenced><mrow><mn>2</mn><mo>+</mo><mn>8</mn></mrow></mfenced><mo>·</mo><mn>360</mn></mrow><mn>60</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>60</mn></math></p>", "image": null}, "videoSolution": {"videoId": "281fac497c4d489bb21a4a1cf6a130b1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cILajWmHEk1uG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cILajWmHEk1uG.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd31ba0e94a3c40 mo><mn>46</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb01", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 2)", "title": "JEE Main 2024 (29 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb01", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 2)", "title": "JEE Main 2024 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd30ba0e94a3c4025b14", "type": "singleCorrect", "level": 3, "questionLabels": [], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>,</mo><mi>β</mi></math> are the roots of the equation, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup><mo>-</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">n</mi></msub><mo>=</mo><mn>2023</mn><msup><mi>α</mi><mi mathvariant=\"normal\">n</mi></msup><mo>+</mo><mn>2024</mn><msup><mi>β</mi><mi mathvariant=\"normal\">n</mi></msup></math>, then", "image": null}, "options": [{"id": "PHuux", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo> </mo><msub><mi mathvariant=\"normal\">S</mi><mn>12</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">S</mi><mn>11</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">S</mi><mn>10</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "Y6HsH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mn>12</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">S</mi><mn>11</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">S</mi><mn>10</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "leHPv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo> </mo><msub><mi mathvariant=\"normal\">S</mi><mn>11</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">S</mi><mn>12</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">S</mi><mn>10</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "vJSs2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mn>11</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">S</mi><mn>10</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">S</mi><mn>12</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>,</mo><mo> </mo><mi>β</mi></math> are roots of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup><mo>-</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>α</mi><mn>2</mn></msup><mo>-</mo><mi>α</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>α</mi><mn>2</mn></msup><mo>=</mo><mi>α</mi><mo>+</mo><mn>1</mn><mo> </mo><mo> </mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">n</mi></msub><mo>=</mo><mn>2023</mn><msup><mi mathvariant=\"normal\">α</mi><mi mathvariant=\"normal\">n</mi></msup><mo>+</mo><mn>2024</mn><msup><mi mathvariant=\"normal\">β</mi><mi mathvariant=\"normal\">n</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi mathvariant=\"normal\">S</mi><mrow><mi mathvariant=\"normal\">n</mi><mo>-</mo><m
