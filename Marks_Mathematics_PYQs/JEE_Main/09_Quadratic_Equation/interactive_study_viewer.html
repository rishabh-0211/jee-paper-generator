lution, then all possible values of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;lie in the interval&nbsp;", "image": null}, "options": [{"id": "HSQli", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>-</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn><mo>)</mo></math>", "image": null, "isCorrect": false}, {"id": "zYyqz", "text": "<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo></mo><mo>-</mo><mo>&infin;</mo> <mtext>,</mtext> <mo>-</mo> <mn>2</mn> </mrow> </mfenced> <mo>&cup;</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext>,</mtext> <mo>&infin;</mo> </mrow> </mfenced> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "fvRVX", "text": "<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mn>1</mn> <mtext>,&nbsp;</mtext> <mn>0</mn> </mrow> </mfenced> <mo>&cup;</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>0</mn> <mtext>,&nbsp;</mtext> <mn>1</mn> </mrow> </mfenced> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "lKksv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>)</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mo>[</mo><mi>x</mi><mo>]</mo><mo>=</mo><mi>t</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;&#160;-3</mo><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>t</mi><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn></math><br /><br />As&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;is not an integer, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>&#8800;0</mo></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi>a</mi><mo>&#8800;0</mo></math><br /><br />For a root of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> to exist at least one of the roots of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> should be between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>.<br /><br />Roots&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">=</mi><mfrac><mrow><mo>-</mo><mn>2</mn><mo>&#177;</mo><msqrt><mn>4</mn><mo>-</mo><mfenced><mn>4</mn></mfenced><mfenced><mrow><mo>-</mo><mn>3</mn></mrow></mfenced><msup><mi>a</mi><mn>2</mn></msup></msqrt></mrow><mrow><mo>-</mo><mn>6</mn></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn><mo>&#177;</mo><msqrt><mn>4</mn><mo>+</mo><mn>1</mn><mn>2</mn><msup><mi>a</mi><mn>2</mn></msup></msqrt></mrow><mrow><mo>-</mo><mn>6</mn></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn><mo>&#177;</mo><msqrt><mn>1</mn><mo>+</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></msqrt></mrow><mrow><mo>-</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#8723;</mo><msqrt><mn>1</mn><mo>+</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></msqrt></mrow><mn>3</mn></mfrac></math><br /><br />As we observe, one root is surely less than zero,<br /><br />i.e., &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mo>-</mo><msqrt><mn>1</mn><mo>+</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></msqrt></mrow><mn>3</mn></mfrac></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;&nbsp;&nbsp;For a solution to exist,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>1</mn><mo>+</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></msqrt></mrow><mn>3</mn></mfrac><mo>&#60;</mo><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mn>1</mn><mo>+</mo><msqrt><mn>1</mn><mo>+</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></msqrt><mo>&#60;</mo><mn>3</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><msqrt><mn>1</mn><mo>+</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></msqrt><mo>&#60;</mo><mn>2</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mn>1</mn><mo>+</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup><mo>&#60;</mo><mn>4</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup><mo>&#60;</mo><mn>3</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><msup><mi>a</mi><mn>2</mn></msup><mo>&#60;</mo><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mi>a</mi><mo>&#8712;</mo><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo largeop=\"true\">&#8746;</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math>.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mo>&#8757;&#160;&#160;&#160;</mo><mi>a</mi><mo>&#8800;</mo><mn>0</mn></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65d06", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}], "question": {"text": "If $p$ and $q$ are non-zero real numbers and $\\alpha^3+\\beta^3=-p, \\alpha \\beta=q$, then a quadratic equation whose roots are $\\frac{\\alpha^2}{\\beta}, \\frac{\\beta^2}{\\alpha}$ is :", "image": null}, "options": [{"id": "bwmox", "text": "\n$p x^2-q x+p^2=0$\n", "image": null, "isCorrect": false}, {"id": "EG6l6", "text": "\n$q x^2+p x+q^2=0$\n", "image": null, "isCorrect": true}, {"id": "HRPS2", "text": "\n$p x^2+q x+p^2=0$\n", "image": null, "isCorrect": false}, {"id": "pZCsy", "text": "\n$q x^2-p x+q^2=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\alpha^3+\\beta^3=-p$ and $\\alpha \\beta=q$\nLet $\\frac{\\alpha^2}{\\beta}$ and $\\frac{\\beta^2}{\\alpha}$ be the root of required quadratic equation.\nSo, $\\frac{\\alpha^2}{\\beta}+\\frac{\\beta^2}{\\alpha}=\\frac{\\alpha^3+\\beta^3}{\\alpha \\beta}=\\frac{-p}{q}$\nand $\\frac{\\alpha^2}{\\beta} \\times \\frac{\\beta^2}{\\alpha}=\\alpha \\beta=q$\nHence, required quadratic equation is\n$$\n\\begin{aligned}\n&x^2-\\left(\\frac{-p}{q}\\right) x+q=0 \\\\\n&\\Rightarrow x^2+\\frac{p}{q} x+q=0 \\Rightarrow q x^2+p x+q^2=0\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c5a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "If $\\alpha$ and $\\beta$ are roots of the equation $x^2+p x+\\frac{3 p}{4}=0$, such that $|\\alpha-\\beta|=\\sqrt{10}$, then $p$ belongs to the set :", "image": null}, "options": [{"id": "FIWHq", "text": "\n$\\{2,-5\\}$\n", "image": null, "isCorrect": false}, {"id": "9CeN7", "text": "\n$\\{-3,2\\}$\n", "image": null, "isCorrect": false}, {"id": "9mVup", "text": "\n$\\{-2,5\\}$\n", "image": null, "isCorrect": true}, {"id": "SsbQq", "text": "\n$\\{3,-5\\}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given quadratic eqn. is\n$$\nx^2+p x+\\frac{3 p}{4}=0\n$$\nSo, $\\alpha+\\beta=-p, \\alpha \\beta=\\frac{3 p}{4}$\nNow, given $|\\alpha-\\beta|=\\sqrt{10}$\n$$\n\\begin{aligned}\n& \\Rightarrow \\alpha-\\beta=\\pm \\sqrt{10} \\\\\n& \\Rightarrow(\\alpha-\\beta)^2=10 \\Rightarrow \\alpha^2+\\beta^2-2 \\alpha \\beta=10 \\\\\n& \\Rightarrow(\\alpha+\\beta)^2-4 \\alpha \\beta=10 \\\\\n& \\Rightarrow p^2-4 \\times \\frac{3 p}{4}=10 \\Rightarrow p^2-3 p-10=0 \\\\\n& \\Rightarrow p=-2,5 \\Rightarrow p \\in\\{-2,5\\}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65bf0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "The values of ' $a$ ' for which one root of the equation $x^2-(a+1) x+a^2+a-8=0$ exceeds 2 and the other is lesser than 2 , are given by :", "image": null}, "options": [{"id": "FNC5S", "text": "\n$3 < a < 10$", "image": null, "isCorrect": false}, {"id": "xPSy8", "text": "\n$a \\geq 10$\n", "image": null, "isCorrect": false}, {"id": "r7QpP", "text": "\n$-2 < a < 3$", "image": null, "isCorrect": true}, {"id": "ohRHc", "text": "\n$a \\leq-2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\nx^2-(a+1) x+a^2+a-8=0\n$$\nSince roots are different, therefore $\\mathrm{D}>0$\n$$\n\\begin{aligned}\n& \\Rightarrow(a+1)^2-4\\left(a^2+a-8\\right)>0 \\\\\n& \\Rightarrow(a-3)(3 a+1) < 0\n\\end{aligned}\n$$\nThere are two cases arises.\nCase I. $a-3>0$ and $3 a+1 < 0$\n$\\Rightarrow a>3$ and $a < -\\frac{11}{3}$\nHence, no solution in this case\nCase II : $a-3 < 0$ and $3 a+11>0$\n$\\Rightarrow a < 3$ and $a>-\\frac{11}{3}$\n$\\therefore \\quad-\\frac{11}{3} < a < 3 \\Rightarrow-2 < a < 3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65aed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "If $a, b, c \\in \\mathrm{R}$ and 1 is a root of equation $a x^2+b x$ $+c=0$, then the curve $y=4 a x^2+3 b x+2 c, a \\neq 0$ intersect $x$-axis at", "image": null}, "options": [{"id": "sYoDF", "text": "\ntwo distinct points whose coordinates are always rational numbers\n", "image": null, "isCorrect": false}, {"id": "uMofm", "text": "\nno point\n", "image": null, "isCorrect": false}, {"id": "81fqD", "text": "\nexactly two distinct points\n", "image": null, "isCorrect": false}, {"id": "JFYMC", "text": "\nexactly one point", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $a x^2+b x+c=0$\n$$\n\\begin{aligned}\n& \\Rightarrow a x^2=-b x-c \\\\\n& \\text { Now, consider } \\\\\n& y=4 a x^2+3 b x+2 c \\\\\n& =4[-b x-c]+3 b x+2 c \\\\\n& =-4 b x-4 c+3 b x+2 c \\\\\n& =-b x-2 c\n\\end{aligned}\n$$\nSince, this curve intersects $x$-axis\n$\\therefore$ put $y=0$, we get\n$$\n\\begin{aligned}\n& -b x-2 c=0 \\Rightarrow-b x=2 c \\\\\n& \\Rightarrow x=\\frac{-2 c}{b}\n\\end{aligned}\n$$\nThus, given curve intersects $x$-axis at exactly one point.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a84", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "Let $p, q, r \\in R$ and $r>p>0$. If the quadratic equation $p x^2+q x+r=0$ has two complex roots $\\alpha$ and $\\beta$, then $|\\alpha|+|\\beta|$ is", "image": null}, "options": [{"id": "EoOkT", "text": "\nequal to 1\n", "image": null, "isCorrect": false}, {"id": "b3O9z", "text": "\nless than 2 but not equal to 1\n", "image": null, "isCorrect": false}, {"id": "BDxIo", "text": "\ngreater than 2\n", "image": null, "isCorrect": true}, {"id": "324nl", "text": "\nequal to 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given quadratic equation is\n$$\n\\begin{aligned}\n& p x^2+q x+r=0 \\\\\n& D=q^2-4 p r\n\\end{aligned}\n$$\nSince $\\alpha$ and $\\beta$ are two complex root\n$$\n\\begin{array}{ll}\n\\therefore \\beta=\\bar{\\alpha} \\Rightarrow|\\beta|=|\\bar{\\alpha}| \\Rightarrow|\\beta|=|\\alpha| \\\\\n(\\because|\\bar{\\alpha}|=|\\alpha|) \\\\\n\\text { Consider } \\\\\n|\\alpha|+|\\beta|=|\\alpha|+|\\alpha| & (\\because|\\beta|=|\\alpha|) \\\\\n=2|\\alpha|>2.1=2 & (\\because|\\alpha|>1)\n\\end{array}\n$$\nHence, $|\\alpha|+|\\beta|$ is greater than 2 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a3d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "If the sum of the square of the roots of the equation $x^2-(\\sin \\alpha-2) x-(1+\\sin \\alpha)=0$ is least, then $\\alpha$ is equal to", "image": null}, "options": [{"id": "a70WB", "text": "\n$\\frac{\\pi}{6}$\n", "image": null, "isCorrect": false}, {"id": "nifrh", "text": "\n$\\frac{\\pi}{4}$\n", "image": null, "isCorrect": false}, {"id": "73qqC", "text": "\n$\\frac{\\pi}{3}$\n", "image": null, "isCorrect": false}, {"id": "lVaRF", "text": "\n$\\frac{\\pi}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equation is\n$$\nx^2-(\\sin \\alpha-2) x-(1+\\sin \\alpha)=0\n$$\nLet $x_1$ and $x_2$ be two roots of quadratic equation.\n$$\n\\begin{aligned}\n& \\therefore x_1+x_2=\\sin \\alpha-2 \\text { and } x_1 x_2=-(1+\\sin \\alpha) \\\\\n& \\left(x_1+x_2\\right)^2=(\\sin \\alpha-2)^2=\\sin ^2 \\alpha+4-4 \\sin \\alpha\n\\end{aligned}\n$$\n$$\n\\begin{aligned}\n& \\Rightarrow \\quad x_1^2+x_2^2=\\sin ^2 \\alpha+4-4 \\sin \\alpha-2 x_1 x_2 \\\\\n& =\\sin ^2 \\alpha+4-4 \\sin \\alpha+2(1+\\sin \\alpha) \\\\\n& =\\sin ^2 \\alpha-2 \\sin \\alpha+6\n\\end{aligned}\n$$\nNow, By putting\n$\\alpha=\\frac{\\pi}{6}, \\alpha=\\frac{\\pi}{4}, \\alpha=\\frac{\\pi}{3}$ and $\\alpha=\\frac{\\pi}{2}$ in (A) one by one\nWe get least value of $x_1^2+x_2^2$ at $\\frac{\\pi}{2}$\nHence, $\\alpha=\\frac{\\pi}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659cc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "The value of $\\mathrm{k}$ for which the equation $(K-2) x^2+8 x+K+4=0$ has both roots real, distinct and negative is", "image": null}, "options": [{"id": "VI4SZ", "text": "\n6\n", "image": null, "isCorrect": false}, {"id": "RBvjw", "text": "\n3\n", "image": null, "isCorrect": true}, {"id": "v6h2d", "text": "\n4\n", "image": null, "isCorrect": false}, {"id": "jKWFS", "text": "\n1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$(K-2) x^2+8 x+K+4=0$\nIf real roots then,\n$$\n\\begin{aligned}\n& 8^2-4(K-2)(K+4)>0 \\\\\n\\Rightarrow & K^2+2 K-8 < 16 \\\\\n\\Rightarrow & K^2+6 K-4 K-24 < 0 \\\\\n\\Rightarrow & (K+6)(K-4) < 0 \\\\\n\\Rightarrow & -6 < K < 4\n\\end{aligned}\n$$\nIf both roots are negative then $\\alpha \\beta$ is $+v e$\n$$\n\\begin{aligned}\n& \\Rightarrow \\frac{K+4}{K-2}>0 \\Rightarrow K>-4 \\\\\n& \\text { Also, } \\frac{K-2}{K+4}>0 \\Rightarrow K>2\n\\end{aligned}\n$$\nRoots are real so, $-6 < K < 4$\nSo, 6 and 4 are not correct.\nSince, $K>2$, so 1 is also not correct value of $K$.\n$$\n\\therefore K=3\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65926", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "If $\\alpha$ and $\\beta$ are the roots of the equation $x^2-x+1=0$, then $\\alpha^{2009}+\\beta^{2009}=$", "image": null}, "options": [{"id": "yu6Kc", "text": "\n$-1$\n", "image": null, "isCorrect": false}, {"id": "HEkSc", "text": "\n1\n", "image": null, "isCorrect": true}, {"id": "zAy7o", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "tGNpY", "text": "\n$-2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$x^2-x+1=0 \\quad \\Rightarrow x=\\frac{1 \\pm \\sqrt{1-4}}{2}$\n$x=\\frac{1 \\pm \\sqrt{3} i}{2}$\n$\\alpha=\\frac{1}{2}+i \\frac{\\sqrt{3}}{2}, \\quad \\beta=\\frac{1}{2}-\\frac{i \\sqrt{3}}{2}$\n$\\alpha=\\cos \\frac{\\pi}{3}+i \\sin \\frac{\\pi}{3}, \\quad \\beta=\\cos \\frac{\\pi}{3}-i \\sin \\frac{\\pi}{3}$\n$\\alpha^{2009}+\\beta^{2009}=2 \\cos 2009\\left(\\frac{\\pi}{3}\\right)$\n$=2 \\cos \\left[668 \\pi+\\pi+\\frac{2 \\pi}{3}\\right]=2 \\cos \\left(\\pi+\\frac{2 \\pi}{3}\\right)$\n$=-2 \\cos \\frac{2 \\pi}{3}=-2\\left(-\\frac{1}{2}\\right)=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d658bd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "If the roots of the equation $b x^2+c x+a=0$ be imaginary, then for all real values of $x$, the expression $3 b^2 x^2+6 b c x+2 c^2$ is", "image": null}, "options": [{"id": "MYC6r", "text": "\ngreater than $4 a b$\n", "image": null, "isCorrect": false}, {"id": "HyTrW", "text": "\nless than $4 a b$\n", "image": null, "isCorrect": false}, {"id": "OgG8C", "text": "\ngreater than $-4 a b$\n", "image": null, "isCorrect": true}, {"id": "DScHm", "text": "\nless than - 4ab", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\nb x^2+c x+a=0\n$$\nRoots are imaginary $\\Rightarrow c^2-4 a b < 0 \\Rightarrow c^2 < 4 a b \\Rightarrow-c^2>-4 a b$ $3 b^2 x^2+6 b c x+2 c^2$\nsince $3 b^2>0$\nGiven expression has minimum value\nMinimum value $=\\frac{4\\left(3 b^2\\right)\\left(2 c^2\\right)-36 b^2 c^2}{4\\left(3 b^2\\right)}=-\\frac{12 b^2 c^2}{12 b^2}=-c^2>-4 a b$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65779", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "If the roots of the quadratic equation $x^2+p x+q=0$ are $\\tan 30^{\\circ}$ and $\\tan 15^{\\circ}$, respectively then the value of $2+q-p$ is", "image": null}, "options": [{"id": "jmhe0", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "LItd9", "text": "\n3\n", "image": null, "isCorrect": true}, {"id": "8F33N", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "dL8js", "text": "\n1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$x^2+p x+q=0$\n$\\tan 30^{\\circ}+\\tan 15^{\\circ}=-p$\n$\\tan 30^{\\circ} \\cdot \\tan 15^{\\circ}=q$\n$\\tan 45^{\\circ}=\\frac{\\tan 30^{\\circ}+\\tan 15^{\\circ}}{1-\\tan 30^{\\circ} \\tan 15^{\\circ}}=\\frac{-p}{1-q}=1$\n$\\Rightarrow-p=1-q$\n$\\Rightarrow q-p=1 \\quad \\therefore 2+q-p=3$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656ce", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "If roots of the equation $x^2-b x+c=0$ be two consectutive integers, then $b^2-4 c$ equals", "image": null}, "options": [{"id": "4wZhp", "text": "\n$-2$\n", "image": null, "isCorrect": false}, {"id": "NZdlD", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "1ESSy", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "9rxAl", "text": "\n1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $\\alpha, \\alpha+1$ be roots\n$$\n\\begin{aligned}\n& \\alpha+\\alpha+1=b \\\\\n& \\alpha(\\alpha+1)=c \\\\\n& \\therefore b^2-4 c=(2 \\alpha+1)^2-4 \\alpha(\\alpha+1)=1 .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656cd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "The value of $\\alpha$ for which the sum of the squares of the roots of the equation $x^2-(a-2) x-a-1=0$ assume the least value is", "image": null}, "options": [{"id": "ju7P6", "text": "\n1\n", "image": null, "isCorrect": true}, {"id": "FCvlG", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "cZQOS", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "bdS35", "text": "\n2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& x^2-(a-2) x-a-1=0 \\\\\n& \\Rightarrow \\alpha+\\beta=a-2 \\\\\n& \\alpha \\beta=-(a+1) \\\\\n& \\alpha^2+\\beta^2=(\\alpha+\\beta)^2-2 \\alpha \\beta \\\\\n& \\quad=a^2-2 a+6=(a-1)^2+5 \\\\\n& \\Rightarrow a=1 .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655ea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "If one root of the equation $x^2+p x+12=0$ is 4 , while the equation $x^2+p x+q=0$ has equal roots, then the value of ' $q$ ' is", "image": null}, "options": [{"id": "CMZMj", "text": "\n$\\frac{49}{4}$\n", "image": null, "isCorrect": true}, {"id": "xp48I", "text": "\n4\n", "image": null, "isCorrect": false}, {"id": "Ynzhq", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "cwNuz", "text": "\n12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since 4 is one of the root of $x^2+p x+12=0 \\Rightarrow 16+4 p+12=0 \\Rightarrow p=-7$ and equation $x^2+p x+q=0$ has equal roots\n$$\n\\Rightarrow D=49-4 q=0 \\Rightarrow q=\\frac{49}{4}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655e6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "If $(1-p)$ is a root of quadratic equation $x^2+p x+(1-p)=0$, then its roots are", "image": null}, "options": [{"id": "kTHp5", "text": "\n0,1\n", "image": null, "isCorrect": false}, {"id": "TMXJ1", "text": "\n$-1,2$\n", "image": null, "isCorrect": false}, {"id": "BxwW4", "text": "\n$0,-1$\n", "image": null, "isCorrect": true}, {"id": "6aY02", "text": "\n$-1,1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(3)\n$$\n\\begin{aligned}\n& (1-p)^2+p(1-p)+(1-p)=0 \\quad\\left(\\text { since }(1-p) \\text { is a root of the equation } x^2+p x+(1-p)=0\\right) \\\\\n& \\Rightarrow(1-p)(1-p+p+1)=0 \\\\\n& \\Rightarrow 2(1-p)=0 \\Rightarrow(1-p)=0 \\Rightarrow p=1 \\\\\n& \\text { sum of root is } \\alpha+\\beta=-p \\text { and product } \\alpha \\beta=1-p=0 \\quad \\text { (where } \\beta=1-p=0) \\\\\n& \\Rightarrow \\alpha+0=-1 \\Rightarrow \\alpha=-1 \\Rightarrow \\text { Roots are } 0,-1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655e5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "Let two numbers have arithmetic mean 9 and geometric mean 4. Then these numbers are the roots of the quadratic equation", "image": null}, "options": [{"id": "wUT69", "text": "\n$x^2+18 x+16=0$\n", "image": null, "isCorrect": false}, {"id": "LwxvJ", "text": "\n$x^2-18 x-16=0$\n", "image": null, "isCorrect": false}, {"id": "G8TP5", "text": "\n$x^2+18 x-16=0$\n", "image": null, "isCorrect": false}, {"id": "71IBU", "text": "\n$x^2-18 x+16=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let numbers be $a, b \\Rightarrow a+b=18, \\sqrt{a b}=4 \\quad \\Rightarrow a b=16, a$ and $b$ are roots of the equation\n$\\Rightarrow \\quad x^2-18 x+16=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65533", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "The number of real solutions of the equation $x^2-3|x|+2=0$ is", "image": null}, "options": [{"id": "MToIK", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "QN5z3", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "UScVU", "text": "\n4\n", "image": null, "isCorrect": true}, {"id": "eJJhn", "text": "\n1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$x^2-3|x|+2=0 \\quad$ or $(|x|-2)(|x|-1)=0$\n$|x|=1,2$ or $x=\\pm 1, \\pm 2$ or $\\therefore$ No. of solution $=4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65523", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "The value of ' $a$ ' for which one root of the quadratic equation $\\left(a^2-5 a+3\\right) x^3+(3 a-1) x+2=0$ is twice as large as the other is", "image": null}, "options": [{"id": "XWNnQ", "text": "\n$-\\frac{1}{3}$\n", "image": null, "isCorrect": false}, {"id": "lYyzY", "text": "\n$\\frac{2}{3}$\n", "image": null, "isCorrect": true}, {"id": "iYpdV", "text": "\n$-\\frac{2}{3}$\n", "image": null, "isCorrect": false}, {"id": "EJP6v", "text": "\n$\\frac{1}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$3 \\alpha=\\frac{1-3 a}{a^2-5 a+3} \\& 2 \\alpha^2=\\frac{2}{a^2-5 a+3}$\n$2\\left[\\frac{1}{9} \\frac{(1-3 a)^2}{\\left(a^2-5 a+3\\right)^2}\\right]=\\frac{2}{a^2-5 a+3}$\n$\\frac{(1-3 a)^2}{\\left(a^2-5 a+3\\right)}=9$ or $9 a^2-6 a+1$\n$=9 a^2-45 a+27$ or $39 a=26$ or $a=\\frac{2}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65507", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "If the sum of the roots of the quadratic equation $a x^2+b x+c=0$ is equal to the sum of the squares of their reciprocals, then $\\frac{\\mathrm{a}}{\\mathrm{c}}, \\frac{\\mathrm{b}}{\\mathrm{a}}$ and $\\frac{\\mathrm{c}}{\\mathrm{b}}$ are in", "image": null}, "options": [{"id": "krroF", "text": "\nArithmetic - Geometric Progression\n", "image": null, "isCorrect": false}, {"id": "E5AVD", "text": "\nArithmetic Progression\n", "image": null, "isCorrect": false}, {"id": "HbOzF", "text": "\nGeometric Progression\n", "image": null, "isCorrect": false}, {"id": "1qjxM", "text": "\nHarmonic Progression", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$a x^2+b x+c=0, \\alpha+\\beta=\\frac{-b}{a}, \\alpha \\beta=\\frac{c}{a}$\nAs for given condition, $\\alpha+\\beta=\\frac{1}{\\alpha^2}+\\frac{1}{\\beta^2}$\n$\\alpha+\\beta=-\\frac{\\alpha^2+\\beta^2}{\\alpha^2 \\beta^2}-\\frac{b}{a}=\\frac{\\frac{b^2}{a^2}-\\frac{2 c}{a}}{\\frac{c^2}{a^2}}$\nOn simplification $2 a^2 c=a b^2+b c^2$\n$\\Rightarrow \\frac{2 \\mathrm{a}}{\\mathrm{b}}=\\frac{\\mathrm{c}}{\\mathrm{a}}+\\frac{\\mathrm{b}}{\\mathrm{c}} \\quad \\therefore \\frac{\\mathrm{a}}{\\mathrm{b}}, \\frac{\\mathrm{b}}{\\mathrm{a}}, \\& \\frac{\\mathrm{c}}{\\mathrm{b}}$ are in H.P.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65438", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "If $p$ and $q$ are the roots of the equation $x^2+p x+q=0$, then", "image": null}, "options": [{"id": "QMJXQ", "text": "\np =1, q = -2\n", "image": null, "isCorrect": true}, {"id": "D5Uou", "text": "\np = 0, q = 1\n", "image": null, "isCorrect": false}, {"id": "W379X", "text": "\np = -2, q = 0\n", "image": null, "isCorrect": false}, {"id": "UCVGq", "text": "\np = -2, q = 1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$p+q=-p$ and $p q=q \\Rightarrow q(p-1)=0 \\Rightarrow q=0$ or $p=1$\nIf $q=0$, then $p=0$. i.e. $p=q \\quad \\therefore p=1$ and $q=-2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65437", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Product of real roots of the equation $t^2 x^2+|x|+9=0$", "image": null}, "options": [{"id": "mLlk8", "text": "\nis always positive\n", "image": null, "isCorrect": false}, {"id": "0V9C9", "text": "\nis always negative\n", "image": null, "isCorrect": false}, {"id": "9U0kr", "text": "\ndoes not exist\n", "image": null, "isCorrect": true}, {"id": "S1PoX", "text": "\nnone of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d6541b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "If $\\alpha \\neq \\beta$ but $\\alpha^2=5 \\alpha-3$ and $\\beta^2=5 \\beta-3$ then the equation having $\\alpha / \\beta$ and $\\beta / \\alpha$ as its roots is", "image": null}, "options": [{"id": "JN2M0", "text": "\n$3 x^2-19 x+3=0$\n", "image": null, "isCorrect": true}, {"id": "clCmD", "text": "\n$3 x^2+19 x-3=0$\n", "image": null, "isCorrect": false}, {"id": "NkmOD", "text": "\n$3 x^2-19 x-3=0$\n", "image": null, "isCorrect": false}, {"id": "30UOh", "text": "\n$x^2-5 x+3=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $\\alpha^2=5 \\alpha-3$\n$$\n\\begin{aligned}\n& \\Rightarrow \\alpha^2-5 \\alpha+3=0 \\Rightarrow \\alpha=\\frac{5 \\pm \\sqrt{13}}{2} \\text {. Similarly, } \\beta^2=5 \\beta-3 \\Rightarrow \\alpha=\\frac{5 \\pm \\sqrt{13}}{2} \\\\\n& \\therefore \\alpha=\\frac{5+\\sqrt{13}}{2} \\text { and } \\beta=\\frac{5-\\sqrt{13}}{2} \\text { or vice - versa } \\\\\n& \\alpha^2+\\beta^2=\\frac{50+26}{4}=19 \\& \\alpha \\beta=\\frac{1}{4}(25-13)=3\n\\end{aligned}\n$$\nThus, the equation having $\\frac{\\alpha}{\\beta} \\& \\frac{\\beta}{\\alpha}$ as its roots is\n$$\nx^2-x\\left(\\frac{\\alpha}{\\beta}+\\frac{\\beta}{\\alpha}\\right)+\\frac{\\alpha \\beta}{\\alpha \\beta}=0 \\Rightarrow x^2-x\\left(\\frac{\\alpha^2+\\beta^2}{\\alpha \\beta}\\right)+1=0 \\text { or } 3 x^2-19 x+1=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d692c4", "title": "Common Roots", "totalQuestions": 13, "questions": [{"_id": "67a2ee97c8b73881fdaea13b", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T09:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 1)", "title": "JEE Main 2025 (23 Jan Shift 1)"}], "question": {"text": "If the equation $\\mathrm{a}(\\mathrm{b}-\\mathrm{c}) \\mathrm{x}^2+\\mathrm{b}(\\mathrm{c}-\\mathrm{a}) \\mathrm{x}+\\mathrm{c}(\\mathrm{a}-\\mathrm{b})=0$ has equal roots, where $\\mathrm{a}+\\mathrm{c}=15$ and $\\mathrm{b}=\\frac{36}{5}$, then $a^2+c^2$ is equal to", "image": null}, "options": [], "correctValue": "117", "solution": {"text": "$\\begin{aligned} & a(b-c) x^2+b(c-a) x+c(a-b)=0 \\\\ & x=1 \\text { is root } \\therefore \\text { other root is } 1 \\\\ & \\alpha+\\beta=-\\frac{b(c-a)}{a(b-c)}=2 \\\\ & \\Rightarrow-\\mathrm{bc}+\\mathrm{ab}=2 \\mathrm{ab}-2 \\mathrm{ac} \\\\ & \\Rightarrow 2 \\mathrm{ac}=\\mathrm{ab}+\\mathrm{bc} \\\\ & \\Rightarrow 2 \\mathrm{ac}=\\mathrm{b}(\\mathrm{a}+\\mathrm{c}) \\\\ & \\Rightarrow 2 \\mathrm{ac}=15 \\mathrm{~b} \\ldots(1) \\\\ & \\Rightarrow 2 \\mathrm{ac}=15\\left(\\frac{36}{5}\\right)=108 \\\\ & \\Rightarrow \\mathrm{ac}=54 \\\\ & \\mathrm{a}+\\mathrm{c}=15 \\\\ & \\mathrm{a}^2+\\mathrm{c}^2+2 \\mathrm{ac}=225 \\\\ & \\mathrm{a}^2+\\mathrm{c}^2=225-108=117\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "e868bbfe49bb43aaac49fcbac049038c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/uMj2HRpJXPNjP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/uMj2HRpJXPNjP.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T09:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 1)", "title": "JEE Main 2025 (23 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6826a", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "If the value of real number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#62;</mo><mn>0</mn></math>&nbsp;for which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi>&#945;</mi><mi>x</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>&#945;</mi><mi>x</mi><mo>-</mo><mn>5</mn><mo>=</mo><mn>0</mn></math>&nbsp;have a common real roots is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><msqrt><mn>2</mn><mi>&#946;</mi></msqrt></mfrac></math> then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math> is equal to ________", "image": null}, "options": [], "correctValue": "13", "solution": {"text": "<p>Given,</p><p>Quadratic equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi>&#945;</mi><mi>x</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> &nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>&#945;</mi><mi>x</mi><mo>-</mo><mn>5</mn><mo>=</mo><mn>0</mn></math>&nbsp;have a common real root,</p><p>So, taking&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>&nbsp;to be common root then equation becomes,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>k</mi><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi>&#945;</mi><mi>k</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>k</mi><mn>2</mn></msup><mo>-</mo><mi>&#945;</mi><mi>k</mi><mo>-</mo><mn>5</mn><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>Now subtraction above equations we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mfrac><mn>6</mn><mrow><mn>4</mn><mi>&#945;</mi></mrow></mfrac></math></p><p>Now putting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>&nbsp;in equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mfrac><mn>6</mn><mrow><mn>4</mn><mi>&#945;</mi></mrow></mfrac></mfenced><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi>&#945;</mi><mfenced><mfrac><mn>6</mn><mrow><mn>4</mn><mi>&#945;</mi></mrow></mfrac></mfenced><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn><mo>&#160;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mfrac><mn>6</mn><mrow><mn>4</mn><mi>&#945;</mi></mrow></mfrac></mfenced><mn>2</mn></msup><mo>-</mo><mfenced><mfrac><mn>26</mn><mn>4</mn></mfrac></mfenced><mo>=</mo><mn>0</mn><mo>&#160;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>36</mn><mrow><mn>16</mn><msup><mi>&#945;</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfenced><mfrac><mn>26</mn><mn>4</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>9</mn><mn>26</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mn>3</mn><msqrt><mn>2</mn><mo>&#215;</mo><mn>13</mn></msqrt></mfrac></math></p><p>Now comparing with given value&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><msqrt><mn>2</mn><mi>&#946;</mi></msqrt></mfrac></math>&nbsp;we get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><mn>13</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d6799f", "previousYearPapers": [{"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "If for some <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>,</mo><mi>q</mi><mo>,</mo><mi>r</mi><mo>&#8712;</mo><mi>R</mi></math>, all have positive sign, one of the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>p</mi><mn>2</mn></msup><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup></mrow></mfenced><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>q</mi><mfenced><mrow><mi>p</mi><mo>+</mo><mi>r</mi></mrow></mfenced><mi>x</mi><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn></math>&nbsp;is also a root of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>8</mn><mo>=</mo><mn>0</mn></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>q</mi><mn>2</mn></msup><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup></mrow><msup><mi>p</mi><mn>2</mn></msup></mfrac></math>&nbsp;is equal to-", "image": null}, "options": [], "correctValue": "272", "solution": {"text": "<blockquote><p>Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>p</mi><mn>2</mn></msup><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup></mrow></mfenced><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>q</mi><mfenced><mrow><mi>p</mi><mo>+</mo><mi>r</mi></mrow></mfenced><mi>x</mi><mo>+</mo><msup><mi>q</mi><mn>2</mn></msup><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn></math></p><p>On simplifying we get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>p</mi><mi>x</mi><mo>-</mo><mi>q</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>q</mi><mi>x</mi><mo>-</mo><mi>r</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mi>x</mi><mo>-</mo><mi>q</mi><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>q</mi><mi>x</mi><mo>-</mo><mi>r</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mi>q</mi><mi>p</mi></mfrac><mo>=</mo><mfrac><mi>r</mi><mi>q</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>x</mi><mo>=</mo><mfrac><mi>q</mi><mi>p</mi></mfrac><mo>=</mo><mfrac><mi>r</mi><mi>q</mi></mfrac><mo>=</mo><mn>4</mn></math>&nbsp; &nbsp; [because roots of&nbsp;equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>8</mn><mo>=</mo><mn>0</mn></math>&nbsp;are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn></math>]</p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>,</mo><mi>q</mi><mo>,</mo><mi>r</mi></math>&nbsp;are positive,&nbsp;so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> must be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>.</p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mo>=</mo><mn>4</mn><mi>p</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>4</mn><mi>q</mi><mo>=</mo><mn>16</mn><mi>p</mi></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>q</mi><mn>2</mn></msup><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup></mrow><msup><mi>p</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><msup><mfenced><mrow><mn>4</mn><mi>p</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mn>4</mn><mo>&#215;</mo><mn>4</mn><mi>p</mi></mrow></mfenced><mn>2</mn></msup></mrow><msup><mi>p</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>16</mn><mo>+</mo><mn>256</mn><mo>=</mo><mn>272</mn></math>.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67892", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;be a quadratic polynomial with leading coefficient&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mn>0</mn></mfenced><mo>=</mo><mi>p</mi><mo>,</mo><mi>p</mi><mo>&#8800;</mo><mn>0</mn></math>, and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mn>1</mn></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math>. If the equations <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mi>o</mi><mi>f</mi><mi>o</mi><mi>f</mi><mi>o</mi><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;have a common real root, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mrow><mo>-</mo><mn>3</mn></mrow></mfenced></math>&nbsp;is equal to ______.", "image": null}, "options": [], "correctValue": "25", "solution": {"text": "<blockquote><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mfenced><mrow><mi>x</mi><mo>-</mo><mi>&#945;</mi></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mi>&#946;</mi></mrow></mfenced></math></p><p>It is given that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mn>0</mn></mfenced><mo>=</mo><mi>p</mi><mo>&#8658;</mo><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mi>p</mi></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mn>1</mn></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#160;&#160;</mo><mo> ,</mo><mi> </mi><mi>f</mi></math> are in G.P.", "isCorrect": false, "image": null}, {"id": "KVOKt", "text": "<math><mfrac><mrow><mi>d</mi></mrow><mrow><mi>a</mi></mrow></mfrac><mo>,</mo><mfrac><mrow><mi>e</mi></mrow><mrow><mi>b</mi></mrow></mfrac><mo>,</mo><mfrac><mrow><mi>f</mi></mrow><mrow><mi>c</mi></mrow></mfrac></math> are in G.P.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<math><mo>&#8757;</mo><mtext>&#8201;</mtext><mi>a</mi><mo>,</mo><mtext>&#8201;</mtext><mi>b</mi><mo>,</mo><mtext>&#8201;</mtext><mi>c</mi></math> are in G.P. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mi>a</mi><mi>c</mi></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8230;</mo><mo>(</mo><mi>i</mi><mo>)</mo></math><br />Equation <math><mi>a</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math><br />Hence, <math><mi>D</mi><mo>=</mo><mn>4</mn><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi><mo>=</mo><mn>0</mn></math> <math><mfenced separators=\"|\"><mrow><mo>&#8757;</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>a</mi><mi>c</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo></math> equation has equal roots <math><mo>&#8658;</mo></math> roots are <math><mo>=</mo><mfrac><mrow><mo>-</mo><mi>b</mi></mrow><mrow><mi>a</mi></mrow></mfrac><mo>,</mo><mtext>&#8201;</mtext><mfrac><mrow><mo>-</mo><mi>b</mi></mrow><mrow><mi>a</mi></mrow></mfrac></math> ( <math><mo>&#8757;</mo></math> sum of roots <math><mi>&#945;</mi><mo>+</mo><mi>&#945;</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi></mrow></mfrac></math> )<br /><math><mo>&#8757;</mo></math>&nbsp;Both equations have one root in common.<br /><math><mo>&#8756;</mo></math>&nbsp;Common root is <math><mo>-</mo><mfrac><mrow><mi>b</mi></mrow><mrow><mi>a</mi></mrow></mfrac></math>.&nbsp;It will satisfy equation.<br /><math><mo>&#8756;</mo><mi>d</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mo>-</mo><mi>b</mi></mrow><mrow><mi>a</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><mi>e</mi><mfenced separators=\"|\"><mrow><mo>-</mo><mi>b</mi></mrow></mfenced><mi>a</mi><mo>+</mo><mi>f</mi><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>d</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>a</mi><mi>e</mi><mi>b</mi><mo>+</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>f</mi><mo>=</mo><mn>0</mn></math><br /><math><mo>&#8658;</mo><mi>d</mi><mfenced separators=\"|\"><mrow><mi>a</mi><mi>c</mi></mrow></mfenced><mo>-</mo><mn>2</mn><mi>a</mi><mi>e</mi><mi>b</mi><mo>+</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>f</mi><mo>=</mo><mn>0</mn></math> <math><mfenced separators=\"|\"><mrow><mo>&#8757;</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>a</mi><mi>c</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>d</mi><mi>c</mi><mo>-</mo><mn>2</mn><mi>a</mi><mi>e</mi><mi>b</mi><mo>+</mo><mi>a</mi><mi>f</mi><mo>=</mo><mn>0</mn></math><br /><math><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>c</mi></mrow><mrow><mi>a</mi><mi>c</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>2</mn><mi>e</mi><mi>b</mi></mrow><mrow><mi>a</mi><mi>c</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>a</mi><mi>f</mi></mrow><mrow><mi>a</mi><mi>c</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math> (dividing by <math><mi>a</mi><mi>c</mi></math> )<br /><math><mo>&#8658;</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>a</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>2</mn><mi>e</mi><mi>b</mi></mrow><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>f</mi></mrow><mrow><mi>c</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mo>&#8658;</mo><mfrac><mrow><mi>d</m ull, "isCorrect": false}], "correctValue": null, "solution": {"text": "As the roots of <math> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo> <mn>2</mn> <mi>x</mi> <mo>+</mo> <mn>3</mn> <mo>=</mo> <mn>0</mn> </mrow> </math>&nbsp;are imaginary, hence both the roots are common with <math> <mrow> <mi>a</mi><msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn> </mrow> </math>.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfrac><mi>a</mi><mn>1</mn></mfrac><mo>=</mo><mfrac><mi>b</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mi>c</mi><mn>3</mn></mfrac></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6587e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}], "question": {"text": "The quadratic equations $x^2-6 x+a=0$ and $x^2-c x+6=0$ have one root in common. The other roots of the first and second equations are integers in the ratio $4: 3$. Then the common root is", "image": null}, "options": [{"id": "ksq1D", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "KgOYB", "text": "\n4\n", "image": null, "isCorrect": false}, {"id": "xHWdZ", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "FJSFH", "text": "\n2", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $\\alpha$ and $4 \\beta$ be roots of $x^2-6 x+a=0$ and $\\alpha, 3 \\beta$ be the roots of $x^2-c x+6=0$, then $\\alpha+4 \\beta=6$ and $4 \\alpha \\beta=a$\n$\\alpha+3 \\beta=c$ and $3 \\alpha \\beta=6$.\nWe get $\\alpha \\beta=2 \\Rightarrow a=8$\nSo the first equation is $x^2-6 x+8=0 \\Rightarrow x=2,4$\nIf $\\alpha=2$ and $4 \\beta=4$ then $3 \\beta=3$\nIf $\\alpha=4$ and $4 \\beta=2$, then $3 \\beta=3 / 2 \\quad$ (non-integer)\n$\\therefore$ common root is $x=2$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65436", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Difference between the corresponding roots of $x^2+a x+b=0$ and $x^2+b x+a=0$ is same and $a \\neq b$, then", "image": null}, "options": [{"id": "4xN0O", "text": "\na + b + 4 = 0\n", "image": null, "isCorrect": true}, {"id": "djNXO", "text": "\na + b - 4 = 0\n", "image": null, "isCorrect": false}, {"id": "MkUJ5", "text": "\na - b - 4 = 0\n", "image": null, "isCorrect": false}, {"id": "9JKsn", "text": "\na - b + 4 = 0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/aQUxh7k7F-1vAUlpKcG2-ZslEhU7ehf1U7H9_-rhpa8.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d692c7", "title": "Graph and Sign of Quadratic", "totalQuestions": 6, "questions": [{"_id": "69d8075881239f6567c4f4a9", "type": "numerical", "question": {"text": "Let $a, b, c \\in \\{1, 2, 3, 4\\}$. If the probability, that $ax^2 + 2\\sqrt{2}\\,bx + c > 0$ for all $x \\in \\mathbb{R}$, is $\\dfrac{m}{n}$, $\\gcd(m, n) = 1$, then $m + n$ is equal to _______.", "image": null}, "options": [], "correctValue": "81", "solution": {"text": "For the quadratic expression $ax^2 + 2\\sqrt{2}bx + c > 0$ for all $x \\in \\mathbb{R}$, the leading coefficient must be positive and the discriminant must be negative.<br><br>Since $a \\in \\{1, 2, 3, 4\\}$, the condition $a > 0$ is always satisfied.<br><br>The discriminant condition is:<br>$D < 0$<br>$\\Rightarrow (2\\sqrt{2}b)^2 - 4ac < 0$<br>$\\Rightarrow 8b^2 - 4ac < 0$<br>$\\Rightarrow 2b^2 < ac$<br><br>The total number of possible triplets $(a, b, c)$ is $4 \\times 4 \\times 4 = 64$.<br><br>Now, we find the number of favorable outcomes by checking the possible values of $b \\in \\{1, 2, 3, 4\\}$:<br><br>Case 1: $b = 1$<br>We need $2(1)^2 < ac \\Rightarrow ac > 2$.<br>The total number of pairs $(a, c)$ is $4 \\times 4 = 16$.<br>The pairs for which $ac \\le 2$ are $(1, 1), (1, 2), (2, 1)$, which are $3$ in number.<br>So, the number of pairs with $ac > 2$ is $16 - 3 = 13$.<br><br>Case 2: $b = 2$<br>We need $2(2)^2 < ac \\Rightarrow ac > 8$.<br>The possible pairs $(a, c)$ from the given set are $(3, 3), (3, 4), (4, 3), (4, 4)$.<br>So, there are $4$ pairs.<br><br>Case 3: $b = 3$<br>We need $2(3)^2 < ac \\Rightarrow ac > 18$.<br>Since the maximum possible value of $ac$ is $4 \\times 4 = 16$, there are $0$ pairs.<br><br>Case 4: $b = 4$<br>We need $2(4)^2 < ac \\Rightarrow ac > 32$.<br>Again, there are $0$ pairs.<br><br>Total number of favorable outcomes = $13 + 4 = 17$.<br><br>The required probability is $\\dfrac{m}{n} = \\dfrac{17}{64}$.<br><br>Since $\\gcd(17, 64) = 1$, we have $m = 17$ and $n = 64$.<br><br>Therefore, $m + n = 17 + 64 = 81$.<br><br>Answer: $81$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "e151015a906145e7b50266ec18cb8f76", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Zg2NK1zSdjUOv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Zg2NK1zSdjUOv.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd30ba0e94a3c4025b15", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> be the set of positive integral values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> for which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mfenced><mrow><mi>a</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mi>x</mi><mo>+</mo><mn>9</mn><mi>a</mi><mo>+</mo><mn>4</mn></mrow><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>8</mn><mi>x</mi><mo>+</mo><mn>32</mn></mrow></mfrac><mo>&lt;</mo><mn>0</mn><mo>,</mo><mo> </mo><mo>∀</mo><mi>x</mi><mo>∈</mo><mi mathvariant=\"normal\">ℝ</mi></math>. math><mi>p</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>x</mi><mo>+</mo><mn>1</mn></math><br /><br /><math><mi>p</mi><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>16</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>19</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a23", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "If $a, b, c, d$ and $p$ are distinct real numbers such that $\\left(a^2+b^2+c^2\\right) p^2-2 p(a b+b c+c d)+\\left(b^2+\\right.$ $\\left.c^2+d^2\\right) \\leq 0$, then", "image": null}, "options": [{"id": "7eWxC", "text": "\n$a, b, c, d$ are in A.P.\n", "image": null, "isCorrect": false}, {"id": "6NTh5", "text": "\n$a b=c d$\n", "image": null, "isCorrect": false}, {"id": "1gcyu", "text": "\n$a c=b d$\n", "image": null, "isCorrect": false}, {"id": "G1swE", "text": "\n$a, b, c, d$ are in G.P.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given relation can be written as $\\left(a^2 p^2-2 a b p+b^2\\right)+\\left(b^2 p^2+c^2-2 b p c\\right)+$ $\\left(c^2 p^2+d^2-2 p c d\\right) \\leq 0$ or $\\quad(a p-b)^2+(b p-c)^2+(c p-d)^2 \\leq 0$\n...(1)\nSince $a, b, \\mathrm{c}, d$ and $p$ are all real, the inequality (1) is possible only when each of factor is zero. i.e., $a p-b=0, b p-c=0$ and $c p-d=0$ or $\\quad p=\\frac{b}{a}=\\frac{c}{b}=\\frac{d}{c}$ or $a, b, c, d$ are in G.P.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "648b5a73417cc3fb48d692c5", "title": "Location of Roots", "totalQuestions": 15, "questions": [{"_id": "69d8074a81239f6567c4f3ff", "type": "singleCorrect", "question": {"text": "Let $e_1$ and $e_2$ be two distinct roots of the equation $x^2 - ax + 2 = 0$. Let the sets $\\{a \\in \\mathbb{R} : e_1 \\text{ and } e_2 \\text{ are the eccentricities of hyperbolas}\\} = (\\alpha, \\beta)$, and $\\{a \\in \\mathbb{R} : e_1 \\text{ and } e_2 \\text{ are the eccentricities of an ellipse and a hyperbola, respectively}\\} = (\\gamma, \\infty)$. Then $\\alpha^2 + \\beta^2 + \\gamma^2$ is equal to:", "image": null}, "options": [{"id": "5cUqW", "text": "$18$", "isCorrect": false, "image": null}, {"id": "eB7WE", "text": "$22$", "isCorrect": false, "image": null}, {"id": "kWIeR", "text": "$26$", "isCorrect": true, "image": null}, {"id": "rvaAa", "text": "$34$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given quadratic equation is $x^2 - ax + 2 = 0$ with roots $e_1$ and $e_2$.<br><br>The sum of the roots is $e_1 + e_2 = a$ and the product is $e_1 e_2 = 2$.<br><br>For the roots to be real and distinct, the discriminant must be positive:<br><br>$\\Delta = a^2 - 8 > 0 \\Rightarrow a \\in (-\\infty, -2\\sqrt{2}) \\cup (2\\sqrt{2}, \\infty)$<br><br>Since $e_1$ and $e_2$ represent eccentricities, they must be positive. Given $e_1 e_2 = 2 > 0$, both roots have the same sign. For them to be positive, their sum must be positive, so $a > 0$. Thus, $a > 2\\sqrt{2}$.<br><br>For $e_1$ and $e_2$ to be the eccentricities of hyperbolas, both must be strictly greater than $1$. This requires $1$ to lie outside the roots and the vertex of the parabola to be to the right of $1$:<br><br>$(e_1 - 1)(e_2 - 1) > 0 \\Rightarrow e_1 e_2 - (e_1 + e_2) + 1 > 0$<br><br>$2 - a + 1 > 0 \\Rightarrow a < 3$<br><br>Combining this with the discriminant condition, we get $a \\in (2\\sqrt{2}, 3)$.<br><br>Thus, $\\alpha = 2\\sqrt{2}$ and $\\beta = 3$.<br><br>For $e_1$ and $e_2$ to be the eccentricities of an ellipse and a hyperbola, one root must be in $(0, 1)$ and the other in $(1, \\infty)$. This requires $1$ to lie between the roots:<br><br>$(e_1 - 1)(e_2 - 1) < 0 \\Rightarrow 2 - a + 1 < 0 \\Rightarrow a > 3$<br><br>For $a > 3$, the roots are real, distinct, and positive. Thus, the set of such $a$ is $(3, \\infty)$.<br><br>This gives $\\gamma = 3$.<br><br>Finally, calculating the required sum:<br><br>$\\alpha^2 + \\beta^2 + \\gamma^2 = (2\\sqrt{2})^2 + 3^2 + 3^2 = 8 + 9 + 9 = 26$<br><br>Answer: $26$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "060f2eb30e6e45e284546e25f61f7c01", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/III0ziwS6is2G.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/III0ziwS6is2G.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074381239f6567c4f3b6", "type": "singleCorrect", "question": {"text": "If the quadratic equation $(\\lambda+2)x^2-3\\lambda x+4\\lambda=0$, $\\lambda \\neq -2$, has two positive roots, then the number of possible integral values of $\\lambda$ is:", "image": null}, "options": [{"id": "sZfce", "text": "$1$", "isCorrect": false, "image": null}, {"id": "EapVz", "text": "$2$", "isCorrect": true, "image": null}, {"id": "tFPtN", "text": "$3$", "isCorrect": false, "image": null}, {"id": "QET5i", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the quadratic equation $(\\lambda+2)x^2-3\\lambda x+4\\lambda=0$ to have two positive roots, the following three conditions must be satisfied:<br><br>1. Discriminant $D \\ge 0$<br>$(-3\\lambda)^2 - 4(\\lambda+2)(4\\lambda) \\ge 0$<br>$9\\lambda^2 - 16\\lambda^2 - 32\\lambda \\ge 0$<br>$-7\\lambda^2 - 32\\lambda \\ge 0$<br>$7\\lambda^2 + 32\\lambda \\le 0$<br>$\\lambda(7\\lambda + 32) \\le 0$<br>$\\lambda \\in \\left[-\\dfrac{32}{7}, 0\\right]$<br><br>2. Sum of roots $> 0$<br>$\\alpha + \\beta = \\dfrac{3\\lambda}{\\lambda+2} > 0$<br>$\\lambda \\in (-\\infty, -2) \\cup (0, \\infty)$<br><br>3. Product of roots $> 0$<br>$\\alpha \\beta = \\dfrac{4\\lambda}{\\lambda+2} > 0$<br>$\\lambda \\in (-\\infty, -2) \\cup (0, \\infty)$<br><br>Taking the intersection of all three conditions, we get:<br>$\\lambda \\in \\left[-\\dfrac{32}{7}, -2\\right)$<br><br>Since $-\\dfrac{32}{7} \\approx -4.57$, the possible integral values of $\\lambda$ in this interval are $-4$ and $-3$.<br><br>Thus, there are $2$ possible integral values of $\\lambda$.<br><br>Answer: $2$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "0eb61e4df9df4cacb42be3c9aa9812ae", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/j4zDLRkJmX4xQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/j4zDLRkJmX4xQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1808bfdbb2435639585", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $\\alpha$ and $\\beta$ be the roots of the equation $x^{2}+2 a x+(3 a+10)=0$ such that $\\alpha<1<\\beta$. Then the set of all possible values of $a$ is :", "image": null}, "options": [{"id": "nVH2K", "text": "$\\left(-\\infty, \\frac{-11}{5}\\right)$", "isCorrect": true, "image": null}, {"id": "Bsb84", "text": "$(-\\infty,-2) \\cup(5, \\infty)$", "isCorrect": false, "image": null}, {"id": "gYqWK", "text": "$(-\\infty,-3)$", "isCorrect": false, "image": null}, {"id": "a7vML", "text": "$\\left(-\\infty, \\frac{-11}{5}\\right) \\cup(5, \\infty)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x) = x^2 + 2ax + (3a + 10)$. For $\\alpha < 1 < \\beta$, since the leading coefficient is positive, we need $f(1) < 0$.<br>$f(1) = 1 + 2a + 3a + 10 = 5a + 11 < 0$<br>$a < -\\frac{11}{5}$<br>When $f(1) < 0$ with positive leading coefficient, the parabola is negative at $x = 1$, so 1 lies strictly between the two real roots. Discriminant is automatically positive.<br>$a \\in \\left(-\\infty, -\\frac{11}{5}\\right)$.", "image": null}, "videoSolution": {"videoId": "52ceb8b9e16a413b83b8ee937b1513a9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/K85NE1xilDXTt.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/K85NE1xilDXTt.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644674e970e6e9ab542d21d", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 2)", "title": "JEE Main 2024 (08 Apr Shift 2)"}], "question": {"text": "The number of distinct real roots of the equation $|x+1||x+3|-4|x+2|+5=0$, is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "$|x+1||x+3|-4|x+2|+5=0$\ncase-1\n$\\begin{aligned}\n& x \\leq-3 \\\\\n& (x+1)(x+3)+4(x+2)+5=0 \\\\\n& x^2+4 x+3+4 x+8+5=0 \\\\\n& x^2+8 x+16=0 \\\\\n& (x+4)^2=0
