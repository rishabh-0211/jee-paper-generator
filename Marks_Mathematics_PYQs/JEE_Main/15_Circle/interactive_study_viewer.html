mo>=</mo><mn>60</mn><mo>&#177;</mo><mfrac><msqrt><mn>239</mn></msqrt><mn>2</mn></mfrac></math></p><p>So, from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>v</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mo>&#8712;</mo><mfenced close=\"]\" open=\"[\"><mrow><mfenced><mrow><mfrac><mrow><mn>1</mn><mo>-</mo><msqrt><mn>239</mn></msqrt></mrow><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mn>1</mn><mo>-</mo><msqrt><mn>39</mn></msqrt></mrow><mn>2</mn></mfrac></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>39</mn></msqrt></mrow><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>239</mn></msqrt></mrow><mn>2</mn></mfrac></mrow></mfenced></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>p</mi><mn>2</mn></msup><mo>&#8712;</mo><mfenced close=\"]\" open=\"[\"><mrow><mfenced><mrow><mn>10</mn><mo>-</mo><mfrac><msqrt><mn>39</mn></msqrt><mn>2</mn></mfrac><mo>,</mo><mn>60</mn><mo>-</mo><mfrac><msqrt><mn>239</mn></msqrt><mn>2</mn></mfrac></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><mn>10</mn><mo>+</mo><mfrac><msqrt><mn>39</mn></msqrt><mn>2</mn></mfrac><mo>,</mo><mn>60</mn><mo>+</mo><mfrac><msqrt><mn>239</mn></msqrt><mn>2</mn></mfrac></mrow></mfenced></mrow></mfenced></math></p><p>So, number of integral values of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>61</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 1)", "title": "JEE Main 2021 (27 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67671", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Consider a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;which touches the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo></math>&nbsp;axis at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mn>6</mn></mrow></mfenced></math> and cuts off an intercept <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><msqrt><mn>5</mn></msqrt></math>&nbsp;on the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo></math> axis. Then the radius of the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> is equal to :", "image": null}, "options": [{"id": "ASaNv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>53</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "o9ZnY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math>", "isCorrect": true, "image": null}, {"id": "Pex61", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "isCorrect": false, "image": null}, {"id": "v0q2c", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>82</mn></msqrt></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We have, a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;which touches the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo></math>&nbsp;axis at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mn>6</mn></mrow></mfenced></math> and cuts off an intercept <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><msqrt><mn>5</mn></msqrt></math>&nbsp;on the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo></math> axis.</p><p>We know that, length of the&nbsp;chord of the circle using perpendicular distance from the center is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><msup><mi>d</mi><mn>2</mn></msup></msqrt></math>&nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is the radius of the circle and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>&nbsp;is&nbsp;the perpendicular distance from the center&nbsp;to the chord.</p><p>From the given data, we have the following diagram</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9bbdc738-5a2f-4cc2-b49c-1fea0442b4d4-image.png\" style=\"width: 370px; height: 350px;\" /></p><p>Hence,&nbsp;length of the&nbsp;chord of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msqrt><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><msup><mi>d</mi><mn>2</mn></msup></msqrt><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msqrt><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><msup><mi>d</mi><mn>2</mn></msup></msqrt><mo>=</mo><mn>3</mn><msqrt><mn>5</mn></msqrt></math></p><p>On squaring on both sides</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><msup><mi>d</mi><mn>2</mn></msup><mo>=</mo><mn>45</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>d</mi><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mn>45</mn></math></p><p>Given that ML\"><mi>y</mi><mo>=</mo><mn>2</mn></math>&nbsp;touches the circle means distance from&nbsp;the Centre of circle to the line is equal to radius.</p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is radius of circle.</p><p>For the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>3</mn><mo>&#160;</mo><mo>&#8658;</mo><mi>x</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mi>&#945;</mi><mo>-</mo><mn>3</mn></mrow><mn>1</mn></mfrac></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\"><mrow><mi>&#945;</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>For the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mo>&#8658;</mo><mi>y</mi><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mfenced><mrow><mn>2</mn><mo>-</mo><mi>&#945;</mi></mrow></mfenced><mo>-</mo><mn>2</mn></mrow><mn>1</mn></mfrac></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\"><mi>&#945;</mi></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>From&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>2</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mi>&#945;</mi></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\"><mrow><mi>&#945;</mi><mo>-</mo><mn>3</mn></mrow></mfenced></math></p><p>Squaring both side</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>=</mo><msup><mfenced><mrow><mi>&#945;</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mn>2</mn></msup><mo>&#160;</mo><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>=</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>&#945;</mi><mo>+</mo><mn>9</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mi>&#945;</mi><mo>=</mo><mn>9</mn><mo>&#160;</mo><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math></p><p>We know&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mi>&#945;</mi></mfenced><mo>&#160;</mo><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math>.</p><p>Diameter<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mi>r</mi><mo>=</mo><mn>2</mn><mfenced><mfrac><mn>3</mn><mn>2</mn></mfrac></mfenced><mo>=</mo><mn>3</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf800", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T09:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 1)", "title": "JEE Main 2020 (03 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66897", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 2)", "title": "JEE Main 2019 (12 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A circle touching the <math><mi>x</mi><mo>-</mo></math> axis at <math><mo>(</mo><mn>3</mn><mo>,</mo><mi>&#160;</mi><mn>0</mn><mo>)</mo></math> and making an intercept of length <math><mn>8</mn></math> on the <math><mi>y</mi><mo>-</mo></math> axis passes through the point:", "image": null}, "options": [{"id": "wDxql", "text": "<math><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi> </mi><mn>10</mn></mrow></mfenced><mi> </mi></math>", "isCorrect": true, "image": null}, {"id": "T5exg", "text": "<math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi> </mi><mn>3</mn></mrow></mfenced><mi> </mi></math>", "isCorrect": false, "image": null}, {"id": "Nsykd", "text": "<math><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi> </mi><mn>5</mn></mrow></mfenced><mi> </mi><mi> </mi></math>", "isCorrect": false, "image": null}, {"id": "1WdNq", "text": "<math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi> </mi><mn>5</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/16dfa50b-791b-4cf0-9edf-1322678bb32c-image.png\" style=\"width: 347px; height: 269px;\" /><br />Since circle touches the x-axis at <math><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0</mn></mrow></mfenced><mo>,</mo></math> hence centre can be taken as <math><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi mathvariant=\"normal\">&#945;</mi></mrow></mfenced></math> and radius <math><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi mathvariant=\"normal\">&#945;</mi></mrow></mfenced></math><br />Since y-intercept is 8, by applying Pythagorean theorem<br /><math><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mn>4</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>&#945;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mn>5</mn><mo>,</mo><mo>-</mo><mn>5</mn></math><br />Hence two circles are possible<br /><math><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>5</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>25</mn><mi>&#160;</mi></math> and <math><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>5</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>25</mn><mo>.</mo></math><br />Clearly <math><mo>(</mo><mn>3</mn><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>10</mn><mo>)</mo></math> satisfies the given equation of circle.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 2)", "title": "JEE Main 2019 (12 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d6650c", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A rectangle is inscribed in a circle with a diameter lying along the line <math><mn>3</mn><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>7</mn><mo>.</mo></math> If the two adjacent vertices of the rectangle are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>8</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>6</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced><mo>,</mo></math> then the area of the rectangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo></math>in sq. units<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>)</mo></math>&nbsp;is:", "image": null}, "options": [{"id": "HTyH0", "text": "<math><mn>72</mn></math>", "isCorrect": false, "image": null}, {"id": "uzxlB", "text": "<math><mn>98</mn></math>", "isCorrect": false, "image": null}, {"id": "wiiOT", "text": "<math><mn>56</mn></math>", "isCorrect": false, "image": null}, {"id": "N1bfA", "text": "<math><mn>84</mn></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, the two adjacent vertices of the rectangle are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>8</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>6</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced><mo>,</mo></math>&nbsp;the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-co-ordinates of both of these points is same this means they lie on the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>5</mn><mo>,</mo></math>&nbsp;which is parallel to the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis.</p><p>And, we know that the sides of a rectangle are perpendicular to each other, hence the other two sides passing through these vertices are parallel to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis.</p><p>Also, we know that the equation of a line parallel&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>k</mi><mo>.</mo></math></p><p>Therefore, the equation of the sides of the rectangle passing through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>8</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>6</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced></math>&nbsp;are respectively&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mo>-</mo><mn>8</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>6</mn><mo>.</mo></math></p><p>And, hence the other two vertices of the rectangle can be taken as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>6</mn><mo>,</mo><mo>&#160;</mo><mi>a</mi></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>8</mn><mo>,</mo><mo>&#160;</mo><mi>b</mi></mrow></mfenced><mo>.</mo></math></p><p>And since the other side is parallel to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis, hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mi>b</mi><mo>.</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/df01fcd9-ff1f-4685-956d-b9b82284be2f-image2.png\" style=\"width: 250px; height: 260px;\" /></p><p>Here, diagonal subtends right angle at the circumference of circle, so its mid-point is the same as centre of circle, which lies on the given diameter.</p><p>The mid-point of a line segment joining the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><msub><mi>y</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo></math>&nbsp;hence, the mid-point of the diagonal of the rectangle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mrow><mo>-</mo><mn>8</mn><mo>+</mo><mn>6</mn></mrow><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mi>a</mi><mo>+</mo><mn>5</mn></mrow><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mi>a</mi><mo>+</mo><mn>5</mn></mrow><mn>2</mn></mfrac></mrow></mfenced></math></p><p>This point lie on the diameter&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>7</mn></math></p><p>So,&nbsp;<math><mfrac><mrow><mn>3</mn><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mn>5</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mn>1</mn><mo>+</mo><mn>7</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>+</mo><mn>5</mn><mo>=</mo><mfrac><mrow><mn>2</mn><mfenced separators=\"|\"><mn>6</mn></mfenced></mrow><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p>Hence, the vertices are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>8</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>6</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>6</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>8</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn></mrow></mfenced><mo>.</mo></math></p><p>The distance between the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>-</mo><msub><mi>x</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>-</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup></msqrt></math></p><p>Thus, the length of sides are <math><mn>6</mn></math> and <math><mn>14</mn></math>&nbsp;units.</p><p>Hence, area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>l</mi><mo>&#215;</mo><mi>b</mi><mo>=</mo><mn>14</mn><mo>&#215;</mo><mn>6</mn><mo>=</mo><mn>84</mn></math>&nbsp;sq. units</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d6677f", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A square is inscribed in the circle $x^{2}+y^{2}-6 x+8 y-103=0$ with its sides parallel to the coordinate axes. Then the distance of the vertex of this square which is nearest to the origin is:", "image": null}, "options": [{"id": "VY17N", "text": "6", "isCorrect": false, "image": null}, {"id": "u8vnl", "text": "$\\sqrt{137}$", "isCorrect": false, "image": null}, {"id": "z94us", "text": "$\\sqrt{41}$", "isCorrect": true, "image": null}, {"id": "z7JwB", "text": "13", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of circle is, $x^{2}+y^{2}-6 x+8 y-103=0$\r\n\r\n$\\Rightarrow(x-3)^{2}+(y+4)^{2}=(8 \\sqrt{2})^{2}$\r\n\r\n$C(3,-4), r=8 \\sqrt{2}$\r\n\r\n$\\Rightarrow$ Length of side of square $=\\sqrt{2} r=16$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Fq7DOV3dN_-asxrA0Suol88Vmc0toRQPpSLIs2MG3Sk.original.fullsize.png\"><br>\r\n\r\n$\\Rightarrow P(-5,4), Q(-5,-12)$\r\n\r\n$R(11,-12), S(11,4)$\r\n\r\n$\\Rightarrow$ Required distance $=O P$\r\n\r\n$=\\sqrt{(-5-0)^{2}+(-4-0)^{2}}=\\sqrt{25+16}=\\sqrt{41}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6629a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}], "question": {"text": "A circle passes through the points $(2,3)$ and $(4$, 5). If its centre lies on the line, $y-4 x+3=0$, then its radius is equal to", "image": null}, "options": [{"id": "veCaf", "text": "\n$\\sqrt{5}$\n", "image": null, "isCorrect": false}, {"id": "7Cdrn", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "W3rWu", "text": "\n $\\sqrt{2}$\n", "image": null, "isCorrect": true}, {"id": "lfofi", "text": "\n 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of the line passing through the points $(2,3)$ and $(4,5)$ is\n$$\ny-3=\\left(\\frac{5-3}{4-2}\\right) x-2 \\Rightarrow x-y+1=0\n$$\nEquation of the perpendicular line passing through the midpoint $(3,4)$ is $x+y-7=0$\nLines (1) and (2) intersect at the center of the circle. So, the center of the circle is $(3,4)$ Therefore, the radius is\n$$\n\\begin{aligned}\n&\\sqrt{\\left(x_2-x_1\\right)^2+\\left(y_2-y_1\\right)^2} \\\\\n&=\\sqrt{(2-3)^2+(3-4)^2}=\\sqrt{2} \\text { units. }\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6607a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}], "question": {"text": "A circle passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math> and touches the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo></math>axis at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math>. Which one of the following equations can represent a diameter of this circle ?", "image": null}, "options": [{"id": "e2Ls4", "text": "<math><mn>2</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>+</mo><mn>10</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "V1GvT", "text": "<math><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "YRYjE", "text": "<math><mn>4</mn><mi>x</mi><mo>+</mo><mn>5</mn><mi>y</mi><mo>-</mo><mn>6</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "xv2WN", "text": "<math><mn>5</mn><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mi>axis</mi></math> is tangent to the circle therefore the centre of the circle would be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>,</mo><mn>2</mn></mrow></mfenced></math> and distance of centre from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math>&nbsp;should be equal.<br /><br /><math><mo>&#8756;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mn>0</mn><mn>2</mn></msup></msqrt><mo>=</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mfenced separators=\"|\"><mrow><mi>h</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mn>2</mn><mn>2</mn></msup></msqrt></math><br /><br /><math><mo>&#8658;</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>h</mi><mn>2</mn></msup><mo>=</mo><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mi>h</mi><mo>+</mo><mn>4</mn><mo>+</mo><mn>4</mn></math><br /><br /><math><mo>&#8658;</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mo>-</mo><mn>2</mn></math><br /><br />Hence, centre&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math>.<br /><br /><math><mo>&#8756;</mo></math> <math><mn>2</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>+</mo><mn>10</mn><mo>=</mo><mn>0</mn></math> is&nbsp;the diameter, as centre lies on it.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65fd0", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2015 (11 Apr Online)", "title": "JEE Main 2015 (11 Apr Online)"}], "question": {"text": "If a circle passing through the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math>&nbsp;touches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced></math>, then the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-intercept&nbsp;of the circle is&nbsp;", "image": null}, "options": [{"id": "4unAB", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "4NdMc", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "1vaJa", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "8vJem", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": true}], "corre
