 false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d678d7", "previousYearPapers": [{"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> touch the lines <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mo>:</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>+</mo><msub><mi>K</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub><mo>:</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>+</mo><msub><mi>K</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn><mo>,</mo><msub><mrow><mo>&#160;</mo><mi>K</mi></mrow><mn>1</mn></msub><mo>,</mo><msub><mrow><mo>&#160;</mo><mi>K</mi></mrow><mn>2</mn></msub><mo>&#8712;</mo><mi mathvariant=\"bold-italic\">R</mi></math>. If a line passing through the centre of the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> intersects <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>&nbsp;at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math>&nbsp;at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mo>-</mo><mn>6</mn></mrow></mfenced></math>, then the equation of the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> is", "image": null}, "options": [{"id": "SYtQL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn></math>", "isCorrect": false, "image": null}, {"id": "w9smG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>16</mn></math>", "isCorrect": true, "image": null}, {"id": "x07uh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn></math>", "isCorrect": false, "image": null}, {"id": "1dXRG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>16</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mo>=</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>+</mo><msub><mi>K</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn><mo>;</mo><mo>&#160;</mo><msub><mi>L</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>+</mo><msub><mi>K</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></math></p><p>Here line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math>&nbsp;are parallel.</p><p>So,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c4f165b2-844b-4158-8b48-e604cc73699b-image.png\" style=\"width: 350px; height: 143px;\" /></p><p>Now point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math>&nbsp;will satisfy&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>&nbsp;so,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>4</mn><mo>-</mo><mn>3</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><msub><mi>K</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msub><mi>K</mi><mn>2</mn></msub><mo>=</mo><mn>10</mn></math></p><p>Also point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mrow><mn>3</mn><mo>,</mo><mo>-</mo><mn>6</mn></mrow></mfenced></math> will satisfy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>+</mo><msub><mi>K</mi><mn>2</mn></msub></math></p><p>So&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#215;</mo><mn>3</mn><mo>-</mo><mn>3</mn><mo>&#215;</mo><mfenced><mrow><mo>-</mo><mn>6</mn></mrow></mfenced><mo>+</mo><msub><mi>K</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#8658;</mo><msub><mi>K</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>30</mn></math></p><p>Now distance between the&nbsp;parallel line will be the diameter</p><p>Diameter&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><msub><mi>K</mi><mn>1</mn></msub><mo>-</mo><msub><mi>K</mi><mn>2</mn></msub></mrow><msqrt><msup><mn>4</mn><mn>2</mn></msup><mo>+</mo><msup><mn>3</mn><mn>2</mn></msup></msqrt></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mn>10</mn><mo>+</mo><mn>30</mn></mrow><mn>5</mn></mfrac></mfenced><mo>=</mo><mn>8</mn></math></p><p>So radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>8</mn><mn>2</mn></mfrac><mo>=</mo><mn>4</mn></math></p><p>Now mid-point of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> will give us centre of circle by symmetry,&nbsp;so by midpoint formula in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> we get centre <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math>,</p><p>Now equation of circle will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mn>4</mn><mn>2</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66fc4", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf811", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T14:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 2)", "title": "JEE Main 2021 (17 Mar Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let the tangent to the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn></math>&nbsp;at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>(</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>)</mo></math> meet <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> -axis and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>, respectively. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> is the radius of the circle passing through the origin <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> and having centre at the incentre of the triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi><mi>Q</mi><mo>,</mo></math>&nbsp;then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>r</mi><mn>2</mn></msup></math> is equal to", "image": null}, "options": [{"id": "nA5ra", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>529</mn><mn>64</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "Q0dnr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>125</mn><mn>72</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "BxXau", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>625</mn><mn>72</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "celpJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>585</mn><mn>66</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The equation of tangent to a circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup></math>&nbsp;at a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mi>y</mi><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>.</mo></math></p><p>Thus, the tangent to circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>4</mn></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>25</mn><mo>.</mo></math></p><p>To find the coordinates of the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;on the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis, put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>0</mn><mo>,</mo></math>&nbsp;to get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>=</mo><mn>25</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mn>25</mn><mn>3</mn></mfrac></math></p><p>Thus, the coordinates of the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>25</mn><mn>3</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced><mo>.</mo></math></p><p>Similarly, to find the coordinates of the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;on the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis, put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn><mo>,</mo></math>&nbsp;to get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>y</mi><mo>=</mo><mn>25</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mfrac><mn>25</mn><mn>4</mn></mfrac></math></p><p>Thus, the coordinates of the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>25</mn><mn>4</mn></mfrac></mrow></mfenced><mo>.</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/cddd52c3-200c-4cb7-9403-909eb14e7f44-image.png\" style=\"width: 354px; height: 250px;\" /></p><p>The incentre of a triangle with vertices&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>3</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mrow><mi>a</mi><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mi>b</mi><msub><mi>x</mi><mn>2</mn></msub><mo>+</mo><mi>c</mi><msub><mi>x</mi><mn>3</mn></msub></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>+</mo><mi>c</mi></mrow></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mi>a</mi><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><mi>b</mi><msub><mi>y</mi><mn>2</mn></msub><mo>+</mo><mi>c</mi><msub><mi>y</mi><mn>3</mn></msub></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>+</mo><mi>c</mi></mrow></mfrac></mrow></mfenced><mo>,</mo></math>&nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>,</mo><mo>&#160;</mo><mi>b</mi><mo>,</mo><mo>&#160;</mo><mi>c</mi></math>&nbsp;units&nbsp;are respectively the lengths of the sides opposite to vertices with coordinates&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><msub><mi>x</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>3</mn></msub></mrow></mfenced><mo>.</mo></math></p><p>In&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>O</mi><mi>P</mi><mi>Q</mi><mo>,</mo></math>&nbsp;we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi><mo>=</mo><mfrac><mn>25</mn><mn>3</mn></mfrac><mo>,</mo><mo>&#160;</mo><mi>O</mi><mi>Q</mi><mo>=</mo><mfrac><mn>25</mn><mn>4</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><msqrt><msup><mfenced><mrow><mfrac><mn>25</mn><mn>3</mn></mfrac><mo>-</mo><mn>0</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mn>0</mn><mo>-</mo><mfrac><mn>25</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mfrac><mn>125</mn><mn>12</mn></mfrac></math>&nbsp;units.</p><p>Thus, the incentre of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>O</mi><mi>P</mi><mi>Q</mi></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mfrac><mrow><mn>0</mn><mo>+</mo><mn>0</mn><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mn>25</mn><mn>4</mn></mfrac></mstyle><mo>&#215;</mo><mstyle displaystyle=\"true\"><mfrac><mn>25</mn><mn>3</mn></mfrac></mstyle></mrow><mn>25</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mn>0</mn><mo>+</mo><mn>0</mn><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mn>25</mn><mn>4</mn></mfrac></mstyle><mo>&#215;</mo><mstyle displaystyle=\"true\"><mfrac><mn>25</mn><mn>3</mn></mfrac></mstyle></mrow><mn>25</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mfrac><mn>25</mn><mn>12</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mn>25</mn><mn>12</mn></mfrac></mrow></mfenced><mo>.</mo></math></p><p>The point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>25</mn><mn>12</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mn>25</mn><mn>12</mn></mfrac></mrow></mfenced></math>&nbsp;is the centre of the circle of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;which passes through origin&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mo>,</mo></math>&nbsp;thus&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><msqrt><msup><mfenced><mrow><mfrac><mn>25</mn><mn>12</mn></mfrac><mo>-</mo><mn>0</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mfrac><mn>25</mn><mn>12</mn></mfrac><mo>-</mo><mn>0</mn></mrow></mfenced><mn>2</mn></msup></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><msup><mfenced><mfrac><mn>25</mn><mn>12</mn></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>625</mn><mn>144</mn></mfrac><mo>=</mo><mfrac><mn>625</mn><mn>72</mn></mfrac><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf811", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T14:00:00.000Z", "isVisible": true, "s "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T09:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 1)", "title": "JEE Main 2021 (16 Mar Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi></math> be a square of side of unit length. Let a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub></math> centered at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> with unit radius is drawn. Another circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math> which touches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub></math>&nbsp;and the lines <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>D</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> are tangent to it, is also drawn. Let a tangent line from the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> to the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math> meet the side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>. If the length of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mi>B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><msqrt><mn>3</mn></msqrt><mi>&#946;</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></math> are integers, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></math> is equal to ________.", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<p>According to the question we get,&nbsp;&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b2d21275-834b-4b02-96a8-a16d365b65f4-image.png\" style=\"width: 359px; height: 350px;\" /></p><p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>O</mi><mo>+</mo><mi>O</mi><mi>P</mi><mo>=</mo><mn>1</mn></math> or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced><mi>r</mi><mo>=</mo><mn>1</mn><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mfrac><mn>1</mn><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></math>.</p><p>The equation of&nbsp;circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mi>r</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mi>r</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math>.&nbsp;</p><p>The equation of tangent&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>E</mi></math> of slope&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mi>m</mi><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>m</mi><mi>x</mi><mo>-</mo><mi>y</mi><mo>+</mo><mn>1</mn><mo>-</mo><mi>m</mi><mo>=</mo><mn>0</mn></math></p><p>It is tangent to the circle, then the distance of center of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub><mfenced><mrow><mi>r</mi><mo>,</mo><mi>r</mi></mrow></mfenced></math>&nbsp;from the tangent&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>E</mi></math>&nbsp;is equal to the radius of circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mi>m</mi><mi>r</mi><mo>-</mo><mi>r</mi><mo>+</mo><mn>1</mn><mo>-</mo><mi>m</mi></mrow><msqrt><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></msqrt></mfrac></mfenced><mo>=</mo><mi>r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mfenced><mrow><mi>m</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mi>r</mi><mo>+</mo><mn>1</mn><mo>-</mo><mi>m</mi></mrow><msqrt><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></msqrt></mfrac></mfenced><mo>=</mo><mi>r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><msup><mfenced><mrow><mi>m</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><msup><mfenced><mrow><mi>r</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></mrow><mrow><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math></p><p>Put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></math></p><p>On solving, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>2</mn><mo>-</mo><msqrt><mn>3</mn></msqrt><mo>,</mo><mo>&#160;</mo><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></math></p><p>Taking greater slope of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>E</mi></math> as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></math>, we get&nbsp;</p><p>Equation of tangent as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mfenced><mrow><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p>By substituting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>0</mn></math>, we get <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-coordinate of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mo>=</mo><mfenced><mrow><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>&#215;</mo><mfenced><mfrac><mrow><mn>2</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></mrow></mfrac></mfenced><mo>=</mo><mi>x</mi><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></math></p><p>So the coordinates of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>&#160;</mo><mtext>are</mtext><mo>&#160;</mo><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>,</mo><mn>0</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>E</mi><mi>B</mi><mo>=</mo><mn>1</mn><mo>-</mo><mi>x</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>E</mi><mi>B</mi><mo>=</mo><mn>2</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></math></p>", "image": null}, "videoSolution": {"videoId": "5147cb573b8d41aba42a74e9ed68408a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/zRNgXszbJdQXv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/zRNg mi>c</mi></math> is<br /><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>c</mi><mo>+</mo><mn>3</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>1</mn></math><br /><math><msup><mrow><mi>c</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>6</mn><mi>c</mi><mo>+</mo><mn>9</mn><mo>=</mo><mn>2</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>c</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>c</mi><mo>+</mo><mn>7</mn><mo>=</mo><mn>0</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7fb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T14:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 2)", "title": "JEE Main 2020 (08 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66463", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The tangent and the normal lines at the point <math><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>,</mo><mtext>&#8201;</mtext><mn>1</mn></mrow></mfenced></math> to the circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math> and the <math><mi>x</mi></math> -axis form a triangle. The area of this triangle (in square units) is:", "image": null}, "options": [{"id": "AnIDV", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "pbiGc", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "6wkIS", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "W9PeQ", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c8da9706-d44e-4bb8-a81a-193c154cc58f-image5.png\" /><br />Equation tangent at <math><mi>P</mi><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>,</mo><mtext>&#8201;&#8201;</mtext><mn>1</mn></mrow></mfenced></math><br /><math><mi>x</mi><mo>&#8901;</mo><msqrt><mn>3</mn></msqrt><mo>+</mo><mi>y</mi><mo>&#8901;</mo><mn>1</mn><mo>=</mo><mn>4</mn></math><br />x-intercept of this tangent is <math><mfrac><mrow><mn>4</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>.<br />Hence, area of <math><mi>&#916;</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#8901;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>&#8901;</mo><mn>1</mn><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557bc40d43b5ec151ee5479", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "The straight line $x+2 y=1$ meets the coordinate axes at $A$ and $\\mathrm{B}$. A circle is drawn through $\\mathrm{A}, \\mathrm{B}$ and the origin. Then the sum of perpendicular distances from $\\mathrm{A}$ and $\\mathrm{B}$ on the tangent to the circle at the origin is:", "image": null}, "options": [{"id": "wWwVA", "text": "$\\frac{\\sqrt{5}}{2}$", "isCorrect": true, "image": null}, {"id": "uhu5x", "text": "$2 \\sqrt{5}$", "isCorrect": false, "image": null}, {"id": "5Murk", "text": "$\\frac{\\sqrt{5}}{4}$", "isCorrect": false, "image": null}, {"id": "o6eqd", "text": "$4 \\sqrt{5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/afVTwy8UITcbU-UR4H4_PDai6VSUwnPWephI9IAx3II.original.fullsize.png\"><br>\r\n\r\nLet equation of circle be $x^{2}+y^{2}+2 g x+2 f y=0$\r\n\r\nAs length of intercept on $x$ axis is $1=2 \\sqrt{g^{2}-c}$\r\n\r\n$\\Rightarrow|g|=\\frac{1}{2}$\r\n\r\nlength of intercept on $y$ -axis $=\\frac{1}{2}=2 \\sqrt{f^{2}-c}$\r\n\r\n$\\Rightarrow|f|=\\frac{1}{4}$\r\n\r\nEquation of circle that passes through given points is\r\n\r\n$x^{2}+y^{2}-x-\\frac{y}{2}=0$\r\n\r\nTangent at (0,0) is,\r\n\r\n$(y-0)=\\left(\\frac{d y}{d x}\\right)_{(0,0)}^{(x-0)} \\cdot(\\mathrm{x}-0)$\r\n\r\n$\\Rightarrow 2 x+y=0$\r\n\r\nPerpendicular distance from $B(1,0)$ on the tangent to the circle $=\\frac{\\frac{1}{2}}{\\sqrt{5}}$\r\n\r\nPerpendicular distance from $B\\left(0, \\frac{1}{2}\\right)$ on the tangent to\r\n\r\nthe circle $=\\frac{2}{\\sqrt{5}}$\r\n\r\nSum of perpendicular distance $=\\frac{\\frac{1}{2}+2}{\\sqrt{5}}=\\frac{\\sqrt{5}}{2}$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66301", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}], "question": {"text": "The tangent to the circle $C_1: x^2+y^2-2 x-1=0$ at the point $(2,1)$ cuts off a chord of length 4 from a circle $C_2$ whose centre is $(3,-2)$. The radius of $C_2$ is", "image": null}, "options": [{"id": "14gBw", "text": "\n$\\sqrt{6}$\n", "image": null, "isCorrect": true}, {"id": "5zr5a", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "8Viap", "text": "\n$\\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "xqt0X", "text": "\n3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, equation of tangent on $C_1$ at $(2,1)$ is: $2 x+y-(x+2)-1=0$\nOr $x+y=3$\nIf it cuts off the chord of the circle $C_2$ then\nthe equation of the chord is:\n$$\nx+y=3\n$$\n$\\therefore \\quad$ distance of the chord from $(3,-2)$ is :\n$$\nd=\\left|\\frac{3-2-3}{\\sqrt{2}}\\right|=\\sqrt{2}\n$$\nAlso, length of the chord is $l=4$\n$$\n\\begin{aligned}\n\\therefore \\text { radius of } C_2=r &=\\sqrt{\\left(\\frac{l}{2}\\right)^2+d^2} \\\\\n&=\\sqrt{(2)^2+(\\sqrt{2})^2}=\\sqrt{6}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d660de", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2016 (10 Apr Online)", "title": "JEE Main 2016 (10 Apr Online)"}], "question": {"text": "Equation of the tangent to the circle, at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math>, whose center, is the point of intersection of the straight lines <math><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>1</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>3</mn></math> is:", "image": null}, "options": [{"id": "1gjkN", "text": "<math><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "iNsKG", "text": "<math><mn>3</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "2MXto", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "nFJXc", "text": "<math><mn>4</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c21bec11-1880-4759-ac89-97ca4d8db696-image.png\" style=\"width: 230px; height: 199px;\" /></p><p>Point of intersection of lines</p><p><math><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>1</mn></math> and <math><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> is&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>,</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow></mfenced></math></p><p>Slope of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi><mo>=</mo><mfrac><mrow><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>+</mo><mn>1</mn></mrow><mrow><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mfrac><mn>4</mn><mn>3</mn></mfrac><mfrac><mn>1</mn><mn>3</mn></mfrac></mfrac><mo>=</mo><mn>4</mn></math></p><p>Slope of tangent <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p><p><math><mo>&#8658;</mo></math> Equation of tangent :<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mi>&#160;</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mo>-</mo><mi>x</mi><mo>+</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2016 (10 Apr Online)", "title": "JEE Main 2016 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d6544c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Two common tangents to the circle $x^2+y^2=2 a^2$ and parabola $y^2=8 a x$ are", "image": null}, "options": [{"id": "1IpcD", "text": "\n$x=\\pm(y+2 a)$\n", "image": null, "isCorrect": false}, {"id": "RhVp9", "text": "\n$y=\\pm(x+2 a)$\n", "image": null, "isCorrect": true}, {"id": "7vGYC", "text": "\n$x=\\pm(y+a)$\n", "image": null, "isCorrect": false}, {"id": "OV8WF", "text": "\n$y=\\pm(x+a)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Any tangent to the parabola $y^2=8 a x$ is\n$$\ny=m x+\\frac{2 a}{m} \n$$\nIf (i) is a tangent to the circle, $x^2+y^2=2 a^2$ then, $\\quad \\sqrt{2} a=\\pm \\frac{2 a}{m \\sqrt{m^2+1}}$\n$$\n\\Rightarrow m^2\\left(1+m^2\\right)=2 \\Rightarrow\\left(m^2+2\\right)\\left(m^2-1\\right)=0 ; \\Rightarrow m=\\pm 1\n$$\nSo, $y=\\pm(x+2 a)$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "648b5a73417cc3fb48d6935a", "title": "Pair of Tangents", "totalQuestions": 12, "questions": [{"_id": "648b5a70417cc3fb48d68477", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math>&nbsp;be the origin and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>Q</mi></math> be the tangents to the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>8</mn><mo>=</mo><mn>0</mn></math>&nbsp;at the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> on it. If the circumcircle of the triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi><mi>Q</mi></math> passes through the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi mathvariant=\"normal\">&#945;</mi><mo>,</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced></math>, then a value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> is", "image": null}, "options": [{"id": "3oaw7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "9pFNY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "omxLL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "wacl0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>The given information can be represented in the form of the diagram below.​​​​​<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e833b854-f757-4b29-8dd1-8af1a324d362-image.png\" style=\"width: 370px; height: 214px;\" /></p><p>Since angle in a semicircle is a right angle.</p><p>Hence, the other circle will be passing&nbsp;through the centre of the first circle.</p><p>The two ends of diameter of the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mfenced><mrow><mn>0</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><mi>C</mi><mfenced><mrow><mn>3</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math>.</p><p>Hence, the required equation of circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>-</mo><mn>0</mn></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mo>+</mo><mfenced><mrow><mi>y</mi><mo>-</mo><mn>0</mn></mrow></mfenced><mfenced><mrow><mi>y</mi><mo>-</mo><mfenced><mrow><mo>-</mo><mn>2</mn></mrow></mfenced></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>0</mn></math></p><p>Put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced></math>&nbsp;in the above equation<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>-</mo><mn>3</mn><mi>&#945;</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi>&#945;</mi><mo>+</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><mi>&#945;</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>10</mn><mi>&#945;</mi><mo>-</mo><mn>2</mn><mi>&#945;</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>&#945;</mi><mo>(</mo><mn>2</mn><mi>&#945;</mi><mo>-</mo><mn>5</mn><mo>)</mo><mo>-</mo><mn>1</mn><mo>(</mo><mn>2</mn><mi>&#945;</mi><mo>-</mo><mn>5</mn><mo>)</mo><mo>=</mo><mn>0</mn></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mfrac><mn>5</mn><mn>2</mn></mfrac></math></p><p>Therefore this is the correct option.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d683c3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}], "question": {"text": "<p>If the tangents at the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;on the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>5</mn></math>&nbsp;meet at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mfenced><mrow><mfrac><mn>9</mn><mn>4</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo></math>&nbsp;then the area of the triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mi>R</mi></math>&nbsp;is</p>", "image": null}, "options": [{"id": "LdTFh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1qLVJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>13</mn><mn>8</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "5XJoJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>8</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "bRTQA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>13</mn><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p>The tangents at the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;on the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>5</mn></math>&nbsp;meet at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mfenced><mrow><mfrac><mn>9</mn><mn>4</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo></math></p><p>Now plotting the diagram of the above data we have,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fb32d907-9840-4af5-a38e-2bbe4d07b3e3.png\" style=\"width: 472px; height: 232px;\" /></p><p>Now we know that,</p><p>Length of tangent is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>R</mi><mo>=</mo><mi>Q</mi><mi>R</mi><mo>=</mo><msqrt><msub><mi>S</mi><mn>1</mn></msub></msqrt></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><msqrt><msub><mi>S</mi><mn>1</mn></msub></msqrt><mo>=</mo><msqrt><msup><mfenced><mfrac><mn>9</mn><mn>4</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mn>2</mn> ><mo>&#215;</mo><mfrac><mrow><mn>5</mn><msqrt><mn>5</mn></msqrt></mrow><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mi>Q</mi><mo>=</mo><msqrt><mn>5</mn></msqrt></math></p><p>Now finding area of triangle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mi>R</mi></math>&nbsp;by heron&#39;s formula,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>s</mi><mo>=</mo><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>5</mn></mrow><mn>4</mn></mfrac></math></p><p>So, area will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mo>=</mo><msqrt><mi>s</mi><mfenced><mrow><mi>s</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mfenced><mrow><mi>s</mi><mo>-</mo><mi>b</mi></mrow></mfenced><mfenced><mrow><mi>s</mi><mo>-</mo><mi>c</mi></mrow></mfenced></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>5</mn></mrow><mn>4</mn></mfrac><mfenced><mrow><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>5</mn></mrow><mn>4</mn></mfrac><mo>-</mo><mfrac><mn>5</mn><mn>4</mn></mfrac></mrow></mfenced><mfenced><mrow><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>5</mn></mrow><mn>4</mn></mfrac><mo>-</mo><mfrac><mn>5</mn><mn>4</mn></mfrac></mrow></mfenced><mfenced><mrow><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>5</mn></mrow><mn>4</mn></mfrac><mo>-</mo><msqrt><mn>5</mn></msqrt></mrow></mfenced></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>5</mn></mrow><mn>4</mn></mfrac><mfenced><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt></mrow><mn>4</mn></mfrac></mfenced><mfenced><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt></mrow><mn>4</mn></mfrac></mfenced><mfenced> sqrt><mo>+</mo><mn>2</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "ted2l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "isCorrect": true, "image": null}, {"id": "arefx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, the equation of circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>6</mn><mi>y</mi><mo>+</mo><mn>6</mn><mo>=</mo><mn>0</mn></math></p><p>So, the centre of the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;and the radius is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mn>1</mn><mn>2</mn></msup><mo>+</mo><msup><mn>3</mn><mn>2</mn></msup><mo>-</mo><mn>6</mn></msqrt><mo>=</mo><mn>2</mn></math></p><p>Assume, the coordinate of point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mi>k</mi></mrow></mfenced></math>&nbsp;and the coordinate of point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mn>1</mn></mrow></mfenced><mo>.</mo></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mfenced><mrow><mi>h</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mn>2</mn><mo>&#8658;</mo><mi>h</mi><mo>=</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mfenced><mrow><mi>k</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mn>2</mn><mo>&#8658;</mo><mi>k</mi><mo>=</mo><mn>3</mn></math></p><p>So, the coordinate&nbsp;of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;and the coordinate of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>.</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3eae8af9-e3a9-4920-a1d7-c0b84d91a29b-image.png\" style=\"width: 284px; height: 222px;\" /></p><p>From the diagram, area of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>A</mi><mi>B</mi><mi>D</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn></math>&nbsp;sq. units</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf819", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 1)", "title": "JEE Main 2021 (27 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66fc0", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf811", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T14:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 2)", "title": "JEE Main 2021 (17 Mar Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Two tangents are drawn from a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;to the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>, such that the angle between these tangents is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mfrac><mn>12</mn><mn>5</mn></mfrac></mfenced></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mfrac><mn>12</mn><mn>5</mn></mfrac></mfenced><mo>&#8712;</mo><mo>(</mo><mn>0</mn><mo>,</mo><mi>&#960;</mi><mo>)</mo><mo>.</mo></math> If the centre of the circle is denoted by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> and these tangents touch the circle at points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, then the ratio of the areas of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>P</mi><mi>A</mi><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>C</mi><mi>A</mi><mi>B</mi></math> is :", "image": null}, "options": [{"id": "1hGWe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>:</mo><mn>4</mn></math>", "isCorrect": false, "image": null}, {"id": "z2kj9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>:</mo><mn>4</mn></math>", "isCorrect": true, "image": null}, {"id": "HfmVy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>:</mo><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "OkoE9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>1</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let, the angle between the tangents <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>B</mi></math>&nbsp;from the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;to the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>&nbsp;with centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>.</mo></math></p><p>Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mfrac><mn>12</mn><mn>5</mn></mfrac></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#8658;</mo><mi>tan</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>12</mn><mn>5</mn></mfrac><mo>.</mo></math></p><p>We know that&nbsp;the centre and radius of a circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>f</mi><mi>y</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;are respectively&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mi>g</mi><mo>,</mo><mo>&#160;</mo><mo>-</mo><mi>f</mi></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mi>g</mi><mn>2</mn></msup><mo>+</mo><msup><mi>f</mi><mn>2</mn></msup><mo>-</mo><mi>c</mi></msqrt><mo>.</mo></math></p><p>Thus, the centre and radius of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>&nbsp;are respectively&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mn>1</mn><mn>2</mn></msup><mo>+</mo><msup><mn>2</mn><mn>2</mn></msup><mo>-</mo><mn>4</mn></msqrt><mo>=</mo><mn>1</mn></math>&nbsp;unit.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ff8cc8d3-4c00-41db-b2c8-f4fc79558a35-image.png\" style=\"width: 275px; height: 225px;\" /></p><p>We know that the line joining the centre of a circle to the point of contact of the tangent is perpendicular to the tangent, hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8736;</mo><mi>C</mi><mi>A</mi><mi>P</mi><mo>=</mo><mo>&#8736;</mo><mi>C</mi><mi>B</mi><mi>P</mi><mo>=</mo><mn>90</mn><mo>&#176;</mo></math>&nbsp;also&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi></math>&nbsp;bisects the angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8736;</mo><mi>A</mi><mi>P</mi><mi>B</mi></math>&nbsp;as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>C</mi><mi>A</mi><mi>P</mi><mo>&#8773;</mo><mo>&#8710;</mo><mi>C</mi><mi>B</mi><mi>P</mi></math>&nbsp;by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mi>S</mi><mi>S</mi></math>&nbsp;congruency.</p><p>Thus, we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8736;</mo><mi>C</mi><mi>P</mi><mi>A</mi><mo>=</mo><mo>&#8736;</mo><mi>C</mi><mi>P</mi><mi>B</mi><mo>=</mo><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></math></p><p>In&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>C</mi><mi>A</mi><mi>P</mi><mo>,</mo></math>&nbsp;we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mfenced><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mfenced><mo>=</mo><mfrac><mrow><mi>A</mi><mi>C</mi></mrow><mrow><mi>A</mi><mi>P</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>tan</mi><mfenced><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mfenced><mo>=</mo><mfrac><mn>1</mn><mrow><mi>A</mi><mi>P</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mi>P</mi><mo>=</mo><mi>c</mi><mi>o</mi><mi>t</mi><mfenced><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mfenced></math></p><p>Now,&nbsp;area of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>P</mi><mi>A</mi><mi>B</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>P</mi><mi>A</mi></mrow></mfenced><mfenced><mrow><mi>P</mi><mi>B</mi></mrow></mfenced><mi>sin</mi><mi>&#952;</mi></math></p><p>Since, tangents to a circle from an external point are equal, hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>A</mi><mo>=</mo><mi>P</mi><mi>B</mi></math></p><p>Area of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>P</mi><mi>A</mi><mi>B</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mfenced><mrow><mi>P</mi><mi>A</mi></mrow></mfenced><mn>2</mn></msup><mi>sin</mi><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>c</mi><mi>o</mi><msup><mi>t</mi><mn>2</mn></msup><mfenced><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mfenced><mi>sin</mi><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfrac><mrow><msup><mi>cos</mi><mn>2</mn></msup><mfenced><mstyle displaystyle=\"true\"><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mstyle></mfenced></mrow><mrow><msup><mi>sin</mi><mn>2</mn></msup><mfenced><mstyle displaystyle=\"true\"><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mstyle></mfenced></mrow></mfrac><mi>sin</mi><mi>&#952;</mi></math></p><p>Using&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mn>2</mn><mi>x</mi><mo>=</mo><mn>2</mn><msup><mi>cos</mi><mn>2</mn></msup><mi>x</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>1</mn><mo>-</mo><mn>2</mn><msup><mi>sin</mi><mn>2</mn></msup><mi>x</mi><mo>,</mo></math>&nbsp;we get</p><p>Area of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>P</mi><mi>A</mi><mi>B</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mfrac><mrow><mn>1</mn><mo>+</mo><mi>cos</mi><mi>&#952;</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi>cos</mi><mi>&#952;</mi></mrow></mfrac></mfenced><mi>sin</mi><mi>&#952;</mi></math></p><p>We have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>12</mn><mn>5</mn></mfrac><mo>&#160;</mo><mo>&#8658;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>12</mn><mn>13</mn></mfrac><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>5</mn><mn>13</mn></mfrac></math></p><p>Area of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>P</mi><mi>A</mi><mi>B</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mfrac><mrow><mn>1</mn><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mn>5</mn><mn>13</mn></mfrac></mstyle></mrow><mrow><mn>1</mn><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mn>5</mn><mn>13</mn></mfrac></mstyle></mrow></mfrac></mfenced><mfenced><mfrac><mn>12</mn><mn>13</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>18</mn><mn>8</mn></mfrac><mo>&#215;</mo><mfrac><mn>12</mn><mn>13</mn></mfrac><mo>=</mo><mfrac><mn>27</mn><mn>26</mn></mfrac></math>&nbsp;sq units.</p><p>And, area of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>C</mi><mi>A</mi><mi>B</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>A</mi><mi>C</mi></mrow></mfenced><mfenced><mrow><mi>B</mi><mi>C</mi></mrow></mfenced><mi>sin</mi><mfenced><mrow><mi mathvariant=\"normal\">&#960;</mi><mo>-</mo><mi mathvariant=\"normal\">&#952;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mfrac><mn>12</mn><mn>13</mn></mfrac></mfenced><mo>=</mo><mfrac><mn>6</mn><mn>13</mn></mfrac></math>&nbsp;sq units.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#8756;</mi><mo>&#160;</mo><mfrac><mrow><mo>&#160;</mo><mi>a</mi><mi>r</mi><mi>e</mi><mi>a</mi><mo>&#160;</mo><mi>o</mi><mi>f</mi><mo>&#160;</mo><mi>&#916;</mi><mi>P</mi><mi>A</mi><mi>B</mi></mrow><mrow><mo>&#160;</mo><mi>a</mi><mi>r</mi><mi>e</mi><mi>a</mi><mo>&#160;</mo><mi>o</mi><mi>f</mi><mo>&#160;</mo><mi>&#916;</mi><mi>C</mi><mi>A</mi><mi>B</mi></mrow></mfrac><mo>=</mo><mfrac><mfenced><mstyle displaystyle=\"true\"><mfrac><mn>27</mn><mn>26</mn></mfrac></mstyle></mfenced><mfenced><mstyle displaystyle=\"true\"><mfrac><mn>6</mn><mn>13</mn></mfrac></mstyle></mfenced></mfrac><mo>=</mo><mfrac><mn>9</mn><mn>4</mn></mfrac><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf811", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T14:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 2)", "title": "JEE Main 2021 (17 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66cd6", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-07T14:00:00.000Z", "isVisible": true, "shortName": "2020 (07 Jan Shift 2)", "title": "JEE Main 2020 (07 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let the tangents drawn from the origin to the circle, <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi> sqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "mH2P3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mrow><mn>4</mn><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Given the tangents at two points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> on the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>&nbsp;meet at origin <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mfenced><mrow><mn>0</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>,</p><p>Plotting the diagram we get,</p><p>&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3aff4de2-9fea-46b1-a325-bf6fdb3903f5-image.png\" style=\"width: 223px; height: 150px;\" /></p><p>Now circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>:</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math></p><p>Equation of chord&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>0</mn></math>&nbsp;i.e&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#215;</mo><mn>0</mn><mo>+</mo><mi>y</mi><mo>&#215;</mo><mn>0</mn><mo>-</mo><mn>4</mn><mfenced><mfrac><mrow><mi>x</mi><mo>+</mo><mn>0</mn></mrow><mn>2</mn></mfrac></mfenced><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mi>B</mi><mo>:</mo><mn>2</mn><mi>x</mi><mo>=</mo><mn>3</mn></math></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi><mo>=</mo><mi>O</mi><mi>B</mi><mo>=</mo><msqrt><msup><mn>0</mn><mn>2</mn></msup><mo>+</mo><msup><mn>0</mn><mn>2</mn></msup><mo>-</mo><mn>4</mn><mo>&#215;</mo><mn>0</mn><mo>+</mo><mn>3</mn></msqrt><mo>=</mo><msqrt><mn>3</mn></msqrt></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AM</mi><mo>=</mo><msqrt><mi>O</mi><msup><mi>A</mi><mn>2</mn></msup><mo>-</mo><mi>O</mi><msup><mi>M</mi><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>3</mn><mo>-</mo><mfrac><mn>9</mn><mn>4</mn></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mn>3</mn><mn>4</mn></mfrac></msqrt><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></math></p><p>Now area of triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi><mi>B</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mn>2</mn><mi>A</mi><mi>M</mi></mrow></mfenced><mfenced><mrow><mi>O</mi><mi>M</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mn>4</mn></mfrac></math> sq. units</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "648b5a73417cc3fb48d6935c", "title": "Chord with given Middle Point", "totalQuestions": 2, "questions": [{"_id": "6983c1aa8bfdbb2435639798", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $y=x$ be the equation of a chord of the circle $\\mathrm{C}_{1}$ (in the closed half-plane $x \\geq 0$) of diameter 10 passing through the origin. Let $\\mathrm{C}_{2}$ be another circle described on the given chord as its diameter. If the equation of the chord of the circle $\\mathrm{C}_{2}$, which passes through the point $(2,3)$ and is farthest from the center of $\\mathrm{C}_{2}$, is $x+a y+b=0$, then $a-b$ is equal to", "image": null}, "options": [{"id": "LvIOf", "text": "-2", "isCorrect": true, "image": null}, {"id": "vQGPM", "text": "10", "isCorrect": false, "image": null}, {"id": "ASf40", "text": "-6", "isCorrect": false, "image": null}, {"id": "KB2Fl", "text": "6", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Circle $C_1$ has radius 5 and chord on line $y = x$ through origin.<br>Setting center at $(5, 0)$ (in region $x \\geq 0$), the chord endpoints are $(0, 0)$ and $(5, 5)$ by solving $(t-5)^2 + t^2 = 25$.<br>Circle $C_2$ has this chord as diameter, so center is at $(\\frac{5}{2}, \\frac{5}{2})$ with radius $\\frac{5\\sqrt{2}}{2}$.<br>The chord of $C_2$ through $(2, 3)$ that is farthest from center is perpendicular to the radial direction from center to $(2, 3)$.<br>The radial direction is $(2 - \\frac{5}{2}, 3 - \\frac{5}{2}) = (-\\frac{1}{2}, \\frac{1}{2})$ with normal direction $(1, -1)$.<br>The chord equation is $1(x - 2) - 1(y - 3) = 0$, giving $x - y + 1 = 0$.<br>In form $x + ay + b = 0$, we have $a = -1$ and $b = 1$, so $a - b = -1 - 1 = -2$.", "image": null}, "videoSolution": {"videoId": "51ab7154eee04f38827b0732326ce780", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/XWtVby3gane54.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/XWtVby3gane54.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumMo
