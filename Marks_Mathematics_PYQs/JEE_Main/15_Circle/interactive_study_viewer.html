ext": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn><mo>,</mo><msub><mi>c</mi><mn>1</mn></msub><mo>(</mo><mn>5</mn><mo>,</mo><mn>5</mn><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><mo>,</mo><msub><mi>c</mi><mn>2</mn></msub><mo>(</mo><mn>8</mn><mo>,</mo><mn>5</mn><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><mo>,</mo><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn><mo>,</mo><msub><mi>r</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/de0bc722-4d0f-4ab4-b9e1-3402674303ee-image.png\" style=\"width: 176px; height: 126px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf810", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T09:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 1)", "title": "JEE Main 2021 (17 Mar Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d668f3", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let <math><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></math> be the centres of the circles <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn></math> and <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>6</mn><mi>y</mi><mo>+</mo><mn>14</mn><mo>=</mo><mn>0</mn></math> respectively. If <math><mi>P</mi></math> and <math><mi>Q</mi></math> are the points of intersection of these circles, then the area (in sq. units) of the quadrilateral <math><mi>P</mi><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub><mtext>&#8201;</mtext><mi>Q</mi><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is :", "image": null}, "options": [{"id": "KQE6X", "text": "<math><mn>6</mn></math>", "isCorrect": false, "image": null}, {"id": "RMStm", "text": "<math><mn>4</mn></math>", "isCorrect": true, "image": null}, {"id": "JHgal", "text": "<math><mn>8</mn></math>", "isCorrect": false, "image": null}, {"id": "SaH4w", "text": "<math><mn>9</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Equation of given circles are</p><p><math><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math>&nbsp;and&nbsp;<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math>.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/wpavgyhjbvuhkwscirkzzgpdcxmlwgdsawotvbhwhzogmhjcdy.png\" style=\"width: 300px; height: 208px;\" /></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mtext>&#8201;</mtext><mn>1</mn></mrow></mfenced></math> and <math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>2</mn></math>; <math><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mtext>&#8201;</mtext><mn>3</mn></mrow></mfenced></math> and <math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><msub><mi>C</mi><mn>1</mn></msub><mo>=</mo><mi>P</mi><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn></math></p><p>Now, by distance formula,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><msqrt><msup><mfenced><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><msup><mn>2</mn><mn>2</mn></msup><mo>+</mo><msup><mn>2</mn><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>8</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><msubsup><mi>C</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mi>P</mi><msubsup><mi>C</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><msub><mi>C</mi><mn>1</mn></msub><msubsup><mi>C</mi><mn>2</mn><mn>2</mn></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#8736;</mi><msub><mi>C</mi><mn>1</mn></msub><mi>P</mi><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>&#960;</mi><mn>2</mn></mfrac></math>&nbsp;(by converse of pythagoras&nbsp;theorem in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#9651;</mo><mi>P</mi><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub></math>)</p><p>Hence, area of quadrilateral <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msub><mi>C</mi><mn>1</mn></msub><mtext>&#8201;</mtext><mi>Q</mi><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&#215;</mo></math>area of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#9651;</mo><mi>P</mi><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&#215;</mo></math>area of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#9651;</mo><mi>Q</mi><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66780", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Two circles with equal radii are intersecting at the points (0,1) and (0,-1) . The tangent at the point (0,1) to one of the circles passes through the centre of the other circle. Then the distance between the centres of these circles is:", "image": null}, "options": [{"id": "NjVnE", "text": "1", "isCorrect": false, "image": null}, {"id": "hW2IB", "text": "2", "isCorrect": true, "image": null}, {"id": "imMW5", "text": "$2 \\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "4gGSd", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\because$ Two circles of equal radii intersect each other orthogonally. Then $R$ is mid point of $P Q$.\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/It98ThH9yhsWCG9y11iji5ubWkYTbSxAuT0axtFY03s.original.fullsize.png\"><br>\r\n\r\nand $P R=O_{1} R=O_{2} R$\r\n\r\n$P R=\\frac{1}{2} \\sqrt{(0-0)^{2}+(1+1)^{2}}=1$\r\n\r\n$\\therefore$ Distance between centres $=1+1=2$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d665cc", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "If the circles <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>16</mn><mi>x</mi><mo>-</mo><mn>20</mn><mi>y</mi><mo>+</mo><mn>164</mn><mo>=</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mtext>&#8201;</mtext></math> and <math><msup><mrow><mo>(</mo><mi>x</mi><mo>-</mo><mn>4</mn><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>7</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>36</mn></math> intersect at two distinct points, then:", "image": null}, "options": [{"id": "chWyy", "text": "<math><mi>r</mi><mo>&gt;</mo><mn>11</mn></math>", "isCorrect": false, "image": null}, {"id": "8RvG3", "text": "<math><mn>0</mn><mo>&lt;</mo><mi>r</mi><mo>&lt;</mo><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "xGMXA", "text": "<math><mn>1</mn><mo>&lt;</mo><mi>r</mi><mo>&lt;</mo><mn>11</mn></math>", "isCorrect": true, "image": null}, {"id": "K9KnS", "text": "<math><mi>r</mi><mo>=</mo><mn>11</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>As we know, if two circles intersect each other, then<br /><br /><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mo>&#60;</mo><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&#60;</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></math> ........(i)<br /><br />Now for the first circle <math><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub><mfenced separators=\"|\"><mrow><mn>8</mn><mo>,</mo><mi>&#160;</mi><mn>10</mn></mrow></mfenced></math> and <math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>r</mi></math><br /><br />For the second circle <math><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi>&#160;</mi><mn>7</mn></mrow></mfenced></math> and <math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>6</mn></math><br /><br />From (i)<br /><br /><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>r</mi><mo>-</mo><mn>6</mn></mrow></mfenced><mo>&#60;</mo><mn>5</mn><mo>&#60;</mo><mi>r</mi><mo>+</mo><mn>6</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"|\" open=\"|\"><mrow><mi>r</mi><mo>-</mo><mn>6</mn></mrow></mfenced><mo>&#60;</mo><mn>5</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.< mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Circles touch each other externally, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> common tangents.</p><p>Hence this is the correct option.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d675c4", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "Two circles each of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> units touch each other at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>)</mo><mo>.</mo></math> If the equation of their common tangent is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>10</mn></math>, and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>(</mo><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub><mo>(</mo><mi>&#947;</mi><mo>,</mo><mi>&#948;</mi><mo>)</mo><mo>,</mo><msub><mi>C</mi><mn>1</mn></msub><mo>&#8800;</mo><msub><mi>C</mi><mn>2</mn></msub></math> are their centres, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>|</mo><mo>(</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>)</mo><mo>(</mo><mi>&#947;</mi><mo>+</mo><mi>&#948;</mi><mo>)</mo><mo>|</mo></math> is equal to", "image": null}, "options": [], "correctValue": "40", "solution": {"text": "<p>Let a point circle:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>(</mo><mi>x</mi><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><msup><mrow><mo>(</mo><mi>y</mi><mo>-</mo><mn>2</mn><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><mn>0</mn></math>&nbsp;</p><p>Equation of circle passing through the intersection of the line and the circle:<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>+</mo><mi>&#955;</mi><msub><mi>L</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>x</mi><mo>-</mo><mn>1</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi>y</mi><mo>-</mo><mn>2</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mi>&#955;</mi><mo>(</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>10</mn><mo>)</mo><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>1</mn><mo>)</mo><mn>2</mn><mi>x</mi><mo>+</mo><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>&#955;</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn><mi>y</mi><mo>+</mo><mn>5</mn><mo>-</mo><mn>10</mn><mi>&#955;</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><msqrt><msup><mi>g</mi><mn>2</mn></msup><mo>+</mo><msup><mi>f</mi><mn>2</mn></msup><mo>-</mo><mi>c</mi></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><msqrt><mo>(</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>1</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>&#955;</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mo>(</mo><mn>5</mn><mo>-</mo><mn>10</mn><mi>&#955;</mi><mo>)</mo></msqrt><mo>=</mo><mn>5</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msup><mi>&#955;</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo>-</mo><mn>4</mn><mi>&#955;</mi><mo>+</mo><mfrac><mn>9</mn><mn>4</mn></mfrac><msup><mi>&#955;</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo>-</mo><mn>6</mn><mi>&#955;</mi><mo>-</mo><mn>5</mn><mo>+</mo><mn>10</mn><mi>&#955;</mi><mo>=</mo><mn>25</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>4</mn></mfrac><msup><mi>&#955;</mi><mn>2</mn></msup><mo>-</mo><mn>25</mn><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mo>&#177;</mo><mn>2</mn></math><br />for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>2</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>15</mn><mo>=</mo><mn>0</mn><mo>;</mo><msub><mi>C</mi><mn>1</mn></msub><mo>(</mo><mo>-</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>1</mn><mo>)</mo></math><br />for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mo>-</mo><mn>2</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>10</mn><mi>x</mi><mo>-</mo><mn>10</mn><mi>y</mi><mo>+</mo><mn>25</mn><mo>=</mo><mn>0</mn><mo>;</mo><msub><mi>C</mi><mn>2</mn></msub><mo>(</mo><mn>5</mn><mo>,</mo><mn>5</mn><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>|</mo><mo>(</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>)</mo><mo>(</mo><mi>&#947;</mi><mo>+</mo><mi>&#948;</mi><mo>)</mo><mo>|</mo><mo>=</mo><mn>40</mn></math></p>", "image": null}, "videoSolution": {"videoId": "4c0cfce291da46d9a34042b2937cac88", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Sjf4j6wrQmo0N.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Sjf4j6wrQmo0N.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66512", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The common tangent to the circles <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn></math> and <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>8</mn><mi>y</mi><mo>-</mo><mn>24</mn><mo>=</mo><mn>0</mn></math> also passes through the point:", "image": null}, "options": [{"id": "cyVEg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "Tb2qM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mn>4</mn><mo>,</mo><mn>6</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "l8o3e", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mn>6</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "nd4Wa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mn>6</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7493aefd-acc9-46b7-8eb8-18ff4955d9e6-image.png\" style=\"width: 259px; height: 281px;\" /></p><p>The centre and radius of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>f</mi><mi>y</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;are respectively&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mi>g</mi><mo>,</mo><mo>&#160;</mo><mo>-</mo><mi>f</mi></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mi>g</mi><mn>2</mn></msup><mo>+</mo><msup><mi>f</mi><mn>2</mn></msup><mo>-</mo><mi>c</mi></msqrt><mo>.</mo></math></p><p>Let, for the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub><mo>:</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn></math> centre <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>:</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn></math>&nbsp;units.</p><p>And, for the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub><mo>:</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>8</mn><mi>y</mi><mo>-</mo><mn>24</mn><mo>=</mo><mn>0</mn></math> centre</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub><mfenced separators=\"|\"><mrow><mo>-</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><msub><mi>r</mi><mn>2</mn></msub><mo>=</mo><msqrt><msup><mn>3</mn><mn>2</mn></msup><mo>+</mo><msup><mn>4</mn><mn>2</mn></msup><mo>+</mo><mn>24</mn></msqrt><mo>=</mo><mn>7</mn></math>&nbsp;units.</p><p>The distance between the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>-</mo><msub><mi>x</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>-</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup></msqrt></math></p><p>Hence, the distance between the centres of the circles is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><msqrt><msup><mfenced><mrow><mo>-</mo><mn>3</mn><mo>-</mo><mn>0</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mo>-</mo><mn>4</mn><mo>-</mo><mn>0</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mn>5</mn></math>&nbsp;units.</p><p>Also,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"|\" close=\"|\"><mrow><msub><mi>r</mi><mn>1</mn></msub><mo>-</mo><msub><mi>r</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>5</mn></math>&nbsp;units.</p><p>Since, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><msub><mi>r</mi><mn>1</mn></msub><mo>-</mo><msub><mi>r</mi><mn>2</mn></msub></mrow></mfenced><mo>,</mo></math> hence both the circles touches each other internally.</p><p>Therefore, the common tangent is same as the radical axis of the two circles i.e.&nbsp;<math><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>S</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>0</mn></math></p><p>Thus, the&nbsp;common tangent is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mo>-</mo><mfenced><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>8</mn><mi>y</mi><mo>-</mo><mn>24</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>8</mn><mi>y</mi><mo>+</mo><mn>20</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>10</mn><mo>=</mo><mn>0</mn><mo>.</mo></math></p><p>Clearly, the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mn>6</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math> lies on the common tangent.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66579", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Three circles of radii <math><mi>a</mi><mo>,</mo><mi>&#160;</mi><mi>b</mi><mo>,</mo><mi>&#160;</mi><mi>c</mi><mo>,</mo><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mi>a</mi><mo>&#60;</mo><mi>b</mi><mo>&#60;</mo><mi>c</mi></mrow></mfenced></math> touch each other externally. If they have <math><mi>x</mi><mo>-</mo></math> axis as a common tangent, then:", "image": null}, "options": [{"id": "4ATtM", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>a</mi></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>b</mi></msqrt></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>c</mi></msqrt></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "qOWtO", "text": "<math><mi>a</mi><mo>,</mo><mi> </mi><mi>b</mi><mo>,</mo><mi> </mi><mi>c</mi><mi> </mi></math> are in A.P.", "isCorrect": false, "image": null}, {"id": "Rx7DB", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>b</mi></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>a</mi></msqrt></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>c</mi></msqrt></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "xHOx0", "text": "<math><msqrt><mi>a</mi></msqrt><mo>,</mo><mi> </mi><msqrt><mi>b</mi></msqrt><mo>,</mo><mi> </mi><msqrt><mi>c</mi></msqrt></math>  are in A.P.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>We have,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1d4b95bb-4cf1-4fcf-9267-fbe4dd90d9bc-image.png\" style=\"width: 444px; height: 250px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mi>M</mi><mo>=</mo><mi>P</mi><mi>N</mi><mo>=</mo><msqrt><msup><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><msup><mfenced separators=\"|\"><mrow><mi>b</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mn>2</mn><msqrt><mi>a</mi><mi>b</mi></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mi>Q</mi><mo>=</mo><mi>M</mi><mi>S</mi><mo>=</mo><msqrt><msup><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><msup><mfenced separators=\"|\"><mrow><mi>c</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mn>2</mn><msqrt><mi>a</mi><mi>c</mi></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><mi>S</mi><mi>T</mi><mo>=</mo><msqrt><msup><mfenced separators=\"|\"><mrow><mi>b</mi><mo>+</mo><mi>c</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><msup><mfenced separators=\"|\"><mrow><mi>c</mi><mo>-</mo><mi>b</mi></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mn>2</mn><msqrt><mi>b</mi><mi>c</mi></msqrt></math><br /><br /><math><mo>&#8757;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><mi>P</mi><mi>N</mi><mo>+</mo><mi>N</mi><mi>Q</mi></math><br /><br /><math><mo>&#8658;</mo><mn>2</mn><msqrt><mi>b</mi><mi>c</mi></msqrt><mo>=</mo><mn>2</mn><msqrt><mi>a</mi><mi>b</mi></msqrt><mo>+</mo><mn>2</mn><msqrt><mi>a</mi><mi>c</mi></msqrt></math><br /><br /><math><mo>&#8658;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>a</mi></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>b</mi></msqrt></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>c</mi></msqrt></mrow></mfrac></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/06d67242-a666-4c14-b523-9ec30279d86c-image.png\" style=\"width: 370px; height: 280px;\" /></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66198", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}], "question": {"text": "If the common tangents to the parabola, <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>y</mi></math> and the circle, <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math> intersect at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>, then the distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> from the origin (units), is:", "image": null}, "options": [{"id": "P4nsd", "text": "<math><mn>2</mn><mfenced separators=\"|\"><mrow><mn>3</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "Yd34n", "text": "<math><mn>3</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "PQoo2", "text": "<math><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "V6egj", "text": "<math><mn>2</mn><mfenced separators=\"|\"><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mi>c</mi></math>&nbsp;be the common tangent.</p><p>Then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mfenced><mrow><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></mrow></mfenced><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>1</mn><mo>)</mo></math>&nbsp;(condition of tangency for circle)</p><p>Solving with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>y</mi></math>, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mfenced><mrow><mi>m</mi><mi>x</mi><mo>+</mo><mi>c</mi></mrow></mfenced></math></p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>m</mi><mi>x</mi><mo>-</mo><mn>4</mn><mi>c</mi><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>1</mn><mo>)</mo></math></p><p>Being a tangent,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>)</mo></math>&nbsp;must have equal roots.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mrow><mo>-</mo><mn>4</mn><mi>m</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn><mfenced><mn>1</mn></mfenced><mfenced><mrow><mo>-</mo><mn>4</mn><mi>c</mi></mrow></mfenced><mo>&#8658;</mo><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mo>-</mo><mi>c</mi><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>2</mn><mo>)</mo></math></p><p>From&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mn>2</mn></mfenced><mo>,</mo><mo>&#160;</mo><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mo>-</mo><mn>4</mn><mi>c</mi><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>c</mi><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>c</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mi>c</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>c</mi><mo>=</mo><mo>-</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>2</mn></math>&nbsp;(As&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>&#60;</mo><mn>0</mn></math>, so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>&#8800;</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>2</mn></math>).</p><p>So, both tangents have common&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;intercept and thus intersect at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>-</mo><msqrt><mn>2</mn></msqrt></mrow></mfenced></math>.</p><p>Thus, distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;from origin is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfenced><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced></math>&nbsp;units.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f22", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}], "question": {"text": "The number of common tangents to the circles <math> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo> <msup> <mi>y</mi> <mn>2</mn> </msup> <mo>-</mo> <mn>4</mn> <mi>x</mi> <mo>-</mo> <mn>6</mn> <mi>y</mi> <mo>-</mo> <mn>1</mn> <mn>2</mn> <mo>=</mo> <mn>0</mn> </mrow> </math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>1</mn><mn>8</mn><mi>y</mi><mo>+</mo><mn>26</mn><mo>=</mo><mn>0</mn></math>, is", "image": null}, "options": [{"id": "tKuR2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "JCBXs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "o0CLW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "3Gr5T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given&nbsp;<math> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo> <msup> <mi>y</mi> <mn>2</mn> </msup> <mo>-</mo> <mn>4</mn> <mi>x</mi> <mo>-</mo> <mn>6</mn> <mi>y</mi> <mo>-</mo> <mn>1</mn> <mn>2</mn> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><msqrt><msup><mn>2</mn><mn>2</mn></msup><mo>+</mo><msup><mn>3</mn><mn>2</mn></msup><mo>+</mo><mn>12</mn></msqrt><mo>=</mo><msqrt><mn>25</mn></msqrt><mo>=</mo><mn>5</mn></math><br /><br />And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>1</mn><mn>8</mn><mi>y</mi><mo>+</mo><mn>2</mn><mn>6</mn><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub><mfenced><mrow><mo>-</mo><mn>3</mn><mi>,</mi><mo>-</mo><mn>9</mn></mrow></mfenced><mi>,</mi><mo>&#160;</mo><msub><mi>r</mi><mn>2</mn></msub><mo>=</mo><msqrt><msup><mn>3</mn><mn>2</mn></msup><mo>+</mo><msup><mn>9</mn><mn>2</mn></msup><mo>-</mo><mn>26</mn></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mn>9</mn><mn>0</mn><mo>-</mo><mn>2</mn><mn>6</mn></msqrt><mo>=</mo><mn>8</mn></math><br /><br />Then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><msqrt><msup><mn>5</mn><mn>2</mn></msup><mo>+</mo><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></msqrt><mo>=</mo><mn>1</mn><mn>3</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><msub><mi>r</mi><mn>1</mn></msub><mo>+</mo><msub><mi>r</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>Externally touching circles.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn></math>&nbsp;common tangents.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e6e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "For the two circles $x^2+y^2=16$ and $x^2+y^2-2 y=0$, there is/are", "image": null}, "options": [{"id": "g4A8y", "text": "\none pair of common tangents\n", "image": null, "isCorrect": false}, {"id": "JilFA", "text": "\ntwo pair of common tangents\n", "image": null, "isCorrect": false}, {"id": "ujPNR", "text": "\nthree pair of common tangents\n", "image": null, "isCorrect": false}, {"id": "2TX21", "text": "\nno common tangent", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let, $x^2+y^2=16$ or $x^2+y^2=4^2$ radius of circle $r_1=4$, centre $\\mathrm{C}_1(0,0)$ we have, $x^2+y^2-2 y=0$\n$$\n\\begin{aligned}\n\\Rightarrow & x^2+\\left(y^2-2 y+1\\right)-1=0 \\text { or } x^2+(y-1)^2 \\\\\n=& 1^2\n\\end{aligned}\n$$\nRadius 1, centre $\\mathrm{C}_2(0,1)$\n$$\n\\begin{aligned}\n&\\left|C_1 C_2\\right|=1 \\\\\n&\\left|r_2-r_1\\right|=|4-1|=3 \\\\\n&\\left|C_1 C_2\\right| < \\left|r_2-r_1\\right|\n\\end{aligned}\n$$\nno common tangents for these two circles.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e14", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "The set of all real values of $\\lambda$ for which exactly two common tangents can be drawn to the circles $x^2+y^2-4 x-4 y+6=0$ and $\\mathrm{x}^2+\\mathrm{y}^2-10 \\mathrm{x}-10 \\mathrm{y}+\\lambda=0$ is the interval:", "image": null}, "options": [{"id": "LTV6A", "text": "\n$(12,32)$\n", "image": null, "isCorrect": false}, {"id": "Q7qRL", "text": "\n$(18,42)$\n", "image": null, "isCorrect": true}, {"id": "sIJNW", "text": "\n$(12,24)$\n", "image": null, "isCorrect": false}, {"id": "ZM7BA", "text": "\n$(18,48)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equations of the circles are\n$$\nx^2+y^2-10 x-10 y+\\lambda=0\n$$\nand $x^2+y^2-4 x-4 y+6=0$\n$$\n\\begin{aligned}\n&C_1=\\text { centre of }(1)=(5,5) \\\\\n&\\mathrm{C}_2=\\text { centre of }(2)=(2,2) \\\\\n&d=\\text { distance between centres } \\\\\n&=\\mathrm{C}_1 \\mathrm{C}_2=\\sqrt{9+9}=\\sqrt{18} \\\\\n&r_1=\\sqrt{50-\\lambda}, r_2=\\sqrt{2} \\\\\n&\\text { For exactly two common tangents we } \\\\\n&\\text { have } \\\\\n&r_1-r_2 < C_1 C_2 < r_1+r_2 \\\\\n&\\Rightarrow \\sqrt{50-\\lambda}-\\sqrt{2} < 3 \\sqrt{2} < \\sqrt{50-\\lambda}+\\sqrt{2} \\\\\n&\\Rightarrow \\sqrt{50-\\lambda}-\\sqrt{2} < 3 \\sqrt{2} \\text { or } 3 \\sqrt{2} < \\sqrt{50-\\lambda}+\\sqrt{2} \\\\\n&\\Rightarrow \\sqrt{50-\\lambda} < 4 \\sqrt{2} \\text { or } 2 \\sqrt{2} < \\sqrt{50-\\lambda} \\\\\n&\\Rightarrow 50-\\lambda < 32 \\text { or } 8 < 50-\\lambda \\\\\n&\\Rightarrow \\lambda>18 \\text { or } \\lambda < 42 \\\\\n&\\text { Required interval is }(18,42) \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b8d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "<strong>Given</strong> : A circle, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>5</mn></math>&nbsp;and a parabola, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><msqrt><mn>5</mn></msqrt><mi>x</mi></math>.<br /><br /><strong>Statement - I :</strong> An equation of a common tangent to these curves is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><msqrt><mn>5</mn></msqrt></math>.<br /><br /><strong>Statement - II :</strong> If the line, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mfrac><msqrt><mn>5</mn></msqrt><mrow><mi>m</mi><mo>&#160;</mo></mrow></mfrac><mfenced><mrow><mi>m</mi><mo>&#8800;</mo><mn>0</mn></mrow></mfenced></math>&nbsp; is their common tangent, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> satisfies <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>m</mi><mn>4</mn></msup><mo>-</mo><mn>3</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>.", "image": null}, "options": [{"id": "zDwmN", "text": "Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> is true; Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is false.", "image": null, "isCorrect": false}, {"id": "4PBCV", "text": "Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> is false; Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is true.", "image": null, "isCorrect": false}, {"id": "NKS6I", "text": "Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>&nbsp;is true; Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is true; Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is a correct explanation for statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>.", "image": null, "isCorrect": false}, {"id": "s0IUT", "text": "Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> is true; Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is true; Statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is not a correct explanation for statement - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Tangent to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><msqrt><mn>5</mn></msqrt><mi>x</mi></math>&nbsp;will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mfrac><msqrt><mn>5</mn></msqrt><mi>m</mi></mfrac></math>&nbsp;<br />As tangent to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac></math>&nbsp;will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><mfrac><msqrt><mn>5</mn></msqrt><msqrt><mn>2</mn></msqrt></mfrac><msqrt><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></msqrt></math><br />Hence for common tangent<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>5</mn></msqrt><mi>m</mi></mfrac><mo>=</mo><mfrac><msqrt><mn>5</mn></msqrt><msqrt><mn>2</mn></msqrt></mfrac><msqrt><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>m</mi><mn>4</mn></msup><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math> , <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mo>&#8722;</mo><mn>2</mn></math> (Not Possible)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>m</mi><mo>=</mo><mo>&#177;</mo><mn>1</mn></math><br />Hence common tangent is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><msqrt><mn>5</mn></msqrt></math><br /><br />Both the statements are correct</p><p>The values of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;also satisfy the equation in statement -&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math>&nbsp;but&nbsp;it is not a correct explanation for statement -&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>.&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65ae5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "The number of common tangents of the circles given by $x^2+y^2-8 x-2 y+1=0$ and $x^2+y^2+6 x+8 y=0$ is", "image": null}, "options": [{"id": "DXN0L", "text": "\none\n", "image": null, "isCorrect": false}, {"id": "oOvdk", "text": "\nfour\n", "image": null, "isCorrect": false}, {"id": "pvGhA", "text": "\ntwo\n", "image": null, "isCorrect": true}, {"id": "p4gW9", "text": "\nthree", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given circles are $x^2+y^2-8 x-2 y+1=0$ and $x^2+y^2+6 x+8 y=0$ Their centres and radius are\n$$\nC_1(4,1), r_1=\\sqrt{16}=4\n$$\n\n$$\nC_2(-3,-4), r_2=\\sqrt{25}=5\n$$\nNow, $C_1 C_2=\\sqrt{49+25}=\\sqrt{74}$\n$$\nr_1-r_2=-1, r_1+r_2=9\n$$\nSince, $r_1-r_2 < C_1 C_2 < r_1+r_2$\n$\\therefore$ Number of common tangents $=2$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 11, "topicId": "648b5a73417cc3fb48d69358", "title": "Common Chord", "totalQuestions": 8, "questions": [{"_id": "66446758970e6e9ab542d279", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}], "question": {"text": "Let the centre of a circle, passing through the points $(0,0),(1,0)$ and touching the circle $x^2+y^2=9$, be $(h, k)$. Then for all possible values of the coordinates of the centre $(h, k), 4\\left(h^2+k^2\\right)$ is equal to_________", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/X6ZDAbgntZzldqdmtHoabAG8UD8Gk_ry9VnblQ3-Dac.original.fullsize.png\"><br />$\\begin{aligned} & (\\mathrm{x}-\\mathrm{h})^2+(\\mathrm{y}-\\mathrm{k})^2=\\mathrm{h}^2+\\mathrm{k}^2 \\\\ & \\mathrm{x}^2+\\mathrm{y}^2-2 \\mathrm{hx}-2 \\mathrm{ky}=0 \\\\ & \\because \\text { passes through }(1,0) \\\\ & \\Rightarrow 1+0-2 \\mathrm{~h}=0 \\\\ & \\Rightarrow \\mathrm{h}=1 / 2 \\\\ & \\because \\mathrm{OC}=\\frac{\\mathrm{OP}}{2} \\\\ & \\sqrt{\\left(\\frac{1}{2}\\right)^2+\\mathrm{k}^2}=\\frac{3}{2}\\end{aligned}$\n$\\begin{aligned}\n& \\frac{1}{4}+\\mathrm{k}^2=\\frac{9}{4} \\\\\n& \\mathrm{k}^2=2 \\\\\n& \\mathrm{k}= \\pm \\sqrt{2}\n\\end{aligned}$\n$\\therefore$ Possible coordinate of\n$\\begin{aligned}\n& \\mathrm{c}(\\mathrm{h}, \\mathrm{k})\\left(\\frac{1}{2}, \\sqrt{2}\\right)\\left(\\frac{1}{2},-\\sqrt{2}\\right) \\\\\n& 4\\left(\\mathrm{~h}^2+\\mathrm{k}^2\\right)=4\\left(\\frac{1}{4}+2\\right)=4\\left(\\frac{9}{4}\\right)=9\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "c065573bc8214593a67a70550feed184", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/jYxcLWjOaeBI3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/jYxcLWjOaeBI3.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-27T07:00:28.637Z"}, {"_id": "66446743970e6e9ab542d1b7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 1)", "title": "JEE Main 2024 (08 Apr Shift 1)"}], "question": {"text": "Let the circles $C_1:(x-\\alpha)^2+(y-\\beta)^2=r_1^2$ and $C_2:(x-8)^2+\\left(y-\\frac{15}{2}\\right)^2=r_2^2$ touch each other externally at the point $(6,6)$. If the point $(6,6)$ divides the line segment joining the centres of the circles $C_1$ and $C_2$ internally in the ratio $2: 1$, then $(\\alpha+\\beta)+4\\left(r_1^2+r_2^2\\right)$ equals", "image": null}, "options": [{"id": "YTLY3", "text": "125", "image": null, "isCorrect": false}, {"id": "lLgjK", "text": "130", "image": null, "isCorrect": true}, {"id": "iWLVU", "text": "110", "image": null, "isCorrect": false}, {"id": "7Y3vo", "text": "145", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/DUDqO4j8Yy12bxfYmHvhIDyI4dVa4AmQpmDzeF4QnSA.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8RiNb1d4JFmi1xARSU1P0ACkgw_N6QsHeGYOVCgzzdU.original.fullsize.png\"><br />$\\begin{aligned} & \\because \\frac{16+\\alpha}{3}=6 \\text { and } \\frac{15+\\beta}{3}=6 \\\\ & \\Rightarrow(\\alpha, \\beta) \\equiv(2,3)\\end{aligned}$\nAlso, $\\mathrm{C}_1 \\mathrm{C}_2=\\mathrm{r}_1+\\mathrm{r}_2$\n$\\begin{aligned} & \\Rightarrow \\sqrt{(2-8)^2+\\left(3-\\frac{15}{2}\\right)^2}=2 r_2+r_2 \\\\ & \\Rightarrow r_2=\\frac{5}{2} \\Rightarrow r_1=2 r_2=5 \\\\ & \\therefore(\\alpha+\\beta)+4\\left(r_1^2+r_2^2\\right) \\\\ & =5+4\\left(\\frac{25}{4}+25\\right)=130\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "d54708a657ce4e58865a42fd97b8f9ea", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/CiK6Ruu5y6jHN.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/CiK6Ruu5y6jHN.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 1)", "title": "JEE Main 2024 (08 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-27T07:07:20.667Z"}, {"_id": "66446726970e6e9ab542d0a8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}], "question": {"text": "Let the circle $C_1: x^2+y^2-2(x+y)+1=0$ and $C_2$ be a circle having centre at $(-1,0)$ and radius 2 . If the line of the common chord of $\\mathrm{C}_1$ and $\\mathrm{C}_2$ intersects the $y$-axis at the point $\\mathrm{P}$, then the square of the distance of $\\mathrm{P}$ from the centre of $\\mathrm{C}_1$ is :", "image": null}, "options": [{"id": "qq6BN", "text": "2", "image": null, "isCorrect": true}, {"id": "KqRO9", "text": "1", "image": null, "isCorrect": false}, {"id": "2FYpO", "text": "4", "image": null, "isCorrect": false}, {"id": "XJ2Q7", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & S_1: x^2+y^2-2 x-2 y+1=0 \\\\ & S_2: x^2+y^2+2 x-3=0 \\\\ & \\text { Common chord }=S_1-S_2=0 \\\\ & -4 x-2 y+4=0 \\\\ & 2 x+y=2 \\Rightarrow P(0,2) \\\\ & d_{(c, p)}^2=(1-0)^2+(2-1)^2=2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-27T07:37:25.315Z"}, {"_id": "6682bd3eba0e94a3c4025b6e", "type": "numerical", "level": 2, "questionLabels": [], "question": {"text": "Consider two circles <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>:</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub><mo>:</mo><mo>(</mo><mi>x</mi><mo>-</mo><mi>α</mi><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>16</mn></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>∈</mo><mo>(</mo><mn>5</mn><mo>,</mo><mn>9</mn><mo>)</mo></math>. Let the angle between the two radii (one to each circle) drawn from one of the intersection points of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>1</mn></msub></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub></math> be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mfrac><msqrt><mn>63</mn></msqrt><mn>8</mn></mfrac></mfenced></math>. If the length of common chord of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>β</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>α</mi><mi>β</mi><msup><mo>)</mo><mn>2</mn></msup></math> equals _________.", "image": null}, "options": [], "correctValue": "1575", "solution": {"text": "<blockquote><p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>:</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn><mo>,</mo><mo> </mo><msub><mi>C</mi><mn>2</mn></msub><mo>:</mo><mo>(</mo><mi>x</mi><mo>-</mo><mi>α</mi><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>16</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&lt;</mo><mi>α</mi><mo>&lt;</mo><mn>9</mn></math></p><p>Now, plotting the diagram we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/084a6e21-e887-47e2-aa80-4ea18e4ac731.png\" style=\"width: 350px; height: 240px;\"/></p><p>Also, given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>θ</mi><mo>=</mo><mfrac><msqrt><mn>63</mn></msqrt><mn>8</mn></mfrac></math></p><p>Now, from the above diagram, finding the area of  <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Δ</mi><mi>OAP</mi></math> we get, </p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Δ</mi><mi>OAP</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>×</mo><mi>α</mi><mfenced><mfrac><mi>β</mi><mn>2</mn></mfrac></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>×</mo><mn>5</mn><mo>×</mo><mn>4</mn><mi>sin</mi><mi>θ</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>α</mi><mi>β</mi><mo>=</mo><mn>40</mn><mo>×</mo><mfrac><msqrt><mn>63</mn></msqrt><mn>8</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>α</mi><mi>β</mi><mo>=</mo><mn>5</mn><mo>×</mo><msqrt><mn>63</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo> c></math>", "image": null, "isCorrect": false}, {"id": "Z8KDz", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><msqrt><mn>7</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "hyzTX", "text": "<math><mfrac><mrow><mn>8</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given condition,&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4bdcea09-2a2c-419a-8ab3-10103f4b682a-image.png\" style=\"width: 237px; height: 190px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>cos</mi><mo>&#8289;</mo><mn>2</mn><mi>&#952;</mi><mo>=</mo><mfrac><mn>1</mn><mn>7</mn></mfrac></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msup><mi>cos</mi><mn>2</mn></msup><mi>&#952;</mi><mo>-</mo><mn>1</mn><mo>=</mo><mfrac><mn>1</mn><mn>7</mn></mfrac></math><br /><br /><math><mo>&#8658;</mo><mn>2</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>2</mn><msqrt><mn>7</mn></msqrt></mfrac></math></p><p>Then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><mi>r</mi><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>4</mn><msqrt><mn>7</mn></msqrt></mfrac></math><br /><br />Since,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>cos</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></msup><mfrac><mn>1</mn><mn>7</mn></mfrac><mo>=</mo><msup><mi>sec</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></msup><mn>7</mn></math>, hence both the chords are at equal distance from center of the circle.<br /><br />Hence,&nbsp;the distance between the chords <math> <mrow> <mo>=</mo><mn>2</mn><mtext> </mtext><mo>&#215;</mo><mtext> </mtext><mfrac> <mn>4</mn> <mrow> <msqrt> <mn>7</mn> </msqrt> </mrow> </mfrac> <mo>=</mo><mfrac> <mn>8</mn> <mrow> <msqrt> <mn>7</mn> </msqrt> </mrow> </mfrac> <mo>.</mo></mrow> </math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e15", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "Let $\\mathrm{L}_1$ be the length of the common chord of the curves $x^2+y^2=9$ and $y^2=8 x$, and $L_2$ be the length of the latus rectum of $y^2=8 x$, then:", "image": null}, "options": [{"id": "7nQiN", "text": "\n$\\mathrm{L}_1>\\mathrm{L}_2$\n", "image": null, "isCorrect": false}, {"id": "NTl2v", "text": "\n$\\mathrm{L}_1=\\mathrm{L}_2$\n", "image": null, "isCorrect": false}, {"id": "eLupT", "text": "\n$\\mathrm{L}_1 < \\mathrm{L}_2$", "image": null, "isCorrect": true}, {"id": "ZD6YT", "text": "\n$\\frac{\\mathrm{L}_1}{\\mathrm{~L}_2}=\\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/guBkIvWc8OCBG-UFkYe_nMLP2i11gKYo1aCf6r3dyjY.original.fullsize.png\"><br>\nWe have\n$$\n\\begin{aligned}\n&x^2+(8 x)=9 \\\\\n&x^2+9 x-x-9=0 \\\\\n&x(x+9)-1(x+9)=0 \\\\\n&(x+9)(x-1)=0 \\\\\n&x=-9,1 \\\\\n&\\text { for } x=1, y=\\pm 2 \\sqrt{2 x}=\\pm 2 \\sqrt{2} \\\\\n&\\mathrm{~L}_1=\\text { Length of } \\mathrm{AB} \\\\\n&\\quad=\\sqrt{(2 \\sqrt{2}+2 \\sqrt{2})^2+(1-1)^2}=4 \\sqrt{2} \\\\\n&\\mathrm{~L}_2=\\text { Length of latus rectum } \\\\\n&=4 a=4 \\times 2=8 \\\\\n&\\mathrm{~L}_1 < \\mathrm{L}_2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 12, "topicId": "648b5a73417cc3fb48d69352", "title": "Family of Circle", "totalQuestions": 19, "questions": [{"_id": "6983c1978bfdbb24356396a9", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "If the points of intersection of the ellipses $x^{2}+2 y^{2}-6 x-12 y+23=0$ and $4 x^{2}+2 y^{2}-20 x-12 y+35=0$ lie on a circle of radius $r$ and centre $(a, b)$, then the value of $a b+18 r^{2}$ is", "image": null}, "options": [{"id": "BuF5T", "text": "52", "isCorrect": false, "image": null}, {"id": "g5XxR", "text": "53", "isCorrect": false, "image": null}, {"id": "hFksK", "text": "51", "isCorrect": false, "image": null}, {"id": "Imjwk", "text": "55", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The circle through intersection of the ellipses is $S_1 + \\lambda S_2 = 0$.<br>$(1+4\\lambda)x^2 + (2+2\\lambda)y^2 - (6+20\\lambda)x - (12+12\\lambda)y + (23+35\\lambda) = 0$.<br>For a circle: $1+4\\lambda = 2+2\\lambda \\Rightarrow \\lambda = \\frac{1}{2}$.<br>Circle: $3x^2 + 3y^2 - 16x - 18y + \\frac{81}{2} = 0 \\Rightarrow x^2 + y^2 - \\frac{16}{3}x
