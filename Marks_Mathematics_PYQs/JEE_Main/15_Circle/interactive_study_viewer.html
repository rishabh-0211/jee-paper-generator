Change", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Feb Shift 2)", "title": "JEE Main 2021 (26 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d6668e", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The locus of the centres of the circles, which touch the circle, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math> externally, also touch the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis and lie in the first quadrant, is:", "image": null}, "options": [{"id": "Mv9Ay", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mn>2</mn><mi>x</mi></msqrt><mo>,</mo><mo>&#160;</mo><mi>x</mi><mo>&#8805;</mo><mn>0</mn></math>", "isCorrect": true, "image": null}, {"id": "SRJm7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mn>4</mn><mi>x</mi></msqrt><mo>,</mo><mo>&#160;</mo><mi>x</mi><mo>&#8805;</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "Idm2p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mn>2</mn><mi>y</mi></msqrt><mo>,</mo><mo>&#160;</mo><mi>y</mi><mo>&#8805;</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "1hXBO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mn>4</mn><mi>y</mi></msqrt><mo>,</mo><mo>&#160;</mo><mi>y</mi><mo>&#8805;</mo><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f89a944e-82a9-43e0-94c1-a033707f8324-image9.png\" /><br />Let, the centre of the circle whose locus is to&nbsp;be determined is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi><mo>)</mo></math>&nbsp;and&nbsp;it touches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis in the first quadrant and we know that if&nbsp;a circle touches the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis, then&nbsp;its radius is equal to the absolute value of the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-coordinate of the centre.</p><p>Hence, the&nbsp;radius of the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>h</mi><mo>.</mo></math></p><p>Also, we know that if two circles touches externally, then the distance between their centres is equal to the sum of their radii.</p><p>And, the centre and radius of a circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>&nbsp;respectively.</p><p>Now, since&nbsp;the circle with centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math>&nbsp;and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;touches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math>externally, then</p><p><math><mo>&#8658;</mo><mi>h</mi><mo>+</mo><mn>1</mn><mo>=</mo><msqrt><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math></p><p>Squaring both the sides, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>h</mi><mo>+</mo><mn>1</mn><mo>=</mo><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup></math></p><p><math><mo>&#8658;</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>h</mi><mo>+</mo><mn>1</mn></math></p><p>Now, to get the locus, replace&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math>&nbsp;by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>,</mo><mo>&#160;</mo><mi>y</mi></mrow></mfenced><mo>,</mo></math>&nbsp;to get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>1</mn><mo>.</mo></math></p><p>Hence, the required locus is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mn>2</mn><mi>x</mi></msqrt><mo>,</mo><mo>&#160;</mo><mi>x</mi><mo>&#8805;</mo><mn>0</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d664b7", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 1)", "title": "JEE Main 2019 (09 Apr Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "If a tangent to the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math> intersects the coordinate axes at distinct points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>,</mo></math>&nbsp;then the locus of the mid-point of <math><mi>P</mi><mi>Q</mi></math> is:", "image": null}, "options": [{"id": "ghLLQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>&#8211;</mo><mn>16</mn><msup><mi>x</mi><mn>2</mn></msup><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "YSkAm", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>–</mo><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>0</mn></math>", "isCorrect": true, "image": null}, {"id": "YMiiV", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>–</mo><mn>2</mn><mi>x</mi><mi>y</mi><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "JipFI", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>–</mo><mn>2</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Any point on the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>r</mi><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mo>&#160;</mo><mi>r</mi><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math>&nbsp;and the equation of the tangent at this point is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>cos</mi><mi>&#952;</mi><mo>+</mo><mi>y</mi><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mi>r</mi><mo>.</mo></math></p><p>Thus, any point on circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mo>&#160;</mo><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math>&nbsp;and the equation of tangent at this point is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>cos</mi><mi>&#952;</mi><mo>+</mo><mi>y</mi><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mn>1</mn><mo>.</mo></math></p><p>To find the point where this line intersects the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis, put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>0</mn><mo>,</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mi>cos</mi><mi>&#952;</mi><mi>&#160;</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><mrow><mi>cos</mi><mi>&#952;</mi></mrow></mfrac><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math></p><p>And,&nbsp;to find the point where this line intersects the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis, put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn><mo>,</mo></math>&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mi>sin</mi><mi>&#952;</mi><mi>&#160;</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>Q</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mrow><mi>sin</mi><mi>&#952;</mi></mrow></mfrac></mrow></mfenced></math></p><p>The mid-point of a line segment joining the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><msub><mi>y</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac></mrow></mfenced></math></p><p>Let, midpoint of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfenced><mrow><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mfrac><mn>1</mn><mrow><mn>2</mn><mi>cos</mi><mi>&#952;</mi></mrow></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>sin</mi><mi>&#952;</mi></mrow></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>h</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>cos</mi><mi>&#952;</mi></mrow></mfrac><mi>&#160;</mi><mo>&#38;</mo><mi>&#160;</mi><mi>k</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>sin</mi><mi>&#952;</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>h</mi></mrow></mfrac><mi>&#160;</mi><mo>&#38;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#952;</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mrow><mn>4</mn><msup><mi>h</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mn>4</mn><msup><mi>k</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><msup><mi>h</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>k</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>4</mn></math></p><p>To get the locus of the required point, replace&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math>&nbsp;by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>,</mo><mo>&#160;</mo><mi>y</mi></mrow></mfenced></math></p><p><math><mo>&#8756;</mo><mi>&#160;</mi></math>Locus is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>y</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>&#8211;</mo><mn>4</mn><msup><mi>x</mi><mn>2</mn></msup><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 1)", "title": "JEE Main 2019 (09 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66950", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7ef", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 2)", "title": "JEE Main 2019 (12 Jan Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "If a circle of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;passes through the origin&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math>&nbsp;and intersects the coordinate axes at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, then the locus of the foot of perpendicular from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math>&nbsp;on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> is :", "image": null}, "options": [{"id": "xZasa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfenced><mo>=</mo><msup><mi>R</mi><mn>2</mn></msup><mi>x</mi><mi>y</mi></math>", "isCorrect": false, "image": null}, {"id": "EVhxw", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>4</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "hzOhs", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "RJ1gs", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>R</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bb40a62a-09c8-4707-a562-9dbbbe30243f-image.png\" style=\"width: 336px; height: 300px;\" /></p><p>Since, circle passing through origin intersect the coordinate axes at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#38;</mo><mi>&#160;</mi><mi>B</mi></math>, hence <math><mi>A</mi><mi>B</mi></math> must be diameter and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mn>2</mn><mi>R</mi></math>.</p><p>Now, let foot of the perpendicular from origin upon <math><mi>A</mi><mi>B</mi></math> be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>&#160;</mi><mi>k</mi></mrow></mfenced></math>.</p><p>Slope of line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi><mo>=</mo><mfrac><mrow><mi>k</mi><mo>-</mo><mn>0</mn></mrow><mrow><mi>h</mi><mo>-</mo><mn>0</mn></mrow></mfrac><mo>=</mo><mfrac><mi>k</mi><mi>h</mi></mfrac></math></p><p>Since, line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>&#8869;</mo><mi>O</mi><mi>P</mi><mo>&#8658;</mo></math>&nbsp;slope of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mo>-</mo><mfrac><mi>h</mi><mi>k</mi></mfrac></math></p><p>Thus, equation of line&nbsp;&nbsp;<math><mi>A</mi><mi>B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mi>k</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>h</mi></mrow><mi>k</mi></mfrac><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mi>h</mi></mrow></mfenced></math></p><p>For co-ordinates of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>, put <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mn>0</mn><mo>-</mo><mi>k</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>h</mi></mrow><mi>k</mi></mfrac><mfenced><mrow><mi>x</mi><mo>-</mo><mi>h</mi></mrow></mfenced><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mrow><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup></mrow><mi>h</mi></mfrac><mo>&#8658;</mo><mi>A</mi><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup></mrow><mi>h</mi></mfrac><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math>.</p><p>For co-ordinates of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>y</mi><mo>-</mo><mi>k</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>h</mi></mrow><mi>k</mi></mfrac><mfenced><mrow><mn>0</mn><mo>-</mo><mi>h</mi></mrow></mfenced><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mfrac><mrow><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup></mrow><mi>k</mi></mfrac><mo>&#8658;</mo><mi>B</mi><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mfrac><mrow><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup></mrow><mi>k</mi></mfrac></mrow></mfenced></math>.</p><p>Now, given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mn>2</mn><mi>R</mi></math></p><p>Applying distance formula,</p><p><math><mo>&#8658;</mo><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>h</mi></mrow></mfrac><mo>-</mo><mn>0</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>0</mn><mo>-</mo><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>k</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><mn>2</mn><mi>R</mi></math></p><p><math><mo>&#8658;</mo><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>4</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>&#8658;</mo><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>4</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></math></p><p>Hence, locus is <math><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>4</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7ef", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 2)", "title": "JEE Main 2019 (12 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d667da", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A circle cuts a chord of length 4 a on the $x$ -axis and passes through a point on the $y$ -axis, distant $2 \\mathrm{~b}$ from the origin. Then the locus of the centre of this circle, is:", "image": null}, "options": [{"id": "AXkWC", "text": "a hyperbola", "isCorrect": false, "image": null}, {"id": "ttL9A", "text": "an ellipse", "isCorrect": false, "image": null}, {"id": "dVKU6", "text": "a straight line", "isCorrect": false, "image": null}, {"id": "gB2eC", "text": "a parabola", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/jcChSBnovtRTzVISRP-iGRFAGiX9hts05s5_-2erfPM.original.fullsize.png\"><br>\r\n\r\nLet centre be $C(h, k)$\r\n\r\n$C Q=C P=r$\r\n\r\n$\\Rightarrow C Q^{2}=C P^{2}$\r\n\r\n$(h-0)^{2}+(k \\pm 0)^{2}=C M^{2}+M P^{2}$\r\n\r\n$h^{2}+(k \\pm 2 \\mathrm{~b})^{2}=k^{2}+4 a^{2}$\r\n\r\n$h^{2}+k^{2}+4 b^{2} \\pm 4 b k=k^{2}+4 a^{2}$\r\n\r\nThen, the locus of centre $C(h, k)$\r\n\r\n$x^{2}+4 b^{2} \\pm 4 b y=4 a^{2}$\r\n\r\nHence, the above locus of the centre of circle is a\r\n\r\nparabola.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65fdd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2015 (11 Apr Online)", "title": "JEE Main 2015 (11 Apr Online)"}], "question": {"text": "If the incentre of an equilateral triangle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math>&nbsp;and the equation of its one side is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>, then the equation of the circumcircle of this triangle is:", "image": null}, "options": [{"id": "5mSim", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "tijGL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "KoMCj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>7</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "EaBBd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>14</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1e7e6f61-82ba-4df6-8ae1-65ffc479b6cd-image.png\" style=\"width: 230px; height: 190px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math><br /><br />Since, for equilateral triangle centroid in center and circumcenter is the same therefore length of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mfrac><mrow><mn>3</mn><mfenced separators=\"|\"><mn>1</mn></mfenced><mo>+</mo><mn>4</mn><mfenced separators=\"|\"><mn>1</mn></mfenced><mo>+</mo><mn>3</mn></mrow><msqrt><msup><mn>3</mn><mn>2</mn></msup><mo>+</mo><msup><mn>4</mn><mn>2</mn></msup></msqrt></mfrac></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>10</mn><mn>5</mn></mfrac><mo>=</mo><mn>2</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mi>A</mi><mi>B</mi></mrow></mfenced><mo>=</mo><mn>4</mn></math><br /><br />As centroid divide median in the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>1</mn></math><br /><br />Centre of the circle would be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math><br /><br /><math><mo>&#8756;&#160;</mo></math> Answer is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>14</mn><mo>=</mo><mn>0</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2015 (11 Apr Online)", "title": "JEE Main 2015 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f85", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_i mal\">&#160;</mi><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mn>4</mn></math><br /><br />Now, its points of intersection with co-ordinate axis are&nbsp;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mfenced separators=\"|\"><mrow><mfrac><mn>4</mn><mi>cos&#945;</mi></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">P</mi><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mfrac><mn>4</mn><mi>sin&#945;</mi></mfrac></mrow></mfenced></math><br /><br />Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ar</mi><mfenced separators=\"|\"><mrow><mo>&#8710;</mo><mi>PAB</mi></mrow></mfenced><mo>=</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mi>ar</mi><mo>&#8710;</mo><mi>PAO</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mi>OA</mi><mo>&#215;</mo><mi>OP</mi></mrow></mfenced></math><br /><br /><math><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi mathvariant=\"normal\">&#945;</mi></mrow></mrow></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mo>.</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>4</mn></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi mathvariant=\"normal\">&#945;</mi></mrow></mrow></mrow></mfrac></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mn>32</mn></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mn>2</mn><mi mathvariant=\"normal\">&#945;</mi></mrow></mrow></mrow></mfrac></mrow></mfenced><mo>&#8805;</mo><mn>32</mn></math><br /><br />which is maximum if,&nbsp;<math>< 0$\n", "image": null, "isCorrect": false}, {"id": "nj0Mx", "text": "\n$3 a^2+2 a b+3 b^2=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\left|\\frac{2 \\sqrt{(a+b)^2-a b}}{a+b}\\right|=1 \\\\\n& \\Rightarrow(a+b)^2=4\\left(a^2+b^2+a b\\right) \\\\\n& \\Rightarrow 3 a^2+3 b^2+2 a b=0 .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
