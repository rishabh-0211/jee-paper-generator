d><mo>,</mo></math> then the radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> is:", "image": null}, "options": [{"id": "azCNx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;units", "isCorrect": false, "image": null}, {"id": "OHqPw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>&nbsp;units", "isCorrect": true, "image": null}, {"id": "gomXe", "text": "<math><mn>2</mn><msqrt><mn>5</mn></msqrt></math>&nbsp;units", "isCorrect": false, "image": null}, {"id": "Ay47p", "text": "<math><msqrt><mn>57</mn></msqrt></math>&nbsp;units", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The equation of the tangent to the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>f</mi><mi>y</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;at a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mi>y</mi><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><mi>g</mi><mfenced><mrow><mi>x</mi><mo>+</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfenced><mo>+</mo><mi>f</mi><mfenced><mrow><mi>y</mi><mo>+</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn><mo>.</mo></math></p><p>Thus, the equation of the tangent to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>6</mn><mi>y</mi><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn></math>at <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>&#160;</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math> is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mfenced separators=\"|\"><mn>1</mn></mfenced><mo>+</mo><mi>y</mi><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn></mrow></mfenced><mo>+</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>3</mn><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>7</mn><mo>=</mo><mn>0</mn><mo>.</mo></math></p><p>Also, we know that the equation of a circle touching a circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>f</mi><mi>y</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;and line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mi>x</mi><mo>+</mo><mi>m</mi><mi>y</mi><mo>+</mo><mi>n</mi><mo>=</mo><mn>0</mn></math>&nbsp;at&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mi>&#955;</mi><mfenced><mrow><mi>l</mi><mi>x</mi><mo>+</mo><mi>m</mi><mi>y</mi><mo>+</mo><mi>n</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p>Hence, the required circle touching the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>7</mn><mo>=</mo><mn>0</mn></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mi>&#955;</mi><mfenced separators=\"|\"><mrow><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>7</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p>Given, this circle passes through <math><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi>&#160;</mi><mn>0</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>9</mn><mo>+</mo><mn>1</mn><mo>+</mo><mi>&#955;</mi><mfenced separators=\"|\"><mrow><mn>12</mn><mo>-</mo><mn>7</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mo>-</mo><mn>2</mn></math></p><p>Hence, the equation of the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>7</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>8</mn><mi>x</mi><mo>+</mo><mn>10</mn><mi>y</mi><mo>+</mo><mn>16</mn><mo>=</mo><mn>0</mn></math></p><p>Also, we know that the radius of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>f</mi><mi>y</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mi>g</mi><mn>2</mn></msup><mo>+</mo><msup><mi>f</mi><mn>2</mn></msup><mo>-</mo><mi>c</mi></msqrt></math></p><p>Hence,&nbsp;radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><msup><mfenced><mrow><mo>-</mo><mn>4</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mn>5</mn><mn>2</mn></msup><mo>-</mo><mn>16</mn></msqrt><mo>=</mo><msqrt><mn>16</mn><mo>+</mo><mn>25</mn><mo>-</mo><mn>16</mn></msqrt><mo>=</mo><mn>5</mn></math>&nbsp;units.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d66021", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}], "question": {"text": "The centres of those circles which touch the circle, <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>8</mn><mi>x</mi><mo>-</mo><mn>8</mn><mi>y</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo>,</mo></math> externally and also touch the <math><mrow><mi>x</mi></mrow></math> - axis, lie on", "image": null}, "options": [{"id": "H1SjA", "text": "A hyperbola", "image": null, "isCorrect": false}, {"id": "gh7dM", "text": "A parabola", "image": null, "isCorrect": true}, {"id": "fu2LA", "text": "A circle", "image": null, "isCorrect": false}, {"id": "qZ29P", "text": "An ellipse which is not a circle", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>8</mn><mi>x</mi><mo>-</mo><mn>8</mn><mi>y</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math><br /><br />has centre <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>4</mn><mo>,</mo><mo>&#160;</mo><mn>4</mn></mrow></mfenced></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>.<br /><br />Let <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>&#160;</mi><mi>k</mi></mrow></mfenced></math> be the centre of the circle which is touching the given circle externally<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c05e7fca-3bca-4ce0-8128-1e812454d76b-image.png\" style=\"width: 299px; height: 250px;\" /><br /><br />Then<br /><br /><math><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>k</mi><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><mn>6</mn><mo>+</mo><mi>k</mi></math><br /><br /><math><mo>&#8658;</mo></math><math><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>8</mn><mi>h</mi><mo>+</mo><mn>16</mn><mo>+</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>8</mn><mi>k</mi><mo>+</mo><mn>16</mn><mo>=</mo><mn>36</mn><mo>+</mo><mn>12</mn><mi>k</mi><mo>+</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>&#8658;</mo></math><math><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>8</mn><mi>h</mi><mo>-</mo><mn>20</mn><mi>k</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math> ,<br /><br />Replacing <math><mi>h</mi></math> by <math><mi>x</mi></math> and <math><mi>k</mi><mi>&#160;</mi></math> by <math><mi>y</mi></math>, locus is<br /><br /><math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>8</mn><mi>x</mi><mo>-</mo><mn>20</mn><mi>y</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn></math><br /><br />Which is equation of parabola.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d61", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}], "question": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp; be the circle with center at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math>&nbsp;and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;is the circle centered at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mi>y</mi></mrow></mfenced></math>,&nbsp;passing through the origin and touching the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;externally, then the radius of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is equal to&nbsp;", "image": null}, "options": [{"id": "8kTa1", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "a38BU", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "Ayqz2", "text": "<math> <mrow> <mfrac> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "nxgOq", "text": "<math> <mrow> <mfrac> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;be the required radius<br />As origin lies on the circle, the distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>&nbsp;from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mi>y</mi></mrow></mfenced><mo>=</mo><mi>r</mi></math>&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;</mo><mtext>y</mtext><mo>=</mo><mtext>r</mtext></math><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ca900165-d006-4374-a67d-bcde7d10e525-image.png\" style=\"width: 230px; height: 187px;\" /><br /><br />As the two circles touch externally, distance between centres is sum of the radii<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msqrt><msup><mfenced><mrow><mn>0</mn><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi mathvariant=\"normal\">y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mi>r</mi><mo>+</mo><mn>1</mn></math><br /><br /><math xmlns=\"http:// {"id": "P7zCk", "text": "\n$\\frac{1}{2}$\n", "image": null, "isCorrect": false}, {"id": "4DOkS", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "pZ9oo", "text": "\nNone of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given information is incomplete in the question.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c4c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "If a circle $\\mathrm{C}$ passing through $(4,0)$ touches the circle $x^2+y^2+4 x-6 y-12=0$ externally at a point $(1,-1)$, then the radius of the circle $\\mathrm{C}$ is :", "image": null}, "options": [{"id": "JC1b7", "text": "\n5\n", "image": null, "isCorrect": true}, {"id": "TRY0y", "text": "\n$2 \\sqrt{5}$\n", "image": null, "isCorrect": false}, {"id": "Yn7Mo", "text": "\n4\n", "image": null, "isCorrect": false}, {"id": "CmRdX", "text": "\n$\\sqrt{57}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let A be the centre of given circle and $\\mathrm{B}$ be the centre of circle C.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/CRII0vm6U0ICz7C6oleW7yTn3XvNIYtn88sF4N5r3Q0.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n& x^2+y^2+4 x-6 y-12=0 \\\\\n& \\therefore A=(-2,3) \\text { and } B=(g, f)\n\\end{aligned}\n$$\nNow, from the figure, we have\n$$\n\\frac{-2+g}{2}=1 \\text { and } \\frac{3+f}{2}=-1\n$$\n(By mid point formula)\n$$\n\\Rightarrow g=4 \\text { and } f=-5\n$$\nNow, required radius\n$$\n=\\mathrm{OB}=\\sqrt{9+16}=\\sqrt{25}=5\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65981", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "The two circles $x^2+y^2=a x$ and $x^2+y^2=c^2(c>0)$ touch each other if", "image": null}, "options": [{"id": "SWZjD", "text": "\n$|a|=c$\n", "image": null, "isCorrect": true}, {"id": "DVv9y", "text": "\n$a=2 c$\n", "image": null, "isCorrect": false}, {"id": "vuQu4", "text": "\n$|a|=2 c$\n", "image": null, "isCorrect": false}, {"id": "DBo3I", "text": "\n$2|a|=c$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{c}_1=\\left(\\frac{\\mathrm{a}}{2}, 0\\right) ; \\mathrm{c}_2=(0,0)$\n$\\mathrm{r}_1=\\frac{\\mathrm{a}}{2} ; \\mathrm{r}_2=\\mathrm{c}$\n$\\mathrm{c}_1 \\mathrm{c}_2=\\mathrm{r}_1-\\mathrm{r}_2 \\Rightarrow \\frac{\\mathrm{a}}{2}=\\mathrm{c}-\\frac{\\mathrm{a}}{2} \\Rightarrow \\mathrm{c}=\\mathrm{a}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d658c7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "If $P$ and $Q$ are the points of intersection of the circles $x^2+y^2+3 x+7 y+2 p-5=0$ and $x^2+y^2+2 x+2 y-p^2=0$, then there is a circle passing through $P, Q$ and $(1,1)$ for", "image": null}, "options": [{"id": "HRV2u", "text": "\nall values of $p$\n", "image": null, "isCorrect": true}, {"id": "DqWXg", "text": "\nall except one value of $p$\n", "image": null, "isCorrect": false}, {"id": "3gUPx", "text": "\nall except two values of $p$\n", "image": null, "isCorrect": false}, {"id": "TVJnY", "text": "\nexactly one value of $p$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given circles $S=x^2+y^2+3 x+7 y+2 p-5=0$\n$$\nS^{\\prime}=x^2+y^2+2 x+2 y-p^2=0\n$$\nEquation of required circle is $S+\\lambda S^{\\prime}=0$\nAs it passes through $(1,1)$ the value of $\\lambda=\\frac{-(7+2 p)}{\\left(6-p^2\\right)}$\nIf $7+2 p=0$, it becomes the second circle\n$\\therefore$ it is true for all values of $p$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d657f6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}], "question": {"text": "Consider a family of circles which are passing through the point $(-1,1)$ and are tangent to $x-$ axis. If $(h, k)$ are the co-ordinates of the centre of the circles, then the set of values of $k$ is given by the interval", "image": null}, "options": [{"id": "3n7GJ", "text": "\n$0 < \\mathrm{k} < 1 / 2$", "image": null, "isCorrect": false}, {"id": "jCWol", "text": "\n$k \\geq 1 / 2$\n", "image": null, "isCorrect": true}, {"id": "wybnG", "text": "\n$-1 / 2 \\leq k \\leq 1 / 2$\n", "image": null, "isCorrect": false}, {"id": "awsQr", "text": "\n$k \\leq 1 / 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of circle $(x-h)^2+(y-k)^2=k^2$ \nIt is passing through $(-1,1)$ then\n$\\begin{aligned}\n& (-1-h)^2+(1-k)^2=k^2 \\\\\n& h^2+2 h-2 k+2=0 \\\\\n& D \\geq 0 \\\\\n& 2 k-1 \\geq 0 \\Rightarrow k \\geq 1 / 2.\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656f4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "A circle touches the $x$-axis and also touches the circle with centre at $(0,3)$ and radius\n2. The locus of the centre of the circle is", "image": null}, "options": [{"id": "Wj6Ib", "text": "\nan ellipse\n", "image": null, "isCorrect": false}, {"id": "1UEME", "text": "\na circle\n", "image": null, "isCorrect": false}, {"id": "7N1yE", "text": "\na hyperbola\n", "image": null, "isCorrect": false}, {"id": "37wYl", "text": "\na parabola", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/-2UbyzVgUNpQw4N81_2Qro-a-UjDUMWuQsC4qY9L_0U.original.fullsize.png\"><br>\nEquation of circle with centre $(0,3)$ and radius 2 is $x^2+(y-3)^2=4$\nLet locus of the variable circle is $(\\alpha, \\beta)$\n$\\because$ It touches $x$-axis.\n$\\therefore$ It equation $(x-\\alpha)^2+(y-\\beta)^2=\\beta^2$\nCircles touch externally\n$$\n\\begin{aligned}\n& \\therefore \\sqrt{\\alpha^2+(\\beta-3)^2}=2+\\beta \\\\\n& \\alpha^2+(\\beta-3)^2=\\beta^2+4+4 \\beta \\\\\n& \\alpha^2=10(\\beta-1 / 2)\n\\end{aligned}\n$$\n$\\therefore$ Locus is $x^2=10(y-1 / 2)$ which is parabola.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656f3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "If the circles $x^2+y^2+2 a x+c y+a=0$ and $x^2+y^2-3 a x+d y-1=0$ intersect in two distinct points $P$ and $Q$ then the line $5 x+$ by $-a=0$ passes through $P$ and $Q$ for", "image": null}, "options": [{"id": "lRv9P", "text": "\nexactly one value of a\n", "image": null, "isCorrect": false}, {"id": "PkqaI", "text": "\nno value of a\n", "image": null, "isCorrect": true}, {"id": "uwtcn", "text": "\ninfinitely many values of a\n", "image": null, "isCorrect": false}, {"id": "Pdz0u", "text": "\nexactly two values of a", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& S_1=x^2+y^2+2 a x+c y+a=0 \\\\\n& S_2=x^2+y^2-3 a x+d y-1=0\n\\end{aligned}\n$$\nEquation of radical axis of $S_1$ and $S_2$\n$$\n\\begin{aligned}\n& S_1-S_2=0 \\\\\n& \\Rightarrow 5 a x+(c-d) y+a+1=0\n\\end{aligned}\n$$\nGiven that $5 \\mathrm{x}+\\mathrm{by}-\\mathrm{a}=0$ passes through $\\mathrm{P}$ and $\\mathrm{Q}$\n$$\n\\begin{aligned}\n& \\Rightarrow \\frac{a}{1}=\\frac{c-d}{b}=\\frac{a+1}{-a} \\\\\n& \\Rightarrow a+1=-a^2 \\\\\n& a^2+a+1=0\n\\end{aligned}\n$$\nNo real value of a.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d6544a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "The centre of the circle passing through $(0,0)$ and $(1,0)$ and touching the circle $x^2+y^2=9$ is", "image": null}, "options": [{"id": "5tPEP", "text": "\n$\\left(\\frac{1}{2}, \\frac{1}{2}\\right)$\n", "image": null, "isCorrect": false}, {"id": "H5MNV", "text": "\n$\\left(\\frac{1}{2},-\\sqrt{2}\\right)$\n", "image": null, "isCorrect": true}, {"id": "FRk70", "text": "\n$\\left(\\frac{3}{2}, \\frac{1}{2}\\right)$\n", "image": null, "isCorrect": false}, {"id": "3RaaV", "text": "\n$\\left(\\frac{1}{2}, \\frac{3}{2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65449", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "The centres of a set of circles, each of radius 3 , lie on the circle $x^2+y^2=25$. The locus of any point in the set is", "image": null}, "options": [{"id": "QNT94", "text": "\n$4 \\leq x^2+y^2 \\leq 64$\n", "image": null, "isCorrect": true}, {"id": "fIhl1", "text": "\n$x^2+y^2 \\leq 25$\n", "image": null, "isCorrect": false}, {"id": "YIKKY", "text": "\n$x^2+y^2 \\geq 25$\n", "image": null, "isCorrect": false}, {"id": "FzalW", "text": "\n$3 \\leq x^2+y^2 \\leq 9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $(h, k)$ be the centre of any such circle. Equation of such circle is $(x-h)^2+(y-k)^2=3^2$. Since $(\\mathrm{h}, \\mathrm{k})$ lies on $\\mathrm{x}^2+\\mathrm{y}^2=25 \\quad \\therefore \\mathrm{h}^2+\\mathrm{k}^2=25$.\n$x^2+y^2-(2 x h+2 y k)+25=9$; Locus of $(h, k)$ is $x^2+y^2=16$, which clearly satisfies (a).", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 13, "topicId": "648b5a73417cc3fb48d69355", "title": "Locus", "totalQuestions": 22, "questions": [{"_id": "69d8073881239f6567c4f333", "type": "numerical", "question": {"text": "Consider the circle $C: x^2+y^2-6x-8y-11=0$. Let a variable chord AB of the circle C subtend a right angle at the origin. If the locus of the foot of the perpendicular drawn from the origin on the chord AB is the circle $x^2+y^2-\\alpha x - \\beta y - \\gamma = 0$, then $\\alpha + \\beta + 2\\gamma$ is equal to ________.", "image": null}, "options": [], "correctValue": "18", "solution": {"text": "Let the foot of the perpendicular from the origin to the chord $AB$ be $P(h, k)$.<br><br>The slope of $OP$ is $\\dfrac{k}{h}$. Since the chord $AB$ is perpendicular to $OP$, its equation is given by:<br><br>$y - k = -\\dfrac{h}{k}(x - h) \\Rightarrow hx + ky = h^2 + k^2$<br><br>This can be rewritten as $\\dfrac{hx + ky}{h^2 + k^2} = 1$.<br><br>The chord $AB$ subtends a right angle at the origin. We homogenize the equation of the circle $x^2 + y^2 - 6x - 8y - 11 = 0$ with the equation of the chord to find the joint equation of the lines $OA$ and $OB$:<br><br>$x^2 + y^2 - (6x + 8y)\\left(\\dfrac{hx + ky}{h^2 + k^2}\\right) - 11\\left(\\dfrac{hx + ky}{h^2 + k^2}\\right)^2 = 0$<br><br>Since the lines $OA$ and $OB$ are perpendicular, the sum of the coefficients of $x^2$ and $y^2$ in this homogenized equation must be zero.<br><br>Coefficient of $x^2$: $1 - \\dfrac{6h}{h^2 + k^2} - \\dfrac{11h^2}{(h^2 + k^2)^2}$<br><br>Coefficient of $y^2$: $1 - \\dfrac{8k}{h^2 + k^2} - \\dfrac{11k^2}{(h^2 + k^2)^2}$<br><br>Equating the sum of these coefficients to zero:<br><br>$2 - \\dfrac{6h + 8k}{h^2 + k^2} - \\dfrac{11(h^2 + k^2)}{(h^2 + k^2)^2} = 0$<br><br>$2 - \\dfrac{6h + 8k}{h^2 + k^2} - \\dfrac{11}{h^2 + k^2} = 0$<br><br>$2(h^2 + k^2) - 6h - 8k - 11 = 0$<br><br>$h^2 + k^2 - 3h - 4k - \\dfrac{11}{2} = 0$<br><br>Replacing $(h, k)$ with $(x, y)$, the locus of the foot of the perpendicular is:<br><br>$x^2 + y^2 - 3x - 4y - \\dfrac{11}{2} = 0$<br><br>Comparing this with the given locus equation $x^2 + y^2 - \\alpha x - \\beta y - \\gamma = 0$, we get:<br><br>$\\alpha = 3$, $\\beta = 4$, $\\gamma = \\dfrac{11}{2}$<br><br>Therefore, the value of $\\alpha + \\beta + 2\\gamma$ is:<br><br>$3 + 4 + 2\\left(\\dfrac{11}{2}\\right) = 7 + 11 = 18$<br><br>Answer: $18$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "66db38f700e84f2cad3ed22149384e51", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cgV6cc7qzKkUc.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cgV6cc7qzKkUc.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19e8bfdbb2435639703", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let a circle of radius 4 pass through the origin O, the points $\\mathrm{A}(-\\sqrt{3} a, 0)$ and $\\mathrm{B}(0,-\\sqrt{2} b)$, where $a$ and $b$ are real parameters and $a b \\neq 0$. Then the locus of the centroid of $\\triangle O A B$ is a circle of radius", "image": null}, "options": [{"id": "jUjOy", "text": "$\\frac{\\frac{7}{3}}{3}$", "isCorrect": false, "image": null}, {"id": "Z1GfP", "text": "$\\frac{8}{3}$", "isCorrect": true, "image": null}, {"id": "5xTSh", "text": "$\\frac{11}{3}$", "isCorrect": false, "image": null}, {"id": "Wxtuz", "text": "$\\frac{5}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Circle of radius 4 passes through O and points A($-\\sqrt{3a}$, 0), B(0, $-\\sqrt{2b}$).<br>Let center be C(h, k) on circle: $h^2 + k^2 = 16$.<br>Since A, B lie on circle: $3a^2 + 2\\sqrt{3a}h + h^2 + k^2 = 16$ gives $h = -\\frac{\\sqrt{3a}}{2}$<br>And $h^2 + 2b + 2\\sqrt{2b}k + k^2 = 16$ gives $k = -\\frac{\\sqrt{2b}}{2}$<br>Centroid G = $\\left(\\frac{-\\sqrt{3a}}{3}, \\frac{-\\sqrt{2b}}{3}\\right)$. Setting $x = \\frac{-\\sqrt{3a}}{3}$ and $y = \\frac{-\\sqrt{2b}}{3}$:<br>$a = 3x^2$ and $b = \\frac{9y^2}{2}$<br>From $h^2 + k^2 = 16$: $\\frac{3a}{4} + \\frac{2b}{4} = 16$ → $3a + 2b = 64$<br>Substituting: $9x^2 + 9y^2 = 64$ → $x^2 + y^2 = \\frac{64}{9}$<br>Radius = $\\frac{8}{3}$", "image": null}, "videoSolution": {"videoId": "f5251cf362864e968a8741afbea224e4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Wgxab54kpZtvA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Wgxab54kpZtvA.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1788bfdbb243563953d", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let PQ and MN be two straight lines touching the circle $x^{2}+y^{2}-4 x-6 y-3=0$ at the points A and B respectively. Let O be the centre of the circle and $\\angle \\mathrm{AOB}=\\pi / 3$. Then the locus of the point of intersection of the lines PQ and MN is :", "image": null}, "options": [{"id": "4w2Gs", "text": "$x^{2}+y^{2}-12 x-18 y-25=0$", "isCorrect": false, "image": null}, {"id": "Vzit1", "text": "$3\\left(x^{2}+y^{2}\\right)-18 x-12 y+25=0$", "isCorrect": false, "image": null}, {"id": "MzrB9", "text": "$3\\left(x^{2}+y^{2}\\right)-12 x-18 y-25=0$", "isCorrect": true, "image": null}, {"id": "66PFE", "text": "$x^{2}+y^{2}-18 x-12 y-25=0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Circle: $(x-2)^2 + (y-3)^2 = 16$, center O = (2, 3), radius $r = 4$.<br>For tangents from external point P touching at A and B with $\\angle AOB = \\pi/3$:<br>In quadrilateral OAPB: $\\angle APB = \\pi - \\pi/3 = 2\\pi/3$, so $\\angle OPA = \\pi/3$.<br>In right triangle OAP: $\\sin(\\pi/3) = \\frac{4}{OP}$.<br>$OP = \\frac{8}{\\sqrt{3}} = \\frac{8\\sqrt{3}}{3}$.<br>Locus: $(x-2)^2 + (y-3)^2 = \\frac{64}{3}$.<br>$3(x^2 + y^2) - 12x - 18y - 25 = 0$.", "image": null}, "videoSolution": {"videoId": "61def98bb9874bf4801af048929b86d5", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/RKSC3LryGKogZ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/RKSC3LryGKogZ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557bc4ed43b5ec151ee547b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;be the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> be any point on the curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>16</mn></math>. If the centre of the locus of the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>, which divides the line segment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#160;</mo><mi>B</mi></math>&nbsp;in the ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>:</mo><mn>2</mn></math>&nbsp;is the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced></math>, then the length of the line segment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>C</mi></math>&nbsp;is", "image": null}, "options": [{"id": "IKVod", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><msqrt><mn>5</mn></msqrt></mrow><mn>5</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "7FvE9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><msqrt><mn>5</mn></msqrt></mrow><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "CYdXt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msqrt><mn>5</mn></msqrt></mrow><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7igpz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>6</mn><msqrt><mn>5</mn></msqrt></mrow><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;be the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> be any point on the curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>16</mn></math>,</p><p>And the centre of the locus of the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>, which divides the line segment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;in the ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>:</mo><mn>2</mn></math>&nbsp;is the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced></math>,</p><p>Now let the point on the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>16</mn></math>&nbsp;be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mrow><mn>4</mn><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mn>4</mn><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math></p><p>Now using section formula in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mrow><mn>4</mn><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mn>4</mn><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mfrac><mrow><mn>12</mn><mi>cos</mi><mi>&#952;</mi><mo>+</mo><mn>2</mn></mrow><mn>5</mn></mfrac><mo>,</mo><mfrac><mrow><mn>12</mn><mi>sin</mi><mi>&#952;</mi><mo>+</mo><mn>4</mn></mrow><mn>5</mn></mfrac></mrow></mfenced><mo>&#8801;</mo><mo>(</mo><mi>h</mi><mo>,</mo><mi>k</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mi>h</mi><mo>-</mo><mn>2</mn></mrow><mn>12</mn></mfrac><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mi>k</mi><mo>-</mo><mn>4</mn></mrow><mn>12</mn></mfrac></math></p><p>Now squaring and adding we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mfrac><mrow><mn>5</mn><mi>h</mi><mo>-</mo><mn>2</mn></mrow><mn>12</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mrow><mn>5</mn><mi>k</mi><mo>-</mo><mn>4</mn></mrow><mn>12</mn></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mrow><mi>h</mi><mo>-</mo><mfrac><mn>2</mn><mn>5</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>k</mi><mo>-</mo><mfrac><mn>4</mn><mn>5</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mfenced><mfrac><mn>12</mn><mn>5</mn></mfrac></mfenced><mn>2</mn></msup></math></p><p>So, the centre of the locus is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mfenced><mrow><mfrac><mn>2</mn><mn>5</mn></mfrac><mo>,</mo><mfrac><mn>4</mn><mn>5</mn></mfrac></mrow></mfenced></math></p><p>Hence, by distance formula we get,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>C</mi><mo>=</mo><msqrt><msup><mfenced><mfrac><mn>3</mn><mn>5</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mn>6</mn><mn>5</mn></mfrac></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>5</mn></msqrt></mrow><mn>5</mn></mfrac></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557bc4dd43b5ec151ee547a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}], "question": {"text": "A line segment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math> moves such that the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> remain on the periphery of a circle of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>. Then the locus of the point, that divides the line segment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> in the ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>3</mn></math>, is a circle of radius", "image": null}, "options": [{"id": "TXVAA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>5</mn></mfrac><mi>&#955;</mi></math>", "image": null, "isCorrect": false}, {"id": "2FcVT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac><mi>&#955;</mi></math>", "image": null, "isCorrect": false}, {"id": "a6NLF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>19</mn></msqrt><mn>5</mn></mfrac><mi>&#955;</mi></math>", "image": null, "isCorrect": true}, {"id": "avQEG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>19</mn></msqrt><mn>7</mn></mfrac><mi>&#955;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p>A line segment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math> moves such that the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> remain on the periphery of a circle of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>,</p><p>Now taking the points on the circle of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>&nbsp;as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mrow><mi>&#955;</mi><mi>cos</mi><msub><mi>&#952;</mi><mn>1</mn></msub><mo>,</mo><mi>&#955;</mi><mi>sin</mi><msub><mi>&#952;</mi><mn>1</mn></msub></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>A</mi><mfenced><mrow><mi>&#955;</mi><mi>cos</mi><msub><mi>&#952;</mi><mn>2</mn></msub><mi>&#955;</mi><mi>sin</mi><msub><mi>&#952;</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;and taking the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math>&nbsp;which divides the line segment in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>3</mn></math></p><p>Now plotting the diagram we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3c3e69d4-67e1-4c8c-bfe4-fe4e158ab23a.png\" style=\"width: 500px; height: 280px;\" /></p><p>Now, let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> be the origin and radius of circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math> and &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mi>&#955;</mi></math>&nbsp;and using distance formula we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mi>&#955;</mi><mo>=</mo><msqrt><msup><mfenced><mrow><mi>&#955;</mi><mi>cos</mi><msub><mi>&#952;</mi><mn>1</mn></msub><mo>-</mo><mi>&#955;</mi><mi>cos</mi><msub><mi>&#952;</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>&#955;</mi><mi>sin</mi><msub><mi>&#952;</mi><mn>1</mn></msub><mo>-</mo><mi>&#955;</mi><mi>sin</mi><msub><mi>&#952;</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>=</mo><mn>2</mn><mo>-</mo><mn>2</mn><mo>&#160;</mo><mi>cos</mi><mfenced><mrow><msub><mi>&#952;</mi><mn>1</mn></msub><mo>-</mo><msub><mi>&#952;</mi><mn>2</mn></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mfenced><mrow><msub><mi>&#952;</mi><mn>1</mn></msub><mo>-</mo><msub><mi>&#952;</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>Now using section formula we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#955;</mi><mo>&#160;</mo><mi>cos</mi><msub><mi>&#952;</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn><mi>&#955;</mi><mo>&#160;</mo><mi>cos</mi><msub><mi>&#952;</mi><mn>2</mn></msub></mrow><mn>5</mn></mfrac></math>&nbsp;and&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#955;</mi><mo>&#160;</mo><mi>sin</mi><msub><mi>&#952;</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn><mi>&#955;</mi><mo>&#160;</mo><mi>sin</mi><msub><mi>&#952;</mi><mn>2</mn></msub></mrow><mn>5</mn></mfrac></math></p><p>Now squaring and adding above two value we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup><mo>=</mo><mfrac><msup><mi>&#955;</mi><mn>2</mn></msup><mn>25</mn></mfrac><mfenced close=\"]\" open=\"[\"><mrow><mn>4</mn><mo>+</mo><mn>9</mn><mo>+</mo><mn>12</mn><mfenced><mrow><mi>cos</mi><mfenced><mrow><msub><mi>&#952;</mi><mn>1</mn></msub><mo>-</mo><msub><mi>&#952;</mi><mn>2</mn></msub></mrow></mfenced></mrow></mfenced></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup><mo>=</mo><mfrac><msup><mi>&#955;</mi><mn>2</mn></msup><mn>25</mn></mfrac><mo>&#183;</mo><mn>19</mn></math></p><p>Hence, Radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi>&#955;</mi><mn>5</mn></mfrac><msqrt><mn>19</mn></msqrt></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id" tion": {"text": "<p>Given,</p><p>The line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mo>-</mo><mi>x</mi></math>&nbsp;bisect the chord&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math></p><p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#955;</mi><mo>,</mo><mo>-</mo><mi>&#955;</mi></mrow></mfenced></math>&nbsp;is&nbsp;the mid-point of the chord&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>&nbsp;then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>(</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mi>&#945;</mi><mo>,</mo><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mi>&#946;</mi><mo>)</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a51f9804-4d6a-467f-a83f-1fd092f4fdb9-9896475.png\" style=\"width: 400px; height: 271px;\" /></p><p>Given circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mo>(</mo><mn>1</mn><mo>+</mo><mi>a</mi><mo>)</mo><mi>x</mi><mo>-</mo><mo>(</mo><mn>1</mn><mo>-</mo><mi>a</mi><mo>)</mo><mi>y</mi><mo>=</mo><mn>0</mn></math></p><p>Or,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mfenced><mfrac><mrow><mn>1</mn><mo>+</mo><mi>a</mi></mrow><mn>2</mn></mfrac></mfenced><mi>x</mi><mo>-</mo><mfenced><mfrac><mrow><mn>1</mn><mo>-</mo><mi>a</mi></mrow><mn>2</mn></mfrac></mfenced><mi>y</mi><mo>=</mo><mn>0</mn></math></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mo>+</mo><mi>a</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mi>&#945;</mi><mo>,</mo><mfrac><mrow><mn>1</mn><mo>-</mo><mi>a</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mi>&#946;</mi></math></p><p>The circle equation will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathM </mo><mn>9</mn><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><mn>16</mn><mfenced><mfrac><mrow><mn>1</mn><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac></mfenced><mo>&#62;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>a</mi><mn>2</mn></msup><mo>&#62;</mo><mn>8</mn></math></p>", "image": null}, "videoSolution": {"videoId": "acbfb48370884be6b557f457f02cb3da", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/OthN0xz2FqMCk.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/OthN0xz2FqMCk.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6809d", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The points of intersection of the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi>b</mi><mi>y</mi><mo>=</mo><mn>0</mn></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>&#8800;</mo><mi mathvariant=\"normal\">b</mi><mo>)</mo></math> and the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>0</mn></math>&nbsp;are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>(</mo><mi>&#945;</mi><mo>,</mo><mn>0</mn><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>(</mo><mn>1</mn><mo>,</mo><mi>&#946;</mi><mo>)</mo></math>. The image of the circle with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;as a diameter in the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi mathvariant=\"normal\">y</mi><mo>+</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>&nbsp;is :", "image": null}, "options": [{"id": "GG3IL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><mi>x</mi><mo>+</mo><mn>5</mn><mi>y</mi><mo>+</mo><mn>12</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": true, "image": null}, {"id": "laqyu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>5</mn><mi>y</mi><mo>+</mo><mn>8</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "XDObE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "1FVUJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi>x</mi><mo>-</mo><mn>5</mn><mi>y</mi><mo>+</mo><mn>12</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p>The points of intersection of the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>x</mi><mo>+</mo><mi>b</mi><mi>y</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>(</mo><mi>a</mi><mo>&#8800;</mo><mi>b</mi><mo>)</mo></math>&nbsp;and the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>=</mo><mn>0</mn></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mn>0</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>(</mo><mn>1</mn><mo>,</mo><mi>&#946;</mi><mo>)</mo></math>&nbsp;then,</p><p>For point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mn>0</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>(</mo><mi>&#945;</mi><mo>)</mo><mo>+</mo><mi>b</mi><mo>(</mo><mn>0</mn><mo>)</mo><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mn>0</mn></math></p><p>And,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>&#945;</mi><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>2</mn></math></p><p>For point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>(</mo><mn>1</mn><mo>,</mo><mi>&#946;</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>+</mo><mi>b</mi><mi>&#946;</mi><mo>=</mo><mn>0</mn></math></p><p>Or,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>b</mi></mrow><mi>a</mi></mfrac></math></p><p>And,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#946;</mi><mo>=</mo><mo>&#177;</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mi>a</mi><mo>&#8800;</mo><mi>b</mi></math>&nbsp;therefore,</p><p>Only possibility&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>=</mo><mn>1</mn></math></p><p>Points are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mn>0</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math></p><p>So the centre of the circle with diameter AB is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mfrac><mstyle displaystyle=\"true\"><mn>1</mn></mstyle><mstyle displaystyle=\"true\"><mn>2</mn></mstyle></mfrac></mrow></mfenced></math>&nbsp;and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math></p><p>Now the image of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mfrac><mstyle displaystyle=\"true\"><mn>1</mn></mstyle><mstyle displaystyle=\"true\"><mn>2</mn></mstyle></mfrac></mrow></mfenced></math>&nbsp;about the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>&nbsp;is,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mi>y</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mf , {"id": "yJyHr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Since the circle with centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&alpha;</mi><mo>,</mo><mi>&beta;</mi></mrow></mfenced></math>&nbsp;touches the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>1</mn></math>&nbsp;externally and also touches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mtext>axis</mtext></math>,</p><p>therefore the distance between the centres will be equal to the sum of the radius of both circles</p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mfenced><mrow><mi>&alpha;</mi><mo>-</mo><mn>0</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>&beta;</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mi>&beta;</mi><mo>+</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&rArr;</mo><msup><mi>&alpha;</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>&beta;</mi></math></p><p>Hence the locus of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>y</mi></math></p><p>Now, the area bounded by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>y</mi><mo>&nbsp;</mo><mo>&amp;</mo><mo>&nbsp;</mo><mi>y</mi><mo>=</mo><mn>4</mn></math>&nbsp;will be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>2</mn><msubsup><mo>&int;</mo><mn>0</mn><mn>4</mn></msubsup><mfenced><mrow><mn>4</mn><mo>-</mo><mf
