n>2</mn></msub></math>&nbsp;is equal to", "image": null}, "options": [{"id": "yZchL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "62dT7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">&#960;</mi></mrow><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "wARAT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>6</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "YRQYG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></mfrac></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>:</mo><mo>&#160;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>5</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn></math>&nbsp;which subtend an angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mi>i</mi></msub></math>&nbsp;at the centre of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>i</mi></msub></math>, is a circle of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi>i</mi></msub></math>,</p><p>Now plotting the diagram we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f0b1362e-a52d-4f77-8c26-cb0ee38bf49d-9894453.png\" style=\"width: 350px; height: 347px;\" /></p><p>Now given&nbsp;If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>3</mn></mfrac></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>3</mn></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow><mn>3</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>r</mi><mn>1</mn></msub><mn>2</mn></msup><mo>=</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mn>2</mn></msup><mo>+</mo><msup><msub><mi>r</mi><mn>3</mn></msub><mn>2</mn></msup></math>,</p><p>Now taking triangle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi><mi>B</mi></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mi>P</mi><mi>C</mi></mrow><mn>2</mn></mfrac></math>, so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>C</mi><mo>=</mo><mn>2</mn><mi>cos</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></math></p><p>Now using distance formula we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>h</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>k</mi><mo>-</mo><mn>5</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn><msup><mi>cos</mi><mn>2</mn></msup><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></math></p><p>So, locus will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>5</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn><msup><mi>cos</mi><mn>2</mn></msup><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></math></p><p>Now radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi>cos</mi><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>6</mn></mfrac><mo>=</mo><msqrt><mn>3</mn></msqrt></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mi>cos</mi><mfrac><msub><mi mathvariant=\"normal\">&#952;</mi><mn>2</mn></msub><mn>2</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>3</mn></msub><mo>=</mo><mn>2</mn><mi>cos</mi><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>3</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>Now using&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>r</mi><mn>1</mn></msub><mn>2</mn></msup><mo>=</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mn>2</mn></msup><mo>+</mo><msup><msub><mi>r</mi><mn>3</mn></msub><mn>2</mn></msup></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><msqrt><mn>3</mn></msqrt></mfenced><mn>2</mn></msup><mo>=</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mn>2</mn></msup><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><msup><mi>cos</mi><mn>2</mn></msup><mfrac><mi>&#952;</mi><mn>2</mn></mfrac><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced open=\"|\" close=\"|\"><mrow><mi>cos</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "10d0083f098e41109c32c2257105fba1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Uq19v85jqh0Lv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Uq19v85jqh0Lv.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFr ow><mn>4</mn><msqrt><mn>2</mn></msqrt></mrow><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mfrac><mrow><mn>4</mn><msqrt><mn>2</mn></msqrt></mrow><mrow><mfenced separators=\"|\"><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced><msqrt><mn>2</mn></msqrt></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mfrac><mn>4</mn><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfrac><mi>&#160;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>r</mi><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6489", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2017 (02 Apr)", "title": "JEE Main 2017 (02 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d66029", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}], "question": {"text": "If one of the diameters of the circle, given by the equation, <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>6</mn><mi>y</mi><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn><mo>,</mo></math> is a chord of a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>, whose centre is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced></math>, then the radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is", "image": null}, "options": [{"id": "9UCAU", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "QpFy8", "text": "<math><mn>10</mn></math>", "image": null, "isCorrect": false}, {"id": "dIy1h", "text": "<math><mn>5</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "h9mRG", "text": "<math><mn>5</mn><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The centre of the given circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>6</mn><mi>y</mi><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&nbsp;</mo><mo>-</mo><mn>3</mn></mrow></mfenced></math> and the radius is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>.</p><p>​​​​​​​<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7f8d49e5-3dfa-428e-b101-80cf5a0bd8b6-image.png\" style=\"width: 220px; height: 139px;\" /></p><p>The distance between the centres <math><mn>5</mn><msqrt><mn>2</mn></msqrt></math> and radius is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>. The triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi><mi>Q</mi></math> is a right angled triangle<br /><br /><math><mi>O</mi><mi>Q</mi><mo>=</mo><mi>&nbsp;</mi><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mn>5</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><mi>&nbsp;</mi><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mn>5</mn><msqrt><mn>3</mn></msqrt></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><mn>5</mn><msqrt><mn>3</mn></msqrt></math><br /><br />Hence answer is <math><mn>5</mn><msqrt><mn>3</mn></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f74", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}], "question": {"text": "If <math><mi>y</mi><mo>+</mo><mn>3</mn><mi>x</mi><mo>=</mo><mn>0</mn></math> is the equation of a chord of the circle&nbsp;<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>30</mn><mi>x</mi><mo>=</mo><mn>0</mn></math>, then the equation of the circle with this chord as diameter is :", "image": null}, "options": [{"id": "OyvP3", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>-</mo><mn>9</mn><mi>y</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "MznrP", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>9</mn><mi>y</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "r8IMh", "text": "<math><msup><mrow> L\"><mi>y</mi><mo>&#160;</mo><mo>=</mo><mo>-</mo><mn>9</mn></math>&nbsp;are&nbsp;the corresponding ordinates.<br />Point of intersection&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>)</mo></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>9</mn><mo>)</mo></math><br />Diametric form of equation of circle,<br /><math><mi>x</mi><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mo>+</mo><mi>y</mi><mfenced separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>9</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>9</mn><mi>y</mi><mo>=</mo><mn>0</mn></math> .</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65ebb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}], "question": {"text": "The equation of the circle described on the chord <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>&#8289;</mo><mo>+</mo><mi>y</mi><mo>&#8289;</mo><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math>&nbsp;of the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mi>y</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>=</mo><mn>1</mn><mn>6</mn></math>&nbsp;as&nbsp;the diameter is&nbsp;", "image": null}, "options": [{"id": "mdBl8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mi>y</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>&#8289;</mo><mo>+</mo><mi>y</mi><mo>&#8289;</mo><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "cxV5X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mi>y</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>&#8289;</mo><mo>+</mo><mi>y</mi><mo>&#8289;</mo><mo>-</mo><mn>2</mn><mn>2</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "5ullp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mi>y</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>&#8289;</mo><mo>+</mo><mi>y</mi><mo>&#8289;</mo><mo>-</mo><mn>1</mn><mn>1</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "iQI19", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mi>y</mi><msup><mo>&#8289;</mo><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>&#8289;</mo><mo>+</mo><mi>y</mi><mo>&#8289;</mo><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b0ab05a7-d535-493e-aacb-c35e67afc6a2-image.png\" style=\"width: 220px; height: 167px;\" /></p><p>We know that the equation of the family of circle passing through the point of intersection of a circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mn>0</mn></math>&nbsp;and a line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mn>0</mn></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>+</mo><mi>&#955;</mi><mi>L</mi><mo>=</mo><mn>0</mn><mo>.</mo></math></p><p>Hence, the family of circle passing through points of intersection of given circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>16</mn><mo>=</mo><mn>0</mn></math> and chord <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>16</mn><mo>)</mo><mo>+</mo><mi>&#955;</mi><mfenced separators=\"|\"><mrow><mn>3</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>5</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>&#955;</mi><mi>x</mi><mo>+</mo><mi>&#955;</mi><mi>y</mi><mo>+</mo><mn>5</mn><mi>&#955;</mi><mo>-</mo><mn>16</mn><mo>=</mo><mn>0</mn></math></p><p>We know that, the centre of a circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>f</mi><mi>y</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mi>g</mi><mo>,</mo><mo>&#160;</mo><mo>-</mo><mi>f</mi></mrow></mfenced></math></p><p>Hence, centre of the&nbsp;circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>&#955;</mi><mi>x</mi><mo>+</mo><mi>&#955;</mi><mi>y</mi><mo>+</mo><mn>5</mn><mi>&#955;</mi><mo>-</mo><mn>16</mn><mo>=</mo><mn>0</mn></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>3</mn><mi>&#955;</mi></mrow><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mo>-</mo><mfrac><mi>&#955;</mi><mn>2</mn></mfrac></mrow></mfenced></math>&nbsp;and since,&nbsp;for this circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> is diameter, thus <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mfrac><mrow><mo>-</mo><mn>3</mn><mi>&#955;</mi></mrow><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mo>-</mo><mi>&#955;</mi></mrow><mn>2</mn></mfrac><mi>&#160;</mi></mrow></mfenced></math> must lie on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn mathvariant=\"italic\">y</mn><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mfenced><mrow><mo>-</mo><mfrac><mrow><mn>3</mn><mi>&#955;</mi></mrow><mn>2</mn></mfrac></mrow></mfenced><mo>+</mo><mfenced><mrow><mo>-</mo><mfrac><mi>&#955;</mi><mn>2</mn></mfrac></mrow></mfenced><mi>&#160;</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>-</mo><mfrac><mrow><mn>9</mn><mi>&#955;</mi></mrow><mn>2</mn></mfrac><mo>-</mo><mfrac><mi>&#955;</mi><mn>2</mn></mfrac><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mn>1</mn><mo>.</mo></math></p><p>Therefore, the equation of the required circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>&#215;</mo><mi>y</mi><mo>+</mo><mn>5</mn><mo>&#215;</mo><mn>1</mn><mo>-</mo><mn>16</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>11</mn><mo>=</mo><mn>0</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a86", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "If the line $y=m x+1$ meets the circle $x^2+y^2+3 x=0$ in two points equidistant from and on opposite sides of $x$-axis, then", "image": null}, "options": [{"id": "SxS6J", "text": "\n$3 m+2=0$\n", "image": null, "isCorrect": false}, {"id": "6mtfI", "text": "\n$3 m-2=0$\n", "image": null, "isCorrect": true}, {"id": "m24ky", "text": "\n$2 m+3=0$\n", "image": null, "isCorrect": false}, {"id": "e5dqP", "text": "\n$2 m-3=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Circle: $x^2+y^2+3 x=0$\nCentre, $B=\\left(-\\frac{3}{2}, 0\\right)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/JHi0ISQLksCBFrolS3C21H_y9kJM4wr3_4-6d-o3ePs.original.fullsize.png\"><br>\n$y$-intercept of the line $=1$\n$$\n\\therefore \\quad \\mathrm{A}=(0,1)\n$$\nSlope of line, $m=\\tan \\theta=\\frac{O A}{O B}$\n$$\n\\begin{aligned}\n& \\Rightarrow m=\\frac{1}{\\frac{3}{2}}=\\frac{2}{3} \\\\\n& \\Rightarrow 3 m-2=0\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659d5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "The equation of the circle passing through the point $(1,2)$ and through the points of intersection of $x^2+y^2-4 x-6 y-21=0$ and $3 x+4 y+5=0$ is given by", "image": null}, "options": [{"id": "P2XB0", "text": "\n$x^2+y^2+2 x+2 y+11=0$\n", "image": null, "isCorrect": false}, {"id": "ELV69", "text": "\n$x^2+y^2-2 x+2 y-7=0$\n", "image": null, "isCorrect": false}, {"id": "S6XKU", "text": "\n$x^2+y^2+2 x-2 y-3=0$\n", "image": null, "isCorrect": false}, {"id": "oC5Ji", "text": "\n$x^2+y^2+2 x+2 y-11=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Point $(1,2)$ lies on the circle $x^2+y^2+2 x+2 y$ $-11=0$, because coordinates of point $(1,2)$ satisfy the equation\n$$\nx^2+y^2+2 x+2 y-11=0\n$$\nNow, $x^2+y^2-4 x-6 y-21=0 \\quad$...(i)\n$$\n\\begin{aligned}\n& x^2+y^2+2 x+2 y-11=0 \\\\\n& 3 x+4 y+5=0\n\\end{aligned}\n$$\nFrom (i) and (iii),\n$$\n\\begin{array}{r}\nx^2+\\left(-\\frac{3 x+5}{4}\\right)^2-4 x-6\\left(-\\frac{3 x+5}{4}\\right)-21=0 \\\\\n\\Rightarrow \\quad 16 x^2+9 x^2+30 x+25-64 x \\\\\n+72 x+120-336=0\n\\end{array}\n$$\n\n$$\n\\begin{aligned}\n& \\Rightarrow \\quad 25 x^2+38 x-191=0 \\\\\n& \\text { From (ii) and (iii), } \\\\\n& x^2+\\left(-\\frac{3 x+5}{4}\\right)^2+2 x+2\\left(-\\frac{3 x+5}{4}\\right)-11=0 \\\\\n& \\Rightarrow \\quad 16 x^2+9 x^2+30 x+25+32 x\n\\end{aligned}\n$$\nThus we get the same equation from (ii) and (iii) as we get from equation (i) and (iii). Hence the point of intersections of (ii) and (iii) will be same as the point of intersections of(i) and (iii). Therefore the circle (ii) passing through the point of intersection of circle(i) and point $(1,2)$ also as shown in the figure.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/pPzob2-4Z9LpDuihWC17jnqE_89s-IM26y5nnmtwOVI.original.fullsize.png\"><br>\nHence equation(ii) i.e. $x^2+y^2+2 x+2 y-11=0$ is the equation of required circle.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65932", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "The circle $x^2+y^2=4 x+8 y+5$ intersects the line $3 x-4 y=m$ at two distinct points if", "image": null}, "options": [{"id": "a6Z6P", "text": "\n$-35 < m < 15$", "image": null, "isCorrect": true}, {"id": "7El3C", "text": "\n$15 < m < 65$", "image": null, "isCorrect": false}, {"id": "C41fi", "text": "\n$35 < m < 85$", "image": null, "isCorrect": false}, {"id": "Str0j", "text": "\n$-85 < m < -35$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Circle $x^2+y^2-4 x-8 y-5=0$\nCentre $=(2,4)$, Radius $=\\sqrt{4+16+5}=5$\nIf circle is intersecting line $3 x-4 y=m$\nat two distinct points.\n$\\Rightarrow$ length of perpendicular from centre $ < $ radius\n$\\Rightarrow \\frac{|6-16-\\mathrm{m}|}{5} < 5$\n$\\Rightarrow|10+\\mathrm{m}| < 25$\n$\\Rightarrow-25 < m+10 < 25$\n$\\Rightarrow-35 < \\mathrm{m} < 15$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65610", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "The intercept on the line $y=x$ by the circle $x^2+y^2-2 x=0$ is $A B$. Equation of the circle on $\\mathrm{AB}$ as a diameter is", "image": null}, "options": [{"id": "K0tfw", "text": "\n$x^2+y^2-x-y=0$\n", "image": null, "isCorrect": true}, {"id": "tnTMG", "text": "\n$x^2+y^2-x+y=0$\n", "image": null, "isCorrect": false}, {"id": "YQ3Tz", "text": "\n$\\mathrm{x}^2+\\mathrm{y}^2+\\mathrm{x}+\\mathrm{y}=0$\n", "image": null, "isCorrect": false}, {"id": "ZVnOr", "text": "\n$x^2+y^2+x-y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Points of intersection of line $y=x$ with $x^2+y^2-2 x=0$ are $(0,0)$ and $(1,1)$ hence equation of circle having end points of diameter $(0,0)$ and $(1,1)$ is $x^2+y^2-x-y=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d6560f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "If the lines $2 x+3 y+1=0$ and $3 x-y-4=0$ lie along diameters of a circle of circumference $10 \\pi$, then the equation of the circle is", "image": null}, "options": [{"id": "SCLo9", "text": "\n$x^2+y^2-2 x+2 y-23=0$\n", "image": null, "isCorrect": true}, {"id": "xUUSH", "text": "\n$x^2+y^2-2 x-2 y-23=0$\n", "image": null, "isCorrect": false}, {"id": "tWpgj", "text": "\n$x^2+y^2+2 x+2 y-23=0$\n", "image": null, "isCorrect": false}, {"id": "hzdQD", "text": "\n$x^2+y^2+2 x-2 y-23=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Intersection of given lines is the centre of the circle i.e. $(1,-1)$ Circumference $=10 \\pi \\Rightarrow$ radius $r=5$\n$\\Rightarrow$ equation of circle is $x^2+y^2-2 x+2 y-23=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65520", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "The lines $2 \\mathrm{x}-3 \\mathrm{y}=5$ and $3 \\mathrm{x}-4 \\mathrm{y}=7$ are diameters of a circle having area as 154 sq. units. Then the equation of the circle is", "image": null}, "options": [{"id": "xj0Tn", "text": "\n$x^2+y^2-2 x+2 y=62$\n", "image": null, "isCorrect": false}, {"id": "jmGVE", "text": "\n$x^2+y^2+2 x-2 y=62$\n", "image": null, "isCorrect": false}, {"id": "18vac", "text": "\n$x^2+y^2+2 x-2 y=47$\n", "image": null, "isCorrect": false}, {"id": "veOQa", "text": "\n$x^2+y^2-2 x+2 y=47$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\pi \\mathrm{r}^2=154 \\Rightarrow \\mathrm{r}=7$\nFor centre on solving equation\n$2 x-3 y=5 \\quad \\& \\quad 3 x-4 y=7 \\text { or } x=1, y=1 \\text { centre }=(1,-1)$\nEquation of circle, $(\\mathrm{x}-1)^2+(\\mathrm{y}+1)^2=7^2$\n$x^2+y^2-2 x+2 y=47$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65448", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "If the chord $y=m x+1$ of the circle $x^2+y^2=1$ subtends an angle of measure $45^0$ at the major segment of the circle then value of $m$ is", "image": null}, "options": [{"id": "cbsFn", "text": "\n$2 \\pm \\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "Rz8hu", "text": "\n$-2 \\pm \\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "UYt3v", "text": "\n$-1 \\pm \\sqrt{2}$\n", "image": null, "isCorrect": true}, {"id": "ZHBde", "text": "\nnone of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of circles $x^2+y^2=1=(1)^2$\n$$\n\\begin{aligned}\n& \\Rightarrow x^2+y^2=(y-m x)^2 \\Rightarrow x^2=m^2 x^2-2 m x y \\Rightarrow x^2\\left(1-m^2\\right)+2 m x y=0 \\\\\n& \\tan 45=\\pm \\frac{2 \\sqrt{m^2-0}}{1-m^2}=\\frac{\\pm 2 m}{1-m^2} \\Rightarrow 1-m^2=\\pm 2 m \\Rightarrow m^2 \\pm 2 m-1=0 \\\\\n& \\Rightarrow m=\\frac{-2 \\pm \\sqrt{4+4}}{2}=\\frac{-2 \\pm 2 \\sqrt{2}}{2}=-1 \\pm \\sqrt{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "648b5a73417cc3fb48d69353", "title": "Tangent to circle", "totalQuestions": 21, "questions": [{"_id": "648b5a71417cc3fb48d686ea", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}], "question": {"text": "Let the centre of a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi></math> &nbsp;and its radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>&#160;</mo><mo>&#60;</mo><mo>&#160;</mo><mn>8</mn></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>24</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>&#8211;</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>32</mn></math> be two tangents and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>1</mn></math> be a normal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>. Then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>&#945;</mi><mo>&#160;</mo><mo>-</mo><mi>&#946;</mi><mo>+</mo><mi>r</mi><mo>)</mo></math> is equal to", "image": null}, "options": [{"id": "OBl7s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math>", "image": null, "isCorrect": true}, {"id": "tXxt1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "izA4M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "CS0Ro", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p>The centre of a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi></math> &nbsp;and its radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>&#160;</mo><mo>&#60;</mo><mo>&#160;</mo><mn>8</mn></math>,</p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>24</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>&#8211;</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>32</mn></math> be two tangents</p><p>So, the distance from centre will be radius,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mn>3</mn><mi>&#945;</mi><mo>+</mo><mn>4</mn><mi>&#946;</mi><mo>-</mo><mn>24</mn></mrow><mn>5</mn></mfrac></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mn>3</mn><mi>&#945;</mi><mo>-</mo><mn>4</mn><mi>&#946;</mi><mo>-</mo><mn>32</mn></mrow><mn>5</mn></mfrac></mfenced></math></p><p>Taking&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo></math>&nbsp;sign we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mi>&#945;</mi><mo>+</mo><mn>4</mn><mi>&#946;</mi><mo>-</mo><mn>24</mn><mo>=</mo><mn>3</mn><mi>&#945;</mi><mo>-</mo><mn>4</mn><mi>&#946;</mi><mo>-</mo><mn>32</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mn>8</mn><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>8</mn><mo>&#8658;</mo><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p>And taking&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo></math>&nbsp;sign we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>&#945;</mi><mo>+</mo><mn>4</mn><mi>&#946;</mi><mo>-</mo><mn>24</mn><mo>=</mo><mo>-</mo><mn>3</mn><mi>&#945;</mi><mo>+</mo><mn>4</mn><mi>&#946;</mi><mo>+</mo><mn>32</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mi>&#945;</mi><mo>=</mo><mn>56</mn><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mn>56</mn><mn>6</mn></mfrac></math></p><p>And <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>1</mn></math> be a normal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi></mrow></mfenced></math>&nbsp;lies on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><mi>&#945;</mi><mo>+</mo><mn>3</mn><mi>&#946;</mi><mo>=</mo><mn>1</mn></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>1</mn></math>&nbsp;when&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mfenced><mrow><mn>1</mn><mo>-</mo><mn>4</mn><mo>&#215;</mo><mfrac><mn>28</mn><mn>3</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mo>-</mo><mn>109</mn></mrow><mn>9</mn></mfrac><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo><mtext>if</mtext><mo>&#160;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mn>28</mn><mn>3</mn></mfrac></math></p><p>Hence, radius will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mn>3</mn><mo>-</mo><mn>4</mn><mo>-</mo><mn>24</mn></mrow><mn>5</mn></mfrac></mfenced><mo>=</mo><mn>5</mn><mo>&#60;</mo><mn>8</mn></math>&nbsp;if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p>And if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mfrac><mn>28</mn><mn>3</mn></mfrac><mo>,</mo><mfrac><mrow><mo>-</mo><mn>109</mn></mrow><mn>9</mn></mfrac></mrow></mfenced></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>&#62;</mo><mn>8</mn></math>, so neglected.</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>r</mi><mo>=</mo><mn>5</mn><mo>,</mo><mo>&#160;</mo><mi>&#945;</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi><mo>+</mo><mi>r</mi><mo>=</mo><mn>7</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "c67069fb951c49f497ab668f51cbbaaf", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Mqspd8trLlzuY.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Mqspd8trLlzuY.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557bc54d43b5ec151ee547c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}], "question": {"text": "Consider ellipses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>k</mi></msub><mo>:</mo><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>,</mo><mi>k</mi><mo>=</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mo>&#8230;</mo><mo>,</mo><mn>20</mn></math>.&nbsp;Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>k</mi></msub></math> be the circle which touches the four chords joining the end points (one on minor axis and another on major axis) of the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>k</mi></msub></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi>k</mi></msub></math> is the radius of the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>k</mi></msub></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munderover><mo>&#8721;</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mn>20</mn></munderover><mfrac><mn>1</mn><msubsup><mi>r</mi><mi>k</mi><mn>2</mn></msubsup></mfrac></math> is", "image": null}, "options": [{"id": "JrmbE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3080</mn></math>", "image": null, "isCorrect": true}, {"id": "qhprm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2870</mn></math>", "image": null, "isCorrect": false}, {"id": "DgaV9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3210</mn></math>", "image": null, "isCorrect": false}, {"id": "ojijJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3320</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>k</mi></msub><mo>:</mo><mo>&#160;</mo><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>E</mi><mi>k</mi></msub><mo>&#160;</mo><mo>:</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mfenced><mfrac><mn>1</mn><msqrt><mi>k</mi></msqrt></mfrac></mfenced><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mfenced><mfrac><mn>1</mn><mi>k</mi></mfrac></mfenced><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math></p><p>Now equation of the chord joining&nbsp;the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>1</mn><msqrt><mi>k</mi></msqrt></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mfrac><mn>1</mn><mi>k</mi></mfrac></mrow></mfenced></math>& mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>On rolling the given circle upward&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;units&nbsp;on&nbsp;the tangent&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced></math>, centre of the circle also moving&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;unit upward, so</p><p>&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/da7125cf-001c-4292-b4e7-6b03575f1bc6-9896227.png\" style=\"width: 500px; height: 446px;\" /></p><p>&nbsp;</p><p>Centre of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mn>2</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>,</mo><mn>3</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mn>2</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>,</mo><mn>3</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></math></p><p>Centre of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mrow><mn>4</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>,</mo><mn>1</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mfenced><mrow><mn>2</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>,</mo><mn>0</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mfenced><mrow><mn>4</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>,</mo><mn>0</mn></mrow></mfenced></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></mat i>C</mi><mn>2</mn></msub></math>&nbsp;be the circle with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi></math>&nbsp;as a diameter. If the tangent to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math>&nbsp;at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> meets the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mi>A</mi><mo>:</mo><mo>&#160;</mo><mi>A</mi><mi>P</mi></math> is equal to", "image": null}, "options": [{"id": "ZVt9a", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>4</mn></math>", "isCorrect": true, "image": null}, {"id": "mP8eA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>5</mn></math>", "isCorrect": false, "image": null}, {"id": "819Q5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>5</mn></math>", "isCorrect": false, "image": null}, {"id": "LVZo2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>3</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>The centre of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub></math>&nbsp;will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>&nbsp;and radius is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math></p><p>So, the equation of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>x</mi><mo>=</mo><mn>0</mn></math></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&theta;</mi></math>&nbsp;be the angle made by the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>2</mn><mi>x</mi></math>&nbsp;with positive&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis.</p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&theta;</mi><mo>=</mo><mn>2</mn></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/80adf6e8-3679-4afc-ae7a-6d8079ff449e-image.png\" style=\"width: 304px; height: 250px;\" /></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math>&nbsp;is a circle with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi></math>&nbsp;as diameter.</p><p>So, tangent at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math>&nbsp;is perpendicular to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi></math></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi><mo>=</mo><mi>l</mi></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e32626e3-1d1f-4c3f-af97-244f97b5c629-image.png\" style=\"width: 281px; height: 200px;\" />​​​​​​​</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&there4;</mo><mo>&nbsp;</mo><mfrac><mrow><mi>Q</mi><mi>A</mi></mrow><mrow><mi>A</mi><mi>P</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>l</mi><mi>cot</mi><mi>&theta;</mi></mrow><mrow><mi>l</mi><mi>tan</mi><mi>&theta;</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&rArr;</mo><mfrac><mrow><mi>Q</mi><mi>A</mi></mrow><mrow><mi>A</mi><mi>P</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>tan</mi><mn>2</mn></msup><mi>&theta;</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "42fa36027139448bb7e56f5116de5f50", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/IdmLll8YT56Uo.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/IdmLll8YT56Uo.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67898", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "If the circles&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>8</mn><mi>y</mi><mo>+</mo><mn>16</mn><mo>=</mo><mn>0</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mfenced><mrow><mn>3</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mi>x</mi><mo>+</mo><mn>2</mn><mfenced><mrow><mn>4</mn><mo>-</mo><msqrt><mn>6</mn></msqrt></mrow></mfenced><mi>y</mi><mo>=</mo><mi>k</mi><mo>+</mo><mn>6</mn><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>8</mn><msqrt><mn>6</mn></msqrt></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>&#62;</mo><mn>0</mn></math>, touch internally at the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced></math>, then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>&#945;</mi><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>&#946;</mi><mo>+</mo><msqrt><mn>6</mn></msqrt></mrow></mfenced><mn>2</mn></msup></math>&nbsp;is equal to _______.", "image": null}, "options": [], "correctValue": "25", "solution": {"text": "<blockquote><p>The circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>8</mn><mi>y</mi><mo>+</mo><mn>16</mn><mo>=</mo><mn>0</mn></math>&nbsp;has centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math>&nbsp;and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>9</mn><mo>+</mo><mn>16</mn><mo>-</mo><mn>16</mn></msqrt><mo>=</mo><mn>3</mn></math>&nbsp;units.</p><p>The circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mfenced><mrow><mn>3</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mi>x</mi><mo>+</mo><mn>2</mn><mfenced><mrow><mn>4</mn><mo>-</mo><msqrt><mn>6</mn></msqrt></mrow></mfenced><mi>y</mi><mo>=</mo></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>+</mo><mn>6</mn><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>8</mn><msqrt><mn>6</mn></msqrt><mo>,</mo><mi>k</mi><mo>&#62;</mo><mn>0</mn></math>&nbsp;has centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>3</mn><mo>,</mo><msqrt><mn>6</mn></msqrt><mo>-</mo><mn>4</mn></mrow></mfenced></math>&nbsp;and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>3</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><msqrt><mn>6</mn></msqrt><mo>-</mo><mn>4</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mi>k</mi><mo>+</mo><mn>6</mn><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>8</mn><msqrt><mn>6</mn></msqrt></msqrt><mo>=</mo><msqrt><mi>k</mi><mo>+</mo><mn>34</mn></msqrt></math></p><p>Given that these two circles touch internally, so</p><p>distance between their centres<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced close=\"|\" open=\"|\"><mtext>difference&#160;of&#160;radii</mtext></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn><mo>+</mo><mn>6</mn></msqrt><mo>=</mo><mfenced close=\"|\" open=\"|\"><mrow><msqrt><mi>k</mi><mo>+</mo><mn>34</mn></msqrt><mo>-</mo><mn>3</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msqrt><mi>k</mi><mo>+</mo><mn>34</mn></msqrt><mo>-</mo><mn>3</mn><mo>=</mo><mo>&#177;</mo><mn>3</mn></math></p><p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>2</mn></math>&nbsp;is only possible value&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#8757;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>k</mi><mo>&#62;</mo><mn>0</mn></mrow></mfenced></math></p><p>Now the equation of common tangent to both the circles is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>+</mo><mn>2</mn><msqrt><mn>6</mn></msqrt><mi>y</mi><mo>+</mo><mn>16</mn><mo>+</mo><mi>k</mi><mo>+</mo><mn>6</mn><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>8</mn><msqrt><mn>6</mn></msqrt><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>k</mi><mo>=</mo><mn>2</mn></math>&nbsp;then equation becomes&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><msqrt><mn>2</mn></msqrt><mi>y</mi><mo>+</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>3</mn><mo>+</mo><mn>4</mn><msqrt><mn>2</mn></msqrt><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8943;</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced></math>&nbsp;are foot of perpendicular from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math>&nbsp;to this common tangent, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#945;</mi><mo>+</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>&#946;</mi><mo>+</mo><mn>4</mn></mrow><msqrt><mn>2</mn></msqrt></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mfenced><mrow><mo>-</mo><mn>3</mn><mo>-</mo><mn>4</mn><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>3</mn><mo>+</mo><mn>4</mn><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow></mfenced></mrow><mrow><mn>1</mn><mo>+</mo><mn>2</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>&#945;</mi><mo>+</mo><mn>3</mn><mo>=</mo><mo>-</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfrac><mrow><mi>&#946;</mi><mo>+</mo><mn>4</mn></mrow><msqrt><mn>2</mn></msqrt></mfrac><mo>=</mo><mo>-</mo><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mrow><mi>&#945;</mi><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>9</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>&#946;</mi><mo>+</mo><msqrt><mn>6</mn></msqrt></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>16</mn></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>&#945;</mi><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>&#946;</mi><mo>+</mo><msqrt><mn>6</mn></msqrt></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>25</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "96180393a6c047988a4a139e900aff5f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/YYoWXoTiHk6c3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/YYoWXoTiHk6c3.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67d2c", "previousYearPapers": [{"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "Let the lines <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mn>2</mn><mi>x</mi><mo>=</mo><msqrt><mn>11</mn></msqrt><mo>+</mo><mn>7</mn><msqrt><mn>7</mn></msqrt></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>y</mi><mo>+</mo><mi>x</mi><mo>=</mo><mn>2</mn><msqrt><mn>11</mn></msqrt><mo>+</mo><mn>6</mn><msqrt><mn>7</mn></msqrt></math>&nbsp;be normal to a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>:</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mi>h</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mi>k</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math>. If the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>11</mn></msqrt><mi>y</mi><mo>-</mo><mn>3</mn><mi>x</mi><mo>=</mo><mfrac><mrow><mn>5</mn><msqrt><mn>77</mn></msqrt></mrow><mn>3</mn></mfrac><mo>+</mo><mn>11</mn></math>&nbsp;is tangent to the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>5</mn><mi>h</mi><mo>-</mo><mn>8</mn><mi>k</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mn>5</mn><msup><mi>r</mi><mn>2</mn></msup></math>&nbsp;is equal to ______.", "image": null}, "options": [], "correctValue": "816", "solution": {"text": "<p>Equations of normal are</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mn>2</mn><mi>x</mi><mo>=</mo><msqrt><mn>11</mn></msqrt><mo>+</mo><mn>7</mn><msqrt><mn>7</mn></msqrt><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>y</mi><mo>+</mo><mi>x</mi><mo>=</mo><mn>2</mn><msqrt><mn>11</mn></msqrt><mo>+</mo><mn>6</mn><msqrt><mn>7</mn></msqrt><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>Now the center of the circle is point of intersection of the normals i.e. solving&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math>, we get the point of intersection as&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mrow><mn>8</mn><msqrt><mn>7</mn></msqrt></mrow><mn>3</mn></mfrac><mo>,</mo><msqrt><mn>11</mn></msqrt><mo>+</mo><mfrac><mrow><mn>5</mn><msqrt><mn>7</mn></msqrt></mrow><mn>3</mn></mfrac></mrow></mfenced><mo>&#8801;</mo><mfenced><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math></p><p>The equation of tangent is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>11</mn></msqrt><mi>y</mi><mo>-</mo><mn>3</mn><mi>x</mi><mo>=</mo><mfrac><mrow><mn>5</mn><msqrt><mn>77</mn></msqrt></mrow><mn>3</mn></mfrac><mo>+</mo><mn>11</mn></math></p><p>The radius will be perpendicular&nbsp;distance of tangent from center</p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfrac><mfenced close=\"|\" open=\"|\"><mrow><msqrt><mn>11</mn></msqrt><mstyle displaystyle=\"true\"><mfrac><mrow><mn>8</mn><msqrt><mn>7</mn></msqrt></mrow><mn>3</mn></mfrac></mstyle><mo>-</mo><mn>3</mn><mfenced><mrow><msqrt><mn>11</mn></msqrt><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mrow><mn>5</mn><msqrt><mn>7</mn></msqrt></mrow><mn>3</mn></mfrac></mstyle></mrow></mfenced><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mrow><mn>5</mn><msqrt><mn>77</mn></msqrt></mrow><mn>3</mn></mfrac></mstyle><mo>-</mo><mn>11</mn></mrow></mfenced><msqrt><mn>11</mn><mo>+</mo><mn>9</mn></msqrt></mfrac><mo>=</mo><mn>4</mn><mroot><mfrac><mn>7</mn><mn>5</mn></mfrac><mrow></mrow></mroot></math></p><p>Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>5</mn><mi>h</mi><mo>-</mo><mn>8</mn><mi>k</mi></mrow></mfenced><mn>2</m
