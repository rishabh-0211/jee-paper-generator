msqrt></math>", "image": null, "isCorrect": false}, {"id": "suSAb", "text": "<math><mn>2</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The equation of a tangent to the given circle at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mfenced><mn>2</mn></mfenced><mo>+</mo><mi>y</mi><mfenced><mn>2</mn></mfenced><mo>+</mo><mfenced><mrow><mi>x</mi><mo>+2</mo></mrow></mfenced><mo>&#8722;2</mo><mfenced><mrow><mi>y</mi><mo>+2</mo></mrow></mfenced><mo>&#8722;4=0&#8658;3</mo><mi>x</mi><mo>&#8722;6=0&#8658;</mo><mi>x</mi><mo>=2</mo></math></p><p>Family of the circle touching a given line at a given point</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:m=\"http://schemas.openxmlformats.org/officeDocument/2006/math\" xmlns:mml=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mi>&#955;</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math>.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mfenced><mrow><mi>&#955;</mi><mo>&#8722;</mo><mn>4</mn></mrow></mfenced><mi>x</mi><mo>&#8722;</mo><mn>4</mn><mi>y</mi><mo>+</mo><mfenced><mrow><mn>8</mn><mo>&#8722;</mo><mn>2</mn><mi>&#955;</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math><br /><br />Radius<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>=</mo><msqrt><msup><mfenced><mfrac><mrow><mi>&#955;</mi><mo>&#8722;</mo><mn>4</mn></mrow><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mn>4< o>&#8289;</mo><mrow><mi>&#952;&#8203;</mi></mrow></mrow><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;&#8203;</mi></mrow></mrow></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>Maximum value of <math><msup><mrow><mfenced separators=\"|\"><mrow><mi>P</mi><mi>Q</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>14</mn><mo>+</mo><mn>5</mn><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt><mfenced separators=\"|\"><mrow><msqrt><mn>2</mn></msqrt></mrow></mfenced></math><br /><br /><math><mo>=</mo><mn>14</mn><mo>+</mo><mn>5</mn><msqrt><mn>3</mn></msqrt></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65cf4", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}], "question": {"text": "Statement 1: The only circle having radius $\\sqrt{10}$ and a diameter along line $2 x+y=5$ is $x^2+y^2-6 x$ $+2 y=0$.\nStatement $2: 2 x+y=5$ is a normal to the circle $x^2+y^2-6 x+2 y=0$.", "image": null}, "options": [{"id": "exJ6q", "text": "\nStatement 1 is false; Statement 2 is true.\n", "image": null, "isCorrect": true}, {"id": "fmJQs", "text": "\n Statement 1 is true; Statement 2 is true, Statement 2 is a correct explanation for Statement 1.\n", "image": null, "isCorrect": false}, {"id": "vkGG9", "text": "\nStatement 1 is true; Statement 2 is false.\n", "image": null, "isCorrect": false}, {"id": "dHOE2", "text": "\n Statement 1 is true; Statement 2 is true; Statement 2 is not a correct explanation for Statement 1.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Circle: $x^2+y^2-6 x+2 y=0$\nLine: $2 x+y=5$\nCentre $=(3,-1)$\nNow, $2 \\times 3-1=5$, hence centre lies on the given line. Therefore line passes through the centre. The given line is normal to the circle.\nThus statement- 2 is true, but statement- 1 is not true as there are infinite circle according to the given conditions.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a-FRXqdr-61ewPiMLq24yhU54_yox2AboTP7y-VcTBI.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65ca0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}], "question": {"text": "If the circle $x^2+y^2-6 x-8 y+\\left(25-a^2\\right)=0$ touches the axis of $x$, then a equals.", "image": null}, "options": [{"id": "reixj", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "JfyIl", "text": "\n$\\pm 4$\n", "image": null, "isCorrect": true}, {"id": "FrHEl", "text": "\n$\\pm 2$\n", "image": null, "isCorrect": false}, {"id": "UV2Ou", "text": "\n$\\pm 3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/-Oa48NLGFjlenPC8azxOogm8f2AJ8u57CfDB5qrJEmc.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n& x^2+y^2-6 x-8 y+\\left(25-a^2\\right)=0 \\\\\n& \\text { Radius }=4=\\sqrt{9+16+\\left(25-a^2\\right)} \\\\\n& \\Rightarrow \\mathrm{a}=\\pm 4\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65be9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "If each of the lines $5 x+8 y=13$ and $4 x-y=3$ contains a diameter of the circle $x^2+y^2-2\\left(a^2-7 a+11\\right)$\n$x-2\\left(a^2-6 a+6\\right) y+b^3+1=0$, then :", "image": null}, "options": [{"id": "ZSs71", "text": "\n$a=5$ and $b \\notin(-1,1)$\n", "image": null, "isCorrect": false}, {"id": "2oncg", "text": "\n$a=1$ and $b \\notin(-1,1)$\n", "image": null, "isCorrect": false}, {"id": "JZnwV", "text": "\n$\\quad a=2$ and $b \\notin(-\\infty, 1)$\n", "image": null, "isCorrect": false}, {"id": "gpJfv", "text": "\n$a=5$ and $b \\in(-\\infty, 1)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Point of intersection of two given lines is $(1,1)$. Since each of the two given lines contains a diameter of the given circle, therefore the point of intersection of the two given lines is the centre of the given circle.\nHence centre $=(1,1)$\n$$\n\\therefore a^2-7 a+11=1 \\Rightarrow a=2,5\n$$\nand $a^2-6 a+6=1 \\Rightarrow a=1,5$\nFrom both (i) and (ii), $a=5$\nNow on replacing each of $\\left(a^2-7 a+11\\right)$ and $\\left(a^2-6 a+6\\right)$ by 1 , the equation of the given circle is $x^2+y^2-2 x-2 y+b^3+1=0$\n$$\n\\begin{aligned}\n& \\Rightarrow(x-1)^2+(y-1)^2+b^3=1 \\\\\n& \\Rightarrow b^3=1-\\left[(x-1)^2+(y-1)^2\\right] \\\\\n& \\therefore b \\in(-\\infty, 1)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65861", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}], "question": {"text": "The point diametrically opposite to the point $P(1,0)$ on the circle $x^2+y^2+2 x+4 y-3=0$ is", "image": null}, "options": [{"id": "88pnd", "text": "\n$(3,-4)$\n", "image": null, "isCorrect": false}, {"id": "1rjp5", "text": "\n$(-3,4)$\n", "image": null, "isCorrect": false}, {"id": "RqCYR", "text": "\n$(-3,-4)$\n", "image": null, "isCorrect": true}, {"id": "ud0bQ", "text": "\n$(3,4)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Centre $(-1,-2)$\nLet $(\\alpha, \\beta)$ is the required point $\\frac{\\alpha+1}{2}=-1$ and $\\frac{\\beta+0}{2}=-2$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656f5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "If a circle passes through the point $(a, b)$ and cuts the circle $x^2+y^2=p^2$ orthogonally, then the equation of the locus of its centre is", "image": null}, "options": [{"id": "FMS7i", "text": "\n$x^2+y^2-3 a x-4 b y+\\left(a^2+b^2-p^2\\right)=0$\n", "image": null, "isCorrect": false}, {"id": "99Ymc", "text": "\n$2 a x+2 b y-\\left(a^2-b^2+p^2\\right)=0$\n", "image": null, "isCorrect": false}, {"id": "WlP7y", "text": "\n$x^2+y^2-2 a x-3 b y+\\left(a^2-b^2-p^2\\right)=0$\n", "image": null, "isCorrect": false}, {"id": "x1ks4", "text": "\n$2 a x+2 b y-\\left(a^2+b^2+p^2\\right)=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the centre be $(\\alpha, \\beta)$\n$\\because$ It cut the circle $\\mathrm{x}^2+\\mathrm{y}^2=\\mathrm{p}^2$ orthogonally\n$2(-\\alpha) \\times 0+2(-\\beta) \\times 0=c_1-p^2$\n$\\mathrm{c}_1=\\mathrm{p}^2$\nLet equation of circle is $x^2+y^2-2 \\alpha x-2 \\beta y+p^2=0$\nIt pass through $(a, b) \\Rightarrow a^2+b^2-2 \\alpha a-2 \\beta b+p^2=0$\nLocus $\\therefore 2 a x+2 b y-\\left(a^2+b^2+p^2\\right)=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65445", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Locus of mid point of the portion between the axes of $x \\cos \\alpha+y \\sin \\alpha=p$ where $p$ is constant is", "image": null}, "options": [{"id": "7IsoR", "text": "\n$x^2+y^2=\\frac{4}{p^2}$\n", "image": null, "isCorrect": false}, {"id": "iQCXr", "text": "\n$x^2+y^2=4 p^2$\n", "image": null, "isCorrect": false}, {"id": "GA0nO", "text": "\n$\\frac{1}{x^2}+\\frac{1}{y^2}=\\frac{2}{p^2}$\n", "image": null, "isCorrect": false}, {"id": "zS3Qw", "text": "\n$\\frac{1}{x^2}+\\frac{1}{y^2}=\\frac{4}{p^2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/jNziehr4Ez8wFpj7autoctfRaLZr6BS6f0_5W4WRe3s.original.fullsize.png\"><br>\nEquation of $A B$ is $x \\cos \\alpha+y \\sin \\alpha=p \\Rightarrow \\frac{x \\cos \\alpha}{p}+\\frac{y \\sin \\alpha}{p}=1 \\Rightarrow \\frac{x}{p / \\cos \\alpha}+\\frac{y}{p / \\sin \\alpha}=1$\nSo co-ordinates of $A$ and $B$ are $\\left(\\frac{p}{\\cos \\alpha}, 0\\right)$ and $\\left(0, \\frac{p}{\\sin \\alpha}\\right)$; So coordinates of mid point of $A B$ are\n$\\left(\\frac{p}{2 \\cos \\alpha}, \\frac{p}{2 \\sin \\alpha}\\right)=\\left(x_1, y_1\\right)($ let $) ; x_1=\\frac{p}{2 \\cos \\alpha} \\& y_1=\\frac{p}{2 \\sin \\alpha}$\n$\\Rightarrow \\cos \\alpha=p / 2 x_1$ and $\\sin \\alpha=p / 2 y_1 ; \\cos ^2 \\alpha+\\sin ^2 \\alpha=1 \\Rightarrow \\frac{p^2}{4}\\left(\\frac{1}{x_1^2}+\\frac{1}{y_1^2}\\right)=1$\nLocus of $\\left(x_1, y_1\\right)$ is $\\frac{1}{x^2}+\\frac{1}{y^2}=\\frac{4}{p^2}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d69356", "title": "Equation of Circle & its intercept", "totalQuestions": 46, "questions": [{"_id": "69d8073d81239f6567c4f370", "type": "singleCorrect", "question": {"text": "Let $C$ be a circle having centre in the first quadrant and touching the $x$-axis at a distance of $3$ units from the origin. If the circle $C$ has an intercept of length $6\\sqrt{3}$ on $y$-axis, then the length of the chord of the circle $C$ on the line $x - y = 3$ is :", "image": null}, "options": [{"id": "lAIXg", "text": "$8$", "isCorrect": false, "image": null}, {"id": "0wYPn", "text": "$6$", "isCorrect": false, "image": null}, {"id": "OyBi2", "text": "$6\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "6fwML", "text": "$8\\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the centre of the circle be $(3, r)$ since it touches the $x$-axis at $(3, 0)$ and lies in the first quadrant.<br><br>The radius of the circle is $r$.<br><br>The length of the intercept on the $y$-axis is given by $2\\sqrt{r^2 - d^2}$, where $d$ is the distance of the centre from the $y$-axis.<br><br>Here, $d = 3$.<br><br>Given that the intercept on the $y$-axis is $6\\sqrt{3}$:<br><br>$2\\sqrt{r^2 - 3^2} = 6\\sqrt{3}$<br><br>$\\sqrt{r^2 - 9} = 3\\sqrt{3}$<br><br>$r^2 - 9 = 27$<br><br>$r^2 = 36 \\Rightarrow r = 6$<br><br>The centre of the circle is $(3, 6)$ and its radius is $6$.<br><br>The given line is $x - y - 3 = 0$.<br><br>The perpendicular distance $p$ from the centre $(3, 6)$ to the line is:<br><br>$p = \\dfrac{|3 - 6 - 3|}{\\sqrt{1^2 + (-1)^2}} = \\dfrac{6}{\\sqrt{2}} = 3\\sqrt{2}$<br><br>The length of the chord is $2\\sqrt{r^2 - p^2}$.<br><br>Length of the chord $= 2\\sqrt{36 - (3\\sqrt{2})^2} = 2\\sqrt{36 - 18} = 2\\sqrt{18} = 6\\sqrt{2}$<br><br>Answer: $6\\sqrt{2}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "883ad589d4724021a5cb621757c110e8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/G7Uu1HsvmVr5u.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/G7Uu1HsvmVr5u.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074b81239f6567c4f412", "type": "numerical", "question": {"text": "Let the centre of the circle $x^2 + y^2 + 2gx + 2fy + 25 = 0$ be in the first quadrant and lie on the line $2x - y = 4$. Let the area of an equilateral triangle inscribed in the circle be $27\\sqrt{3}$. Then the square of the length of the chord of the circle on the line $x = 1$ is _______.", "image": null}, "options": [], "correctValue": "80", "solution": {"text": "The equation of the circle is $x^2 + y^2 + 2gx + 2fy + 25 = 0$.<br><br>The centre of the circle is $(-g, -f)$. Since it lies in the first quadrant, $-g > 0$ and $-f > 0$, which implies $g < 0$ and $f < 0$.<br><br>The centre lies on the line $2x - y = 4$, so:<br><br>$-2g - (-f) = 4 \\Rightarrow f = 2g + 4$<br><br>Let the radius of the circle be $R$. The side length $a$ of an equilateral triangle inscribed in the circle is $a = \\sqrt{3}R$.<br><br>The area of the equilateral triangle is given as $27\\sqrt{3}$:<br><br>$\\dfrac{\\sqrt{3}}{4}a^2 = 27\\sqrt{3} \\Rightarrow \\dfrac{\\sqrt{3}}{4}(3R^2) = 27\\sqrt{3} \\Rightarrow R^2 = 36$<br><br>The radius of the circle is also given by $R^2 = g^2 + f^2 - c$. Here $c = 25$, so:<br><br>$g^2 + f^2 - 25 = 36 \\Rightarrow g^2 + f^2 = 61$<br><br>Substituting $f = 2g + 4$ into the equation:<br><br>$g^2 + (2g + 4)^2 = 61$<br><br>$5g^2 + 16g - 45 = 0$<br><br>$(5g - 9)(g + 5) = 0$<br><br>Since $g < 0$, we get $g = -5$.<br><br>Then, $f = 2(-5) + 4 = -6$.<br><br>The centre of the circle is $(5, 6)$ and its radius is $R = 6$.<br><br>The distance $d$ from the centre $(5, 6)$ to the line $x = 1$ is:<br><br>$d = |5 - 1| = 4$<br><br>The length of the chord $L$ on the line $x = 1$ is given by:<br><br>$L = 2\\sqrt{R^2 - d^2} = 2\\sqrt{36 - 16} = 2\\sqrt{20}$<br><br>The square of the length of the chord is:<br><br>$L^2 = (2\\sqrt{20})^2 = 4 \\times 20 = 80$<br><br>Answer: $80$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "7b6adbd1dd2b446b850a76e23d3fdc22", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/vO8FpXSNzS6bP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/vO8FpXSNzS6bP.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075181239f6567c4f454", "type": "singleCorrect", "question": {"text": "Suppose that two chords, drawn from the point $(1, 2)$ on the circle $x^2 + y^2 + x - 3y = 0$ are bisected by the $y$-axis. If the other ends of these chords are $R$ and $S$, and the mid point of the line segment $RS$ is $(\\alpha, \\beta)$, then $6(\\alpha + \\beta)$ is equal to:", "image": null}, "options": [{"id": "r6IAs", "text": "$1$", "isCorrect": false, "image": null}, {"id": "513jT", "text": "$3$", "isCorrect": true, "image": null}, {"id": "KtsNW", "text": "$4$", "isCorrect": false, "image": null}, {"id": "wyMhH", "text": "$6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the other end of the chord be $(x_1, y_1)$.<br><br>Since the chord is bisected by the $y$-axis, the midpoint of the chord lies on the $y$-axis.<br><br>The midpoint of the chord joining $(1, 2)$ and $(x_1, y_1)$ is $\\left(\\dfrac{x_1 + 1}{2}, \\dfrac{y_1 + 2}{2}\\right)$.<br><br>Since it lies on the $y$-axis, its $x$-coordinate must be zero:<br><br>$\\dfrac{x_1 + 1}{2} = 0 \\Rightarrow x_1 = -1$<br><br>Since the point $(x_1, y_1)$ lies on the given circle $x^2 + y^2 + x - 3y = 0$, we substitute $x_1 = -1$ into the equation:<br><br>$(-1)^2 + y_1^2 + (-1) - 3y_1 = 0$<br><br>$1 + y_1^2 - 1 - 3y_1 = 0$<br><br>$y_1^2 - 3y_1 = 0$<br><br>$y_1(y_1 - 3) = 0 \\Rightarrow y_1 = 0$ or $y_1 = 3$<br><br>Thus, the other ends of the two chords are $R(-1, 0)$ and $S(-1, 3)$.<br><br>The midpoint of the line segment $RS$ is given as $(\\alpha, \\beta)$.<br><br>$\\alpha = \\dfrac{-1 + (-1)}{2} = -1$<br><br>$\\beta = \\dfrac{0 + 3}{2} = \\dfrac{3}{2}$<br><br>We need to find the value of $6(\\alpha + \\beta)$:<br><br>$6(\\alpha + \\beta) = 6\\left(-1 + \\dfrac{3}{2}\\right) = 6\\left(\\dfrac{1}{2}\\right) = 3$<br><br>Answer: $3$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "6a7b119462e54db19029f73237482276", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/VojmyNDygIO9H.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/VojmyNDygIO9H.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8072a81239f6567c4f28f", "type": "singleCorrect", "question": {"text": "Let a circle pass through the origin and its centre be the point of intersection of two mutually perpendicular lines $x + (k-1)y + 3 = 0$ and $2x + k^2 y - 4 = 0$. If the line $x - y + 2 = 0$ intersects the circle at the points A and B, then $(AB)^2$ is equal to:", "image": null}, "options": [{"id": "HhB4D", "text": "$10$", "isCorrect": false, "image": null}, {"id": "7Sw01", "text": "$27$", "isCorrect": false, "image": null}, {"id": "tki5m", "text": "$18$", "isCorrect": true, "image": null}, {"id": "0yBlX", "text": "$34$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given lines are $x + (k-1)y + 3 = 0$ and $2x + k^2 y - 4 = 0$.<br><br>Since they are mutually perpendicular, the product of their slopes is $-1$:<br><br>$\\left(\\dfrac{-1}{k-1}\\right) \\left(\\dfrac{-2}{k^2}\\right) = -1$<br><br>$\\dfrac{2}{k^2(k-1)} = -1 \\Rightarrow k^3 - k^2 + 2 = 0$<br><br>By trial, $k = -1$ is a root. Factoring gives $(k+1)(k^2 - 2k + 2) = 0$. Since $k^2 - 2k + 2 = 0$ has no real roots, $k = -1$.<br><br>Substituting $k = -1$ into the equations of the lines, we get:<br><br>$x - 2y + 3 = 0$<br><br>$2x + y - 4 = 0$<br><br>Solving these two equations, we get the point of intersection as $x = 1$ and $y = 2$. Thus, the centre of the circle is $C(1, 2)$.<br><br>Since the circle passes through the origin $(0,0)$, the square of its radius $R$ is:<br><br>$R^2 = (1 - 0)^2 + (2 - 0)^2 = 5$<br><br>The perpendicular distance $d$ from the centre $C(1, 2)$ to the line $x - y + 2 = 0$ is:<br><br>$d = \\dfrac{|1 - 2 + 2|}{\\sqrt{1^2 + (-1)^2}} = \\dfrac{1}{\\sqrt{2}}$<br><br>The length of the chord $AB$ is given by $2\\sqrt{R^2 - d^2}$. Therefore, its square is:<br><br>$(AB)^2 = 4(R^2 - d^2) = 4\\left(5 - \\dfrac{1}{2}\\right) = 4 \\times \\dfrac{9}{2} = 18$<br><br>Answer: $18$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "df0860da97e143879e7118d84629df5d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/mca6nvN9XbRFD.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/mca6nvN9XbRFD.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075881239f6567c4f4aa", "type": "numerical", "question": {"text": "Let a circle $C$ have its centre in the first quadrant, intersect the coordinate axes at exactly three points and cut off equal intercepts from the coordinate axes. If the length of the chord of $C$ on the line $x + y = 1$ is $\\sqrt{14}$, then the square of the radius of $C$ is _______.", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "Let the equation of the circle be $x^2 + y^2 + 2gx + 2fy + c = 0$.<br><br>Since the circle intersects the coordinate axes at exactly three points, it must pass through the origin and intersect each axis at one other distinct point. Thus, $c = 0$.<br><br>The lengths of the intercepts on the x-axis and y-axis are $2\\sqrt{g^2 - c} = 2|g|$ and $2\\sqrt{f^2 - c} = 2|f|$.<br><br>Given that the intercepts are equal, we have $|g| = |f|$.<br><br>The centre of the circle is $(-g, -f)$. Since it lies in the first quadrant, $-g > 0$ and $-f > 0$. Therefore, $g = f = -a$ for some $a > 0$.<br><br>The centre is $(a, a)$ and the radius is $r = \\sqrt{a^2 + a^2} = a\\sqrt{2}$.<br><br>The distance $d$ from the centre $(a, a)$ to the line $x + y - 1 = 0$ is given by:<br><br>$d = \\dfrac{|a + a - 1|}{\\sqrt{1^2 + 1^2}} = \\dfrac{|2a - 1|}{\\sqrt{2}}$<br><br>The length of the chord on the given line is $2\\sqrt{r^2 - d^2} = \\sqrt{14}$.<br><br>Squaring both sides, we get:<br><br>$4(r^2 - d^2) = 14 \\Rightarrow r^2 - d^2 = \\dfrac{7}{2}$<br><br>Substituting $r^2 = 2a^2$ and $d^2 = \\dfrac{(2a - 1)^2}{2}$:<br><br>$2a^2 - \\dfrac{(2a - 1)^2}{2} = \\dfrac{7}{2}$<br><br>$4a^2 - (4a^2 - 4a + 1) = 7$<br><br>$4a - 1 = 7 \\Rightarrow 4a = 8 \\Rightarrow a = 2$<br><br>The square of the radius of the circle is $r^2 = 2a^2 = 2(2)^2 = 8$.<br><br>Answer: $8$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "b07d541cb8774b41be92936f1cfebf6b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/F1jAkraemNv97.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/F1jAkraemNv97.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1b08bfdbb24356397dd", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let the circle $x^{2}+y^{2}=4$ intersect $x$-axis at the points $\\mathrm{A}(\\mathrm{a}, 0), \\mathrm{a}>0$ and $\\mathrm{B}(\\mathrm{b}, 0)$. Let $\\mathrm{P}(2 \\cos \\alpha, 2 \\sin \\alpha)$, $0<\\alpha<\\frac{\\pi}{2}$ and $\\mathrm{Q}(2 \\cos \\beta, 2 \\sin \\beta)$ be two points such that $(\\alpha-\\beta)=\\frac{\\pi}{2}$. Then the point of intersection of AQ and BP lies on :", "image": null}, "options": [{"id": "0OOiN", "text": "$x^{2}+y^{2}-4 y-4=0$", "isCorrect": true, "image": null}, {"id": "RSRSX", "text": "$x^{2}+y^{2}-4 x-4 y=0$", "isCorrect": false, "image": null}, {"id": "Dz46d", "text": "$x^{2}+y^{2}-4 x-4=0$", "isCorrect": false, "image": null}, {"id": "pTU8R", "text": "$x^{2}+y^{2}-4 x-4 y-4=0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let point of intersection $R(h,k)$<br>$m_{BR} = m_{BP} \\Rightarrow \\dfrac{k}{h+2} = \\dfrac{2\\sin\\alpha}{2\\cos\\alpha + 2} \\Rightarrow \\dfrac{k}{h+2} = \\tan\\dfrac{\\alpha}{2}$<br>$m_{AR} = m_{AQ} \\Rightarrow \\dfrac{k}{h-2} = \\dfrac{2\\sin\\beta}{2\\cos\\beta - 2} = \\dfrac{\\sin\\beta}{\\cos\\beta - 1} = -\\cot\\dfrac{\\beta}{2}$<br>$\\dfrac{\\alpha}{2} - \\dfrac{\\beta}{2} = \\dfrac{\\pi}{4}$<br>$\\tan\\left(\\dfrac{\\alpha}{2} - \\dfrac{\\beta}{2}\\right) = \\tan\\dfrac{\\pi}{4} = 1$<br>$\\dfrac{\\tan\\dfrac{\\alpha}{2} - \\tan\\dfrac{\\beta}{2}}{1 + \\tan\\dfrac{\\alpha}{2} \\tan\\dfrac{\\beta}{2}} = 1$<br>$\\dfrac{\\dfrac{k}{h+2} + \\dfrac{h-2}{k}}{1 + \\left(\\dfrac{k}{h+2}\\right)\\left(\\dfrac{2-h}{k}\\right)} = 1 \\Rightarrow \\dfrac{k^2 + h^2 - 4}{\\dfrac{k(h+2)}{\\dfrac{4}{h+2}}} = 1$<br>$\\dfrac{h^2 + k^2 - 4}{4k} = 1$<br>$x^2 + y^2 - 4y - 4 = 0$", "image": null}, "videoSolution": {"videoId": "87d8a00ddd7f47c480b4809a14deaa47", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Znwwa9mdCmMOy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Znwwa9mdCmMOy.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19e8bfdbb24356396fd", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $\\mathrm{S}=\\left\\{z \\in \\mathbb{C}:\\left|\\frac{z-6 i}{z-2 i}\\right|=1\\right.$ and $\\left.\\left|\\frac{z-8+2 i}{z+2 i}\\right|=\\frac{3}{5}\\right\\}$. <br> Then $\\sum_{z \\in \\mathrm{~s}}|z|^{2}$ is equal to", "image": null}, "options": [{"id": "5cVcL", "text": "385", "isCorrect": true, "image": null}, {"id": "wUmKB", "text": "398", "isCorrect": false, "image": null}, {"id": "tBBXL", "text": "413", "isCorrect": false, "image": null}, {"id": "eu33P", "text": "423", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Solving $\\left| \\dfrac{z - 6i}{z - 2i} \\right| = 1 \\Rightarrow y = 4$ .....(1)<br>(where $z = x + iy$)<br>Now solving $\\left| \\dfrac{z - 8 + 2i}{z + 2i} \\right| = \\dfrac{3}{5}$<br>$\\Rightarrow x^2 + y^2 - 25x + 4y + 104 = 0$ .....(2)<br>Solving (1) & (2) $\\Rightarrow z = 17 + 4i$ & $8 + 4i$<br>$\\Rightarrow \\sum |z|^2 = (17)^2 + (4)^2 + (8)^2 + (4)^2 = 385$", "image": null}, "videoSolution": {"videoId": "a16fdc3f19bc49e0bdcc8d13b3ef1b69", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/6bVm5YQHH9HDX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/6bVm5YQHH9HDX.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1818bfdbb2435639591", "type": "numerical", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "If P is a point on the circle $x^{2}+y^{2}=4, \\mathrm{Q}$ is a point on the straight line $5 x+y+2=0$ and $x-y+1=0$ is the perpendicular bisector of PQ, then 13 times the sum of abscissa of all such points P is $\\_\\_\\_\\_$.", "image": null}, "options": [], "correctValue": 2, "solution": {"text": "<img style=\"width:300px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/21S2_s_21_1.png\"><br>Mid point of PQ lies on $x - y + 1 = 0$<br>$\\dfrac{2\\cos\\theta + \\alpha}{2} - \\dfrac{2\\sin\\theta - 5\\alpha - 2}{2} + 1 = 0$<br>$2\\cos\\theta + \\alpha - 2\\sin\\theta + 5\\alpha + 2 + 2 = 0$<br>$\\cos\\theta - \\sin\\theta + 3\\alpha + 2 = 0$ ...(1)<br>$\\because$ Slope of PQ is $-1$<br>$\\dfrac{2\\sin\\theta + 5\\alpha + 2}{2\\cos\\theta - \\alpha} = -1$<br>$2\\sin\\theta + 5\\alpha + 2 = -2\\cos\\theta + \\alpha$<br>$\\sin\\theta + \\cos\\theta + 2\\alpha + 1 = 0$ ...(2)<br>eliminate $\\alpha$ from (1) and (2)<br>$\\Rightarrow \\cos\\theta + 5\\sin\\theta = 1$ , $\\theta \\in [0, 2\\pi]$<br>$\\Rightarrow 5 \\times 2\\sin\\dfrac{\\theta}{2}\\cos\\dfrac{\\theta}{2} = 2\\sin^2\\dfrac{\\theta}{2}$<br>$\\therefore \\sin\\dfrac{\\theta}{2} = 0 \\Rightarrow \\cos\\theta = 1$<br>or<br>$\\sin\\dfrac{\\theta}{2} = 5 \\Rightarrow \\cos\\theta = -\\dfrac{12}{13}$<br>Sum of all possible values of abscissa of point P is<br>$= 2 \\times 1 + 2\\left(\\dfrac{-12}{13}\\right) = \\dfrac{2}{13}$<br>$\\therefore$ 13 times sum of all possible values of abscissa of point P is 2.", "image": null}, "videoSolution": {"videoId": "90c55b39abbf4f17bc82a98ab96eaa14", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/TV7hvdl0XiIbT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/TV7hvdl0XiIbT.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c777c09d044e4c1a21e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}], "question": {"text": "Let $C_1$ be the circle in the third quadrant of radius 3 , that touches both coordinate axes. Let $\\mathrm{C}_2$ be the circle with centre $(1,3)$ that touches $\\mathrm{C}_1$ externally at the point $(\\alpha, \\beta)$. If $(\\beta-\\alpha)^2=\\frac{m}{n}, \\operatorname{gcd}(m, n)=1$, then $m+n$ is equal to :", "image": null}, "options": [{"id": "M4Z1L", "text": "9", "image": null, "isCorrect": false}, {"id": "0Bhyg", "text": "13", "image": null, "isCorrect": false}, {"id": "tk6BO", "text": "22", "image": null, "isCorrect": true}, {"id": "RZpBK", "text": "31", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$C_1:(x+3)^2+(y+3)^2=3^2$<br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3NdJSVTBZnaQslvzzf-ePANNRDktQsHIAYcBi43TarU.original.fullsize.png\"/><br/>Let $\\mathrm{C}_1$ and $\\mathrm{C}_2$ has centres $A\\left(-3_1-3\\right)$ and $B(1,3)$<br/>$\\begin{aligned}<br/>& \\mathrm{AB}=\\sqrt{16+36}=2 \\sqrt{13} \\\\\n& \\mathrm{r}_1=3 \\text { and } \\mathrm{r}_2=2 \\sqrt{13}-3 \\\\\n& \\mathrm{P}(\\alpha, \\beta), \\alpha=\\frac{\\mathrm{r}_1(1)+\\mathrm{r}_2(-3)}{\\mathrm{r}_1+\\mathrm{r}_2}, \\beta=\\frac{\\mathrm{r}_1(3)+\\mathrm{r}_2(-3)}{\\mathrm{r}_1+\\mathrm{r}_2} \\\\\n& \\alpha=\\frac{3-3(2 \\sqrt{13}-3)}{2 \\sqrt{13}}, \\beta=\\frac{18-6 \\sqrt{13}}{2 \\sqrt{13}} \\\\\n& (\\beta-\\alpha)^2=\\left(\\frac{6}{2 \\sqrt{13}}\\right)^2 \\\\\n& (\\beta-\\alpha)^2=\\left(\\frac{6}{2 \\sqrt{13}}\\right)^2, \\mathrm{~m}+\\mathrm{n}=22<br/>\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "8f997b563714411eb22747f7580005cb", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/q4xnDIwy2sOmB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/q4xnDIwy2sOmB.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c777c09d044e4c1a21d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2fe9d87935e0d809786", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T14:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 2)", "title": "JEE Main 2025 (3 Apr Shift 2)"}], "question": {"text": "If the four distinct points $(4,6),(-1,5),(0,0)$ and $(\\mathrm{k}, 3 \\mathrm{k : false}, {"id": "AjVp3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>13</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "v0W4W", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>13</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "YDysw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>13</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>We know that, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>)</mo><mo>,</mo><mo> </mo><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo><mo>,</mo><mo> </mo><mo>(</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo>)</mo></math> lies on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi><mo>-</mo></math>axis, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>-</mo></math>axis and on the origin respectively.</p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mi mathvariant=\"normal\">k</mi><mo>,</mo><mn>3</mn><mi mathvariant=\"normal\">k</mi><mo>)</mo></math> will lie on circle whose diameter is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ca769eba-dd0c-45da-9182-749577dd8be4.png\" style=\"width: 205px; height: 165px;\"/></p><p>Equation of the circle will be given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mn>1</mn><mo>)</mo><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>)</mo><mo>+</mo><mo>(</mo><mi mathvariant=\"normal\">y</mi><mo>-</mo><mn>1</mn><mo>)</mo><mo>(</mo><mi mathvariant=\"normal\">y</mi><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">y</mi><mn>2</mn></msup><mo>-</mo><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>0</mn><mo> </mo><mo> </mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>Using <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mi mathvariant=\"normal\">k</mi><mo>,</mo><mo> </mo><mn>3</mn><mi mathvariant=\"normal\">k</mi><mo>)</mo></math> in equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>(</mo><mn>2</mn><mi mathvariant=\"normal\">k</mi><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>3</mn><mi mathvariant=\"normal\">k</mi><msup><mo>)</mo><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">k</mi><mo>-</mo><mn>3</mn><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>13</mn><msup><mi mathvariant=\"normal\">k</mi><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo> </mo><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfrac><mn>5</mn><mn>13</mn></mfrac></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfrac><mn>5</mn><mn>13</mn></mfrac></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68433", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "Consider a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mi>x</mi><msup><mo>&#160;</mo><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>4</mn><mi>x</mi><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>2</mn><mi>y</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>&#945;</mi><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>5</mn><mo>.</mo></math> Let its mirror image in the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>1</mn></math> be another circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub><mo>:</mo><mn>5</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><msup><mi>y</mi><mn>2</mn></msup><mo>&#160;</mo><mo>&#8211;</mo><mn>10</mn><mi>f</mi><mi>x</mi><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>10</mn><mi>g</mi><mi>y</mi><mo>+</mo><mo>&#160;</mo><mn>36</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo></math>&nbsp; Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> be the radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math> . Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mo>&#160;</mo><mi>r</mi></math> is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi></math>", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<blockquote><p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><msub><mi>x</mi><mn>2</mn></msub><mo>+</mo><mo>&#160;</mo><msub><mi>y</mi><mn>2</mn></msub><mo>&#8211;</mo><mn>4</mn><mi>x</mi><mo>&#8211;</mo><mo>&#160;</mo><mn>2</mn><mi>y</mi><mo>+</mo><mfenced><mrow><mn>5</mn><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mi>&#945;</mi></mrow></mfenced><mo>=</mo><mo>&#160;</mo><mn>0</mn></math></p><p>So, its centre will be,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>O</mi><mn>1</mn></msub><mo>=</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math>&nbsp;and&nbsp;radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mi>&#945;</mi></msqrt></math></p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>5</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><msup><mi>y</mi><mn>2</mn></msup><mo>&#8211;</mo><mn>10</mn><mi>f</mi><mi>x</mi><mo>&#8211;</mo><mn>10</mn><mi>g</mi><mi>y</mi><mo>+</mo><mn>36</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>C</mi><mn>2</mn></msub><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>&#8211;</mo><mn>2</mn><mi>f</mi><mi>x</mi><mo>&#8211;</mo><mn>2</mn><mi>g</mi><mi>y</mi><mo>&#160;</mo><mo>+</mo><mfrac><mn>36</mn><mn>5</mn></mfrac><mo>=</mo><mn>0</mn></math></p><p>So, Centre <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>O</mi><mn>2</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfenced><mrow><mi>f</mi><mo>,</mo><mo>&#160;</mo><mi>g</mi></mrow></mfenced></math>&nbsp;and radius&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><msqrt><msup><mi>f</mi><mn>2</mn></msup><mo>+</mo><msup><mi>g</mi><mn>2</mn></msup><mo>-</mo><mfrac><mn>36</mn><mn>5</mn></mfrac></msqrt></math></p><p>Also given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>O</mi><mn>2</mn></msub></math> is reflection of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>O</mi><mn>1</mn></msub></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>&#8211;</mo><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>, so image formula we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>f</mi><mo>-</mo><mn>2</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mi>g</mi><mo>-</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mn>2</mn><mo>&#183;</mo><mfenced><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>-</mo><mn>1</mn><mo>+</mo><mn>1</mn></mrow><mrow><msup><mn>2</mn><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup></mrow></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>f</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>6</mn></mrow><mn>5</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mfrac><mn>13</mn><mn>5</mn></mfrac></math></p><p>So, radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><msqrt><msup><mfenced><mfrac><mrow><mo>-</mo><mn>6</mn></mrow><mn>5</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mn>13</mn><mn>5</mn></mfrac></mfenced><mn>2</mn></msup><mo>-</mo><mfrac><mn>36</mn><mn>5</mn></mfrac></msqrt><mo>=</mo><mfrac><msqrt><mn>25</mn></msqrt><mn>5</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo></math>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#160;</mo><mo>=</mo><mn>1</mn></math>&nbsp;as they both are same radius circle,</p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>+</mo><mi>&#945;</mi><mo>=</mo><mn>2</mn></math>.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "eff29a12a01d42788769827b51b2a847", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/sb2ArX9tHHazx.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/sb2ArX9tHHazx.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d6837b", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}], "question": {"text": "<p>A circle passing through the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced></math> in the first quadrant touches the two coordinate axes at the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>.</mo></math> The point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;is above the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>.</mo></math> The point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;on the line segment&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;is the foot of perpendicular from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>.</mo></math>&nbsp;If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>&nbsp;is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn></math> units, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mi>&#946;</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi></math></p>", "image": null}, "options": [], "correctValue": "121", "solution": {"text": "<blockquote><p>Let the equation of circle touching both the coordinate axis be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>x</mi><mo>-</mo><mi>r</mi><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi>y</mi><mo>-</mo><mi>r</mi><msup><mo>)</mo><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math>&nbsp;which&nbsp;passes through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>&#945;</mi><mo>-</mo><mi>r</mi><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi>&#946;</mi><mo>-</mo><mi>r</mi><msup><mo>)</mo><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>Also equation of line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>:</mo><mo>&#160;</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mi>r</mi></math></p><p>&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/744d7ab7-d7e1-438e-b442-2d90dd9a532e-image.png\" style=\"width: 200px; height: 166px;\" /></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mfenced><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math>,</p><p>Now using the formula of foot of perpendicular,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mo>-</mo><mi>&#945;</mi></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>k</mi><mo>-</mo><mi>&#946;</mi></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mo>(</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>-</mo><mi>r</mi><mo>)</mo></mrow><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>(</mo><mi>h</mi><mo>,</mo><mi>k</mi><mo>)</mo><mo>=</mo><mfenced><mrow><mi>&#945;</mi><mo>-</mo><mfrac><mi>&#945;</mi><mn>2</mn></mfrac><mo>-</mo><mfrac><mi>&#946;</mi><mn>2</mn></mfrac><mo>+</mo><mfrac><mi>r</mi><mn>2</mn></mfrac><mo>,</mo><mi>&#946;</mi><mo>-</mo><mfrac><mi>&#945;</mi><mn>2</mn></mfrac><mo>-</mo><mfrac><mi>&#946;</mi><mn>2</mn></mfrac><mo>+</mo><mfrac><mi>r</mi><mn>2</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mfrac><mrow><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi><mo>+</mo><mi>r</mi></mrow><mn>2</mn></mfrac><mo>,</mo><mfrac><mrow><mo>-</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>+</mo><mi>r</mi></mrow><mn>2</mn></mfrac></mrow></mfenced></math></p><p>Now using the distance formula we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>P</mi><mi>Q</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mfenced><mfrac><mrow><mo>-</mo><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi><mo>+</mo><mi>r</mi></mrow><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mrow><mo>-</mo><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi><mo>+</mo><mi>r</mi></mrow><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mn>121</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>(</mo><mi>r</mi><mo>-</mo><mo>(</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>)</mo><msup><mo>)</mo><mn>2</mn></msup><mo>=</mo><mn>242</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>r</mi><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><msup><mo>)</mo><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>r</mi><mo>(</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>)</mo><mo>=</mo><mn>242</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>+</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>&#945;</mi><mi>&#946;</mi><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>r</mi><mi>&#945;</mi><mo>-</mo><mn>2</mn><mi>r</mi><mi>&#946;</mi><mo>=</mo><mn>242</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mn>242</mn></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mtext>from&#160;equation</mtext><mo>&#160;</mo><mfenced><mn>1</mn></mfenced><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi>&#945;</mi><mo>-</mo><mi>r</mi><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi>&#946;</mi><mo>-</mo><mi>r</mi><msup><mo>)</mo><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mi>&#946;</mi><mo>=</mo><mn>121</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "01187c905f514647a6c1440edfdd8324", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/5Wgv2RdjMY4Md.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/5Wgv2RdjMY4Md.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68269", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><msub><mi>a</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>b</mi><mn>1</mn></msub></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mfenced><mrow><msub><mi>a</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>b</mi><mn>2</mn></msub></mrow></mfenced></math> be two distinct points on a circle with center <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>(</mo><msqrt><mn>2</mn></msqrt><mo>,</mo><msqrt><mn>3</mn></msqrt><mo>)</mo></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> be the origin and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>C</mi></math> be perpendicular to both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>Q</mi></math>. If the area of the triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>C</mi><mi>P</mi></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>35</mn></msqrt><mn>2</mn></mfrac></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>a</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>a</mi><mn>2</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>b</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>b</mi><mn>2</mn><mn>2</mn></msubsup></math>&nbsp;is equal to&nbsp; __________", "image": null}, "options": [], "correctValue": "24", "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><msub><mi>a</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>b</mi><mn>1</mn></msub></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mfenced><mrow><msub><mi>a</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>b</mi><mn>2</mn></msub></mrow></mfenced></math> be two distinct points on a circle with center <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>(</mo><msqrt><mn>2</mn></msqrt><mo>,</mo><msqrt><mn>3</mn></msqrt><mo>)</mo></math>,</p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> be the origin and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>C</mi></math> be perpendicular to both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>Q</mi></math>,</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>C</mi><mi>Q</mi></math>&nbsp;will be a straight line</p><p>Now on plotting the diagram we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/91e9b208-233c-4633-8d4e-5980163c97d0-9895882.png\" style=\"width: 300px; height: 324px;\" /></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>C</mi><mo>=</mo><msqrt><msup><mfenced><msqrt><mn>2</mn></msqrt></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><msqrt><mn>3</mn></msqrt></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>5</mn></msqrt></math></p><p>Now let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi><mo>=</mo><mi>C</mi><mi>Q</mi><mo>=</mo><mi>I</mi></math><br />Now by using area of triangle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>C</mi><mi>P</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mi>O</mi><mi>C</mi><mo>&#215;</mo><mi>I</mi></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>35</mn></msqrt><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><msqrt><mn>5</mn></msqrt><mo>&#215;</mo><mi>I</mi><mo>&#8658;</mo><mi>I</mi><mo>=</mo><msqrt><mn>7</mn></msqrt></math></p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi><mo>=</mo><mi>O</mi><mi>Q</mi><mo>=</mo><msqrt><mi>O</mi><msup><mi>C</mi><mn>2</mn></msup><mo>+</mo><msup><mi>I</mi><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>12</mn></msqrt></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>a</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>b</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>a</mi><mn>2</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>b</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mi>O</mi><msup><mi>P</mi><mn>2</mn></msup><mo>+</mo><mi>O</mi><msup><mi>Q</mi><mn>2</mn></msup><mo>=</mo><mn>12</mn><mo>+</mo><mn>12</mn><mo>=</mo><mn>24</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67de0", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "Let the mirror image of a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>1</mn></msub><mo>:</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>6</mn><mi>y</mi><mo>+</mo><mi>&#945;</mi><mo>=</mo><mn>0</mn></math>&nbsp;&nbsp;in line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>1</mn></math>&nbsp;be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>2</mn></msub><mo>:</mo><mn>5</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>10</mn><mi>g</mi><mi>x</mi></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>10</mn><mi>f</mi><mi>y</mi><mo>+</mo><mn>38</mn><mo>=</mo><mn>0</mn></math>. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> is the radius of circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>2</mn></msub></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mn>6</mn><msup><mi>r</mi><mn>2</mn></msup></math>&nbsp;is equal to ______", "image": null}, "options": [], "correctValue": "12", "solution": {"text": "<blockquote><p>Let the mirror image of a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>1</mn></msub><mo>:</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>6</mn><mi>y</mi><mo>+</mo><mi>&#945;</mi><mo>=</mo><mn>0</mn></math>&nbsp;&nbsp;in line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>1</mn></math>&nbsp;be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>2</mn></msub><mo>:</mo><mn>5</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>10</mn><mi>g</mi><mi>x</mi></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>10</mn><mi>f</mi><mi>y</mi><mo>+</mo><mn>38</mn><mo>=</mo><mn>0</mn></math>. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> is the radius of circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>2</mn></msub></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mn>6</mn><msup><mi>r</mi><mn>2</mn></msup></math>&nbsp;is equal to ______</p><p>Now Image of centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>1</mn></msub><mo>&#8801;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>&nbsp;is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>-</mo><mn>3</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn><mfenced><mrow><mn>1</mn><mo>-</mo><mn>3</mn><mo>+</mo><mn>1</mn></mrow></mfenced></mrow><mrow><msup><mn>1</mn><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>,</mo><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn></math></p><p>So, centre of circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>2</mn></msub><mo>&#8801;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math></p><p>Now radius&nbsp;of circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>2</mn></msub></math>&nbsp;will be&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>4</mn><mo>+</mo><mn>4</mn><mo>-</mo><mfrac><mn>38</mn><mn>5</mn></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mn>2</mn><mn>5</mn></mfrac></msqrt><mo>=</mo><mi>r</mi></math></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mtext>radius&#160;of</mtext><mo>&#160;</mo><msup><msub><mi>c</mi><mn>1</mn></msub><mn>2</mn></msup></mrow></mfenced><mo>=</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mtext>radius&#160;of</mtext><mo>&#160;</mo><msub><mi>c</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup></math>&nbsp;as they are image to one another,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msqrt><msup><mn>1</mn><mn>2</mn></msup><mo>+</mo><msup><mn>3</mn><mn>2</mn></msup><mo>-</mo><mi>&#945;</mi></msqrt><mo>=</mo><msqrt><mfrac><mn>2</mn><mn>5</mn></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>10</mn><mo>-</mo><mi>&#945;</mi><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mn>48</mn><mn>5</mn></mfrac></math></p><p>Now putting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>r</mi></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mn>6</mn><msup><mi>r</mi><mn>2</mn></msup></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mn>6</mn><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>48</mn><mn>5</mn></mfrac><mo>+</mo><mfrac><mn>12</mn><mn>5</mn></mfrac><mo>=</mo><mn>12</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "60b751f91e9340a89688f8bc6b8125ff", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/seY59HjppgcEh.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/seY59HjppgcEh.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b05", "previousYearPapers": [{"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>6</mn><mi>y</mi><mo>-</mo><mn>19</mn><mi>c</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>g</mi><mo>,</mo><mi>c</mi><mo>&#8712;</mo><mi>&#8477;</mi></math>&nbsp;passes through the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>6</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math> and its centre lies on the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi> 98/Math/MathML\"><mi>R</mi></math> is _____.", "image": null}, "options": [], "correctValue": "16", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7dec6128-8e1b-46fa-8389-4c094375032c-image.png\" style=\"width: 210px; height: 167px;\" /></p><p>Equation&nbsp;of line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;will be&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mn>2</mn><mo>=</mo><mn>2</mn><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>0</mn></math></p><p>Now the given diameter is parallel to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math></p><p>Then, the distance between diameter and line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mfrac><mn>4</mn><msqrt><msup><mn>2</mn><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup></msqrt></mfrac></mfenced><mo>=</mo><mfrac><mn>4</mn><msqrt><mn>5</mn></msqrt></mfrac></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>C</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>4</mn><msqrt><mn>5</mn></msqrt></mfrac><mo>=</mo><mfrac><mn>8</mn><msqrt><mn>5</mn></msqrt></mfrac></math></p><p>Also&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><msqrt><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mn>3</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mn>2</mn><mo>-</mo><mn>6</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>20</mn></msqrt><mo>=</mo><mn>2</mn><msqrt><mn>5</mn></msqrt></math></p><p>Area of the rectangle<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>A</mi><mi>B</mi><mo>&#215;</mo><mi>B</mi><mi>C</mi><mo>=</mo><mfrac><mn>8</mn><msqrt><mn>5</mn></msqrt></mfrac><mo>&#215;</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>=</mo><mn>16</mn></math></p>", "image": null}, "videoSolution": {"videoId": "c7f56bfdfd864e35b3c9c0c7ee04e48e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/yq2KHFmKdRqm1.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/yq2KHFmKdRqm1.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557bc36d43b5ec151ee5478", "previousYearPapers": [{"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}], "type": "numerical", "level": 1, "question": {"text": "Let the abscissae of the two points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;be the roots of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>r</mi><mi>x</mi><mo>+</mo><mi>p</mi><mo>=</mo><mn>0</mn></math>&nbsp;and the ordinates of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> be the roots of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>s</mi><mi>x</mi><mo>-</mo><mi>q</mi><mo>=</mo><mn>0</mn></math>. If the equation of the circle described on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>&nbsp;as diameter is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfenced><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfenced><mo>-</mo><mn>11</mn><mi>x</mi><mo>-</mo><mn>14</mn><mi>y</mi><mo>-</mo><mn>22</mn><mo>=</mo><mn>0</mn></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>r</mi><mo>+</mo><mi>s</mi><mo>-</mo><mn>2</mn><mi>q</mi><mo>+</mo><mi>p</mi></math>&nbsp;is equal to ______.", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "<p>Let the roots of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>r</mi><mi>x</mi><mo>+</mo><mi>p</mi><mo>=</mo><mn>0</mn></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>x</mi><mn>2</mn></msub></math>&nbsp;and roots of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mi>s</mi><mi>y</mi><mo>-</mo><mi>q</mi><mo>=</mo><mn>0</mn></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>y</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>2</mn></msub></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>r</mi><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><msub><mi>x</mi><mn>1</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>p</mi><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><msub><mi>y</mi><mn>2</mn></msub><mo>=</mo><mi>s</mi><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub><msub><mi>y</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mi>q</mi></math></p><p>Equation of the circle with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>&nbsp;as diameter will be&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>-</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><msub><mi>x</mi><mn>2</mn></msub></mrow></mfenced><mo>+</mo><mfenced><mrow><mi>y</mi><mo>-</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced><mfenced><mrow><mi>y</mi><mo>-</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;</p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfenced><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfenced><mo>-</mo><mi>r</mi><mi>x</mi><mo>-</mo><mn>2</mn><mi>s</mi><mi>y</mi><mo>+</mo><mi>p</mi><mo>-</mo><mn>2</mn><mi>q</mi><mo>=</mo><mn>0</mn></math>&nbsp;</p><p>On&nbsp;comparing with the given equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>11</mn><mo>,</mo><mi>s</mi><mo>=</mo><mn>7</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>-</mo><mn>2</mn><mi>q</mi><mo>=</mo><mo>-</mo><mn>22</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mn>2</mn><mi>r</mi><mo>+</mo><mi>s</mi><mo>-</mo><mn>2</mn><mi>q</mi><mo>+</mo><mi>p</mi><mo>=</mo><mn>22</mn><mo>+</mo><mn>7</mn><mo>-</mo><mn>22</mn><mo>=</mo><mn>7</mn></math></p>", "image": null}, "videoSolution": {"videoId": "6498af8801ab4ec2aa5a6b762b951e55", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ExbVaQWRgaKMW.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ExbVaQWRgaKMW.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737
