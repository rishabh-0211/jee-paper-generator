/mn></msup><mo>=</mo><mfrac><mn>25</mn><mn>4</mn></mfrac></math><br /><br />x intercept <math><mo>=</mo><mn>2</mn><msqrt><msup><mrow><mi>g</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>c</mi></msqrt></math><br /><br /><math><mo>=</mo><mn>2</mn><msqrt><mfrac><mrow><mn>25</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>-</mo><mn>4</mn></msqrt></math><br /><br /><math><mo>=</mo><mn>2</mn><msqrt><mfrac><mrow><mn>9</mn></mrow><mrow><mn>4</mn></mrow></mfrac></msqrt></math><br /><br /><math><mo>=</mo><mn>3</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2015 (11 Apr Online)", "title": "JEE Main 2015 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65dab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}], "question": {"text": "If the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>4</mn></mrow></mfenced></math> &nbsp;lies inside the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>10</mn><mi>y</mi><mo>+</mo><mi>p</mi><mo>=</mo><mn>0</mn></math> and the circle does not touch or intersect the coordinate axes, then the set of all possible values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;is the interval", "image": null}, "options": [{"id": "yajGG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>25</mn><mo>,</mo><mo>&#160;</mo><mn>39</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "e3iF8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>25</mn><mo>,</mo><mo>&#160;</mo><mn>29</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "O8Y9m", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>25</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "RYmSq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>9</mn><mo>,</mo><mo>&#160;</mo><mn>25</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>1</mn><mn>0</mn><mi>y</mi><mo>+</mo><mi>p</mi><mo>=</mo><mn>0</mn></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Centre is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced></math>&nbsp;and radius is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>34</mn><mo>-</mo><mi>p</mi></msqrt></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>&#160;</mi><mn>4</mn></mrow></mfenced></math> lies inside the circle.&nbsp;</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><mn>16</mn><mo>-</mo><mn>6</mn><mo>-</mo><mn>40</mn><mo>+</mo><mi>p</mi><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mo>&#60;</mo><mn>29</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math>&nbsp; &nbsp;</p><p>Circle neither touches nor cut the coordinate axes.<br />So, radius of circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>34</mn><mo>-</mo><mi>p</mi></msqrt><mo>&#60;</mo><mn>5</mn></math>&nbsp;(for not touching&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo></math>&nbsp;axis )&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>34</mn><mo>-</mo><mi>p</mi></msqrt><mo>&#60;</mo><mn>3</mn></math>&nbsp;(for not touching&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo></math>axis)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mn>9</mn><mo>&#60;</mo><mi mathvariant=\"normal\">p</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#60;</mo><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">&#160;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>p</mi><mo>&#62;</mo><mn>25</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>From equations&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mn>2</mn></mfenced></math>,</p><p>So,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mn>25</mn><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>29</mn></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b8b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "The circle passing through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>)</mo></math> and touching the axis of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>3</mn><mo>,</mo><mn>0</mn><mo>)</mo></math> also passes through the point", "image": null}, "options": [{"id": "RleM3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>5</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "Z1mCZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "CsfaU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>5</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "sKzQm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>5</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ef47a3dd-0ff0-4132-b6b1-b1bc996d8792-0fdb5c00-99bd-4b4c-a011-5f75e9fd510a-image.png\" style=\"width: 260px; height: 198px;\" /><br /><br />Alt : Equation of circle<br /><br /><math> <mrow> <msup> <mrow> <mo stretchy=\"false\">(</mo><mi>x</mi><mo>&#8722;</mo><mn>3</mn><mo stretchy=\"false\">)</mo> </mrow> <mn>2</mn> </msup> <mo>+</mo><msup> <mrow> <mo stretchy=\"false\">(</mo><mi>y</mi><mo>+</mo><mi>r</mi><mo stretchy=\"false\">)</mo> </mrow> <mn>2</mn> </msup> <mo>=</mo><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />Passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math><br /><br /><math> <mrow> <mo>&#8756;</mo><mtext> </mtext><mtext> </mtext><mi>r</mi><mo>=</mo><mn>2</mn> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;</mo><mtext> </mtext> </mrow> </math> Circle <math> <mrow> <msup> <mrow> <mo stretchy=\"false\">(</mo><mi>x</mi><mo>&#8722;</mo><mn>3</mn><mo stretchy=\"false\">)</mo> </mrow> <mn>2</mn> </msup> <mo>+</mo><msup> <mrow> <mo stretchy=\"false\">(</mo><mi>y</mi><mo>+</mo><mn>2</mn><mo stretchy=\"false\">)</mo> </mrow> <mn>2</mn> </msup> <mo>=</mo><mn>4</mn> </mrow> </math></p><p>Passes through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>5</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>)</mo></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b49", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}], "question": {"text": "The length of the diameter of the circle which touches the $x$-axis at the point $(1,0)$ and passes through the point $(2,3)$ is", "image": null}, "options": [{"id": "TKE5p", "text": "\n$\\frac{10}{3}$\n", "image": null, "isCorrect": true}, {"id": "4bzek", "text": "\n$\\frac{3}{5}$\n", "image": null, "isCorrect": false}, {"id": "djbOh", "text": "\n$\\frac{6}{5}$\n", "image": null, "isCorrect": false}, {"id": "Pk8qv", "text": "\n$\\frac{5}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $(h, k)$ be centre.\n$\\begin{array}{ll}\n(h-1)^2+(k-0)^2=k^2 & \\Rightarrow h=1 \\\\\n(h-2)^2+(k-3)^2=k^2 & \\Rightarrow k=\\frac{5}{3}\n\\end{array}$\n$\\therefore$ diameter is $2 \\mathrm{k}=\\frac{10}{3}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/YRrSooJmvtNjsCdHLejVWr9hDvhYVbsSQaKbe2VhSwQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65797", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "Let $C$ be the circle with centre $(0,0)$ and radius 3 units. The equation of the locus of the mid points of the chords of the circle $C$ that subtend an angle of $\\frac{2 \\pi}{3}$ at its centre is", "image": null}, "options": [{"id": "BqDtU", "text": "\n$x^2+y^2=\\frac{3}{-}$\n", "image": null, "isCorrect": false}, {"id": "weN5n", "text": "\n$x^2+y^2=1$\n", "image": null, "isCorrect": false}, {"id": "3tZWB", "text": "\n$x^2+y^2=\\frac{27}{4}$\n", "image": null, "isCorrect": false}, {"id": "FjGTW", "text": "\n$x^2+y^2=\\frac{9}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\cos \\frac{\\pi}{3}=\\frac{\\sqrt{h^2+k^2}}{3} \\Rightarrow h^2+k^2=\\frac{9}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65795", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "If the lines $3 x-4 y-7=0$ and $2 x-3 y-5=0$ are two diameters of a circle of area $49 \\pi$ square units, the equation of the circle is", "image": null}, "options": [{"id": "utCGs", "text": "\n$x^2+y^2+2 x-2 y-47=0$\n", "image": null, "isCorrect": false}, {"id": "3QNLM", "text": "\n$x^2+y^2+2 x-2 y-62=0$\n", "image": null, "isCorrect": false}, {"id": "Smptt", "text": "\n$x^2+y^2-2 x+2 y-62=0$\n", "image": null, "isCorrect": false}, {"id": "fwPMu", "text": "\n$x^2+y^2-2 x+2 y-47=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Point of intersection of $3 x-4 y-7=0$ and $2 x-3 y-5=0$ is $(1,-1)$, which is the centre of the circle and radius $=7$.\n$\\therefore$ Equation is $(x-1)^2+(y+1)^2=49 \\Rightarrow x^2+y^2-2 x+2 y-47=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d69359", "title": "Position of point", "totalQuestions": 6, "questions": [{"_id": "69d8073181239f6567c4f2da", "type": "singleCorrect", "question": {"text": "Let $P$ be a moving point on the circle $x^2 + y^2 - 6x - 8y + 21 = 0$. Then, the maximum distance of $P$ from the vertex of the parabola $x^2 + 6x + y + 13 = 0$ is equal to:", "image": null}, "options": [{"id": "6B28u", "text": "$8$", "isCorrect": false, "image": null}, {"id": "2lMDi", "text": "$10$", "isCorrect": false, "image": null}, {"id": "aFUoM", "text": "$12$", "isCorrect": true, "image": null}, {"id": "sI9UJ", "text": "$9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the given circle is $x^2 + y^2 - 6x - 8y + 21 = 0$.<br><br>The center of the circle is $C(3, 4)$ and its radius is $r = \\sqrt{3^2 + 4^2 - 21} = \\sqrt{4} = 2$.<br><br>The equation of the given parabola is $x^2 + 6x + y + 13 = 0$.<br><br>Rewriting the equation by completing the square, we get $(x + 3)^2 = -(y + 4)$.<br><br>The vertex of the parabola is $V(-3, -4)$.<br><br>The maximum distance of a moving point $P$ on the circle from the vertex $V$ is given by $CV + r$.<br><br>The distance between the center $C(3, 4)$ and the vertex $V(-3, -4)$ is $CV = \\sqrt{(3 - (-3))^2 + (4 - (-4))^2} = \\sqrt{6^2 + 8^2} = \\sqrt{100} = 10$.<br><br>Therefore, the maximum distance is $10 + 2 = 12$.<br><br>Answer: $12$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "757f49de2e23423b8da6fbaec919fef9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/yAUqBwIrXFDc5.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/yAUqBwIrXFDc5.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446730970e6e9ab542d109", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 1)", "title": "JEE Main 2024 (06 Apr Shift 1)"}], "question": {"text": "Let $C$ be the circle of minimum area touching the parabola $y=6-x^2$ and the lines $y=\\sqrt{3}|x|$. Then, which one of the following points lies on the circle $C$ ?", "image": null}, "options": [{"id": "s72hs", "text": "$(1,2)$", "image": null, "isCorrect": false}, {"id": "DKBwb", "text": "$(1,1)$", "image": null, "isCorrect": false}, {"id": "HaeR0", "text": "$(2,2)$", "image": null, "isCorrect": false}, {"id": "vF4Du", "text": "$(2,4)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/QjL9jfOUjsu1C1S3E1nM975XyytuoRTxzeDMAma2vxc.original.fullsize.png\"><br />Equation of circle\n$\\mathrm{x}^2+(\\mathrm{y}-(6-\\mathrm{r}))^2=\\mathrm{r}^2$\ntouches $\\sqrt{3} \\mathrm{x}-\\mathrm{y}=0$\n$\\begin{aligned}\n& \\mathrm{p}=\\mathrm{r} \\\\\n& \\frac{|0-(6-\\mathrm{r})|}{2}=\\mathrm{r} \\\\\n& |\\mathrm{r}-6|=2 \\mathrm{r} \\\\\n& \\mathrm{r}=2\n\\end{aligned}$\n$\\therefore$ Circle $\\mathrm{x}^2+(\\mathrm{y}-4)^2=4$\n$(2,4)$ Satisfies this equation", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 1)", "title": "JEE Main 2024 (06 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-27T07:20:44.091Z"}, {"_id": "6644671c970e6e9ab542d04e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T09:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 1)", "title": "JEE Main 2024 (05 Apr Shift 1)"}], "question": {"text": "Let a circle $C$ of radius 1 and closer to the origin be such that the lines passing through the point $(3,2)$ and parallel to the coordinate axes touch it. Then the shortest distance of the circle $\\mathrm{C}$ from the point $(5,5)$ is :", "image": null}, "options": [{"id": "3xFeF", "text": "$2 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "jgLm6", "text": "$4 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "hrMYd", "text": "4", "image": null, "isCorrect": true}, {"id": "AomRl", "text": "5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/TaIPB9MRQkEpWyAhHYRzdbglbv0mY_NI9h8hoTylNYw.original.fullsize.png\"><br />Coordinates of the centre will be $(2,1)$\nEquation of circle will be\n$\\begin{aligned}\n& (\\mathrm{x}-2)^2+(\\mathrm{y}-1)^2=1 \\\\\n& \\mathrm{QC}=\\sqrt{(5-2)^2+(5-1)^2} \\\\\n& \\mathrm{QC}=5\n\\end{aligned}$\nshortest distance\n$\\begin{aligned}\n& =\\mathrm{RQ}=\\mathrm{CQ}-\\mathrm{CR} \\\\\n& =5-1 \\\\\n& =4\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "c7fd1bd1cf6540a4a6d9c693e196fa2f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/1FB9jBimVzYVP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/1FB9jBimVzYVP.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T09:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 1)", "title": "JEE Main 2024 (05 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-29T03:27:50.751Z"}, {"_id": "6557bc2ad43b5ec151ee5476", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}], "question": {"text": "Let the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>,</mo><mi>p</mi><mo>+</mo><mn>1</mn></mrow></mfenced></math>&nbsp;lie inside the region&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfenced open=\"{\" close=\"}\"><mrow><mfenced><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></mfenced><mo>:</mo><mn>3</mn><mo>-</mo><mi>x</mi><mo>&#8804;</mo><mi>y</mi><mo>&#8804;</mo><msqrt><mn>9</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></msqrt><mo>,</mo><mn>0</mn><mo>&#8804;</mo><mi>x</mi><mo>&#8804;</mo><mn>3</mn></mrow></mfenced><mo>.</mo></math>&nbsp;If the set of all values of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;is the interval&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>,</mo></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mo>-</mo><msup><mi>a</mi><mn>2</mn></msup></math>&nbsp;is equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mo>.</mo></math>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<blockquote><p>Given,</p><p>The point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>,</mo><mi>p</mi><mo>+</mo><mn>1</mn></mrow></mfenced></math>&nbsp;lie inside the region&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></mfenced><mo>:</mo><mn>3</mn><mo>-</mo><mi>x</mi><mo>&#8804;</mo><mi>y</mi><mo>&#8804;</mo><msqrt><mn>9</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></msqrt><mo>,</mo><mn>0</mn><mo>&#8804;</mo><mi>x</mi><mo>&#8804;</mo><mn>3</mn></mrow></mfenced></math>,</p><p>And&nbsp;the set of all values of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;is the interval&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>,</mo></math>&nbsp;</p><p>Now by observation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>,</mo><mi>p</mi><mo>+</mo><mn>1</mn></mrow></mfenced></math>&nbsp;lies on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mi>x</mi><mo>=</mo><mn>1</mn></math>,</p><p>Also point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>,</mo><mi>p</mi><mo>+</mo><mn>1</mn></mrow></mfenced></math>&nbsp;lies on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>3</mn></math></p><p>So, solving&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mi>x</mi><mo>=</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>3</mn></math>&nbsp;we get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math></p><p>Again given point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>,</mo><mi>p</mi><mo>+</mo><mn>1</mn></mrow></mfenced></math>&nbsp;lies on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>9</mn></math></p><p>So, solving&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mi>x</mi><mo>=</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>9</mn></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>1</mn><mo>+</mo><mi>x</mi><msup><mo>)</mo><mn>2</mn></msup><mo>=</mo><mn>9</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>8</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn><mo>&#177;</mo><msqrt><mn>1</mn><mo>+</mo><mn>4</mn><mo>&#183;</mo><mn>4</mn></msqrt></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>17</mn></msqrt><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>&#8712;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mfrac><mrow><msqrt><mn>17</mn></msqrt><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac></mrow></mfenced></math></p><p>Now on comparing with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>&#8712;</mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mo>=</mo><mn>4</mn></math>&nbsp; &nbsp;[using <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math>]</p><p>Hence, the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mo>-</mo><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mo>-</mo><mn>1</mn><mo>=</mo><mn>3</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67182", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf816", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Jul Shift 1)", "title": "JEE Main 2021 (22 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>:</mo><mn>36</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>36</mn><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>108</mn><mi>x</mi><mo>+</mo><mn>120</mn><mi>y</mi><mo>+</mo><mi>C</mi><mo>=</mo><mn>0</mn></math>&nbsp;be such that it neither intersects nor touches the co-ordinate axes. If the point of intersection of the lines, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>4</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>5</mn></math> lies inside the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>,</mo></math> then:", "image": null}, "options": [{"id": "3Sqf3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>9</mn></mfrac><mo>&#60;</mo><mi>C</mi><mo>&#60;</mo><mfrac><mn>13</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "C7bKN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#60;</mo><mi>C</mi><mo>&#60;</mo><mn>165</mn></math>", "isCorrect": false, "image": null}, {"id": "Rmv4t", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>81</mn><mo>&#60;</mo><mi>C</mi><mo>&#60;</mo><mn>156</mn></math>", "isCorrect": false, "image": null}, {"id": "KZ4Ox", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#60;</mo><mi>C</mi><mo>&#60;</mo><mn>156</mn></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>The given circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>:</mo><mn>36</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>36</mn><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>108</mn><mi>x</mi><mo>+</mo><mn>120</mn><mi>y</mi><mo>+</mo><mi>C</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>+</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><mi>y</mi><mo>+</mo><mfrac><mi>C</mi><mn>36</mn></mfrac><mo>=</mo><mn>0</mn></math></p><p>We know that the centre and radius of a circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>f</mi><mi>y</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mi>g</mi><mo>,</mo><mo>&#160;</mo><mo>-</mo><mi>f</mi></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mi>g</mi><mn>2</mn></msup><mo>+</mo><msup><mi>f</mi><mn>2</mn></msup><mo>-</mo><mi>c</mi></msqrt></math>&nbsp;respectively.</p><p>Thus, centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>&#8801;</mo><mfenced><mrow><mo>-</mo><mi>g</mi><mo>,</mo><mo>-</mo><mi>f</mi></mrow></mfenced><mo>&#8801;</mo><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mo>-</mo><mfrac><mn>10</mn><mn>6</mn></mfrac></mrow></mfenced></math>&nbsp;and&nbsp;radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>r</mi><mo>=</mo><msqrt><mfrac><mn>9</mn><mn>4</mn></mfrac><mo>+</mo><mfrac><mn>100</mn><mn>36</mn></mfrac><mo>-</mo><mfrac><mi>C</mi><mn>36</mn></mfrac></msqrt></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b4120070-e52d-43c5-b6a4-6d8c0e00c7b0-image.png\" style=\"width: 300px; height: 193px;\" /></p><p>Now, this circle neither intersects nor touches the co-ordinate axes, hence, the radius of the circle is less than the absolute value of the co-ordinate with smaller value.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>r</mi><mo>&#60;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>9</mn><mn>4</mn></mfrac><mo>+</mo><mfrac><mn>100</mn><mn>36</mn></mfrac><mo>-</mo><mfrac><mi>C</mi><mn>36</mn></mfrac></msqrt><mo>&#60;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mfrac><mn>9</mn><mn>4</mn></mfrac><mo>+</mo><mfrac><mn>100</mn><mn>36</mn></mfrac><mo>-</mo><mfrac><mi>C</mi><mn>36</mn></mfrac><mo>&#60;</mo><mfrac><mn>9</mn><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>C</mi><mo>&#62;</mo><mn>100</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8230;</mo><mfenced><mn>1</mn></mfenced></math></p><p>Now, point of intersection of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>4</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>5</mn></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn><mo>)</mo><mo>,</mo></math>&nbsp;which lies inside the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>.</mo></math></p><p>The point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;lies inside a circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>f</mi><mi>y</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn><mo>,</mo></math>&nbsp;if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>x</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>y</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mn>2</mn><mi>g</mi><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><mi>f</mi><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><mi>c</mi><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msup><mfenced><mn>2</mn></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>3</mn><mfenced><mn>2</mn></mfenced><mo>+</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced><mo>+</mo><mfrac><mi>C</mi><mn>36</mn></mfrac><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mn>4</mn><mo>+</mo><mn>1</mn><mo>-</mo><mn>6</mn><mo>-</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><mo>+</mo><mfrac><mi>C</mi><mn>36</mn></mfrac><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>C</mi><mo>&#60;</mo><mn>156</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8230;</mo><mfenced><mn>2</mn></mfenced></math></p><p>From <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>2</mn></mfenced><mo>,</mo></math>&nbsp;we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#60;</mo><mi>C</mi><mo>&#60;</mo><mn>156</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf816", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Jul Shift 1)", "title": "JEE Main 2021 (22 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66902", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "If a variable line&nbsp;<math><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>-</mo><mi>&#955;</mi><mo>=</mo><mn>0</mn></math> is such that the two circles <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>18</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>78</mn><mo>=</mo><mn>0</mn></math> are on its opposite sides, then the set of all values of <math><mi>&#955;</mi></math> is the interval :", "image": null}, "options": [{"id": "7VZbd", "text": "<math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>13</mn><mo>,</mo><mi> </mi><mn>23</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "HfA6i", "text": "<math><mfenced separators=\"|\"><mrow><mn>23</mn><mo>,</mo><mtext> </mtext><mn>31</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "fpAyF", "text": "<math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>12</mn><mo>,</mo><mtext> </mtext><mn>21</mn></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "NJrGM", "text": "<math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mtext> </mtext><mn>17</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given circles&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mn>1</mn><mn>2</mn></msup></math>&nbsp;and</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>18</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>78</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>9</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mn>2</mn><mn>2</mn></msup></math></p><p>Thus, centers of two circles are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mn>9</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math>&nbsp;and radii are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mn>2</mn></math>&nbsp;respectively.</p><p>Since, center&nbsp;of circles are on the opposite side of line&nbsp;<math><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>-</mo><mi>&#955;</mi><mo>=</mo><mn>0</mn></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mn>3</mn><mo>+</mo><mn>4</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mfenced><mrow><mn>27</mn><mo>+</mo><mn>4</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mn>7</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mfenced><mrow><mn>31</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mn>7</mn><mo>,</mo><mi>&#160;</mi><mn>31</mn></mrow></mfenced><mo>&#160;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mfenced separators=\"|\"><mi>i</mi></mfenced></math><br /><br />Since, circles should not intersect given line.</p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\" separators=\"|\"><mfrac><mrow><mn>7</mn><mo>-</mo><mi>&#955;</mi></mrow><msqrt><msup><mn>3</mn><mn>2</mn></msup><mo>+</mo><msup><mn>4</mn><mn>2</mn></msup></msqrt></mfrac></mfenced><mo>&#8805;</mo><mn>1</mn><mtext>&#8201;&#8201;&#8201;</mtext><mo>&#38;</mo><mtext>&#8201;&#8201;&#8201;</mtext><mfenced close=\"|\" open=\"|\" separators=\"|\"><mfrac><mrow><mn>31</mn><mo>-</mo><mi>&#955;</mi></mrow><msqrt><msup><mn>3</mn><mn>2</mn></msup><mo>+</mo><msup><mn>4</mn><mn>2</mn></msup></msqrt></mfrac></mfenced><mo>&#8805;</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mn>7</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mo>&#8805;</mo><mn>5</mn><mtext>&#8201;&#8201;</mtext><mo>&#38;</mo><mtext>&#8201;</mtext><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mn>31</mn><mo>-</mo><mi>&#955;</mi></mrow></mfenced><mo>&#8805;</mo><mn>10</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>&#8804;</mo><mn>2</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>&#8201;</mtext><mi>&#955;</mi><mo>&#8805;</mo><mn>12</mn><mo>&#160;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>&#8804;</mo><mn>21</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>&#8805;</mo><mn>41</mn><mo>&#160;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mi>i</mi></mfenced><mo>&#8745;</mo><mfenced separators=\"|\"><mrow><mi>i</mi><mi>i</mi></mrow></mfenced><mo>&#8745;</mo><mfenced separators=\"|\"><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>&#8712;</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>12,</mn><mo>&#160;</mo><mn>21</mn></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a73417cc3fb48d69351", "title": "line and circle", "totalQuestions": 32, "questions": [{"_id": "69d8073e81239f6567c4f37d", "type": "numerical", "question": {"text": "Let the line $x - y = 4$ intersect the circle $C: (x-4)^2 + (y+3)^2 = 9$ at the points $Q$ and $R$. If $P(\\alpha, \\beta)$ is a point on $C$ such that $PQ = PR$, then $(6\\alpha + 8\\beta)^2$ is equal to __________.", "image": null}, "options": [], "correctValue": "18", "solution": {"text": "The given circle $C: (x-4)^2 + (y+3)^2 = 9$ has its center at $C_0(4, -3)$ and radius $r = 3$.<br><br>The line $QR$ has the equation $x - y = 4$, which has a slope of $1$.<br><br>Since $PQ = PR$, the point $P(\\alpha, \\beta)$ must lie on the perpendicular bisector of the chord $QR$. The perpendicular bisector of any chord of a circle passes through its center. Therefore, the perpendicular bisector passes through $C_0(4, -3)$ and has a slope of $-1$ (since it is perpendicular to $QR$).<br><br>The equation of the perpendicular bisector is:<br>$y - (-3) = -1(x - 4)$<br>$x + y = 1$<br><br>Since $P(\\alpha, \\beta)$ lies on this perpendicular bisector, we have:<br>$\\alpha + \\beta = 1 \\Rightarrow \\beta = 1 - \\alpha$<br><br>Also, $P(\\alpha, \\beta)$ lies on the circle $C$, so its coordinates must satisfy the circle's equation:<br>$(\\alpha - 4)^2 + (\\beta + 3)^2 = 9$<br><br>Substituting $\\beta = 1 - \\alpha$ into the equation:<br>$(\\alpha - 4)^2 + (1 - \\alpha + 3)^2 = 9$<br>$(\\alpha - 4)^2 + (4 - \\alpha)^2 = 9$<br>$2(\\alpha - 4)^2 = 9$<br>$\\alpha - 4 = \\pm \\dfrac{3}{\\sqrt{2}}$<br>$\\alpha = 4 \\pm \\dfrac{3}{\\sqrt{2}}$<br><br>We need to find the value of $(6\\alpha + 8\\beta)^2$. Substituting $\\beta = 1 - \\alpha$:<br>$6\\alpha + 8\\beta = 6\\alpha + 8(1 - \\alpha) = 8 - 2\\alpha$<br><br>Now, substituting the value of $\\alpha$:<br>$8 - 2\\alpha = 8 - 2\\left(4 \\pm \\dfrac{3}{\\sqrt{2}}\\right) = \\mp \\dfrac{6}{\\sqrt{2}} = \\mp 3\\sqrt{2}$<br><br>Squaring this value gives:<br>$(6\\alpha + 8\\beta)^2 = (\\mp 3\\sqrt{2})^2 = 18$<br><br>Answer: $18$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "6bc7e7ac2d6d4d539371006c985c31fa", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cggxXYbQX0Nkd.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cggxXYbQX0Nkd.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eed4c8b73881fdaea341", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}], "question": {"text": "Let a circle $C$ pass through the points $(4,2)$ and $(0,2)$, and its centre lie on $3 x+2 y+2=0$. Then the length of the chord, of the circle $C$, whose mid-point is $(1,2)$, is :", "image": null}, "options": [{"id": "vq2xy", "text": "$\\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "1mxB3", "text": "$2 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "TxQ2Q", "text": "$2 \\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "1coeH", "text": "$4 \\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the centre be\n$\\left(-2 a, \\frac{6 a-2}{2}\\right) \\equiv(-2 a, 3 a-1)$\nCentre is equal distance from $(4,2)$ and $(0,2)$\n$\\begin{aligned} & \\Rightarrow \\sqrt{(4+2 a)^2+(3 a-3)^2}=\\sqrt{(-2 a-0)^2+(3 a-3)^2} \\\\ & \\Rightarrow(2 a+4)^2+9(a-1)^2=4 a^2+9(a-1)^2 \\\\ & \\Rightarrow 4 a^2+16+16 a=4 a^2 \\Rightarrow a=-1 \\\\ & \\Rightarrow \\text { centre } \\equiv(2,-4) \\Rightarrow \\text { Radius }=\\sqrt{40}\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/mo9pueNhdhDjU0vQBlqBS9Zz8Vbf34maYFKLjR5TvbM.original.fullsize.png\"><br>\n$\\begin{aligned} & \\Rightarrow A M^2=(\\sqrt{40})^2-(\\sqrt{37})^2 \\\\ & \\Rightarrow 2 A M=A B=2 \\sqrt{3}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "c2db7647102946988c6eacf0a2d1c14b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/CDKUNiuAR5bJA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/CDKUNiuAR5bJA.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eeccc8b73881fdaea2fa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}], "question": {"text": "Let the line \\(x+y=1\\) meet the circle \\(x^2+y^2=4\\) at the points A and B . If the line perpendicular to \\(A B\\) and passing through the mid point of the chord \\(A B\\) intersects the circle at \\(C\\) and \\(D\\), then the area of the quadrilateral ADBC is equal to :", "image": null}, "options": [{"id": "MDtwd", "text": "\\(\\sqrt{14}\\)", "image": null, "isCorrect": false}, {"id": "P4Eea", "text": "\\(3 \\sqrt{7}\\)", "image": null, "isCorrect": false}, {"id": "QCuL1", "text": "\\(2 \\sqrt{14}\\)", "image": null, "isCorrect": true}, {"id": "A8FYP", "text": "\\(5 \\sqrt{7}\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/j7-kW7BNB551ezhuIMyeJri5UrvgqLz2PAaHweoY6b0.original.fullsize.png\"><br>\n\n\n\nBy solving $\\mathrm{x}=\\mathrm{y}$ with circle We get\n$\\begin{aligned}\n& \\mathrm{C}(\\sqrt{2}, \\sqrt{2}) \\\\\n& \\mathrm{D}(-\\sqrt{2},-\\sqrt{2})\n\\end{aligned}$\n\nBy solving $\\mathrm{x}+\\mathrm{y}=1$ with circle $x^2+y^2=4$\nwe set\n$\\begin{aligned}\n& \\mathrm{A}\\left(\\frac{1+\\sqrt{7}}{2}, \\frac{1-\\sqrt{7}}{2}\\right) \\\\\n& \\& \\mathrm{~B}\\left(\\frac{1-\\sqrt{7}}{2}, \\frac{1+\\sqrt{7}}{2}\\right)\n\\end{aligned}$\n$\\therefore$ Area of Quadrilateral ACBD\n$=2 \\times \\text { Area of } \\triangle \\mathrm{BCD}$\n$\\begin{aligned} & =2 \\times \\frac{1}{2}\\left|\\begin{array}{ccc}\\sqrt{2} & \\sqrt{2} & 1 \\\\ \\frac{1-\\sqrt{7}}{2} & \\frac{1+\\sqrt{7}}{2} & 1 \\\\ -\\sqrt{2} & -\\sqrt{2} & 1\\end{array}\\right| \\\\ & =2 \\sqrt{14}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "e73fe36158d148a3a76140fb745c6e40", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Ha2qs3N4OmfzH.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Ha2qs3N4OmfzH.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446726970e6e9ab542d0a6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}], "question": {"text": "Let $A B C D$ and $A E F G$ be squares of side 4 and 2 units, respectively. The point $E$ is on the line segment $\\mathrm{AB}$ and the point $\\mathrm{F}$ is on the diagonal $\\mathrm{AC}$. Then the radius $\\mathrm{r}$ of the circle passing through the point $\\mathrm{F}$ and touching the line segments $\\mathrm{BC}$ and $\\mathrm{CD}$ satisfies:", "image": null}, "options": [{"id": "dO7TI", "text": "$r=0$", "image": null, "isCorrect": false}, {"id": "4Xa7a", "text": "$2 r^2-4 r+1=0$", "image": null, "isCorrect": false}, {"id": "xx23S", "text": "$2 r^2-8 r+7=0$", "image": null, "isCorrect": false}, {"id": "gpUoV", "text": "$r^2-8 r+8=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/aAVD2KLFjsWiWqQN_eU_coBSvd_UCmxUyVpTUVz_VRg.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/iTnYHNselGaoKVea1pRI1ZGJs-XGvoq_IwKKX2D_9FE.original.fullsize.png\"><br />$\\begin{aligned} & \\mathrm{OF}^2=\\mathrm{r}^2 \\\\ & (2-r)^2+(2-r)^2=\\mathrm{r}^2 \\\\ & \\mathrm{r}^2-8 \\mathrm{r}+8=0\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "a75fb139d2bc47a4af7da1c8b7d9667e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/VTLOurbi4pInr.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/VTLOurbi4pInr.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-27T07:26:57.729Z"}, {"_id": "66446713970e6e9ab542cff9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda69", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}], "question": {"text": "Let $C$ be a circle with radius $\\sqrt{10}$ units and centre at the origin. Let the line $x+y=2$ intersects the circle $\\mathrm{C}$ at the points $\\mathrm{P}$ and $\\mathrm{Q}$. Let $\\mathrm{MN}$ be a chord of $\\mathrm{C}$ of length 2 unit and slope -1. Then, a distance (in units) between the chord PQ and the chord $\\mathrm{MN}$ is", "image": null}, "options": [{"id": "zPErm", "text": "$\\begin{aligned}& 3-\\sqrt{2}  \\end{aligned}$", "image": null, "isCorrect": true}, {"id": "6hR1T", "text": "$\\begin{aligned} &\\sqrt{2}+1 \\end{aligned}$", "image": null, "isCorrect": false}, {"id": "a5Fds", "text": "$\\begin{aligned} &\\sqrt{2}-1 \\end{aligned}$", "image": null, "isCorrect": false}, {"id": "n4wV7", "text": "$\\begin{aligned}& 2-\\sqrt{3}  \\end{aligned}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/GVQYQREfq9ZUcqsIrAAjGxvhJEv53ZDuFj40buT96SE.original.fullsize.png\"><br />$\\begin{aligned}\n& C: x^2+y^2=10 \\\\\n& A N=\\frac{M N}{2}=1 \\\\\n& \\therefore \\text { In } \\triangle O A N \\rightarrow(O N)^2=(O A)^2+(A N)^2 \\\\\n& 10=(O A)^2+1 \\rightarrow O A=3\n\\end{aligned}$<br />Perpendicular distance of center from\n$\\mathrm{PQ}=\\frac{|0+0-2|}{\\sqrt{2}}=\\sqrt{2}$<br />Perpendicular distance between $\\mathrm{MN}$ and\n$\\begin{aligned}\n& \\mathrm{PQ}=\\mathrm{OA}+\\sqrt{2} \\text { or }|\\mathrm{OA}-\\sqrt{2}| \\\\\n& =3+\\sqrt{2} \\text { or } 3-\\sqrt{2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda69", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-29T03:33:01.529Z"}, {"_id": "6682bd3dba0e94a3c4025b69", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "If one of the diameters of the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>10</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>13</mn><mo>=</mo><mn>0</mn></math> is a chord of another circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>, whose center is the point of intersection of the lines <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>12</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>5</mn></math>, then the radius of the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> is", "image": null}, "options": [{"id": "Nm63V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>20</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "SUcp2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "6GFHr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "image": null, "isCorrect": true}, {"id": "acVnA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub><mo>≡</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>10</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>13</mn><mo>=</mo><mn>0</mn></math> with radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>4</mn></math> and its one diameter is chord of other circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> whose centre is given by intersection of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>12</mn><mo> </mo><mo>&amp;</mo><mo> </mo><mn>3</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>5</mn></math> which is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math></p><p>Now, plotting the diagram we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1d8eddbf-eb03-4b28-803a-af62bb56ab30.png\" style=\"width: 200px; height: 227px;\"/></p><p>Now, from above circle the distance between the centres is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><msqrt><msup><mfenced><mrow><mn>5</mn><mo>-</mo><mn>3</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mo>-</mo><mn>2</mn><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>20</mn></msqrt></math></p><p>Hence, radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> will be, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><msup><mfenced><msqrt><mn>20</mn></msqrt></mfenced><mn>2</mn></msup><mo>+</mo><msup><mn>4</mn><mn>2</mn></msup><mo>=</mo><mn>20</mn><mo>+</mo><mn>16</mn><mo>=</mo><mn>36</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>r</mi><mo>=</mo><mn>6</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd3eba0e94a3c4025b6f", "type": "numerical", "level": 2, "questionLabels": [], "question": {"text": "Equations of two diameters of a circle are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>5</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>7</mn></math>. The line joining the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mfrac><mn>1</mn><mn>7</mn></mfrac><mo>,</mo><mn>3</mn></mrow></mfenced></math> intersects the circle at only one point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><mi>α</mi><mo>,</mo><mi>β</mi><mo>)</mo></math>. Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn><mi>β</mi><mo>-</mo><mi>α</mi></math> is equal to", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<p>Given diameters of circle are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>5</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>7</mn></math>.</p><p>We know that, the intersection point of diameters is centre.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mo>+</mo><mn>3</mn><mi>y</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn><mo>+</mo><mn>4</mn><mi>y</mi></mrow><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>15</mn><mo>+</mo><mn>9</mn><mi>y</mi><mo>=</mo><mn>14</mn><mo>+</mo><mn>8</mn><mi>y</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>y</mi><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mo>-</mo><mn>3</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>So, centre of circle is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/98b63f9e-efd2-491d-91f0-d6b99d7d995f.png\" style=\"width: 400px; height: 200px;\"/></p><p>Equation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mfrac><mrow><mn>3</mn><mo>+</mo><mn>4</mn></mrow><mrow><mstyle displaystyle=\"true\"><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>7</mn></mfrac></mstyle><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mn>22</mn><mn>7</mn></mfrac></mstyle></mrow></mfrac><mfenced><mrow><mi>x</mi><mo>+</mo><mfrac><mn>22</mn><mn>7</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mfrac><mn>7</mn><mstyle displaystyle=\"true\"><mn>3</mn></mstyle></mfrac><mfenced><mfrac><mrow><mn>7</mn><mi>x</mi><mo>+</mo><mn>22</mn></mrow><mn>7</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>3</mn><mi>y</mi><mo>+</mo><mn>12</mn><mo>=</mo><mn>7</mn><mi>x</mi><mo>+</mo><mn>22</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>7</mn><mi>x</mi><mo>–</mo><mn>3</mn><mi>y</mi><mo>+</mo><mn>10</mn><mo>=</mo><mn>0</mn><mo> </mo><mo> </mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>Slope of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>,</mo><mo> </mo><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>7</mn><mn>3</mn></mfrac></math></p><p>So, slope of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi><mo>,</mo><mo> </mo><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><msub><mi>m</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>3</mn></mrow><mn>7</mn></mfrac></math></p><p>Equation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi></math> is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>y</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mfenced><mfrac><mrow><mo>-</mo><mn>3</mn></mrow><mn>7</mn></mfrac></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>7</mn><mi>y</mi><mo>+</mo><mn>7</mn><mo>=</mo><mo>-</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>7</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo> </mo><mo> </mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>Solving <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced><mo> </mo><mtext>and</mtext><mo> </mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>y</mi><mo>-</mo><mn>10</mn></mrow><mn>7</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>7</mn><mi>y</mi><mo>-</mo><mn>4</mn></mrow><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>9</mn><mi>y</mi><mo>-</mo><mn>30</mn><mo>=</mo><mo>-</mo><mn>49</mn><mi>y</mi><mo>-</mo><mn>28</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>58</mn><mi>y</mi><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>y</mi><mo>=</mo><mfrac><mn>1</mn><mn>29</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mfenced><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>29</mn></mfrac></mstyle></mfenced><mo>-</mo><mn>10</mn></mrow><mn>7</mn></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>-</mo><mn>290</mn></mrow><mrow><mn>7</mn><mo>×</mo><mn>29</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>41</mn></mrow><mn>29</mn></mfrac></math></p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>41</mn></mrow><mn>29</mn></mfrac><mo>,</mo><mo> </mo><mi>β</mi><mo>=</mo><mfrac><mn>1</mn><mn>29</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>17</mn><mi>β</mi><mo>-</mo><mi>α</mi><mo>=</mo><mfrac><mn>17</mn><mn>29</mn></mfrac><mo>+</mo><mfrac><mn>41</mn><mn>29</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>17</mn><mi>β</mi><mo>-</mo><mi>α</mi><mo>=</mo><mn>2</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd3eba0e94a3c4025b6c", "type": "numerical", "level": 2, "questionLabels": [], "question": {"text": "Consider a circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>-</mo><msup><mi>α</mi><mn>2</mn></msup></mrow></mfenced><mo>+</mo><mfenced><mrow><mi>y</mi><mo>-</mo><msup><mi>β</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mn>50</mn></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>,</mo><mi>β</mi><mo>&gt;</mo><mn>0</mn></math>. If the circle touches the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mi>x</mi><mo>=</mo><mn>0</mn></math> at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>, whose distance from the origin is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msqrt><mn>2</mn></msqrt></math> , then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>α</mi><mo>+</mo><mi>β</mi><msup><mo>)</mo><mn>2</mn></msup></math> is equal to _______.", "image": null}, "options": [], "correctValue": "100", "solution": {"text": "<p>Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>-</mo><msup><mi>α</mi><mn>2</mn></msup></mrow></mfenced><mo>+</mo><mfenced><mrow><mi>y</mi><mo>-</mo><msup><mi>β</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mn>50</mn></math></p><p>The given equation of circle represent centre as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>α</mi><mo>,</mo><mi>β</mi></mrow></mfenced></math> and radius as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><msqrt><mn>2</mn></msqrt></math> units.</p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>0</mn></math> is tangent to the given circle at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ae7518bf-d085-4558-a804-b3ee87124b65.png\" style=\"width: 300px; height: 262px;\"/></p><p>We know that, radius is perpendicular to tangent at the point of tangency.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>C</mi><mi>P</mi><mo>⊥</mo><mfenced><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>0</mn></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi><mo>=</mo><mi>r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>r</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mi>α</mi><mo>×</mo><mn>1</mn><mo>+</mo><mi>β</mi><mo>×</mo><mn>1</mn></mrow><msqrt><msup><mn>1</mn><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup></msqrt></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>5</mn><msqrt><mn>2</mn></msqrt><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow><msqrt><mn>2</mn></msqrt></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>50</mn><mo>=</mo><mfrac><msup><mfenced><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow></mfenced><mn>2</mn></msup><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mfenced><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>100</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabusButGoodToSolve", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436baff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T14:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 2)", "title": "JEE Main 2024 (27 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436baff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T14:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 2)", "title": "JEE Main 2024 (27 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d6864a", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "<p>Two circles in the first quadrant of radii <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>2</mn></msub></math>&nbsp;touch the coordinate axes. Each of them cuts off an intercept of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> units with the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>2</mn></math>. Then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>r</mi><mn>1</mn></msub><mn>2</mn></msup><mo>+</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mn>2</mn></msup><mo>-</mo><msub><mi>r</mi><mn>1</mn></msub><msub><mi>r</mi><mn>2</mn></msub></math>&nbsp;is equal to ____.</p>", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "<p>Assuming a circle of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;which touches both the axis is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mi>r</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mi>r</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math></p><p>Now given&nbsp;line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>2</mn></math>&nbsp;makes the intercept&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>&nbsp;the circle, so plotting the diagram we get,</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8e1a4e96-6356-450b-b4fa-74ab2ce3d843-9927633.PNG\" style=\"width: 325px; height: 291px;\" /></p><p>Now from diagram,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>C</mi><mo>=</mo><mi>B</mi><mi>C</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>O</mi><mi>C</mi><mo>=</mo><msqrt><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mn>1</mn></msqrt></math></p><p>Now using the formula of perpendicular distance of point from the line we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>C</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mn>2</mn><mi>r</mi><mo>-</mo><mn>2</mn></mrow><msqrt><mn>2</mn></msqrt></mfrac></mfenced><mo>=</mo><msqrt><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mn>1</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msup><mfenced><mrow><mi>r</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>r</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><msub><mi>r</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn></math></p><p>Hence, &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>r</mi><mn>1</mn></msub><mn>2</mn></msup><mo>+</mo><msup><msub><mi>r</mi><mn>2</mn></msub><mn>2</mn></msup><mo>-</mo><msub><mi>r</mi><mn>1</mn></msub><msub><mi>r</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mo>+</mo><mn>9</mn><mo>-</mo><mn>3</mn><mo>=</mo><mn>7</mn></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn":
