lse}, {"id": "8LXCO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>5</mn></mfrac><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mo>&#160;</mo><mi>units</mi></math>", "image": null, "isCorrect": false}, {"id": "CnvSQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mo>&#160;</mo><mi>units</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/006307bd-7b14-4cf6-bc2f-b7712275b78d-image.png\" style=\"width: 280px; height: 255px;\" /></p><p>To find point of intersection of two given curves</p><p>Put <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mo>-</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>x</mi><mo>=</mo><mo>&#177;</mo><mn>1</mn></math></p><p>Let the given equations be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>-</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>y</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup></math>.</p><p>The desired area would be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mo>&#8747;</mo><mrow><mo>-</mo><mn>1</mn></mrow><mn>1</mn></msubsup><mfenced separators=\"|\"><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>-</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mi>d</mi><mi>x</mi><mi>&#160;</mi><mo>=</mo><msubsup><mo>&#8747;</mo><mrow><mo>-</mo><mn>1</mn></mrow><mn>1</mn></msubsup><mfenced separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced></mrow></mfenced><mi>d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msubsup><mo>&#8747;</mo><mrow><mo>-</mo><mn>1</mn></mrow><mn>1</mn></msubsup><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mi>d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msubsup><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mi>&#160;</mi><mfrac><msup><mi>x</mi><mn>3</mn></msup><mn>3</mn></mfrac></mrow></mfenced><mrow><mo>-</mo><mn>1</mn></mrow><mn>1</mn></msubsup><mo>=</mo><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow></mfenced><mo>-</mo><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow></mfenced></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>-</mo><mi>&#160;</mi><mfenced separators=\"|\"><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><mn>3</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mo>&#160;</mo><mi>units</mi></math> .</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65d00", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}], "question": {"text": "Let $f:[-2,3] \\rightarrow[0, \\infty)$ be a continuous function such that $f(1-x)=f(x)$ for all $x \\in[-2,3]$.\nIf $\\mathrm{R}_1$ is the numerical value of the area of the region bounded by $y=f(x), x=-2, x=3$ and the axis of $x$ and $R_2=\\int_{-2}^3 x f(x) d x$, then :", "image": null}, "options": [{"id": "6gzTD", "text": "\n$3 R_1=2 R_2$\n", "image": null, "isCorrect": false}, {"id": "FK0AW", "text": "\n$2 \\mathrm{R}_1=3 \\mathrm{R}_2$\n", "image": null, "isCorrect": false}, {"id": "NzhGp", "text": "\n$\\mathrm{R}_1=\\mathrm{R}_2$\n", "image": null, "isCorrect": false}, {"id": "m5pjm", "text": "\n$\\mathrm{R}_1=2 \\mathrm{R}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have\n$$\n\\begin{aligned}\n\\mathrm{R}_2 &=\\int_{-2}^3 x f(x) d x=\\int_{-2}^3(1-x) f(1-x) d x \\\\\n& {\\left[\\mathrm{U} \\operatorname{sing} \\int_a^b f(x) d x=\\int_a^b f(a+b-x) d x\\right] } \\\\\n\\Rightarrow \\mathrm{R}_2 &=\\int_{-2}^3(1-x) f(x) d x \\\\\n\\therefore \\mathrm{R}_2+\\mathrm{R}_2 &=\\int_{-2}^3 x f(x) d x+\\int_{-2}^3(1-x) f(x) d x \\\\\n\\Rightarrow 2 \\mathrm{R}_2=\\mathrm{R}_1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a95", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "The area of the region bounded by the curve $y=x^3$, and the lines, $y=8$, and $x=0$, is", "image": null}, "options": [{"id": "GtGoV", "text": "\n8\n", "image": null, "isCorrect": false}, {"id": "zqZyc", "text": "\n12\n", "image": null, "isCorrect": true}, {"id": "8BjL3", "text": "\n10\n", "image": null, "isCorrect": false}, {"id": "rMZHY", "text": "\n16", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Required Area $=\\int_{y=0}^8 y^{1 / 3} d y$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/HuoO0VjglnVZ08iD6g8Yyb60kYp5Z-KsYUbkpPB13HA.original.fullsize.png\"><br>\n\n$$\n\\begin{aligned}\n& =\\left.\\frac{y^{1 / 3+1}}{\\frac{1}{3}+1}\\right|_0 ^8=\\left.\\frac{3}{4}\\left(y^{4 / 3}\\right)\\right|_0 ^8 \\\\\n& =\\frac{3}{4}\\left[(8)^{4 / 3}-0\\right]=\\frac{3}{4}\\left[2^4\\right] \\\\\n& =\\frac{3}{4} \\times 16=12 \\text { sq. unit. }\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6598b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "The area of the region enclosed by the curves $y=x, x=e, y=\\frac{1}{x}$ and the positive $x$-axis is", "image": null}, "options": [{"id": "8q2bD", "text": "\n1 square units\n", "image": null, "isCorrect": false}, {"id": "FJXet", "text": "\n$\\frac{3}{2}$ square units\n", "image": null, "isCorrect": true}, {"id": "OQPbm", "text": "\n$\\frac{5}{2}$ square units\n", "image": null, "isCorrect": false}, {"id": "eSK0S", "text": "\n$\\frac{1}{2}$ square units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ytCFh6LNso86BvSKnsToL_lFkZAZ0QIbRKnc5H_Y8Iw.original.fullsize.png\"><br>\nArea $=\\int_0^1 x d x+\\int_1^e \\frac{1}{x} d x=\\frac{1}{2}+1=\\frac{3}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65459", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "The area bounded by the curves $y=\\ln x, y=\\ln |x|, y=|\\ln x|$ and $y=|\\ln ||x|$ is", "image": null}, "options": [{"id": "twwYo", "text": "\n4 sq. units\n", "image": null, "isCorrect": true}, {"id": "GOU9x", "text": "\n6 sq. units\n", "image": null, "isCorrect": false}, {"id": "g596U", "text": "\n10 sq. units\n", "image": null, "isCorrect": false}, {"id": "mcRgm", "text": "\nnone of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
</body>
</html>
