eviousYear": {"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c44", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "The area of the region (in sq. units), in the first quadrant bounded by the parabola $y=9 x^2$ and the lines $x=0, y=1$ and $y=4$, is :", "image": null}, "options": [{"id": "msQvY", "text": "\n$7 / 9$\n", "image": null, "isCorrect": false}, {"id": "FK9eD", "text": "\n$14 / 3$\n", "image": null, "isCorrect": false}, {"id": "7HrYW", "text": "\n$7 / 3$\n", "image": null, "isCorrect": false}, {"id": "9YVUC", "text": "\n$14 / 9$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\text { Required area }=\\int_{y=1}^4 \\sqrt{\\frac{y}{9}} d y \\\\\n& =\\frac{1}{3} \\int_{y=1}^4 y^{1 / 2} d y=\\frac{1}{3} \\times\\left.\\frac{2}{3}\\left(y^{3 / 2}\\right)\\right|_1 ^4 \\\\\n& =\\frac{2}{9}\\left[\\left(4^{1 / 2}\\right)^3-\\left(1^{1 / 2}\\right)^3\\right]=\\frac{2}{9}[8-1]\n\\end{aligned}\n$$\n\n$$\n=\\frac{2}{9} \\times 7=\\frac{14}{9} \\text { sq. units. }\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65bef", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "The area bounded by the curve $y=\\ln (x)$ and the lines $y=0, y=\\ln (3)$ and $x=0$ is equal to:", "image": null}, "options": [{"id": "o3W1n", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "vEDQG", "text": "\n$3 \\ln (3)-2$\n", "image": null, "isCorrect": false}, {"id": "MI1tF", "text": "\n$3 \\ln (3)+2$\n", "image": null, "isCorrect": false}, {"id": "T8M1M", "text": "\n2", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "To find the point of intersection of curves\n$$\n\\begin{aligned}\n& y=\\ln (x) \\text { and } y=\\ln (3), \\text { put } \\ln (x)=\\ln (3) \\\\\n\\Rightarrow & \\ln (x)-\\ln (3)=0 \\\\\n\\Rightarrow & \\ln (x)-\\ln (3)=\\ln (1) \\\\\n\\Rightarrow & \\frac{x}{3}=1, \\Rightarrow x=3\n\\end{aligned}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/TCSAheZShxa-gIwL3bXzTJ7hXNJ59QnJynq4IRjt12M.original.fullsize.png\"><br>\n$\\begin{aligned} \\text { Required area } & =\\int_0^3 \\ln (3) d x-\\int_1^3 \\ln (x) d x \\\\ = & {[x \\ln (3)]_0^3-\\left[x \\ln (x)-x_1^3=2\\right.}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b97", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "<p>The area (in square units) bounded by the curves <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mi>=</mi><msqrt><mi>x</mi></msqrt><mo>,</mo><mo>&#160;</mo><mn>2</mn><mi>y</mi><mo>-</mo><mi>x</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>-axis and lying in the first quadrant is</p>", "image": null}, "options": [{"id": "cE8C3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mn>8</mn><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mo>&#160;</mo><mi>units</mi></math>", "image": null, "isCorrect": false}, {"id": "ZH83U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mn>7</mn></mrow><mn>4</mn></mfrac><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mo>&#160;</mo><mi>units</mi></math>", "image": null, "isCorrect": false}, {"id": "pO0oL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mo>&#160;</mo><mi>units</mi></math>", "image": null, "isCorrect": true}, {"id": "SHLjh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mn>6</mn><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mo>&#160;</mo><mi>units</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c59486df-fadc-4ac9-99fb-f6e281949caf-image.png\" style=\"width: 303px; height: 230px;\" /><br />First draw the given curves and represent the required area.<br /><br />Eliminate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">x</mo></math> to find point of intersection of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msqrt><mi>x</mi></msqrt></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">2</mi><mi>y</mi><mo>-</mo><mi>x</mi><mo>+</mo><mi mathvariant=\"normal\">3</mi><mo>=</mo><mi mathvariant=\"normal\">0</mi></math><br /><br /><math><mo>&#8658;</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>y</mi><mi>-</mi><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>&#8658;</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>y</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mfenced><mrow><mi>y</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>1</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>Required area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><munderover><mo>&#8747;</mo><mn>0</mn><mn>9</mn></munderover><msqrt><mi>x</mi></msqrt><mi>d</mi><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>6</mn><mo>&#215;</mo><mn>3</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><msubsup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><msup><mi>x</mi><mfrac><mn>3</mn><mn>2</mn></mfrac></msup><mfrac><mn>3</mn><mn>2</mn></mfrac></mfrac><mi>&#160;</mi></mrow></mfenced><mn>0</mn><mn>9</mn></msubsup><mo>-</mo><mn>9</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><mo>-</mo><mn>9</mn></math></p><p>Hence, area is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mo>&#160;</mo><mi>units</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65ae2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "The area bounded by the parabola $y^2=4 x$ and the line $2 x-3 y+4=0$, in square unit, is", "image": null}, "options": [{"id": "dCoqC", "text": "\n$\\frac{2}{5}$\n", "image": null, "isCorrect": false}, {"id": "F3aq4", "text": "\n$\\frac{1}{3}$\n", "image": null, "isCorrect": true}, {"id": "MBuKe", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "Z9SwQ", "text": "\n$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Intersecting points are $x=1,4$\n$$\n\\begin{aligned}\n& \\therefore \\text { Required area }=\\int_1^4\\left[2 \\sqrt{x}-\\left(\\frac{2 x+4}{3}\\right)\\right] d x \\\\\n& =\\left.\\frac{2 x^{3 / 2}}{3 / 2}\\right|_1 ^4-\\left.\\frac{2 x^2}{3 \\times 2}\\right|_1 ^4-\\left.\\frac{4}{3} x\\right|_1 ^4\n\\end{aligned}\n$$\n\n$$\n\\begin{aligned}\n& =\\frac{4}{3}\\left(4^{3 / 2}-1^{3 / 2}\\right)-\\frac{1}{3}(16-1)\\left[\\frac{4}{3}(4)-\\frac{4}{3}\\right] \\\\\n& =\\frac{4}{3}(7)-5-4=\\frac{28}{3}-9=\\frac{28-27}{3}=\\frac{1}{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a40", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "If a straight line $y-x=2$ divides the region $x^2+y^2 \\leq 4$ into two parts, then the ratio of the area of the smaller part to the area of the greater part is", "image": null}, "options": [{"id": "EWgUz", "text": "\n$3 \\pi-8: \\pi+8$\n", "image": null, "isCorrect": false}, {"id": "KrO6o", "text": "\n$\\pi-3: 3 \\pi+3$\n", "image": null, "isCorrect": false}, {"id": "XxRwk", "text": "\n$3 \\pi-4: \\pi+4$\n", "image": null, "isCorrect": false}, {"id": "SjGBC", "text": "\n$\\pi-2: 3 \\pi+2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let I be the smaller portion and II be the greater portion of the given figure then,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/JbvFxsNE9Uu0hcprLR8MOp72G0CtZTy30tjJWmkQXzQ.original.fullsize.png\"><br>\nArea of $I=\\int_{-2}^0\\left[\\sqrt{4-x^2}-(x+2] d x\\right.$\n$$\n\\begin{aligned}\n& =\\left[\\frac{x}{2} \\sqrt{4-x^2}+\\frac{4}{2} \\sin ^{-1}\\left(\\frac{x}{2}\\right)\\right]_{-2}^0-\\left[\\frac{x^2}{2}+2 x\\right]_{-2}^0 \\\\\n& =\\left[2 \\sin ^{-1}(-1)\\right]-\\left[-\\frac{4}{2}+4\\right]=2 \\times \\frac{\\pi}{2}-2=\\pi-2\n\\end{aligned}\n$$\nNow, area of $\\mathrm{II}=$ Area of circle $-$ area of $\\mathrm{I}$.\n$$\n\\begin{aligned}\n& =4 \\pi-(\\pi-2) \\\\\n& =3 \\pi+2\n\\end{aligned}\n$$\nHence, required ratio $=\\frac{\\text { area of I }}{\\text { area of II }}=\\frac{\\pi-2}{3 \\pi+2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a37", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "The area enclosed by the curves $y=x^2, y=x^3$, $x=0$ and $x=p$, where $p>1$, is $1 / 6$. The $\\mathrm{p}$ equals", "image": null}, "options": [{"id": "S0uZ1", "text": "\n$8 / 3$\n", "image": null, "isCorrect": false}, {"id": "7Av1a", "text": "\n$16 / 3$\n", "image": null, "isCorrect": false}, {"id": "zfaJA", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "adu4y", "text": "\n$4 / 3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given curves are $y=x^2$ and $y=x^3$ Also, $x=0$ and $x=p, p>1$ Now, intersecting point is $(1,1)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/NOjMfJD_aJMO6h0oDJSKErm6eGAjZUmGp__TJw6EFWM.original.fullsize.png\"><br>\nRequired Area\n$$\n\\begin{aligned}\n& =\\int_0^1\\left(x^2-x^3 d x+\\int_1^p x^3\\right)-x^2 d x \\\\\n& \\frac{1}{6}=\\frac{x^3}{3}-\\left.\\frac{x^4}{4}\\right|_0 ^1+\\frac{x^4}{4}-\\left.\\frac{x^3}{3}\\right|_1 ^p \\\\\n& \\Rightarrow \\frac{1}{6}=\\left(\\frac{1}{3}-\\frac{1}{4}\\right)+\\left(\\frac{p^4}{4}-\\frac{p^3}{3}-\\frac{1}{4}+\\frac{1}{3}\\right) \\\\\n& \\Rightarrow \\frac{1}{6}-\\frac{1}{3}+\\frac{1}{4}+\\frac{1}{4}-\\frac{1}{3}=\\frac{3 p^4-4 p^3}{12} \\\\\n& \\left.\\Rightarrow \\frac{p^3(3 p-4}{12}\\right)=0 \\Rightarrow p^3(3 p-4)=0 \\\\\n& \\Rightarrow p=0 \\text { or } \\frac{4}{3} \\\\\n& \\text { Since, it is given that } p>1 \\\\\n& \\therefore p \\text { can not be zero. } \\\\\n& \\text { Hence, } p=\\frac{4}{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659d4", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "The parabola $y^2=x$ divides the circle $x^2+y^2=2$ into two parts whose areas are in the ratio", "image": null}, "options": [{"id": "JAhhS", "text": "\n$9 \\pi+2: 3 \\pi-2$\n", "image": null, "isCorrect": false}, {"id": "Q1Kvj", "text": "\n$9 \\pi-2: 3 \\pi+2$\n", "image": null, "isCorrect": true}, {"id": "RBn9h", "text": "\n$7 \\pi-2: 2 \\pi-3$\n", "image": null, "isCorrect": false}, {"id": "aD174", "text": "\n$7 \\pi+2: 3 \\pi+2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fzwddGOwHhq--X3Tgnp7CruPrIsOB3NvUibsBnhclpE.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n& \\text { Area of circle }=\\pi(\\sqrt{2})^2=2 \\pi \\\\\n& \\text { Area of } O C A D O=2\\{\\text { Area of } O C A O\\} \\\\\n& \\quad=2 \\text { area of } O C B+\\text { area of } B C A\\} \\\\\n& =2 \\int_0^1 y_p d x+2 \\int_1^{\\sqrt{2}} y_c d x \\\\\n& \\text { where } y_p=\\sqrt{x} \\text { and } y_c=\\sqrt{2-x^2} \\\\\n& \\therefore \\text { Required Area } \\\\\n& =2 \\int \\frac{1}{x} d x+2 \\int_0^{\\sqrt{2}} \\sqrt{2-x^2} d x \\\\\n& =2\\left[\\frac{2}{3} \\cdot 1-0\\right]+2\\left[\\frac{x \\sqrt{2-x^2}}{2}+\\sin ^{-1} \\frac{x}{\\sqrt{2}}\\right]_1^{\\sqrt{2}}\n\\end{aligned}\n$$\n\n$$\n\\begin{aligned}\n& =\\frac{4}{3}+2\\left\\{\\frac{\\pi}{2}-\\frac{\\pi}{4}-\\frac{1}{2}\\right\\}=\\frac{4}{3}+2\\left\\{\\frac{\\pi}{4}-\\frac{1}{2}\\right\\}=\\frac{3 \\pi+2}{6} \\\\\n& \\text { Bigger area }=2 \\pi-\\frac{3 \\pi+2}{6}=\\frac{9 \\pi-2}{6} \\\\\n& \\therefore \\text { Required Ratio }=\\frac{9 \\pi-2}{3 \\pi+2} \\text { i.e., } 9 \\pi-2: 3 \\pi+2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b41", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}], "question": {"text": "The area bounded between the parabolas $x^2=\\frac{y}{4}$ and $x^2=9 y$, and the straight line $y=2$ is", "image": null}, "options": [{"id": "wrJbZ", "text": "\n$20 \\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "6L4lP", "text": "\n$\\frac{10 \\sqrt{2}}{3}$\n", "image": null, "isCorrect": false}, {"id": "iwrs1", "text": "\n$\\frac{20 \\sqrt{2}}{3}$\n", "image": null, "isCorrect": true}, {"id": "TEvYe", "text": "\n$10 \\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Required area\n$\\begin{aligned}\n& A=2\\left[\\int_0^2\\left(3 \\sqrt{y}-\\frac{\\sqrt{y}}{2}\\right) d y\\right]=2 \\int_0^2 \\frac{5 \\sqrt{y}}{2} d y \\\\\n& =5\\left[\\frac{y^{3 / 2}}{3 / 2}\\right]_0^2=\\frac{10}{3}\\left[2^{3 / 2}-0\\right]=\\frac{20 \\sqrt{2}}{3}\n\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fWHtA4DS4sWU-eu8q4PM8bS_o6_CztJVndJntFL6rpM.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6591a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "The area bounded by the curves $y=\\cos x$ and $y=\\sin x$ between the ordinates $x=0$ and $x=\\frac{3 \\pi}{2}$ is", "image": null}, "options": [{"id": "88WYH", "text": "\n$4 \\sqrt{2}+2$\n", "image": null, "isCorrect": false}, {"id": "fZh2y", "text": "\n$4 \\sqrt{2}-1$\n", "image": null, "isCorrect": false}, {"id": "PM4TI", "text": "\n$4 \\sqrt{2}+1$\n", "image": null, "isCorrect": false}, {"id": "v6Vc3", "text": "\n$4 \\sqrt{2}-2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\int_0^{\\frac{\\pi}{4}}(\\cos x-\\sin x) d x+\\int_{\\frac{\\pi}{4}}^{\\frac{5 \\pi}{4}}(\\sin x-\\cos x) d x+\\int_{\\frac{5 \\pi}{4}}^{\\frac{3 \\pi}{2}}(\\cos x-\\sin x)=4 \\sqrt{2}-2$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/hDVXhcGrk8n_4SsHJ20WO09-8lTHnbLiTX1G-zOjg2c.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d658d1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "The area of the region bounded by the parabola $(y-2)^2=x-1$, the tangent to the parabola at the point $(2,3)$ and the $x$-axis is", "image": null}, "options": [{"id": "WViu2", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "BWXSE", "text": "\n6\n", "image": null, "isCorrect": false}, {"id": "jVTQX", "text": "\n9\n", "image": null, "isCorrect": true}, {"id": "ryinD", "text": "\n12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of tangent at $(2,3)$ to\n$$\n\\begin{aligned}\n& (y-2)^2=x-1 \\text { is } S_1=0 \\\\\n& \\Rightarrow x-2 y+4=0\n\\end{aligned}\n$$\nRequired Area $=$ Area of $\\triangle O C B+$ Area of OAPD - Area of $\\triangle P C D$\n$$\n\\begin{aligned}\n& =\\frac{1}{2}(4 \\times 2)+\\int_0^3\\left(y^2-4 y+5\\right) d y-\\frac{1}{2}(1 \\times 2) \\\\\n& =4+\\left[\\frac{y^3}{3}-2 y^2+5 y\\right]_0^3-1=4-9-18+15-1 \\\\\n& =28-19=9 \\text { sq. units }\n\\end{aligned}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/R4JZ6unjbZ0eLecweDYM2Q5_TFikGBm1Ykf9v2IdkM4.original.fullsize.png\"><br>\n$$\n\\text { (or) }\n$$\n\n$$\n\\text { Area }=\\int_0^3\\left(2 y-4-y^2+4 y-5\\right) d y=\\int_0^3\\left(-y^2+6 y-5\\right) d y=-\\int_0^3(3-y)^2 d y=\\left[\\frac{(y-3)^3}{3}\\right]_0^3=\\frac{27}{3}=9 \\text { sq.units }\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65879", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}], "question": {"text": "The area of the plane region bounded by the curves $x+2 y^2=0$ and $x+3 y^2=1$ is equal to", "image": null}, "options": [{"id": "vm2nW", "text": "\n$\\frac{5}{3}$\n", "image": null, "isCorrect": false}, {"id": "i6R9j", "text": "\n$\\frac{1}{3}$\n", "image": null, "isCorrect": false}, {"id": "A8eFZ", "text": "\n$\\frac{2}{3}$\n", "image": null, "isCorrect": false}, {"id": "qGiEF", "text": "\n$\\frac{4}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Solving the equations we get the points of intersection $(-2,1)$ and $(-2,-1)$\nThe bounded region is shown as shaded region.\n$$\n\\begin{aligned}\n& \\text { The required area }=2 \\int_0^1\\left(1-3 y^2\\right)-\\left(-2 y^2\\right) \\\\\n& =2 \\int_0^1\\left(1-y^2\\right) d y=2\\left[y-\\frac{y^3}{3}\\right]_0^1=2 \\times \\frac{2}{3}=\\frac{4}{3} .\n\\end{aligned}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6ks_u_C7uIfyc-XwmaLvr7-H92Y9SsLT-6bf_vVoZyk.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65814", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}], "question": {"text": "The area enclosed between the curves $y^2=x$ and $y=|x|$ is", "image": null}, "options": [{"id": "7E8Ux", "text": "\n$2 / 3$\n", "image": null, "isCorrect": false}, {"id": "42cQT", "text": "\n$1$\n", "image": null, "isCorrect": false}, {"id": "n8Hl1", "text": "\n$1 / 6$\n", "image": null, "isCorrect": true}, {"id": "upcAp", "text": "\n$1 / 3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$A=\\int_0^1(\\sqrt{x}-x) d x$\n$=\\left[\\frac{2}{3} x^{3 / 2}-\\frac{x^2}{2}\\right]_0^1$\n$=\\frac{2}{3}-\\frac{1}{2}=\\frac{1}{6}$.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/N4iFODxA066V2v36QU3cbbTNBQqtpPsvT5-CnCoXmFc.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656ea", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "Let $f(x)$ be a non-negative continuous function such that the area bounded by the curve $y=f(x), x$-axis and the ordinates $x=\\frac{\\pi}{4}$ and $x=\\beta>\\frac{\\pi}{4}$ is $\\left(\\beta \\sin \\beta+\\frac{\\pi}{4} \\cos \\beta+\\sqrt{2} \\beta\\right)$. Then $f\\left(\\frac{\\pi}{2}\\right)$ is", "image": null}, "options": [{"id": "Errue", "text": "\n$\\left(\\frac{\\pi}{4}+\\sqrt{2}-1\\right)$\n", "image": null, "isCorrect": false}, {"id": "gIgy4", "text": "\n$\\left(\\frac{\\pi}{4}-\\sqrt{2}+1\\right)$\n", "image": null, "isCorrect": false}, {"id": "FCqNE", "text": "\n$\\left(1-\\frac{\\pi}{4}-\\sqrt{2}\\right)$\n", "image": null, "isCorrect": false}, {"id": "eO9BF", "text": "\n$\\left(1-\\frac{\\pi}{4}+\\sqrt{2}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given that $\\int_{\\pi / 4}^\\beta f(x) d x=\\beta \\sin \\beta+\\frac{\\pi}{4} \\cos \\beta+2 \\beta$\nDifferentiating w. r. t $\\beta$\n$f(\\beta)=\\beta \\cos \\beta+\\sin \\beta-\\frac{\\pi}{4} \\sin \\beta+\\sqrt{2}$\n$f\\left(\\frac{\\pi}{2}\\right)=\\left(1-\\frac{\\pi}{4}\\right) \\sin \\frac{\\pi}{2}+\\sqrt{2}=1-\\frac{\\pi}{2}+\\sqrt{2}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656e4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "The parabolas $\\mathrm{y}^2=4 \\mathrm{x}$ and $\\mathrm{x}^2=4 \\mathrm{y}$ divide the square region bounded by the lines $\\mathrm{x}=$ $4, y=4$ and the coordinate axes. If $S_1, S_2, S_3$ are respectively the areas of these parts numbered from top to bottom; then $\\mathrm{S}_1: \\mathrm{S}_2: \\mathrm{S}_3$ is", "image": null}, "options": [{"id": "YhOvo", "text": "\n$1: 2: 1$\n", "image": null, "isCorrect": false}, {"id": "Cdcgl", "text": "\n$1: 2: 3$\n", "image": null, "isCorrect": false}, {"id": "kBwoa", "text": "\n$2: 1: 2$\n", "image": null, "isCorrect": false}, {"id": "rnMwb", "text": "\n$1: 1: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{y}^2=4 \\mathrm{x}$ and $\\mathrm{x}^2=4 \\mathrm{y}$ are symmetric about line $\\mathrm{y}=\\mathrm{x}$\n$\\Rightarrow$ area bounded between $y^2=4 x$ and $y=x$ is $\\int_0^4(2 \\sqrt{x}-x) d x=\\frac{8}{3}$\n$\\Rightarrow \\mathrm{A}_{\\mathrm{s}_2}=\\frac{16}{3}$ and $\\mathrm{A}_{\\mathrm{s}_1}=\\mathrm{A}_{\\mathrm{s}_3}=\\frac{16}{3}$\n$\\Rightarrow A_{s_1}: A_{s_2}: A_{s_3}:: 1: 1: 1$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65606", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "The area of the region bounded by the curves $y=|x-2|, x=1, x=3$ and the $x$-axis is", "image": null}, "options": [{"id": "if0QT", "text": "\n1\n", "image": null, "isCorrect": true}, {"id": "zW9cl", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "70JB8", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "IKxGG", "text": "\n4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Area $=\\int_1^2(2-x) d x+\\int_2^3(x-2) d x=1$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/yt3wxHAfgDRsqLL2O6Zseluz9FcWsK0XGRrcNKrsZDE.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65514", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "The area of the region bounded by the curves $y=|x-1|$ and $y=3-|x|$ is", "image": null}, "options": [{"id": "nm7p3", "text": "\n6 sq. units\n", "image": null, "isCorrect": false}, {"id": "CodaZ", "text": "\n2 sq. units\n", "image": null, "isCorrect": false}, {"id": "LJfZN", "text": "\n3 sq. units\n", "image": null, "isCorrect": false}, {"id": "sAenM", "text": "\n4 sq. units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Br25KL-OShwGlcMedA4xxPAVYHJDjhf3hTTC1fS98Us.original.fullsize.png\"><br>\n$A=\\int_{-1}^0\\{(3+x)-(-x+1)\\} d x+\\int_0^1\\{(3-x)-(-x+1)\\} d x+\\int_1^2\\{(3-x)-(-x-1)\\} d x$\n$=\\int_{-1}^0(2+2 x) d x+\\int_0^1 2 d x+\\int_1^2(4-2 x) d x$\n$=\\left[2 x-x^2\\right]_{-1}^0+[2 x]_0^1+\\left[4 x-x^2\\right]_1^2$\n$=0-(-2+1)+(2-0)+(8-4)-(4-1)$\n$=1+2+4-3=4$ sq. units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d6936c", "title": "Area bounded by Miscellaneous Curves", "totalQuestions": 36, "questions": [{"_id": "67a2eeccc8b73881fdaea2fb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}], "question": {"text": "Let the area of the region \\(\\left\\{(x, y): 2 y \\leq x^2+3, y+|x| \\leq 3, y \\geqslant|x-1|\\right\\}\\) be A. Then 6 A is equal to :", "image": null}, "options": [{"id": "LQrsb", "text": "16", "image": null, "isCorrect": false}, {"id": "Lc38V", "text": "12", "image": null, "isCorrect": false}, {"id": "EqpwO", "text": "14", "image": null, "isCorrect": true}, {"id": "0m0bU", "text": "18", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7ed71LgKutJLV2SYLkCvYGtnO6nT8P9_Xj7RDULELJo.original.fullsize.png\"><br>\n\n\n\n$A \\Rightarrow$ Rectangle ABDE - Area of region EDC\n\n\n$\\begin{aligned}\n& A \\Rightarrow 4-2 \\int_0^1(3-x)-\\left(\\frac{x^2+3}{2}\\right) d x \\\\\n& A \\Rightarrow 4-2\\left\\{3 x-\\frac{x^2}{2}-\\frac{x^3}{6}-\\frac{3}{2} x\\right\\}_0^1 \\\\\n& A \\Rightarrow 4-2\\left\\{3-\\frac{1}{2}-\\frac{1}{6}-\\frac{3}{2}\\right\\}=\\frac{7}{3}\n\\end{aligned}$\n\nSo $6 \\mathrm{~A}=14$", "image": null}, "videoSolution": {"videoId": "071aa18510dd4adda8958cc700739962", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ZriYweWA2rd6c.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ZriYweWA2rd6c.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eea0c8b73881fdaea184", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}], "question": {"text": "If the area of the region $\\left\\{(x, y):-1 \\leq x \\leq 1,0 \\leq y \\leq a+\\mathrm{e}^{|x|}-\\mathrm{e}^{-x}, \\mathrm{a}\\gt0\\right\\}$ is $\\frac{\\mathrm{e}^2+8 \\mathrm{e}+1}{\\mathrm{e}}$, then the value of $a$ is :", "image": null}, "options": [{"id": "cYyTb", "text": "8", "image": null, "isCorrect": false}, {"id": "lK3p3", "text": "7", "image": null, "isCorrect": false}, {"id": "BxIm8", "text": "5", "image": null, "isCorrect": true}, {"id": "BCaea", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & y \\in\\left[0, a+e^{|x|}-e^{-x}\\right] \\\\ & \\text { (i) If } x \\geq 0 \\Rightarrow y \\in\\left(0, a+e^x-\\frac{1}{e^x}\\right) \\\\ & \\text { if } x < 0 \\Rightarrow y \\in\\left(0, a+e^{-x}-e^{-x}\\right) \\\\ & \\Rightarrow y \\in(0, a)\\end{aligned}$<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ZoZSGZugqZszFXM36Oso_O6o_L_CFsvvtognCDjaHrw.original.fullsize.png\"><br>\n$\\begin{aligned} & \\text { Area }=(a)+\\int_0^1\\left(a+e^x-e^{-x}\\right) d x=\\frac{e^2+8 e+1}{e} \\\\ & =a+\\left.\\left(a x+e^x+e^{-x}\\right)\\right|_0 ^1=e+8+\\frac{1}{e} \\\\ & =a+\\left(a+e+\\frac{1}{e}-2\\right)=e+\\frac{1}{e}+8 \\\\ & \\Rightarrow 2 a-2=8 \\Rightarrow a=5\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "a249f15b723d4f97919fd6376fdde3ba", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/P1xns7WLBa73w.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/P1xns7WLBa73w.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee85c8b73881fdaea09b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d97608", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T09:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 1)", "title": "JEE Main 2025 (22 Jan Shift 1)"}], "question": {"text": "Let $f: \\mathbf{R} \\rightarrow \\mathbf{R}$ be a twice differentiable function such that $f(x+y)=f(x) f(y)$ for all $x, y \\in \\mathbf{R}$. If $f^{\\prime}(0)=4 \\mathrm{a}$ and $f$ satisfies $f^{\\prime \\prime}(x)-3 \\mathrm{a} f^{\\prime}(x)-f(x)=0$, $\\mathrm{a}\\gt0$, then the area of the region $\\mathrm{R}=\\{(x, y) \\mid 0 \\leq y \\leq f(\\mathrm{a} x), 0 \\leq x \\leq 2\\}$ is:", "image": null}, "options": [{"id": "ItbHK", "text": "$e^2-1$", "image": null, "isCorrect": true}, {"id": "skDG8", "text": "$\\mathrm{e}^2+1$", "image": null, "isCorrect": false}, {"id": "8MDRh", "text": "$e^4+1$", "image": null, "isCorrect": false}, {"id": "uzrCS", "text": "$e^4-1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& f(x+y)=f(x) \\cdot f(y) \\\\\n& \\Rightarrow f(x)=e^{\\lambda x} f^{\\prime}(0)=4 a \\\\\n& \\Rightarrow f^{\\prime}(x)=\\lambda e^{\\lambda x} \\Rightarrow \\lambda=4 a\n\\end{aligned}$\n\nSo, $f(x)=e^{4 x}$\n$\\begin{aligned}\n& \\mathrm{f}^{\\prime \\prime}(\\mathrm{x})-3 \\mathrm{af}{ }^{\\prime}(\\mathrm{x})-\\ma x)+c_2$, where $c_1$ and $c_2$ are arbitrary constants, is", "image": null}, "options": [{"id": "EKJjf", "text": "$\\left(8 e^x-1\\right) \\frac{d^2 y}{d x^2}+\\frac{d y}{d x}=0$", "image": null, "isCorrect": false}, {"id": "hfmF8", "text": "$\\left(8 e^x-1\\right) \\frac{d^2 y}{d x^2}-\\frac{d y}{d x}=0$", "image": null, "isCorrect": false}, {"id": "URujB", "text": "$\\left(8 e^x+1\\right) \\frac{d^2 y}{d x^2}-\\frac{d y}{d x}=0$", "image": null, "isCorrect": false}, {"id": "r6H8A", "text": "$\\left(8 e^x+1\\right) \\frac{d^2 y}{d x^2}+\\frac{d y}{d x}=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\int_0^a f(x) d x=e^{-a}+4 a^2+a-1 \\\\ & f(a)=-e^{-a}+8 a+1 \\\\ & f(x)=-e^{-x}+8 x+1\\end{aligned}$\nNow $y=C_1 \\mathrm{f}(\\mathrm{x})+\\mathrm{C}_2$\n$\\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\mathrm{C}_1 \\mathrm{f}^{\\prime}(\\mathrm{x})=\\mathrm{C}_1\\left(\\mathrm{e}^{-\\mathrm{x}}+8\\right)$   ...(1)\n$\\frac{d^2 y}{d x^2}=-C_1 e^{-x} \\Rightarrow-e^x \\frac{d^2 y}{d x^2}$\nPut in equation (1)\n$\\begin{aligned} & \\frac{d y}{d x}=-e^x \\frac{d^2 y}{d x^2}\\left(e^{-x}+8\\right) \\\\ & \\left(8 e^x+1\\right) \\frac{d^2 y}{d x^2}+\\frac{d y}{d x}=0\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "0d03054d945d404098f408a34f7412e0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/q8SLaXGNfB0KP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/q8SLaXGNfB0KP.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T09:00:00.000Z", "isVis o>=</mo><mn>2</mn><mo>·</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mfenced><msup><mn>4</mn><mfrac><mn>3</mn><mn>2</mn></mfrac></msup></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>A</mi><mo>=</mo><mn>2</mn><mo>×</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>×</mo><mn>8</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>A</mi><mo>=</mo><mfrac><mn>32</mn><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "76422c63121344aba12b18536c429c14", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Wo0s7DXB4VnV9.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Wo0s7DXB4VnV9.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd55ba0e94a3c4025bfb", "type": "numerical", "level": 3, "questionLabels": [], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><mi>Y</mi><mo>(</mo><mi>X</mi><mo>)</mo></math> be a curve lying in the first quadrant such that the area enclosed by the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>-</mo><mi>y</mi><mo>=</mo><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo><mo>(</mo><mi>X</mi><mo>-</mo><mi>x</mi><mo>)</mo></math> and the co-ordinate axes, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>x</mi><mo mathvariant=\"italic\">,</mo><mi>y</mi><mo>)</mo></math> is any point on the curve, is always <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></mrow></mfrac><mo>+</mo><mn>1</mn><mo>,</mo><msup><mi>Y</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>≠</mo><mn>0</mn></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>(</mo><mn>1</mn><mo>)</mo><mo>=</mo><mn>1</mn></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo> </mo><mi>Y</mi><mo>(</mo><mn>2</mn><mo>)</mo></math> equals ________.", "image": null}, "options": [], "correctValue": "20", "solution": {"text": "<blockquote><p>Plotting the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>-</mo><mi>y</mi><mo>=</mo><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo><mo>(</mo><mi>X</mi><mo>-</mo><mi>x</mi><mo>)</mo></math> we get,</p><p> </p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5c9c4165-bfe7-4687-80bb-e58ba7fc2934.png\" style=\"width: 350px; height: 343px;\"/></p><p>Now, from the above diagram,</p><p>The area of the triangle formed will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mfrac><mrow><mo>-</mo><mi>y</mi></mrow><mrow><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></mrow></mfrac><mo>+</mo><mi>x</mi></mrow></mfenced><mo>(</mo><mi>y</mi><mo>-</mo><mi>x</mi><msup><mi>Y</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>)</mo></math></p><p>Now, according to the given condition we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mfrac><mrow><mo>-</mo><mi>y</mi></mrow><mrow><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></mrow></mfrac><mo>+</mo><mi>x</mi></mrow></mfenced><mo>(</mo><mi>y</mi><mo>-</mo><mi>x</mi><msup><mi>Y</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>)</mo><mo>=</mo><mfrac><mrow><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></mrow></mfrac><mo>+</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfenced><mrow><mo>-</mo><mi>y</mi><mo>+</mo><mi>x</mi><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></mrow></mfenced><mfenced><mrow><mi>y</mi><mo>-</mo><mi>x</mi><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></mrow></mfenced><mo>=</mo><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mi>y</mi><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo><mo>+</mo><mi>x</mi><mi>y</mi><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup><msup><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>2</mn><mi>x</mi><mi>y</mi><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup><msup><mi>Y</mi><mo>'</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>x</mi><mi>y</mi><mo>-</mo><mn>2</mn></mrow><msup><mi>x</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>-</mo><mfrac><mn>2</mn><mi>x</mi></mfrac><mi>y</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><msup><mi>x</mi><mn>2</mn></msup></mfrac></math></p><p>It is a linear differential equation,</p><p>Now, finding <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>IF</mi><mo>=</mo><msup><mi>e</mi><mrow><mo>-</mo><mn>2</mn><mi>ln</mi><mi>x</mi></mrow></msup><mo>=</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac></math></p><p>Now, the solution is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>·</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><msup><mi>x</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>+</mo><mi>c</mi></math></p><p>Given at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo> </mo><mi>y</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>1</mn><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>+</mo><mi>c</mi><mo>⇒</mo><mi>c</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>Hence, the equation of the curve will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>·</mo><mfrac><mn>1</mn><mi>X</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><msup><mi>X</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>12</mn><mi>Y</mi><mo>(</mo><mn>2</mn><mo>)</mo><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>×</mo><mn>12</mn><mo>=</mo><mn>20</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "9db008cd4132451589e83b0da8248dba", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/chbwhkeUmhdia.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/chbwhkeUmhdia.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f2e", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The area enclosed by the closed curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> given by the differential equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>x</mi><mo>+</mo><mi>a</mi></mrow><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mn>0</mn><mo>,</mo><mi>y</mi><mfenced><mn>1</mn></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>&#960;</mi></math>.&nbsp;Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> be the points of intersection of the curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> and the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis. If normals at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> on the curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> intersect <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis at points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> respectively, then the length of the line segment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mi>S</mi></math> is", "image": null}, "options": [{"id": "ZSXiA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "tbbNh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msqrt><mn>3</mn></msqrt></mrow><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "lv3mq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "Eu786", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><msqrt><mn>3</mn></msqrt></mrow><mn>3</mn></mfrac></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>x</mi><mo>+</mo><mi>a</mi></mrow><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>x</mi><mo>+</mo><mi>a</mi></mrow><mrow><mn>2</mn><mo>-</mo><mi>y</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mn>2</mn><mo>-</mo><mi>y</mi></mrow></mfenced><mo>&#160;</mo><mi>d</mi><mi>y</mi><mo>=</mo><mfenced><mrow><mi>x</mi><mo>+</mo><mi>a</mi></mrow></mfenced><mo>&#160;</mo><mi>d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>y</mi><mo>-</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>=</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>+</mo><mi>a</mi><mi>x</mi><mo>+</mo><mi>c</mi></math></p><p>Put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>, then we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mfenced><mn>1</mn></mfenced><mo>=</mo><mn>0</mn></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>+</mo><mi>c</mi><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>Now,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>y</mi><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>a</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>c</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>a</mi><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>c</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>a</mi><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>1</mn><mo>-</mo><mn>2</mn><mi>a</mi><mo>=</mo><mn>0</mn></math></p><p>This is a circle having radius</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><msqrt><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>a</mi></msqrt><mo>=</mo><msqrt><msup><mfenced><mrow><mi>a</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mn>4</mn></msqrt></math></p><p>Now,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>&#960;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msqrt><msup><mfenced><mrow><mi>a</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mn>4</mn></msqrt><mo>=</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mrow><mi>a</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>0</mn></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p>Hence, circle is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn></math></p><p>It cuts&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mi>axis</mi></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>, so</p><p><math xmlns=\"http://www.w3.org/1998/Math/Ma /mn></msup></mrow></mfenced><mi>d</mi><mi>y</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>e</mi><mo>-</mo><mi>ln</mi><mn>2</mn></math></p><p>But according to the question&nbsp;the required region&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub></math>&nbsp;comes out to be shaded in parallel lines, which can be obtained as</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub><mo>=</mo><msubsup><mo>&#8747;</mo><mn>0</mn><mrow><mi>ln</mi><mn>2</mn></mrow></msubsup><mfenced><mrow><mi>ln</mi><mfenced><mrow><mi>x</mi><mo>+</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mo>-</mo><mn>2</mn><msup><mi>e</mi><mrow><mo>-</mo><mi>x</mi></mrow></msup></mrow></mfenced><mi>d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><menclose notation=\"right\"><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>x</mi><mo>+</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mi>ln</mi><mfenced><mrow><mi>x</mi><mo>+</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mo>-</mo><mi>x</mi><mo>+</mo><mn>2</mn><msup><mi>e</mi><mrow><mo>-</mo><mi>x</mi></mrow></msup></mrow></mfenced></menclose><mn>0</mn><mrow><mtext>ln</mtext><mn>2</mn></mrow></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mi>ln</mi><mn>2</mn><mo>+</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mi>ln</mi><mfenced><mrow><mi>ln</mi><mn>2</mn><mo>+</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mo>-</mo><mi>ln</mi><mn>2</mn><mo>+</mo><mn>1</mn><mo>-</mo><mn>2</mn><msup><mi>e</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mi>ln</mi><mn>2</mn><mo>+</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mi>ln</mi><mfenced><mrow><mi>ln</mi><mn>2</mn><mo>+</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mo>-</mo><mi>ln</mi><mn>2</mn><mo>-</mo><mn>2</mn><msup><mi>e</mi><mn>2</mn></msup><mo>-</mo><mn>1</mn></math></p><p>Not given in any option.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "55bd4d784aa148f6afda59f29201e912", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MqnNjEoQ4LnlK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/MqnNjEoQ4LnlK.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557baf3d43b5ec151ee546c", "previousYearPapers": [{"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "Let a curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>y</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;pass through the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;and the area of the region under this curve, above the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis and between the abscissae&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mfenced><mrow><mo>&#62;</mo><mn>3</mn></mrow></mfenced></math>&nbsp;be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mfrac><mi>y</mi><mi>x</mi></mfrac></mfenced><mn>3</mn></msup></math>. If this curve also passes through the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mn>6</mn><msqrt><mn>10</mn></msqrt></mrow></mfenced></math>&nbsp;in the first quadrant, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> is equal to _______.", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<blockquote><p>Given, the area of the region under this curve, above the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis and between the abscissae&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mfenced><mrow><mo>&#62;</mo><mn>3</mn></mrow></mfenced></math>&nbsp;be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mfrac><mi>y</mi><mi>x</mi></mfrac></mfenced><mn>3</mn></msup></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mo>&#8747;</mo><mn>3</mn><mi>x</mi></msubsup><mi>y</mi><mo>d</mo><mi>x</mi><mo>=</mo><msup><mfenced><mfrac><mi>y</mi><mi>x</mi></mfrac></mfenced><mn>3</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>3</mn></msup><msubsup><mo>&#8747;</mo><mn>3</mn><mi>x</mi></msubsup><mi>y</mi><mo>d</mo><mi>x</mi><mo>=</mo><msup><mi>y</mi><mn>3</mn></msup></math></p><p>Now differentiating both side w.r.t&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>3</mn></msup><mi>y</mi><mo>+</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mfrac><msup><mi>y</mi><mn>3</mn></msup><msup><mi>x</mi><mn>3</mn></msup></mfrac><mo>=</mo><mn>3</mn><msup><mi>y</mi><mn>2</mn></msup><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mtext>as&#160;given&#160;</mtext><msubsup><mo>&#8747;</mo><mn>3</mn><mi>x</mi></msubsup><mi>y</mi><mo>d</mo><mi>x</mi><mo>=</mo><msup><mfenced><mfrac><mi>y</mi><mi>x</mi></mfrac></mfenced><mn>3</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>4</mn></msup><mo>+</mo><mn>3</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><mi>y</mi><mi>x</mi><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mi>x</mi><mi>y</mi><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mn>3</mn><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><msup><mi>x</mi><mn>4</mn></msup></math></p><p>Now put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mi>t</mi><mo>,</mo><mi>y</mi><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfrac><mrow><mi>d</mi><mi>t</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>t</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>-</mo><mfrac><mn>2</mn><mi>x</mi></mfrac><mi>t</mi><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><msup><mi>x</mi><mn>3</mn></msup></math></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mi>F</mi><mo>=</mo><msup><mi>e</mi><mrow><mo>&#8747;</mo><mo>-</mo><mfrac><mn>2</mn><mi>x</mi></mfrac><mi>d</mi><mi>x</mi></mrow></msup><mo>=</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac></math></p><p>So, solution is given by&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>&#215;</mo><mi>I</mi><mi>F</mi><mo>=</mo><mo>&#8747;</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><msup><mi>x</mi><mn>3</mn></msup><mo>&#215;</mo><mi>I</mi><mi>F</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>t</mi><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>3</mn></mfrac><mo>+</mo><mi>C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math>Now given curve passes through &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mo>-</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>3</mn></mfrac><mo>-</mo><mn>2</mn></math></p><p>So the equation of curve is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>x</mi><mn>4</mn></msup><mo>-</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup></math></p><p>Now curve also passes through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mn>6</mn><msqrt><mn>10</mn></msqrt></mrow></mfenced></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>4</mn></msup><mo>-</mo><mn>6</mn><msup><mi>&#945;</mi><mn>2</mn></msup><mo>=</mo><mn>1080</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#945;</mi><mo>=</mo><mn>6</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "20 mlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><msubsup><mo>&#8747;</mo><mrow><mo>-</mo><mfrac><mn>1</mn><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow><mn>0</mn></msubsup><msup><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>x</mi><mfrac><mn>2</mn><mn>3</mn></mfrac></msup></mrow></mfenced><mfrac><mn>3</mn><mn>2</mn></mfrac></msup><mo>d</mo><mi>x</mi><mo>-</mo><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced><mo>&#160;</mo><mo>+</mo><msubsup><mo>&#8747;</mo><mn>0</mn><mn>1</mn></msubsup><msup><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>x</mi><mfrac><mn>2</mn><mn>3</mn></mfrac></msup></mrow></mfenced><mfrac><mn>3</mn><mn>2</mn></mfrac></msup><mi>d</mi><mi>x</mi></math></p><p>Now for solving&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8747;</mo><msup><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>x</mi><mfrac><mn>2</mn><mn>3</mn></mfrac></msup></mrow></mfenced><mfrac><mn>3</mn><mn>2</mn></mfrac></msup><mi>d</mi><mi>x</mi></math></p><p>&nbsp;Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><msup><mi>sin</mi><mn>3</mn></msup><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#8747;</mo><msup><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi></mrow></mfenced><mfrac><mn>3</mn><mn>2</mn></mfrac></msup><mo>&#183;</mo><mn>3</mn><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi><mi>cos</mi><mi>&#952;</mi><mi>d</mi><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#8747;</mo><mn>3</mn><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi><msup><mi>cos</mi><mn>4</mn></msup><mi>&#952;</mi><mi>d</mi><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</ n>3</mn><mn>2</mn></mfrac></math> and the curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>1</mn><mo>+</mo><mn>4</mn><mi>x</mi><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup><mo>,</mo></math>&nbsp;then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mi>m</mi></math> is equal to&nbsp;<u>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</u>.", "image": null}, "options": [], "correctValue": "26", "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6d783e6c-47e0-4b78-9510-b0f1ba1f446c-1.png\" style=\"width: 259px; height: 188px;\" /></p><p>Given, the equation of line,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi></math></p><p>And the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>y</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>x</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#160;</mo></math></p><p>The intersection point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced></math></p><p>Area of triangle is half the total area&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mo>&#8747;</mo><mn>0</mn><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msubsup><mfenced><mrow><mn>1</mn><mo>+</mo><mn>4</mn><mi>x</mi><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mi>d</mi><mi>x</mi><mo>=</mo><msubsup><mo>&#8747;</mo><mn>0</mn><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msubsup><mi>m</mi><mi>x</mi><mi>d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mfenced close=\"]\" open=\"[\"><mrow><mi>x</mi><mo>+</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mfrac><msup><mi>x</mi><mn>3</mn></msup><mn>3</mn></mfrac></mrow></mfenced><mn>0</mn><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mi>m</mi><mn>2</mn></mfrac><msubsup><mfenced close=\"]\" open=\"[\"><msup><mi>x</mi><mn>2</mn></msup></mfenced><mn>0</mn><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>+</mo><mfrac><mn>9</mn><mn>2</mn></mfrac><mo>-</mo><mfrac><mn>9</mn><mn>8</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>9</mn><mi>m</mi></mrow><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>39</mn><mn>8</mn></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><mi>m</mi></mrow><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mfrac><mn>39</mn><mn>18</mn></mfrac></math></p><p>Then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mi>m</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><mi>m</mi><mo>=</mo><mfrac><mn>39</mn><mn>18</mn></mfrac><mo>&#215;</mo><mn>12</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mi>m</mi><mo>=</mo><mn>26</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6745a", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 2)", "title": "JEE Main 2021 (26 Aug Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> respectively be the points of local maximum and local minimum of the function&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mn>2</mn><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><mi>x</mi></math>.&nbsp;If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is the total area of the region bounded by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>,</mo></math> the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis and the lines <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo mathvariant=\"italic\">=</mo><mi>b</mi><mo mathvariant=\"italic\">,</mo></math>&nbsp;then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">A</mi></math> is equal to ______.", "image": null}, "options": [], "correctValue": "114", "solution": {"text": "<p>.<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>-</mo><mn>12</mn><mo>=</mo><mn>6</mn><mfenced><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>6</mn><mo>(</mo><mi>x</mi><mo>-</mo><mn>2</mn><mo>)</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/79f3879e-3e97-4ba6-8858-26a5d5f7be24-image.png\" style=\"width: 248px; height: 77px;\" /></p><p>Clearly,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><mrow><mo>-</mo><msup><mn>1</mn><mo>-</mo></msup></mrow></mfenced><mo>&#62;</mo><mn>0</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><mrow><mo>-</mo><msup><mn>1</mn><mo>+</mo></msup></mrow></mfenced><mo>&#60;</mo><mn>0</mn></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>&nbsp;is the point of local maximum.</p><p>Also,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mn>2</mn><mo>-</mo></msup></mfenced><mo>&#60;</mo><mn>0</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mn>2</mn><mo>+</mo></msup></mfenced><mo>&#62;</mo><mn>0</mn></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>2</mn></math>&nbsp;is the point of local minimum.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>a</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>b</mi><mo>=</mo><mn>2</mn></math></p><p>Points=<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mo>-</mo><mn>20</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mn>7</mn></mrow></mfenced></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1d7af5e9-10e6-4b8c-b088-9cb76e1a6eaa-image.png\" style=\"width: 295px; height: 250px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><msubsup><mo>&#8747;</mo><mrow><mo>-</mo><mn>1</mn></mrow><mn>0</mn></msubsup><mfenced><mrow><mn>2</mn><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><mi>x</mi></mrow></mfenced><mi>d</mi><mi>x</mi><mo>-</mo><msubsup><mo>&#8747;</mo><mn>0</mn><mn>2</mn></msubsup><mfenced><mrow><mn>2</mn><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><mi>x</mi></mrow></mfenced><mi>d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msubsup><mfenced><mrow><mfrac><msup><mi>x</mi><mn>4</mn></msup><mn>2</mn></mfrac><mo>-</mo><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mrow><mo>-</mo><mn>1</mn></mrow><mn>0</mn></msubsup><mo>-</mo><msubsup><mfenced><mrow><mfrac><msup><mi>x</mi><mn>4</mn></msup><mn>2</mn></mfrac><mo>-</mo><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mn>0</mn><mn>2</mn></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>9</mn><mn>2</mn></mfrac><mo>+</mo><mn>24</mn><mo>=</mo><mfrac><mn>57</mn><mn>2</mn></mfrac><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>114</mn></math></p>", "image": null}, "videoSolution": {"videoId": "1f1d5852fe6e4a939be9c2de0bcef6af", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/tRAROpq8ZqfdR.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/tRAROpq8ZqfdR.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 2)", "title": "JEE Main 2021 (26 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d6718e", "previousYearPapers": [{"_i mo>=</mo><mn>0</mn></math>&nbsp;are symmetric about the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis, hence they have the same area.</p><p>Hence, the required area<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mfenced close=\"]\" open=\"[\"><mrow><msubsup><mo>&#8747;</mo><mn>0</mn><mn>2</mn></msubsup><mfenced><mfrac><mrow><mn>4</mn><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac></mfenced><mi>d</mi><mi>y</mi><mo>-</mo><msubsup><mo>&#8747;</mo><mn>0</mn><mn>1</mn></msubsup><mfenced><mfrac><mrow><mn>1</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac></mfenced><mi>d</mi><mi>x</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mfenced close=\"]\" open=\"[\"><mrow><msubsup><mo>&#8747;</mo><mn>0</mn><mn>2</mn></msubsup><mfrac><mn>1</mn><mn>4</mn></mfrac><mfenced><mrow><mn>4</mn><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfenced><mi>d</mi><mi>y</mi><mo>-</mo><msubsup><mo>&#8747;</mo><mn>0</mn><mn>1</mn></msubsup><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mi>d</mi><mi>x</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mn>1</mn><mn>4</mn></mfrac><msubsup><mfenced><mrow><mn>4</mn><mi>y</mi><mo>-</mo><mfrac><msup><mi>y</mi><mn>3</mn></msup><mn>3</mn></mfrac></mrow></mfenced><mn>0</mn><mn>2</mn></msubsup><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><msup><mi>x</mi><mn>3</mn></msup><mn>3</mn></mfrac></mrow></mfenced><mn>0</mn><mn>1</mn></msubsup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mn>1</mn><mn>4</mn></mfrac><mfenced><mrow><mn>8</mn><mo>-</mo><mfrac><mn>8</mn><mn>3</mn></mfrac><
