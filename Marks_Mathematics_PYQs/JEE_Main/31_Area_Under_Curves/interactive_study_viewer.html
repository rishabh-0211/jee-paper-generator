  <script>
    const data = {"index": 31, "chapterId": "61602565bccda81624f5a071", "chapter": "Area Under Curves", "exam": "JEE Main", "subject": "Mathematics", "totalTopics": 3, "totalQuestions": 182, "downloadTime": "2026-10-08 21:03:38", "topics": [{"index": 1, "topicId": "648b5a73417cc3fb48d6936e", "title": "Area of Curve along axis", "totalQuestions": 16, "questions": [{"_id": "69d8075181239f6567c4f459", "type": "singleCorrect", "question": {"text": "The area of the region $\\{(x, y): y \\leq \\pi - |x|, y \\leq |x \\sin x|, y \\geq 0\\}$ is:", "image": null}, "options": [{"id": "VYi57", "text": "$1 + \\dfrac{\\pi^2}{8}$", "isCorrect": false, "image": null}, {"id": "lSRG4", "text": "$2 + \\dfrac{\\pi^2}{4}$", "isCorrect": true, "image": null}, {"id": "WgD98", "text": "$\\dfrac{\\pi^2}{8} - 1$", "isCorrect": false, "image": null}, {"id": "taV8F", "text": "$4 + \\dfrac{\\pi^2}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given region is defined by the inequalities $y \\leq \\pi - |x|$, $y \\leq |x \\sin x|$, and $y \\geq 0$.<br><br>Since replacing $x$ with $-x$ leaves the inequalities unchanged, the region is symmetric with respect to the y-axis. We can find the area of the region in the first quadrant ($x \\geq 0$) and multiply it by $2$.<br><br>For $x \\geq 0$, the inequalities become:<br>$y \\leq \\pi - x$<br>$y \\leq x \\sin x$<br>$y \\geq 0$<br><br>The condition $y \\geq 0$ and $y \\leq \\pi - x$ restricts $x$ to the interval $[0, \\pi]$. In this interval, $\\sin x \\geq 0$, so $|x \\sin x| = x \\sin x$.<br><br>To find the intersection of the curves $y = \\pi - x$ and $y = x \\sin x$, we equate them:<br>$x \\sin x = \\pi - x \\Rightarrow x(1 + \\sin x) = \\pi$<br><br>By inspection, $x = \\dfrac{\\pi}{2}$ is a solution since $\\dfrac{\\pi}{2}(1 + 1) = \\pi$.<br><br>For $x \\in \\left[0, \\dfrac{\\pi}{2}\\right]$, $x \\sin x \\leq \\pi - x$.<br>For $x \\in \\left[\\dfrac{\\pi}{2}, \\pi\\right]$, $x \\sin x \\geq \\pi - x$.<br><br>The area in the first quadrant, $A_1$, is given by:<br>$A_1 = \\int_{0}^{\\pi/2} x \\sin x \\, dx + \\int_{\\pi/2}^{\\pi} (\\pi - x) \\, dx$<br><br>Evaluating the first integral using integration by parts:<br>$\\int_{0}^{\\pi/2} x \\sin x \\, dx = [-x \\cos x]_{0}^{\\pi/2} - \\int_{0}^{\\pi/2} (-\\cos x) \\, dx$<br>$= 0 + [\\sin x]_{0}^{\\pi/2} = 1$<br><br>Evaluating the second integral:<br>$\\int_{\\pi/2}^{\\pi} (\\pi - x) \\, dx = \\left[ -\\dfrac{(\\pi - x)^2}{2} \\right]_{\\pi/2}^{\\pi} = 0 - \\left( -\\dfrac{\\pi^2}{8} \\right) = \\dfrac{\\pi^2}{8}$<br><br>Thus, the area in the first quadrant is:<br>$A_1 = 1 + \\dfrac{\\pi^2}{8}$<br><br>The total area of the region is twice the area in the first quadrant:<br>$\\text{Total Area} = 2 \\times A_1 = 2 \\left( 1 + \\dfrac{\\pi^2}{8} \\right) = 2 + \\dfrac{\\pi^2}{4}$<br><br>Answer: $2 + \\dfrac{\\pi^2}{4}$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "81e169a9ae16424e8800f7daaae76f39", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/SbxRarWG3tPrC.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/SbxRarWG3tPrC.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c -x\\}$ is :", "image": null}, "options": [{"id": "RmTrf", "text": "$\\dfrac{343}{6}$", "isCorrect": true, "image": null}, {"id": "Wjlr1", "text": "$\\dfrac{637}{6}$", "isCorrect": false, "image": null}, {"id": "7ECVY", "text": "$\\dfrac{437}{6}$", "isCorrect": false, "image": null}, {"id": "g7NOn", "text": "$\\dfrac{523}{6}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given region is bounded by the parabola $y = x^2 - 8x$ and the line $y = -x$.<br><br>To find the points of intersection, equate the two equations:<br><br>$x^2 - 8x = -x$<br><br>$x^2 - 7x = 0$<br><br>$x(x - 7) = 0$<br><br>The points of intersection are $x = 0$ and $x = 7$.<br><br>In the interval $[0, 7]$, the line $y = -x$ lies above the parabola $y = x^2 - 8x$.<br><br>The required area $A$ is given by:<br><br>$A = \\int_{0}^{7} (-x - (x^2 - 8x)) dx$<br><br>$A = \\int_{0}^{7} (7x - x^2) dx$<br><br>Evaluating the integral:<br><br>$A = \\left[ \\dfrac{7x^2}{2} - \\dfrac{x^3}{3} \\right]_{0}^{7}$<br><br>$A = \\dfrac{7(49)}{2} - \\dfrac{343}{3}$<br><br>$A = \\dfrac{343}{2} - \\dfrac{343}{3}$<br><br>$A = 343 \\left( \\dfrac{1}{2} - \\dfrac{1}{3} \\right)$<br><br>$A = \\dfrac{343}{6}$<br><br>Answer: $\\dfrac{343}{6}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "e588a9c372fb4a4f94816810574ffe24", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/71BkTLlloq2gI.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/71BkTLlloq2gI.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074b81239f6567c4f40f", "type": "singleCorrect", "question": {"text": "The area of the region $\\{(x, y) : 0 \\leq y \\leq 6 - x, y^2 \\geq 4x - 3, x \\geq 0\\}$ is:", "image": null}, "options": [{"id": "DZ3u1", "text": "$8$", "isCorrect": false, "image": null}, {"id": "e2Xw9", "text": "$9$", "isCorrect": true, "image": null}, {"id": "uCCGa", "text": "$12$", "isCorrect": false, "image": null}, {"id": "UGb87", "text": "$15$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given region is defined by the inequalities:<br>$x \\geq 0$<br>$0 \\leq y \\leq 6 - x \\Rightarrow y \\geq 0$ and $x \\leq 6 - y$<br>$y^2 \\geq 4x - 3 \\Rightarrow x \\leq \\dfrac{y^2 + 3}{4}$<br><br>From these inequalities, for a given $y \\geq 0$, the value of $x$ ranges from $0$ to $\\min\\left(6 - y, \\dfrac{y^2 + 3}{4}\\right)$.<br><br>To find the point where the two bounding curves intersect, we equate them:<br>$6 - y = \\dfrac{y^2 + 3}{4}$<br><br>$24 - 4y = y^2 + 3$<br><br>$y^2 + 4y - 21 = 0$<br><br>$(y + 7)(y - 3) = 0$<br><br>Since $y \\geq 0$, the intersection occurs at $y = 3$.<br><br>For $0 \\leq y \\leq 3$, the right boundary is the parabola $x = \\dfrac{y^2 + 3}{4}$.<br>For $3 \\leq y \\leq 6$, the right boundary is the line $x = 6 - y$.<br><br>The total area $A$ can be calculated by integrating with respect to $y$:<br>$A = \\int_{0}^{3} \\dfrac{y^2 + 3}{4} dy + \\int_{3}^{6} (6 - y) dy$<br><br>Evaluating the first integral:<br>$\\int_{0}^{3} \\dfrac{y^2 + 3}{4} dy = \\dfrac{1}{4} \\left[ \\dfrac{y^3}{3} + 3y \\right]_{0}^{3} = \\dfrac{1}{4} (9 + 9) = \\dfrac{18}{4} = \\dfrac{9}{2}$<br><br>Evaluating the second integral:<br>$\\int_{3}^{6} (6 - y) dy = \\left[ 6y - \\dfrac{y^2}{2} \\right]_{3}^{6} = (36 - 18) - \\left(18 - \\dfrac{9}{2}\\right) = 18 - 13.5 = \\dfrac{9}{2}$<br><br>Total Area = $\\dfrac{9}{2} + \\dfrac{9}{2} = 9$<br><br>Answer: $9$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "944200abfe12408c807e1811a4a39d1e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/WG22qIFbALqyM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/WG22qIFbALqyM.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073181239f6567c4f2e0", "type": "singleCorrect", "question": {"text": "The area of the region $R = \\{(x, y): xy \\leq 27, 1 \\leq y \\leq x^2\\}$ is equal to:", "image": null}, "options": [{"id": "qhcDj", "text": "$78\\log_e 3 - \\dfrac{52}{3}$", "isCorrect": false, "image": null}, {"id": "DDsk0", "text": "$54\\log_e 3 - \\dfrac{52}{3}$", "isCorrect": true, "image": null}, {"id": "qbAkF", "text": "$54\\log_e 3 - \\dfrac{26}{3}$", "isCorrect": false, "image": null}, {"id": "8tgNS", "text": "$54\\log_e 3 + \\dfrac{26}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given region is bounded by the curves $y = 1$, $y = x^2$, and $xy = 27$ in the first quadrant.<br><br>Let us find the points of intersection of these curves:<br>Intersection of $y = 1$ and $y = x^2$ gives $x = 1$.<br>Intersection of $y = x^2$ and $xy = 27$ gives $x(x^2) = 27 \\Rightarrow x^3 = 27 \\Rightarrow x = 3$, so $y = 9$.<br>Intersection of $y = 1$ and $xy = 27$ gives $x = 27$.<br><br>We can find the area by integrating with respect to $y$ from $y = 1$ to $y = 9$. For a given $y$, the value of $x$ ranges from the parabola $x = \\sqrt{y}$ to the hyperbola $x = \\dfrac{27}{y}$.<br><br>The area $A$ is given by:<br>$A = \\int_{1}^{9} \\left( \\dfrac{27}{y} - \\sqrt{y} \\right) dy$<br><br>Integrating the terms:<br>$A = \\left[ 27 \\ln y - \\dfrac{2}{3} y^{3/2} \\right]_{1}^{9}$<br><br>Substituting the limits:<br>$A = \\left( 27 \\ln 9 - \\dfrac{2}{3} (9)^{3/2} \\right) - \\left( 27 \\ln 1 - \\dfrac{2}{3} (1)^{3/2} \\right)$<br><br>$A = \\left( 27 \\ln(3^2) - \\dfrac{2}{3} (27) \\right) - \\left( 0 - \\dfrac{2}{3} \\right)$<br><br>$A = 54 \\ln 3 - 18 + \\dfrac{2}{3}$<br><br>$A = 54 \\ln 3 - \\dfrac{54}{3} + \\dfrac{2}{3}$<br><br>$A = 54 \\ln 3 - \\dfrac{52}{3}$<br><br>Answer: $54\\log_e 3 - \\dfrac{52}{3}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "9530ebce3ba348afbea33fd6d9107d52", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7Ct8z84YY2zsn.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7Ct8z84YY2zsn.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074481239f6567c4f3c3", "type": "singleCorrect", "question": {"text": "The area of the region bounded by the curves $x+3y^2=0$ and $x+4y^2=1$ is equal to:", "image": null}, "options": [{"id": "rLGYJ", "text": "$\\dfrac{1}{3}$", "isCorrect": false, "image": null}, {"id": "qPFyF", "text": "$\\dfrac{2}{3}$", "isCorrect": false, "image": null}, {"id": "EGqa7", "text": "$\\dfrac{4}{3}$", "isCorrect": true, "image": null}, {"id": "5So51", "text": "$\\dfrac{5}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equations of the given curves are $x = -3y^2$ and $x = 1 - 4y^2$.<br><br>To find the points of intersection, equate the values of $x$:<br><br>$-3y^2 = 1 - 4y^2$<br><br>$y^2 = 1 \\Rightarrow y = \\pm 1$<br><br>The region is bounded between $y = -1$ and $y = 1$. In this interval, $1 - 4y^2 \\ge -3y^2$.<br><br>The required area $A$ is given by:<br><br>$A = \\int_{-1}^{1} \\left( (1 - 4y^2) - (-3y^2) \\right) dy$<br><br>$A = \\int_{-1}^{1} (1 - y^2) dy$<br><br>Since $1 - y^2$ is an even function:<br><br>$A = 2 \\int_{0}^{1} (1 - y^2) dy$<br><br>$A = 2 \\left[ y - \\dfrac{y^3}{3} \\right]_{0}^{1}$<br><br>$A = 2 \\left( 1 - \\dfrac{1}{3} \\right) = 2 \\left( \\dfrac{2}{3} \\right) = \\dfrac{4}{3}$<br><br>Answer: $\\dfrac{4}{3}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "74f3eca1e7b547a0b9974f28ac69d56f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/6G1HczwUCVj2B.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/6G1HczwUCVj2B.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8072b81239f6567c4f29d", "type": "numerical", "question": {"text": "If the area of the region bounded by $16x^2 - 9y^2 = 144$ and $8x - 3y = 24$ is A, then $3(A + 6 \\log_e(3))$ is equal to _______.", "image": null}, "options": [], "correctValue": "24", "solution": {"text": "The given equations are:<br><br>Hyperbola: $16x^2 - 9y^2 = 144 \\Rightarrow \\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1$<br><br>Line: $8x - 3y = 24 \\Rightarrow y = \\dfrac{8}{3}(x - 3)$<br><br>To find the points of intersection, substitute $y$ from the line equation into the hyperbola equation:<br><br>$16x^2 - 9\\left(\\dfrac{8}{3}(x - 3)\\right)^2 = 144$<br><br>$16x^2 - 64(x^2 - 6x + 9) = 144$<br><br>$x^2 - 4(x^2 - 6x + 9) = 9$<br><br>$-3x^2 + 24x - 45 = 0$<br><br>$x^2 - 8x + 15 = 0$<br><br>$(x - 3)(x - 5) = 0 \\Rightarrow x = 3, x = 5$<br><br>For $x \\in [3, 5]$, the upper curve is the hyperbola $y = \\dfrac{4}{3}\\sqrt{x^2 - 9}$ and the lower curve is the line $y = \\dfrac{8}{3}(x - 3)$.<br><br>The area $A$ of the bounded region is:<br><br>$A = \\int_{3}^{5} \\left( \\dfrac{4}{3}\\sqrt{x^2 - 9} - \\dfrac{8}{3}(x - 3) \\right) dx$<br><br>Using the standard integral formula $\\int \\sqrt{x^2 - a^2} dx = \\dfrac{x}{2}\\sqrt{x^2 - a^2} - \\dfrac{a^2}{2}\\ln|x + \\sqrt{x^2 - a^2}|$:<br><br>$\\int_{3}^{5} \\sqrt{x^2 - 9} dx = \\left[ \\dfrac{x}{2}\\sqrt{x^2 - 9} - \\dfrac{9}{2}\\ln|x + \\sqrt{x^2 - 9}| \\right]_{3}^{5}$<br><br>$= \\left( \\dfrac{5}{2}(4) - \\dfrac{9}{2}\\ln 9 \\right) - \\left( 0 - \\dfrac{9}{2}\\ln 3 \\right)$<br><br>$= 10 - 9\\ln 3 + \\dfrac{9}{2}\\ln 3 = 10 - \\dfrac{9}{2}\\ln 3$<br><br>For the linear part:<br><br>$\\int_{3}^{5} (x - 3) dx = \\left[ \\dfrac{(x - 3)^2}{2} \\right]_{3}^{5} = \\dfrac{4}{2} - 0 = 2$<br><br>Substituting these back into the area equation:<br><br>$A = \\dfrac{4}{3}\\left( 10 - \\dfrac{9}{2}\\ln 3 \\right) - \\dfrac{8}{3}(2)$<br><br>$A = \\dfrac{40}{3} - 6\\ln 3 - \\dfrac{16}{3}$<br><br>$A = 8 - 6\\ln 3$<br><br>We need to find the value of $3(A + 6\\log_e 3)$:<br><br>$A + 6\\ln 3 = 8$<br><br>$3(A + 6\\ln 3) = 3 \\times 8 = 24$<br><br>Answer: $24$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "99f9a79f3ccf401ba7200a8d48f50a74", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/FIlUsO3PT0a5n.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/FIlUsO3PT0a5n.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1b08bfdbb24356397e0", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $P_{1}: y=4 x^{2}$ and $P_{2}: y=x^{2}+27$ be two parabolas. If the area of the bounded region enclosed between $P_{1}$ and $P_{2}$ is six times the area of the bounded region enclosed between the line $y=\\alpha x, \\alpha>0$ and $P_{1}$, then $\\alpha$ is equal to :", "image": null}, "options": [{"id": "RkML2", "text": "12", "isCorrect": true, "image": null}, {"id": "nR6VO", "text": "6", "isCorrect": false, "image": null}, {"id": "GCdiR", "text": "15", "isCorrect": false, "image": null}, {"id": "0rzRe", "text": "8", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img style=\"width:200px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S2_s_14_1.png\"><br>Area bounded between $P_1$ & $P_2$ is<br>$\\int_{-3}^{3} ((x^2 + 27) - (4x^2)) \\, dx$<br>(P.O.I. of $P_1$ & $P_2$ is $x = \\pm 3$)<br>$= 2\\int_{0}^{3} (27 - 3x^2) \\, dx = 2[27x - x^3]_{0}^{3}$<br>$= 2[81 - 27] = 108$<br>$\\therefore$ Area bounded between $P_1$ & L is 18 sq. units<br>(Area between $x^2 = 4ay$ & line $x = my$) is $\\dfrac{8a^2}{3m^3}$<br>$\\therefore$ Area between $x^2 = \\dfrac{y}{4}$ & $x = \\dfrac{y}{\\alpha}$ is<br>$\\dfrac{8 \\cdot \\left(\\dfrac{1}{16}\\right)^2}{3 \\cdot \\left(\\dfrac{1}{\\alpha}\\right)^3} = 18$<br>$\\Rightarrow \\dfrac{\\dfrac{8}{16 \\cdot 16}}{\\dfrac{3}{\\alpha^3}} = 18 \\Rightarrow \\alpha^3 = 2^6 \\cdot 3^3$<br>$\\Rightarrow \\alpha = 12$", "image": null}, "videoSolution": {"videoId": "b0d4f3264aaf4ff794ea28362147a9bc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/M9Iwhi5We20GJ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/M9Iwhi5We20GJ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1aa8bfdbb2435639799", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The area of the region $\\mathrm{R}=\\left\\{(x, y): x y \\leq 8,1 \\leq y \\leq x^{2}, x \\geq 0\\right\\}$ is", "image": null}, "options": [{"id": "aHlnj", "text": "$\\frac{2}{3}\\left(24 \\log _{e}(2)-7\\right)$", "isCorrect": true, "image": null}, {"id": "MVPbb", "text": "$\\frac{1}{3}\\left(40 \\log _{e}(2)+27\\right)$", "isCorrect": false, "image": null}, {"id": "J2i1S", "text": "$\\frac{2}{3}\\left(20 \\log _{e}(2)+9\\right)$", "isCorrect": false, "image": null}, {"id": "IhRXu", "text": "$\\frac{1}{3}\\left(49 \\log _{e}(2)-15\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The region $R$ is defined by $xy \\le 8$, $1 \\le y \\le x^2$, and $x \\ge 0$.<br>First, find the intersection points of the curves.<br>Intersection of $y = 1$ and $y = x^2$: $x^2 = 1 \\implies x = 1$ (since $x \\ge 0$).<br>Intersection of $y = x^2$ and $xy = 8$: $x(x^2) = 8 \\implies x^3 = 8 \\implies x = 2$. At $x=2$, $y=4$.<br>Intersection of $xy = 8$ and $y = 1$: $x(1) = 8 \\implies x = 8$.<br>The region is bounded below by $y = 1$ from $x = 1$ to $x = 8$.<br>The upper boundary consists of two parts:<br>From $x = 1$ to $x = 2$, the upper curve is $y = x^2$.<br>From $x = 2$ to $x = 8$, the upper curve is $y = \\frac{8}{x}$.<br>The area $A$ is given by:<br>$A = \\int_{1}^{2} (x^2 - 1) dx + \\int_{2}^{8} (\\frac{8}{x} - 1) dx$<br>$A = [\\frac{x^3}{3} - x]_1^2 + [8 \\log_e x - x]_2^8$<br>$A = (\\frac{8}{3} - 2) - (\\frac{1}{3} - 1) + (8 \\log_e 8 - 8) - (8 \\log_e 2 - 2)$<br>$A = (\\frac{2}{3}) - (-\\frac{2}{3}) + 8(3 \\log_e 2) - 8 - 8 \\log_e 2 + 2$<br>$A = \\frac{4}{3} + 24 \\log_e 2 - 8 \\log_e 2 - 6$<br>$A = 16 \\log_e 2 + \\frac{4}{3} - 6$<br>$A = 16 \\log_e 2 - \\frac{14}{3}$<br>$A = \\frac{2}{3} (24 \\log_e 2 - 7)$", "image": null}, "videoSolution": {"videoId": "b0159a6283794984b69c67698363bd08", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/sigkiR0j8LdQF.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/sigkiR0j8LdQF.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1a48bfdbb243563974c", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $f(\\alpha)$ denote the area of the region in the first quadrant bounded by $x=0, x=1, y^{2}=x$ and $y=|\\alpha x-5|-|1-\\alpha x|+\\alpha x^{2}$. Then $(f(0)+f(1))$ is equal to", "image": null}, "options": [{"id": "j9cID", "text": "12", "isCorrect": false, "image": null}, {"id": "4nKc8", "text": "14", "isCorrect": false, "image": null}, {"id": "tlM3c", "text": "7", "isCorrect": true, "image": null}, {"id": "lQKQU", "text": "9", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For $\\alpha = 0$: curve is $y = 5 - 1 = 4$ (horizontal line), area $= \\int_0^1 (4 - \\sqrt{x}) dx = 4 - \\frac{2}{3} = \\frac{10}{3}$<br>For $\\alpha = 1$ and $0 \\leq x \\leq 1$: $|x-5| = 5-x$, $|1-x| = 1-x$, so $y = 4 + x^2$<br>Area $= \\int_0^1 (4 + x^2 - \\sqrt{x}) dx = 4 + \\frac{1}{3} - \\frac{2}{3} = \\frac{11}{3}$<br>$f(0) + f(1) = \\frac{10}{3} + \\frac{11}{3} = 7$", "image": null}, "videoSolution": {"videoId": "62673ed41e354fa2be03b9d3aa4b9d8f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LNJ1dK17vWVKG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LNJ1dK17vWVKG.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19d8bfdbb24356396f8", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": \sqrt{3}\\right) = \\frac{8\\pi - 6\\sqrt{3}}{3} = \\frac{2}{3}(4\\pi - 3\\sqrt{3})$.", "image": null}, "videoSolution": {"videoId": "19a46318328c44fbbdefcaaaf458435e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/pVjaW4A4VBeH5.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/pVjaW4A4VBeH5.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c18d8bfdbb2435639624", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The area of the region $\\mathrm{A}=\\left\\{(x, y): 4 x^{2}+y^{2} \\leqslant 8\\right.$ and $\\left.y^{2} \\leqslant 4 x\\right\\}$ is:", "image": null}, "options": [{"id": "GSC6K", "text": "$\\pi+4$", "isCorrect": false, "image": null}, {"id": "f3SF9", "text": "$\\pi+\\frac{2}{3}$", "isCorrect": true, "image": null}, {"id": "O4GYv", "text": "$\\frac{\\pi}{2}+2$", "isCorrect": false, "image": null}, {"id": "iiCoN", "text": "$\\frac{\\pi}{2}+\\frac{1}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img style=\"width:200px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_w {-1}\\left(\\frac{2}{\\sqrt{5}}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644674c970e6e9ab542d206", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 2)", "title": "JEE Main 2024 (08 Apr Shift 2)"}], "question": {"text": "The area of the region in the first quadrant inside the circle $x^2+y^2=8$ and outside the parabola $y^2=2 x$ is equal to :", "image": null}, "options": [{"id": "zGPNO", "text": "$\\frac{\\pi}{2}-\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "gRgEj", "text": "$\\pi-\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "LHAh9", "text": "$\\frac{\\pi}{2}-\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "4NdKo", "text": "$\\pi-\\frac{2}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/w6cOjvZpHTfjgYU43ogBZBYj1y3HwYhXP88O0qezktg.original.fullsize.png\"><br />Required area $=\\operatorname{Ar}($ circle from 0 to 2$)-$ $\\operatorname{ar}($ para from 0 to 2$)$\n$\\begin{aligned} & =\\int_0^2 \\sqrt{8-x^2} d x-\\int_0^2 \\sqrt{2 x} d x \\\\ & =\\left[\\frac{x}{2} \\sqrt{8-x^2}+\\frac{8}{2} \\sin ^{-1} \\frac{x}{2 \\sqrt{2}}\\right]_0^2-\\sqrt{2}\\left[\\frac{x \\sqrt{x}}{3 / 2}\\right]_0^2 \\\\ & =\\frac{2}{2} \\sqrt{8-4}+\\frac{8}{2} \\sin ^{-1} \\frac{2}{2 \\sqrt{2}}-\\frac{2 \\sqrt{2}}{3}(2 \\sqrt{2}-0) \\\\ & \\Rightarrow 2+4 \\cdot \\frac{\\pi}{4}-\\frac{8}{3}=\\pi-\\frac{2}{3}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "35031c465e8d428f920c96b3a6396a0c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/T8SzTB4Y68nce.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/T8SzTB4Y68nce.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 2)", "title": "JEE Main 2024 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446745970e6e9ab542d1c6", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 1)", "title": "JEE Main 2024 (08 Apr Shift 1)"}], "question": {"text": "Let the area of the region enclosed by the curve $y=\\min \\{\\sin x, \\cos x\\}$ and the $x$ axis between $x=-\\pi$ to $x=\\pi$ be $A$. Then $A^2$ is equal to ___________", "image": null}, "options": [], "correctValue": "16", "solution": {"text": "$\\begin{aligned} & y=\\min \\{\\sin x, \\cos x\\} \\\\ & x-\\text { axis } \\quad x-\\pi \\quad x=\\pi\\end{aligned}$<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Oqo3JdVvfN2myZndLD0E5i6l8qmPPltKBXrzPrVyzGs.original.fullsize.png\"><br />$\\begin{aligned} & \\int_0^{\\pi / 4} \\sin x=(\\cos x)_{\\pi / 4}^0=1-\\frac{1}{\\sqrt{2}} \\\\ & \\int_{-\\pi}^{-3 \\pi / 4}(\\sin x-\\cos x)=(-\\cos x-\\sin x)_{-\\pi}^{-3 \\pi / 4} \\\\ & =(\ ac{-a}{2}=-\\frac{1}{7} \\\\ & a=\\frac{2}{7} \\\\ & 7 a=2 \\\\ & 7 a-3=-1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 2)", "title": "JEE Main 2024 (06 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446726970e6e9ab542d0a3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}], "question": {"text": "The area enclosed between the curves $y=x|x|$ and $y=x-|x|$ is :", "image": null}, "options": [{"id": "yXkFj", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": true}, {"id": "FrrkZ", "text": "1", "image": null, "isCorrect": false}, {"id": "Nsjb6", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "AdfRr", "text": "$\\frac{8}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Q0SgqoJPnQR8WxGvDT1OEgc2L1ICPv9Bp2weeeJqSuw.original.fullsize.png\"><br />$A=\\int_{-2}^0-x^2-2 x=\\frac{4}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644671e970e6e9ab542d05e", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6a", "examId": "61 shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}], "question": {"text": "The area (in sq. units) of the region described by $\\left\\{(x, y): y^2 \\leq 2 x\\right.$, and $\\left.y \\geq 4 x-1\\right\\}$ is", "image": null}, "options": [{"id": "xVlER", "text": "$\\frac{11}{32}$", "image": null, "isCorrect": false}, {"id": "IjeNe", "text": "$\\frac{8}{9}$", "image": null, "isCorrect": false}, {"id": "95mY6", "text": "$\\frac{11}{12}$", "image": null, "isCorrect": false}, {"id": "apW9e", "text": "$\\frac{9}{32}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/EB4V2moWTRLoV_b6GTurOQk0e8k7KVNlCmLGArngsJ8.original.fullsize.png\"><br />$\\begin{aligned} & \\text { Shaded area }=\\int_{-\\frac{1}{2}}^1\\left(x_{\\text {Right }}-x_{\\text {Left }}\\right) d y \\\\ & y^2=2 x \\\\ & y=4 x-1 \\quad \\text { Solve } \\\\ & y=1, y=-\\frac{1}{2} \\\\ & \\text { Shaded area }=\\int_{-\\frac{1}{2}}^1\\left(\\frac{y+1}{4}-\\frac{y^2}{2}\\right) d y \\\\ & =\\left(\\frac{1}{4}\\left(\\frac{y^2}{2}+y\\right)-\\frac{y^3}{6}\\right)_{-\\frac{1}{2}}^1=\\frac{9}{32}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda69", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446709970e6e9ab542cf99", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}], "question": {"text": "One of the points of intersection of the curves $y=1+3 x-2 x^2$ and $y=\\frac{1}{x}$ is $\\left(\\frac{1}{2}, 2\\right)$. Let the area of the region enclosed by these curves be $\\frac{1}{24}(l \\sqrt{5}+\\mathrm{m})-\\mathrm{n} \\log _{\\mathrm{e}}(1+\\sqrt{5})$, where $l, \\mathrm{~m}, \\mathrm{n} \\in \\mathbf{N}$. Then $l+\\mathrm{m}+\\mathrm{n}$ is equal to", "image": null}, "options": [{"id": "55WmM", "text": "29", "image": null, "isCorrect": false}, {"id": "5Eqm9", "text": "31", "image": null, "isCorrect": false}, {"id": "rFlhf", "text": "30", "image": null, "isCorrect": true}, {"id": "yqbTx", "text": "32", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/JxRJet-kMjWZn3iXdSO6nLGmB3QZn6khs7Ov-kYkx5E.original.fullsize.png\"><br />$\\begin{aligned} & A=\\int_{\\frac{1}{2}}^{\\frac{1+\\sqrt{5}}{2}}\\left(1+3 x-2 x^2-\\frac{1}{x}\\right) \\mathrm{dx} \\\\ & A=\\left[x+\\frac{3 x^2}{2}-\\frac{2 x^3}{3}-\\ln x\\right]_{\\frac{1}{2}}^{1+\\sqrt{5}} \\\\ & A=\\frac{1+\\sqrt{5}}{2}+\\frac{3}{2}\\left(\\frac{1+\\sqrt{5}}{2}\\right)^2-\\frac{2}{3}\\left(\\frac{1+\\sqrt{5}}{2}\\right)^3-\\ln \\left(\\frac{1+\\sqrt{5}}{2}\\right) \\\\ & -\\frac{1}{2}-\\frac{3}{2}\\left(\\frac{1}{4}\\right)+\\frac{2}{3}\\left(\\frac{1}{8}\\right)+\\ln \\left(\\frac{1}{2}\\right) \\\\ & A=\\frac{1}{2}+\\frac{\\sqrt{5}}{2}+\\frac{3}{8}+\\frac{3}{4} \\sqrt{5}+\\frac{15}{8}-\\frac{4}{3}-\\frac{2}{3} \\sqrt{5} \\\\ & -\\frac{1}{2}-\\frac{3}{8}+\\frac{1}{12}-\\ln (1+\\sqrt{5}) \\\\ & =\\sqrt{5}\\left(\\frac{1}{2}+\\frac{3}{4}-\\frac{2}{3}\\right)+\\frac{15}{8}-\\frac{4}{3}+\\frac{1}{12}-\\ln (1+\\sqrt{5}) \\\\ & =\\frac{14}{24} \\sqrt{5}+\\frac{15}{24}-\\ln (1+\\sqrt{5})\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 , {"_id": "6682bd54ba0e94a3c4025bf4", "type": "numerical", "level": 1, "questionLabels": [], "question": {"text": "The area (in sq. units) of the part of circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>169</mn></math> which is below the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>13</mn></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>π</mi><mi>α</mi></mrow><mrow><mn>2</mn><mi>β</mi></mrow></mfrac><mo>-</mo><mfrac><mn>65</mn><mn>2</mn></mfrac><mo>+</mo><mfrac><mi>α</mi><mi>β</mi></mfrac><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mfrac><mn>12</mn><mn>13</mn></mfrac></mfenced></math> where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>,</mo><mi>β</mi></math> are coprime numbers. Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>+</mo><mi>β</mi></math> is equal to", "image": null}, "options": [], "correctValue": "171", "solution": {"text": "<p>Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>169</mn><mo>,</mo><mo> </mo><mn>5</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>13</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mn>5</mn><mi>x</mi><mo>-</mo><mn>13</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>169</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>25</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>169</mn><mo>-</mo><mn>130</mn><mi>x</mi><mo>-</mo><mn>169</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>26</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>130</mn><mi>x</mi><mo>=  function we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2f60ecd7-918c-4d46-bb3d-88e6e1bfae54.png\" style=\"width: 250px; height: 232px;\" /></p><p>Now from above diagram required&nbsp;bounded area will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msubsup><mo>&#8747;</mo><mn>1</mn><msqrt><mn>2</mn></msqrt></msubsup><mfenced><mrow><mi>x</mi><mo>-</mo><mfenced><mrow><mn>2</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced></mrow></mfenced><mi>d</mi><mi>x</mi><mo>+</mo><msubsup><mo>&#8747;</mo><msqrt><mn>2</mn></msqrt><mn>2</mn></msubsup><mfenced><mrow><mi>x</mi><mo>-</mo><mfenced><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn></mrow></mfenced></mrow></mfenced><mi>d</mi><mi>x</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mo>=</mo><msubsup><mfenced close=\"]\" open=\"[\"><mrow><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mfrac><msup><mi>x</mi><mn>3</mn></msup><mn>3</mn></mfrac></mrow></mfenced><mn>1</mn><msqrt><mn>2</mn></msqrt></msubsup><mo>+</mo><msubsup><mfenced close=\"]\" open=\"[\"><mrow><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>-</mo><mfrac><msup><mi>x</mi><mn>3</mn></msup><mn>3</mn></mfrac><mo>+</mo><mn>2</mn><mi>x</mi></mrow></mfenced><msqrt><mn>2</mn></msqrt><mn>2</mn></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>-</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>+</mo><mfrac><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow><mn>3</mn></mfrac></mrow></mfenced><mo>-</mo><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>-</mo><mn>2</mn><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow></mfenced><mo>+</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mo>-</mo><mfrac><mn>8</mn><mn>3</mn></mfrac><mo>+</mo><mn>4</mn></mrow></mfenced><mo>-</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow><mn>3</mn></mfrac><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfrac><mn>9</mn><mn>2</mn></mfrac><mo>-</mo><mfrac><mrow><mn>8</mn><msqrt><mn>2</mn></msqrt></mrow><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>27</mn><mo>-</mo><mn>16</mn><msqrt><mn>2</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><mn>6</mn><mi mathvariant=\"normal\">A</mi><mo>+</mo><mn>16</mn><msqrt><mn>2</mn></msqrt><mo>=</mo><mn>27</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d684e7", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>p</mi><mfenced><mi>x</mi></mfenced></math> be the parabola passing through the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#8211;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math>. If the area of the region&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"{\" close=\"}\"><mrow><mfenced><mrow><mi>x</mi><mo>,</mo><mo>&#160;</mo><mi>y</mi></mrow></mfenced><mo>:</mo><msup><mfenced><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>&#8804;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>y</mi><mo>&#8804;</mo><mi>p</mi><mfenced><mi>x</mi></mfenced></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>, then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mfenced><mrow><mi>&#960;</mi><mo>-</mo><mn>4</mn><mi>A</mi></mrow></mfenced></math>&nbsp;is equal to ________ .", "image": null}, "options": [], "correctValue": "16", "solution": {"text": "<blockquote><p>Let, the parabola be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi></math>,</p><p>Now given parabola is passing through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math></p><p>Now putting the value in the above equation of parabola we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>-</mo><mi>b</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>3</mn></mfenced></math></p><p>Now solving above three equations we get,</p><p>Parabola as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>1</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></math></p><p>Now area of region between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>1</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>&#8804;</mo><mn>1</mn></math>&nbsp;is given by,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5f6a2e8d-9d16-4fee-bdda-5b832bc2d93b.png\" style=\"width: 350px; height: 251px;\" /></p><p>Now from above diagram, required area will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><msubsup><mo>&#8747;</mo><mrow><mo>-</mo><mn>1</mn></mrow><mn>0</mn></msubsup><mfenced><mrow><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msqrt><mn>1</mn><mo>-</mo><msup><mfenced><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></msqrt></mrow></mfenced><mi>d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mo>=</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>(</mo><mi>&#960;</mi><mo>-</mo><mn>4</mn><mi>A</mi><mo>)</mo><mo>=</mo><mn>16</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68420", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "The area of the region&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"{\" close=\"}\"><mrow><mfenced><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></mfenced><mo>:</mo><mo>&#160;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>&#8804;</mo><mi>y</mi><mo>&#8804;</mo><mn>8</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup><mo>,</mo><mi>y</mi><mo>&#8804;</mo><mn>7</mn></mrow></mfenced></math>&nbsp;is&nbsp;", "image": null}, "options": [{"id": "OJ9RJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn></math>", "image": null, "isCorrect": false}, {"id": "3w2TZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn></math>", "image": null, "isCorrect": false}, {"id": "Jqck3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math>", "image": null, "isCorrect": true}, {"id": "MAhfO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>The given curves are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><m /mn><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mi>d</mi><mi>x</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mo>=</mo><mfenced open=\"|\" close=\"|\"><mrow><mn>2</mn><msubsup><mfenced><mrow><mfrac><mrow><mo>-</mo><msup><mi>x</mi><mn>3</mn></msup></mrow><mn>3</mn></mfrac><mo>+</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>x</mi></mrow></mfenced><mfrac><mrow><mn>3</mn><mo>-</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mfrac><mn>1</mn><mn>2</mn></mfrac></msubsup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mo>=</mo><mfrac><mrow><mn>5</mn><msqrt><mn>5</mn></msqrt><mo>-</mo><mn>11</mn></mrow><mn>6</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mi>A</mi><mo>+</mo><mn>11</mn><mo>=</mo><mn>5</mn><msqrt><mn>5</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mrow><mn>6</mn><mi>A</mi><mo>+</mo><mn>11</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>125</mn></math>.</p>", "image": null}, "videoSolution": {"videoId": "55ed72a8e1b34c7f87f644db2b72b900", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cqsxZMqtWTQkV.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cqsxZMqtWTQkV.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2 row></mfenced></math>&nbsp;we get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math></p><p>And solving&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfenced><mn>2</mn></msup><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>y</mi><mo>=</mo><mn>2</mn><mi>x</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfenced></math>&nbsp;we get,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>=</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>Now on plotting the diagram of the above region we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b5210be6-68c5-4a37-9ddf-7e9c63368b21-9896001.png\" style=\"width: 500px; height: 437px;\" /></p><p>Now from the above diagram area of the shaded region will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><msubsup><mo>&#8747;</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mfrac><mn>2</mn><mn>3</mn></mfrac></msubsup><mfenced><mrow><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mi>d</mi><mi>x</mi><mo>-</mo><mfenced close=\"}\" open=\"{\"><mrow><msubsup><mo>&#8747;</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mfrac><mn>1</mn><mn>2</mn></mfrac></msubsup><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfenced><mn>2</mn></msup><mi>d</mi> 9d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;be the maximum integral value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mn>0</mn><mo>,</mo><mn>10</mn></mrow></mfenced></math> for which the roots of the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>p</mi><mi>x</mi><mo>+</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><mi>p</mi><mo>=</mo><mn>0</mn></math>&nbsp;are rational. Then the area of the region <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"{\" close=\"}\"><mrow><mfenced><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></mfenced><mo>:</mo><mn>0</mn><mo>&#8804;</mo><mi>y</mi><mo>&#8804;</mo><mo>(</mo><mi>x</mi><mo>-</mo><mi>q</mi><msup><mo>)</mo><mn>2</mn></msup><mo>,</mo><mn>0</mn><mo>&#8804;</mo><mi>x</mi><mo>&#8804;</mo><mi>q</mi></mrow></mfenced></math>&nbsp;is", "image": null}, "options": [{"id": "tkTfc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>243</mn></math>", "isCorrect": true, "image": null}, {"id": "zw6KL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn></math>", "isCorrect": false, "image": null}, {"id": "SbEPU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>125</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "iH4kR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>164</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mi>p</mi><mi>x</mi><mo>+</mo><mfrac><mrow><mn>5</mn><mi>p</mi></mrow><mn>4</mn></mfrac><mo>=</mo><mn>0</mn></math></p><p>For rational roots,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi></math>&nbsp;must be a perfect square.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mo>=</mo><msup><mi>p</mi><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi>p</mi><mo>=</mo><mi>p</mi><mfenced><mrow><mi>p</mi><mo>-</mo><mn>5</mn></mrow></mfenced></math></p><p>Now put values in reverse order as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;is&nbsp;the maximum value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>=</mo><mn>10</mn></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mo>=</mo><mn>50</mn><mo>&#8594;</mo><mtext>not&#160;a&#160;perfect&#160;square</mtext></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>=</mo><mn>9</mn></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mo>=</mo><mn>36</mn><mo>&#8594;</mo><mtext>perfect&#160;square</mtext></math></p><p>So, the maximum integral value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>q</mi><mo>=</mo><mn>9</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#8804;</mo><mi>y</mi><mo>&#8804;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>9</mn></mrow></mfenced><mn>2</mn></msup></math></p><p>&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/37c1b0b7-0d80-4db8-9f2a-2fcb835972f4-9896074.png\" style=\"width: 400px; height: 345px;\" /></p><p>Area of shaded region&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msubsup><m )"}], "type": "singleCorrect", "level": 1, "question": {"text": "The area of the region enclosed between the parabolas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>1</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>3</mn></math> is.", "image": null}, "options": [{"id": "frs7N", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "Zd9z7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>6</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "FGuBr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "HwkCp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We have,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>1</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>3</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>We first find the points of intersection of the given parabolas by solving the&nbsp;equations <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mn>2</mn></mfenced></math>simultaneously.</p><p>This gives,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi> >-</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>+</mo><mi>x</mi></mrow></mfenced><mn>0</mn><mn>3</mn></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>27</mn><mn>3</mn></mfrac><mo>-</mo><mfrac><mn>9</mn><mn>2</mn></mfrac><mo>+</mo><mn>3</mn></math></p><p><math><mo>=</mo><mn>12</mn><mo>-</mo><mfrac><mrow><mn>9</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>15</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d667eb", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The area (in sq. units) in the first quadrant bounded by the parabola, $y=x^{2}+1$, the tangent to it at the point (2,5) and the coordinate axes is :", "image": null}, "options": [{"id": "7Zp0d", "text": "$\\frac{8}{3}$", "isCorrect": false, "image": null}, {"id": "4HCK8", "text": "$\\frac{37}{24}$", "isCorrect": true, "image": null}, {"id": "FLIiE", "text": "$\\frac{187}{24}$", "isCorrect": false, "image": null}, {"id": "5SumT", "text": "$\\frac{14}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fYoggIIYGTN6xBD6Qx3VBLkKetcriHuvr-bQe0fp3es.original.fullsize.png\"><br>\r\n\r\nThe equation of parabola $x^{2}=y-1$\r\n\r\nThe equation of tangent at (2,5) to parabola is\r\n\r\n$y-5=\\left(\\frac{d y}{d x}\\right)_{(2,5)}(x-2)$\r\n\r\n$y-5=4(x-2)$\r\n\r\n$4 x-y=3$\r\n\r\nThen, the required area\r\n\r\n$=\\int_{0}^{2}\\left\\{\\left(x^{2}+1\\right)-(4 x-3)\\right\\} d x-$ Area of $\\Delta A O D$\r\n\r\n$=\\int_{0}^{2}\\left(x^{2}-4 x+4\\right) d x-\\frac{1}{2} \\times \\frac{3}{4} \\times 3$\r\n\r\n$=\\left[\\frac{(x-2)^{3}}{3}\\right]_{0}^{2}-\\frac{9}{8}=\\frac{37}{24}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d6678e", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The area (in sq. units) of the region bounded by the curve $x^{2}=4 y$ and the straight line $x=4 y-2$ is :", "image": null}, "options": [{"id": "zQzrp", "text": "$\\frac{5}{4}$", "isCorrect": false, "image": null}, {"id": "oRhU9", "text": "$\\frac{9}{8}$", "isCorrect": true, "image": null}, {"id": "VhnR4", "text": "$\\frac{7}{8}$", "isCorrect": false, "image": null}, {"id": "VAS1K", "text": "$\\frac{3}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/rlMJ6CC3lOq6tClVsG7jaXtCd1AA0ppl6i_tFAiV3rY.original.fullsize.png\"><br>\r\n\r\nLet points of intersection of the curve and the line be\r\n\r\n$P$ and $Q$\r\n\r\n$x^{2}=4\\left(\\frac{x+2}{4}\\right)$\r\n\r\n$x^{2}-x-2=0$\r\n\r\n$x=2,-1$\r\n\r\nPoint are (2,1) and $\\left(-1, \\frac{1}{4}\\right)$\r\n\r\n$\\text { Area }=\\int_{-1}^{2}\\left[\\left(\\frac{x+2}{4}\\right)-\\left(\\frac{x^{2}}{4}\\right)\\right] d x=\\left[\\frac{x^{2}}{8}+\\frac{1}{2} x-\\frac{x^{3}}{12}\\right]_{-1}^{2}$\r\n\r\n$=\\left(\\frac{1}{2}+1-\\frac{2}{3}\\right)-\\left(\\frac{1}{8}-\\frac{1}{2}+\\frac{1}{12}\\right)=\\frac{9}{8}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d666cb", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the area enclosed between the curves&nbsp;<math><mi>y</mi><mo>=</mo><mi>k</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>k</mi><msup><mi>y</mi><mn>2</mn></msup><mo>,</mo><mo>&#160;</mo><mfenced separators=\"|\"><mrow><mi>k</mi><mo>&#62;</mo><mn>0</mn></mrow></mfenced><mo>,</mo></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>s</mi><mi>q</mi><mo>.</mo><mo>&#160;</mo><mi>u</mi><mi>n</mi><mi>i</mi><mi>t</mi><mo>.</mo></math>&nbsp;Then <math><mi>k</mi></math> is", "image": null}, "options": [{"id": "1ve0C", "text": "<math><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "1NsY2", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "Zs2vl", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "1THv9", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The given curves are,&nbsp;<math><mi>y</mi><mo>=</mo><mi>k</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo><mi>&#160;</mi><mi>x</mi><mo>=</mo><mi>k</mi><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></math></p><p>To find the point of intersection of the curves, put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;from the first curve into second, to get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>k</mi><mfenced separators=\"|\"><mrow><msup><mi>k</mi><mn>2</mn></msup><msup><mi>x</mi><mn>4</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>0</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>3</mn></msup><mo>=</mo><msup><mfenced separators=\"|\"><mfrac><mn>1</mn><mi>k</mi></mfrac></mfenced><mn>3</mn></msup><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mi>k</mi></mfrac></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>0</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>k</mi><msup><mfenced><mfrac><mn>1</mn><mi>k</mi></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mi>k</mi></mfrac></math></p><p>Therefore, point of intersection is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><mi>k</mi></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mi>k</mi></mfrac></mrow></mfenced><mo>.</mo></math></p><p><img src=\"https://cdn-question-p s=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>tan</mi><mi>x</mi></math>&nbsp;and at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac><mo>,</mo><mo>&#160;</mo><mi>y</mi><mo>=</mo><mi>tan</mi><mfenced><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac></mfenced><mo>=</mo><mn>1</mn></math></p><p>Also,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mi>s</mi><mi>e</mi><msup><mi>c</mi><mn>2</mn></msup><mi>x</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mfenced><mrow><mi>x</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac></mrow></msub><mo>=</mo><mi>s</mi><mi>e</mi><msup><mi>c</mi><mn>2</mn></msup><mfenced><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac></mfenced><mo>=</mo><msup><mfenced><msqrt><mn>2</mn></msqrt></mfenced><mn>2</mn></msup><mo>=</mo><mn>2</mn></math></p><p>We know&nbsp;that the equation of the tangent to a curve&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>f</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;at a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><msub><mfenced><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mfenced><mrow><mi>x</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac></mrow></msub><mfenced><mrow><mi>x</mi><mo>-</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfenced></math></p><p>Hence, the equation of the tangent to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>tan</mi><mi>x</mi></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>2</mn><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>2</mn><mi>x</mi><mo>-</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>-</mo><mn>1</mn><mo>+</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></mfrac><mo>=</mo><mn>2</mn><mi>x</mi></math></p><p>To find the point where this line cuts the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis, put&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>0</mn><mo>,</mo></math>&nbsp;to get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></mfrac><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>Thus, the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8801;</mo><mfenced><mrow><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced><mo>.</mo></math></p><p>Now, the graph for the given information is</p><p><im
