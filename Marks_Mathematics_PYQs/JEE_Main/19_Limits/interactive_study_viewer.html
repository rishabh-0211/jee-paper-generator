, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a8c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "If $f(x)=3 x^{10}-7 x^8+5 x^6-21 x^3+3 x^2-7$, then $\\lim _{\\alpha \\rightarrow 0} \\frac{f(1-\\alpha)-f(1)}{\\alpha^3+3 \\alpha}$ is", "image": null}, "options": [{"id": "hvsxj", "text": "\n$-\\frac{53}{3}$\n", "image": null, "isCorrect": false}, {"id": "cWTSl", "text": "\n$\\frac{53}{3}$\n", "image": null, "isCorrect": true}, {"id": "hwIcg", "text": "\n$-\\frac{55}{3}$\n", "image": null, "isCorrect": false}, {"id": "KcBsO", "text": "\n$\\frac{55}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\text { } \\begin{aligned}\n\\text { Let } f^{\\prime}(x) & =3 x^{10}-7 x^8+5 x^6-21 x^3+3 x^2-7 \\\\\nf^{\\prime}(x) & =30 x^9-56 x^7+30 x^5-63 x^2+6 x \\\\\nf^{\\prime}(1) & =30-56+30-63+6 \\\\\n& =66-63-56=-53\n\\end{aligned}\n$$\n\n$$\n\\begin{aligned}\n& \\text { Consider } \\lim _{\\alpha \\rightarrow 0} \\frac{f(1-\\alpha)-f(1)}{\\alpha^3+3 \\alpha} \\\\\n& =\\lim _{\\alpha \\rightarrow 0} \\frac{f^{\\prime}(1-\\alpha)(-1)-0}{3 \\alpha^2+3} \\quad \\text { (By using }\n\\end{aligned}\n$$\nL'hospital rule)\n$$\n=\\frac{f^{\\prime}(1-0)(-1)}{3(0)^2+3}=\\frac{-f^{\\prime}(1)}{3}=\\frac{53}{3}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656d9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "Let $\\alpha$ and $\\beta$ be the distinct roots of $a x^2+b x+c=0$, then $\\lim _{x \\rightarrow \\alpha} \\frac{1-\\cos \\left(a x^2+b x+c\\right)}{(x-\\alpha)^2}$ is equal to", "image": null}, "options": [{"id": "n9jWH", "text": "\n$\\frac{a^2}{2}(\\alpha-\\beta)^2$\n", "image": null, "isCorrect": true}, {"id": "PMXGn", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "L7LH9", "text": "\n$-\\frac{a^2}{2}(\\alpha-\\beta)^2$\n", "image": null, "isCorrect": false}, {"id": "7B3qx", "text": "\n$\\frac{1}{2}(\\alpha-\\beta)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\text { Given limit }=\\lim _{x \\rightarrow \\alpha} \\frac{1-\\cos a(x-\\alpha)(x-\\beta)}{(x-\\alpha)^2}=\\lim _{x \\rightarrow \\alpha} \\frac{2 \\sin ^2\\left(a \\frac{(x-\\alpha)(x-\\beta)}{2}\\right)}{(x-\\alpha)^2} \\\\\n& =\\lim _{x \\rightarrow \\alpha} \\frac{2}{(x-\\alpha)^2} \\times \\frac{\\sin ^2\\left(a \\frac{(x-\\alpha)(x-\\beta)}{2}\\right)}{a^2(x-\\alpha)^2(x-\\beta)^2} \\times \\frac{a^2(x-\\alpha)^2(x-\\beta)^2}{4} \\\\\n& =\\frac{a^2(\\alpha-\\beta)^2}{2} .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d6552f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "Let $\\mathrm{f}(\\mathrm{a})=\\mathrm{g}(\\mathrm{a})=\\mathrm{k}$ and their $n$th derivatives $\\mathrm{f}^{\\mathrm{n}}(\\mathrm{a}), \\mathrm{g}^{\\mathrm{n}}(\\mathrm{a})$ exist and are not equal for some $\\mathrm{n}$. Further if $\\lim _{x \\rightarrow a} \\frac{f(a) g(x)-f(a)-g(a) f(x)+f(a)}{g(x)-f(x)}=4$ then the value of $k$ is", "image": null}, "options": [{"id": "FEn3D", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "LxpoE", "text": "\n4\n", "image": null, "isCorrect": true}, {"id": "PUUAm", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "xM3Ug", "text": "\n1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow a} \\frac{k 9(x)-k f(x)}{9(k)-f(x)}=4$ (By L'Hospital rule)\n$\\lim _{x \\rightarrow a} k \\frac{9^{\\prime}(x)-f^{\\prime}(x)}{9^{\\prime}(x)-f^{\\prime}(x)}=4$ or $k=4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65500", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "$\\lim _{n \\rightarrow \\infty} \\frac{1+2^4+3^4+\\ldots n^4}{n^5}-\\lim _{n \\rightarrow \\infty} \\frac{1+2^3+3^3+\\ldots n^3}{n^5}$", "image": null}, "options": [{"id": "LGB7U", "text": "\n$\\frac{1}{5}$\n", "image": null, "isCorrect": true}, {"id": "VkwWh", "text": "\n$\\frac{1}{30}$\n", "image": null, "isCorrect": false}, {"id": "Cmdro", "text": "\nZero\n", "image": null, "isCorrect": false}, {"id": "gFFpr", "text": "\n$\\frac{1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\operatorname{Lim}_{n \\rightarrow \\infty}\\left\\{\\left(\\frac{1}{n}\\right)^4+\\left(\\frac{2}{n}\\right)^4+\\left(\\frac{3}{n}\\right)^4+\\ldots \\ldots \\ldots .\\left(\\frac{n}{n}\\right)^4\\right\\}-\\operatorname{Lim}_{n \\rightarrow \\infty} \\frac{1}{n}\\left\\{\\frac{1}{n^4}+\\frac{2^3}{n^4}+\\ldots \\ldots . \\cdot \\frac{n^3}{n^4}\\right\\}$\n$\\int_0^1(x)^4 d x-0=\\left[\\frac{x^5}{5}\\right]_0^1=\\frac{1}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65452", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "If $f(1)=1, f^{\\prime}(1)=2$, then $\\operatorname{Lim}_{x \\rightarrow 1} \\frac{\\sqrt{f(x)}-1}{\\sqrt{x}-1}$ is", "image": null}, "options": [{"id": "6Y8By", "text": "\n2\n", "image": null, "isCorrect": true}, {"id": "86TRK", "text": "\n4\n", "image": null, "isCorrect": false}, {"id": "uKdDX", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "7kpv1", "text": "\n1/2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/sWhZ4lzb4XYmqG8dCiWmfj7xXYOuotsrgTgLVHXYW44.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65450", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "$$\n\\operatorname{Lim}_{n \\rightarrow \\infty} \\frac{1^p+2^p+3^p+\\ldots+n^p}{n^{p+1}}\n$$ \nis", "image": null}, "options": [{"id": "yRJ6T", "text": "\n$\\frac{1}{p+1}$\n", "image": null, "isCorrect": true}, {"id": "hco1u", "text": "\n$\\frac{1}{1-p}$\n", "image": null, "isCorrect": false}, {"id": "EjxGV", "text": "\n$\\frac{1}{p}-\\frac{1}{p-1}$\n", "image": null, "isCorrect": false}, {"id": "5TBOr", "text": "\n$\\frac{1}{p+2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/zbHPNTGEhHoJILotZDWcaVJVwa4j3QUEv815xRkrztE.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65430", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Let $f(x)=4$ and $f^{\\prime}(x)=4$. Then $\\operatorname{Lim}_{x \\rightarrow 2} \\frac{x f(2)-2 f(x)}{x-2}$ is given by", "image": null}, "options": [{"id": "T40ce", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "DyR3u", "text": "\n-2\n", "image": null, "isCorrect": false}, {"id": "PoJYH", "text": "\n-4\n", "image": null, "isCorrect": true}, {"id": "cSEtQ", "text": "\n3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have, $\\operatorname{Lim}_{x \\rightarrow 2} \\frac{x f(2)-2 f(x)}{x-2}\\left(\\frac{0}{0}\\right)=\\operatorname{Lim}_{x \\rightarrow 2} f(2)-2 f^{\\prime}(x)=f(2)-2 f^{\\prime}(2)=4-2 \\times 4=-4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d692f1", "title": "Trigonometric and Inverse Trigonometric limits", "totalQuestions": 46, "questions": [{"_id": "69d8073e81239f6567c4f376", "type": "singleCorrect", "question": {"text": "Let $\\lim\\limits_{x \\to 2} \\dfrac{(\\tan(x-2))(rx^2 + (p-2)x - 2p)}{(x-2)^2} = 5$ for some $r, p \\in \\mathbb{R}$. If the set of all possible values of $q$, such that the roots of the equation $rx^2 - px + q = 0$ lie in $(0, 2)$, be the interval $(\\alpha, \\beta]$, then $4(\\alpha + \\beta)$ equals :", "image": null}, "options": [{"id": "TCHFt", "text": "$11$", "isCorrect": false, "image": null}, {"id": "rTpyx", "text": "$13$", "isCorrect": false, "image": null}, {"id": "siDPn", "text": "$17$", "isCorrect": true, "image": null}, {"id": "Ignpv", "text": "$21$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given limit is $\\lim\\limits_{x \\to 2} \\dfrac{\\tan(x-2)}{x-2} \\cdot \\dfrac{rx^2 + (p-2)x - 2p}{x-2} = 5$<br><br>Since $\\lim\\limits_{x \\to 2} \\dfrac{\\tan(x-2)}{x-2} = 1$, we have:<br><br>$\\lim\\limits_{x \\to 2} \\dfrac{rx^2 + (p-2)x - 2p}{x-2} = 5$<br><br>For the limit to exist, the numerator must be zero at $x = 2$:<br><br>$r(2)^2 + (p-2)(2) - 2p = 0$<br><br>$4r + 2p - 4 - 2p = 0 \\Rightarrow 4r = 4 \\Rightarrow r = 1$<br><br>Substituting $r = 1$ into the limit expression:<br><br>$\\lim\\limits_{x \\to 2} \\dfrac{x^2 + (p-2)x - 2p}{x-2} = 5$<br><br>$\\lim\\limits_{x \\to 2} \\dfrac{(x-2)(x+p)}{x-2} = 5$<br><br>$\\lim\\limits_{x \\to 2} (x+p) = 5 \\Rightarrow 2 + p = 5 \\Rightarrow p = 3$<br><br>The quadratic equation is $rx^2 - px + q = 0$, which becomes $x^2 - 3x + q = 0$.<br><br>For both roots of $f(x) = x^2 - 3x + q = 0$ to lie in the interval $(0, 2)$, the following conditions must hold:<br><br>1) Discriminant $D \\ge 0 \\Rightarrow (-3)^2 - 4(1)(q) \\ge 0 \\Rightarrow 9 - 4q \\ge 0 \\Rightarrow q \\le \\dfrac{9}{4}$<br><br>2) $f(0) > 0 \\Rightarrow q > 0$<br><br>3) $f(2) > 0 \\Rightarrow 2^2 - 3(2) + q > 0 \\Rightarrow q - 2 > 0 \\Rightarrow q > 2$<br><br>4) The $x$-coordinate of the vertex must lie in $(0, 2) \\Rightarrow 0 < \\dfrac{-(-3)}{2(1)} < 2 \\Rightarrow 0 < 1.5 < 2$, which is true.<br><br>Taking the intersection of all conditions, we get $q \\in (2, \\dfrac{9}{4}]$.<br><br>Comparing this with $(\\alpha, \\beta]$, we have $\\alpha = 2$ and $\\beta = \\dfrac{9}{4}$.<br><br>Therefore, $4(\\alpha + \\beta) = 4(2 + \\dfrac{9}{4}) = 8 + 9 = 17$.<br><br>Answer: $17$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "6d0fb8ad4c934655b1e2f949fb2e4d70", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PzTI03icH9oJR.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PzTI03icH9oJR.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074b81239f6567c4f40d", "type": "singleCorrect", "question": {"text": "The value of $\\lim_{x \\to 0}\\left(\\dfrac{x^2\\sin^2 x}{x^2 - \\sin^2 x}\\right)$ is:", "image": null}, "options": [{"id": "7HtSL", "text": "$2$", "isCorrect": false, "image": null}, {"id": "z1xPu", "text": "$3$", "isCorrect": true, "image": null}, {"id": "feEbY", "text": "$4$", "isCorrect": false, "image": null}, {"id": "UeDab", "text": "$6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $L = \\lim_{x \\to 0} \\dfrac{x^2\\sin^2 x}{x^2 - \\sin^2 x}$<br><br>Dividing the numerator and the denominator by $x^4$, we get:<br><br>$L = \\lim_{x \\to 0} \\dfrac{\\left(\\dfrac{\\sin x}{x}\\right)^2}{\\dfrac{x^2 - \\sin^2 x}{x^4}}$<br><br>Factorizing the denominator:<br><br>$L = \\lim_{x \\to 0} \\dfrac{\\left(\\dfrac{\\sin x}{x}\\right)^2}{\\left(\\dfrac{x - \\sin x}{x^3}\\right) \\left(\\dfrac{x + \\sin x}{x}\\right)}$<br><br>Using the standard limits:<br><br>$\\lim_{x \\to 0} \\dfrac{\\sin x}{x} = 1$<br><br>$\\lim_{x \\to 0} \\dfrac{x - \\sin x}{x^3} = \\dfrac{1}{6}$ (using Taylor series expansion $\\sin x = x - \\dfrac{x^3}{3!} + \\dots$)<br><br>$\\lim_{x \\to 0} \\dfrac{x + \\sin x}{x} = \\lim_{x \\to 0} \\left(1 + \\dfrac{\\sin x}{x}\\right) = 1 + 1 = 2$<br><br>Substituting these limits into the expression:<br><br>$L = \\dfrac{1^2}{\\left(\\dfrac{1}{6}\\right) \\times 2} = \\dfrac{1}{\\dfrac{1}{3}} = 3$<br><br>Answer: $3$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "5ef17d461cbf4d8a9ab4c76fc1ab3f33", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/61UiXJBsC3dUW.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/61UiXJBsC3dUW.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075e81239f6567c4f4ee", "type": "singleCorrect", "question": {"text": "Let $f(x) = \\lim_{y \\to 0} \\dfrac{(1 - \\cos(xy)) \\tan(xy)}{y^3}$. Then the number of solutions of the equation $f(x) = \\sin x$, $x \\in \\mathbf{R}$ is :", "image": null}, "options": [{"id": "ndPHP", "text": "$0$", "isCorrect": false, "image": null}, {"id": "zCxds", "text": "$2$", "isCorrect": false, "image": null}, {"id": "K9puC", "text": "$3$", "isCorrect": true, "image": null}, {"id": "LoNgh", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given function is $f(x) = \\lim_{y \\to 0} \\dfrac{(1 - \\cos(xy)) \\tan(xy)}{y^3}$.<br><br>Multiplying and dividing by $x^3$, we get:<br><br>$f(x) = \\lim_{y \\to 0} \\dfrac{1 - \\cos(xy)}{(xy)^2} \\cdot \\dfrac{\\tan(xy)}{xy} \\cdot x^3$<br><br>Using the standard limits $\\lim_{t \\to 0} \\dfrac{1 - \\cos t}{t^2} = \\dfrac{1}{2}$ and $\\lim_{t \\to 0} \\dfrac{\\tan t}{t} = 1$, we obtain:<br><br>$f(x) = \\dfrac{1}{2} \\cdot 1 \\cdot x^3 = \\dfrac{x^3}{2}$<br><br>We need to find the number of solutions for the equation $f(x) = \\sin x$, which is $\\dfrac{x^3}{2} = \\sin x$.<br><br>Let $g(x) = \\dfrac{x^3}{2} - \\sin x$.<br><br>Differentiating with respect to $x$:<br><br>$g'(x) = \\dfrac{3x^2}{2} - \\cos x$<br><br>$g''(x) = 3x + \\sin x$<br><br>For $x > 0$, $g''(x) > 0$, which implies that $g'(x)$ is strictly increasing on $(0, \\infty)$.<br><br>We have $g'(0) = -1 < 0$ and $g'(\\pi/2) = \\dfrac{3\\pi^2}{8} > 0$. Thus, $g'(x) = 0$ has exactly one root in $(0, \\infty)$, say at $x = x_0$.<br><br>This means $g(x)$ decreases on $(0, x_0)$ and increases on $(x_0, \\infty)$.<br><br>Since $g(0) = 0$ and $g(x)$ initially decreases, $g(x_0) < 0$. As $x \\to \\infty$, $g(x) \\to \\infty$. Therefore, $g(x) = 0$ has exactly one positive root.<br><br>Since $g(x)$ is an odd function ($g(-x) = -g(x)$), it must also have exactly one negative root.<br><br>Including the trivial root $x = 0$, the equation $g(x) = 0$ has exactly $3$ solutions.<br><br>Answer: $3$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "78f3076df38b43b882f02d171dc018db", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/THee1GNeo5EaS.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/THee1GNeo5EaS.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073181239f6567c4f2e1", "type": "singleCorrect", "question": {"text": "The product of all possible values of $\\alpha$, for which $\\displaystyle\\lim_{x \\to 0}\\left(\\dfrac{1 - \\cos(\\alpha x)\\cos((\\alpha+1)x)\\cos((\\alpha+2)x)}{\\sin^2((\\alpha+1)x)}\\right) = 2$, is:", "image": null}, "options": [{"id": "cQkD6", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "eqtDx", "text": "$1$", "isCorrect": false, "image": null}, {"id": "4AOBH", "text": "$-1$", "isCorrect": true, "image": null}, {"id": "2UOMP", "text": "$\\dfrac{5}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the standard expansions for small $x$, $\\cos \\theta \\approx 1 - \\dfrac{\\theta^2}{2}$ and $\\sin \\theta \\approx \\theta$.<br><br>The given limit can be written as:<br><br>$\\displaystyle\\lim_{x \\to 0} \\dfrac{1 - \\left(1 - \\dfrac{\\alpha^2 x^2}{2}\\right)\\left(1 - \\dfrac{(\\alpha+1)^2 x^2}{2}\\right)\\left(1 - \\dfrac{(\\alpha+2)^2 x^2}{2}\\right)}{((\\alpha+1)x)^2}$<br><br>Neglecting higher powers of $x$, the numerator simplifies to:<br><br>$1 - \\left(1 - \\dfrac{x^2}{2}\\left(\\alpha^2 + (\\alpha+1)^2 + (\\alpha+2)^2\\right)\\right) = \\dfrac{x^2}{2}\\left(\\alpha^2 + (\\alpha+1)^2 + (\\alpha+2)^2\\right)$<br><br>Substituting this back into the limit:<br><br>$\\displaystyle\\lim_{x \\to 0} \\dfrac{\\dfrac{x^2}{2}\\left(\\alpha^2 + (\\alpha+1)^2 + (\\alpha+2)^2\\right)}{(\\alpha+1)^2 x^2} = \\dfrac{\\alpha^2 + (\\alpha+1)^2 + (\\alpha+2)^2}{2(\\alpha+1)^2}$<br><br>We are given that this limit is equal to $2$. Therefore:<br><br>$\\dfrac{\\alpha^2 + (\\alpha+1)^2 + (\\alpha+2)^2}{2(\\alpha+1)^2} = 2$<br><br>$\\alpha^2 + (\\alpha+1)^2 + (\\alpha+2)^2 = 4(\\alpha+1)^2$<br><br>Let $y = \\alpha+1$. Then $\\alpha = y-1$ and $\\alpha+2 = y+1$. The equation becomes:<br><br>$(y-1)^2 + y^2 + (y+1)^2 = 4y^2$<br><br>$y^2 - 2y + 1 + y^2 + y^2 + 2y + 1 = 4y^2$<br><br>$3y^2 + 2 = 4y^2$<br><br>$y^2 = 2$<br><br>Substituting $y = \\alpha+1$ back into the equation:<br><br>$(\\alpha+1)^2 = 2$<br><br>$\\alpha^2 + 2\\alpha + 1 = 2$<br><br>$\\alpha^2 + 2\\alpha - 1 = 0$<br><br>The roots of this quadratic equation represent all possible values of $\\alpha$. The product of the roots is given by $\\dfrac{c}{a}$:<br><br>$\\text{Product} = \\dfrac{-1}{1} = -1$<br><br>Answer: $-1$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "5d303aa7821741d6b12426688baea3c8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/M3C5LgbSqcJP0.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/M3C5LgbSqcJP0.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c857c09d044e4c1a268", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "sho e": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "$\\lim _{x \\rightarrow 0}\\left(\\frac{x-\\sin x}{x}\\right) \\sin \\left(\\frac{1}{x}\\right)$", "image": null}, "options": [{"id": "iA2fF", "text": "\nequals 1\n", "image": null, "isCorrect": false}, {"id": "5DHjz", "text": "\nequals 0\n", "image": null, "isCorrect": true}, {"id": "3v3Xl", "text": "\ndoes not exist\n", "image": null, "isCorrect": false}, {"id": "rjbu0", "text": "\nequals $-1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider $\\lim _{x \\rightarrow 0}\\left(\\frac{x-\\sin x}{x}\\right) \\sin \\left(\\frac{1}{x}\\right)$\n$=\\lim _{x \\rightarrow 0}\\left[\\frac{x\\left(1-\\frac{\\sin x}{x}\\right)}{x}\\right] \\times \\lim _{x \\rightarrow 0} \\sin \\left(\\frac{1}{x}\\right)$\n$=\\lim _{x \\rightarrow 0}\\left[1-\\frac{\\sin x}{x}\\right] \\times \\lim _{x \\rightarrow 0} \\sin \\left(\\frac{1}{x}\\right)$\n$=\\left[1-\\lim _{x \\rightarrow 0} \\frac{\\sin x}{x}\\right] \\times \\lim _{x \\rightarrow 0} \\sin \\left(\\frac{1}{x}\\right)$\n$=0 \\times \\lim _{x \\rightarrow 0} \\sin \\left(\\frac{1}{x}\\right)=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65972", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "$$\n\\lim _{x \\rightarrow 2}\\left(\\frac{\\sqrt{1-\\cos \\{2(x-2)\\}}}{x-2}\\right)", "image": null}, "options": [{"id": "lBrIn", "text": "\nequals $\\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "oLwCP", "text": "\nequals $-\\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "o8HEK", "text": "\nequals $\\frac{1}{\\sqrt{2}}$\n", "image": null, "isCorrect": false}, {"id": "5SVWv", "text": "\ndoes not exist", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\lim _{x \\rightarrow 2} \\frac{\\sqrt{2 \\sin ^2(x-2)}}{x-2} \\\\\n& \\lim _{x \\rightarrow 2} \\frac{\\sqrt{2}|\\sin (x-2)|}{x-2} \\\\\n& \\text { R.H.L. }=\\sqrt{2}, \\text { L.H.L. }=-\\sqrt{2}\n\\end{aligned}\n$$\nLimit does not exist.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656c5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "$\\lim _{n \\rightarrow \\infty}\\left[\\frac{1}{n^2} \\sec ^2 \\frac{1}{n^2}+\\frac{2}{n^2} \\sec ^2 \\frac{4}{n^2}+\\ldots .+\\frac{1}{n^2} \\sec ^2 1\\right]$ equals", "image": null}, "options": [{"id": "oZvxV", "text": "\n$\\frac{1}{2} \\sec 1$\n", "image": null, "isCorrect": false}, {"id": "sZh2C", "text": "\n$\\frac{1}{2} \\operatorname{cosec} 1$\n", "image": null, "isCorrect": false}, {"id": "Y54QT", "text": "\n$\\tan 1$\n", "image": null, "isCorrect": false}, {"id": "rT1vO", "text": "\n$\\frac{1}{2} \\tan 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\lim _{n \\rightarrow \\infty}\\left[\\frac{1}{n^2} \\sec ^2 \\frac{1}{n^2}+\\frac{2}{n^2} \\sec ^2 \\frac{4}{n^2}+\\frac{3}{n^2} \\sec ^2 \\frac{9}{n^2}+\\ldots .+\\frac{1}{n} \\sec ^2 1\\right]$ is equal to $\\lim _{n \\rightarrow \\infty} \\frac{r}{n^2} \\sec ^2 \\frac{r^2}{n^2}=\\lim _{n \\rightarrow \\infty} \\frac{1}{n} \\cdot \\frac{r}{n} \\sec ^2 \\frac{r^2}{n^2}$\n$\\Rightarrow$ Given limit is equal to value of integral $\\int_0^1 x \\sec ^2 x^2 d x$\nor $\\frac{1}{2} \\int_0^1 2 x \\sec x^2 d x=\\frac{1}{2} \\int_0^1 \\sec ^2 t d t$\n[put $\\left.x^2=t\\right]$ $=\\frac{1}{2}(\\tan t)_0^1=\\frac{1}{2} \\tan 1$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655f9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "Let $f(x)=\\frac{1-\\tan x}{4 x-\\pi}, x \\neq \\frac{\\pi}{4}, x \\in\\left[0, \\frac{\\pi}{2}\\right]$. If $f(x)$ is continuous in $\\left[0, \\frac{\\pi}{2}\\right]$, then $f\\left(\\frac{\\pi}{4}\\right)$ is", "image": null}, "options": [{"id": "GCLkS", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "IIFay", "text": "\n$\\frac{1}{2}$\n", "image": null, "isCorrect": false}, {"id": "9pOta", "text": "\n$-\\frac{1}{2}$\n", "image": null, "isCorrect": true}, {"id": "fp1a1", "text": "\n$-1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f(x)=\\frac{1-\\tan x}{4 x-\\pi} \\Rightarrow \\lim _{x \\rightarrow \\frac{\\pi}{4}} \\frac{1-\\tan x}{4 x-\\pi}=-\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65530", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "$$\n\\lim _{x \\rightarrow \\frac{\\pi}{2}} \\frac{\\left[1-\\tan \\left(\\frac{x}{2}\\right)\\right][1-\\sin x]}{\\left[1+\\tan \\left(\\frac{x}{2}\\right)\\right]\\left[\\pi-2 x^3\\right]}\n$$\nis", "image": null}, "options": [{"id": "XVB7x", "text": "\n$\\infty$\n", "image": null, "isCorrect": false}, {"id": "Oonb5", "text": "\n$\\frac{1}{8}$\n", "image": null, "isCorrect": false}, {"id": "vaR35", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "VRyez", "text": "\n$\\frac{1}{32}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow \\frac{\\pi}{2}} \\frac{\\tan \\left(\\frac{\\pi}{4}-\\frac{x}{2}\\right) \\cdot(1-\\sin x)}{(\\pi-2 x)^3}$\nLet $\\mathrm{x}=\\frac{\\pi}{2}+\\mathrm{y} ; \\mathrm{y} \\rightarrow 0$\n$=\\lim _{y \\rightarrow 0} \\frac{-\\tan \\left(-\\frac{y}{2}\\right) \\cdot(1-\\cos y)}{(-2 y)^3}=\\lim _{y \\rightarrow 0} \\frac{-\\tan \\frac{y}{2} 2 \\sin ^2 \\frac{y}{2}}{(-8) \\cdot \\frac{y^3}{8} \\cdot 8}$\n$=\\lim _{y \\rightarrow 0} \\frac{1}{32} \\frac{\\tan \\frac{y}{2}}{\\left(\\frac{y}{2}\\right)} \\cdot\\left[\\frac{\\sin y / 2}{y / 2}\\right]^2=\\frac{1}{32}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65421", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/UijjHtHxFoLykxDx1EjMtI16lxmtgmfHqcIFJcwuLfY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "H6oiL", "text": "\n1\n", "image": null, "isCorrect": true}, {"id": "G3ZaT", "text": "\n-1\n", "image": null, "isCorrect": false}, {"id": "sZ9tu", "text": "\nzero\n", "image": null, "isCorrect": false}, {"id": "Dexlf", "text": "\ndoes not exist", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\operatorname{Lim}_{x \\rightarrow 0} \\frac{\\sqrt{1-\\cos 2 x}}{\\sqrt{2} x} \\Rightarrow \\operatorname{Lim}_{x \\rightarrow 0} \\frac{\\sqrt{1-\\left(1-2 \\sin ^2 x\\right)}}{\\sqrt{2} x} ; \\operatorname{Lim}_{x \\rightarrow 0} \\frac{\\sqrt{2 \\sin ^2 x}}{\\sqrt{2} x} \\Rightarrow \\operatorname{Lim}_{x \\rightarrow 0} \\frac{|\\sin x|}{x}\n$$\nthe function does not exist or $\\mathrm{LHS} \\neq \\mathrm{RHS}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a73417cc3fb48d692f2", "title": "Exponential and logarithmic limits", "totalQuestions": 13, "questions": [{"_id": "6983c1aa8bfdbb2435639792", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The value of $\\lim _{x \\rightarrow 0} \\frac{\\log _{e}\\left(\\sec (e x) \\cdot \\sec \\left(e^{2} x\\right) \\cdot \\ldots \\cdot \\sec \\left(e^{10} x\\right)\\right)}{e^{2}-e^{2 \\cos x}}$ is equal to", "image": null}, "options": [{"id": "kbB7u", "text": "$\\frac{\\left(e^{20}-1\\right)}{2\\left(e^{2}-1\\right)}$", "isCorrect": true, "image": null}, {"id": "ztaVb", "text": "$\\frac{\\left(e^{10}-1\\right)}{2\\left(e^{2}-1\\right)}$", "isCorrect": false, "image": null}, {"id": "9j8lS", "text": "$\\frac{\\left(e^{10}-1\\right)}{2 e^{2}\\left(e^{2}-1\\right)}$", "isCorrect": false, "image": null}, {"id": "vcm7Q", "text": "$\\frac{\\left(e^{20}-1\\right)}{2 e^{2}\\left(e^{2}-1\\right)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Numerator: $\\log_e(\\sec(ex)\\sec(e^2x)\\cdots\\sec(e^{10}x)) = \\sum_{k=1}^{10} \\log_e(\\sec(e^kx))$.<br>Using $\\sec(u) \\approx 1 + \\frac{u^2}{2}$ for small $u$, we get $\\log_e(\\sec(e^kx)) \\approx \\frac{e^{2k}x^2}{2}$.<br>Thus the numerator is $\\approx \\frac{x^2}{2}\\sum_{k=1}^{10} e^{2k} = \\frac{x^2 e^2(e^{20}-1)}{2(e^2-1)}$. <br>Denominator: Using $\\cos x \\approx 1 - \\frac{x^2}{2}$, we have $e^{2\\cos x} \\approx e^2(1-x^2)$, so $e^2 - e^{2\\cos x} \\approx e^2 x^2$. <br>Therefore: $\\lim_{x \\to 0} = \\frac{\\frac{x^2 e^2(e^{20}-1)}{2(e^2-1)}}{e^2 x^2} = \\frac{e^{20}-1}{2(e^2-1)}$.", "image": null}, "videoSolution": {"videoId": "ba01481190c24b4b9f6d590eea22e382", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/TUX2HXc3pXQsu.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/TUX2HXc3pXQsu.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b , "text": "Statement I is false but Statement II is true", "image": null, "isCorrect": false}, {"id": "AfwlG", "text": "Statement I is true but Statement II is false", "image": null, "isCorrect": false}, {"id": "dlSz4", "text": "Both Statement I and Statement II are false", "image": null, "isCorrect": false}, {"id": "BqIxn", "text": "Both Statement I and Statement II are true", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned}<br/>& \\lim _{x \\rightarrow 0} \\frac{\\tan ^{-1} x+\\frac{1}{2}[\\ln (1+x)-\\ln (1-x)]-2 x}{x^5} \\\\\n& =\\lim _{x \\rightarrow 0} \\frac{\\left(x-\\frac{x^3}{3}+\\frac{x^5}{5} \\ldots\\right)+\\frac{1}{2}\\left[x-\\frac{x^2}{2}+\\frac{x^3}{3} \\ldots-\\left(-x-\\frac{x^2}{2}-\\frac{x^3}{3} \\ldots\\right)\\right]-2 x}{x^5} \\\\\n& =\\lim _{x \\rightarrow 0} \\frac{2 x+\\frac{2 x^5}{5} \\ldots-2 x}{x^5}=\\frac{2}{5} \\\\\n& \\lim _{x \\rightarrow 1} x^{\\frac{2}{(1-x)}}=e^{\\lim _{x \\rightarrow l}\\left(\\frac{2}{(1-x)}\\right)(x-1)}=e^{-2}<br/>\\end{aligned}$<br/>$\\Rightarrow$ Both statements correct", "image": null}, "videoSolution": {"videoId": "458e8cf013bb4611ac35a2893dcc3274", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7MoYcMzEb5Ic6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7MoYcMzEb5Ic6.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eec4c8b73881fdaea2b5", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d9760f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-28T14:00:00.000Z", "isVisible": true, "shortName": "2025 (28 Jan Shift 2)", "title": "JEE Main 2025 (28 Jan Shift 2)"}], "question": {"text": "Let $f(x)=\\lim _{\\mathrm{n} \\rightarrow \\infty} \\sum_{\\mathrm{r}=0}^{\\mathrm{n}}\\left(\\frac{\\tan \\left(x / 2^{r+1}\\right)+\\tan ^3\\left(x / 2^{r+1}\\right)}{1-\\tan ^2\\left(x / 2^{r+1}\\right)}\\right)$. Then $\\lim _{x \\rightarrow 0} \\frac{\\mathrm{e}^x-\\mathrm{e}^{f(x)}}{(x-f(x))}$ is equal to", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "$\\begin{aligned} & f(x)=\\lim _{x \\rightarrow \\infty}\\left(\\frac{\\tan \\left(x / 2^{r+1}\\right)+\\tan ^3\\left(x / 2^{r+1}\\right)}{1-\\tan ^2\\left(x / 2^{r+1}\\right)}\\right) \\\\ & =\\lim _{x \\rightarrow \\infty} \\frac{\\tan \\left(\\frac{x}{2^{r+1}}\\right)}{\\cos \\left(\\frac{x}{2^r}\\right)} \\\\ & =\\lim _{x \\rightarrow \\infty} \\frac{\\sin \\left(x / 2^{r+1}\\right)}{\\cos \\left(\\frac{x}{2^{r+1}}\\right) \\cos \\left(\\frac{x}{2^r}\\right)} \\\\ & =\\lim _{x \\rightarrow \\infty} \\frac{\\sin \\left(\\frac{x}{2^r}-\\frac{x}{2^{r+1}}\\right)}{\\cos \\left(\\frac{x}{2^{r+1}}\\right) \\cos \\left(\\frac{x}{2^r}\\right)}\\end{aligned}$\n$=\\lim _{x \\rightarrow \\infty} \\tan \\left(\\frac{x}{2^r}\\right)-\\tan \\left(\\frac{x}{2^{r+1}}\\right)$\nFrom condition given question\n$\\begin{aligned}\n& \\therefore \\lim _{n \\rightarrow \\infty} \\sum_{r=0}^n\\left[\\tan \\left(\\frac{x}{2^r}\\right)-\\tan \\left(\\frac{x}{2^{r+1}}\\right)\\right]=\\tan x \\\\\n& \\therefore \\lim _{x \\rightarrow 0}\\left(\\frac{e^x-e^{\\tan x}}{x-\\tan x}\\right) \\\\\n& \\Rightarrow \\lim _{x \\rightarrow 0} e^{\\tan x}\\left(\\frac{e^{x-\\tan x}-1}{x-\\tan x}\\right) \\\\\n& \\Rightarrow \\lim _{x \\rightarrow 0} e^{\\tan x} \\lim _{x \\rightarrow 0}\\left(\\frac{e^{x-\\tan x}-1}{x-\\tan x}\\right) \\\\\n& \\Rightarrow 1.1\\left(\\because \\lim _{x \\rightarrow 0} \\frac{e^{x-1}}{x}=1\\right) \\\\\n& \\quad=1\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "953bd5ca1c3f49e1b422c4ade4e8128b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Ckxpvhpl7l7ed.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Ckxpvhpl7l7ed.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d9760f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-28T14:00:00.000Z", "isVisible": true, "shortName": "2025 (28 Jan Shift 2)", "title": "JEE Main 2025 (28 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee9ec8b73881fdaea177", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}], "question": {"text": "$\\lim _{x \\rightarrow \\infty} \\frac{\\left(2 x^2-3 x+5\\right)(3 x-1)^{\\frac{x}{2}}}{\\left(3 x^2+5 x+4\\right) \\sqrt{(3 x+2)^x}}$ is equal to :", "image": null}, "options": [{"id": "2RoAh", "text": "$\\frac{2}{\\sqrt{3 \\mathrm{e}}}$", "image": null, "isCorrect": false}, {"id": "3JVEA", "text": "$\\frac{2 \\mathrm{e}}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "qfYTF", "text": "$\\frac{2}{3 \\sqrt{\\mathrm{e}}}$", "image": null, "isCorrect": true}, {"id": "rBBrI", "text": "$\\frac{2 \\mathrm{e}}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\lim _{x \\rightarrow \\infty} \\frac{\\left(2 x^2-3 x+5\\right)(3 x-1)^{x / 2}}{\\left(3 x^2+5 x+4\\right) \\sqrt{(3 x+2)^x}} \\\\\n& =\\lim _{x \\rightarrow \\infty} \\frac{x^2\\left(2-\\frac{3}{x}+\\frac{5}{x^2}\\right)(3 x)^{\\frac{x}{2}}}{x^2\\left(3+\\frac{5}{x}+\\frac{4}{x^2}\\right)(3 x)^{\\frac{x}{2}}} \\cdot \\frac{\\left(1-\\frac{1}{3 x}\\right)^{\\frac{x}{2}}}{\\left(1+\\frac{2}{3 x}\\right)^{\\frac{x}{2}}} \\\\\n& \\lim _{x \\rightarrow \\infty}\\left(1-\\frac{1}{3 x}\\right)^{\\frac{x}{2}}=e^{\\lim _{x \\rightarrow \\infty}\\left(1-\\frac{1}{3 x}-1\\right) \\times \\frac{x}{2}}=e^{\\frac{-1}{6}} \\\\\n& \\lim _{x \\rightarrow \\infty}\\left(1+\\frac{2}{3 x}\\right)=e^{\\lim _{x \\rightarrow \\infty}\\left(1+\\frac{2}{3 x}-1\\right) \\times \\frac{x}{2}} \\\\\n& =e^{\\frac{1}{3}}\n\\end{aligned}$\nSo, $\\frac{2}{3} \\times \\frac{e^{\\frac{-1}{6}}}{e^{\\frac{1}{3}}}=\\frac{2}{3} \\times \\frac{1}{e^{\\frac{1}{3}+\\frac{1}{6}}}=\\frac{2}{3 \\sqrt{e}}$", "image": null}, "videoSolution": {"videoId": "2961bd55473e48dbbafb0c91e6e847fe", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/EgyyFdF9gV1XN.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/EgyyFdF9gV1XN.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644676     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
