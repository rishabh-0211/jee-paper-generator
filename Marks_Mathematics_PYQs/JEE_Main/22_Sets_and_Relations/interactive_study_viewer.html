<mn>1</mn></msub></math>&nbsp;but&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>c</mi><mo>,</mo><mo>&#160;</mo><mi>b</mi><mo>)</mo><mo>&#8713;</mo><msub><mi>R</mi><mn>1</mn></msub><mi>&#160;</mi></math></p><p>Hence,&nbsp;<math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is not symmetric.</p><p>In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mi>&#160;</mi><mi>c</mi></mrow></mfenced><mo>&#8712;</mo><msub><mi>R</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>c</mi><mo>,</mo><mi>&#160;</mi><mi>a</mi></mrow></mfenced><mo>&#8712;</mo><msub><mi>R</mi><mn>1</mn></msub></math>&nbsp;but&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mi>&#160;</mi><mi>a</mi></mrow></mfenced><mo>&#8713;</mo><msub><mi>R</mi><mn>1</mn></msub></math></p><p>So, <math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is not transitive.</p><p><math><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is symmetric.</p><p>In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mi>&#160;</mi><mi>a</mi></mrow></mfenced><mo>&#8712;</mo><msub><mi>R</mi><mn>2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>a</mi><mo>,</mo><mi>&#160;</mi><mi>c</mi></mrow></mfenced><mo>&#8712;</mo><msub><mi>R</mi><mn>1</mn></msub></math> but&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mi>&#160;</mi><mi>c</mi></mrow></mfenced><mo>&#8713;</mo><msub><mi>R</mi><mn>2</mn></msub></math></p><p>So, <math><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is not transitive.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr)", "title": "JEE Main 2018 (15 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66298", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}], "question": {"text": "Consider the following two binary relations on the set $A=\\{a, b, c\\}: R_1=\\{(\\mathrm{c}, a)(b, b),(\\mathrm{a}, c),(c$, $c),(b, c),(a, a)\\}$ and $\\mathrm{R}_2=\\{(\\mathrm{a}, \\mathrm{b}),(\\mathrm{b}, \\mathrm{a}),(\\mathrm{c}, \\mathrm{c})$, (c, a), (a, a), (b, b), (a, c). Then", "image": null}, "options": [{"id": "IuiD6", "text": "\n$R_2$ is symmetric but it is not transitive\n", "image": null, "isCorrect": true}, {"id": "9eh8p", "text": "\nBoth $R_1$ and $R_2$ are transitive\n", "image": null, "isCorrect": false}, {"id": "6Ztmw", "text": "\nBoth $R_1$ and $R_2$ are not symmetric\n", "image": null, "isCorrect": false}, {"id": "bVKfs", "text": "\n$R_1$ is not symmetric but it is transitive", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Both $R_1$ and $R_2$ are symmetric as For any $(x, y) \\in R_1$, we have $(y, x) \\in R_1$ and similarly for $R_2$ Now, for $R_2,(b, a) \\in R_2,(a, c) \\in R_2$ but $(b, c) \\notin R_2$. Similarly, for $R_1,(b, c) \\in R_1,(c, a) \\in R_1$ but $(b, a) \\notin R_1$.\nTherefore, neither $R_1$ nor $R_2$ is transitive.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65dc0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> be the relation defined on the set of all real numbers such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>:</mo><msup><mi>sec</mi><mn>2</mn></msup><mi>a</mi><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>b</mi><mo>=</mo><mn>1</mn></mrow></mfenced></math>. Then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is", "image": null}, "options": [{"id": "ykPcJ", "text": "reflexive and symmetric but not transitive", "image": null, "isCorrect": false}, {"id": "x21t8", "text": "symmetric and transitive but not reflexive", "image": null, "isCorrect": false}, {"id": "pxmia", "text": "reflexive and transitive but not symmetric", "image": null, "isCorrect": false}, {"id": "hovJa", "text": "an equivalence relation", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>:</mo><msup><mi>sec</mi><mn>2</mn></msup><mi>a</mi><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>b</mi><mo>=</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mi>a</mi></mrow></mfenced><mo>:</mo><msup><mi>sec</mi><mn>2</mn></msup><mi>a</mi><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>a</mi><mo>=</mo><mn>1</mn></mrow></mfenced></math></p><p>its reflexive relation.</p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>:</mo><msup><mi>sec</mi><mn>2</mn></msup><mi>a</mi><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>b</mi><mo>=</mo><mn>1</mn></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sec</mi><mn>2</mn></msup><mi>a</mi><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>b</mi><mo>=</mo><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>sec</mi><mn>2</mn></msup><mi>a</mi><mo>=</mo><mn>1</mn><mo>+</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>b</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>sec</mi><mn>2</mn></msup><mi>a</mi><mo>=</mo><msup><mi>sec</mi><mn>2</mn></msup><mi>b</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"|\" open=\"|\"><mrow><mi>sec</mi><mo>&#160;</mo><mi>a</mi></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\"><mrow><mi>sec</mi><mo>&#160;</mo><mi>b</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sec</mi><mn>2</mn></msup><mi>a</mi><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>b</mi><mo>=</mo><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>a</mi><mo>-</mo><msup><mi>sec</mi><mn>2</mn></msup><mi>b</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sec</mi><mn>2</mn></msup><mi>b</mi><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mi>a</mi><mo>=</mo><mn>1</mn></math><br /><br />Hence, it is symmetric.<br /><br />If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mrow><mi>sec</mi><mo>&#160;</mo><mi>a</mi></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\"><mrow><mi>sec</mi><mo>&#160;</mo><mi>b</mi></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mrow><mi>sec</mi><mo>&#160;</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\"><mrow><mi>sec</mi><mo>&#160;</mo><mi>c</mi></mrow></mfenced></math> then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mrow><mi>sec</mi><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\"><mrow><mi>sec</mi><mo>&#160;</mo><mi>c</mi></mrow></mfenced><mo>&#8658;</mo></math> transitive&nbsp;<br /><br />So, it is an equivalence relation.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65cb6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}], "question": {"text": "Let $\\mathrm{R}=\\left\\{(x, y): x, y \\in N\\right.$ and $\\left.x^2-4 x y+3 y^2=0\\right\\}$, where $N$ is the set of all natural numbers. Then the relation $R$ is :", "image": null}, "options": [{"id": "EIhIp", "text": "\nreflexive but neither symmetric nor transitive.\n", "image": null, "isCorrect": false}, {"id": "6WJjk", "text": "\nsymmetric and transitive.\n", "image": null, "isCorrect": false}, {"id": "YQDg2", "text": "\nreflexive and symmetric,\n", "image": null, "isCorrect": false}, {"id": "GJXNx", "text": "\nreflexive and transitive.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{R}=\\left\\{(x, y): x, y \\in \\mathrm{N}\\right.$ and $\\left.x^2-4 x y+3 y^2=0\\right\\}$\nNow, $x^2-4 x y+3 y^2=0$\n$\\Rightarrow(x-y)(x-3 y)=0$\n$\\therefore x=y$ or $x=3 y$\n$\\therefore \\quad \\mathrm{R}=\\{(1,1),(3,1),(2,2),(6,2),(3,3)$, $(9,3), \\ldots \\ldots\\}$\nSince $(1,1),(2,2),(3,3), \\ldots \\ldots$ are present in the relation, therefore $\\mathrm{R}$ is reflexive.\nSince $(3,1)$ is an element of $R$ but $(1,3)$ is not the element of $\\mathrm{R}$, therefore $\\mathrm{R}$ is not symmetric\nHere $(3,1) \\in R$ and $(1,1) \\in R \\Rightarrow(3,1) \\in R$ $(6,2) \\in \\mathrm{R}$ and $(2,2) \\in \\mathrm{R} \\Rightarrow(6,2) \\in \\mathrm{R}$\nFor all such $(a, b) \\in \\mathrm{R}$ and $(b, c) \\in \\mathrm{R}$ $\\Rightarrow(a, c) \\in \\mathrm{R}$\nHence $\\mathrm{R}$ is transitive.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c48", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "Let $R=\\{(3,3)(5,5),(9,9),(12,12),(5,12),(3,9)$, $(3,12),(3,5)\\}$ be a relation on the $\\operatorname{set} A=\\{3,5,9,12\\}$. Then, $R$ is :", "image": null}, "options": [{"id": "TEqU6", "text": "\nreflexive, symmetric but not transitive.\n", "image": null, "isCorrect": false}, {"id": "6yMAM", "text": "\nsymmetric, transitive but not reflexive.\n", "image": null, "isCorrect": false}, {"id": "I0tx9", "text": "\nan equivalence relation.\n", "image": null, "isCorrect": false}, {"id": "D4jM8", "text": "\nreflexive, transitive but not symmetric.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $\\mathrm{R}=\\{(3,3),(5,5),(9,9),(12,12),(5,12)$, $(3,9),(3,12),(3,5)\\}$ be a relation on set $\\mathrm{A}=\\{3,5,9,12\\}$\nClearly, every element of $A$ is related to itself. Therefore, it is a reflexive.\nNow, $\\mathrm{R}$ is not symmetry because 3 is related to 5 but 5 is not related to 3 .\nAlso $\\mathrm{R}$ is transitive relation because it satisfies the property that if $a \\mathrm{R} b$ and $b \\mathrm{R} c$ then $a \\mathrm{R} c$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65976", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "Let $R$ be the set of real numbers\nThis question has Statement $-1$ and Statement $-2$. Of the four choices given after the statements, choose the one that best describes the two statements.\nStatement-1 : $A=\\{(x, y) \\in R \\times R: y-x$ is an integer $\\}$ is an equivalence relation on $R$.\nStatement-2 : $B=\\{(x, y) \\in R \\times R: x=\\alpha y$ for some rational number $\\alpha\\}$ is an equivalence relation on $\\mathrm{R}$.", "image": null}, "options": [{"id": "SgHBt", "text": "\nStatement $-1$ is true, Statement $-2$ is true; Statement $-2$ is not a correct explanation for Statement $-1$\n", "image": null, "isCorrect": false}, {"id": "mXT14", "text": "\nStatement $-1$ is true, Statement- 2 is false.\n", "image": null, "isCorrect": true}, {"id": "cNZpT", "text": "\nStatement $-1$ is false, Statement $-2$ is true.\n", "image": null, "isCorrect": false}, {"id": "wWbpY", "text": "\nStatement $-1$ is true, Statement $-2$ is true; Statement $-2$ is a correct explanation for Statement $-1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{x}-\\mathrm{y}$ is an integer\n$x-x=0$ is an integer $\\Rightarrow A$ is Reflexive\n$x-y$ is an integer $\\Rightarrow y-x$ is an integer $\\Rightarrow A$ is symmetric\n$x-y, y-z$ are integers\nAs sum of two integers is an integer.\n$\\Rightarrow(x-y)+(y-z)=x-z$ is an integer\n$\\Rightarrow \\mathrm{A}$ is transitive. Hence statement $-1$ is true.\nAlso $\\frac{\\mathrm{x}}{\\mathrm{x}}=1$ is a rational number $\\Rightarrow B$ is reflexive\n$\\frac{\\mathrm{x}}{\\mathrm{y}}=\\alpha$ is rational $\\Rightarrow \\frac{\\mathrm{y}}{\\mathrm{x}}$ need not be rational\ni.e., $\\frac{0}{1}$ is rational $\\Rightarrow \\frac{1}{0}$ is not rational\nHence B is not symmetric\n$\\Rightarrow B$ is not an equivalence relation.", "image": null}, "videoSolution": null, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6591d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "Consider the following relations:\n$R=\\{(x, y) \\mid x, y$ are real numbers and $x=$ wy for some rational number w $\\}$;\n$S=\\left\\{\\left(\\frac{m}{n}, \\frac{p}{q}\\right) \\mid m, n, p\\right.$ and $q$ are integers such that $n, q \\neq 0$ and $\\left.q m=p n\\right\\}$. Then", "image": null}, "options": [{"id": "LqufH", "text": "\nneither $\\mathrm{R}$ nor $\\mathrm{S}$ is an equivalence relation\n", "image": null, "isCorrect": false}, {"id": "2tlSg", "text": "\n$S$ is an equivalence relation but $R$ is not an equivalence relation\n", "image": null, "isCorrect": false}, {"id": "8MzlC", "text": "\n$R$ and $S$ both are equivalence relations\n", "image": null, "isCorrect": false}, {"id": "FEYFe", "text": "\n$\\mathrm{R}$ is an equivalence relation but $\\mathrm{S}$ is not an equivalence relation", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "xRy need not implies $y R x$\n$\\mathrm{S}: \\frac{\\mathrm{m}}{\\mathrm{n}} \\mathrm{s} \\frac{\\mathrm{p}}{\\mathrm{q}} \\Leftrightarrow \\mathrm{qm}=\\mathrm{pn}$ $\\frac{m}{n} s \\frac{m}{n}$ reflexive\n$$\n\\begin{array}{ll}\n\\frac{m}{n} s \\frac{p}{q} & \\Rightarrow \\frac{p}{q} s \\frac{m}{n} \\text { symmetric } \\\\\n\\frac{m}{n} s \\frac{p}{q}, \\frac{p}{q} s \\frac{r}{s} & \\Rightarrow q m=p n, p s=r q \\quad \\Rightarrow m s=r n \\text { transitive. }\n\\end{array}\n$$\n$S$ is an equivalence relation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65864", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}], "question": {"text": "Let $R$ be the real line. Consider the following subsets of the plane $R \\times R$.\n$S=\\{(x, y): y=x+1$ and $0 < x < 2\\}, T=\\{(x, y): x-y$ is an integer $\\}$. Which one of the following is true?", "image": null}, "options": [{"id": "uZs3h", "text": "\nneither $S$ nor $T$ is an equivalence relation on $R$\n", "image": null, "isCorrect": false}, {"id": "bLQxt", "text": "\nboth $S$ and $T$ are equivalence relations on $R$\n", "image": null, "isCorrect": false}, {"id": "GWRU1", "text": "\n$S$ is an equivalence relation on $R$ but $T$ is not\n", "image": null, "isCorrect": false}, {"id": "YGeND", "text": "\n$\\mathrm{T}$ is an equivalence relation on $\\mathrm{R}$ but $S$ is not", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\nT=\\{(x, y): x-y \\in l\\}\n$$\nas $0 \\in \\mathrm{I} \\mathrm{T}$ is a reflexive relation.\nIf $x-y \\in 1 \\Rightarrow y-x \\in I$\n$\\therefore \\mathrm{T}$ is symmetrical also\nIf $x-y=l_1$ and $y-z=l_2$\nThen $x-z=(x-y)+(y-z)=l_1+I_2 \\in I$\n$\\therefore \\mathrm{T}$ is also transitive.\nHence $T$ is an equivalence relation.\nClearly $x \\neq x+1 \\Rightarrow(x, x) \\notin S$\n$\\therefore S$ is not reflexive.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6577d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "Let W denote the words in the English dictionary. Define the relation R by :\n$R=\\{(x, y) \\in W \\times W \\mid$ the words $x$ and $y$ have at least one letter in common $\\}$. Then $R$ is", "image": null}, "options": [{"id": "qQp7I", "text": "\nnot reflexive, symmetric and transitive\n", "image": null, "isCorrect": false}, {"id": "bjqKd", "text": "\nreflexive, symmetric and not transitive\n", "image": null, "isCorrect": true}, {"id": "PDu9X", "text": "\nreflexive, symmetric and transitive\n", "image": null, "isCorrect": false}, {"id": "b6QqR", "text": "\nreflexive, not symmetric and transitive", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Clearly $(\\mathrm{x}, \\mathrm{x}) \\in \\mathrm{R} \\forall \\mathrm{x} \\in \\mathrm{W}$. So, $\\mathrm{R}$ is reflexive.\nLet $(x, y) \\in R$, then $(y, x) \\in R$ as $x$ and $y$ have at least one letter in common. So, $R$ is symmetric.\nBut $R$ is not transitive for example\nLet $x=$ DELHI, $y=$ DWARKA and $z=$ PARK\nthen $(x, y) \\in R$ and $(y, z) \\in R$ but $(x, z) \\notin R$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d656c2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "Let $R=\\{(3,3),(6,6),(9,9),(12,12),(6,12),(3,9),(3,12),(3,6)\\}$ be a relation on the set $A=\\{3,6,9,12\\}$ . The relation is", "image": null}, "options": [{"id": "xzjff", "text": "\nreflexive and transitive only\n", "image": null, "isCorrect": true}, {"id": "IgCWQ", "text": "\nreflexive only\n", "image": null, "isCorrect": false}, {"id": "1EV7V", "text": "\nan equivalence relation\n", "image": null, "isCorrect": false}, {"id": "8Z8Cy", "text": "\nreflexive and symmetric only", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reflexive and transitive only.\ne.g. $(3,3),(6,6),(9,9),(12,12)$ [Reflexive]\n$(3,6),(6,12),(3,12)$\n[Transitive].", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655dd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "Let $R=\\{(1,3),(4,2),(2,4),(2,3),(3,1)\\}$ be a relation on the set $A=\\{1,2,3,4\\}$. The relation $R$ is", "image": null}, "options": [{"id": "yuzIt", "text": "\na function\n", "image": null, "isCorrect": false}, {"id": "oK1fo", "text": "\nreflexive\n", "image": null, "isCorrect": false}, {"id": "t3Fao", "text": "\nnot symmetric\n", "image": null, "isCorrect": true}, {"id": "mQjjP", "text": "\ntransitive", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$(2,3) \\in \\mathrm{R}$ but $(3,2) \\notin \\mathrm{R}$\nHence R is not symmetric.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a74417cc3fb48d693c7", "title": "Questions on Venn Diagram", "totalQuestions": 18, "questions": [{"_id": "6983c17f8bfdbb243563957e", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $\\mathrm{A}=\\left\\{x:\\left|x^{2}-10\\right| \\leq 6\\right\\}$ and $\\mathrm{B}=\\{x:|x-2|>1\\}$. Then", "image": null}, "options": [{"id": "71XqP", "text": "$\\mathrm{A} \\cup \\mathrm{B}=(-\\infty, 1] \\cup(2, \\infty)$", "isCorrect": false, "image": null}, {"id": "KrvwG", "text": "$\\mathrm{B}-\\mathrm{A}=(-\\infty,-4) \\cup(-2,1) \\cup(4, \\infty)$", "isCorrect": true, "image": null}, {"id": "SZ4vB", "text": "$\\mathrm{A}-\\mathrm{B}=[2,3)$", "isCorrect": false, "image": null}, {"id": "k60dJ", "text": "$\\mathrm{A} \\cap \\mathrm{~B}=[-4,-2] \\cup[3,4]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$A = \\{x : |x^2 - 10| \\le 6\\}$: $-6 \\le x^2 - 10 \\le 6 \\Rightarrow 4 \\le x^2 \\le 16$, so $A = [-4, -2] \\cup [2, 4]$.<br>$B = \\{x : |x - 2| > 1\\} = (-\\infty, 1) \\cup (3, \\infty)$.<br>$A^c = (-\\infty, -4) \\cup (-2, 2) \\cup (4, \\infty)$.<br>$B - A = B \\cap A^c = [(-\\infty, 1) \\cap A^c] \\cup [(3, \\infty) \\cap A^c]$<br>$= [(-\\infty, -4) \\cup (-2, 1)] \\cup [(4, \\infty)]$<br>$= (-\\infty, -4) \\cup (-2, 1) \\cup (4, \\infty)$.", "image": null}, "videoSolution": {"videoId": "38f4668011744d70870f4e6d6487f13a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/kDnAHXXlE0nuC.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/kDnAHXXlE0nuC.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644670a970e6e9ab542cfa2", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}], "question": {"text": "In a survey of 220 students of a higher secondary school, it was found that at least 125 and at most 130 students studied Mathematics; at least 85 and at most 95 studied Physics; at least 75 and at most 90 studied Chemistry; 30 studied both Physics and Chemistry; 50 studied both Chemistry and Mathematics; 40 studied both Mathematics and Physics and 10 studied none of these subjects. Let $\\mathrm{m}$ and $\\mathrm{n}$ respectively be the least and the most number of students who studied all the three subjects. Then $\\mathrm{m}+\\mathrm{n}$ is equal to ______", "image": null}, "options": [], "correctValue": "45", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/S_994hCo6KHQcJx9-SEEfERlGHUU3KyswEq50JX74d0.original.fullsize.png\"><br />$\\begin{aligned} & 125 \\leq \\mathrm{m}+90-\\mathrm{x} \\leq 130 \\\\ & 85 \\leq \\mathrm{P}+70-\\mathrm{x} \\leq 95 \\\\ & 75 \\leq \\mathrm{C}+80-\\mathrm{x} \\leq 90 \\\\ & \\mathrm{~m}+\\mathrm{P}+\\mathrm{C}+120-2 \\mathrm{x}=210 \\\\ & \\Rightarrow 15 \\leq \\mathrm{x} \\leq 45 \\& 30-\\mathrm{x} \\geq 0 \\\\ & \\Rightarrow 15 \\leq \\mathrm{x} \\leq 30 \\\\ & 30+15=45\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "70e94b0251c347f9b7c83e9b881056ce", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MOyv6EsmIdEm3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/MOyv6EsmIdEm3.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd46ba0e94a3c4025b9b", "type": "numerical", "level": 1, "questionLabels": [], "question": {"text": "A group of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn></math> students appeared in an examination of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> subjects - Mathematics, Physics &amp; Chemistry. It was found that all students passed in at least one of the subjects, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math> students passed in Mathematics, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn></math> students passed in Physics, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math> students passed in Chemistry, at most <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn></math> students passed in both Mathematics and Physics, at most <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math> students passed in both Physics and Chemistry, at most <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math> students passed in both Mathematics and Chemistry. The maximum number of students passed in all the three subjects is _____.", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mi>M</mi></mfenced><mo>=</mo><mn>20</mn><mo>,</mo><mo> </mo><mi>n</mi><mfenced><mi>P</mi></mfenced><mo>=</mo><mn>25</mn><mo>,</mo><mo> </mo><mi>n</mi><mfenced><mi>C</mi></mfenced><mo>=</mo><mn>16</mn><mo> </mo></math></p><p>And <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mrow><mi>M</mi><mo>∩</mo><mi>P</mi></mrow></mfenced><mo>≤</mo><mn>11</mn><mo>,</mo><mo> </mo><mi>n</mi><mfenced><mrow><mi>M</mi><mo>∩</mo><mi>C</mi></mrow></mfenced><mo>≤</mo><mn>15</mn><mo>,</mo><mo> </mo><mi>n</mi><mfenced><mrow><mi>P</mi><mo>∩</mo><mi>C</mi></mrow></mfenced><mo>≤</mo><mn>15</mn></math></p><p>Now, plotting the diagram and taking all three subjects passed as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6de45cb4-9596-4341-b449-0753a245b586.png\" style=\"width: 300px; height: 312px;\"/></p><p>Now, for maximum let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo> </mo><mo>=</mo><mn>11</mn></math>.</p><p>So, the venn diagram will be,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f2b2d174-6a46-49ae-9182-8e7279d373a4.png\" style=\"width: 300px; height: 303px;\"/></p><p>Now, using the given conditions we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>+</mo><mi>z</mi><mo>≤</mo><mn>15</mn><mo>⇒</mo><mi>z</mi><mo>≤</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>+</mo><mi>y</mi><mo>≤</mo><mn>15</mn><mo>⇒</mo><mi>y</mi><mo>≤</mo><mn>4</mn></math></p><p>Now finding the sum of all we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>-</mo><mi>z</mi><mo>+</mo><mn>0</mn><mo>+</mo><mn>14</mn><mo>-</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>+</mo><mn>11</mn><mo>+</mo><mi>y</mi><mo>+</mo><mn>5</mn><mo>-</mo><mi>y</mi><mo>-</mo><mi>z</mi><mo>=</mo><mn>40</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mo>-</mo><mn>1</mn></math> which is not possible hence the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>11</mn></math> is not possible,</p><p>Now taking the maximum value as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>10</mn></math>,</p><p>We get, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>+</mo><mi>z</mi><mo>≤</mo><mn>15</mn><mo>⇒</mo><mi>z</mi><mo>≤</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>+</mo><mi>y</mi><mo>≤</mo><mn>15</mn><mo>⇒</mo><mi>y</mi><mo>≤</mo><mn>5</mn></math></p><p>Plotting the venn diagram we get,</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1ebec8e6-c021-458c-ac36-c7ba66c08ba5.png\" style=\"width: 300px; height: 303px;\"/></p><p>Now, finding the sum we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>-</mo><mi>z</mi><mo>+</mo><mn>0</mn><mo>+</mo><mn>15</mn><mo>-</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>+</mo><mn>10</mn><mo>+</mo><mi>y</mi><mo>+</mo><mn>6</mn><mo>-</mo><mi>y</mi><mo>-</mo><mi>z</mi><mo>=</mo><mn>40</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>1</mn></math> which is possible,</p><p>Hence, possible venn diagram will be,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ec2db6de-8117-44b5-aecd-04014dc56b80.png\" style=\"width: 300px; height: 303px;\"/></p><p>Hence, the maximum number of students passed in all the three subjects is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>.</p>", "image": null}, "videoSolution": {"videoId": "cf54c9e169ff40f3b73a29341f2a659d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/E4veMDKhCvRX1.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/E4veMDKhCvRX1.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68592", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}], "question": {"text": "An organization awarded <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>48</mn></math> medals in event <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>A</mi><none/><mo>'</mo><mprescripts/><none/><mo>'</mo></mmultiscripts></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn></math> in event <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>B</mi><none/><mo>'</mo><mprescripts/><none/><mo>'</mo></mmultiscripts></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn></math> in event <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><none/><mo>'</mo><mprescripts/><none/><mo>'</mo></mmultiscripts></math>. If these medals went to total <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn></math> men and only five men got medals in all the three events, then, how many received medals in exactly two of three events?", "image": null}, "options": [{"id": "0t4Am", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math>", "image": null, "isCorrect": false}, {"id": "Dn0Hr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn></math>", "image": null, "isCorrect": true}, {"id": "fNfUx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>", "image": null, "isCorrect": false}, {"id": "mkz25", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>,</mo><mo>&#160;</mo><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> denote the set of men who received medals in even <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>, event <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;and event&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;respectively.</p><p>Then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mi>A</mi></mfenced><mo>=</mo><mn>48</mn><mo>,</mo><mo>&#160;</mo><mi>n</mi><mfenced><mi>B</mi></mfenced><mo>=</mo><mn>25</mn><mo>,</mo><mo>&#160;</mo><mi>n</mi><mfenced><mi>C</mi></mfenced><mo>=</mo><mn>18</mn></math>&nbsp;,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mrow><mi>A</mi><mo>&#8746;</mo><mi>B</mi><mo>&#8746;</mo><mi>C</mi></mrow></mfenced><mo>=</mo><mn>60</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced><mo>=</mo><mn>5</mn></math>,</p><p>Now we know that,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mrow><mi>A</mi><mo>&#8746;</mo><mi>B</mi><mo>&#8746;</mo><mi>C</mi></mrow></mfenced><mo>=</mo><mi>n</mi><mfenced><mi>A</mi></mfenced><mo>+</mo><mi>n</mi><mfenced><mi>B</mi></mfenced><mo>+</mo><mi>n</mi><mfenced><mi>C</mi></mfenced><mo>-</mo><mi>n</mi><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi></mrow></mfenced><mo>-</mo><mi>n</mi><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced><mo>-</mo><mi>n</mi><mfenced><mrow><mi>B</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced><mo>+</mo><mi>n</mi><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>60</mn><mo>=</mo><mn>48</mn><mo>+</mo><mn>25</mn><mo>+</mo><mn>18</mn><mo>-</mo><mi>n</mi><mo>(</mo><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>)</mo><mo>-</mo><mi>n</mi><mo>(</mo><mi>A</mi><mo>&#8745;</mo><mi>C</mi><mo>)</mo><mo>-</mo><mi>n</mi><mo>(</mo><mi>B</mi><mo>&#8745;</mo><mi>C</mi><mo>)</mo><mo>+</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>n</mi><mo>(</mo><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>)</mo><mo>+</mo><mi>n</mi><mo>(</mo><mi>A</mi><mo>&#8745;</mo><mi>C</mi><mo>)</mo><mo>+</mo><mi>n</mi><mo>(</mo><mi>A</mi><mo>&#8745;</mo><mi>C</mi><mo>)</mo><mo>=</mo><mn>48</mn><mo>+</mo><mn>25</mn><mo>+</mo><mn>18</mn><mo>+</mo><mn>5</mn><mo>-</mo><mn>60</mn><mo>=</mo><mn>36</mn></math></p><p>Therefore, the number of people who received medals in exactly two of the three sports will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>-</mo><mn>3</mn><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced><mo>=</mo><mn>36</mn><mo>-</mo><mn>15</mn><mo>=</mo><mn>21</mn></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d683bf", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}], "question": {"text": "<p>In a group of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math>&nbsp;persons&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn></math>&nbsp;speak English and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn></math>&nbsp;speak Hindi. Each person speaks at least one of the two languages. If the number of persons who speak only English is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;and the number of persons who speaks only Hindi is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math>, then the eccentricity of the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mfenced><mrow><msup><mi>&#946;</mi><mn>2</mn></msup><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>&#945;</mi><mn>2</mn></msup><msup><mi>y</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><msup><mi>&#945;</mi><mn>2</mn></msup><msup><mi>&#946;</mi><mn>2</mn></msup></math>&nbsp;is</p>", "image": null}, "options": [{"id": "9K04r", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>119</mn></msqrt><mn>12</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "WfnfB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>117</mn></msqrt><mn>12</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WqhbG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><msqrt><mn>15</mn></msqrt></mrow><mn>12</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WpB9x", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>129</mn></msqrt><mn>12</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p>In a group of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math>&nbsp;persons&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn></math>&nbsp;speak English and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn></math>&nbsp;speak Hindi,&nbsp;</p><p>And each person speaks at least one of the two languages,</p><p>And the number of persons who speak only English is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;and the number of persons who speaks only Hindi is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math>,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/dbedcabe-c9b1-454e-90d3-44544fa32c18.png\" style=\"width: 200px; height: 197px;\" /></p><p>Now from above diagram we can see that,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><mn>100</mn><mo>-</mo><mn>75</mn><mo>=</mo><mn>25</mn></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>75</mn><mo>-</mo><mfenced><mrow><mn>40</mn><mo>-</mo><mn>25</mn></mrow></mfenced><mo>=</mo><mn>60</mn></math></p><p>Hence, number of people who speak English only is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>60</mn></math>&nbsp;and Hindi is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><mn>25</mn></math>,</p><p>Now putting the value in given equation of ellipse we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mfenced close=\"]\" open=\"[\"><mrow><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mn>60</mn><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mn>25</mn><mn>2</mn></msup></mfrac></mrow></mfenced><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mrow><mn>36</mn><mo>&#215;</mo><mn>4</mn></mrow></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>25</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>Now comparing with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;we get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>12</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>b</mi><mo>=</mo><mn>5</mn></math></p><p>Now we know that,&nbsp;</p><p>Eccentricity of ellipse is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>e</mi><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac><mn>25</mn><mrow><mn>36</mn><mo>&#215;</mo><mn>4</mn></mrow></mfrac></msqrt><mo>=</mo><mfrac><msqrt><mn>119</mn></msqrt><mn>12</mn></mfrac></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "18f6e3ee8dcc4ca3924f49b46ff28a32", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/0hp8xgEIo5Oan.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/0hp8xgEIo5Oan.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67d29", "previousYearPapers": [{"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced open=\"{\" close=\"}\"><mrow><mn>1</mn><mo>,</mo><msub><mi>a</mi><mn>1</mn></msub><mo>,</mo><msub><mi>a</mi><mn>2</mn></msub><mo>&#8230;</mo><mo>&#8230;</mo><msub><mi>a</mi><mn>18</mn></msub><mo>,</mo><mn>77</mn></mrow></mfenced></math>&nbsp;be a set of integers with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#60;</mo><msub><mi>a</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>a</mi><mn>2</mn></msub><mo>&#60;</mo><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mo>&#60;</mo><msub><mi>a</mi><mn>18</mn></msub><mo>&#60;</mo><mn>77</mn></math>. Let the set <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>+</mo><mi>A</mi><mo>=</mo><mfenced open=\"{\" close=\"}\"><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>:</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>&#8712;</mo><mi>A</mi></mrow></mfenced></math>&nbsp;contain exactly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>39</mn></math>&nbsp;elements. Then, the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mn>1</mn></msub><mo>+</mo><msub><mi>a</mi><mn>2</mn></msub><mo>+</mo><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mo>+</mo><msub><mi>a</mi><mn>18</mn></msub></math>&nbsp;is equal to ______.", "image": null}, "options": [], "correctValue": "702", "solution": {"text": "If we write the elements of \\(A+A\\), we can certainly find 39 distinct elements as \\(1+1,1+a_1, 1+a_2, \\ldots .1\\) \\(+a_{18}, 1+77, a_1+77, a_2+77, \\ldots \\ldots a_{18}+77,77+77\\). It means all other sums are already present in these 39 values, which is only possible in case when all numbers are in A.P.\r\nLet the common difference be ' \\(d\\) '.\r\n\\(77=1+19 d \\Rightarrow d=4\\)\r\nSo, \\(\\sum_{i=1}^{18} a_1=\\frac{18}{2}\\left[2 a_1+17 d\\right]=9[10+68]=702\\)", "image": null}, "videoSolution": {"videoId": "560e8b65f714466089dee493015bf427", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lkcihQgbFC59s.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lkcihQgbFC59s.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldO 20 (04 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66898", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 2)", "title": "JEE Main 2019 (12 Apr Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let <math><mi>A</mi><mo>,</mo><mi>&#160;</mi><mi>B</mi></math> and <math><mi>C</mi><mi>&#160;</mi></math> be sets such that <math><mi>&#981;</mi><mo>&#8800;</mo><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>&#8838;</mo><mi>C</mi><mo>.</mo></math> Then which of the following statements is not true?", "image": null}, "options": [{"id": "6NmOl", "text": "<math><mi>B</mi><mo>∩</mo><mi>C</mi><mo>≠</mo><mi>ϕ</mi></math>", "isCorrect": false, "image": null}, {"id": "xoVcp", "text": "<math><mo>(</mo><mi>C</mi><mo>∪</mo><mi>A</mi><mo>)</mo><mo>∩</mo><mo>(</mo><mi>C</mi><mo>∪</mo><mi>B</mi><mo>)</mo><mo>=</mo><mi>C</mi></math>", "isCorrect": false, "image": null}, {"id": "5sUsj", "text": "If <math><mo>(</mo><mi>A</mi><mo>-</mo><mi>B</mi><mo>)</mo><mo>⊆</mo><mi>C</mi><mo>,</mo><mtext> </mtext></math> then <math><mi>A</mi><mo>⊆</mo><mi>C</mi></math>", "isCorrect": false, "image": null}, {"id": "Asx7y", "text": "If <math><mo>(</mo><mi>A</mi><mo>-</mo><mi>C</mi><mo>)</mo><mo>⊆</mo><mi>B</mi><mo>,</mo></math> then <math><mi>A</mi><mo>⊆</mo><mi>B</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/859a7236-a689-4bbf-8833-1e41805c2e56-image.png\" style=\"width: 426px; height: 282px;\" /><br />For <math><mi>A</mi><mo>=</mo><mi>C</mi><mo>,</mo><mi>A</mi><mo>-</mo><mi>C</mi><mo>=</mo><mi>&#981;</mi></math><br /><math><mo>&#8658;</mo><mi>&#981;</mi><mo>&#8838;</mo><mi>B</mi></math><br />But <math><mi>A</mi><mo>&#8840;</mo><mi>B</mi></math><br />Hence, If <math><mo>(</mo><mi>A</mi><mo>-</mo><mi>C</mi><mo>)</mo><mo>&#8838;</mo><mi>B</mi><mo>,</mo></math> then <math><mi>A</mi><mo>&#8838;</mo><mi>B</mi></math> is not true<br />Let <math><mi>x</mi><mo>&#8712;</mo><mtext>&#8201;</mtext><mi>C</mi><mo>,</mo><mi>&#160;</mi><mi>&#160;</mi><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>A</mi></mrow></mfenced><mo>&#8745;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>A</mi></mrow></mfenced><mtext>&#8201;</mtext></math> and <math><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mo>(</mo><mi>x</mi><mo>&#8712;</mo><mi>C</mi><mtext>&#8201;</mtext></math> or <math><mi>x</mi><mo>&#8712;</mo><mi>A</mi><mo>)</mo></math> and <math><mo>(</mo><mi>x</mi><mo>&#8712;</mo><mi>C</mi></math> or <math><mtext>&#8201;</mtext><mi>x</mi><mo>&#8712;</mo><mi>B</mi><mo>)</mo></math><br /><math><mo>&#8658;</mo><mtext>&#8201;</mtext><mi>x</mi><mo>&#8712;</mo><mi>C</mi></math> or <math><mtext>&#8201;</mtext><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mi>C</mi></math> or <math><mi>x</mi><mo>&#8712;</mo><mi>C</mi><mtext>&#8201;&#8201;</mtext><mfenced separators=\"|\"><mrow><mi>a</mi><mi>s</mi><mtext>&#8201;</mtext><mi>A</mi><mo>&#8746;</mo><mi>B</mi><mo>&#8838;</mo><mi>C</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mi>C</mi></math><br /><math><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>A</mi></mrow></mfenced><mo>&#8745;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced><mo>&#8838;</mo><mi>C</mi></math> .... (i)<br />Now <math><mi>x</mi><mo>&#8712;</mo><mi>C</mi><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>A</mi></mrow></mfenced></math> and <math><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mo>(</mo><mi>C</mi><mo>&#8746;</mo><mi>A</mi><mo>)</mo><mo>&#8745;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>C</mi><mo>&#8838;</mo><mo>(</mo><mi>C</mi><mo>&#8746;</mo><mi>A</mi><mo>)</mo><mo>&#8745;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced></math> ..... (ii)<br /><math><mo>&#8658;</mo></math> From (i) and (ii)<br /><math><mi>C</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>A</mi></mrow></mfenced><mo>&#8745;</mo><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced></math><br />Hence, <math><mo>(</mo><mi>C</mi><mo>&#8746;</mo><mi>A</mi><mo>)</mo><mo>&#8745;</mo><mo>(</mo><mi>C</mi><mo>&#8746;</mo><mi>B</mi><mo>)</mo><mo>=</mo><mi>C</mi></math> is true<br />Let <math><mi>x</mi><mo>&#8712;</mo><mi>A</mi><mtext>&#8201;</mtext></math> and <math><mi>x</mi><mo>&#8713;</mo><mi>B</mi></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>-</mo><mi>B</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mi>C</mi></math> <math><mtext>&#8201;</mtext><mfenced separators=\"|\"><mrow><mi>a</mi><mi>s</mi><mtext>&#8201;</mtext><mi>A</mi><mo>-</mo><mi>B</mi><mo>&#8838;</mo><mi>C</mi></mrow></mfenced></math><br />Let <math><mi>x</mi><mo>&#8712;</mo><mi>A</mi></math> and <math><mi>x</mi><mo>&#8712;</mo><mi>B</mi></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi></mrow></mfenced></math><br /><math><mo>&# i>A</mi><mo>&#8838;</mo><mi>C</mi></math>&nbsp;Not correct</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Option (d) is correct&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 2)", "title": "JEE Main 2019 (12 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d666cc", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "In a class of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>140</mn></math> students numbered <math><mn>1</mn></math> to<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>140</mn></math> , all even numbered students opted Mathematics course, those whose number is divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> opted Physics course and those whose number is divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> opted Chemistry course. Then the number of students who did not opt for any of the three courses is:", "image": null}, "options": [{"id": "ocTPq", "text": "<math><mn>42</mn></math>", "isCorrect": false, "image": null}, {"id": "IPhqd", "text": "<math><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "sCdLm", "text": "<math><mn>38</mn></math>", "isCorrect": true, "image": null}, {"id": "lo5Il", "text": "<math><mn>102</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>From the given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>140</mn></math>&nbsp;students, all even numbered students opted Mathematics&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>M</mi></mfenced><mo>,</mo></math>&nbsp;hence, the number of students opted Mathematics is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>&#8801;</mo><mfenced open=\"[\" close=\"]\" separators=\"|\"><mfrac><mn>140</mn><mn>2</mn></mfrac></mfenced><mo>=</mo><mn>70</mn><mo>,</mo></math>&nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mi>x</mi></mfenced></math>&nbsp;denotes the greatest integer function of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>.</mo></math></p><p>Similarly, the students who opted Physics are&nbsp;<math><mi>P</mi><mo>&#8801;</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>140</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>46</mn></math></p><p>And, the&nbsp;students who opted Chemistry are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>&#8801;</mo><mfenced open=\"[\" close=\"]\" separators=\"|\"><mfrac><mn>140</mn><mn>5</mn></mfrac></mfenced><mo>=</mo><mn>28</mn></math></p><p>Similarly, the students who opted Mathematics and&nbsp;Physics are the numbers which are divisible by both&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mn>3</mn></math>&nbsp;i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>,</mo></math>&nbsp;and their number is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\" separators=\"|\"><mfrac><mn>140</mn><mn>6</mn></mfrac></mfenced><mo>=</mo><mn>23</mn></math></p><p>The students who opted Mathematics and&nbsp;Chemistry are the numbers which are divisible by both&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mn>5</mn></math>&nbsp;i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>,</mo></math>&nbsp;and their number is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\" separators=\"|\"><mfrac><mn>140</mn><mn>10</mn></mfrac></mfenced><mo>=</mo><mn>14</mn></math></p><p>The students who opted Physics and&nbsp;Chemistry are the numbers which are divisible by both&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mn>5</mn></math>&nbsp;i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>,</mo></math>&nbsp;and their number is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mfrac><mn>140</mn><mn>15</mn></mfrac></mfenced><mo>=</mo><mn>9</mn></math></p><p>And, the students who opted all the three subjects are the numbers which are divisible by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mn>5</mn></math>&nbsp;i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>,</mo></math>&nbsp;and their number is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mfrac><mn>140</mn><mn>30</mn></mfrac></mfenced><mo>=</mo><mn>4</mn></math><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/lgybaoxnglxtplxvwyxihtoncujjkwcdjxetzmsintfnfdzvgs.png\" /></p><p>Now, using<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced separators=\"|\"><mrow><mi>P</mi><mo>&#8746;</mo><mi>C</mi><mo>&#8746;</mo><mi>M</mi></mrow></mfenced><mo>=</mo><mi>n</mi><mfenced separators=\"|\"><mi>P</mi></mfenced><mo>+</mo><mi>n</mi><mfenced separators=\"|\"><mi>C</mi></mfenced><mo>+</mo><mi>n</mi><mfenced separators=\"|\"><mi>M</mi></mfenced><mo>-</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi>P</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced><mo>-</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi>C</mi><mo>&#8745;</mo><mi>M</mi></mrow></mfenced><mo>-</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi>M</mi><mo>&#8745;</mo><mi>P</mi></mrow></mfenced><mo>+</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi>P</mi><mo>&#8745;</mo><mi>M</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>46</mn><mo>+</mo><mn>28</mn><mo>+</mo><mn>70</mn><mo>-</mo><mn>9</mn><mo>-</mo><mn>14</mn><mo>-</mo><mn>23</mn><mo>+</mo><mn>4</mn></math></p><p><math><mo>=</mo><mn>102</mn></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>102</mn></math>&nbsp;students have opted for atleast one of the three subjects.</p><p>Hence, number of students who did not opt for any of the three courses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>140</mn><mo>-</mo><mn>102</mn><mo>=</mo><mn>38</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f7a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}], "question": {"text": "In a certain town,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>%</mo></math> of the families own a phone and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>%</mo></math>&nbsp;own a car;&nbsp;<math xmlns=\"http://www.w3.org/19 PKZ", "text": "Only&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math>&nbsp;are correct", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let set <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;contains families which own a phone and set&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> contain families which own a car.<br /><br />If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>65</mn><mo>%</mo></math>&nbsp;families own neither a phone nor a car, then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn><mo>%</mo></math>&nbsp;will own either a phone or a car<br /><br /><math><mo>&#8756;</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mn>35</mn><mi>%</mi></math><br /><br />Also we know that<br /><br /><math><mi>n</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>+</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>-</mo><mi>n</mi><mo>(</mo><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn><mo>=</mo><mn>25</mn><mo>+</mo><mn>15</mn><mo>-</mo><mi>n</mi><mo>(</mo><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>)</mo></math><br /><br /><math><mi>n</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mn>5</mn><mi>%</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>%</mo></math>&nbsp;families own both phone and car and it is given to be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2000</mn></math> .<br /><math><mo>&#8756;</mo><mn>5</mn><mi>%</mi><mi>&#160;</mi><mi>&#160;</mi><mi>o</mi><mi>f</mi><mi>&#160;</mi><mi>x</mi><mo>=</mo><mn>2000</mn></math><br /><br /><math><mfrac><mrow><mn>5</mn><mi>x</mi></mrow><mrow><mn>100</mn></mrow></mfrac><mi>&#160;</mi><mo>=</mo><mn>2000</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>40000</mn></math><br /><br />Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math> are correct.", "image": null}, "videoSolution": null, "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d4d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><msup><mn>4</mn><mi>n</mi></msup><mo>-</mo><mn>3</mn><mi>n</mi><mo>-</mo><mn>1</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mi>n</mi><mo>&#8712;</mo><mi>N</mi></mrow></mfenced></math>&nbsp; and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>9</mn><mfenced><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mi>n</mi><mo>&#8712;</mo><mi>N</mi></mrow></mfenced></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>&nbsp;is the set of natural numbers, then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi><mo>&#8746;</mo><mi>Y</mi></math>&nbsp;is equal to", "image": null}, "options": [{"id": "UQo8y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>", "image": null, "isCorrect": false}, {"id": "YKkQh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi></math>", "image": null, "isCorrect": true}, {"id": "xjYsk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>", "image": null, "isCorrect": false}, {"id": "NC8dR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>-</mo><mi>X</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><msup><mn>4</mn><mi>n</mi></msup><mo>-</mo><mn>3</mn><mi>n</mi><mo>-</mo><mn>1</mn><mo>:</mo><mi>n</mi><mo>&#8712;</mo><mi>N</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>4</mn><mi>n</mi></msup><mo>-</mo><mn>3</mn><mi>n</mi><mo>-</mo><mn>1</mn><mo>=</mo><msup><mfenced><mrow><mn>3</mn><mo>+</mo><mn>1</mn></mrow></mfenced><mi>n</mi></msup><mo>-</mo><mn>3</mn><mi>n</mi><mo>-</mo><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>=</mi><msup><mspace></mspace><mi>n</mi></msup><msub><mi>C</mi><mn>0</mn></msub><msup><mfenced><mn>3</mn></mfenced><mi>o</mi></msup><msup><mn>1</mn><mi>n</mi></msup><mo>+</mo><msup><mspace></mspace><mi>n</mi></msup><msub><mi>C</mi><mn>1</mn></msub><msup><mfenced><mn>3</mn></mfenced><mn>1</mn></msup><msup><mfenced><mn>1</mn></mfenced><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>+</mo><mo>.</mo><mo>....</mo><mo>+</mo><msup><mspace></mspace><mi>n</mi></msup><msub><mi>C</mi><mi>n</
