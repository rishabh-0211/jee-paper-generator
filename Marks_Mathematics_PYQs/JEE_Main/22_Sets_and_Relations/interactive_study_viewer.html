    const data = {"index": 22, "chapterId": "6160254da66d43264e2f6510", "chapter": "Sets and Relations", "exam": "JEE Main", "subject": "Mathematics", "totalTopics": 3, "totalQuestions": 120, "downloadTime": "2026-10-08 21:02:22", "topics": [{"index": 1, "topicId": "648b5a74417cc3fb48d693c6", "title": "Questions on Symmetric Transitive and Reflexive Properties", "totalQuestions": 59, "questions": [{"_id": "69d8073681239f6567c4f31c", "type": "singleCorrect", "question": {"text": "Consider the relation R on the set $\\{-2,-1,0,1,2\\}$ defined by $(a, b) \\in R$ if and only if $1+ab > 0$. Then, among the statements:<br>I. The number of elements in R is 17<br>II. R is an equivalence relation", "image": null}, "options": [{"id": "uxj1p", "text": "Only I is true", "isCorrect": true, "image": null}, {"id": "YWFBJ", "text": "Only II is true", "isCorrect": false, "image": null}, {"id": "7UJTm", "text": "Both I and II are true", "isCorrect": false, "image": null}, {"id": "veHjv", "text": "Neither I nor II is true", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The set is $A = \\{-2, -1, 0, 1, 2\\}$.<br><br>For Statement I, the relation is defined as $(a, b) \\in R \\iff 1 + ab > 0$.<br>The pairs $(a, b)$ that do not belong to $R$ satisfy $1 + ab \\le 0 \\Rightarrow ab \\le -1$.<br>The pairs satisfying $ab \\le -1$ are $(-2, 1), (-2, 2), (-1, 1), (-1, 2), (1, -2), (1, -1), (2, -2), (2, -1)$.<br>There are $8$ such pairs.<br>The total number of pairs in $A \\times A$ is $5 \\times 5 = 25$.<br>The number of elements in $R$ is $25 - 8 = 17$.<br>Thus, Statement I is true.<br><br>For Statement II, checking transitivity gives $(-2, 0) \\in R$ since $1 + (-2)(0) = 1 > 0$.<br>Also, $(0, 2) \\in R$ since $1 + (0)(2) = 1 > 0$.<br>However, $(-2, 2) \\notin R$ since $1 + (-2)(2) = -3 \\le 0$.<br>Since $R$ is not transitive, it is not an equivalence relation.<br>Thus, Statement II is false.<br><br>Answer: Only I is true", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "ba84dbe315e14559adb3d7133d723312", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/KVOooY2QgX8yy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/KVOooY2QgX8yy.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073e81239f6567c4f37b", "type": "numerical", "question": {"text": "Let $R = \\{(x, y) \\in \\mathbb{N} \\times \\mathbb{N} : \\log_e(x + y) \\leq 2\\}$. Then the minimum number of elements, required to be added in $R$ to make it a transitive relation, is __________.", "image": null}, "options": [], "correctValue": "15", "solution": {"text": "Given the relation $R = \\{(x, y) \\in \\mathbb{N} \\times \\mathbb{N} : \\log_e(x + y) \\leq 2\\}$.<br><br>This condition simplifies to:<br>$x + y \\leq e^2$<br><br>Since $e \\approx 2.718$, we have $e^2 \\approx 7.389$.<br>As $x, y \\in \\mathbb{N}$, the sum $x + y$ must be a natural number. Therefore, the condition becomes:<br>$x + y \\leq 7$<br><br>Let's find the number of elements in $R$ by listing the possible pairs $(x, y)$:<br>For $x = 1$, $y \\in \\{1, 2, 3, 4, 5, 6\\}$ (6 elements)<br>For $x = 2$, $y \\in \\{1, 2, 3, 4, 5\\}$ (5 elements)<br>For $x = 3$, $y \\in \\{1, 2, 3, 4\\}$ (4 elements)<br>For $x = 4$, $y \\in \\{1, 2, 3\\}$ (3 elements)<br>For $x = 5$, $y \\in \\{1, 2\\}$ (2 elements)<br>For $x = 6$, $y \\in \\{1\\}$ (1 element)<br><br>Total number of elements in $R = 6 + 5 + 4 + 3 + 2 + 1 = 21$.<br><br>To make $R$ a transitive relation, we must ensure that if $(x, y) \\in R$ and $(y, z) \\in R$, then $(x, z) \\in R$.<br>Notice that $(x, 1) \\in R$ for all $x \\in \\{1, 2, 3, 4, 5, 6\\}$ and $(1, z) \\in R$ for all $z \\in \\{1, 2, 3, 4, 5, 6\\}$.<br>For the relation to be transitive, it must contain $(x, z)$ for all possible combinations of $x$ and $z$ from the set $A = \\{1, 2, 3, 4, 5, 6\\}$.<br><br>Thus, the transitive closure of $R$ will be the Cartesian product $A \\times A$, which contains $6 \\times 6 = 36$ elements.<br><br>The minimum number of elements required to be added to $R$ to make it transitive is the difference between the number of elements in the transitive closure and the number of elements already in $R$:<br>Minimum elements to add $= 36 - 21 = 15$.<br><br>Answer: $15$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "aba3d845bbe2482d99081b380e457457", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/dxHl8lHqfwarB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/dxHl8lHqfwarB.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1978bfdbb24356396aa", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $\\mathrm{A}=\\{0,1,2, \\ldots, 9\\}$. Let R be a relation on A defined by $(x, y) \\in \\mathrm{R}$ if and only if $|x-y|$ is a multiple of 3. Given below are two statements: <br> <b>Statement I</b>: $n(\\mathrm{R})=36$. <br> <b>Statement II</b>: $R$ is an equivalence relation. <br> In the light of the above statements, choose the correct answer from the options given below", "image": null}, "options": [{"id": "pgI2k", "text": "Statement I is incorrect but Statement II is correct", "isCorrect": true, "image": null}, {"id": "e3ytw", "text": "Statement I is correct but Statement II is incorrect", "isCorrect": false, "image": null}, {"id": "xHPaz", "text": "Both Statement I and Statement II are incorrect", "isCorrect": false, "image": null}, {"id": "psgsr", "text": "Both Statement I and Statement II are correct", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The relation $R$ on $A = \\{0,1,2,\\ldots,9\\}$ is defined by $(x,y) \\in R$ iff $|x-y|$ is a multiple of 3, i.e., $x \\equiv y \\pmod{3}$.<br>Statement II:<br>$R$ is reflexive ($|x-x|=0$, a multiple of 3), symmetric ($|x-y|=|y-x|$), and transitive (if $x \\equiv y$ and $y \\equiv z \\pmod{3}$, then $x \\equiv z \\pmod{3}$). So $R$ is an equivalence relation. Statement II is correct.<br>Statement I:<br>The equivalence classes are $\\{0,3,6,9\\}$ (4 elements), $\\{1,4,7\\}$ (3 elements), $\\{2,5,8\\}$ (3 elements).<br>$n(R) = 4^2 + 3^2 + 3^2 = 16 + 9 + 9 = 34 \\neq 36$. Statement I is incorrect.", "image": null}, "videoSolution": {"videoId": "076220429376431da9dd7d054893bf25", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/FPp2GH3hoZGVz.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/FPp2GH3hoZGVz.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1918bfdbb2435639660", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $\\mathrm{A}=\\{-2,-1,0,1,2,3,4\\}$. Let R be a relation on A defined by $x \\mathrm{Ry}$ if and only if $2 x+y \\leqslant 2$. Let $l$ be the number of elements in R. Let m and n be the minimum number of elements required to be added in $R$ to make it reflexive and symmetric relations respectively. Then $l+m+n$ is equal to :", "image": null}, "options": [{"id": "8606544591", "text": "35", "isCorrect": false, "image": null}, {"id": "8606544594", "text": "34", "isCorrect": false, "image": null}, {"id": "8606544593", "text": "33", "isCorrect": true, "image": null}, {"id": "8606544592", "text": "32", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\{-2, -1, 0, 1, 2, 3, 4\\}$ and $xRy$ iff $2x + y \\leqslant 2$.<br>For $x = -2$: $y \\leqslant 6$, all 7 elements valid (7 pairs).<br>For $x = -1$: $y \\leqslant 4$, all 7 elements valid (7 pairs).<br>For $x = 0$: $y \\leqslant 2 \\Rightarrow y \\in \\{-2,-1,0,1,2\\}$ (5 pairs).<br>For $x = 1$: $y \\leqslant 0 \\Rightarrow y \\in \\{-2,-1,0\\}$ (3 pairs).<br>For $x = 2$: $y \\leqslant -2 \\Rightarrow y \\in \\{-2\\}$ (1 pair).<br>For $x = 3, 4$: no valid $y$.<br>So $l = 7+7+5+3+1 = 23$.<br>For reflexive: $(x,x) \\in R \\Rightarrow 3x \\leqslant 2 \\Rightarrow x \\leqslant 2/3$. Already present for $x = -2, -1, 0$. Missing for $x = 1, 2, 3, 4$, so $m = 4$.<br>For symmetric: need $(y,x) \\in R$ for every $(x,y) \\in R$. Missing pairs: $(3,-2), (4,-2), (2,-1), (3,-1), (4,-1), (2,0)$, so $n = 6$.<br>$l + m + n = 23 + 4 + 6 = 33$.", "image": null}, "videoSolution": {"videoId": "9af600b118cc45fc95139dc0012d0b36", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/hTLCZcA1pBfFg.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/hTLCZcA1pBfFg.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1878bfdbb24356395db", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let the relation R on the set $\\mathrm{M}=\\{1,2,3, \\ldots, 16\\}$ be given by $\\mathrm{R}=\\{(x, y): 4 y=5 x-3, x, y \\in \\mathrm{M}\\}$. Then the minimum number of elements required to be added in R, in order to make the relation symmetric, is equal to", "image": null}, "options": [{"id": "QD4DN", "text": "4", "isCorrect": false, "image": null}, {"id": "iTXY6", "text": "1", "isCorrect": false, "image": null}, {"id": "ZosDu", "text": "2", "isCorrect": true, "image": null}, {"id": "fTX5X", "text": "3", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $R = \\{(x, y) : 4y = 5x - 3,\\ x, y \\in M\\}$ where $M = \\{1, 2, \\ldots, 16\\}$.<br>From $4y = 5x - 3$, we get $y = \\frac{5x-3}{4}$.<br>For $y$ to be a positive integer, $5x - 3 \\equiv 0 \\pmod{4}$, i.e., $x \\equiv 3 \\pmod{4}$.<br>So $x = 3, 7, 11, 15$.<br>$x=3 \\Rightarrow y=3$,<br>$x=7 \\Rightarrow y=8$,<br>$x=11 \\Rightarrow y=13$,<br>$x=15 \\Rightarrow y=18 \\notin M$.<br>$R = \\{(3,3),\\ (7,8),\\ (11,13)\\}$.<br>For symmetry, $(7,8) \\in R$ requires $(8,7) \\in R$ and $(11,13) \\in R$ requires $(13,11) \\in R$.<br>$(3,3)$ is already symmetric.<br>Minimum elements to be added $= 2$.", "image": null}, "videoSolution": {"videoId": "3f9e69e0f9f44f25b51f40e9d7326f46", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/mIwnc0OqumGc5.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/mIwnc0OqumGc5.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1808bfdbb2435639589", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $\\mathrm{A}=\\{2,3,5,7,9\\}$. Let R be the relation on A defined by $x \\mathrm{R} y$ if and only if $2 x \\leq 3 y$. Let $l$ be the number of elements in R, and m be the minimum number of elements required to be added in R to make it a symmetric relation. Then $l+\\mathrm{m}$ is equal to :", "image": null}, "options": [{"id": "vgFrc", "text": "21", "isCorrect": false, "image": null}, {"id": "BhEOz", "text": "27", "isCorrect": false, "image": null}, {"id": "FgqTi", "text": "23", "isCorrect": false, "image": null}, {"id": "OVQjy", "text": "25", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $A = \\{2, 3, 5, 7, 9\\}$ and $xRy$ iff $2x \\le 3y$, i.e., $y \\ge \\frac{2x}{3}$.<br>For $x=2$: $y \\in \\{2,3,5,7,9\\}$ → 5 pairs<br>For $x=3$: $y \\in \\{2,3,5,7,9\\}$ → 5 pairs<br>For $x=5$: $y \\in \\{5,7,9\\}$ → 3 pairs<br>For $x=7$: $y \\in \\{5,7,9\\}$ → 3 pairs<br>For $x=9$: $y \\in \\{7,9\\}$ → 2 pairs<br>So $l = 18$.<br>For symmetry, pairs in $R$ whose reversal is missing: $(2,5),(2,7),(2,9),(3,5),(3,7),(3,9),(5,9)$ require adding $(5,2),(7,2),(9,2),(5,3),(7,3),(9,3),(9,5)$ → $m = 7$.<br>$l + m = 18 + 7 = 25$.", "image": null}, "videoSolution": {"videoId": "8b2063df7cb8419a853aa33d1192f8cd", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/uVSKFhSRVvlWM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/uVSKFhSRVvlWM.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c927c09d044e4c1a2b1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}], "question": {"text": "Let $A=\\{0,1,2,3,4,5\\}$. Let $R$ be a relation on A defined by $(x, y) \\in R$ if and only if max $\\{x, y\\} \\in\\{3,4\\}$. Then among the statements $\\left(\\mathrm{S}_1\\right)$ : The number of elements in R is 18 , and $\\left(\\mathrm{S}_2\\right)$ : The relation R is symmetric but neither reflexive nor transitive", "image": null}, "options": [{"id": "ZEGLL", "text": "both are true", "image": null, "isCorrect": false}, {"id": "ROPyT", "text": "both are false", "image": null, "isCorrect": false}, {"id": "BEI8h", "text": "only $\\left(\\mathrm{S}_2\\right)$ is true", "image": null, "isCorrect": true}, {"id": "z2vCl", "text": "only $\\left(\\mathrm{S}_1\\right)$ is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$A=\\{0,1,2,3,4,5\\}$<br/>$\\mathrm{R} \\equiv\\{(0,3),(3,0),(0,4),(4,0),(1,3),(3,1),(1,4)$,<br/>$(4,1),(2,3),(3,2),(2,4),(4,2),(3,3),(3,4),(4,3)$,<br/>$(4,4)\\}$<br/>Total 16 elements<br/>Not reflexive as $(0,0), \\ldots \\ldots,(2,2) \\notin \\mathrm{R}$<br/>Symmetric $\\because \\forall$ all a,b<br/>$(a, b) \\&(b, a) \\in R$<br/>Not transitive $\\because(0,3),(3,1) \\in R$<br/>but $(0,1) \\notin \\mathrm{R}$<br/>$\\Rightarrow$ Only $\\mathrm{S}_2$ correct", "image": null}, "videoSolution": {"videoId": "f328c784dd01415ebe44366dac0aba3b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gzDJFATpIJhfU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gzDJFATpIJhfU.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c927c09d044e4c1a2b0", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}], "question": {"text": "The number of relations on the set $\\mathrm{A}=\\{1,2,3\\}$ containing at most 6 elements including $(1,2)$, which are reflexive and transitive but not symmetric, is ________", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "$\\begin{aligned}<br/>& A=\\{1,2,3\\} \\\\\n& (1,1),(2,2),(3,3),(1,2) \\in R<br/>\\end{aligned}$<br/>Remaining elements are<br/>$(2,1),(2,3),(1,3),(3,1),(3,2)$<br/>(1) If relation contains exactly 4 elements = 1 way<br/>(2) if relation contains exactly 5 elements<br/>It can be $(1,3),(3,2) \\Rightarrow 2$ ways<br/>(3) If relation contain exactly 6 elements<br/>It can be $((2,3),(1,3)),((1,3),(3,2)),((3,1),(3,2))$<br/>$\\Rightarrow 3$ ways.<br/>Total $=6$ ways", "image": null}, "videoSolution": {"videoId": "9e87f6c32d584f82900a2f26f56d4bdb", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/5ZcrtqQXy2DRG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/5ZcrtqQXy2DRG.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c927c09d044e4c1a2af", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}], "question": {"text": "Let $\\mathrm{A}=\\{-3,-2,-1,0,1,2,3\\}$ and R be a relation on $A$ defined by $x R y$ if and only if $2 x-y \\in\\{0,1\\}$. Let $l$ be the number of elements in R. Let $m$ and $n$ be the minimum number of elements required to be added in R to make it reflexive and symmetric relations, respectively. Then $l+\\mathrm{m} \\mathrm{n}$ is equal to :-", "image": null}, "options": [{"id": "MBQZu", "text": "$18$", "image": null, "isCorrect mathrm{f}(1) \\text { and } \\mathrm{f}(1)=\\mathrm{f}(0) \\rightarrow \\text { must hold } \\\\ & \\Rightarrow \\text { but this is not true for all function }\\end{aligned}$<br/>so not reflexive<br/>Symmetric: If $(\\mathrm{f}, \\mathrm{g}) \\in \\mathrm{R} \\Rightarrow(\\mathrm{g}, \\mathrm{f}) \\in \\mathrm{R}$<br/>Now, $g(0)=f(1)$ and $g(1)=f(0) \\rightarrow$ true<br/>$\\therefore$ symmetric<br/>Transitive : $\\operatorname{If}(\\mathrm{f}, \\mathrm{g}) \\in \\mathrm{R}$ and $(\\mathrm{g}, \\mathrm{h}) \\in \\mathrm{R}$<br/>$\\Rightarrow(\\mathrm{f}, \\mathrm{h}) \\in \\mathrm{R}$<br/>Now $(f, g) \\in R \\Rightarrow f(0)=g(1)$ and $f(1)=g(0)$<br/>$(\\mathrm{g}, \\mathrm{h}) \\in \\mathrm{R} \\Rightarrow \\mathrm{g}(0)=\\mathrm{h}(1)$ and $\\mathrm{g}(1)=\\mathrm{h}(0)$<br/>For $(f, h) \\in R$ we need $f(0)=h(1)$ and $f(1)=h(0)$<br/>Now $f(0)=g(1)=h(0)$ and $f(1)=g(0)=h(1)$<br/>Hence not transitive", "image": null}, "videoSolution": {"videoId": "c34f734223f047fe8db982cd3251fbbe", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/hYqfqWGc08yuP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/hYqfqWGc08yuP.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 1)", "title": "JEE Main 2025 (2 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eecac8b73881fdaea2eb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52f 24-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 2)", "title": "JEE Main 2024 (08 Apr Shift 2)"}], "question": {"text": "Let $A=\\{2,3,6,8,9,11\\}$ and $B=\\{1,4,5,10,15\\}$. Let $R$ be a relation on $A \\times B$ defined by $(a, b) R(c, d)$ if and only if $3 a d-7 b c$ is an even integer. Then the relation $R$ is", "image": null}, "options": [{"id": "BACE5", "text": "an equivalence relation.", "image": null, "isCorrect": false}, {"id": "zxbUz", "text": "reflexive and symmetric but not transitive.", "image": null, "isCorrect": true}, {"id": "TJKBW", "text": "transitive but not symmetric.", "image": null, "isCorrect": false}, {"id": "PFSc4", "text": "reflexive but not symmetric.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{lc}\\mathrm{A}=\\{2,3,6,8,9,11\\} & (\\mathrm{a}, \\mathrm{b}) \\mathrm{R}(\\mathrm{c}, \\mathrm{d}) \\\\ \\mathrm{B}=\\{1,4,5,10,15\\} & 3 \\mathrm{ad}-7 \\mathrm{bc}\\end{array}$\nReflexive : $(\\mathrm{a}, \\mathrm{b}) \\mathrm{R}(\\mathrm{a}, \\mathrm{b})$\n$\\Rightarrow 3 \\mathrm{ab}-7 \\mathrm{ba}=-4 \\mathrm{ab}$ always even so it is reflexive.\nSymmetric : If $3 \\mathrm{ad}-7 \\mathrm{bc}=$ Even\nCase-I : odd odd\nCase-II : even even\n(c, d) $\\mathrm{R}(\\mathrm{a}, \\mathrm{b}) \\Rightarrow 3 \\mathrm{bc}-3 \\mathrm{ab}$\nCase-I : odd odd\nCase-II : even even\nso symmetric relation\nTransitive :\nSet $(3,4) R(6,4)$ Satisfy relation\nSet $(6,4) R(3,1)$ Satisfy relation\nbut $(3,4) \\mathrm{R}(3,1)$ does not satisfy relation so not transitive.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 2)", "title": "JEE Main 2024 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446739970e6e9ab542d156", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 2)", "title": "JEE Main 2024 (06 Apr Shift 2)"}], "question": {"text": "Let $A=\\{1,2,3,4,5\\}$. Let $\\mathrm{R}$ be a relation on $\\mathrm{A}$ defined by $x \\mathrm{R} y$ if and only if $4 x \\leq 5 \\mathrm{y}$. Let $\\mathrm{m}$ be the number of elements in $\\mathrm{R}$ and $\\mathrm{n}$ be the minimum number of elements from $\\mathrm{A} \\times \\mathrm{A}$ that are required to be added to $\\mathrm{R}$ to make it a symmetric relation. Then $\\mathrm{m}+\\mathrm{n}$ is equal to :", "image": null}, "options": [{"id": "z7j9a", "text": "25", "image": null, "isCorrect": true}, {"id": "7kc11", "text": "24", "image": null, "isCorrect": false}, {"id": "bhiP3", "text": "26", "image": null, "isCorrect": false}, {"id": "6IJSj", "text": "23", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given : $4 x \\leq 5 y$\nthen\n$\\begin{aligned}\n\\mathrm{R}=\\{ & (1,1),(1,2),(1,3),(1,4),(1,5),(2,2),(2,3),(2,4) \\\\\n& (2,5),(3,3),(3,4),(3,5),(4,4),(4,5),(5,4),(5,5)\\}\n\\end{aligned}$\ni.e. 16 elements.\ni.e. $\\mathrm{m}=16$\nNow to make R a symmetric relation add\n$\\{(2,1)(3,2)(4,3)(3,1)(4,2)(5,3)(4,1)(5,2)(5,1)\\}$\ni.e. $n=9$<br />So $m+n=25$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 2)", "title": "JEE Main 2024 (06 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446730970e6e9ab542d104", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 1)", "title": "JEE Main 2024 (06 Apr Shift 1)"}], "question": {"text": "Let the relations $R_1$ and $R_2$ on the set $X=\\{1,2,3, \\ldots, 20\\}$ be given by $R_1=\\{(x, y): 2 x-3 y=2\\}$ and $R_2=\\{(x, y):-5 x+4 y=0\\}$. If $M$ and $N$ be the minimum number of elements required to be added in $R_1$ and $R_2$, respectively, in order to make the relations symmetric, then $M+N$ equals", "image": null}, "options": [{"id": "h4n3s", "text": "12", "image": null, "isCorrect": false}, {"id": "43zgV", "text": "16", "image": null, "isCorrect": false}, {"id": "mfnOE", "text": "8", "image": null, "isCorrect": false}, {"id": "qW765", "text": "10", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{x}=\\{1,2,3, \\ldots \\ldots . .20\\} \\\\ & \\mathrm{R}_1=\\{(\\mathrm{x}, \\mathrm{y}): 2 \\mathrm{x}-3 \\mathrm{y}=2\\} \\\\ & \\mathrm{R}_2=\\{(\\mathrm{x}, \\mathrm{y}):-5 \\mathrm{x}+4 \\mathrm{y}=0\\}\\end{aligned}$\n$\\begin{aligned}\n& \\mathrm{R}_1=\\{(4,2),(7,4),(10,6),(13,8),(16,10),(19,12)\\} \\\\\n& \\mathrm{R}_2=\\{(4,5),(8,10),(12,15),(16,20)\\}\n\\end{aligned}$\nin $R_1 6$ element needed\nin $R_2 4$ element needed\nSo, total $6+4=10$ element", "image": null}, "videoSolution": {"videoId": "dd3051a62d6c4bb4b95b14b22a189816", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/XRCHKELQLrgjF.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/XRCHKELQLrgjF.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60ed i>i</mi></mrow></mfenced></math></p><p>Now, adding above equation we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mo>+</mo><mi>f</mi><mo>=</mo><mi>b</mi><mo>+</mo><mi>e</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><msub><mi>R</mi><mn>2</mn></msub><mfenced><mrow><mi>e</mi><mo>,</mo><mi>f</mi></mrow></mfenced></math></p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math> is reflexive, symmetric and transitive</p><p>Hence only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math> is equivalence relation.</p>", "image": null}, "videoSolution": {"videoId": "a65cc6eeaa884f3e867ad4d562373b9a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LiweeoB21B3sn.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LiweeoB21B3sn.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd45ba0e94a3c4025b99", "type": "numerical", "level": 1, "questionLabels": [], "question": {"text": "Let <math x >Now, given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> be the equivalence relation on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>⊂</mo><mi>S</mi></math></p><p>So, for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> to be equivalence it should be Reflexive, Symmetric and Transitive on given relation,</p><p>Now, for reflexive Relation we need, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>4</mn></mrow></mfenced></mrow></mfenced><mo>→</mo><mn>4</mn></math> elements,</p><p>For Symmetric relation we need, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>1</mn></mrow></mfenced></mrow></mfenced><mo>→</mo><mn>3</mn></math> elements,</p><p>And for Transitive relation we need, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>3</mn></mrow></mfenced></mrow></mfenced><mo>→</mo><mn>6</mn></math> elements</p><p>So, minimum <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>13</mn></math> elements should be added in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math></p><p>Hence , <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mi>S</mi></mfenced><mo>=</mo><mn>16</mn></math> elements.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd46ba0e94a3c4025b9f", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is the smallest equivalence relation on the set <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>}</mo></math> such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>{</mo><mo>(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>1</mn><mo>,</mo><mn>3</mn><mo>)</mo><mo>}</mo><mo>⊂</mo><mi>R</mi></math>, then the number of elements in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is ______.", "image": null}, "options": [{"id": "lTwLQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>", "image": null, "isCorrect": true}, {"id": "v0f3I", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math>", "image": null, "isCorrect": false}, {"id": "YSJBH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "image": null, "isCorrect": false}, {"id": "MVV9S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></mrow></mfenced></math></p><p>To make <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> as Reflexive, the required elements are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>3</mn></mrow></mfenced><mo> </mo><mtext>and</mtext><mo> </mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math></p><p>To make <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> as Symmetric, the required elements are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo> </mo><mtext>and</mtext><mo> </mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math></p><p>To make <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> as Transitive, the required elements are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo> </mo><mtext>and</mtext><mo> </mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math></p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math> elements are required to make <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> an equivalence relation.</p><p>Hence, the total number of elements in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>.</p>", "image": null}, "videoSolution": {"videoId": "a2a75273d8894dc6bed4301bd777bac5", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/IVARcEcEZqkHX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/IVARcEcEZqkHX.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb01", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 2)", "title": "JEE Main 2024 (29 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb01", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 2)", "title": "JEE Main 2024 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd45ba0e94a3c4025b98", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> be a relation on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi><mo>×</mo><mi>Z</mi></math> defined by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>a</mi><mo>,</mo><mo> </mo><mi>b</mi><mo>)</mo><mi>R</mi><mo>(</mo><mi>c</mi><mo>,</mo><mo> </mo><mi>d</mi><mo>)</mo></math> if and only if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>d</mi><mo>-</mo><mi>b</mi><mi>c</mi></math> is divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> . Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is", "image": null}, "options": [{"id": "yOYeO", "text": "Reflexive and symmetric but not transitive", "image": null, "isCorrect": true}, {"id": "wmS9n", "text": "Reflexive but neither symmetric not transitive", "image": null, "isCorrect": false}, {"id": "hOaxG", "text": "Reflexive, symmetric and transitive", "image": null, "isCorrect": false}, {"id": "WVzBa", "text": "Reflexive and transitive but not symmetric", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given relation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo> </mo><mo>:</mo><mo> </mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo> </mo><mi>R</mi><mo> </mo><mfenced><mrow><mi>c</mi><mo>,</mo><mi>d</mi></mrow></mfenced></math></p><p>And <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>d</mi><mo>-</mo><mi>b</mi><mi>c</mi><mo>=</mo><mn>5</mn><mi>k</mi><mo> </mo><mfenced close=\"}\" open=\"{\"><mrow><mtext>where </mtext><mi>k</mi><mo>∈</mo><mi>Z</mi></mrow></mfenced></math></p><p>Now, for reflexive <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo> </mo><mo>:</mo><mo> </mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo> </mo><mi>R</mi><mo> </mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mi>b</mi><mo>-</mo><mi>b</mi><mi>a</mi><mo>=</mo><mn>0</mn></math> which is divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math></p><p>So, the relation is reflexive,</p><p>Now, for symmetric <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo> </mo><mo>:</mo><mo> </mo><mfenced><mrow><mi>c</mi><mo>,</mo><mi>d</mi></mrow></mfenced><mo> </mo><mi>R</mi><mo> </mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mi>c</mi><mo>-</mo><mi>a</mi><mi>d</mi><mo>=</mo><mo>-</mo><mn>5</mn><mi>k</mi><mo> </mo></math> which is divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math></p><p>So, the relation is symmetric,</p><p>Now for transitive relation, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo> </mo><mo>:</mo><mo> </mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo> </mo><mi>R</mi><mo> </mo><mfenced><mrow><mi>c</mi><mo>,</mo><mi>d</mi></mrow></mfenced><mo> </mo><mi>R</mi><mo> </mo><mfenced><mrow><mi>e</mi><mo>,</mo><mi>f</mi></mrow></mfenced><mo> </mo></math></p><p>Taking example <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>≡</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mi>c</mi><mo>,</mo><mi>d</mi></mrow></mfenced><mo>≡</mo><mfenced><mrow><mn>10</mn><mo>,</mo><mn>10</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mi>e</mi><mo>,</mo><mi>f</mi></mrow></mfenced><mo>≡</mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>d</mi><mo>-</mo><mi>b</mi><mi>c</mi><mo>=</mo><mn>10</mn><mo>-</mo><mn>20</mn><mo>=</mo><mo>-</mo><mn>10</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mi>f</mi><mo>-</mo><mi>e</mi><mi>d</mi><mo>=</mo><mn>40</mn><mo>-</mo><mn>40</mn><mo>=</mo><mn>0</mn></math></p><p>But <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>f</mi><mo>-</mo><mi>b</mi><mi>e</mi><mo>=</mo><mn>8</mn><mo>-</mo><mn>4</mn><mo>=</mo><mn>4</mn></math> which is not divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>,</p><p>Hence, the relation is reflexive, symmetric but not transitive.</p>", "image": null}, "videoSolution": nu ><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mo>{</mo><mo>(</mo><mi>A</mi><mo>,</mo><mi>B</mi><mo>)</mo><mo>:</mo><mi>A</mi><mo>∩</mo><mi>B</mi><mo>≠</mo><mi>ϕ</mi><mo>;</mo><mi>A</mi><mo>,</mo><mi>B</mi><mo>∈</mo><mi>M</mi><mo>}</mo></math></p><p>For Reflexive, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is subset of '<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>'</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>ϕ</mi><mo>∈</mo><mi mathvariant=\"normal\">M</mi></math> for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ϕ</mi><mo>∩</mo><mi>ϕ</mi><mo>=</mo><mi>ϕ</mi></math></p><p>But it is given that relation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>∩</mo><mi mathvariant=\"normal\">B</mi><mo>≠</mo><mi>ϕ</mi></math>.</p><p>So, it is not reflexive.</p><p>For symmetric,</p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>R</mi><mi>B</mi><none></none><mprescripts></mprescripts><mi>A</mi><none></none></mmultiscripts><mo>⇒</mo><mi mathvariant=\"normal\">A</mi><mo>∩</mo><mi mathvariant=\"normal\">B</mi><mo>≠</mo><mi>ϕ</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>R</mi><mi>A</mi><none></none><mprescripts></mprescripts><mi>B</mi><none></none></mmultiscripts><mo>⇒</mo><mi mathvariant=\"normal\">B</mi><mo>∩</mo><mi mathvariant=\"normal\">A</mi><mo>≠</mo><mi mathvariant=\"normal\">ϕ</mi></math>,</p><p>So, it is symmetric.</p><p>For transitive,</p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mo>{</mo><mo>(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>)</mo><mo>}</mo></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mo>{</mo><mo>(</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>)</mo><mo>}</mo></math> then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mo>{</mo><mo>(</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>5</mn><mo>,</mo><mn>6</mn><mo>)</mo><mo>}</mo></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mmultiscripts><mi>R</mi><mi>B</mi><none></none><mprescripts></mprescripts><mi>A</mi><none></none></mmultiscripts><mo>,</mo><mo> </mo><mmultiscripts><mi>R</mi><mi>C</mi><none></none><mprescripts></mprescripts><mi>B</mi><none></none></mmultiscripts></math> is applicable but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>R</mi><mi>C</mi><none></none><mprescripts></mprescripts><mi>A</mi><none></none></mmultiscripts></math> is not followed.</p><p>So, it not transitive</p><p>Hence, the given relation is symmetric only.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d686fc", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mo>{</mo><mo>-</mo><mn>4</mn><mo>,</mo><mo>-</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>,</mo><mn>0</mn><mo ><mn>3</mn><mo>,</mo><mn>3</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>3</mn><mo>,</mo><mn>3</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>4</mn><mo>,</mo><mn>4</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>)</mo><mo>}</mo></math></p><p>Now, relation to be reflexive <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>a</mi><mo>,</mo><mi>a</mi><mo>)</mo><mo>&#8712;</mo><mi>R</mi><mo>&#160;</mo><mo>&#8704;</mo><mo>&#160;</mo><mi>a</mi><mo>&#8712;</mo><mi>A</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>(</mo><mo>-</mo><mn>4</mn><mo>,</mo><mo>-</mo><mn>4</mn><mo>)</mo><mo>,</mo><mo>(</mo><mo>-</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>3</mn><mo>)</mo><mo>,</mo><mo>(</mo><mo>-</mo><mn>2</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>)</mo></math> also should be added in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>.</p><p>Now relation to be symmetric if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo>)</mo><mo>&#8712;</mo><mi>R</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>b</mi><mo>,</mo><mi>a</mi><mo>)</mo><mo>&#8712;</mo><mi>R</mi><mo>&#160;</mo><mo>&#8704;</mo><mo>&#160;</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo>&#8712;</mo><mi>A</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>(</mo><mn>4</mn><mo>,</mo><mo>-</mo><mn>4</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>3</mn><mo>)</mo><mo>,</mo><mo>(</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>)</mo><mo>,</mo><mo>(</mo><mo>-</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> also should be added in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math></p><p>Hence, minimum number of elements to be added to<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>3</mn><mo>+</mo><mn>4</mn><mo>=</mo><mn>7</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d6864e", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "The number of relations, on the set&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"{\" close=\"}\"><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn></mrow></mfenced></math>&nbsp;containing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn></mrow></mfenced></math>&nbsp;which are reflexive and transitive but not symmetric, is _________.", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>Given,</p><p>Set&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math></p><p>Now Cartesian product&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#215;</mo><mi>A</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>,</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>3</mn></mrow></mfenced></mrow></mfenced></math></p><p>Now, given the relation is reflexive,</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn></mrow></mfenced><mo>&#160;</mo><mo>&#8712;</mo><mo>&#160;</mo><mi>R</mi></math></p><p>Also given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn></mrow></mfenced><mo>&#8712;</mo><mo>&#160;</mo><mi>R</mi><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn></mrow></mfenced></math>&nbsp;must&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8712;</mo><mo>&#160;</mo><mi>R</mi></math></p><p>Now finding,&nbsp;<strong>Possible cases</strong> :</p><p><strong>Case-1</strong>: All of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo><mo>&#8713;</mo><mi>R</mi><mo>&#8594;</mo><mn>1</mn></math>&nbsp;relation.</p><p><strong>Case-2: </strong>Only one of<strong>&nbsp;</strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#8712;</mo><mi>R</mi><mo>&#8594;</mo><mn>3</mn></math>&nbsp;relations.</p><p>For example if relation is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"{\" close=\"}\"><mrow><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced></mrow></mfenced></math>&nbsp;then it is reflexive as well as transitive as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>&#8594;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo><mtext>is&#160;present&#160;in&#160;relation</mtext></math></p><p>Note that exactly two of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#8712;</mo><mi>R</mi></math>&nbsp;is&nbsp;not possible because if two of these&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8712;</mo><mi>R</mi></math>,&nbsp;third must&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8712;</mo><mi>R</mi></math>&nbsp;&nbsp;to make relation transitive.</p><p>Total number of relations&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68476", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mo>{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>5</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>7</mn><mo>}</mo></math>. Then the relation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mo>{</mo><mo>(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>)</mo><mo>&#8712;</mo><mi>A</mi><mo>&#215;</mo><mi>A</mi><mo>:</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>7</mn><mo>}</mo></math> is", "image": null}, "options": [{"id": "Y3asP", "text": "an equivalence relation", "image": null, "isCorrect": false}, {"id": "dlfGA", "text": "symmetric but neither reflexive nor transitive", "image": null, "isCorrect": true}, {"id": "fPXj7", "text": "transitive but neither symmetric nor reflexive", "image": null, "isCorrect": false}, {"id": "stysM", "text": "reflexive but neither symmetric nor transitive", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>We have,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>5</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>7</mn></mrow></mfenced></math></p><p><strong>Reflexive</strong>: A relation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;on a set&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is said to be reflexive if every element of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is related to itself.</p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>&#160;</mo><mi>is</mi><mo>&#160;</mo><mi>reflexive</mi><mo>&#8660;</mo><mo>(</mo><mi>a</mi><mo>,</mo><mi>a</mi><mo>)</mo><mo>&#8712;</mo><mi>R</mi><mo>&#160;</mo><mi>for</mi><mo>&#160;</mo><mi>all</mi><mo>&#160;</mo><mi>a</mi><mo>&#8712;</mo><mi>A</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>)</mo><mo>,</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>(</mo><mn>3</mn><mo>,</mo><mn>3</mn><mo>)</mo><mo>,</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>7</mn><mo>,</mo><mn>7</mn><mo>)</mo></math>&nbsp;does not satisfy&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>7</mn></math></p><p>Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is not reflexive.</p><p><strong>Symmetric</strong>: A relation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;is symmetric on a set&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;iff</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo>)</mo><mo>&#8712;</mo><mi>R</mi><mo>&#8658;</mo><mo>(</mo><mi>b</mi><mo>,</mo><mi>a</mi><mo>)</mo><mo>&#8712;</mo><mi>R</mi><mo>&#160;</mo><mi>for</mi><mo>&#160;</mo><mi>all</mi><mo>&#160;</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo>&#8712;</mo><mi>A</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>7</mn></math></p><p>Now on interchanging&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;we get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mi>x</mi><mo>=</mo><mn>7</mn></math>&nbsp;which is always true for given set,</p><p>Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is symmetric.</p><p><strong>Transitive</strong>: A relation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is said to be transitive relation iff&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi mathvariant=\"italic\">a</mi><mo mathvariant=\"italic\">,</mo><mi mathvariant=\"italic\">b</mi></mrow></mfenced><mo mathvariant=\"italic\">&#8712;</mo><mi>R</mi><mo mathvariant=\"italic\">&#160;</mo><mi>and</mi><mo mathvariant=\"italic\">&#160;</mo><mo mathvariant=\"italic\">(</mo><mi>b</mi><mo mathvariant=\"italic\">,</mo><mi>c</mi><mo mathvariant=\"italic\">)</mo><mo mathvariant=\"italic\">&#8712;</mo><mi>R</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>c</mi></mrow></mfenced><mo>&#8712;</mo><mi>R</mi><mo>&#160;</mo><mi>for</mi><mo>&#160;</mo><mi>all</mi><mo>&#160;</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo>,</mo><mi>c</mi><mo>&#8712;</mo><mi>A</mi></math></p><p>Now taking&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>&#8801;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>b</mi><mo>,</mo><mi>c</mi></mrow></mfenced><mo>&#8801;</mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;so&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>c</mi></mrow></mfenced><mo>&#8801;</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;does not satisfy&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>7</mn></math>,</p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is&nbsp;not transitive and not equivalence.</p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is only Symmetric.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68432", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>0</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>7</mn><mo>,</mo><mn>8</mn><mo>,</mo><mn>9</mn><mo>,</mo><mn>10</mn></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> be the relation defined on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mfence
