60;&#160;</mo><mi>X</mi><mo>&#8838;</mo><mi>Y</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;</mo><mi>X</mi><mo>&#8746;</mo><mi>Y</mi><mo>=</mo><mi>Y</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659df", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "Let $X$ and $Y$ are two events such that $P(X \\cup Y=) P X \\cap(Y . \\quad)$\nStatement 1: $P\\left(X \\cap Y^{\\prime}=\\dot{P} X^{\\prime} \\cap(Y=0 \\quad)\\right.$\nStatement 2: $P(X) P Y \\in 2) P X \\cap Y(\\quad)$", "image": null}, "options": [{"id": "r8uOm", "text": "\nStatement 1 is false, Statement 2 is true.\n", "image": null, "isCorrect": false}, {"id": "Zyml3", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is not a correct explanation of Statement 1.\n", "image": null, "isCorrect": true}, {"id": "UQCQp", "text": "\nStatement 1 is true, Statement 2 is false.\n", "image": null, "isCorrect": false}, {"id": "CPcb3", "text": "\nStatement 1 is true, Statement 2 is true; Statement 2 is a correct explanation of Statement 1.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $X$ and $Y$ be two events such that\n$$\nP(X \\cup Y)=P(X \\cap Y)\n$$\nWe know\n$$\n\\begin{aligned}\n& P(X \\cup Y)=P(X)+P(Y)-P(X \\cap Y) \\\\\n& P(X \\cap Y)=P(X)+P(Y)-P(X \\cap Y) \\\\\n& \\text { (from }(1) \\\\\n& \\Rightarrow P(X)+P(Y)=2 P(X \\cap Y)\n\\end{aligned}\n$$\nHence, Statement $-2$ is true.\nNow, $P\\left(X \\cap Y^{\\prime}\\right)=P(X)-P(X \\cap Y)$\nand $P\\left(X^{\\prime} \\cap Y\\right)=P(Y)-P(X \\cap Y)$\nThis implies statement-1 is also true.", "image": null}, "videoSolution": null, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65916", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "Let $S$ be a non-empty subset of R. Consider the following statement:\n$\\mathrm{P}$ : There is a rational number $\\mathrm{x} \\in \\mathrm{S}$ such that $\\mathrm{x}>0$.\nWhich of the following statements is the negation of the statement $P$ ?", "image": null}, "options": [{"id": "5mUfQ", "text": "\nThere is no rational number $x \\in S$ such that $x \\leq 0$\n", "image": null, "isCorrect": false}, {"id": "Uqafg", "text": "\nEvery rational number $x \\in S$ satisfies $x \\leq 0$\n", "image": null, "isCorrect": true}, {"id": "V4TUm", "text": "\n$x \\in S$ and $x \\leq 0 \\Rightarrow x$ is not rational\n", "image": null, "isCorrect": false}, {"id": "iiHWQ", "text": "\nThere is a rational number $x \\in S$ such that $x \\leq 0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$P$ : there is a rational number $x \\in S$ such that $x>0$\n$\\sim P$ : Every rational number $\\mathrm{x} \\in \\mathrm{S}$ satisfies $\\mathrm{x} \\leq 0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d658c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "If $A, B$ and $C$ are three sets such that $A \\cap B=A \\cap C$ and $A \\cup B=A \\cup C$, then", "image": null}, "options": [{"id": "DbkdA", "text": "\n$A=B$\n", "image": null, "isCorrect": false}, {"id": "buN7L", "text": "\n$A=C$\n", "image": null, "isCorrect": false}, {"id": "n1EU6", "text": "\n$B=C$\n", "image": null, "isCorrect": true}, {"id": "MytpW", "text": "\n$A \\cap B=\\phi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a74417cc3fb48d693c8", "title": "Questions on number of relations and sets", "totalQuestions": 43, "questions": [{"_id": "69d8075f81239f6567c4f4f2", "type": "numerical", "question": {"text": "Let $A = \\{1, 4, 7\\}$ and $B = \\{2, 3, 8\\}$. Then the number of elements, in the relation $R = \\{((a_1, b_1), (a_2, b_2)) \\in ((A \\times B) \\times (A \\times B)) : a_1 + b_2 \\text{ divides } a_2 + b_1\\}$ is _______.", "image": null}, "options": [], "correctValue": "18", "solution": {"text": "Let $A = \\{1, 4, 7\\}$ and $B = \\{2, 3, 8\\}$. The relation $R$ consists of pairs $((a_1, b_1), (a_2, b_2))$ from $A \\times B$ such that $(a_1 + b_2)$ divides $(a_2 + b_1)$.<br><br>Let $x = a_1 + b_2$ and $y = a_2 + b_1$. Note that $(a_1, b_2)$ and $(a_2, b_1)$ are both independent elements of $A \\times B$. So choosing $((a_1, b_1), (a_2, b_2))$ is equivalent to independently choosing two elements of $A \\times B$ with sums $x$ and $y$ such that $x \\mid y$.<br><br>All possible sums $a + b$ with $a \\in A$ and $b \\in B$:<br>$1 + 2 = 3$, $1 + 3 = 4$, $1 + 8 = 9$<br>$4 + 2 = 6$, $4 + 3 = 7$, $4 + 8 = 12$<br>$7 + 2 = 9$, $7 + 3 = 10$, $7 + 8 = 15$<br><br>Frequencies of each sum:<br>$f(3) = 1$, $f(4) = 1$, $f(6) = 1$, $f(7) = 1$, $f(9) = 2$, $f(10) = 1$, $f(12) = 1$, $f(15) = 1$<br><br>For each possible divisor $x$, count the number of valid pairs $(x, y)$ with $x \\mid y$, each contributing $f(x) \\cdot f(y)$:<br><br>$x = 3$: divides $3, 6, 9, 12, 15$<br>Ways $= 1 \\cdot (1 + 1 + 2 + 1 + 1) = 6$<br><br>$x = 4$: divides $4, 12$<br>Ways $= 1 \\cdot (1 + 1) = 2$<br><br>$x = 6$: divides $6, 12$<br>Ways $= 1 \\cdot (1 + 1) = 2$<br><br>$x = 7$: divides $7$<br>Ways $= 1 \\cdot 1 = 1$<br><br>$x = 9$: divides $9$<br>Ways $= 2 \\cdot 2 = 4$<br><br>$x = 10$: divides $10$<br>Ways $= 1 \\cdot 1 = 1$<br><br>$x = 12$: divides $12$<br>Ways $= 1 \\cdot 1 = 1$<br><br>$x = 15$: divides $15$<br>Ways $= 1 \\cdot 1 = 1$<br><br>Total number of elements in $R$:<br>$6 + 2 + 2 + 1 + 4 + 1 + 1 + 1 = 18$<br><br>Hence, the answer is $18$.", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "6c70127ee7db425f854180307c630bf4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/8ES7D9xpZMt8f.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/8ES7D9xpZMt8f.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8072b81239f6567c4f29a", "type": "numerical", "question": {"text": "Let $A = \\{2, 3, 4, 5, 6\\}$. Let R be a relation on the set $A \\times A$ given by $(x, y) R (z, w)$ if and only if $x$ divides $z$ and $y \\leq w$. Then the number of elements in R is _______.", "image": null}, "options": [], "correctValue": "120", "solution": {"text": "Given the set $A = \\{2, 3, 4, 5, 6\\}$.<br><br>The relation $R$ is defined on $A \\times A$ such that $(x, y) R (z, w)$ if and only if $x$ divides $z$ and $y \\leq w$.<br><br>The number of elements in $R$ is the number of ordered pairs $((x, y), (z, w))$ satisfying these conditions. Since the conditions for $(x, z)$ and $(y, w)$ are independent, the total number of elements in $R$ will be the product of the number of pairs $(x, z)$ satisfying $x$ divides $z$ and the number of pairs $(y, w)$ satisfying $y \\leq w$.<br><br>First, we find the number of pairs $(x, z) \\in A \\times A$ such that $x$ divides $z$:<br>For $x = 2$, $z \\in \\{2, 4, 6\\}$ ($3$ pairs)<br>For $x = 3$, $z \\in \\{3, 6\\}$ ($2$ pairs)<br>For $x = 4$, $z \\in \\{4\\}$ ($1$ pair)<br>For $x = 5$, $z \\in \\{5\\}$ ($1$ pair)<br>For $x = 6$, $z \\in \\{6\\}$ ($1$ pair)<br>Total number of pairs $(x, z) = 3 + 2 + 1 + 1 + 1 = 8$.<br><br>Next, we find the number of pairs $(y, w) \\in A \\times A$ such that $y \\leq w$:<br>For $y = 2$, $w \\in \\{2, 3, 4, 5, 6\\}$ ($5$ pairs)<br>For $y = 3$, $w \\in \\{3, 4, 5, 6\\}$ ($4$ pairs)<br>For $y = 4$, $w \\in \\{4, 5, 6\\}$ ($3$ pairs)<br>For $y = 5$, $w \\in \\{5, 6\\}$ ($2$ pairs)<br>For $y = 6$, $w \\in \\{6\\}$ ($1$ pair)<br>Total number of pairs $(y, w) = 5 + 4 + 3 + 2 + 1 = 15$.<br><br>The total number of elements in the relation $R$ is the product of the number of these pairs:<br>Total elements = $8 \\times 15 = 120$.<br><br>Answer: $120$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "a5519bdff3ab4697b16eb2b4dc38024b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/32ER6HyqkAQq7.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/32ER6HyqkAQq7.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19e8bfdbb24356396fb", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let R be a relation defined on the set $\\{1,2,3,4\\} \\times\\{1,2,3,4\\}$ by $\\mathrm{R}=\\{((a, b),(c, d)): 2 a+3 b=3 c+4 d\\}$. Then the number of elements in R is", "image": null}, "options": [{"id": "RfkDx", "text": "18", "isCorrect": false, "image": null}, {"id": "kOfzl", "text": "6", "isCorrect": false, "image": null}, {"id": "pv9pE", "text": "15", "isCorrect": false, "image": null}, {"id": "mFa9r", "text": "12", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "We need $2a+3b = 3c+4d$ where $a,b,c,d \\in \\{1,2,3,4\\}$.<br>Possible values of $2a+3b$: range from $5$ to $20$.<br>Possible values of $3c+4d$: range from $7$ to $28$.<br>For each common value $k$, the number of elements in $R$ equals (number of $(a,b)$ with $2a+3b=k$) $\\times$ (number of $(c,d)$ with $3c+4d=k$).<br>$k=7$: $(a,b)=(2,1)$, $(c,d)=(1,1)$ $\\Rightarrow 1 \\times 1=1$<br>$k=10$: $(2,2)$, $(2,1)$ $\\Rightarrow 1$<br>$k=11$: $(1,3),(4,1)$, $(1,2)$ $\\Rightarrow 2$<br>$k=13$: $(2,3)$, $(3,1)$ $\\Rightarrow 1$<br>$k=14$: $(1,4),(4,2)$, $(2,2)$ $\\Rightarrow 2$<br>$k=15$: $(3,3)$, $(1,3)$ $\\Rightarrow 1$<br>$k=16$: $(2,4)$, $(4,1)$ $\\Rightarrow 1$<br>$k=17$: $(4,3)$, $(3,2)$ $\\Rightarrow 1$<br>$k=18$: $(3,4)$, $(2,3)$ $\\Rightarrow 1$<br>$k=20$: $(4,4)$, $(4,2)$ $\\Rightarrow 1$<br>Total $= 1+1+2+1+2+1+1+1+1+1 = 12$", "image": null}, "videoSolution": {"videoId": "446739eff74e467ba1f5585cd6a54d42", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/koiiSHwcKOVuD.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/koiiSHwcKOVuD.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c18d8bfdbb2435639627", "type": "numerical", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $S$ be the set of the first 11 natural numbers. Then the number of elements in $A=\\{B \\subseteq S: n(B) \\geqslant 2$ and the product of all elements of $B$ is even $\\}$ is $\\_\\_\\_\\_$ .", "image": null}, "options": [], "correctValue": 1979, "solution": {"text": "The set $S = \\{1, 2, 3, ..., 11\\}$ has 11 elements.<br>We need to count subsets $B$ with $n(B) \\geq 2$ and even product.<br>A product is even iff at least one element is even.<br>Equivalently, count complements: a product is odd iff all elements are odd.<br>The odd numbers in $S$ are $\\{1, 3, 5, 7, 9, 11\\}$ (6 elements).<br>Subsets of odd numbers: $2^6 = 64$.<br>Among these, those with $n(B) \\geq 2$ are all except empty set (1) and singletons (6): $64 - 7 = 57$.<br>Total subsets with $n(B) \\geq 2$: $2^{11} - 1 - 11 = 2036$.<br>Subsets with even product and $n(B) \\geq 2$: $2036 - 57 = 1979$.", "image": null}, "videoSolution": {"videoId": "6302f4ed1f694831965c2caa0f6f0154", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Adsgvw9D0VseB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Adsgvw9D0VseB.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c18b8bfdbb2435639614", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The number of elements in the relation $\\mathrm{R}=\\left\\{(x, y): 4 x^{2}+y^{2}<52, x, y \\in \\mathbf{Z}\\right\\}$ is", "image": null}, "options": [{"id": "isvND", "text": "77", "isCorrect": true, "image": null}, {"id": "F5Bys", "text": "67", "isCorrect": false, "image": null}, {"id": "Pm4nr", "text": "86", "isCorrect": false, "image": null}, {"id": "bMqU3", "text": "89", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We need $4x^2 + y^2 < 52$ with $x, y \\in \\mathbb{Z}$. This requires $x^2 < 13$, so $x \\in \\{-3,-2,-1,0,1,2,3\\}$.<br>$x=0$: $y^2<52 \\Rightarrow y \\in \\{-7,...,7\\}$ → 15 values<br>$x=\\pm1$: $y^2<48 \\Rightarrow |y|\\leq 6$ → 13 each → 26 values<br>$x=\\pm2$: $y^2<36 \\Rightarrow |y|\\leq 5$ → 11 each → 22 values<br>$x=\\pm3$: $y^2<16 \\Rightarrow |y|\\leq 3$ → 7 each → 14 values<br>Total $= 15+26+22+14 = 77$", "image": null}, "videoSolution": {"videoId": "18a6e5ec7baf483d97310a7f200bd924", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/qXPDnIDV7POtT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/qXPDnIDV7POtT.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1798bfdbb2435639545", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The number of relations, defined on the set $\\{\\mathrm{a}, \\mathrm{b}, \\mathrm{c}, \\mathrm{d}\\}$, which are both reflexive and symmetric, is equal to:", "image": null}, "options": [{"id": "M6oZp", "text": "16", "isCorrect": false, "image": null}, {"id": "H92n3", "text": "1024", "isCorrect": false, "image": null}, {"id": "hPyyJ", "text": "64", "isCorrect": true, "image": null}, {"id": "wSCnt", "text": "256", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a set with $n = 4$ elements, reflexive condition requires all diagonal pairs $(a,a), (b,b), (c,c), (d,d)$ to be included.<br>For symmetric relations, non-diagonal pairs come in symmetric pairs. Number of such pairs = $\\binom{4}{2} = 6$.<br>For each pair, we either include both elements or exclude both → 2 choices each.<br>Total reflexive and symmetric relations = $2^6 = 64$.", "image": null}, "videoSolution": {"videoId": "21ac6c03a81f4a7d84e0260480ac0c15", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/AlWAdc7deS2HY.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/AlWAdc7deS2HY.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c917c09d044e4c1a2ac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T14:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 2)", "title": "JEE Main 2025 (2 Apr Shift 2)"}], "question": {"text": "Let $\\mathrm{A}=\\{1,2,3, \\ldots, 10\\}$ and R be a relation on A such that $\\mathrm{R}=\\{(\\mathrm{a}, \\mathrm{b}): \\mathrm{a}=2 \\mathrm{~b}+1\\}$. Let $\\left(\\mathrm{a}_1, \\mathrm{a}_2\\right)$, $\\left(a_2, a_3\\right),\\left(a_3, a_4\\right), \\ldots .,\\left(a_k, a_{k+1}\\right)$ be a sequence of $k$ elements of R such that the second entry of an ordered pair is equal to the first entry of the next ordered pair. Then the largest integer k , for which such a sequence exists, is equal to :", "image": null}, "options": [{"id": "TLlyb", "text": "$6$", "image": null, "isCorrect": false}, {"id": "vXeTC", "text": "$7$", "image": null, "isCorrect": false}, {"id": "NkOFE", "text": "$5$", "image": null, "isCorrect": true}, {"id": "u5V3g", "text": "$8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}<br/>& \\mathrm{a}=2 \\mathrm{~b}+1 \\\\\n& 2 \\mathrm{~b}=\\mathrm{a}-1 \\\\\n& \\mathrm{R}=\\{(3,1),(5,2), \\ldots,(99,49)\\}<br/>\\end{aligned}$<br/>Let $(2 m+1, m),(2 \\lambda-1, \\lambda)$ are such ordered pairs.<br/>According to the condition<br/>$\\mathrm{m}=2 \\lambda-1 \\Rightarrow \\mathrm{~m}=\\text { odd number }$<br/>$\\Rightarrow 1^{\\text {st }}$ element of ordered pair $(\\mathrm{a}, \\mathrm{b})$<br/>$a=2(2 \\lambda-1)+1=4 \\lambda-1$<br/>Hence $a \\in\\{3,7, \\ldots, 99\\}$<br/>$\\Rightarrow \\lambda \\in\\{1,2, \\ldots, 25\\}$<br/>$\\Rightarrow$ set of sequence<br/>$\\begin{aligned} & \\left\\{(4 \\lambda-1,2 \\lambda-1),(2 \\lambda-1, \\lambda-1),\\left(\\lambda-1, \\frac{\\lambda-2}{2}\\right), \\ldots \\ldots .\\right\\} \\\\ & 2^{\\text {nd }} \\text { element of each ordered pair }=\\frac{\\lambda-2^{\\mathrm{r}-2}}{2^{\\mathrm{r}-2}}\\end{aligned}$<br/>For maximum number of ordered pairs in such sequence<br/>$\\begin{aligned} & \\frac{\\lambda-2^{\\mathrm{r}-2}}{2^{\\mathrm{r}-2}}=1 \\text { or } 2 ; 1 \\leq \\lambda \\leq 25 \\\\ & \\lambda=2^{\\mathrm{r}-1} \\text { or } \\lambda=3.2^{\\mathrm{r}-2}\\end{aligned}$<br/>$\\begin{aligned} & \\text { Case-I : } \\lambda=2 \\mathrm{r}-1 \\\\ & \\lambda=2,2^2, 2^3, 2^4 \\\\ & r=2,3,4,5\\end{aligned}$<br/>Hence maximum value of $r$ is 5 when $\\lambda=16$<br/>$\\begin{aligned} & \\text { Case-II }: \\lambda=3.2^{\\mathrm{r}-2} \\\\ & \\lambda=3,6,12,24 \\\\ & \\mathrm{r}=2, \\quad 3, \\quad 4,5\\end{aligned}$<br/>Hence maximum value of $r$ is 5 when $\\lambda=24$", "image": null}, "videoSolution": {"videoId": "574ba1294a9e4e2582f42f4f93522b8d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/eAAbql6YKUB1O.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/eAAbql6YKUB1O.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T14:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 2)", "title": "JEE Main 2025 (2 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eed5c8b73881fdaea345", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}], "question": {"text": "Let $S=\\mathbf{N} \\cup\\{0\\}$. Define a relation $R$ from $S$ to $\\mathbf{R}$ by :\n$\\mathrm{R}=\\left\\{(x, y): \\log _{\\mathrm{e}} y=x \\log _{\\mathrm{e}}\\left(\\frac{2}{5}\\right), x \\in \\mathrm{~S}, y \\in \\mathbf{R}\\right\\}$\n\nThen, the sum of all the elements in the range of $R$ is equal to :", "image": null}, "options": [{"id": "HNlYq", "text": "$\\frac{10}{9}$", "image": null, "isCorrect": false}, {"id": "4J7HU", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "zbton", "text": "$\\frac{5}{2}$", "image": null, "isCorrect": false}, {"id": "GGhLA", "text": "$\\frac{5}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & S=\\{0,1,2,3 \\ldots \\ldots\\} \\\\ & \\log _y y=\\log _e\\left(\\frac{2}{5}\\right) \\\\ & \\Rightarrow y=\\left(\\frac{2}{5}\\right)^x\\end{aligned}$\n\n\n\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/D9WPjjdEUit2TlHrZMTdWmtVlQMoEftGDBl2beTaqhA.original.fullsize.png\"><br>\n\n\n\n\nRequired\n$\\text { Sum }=1+\\left(\\frac{2}{5}\\right)^1+\\left(\\frac{2}{5}\\right)^2+\\left(\\frac{2}{5}\\right)^3+\\ldots . .-=\\frac{1}{1-\\frac{2}{5}}=\\frac{5}{3}$", "image": null}, "videoSolution": {"videoId": "4b10dc5da9af4fdd80d842897bc901c2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/BHtQ8ViMf3h1D.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/BHtQ8ViMf3h1D.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eeb0c8b73881fdaea209", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d9760d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 2)", "title": "JEE Main 2025 (24 Jan Shift 2)"}], "question": {"text": "Let $\\mathrm{A}=\\left\\{x \\in(0, \\pi)-\\left\\{\\frac{\\pi}{2}\\right\\}: \\log _{(2 / \\pi)}|\\sin x|+\\log _{(2 / \\pi)}|\\cos x|=2\\right\\}$ and $\\mathrm{B}=\\{x \\geqslant 0: \\sqrt{x}(\\sqrt{x}-4)-3|\\sqrt{x}-2|+6=0\\}$. Then $\\mathrm{n}(\\mathrm{A} \\cup \\mathrm{B})$ is equal to :", "image": null}, "options": [{"id": "CbsjQ", "text": "4", "image": null, "isCorrect": false}, {"id": "PtGgX", "text": "8", "image": null, "isCorrect": true}, {"id": "aCqAk", "text": "6", "image": null, "isCorrect": false}, {"id": "j0Nqt", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{A}: \\log _{2 \\pi}|\\sin \\mathrm{x}|+\\log _{2 \\pi}|\\cos \\mathrm{x}|=2 \\\\ & \\Rightarrow \\log _{2 \\pi}(|\\sin \\mathrm{x} \\cdot \\cos \\mathrm{x}|)=2 \\\\ & \\Rightarrow|\\sin 2 \\mathrm{x}|=\\frac{8}{\\pi^2}\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3J_p-bEoEqcOHsgjHK5HIH8hDJrfGq7KKNL-R-DPlL0.original.fullsize.png\"><br>\n\n\n\nNumber of solution 4\n$\\text { B : let } \\sqrt{\\mathrm{x}}=\\mathrm{t} < 2$\n\nThen $\\sqrt{x}(\\sqrt{x}-4)+3(\\sqrt{x}-2)+6=0$\n$\\begin{aligned}\n& \\Rightarrow \\mathrm{t}^2-4 \\mathrm{t}+3 \\mathrm{t}-6+6=0 \\\\\n& \\Rightarrow \\mathrm{t}^2-\\mathrm{t}=0, \\mathrm{t}=0, \\mathrm{t}=1 \\\\\n& \\mathrm{x}=0, \\mathrm{x}=1\n\\end{aligned}$\nagain let $\\sqrt{\\mathrm{x}}=\\mathrm{t}>2$\nthen $\\mathrm{t}^2-4 \\mathrm{t}-3 \\mathrm{t}+6+6=0$\n$\\begin{aligned}\n& \\Rightarrow \\mathrm{t}^2-7 \\mathrm{t}+12=0 \\\\\n& \\Rightarrow \\mathrm{t}=3,4 \\\\\n& \\mathrm{x}=9,16\n\\end{aligned}$\n\nTotal number of solutions\n$\\mathrm{n}(\\mathrm{~A} \\cup \\mathrm{~B})=4+4=8$", "image": null}, "videoSolution": {"videoId": "fb3c72a506864c43af253c3a075acda8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/VFaWKDN59ighU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/VFaWKDN59ighU.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d9760d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 2)", "title": "JEE Main 2025 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eea9c8b73881fdaea1d0", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760c", "examId": "615d76b2c52ffa >1</mn></msub></math> and the number of elements in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>. Then the minimum value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> is _______.", "image": null}, "options": [], "correctValue": "66", "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>=</mo><mn>3</mn><mi>y</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>x</mi><mn>3</mn></mfrac><mo>=</mo><mfrac><mi>y</mi><mn>2</mn></mfrac></math></p><p>Now, let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mn>3</mn></mfrac><mo>=</mo><mfrac><mi>y</mi><mn>2</mn></mfrac><mo>=</mo><mi>k</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mn>3</mn><mi>k</mi><mo> </mo><mo>&amp;</mo><mo> </mo><mi>y</mi><mo>=</mo><mn>2</mn><mi>k</mi></math></p><p>Now, given set <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mo> </mo><mn>2</mn><mo>,</mo><mo> </mo><mn>3</mn><mo>,</mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>,</mo><mn>100</mn></mrow></mfenced></math></p><p>So, for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>≤</mo><mn>33</mn></math> we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>R</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>3</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>6</mn><mo>,</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>9</mn><mo>,</mo><mn>6</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>12</mn><mo>,</mo><mn>8</mn></mrow></mfenced><mo>,</mo><mo>.</mo><mo>...</mo><mfenced><mrow><mn>99</mn><mo>,</mo><mn>66</mn></mrow></mfenced></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>n</mi><mfenced><mi>R</mi></mfenced><mo>=</mo><mn>33</mn></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math> is symmetric relation on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>⊂</mo><msub><mi>R</mi><mn>1</mn></msub></math> so, we need elements <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>3</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>6</mn><mo>,</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>9</mn><mo>,</mo><mn>6</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>12</mn><mo>,</mo><mn>8</mn></mrow></mfenced><mo>,</mo><mo>.</mo><mo>...</mo><mfenced><mrow><mn>99</mn><mo>,</mo><mn>66</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>6</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>6</mn><mo>,</mo><mn>9</mn></mrow></mfenced><mo>,</mo><mo> </mo><mfenced><mrow><mn>8</mn><mo>,</mo><mn>12</mn></mrow></mfenced><mo>,</mo><mo>.</mo><mo>...</mo><mfenced><mrow><mn>66</mn><mo>,</mo><mn>99</mn></mrow></mfenced></mrow></mfenced></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math></p><p>Hence, the minimum number of elements in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>33</mn><mo>+</mo><mn>33</mn><mo>=</mo><mn>66</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", " 6</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1024</mn><mo>-</mo><mn>64</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>960</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d68759", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>4</mn></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> be a relation on the set <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#215;</mo><mi>A</mi></math>&nbsp;defined by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mo>&#160;</mo><mi>b</mi></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mi>c</mi><mo>,</mo><mo>&#160;</mo><mi>d</mi></mrow></mfenced></mrow></mfenced><mo>:</mo><mn>2</mn><mi>a</mi><mo>+</mo><mn>3</mn><mi>b</mi><mo>=</mo><mn>4</mn><mi>c</mi><mo>+</mo><mn>5</mn><mi>d</mi></mrow></mfenced></math>. Then the number of elements in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is _________.", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<blockquote><p>Given,</p><p>Set&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math></p><p>And relation on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#215;</mo><mi>A</mi></math>&nbsp;as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi><mo>+</mo><mn>3</mn><mi>b</mi><mo>=</mo><mn>4</mn><mi>c</mi><mo>+</mo><mn>5</mn><mi>d</mi></math></p><p>Now, Maximum value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi><mo>+</mo><mn>3</mn><mi>b</mi><mo>=</mo><mn>20</mn></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>4</mn><mo>,</mo><mo>&#160;</mo><mn>4</mn></mrow></mfenced></math></p><p>And Minimum value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>c</mi><mo>+</mo><mn>5</mn><mi>d</mi><mo>=</mo><mn>9</mn></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>c</mi><mo>+</mo><mn>5</mn><mi>d</mi></math>&nbsp;can be equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>,</mo><mo>&#160;</mo><mn>13</mn><mo>,</mo><mo>&#160;</mo><mn>14</mn><mo>,</mo><mo>&#160;</mo><mn>17</mn><mo>,</mo><mo>&#160;</mo><mn>18</mn><mo>,</mo><mo>&#160;</mo><mn>19</mn></math></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi><mo>+</mo><mn>3</mn><mi>b< mo>;</mo><mi>C</mi><mo>&#8745;</mo><mi>B</mi><mo>&#8800;</mo><mi>&#981;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math>&nbsp;Total<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfenced><mrow><mi>C</mi><mo>&#8745;</mo><mi>B</mi><mo>=</mo><mi>&#981;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>128</mn><mo>-</mo><msup><mn>2</mn><mn>4</mn></msup><mo>=</mo><mn>128</mn><mo>-</mo><mn>16</mn><mo>=</mo><mn>112</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "c70db393dd244004b62a449928df511b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xWcbqr0Uk8QEG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xWcbqr0Uk8QEG.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67891", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced open=\"{\" close=\"}\"><mrow><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>5</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>7</mn></mrow></mfenced></math>. Define <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo></math>{<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>&#8838;</mo><mi>A</mi></math>: either <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#8713;</mo><mi>T</mi></math>&nbsp;or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#8712;</mo><mi>T</mi></math>}&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo></math>{<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>&#8838;</mo><mi>A</mi><mo>:</mo><mi>T</mi></math>&nbsp;the sum of all the elements of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is a prime number.} Then the number of elements in the set <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&#8746;</mo><mi>C</mi></math>&nbsp;is _______.", "image": null}, "options": [], "correctValue": "107", "solution": {"text": "<blockquote><p>We know that,</p><p>By demorgan&#39;s law&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>B</mi><mo>&#8746;</mo><mi>C</mi></mrow></mfenced><mo>&#39;</mo></msup><mo>=</mo><msup><mi>B</mi><mo>&#39;</mo></msup><mo>&#8745;</mo><msup><mi>C</mi><mo>&#39;</mo></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>B</mi><mo>&#39;</mo></msup></math>&nbsp;is a set containing sub sets of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;containing element&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>&nbsp;and not containing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>.</p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>C</mi><mo>&#39;</mo></msup></math>&nbsp;is a set containing subsets of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;whose sum of elements is not prime.</p> mo><mi mathvariant=\"normal\">B</mi></mrow></mfenced><mo>=</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced><mo>+</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi></mrow></mfenced><mo>-</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi><mo>&#8745;</mo><mi mathvariant=\"normal\">B</mi></mrow></mfenced></math><br /><math><mo>=</mo><mn>25</mn><mo>+</mo><mn>7</mn><mo>-</mo><mn>3</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>29</mn></math>.</p>", "image": null}, "videoSolution": {"videoId": "d958d063b686442ba12007923c1d9089", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/tcEu4bBts1w1m.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/tcEu4bBts1w1m.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-07T14:00:00.000Z", "isVisible": true, "shortName": "2020 (07 Jan Shift 2)", "title": "JEE Main 2020 (07 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d6694d", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7ef", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 2)", "title": "JEE Main 2019 (12 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let <math><mi>Z</mi></math> be the set of integers. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced open=\"{\" close=\"}\" separators=\"|\"><mrow <mo>&#8756;</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>=</mo><mn>3</mn></math></p><p>Again, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>3</mn><mo>&#60;</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>1</mn><mo>&#60;</mo><mn>9</mn><mo>&#8658;</mo><mo>-</mo><mn>1</mn><mo>&#60;</mo><mi>x</mi><mo>&#60;</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>0</mn><mo>,</mo><mi>&#160;</mi><mn>1</mn><mo>,</mo><mi>&#160;</mi><mn>2</mn><mo>,</mo><mi>&#160;</mi><mn>3</mn><mo>,</mo><mi>&#160;</mi><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>n</mi><mfenced separators=\"|\"><mi>B</mi></mfenced><mo>=</mo><mn>5</mn></math></p><p><math><mo>&#8756;</mo><mi>n</mi><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>&#215;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mn>3</mn><mo>&#215;</mo><mn>5</mn><mo>=</mo><mn>15</mn></math></p><p><math><mo>&#8756;</mo></math>Number of subset of <math><mi>A</mi><mo>&#215;</mo><mi>B</mi><mo>=</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>15</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7ef", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 2)", "title": "JEE Main 2019 (12 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e5b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "A relation on the set $\\mathrm{A}=\\{\\mathrm{x}:|\\mathrm{x}| < 3, \\mathrm{x} \\in \\mathrm{Z}\\}$, where $Z$ is the set of integers is defined by $\\mathrm{R}=\\{(\\mathrm{x}, \\mathrm{y}): \\mathrm{y}=|\\mathrm{x}|, \\mathrm{x} \\neq-1\\}$. Then the number of elements in the power set of $R$ is:", "image": null}, "options": [{"id": "etZuQ", "text": "\n32\n", "image": null, "isCorrect": false}, {"id": "rIPwE", "text": "\n16\n", "image": null, "isCorrect": true}, {"id": "iwlBC", "text": "\n8\n", "image": null, "isCorrect": false}, {"id": "tZebd", "text": "\n64", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n&\\mathrm{A}=\\{x:|x| < 3, x \\in Z\\} \\\\\n&\\mathrm{A}=\\{-2,-1,0,1,2\\} \\\\\n&\\mathrm{R}=\\{(x, y): y=|x|, x \\neq-1\\} \\\\\n&\\mathrm{R}=\\{(-2,2),(0,0),(1,1),(2,2)\\}\n\\end{aligned}\n$$\n$\\mathrm{R}$ has four elements\nNumber of elements in the power set of $\\mathrm{R}$\n$$\n=2^4=16\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65ba2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;be two sets containing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>&nbsp;elements and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;elements respectively. The number of subsets of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#215;</mo><mi>B</mi></math> having&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>&nbsp;or more elements is :", "image": null}, "options": [{"id": "9sr62", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>219</mn></math>", "image": null, "isCorrect": true}, {"id": "uctyF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>211</mn></math>", "image": null, "isCorrect": false}, {"id": "ye1Ox", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>256</mn></math>", "image": null, "isCorrect": false}, {"id": "Nt8qb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>220</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mi>A</mi></mfenced><mo>=</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mi>B</mi></mfenced><mo>=</mo><mn>4</mn></math><br /><br />Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mfenced><mrow><mi>A</mi><mo>&#215;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mn>8</mn></math><br /><br />Now subsets of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#215;</mo><mi>B</mi></math> containing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>&nbsp;or more elements will be<br />=Total <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo></math>&nbsp;(no element&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo></math>&nbsp;one element&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn></math>&nbsp;elements)<br /><br />=<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>8</mn></msup><msup><mo>-</mo><mn>8</mn></msup><msub><mi>C</mi><mn>0</mn></msub><msup><mo>-</mo><mn>8</mn></msup><msub><mi>C</mi><mn>1</mn></msub><msup><mo>-</mo><mn>8</mn></msup><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mn>1</mn><mn>9</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a3c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "If $A=\\left\\{x \\in z^{+}: x < 10\\right.$ and $x$ is a multiple of 3 or $4\\}$, where $z^{+}$is the set of positive integers, then the total number of symmetric relations on $A$ is", "image": null}, "options": [{"id": "8eIoG", "text": "\n$2^5$\n", "image": null, "isCorrect": false}, {"id": "Zk6mG", "text": "\n$2^{15}$\n", "image": null, "isCorrect": true}, {"id": "qkhab", "text": "\n$2^{10}$\n", "image": null, "isCorrect": false}, {"id": "MnvUn", "text": "\n$2^{20}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A relation on a set A is said to be symmetric iff $(a, b) \\in A \\Rightarrow(b, a) \\in A, \\forall a, b \\in A$\nHere $A=\\{3,4,6,8,9\\}$\nNumber of order pairs of $A \\times A=5 \\times 5=25$\nDivide 25 order pairs of $A \\times A$ in 3 parts as follows :\n$$\n\\begin{aligned}\n& \\text { Part }-A:(3,3),(4,4),(6,6),(8,8),(9,9) \\\\\n& \\text { Part }-B:(3,4),(3,6),(3,8),(3,9),(4,6), \\\\\n& (4,8),(4,9),(6,8),(6,9),(8,9) \\\\\n& \\text { Part-C:(4,3),(6,3),(8,3),(9,3),(6,4),(8,4), } \\\\\n& (9,4),(8,6),(9,6),(9,8)\n\\end{aligned}\n$$\nIn part $-A$, both components of each order pair are same.\nIn part $-B$, both components are different but not two such order pairs are present in which first component of one order pair is the second component of another order pair and vice-versa.\nIn part $-C$, only reverse of the order pairs of part $-B$ are present i.e., if $(a, b)$ is present in part $-B$, then (b, a) will be present in part $-C$ For example $(3,4)$ is present in part $-B$ and $(4,3)$ present in part $-C$.\nNumber of order pair in $A, B$ and $C$ are 5, 10 and 10 respectively.\nIn any symmetric relation on set $A$, if any order pair of part $-B$ is present then its reverse order pair of part $-C$ will must be also present.\nHence number of symmetric relation on set $A$ is equal to the number of all relations on a set $D$, which contains all the order pairs of part $-A$ and part $-B$.\nNow $n(D)=n(A)+n(B)=5+10=15$\nHence number of all relations on set $D=(2)^{15}$\n$\\Rightarrow$ Number of symmetric relations on set $D=(2)^{15}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
</body>
</html>
