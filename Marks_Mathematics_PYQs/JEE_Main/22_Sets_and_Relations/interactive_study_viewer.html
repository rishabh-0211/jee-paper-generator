"heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f91", "previousYearPapers": [{"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mi mathvariant=\"normal\">S</mi></mfenced></math> denote the power set of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mo>&#8230;</mo><mo>,</mo><mn>10</mn></mrow></mfenced></math>. Define the relations <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>&nbsp;on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mi>S</mi></mfenced></math> as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><msub><mi>R</mi><mn>1</mn></msub><mi>B</mi></math> if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><msup><mi>B</mi><mi>c</mi></msup></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><mi>B</mi><mo>&#8745;</mo><msup><mi>A</mi><mi>c</mi></msup></mrow></mfenced><mo>=</mo><mi>&#981;</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><msub><mi>R</mi><mn>2</mn></msub><mo>&#160;</mo><mi>B</mi></math> if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8746;</mo><msup><mi>B</mi><mi>c</mi></msup><mo>=</mo><mi>B</mi><mo>&#8746;</mo><msup><mi>A</mi><mi>c</mi></msup><mo>,</mo><mo>&#8704;</mo><mi>A</mi><mo>,</mo><mi>B</mi><mo>&#8712;</mo><mi>P</mi><mfenced><mi>S</mi></mfenced></math> . Then :", "image": null}, "options": [{"id": "MfpZM", "text": "both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>&nbsp;are equivalence relations", "isCorrect": true, "image": null}, {"id": "NRejk", "text": "only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math>&nbsp;is an equivalence relation", "isCorrect": false, "image": null}, {"id": "1gFeu", "text": "only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>&nbsp;is an equivalence relation", "isCorrect": false, "image": null}, {"id": "44QNH", "text": "both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>&nbsp;are not equivalence relations", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mo>&#8230;</mo><mo>&#8230;</mo><mn>10</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mi>S</mi></mfenced><mo>=</mo></math> power set of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><msub><mi>R</mi><mn>1</mn></msub><mi>B</mi><mo>&#8658;</mo><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><msup><mi>B</mi><mi>c</mi></msup></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><msup><mi>A</mi><mi>c</mi></msup><mo>&#8745;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mi>&#981;</mi></math></p><p>Now for reflexive property, replacing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><msup><mi>A</mi><mi>c</mi></msup></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><msup><mi>A</mi><mi>c</mi></msup><mo>&#8745;</mo><mi>A</mi></mrow></mfenced></math>&nbsp;which&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi></math>&nbsp;always,</p><p>Now checking symmetric we will interchange&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>B</mi></math>,</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>B</mi><mo>&#8745;</mo><msup><mi>A</mi><mi>c</mi></msup></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><msup><mi>B</mi><mi>c</mi></msup><mo>&#8745;</mo><mi>A</mi></mrow></mfenced></math>&nbsp;which is same as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><msup><mi>B</mi><mi>c</mi></msup></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><msup><mi>A</mi><mi>c</mi></msup><mo>&#8745;</mo><mi>B</mi></mrow></mfenced></math>, hence the relation is symmetric,</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math>&nbsp;is reflexive, symmetric</p><p>Now checking for transitive<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><msup><mi>B</mi><mi>c</mi></msup></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><msup><mi>A</mi><mi>c</mi></msup><mo>&#8745;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mi>&#981;</mi><mo>;</mo></math></p><p>Now from diagram the elements in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><msup><mi>B</mi><mi>c</mi></msup></mrow></mfenced><mo>&#8746;</mo><mfenced><mrow><msup><mi>A</mi><mi>c</mi></msup><mo>&#8745;</mo><mi>B</mi></mrow></mfenced></math>&nbsp;will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"{\" close=\"}\"><mi>a</mi></mfenced><mo>&#8746;</mo><mfenced open=\"{\" close=\"}\"><mi>b</mi></mfenced></math>&nbsp;which is given as empty set&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi></math></p><p>Hence, we can say that,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mi>a</mi></mfenced><mo>=</mo><mi>&#981;</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mi>b</mi></mfenced><mo>&#8658;</mo><mi>A</mi><mo>=</mo><mi>B</mi></math></p><p>Now taking,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>B</mi><mo>&#8745;</mo><msup><mi>C</mi><mi>c</mi></msup><mo>)</mo><mo>&#8746;</mo><mo>(</mo><msup><mi>B</mi><mi>c</mi></msup><mo>&#8745;</mo><mi>C</mi><mo>)</mo><mo>=</mo><mi>&#981;</mi><mo>&#8756;</mo><mi>B</mi><mo>=</mo><mi>C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>A</mi><mo>=</mo><mi>C</mi></math> equivalence.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7dda9698-159e-473c-a185-7b6eb321b64c-9896795.png\" style=\"width: 250px; height: 219px;\" /></p><p>&nbsp;</p><p>Now solving,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub><mo>&#8801;</mo><mi>A</mi><mo>&#8746;</mo><msup><mi>B</mi><mi>c</mi></msup><mo>=</mo><msup><mi>A</mi><mi>c</mi></msup><mo>&#8746;</mo><mi>B</mi></math></p><p>Now for reflexive replacing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&#8594;</mo><mi>A</mi></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8746;</mo><msup><mi>A</mi><mi>c</mi></msup><mo>=</mo><msup><mi>A</mi><mi>c</mi></msup><mo>&#8746;</mo><mi>A</mi></math>&nbsp;which is true,</p><p>And for symmetric interchanging&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8660;</mo><mi>B</mi></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&#8746;</mo><msup><mi>A</mi><mi>c</mi></msup><mo>=</mo><msup><mi>B</mi><mi>c</mi></msup><mo>&#8746;</mo><mi>A</mi></math>&nbsp;which is again true,</p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub><mo>&#8594;</mo></math> Reflexive, symmetric</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f85793dd-c45c-48ad-94cd-a80954a303c0-9896795_2.png\" style=\"width: 250px; height: 219px;\" /></p><p>Now for transitive,</p><p>From diagram the elements in<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8746;</mo><msup><mi>B</mi><mi>c</mi></msup><mo>=</mo><msup><mi>A</mi><mi>c</mi></msup><mo>&#8746;</mo><mi>B</mi><mo>&#8658;</mo><mfenced close=\"}\" open=\"{\"><mrow><mi>a</mi><mo>,</mo><mi>c</mi><mo>,</mo><mi>d</mi></mrow></mfenced><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mi>b</mi><mo>,</mo><mi>c</mi><mo>,</mo><mi>d</mi></mrow></mfenced></math></p><p>On comparing both side, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mi>a</mi></mfenced><mo>=</mo><mfenced close=\"}\" open=\"{\"><mi>b</mi></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#8756;</mo><mo>&#160;</mo><mi>A</mi><mo>=</mo><mi>B</mi></math></p><p>And,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&#8746;</mo><msup><mi>C</mi><mi>c</mi></msup><mo>=</mo><msup><mi>B</mi><mi>c</mi></msup><mo>&#8746;</mo><mi>C</mi><mo>&#8658;</mo><mi>B</mi><mo>=</mo><mi>C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>A</mi><mo>=</mo><mi>C</mi><mo>&#160;&#160;</mo><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>A</mi><mo>&#8746;</mo><msup><mi>C</mi><mi>c</mi></msup><mo>=</mo><msup><mi>A</mi><mi>c</mi></msup><mo>&#8746;</mo><mi>C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo></math> Equivalence</p><p>Hence, both given relation are equivalence.</p>", "image": null}, "videoSolution": {"videoId": "a970e349f5f341619017ee836028bf44", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/4tJeboazngzlk.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/4tJeboazngzlk.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f3d", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> be a relation on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#8477;</mi></math>, given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mo>{</mo><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>:</mo><mn>3</mn><mi>a</mi><mo>-</mo><mn>3</mn><mi>b</mi><mo>+</mo><msqrt><mn>7</mn></msqrt></math> is an irrational number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>}</mo></math>. Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is", "image": null}, "options": [{"id": "X23ug", "text": "Reflexive but neither symmetric nor transitive", "isCorrect": true, "image": null}, {"id": "tUk3R", "text": "Reflexive and transitive but not symmetric", "isCorrect": false, "image": null}, {"id": "20nLg", "text": "Reflexive and symmetric but not transitive", "isCorrect": false, "image": null}, {"id": "nT2kp", "text": "An equivalence relation", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>:</mo><mn>3</mn><mi>a</mi><mo>-</mo><mn>3</mn><mi>b</mi><mo>+</mo><msqrt><mn>7</mn></msqrt><mo>&#160;</mo><mi>is</mi><mo>&#160;</mo><mi>irrational</mi></mrow></mfenced></math></p><p><strong>Reflexive:</strong></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>a</mi><mo>-</mo><mn>3</mn><mi>a</mi><mo>+</mo><msqrt><mn>7</mn></msqrt><mo>=</mo><msqrt><mn>7</mn></msqrt></math>&nbsp;is irrational.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>a</mi></mrow></mfenced><mo>&#8712;</mo><mi>R</mi></math>, hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is reflexive.</p><p>Given:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>:</mo><mn>3</mn><mi>a</mi><mo>-</mo><mn>3</mn><mi>b</mi><mo>+</mo><msqrt><mn>7</mn></msqrt><mo>&#160;</mo><mi>is</mi><mo>&#160;</mo><mi>irrational</mi></mrow></mfenced></math></p><p><strong>Symmetric:</strong></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>&#8712;</mo><mi>R</mi></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>a</mi><mo>-</mo><mn>3</mn><mi>b</mi><mo>+</mo><msqrt><mn>7</mn></msqrt></math>&nbsp;is irrational.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>b</mi><mo>-</mo><mn>3</mn><mi>a</mi><mo>+</mo><msqrt><mn>7</mn></msqrt></math>&nbsp;is not necessarily irrational, since if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>a</mi><mo>=</mo><msqrt><mn>7</mn></msqrt></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>b</mi><mo>&#8712;</mo><mi>Z</mi></math>, then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>a</mi><mo>-</mo><mn>3</mn><mi>b</mi><mo>+</mo><msqrt><mn>7</mn></msqrt></math>&nbsp;is irrational., but&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>b</mi><mo>-</mo><mn>3</mn><mi>a</mi><mo>+</mo><msqrt><mn>7</mn></msqrt></math>&nbsp;is not irrational.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>&#8712;</mo><mi>R</mi><menclose notation=\"updiagonalstrike\"><mo>&#8658;</mo></menclose><mfenced><mrow><mi>b</mi><mo>,</mo><mi>a</mi></mrow></mfenced><mo>&#8712;</mo><mi>R</mi></math>, hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is&nbsp;not symmetric</p><p><strong>Transitive:</strong></p><p>Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced></math> as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><msqrt><mn>7</mn></msqrt><mn>3</mn></mfrac><mo>,</mo><mn>1</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>b</mi><mo>,</mo><mi>c</mi></mrow></mfenced></math> as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mfrac><mrow><mn>2</mn><msqrt><mn>7</mn></msqrt></mrow><mn>3</mn></mfrac></mrow></mfenced></math></p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>&#8712;</mo><mi>R</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>b</mi><mo>,</mo><mi>c</mi></mrow></mfenced><mo>&#8712;</mo><mi>R</mi></math> but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mo>,</mo><mi>c</mi></mrow></mfenced><mo>&#8713;</mo><mi>R</mi></math> which means relation is not transitive.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d6830b", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Among the relations<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>:</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo>&#8712;</mo><mi>R</mi><mo>-</mo><mfenced close=\"}\" open=\"{\"><mn>0</mn></mfenced><mo>,</mo><mn>2</mn><mo>+</mo><mfrac><mi>a</mi><mi>b</mi></mfrac><mo>&#62;</mo><mn>0</mn></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>:</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo>&#8712;</mo><mi>R</mi><mo>,</mo><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup><mo>&#8712;</mo><mi>Z</mi></mrow></mfenced></math>,", "image": null}, "options": [{"id": "N0KYz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is transitive but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is not", "isCorrect": false, "image": null}, {"id": "TvEPw", "text": "both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> are symmetric", "isCorrect": false, "image": null}, {"id": "yQzsA", "text": "neither <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> not <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is transitive", "isCorrect": false, "image": null}, {"id": "v7Ni1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is symmetric but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is not", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>,</mo><mo>&#160;</mo><mi>b</mi><mo>&#160;</mo><mo>&#8712;</mo><mo>&#160;</mo><mi>I</mi></math>&nbsp;and relation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;is defined as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup><mo>&#8712;</mo><mi>I</mi></math></p><p>Now if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup><mo>&#8712;</mo><mi>I</mi></math>&nbsp;so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><msup><mi>a</mi><mn>2</mn></msup></math>&nbsp;will also be integer, for example if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>5</mn><mn>2</mn></msup><mo>-</mo><msup><mn>4</mn><mn>2</mn></msup><mo>=</mo><mn>9</mn></math>&nbsp;is integer then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>4</mn><mn>2</mn></msup><mo>-</mo><msup><mn>5</mn><mn>2</mn></msup><mo>=</mo><mo>-</mo><mn>9</mn></math>&nbsp;is also a integer,</p><p>Now checking transitive,</p><p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>4</mn><mn>2</mn></msup><mo>-</mo><msup><mn>3</mn><mn>2</mn></msup><mo>=</mo><mn>7</mn></math>&nbsp;is an integer,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>3</mn><mn>2</mn></msup><mo>-</mo><msup><mn>2</mn><mn>2</mn></msup><mo>=</mo><mn>5</mn></math>&nbsp;is an integer then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>4</mn><mn>2</mn></msup><mo>-</mo><msup><mn>2</mn><mn>2</mn></msup><mo>=</mo><mn>12</mn></math>&nbsp;is also an integer, hence we can say that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;is symmetric and transitive,</p><p>&nbsp;Now checking relation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;which&nbsp;is defined as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>+</mo><mfrac><mi>a</mi><mi>b</mi></mfrac><mo>&#62;</mo><mn>0</mn></math>,</p><p>So, if we replace&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><mi>b</mi></mfrac></math>&nbsp;by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>9</mn></mfrac></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>+</mo><mfrac><mi>a</mi><mi>b</mi></mfrac><mo>&#62;</mo><mn>0</mn></math>&nbsp;is true but we take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>b</mi><mi>a</mi></mfrac><mo>=</mo><mo>-</mo><mn>9</mn></math>&nbsp;for symmetric we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>+</mo><mfrac><mi>b</mi><mi>a</mi></mfrac><mo>=</mo><mn>2</mn><mo>-</mo><mn>9</mn><mo>=</mo><mo>-</mo><mn>7</mn><mo>&#8815;</mo><mn>0</mn></math>&nbsp;hence, the relation is not symmetric,&nbsp;</p><p>Now checking transitive, now if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>+</mo><mfrac><mi>a</mi><mi>b</mi></mfrac><mo>&#62;</mo><mn>0</mn><mo>&#8658;</mo><mfrac><mi>a</mi><mi>b</mi></mfrac><mo>&#62;</mo><mo>-</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>b</mi><mi>c</mi></mfrac><mo>&#62;</mo><mo>-</mo><mn>2</mn></math>&nbsp;then we cannot say that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><mi>c</mi></mfrac><mo>&#62;</mo><mo>-</mo><mn>2</mn></math>,</p><p>For example if we take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>1</mn></mfrac><mo>&#62;</mo><mo>-</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>&#62;</mo><mo>-</mo><mn>2</mn></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>&#8815;</mo><mo>-</mo><mn>2</mn></math>, hence it is not transitive,</p><p>Hence, we can say that&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;is symmetric and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;is not.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d682af", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}], "type": "sin /mi><mo>+</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mfenced close=\"}\" open=\"{\"><mrow><mtext>where&#160;</mtext><mi>K</mi><mo>,</mo><mi>&#955;</mi><mo>,</mo><mi>N</mi><mo>&#8712;</mo><mi>I</mi></mrow></mfenced></math></p><p>So, when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> divided by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math>, remainder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>.</p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;to be symmetric&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>R</mi><mi>y</mi><mo>&#8658;</mo><mi>y</mi><mi>R</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mi>&#945;</mi><mi>y</mi><mo>=</mo><mn>7</mn><msub><mi>N</mi><mn>1</mn></msub><mo>,</mo><mn>3</mn><mi>y</mi><mo>+</mo><mi>&#945;</mi><mi>x</mi><mo>=</mo><mn>7</mn><msub><mi>N</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mn>3</mn><mo>+</mo><mi>&#945;</mi></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfenced><mo>=</mo><mn>7</mn><mfenced><mrow><msub><mi>N</mi><mn>1</mn></msub><mo>+</mo><msub><mi>N</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>7</mn><msub><mi>N</mi><mn>3</mn></msub></math></p><p>Which holds when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>+</mo><mi>&#945;</mi></math> is multiple of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>7</mn><mi>N</mi><mo>+</mo><mn>4</mn></math>&nbsp;(as did earlier)</p><p>Now, for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;to be transitive</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>R</mi><mi>y</mi><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>y</mi><mi>R</mi><mi>z</mi><mo>&#8658;</mo><mi>x</mi><mi>R</mi><mi>z</mi><mo>.</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mi>x</mi><mo>+</mo><mi>&#945;</mi><mi>y</mi><mo>=</mo><mn>7</mn><msub><mi>N</mi><mn>1</mn></msub><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced><mo>&#160;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mi>y</mi><mo>+</mo><mi>&#945;</mi><mi>z</mi><mo>=</mo><mn>7</mn><msub><mi>N</mi><mn>2</mn></msub><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>And&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mi>&#945;</mi><mi>z</mi><mo>=</mo><mn>7</mn><msub><mi>N</mi><mn>3</mn></msub><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>3</mn></mfenced></math></p><p>Now subtracting equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>3</mn></mfenced><mo>-</mo><mfenced><mn>2</mn></mfenced></math>&nbsp;we get,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>7</mn><msub><mi>N</mi><mn>2</mn></msub><mo>-</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>7</mn><msub><mi>N</mi><mn>3</mn></msub></math></p><p>Now putting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi></math>&nbsp;from equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced></math>&nbsp;we get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><msub><mi>N</mi><mn>1</mn></msub><mo>-</mo><mi>&#945;</mi><mi>y</mi><mo>+</mo><mn>7</mn><msub><mi>N</mi><mn>2</mn></msub><mo>-</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>7</mn><msub><mi>N</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>7</mn><mfenced><mrow><msub><mi>N</mi> mfenced></math> does not.</p>", "image": null}, "videoSolution": {"videoId": "5ddd74ec639549b4bca5daae9687d46d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/clCejAzLehKQ3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/clCejAzLehKQ3.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67076", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf813", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T14:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 2)", "title": "JEE Main 2021 (18 Mar Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Define a relation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> over a class of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#215;</mo><mi>n</mi></math> real&nbsp;matrices <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> as &quot;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>R</mi><mi>B</mi></math>&nbsp;iff there exists a&nbsp;non-singular matrix <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>A</mi><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>B</mi></math>&quot;.&nbsp;Then which of the following is true ?</p>", "image": null}, "options": [{"id": "MzjhJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is symmetric, transitive but not reflexive", "isCorrect": false, "image": null}, {"id": "kEqOh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is reflexive, symmetric but not transitive", "isCorrect": false, "image": null}, {"id": "R0HaE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is an equivalence relation", "isCorrect": true, "image": null}, {"id": "4QzlT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is reflexive, transitive but not symmetric", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> are matrices of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#215;</mo><mi>n</mi></math> order and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>R</mi><mi>B</mi></math>&nbsp;iff&nbsp;there exists a non-singular matrix <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#160;</mo><mfenced><mrow><mo>det</mo><mfenced><mi>P</mi></mfenced><mo>&#8800;</mo><mn>0</mn></mrow></mfenced></math> such that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>A</mi><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>B</mi></math>.</p><p>Reflexivity Check :</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>R</mi><mi>A</mi><mo>&#8658;</mo><mi>P</mi><mi>A</mi><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>A</mi></math>&nbsp;which is true&nbsp;for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mi>I</mi></math>.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is reflexive relation.</p><p>Symmetric&nbsp;Check :</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>R</mi><mi>B</mi><mo>&#8658;</mo><mi>P</mi><mi>A</mi><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>B</mi><mo>&#8658;</mo><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>P</mi><mi>A</mi><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>P</mi><mo>=</mo><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>B</mi><mi>P</mi><mo>&#8658;</mo><mi>I</mi><mi>A</mi><mi>I</mi><mo>=</mo><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>B</mi><mi>P</mi><mo>&#8658;</mo><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>B</mi><mi>P</mi><mo>=</mo><mi>A</mi><mo>&#8658;</mo><mi>B</mi><mi>R</mi><mi>A</mi></math>&nbsp;for matrix&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is symmetric relation.</p><p>Transitivity Check :</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>R</mi><mi>B</mi><mo>&#8658;</mo><mi>P</mi><mi>A</mi><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>B</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>R</mi><mi>C</mi><mo>&#8658;</mo><mi>P</mi><mi>B</mi><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>C</mi></math>.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>P</mi><mi>A</mi><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>P</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>C</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>P</mi><mn>2</mn></msup><mi>A</mi><msup><mfenced><msup><mi>P</mi><mn>2</mn></msup></mfenced><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>C</mi><mo>&#8658;</mo><mi>A</mi><mi>R</mi><mi>C</mi></math></p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is&nbsp;a transitive relation.</p><p>Since,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is reflexive, symmetric and transitive all.</p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is&nbsp;an equivalence relation.</p>", "image": null}, "videoSolution": {"videoId": "73a308ba2b7c46a8ac8d379672b515f3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/q3XGIk4GSrgrV.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/q3XGIk4GSrgrV.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf813", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T14:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 2)", "title": "JEE Main 2021 (18 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d674a1", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Feb Shift 1)", "title": "JEE Main 2021 (26 Feb Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mo>{</mo><mfenced><mrow><mi>P</mi><mo>,</mo><mi>Q</mi></mrow></mfenced><mo>|</mo><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> are at the same distance from the origin<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>
