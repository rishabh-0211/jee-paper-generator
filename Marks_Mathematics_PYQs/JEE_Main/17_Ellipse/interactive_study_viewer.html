  <script>
    const data = {"index": 17, "chapterId": "6160253f32f74d11258840f1", "chapter": "Ellipse", "exam": "JEE Main", "subject": "Mathematics", "totalTopics": 14, "totalQuestions": 129, "downloadTime": "2026-10-08 21:01:09", "topics": [{"index": 1, "topicId": "648b5a73417cc3fb48d693a1", "title": "General Equation of 2nd degree curve", "totalQuestions": 5, "questions": [{"_id": "69d8072b81239f6567c4f29c", "type": "numerical", "question": {"text": "Let A be the point $(3, 0)$ and circles with variable diameter AB touch the circle $x^2 + y^2 = 36$ internally. Let the curve C be the locus of the point B. If the eccentricity of C is $e$, then $72e^2$ is equal to _______.", "image": null}, "options": [], "correctValue": "18", "solution": {"text": "Let the coordinates of point B be $(h, k)$.<br><br>The center of the circle with diameter AB is $C_1 \\left( \\dfrac{h+3}{2}, \\dfrac{k}{2} \\right)$ and its radius is $r_1 = \\dfrac{1}{2} \\sqrt{(h-3)^2 + k^2}$.<br><br>The given circle is $x^2 + y^2 = 36$, which has center $C_2(0, 0)$ and radius $r_2 = 6$.<br><br>Since the circles touch internally, the distance between their centers is equal to the difference of their radii:<br><br>$C_1C_2 = r_2 - r_1$<br><br>$\\sqrt{\\left(\\dfrac{h+3}{2}\\right)^2 + \\left(\\dfrac{k}{2}\\right)^2} = 6 - \\dfrac{1}{2} \\sqrt{(h-3)^2 + k^2}$<br><br>Multiplying the entire equation by 2, we get:<br><br>$\\sqrt{(h+3)^2 + k^2} + \\sqrt{(h-3)^2 + k^2} = 12$<br><br>This equation represents the locus of a point $B(h, k)$ such that the sum of its distances from two fixed points $S_1(-3, 0)$ and $S_2(3, 0)$ is constant and equal to $12$. This is the standard definition of an ellipse.<br><br>Thus, the foci of the ellipse are $(\\pm 3, 0)$ and the length of the major axis is $2a = 12$.<br><br>The distance between the foci is $2ae = 6$.<br><br>Substituting $2a = 12$, we get $12e = 6 \\Rightarrow e = \\dfrac{1}{2}$.<br><br>We need to find the value of $72e^2$:<br><br>$72e^2 = 72 \\left(\\dfrac{1}{2}\\right)^2 = 72 \\times \\dfrac{1}{4} = 18$<br><br>Answer: $18$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "5112351d4490470f8de38709b7f14777", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/WP393zQFN77MT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/WP393zQFN77MT.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c59", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "Let the equations of two ellipses be\n$$\nE_1: \\frac{x^2}{3}+\\frac{y^2}{2}=1 \\text { and } E_2: \\frac{x^2}{16}+\\frac{y^2}{b^2}=1 \\text {, }\n$$\nIf the product of their eccentricities is $\\frac{1}{2}$, then the length of the minor axis of ellipse $E_2$ is :", "image": null}, "options": [{"id": "IsjOC", "text": "\n8\n", "image": null, "isCorrect": false}, {"id": "j3qi4", "text": "\n9\n", "image": null, "isCorrect": false}, {"id": "6pGyf", "text": "\n4\n", "image": null, "isCorrect": true}, {"id": "qftij", "text": "\n2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equations of ellipses\n$$\n\\begin{aligned}\n& \\mathrm{E}_1: \\frac{x^2}{3}+\\frac{y^2}{2}=1 \\\\\n& \\Rightarrow e_1=\\sqrt{1-\\frac{2}{3}}=\\frac{1}{\\sqrt{3}} \\\\\n& \\text { and } \\mathrm{E}_2: \\frac{x^2}{16}+\\frac{y^2}{b^2}=1 \\\\\n& \\Rightarrow e_2=\\sqrt{\\frac{1-b^2}{16}}=\\sqrt{\\frac{16-b^2}{4}} \\\\\n& \\text { Also, given } e_1 \\times e_2=\\frac{1}{2} \\\\\n& \\Rightarrow \\frac{1}{\\sqrt{3}} \\times \\sqrt{\\frac{16-b^2}{4}}=\\frac{1}{2} \\Rightarrow 16-b^2=12 \\\\\n& \\Rightarrow b^2=4 \\\\\n& \\therefore \\text { Length of minor axis of } \\\\\n& \\mathrm{E}_2=2 b=2 \\times 2=4\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65bf6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "If $a$ and $c$ are positive real numbers and the ellipse $\\frac{x^2}{4 c^2}+\\frac{y^2}{c^2}=1$ has four distinct points ir common with the circle $x^2+y^2=9 a^2$, then", "image": null}, "options": [{"id": "eX2cA", "text": "\n$9 a c-9 a^2-2 c^2 < 0$", "image": null, "isCorrect": false}, {"id": "qXp7Q", "text": "\n$6 a c+9 a^2-2 c^2 < 0$", "image": null, "isCorrect": false}, {"id": "FLHb2", "text": "\n$9 a c-9 a^2-2 c^2>0$\n", "image": null, "isCorrect": true}, {"id": "3zO7M", "text": "\n$6 a c+9 a^2-2 c^2>0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Radius $=3 a$\nLength of major axis $=4 c$\nNow, (Radius $) < $ (Half of the length of major axis)\n$$\n\\begin{aligned}\n& 3 a < 2 c \\\\\n& 9 a^2 < 4 c^2 \\\\\n& 9 a c-9 a^2>9 a c-4 c^2\n\\end{aligned}\n$$<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/xQbpNBJ_bhsM-pFAeuKc9P2DiJPOeYBzDnhNZmv5ZHM.original.fullsize.png\"><br>\n$9 a c-9 a^2-2 c^2>9 a c-6 c^2$\nAgain $3 a < 2 c$\n$\\Rightarrow 9 a c < 6 c^2$\n$\\Rightarrow 9 a c-6 c^2 < 0$\nFrom (i) and (ii),\n$9 a c-9 a^2-2 c^2>0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6597e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "Equation of the ellipse whose axes are the axes of coordinates and which passes through the point $(-3,1)$ and has eccentricity $\\sqrt{\\frac{2}{5}}$ is", "image": null}, "options": [{"id": "tpxkb", "text": "\n$5 x^2+3 y^2-48=0$\n", "image": null, "isCorrect": false}, {"id": "o3Fh0", "text": "\n$3 x^2+5 y^2-15=0$\n", "image": null, "isCorrect": false}, {"id": "Vpd0e", "text": "\n$5 x^2+3 y^2-32=0$\n", "image": null, "isCorrect": false}, {"id": "rGutQ", "text": "\n $3 x^2+5 y^2-32=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{b}^2=\\mathrm{a}^2\\left(1-\\mathrm{e}^2\\right)=\\mathrm{a}^2\\left(1-\\frac{2}{5}\\right)=\\mathrm{a}^2 \\frac{3}{5}=\\frac{3 \\mathrm{a}^2}{5} \\\\\n& \\frac{\\mathrm{x}^2}{\\mathrm{a}^2}+\\frac{\\mathrm{y}^2}{\\mathrm{~b}^2}=1 \\Rightarrow \\frac{9}{\\mathrm{a}^2}+\\frac{5}{3 \\mathrm{a}^2}=1 \\\\\n& \\mathrm{a}^2=\\frac{32}{3} \\\\\n& \\mathrm{~b}^2=\\frac{32}{5}\n\\end{aligned}\n$$\n$\\therefore$ Required equation of ellipse $3 x^2+5 y^2-32=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d658cc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "The ellipse $x^2+4 y^2=4$ is inscribed in a rectangle aligned with the coordinate axes, which in turn in inscribed in another ellipse that passes through the point $(4,0)$. Then the equation of the ellipse is", "image": null}, "options": [{"id": "CbSg9", "text": "\n$x^2+16 y^2=16$\n", "image": null, "isCorrect": false}, {"id": "6yKbs", "text": "\n$x^2+12 y^2=16$\n", "image": null, "isCorrect": true}, {"id": "tPtaU", "text": "\n$4 x^2+48 y^2=48$\n", "image": null, "isCorrect": false}, {"id": "d8Bj7", "text": "\n$4 \\mathrm{x}^2+64 \\mathrm{y}^2=48$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\nx^2+4 y^2=4 \\Rightarrow \\frac{x^2}{4}+\\frac{y^2}{1}=1 \\Rightarrow a=2, b=1 \\Rightarrow P=(2,1)\n$$\nRequired Ellipse is $\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1 \\Rightarrow \\frac{x^2}{4^2}+\\frac{y^2}{b^2}=1$\n$(2,1)$ lies on it\n$$\n\\begin{aligned}\n& \\Rightarrow \\frac{4}{16}+\\frac{1}{b^2}=1 \\Rightarrow \\frac{1}{b^2}=1-\\frac{1}{4}=\\frac{3}{4} \\Rightarrow b^2=\\frac{4}{3} \\\\\n& \\therefore \\frac{x^2}{16}+\\frac{y^2}{\\left(\\frac{4}{3}\\right)}=1 \\Rightarrow \\frac{x^2}{16}+\\frac{3 y^2}{4}=1 \\Rightarrow x^2+12 y^2=16\n\\end{aligned}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/WhLVhi4gYhBhqVT90dFcSY78mia0lKzKeCbgRON2iKQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d693a0", "title": "Equation of Ellipse", "totalQuestions": 69, "questions": [{"_id": "69d8073881239f6567c4f32f", "type": "singleCorrect", "question": {"text": "Let $\\dfrac{x^2}{f(a^2+7a+3)} + \\dfrac{y^2}{f(3a+15)} = 1$ represent an ellipse with major axis along $y$-axis, where $f$ is a strictly decreasing positive function on $\\mathbb{R}$. If the set of all possible values of $a$ is $\\mathbb{R} - [\\alpha, \\beta]$, then $\\alpha^2+\\beta^2$ is equal to:", "image": null}, "options": [{"id": "X6JKY", "text": "$28$", "isCorrect": false, "image": null}, {"id": "G1Pso", "text": "$40$", "isCorrect": true, "image": null}, {"id": "uWf3j", "text": "$61$", "isCorrect": false, "image": null}, {"id": "xHWno", "text": "$24$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the given equation to represent an ellipse with its major axis along the $y$-axis, the denominator of $y^2$ must be strictly greater than the denominator of $x^2$.<br><br>$f(3a+15) > f(a^2+7a+3)$<br><br>Since $f$ is given as a strictly decreasing positive function on $\\mathbb{R}$, the inequality sign reverses for the arguments:<br><br>$3a+15 < a^2+7a+3$<br><br>$a^2 + 4a - 12 > 0$<br><br>$(a+6)(a-2) > 0$<br><br>The solution to this inequality is $a \\in (-\\infty, -6) \\cup (2, \\infty)$.<br><br>This can be rewritten in terms of the set difference as $a \\in \\mathbb{R} - [-6, 2]$.<br><br>Comparing this with the given set $\\mathbb{R} - [\\alpha, \\beta]$, we get $\\alpha = -6$ and $\\beta = 2$.<br><br>$\\alpha^2 + \\beta^2 = (-6)^2 + (2)^2 = 36 + 4 = 40$<br><br>Answer: $40$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "1f5e7b15e2e047c79e3fbc28554e86fe", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/hKVdmSZQwXTdv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/hKVdmSZQwXTdv.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073e81239f6567c4f372", "type": "singleCorrect", "question": {"text": "Let $x = 9$ be a directrix of an ellipse $E$, whose centre is at the origin and eccentricity is $\\dfrac{1}{3}$. Let $P(\\alpha, 0)$, $\\alpha > 0$, be a focus of $E$ and $AB$ be a chord passing through $P$. Then the locus of the mid point of $AB$ is :", "image": null}, "options": [{"id": "rZPLv", "text": "$9y^2 = 8x(1-x)$", "isCorrect": true, "image": null}, {"id": "KPIXn", "text": "$3y^2 = 4x(1-x)$", "isCorrect": false, "image": null}, {"id": "dnUC0", "text": "$9y^2 = 8x(x-1)$", "isCorrect": false, "image": null}, {"id": "SKZQt", "text": "$3y^2 = 4x(x-1)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the directrix of the ellipse is $x = \\dfrac{a}{e} = 9$ and eccentricity $e = \\dfrac{1}{3}$.<br><br>$\\dfrac{a}{1/3} = 9 \\Rightarrow a = 3$<br><br>The value of $b^2$ is given by $b^2 = a^2(1 - e^2) = 9\\left(1 - \\dfrac{1}{9}\\right) = 8$.<br><br>The equation of the ellipse is $\\dfrac{x^2}{9} + \\dfrac{y^2}{8} = 1$.<br><br>The focus $P(\\alpha, 0)$ for $\\alpha > 0$ is at $(ae, 0) = \\left(3 \\times \\dfrac{1}{3}, 0\\right) = (1, 0)$.<br><br>Let the midpoint of the chord $AB$ be $(h, k)$. The equation of the chord in terms of its midpoint is given by $T = S_1$ :<br><br>$\\dfrac{hx}{9} + \\dfrac{ky}{8} = \\dfrac{h^2}{9} + \\dfrac{k^2}{8}$<br><br>Since the chord passes through the focus $P(1, 0)$, substituting $x = 1$ and $y = 0$ gives:<br><br>$\\dfrac{h}{9} = \\dfrac{h^2}{9} + \\dfrac{k^2}{8}$<br><br>$\\dfrac{k^2}{8} = \\dfrac{h}{9} - \\dfrac{h^2}{9}$<br><br>$9k^2 = 8h(1 - h)$<br><br>Replacing $(h, k)$ with $(x, y)$, the locus of the midpoint is:<br><br>$9y^2 = 8x(1 - x)$<br><br>Answer: $9y^2 = 8x(1-x)$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "e1220aba45f14ccb932026193570d620", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/qeAPIQETL9GlU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/qeAPIQETL9GlU.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073d81239f6567c4f371", "type": "singleCorrect", "question": {"text": "The eccentricity of an ellipse $E$ with centre at the origin $O$ is $\\dfrac{\\sqrt{3}}{2}$ and its directrices are $x = \\pm \\dfrac{4\\sqrt{6}}{3}$. Let $H: \\dfrac{x^2}{a^2} - \\dfrac{y^2}{b^2} = 1$ be a hyperbola whose eccentricity is equal to the length of semi-major axis of $E$, and whose length of latus rectum is equal to the length of minor axis of $E$. Then the distance between the foci of $H$ is :", "image": null}, "options": [{"id": "Ug1ED", "text": "$\\dfrac{4\\sqrt{2}}{\\sqrt{7}}$", "isCorrect": false, "image": null}, {"id": "sjkGt", "text": "$\\dfrac{4\\sqrt{2}}{7}$", "isCorrect": false, "image": null}, {"id": "dRZEe", "text": "$\\dfrac{4}{\\sqrt{7}}$", "isCorrect": false, "image": null}, {"id": "20SBk", "text": "$\\dfrac{8}{7}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For the ellipse $E$, the eccentricity is $e_E = \\dfrac{\\sqrt{3}}{2}$ and the directrices are $x = \\pm \\dfrac{a_E}{e_E} = \\pm \\dfrac{4\\sqrt{6}}{3}$.<br><br>The semi-major axis $a_E$ is given by:<br><br>$a_E = e_E \\times \\dfrac{4\\sqrt{6}}{3} = \\dfrac{\\sqrt{3}}{2} \\times \\dfrac{4\\sqrt{6}}{3} = \\dfrac{12\\sqrt{2}}{6} = 2\\sqrt{2}$<br><br>The semi-minor axis $b_E$ is given by:<br><br>$b_E^2 = a_E^2(1 - e_E^2) = (2\\sqrt{2})^2 \\left(1 - \\dfrac{3}{4}\\right) = 8 \\times \\dfrac{1}{4} = 2 \\Rightarrow b_E = \\sqrt{2}$<br><br>For the hyperbola $H: \\dfrac{x^2}{a^2} - \\dfrac{y^2}{b^2} = 1$, its eccentricity $e_H$ is equal to the semi-major axis of $E$:<br><br>$e_H = a_E = 2\\sqrt{2}$<br><br>The length of the latus rectum of $H$ is equal to the length of the minor axis of $E$ ($2b_E$):<br><br>$\\dfrac{2b^2}{a} = 2b_E = 2\\sqrt{2} \\Rightarrow b^2 = \\sqrt{2}a$<br><br>Using the standard relation for a hyperbola $b^2 = a^2(e_H^2 - 1)$, we substitute $b^2$ and $e_H$:<br><br>$\\sqrt{2}a = a^2((2\\sqrt{2})^2 - 1)$<br><br>$\\sqrt{2}a = a^2(8 - 1) = 7a^2$<br><br>Since $a > 0$, dividing by $a$ gives:<br><br>$a = \\dfrac{\\sqrt{2}}{7}$<br><br>The distance between the foci of the hyperbola $H$ is $2ae_H$:<br><br>$2ae_H = 2 \\times \\dfrac{\\sqrt{2}}{7} \\times 2\\sqrt{2} = \\dfrac{8}{7}$<br><br>Answer: $\\dfrac{8}{7}$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "be153b81a9974dc795c28381f6ed9138", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/2TK58PVi1EchX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/2TK58PVi1EchX.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073081239f6567c4f2d9", "type": "singleCorrect", "question": {"text": "Let a focus of the ellipse $E: \\dfrac{x^2}{a^2} + \\dfrac{y^2}{b^2} = 1$ be $S(4, 0)$ and its eccentricity be $\\dfrac{4}{5}$. If the point $P(3, \\alpha)$ lies on $E$ and $O$ is the origin, then the area of $\\triangle POS$ is equal to:", "image": null}, "options": [{"id": "6aRGq", "text": "$12/5$", "isCorrect": false, "image": null}, {"id": "cRQD2", "text": "$14/5$", "isCorrect": false, "image": null}, {"id": "JqB8d", "text": "$24/5$", "isCorrect": true, "image": null}, {"id": "PDxXy", "text": "$48/5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the focus of the ellipse $S(4, 0)$, we have $ae = 4$.<br><br>Since the eccentricity $e = \\dfrac{4}{5}$, we get $a \\left(\\dfrac{4}{5}\\right) = 4 \\Rightarrow a = 5$.<br><br>Using the relation $b^2 = a^2(1 - e^2)$, we find:<br><br>$b^2 = 25 \\left(1 - \\dfrac{16}{25}\\right) = 9$<br><br>The equation of the ellipse is $\\dfrac{x^2}{25} + \\dfrac{y^2}{9} = 1$.<br><br>Since the point $P(3, \\alpha)$ lies on the ellipse, substituting $x = 3$ gives:<br><br>$\\dfrac{9}{25} + \\dfrac{\\alpha^2}{9} = 1$<br><br>$\\dfrac{\\alpha^2}{9} = 1 - \\dfrac{9}{25} = \\dfrac{16}{25}$<br><br>$\\alpha^2 = \\dfrac{144}{25} \\Rightarrow |\\alpha| = \\dfrac{12}{5}$<br><br>The coordinates of the vertices of $\\triangle POS$ are $O(0, 0)$, $S(4, 0)$, and $P\\left(3, \\pm \\dfrac{12}{5}\\right)$.<br><br>The area of $\\triangle POS$ is $\\dfrac{1}{2} \\times \\text{base} \\times \\text{height}$.<br><br>Taking $OS$ as the base, the length is $4$, and the height is the absolute value of the y-coordinate of $P$, which is $\\dfrac{12}{5}$.<br><br>Area $= \\dfrac{1}{2} \\times 4 \\times \\dfrac{12}{5} = \\dfrac{24}{5}$<br><br>Answer: $24/5$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "a7180dfb5e6b425e98c4dae3923fc23c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7ws7fJ5zfFfFd.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7ws7fJ5zfFfFd.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075781239f6567c4f49c", "type": "singleCorrect", "question": {"text": "Let an ellipse $\\dfrac{x^2}{a^2} + \\dfrac{y^2}{b^2} = 1$, $a < b$, pass through the point $(4, 3)$ and have eccentricity $\\dfrac{\\sqrt{5}}{3}$. Then the length of its latus rectum is :", "image": null}, "options": [{"id": "ZCi5r", "text": "$\\dfrac{4\\sqrt{5}}{3}$", "isCorrect": false, "image": null}, {"id": "NgzcX", "text": "$2\\sqrt{5}$", "isCorrect": false, "image": null}, {"id": "yO12a", "text": "$\\dfrac{7\\sqrt{5}}{3}$", "isCorrect": false, "image": null}, {"id": "fwX5Z", "text": "$\\dfrac{8\\sqrt{5}}{3}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given the equation of the ellipse is $\\dfrac{x^2}{a^2} + \\dfrac{y^2}{b^2} = 1$ with $a < b$.<br><br>The eccentricity is given by $e = \\dfrac{\\sqrt{5}}{3}$.<br><br>Since $a < b$, the relation between $a$, $b$, and $e$ is $a^2 = b^2(1 - e^2)$.<br><br>Substituting the value of $e$:<br><br>$a^2 = b^2\\left(1 - \\dfrac{5}{9}\\right) = \\dfrac{4}{9}b^2$<br><br>The ellipse passes through the point $(4, 3)$, so substituting $x = 4$ and $y = 3$ into the equation of the ellipse gives:<br><br>$\\dfrac{16}{a^2} + \\dfrac{9}{b^2} = 1$<br><br>Substituting $a^2 = \\dfrac{4}{9}b^2$ into the above equation:<br><br>$\\dfrac{16}{\\dfrac{4}{9}b^2} + \\dfrac{9}{b^2} = 1$<br><br>$\\dfrac{36}{b^2} + \\dfrac{9}{b^2} = 1$<br><br>$\\dfrac{45}{b^2} = 1 \\implies b^2 = 45$<br><br>Now, finding $a^2$:<br><br>$a^2 = \\dfrac{4}{9} \\times 45 = 20$<br><br>For an ellipse with $a < b$, the length of the latus rectum is given by $\\dfrac{2a^2}{b}$.<br><br>Substituting the values of $a^2$ and $b = \\sqrt{45} = 3\\sqrt{5}$:<br><br>Length of latus rectum $= \\dfrac{2 \\times 20}{3\\sqrt{5}} = \\dfrac{40}{3\\sqrt{5}} = \\dfrac{8\\sqrt{5}}{3}$<br><br>Answer: $\\dfrac{8\\sqrt{5}}{3}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "9743747a26c445d1af6afd8ac1ed1a0d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/82WfocF3vk0SN.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/82WfocF3vk0SN.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1b08bfdbb24356397e1", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let the ellipse $\\mathrm{E}: \\frac{x^{2}}{144}+\\frac{y^{2}}{169}=1$ and the hyperbola $\\mathrm{H}: \\frac{x^{2}}{16}-\\frac{y^{2}}{\\lambda^{2}}=-1$ have the same foci. If e and L respectively denote the eccentricity and the length of the latus rectum of H, then the value of $24(\\mathrm{e}+\\mathrm{L})$ is :", "image": null}, "options": [{"id": "eh2Zs", "text": "148", "isCorrect": false, "image": null}, {"id": "DZ5yp", "text": "126", "isCorrect": false, "image": null}, {"id": "oBa3K", "text": "67", "isCorrect": false, "image": null}, {"id": "JKuoF", "text": "296", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Ellipse E: $\\frac{x^2}{144} + \\frac{y^2}{169} = 1$ has $a^2 = 169, b^2 = 144$, so $c_E = \\sqrt{25} = 5$ with foci at $(0, \\pm 5)$.<br>Hyperbola H: $\\frac{y^2}{x^2} - \\frac{x^2}{16} = 1$ has the same foci, so $c_H^2 = x^2 + 16 = 25$, giving $x^2 = 9$.<br>Thus H is $\\frac{y^2}{9} - \\frac{x^2}{16} = 1$ with $a = 3, b = 4, c = 5$.<br>Eccentricity: $e = \\frac{5}{3}$.<br>Latus rectum: $L = \\frac{2b^2}{a} = \\frac{32}{3}$.<br>Therefore $24(e + L) = 24\\left(\\frac{5}{3} + \\frac{32}{3}\\right) = 24 \\cdot \\frac{37}{3} = 296$", "image": null}, "videoSolution": {"videoId": "3a18f682dd0c4b9695be54c9d47c37dc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/GdW7oX5kDLXbP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/GdW7oX5kDLXbP.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1af8bfdbb24356397da", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "An ellipse has its center at $(1,-2)$, one focus at $(3,-2)$ and one vertex at $(5,-2)$. Then the length of its latus rectum is :", "image": null}, "options": [{"id": "YgdyN", "text": "6", "isCorrect": true, "image": null}, {"id": "1nkY3", "text": "$4 \\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "61yLp", "text": "$\\frac{16}{\\sqrt{3}}$", "isCorrect": false, "image": null}, {"id": "EAlk9", "text": "$6 \\sqrt{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Center at $(1, -2)$, focus at $(3, -2)$, vertex at $(5, -2)$ lie on horizontal line. <br>Distance from center to focus: $c = 2$.<br>Distance from center to vertex: $a = 4$.<br>Since $b^2 = a^2 - c^2 = 16 - 4 = 12$.<br>Length of latus rectum: $L = \\dfrac{2b^2}{a} = \\dfrac{2(12)}{4} = 6$", "image": null}, "videoSolution": {"videoId": "1d4f85e75f424d8aa3ebf476629b9a41", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/bB8BWLOPI6SIh.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/bB8BWLOPI6SIh.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1a58bfdbb2435639753", "type": "numerical", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let $(h, k)$ lie on the circle $\\mathrm{C}: x^{2}+y^{2}=4$ and the point $(2 h+1,3 k+2)$ lie on an ellipse with eccentricity $e$. Then the value of $\\frac{5}{e^{2}}$ is equal to $\\_\\_\\_\\_$.", "image": null}, "options": [], "correctValue": 9, "solution": {"text": "Since $(h, k)$ lies on circle $x^2 + y^2 = 4$, we have $h = 2\\cos\\theta$ and $k = 2\\sin\\theta$.<br>The transformed point is $(2h+1, 3k+2) = (4\\cos\\theta + 1, 6\\sin\\theta + 2)$.<br>Rearranging: $\\frac{(x-1)^2}{16} + \\frac{(y-2)^2}{36} = 1$<br>This is an ellipse with $a^2 = 36$, $b^2 = 16$, so $e^2 = 1 - \\frac{b^2}{a^2} = 1 - \\frac{16}{36} = \\frac{5}{9}$<br>Therefore $\\frac{5}{e^2} = \\frac{5}{5/9} = 9$", "image": null}, "videoSolution": {"videoId": "a8b4c091732c407baa714138982acd04", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/IpIalJAa2jOP4.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/IpIalJAa2jOP4.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1a48bfdbb243563974f", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let the length of the latus rectum of an ellipse $\\frac{x^{2}}{a^{2}}+\\frac{y^{2}}{b^{2}}=1,(a>b)$, be 30. If its eccentricity is the maximum value of the function $f(t)=-\\frac{3}{4}+2 t-t^{2}$, then ($a^{2}+b^{2}$) is equal to", "image": null}, "options": [{"id": "UaJGz", "text": "276", "isCorrect": false, "image": null}, {"id": "wR3nz", "text": "256", "isCorrect": false, "image": null}, {"id": "o11pj", "text": "516", "isCorrect": false, "image": null}, {"id": "jWX2x", "text": "496", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$f(t) = -t^2 + 2t - \\frac{3}{4} = -(t-1)^2 + \\frac{1}{4}$.<br>Maximum value $= \\frac{1}{4}$, so $e = \\frac{1}{4}$.<br>$b^2 = a^2(1 - e^2) = a^2\\left(1 - \\frac{1}{16}\\right) = \\frac{15a^2}{16}$.<br>Latus rectum $= \\frac{2b^2}{a} = \\frac{2 \\cdot 15a^2/16}{a} = \\frac{15a}{8} = 30 \\Rightarrow a = 16$.<br>$b^2 = \\frac{15 \\times 256}{16} = 240$.<br>$a^2 + b^2 = 256 + 240 = 496$.", "image": null}, "videoSolution": {"videoId": "4ab2b57341f84b288d1e1af306530b6a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MlbDwVzHtEEos.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/MlbDwVzHtEEos.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19e8bfdbb24356396fa", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let each of the two ellipses $\\mathrm{E}_{1}: \\frac{x^{2}}{a^{2}}+\\frac{y^{2}}{b^{2}}=1,(a>b)$ and $\\mathrm{E}_{2}: \\frac{x^{2}}{\\mathrm{~A}^{2}}+\\frac{y^{2}}{\\mathrm{~B}^{2}}=1,(\\mathrm{~A}<\\mathrm{B})$ have eccentricity $\\frac{4}{5}$. Let the lengths of the latus recta of $E_{1}$ and $E_{2}$ be $l_{1}$ and $l_{2}$, respectively, such that $2 l_{1}^{2}=9 l_{2}$. If the distance between the foci of $E_{1}$ is 8, then the distance between the foci of $E_{2}$ is", "image": null}, "options": [{"id": "V3h0T", "text": "$\\frac{32}{5}$", "isCorrect": true, "image": null}, {"id": "BldBW", "text": "$\\frac{8}{5}$", "isCorrect": false, "image": null}, {"id": "YyYsH", "text": "$\\frac{16}{5}$", "isCorrect": false, "image": null}, {"id": "J5eHu", "text": "$\\frac{96}{5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Both ellipses have $e = 4/5$.<br>For $E_1$ ($a > b$):<br>$b^2 = a^2(1-e^2) = 9a^2/25$. <br>Latus rectum $l_1 = 2b^2/a = 18a/25$.<br>Distance between foci of $E_1$:<br>$2ae = 8a/5 = 8 \\Rightarrow a = 5$, so $l_1 = 18/5$.<br>For $E_2$ ($A < B$, major axis along $y$):<br>$A^2 = B^2(1-e^2) = 9B^2/25$. <br>Latus rectum $l_2 = 2A^2/B = 18B/25$.<br>Given $2l_1^2 = 9l_2$:<br>$2 \\cdot \\frac{324}{25} = 9 \\cdot \\frac{18B}{25} \\Rightarrow 648 = 162B \\Rightarrow B = 4$.<br>Distance between foci of $E_2 = 2Be = 2 \\cdot 4 \\cdot \\frac{4}{5} = \\frac{32}{5}$", "image": null}, "videoSolution": {"videoId": "df7e2402a6e7483cbb68785e276ce838", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/j26Gn6b4OwhkT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/j26Gn6b4OwhkT.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1928bfdbb243563966b", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let the line $y-x=1$ intersect the ellipse $\\frac{x^{2}}{2}+\\frac{y^{2}}{1}=1$ at the points A and B. Then the angle made by the line segment AB at the center of the ellipse is :", "image": null}, "options": [{"id": "8606544636", "text": "$\\frac{\\pi}{2}+\\tan ^{-1}\\left(\\frac{1}{4}\\right)$", "isCorrect": true, "image": null}, {"id": "8606544638", "text": "$\\frac{\\pi}{2}+2 \\tan ^{-1}\\left(\\frac{1}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "8606544637", "text": "$\\frac{\\pi}{2}-\\tan ^{-1}\\left(\\frac{1}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "8606544635", "text": "$\\pi-\\tan ^{-1}\\left(\\frac{1}{4}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img style=\"width:300px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S1_s_15_1.png\"><br>By solving line & equation of ellipse we get $x = 0$<br>& $x = -\\dfrac{4}{3}$<br>$\\therefore B\\left(-\\dfrac{4}{3}, -\\dfrac{1}{3}\\right)$<br>$m_{OB} = \\tan\\theta = \\dfrac{1}{4}$<br>$\\therefore \\angle AOB = \\dfrac{\\pi}{2} + \\theta = \\dfrac{\\pi}{2} + \\tan^{-1}\\dfrac{1}{4}$", "image": null}, "videoSolution": {"videoId": "cc225ee68aec46c69f7becd369f65dc2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/v3pjsSw4dI4mP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/v3pjsSw4dI4mP.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c18c8bfdbb2435639622", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Let S and $\\mathrm{S}^{\\prime}$ be the foci of the ellipse $\\frac{x^{2}}{25}+\\frac{y^{2}}{9}=1$ and $\\mathrm{P}(\\alpha, \\beta)$ be a point on the ellipse in the first quadrant. If $(\\mathrm{SP})^{2}+\\left(\\mathrm{S}^{\\prime} \\mathrm{P}\\right)^{2}-\\mathrm{SP} \\cdot \\mathrm{S}^{\\prime} \\mathrm{P}=37$, then $\\alpha^{2}+\\beta^{2}$ is equal to :", "image": null}, "options": [{"id": "JofRT", "text": "15", "isCorrect": false, "image": null}, {"id": "8XMPF", "text": "11", "isCorrect": false, "image": null}, {"id": "UKjQb", "text": "17", "isCorrect": false, "image": null}, {"id": "cIeEi", "text": "13", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For the ellipse $\\frac{x^2}{25} + \\frac{y^2}{9} = 1$, we have $a = 5$, $b = 3$, $c = 4$.<br>So foci are at $S(\\pm 4, 0)$.<br>For point $P$ on the ellipse: $SP + S'P = 10$.<br>Given $(SP)^2 + (S'P)^2 - SP \\cdot S'P = 37$<br>Let $r_1 = SP$ and $r_2 = S'P$.<br>From $(r_1 + r_2)^2 = 100$, we get $r_1^2 + r_2^2 = 100 - 2r_1r_2$.<br>Substituting into the given equation: $100 - 3r_1r_2 = 37$, so $r_1r_2 = 21$.<br>Thus $r_1 = 3, r_2 = 7$.<br>From $(\\alpha + 4)^2 + \\beta^2 = 9$ and $(\\alpha - 4)^2 + \\beta^2 = 49$, subtracting gives $16\\alpha = -40$, so $\\alpha = -\\frac{5}{2}$.<br>From the ellipse equation: $\\beta^2 = \\frac{27}{4}$.<br>Therefore $\\alpha^2 + \\beta^2 = \\frac{25}{4} + \\frac{27}{4} = 13$.", "image": null}, "videoSolution": {"videoId": "507962b40ea145978ee9f9c6320ca31b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/0fO2DBIQj47hM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/0fO2DBIQj47hM.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1818bfdbb2435639590", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "If the line $\\alpha x+4 y=\\sqrt{7}$, where $\\alpha \\in \\mathbf{R}$, touches the ellipse $3 x^{2}+4 y^{2}=1$ at the point P in the first quadrant, then one of the focal distances of $P$ is :", "image": null}, "options": [{"id": "jvEsw", "text": "$\\frac{1}{\\sqrt{3}}+\\frac{1}{2 \\sqrt{7}}$", "isCorrect": true, "image": null}, {"id": "Ag9h5", "text": "$\\frac{1}{\\sqrt{3}}-\\frac{1}{2 \\sqrt{5}}$", "isCorrect": false, "image": null}, {"id": "614ID", "text": "$\\frac{1}{\\sqrt{3}}+\\frac{1}{2 \\sqrt{5}}$", "isCorrect": false, "image": null}, {"id": "iWk5a", "text": "$\\frac{1}{\\sqrt{3}}-\\frac{1}{2 \\sqrt{11}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ellipse $3x^2 + 4y^2 = 1$: $a^2 = \\frac{1}{3}$, $b^2 = \\frac{1}{4}$, $e = \\frac{1}{2}$.<br>Tangent at $(x_0, y_0)$: $3x_0x + 4y_0y = 1$.<br>Comparing with $\\alpha x + 4y = \\sqrt{7}$:<br>$4y_0 = \\frac{4}{\\sqrt{7}} \\Rightarrow y_0 = \\frac{1}{\\sqrt{7}}$ and $3x_0 = \\frac{\\alpha}{\\sqrt{7}}$.<br>Substituting in ellipse equation: $\\frac{\\alpha^2}{21} + \\frac{4}{7} = 1 \\Rightarrow \\alpha^2 = 9 \\Rightarrow \\alpha = 3$.<br>$P = \\left(\\frac{1}{\\sqrt{7}}, \\frac{1}{\\sqrt{7}}\\right)$.<br>Focal distances $= a \\pm ex_0 = \\frac{1}{\\sqrt{3}} \\pm \\frac{1}{2\\sqrt{7}}$.<br>One focal distance is $\\frac{1}{\\sqrt{3}} + \\frac{1}{2\\sqrt{7}}$.", "image": null}, "videoSolution": {"videoId": "457c8a4a01ab4249bec85e6ebd7f9a98", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/l06BmkN3qPbQx.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/l06BmkN3qPbQx.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c7f7c09d044e4c1a24b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}], "question": {"text": "Let the ellipse $3 x^2+\\mathrm{py}^2=4$ pass through the centre $C$ of the circle $x^2+y^2-2 x-4 y-11=0$ of radius $r$. Let $f_1, f_2$ be the focal distances of the point C on the ellipse. Then $6 f_1 f_2-r$ is equal to", "image": null}, "options": [{"id": "2sb1H", "text": "74", "image": null, "isCorrect": false}, {"id": "Ebbi5", "text": "68", "image": null, "isCorrect": false}, {"id": "MH8G4", "text": "70", "image": null, "isCorrect": true}, {"id": "izzTv", "text": "78", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{E}: \\frac{\\mathrm{x}^2}{4 / 3}+\\frac{\\mathrm{y}^2}{4 / \\mathrm{P}}=1$<br/>Centre of circle ( 1,2 ), radius<br/>$\\begin{aligned}<br/>& \\mathrm{r}=\\sqrt{1+4+11} \\\\\n& \\mathrm{r}=4<br/>\\end{aligned}$<br/>$\\because$ E pass from centre $(1,2)$<br/>$\\therefore \\frac{3}{4}+\\mathrm{P}=1$<br/>$\\mathrm{P}=\\frac{1}{4} \\quad \\therefore$ vertical ellipse<br/>$\\begin{aligned} & \\mathrm{e}=\\sqrt{1-\\frac{4 / 3}{16}}=\\sqrt{1-\\frac{1}{12}}=\\sqrt{\\frac{11}{12}} \\\\ & \\therefore \\text { Focal distance of } \\mathrm{C}(\\mathrm{h}, \\mathrm{k}) \\\\ & =\\mathrm{b} \\pm \\mathrm{ek} \\\\ & \\mathrm{F}_1=4+\\sqrt{\\frac{11}{12}} \\times 2 \\\\ & \\mathrm{~F}_2=4-\\sqrt{\\frac{11}{12}} \\times 2 \\\\ & \\therefore \\mathrm{~F}_1 \\mathrm{~F}_2=16-\\frac{11}{3}=\\frac{37}{3} \\\\ & \\therefore 6 \\mathrm{~F}_1 \\mathrm{~F}_2-\\mathrm{r}=74-4=70\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "32c1d36e646f4cc5ab011be998f11c72", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/juRqdMB2FAKop.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/juRqdMB2FAKop.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c7f7c09d044e4c1a24a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}], "question": {"text": "Let the length of a latus rectum of an ellipse $\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$ be 10 . If its eccentricity is the minimum value of the function $f(\\mathrm{t})=\\mathrm{t}^2+\\mathrm{t}+\\frac{11}{12}$, $\\mathrm{t} \\in \\mathbf{R}$, then $\\mathrm{a}^2+\\mathrm{b}^2$ is equal to :", "image": null}, "options": [{"id": "DvSgZ", "text": "125", "image": null, "isCorrect": false}, {"id": "TdUAq", "text": "126", "image": null, "isCorrect": true}, {"id": "FFGVr", "text": "120", "image": null, "isCorrect": false}, {"id": "cXusO", "text": "115", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Length of LR $=\\frac{2 b^2}{a}=10 \\Rightarrow 5 \\mathrm{a}=\\mathrm{b}^2$...(1)<br/>$\\begin{aligned} & \\mathrm{f}(\\mathrm{t})=\\mathrm{t}^2+\\mathrm{t}+\\frac{11}{12} \\\\ & \\frac{\\mathrm{df}(\\mathrm{t})}{\\mathrm{dt}}=2 \\mathrm{t}+1=0 \\Rightarrow \\mathrm{t}=\\frac{-1}{2} \\\\ & \\text { Min value of } \\mathrm{f}(\\mathrm{t})=\\left(\\frac{-1}{2}\\right)^2+\\left(\\frac{-1}{2}\\right)+\\frac{11}{12} \\\\ & =\\frac{1}{4} \\frac{-1}{2}+\\frac{11}{12}=\\frac{3-6+11}{12}=\\frac{8}{12}=\\frac{2}{3}=\\mathrm{e} \\\\ & \\mathrm{e}^2=\\frac{1-\\mathrm{b}^2}{\\mathrm{a}^2} \\Rightarrow \\frac{4}{9}=\\frac{1-\\mathrm{b}^2}{\\mathrm{a}^2}\\end{aligned}$<br/>$\\Rightarrow \\frac{\\mathrm{b}^2}{\\mathrm{a}^2}=\\frac{1-4}{\\mathrm{a}}=\\frac{5}{\\mathrm{a}} \\Rightarrow \\mathrm{b}^2=\\frac{5 \\mathrm{a}^2}{\\mathrm{a}}$...(2)<br/>$\\begin{aligned} & \\text { From (1) \\& (2) } \\\\ & 5 \\mathrm{a}=\\frac{5 \\mathrm{a}^2}{\\mathrm{a}} \\Rightarrow \\mathrm{a}=9, \\quad \\mathrm{~b}=\\sqrt{45}=3 \\sqrt{5} \\\\ & \\therefore \\mathrm{a} 2+\\mathrm{b} 2=81+45=126\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "9aeee781b8c64164b8483716c3cf00d4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/45bTmfHNubgaG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/45bTmfHNubgaG.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFr 14842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 1)", "title": "JEE Main 2025 (2 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eecbc8b73881fdaea2f1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}], "question": {"text": "Let the ellipse \\(\\mathrm{E}_1: \\frac{x^2}{\\mathrm{a}^2}+\\frac{y^2}{\\mathrm{~b}^2}=1, \\mathrm{a}\\gt\\mathrm{b}\\) and \\(\\mathrm{E}_2: \\frac{x^2}{\\mathrm{~A}^2}+\\frac{y^2}{\\mathrm{~B}^2}=1, \\mathrm{~A} \\lt \\mathrm{B}\\) have same eccentricity \\(\\frac{1}{\\sqrt{3}}\\). Let the product of their lengths of latus rectums be \\(\\frac{32}{\\sqrt{3}}\\), and the distance between the foci of \\(E_1\\) be 4. If \\(E_1\\) and \\(E_2\\) meet at \\(A, B, C\\) and \\(D\\), then the area of the quadrilateral \\(A B C D\\) equals :", "image": null}, "options": [{"id": "iCZbI", "text": "\\(\\frac{12 \\sqrt{6}}{5}\\)", "image": null, "isCorrect": false}, {"id": "0cWP6", "text": "\\(6 \\sqrt{6}\\)", "image": null, "isCorrect": false}, {"id": "OeeNt", "text": "\\(\\frac{18 \\sqrt{6}}{5}\\)", "image": null, "isCorrect": false}, {"id": "M4Uou", "text": "\\(\\frac{24 \\sqrt{6}}{5}\\)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & 2 a e=4 \\\\ & \\Rightarrow \\quad a=2 \\sqrt{3} \\\\ & \\Rightarrow \\quad 1-\\frac{b^2}{12}=\\frac{1}{3} \\Rightarrow b^2=8 \\\\ & \\\\ & \\frac{2 b^2}{a} \\times \\frac{2 A^2}{B}=\\frac{32}{\\sqrt{3}} \\\\ & \\Rightarrow \\\\ & \\frac{2 \\times 8}{2 \\sqrt{3}} \\times \\frac{2 A^2}{B}=\\frac{32}{\\sqrt{3}} \\\\ & \\Rightarrow \\\\ & \\frac{A^2}{B}=2 \\Rightarrow A^2=2 B \\\\ & \\\\ & \\quad 1-\\frac{A^2}{B}=\\frac{1}{3} \\\\ & \\Rightarrow \\\\ & B=3 \\Rightarrow A^2=6\\end{aligned}$\n$E_1: \\frac{x^2}{12}+\\frac{y^2}{8}=1$ ....(i)\n$E_1: \\frac{x^2}{6}+\\frac{y^2}{9}=1$...(ii)\nOn solving (i) \\& (ii)\n$\\begin{aligned} &(x, y)=\\left(\\frac{\\sqrt{6}}{\\sqrt{5}}, \\frac{6}{\\sqrt{5}}\\right),\\left(\\frac{-\\sqrt{6}}{\\sqrt{5}}, \\frac{6}{\\sqrt{5}}\\right),\\left(\\frac{\\sqrt{6}}{\\sqrt{5}}, \\frac{-6}{\\sqrt{5}}\\right), \\\\ &\\left(\\frac{-\\sqrt{6}}{\\sqrt{5}}, \\frac{-6}{\\sqrt{5}}\\right)\\end{aligned}$\nFour points are vertices of rectangle area $=\\frac{24 \\sqrt{6}}{5}$", "image": null}, "videoSolution": {"videoId": "5271ae1186b147fab4bc06555d81df4f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xkT5c2ZEcyP24.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xkT5c2ZEcyP24.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eebbc8b73881fdaea269", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d9760e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-28T09:00:00.000Z", "isVisible": true, "shortName": "2025 (28 Jan Shift 1)", "title": "JEE Main 2025 (28 Jan Shift 1)"}], "question": {"text": "Let $\\mathrm{E}_1: \\frac{x^2}{9}+\\frac{y^2}{4}=1$ be an ellipse. Ellipses $\\mathrm{E}_1$ 's are constructed such that their centres and eccentricities are same as that of $E_1$, and the length of minor axis of $E_i$ is the length of major axis of $E_{i+1}(i \\geq 1)$. If $A_i$ is the area of the ellipse $E_i$, then $\\frac{5}{\\pi}\\left(\\sum_{i=1}^{\\infty} A_i\\right)$, is equal to", "image": null}, "options": [], "correctValue": "54", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/U9639J4di3gKkWuVLy0MoUeIC03GiP25tcLF4_szhi4.original.fullsize.png\"><br>\n\n\n\n$\\begin{aligned} & \\mathrm{E}_1=\\frac{\\mathrm{x}^2}{9}+\\frac{\\mathrm{y}^2}{4} \\Rightarrow \\mathrm{e}=\\sqrt{1-\\frac{4}{9}}=\\frac{\\sqrt{5}}{3} \\\\ & \\mathrm{E}_2: \\frac{\\mathrm{x}^2}{\\mathrm{a}^2}+\\frac{\\mathrm{y}^2}{4}=1 \\\\ & \\mathrm{e}=\\frac{\\sqrt{5}}{3}=\\sqrt{1-\\frac{\\mathrm{a}^2}{4}} \\Rightarrow \\frac{5}{9}=1-\\frac{\\mathrm{a}^2}{4} \\\\ & \\mathrm{a}^2=\\frac{16}{9}\\end{aligned}$\n\n\n$\\begin{aligned} & \\mathrm{E}_2: \\frac{\\mathrm{x}^2}{\\frac{16}{9}}+\\frac{\\mathrm{y}^2}{4}=1 \\\\ & \\mathrm{E}_3: \\frac{\\mathrm{x}^2}{\\frac{16}{9}}+\\frac{\\mathrm{y}^2}{\\mathrm{~b}^2}=1 \\\\ & \\mathrm{e}=\\frac{\\sqrt{5}}{3}=\\sqrt{1-\\frac{\\mathrm{b}^2}{\\frac{16}{9}}} \\Rightarrow b^2=\\frac{64}{81}\\end{aligned}$\n\n\n$\\begin{aligned} & \\mathrm{E}_3=\\frac{\\mathrm{x}^2}{\\frac{16}{9}}+\\frac{\\mathrm{y}^2}{\\frac{64}{81}}=1 \\\\ & \\mathrm{~A}_1=\\pi \\times 3 \\times 2 \\Rightarrow 6 \\pi \\\\ & \\mathrm{~A}_2=\\pi \\times \\frac{4}{3} \\times 2=\\frac{8 \\pi}{3} \\\\ & \\mathrm{~A}_3=\\pi \\times \\frac{4}{3} \\times \\frac{8}{9}=\\frac{32 \\pi}{81} \\\\ & \\sum_{\\mathrm{i}=1}^{\\infty} \\mathrm{A}_{\\mathrm{i}}=6 \\pi+\\frac{8 \\pi}{3}+\\frac{32 \\pi}{81}+\\ldots . \\infty \\Rightarrow \\frac{6 \\pi}{1-\\frac{4}{9}} \\Rightarrow \\frac{54 \\pi}{5} \\\\ & \\therefore \\frac{5}{\\pi} \\sum_{\\mathrm{i}=1}^{\\infty} \\mathrm{A}_{\\mathrm{i}} \\Rightarrow \\frac{5}{\\pi} \\times \\frac{54 \\pi}{5}=54\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "5f3dc972521c4e97a46ae538a17ca22d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/VixqX65PpBAOT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/VixqX65PpBAOT.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d9760e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-28T09:00:00.000Z", "isVisible": true, "shortName": "2025 (28 Jan Shift 1)", "title": "JEE Main 2025 (28 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eea7c8b73881fdaea1be", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 1)", "title": "JEE Main 2025 (24 Jan Shift 1)"}], "question": {"text": "Let the product of the focal distances of the point $\\left(\\sqrt{3}, \\frac{1}{2}\\right)$ on the ellipse $\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1,(\\mathrm{a}\\gt\\mathrm{b})$, be $\\frac{7}{4}$. Then the absolute difference of the eccentricities of two such ellipses is", "image": null}, "options": [{"id": "yXsIX", "text": "$\\frac{1-\\sqrt{3}}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "qmC16", "text": "$\\frac{3-2 \\sqrt{2}}{2 \\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "kMEWZ", "text": "$\\frac{3-2 \\sqrt{2}}{3 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "0eNmM", "text": "$\\frac{1-2 \\sqrt{2}}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Product of focal distances }=\\left(a+e x_1\\right)\\left(a-e x_1\\right) \\\\ & =a^2-e^2 x_1^2=a^2-e^2(3) \\\\ & =a^2-3 e^2=\\frac{7}{4} \\Rightarrow a^2=\\frac{7}{4}+3 e^2 \\\\ & \\Rightarrow 4 a^2=7+12 e^2 \\\\ & \\&\\left(\\sqrt{3}, \\frac{1}{2}\\right) \\text { lines on } \\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1 \\\\ & \\therefore \\frac{3}{a^2}+\\frac{1}{4 b^2}=1\\end{aligned}$\n$\\begin{aligned} & \\frac{3}{\\mathrm{a}^2}+\\frac{1}{4\\left(\\mathrm{a}^2\\right)\\left(1-\\mathrm{e}^2\\right)}=1 \\\\ & 12\\left(1-\\mathrm{e}^2\\right)+1=4 \\mathrm{a}^2\\left(1-\\mathrm{e}^2\\right) \\\\ & 13-12 \\mathrm{e}^2=\\left(7+12 \\mathrm{e}^2\\right)\\left(1-\\mathrm{e}^2\\right) \\\\ & \\Rightarrow 13-12 \\mathrm{e}^2=7-7 \\mathrm{e}^2+12 \\mathrm{e}^2-12 \\mathrm{e}^4 \\\\ & \\Rightarrow 12 \\mathrm{e}^4-17 \\mathrm{e}^2+6=0 \\\\ & \\therefore \\mathrm{e}^2=\\frac{17 \\pm \\sqrt{289-288}}{24}=\\frac{17 \\pm 1}{24}=\\frac{3}{4} \\& \\frac{2}{3} \\\\ & \\therefore \\mathrm{e}=\\frac{\\sqrt{3}}{2} \\& \\sqrt{\\frac{2}{3}} \\\\ & \\therefore \\text { difference }==\\frac{\\sqrt{3}}{2}-\\sqrt{\\frac{2}{3}}=\\frac{3-2 \\sqrt{2}}{2 \\sqrt{3}}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "fb03fcd7e9d240ef87eae821cb676354", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/9EmChf0gd4yG8.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/9EmChf0gd4yG8.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 1)", "title": "JEE Main 2025 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446757970e6e9ab542d26e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}], "question": {"text": "Let $f(x)=x^2+9, g(x)=\\frac{x}{x-9}$ and $\\mathrm{a}=f \\circ g(10), \\mathrm{b}=g \\circ f(3)$. If $\\mathrm{e}$ and $l$ denote the eccentricity and the length of the latus rectum of the ellipse $\\frac{x^2}{a}+\\frac{y^2}{b}=1$, then $8 \\mathrm{e}^2+l^2$ is equal to.", "image": null}, "options": [{"id": "CJpLW", "text": "8", "image": null, "isCorrect": true}, {"id": "QRLKz", "text": "16", "image": null, "isCorrect": false}, {"id": "qe3Qy", "text": "6", "image": null, "isCorrect": false}, {"id": "W2tY6", "text": "12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & f(x)=x^2+9 \\quad g(x)=\\frac{x}{x-9} \\\\ & a=f(g(10))=f\\left(\\frac{10}{10-9}\\right) \\\\ & =f(10)=109 \\\\ & b=g(f(3))=g(9+9) \\\\ & =g(18)=\\frac{18}{9}=2 \\\\ & E: \\frac{x^2}{109}+\\frac{y^2}{2}=1\\end{aligned}$\n$\\begin{aligned} & \\mathrm{e}^2=1-\\frac{2}{109}=\\frac{107}{109} \\\\ & \\ell=\\frac{2(2)}{\\sqrt{109}}=\\frac{4}{\\sqrt{109}} \\\\ & 8 \\mathrm{e}^2+\\ell^2=\\frac{8(107)}{109}+\\frac{16}{109} \\\\ & =8\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "5a82929d555949759837dc7158a5d788", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/CawO9fRUIq7cC.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/CawO9fR </math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7a88b321-8d4a-4e77-bce7-43bb0cc67b2d.png\" style=\"width: 400px; height: 182px;\"/></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d4cc2947-1847-422e-894e-e3afb10b0377.png\" style=\"width: 300px; height: 86px;\"/></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>h</mi><mo>=</mo><mn>3</mn><mi>cos</mi><mi>θ</mi><mo>,</mo><mo> </mo><mi>k</mi><mo>=</mo><mfrac><mn>18</mn><mn>7</mn></mfrac><mi>sin</mi><mi>θ</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>h</mi><mn>3</mn></mfrac><mo>=</mo><mi>cos</mi><mi>θ</mi><mo>,</mo><mo> </mo><mfrac><mrow><mn>7</mn><mi>k</mi></mrow><mn>18</mn></mfrac><mo>=</mo><mi>sin</mi><mi>θ</mi></math></p><p>So, locus of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is given by, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>9</mn></mfrac><mo>+</mo><mfrac><mrow><mn>49</mn><msup><mi>y</mi><mn>2</mn></msup></mrow><mn>324</mn></mfrac><mo>=</mo><mn>1</mn></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>e</mi><mo>=</mo><msqrt><mn>1</mn><mo>−</mo><mfrac><mn>324</mn><mrow><mn>49</mn><mo>×</mo><mn>9</mn></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>e</mi><mo>=</mo><mfrac><msqrt><mn>117</mn></msqrt><mn>21</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>e</mi><mo>=</mo><mfrac><msqrt><mn>13</mn></msqrt><mn>7</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "8aa3973ff482437b8eb04d8afbc1d413", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/jxFEvfTjPd3wr.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/jxFEvfTjPd3wr.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premi t": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>385</mn><mn>8</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "XUhhO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>347</mn><mn>8</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Av0Rv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>512</mn><mn>25</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Nq2Wg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>656</mn><mn>25</mn></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/78d1b8d4-f21e-4ac8-a4e6-54eb07267a04.png\" style=\"width: 300px; height: 184px;\"/></p><p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math> be the foot of perpendicular from vertex to directrix of parabola,</p><p>Now, finding <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math> we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mfenced><mrow><mn>4</mn><mo>+</mo><mn>3</mn></mrow></mfenced><mo>-</mo><mn>6</mn></mrow><mrow><mn>4</mn><mo>+</mo><mn>1</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>5</mn></mfrac><mo>,</mo><mo> </mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mfrac><mn>12</mn><mn>5</mn></mfrac><mo>,</mo><mo> </mo><mi>y</mi><mo>=</mo><mfrac><mn>16</mn><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>Z</mi><mo>≡</mo><mfenced><mrow><mfrac><mn>12</mn><mn>5</mn></mfrac><mo>,</mo><mfrac><mn>16</mn><mn>5</mn></mfrac></mrow></mfenced></math></p><p>Eccentricity of ellipse is given as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math>.</p><p>Now, finding <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup></math> using eccentricity formula we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><mn>2</mn></mfrac></math></p><p>So, equation of ellipse will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>144</mn><mrow><mn>25</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mn>256</mn><mrow><mn>25</mn><mo>×</mo><mstyle displaystyle=\"true\"><mfrac><msup><mi>a</mi><mn>2</mn></msup><mn>2</mn></mfrac></mstyle></mrow></mfrac><mo>=</mo><mn>1</mn></math> {as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></mfenced><mo>≡</mo><mfenced><mrow><mfrac><mn>12</mn><mn>5</mn></mfrac><mo>,</mo><mfrac><mn>16</mn><mn>5</mn></mfrac></mrow></mfenced></math> }</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>144</mn><mrow><mn>25</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mn>512</mn><mrow><mn>25</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>656</mn><mrow><mn>25</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>656</mn><mn>25</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>328</mn><mn>25</mn></mfrac></math></p><p>Length of latus rectum is given by,<br/><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mfrac><mrow><mn>2</mn><msup><mi>b</mi><mn>2</mn></msup></mrow><mi>a</mi></mfrac></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>L</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mstyle displaystyle=\"true\"><mfrac><mn>328</mn><mn>25</mn></mfrac></mstyle></mrow><mstyle displaystyle=\"true\"><mfrac><msqrt><mn>656</mn></msqrt><mn>5</mn></mfrac></mstyle></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>L</mi><mo>=</mo><mfrac><msqrt><mn>656</mn></msqrt><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>L</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>656</mn><mn>25</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "f5d54baea4f64b10a235847ab4d123f1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/SlXKiqBWLQp8x.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/SlXKiqBWLQp8x.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "
