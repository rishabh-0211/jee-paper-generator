\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>b</mi><mo>&#160;</mo><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mn>2</mn><mi>a</mi><mo>&#160;</mo><mi>sin</mi><mo>&#160;</mo><mi>&#952;</mi><mo>&#160;</mo></mrow></mfenced></math>&nbsp;to the ellipse is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mi>b</mi></mfrac><mi>cos</mi><mo>&#160;</mo><mi>&#952;</mi><mo>+</mo><mfrac><mi>y</mi><mrow><mn>2</mn><mi>a</mi></mrow></mfrac><mi>sin</mi><mo>&#160;</mo><mi>&#952;</mi><mo>=</mo><mn>1</mn></math></p><p>Co-ordinates of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mfrac><mi>b</mi><mrow><mi>cos</mi><mo>&#160;</mo><mi>&#952;</mi></mrow></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mfenced><mrow><mn>0</mn><mo>,</mo><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>sin</mi><mo>&#160;</mo><mi>&#952;</mi></mrow></mfrac></mrow></mfenced></math>&nbsp;respectively.</p><p>Therefore, Area&nbsp;of triangle formed by tangent and co-ordinate axes<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfenced close=\"|\" open=\"|\"><mrow><mfrac><mi>b</mi><mrow><mi>cos</mi><mo>&#160;</mo><mi>&#952;</mi></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>sin</mi><mo>&#160;</mo><mi>&#952;</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>a</mi><mi>b</mi></mrow><mrow><mi>sin</mi><mo>&#160;</mo><mi>&#952;</mi><mo>.</mo><mi>cos</mi><mo>&#160;</mo><mi>&#952;</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi><mi>b</mi></mrow><mrow><mi>sin</mi><mo>&#160;</mo><mn>2</mn><mi>&#952;</mi></mrow></mfrac></math></p><p>as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mo>&#160;</mo><mi>&#952;</mi><mo>&#8804;</mo><mn>1</mn></math>&nbsp;therefore we can say Minimum area of triangle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mi>a</mi><mi>b</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>k</mi><mo>=</mo><mn>2</mn></math></p><p>&nbsp;</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 1)", "title": "JEE Main 2021 (27 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d673ee", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "On the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>8</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>=</mo><mn>1</mn></math>,&nbsp;let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> be a point in the second quadrant such that the tangent at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> to the ellipse is perpendicular to the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>0</mn></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">S</mi><mo>&#39;</mo></msup></math> be the foci of the ellipse and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi></math> be its eccentricity. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is the area of the triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>SPS</mi><mo>'</mo></msup></math>,&nbsp;then&nbsp;the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>5</mn><mo>-</mo><msup><mi mathvariant=\"normal\">e</mi><mn>2</mn></msup></mrow></mfenced><mo>&#183;</mo><mi mathvariant=\"normal\">A</mi></math> is", "image": null}, "options": [{"id": "WO8rh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math>", "isCorrect": false, "image": null}, {"id": "Ez0Pw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "isCorrect": true, "image": null}, {"id": "4BrOc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn></math>", "isCorrect": false, "image": null}, {"id": "cUdLc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We have an ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>8</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>=</mo><mn>1</mn></math>, we have a general point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><msqrt><mn>8</mn></msqrt><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mn>2</mn><mi>sin</mi><mi>&#952;</mi><mo>)</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ad09b6e2-d27d-4fdb-9542-4a4ddd3e8a62-image.png\" style=\"width: 350px; height: 250px;\" /></p><p>Equation of tangent at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><msqrt><mn>8</mn></msqrt></mfrac><mi>cos</mi><mi>&#952;</mi><mo>+</mo><mfrac><mi>y</mi><mn>2</mn></mfrac><mi>sin</mi><mi>&#952;</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p>Slope <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><msqrt><mn>2</mn></msqrt></mfrac><mi>cot</mi><mi>&#952;</mi></math></p><p>Given that, tangent at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;is perpendicular to the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>0</mn></math>.</p><p>So, product of their slopes are perpendicular&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><msqrt><mn>2</mn></msqrt></mfrac><mi>cot</mi><mi>&#952;</mi><mo>&#215;</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><msqrt><mn>2</mn></msqrt></mfrac><mi>cot</mi><mi>&#952;</mi><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cot</mi><mi>&#952;</mi><mo>=</mo><mo>-</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow><mn>3</mn></mfrac><mo>,</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>So, point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mfrac><mrow><mo>-</mo><mn>8</mn></mrow><mn>3</mn></mfrac><mo>,</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mi>ae</mi><mo>&#215;</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math></p><p>Where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">e</mi><mo>=</mo><msqrt><mfrac><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>8</mn><mo>-</mo><mn>4</mn></mrow><mn>8</mn></mfrac></msqrt><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>A</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>&#215;</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac><mo>&#215;</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>5</mn><mo>-</mo><msup><mi mathvariant=\"normal\">e</mi><mn>2</mn></msup></mrow></mfenced><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfenced><mrow><mn>5</mn><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>&#215;</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>=</mo><mn>6</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-11T13:59:54.747Z"}, {"_id": "648b5a6b417cc3fb48d67678", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> be an ellipse whose axes are parallel to the co-ordinates axes, having its centre&nbsp;at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced><mo>,</mo></math>&nbsp;one focus at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>4</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math> and one vertex at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>5</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced><mo>.</mo></math>&nbsp;If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>4</mn><mo>,</mo><mi>m</mi><mo>&#62;</mo><mn>0</mn></math>&nbsp;is a tangent to the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>,</mo></math>&nbsp;then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><msup><mi>m</mi><mn>2</mn></msup></math> is equal to _____ .", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>We know that,&nbsp;If the standard ellipse is shifted to have center&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math>, then it&#39;s equation is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mi>h</mi></mrow></mfenced><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mi>k</mi></mrow></mfenced><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math></p><p>The center is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mfenced><mrow><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math><br />The vertices on the major axis are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mi>h</mi><mo>+</mo><mi>a</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>A</mi><mo>'</mo></msup><mfenced><mrow><mi>h</mi><mo>-</mo><mi>a</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math><br />The foci are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mfenced><mrow><mi>h</mi><mo>+</mo><mi>a</mi><mi>e</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>S</mi><mo>'</mo></msup><mfenced><mrow><mi>h</mi><mo>-</mo><mi>a</mi><mi>e</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced></math></p><p>The&nbsp;eccentricity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><msqrt><mfrac><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac></msqrt></math></p><p>Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mfenced><mrow><mn>3</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mi>S</mi><mfenced><mrow><mn>4</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mn>5</mn><mo>,</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math></p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>+</mo><mi>a</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mn>5</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>+</mo><mi>a</mi><mi>e</mi><mo>,</mo><mo>&#160;</mo><mi>k</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mn>4</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>4</mn></mrow></mfenced></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0323cc0c-5292-493b-894c-5a34c1360e5e-image.png\" style=\"width: 282px; height: 164px;\" /></p><p>Clearly, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mo>&#38;</mo><mi>a</mi><mi>e</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>e</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>We know that,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>a</mi><mn>2</mn></msup><msup><mi>e</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mn>2</mn><mn>2</mn></msup><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn></math></p><p>So, equation of ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mn>2</mn></msup><mn>4</mn></mfrac><mo>+</mo><mfrac><msup><mfenced><mrow><mi>y</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mn>2</mn></msup><mn>3</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>Intersecting with given tangent</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>9</mn></mrow><mn>4</mn></mfrac><mo>+</mo><mfrac><mrow><msup><mi>m</mi><mn>2</mn></msup><msup><mi>x</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mfenced><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>9</mn></mrow></mfenced><mo>+</mo><mn>4</mn><msup><mi>m</mi><mn>2</mn></msup><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>12</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>18</mn><mi>x</mi><mo>+</mo><mn>27</mn><mo>+</mo><mn>4</mn><msup><mi>m</mi><mn>2</mn></msup><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>12</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mn>3</mn><mo>+</mo><mn>4</mn><msup><mi>m</mi><mn>2</mn></msup></mrow></mfenced><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>18</mn><mi>x</mi><mo>+</mo><mn>15</mn><mo>=</mo><mn>0</mn></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mo>=</mo><mn>0</mn></math>&nbsp;(as it is tangent)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mn>18</mn></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn><mfenced><mrow><mn>3</mn><mo>+</mo><mn>4</mn><msup><mi>m</mi><mn>2</mn></msup></mrow></mfenced><mo>&#215;</mo><mn>15</mn></math></p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d673a1", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf818", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 2)", "title": "JEE Main 2021 (25 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "If a tangent to the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn></math>&nbsp;meets the tangents at the extremities of its major axis at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>,</mo></math>&nbsp;then the circle with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>C</mi></math> as diameter passes through the point.", "image": null}, "options": [{"id": "KoA8K", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>,</mo><mn>0</mn></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "DC1ha", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mn>2</mn></msqrt><mo>,</mo><mn>0</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "N2iP0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "vOM5t", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/69ae99dc-388d-47ee-adeb-37bd473a247a-image.png\" style=\"width: 452px; height: 254px;\" /></p><p>We have,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>1</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>Equation of tangent is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>cos</mi><mi>&#952;</mi></mrow></mfenced><mi>x</mi><mo>+</mo><mfenced><mrow><mn>2</mn><mi>sin</mi><mi>&#952;</mi></mrow></mfenced><mi>y</mi><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mfrac><mrow><mn>1</mn><mo>+</mo><mi>cos</mi><mi>&#952;</mi></mrow><mrow><mi>sin</mi><mi>&#952;</mi></mrow></mfrac></mrow></mfenced><mo>,</mo><mi>C</mi><mfenced><mrow><mn>2</mn><mo>,</mo><mfrac><mrow><mn>1</mn><mo>-</mo><mi>cos</mi><mi>&#952;</mi></mrow><mrow><mi>sin</mi><mi>&#952;</mi></mrow></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8801;</mo><mi>B</mi><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mi>cot</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo><mi>C</mi><mfenced><mrow><mn>2</mn><mo>,</mo><mi>tan</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mrow></mfenced></math></p><p>Equation of required circle will be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mo>+</mo><mfenced><mrow><mi>y</mi><mo>-</mo><mi>cot</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mrow></mfenced><mfenced><mrow><mi>y</mi><mo>-</mo><mi>tan</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mfenced><mrow><mi>tan</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac><mo>+</mo><mi>cot</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></mrow></mfenced><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>,</mo><mn>0</mn></mrow></mfenced></math> satisfies the above equation.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", " g/1998/Math/MathML\"><mfrac><mi>&#960;</mi><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Equation of tangent be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mi>cos</mi><mi>&#952;</mi></mrow><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mo>&#183;</mo><mi>sin</mi><mi>&#952;</mi></mrow><mn>1</mn></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;&#160;</mo><mi>&#952;</mi><mo>&#8712;</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mfrac><mi>&#960;</mi><mn>2</mn></mfrac></mrow></mfenced></math></p><p>intercept on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi><mo>=</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mi>sec</mi><mi>&#952;</mi></math></p><p>intercept on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>B</mi><mo>=</mo><mo>cosec</mo><mi>&#952;</mi></math></p><p>Now, sum of intercept</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mi>sec</mi><mi>&#952;</mi><mo>+</mo><mo>cosec</mo><mi>&#952;</mi><mo>=</mo><mi>f</mi><mo>(</mo><mi>&#952;</mi><mo>)</mo></math> let</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>&#39;</mo><mo>(</mo><mi>&#952;</mi><mo>)</mo><mo>=</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mi>sec</mi><mi>&#952;</mi><mi>tan</mi><mi>&#952;</mi><mo>-</mo><mo>cosec</mo><mi>&#952;</mi><mi>cot</mi><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mfrac><mrow><mi>sin</mi><mi>&#952;</mi></mrow><mrow><msup><mi>cos</mi><mn>2</mn></msup><mi>&#952;</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>cos</mi><mi>&#952;</mi></mrow><mrow><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><munder><munder><mrow><mfrac><mrow><mi>cos</mi><mi>&#952;</mi></mrow><mrow><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi></mrow></mfrac><mo>&#183;</mo><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mo>&#9183;</mo></munder><mo>&#8853;</mo></munder><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>tan</mi><mn>3</mn></msup><mi>&#952;</mi><mo>-</mo><mfrac><mn>1</mn><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><mfrac><mi>&#960;</mi><mn>6</mn></mfrac></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ebfe85aa-cf63-4fa7-94ad-8adc526585e8-image.png\" style=\"width: 200px; height: 91px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo><mfrac><mi>&#960;</mi><mn>6</mn></mfrac><mo>,</mo><mi>f</mi><mfenced><mi>&#952;</mi></mfenced></math> is minimum.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf813", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T14:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 2)", "title": "JEE Main 2021 (18 Mar Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-11T09:16:29.265Z"}, {"_id": "648b5a69417cc3fb48d66fc2", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf811", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T14:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 2)", "title": "JEE Main 2021 (17 Mar Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> be a tangent line to the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>20</mn></math>&nbsp;at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>6</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>.</mo></math> If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> is also a tangent to the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mrow><mo>&#160;</mo><mi>b</mi></mrow></mfrac><mo>=</mo><mn>1</mn><mo>,</mo></math> then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> is equal to :", "image": null}, "options": [{"id": "lLOuC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn></math>", "isCorrect": false, "image": null}, {"id": "dqhlH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn></math>", "isCorrect": true, "image": null}, {"id": "kLAzk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math>", "isCorrect": false, "image": null}, {"id": "NcYBl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The equation of a tangent to a parabola&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mfenced><mrow><mi>x</mi><mo>-</mo><mi>h</mi></mrow></mfenced></math>&nbsp;at a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;on it is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><mn>4</mn><mi>a</mi><mfenced><mrow><mfenced><mfrac><mrow><mi>x</mi><mo>+</mo><msub><mi>x</mi><mn>1</mn></msub></mrow><mn>2</mn></mfrac></mfenced><mo>-</mo><mi>h</mi></mrow></mfenced><mo>.</mo></math></p><p>Hence, the equation of tangent to parabola&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi><mo>-</mo><mn>20</mn></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>6</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>y</mi><mo>=</mo><mn>2</mn><mo>(</mo><mi>x</mi><mo>+</mo><mn>6</mn><mo>)</mo><mo>-</mo><mn>20</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mi>x</mi><mo>-</mo><mn>4</mn><mo>.</mo></math></p><p>Also, a line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mi>c</mi></math>&nbsp;is a tangent to the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>.</mo></math></p><p>Hence, by using the condition of tangency for ellipse<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mi>b</mi></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;and the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>x</mi><mo>-</mo><mn>4</mn><mo>,</mo></math>&nbsp;we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>=</mo><mn>2</mn><mo>(</mo><mn>1</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mi mathvariant=\"normal\">b</mi></math></p><p><math xmlns=\"htt lipse through which tangent is passing. Equation of tangent at\n$$\n(h, k)=\\frac{x h}{16}+\\frac{y k}{81}=1\n$$\nat $y=0, x=\\frac{16}{h}$\nat $x=0, y=\\frac{81}{k}$\nArea of $\\mathrm{AOB}=\\frac{1}{2} \\times\\left(\\frac{16}{h}\\right) \\times\\left(\\frac{81}{k}\\right)=\\frac{648}{h k}$\n$$\n\\mathrm{A}^2=\\frac{(648)^2}{h^2 k^2}\n$$\n$(h, k)$ must satisfy equation of ellipse\n$$\n\\begin{aligned}\n&\\frac{h^2}{16}+\\frac{k^2}{81}=1 \\\\\n&h^2=\\frac{16}{81}\\left(81-k^2\\right)\n\\end{aligned}\n$$\n\n\nPutting value of $h^2$ in equation (1)\n$$\n\\mathrm{A}^2=\\frac{81(648)^2}{16 \\times k^2\\left(81-k^2\\right)}=\\frac{\\alpha}{81 k^2-k^4}\n$$\ndifferentiating w.r. to $k$\n\n$$\n\\begin{aligned}\n&2 \\mathrm{AA}^{\\prime}=\\alpha\\left(\\frac{-1}{81 k^2-k^4}\\right)\\left(162 k-4 k^3\\right) \\\\\n&2 \\mathrm{AA}^{\\prime}=-2 \\mathrm{~A}\\left(81 k-4 k^3\\right) \\\\\n&\\Rightarrow \\mathrm{A}^{\\prime}=-81 k-4 k^3 \\\\\n&\\text { Put } \\mathrm{A}^{\\prime}=0 \\\\\n&\\Rightarrow 162 k-4 k^3=0, k\\left(162-4 k^2\\right)=0 \\\\\n&\\Rightarrow k=0, k=\\pm \\frac{9}{\\sqrt{2}} \\\\\n&\\mathrm{~A}^{\\prime \\prime}=-\\left(81-12 k^2\\right)\n\\end{aligned}\n$$\nFor both value of k, A\" $=405>0$\nArea will be minimum for $k=\\pm \\frac{9}{\\sqrt{2}}$\n$$\n\\begin{aligned}\n&h^2=\\frac{16}{81}\\left(81-k^2\\right)=8 \\\\\n&h=\\pm 2 \\sqrt{2}\n\\end{aligned}\n$$\nArea of triangle $\\mathrm{AOB}=\\frac{648 \\times \\sqrt{2}}{2 \\sqrt{2} \\times 9}=36$\nsq unit", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a36", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "If $P_1$ and $P_2$ are two points on the ellipse $\\frac{x^2}{4}+y^2=1$ at which the tangents are parallel to the chord joining the points $(0,1)$ and $(2,0)$, then the distance between $P_1$ and $P_2$ is", "image": null}, "options": [{"id": "I5Qev", "text": "\n$2 \\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "fakgH", "text": "\n$\\sqrt{5}$\n", "image": null, "isCorrect": false}, {"id": "N8XXk", "text": "\n$2 \\sqrt{3}$\n", "image": null, "isCorrect": false}, {"id": "STVCR", "text": "\n$\\sqrt{10}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Any tangent on an ellipse $\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$ is given by\n$$\ny=m x \\pm \\sqrt{a^2 m^2+b^2}\n$$\nHere $a=2, b=1$\n$$\n\\begin{aligned}\n& m=\\frac{1-0}{0-2}=-\\frac{1}{2} \\\\\n& c=\\sqrt{4\\left(-\\frac{1}{2}\\right)^2+1^2}=\\sqrt{2}\n\\end{aligned}\n$$\nSo, $y=-\\frac{1}{2} x \\pm \\sqrt{2}$\nFor ellipse : $\\frac{x^2}{4}+\\frac{y^2}{1}=1$\nWe put $y=-\\frac{1}{2} x+\\sqrt{2}$\n\n$$\n\\begin{aligned}\n& \\therefore \\frac{x^2}{4}+\\left(-\\frac{x}{2}+\\sqrt{2}\\right)^2=1 \\\\\n& \\frac{x^2}{4}+\\left(\\frac{x^2}{4}-2\\left(\\frac{x}{2}\\right) \\sqrt{2}+2\\right)=1 \\\\\n& \\Rightarrow x^2+2 \\sqrt{2} x+2=0 \\\\\n& \\text { or } x^2-2 \\sqrt{2} x+2=0 \\\\\n& \\Rightarrow x=\\sqrt{2} \\text { or }-\\sqrt{2}\n\\end{aligned}\n$$\nIf $x=\\sqrt{2}, y=\\frac{1}{\\sqrt{2}}$ and $x=-\\sqrt{2}, y=-\\frac{1}{\\sqrt{2}}$\n$\\therefore$ Points are $\\left(\\sqrt{2}, \\frac{1}{\\sqrt{2}}\\right),\\left(-\\sqrt{2},-\\frac{1}{\\sqrt{2}}\\right)$\n$$\n\\left.\\therefore P_1 P_2=\\sqrt{\\left\\{\\frac{1}{\\sqrt{2}}-\\left(-\\frac{1}{\\sqrt{2}}\\right)\\right\\}^2+\\left\\{\\sqrt{2}-(-\\sqrt{2}\\}^2\\right.}\\right)\n$$\n\n$$\n=\\sqrt{\\left(\\frac{2}{\\sqrt{2}}\\right)^2+\\left(2 \\sqrt{2}^2\\right.}=\\sqrt{2+8}=\\sqrt{10}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "648b5a73417cc3fb48d693a6", "title": "Common Tangent", "totalQuestions": 4, "questions": [{"_id": "648b5a70417cc3fb48d6852e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}], "question": {"text": "Let a circle of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> be concentric to the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>19</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>285</mn></math>. Then the common tangents are inclined to the minor axis of the ellipse at the angle", "image": null}, "options": [{"id": "WNuY8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>3</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "LOMYg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "HOc4i", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Rxgii", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi 8/Math/MathML\"><mi mathvariant=\"normal\">y</mi><mo>=</mo><mi>mx</mi><mo>&#177;</mo><msqrt><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></mrow><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">b</mi><mn>2</mn></msup></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><msqrt><mn>16</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn></msqrt><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>12</mn></math></p><p>Also equation of tangent to the circle is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><msqrt><mn>12</mn></msqrt><msqrt><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></msqrt><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>Now, for common tangent equate eq.<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>2</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>16</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn><mo>=</mo><mn>12</mn><mfenced><mrow><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><msup><mi>m</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mn>9</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557bd30d43b5ec151ee54ad", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Feb Shift 2)", "title": "JEE Main 2021 (26 Feb Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> be a common tangent line to the curves <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>36</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>2</mn><mi>x</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mn>2</mn><mi>y</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>31</mn></math>. Then the square of the slope of the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> is ______.<gwmw style=\"display:none;\"></gwmw>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>Given curves are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>9</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>31</mn><mn>4</mn></mfrac></math></p><p>let slope of common tangent be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math></p><p>so tangents are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><msqrt><mn>9</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><mfrac><msqrt><mn>31</mn></msqrt><mn>2</mn></mfrac><msqrt><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></msqrt></math></p><p>hence <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo>=</mo><mfrac><mn>31</mn><mn>4</mn></mfrac><mfenced><mrow><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>36</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>16</mn><mo>=</mo><mn>31</mn><mo>+</mo><mn>31</mn><msup><mi>m</mi><mn>2</mn></msup><mo>&#8658;</mo><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Feb Shift 2)", "title": "JEE Main 2021 (26 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66523", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the tangent to the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mi>x</mi></math> at a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mi>&#946;</mi><mo>&#62;</mo><mn>0</mn></mrow></mfenced></math> is also a tangent to the ellipse, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math> then <math><mi>&#945;</mi></math> is equal to:", "image": null}, "options": [{"id": "ox3od", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "nLZbU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "go3E8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></math>", "isCorrect": true, "image": null}, {"id": "AWzwE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>&#945;</mi><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi></mrow></mfenced></math> lies on the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><msup><mi>&#946;</mi><mn>2</mn></msup></math><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>&#945;</mi><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><msup><mi>&#946;</mi><mn>2</mn></msup><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi></mrow></mfenced></math></p><p>Tangent to a parabola&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math> at a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi>a</mi><mfenced><mrow><mi>x</mi><mo>+</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfenced></math></p><p>Therefore, tangent to the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mi>x</mi></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>&#946;</mi><mn>2</mn></msup><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi></mrow></mfenced></math>&nbsp;is<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>&#8901;</mo><mi>&#946;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><msup><mi>&#946;</mi><mn>2</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mfrac><mi>x</mi><mrow><mn>2</mn><mi>&#946;</mi></mrow></mfrac><mo>+</mo><mfrac><mi>&#946;</mi><mn>2</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>Tangent to parabola is also a tangent to ellipse</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mfenced><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mfenced></mfrac><mo>=</mo><mn>1</mn></math></p><p>And, a line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mi>c</mi></math>&nbsp;is a tangent to the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup></math></p><p>Using the condition <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>,</mo></math>&nbsp;we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>&#946;</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>=</mo><msup><mn>1</mn><mn>2</mn></msup><msup><mfenced><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#946;</mi></mrow></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msup><mi>&#946;</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mn>4</mn><msup><mi>&#946;</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#946;</mi><mn>4</mn></msup><mo>-</mo><mn>2</mn><msup><mi>&#946;</mi><mn>2</mn></msup><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p>Using Sridharacharya&#39;s Formula&nbsp;the roots of a quadratic equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>a</mi><mo>&#8800;</mo><mn>0</mn></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>b</mi><mo>&#177;</mo><msqrt><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi></msqrt></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mo>-</mo><mfenced><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mo>&#177;</mo><msqrt><msup><mfenced><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>4</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced></msqrt></mrow><mrow><mn>2</mn><mo>&#215;</mo><mn>1</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#177;</mo><msqrt><mn>8</mn></msqrt></mrow><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>+</mo><msqrt><mn>2</mn></msqrt></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>-</mo><msqrt><mn>2</mn></msqrt><mo>&#160;</mo><mo>(</mo></math>Neglected as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#946;</mi><mn>2</mn></msup></math>&nbsp;is positive<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "648b5a73417cc3fb48d693a3", "title": "Normal to ellipse", "totalQuestions": 13, "questions": [{"_id": "6557bd3fd43b5ec151ee54b1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6494", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 1)", "title": "JEE Main 2023 (13 Apr Shift 1)"}], "question": {"text": "<p>Let the tangent and normal at the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt><mo>,</mo><mn>1</mn></mrow></mfenced></math> on the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>36</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;meet the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo></math>axis at the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;respectively. Let the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;be drawn taking&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;as a diameter and the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>2</mn><msqrt><mn>5</mn></msqrt></math>&nbsp;intersect&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;at the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>.</mo></math>&nbsp;If the tangents at the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;on the circle intersect at the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi></mrow></mfenced><mo>,</mo></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><msup><mi>&#946;</mi><mn>2</mn></msup></math>&nbsp;is equal to&nbsp;</p>", "image": null}, "options": [{"id": "3Ey2k", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>61</mn></math>", "image": null, "isCorrect": false}, {"id": "YDtD8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn></math>", "image": null, "isCorrect": false}, {"id": "YxdBX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>304</mn><mn>5</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "tsscg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>314</mn><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>36</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>Observe that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt><mo>,</mo><mn>1</mn></mrow></mfenced></math>&nbsp;lies on the given ellipse.</p><p>Equation of tangent to the ellipse at the given point is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>:</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt><mi>x</mi></mrow><mn>36</mn></mfrac><mo>+</mo><mfrac><mi>y</mi><mn>4</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>x</mi></mrow><mn>12</mn></mfrac><mo>+</mo><mfrac><mi>y</mi><mn>4</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>Equation of normal passing through same point will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>:</mo><mfrac><mrow><mi>x</mi><mo>-</mo><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mn>36</mn></mfrac></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow><mfrac><mn>1</mn><mn>4</mn></mfrac></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>12</mn><mi>x</mi><mo>-</mo><mn>36</mn><msqrt><mn>3</mn></msqrt></mrow><msqrt><mn>3</mn></msqrt></mfrac><mo>=</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mi>x</mi><mo>-</mo><mn>9</mn><msqrt><mn>3</mn></msqrt><mo>=</mo><msqrt><mn>3</mn></msqrt><mi>y</mi><mo>-</mo><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mi>x</mi><mo>-</mo><msqrt><mn>3</mn></msqrt><mi>y</mi><mo>=</mo><mn>8</mn><msqrt><mn>3</mn></msqrt></math></p><p>Now tangent and normal&nbsp;intersects the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo></math>axis at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;respectively.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><mn>0</mn><mo>,</mo><mn>4</mn></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>B</mi><mfenced><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>8</mn></mrow></mfenced></math></p><p>Equation of circle with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;as diameter will be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>-</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><msub><mi>x</mi><mn>2</mn></msub></mrow></mfenced><mo>+</mo><mfenced><mrow><mi>y</mi><mo>-</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced><mfenced><mrow><mi>y</mi><mo>-</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>&#8658;</mtext><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi>y</mi><mo>-</mo><mn>4</mn><mo>)</mo><mo>(</mo><mi>y</mi><mo>+</mo><mn>8</mn><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p>Line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>2</mn><msqrt><mn>5</mn></msqrt></math>&nbsp;intersects the circle.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>20</mn><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>32</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>(</mo><mi>y</mi><mo>+</mo><mn>6</mn><mo>)</mo><mo>(</mo><mi>y</mi><mo>-</mo><mn>2</mn><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p>Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>,</mo><mo>-</mo><mn>6</mn><mo>)</mo><mo>&#160;&#160;</mo><mi>Q</mi><mo>(</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>,</mo><mn>2</mn><mo>)</mo></math></p><p>Now let us find the equation of tangents to the circle at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>,</mo><mi>Q</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>T</mi><mo>:</mo><mi>x</mi><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mi>y</mi><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><msub><mi>y</mi><mn>1</mn></msub><mo>-</mo><mn>32</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mn>1</mn></msub><mo>:</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mi>x</mi><mo>-</mo><mn>6</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>12</mn><mo>-</mo><mn>32</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>44</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mn>1</mn></msub><mo>:</mo><msqrt><mn>5</mn></msqrt><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>22</mn><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>:</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>4</mn><mo>-</mo><mn>32</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>28</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>:</mo><msqrt><mn>5</mn></msqrt><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>14</mn><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>ii</mi></mfenced></math></p><p>From&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>ii</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mfrac><mn>18</mn><msqrt><mn>5</mn></msqrt></mfrac><mo>&#160;&#160;</mo><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>-</mo><msup><mi>&#946;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>304</mn><mn>5</mn></mfrac></math></p><p>Hence this is the required option.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "c39656ef68374bedba319d0fe6894350", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/4t1wUuq42Rjsg.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/4t1wUuq42Rjsg.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6494", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 1)", "title": "JEE Main 2023 (13 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557bd40d43b5ec151ee54b2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}], "question": {"text": "If the radius of the largest circle with centre <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>)</mo></math> inscribed in the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>36</mn></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>, then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><msup><mi>r</mi><mn>2</mn></msup></math>&nbsp;is equal to&nbsp;", "image": null}, "options": [{"id": "ZXGOB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>115</mn></math>", "image": null, "isCorrect": false}, {"id": "5Mm39", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>92</mn></math>", "image": null, "isCorrect": true}, {"id": "VVJfE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>69</mn></math>", "image": null, "isCorrect": false}, {"id": "TJT0A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>72</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given equation of ellipse is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>36</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>9</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>It is of the form&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math></p><p>With&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>6</mn><mo>,</mo><mo>&#160;</mo><mi>b</mi><mo>=</mo><mn>3</mn></math>.</p><p>The centre of the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mfenced><mrow><mn>2</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>.</p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mi>a</mi><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mi>b</mi><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math>&nbsp;be the common point for ellipse and circle.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8801;</mo><mfenced><mrow><mn>6</mn><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mn>3</mn><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math></p><p>Equation of normal to the ellipse will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>a</mi><mi>x</mi></mrow><mrow><mi>cos</mi><mi>&#952;</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>b</mi><mi>y</mi></mrow><mrow><mi>sin</mi><mstyle displaystyle=\"true\"><mi>&#952;</mi></mstyle></mrow></mfrac><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mi>x</mi><mi>sec&#952;</mi><mo>-</mo><mn>3</mn><mi>y</mi><mi>cosec&#952;</mi><mo>=</mo><mn>36</mn><mo>-</mo><mn>9</mn></math></p><p>But the normal through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;passes through the centre of the circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mfenced><mrow><mn>2</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mfenced><mn>2</mn></mfenced><mi>sec&#952;</mi><mo>-</mo><mn>3</mn><mfenced><mn>0</mn></mfenced><mi>cosec&#952;</mi><mo>=</mo><mn>27</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>sec&#952;</mi><mo>=</mo><mfrac><mn>27</mn><mn>12</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>4</mn><mn>9</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><msqrt><mn>65</mn></msqrt><mn>9</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8801;</mo><mfenced><mrow><mn>6</mn><mo>&#215;</mo><mfrac><mn>4</mn><mn>9</mn></mfrac><mo>,</mo><mn>3</mn><mo>&#215;</mo><mfrac><msqrt><mn>65</mn></msqrt><mn>9</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8801;</mo><mfenced><mrow><mfrac><mn>8</mn><mn>3</mn></mfrac><mo>,</mo><mfrac><msqrt><mn>65</mn></msqrt><mn>3</mn></mfrac></mrow></mfenced></math></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>P</mi><mo>=</mo><mi>r</mi><mo>=</mo><msqrt><msup><mfenced><mrow><mn>2</mn><mo>-</mo><mfrac><mn>8</mn><mn>3</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mn>0</mn><mo>-</mo><mfrac><msqrt><mn>65</mn></msqrt><mn>3</mn></mfrac></mrow></mfenced><mn>2</mn></msup></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>69</mn><mn>9</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>12</mn><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>12</mn><mo>&#215;</mo><mfrac><mn>69</mn><mn>9</mn></mfrac><mo>=</mo><mn>92</mn></math></p><p>Therefore, the required answer is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>92</mn></math></p>", "image": null}, "videoSolution": {"videoId": "dc75f5a0f46448818abc28c97e480044", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/1MM3j7mlPzIAX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/1MM3j7mlPzIAX.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabusButGoodToSolve", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6557bd3dd43b5ec151ee54b0", "previousYearPapers": [{"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> be the largest circle centred at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math> and inscribed in the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>36</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>16</mn></mfrac><mo>=</mo><mn>1</mn></math>. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mi>&#945;</mi></mrow></mfenced></math>&nbsp;lies on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><msup><mi>&#945;</mi><mn>2</mn></msup></math>&nbsp;is equal to ______</p>", "image": null}, "options": [], "correctValue": "118", "solution": {"text": "<p>Given:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>36</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>16</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>Let any point on the ellipse be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mn>6</mn><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mo>&#160;</mo><mn>4</mn><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math>.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5c57cd7a-c11f-49bb-b866-14d7d979bbda-9893882.PNG\" style=\"width: 400px; height: 186px;\" /></p><p>Equation of normal of ellipse&nbsp;at&nbsp;any point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>sec</mi><mi>&#952;</mi><mi>x</mi><mo>&#8211;</mo><mn>2</mn><mi>cosec</mi><mi>&#952;</mi><mi>y</mi><mo>=</mo><mn>10</mn></math></p><p>This normal is also the normal of the circle passing through the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi>sec</mi><mi>&#952;</mi><mo>=</mo><mn>10</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mn>0</mn></math> (Not possible)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>3</mn><mn>5</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>4</mn><mn>5</mn></mfrac></math>&nbsp;</p><p>So, point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8801;</mo><mfenced><mrow><mfrac><mn>18</mn><mn>5</mn></mfrac><mo>,</mo><mfrac><mn>16</mn><mn>5</mn></mfrac></mrow></mfenced></math>.</p><p>So, the largest radius of circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfrac><msqrt><mn>320</mn></msqrt><mn>5</mn></mfrac><mo>=</mo><msqrt><mfrac><mn>64</mn><mn>5</mn></mfrac></msqrt></math></p><p>So the equation of circle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>64</mn><mn>5</mn></mfrac></math></p><p>This circle is passing through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mi>&#945;</mi></mrow></mfenced></math>, hence</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>64</mn><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#945;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>59</mn><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>10</mn><msup><mi>&#945;</mi><mn>2</mn></msup><mo>=</mo><mn>118</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67283", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 1)", "title": "JEE Main 2021 (25 Feb Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the curves, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mi>a</mi></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mi>b</mi></mfrac><mo>=</mo><mn>1</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mi>c</mi></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mi>d</mi></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;intersect each other at an angle of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>90</mn><mo>&#176;</mo></msup><mo>,</mo></math>&nbsp;then which of the following relations is TRUE?", "image": null}, "options": [{"id": "bgZVB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>-</mo><mi>c</mi><mo>=</mo><mi>b</mi><mo>+</mo><mi>d</mi></math>", "isCorrect": false, "image": null}, {"id": "V9yeL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>-</mo><mi>b</mi><mo>=</mo><mi>c</mi><mo>-</mo><mi>d</mi></math>", "isCorrect": true, "image": null}, {"id": "NEdxM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>+</mo><mi>b</mi><mo>=</mo><mi>c</mi><mo>+</mo><mi>d</mi></math>", "isCorrect": false, "image": null}, {"id": "zars9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>b</mi><mo>=</mo><mfrac><mrow><mi>c</mi><mo>+</mo><mi>d</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given curves, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mi>a</mi></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mi>b</mi></mfrac><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>On differentiating equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>x</mi></mrow><mi>a</mi></mfrac><mo>+</mo><mfrac><mrow><mn>2</mn><mi>y</mi></mrow><mi>b</mi></mfrac><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi>x</mi><mi>b</mi></mrow><mrow><mi>y</mi><mi>a</mi></mrow></mfrac><mo>&#160;</mo><mo>.</mo>
