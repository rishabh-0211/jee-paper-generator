mi>&#952;</mi><mo>-</mo><msqrt><mn>3</mn></msqrt><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">cosec</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi><mo>=</mo><mn>1</mn></mrow></mrow></mrow></mrow></math> for the given ellipse.<br />Now, this normal is parallel to <math><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>5</mn></math>.<br /><math><mo>&#8658;</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow><mrow><msqrt><mn>3</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">cosec</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow></mfrac><mo>=</mo><mo>-</mo><mn>2</mn><mo>&#8658;</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi><mo>=</mo><mo>-</mo><msqrt><mn>3</mn></msqrt></mrow></mrow><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mo>-</mo><mfrac><mrow><mi>&#960;</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math><br />Hence point <math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi><mo>,</mo><mi>&#160;</mi><mi>b</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow></mrow></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math> or <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>&#160;</mi><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math><br />Tangent at <math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math> is <math><mfrac><mrow><mi>x</mi><mo>.</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mo>.</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><math><mo>&#8658;</mo><mo>-</mo><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>4</mn></math> which also passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi>&#160;</mi><mn>4</mn></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mi>Q</mi><mo>=</mo><msqrt><msup><mfenced><mrow><mn>4</mn><mo>&#177;</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mn>4</mn><mo>&#8723;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mfrac><mrow><mn>5</mn><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mo>.</mo></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66678", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The tangent and normal to the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>32</mn></math> at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2</mn></mrow></mfenced></math> meet the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>, respectively. Then the area (in sq. units) of the triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mi>R</mi></math> is:", "image": null}, "options": [{"id": "2au7b", "text": "<math><mfrac><mrow><mn>68</mn></mrow><mrow><mn>15</mn></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "puiHA", "text": "<math><mfrac><mrow><mn>16</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "s8prG", "text": "<math><mfrac><mrow><mn>14</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "nWRfV", "text": "<math><mfrac><mrow><mn>34</mn></mrow><mrow><mn>15</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The equation of tangent and normal to the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;at a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced></math>&nbsp;are respectively&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><msub><mi>x</mi><mn>1</mn></msub></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><msub><mi>y</mi><mn>1</mn></msub></mrow><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>a</mi><mn>2</mn></msup><mi>x</mi></mrow><msub><mi>x</mi><mn>1</mn></msub></mfrac><mo>-</mo><mfrac><mrow><msup><mi>b</mi><mn>2</mn></msup><mi>y</mi></mrow><msub><mi>y</mi><mn>1</mn></msub></mfrac><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup><mo>.</mo></math></p><p>The given ellipse is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>32</mn><mo>,</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8658;</mo><mfrac><mrow><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup></mrow><mn>32</mn></mfrac><mo>+</mo><mfrac><mrow><mn>5</mn><msup><mi>y</mi><mn>2</mn></msup></mrow><mn>32</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo></math></p><p>Hence, the tangent and normal to the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup></mrow><mn>32</mn></mfrac><mo>+</mo><mfrac><mrow><mn>5</mn><msup><mi>y</mi><mn>2</mn></msup></mrow><mn>32</mn></mfrac><mo>=</mo><mn>1</mn></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mi>&#160;</mi><mn>2</mn></mrow></mfenced></math>&nbsp;are respectively&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mi>x</mi></mrow><mn>32</mn></mfrac><mo>+</mo><mfrac><mrow><mn>5</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mi>y</mi></mrow><mn>32</mn></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>32</mn><mo>&#215;</mo><mi>x</mi></mrow><mrow><mn>3</mn><mo>&#215;</mo><mn>2</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>32</mn><mo>&#215;</mo><mi>y</mi></mrow><mrow><mn>5</mn><mo>&#215;</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mn>32</mn><mn>3</mn></mfrac><mo>-</mo><mfrac><mn>32</mn><mn>5</mn></mfrac></math></p><p>Hence, the tangent is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>5</mn><mi>y</mi><mo>=</mo><mn>16</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>And, the normal is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>4</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/717054f9-22df-480b-a017-0a7566a69206-image.png\" style=\"width: 405px; height: 365px;\" /></p><p>The point where the tangent meets the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis can be obtained by putting&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mo>&#8658;</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>0</mn><mo>=</mo><mn>16</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mn>16</mn><mn>3</mn></mfrac><mo>,</mo></math>&nbsp;thus the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>&#8801;</mo><mfenced><mrow><mfrac><mn>16</mn><mn>3</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced><mo>.</mo></math></p><p>Similarly, the point where the normal meets the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis, is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>4</mn><mn>5</mn></mfrac><mo>,</mo></math>&nbsp;thus the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>&#8801;</mo><mfenced><mrow><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced><mo>.</mo></math>&nbsp;</p><p>Tangent and normal intersect at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mn>2</mn><mo>,</mo><mi>&#160;</mi><mn>2</mn></mrow></mfenced><mo>,</mo></math>&nbsp;and the length of perpendicular from any point on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis is the absolute value of its <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-co-ordinate, hence&nbsp;the height of the triangle is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>&nbsp;units.</p><p>And, hence the required area is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>Q</mi><mi>R</mi></mrow></mfenced><mo>&#215;</mo><mi>h</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfenced separators=\"|\"><mrow><mfrac><mn>16</mn><mn>3</mn></mfrac><mo>-</mo><mfrac><mn>4</mn><mn>5</mn></mfrac></mrow></mfenced><mo>&#215;</mo><mn>2</mn><mo>=</mo><mfrac><mn>68</mn><mn>15</mn></mfrac></math>&nbsp;sq units.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T13:24:45.609Z"}, {"_id": "648b5a65417cc3fb48d662a9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}], "question": {"text": "If $\\beta$ is one of the angles between the normals to the ellipse, $x^2+3 y^2=9$ at the points $(3 \\cos \\theta, \\sqrt{3} \\sin \\theta)$ and $(-3 \\sin \\theta, \\sqrt{3} \\cos \\theta) ; \\in\\left(0, \\frac{\\pi}{2}\\right) ;$ then $\\frac{2 \\cot \\beta}{\\sin 2 \\theta}$ is equal to", "image": null}, "options": [{"id": "1zuLk", "text": "\n$\\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "D1KsY", "text": "\n$\\frac{2}{\\sqrt{3}}$\n", "image": null, "isCorrect": true}, {"id": "vGmsd", "text": "\n$\\frac{1}{\\sqrt{3}}$\n", "image": null, "isCorrect": false}, {"id": "bJA8j", "text": "\n$\\frac{\\sqrt{3}}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, $x^2+3 y^2=9$\n$$\n\\begin{aligned}\n&\\Rightarrow 2 x+6 y \\frac{d y}{d x}=0 \\\\\n&\\Rightarrow \\frac{d y}{d x}=\\frac{-x}{3 y}\n\\end{aligned}\n$$\nSlope of normal is $-\\frac{d x}{d y}=\\frac{3 y}{x}$\n$$\n\\begin{gathered}\n\\Rightarrow\\left(-\\frac{d y}{d x}\\right)(3 \\cos \\theta, \\sqrt{3} \\sin \\theta) \\\\\n=\\frac{3 \\sqrt{3} \\sin \\theta}{3 \\cos \\theta}=\\sqrt{3} \\tan \\theta=m_{\\mathrm{l}} \\\\\n\\&\\left(-\\frac{d x}{d y}\\right)(-3 \\sin \\theta, \\sqrt{3} \\cos \\theta) \\\\\n=\\frac{3 \\sqrt{3} \\cos \\theta}{-3 \\sin \\theta}=-\\sqrt{3} \\cot \\theta=m_2\n\\end{gathered}\n$$\nAs, $\\beta$ is the anagle between the normals to the given ellipse then\n$$\n\\begin{aligned}\n&\\tan \\beta=\\left|\\frac{m_1-m_2}{1+m_1 m_2}\\right| \\\\\n&=\\left|\\frac{\\sqrt{3} \\tan \\theta+\\sqrt{3} \\cot \\theta}{1-3 \\tan \\theta \\cot \\theta}\\right| \\\\\n&=\\left|\\frac{\\sqrt{3} \\tan \\theta+\\sqrt{3} \\cot \\theta}{1-3}\\right|\n\\end{aligned}\n$$\nSo, $\\tan \\beta=\\frac{\\sqrt{3}}{2}|\\tan \\theta+\\cot \\theta|$\n$$\n\\begin{aligned}\n&\\Rightarrow \\quad \\frac{1}{\\cot \\beta}=\\frac{\\sqrt{3}}{2}\\left|\\frac{\\sin \\theta}{\\cos \\theta}+\\frac{\\cos \\theta}{\\sin \\theta}\\right| \\\\\n&\\Rightarrow \\quad \\frac{1}{\\cot \\beta}=\\frac{\\sqrt{3}}{2}\\left|\\frac{1}{\\sin \\theta \\cos \\theta}\\right| \\\\\n&\\Rightarrow \\quad \\frac{1}{\\cot \\beta}=\\frac{\\sqrt{3}}{\\sin 2 \\theta} \\Rightarrow \\frac{2 \\cot \\beta}{\\sin 2 \\theta}=\\frac{2}{\\sqrt{3}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d10", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}], "question": {"text": "A point on the ellipse, $4 x^2+9 y^2=36$, where the normal is parallel to the line, $4 x-2 y-5=0$, is :", "image": null}, "options": [{"id": "rZCUQ", "text": "\n$\\left(\\frac{9}{5}, \\frac{8}{5}\\right)$\n", "image": null, "isCorrect": false}, {"id": "z1l4H", "text": "\n$\\left(\\frac{8}{5},-\\frac{9}{5}\\right)$\n", "image": null, "isCorrect": false}, {"id": "ws0yd", "text": "\n$\\left(-\\frac{9}{5}, \\frac{8}{5}\\right)$\n", "image": null, "isCorrect": true}, {"id": "clc6I", "text": "\n$\\left(\\frac{8}{5}, \\frac{9}{5}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given ellipse is $4 x^2+9 y^2=36$\n$$\n\\Rightarrow \\frac{x^2}{9}+\\frac{y^2}{4}=1\n$$\nNormal at the point is parallel to the line\n$$\n4 x-2 y-5=0\n$$\nSlope of normal $=2$\nSlope of tangent $=\\frac{-1}{2}$\nPoint of contact to ellipse $\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$\nand line is $\\left(\\frac{a^2 m}{\\sqrt{a^2 m^2+b^2}}, \\frac{b}{\\sqrt{a^2 m^2+b^2}}\\right)$\nNow, $a^2=9, b^2=4$\n$$\n\\therefore \\quad \\text { Point }=\\left(\\frac{-9}{5}, \\frac{8}{5}\\right)\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65aeb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "The normal at $\\left(2, \\frac{3}{2}\\right)$ to the ellipse, $\\frac{x^2}{16}+\\frac{y^2}{3}=1$ touches a parabola, whose equation is", "image": null}, "options": [{"id": "3QSu1", "text": "\n$y^2=-104 x$\n", "image": null, "isCorrect": true}, {"id": "Ip8nZ", "text": "\n$y^2=14 x$\n", "image": null, "isCorrect": false}, {"id": "COwDZ", "text": "\n$y^2=26 x$\n", "image": null, "isCorrect": false}, {"id": "4oFzG", "text": "\n$y^2=-14 x$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ellipse is $\\frac{x^2}{16}+\\frac{y^2}{3}=1$\nNow, equation of normal at $(2,3 / 2)$ is\n$$\n\\begin{aligned}\n& \\frac{16 x}{2}-\\frac{3 y}{3 / 2}=16-3 \\\\\n& \\Rightarrow \\quad 8 x-2 y=13 \\\\\n& \\Rightarrow \\quad y=4 x-\\frac{13}{2}\n\\end{aligned}\n$$\nLet $y=4 x-\\frac{13}{2}$ touches a parabola $y^2=4 a x$.\nWe know, a straight line $y=m x+c$ touches a parabola $y^2=4 a x$ if $a-m c=0$\n$$\n\\therefore \\quad a-(4)\\left(-\\frac{13}{2}\\right)=0 \\Rightarrow a=-26\n$$\nHence, required equation of parabola is $y^2=4(-26) x=-104 x$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, mo>+</mo><mn>8</mn><msqrt><mn>5</mn></msqrt></mrow><mn>35</mn></mfrac></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Let equation of tangents to the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mstyle displaystyle=\"true\"><mfrac><mn>5</mn><mn>2</mn></mfrac></mstyle></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mstyle displaystyle=\"true\"><mfrac><mn>5</mn><mn>3</mn></mfrac></mstyle></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;be&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><msqrt><mfrac><mn>5</mn><mn>2</mn></mfrac><msup><mrow><mo>&#160;</mo><mi>m</mi></mrow><mn>2</mn></msup><mo>+</mo><mfrac><mn>5</mn><mn>3</mn></mfrac></msqrt></math></p><p>Since the tangents pass through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>, so&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>=</mo><mi>m</mi><mo>&#177;</mo><msqrt><mfrac><mrow><mn>15</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>10</mn></mrow><mn>6</mn></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>9</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>36</mn><mi>m</mi><mo>-</mo><mn>44</mn><mo>=</mo><mn>0</mn></math></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>&nbsp;be the angle between the tangents, so&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&#952;</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>-</mo><msub><mi>m</mi><mn>2</mn></msub></mrow><mrow><mn>1</mn><mo>+</mo><msub><mi>m</mi><mn>1</mn></msub><msub><mrow><mo>&#160;</mo><mi>m</mi></mrow><mn>2</mn></msub></mrow></mfrac></mfenced></math></p><p>i.e.&nbsp;<math xmlns=\"http:/ t)$, then $\\alpha+\\beta$ is equal to :", "image": null}, "options": [{"id": "tPM8W", "text": "58", "image": null, "isCorrect": true}, {"id": "drUC5", "text": "46", "image": null, "isCorrect": false}, {"id": "k3E9V", "text": "37", "image": null, "isCorrect": false}, {"id": "kzGa4", "text": "72", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/nGmTmZywgw-6gPr6nZXNJQp7btkkJa_WBQP-uhL4sRs.original.fullsize.png\"><br>\n\n\n\n\nEquation of chord T $=\\mathrm{S}_1$\n$\\begin{aligned}\n& \\frac{5}{2}\\left(\\frac{x}{9}\\right)+\\frac{1}{2}\\left(\\frac{\\mathrm{y}}{4}\\right)=\\frac{25}{36}+\\frac{1}{16} \\\\\n& \\Rightarrow \\frac{5 \\mathrm{x}}{18}+\\frac{\\mathrm{y}}{8}=\\frac{100+9}{144}=\\frac{109}{144} \\\\\n& \\Rightarrow 40 \\mathrm{x}+18 \\mathrm{y}=109 \\\\\n& \\Rightarrow \\alpha=40, \\beta=18 \\\\\n& \\Rightarrow \\alpha+\\beta=58\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "fbb17f5dde3b44478668464c4496538c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/vGWKLR79YbgOW.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/vGWKLR79YbgOW.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eec3c8b73881fdaea2ae", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67 1998/Math/MathML\"><mo>&#8658;</mo></math>Minor axis&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi><mo>=</mo><mn>2</mn><mi>b</mi><msqrt><mn>1</mn><mo>-</mo><msup><mi>e</mi><mn>2</mn></msup></msqrt><mo>=</mo><mn>3</mn><mo>.</mo><mfrac><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow><mn>3</mn></mfrac><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math></p><p><math><mo>&#8658;</mo></math> Equation of Locus of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;is :</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>8</mn></mfrac><mo>+</mo><mfrac><msup><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mn>9</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p><p>By simplifying&nbsp;the above equation, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>8</mn><msup><mi>y</mi><mn>2</mn></msup><mo>-</mo><mn>8</mn><mi>y</mi><mo>=</mo><mn>16</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 1)", "title": "JEE Main 2019 (08 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T13:19:30.765Z"}, {"_id": "648b5a64417cc3fb48d65e12", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "A stair-case of length $l$ rests against a vertical wall and a floor of a room. Let $\\mathrm{P}$ be a point on the stair-case, nearer to its end on the wall, that divides its length in the ratio $1: 2$. If the staircase begins to slide on the floor, then the locus of $\\mathrm{P}$ is:", "image": null}, "options": [{"id": "7bnon", "text": "\nan ellipse of eccentricity $\\frac{1}{2}$\n", "image": null, "isCorrect": false}, {"id": "llf6q", "text": "\nan ellipse of eccentricity $\\frac{\\sqrt{3}}{2}$\n", "image": null, "isCorrect": true}, {"id": "eSB32", "text": "\na circle of radius $\\frac{1}{2}$\n", "image": null, "isCorrect": false}, {"id": "TjJY9", "text": "\na circle of radius $\\frac{\\sqrt{3}}{2} l$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let point $\\mathrm{A}(a, 0)$ is on $x$-axis and $\\mathrm{B}$ $(0, b)$ is on $y$-axis.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/CRmJUuAvJFLCOy0AeYp0b8ot_C25sm2yyQKlD2LvENg.original.fullsize.png\"><br>\nLet $\\mathrm{P}(h, k)$ divides $\\mathrm{AB}$ in the ratio $1: 2$. So, by section formula\n$$\n\\begin{aligned}\n&h=\\frac{2(0)+1(a)}{1+2}=\\frac{a}{3} \\\\\n&k=\\frac{2(b)+1(0)}{3}=\\frac{2 b}{3} \\\\\n&\\Rightarrow a=3 h \\text { and } b=\\frac{3 k}{2}\n\\end{aligned}\n$$\nNow, $a^2+b^2=l^2$\n$$\n\\begin{aligned}\n&\\Rightarrow 9 h^2+\\frac{9 k^2}{4}=l^2 \\\\\n&\\Rightarrow \\frac{h^2}{\\left(\\frac{l}{3}\\right)^2}+\\frac{k^2}{\\left(\\frac{2 l}{3}\\right)^2}=1\n\\end{aligned}\n$$\nNow $\\mathrm{e}=\\sqrt{1-\\left(\\frac{l^2}{9} \\times \\frac{9}{4 l^2}\\right)}=\\sqrt{1-\\frac{1}{4}}=\\frac{\\sqrt{3}}{2}$\nThus, required locus of $\\mathrm{P}$ is an ellipse with eccentricity $\\frac{\\sqrt{3}}{2}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65bf3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "Equation of the line passing through the points of intersection of the parabola $x^2=8 y$ and the ellipse $\\frac{x^2}{3}+y^2=1$ is :", "image": null}, "options": [{"id": "c8T75", "text": "\n$y-3=0$\n", "image": null, "isCorrect": false}, {"id": "1guy6", "text": "\n$y+3=0$\n", "image": null, "isCorrect": false}, {"id": "CXesP", "text": "\n $3 y+1=0$\n", "image": null, "isCorrect": false}, {"id": "vMPrK", "text": "\n$3 y-1=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\nx^2=8 y\n$$\n$$\n\\frac{x^2}{3}+y^2=1\n$$\nFrom (i) and (ii),\n$$\n\\frac{8 y}{3}+y^2=1 \\Rightarrow y=-3, \\frac{1}{3}\n$$\nWhen $y=-3$, then $x^2=-24$, which is not possible.\nWhen $y=\\frac{1}{3}$, then $x=\\pm \\frac{2 \\sqrt{6}}{3}$\nPoint of intersection are\n$$\n\\left(\\frac{2 \\sqrt{6}}{3}, \\frac{1}{3}\\right) \\text { and }\\left(-\\frac{2 \\sqrt{6}}{3}, \\frac{1}{3}\\right)\n$$\nRequired equation of the line,\n$$\ny-\\frac{1}{3}=0 \\Rightarrow 3 y-1=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
