L\"><mi>x</mi><mo>-</mo></math>axis passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>, then the length of the latus rectum of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> is equal to", "image": null}, "options": [{"id": "zfIxy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "K1voD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mn>9</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "woEjo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>9</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "dWDov", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mn>5</mn></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>(</mo><mi>α</mi><mo>,</mo><mn>0</mn><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>(</mo><mn>0</mn><mo>,</mo><mi>β</mi><mo>)</mo></math> lies on the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>x</mi><mo>+</mo><mn>7</mn><mi>y</mi><mo>=</mo><mn>50</mn></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>5</mn><mfenced><mi>α</mi></mfenced><mo>+</mo><mn>7</mn><mfenced><mn>0</mn></mfenced><mo>=</mo><mn>50</mn><mo>,</mo><mo> </mo><mn>5</mn><mfenced><mn>0</mn></mfenced><mo>+</mo><mn>7</mn><mfenced><mi>β</mi></mfenced><mo>=</mo><mn>50</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>α</mi><mo>=</mo><mn>10</mn><mo>,</mo><mo> </mo><mi>β</mi><mo>=</mo><mfrac><mn>50</mn><mn>7</mn></mfrac></math></p><p>Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> divide the line segment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> internally in the ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>:</mo><mo> </mo><mn>3</mn></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>P</mi><mo>≡</mo><mfenced><mrow><mfrac><mrow><mn>7</mn><mo>×</mo><mn>0</mn><mo>+</mo><mn>3</mn><mo>×</mo><mn>10</mn></mrow><mrow><mn>7</mn><mo>+</mo><mn>3</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>7</mn><mo>×</mo><mstyle displaystyle=\"true\"><mfrac><mn>50</mn><mn>7</mn></mfrac></mstyle><mo>+</mo><mn>3</mn><mo>×</mo><mn>0</mn></mrow><mrow><mn>7</mn><mo>+</mo><mn>3</mn></mrow></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>P</mi><mo>≡</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>5</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mi>e</mi><mo>=</mo><mn>3</mn></math> as perpendicular from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>-</mo><mn>25</mn><mo>=</mo><mn>0</mn></math> is a directrix of the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>:</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mfrac><mn>25</mn><mn>3</mn></mfrac></math></p><p>We know that, directrix of an ellipse is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mo>±</mo><mfrac><mi>a</mi><mi>e</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>a</mi><mi>e</mi></mfrac><mo>=</mo><mfrac><mn>25</mn><mn>3</mn></mfrac></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5a249eda-1de0-4ae4-8ba4-967388bdee9b.png\" style=\"width: 200px; height: 147px;\"/></p><p>Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>e</mi><mo>=</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mo>=</mo><mn>5</mn><mo>,</mo><mo> </mo><mi>b</mi><mo>=</mo><mn>4</mn></math></p><p>Length of LR <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>2</mn><msup><mi>b</mi><mn>2</mn></msup></mrow><mi>a</mi></mfrac><mo>=</mo><mfrac><mn>32</mn><mn>5</mn></mfrac></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-12T11:57:02.533Z"}, {"_id": "6682bd3fba0e94a3c4025b75", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "If the length of the minor axis of ellipse is equal to half of the distance between the foci, then the eccentricity of the ellipse is :", "image": null}, "options": [{"id": "qpWxo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>5</mn></msqrt><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Szbbk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "oyiHB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math>", "image": null, "isCorrect": false}, {"id": "w2A7H", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><msqrt><mn>5</mn></msqrt></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The length of minor axis is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mi>b</mi></mrow></mfenced></math> and the distance between foci is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mi>a</mi><mi>e</mi></mrow></mfenced></math></p><p>Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>b</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>×</mo><mn>2</mn><mi>a</mi><mi>e</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>2</mn><mi>b</mi><mo>=</mo><mi>a</mi><mi>e</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>4</mn><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><msup><mi>e</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mn>4</mn><msup><mi>b</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><msup><mi>e</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>4</mn><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><msup><mi>e</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>4</mn><mo>-</mo><mn>4</mn><msup><mi>e</mi><mn>2</mn></msup><mo>=</mo><msup><mi>e</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>e</mi><mo>=</mo><mfrac><mn>2</mn><msqrt><mn>5</mn></msqrt></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T13:15:27.921Z"}, {"_id": "6682bd40ba0e94a3c4025b79", "type": "numerical", "level": 3, "questionLabels": [], "question": {"text": "If the points of intersection of two distinct conics <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>b</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>16</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math> lie on the curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msqrt><mn>3</mn></msqrt></math> times the area of the rectangle formed by the intersection points is _______.", "image": null}, "options": [], "correctValue": "432", "solution": {"text": "<p>Given conics are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>b</mi><mo> </mo><mtext>and</mtext><mo> </mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>16</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>.</p><p>The intersection point of these conics lie on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup></math>.</p><p>So, putting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">y</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup></math> in both the conics.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>b</mi><mo>,</mo><mo> </mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>16</mn></mfrac><mo>+</mo><mfrac><mrow><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup></mrow><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mi>b</mi><mo>,</mo><mo> </mo><mfrac><mi>b</mi><mn>16</mn></mfrac><mo>+</mo><mfrac><mrow><mn>3</mn><mi>b</mi></mrow><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>b</mi><mn>16</mn></mfrac><mo>+</mo><mfrac><mn>3</mn><mi>b</mi></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><mn>48</mn><mo>=</mo><mn>16</mn><mi>b</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>16</mn><mi>b</mi><mo>+</mo><mn>48</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><mi>b</mi><mo>-</mo><mn>4</mn><mi>b</mi><mo>+</mo><mn>48</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfenced><mrow><mi>b</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mfenced><mrow><mi>b</mi><mo>-</mo><mn>12</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>b</mi><mo>=</mo><mo> </mo><mn>4</mn><mo>,</mo><mo> </mo><mn>12</mn></math> ( <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mo>=</mo><mn>4</mn></math>is rejected because curves coincide)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">b</mi><mo>=</mo><mn>12</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mo>±</mo><msqrt><mn>12</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>12</mn><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>48</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>y</mi><mo>=</mo><mo>±</mo><mn>6</mn></math></p><p>Hence points of intersection are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>±</mo><msqrt><mn>12</mn></msqrt><mo>,</mo><mo>±</mo><mn>6</mn><mo>)</mo></math>.</p><p>So, length and breadth of rectangle are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>12</mn></msqrt><mo> </mo><mtext>and</mtext><mo> </mo><mn>12</mn></math>. </p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/12b8723e-aa3a-4ba1-96cb-94ab741d9dfa.png\" style=\"width: 400px; height: 235px;\"/></p><p>So, the area of rectangle is given by, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>2</mn><msqrt><mn>12</mn></msqrt><mo>×</mo><mn>12</mn><mo>=</mo><mn>48</mn><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mi>A</mi><mo>=</mo><mn>48</mn><msqrt><mn>3</mn></msqrt><mo>×</mo><mn>3</mn><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>3</mn><msqrt><mn>3</mn></msqrt><mi>A</mi><mo>=</mo><mn>432</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-12T12:11:06.238Z"}, {"_id": "648b5a71417cc3fb48d68756", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}], "question": {"text": "Let an ellipse with centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math>&nbsp;and latus rectum of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math> have its major axis along x-axis. If its minor axis subtends an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>60</mn><mo>&#8728;</mo></msup></math> at the foci, then the square of the sum of the lengths of its minor and major axes is equal to _______.", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<blockquote><p>Given,</p><p>An ellipse with centre <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math>&nbsp;and latus rectum of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math> have its major axis along x-axis&nbsp;</p><p>And its minor axis subtends an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>60</mn><mo>&#8728;</mo></msup></math> at the foci,&nbsp;</p><p>So, on plotting the diagram we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/12178a13-1713-4adc-91fc-6e84b5897480.png\" style=\"width: 340px; height: 256px;\" /></p><p>Now from diagram we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msup><mi>b</mi><mn>2</mn></msup></mrow><mi>a</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#8658;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mfrac><mi>a</mi><mn>4</mn></mfrac><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>tan</mi><msup><mn>30</mn><mo>&#8728;</mo></msup><mo>=</mo><mfrac><mi>b</mi><mrow><mi>a</mi><mi>e</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><msup><mfenced><mfrac><mi>b</mi><mrow><mi>a</mi><mi>e</mi></mrow></mfrac></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>=</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>a</mi><mn>2</mn></msup><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><msup><mi>b</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>Now from equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mn>2</mn></mfenced></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#8658;</mo><mi>b</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>2</mn><mi>a</mi><mo>+</mo><mn>2</mn><mi>b</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>9</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-10T13:02:26.332Z"}, {"_id": "648b5a71417cc3fb48d6863c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "<p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mfrac><mrow><mn>2</mn><msqrt><mn>3</mn></msqrt></mrow><msqrt><mn>7</mn></msqrt></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mn>6</mn><msqrt><mn>7</mn></msqrt></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mi>Q</mi><mo>,</mo><mo>&#160;</mo><mi>R</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;be four points on the&nbsp;ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mi> mlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msup><mi>b</mi><mn>2</mn></msup></mrow><mi>a</mi></mfrac><mo>=</mo><mn>4</mn></math>&nbsp;</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mfenced><mrow><mi>&#955;</mi><mo>+</mo><mn>5</mn></mrow></mfenced></mrow><mrow><mn>4</mn><mfenced><mstyle displaystyle=\"true\"><msqrt><mi>&#955;</mi><mo>+</mo><mn>5</mn></msqrt></mstyle></mfenced></mrow></mfrac><mo>=</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>2</mn><mfenced><mrow><mi>&#955;</mi><mo>+</mo><mn>5</mn></mrow></mfenced></mrow><mn>4</mn></mfrac><mo>=</mo><mn>4</mn><mfenced><msqrt><mi>&#955;</mi><mo>+</mo><mn>5</mn></msqrt></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>&#955;</mi><mo>+</mo><mn>5</mn></mrow></mfenced><mo>=</mo><mn>8</mn><mfenced><msqrt><mi>&#955;</mi><mo>+</mo><mn>5</mn></msqrt></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mrow><mi>&#955;</mi><mo>+</mo><mn>5</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>64</mn><mfenced><mrow><mi>&#955;</mi><mo>+</mo><mn>5</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#955;</mi><mn>2</mn></msup><mo>+</mo><mn>25</mn><mo>+</mo><mn>10</mn><mi>&#955;</mi><mo>=</mo><mn>64</mn><mfenced><mrow><mi>&#955;</mi><mo>+</mo><mn>5</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>&#955;</mi><mn>2</mn></msup><mo>-</mo><mn>54</mn><mi>&#955;</mi><mo>-</mo><mn>295</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#955;</mi><mo>=</mo><mn>59</mn><mo>&#160;</mo><mtext>or&#160;</mtext><mo>-</mo><mn>5</mn></math></p><p>But&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</m ext": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math> be a focal chord of the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi></math>&nbsp;such that it subtends an angle of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>&#960;</mi><mn>2</mn></mfrac></math>&nbsp;at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>. Let the line segment&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math> be also a focal chord of the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>:</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mrow><mo>&#160;</mo><mi>b</mi></mrow><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><msup><mi>a</mi><mn>2</mn></msup><mo>&#62;</mo><msup><mi>b</mi><mn>2</mn></msup></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi></math>&nbsp;is the eccentricity of the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>e</mi><mn>2</mn></msup></mfrac></math>&nbsp;is equal to", "image": null}, "options": [{"id": "VWGnU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><msqrt><mn>2</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "V5mqP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math>", "isCorrect": true, "image": null}, {"id": "g6Eck", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><mn>2</mn><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "xTTx2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>+</mo><mn>5</mn><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>&nbsp;is focal chord of the parabola&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math></p><p>so let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><msup><mi>t</mi><mn>2</mn></msup><mo>,</mo><mn>2</mn><mi>t</mi></mrow></mfenced></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mfenced><mrow><mfrac><mn>1</mn><msup><mi>t</mi><mn>2</mn></msup></mfrac><mo>,</mo><mo>-</mo><mfrac><mn>2</mn><mi>t</mi></mfrac></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mfenced><mrow><mn>3</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/776eae04-0033-4836-aebe-d3f047ae9fa8-image.png\" style=\"width: 295px; height: 270px;\" /></p><p>Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mrow><mi>P</mi><mi>R</mi></mrow></msub><mo>&#183;</mo><msub><mi>m</mi><mrow><mi>P</mi><mi>Q</mi></mrow></msub><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>t</mi></mrow><mrow><msup><mi>t</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mn>2</mn><mi>t</mi></mfrac></mstyle></mrow><mrow><mfrac><mn>1</mn><msup><mi>t</mi><mn>2</mn></msup></mfrac><mo>-</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><msup><mi>t</mi><mn>2</mn></msup><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mn>1</mn></math></p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>&nbsp;must be the&nbsp;latus rectum</p><p>We get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>Q</mi><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math></p><p>For ellipse</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msup><mi>b</mi><mn>2</mn></msup></mrow><mi>a</mi></mfrac><mo>=</mo><mn>4</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>a</mi><mi>e</mi><mo>=</mo><mn>1</mn></math></p><p>Also&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>a</mi><mo>=</mo><mn>1</mn><mo>+</mo><msqrt><mn>2</mn></msqrt></math></p><p>and<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msup><mi>e</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><mo>-</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math></p><p>Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>e</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mn>3</mn><mo>-</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>=</mo><mn>3</mn><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math></p>", "image": null}, "videoSolution": {"videoId": "f7eeed3add994898a5caa0a98f9c3337", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xXEcfOlBz8xhz.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xXEcfOlBz8xhz.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540d  "image": null}, {"id": "jpZnq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32</mn></math>", "isCorrect": false, "image": null}, {"id": "p5aED", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>34</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">a</mi><mo>&#62;</mo><mi mathvariant=\"normal\">b</mi></math></p><p>Now using&nbsp;eccentricity&nbsp;formula,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac></math></p><p>We get,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>16</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mn>16</mn></mfrac><mo>=</mo><mfrac><mn>15</mn><mn>16</mn></mfrac><mo>&#8658;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>15</mn><mn>16</mn></mfrac><msup><mi>a</mi><mn>2</mn></msup></math></p><p>Now again&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;is passing through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>4</mn><msqrt><mfrac><mn>2</mn><mn>5</mn></mfrac></msqrt><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;on satisfying the point we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>16</mn><mo>&#215;</mo><mfrac><mn>2</mn><mn>5</mn></mfrac></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mn>9</mn><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>32</mn><mrow><mn>5</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mn>9</mn><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math></p><p>Now putting the value&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>15</mn><mn>16</mn></mfrac><msup><mi>a</mi><mn>2</mn></msup></math>&nbsp;in above equation we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>32</mn><mrow><mn>5</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mn>9</mn><mrow><mfrac><mn>15</mn><mn>16</mn></mfrac><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>80</mn><mrow><mn>5</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mn>15</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mn>15</mn><mo>+</mo><mn>16</mn><mo>=</mo><mn>31</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T12:56:43.870Z"}, {"_id": "648b5a6c417cc3fb48d677d1", "previousYearPapers": [{"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let the maximum area of the triangle that can be inscribed in the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><mi>a</mi><mo>&#62;</mo><mn>2</mn></math>, having one of its vertices at one end of the major axis of the ellipse and one of its sides parallel to the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis, be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><msqrt><mn>3</mn></msqrt></math>. Then the eccentricity of the ellipse is:", "image": null}, "options": [{"id": "TigQq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "MufgE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "Q949E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math>", "isCorrect": false, "image": null}, {"id": "KVAHi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>3</mn></msqrt><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Plotting the diagram as per given information we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c5451a3c-6ae9-4abf-92ce-aaa54d867be9-image.png\" style=\"width: 250px; height: 187px;\" /></p><p>Now finding area of the triangle we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>a</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mi>cos</mi><mi>&#952;</mi></mrow></mfenced><mfenced><mrow><mn>4</mn><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">a</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mi>cos&#952;</mi></mrow></mfenced><mi>sin</mi><mi>&#952;</mi></math></p><p>Differentiating to get maxima and minima we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>dA</mi><mrow><mi mathvariant=\"normal\">d</mi><mi>&#952;</mi></mrow></mfrac><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">a</mi><mfenced><mrow><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi><mo>+</mo><mi>cos</mi><mi>&#952;</mi><mo>-</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#952;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>A</mi></mrow><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">d</mi><mi>&#952;</mi></mrow></mfrac><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mn>1</mn><mo>+</mo><mi>cos</mi><mi>&#952;</mi><mo>-</mo><mn>2</mn><msup><mi>cos</mi><mn>2</mn></msup><mi>&#952;</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mn>1</mn><mfenced><mi>Reject</mi></mfenced></math></p><p>OR</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mn>3</mn></mfrac></mat mn><mi>x</mi><mo>+</mo><mn>7</mn><mi>y</mi><mo>+</mo><mn>15</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "7NcHF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mn>7</mn><mi>y</mi><mo>+</mo><mn>29</mn><mo>=</mo><mn>0</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mn>7</mn><mi>y</mi><mo>-</mo><mn>7</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": true, "image": null}, {"id": "c5VHo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mn>7</mn><mi>y</mi><mo>-</mo><mn>39</mn><mo>=</mo><mn>0</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mn>7</mn><mi>y</mi><mo>-</mo><mn>7</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The reflected point of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>.</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0187573e-6468-4151-bb74-e8f5ec5fdf83-image.png\" style=\"width: 306px; height: 250px;\" /></p><p>Equation of reflected ray</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mfrac><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow><mrow><mn>5</mn><mo>+</mo><mn>2</mn></mrow></mfrac><mfenced><mrow><mi>x</mi><mo>+</mo><mn>2</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mfrac><mn>2</mn><mn>7</mn></mfrac><mfenced><mrow><mi>x</mi><mo>+</mo><mn>2</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>7</mn><mi>y</mi 53</mn></msqrt></mfrac><mo>=</mo><mfrac><mn>18</mn><msqrt><mn>53</mn></msqrt></mfrac></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mi>&#955;</mi><mo>-</mo><mn>11</mn></mrow><msqrt><mn>53</mn></msqrt></mfrac></mfenced><mo>=</mo><mfrac><mn>18</mn><msqrt><mn>53</mn></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>-</mo><mn>11</mn><mo>=</mo><mn>18</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>18</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>7</mn><mi>y</mi><mo>-</mo><mn>7</mn><mo>=</mo><mn>0</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>-</mo><mn>7</mn><mi>y</mi><mo>+</mo><mn>29</mn><mo>=</mo><mn>0</mn></math></p>", "image": null}, "videoSolution": {"videoId": "b3ad551da61349dd8b0bc02456071054", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/6YfAed332arl1.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/6YfAed332arl1.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf819", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 1)", "title": "JEE Main 2021 (27 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67349", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let an ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>:</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mrow><mo>&#160;</mo><mi>b</mi></mrow><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><msup><mi>a</mi><mn>2</mn></msup><mo>&#62;</mo><msup><mi>b</mi><mn>2</mn></msup></math>, passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt><mo>,</mo><mn>1</mn></mrow></mfenced></math> and has eccentricity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math>. If a circle, centered at focus <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>(</mo><mi>&#945;</mi><mo>,</mo><mn>0</mn><mo>)</mo><mo>,</mo><mi>&#945;</mi><mo>&#62;</mo><mn>0</mn></math>, of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><msqrt><mn>3</mn></msqrt></mfrac></math>, intersects <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> at two points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>Q</mi><mn>2</mn></msup></math> is equal to :", "image": null}, "options": [{"id": "28ezN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>8</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "2uLFF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "OP0Dv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>3</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "Y14Eb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;passes through the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt><mo>,</mo><mn>1</mn></mrow></mfenced></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mrow><mn>2</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>-</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>On solving equations&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>2</mn></mfenced></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>3</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>3</mn></mfenced></math></p><p>We know that, focii of the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#177;</mo><mi>a</mi><mi>e</mi><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math></p><p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>e</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Its focus is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>&#160;</mo><mfenced><mrow><mo>&#8757;</mo><mi>&#945;</mi><mo>&#62;</mo><mn>0</mn></mrow></mfenced></math></p><p>Now, equation of circle is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>x</mi><mo>-</mo><mn>1</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>4</mn></mfenced></math></p><p>Solving <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>3</mn></mfenced></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>4</mn></mfenced></math> we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mo>&#177;</mo><mfrac><mn>2</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>,</mo><mi>x</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><msup><mi>Q</mi><mn>2</mn></msup><mo>=</mo><msqrt><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mfrac><mn>2</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>+</mo><mfrac><mn>2</mn><msqrt><mn>3</mn></msqrt></mfrac></mrow></mfenced><mn>2</mn></msup></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mfenced><mfrac><mn>4</mn><msqrt><mn>3</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mfrac><mn>16</mn><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67188", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf816", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Jul Shift 1)", "title": "JEE Main 2021 (22 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub><mo>:</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mrow><mo>&#160;</mo><mi>b</mi></mrow><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>a</mi><mo>&#62;</mo><mi>b</mi><mo>.</mo></math>&nbsp;Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math> be another ellipse such that it touches the end points of major axis of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub></math> and the foci of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math> are the end points of minor axis of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub><mo>.</mo></math>&nbsp;If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math> have same eccentricities, then its value is:", "image": null}, "options": [{"id": "ABcg5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "l2uW0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>1</mn><mo>+</mo><msqrt><mn>8</mn></msqrt></mrow><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "thmxY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>1</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "SdCTZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>-</mo><mn>1</mn><mo>+</mo><msqrt><mn>6</mn></msqrt></mrow><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given&nbsp;ellipse is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub><mo>:</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>a</mi><mo>&#62;</mo><mi>b</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math>&nbsp;is another ellipse which touches the end points of the major axis&nbsp;of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub></math>&nbsp;and foci of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math>&nbsp;are at the minor axis of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub><mo>,</mo></math>&nbsp;thus the two ellipses are given by the following diagram.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f6b7d58e-5f54-4192-aa88-3c9e87da4e44-image.png\" style=\"width: 327px; height: 298px;\" /></p><p>Since, the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math>&nbsp;touches the major axis of the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub></math>, hence, the minor axis of the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mi>a</mi><mo>.</mo></math></p><p>Now, let the major axis of the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>b</mi><mn>1</mn></msub><mo>=</mo><mi>c</mi></math>&nbsp;and it is obvious from the diagram and the given conditions that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>b</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>a</mi><mn>1</mn></msub><mo>.</mo></math></p><p>We know that the eccentricity of an ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>A</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>B</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>A</mi><mo>&#62;</mo><mi>B</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>1</mn><mo>-</mo><mfrac><msup><mi>B</mi><mn>2</mn></msup><msup><mi>A</mi><mn>2</mn></msup></mfrac></msqrt><mo>.</mo></math></p><p>Thus, for the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub><mo>,</mo></math>&nbsp;we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac></msqrt></math>&nbsp;and for the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub><mo>,</mo></math>&nbsp;we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mn>1</mn></msub><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><msup><mi>c</mi><mn>2</mn></msup></mfrac></msqrt><mo>.</mo></math></p><p>Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><msub><mi>e</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>1</mn><mo>-</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac></msqrt><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><msup><mi>c</mi><mn>2</mn></msup></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mn>1</mn><mo>-</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><msup><mi>c</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><msup><mi>c</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><mfrac><msup><mi>a</mi><mn>4</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>c</mi><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><mi>b</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>Also, given that the foci of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math>&nbsp;are the end points of the minor axis of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub><mo>,</mo></math>&nbsp;thus&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mo>=</mo><mi>c</mi><mi>e</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>c</mi><mo>=</mo><mfrac><mi>b</mi><mi>e</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>From the above two equations, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>b</mi><mi>e</mi></mfrac><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><mrow><mo>&#160;</mo><mi>b</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>e</mi><mo>=</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac></math></p><p>Now, using the definition of eccentricity, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><msup><mi>e</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msup><mi>e</mi><mn>2</mn></msup><mo>+</mo><mi>e</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math></p><p>Now, applying the Sridharacharya&#39;s formula for the roots of a quadratic equation, i.e. if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>a</mi><mo>&#8800;</mo><mn>0</mn><mo>,</mo></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>b</mi><mo>&#177;</mo><msqrt><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi></msqrt></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac><mo>,</mo></math>&nbsp;we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn><mo>&#177;</mo><msqrt><msup><mn>1</mn><mn>2</mn></msup><mo>-</mo><mn>4</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced></msqrt></mrow><mrow><mn>2</mn><mo>&#215;</mo><mn>1</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>e</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn><mo>&#177;</mo><msqrt><mn>1</mn><mo>+</mo><mn>4</mn></msqrt></mrow><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>e</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn><mo>&#177;</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac></math></p><p>But, eccentricity can never be negative, hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf816", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-22T09:00:00.000Z", "isVisible": true, "shortName": "2  "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66b5d", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf804", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T09:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 1)", "title": "JEE Main 2020 (05 Sep Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the co-ordinates of two points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msqrt><mn>7</mn></msqrt><mo>,</mo><mn>0</mn><mo>)</mo></math> and&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>-</mo><msqrt><mn>7</mn></msqrt><mo>,</mo><mn>0</mn><mo>)</mo></math> respectively and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is any point on the conic,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>16</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>144</mn><mo>,</mo></math> then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>A</mi><mo>+</mo><mi>P</mi><mi>B</mi></math> is equal to :", "image": null}, "options": [{"id": "tFdSz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math>", "isCorrect": false, "image": null}, {"id": "UCuuC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "isCorrect": true, "image": null}, {"id": "HNmjs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "isCorrect": false, "image": null}, {"id": "w3Ybk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>For ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>16</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>9</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>Comparing with, standard equation of ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math>, we get&nbsp;&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>4</mn><mo>,</mo><mi>b</mi><mo>=</mo><mn>3</mn></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>e</mi><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac><mn>9</mn><mn>16</mn></mfrac></msqrt><mo>=</mo><mfrac><msqrt><mn>7</mn></msqrt><mn>4</mn></mfrac></math><br />Since,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> are foci</p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>A</mi><mo>+</mo><mi>P</mi><mi>B</mi><mo>=</mo><mn>2</mn><mi>a</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>4</mn><mo>=</mo><mn>8</mn></math>.</p>", "image": null}, "videoSolution": {"videoId": "f87a56d6952644d1b8cd1ccf8d87e4f4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Pf3drqc5tnnlt.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Pf3drqc5tnnlt.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": [ =\"http://www.w3.org/1998/Math/MathML\"><mn>135</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mn>2</mn><msup><mi>b</mi><mn>2</mn></msup></mrow><mi>a</mi></mfrac><mo>=</mo><mn>10</mn></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mtext>&#8201;&#8201;&#8201;</mtext><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mn>5</mn><mi>a</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mfenced><mi>t</mi></mfenced><mo>=</mo><mfrac><mn>5</mn><mn>12</mn></mfrac><mo>&#8722;</mo><mfenced><mrow><msup><mi>t</mi><mn>2</mn></msup><mo>-</mo><mi>t</mi><mo>+</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#8722;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><mn>5</mn><mn>12</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#8722;</mo><msup><mfenced><mrow><mi>t</mi><mo>&#8722;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#8722;</mo><msup><mfenced><mrow><mi>t</mi><mo>&#8722;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mn>2</mn></msup></math></p><p>max&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mfenced><mi>t</mi></mfenced><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>=</mo><mi>e</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mfenced><mrow><mn>1</mn><mo>&#8722;</mo><msup><mi>e</mi><mn>2</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>a</mi><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mfenced><mrow><mn>1</mn><mo>&#8722;</mo><mfrac><mn>4</mn><mn>9</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www. :00:00.000Z", "isVisible": true, "shortName": "2020 (07 Jan Shift 1)", "title": "JEE Main 2020 (07 Jan Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T13:36:22.875Z"}, {"_id": "648b5a67417cc3fb48d668a8", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 2)", "title": "JEE Main 2019 (12 Apr Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "An ellipse, with foci at <math><mfenced separators=\"|\"><mrow><mn>0,2</mn></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced><mi>&#160;</mi></math> and minor axis of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> , passes through which of the following points?", "image": null}, "options": [{"id": "bdKQ3", "text": "<math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi> </mi><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "FJ6oW", "text": "<math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi> </mi><msqrt><mn>2</mn></msqrt></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "Stn0k", "text": "<math><mfenced separators=\"|\"><mrow><msqrt><mn>2</mn></msqrt><mo>,</mo><mi> </mi><mn>2</mn></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "2k9qy", "text": "<math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi> </mi><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given that be <math><mo>=</mo><mn>2</mn></math> and <math><mi>a</mi><mo>=</mo><mn>2</mn></math>  <br/>(here <math><mi>a</mi><mo>&lt;</mo><mi>b</mi></math> ) <br/><math><mo>∵</mo><mtext> </mtext><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><msup><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></math>  <br/><math><mo>∴</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn></math>  <br/><math><mo>∴</mo></math> Equation of ellipse <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math>  <br/>Clearly <math><mfenced separators=\"|\"><mrow><msqrt><mn>2</mn></msqrt><mo>,</mo><mi> </mi><mn>2</mn></mrow></mfenced></math> lies on the ellipse.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 2)", "title": "JEE Main 2019 (12 Apr Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T12:19:28.092Z"}, {"_id": "648b5a66417cc3fb48d6645f", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "In an ellipse, with centre at the origin, if the difference of the lengths of major axis and minor axis is 10 and one of the foci is at <math><mfenced separators=\"|\"><mrow><mn>0,5</mn><msqrt><mn>3</mn></msqrt></mrow></mfenced><mo>,</mo></math> then the length of its latus rectum is:", "image": null}, "options": [{"id": "nJ8cc", "text": "<math><mn>6</mn></math>", "isCorrect": false, "image": null}, {"id": "uWsgX", "text": "<math><mn>10</mn></math>", "isCorrect": false, "image": null}, {"id": "qtoGO", "text": "<math><mn>8</mn></math>", "isCorrect": false, "image": null}, {"id": "1SDIk", "text": "<math><mn>5</mn></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7132e35b-1a2f-4178-9402-e85c68e9d11f-image3.jpeg\" /><br />Given, difference of the lengths of major and minor axis is <math><mn>10</mn></math>.<br /><math><mo>&#8658;</mo><mn>2</mn><mi>b</mi><mo>-</mo><mn>2</mn><mi>a</mi><mo>=</mo><mn>10</mn></math> &hellip; (1)<br />One of the focii is <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi>&#160;</mi><mn>5</mn><msqrt><mn>3</mn></msqrt></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>b</mi><mi>e</mi><mo>=</mo><mn>5</mn><msqrt><mn>3</mn></msqrt></math> &hellip; (2)<br />Also <math><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><msup><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></math> .......(3)<br /><math><mo>&#8658;</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>75</mn></math><br /><math><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>b</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mn>75</mn></math><br /><math><mo>&#8658;</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>=</mo><mn>15</mn></math> &hellip; (4)<br />From (1) and (4)<br /><math><mi>a</mi><mo>=</mo><mn>5</mn></math> and <math><mi>b</mi><mo>=</mo><mn>10</mn></math><br />Hence length of the latus rectum <math><mo>=</mo><mfrac><mrow><mn>2</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>b</mi></mrow></mfrac><mo>=</mo><mn>2</mn><mo>&#8901;</mo><mfrac><mrow><mn>25</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mn>5</mn></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T13:19:40.419Z"}, {"_id": "648b5a67417cc3fb48d66951", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7ef", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 2)", "title": "JEE Main 2019 (12 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>S</mi><mo>'</mo></msup></math> be the foci of an ellipse and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;be any one of the extremities of its minor axis. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><msup><mi>S</mi><mo>'</mo></msup><mi>B</mi><mi>S</mi></math> is a right angled triangle with right angle at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;and area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>&#916;</mi><msup><mi>S</mi><mo>'</mo></msup><mi>B</mi><mi>S</mi></mrow></mfenced><mo>=</mo><mn>8</mn><mo>&#160;</mo><mi>sq</mi><mo>.</mo><mi>units</mi></math>, then the length of a latus rectum of the ellipse is :", "image": null}, "options": [{"id": "Ny5Rm", "text": "<math><mn>2</mn><mi> </mi><msqrt><mn>2</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "8KvzT", "text": "<math><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "OUT9B", "text": "<math><mn>4</mn></math>", "isCorrect": true, "image": null}, {"id": "XbMY0", "text": "<math><mn>4</mn><msqrt><mn>2</mn></msqrt></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given that,&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9cf6e5d8-a3e8-4241-9967-4415b2e0bb4a-image.png\" style=\"width: 250px; height: 240px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#8736;</mi><mi>S</mi><mi>B</mi><msup><mi>S</mi><mo>'</mo></msup><mo>=</mo><mfrac><mi>&#960;</mi><mn>2</mn></mfrac></math></p><p><math><mo>&#8658;</mo><mi>&#8736;</mi><mi>O</mi><mi>B</mi><mi>S</mi><mo>=</mo><mfrac><mrow><mi>&#960;</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>b</mi><mo>=</mo><mi>a</mi><mi>e</mi><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math>&nbsp;</p><p>Also, area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#8710;</mo><mi>S</mi><mi>B</mi><msup><mi>S</mi><mo>'</mo></msup></mrow></mfenced><mo>=</mo><mn>8</mn></math>&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>.</mo><mn>2</mn><mi>a</mi><mi>e</mi><mo>.</mo><mi>b</mi><mo>=</mo><mn>8</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mi>e</mi><mi>b</mi><mo>=</mo><mn>8</mn><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math>&nbsp;</p><p>From equations <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math>,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mn>8</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><msup><mi>b</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup><msup><mi>e</mi><mn>2</mn></msup><mo>=</mo><mn>8</mn><mo>+</mo><mn>8</mn><mo>=</mo><mn>16</mn></math></p><p><math><mo>&#8658;</mo><mi>b</mi><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math> and <math><mi>a</mi><mo>=</mo><mn>4</mn></math></p><p>Thus, the length of the latus rectum is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msup><mi>b</mi><mn>2</mn></msup></mrow><mi>a</mi></mfrac><mo>=</mo><mfrac><mn>16</mn><mn>4</mn></mfrac><mo>=</mo><mn>4</mn></math>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7ef", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 2)", "title": "JEE Main 2019 (12 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T13:34:55.414Z"}, {"_id": "648b5a67417cc3fb48d667dd", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Let the length of the latus rectum of an ellipse with its major axis along $x$ -axis and centre at the origin, be 8 . If the distance between the foci of this ellipse is equal to the length of its minor axis, then which one of the following points lies on it?", "image": null}, "options": [{"id": "p2k3K", "text": "$(4 \\sqrt{2}, 2 \\sqrt{2})$", "isCorrect": false, "image": null}, {"id": "vwJ5e", "text": "$(4 \\sqrt{3}, 2 \\sqrt{2})$", "isCorrect": true, "image": null}, {"id": "YUxHR", "text": "$(4 \\sqrt{3}, 2 \\sqrt{3})$", "isCorrect": false, "image": null}, {"id": "tC1Uj", "text": "$(4 \\sqrt{2}, 2 \\sqrt{3})$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the ellipse be $\\frac{x^{2}}{a^{2}}+\\frac{y^{2}}{b^{2}}=1$\r\n\r\nThen, $\\frac{2 b^{2}}{a}=8,2 a e-b^{2}$ and $b^{2}=a^{3}\\left(1-e^{2}\\right)$\r\n\r\n$\\Rightarrow a=8, b^{2}=32$\r\n\r\nThen, the equation of the ellipse\r\n\r\n$\\frac{x^{2}}{64}+\\frac{y^{2}}{32}=1$\r\n\r\nHence, the point $(4 \\sqrt{3}, 2 \\sqrt{2})$ lies on the ellipse.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-10T12:11:36.480Z"}, {"_id": "648b5a67417cc3fb48d66736", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7eb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 2)", "title": "JEE Main 2019 (10 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mfenced open=\"{\" close=\"}\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></mfenced><mo>&#8712;</mo><msup><mi>R</mi><mn>2</mn></msup><mo>:</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mrow><mn>1</mn><mo>+</mo><mi>r</mi></mrow></mfrac><mo>-</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mrow><mn>1</mn><mo>-</mo><mi>r</mi></mrow></mfrac><mo>=</mo><mn>1</mn></mrow></mfenced><mo>,</mo></math> where <math><mi>r</mi><mo>&#8800;</mo><mo>&#177;</mo><mn>1</mn><mo>.</mo></math> Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> represents:", "image": null}, "options": [{"id": "HU8Kt", "text": "An ellipse whose eccentricity is <math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>r</mi><mo>+</mo><mn>1</mn></msqrt></mrow></mfrac><mo>,</mo></math> when <math><mi>r</mi><mo>&#62;</mo><mn>1</mn><mo>.</mo></math>", "isCorrect": false, "image": null}, {"id": "S3AzS", "text": "A hyperbola whose eccentricity is <math><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mi>r</mi><mo>+</mo><mn>1</mn></msqrt></mrow></mfrac><mo>,</mo></math> when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#60;</mo><mi>r</mi><mo>&#60;</mo><mn>1</mn><mo>.</mo></math>", "isCorrect": false, "image": null}, {"id": "0qK1Z", "text": "An ellipse whose eccentricity is  <math><msqrt><mfrac><mrow><mn>2</mn></mrow><mrow><mi>r</mi><mo>+</mo><mn>1</mn></mrow></mfrac></msqrt><mo>,</mo></math>  when  <math><mi>r</mi><mo>&gt;</mo><mn>1</mn></math>", "isCorrect": true, "image": null}, {"id": "zqBCv", "text": "A hyperbola whose eccentricity is  <math><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>1</mn><mo>-</mo><mi>r</mi></msqrt></mrow></mfrac><mo>,</mo></math>  when  <math><mn>0</mn><mo>&lt;</mo><mi>r</mi><mo>&lt;</mo><mn>1</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given&nbsp;<math><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>1</mn><mo>+</mo><mi>r</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>1</mn><mo>-</mo><mi>r</mi></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><br />If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math> then this curve is a hyperbola whose eccentricity is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>1</mn><mo>+</mo><mfrac><mrow><mn>1</mn><mo>-</mo><mi>r</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>r</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mn>2</mn><mrow><mi>r</mi><mo>+</mo><mn>1</mn></mrow></mfrac></msqrt></math>.&nbsp;<br /><br />If <math><mi>r</mi><mo>&#62;</mo><mn>1</mn></math> , then
