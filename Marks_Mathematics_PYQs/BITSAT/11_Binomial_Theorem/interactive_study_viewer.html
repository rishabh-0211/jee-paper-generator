{"id": "LAVcc", "text": "\r\n$252$\r\n", "isCorrect": true, "image": null}, {"id": "dqMYw", "text": "\r\n$210$\r\n", "isCorrect": false, "image": null}, {"id": "E3HME", "text": "\r\n$120$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, sum of the coefficient $=1024$\r\n$\\begin{array}{ll}\\text { i.e. } & 2^n=1024=2^{10} \\\\ \\Rightarrow & n=10\\end{array}$\r\nSince, $n$ is even, so greatest coefficient\r\n$={ }^n C_{n / 2}={ }^{10} C_5=252$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8336f5bfc7ab78aeb77", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 3, "question": {"text": "The number of terms in the expansion of $(1+5 \\sqrt{2} x)^9+(1-5 \\sqrt{2} x)^9$, is", "image": null}, "options": [{"id": "RUe2t", "text": "\r\n5\r\n", "isCorrect": true, "image": null}, {"id": "jj4Wj", "text": "\r\n7\r\n", "isCorrect": false, "image": null}, {"id": "nvdSA", "text": "\r\n9\r\n", "isCorrect": false, "image": null}, {"id": "1Lhor", "text": "\r\n10", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have,\r\n$(1+5 \\sqrt{2} x)^9+(1-5 \\sqrt{2} x)^9$\r\n$=2\\left\\{{ }^2 C_0+{ }^9 C_2(5 \\sqrt{2} x)^2+\\ldots+{ }^9 C_8(5 \\sqrt{2} x)^8\\right\\}$\r\nClearly, it has 5 terms.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8296f5bfc7ab78aeb23", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "Coefficient of $x^{13}$ in the expansion of $(1-x)^{5}\\left(1+x+x^{2}+x^{3}\\right)^{4}$ is", "image": null}, "options": [{"id": "CPaJL", "text": "4", "isCorrect": true, "image": null}, {"id": "zNyXA", "text": "6", "isCorrect": false, "image": null}, {"id": "5MI1K", "text": "32", "isCorrect": false, "image": null}, {"id": "qtooM", "text": "5", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Expression $=(1-x)^{5} \\cdot(1+x)^{4}\\left(1+x^{2}\\right)^{4}$\r\n\r\n$\\begin{array}{l}\r\n\r\n=(1-x)\\left(1-x^{2}\\right)^{4}\\left(1+x^{2}\\right)^{4} \\\\\r\n\r\n=(1-x)\\left(1-x^{4}\\right)^{4}\r\n\r\n\\end{array}$\r\n\r\n$\\therefore$ Coefficient of $x^{13}=-{ }^{4} \\mathrm{C}_{3}(-1)^{3}=4$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8286f5bfc7ab78aeb17", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "The coefficient of the term independent of $x$ in the expansion of $\\left(\\sqrt{\\frac{x}{3}}+\\frac{3}{2 x^{2}}\\right)^{10}$ is", "image": null}, "options": [{"id": "Okjuu", "text": "$\\frac{5}{4}$", "isCorrect": true, "image": null}, {"id": "94B0J", "text": "$\\frac{7}{4}$", "isCorrect": false, "image": null}, {"id": "NUUdl", "text": "$\\frac{9}{4}$", "isCorrect": false, "image": null}, {"id": "vO7s7", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The $(r+1)$ th term in the expansion of $\\left(\\sqrt{\\frac{x}{3}}+\\frac{3}{2 x^{2}}\\right)^{10}$ is given by\r\n\r\n$\\begin{array}{l}\r\n\r\n\\mathrm{T}_{r+1}={ }^{10} \\mathrm{C}_{r}\\left(\\sqrt{\\frac{x}{3}}\\right)^{10-r}\\left(\\frac{3}{2 x^{2}}\\right)^{r} \\\\\r\n\r\n={ }^{10} \\mathrm{C}_{r} \\frac{x^{5-\\left(\\frac{r}{2}\\right)}}{3^{5-\\left(\\frac{r}{2}\\right)}} \\cdot \\frac{3^{r}}{2^{r} x^{2 r}} \\\\\r\n\r\n={ }^{10} \\mathrm{C}_{r} \\frac{3^{\\left(\\frac{3 r}{2}\\right)-5}-5-\\left(\\frac{5 r}{2}\\right)}{2^{r}} x\r\n\r\n\\end{array}$\r\n\r\n$\\mathrm{T}_{r+1}={ }^{10} \\mathrm{C}_{r}\\left(\\sqrt{\\frac{x}{3}}\\right)^{10-r}\\left(\\frac{3}{2 x^{2}}\\right)^{r}$ $={ }^{10} \\mathrm{C}_{r} \\frac{x^{5-\\left(\\frac{r}{2}\\right)}}{3} \\cdot \\frac{3^{r}}{2^{r} x^{2 r}}$ $={ }^{10} \\mathrm{C}_{r} \\frac{3^{\\left(\\frac{3 r}{2}\\right)-5}-\\left(\\frac{5}{2}\\right)-\\left(\\frac{5 r}{2}\\right)}{2^{r}} x$ For $\\mathrm{T}_{r+1}$ to be independent of $x$, we must have $5-\\left(\\frac{5 r}{2}\\right)=0$ or $r=2$.\r\n\r\nThus, the 3 rd term is independent of $x$ and is equal to ${ }^{10} \\mathrm{C}_{2} \\frac{3^{3-5}}{2^{2}}=\\frac{10 \\times 9}{2} \\times \\frac{3^{-2}}{4}=\\frac{5}{4}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64 2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8676f5bfc7ab78aedca", "title": "Properties of Binomial Coefficients", "totalQuestions": 5, "questions": [{"_id": "67726cfec49e8ef28ee2b36e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "If the $17^{\\text {th }}$ and the $18^{\\text {th }}$ terms in the expansion of $(2+a)^{50}$ are equal, then the coefficient of $x^{35}$ in the expansion of $(a+x)^{-2}$ is", "image": null}, "options": [{"id": "gItO1", "text": "$-35$", "image": null, "isCorrect": false}, {"id": "mFJWO", "text": "$3$", "image": null, "isCorrect": false}, {"id": "N6lzg", "text": "$36$", "image": null, "isCorrect": false}, {"id": "09MvW", "text": "$-36$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, $17^{\\text {th }}$ and $18^{\\text {th }}$ terms in the expansion $(2+a)^{50}$ are equal\n$\\therefore T_{17}=T_{18}$\n$\\Rightarrow{ }^{50} C_{16}(2)^{34}(a)^{16}={ }^{50} C_{17}(2)^{33}(a)^{17}$\n$\\Rightarrow a=\\frac{{ }^{50} C_{16}}{{ }^{50} C_{17}} \\times 2=1$\n$\\therefore$ Now, coefficient of $x^{35}$ in the expansion\n$(1+x)^{-2}=-36$\n$\\because$ Coefficient of $x^r$ is $(r+1)$ in $(1-x)^{-2}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e81d6f5bfc7ab78aeab3", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "If a, b, c are three natural numbers in AP and a + $\\mathrm{b}+\\mathrm{c}=21$ then the possible number of values of the ordered triplet $(\\mathrm{a}, \\mathrm{b}, \\mathrm{c})$ is", "image": null}, "options": [{"id": "pHOF8", "text": "15", "isCorrect": false, "image": null}, {"id": "PsLS5", "text": "14", "isCorrect": false, "image": null}, {"id": "hgWPb", "text": "13", "isCorrect": true, "image": null}, {"id": "5OWqi", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\quad$ Let $a=b-d$ and $c=b+d$, then $a+b+c=21$ $\\Rightarrow \\mathrm{b}=7$\r\n\r\nSo, the equation is $\\mathrm{a}+\\mathrm{c}=14$\r\n\r\n$\\therefore$ No. of solution $=$ coeff. of $x^{14}$ in $\\left(x+x^{2}+\\ldots .\\right)$ $={ }^{13} \\mathrm{C}_{12}=13$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e46f5bfc7ab78ae8be", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The number of values of satisfying the equation ${ }^{39} \\mathrm{C}_{3 \\mathrm{r}-1}-{ }^{39} \\mathrm{C}_{\\mathrm{r}^{2}}={ }^{39} \\mathrm{C}_{\\mathrm{r}^{2}-1}-{ }^{39} \\mathrm{C}_{3 \\mathrm{r}}$ is", "image": null}, "options": [{"id": "OPbgI", "text": "1", "isCorrect": false, "image": null}, {"id": "NEjj6", "text": "2", "isCorrect": true, "image": null}, {"id": "N1DKv", "text": "3", "isCorrect": false, "image": null}, {"id": "unj6h", "text": "4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "${ }^{39} \\mathrm{C}_{3 \\mathrm{r}-1}-{ }^{39} \\mathrm{C}_{\\mathrm{r}^{2}}={ }^{39} \\mathrm{C}_{\\mathrm{r}^{2}-1}-{ }^{39} \\mathrm{C}_{3 \\mathrm{r}}$\r\n\r\n$\\Rightarrow{ }^{39} \\mathrm{C}_{3 \\mathrm{r}-1}+{ }^{39} \\mathrm{C}_{3 \\mathrm{r}}={ }^{39} \\mathrm{C}_{\\mathrm{r}^{2}-1}+{ }^{39} \\mathrm{C}_{\\mathrm{r}^{2}}$\r\n\r\n$\\Rightarrow{ }^{40} \\mathrm{C}_{3 \\mathrm{r}}={ }^{40} \\mathrm{C}_{\\mathrm{r}^{2}}$\r\n\r\n$\\Rightarrow \\mathrm{r}^{2}=3 \\mathrm{r}$ or $\\mathrm{r}^{2}=40-3 \\mathrm{r}$\r\n\r\n$\\Rightarrow \\mathrm{r}=0,3$ or -8,5\r\n\r\n3 and 5 are the values as the given equation is not defined by $r=0$ and $r=-8$. Hence, the number of values of $\\mathrm{r}$ is 2 .", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c36f5bfc7ab78ae7aa", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $\\mathrm{T}_{0}, \\mathrm{~T}_{1}, \\mathrm{~T}_{2} \\ldots \\ldots \\mathrm{T}_{\\mathrm{n}}$ represent the terms in the\r\n\r\nexpansion of $(x+a)^{n}$, then $\\left(\\mathrm{T}_{0}-\\mathrm{T}_{2}+\\mathrm{T}_{4}-\\ldots \\ldots .\\right)^{2}+$\r\n\r\n$\\left(\\mathrm{T}_{1}-\\mathrm{T}_{3}+\\mathrm{T}_{5}-\\ldots . .\\right)^{2}=$", "image": null}, "options": [{"id": "DPUKY", "text": "$\\left(x^{2}+a^{2}\\right)$", "isCorrect": false, "image": null}, {"id": "QGuzu", "text": "$\\left(x^{2}+a^{2}\\right)^{n}$", "isCorrect": true, "image": null}, {"id": "FqxWN", "text": "$\\left(x^{2}+a^{2}\\right)^{1 / n}$", "isCorrect": false, "image": null}, {"id": "KZ5Ps", "text": "$\\left(x^{2}+a^{2}\\right)^{-1 / n}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From the given condition, replacing $a$ by a and $-a i$ respectively, we get\r\n\r\n$(x+a i)^{n}=\\left(T_{0}-T_{2}+T_{4}-\\ldots \\ldots\\right)+i\\left(T_{1}-T_{3}+T_{5}-\\ldots .\\right)$ ...(i)\r\n\r\nand\r\n\r\n$(x-a i)^{n}=\\left(T_{0}-T_{2}+T_{4}-\\ldots \\ldots\\right)-i\\left(T_{1}-T_{3}+T_{5}-\\ldots\\right)$...(ii)\r\n\r\nMultiplying (ii) and\r\n\r\n(i) we get required result i.e.,\r\n\r\n$$\r\n\r\n\\left(x^{2}+a^{2}\\right)^{n}=\\left(T_{0}-T_{2}+T_{4}-\\ldots .\\right)^{2}+\\left(T_{1}-T_{3}+T_{5}-\\ldots\\right)^{2}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b56f5bfc7ab78ae72b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $\\mathrm{C}_{0}, \\mathrm{C}_{1}, \\mathrm{C}_{2}, \\ldots \\ldots \\ldots \\ldots . \\mathrm{C}_{\\mathrm{n}}$ denote the binomial\r\n\r\ncoefficientsin the expansion of $(1+\\mathrm{x})^{\\mathrm{n}}$, then the value of $\\mathrm{C}_{0}+\\left(\\mathrm{C}_{0}+\\mathrm{C}_{1}\\right)+\\left(\\mathrm{C}_{0}+\\mathrm{C}_{1}+\\mathrm{C}_{2}\\right)+\\ldots$\r\n\r\n$+\\left(C_{0}+C_{1}+\\ldots . .+C_{n-1}\\right)$", "image": null}, "options": [{"id": "0n2n8", "text": "$\\mathrm{n} \\cdot 2^{\\mathrm{n}-1}$", "isCorrect": true, "image": null}, {"id": "805CG", "text": "$\\mathrm{n} \\cdot 2^{\\mathrm{n}}$", "isCorrect": false, "image": null}, {"id": "34YJY", "text": "$(n-1) \\cdot 2^{n-1}$", "isCorrect": false, "image": null}, {"id": "pRP84", "text": "$(n-1) \\cdot 2^{n}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{C}_{0}+\\left(\\mathrm{C}_{0}+\\mathrm{C}_{1}\\right)+\\left(\\mathrm{C}_{0}+\\mathrm{C}_{1}+\\mathrm{C}_{2}\\right)+\\ldots \\ldots \\ldots \\ldots \\ldots \\\\ &+\\left(\\mathrm{C}_{0}+\\mathrm{C}_{1}+\\ldots \\ldots \\ldots . \\mathrm{C}_{\\mathrm{n}-1}\\right) \\\\ &=\\mathrm{n} \\mathrm{C}_{0}+(\\mathrm{n}-1) \\mathrm{C}_{1}+(\\mathrm{n}-2) \\mathrm{C}_{2}+\\ldots \\ldots \\mathrm{C}_{\\mathrm{n}-1} \\\\ &=\\mathrm{C}_{1}+2 \\mathrm{C}_{2}+3 \\mathrm{C}_{3}+4 \\mathrm{C}_{4} \\ldots \\ldots \\mathrm{n} \\mathrm{C}_{\\mathrm{n}}=\\mathrm{n} .2^{\\mathrm{n}-1} \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8676f5bfc7ab78aedcd", "title": "Sum of Series", "totalQuestions": 3, "questions": [{"_id": "64c0e80b6f5bfc7ab78aea18", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 3, "question": {"text": "If <math xmlns=\"http://www.w3.org/199 athML\"><mi>x</mi></math> is replaced by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>1</mn><mi>x</mi></mfrac></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mn>20</mn></msup><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>40</mn></munderover><mo>(</mo><mo>-</mo><mn>1</mn><msup><mo>)</mo><mi>r</mi></msup><msub><mi>a</mi><mi>r</mi></msub><msup><mfenced><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced><mi>r</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mi>x</mi><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mn>20</mn></msup><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>40</mn></munderover><mo>(</mo><mo>-</mo><mn>1</mn><msup><mo>)</mo><mi>r</mi></msup><msub><mi>a</mi><mi>r</mi></msub><msup><mi>x</mi><mrow><mn>40</mn><mo>-</mo><mi>r</mi></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>39</mn></munderover><msup><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced><mi>r</mi></msup><msub><mi>a</mi><mi>r</mi></msub><mo>&#183;</mo><msub><mi>a</mi><mrow><mi>r</mi><mo>+</mo><mn>1</mn></mrow></msub></math> is coefficient of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> in product of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>1</mn><mo>+</mo><mi>x</mi><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mn>20</mn></msup><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mn>20</mn></msup></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>1</mn><mo>+</mo><mi>x</mi><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mn>20</mn></msup><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mn>20</mn></msup><mo>=</mo><msup><mfenced><mrow><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mn>20</mn></msup></math></p><p>Here, there will be no term of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>.</p><p>Hence, the coefficient of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e80a6f5bfc7ab78aea11", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mn>10</mn></msup><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>20</mn></munderover><msub><mi>a</mi><mi>r</mi></msub><msup><mi>x</mi><mi>r</mi></msup></math>, then the value of $\\frac{a_{8}}{a_{12}},$ is", "image": null}, "options": [{"id": "6IDcC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "CcGhn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "isCorrect": true, "image": null}, {"id": "LaUdZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "isCorrect": false, "image": null}, {"id": "Ayv5Q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mn>10</mn></msup><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>20</mn></munderover><msub><mi>a</mi><mi>r</mi></msub><msup><mi>x</mi><mi>r</mi></msup></math></p><p>Replacing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mi>x</mi></mfrac></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mfrac><mn>8</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mn>6</mn><mi>x</mi></mfrac><mo>+</mo><mn>4</mn></mrow></mfenced><mn>10</mn></msup><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>20</mn></munderover><msub><mi>a</mi><mi>r</mi></msub><msup><mfenced><mfrac><mn>2</mn><mi>x</mi></mfrac></mfenced><mi>r</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mn>2</mn><mn>10</mn></msup><msup><mfenced><mrow><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mn>10</mn></msup><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>20</mn></munderover><msub><mi>a</mi><mi>r</mi></msub><msup><mn>2</mn><mi>r</mi></msup><msup><mi>x</mi><mrow><mn>20</mn><mo>-</mo><mi>r</mi></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msup><mn>2</mn><mn>10</mn></msup><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>20</mn></munderover><msub><mi>a</mi><mi>r</mi></msub><msup><mi>x</mi><mi>r</mi></msup><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><mn>20</mn></munderover><msub><mi>a</mi><mi>r</mi></msub><msup><mn>2</mn><mi>r</mi></msup><msup><mi>x</mi><mrow><mn>20</mn><mo>-</mo><mi>r</mi></mrow></msup></math></p><p>Comparing ccefficient of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>8</mn></msup></math> both sides, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>10</mn></msup><msub><mi>a</mi><mn>8</mn></msub><mo>=</mo><msub><mi>a</mi><mn>12</mn></msub><msup><mn>2</mn><mn>12</mn></msup><mo>&#8658;</mo><mfrac><msub><mi>a</mi><mn>8</mn></msub><msub><mi>a</mi><mn>12</mn></msub></mfrac><mo>=</mo><mfrac><msup><mn>2</mn><mn>12</mn></msup><msup><mn>2</mn><mn>10</mn></msup></mfrac><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e46f5bfc7ab78ae8bf", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 3, "question": {"text": "If $\\sum_{r=0}^{n} \\frac{r+2}{r+1}^{n} C_{r}=\\frac{2^{8}-1}{6},$ then $n=$", "image": null}, "options": [{"id": "02ybA", "text": "8", "isCorrect": false, "image": null}, {"id": "XG32I", "text": "4", "isCorrect": false, "image": null}, {"id": "aNC2I", "text": "6", "isCorrect": false, "image": null}, {"id": "H4iHH", "text": "5", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\sum_{r=0}^{n} \\frac{r+2}{r+1}{ }^{n} C_{r}=\\frac{2^{8}-1}{6}$\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n& \\Rightarrow \\sum_{r=0}^{n}\\left[1+\\frac{1}{r+1}\\right]{ }^{n} C_{r}=\\frac{2^{8}-1}{6} \\\\\r\n\r\n& \\Rightarrow 2^{n}+\\sum_{r=0}^{n} \\frac{1}{n+1} \\cdot{ }^{n+1} C_{r+1}=\\frac{2^{8}-1}{6} \\\\\r\n\r\n\\Rightarrow 2^{n}+& \\frac{2^{n+1}-1}{n+1}=\\frac{2^{8}-1}{6} \\Rightarrow \\frac{2^{n}(n+3)-1}{n+1}=\\frac{2^{8}-1}{6} \\\\\r\n\r\n\\Rightarrow & \\frac{2^{n}(n+1+2)-1}{n+1}=\\frac{2^{5}(6+2)-1}{6}\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\nComparing we get $\\mathrm{n}+1=6 \\Rightarrow \\mathrm{n}=5$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64c0e8676f5bfc7ab78aedc9", "title": "Binomial Theorem for Rational Index", "totalQuestions": 3, "questions": [{"_id": "64c0e7e46f5bfc7ab78ae8c2", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the third term in the expansion of $\\left[\\mathrm{x}+\\mathrm{x}^{\\log _{10} \\mathrm{x}}\\right]^{5}$\r\n\r\nis $10^{6},$ then $\\mathrm{x}$ may be", "image": null}, "options": [{"id": "ZIci8", "text": "1", "isCorrect": false, "image": null}, {"id": "JmRzr", "text": "$\\sqrt{10}$", "isCorrect": false, "image": null}, {"id": "Pd5mN", "text": "10", "isCorrect": true, "image": null}, {"id": "gJ9to", "text": "$10^{-2 / 5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Put $\\log _{10} x=y,$ the given expression becomes $\\left(x+x^{y}\\right)^{5}$\r\n\r\n$\\mathrm{T}_{3}={ }^{5} \\mathrm{C}_{2} \\cdot \\mathrm{x}^{3}\\left(\\mathrm{x}^{\\mathrm{y}}\\right)^{2}=10 \\mathrm{x}^{3+2 \\mathrm{y}}=10^{6}$ (given)\r\n\r\n$\\Rightarrow(3+2 \\mathrm{y}) \\log _{10} \\mathrm{x}=5 \\log _{10} 10=5$\r\n\r\n$\\Rightarrow(3+2 \\mathrm{y}) \\mathrm{y}=5$\r\n\r\n$\\Rightarrow \\mathrm{y}=1,-\\frac{5}{2}$\r\n\r\n$\\Rightarrow \\log _{10} \\mathrm{x}=1$ or $\\log _{10} \\mathrm{x}=-\\frac{5}{2}$\r\n\r\n$\\therefore \\mathrm{x}=10$ or $\\mathrm{x}=(10)^{-5 / 2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e46f5bfc7ab78ae8c1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the sum of odd numbered terms and the sum of even numbered terms in the expansion of $(x+a)^{n}$ are $A$ and $B$ respectively, then the value of $\\left(x^{2}-\\right.$ $\\left.a^{2}\\right)^{n}$ is", "image": null}, "options": [{"id": "vDBMP", "text": "$\\mathrm{A}^{2}-\\mathrm{B}^{2}$", "isCorrect": true, "image": null}, {"id": "wmZCC", "text": "$\\mathrm{A}^{2}+\\mathrm{B}^{2}$", "isCorrect": false, "image": null}, {"id": "uqKDI", "text": "$4 \\mathrm{AB}$", "isCorrect": false, "image": null}, {"id": "Nm6ir", "text": "None", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$$\r\n\r\n\\begin{array}{r}\r\n\r\n(x+a)^{n}={ }^{n} C_{0} x^{n}+{ }^{n} C_{1} x^{n-1} a+{ }^{n} C_{2} x^{n-2} a^{2} \\\\\r\n\r\n+{ }^{n} C_{3} x^{n-3} a^{3}+{ }^{n} C_{4} x^{n-4} a^{4}+\\ldots . \\\\\r\n\r\n=\\left({ }^{n} C_{0} x^{n}+{ }^{n} C_{2} x^{n-2} a^{2}+{ }^{n} C_{4} x^{n-4} a^{4}+\\ldots .\\right)+ \\\\\r\n\r\n+\\left({ }^{n} C_{1} x^{n-1} a+{ }^{n} C_{3} x^{n-3} a^{3}+{ }^{n} C_{5} x^{n-5} a^{5}\\right)+\\ldots .\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\n$=A+B$ ....(i)\r\n\r\nSimilarly, $(x-a)^{n}=A-B$ ....(ii)\r\n\r\nMultiplying eqns. (1) and (2), we get\r\n\r\n$$\r\n\r\n\\left(\\mathrm{x}^{2}-\\mathrm{a}^{2}\\right)^{\\mathrm{n}}=\\mathrm{A}^{2}-\\mathrm{B}^{2}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a56f5bfc7ab78ae6ac", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "The coefficient of $x^{20}$ in the expansion of\r\n$\\left(1+x^{2}\\right)^{40} \\cdot\\left(x^{2}+2+\\frac{1}{x^{2}}\\right)^{-5}$ is", "image": null}, "options": [{"id": "i3V4B", "text": "${ }^{30} \\mathrm{C}_{10}$", "isCorrect": false, "image": null}, {"id": "xuMO7", "text": "${ }^{30} \\mathrm{C}_{25}$", "isCorrect": true, "image": null}, {"id": "HCjDo", "text": "1", "isCorrect": false, "image": null}, {"id": "EYIhH", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Expression $=\\left(1+x^{2}\\right)^{40} \\cdot\\left(x+\\frac{1}{x}\\right)^{-10}$\r\n$=\\left(1+x^{2}\\right)^{30} \\cdot x^{10}$\r\nThe coefficient of $x^{20}$ in $x^{10}\\left(1+x^{2}\\right)^{30}$ $=$ the coefficient of $\\mathrm{x}^{10}$ in $\\left(1+\\mathrm{x}^{2}\\right)^{30}$\r\n$={ }^{30} \\mathrm{C}_{5}={ }^{30} \\mathrm{C}_{30-5}={ }^{30} \\mathrm{C}_{25}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "64c0e8676f5bfc7ab78aedcc", "title": "Binomial Theorem for Negative Index", "totalQuestions": 1, "questions": [{"_id": "64c0e7d26f5bfc7ab78ae827", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $\\frac{e^{x}+e^{5 x}}{e^{3 x}}=a_{0}+a_{1} x+a_{2} x^{2}+a_{3} x^{3}+\\ldots$ then\r\n\r\nthe value of $2 a_{1}+2^{3} a_{3}+2^{5} a_{5}+\\ldots$ is", "image": null}, "options": [{"id": "hI0OF", "text": "$e^{2}+e^{-2}$", "isCorrect": false, "image": null}, {"id": "gEuFh", "text": "$e^{4}-e^{-4}$", "isCorrect": false, "image": null}, {"id": "dywiH", "text": "$e^{t}+e^{-1}$", "isCorrect": false, "image": null}, {"id": "CgBLf", "text": "0", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $\\frac{\\mathrm{e}^{\\mathrm{x}}+\\mathrm{e}^{5 \\mathrm{x}}}{\\mathrm{e}^{3 \\mathrm{x}}}=\\mathrm{a}_{0}+\\mathrm{a}_{1} \\mathrm{x}+\\mathrm{a}_{2} \\mathrm{x}^{2}+\\mathrm{a}_{3} \\mathrm{a}^{3}+\\ldots .$\r\n\r\n$\\begin{aligned} &=\\frac{\\mathrm{e}^{\\mathrm{x}}}{\\mathrm{e}^{3 \\mathrm{x}}}+\\frac{\\mathrm{e}^{5 \\mathrm{x}}}{\\mathrm{e}^{3 \\mathrm{x}}}=\\mathrm{a}_{0}+\\mathrm{a}_{1} \\mathrm{x}+\\mathrm{a}_{2} \\mathrm{x}^{2}+\\ldots . \\\\=& \\mathrm{e}^{-2 \\mathrm{x}}+\\mathrm{e}^{2 \\mathrm{x}}=\\mathrm{a}_{0}+\\mathrm{a}_{1} \\mathrm{x}+\\mathrm{a}_{2} \\mathrm{x}^{2}+\\mathrm{a}_{3} \\mathrm{x}^{3}+\\ldots . \\end{aligned}$\r\n\r\nBy using $\\mathrm{e}^{\\mathrm{x}}=1+\\mathrm{x}+\\frac{\\mathrm{x}^{2}}{2 !}+\\frac{\\mathrm{x}^{3}}{3 !}+{ }_{--}--$ and\r\n\r\n$\\mathrm{e}^{-\\mathrm{x}}=1-\\mathrm{x}+\\frac{\\mathrm{x}^{2}}{2 !}-\\frac{\\mathrm{x}^{3}}{3 !}+---$\r\n\r\n$\\mathrm{e}^{-2 \\mathrm{x}}+\\mathrm{e}^{2 \\mathrm{x}}=2\\left[1+\\frac{(2 \\mathrm{x})^{2}}{21}+\\frac{(2 \\mathrm{x})^{4}}{41}+\\ldots .\\right]$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n=a_{0}+a_{1} x+a_{2} x^{2}+a_{3} a^{3}+\\ldots . \\\\\r\n\r\n=a_{1}=a_{3}=a_{5}=\\ldots=0\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nHence, $2 \\mathrm{a}_{1}+2^{3} \\mathrm{a}_{3}+2^{5} \\mathrm{a}_{5}+\\ldots .=0$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
