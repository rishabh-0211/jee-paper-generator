\right)+\\mathrm{C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\int \\frac{e^{x}(1+x)}{\\cos ^{2}\\left(e^{x} x\\right)} \\mathrm{dx}$\r\n\r\nLet $x e^{x}=t$\r\n\r\n$\\Rightarrow\\left(x e^{x}+e^{x}\\right)=\\frac{\\mathrm{dt}}{\\mathrm{dx}}$\r\n\r\n$\\Rightarrow d x=\\frac{\\mathrm{dt}}{e^{x}(x+1)}$\r\n\r\n$\\therefore \\int \\frac{e^{x}(1+x)}{\\cos ^{2}\\left(e^{x} x\\right)} \\mathrm{dx}=\\int \\frac{e^{x}(1+x)}{\\cos ^{2} t} \\times \\frac{d t}{e^{x}(1+x)}=\\int \\frac{1}{\\cos ^{2} t} \\mathrm{dt}=\\int \\sec ^{2} t \\mathrm{dt}=$$\\tan t+\\mathrm{C}=\\tan \\left(x e^{x}\\right)+\\mathrm{C}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8276f5bfc7ab78aeb13", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "The value of $\\int \\cos (\\log x) \\mathrm{d} \\mathrm{x}$ is :", "image": null}, "options": [{"id": "6A09L", "text": "$\\frac{1}{2}[\\sin (\\log x)+\\cos (\\log x)]+C$", "isCorrect": false, "image": null}, {"id": "095Eh", "text": "$\\frac{x}{2}[\\sin (\\log x)+\\cos (\\log x)]+C$", "isCorrect": true, "image": null}, {"id": "F4kTd", "text": "$\\frac{x}{2}[\\sin (\\log x)-\\cos (\\log x)]+C$", "isCorrect": false, "image": null}, {"id": "AHqyU", "text": "$\\frac{1}{2}[\\sin (\\log x)-\\cos (\\log x)]+C$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let\r\n\r\n\\(\\mathrm{I}=\\int \\cos (\\log \\mathrm{x}) \\cdot 1 \\mathrm{~d} \\mathrm{ tan ^{2} x+8} d x=\\int \\frac{\\sec ^{2} x}{4 \\tan ^{2} x+9} d x\r\n\r\n$$\r\n\r\nPutting $\\tan x=t \\Rightarrow \\sec ^{2} x d x=d t,$ we get\r\n\r\n$\\mathrm{I}=\\int \\frac{\\mathrm{dt}}{4 \\mathrm{t}^{2}+9}=\\frac{1}{4} \\int \\frac{\\mathrm{dt}}{\\mathrm{t}^{2}+(3 / 2)^{2}}=\\frac{1}{4} \\times \\frac{1}{3 / 2} \\tan ^{-1}\\left(\\frac{\\mathrm{t}}{3 / 2}\\right)+\\mathrm{C}$\r\n\r\n$\\Rightarrow \\mathrm{I}=\\frac{1}{6} \\tan ^{-1}\\left(\\frac{2 \\mathrm{t}}{3}\\right)+\\mathrm{C}=\\frac{1}{6} \\tan ^{-1}\\left(\\frac{2 \\tan \\mathrm{x}}{3}\\right)+\\mathrm{C}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b76f5bfc7ab78ae741", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 3, "question": {"text": "$\\int \\frac{\\left(\\mathrm{x}^{2}-1\\right)}{\\left(\\mathrm{x}^{2}+1\\right) \\sqrt{\\mathrm{x}^{4}+1}} \\mathrm{dx}$ is equal to", "image": null}, "options": [{"id": "IDRc2", "text": "$\\sec ^{-1}\\left(\\frac{x^{2}+1}{\\sqrt{2} x}\\right)+c$", "isCorrect": false, "image": null}, {"id": "3Y7QZ", "text": "$\\frac{1}{\\sqrt{2}} \\sec ^{-1}\\left(\\frac{x^{2}+1}{\\sqrt{2} x}\\right)+c$", "isCorrect": true, "image": null}, {"id": "0i9n3", "text": "$\\frac{1}{\\sqrt{2}} \\sec ^{-1}\\left(\\frac{x^{2}+1}{\\sqrt{2}}\\right)+c$", "isCorrect": false, "image": null}, {"id": "P2Puc", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{I}=\\int \\frac{\\mathrm{x}^{2}\\left(1-\\frac{1}{\\mathrm{x}^{2}}\\right) \\mathrm{dx}}{\\mathrm{x}^{2}\\left(\\mathrm{x}+\\frac{1}{\\mathrm{x}}\\right)\\left(\\mathrm{x}^{2}+\\frac{1}{\\mathrm{x}^{2}}\\right)^{1 / 2}}$\r\n\r\nLet $\\mathrm{x}+\\frac{1}{\\mathrm{x}}=\\mathrm{p} \\Rightarrow\\left(1-\\frac{1}{\\mathrm{x}^{2}}\\right) \\mathrm{d} \\mathrm{x}=\\mathrm{dp}$\r\n\r\n$\\mathrm{I}=\\int \\frac{\\mathrm{dp}}{\\mathrm{p} \\sqrt{\\mathrm{p}^{2}-2}}=\\frac{1}{\\sqrt{2}} \\mathrm{sec}^{-1} \\frac{\\mathrm{p}}{\\sqrt{2}}$\r\n\r\n$=\\frac{1}{\\sqrt{2}} \\sec ^{-1}\\left(\\frac{\\mathrm{x}^{2}+1}{\\sqrt{2} \\mathrm{x}}\\right)+\\mathrm{c}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a86f5bfc7ab78ae6c0", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "Evaluate: $\\int \\sqrt{\\frac{\\mathrm{x}}{4-\\mathrm{x}^{3}}} \\mathrm{dx}$", "image": null}, "options": [{"id": "if2ql", "text": "$\\frac{2}{3} \\sin ^{-1}\\left(\\frac{x^{3 / 2}}{2}\\right)+c$", "isCorrect": true, "image": null}, {"id": "FRi6Z", "text": "$\\frac{2}{3} \\sin ^{-1}\\left(x^{3 / 2}\\right)+c$", "isCorrect": false, "image": null}, {"id": "mNCPE", "text": "$2 \\sin ^{-1}\\left(\\frac{x^{3 / 2}}{2}\\right)+c$", "isCorrect": false, "image": null}, {"id": "VIjkw", "text": "$\\frac{1}{3} \\sin ^{-1}\\left(\\frac{\\mathrm{x}^{3 / 2}}{2}\\right)+\\mathrm{c}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$I=\\int \\sqrt{\\frac{x}{4-x^{3}}} d x=\\int \\frac{\\sqrt{x} d x}{\\sqrt{4-x^{3}}}$\r\nHere integral of $\\sqrt{x}=\\frac{2}{3} x^{3 / 2}$ and $4-x^{3}=4-\\left(x^{3 / 2}\\right)^{2}$\r\nPut $x^{3 / 2}=t \\Rightarrow \\sqrt{x} d x=\\frac{2}{3} d t$\r\nSo $I=\\frac{2}{3} \\int \\frac{d t}{\\sqrt{4-t^{2}}}=\\frac{2}{3} \\sin ^{-1}\\left(\\frac{x^{3 / 2}}{2}\\right)+c$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77d6f5bfc7ab78ae547", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The equation of tangent to the curve \\(y=\\sin x\\) at the point \\((\\pi, 0)\\) is", "image": null}, "options": [{"id": "vpPvu", "text": "\\(x+y=0\\)", "image": null, "isCorrect": false}, {"id": "Uqao3", "text": "\\(x+y=\\pi\\)", "image": null, "isCorrect": true}, {"id": "gARj6", "text": "\\(x-y=\\pi\\)", "image": null, "isCorrect": false}, {"id": "FU1eT", "text": "\\(x-y=0\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(y=\\sin x \\Rightarrow \\frac{d y}{d x}=\\cos x \\Rightarrow\\left(\\frac{d y}{d x}\\right)_{(\\pi, 0)}=-1\\)\nTherefore the equation of tangent at \\((\\pi, 0)\\) is given by\n\\(y-0=-1(x-\\pi) \\Rightarrow x+y=\\pi\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e86d6f5bfc7ab78aee0e", "title": "Integration by Parts", "totalQuestions": 4, "questions": [{"_id": "65b7b88097ae24e9e2db8cfe", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "$\\int \\tan ^{-1} \\sqrt{\\mathrm{x}} \\mathrm{dx}$ is equal to", "image": null}, "options": [{"id": "JfcVP", "text": "$(x+1) \\tan ^{-1} \\sqrt{x}-\\sqrt{x}+C$", "image": null, "isCorrect": true}, {"id": "ZSZjJ", "text": "$x \\tan ^{-1} \\sqrt{x}-\\sqrt{x}+C$", "image": null, "isCorrect": false}, {"id": "RdAbe", "text": "$\\sqrt{x}-x \\tan ^{-1} \\sqrt{x}+C$", "image": null, "isCorrect": false}, {"id": "lJ7Vf", "text": "$\\sqrt{x}-(x+1) \\tan ^{-1} \\sqrt{x}+C$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have, $I=\\int 1 \\cdot \\tan ^{-1} \\sqrt{\\mathrm{x}} \\mathrm{dx}$<br />Using by parts,<br />$\\begin{aligned}<br />I & =\\tan ^{-1} \\sqrt{x} \\cdot(x)-\\int \\frac{1}{1+x} \\times \\frac{1}{2 \\sqrt{x}} \\times x d x \\\\<br />& =x \\tan ^{-1} \\sqrt{x} \\cdot-\\int \\frac{x}{(1+x) 2 \\sqrt{x}} d x \\\\<br />& =x \\tan ^{-1} \\sqrt{x}-\\int\\left(\\frac{1+x}{(1+x) 2 \\sqrt{x}}-\\frac{1}{(1+x) 2 \\sqrt{x}}\\right) d x \\\\<br />& =x \\tan ^{-1} \\sqrt{x}-\\int \\frac{d x}{2 \\sqrt{x}}+\\int \\frac{d x}{2 \\sqrt{x}(1+x)} \\\\<br />& =x \\tan ^{-1} \\sqrt{x}-\\sqrt{x}+\\tan ^{-1} \\sqrt{x}+C \\\\<br />& =(x+1) \\tan ^{-1} \\sqrt{x}-\\sqrt{x}+C<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87997ae24e9e2db8cb2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "$\\int \\frac{x+3}{(x+4)^2} e^x d x$ is equal to", "image": null}, "options": [{"id": "5LxsA", "text": "$e^x\\left(\\frac{1}{x+4}\\right)+C$", "image": null, "isCorrect": true}, {"id": "adRcp", "text": "$e^{-x}\\left(\\frac{1}{x+4}\\right)+C$", "image": null, "isCorrect": false}, {"id": "TJe30", "text": " $e^{-x}\\left(\\frac{1}{x-4}\\right)+C$", "image": null, "isCorrect": false}, {"id": "Hr5Xh", "text": "$e^{2 x}\\left(\\frac{1}{x-4}\\right)+C$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Suppose,<br />$I=\\int \\frac{x+3}{(x+4)^2} e^x d x=\\int \\frac{(x+4) 1}{(x+4)^2} e^x d x$<br />$=\\int \\frac{e^x}{(x+4)}-\\int \\frac{e^x}{(x+4)^2} d x$<br />$=\\int e^x\\left(\\frac{1}{(x+4)}-\\frac{1}{(x+4)^2}\\right) d x$<br />$=e^x \\frac{1}{(x+4)}+C$<br />$\\left[\\int e^x\\left\\{f(x)+f^{\\prime}(x)\\right\\} d x=e^x f(x)+C\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87797ae24e9e2db8ca1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "If $\\int \\frac{\\mathrm{e}^{\\mathrm{x}}(1+\\sin \\mathrm{x}) \\mathrm{dx}}{1+\\cos \\mathrm{x}}=\\mathrm{e}^{\\mathrm{x}} \\mathrm{f}(\\mathrm{x})+\\mathrm{C}$, then $\\mathrm{f}(\\mathrm{x})$ is equal to", "image": null}, "options": [{"id": "KgAbd", "text": "$\\sin \\frac{x}{2}$", "image": null, "isCorrect": false}, {"id": "lalXq", "text": "$\\cos \\frac{x}{2}$", "image": null, "isCorrect": false}, {"id": "sOInl", "text": "$\\tan \\frac{x}{2}$", "image": null, "isCorrect": true}, {"id": "K5AGC", "text": "$\\log \\frac{x}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\int e^x \\frac{(1+\\sin x)}{(1+\\cos x)} d x$<br />$=\\int e^x\\left[\\frac{1}{2} \\sec ^2 \\frac{x}{2}+\\tan \\frac{x}{2}\\right] d x$<br />$=\\frac{1}{2} \\int e^x \\sec ^2 \\frac{x}{2} d x+\\int e^x \\tan \\frac{x}{2} d x$<br />$=\\mathrm{e}^{\\mathrm{x}} \\tan \\frac{\\mathrm{x}}{2}+\\mathrm{C}$<br />But $\\mathrm{I}=\\mathrm{e}^{\\mathrm{x}} \\mathrm{f}(\\mathrm{x})+\\mathrm{C}$ (given)<br />$\\therefore \\mathrm{f}(\\mathrm{x})=\\tan \\frac{\\mathrm{x}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77d6f5bfc7ab78ae548", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "If \\(\\int \\frac{2 \\cos x-\\sin x+\\lambda}{\\cos x+\\sin x-2} d x\\) \\(=A \\ln |\\cos x+\\sin x-2|+B x+C\\).\nThen the ordered triplet \\(A, B, \\lambda\\) is -", "image": null}, "options": [{"id": "hCv7z", "text": "\\(\\left(\\frac{1}{2}, \\frac{3}{2},-1\\right)\\)", "image": null, "isCorrect": false}, {"id": "fo2qU", "text": "\\(\\left(\\frac{3}{2}, \\frac{1}{2},-1\\right)\\)", "image": null, "isCorrect": true}, {"id": "oINCr", "text": "\\(\\left(\\frac{1}{2},-1, \\frac{3}{2}\\right)\\)", "image": null, "isCorrect": false}, {"id": "y0jf0", "text": "\\(\\left(\\frac{3}{2},-1, \\frac{1}{2}\\right)\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\frac{\\mathrm{d}}{\\mathrm{dx}}(\\mathrm{A} \\ln |\\cos \\mathrm{x}+\\sin \\mathrm{x}-2|+\\mathrm{Bx}+\\mathrm{C}) \\\\\n&= \\mathrm{A} \\frac{\\cos \\mathrm{x}-\\sin \\mathrm{x}}{\\cos \\mathrm{x}+\\sin \\mathrm{x}-2}+\\mathrm{B} \\\\\n&= \\frac{\\mathrm{A} \\cos \\mathrm{x}-\\mathrm{A} \\sin \\mathrm{x}+\\mathrm{B} \\cos \\mathrm{x}+\\mathrm{B} \\sin \\mathrm{x}-2 \\mathrm{~B}}{\\cos \\mathrm{x}+\\sin \\mathrm{x}-2} \\\\\n& \\therefore 2=\\mathrm{A}+\\mathrm{B} \\text { or }-1=-\\mathrm{A}+\\mathrm{B} ; \\lambda=-2 \\mathrm{~B} \\\\\n& \\therefore \\mathrm{A}=3 / 2, \\mathrm{~B}=1 / 2, \\lambda=-1\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e86d6f5bfc7ab78aee11", "title": "Integration using Partial Fraction", "totalQuestions": 2, "questions": [{"_id": "67726d0ec49e8ef28ee2b3e7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "$\\int \\frac{x^3-1}{x^3+x} d x=$", "image": null}, "options": [{"id": "lSPJW", "text": "$x+\\log |x|+\\frac{1}{2} \\log \\left(x^2+1\\right)+\\sin ^{-1}(x)+c$", "image": null, "isCorrect": false}, {"id": "MHJFV", "text": "$x-\\log |x|+\\frac{1}{2} \\log \\left(x^2+1\\right)-\\sin ^{-1}(x)+c$", "image": null, "isCorrect": false}, {"id": "88IEv", "text": "$x+\\log |x|-\\frac{1}{2} \\log \\left(x^2+1\\right)+\\tan ^{-1}(x)+c$", "image": null, "isCorrect": false}, {"id": "QxYKL", "text": "$x-\\log |x|+\\frac{1}{2} \\log \\left(x^2+1\\right)-\\tan ^{-1}(x)+c$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$I=\\int\\left(\\frac{x^3-1}{x^3+x}\\right) d x=\\int\\left(1-\\frac{x+1}{x^3+x}\\right) d x$\n$\\begin{aligned}\n& \\Rightarrow I=\\int 1 \\cdot d x-\\int \\frac{(x+1)}{x^3+x} d x \\\\\n& =x-\\int \\frac{(x+1)}{x\\left(x^2+1\\right)} d x\n\\end{aligned}$\n$\\begin{aligned}\n& \\text { Let } \\frac{x+1}{x\\left(x^2+1\\right)}=\\frac{A}{x}+\\frac{B x+C}{x^2+1} \\\\\n& \\Rightarrow(x+1)=A\\left(x^2+1\\right)+(B x+C) x \\\\\n& \\Rightarrow(x+1)=(A+B) x^2+C x+A\n\\end{aligned}$\nOn comparing coefficient, we get\n$\\begin{aligned}\n& A+B=0, C=1, A=1 \\\\\n& \\Rightarrow B=-1 \\\\\n& \\therefore I=x-\\int \\frac{1}{x} d x-\\int \\frac{(1-x)}{x^2+1} d x \\\\\n& \\Rightarrow I=x-\\log |x|-\\int \\frac{1}{x^2+1} d x+\\frac{1}{2} \\int \\frac{2 x}{x^2+1} d x \\\\\n& \\Rightarrow I=x-\\log |x|-\\tan ^{-1} x+\\frac{1}{2} \\log \\left(x^2+1\\right)+c\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e82b6f5bfc7ab78aeb35", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "If $\\int \\frac{3 x+1}{(x-3)(x-5)} d x=\\int \\frac{-5}{(x-3)} d x+\\int \\frac{B}{(x-5)} d x$ then the value of $B$ is", "image": null}, "options": [{"id": "nxCZj", "text": "3", "isCorrect": false, "image": null}, {"id": "StEeU", "text": "4", "isCorrect": false, "image": null}, {"id": "0Lq9I", "text": "6", "isCorrect": false, "image": null}, {"id": "K0RSw", "text": "8", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "We have,\r\n\r\n$\\begin{array}{l}\r\n\r\n\\frac{3 x+1}{(x-3)(x-5)}=\\frac{-5}{x-3}+\\frac{\\mathrm{B}}{x-5} \\\\\r\n\r\n3 x+1=-5(x-5)+\\mathrm{B}(x-3) \\\\\r\n\r\n\\text { Put } x=5 \\\\\r\n\r\n3(5)+1=\\mathrm{B}(5-3) \\\\\r\n\r\n16=2 \\mathrm{~B} \\text { or } \\mathrm{B}=8\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e86d6f5bfc7ab78aee10", "title": "Miscellaneous Forms", "totalQuestions": 4, "questions": [{"_id": "64c0e8356f5bfc7ab78aeb8e", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let $f(x)=\\int \\frac{x^2 d x}{\\left(1+x^2\\right)\\left(1+\\sqrt{\\left.1+x^2\\right)}\\right.}$ and $f(0)=0$, \r\nthen the value of $f(1)$ be", "image": null}, "options": [{"id": "ITWxK", "text": "\r\n$\\log (1+\\sqrt{2})$\r\n", "isCorrect": false, "image": null}, {"id": "XulYH", "text": "\r\n$\\log (1+\\sqrt{2})-\\frac{\\pi}{4}$\r\n", "isCorrect": true, "image": null}, {"id": "dHYAk", "text": "\r\n$\\log (1+\\sqrt{2})+\\frac{\\pi}{2}$\r\n", "isCorrect": false, "image": null}, {"id": "394KJ", "text": "\r\nNone of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$f(x)=\\int \\frac{x^2 d x}{\\left(1+x^2\\right)\\left(1+\\sqrt{1+x^2}\\right)}$\r\nLet $x=\\tan \\theta$\r\n$\\Rightarrow \\quad d x=\\sec ^2 \\theta d \\theta=\\left(1+x^2\\right) d \\theta$\r\n$f(x)=\\int \\frac{x^2 d x}{\\left(1+x^2\\right)\\left(1+\\sqrt{1+x^2}\\right)}$\r\n$=\\int \\frac{\\tan ^2 \\theta \\sec ^2 \\theta d \\theta}{\\sec ^2 \\theta(1+\\sec \\theta)}=\\int \\frac{\\tan ^2 \\theta d \\theta}{1+\\sec \\theta}$\r\n$=\\int \\frac{\\sin ^2 \\theta d \\theta}{\\cos \\theta(1+\\cos \\theta)}$\r\n$=\\int \\frac{1-\\cos ^2 \\theta d \\theta}{\\cos \\theta(1+\\cos \\theta)}$\r\n$=\\int \\frac{(1-\\cos \\theta) d \\theta}{\\cos \\theta}$\r\n$=\\int \\sec \\theta d \\theta-\\int d \\theta$\r\n$=\\log \\left(x+\\sqrt{1+x^2}\\right)-\\tan ^{-1} x+C$\r\n$\\therefore \\quad f(0)=\\log (0+\\sqrt{1+0})-\\tan ^{-1}(0)+C$\r\n$0=\\log 1-0+C$\r\n$\\Rightarrow \\quad C=0$\r\n$\\therefore \\quad f(1)=\\log \\left(1+\\sqrt{1+1^2}\\right)-\\tan ^{-1}(1)$\r\n$=\\log (1+\\sqrt{2})-\\frac{\\pi}{4}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8346f5bfc7ab78aeb80", "previousYearPapers": [{"_id": "64c0e679aef33318 /math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#955;</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn></mrow><mn>5</mn></mfrac></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>a</mi><mo>+</mo><mi>&#955;</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>1</mn><mo>&#62;</mo><mn>2</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
