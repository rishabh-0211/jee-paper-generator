, "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "$\\int_0^{\\pi / 4} \\cos x e^{\\sin x} d x$ is equal to", "image": null}, "options": [{"id": "ra4jO", "text": "$e+1$", "image": null, "isCorrect": false}, {"id": "I4inj", "text": "$e-1$", "image": null, "isCorrect": true}, {"id": "XbdlG", "text": "$e$", "image": null, "isCorrect": false}, {"id": "RScz3", "text": "$-e$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Suppose, $I=\\int_0^{\\pi / 2} \\cos x e^{\\sin x} d x$<br />Let $\\sin x=t \\Rightarrow \\cos x d x=d t$<br />$x \\rightarrow 0 \\Rightarrow t \\rightarrow 0$<br />and $x \\rightarrow \\frac{\\pi}{2} \\Rightarrow t \\rightarrow 1$<br />So $I=\\int_0^1 e^t d t=\\left[e^t\\right]_0^1=e-1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8196f5bfc7ab78aea92", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "$\\int_{0}^{\\infty} \\frac{\\mathrm{dx}}{\\left(\\mathrm{x}^{2}+\\mathrm{a}^{2}\\right)\\left(\\mathrm{x}^{2}+\\mathrm{b}^{2}\\right)}$ is", "image": null}, "options": [{"id": "Jsh07", "text": "$\\frac{\\pi a b}{a+b}$", "isCorrect": false, "image": null}, {"id": "0hCe0", "text": "$\\frac{\\pi}{2(a+b)}$", "isCorrect": false, "image": null}, {"id": "YZlie", "text": "$\\frac{\\pi}{2 a b(a+b)}$", "isCorrect": true, "image": null}, {"id": "4JhZJ", "text": "$\\frac{\\pi(a+b)}{2 a b}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\int_{0}^{\\infty} \\frac{d x}{\\left(x^{2}+a^{2}\\right)\\left(x^{2}+b^{2}\\right)}=\\frac{1}{b^{2}-a^{2}}$\r\n\r\n$\\int_{0}^{\\infty} \\frac{\\left(x^{2}+b^{2}\\right)-\\left(x^{2}+a^{2}\\right)}{\\left(x^{2}+a^{2}\\right)\\left(x^{2}+b^{2}\\right)}$\r\n\r\n$=\\frac{1}{b^{2}-a^{2}} \\int_{0}^{\\infty}\\left[\\frac{1}{x^{2}+a^{2}}-\\frac{1}{x^{2}+b^{2}}\\right] d x$\r\n\r\n$=\\frac{1}{b^{2}-a^{2}}\\left[\\frac{1}{a} \\tan ^{-1} \\frac{x}{a}-\\frac{1}{b} \\tan ^{-1} \\frac{x}{b}\\right]_{0}^{\\infty}$\r\n\r\n$=\\frac{1}{b^{2}-a^{2}}\\left[\\frac{\\pi}{2 a}-\\frac{\\pi}{2 b}\\right]=\\frac{\\pi}{2 a b(a+b)}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b76f5bfc7ab78ae742", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "Elvaluate $\\int_{0}^{\\pi / 2} \\frac{\\sin x}{1+\\cos ^{2} x} d x$", "image": null}, "options": [{"id": "jWiLT", "text": "$\\pi / 2$", "isCorrect": false, "image": null}, {"id": "Q1xkq", "text": "$\\pi / 4$", "isCorrect": true, "image": null}, {"id": "6r0CE", "text": "$\\pi / 3$", "isCorrect": false, "image": null}, {"id": "PnZ4o", "text": "$\\pi$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\mathrm{I}=\\int_{0}^{\\pi / 2} \\frac{\\sin \\mathrm{x}}{1+\\cos ^{2} \\mathrm{x}} \\mathrm{dx}$\r\n\r\nLet $\\cos \\mathrm{x}=\\mathrm{t}$ and $-\\sin \\mathrm{x} \\mathrm{d} \\mathrm{x}=\\mathrm{dt}$\r\n\r\nNow, $\\mathrm{x}=0 \\Rightarrow \\mathrm{t}=\\cos 0=1$ and\r\n\r\n$\\mathrm{x}=\\frac{\\pi}{2} \\Rightarrow \\mathrm{t}=\\cos \\frac{\\pi}{2}=0$\r\n\r\n$\\therefore \\quad \\mathrm{I}=\\int_{1}^{0} \\frac{\\sin \\mathrm{x}}{1+\\mathrm{t}^{2}}\\left(\\frac{-\\mathrm{dt}}{\\sin \\mathrm{x}}\\right)=-\\int_{1}^{0} \\frac{\\mathrm{dt}}{1+\\mathrm{t}^{2}}$\r\n\r\n$=\\left[\\tan ^{-1} \\mathrm{t}\\right]_{1}^{0}=-\\left[0-\\frac{\\pi}{4}\\right]=\\frac{\\pi}{4}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77d6f5bfc7ab78ae54a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "Evaluate : \\(\\int_0^1 \\frac{\\mathrm{dx}}{\\sqrt{2-\\mathrm{x}^2}}\\).", "image": null}, "options": [{"id": "g8rIA", "text": "\\(\\pi / 4\\)", "image": null, "isCorrect": true}, {"id": "PHZIl", "text": "\\(\\pi\\)", "image": null, "isCorrect": false}, {"id": "xXtvJ", "text": "\\(\\pi / 2\\)", "image": null, "isCorrect": false}, {"id": "ahlEm", "text": "\\(\\pi / 3\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\int \\frac{\\mathrm{dx}}{\\sqrt{2-\\mathrm{x}^2}}=\\sin ^{-1} \\frac{\\mathrm{x}}{\\sqrt{2}}+\\mathrm{c} \\\\\n& \\text {So } \\int_0^1 \\frac{\\mathrm{dx}}{\\sqrt{2-\\mathrm{x}^2}}=\\left.\\sin ^{-1} \\frac{\\mathrm{x}}{\\sqrt{2}}\\right|_0 ^1 \\\\\n= & \\sin ^{-1}\\left(\\frac{1}{\\sqrt{2}}\\right)+c-\\sin ^{-1}(0)-c=\\frac{\\pi}{4}-0=\\frac{\\pi}{4}\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77d6f5bfc7ab78ae549", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "Evaluate: \\(\\int x \\tan ^{-1} x d x\\)", "image": null}, "options": [{"id": "XwOaE", "text": "\\(\\frac{1}{2}\\left(x^2+1\\right) \\tan ^{-1} x-\\frac{1}{2} x+c\\)", "image": null, "isCorrect": true}, {"id": "zYnVi", "text": "\\(\\frac{1}{2}\\left(x^2+1\\right) \\tan ^{-1} x+\\frac{1}{2} x+c\\)", "image": null, "isCorrect": false}, {"id": "ZA4Vi", "text": "\\(\\frac{1}{2}\\left(\\mathrm{x}^2-1\\right) \\tan ^{-1} \\mathrm{x}-\\frac{1}{2} \\mathrm{x}+\\mathrm{c}\\)", "image": null, "isCorrect": false}, {"id": "0t0fI", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\int x \\tan ^{-1} x d x=\\frac{x^2}{2} \\tan ^{-1} x-\\frac{1}{2} \\int \\frac{x^2}{1+x^2} d x \\\\\n& =\\frac{x^2}{2} \\tan ^{-1} x-\\frac{1}{2} \\int\\left[1-\\frac{1}{1+x^2}\\right] d x \\\\\n& =\\frac{1}{2}\\left(x^2+1\\right) \\tan ^{-1} x-\\frac{1}{2} x+c\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e86e6f5bfc7ab78aee16", "title": "Properties of Definite Integration", "totalQuestions": 7, "questions": [{"_id": "67726d1bc49e8ef28ee2b449", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "The value of definite integral $\\int_0^{\\pi / 2} \\log (\\tan x) d x$ is", "image": null}, "options": [{"id": "O4U2t", "text": "0", "image": null, "isCorrect": true}, {"id": "a8LZE", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "RSnRV", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "7K0kB", "text": "$\\pi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $I=\\int_0^{\\frac{\\pi}{2}} \\log (\\tan x) d x$....(i)\nBy applying property,\n$\\begin{aligned}\n\\int_a^b f(x) d x & =\\int_a^b f(a+b-x) d x \\\\\nI & =\\int_0^{\\frac{\\pi}{2}} \\log \\left(\\tan \\left(\\frac{\\pi}{2}-x\\right)\\right) d x \\\\\nI & =\\int_0^{\\frac{\\pi}{2}} \\log (\\cot x) d x\\ldots(ii)\n\\end{aligned}$\nAdding Eqs. (i) and (ii),\n$\\begin{aligned}\n& 2 I=\\int_0^{\\frac{\\pi}{2}}[\\log (\\tan x)+\\log (\\cot x)] d x \\\\\n& 2 I=\\int_0^{\\frac{\\pi}{2}} \\log 1 d x=0\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d0fc49e8ef28ee2b3ec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "$\\int_5^9 \\frac{\\log 3 x^2}{\\log 3 x^2+\\log \\left(588-84 x+3 x^2\\right)} d x$ is equal to", "image": null}, "options": [{"id": "oJe0f", "text": "$2$", "image": null, "isCorrect": true}, {"id": "q0FK3", "text": "$1$", "image": null, "isCorrect": false}, {"id": "UnAqy", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "oNpji", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let\n$I=\\int_5^9 \\frac{\\log 3 x^2 d x}{\\log 3 x^2+\\log \\left(588-84 x+3 x^2\\right)}$  ...(i)\n$\\begin{aligned} & =\\int_5^9 \\frac{\\log 3 x^2 d x}{\\log 3 x^2+\\log 3(14-x)^2} \\\\ & =\\int_5^9 \\frac{\\log 3(14-x)^2 d x}{\\log 3(14-x)^2+\\log 3(14-(14-x))^2} \\\\ & \\quad\\left[\\int_a^b f(x) d x=\\int_a^b f(a+b-x) d x\\right]\\end{aligned}$\n$I=\\int_5^9 \\frac{\\log 3(14-x)^2 d x}{\\log 3(14-x)^2+\\log 3 x^2}$  ...(ii)\nAdding Eqs. (i) and (ii), we get\n$\\begin{aligned}\n& 2 I=\\int_5^9 \\frac{\\log 3 x^2+\\log 3(14-x)^2}{\\log 3(14-x)^2+\\log 3 x^2} d x \\\\\n& 2 \\mathrm{I}=\\int_5^9 d x=9-5=4 \\Rightarrow I=2\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d02c49e8ef28ee2b388", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "$\\int_0^{\\frac{\\pi}{2}} \\frac{\\sin \\left(\\frac{\\pi}{4}+x\\right)+\\sin \\left(\\frac{3 \\pi}{4}+x\\right)}{\\cos x+\\sin x} d x=$", "image": null}, "options": [{"id": "4v2Fr", "text": "$\\frac{\\pi}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "6sTrA", "text": "$\\frac{\\pi}{2 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "WSgaO", "text": "$\\frac{\\pi}{3 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "w1fTG", "text": "$\\frac{\\pi}{4 \\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $I=\\int_0^{\\frac{\\pi}{2}} \\frac{\\sin \\left(\\frac{\\pi}{4}+x\\right)+\\sin \\left(\\frac{3 \\pi}{4}+x\\right)}{\\cos x+\\sin x} d x$\n$\\Rightarrow I=\\int_0^{\\pi / 2} \\frac{\\sin \\left(\\frac{3 \\pi}{4}-x\\right)+\\sin \\left(\\frac{5 \\pi}{4}-x\\right)}{\\sin x+\\cos x} d x$\n$\\Rightarrow I=\\int_0^{\\pi / 2} \\frac{\\sin \\left(\\frac{\\pi}{4}+x\\right)-\\sin \\left(\\frac{3 \\pi}{4}+x\\right)}{\\cos x+\\sin x} d x$\nNow $I+I=\\int_0^{\\pi / 2} \\frac{2 \\sin \\left(\\frac{\\pi}{4}+x\\right)}{\\cos x+\\sin x} d x$\n$\\Rightarrow I=\\int_0^{\\pi / 2} \\frac{\\frac{1}{\\sqrt{2}} \\cos x+\\frac{1}{\\sqrt{2}} \\sin x}{\\cos x-\\sin x} d x=\\frac{\\pi}{2 \\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8296f5bfc7ab78aeb21", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "Evaluate: $\\int_{0}^{\\pi} \\frac{1}{5+4 \\cos x} d x$", "image": null}, "options": [{"id": "k0gyf", "text": "$\\frac{\\pi}{3}$", "isCorrect": true, "image": null}, {"id": "ofey7", "text": "$\\frac{\\pi}{2}$", "isCorrect": false, "image": null}, {"id": "y12Vi", "text": "$\\frac{\\pi}{4}$", "isCorrect": false, "image": null}, {"id": "g20ah", "text": "$\\frac{\\pi}{6}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have, $\\int_{0}^{\\pi} \\frac{1}{5+4 \\cos x} d x$\r\n\r\n$=\\int_{0}^{\\pi} \\frac{1}{5+4\\left(\\frac{1-\\tan ^{2} \\frac{x}{2}}{1+\\tan ^{2} \\frac{x}{2}}\\right)} d x$\r\n\r\n$=\\int_{0}^{\\pi} \\frac{1+\\tan ^{2} \\frac{x}{2}}{5\\left(1+\\tan ^{2} \\frac{x}{2}\\right)+4\\left(1-\\tan ^{2} \\frac{x}{2}\\right)} d x$\r\n\r\n$=\\int_{0}^{\\pi} \\frac{1+\\tan ^{2} \\frac{x}{2}}{9+\\tan ^{2} \\frac{x}{2}} \\mathrm{dx}=\\int_{0}^{\\pi} \\frac{\\sec ^{2} \\frac{x}{2}}{9+\\tan ^{2} \\frac{x}{2}} \\mathrm{dx}$\r\n\r\nLet $\\tan \\frac{x}{2}=t \\Rightarrow \\frac{1}{2} \\sec ^{2} \\frac{x}{2} d x=d t$\r\n\r\nAlso, $x=0 \\Rightarrow t=0$ and $x=\\pi \\Rightarrow t=\\infty$\r\n\r\n$\\therefore \\mathrm{I}=\\int_{0}^{\\infty} \\frac{\\mathrm{dt}}{9+t^{2}}$\r\n\r\n$\\therefore \\mathrm{I}=2 \\int_{0}^{\\infty} \\frac{\\mathrm{dt}}{9+t^{2}}$\r\n\r\n$\\therefore \\mathrm{I}=\\frac{2}{3}\\left[\\tan ^{-1} \\frac{t}{3}\\right]_{0}^{\\infty}=\\frac{2}{3}\\left[\\tan ^{-1} \\infty-\\tan ^{-1} 0\\right]$\r\n\r\n$=\\frac{2}{3}\\left(\\frac{\\pi}{2}-0\\right)=\\frac{\\pi}{3}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8296f5bfc7ab78aeb1d", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "$\\int_{-a}^{4}\\left(x^{8}-x^{4}+x^{2}+1\\right) d x=2 \\int_{0}^{4}\\left(x^{8}-x^{4}+x^{2}+1\\right) d x$ then $a=$", "image": null}, "options": [{"id": "BM0NU", "text": "3", "isCorrect": false, "image": null}, {"id": "95OtM", "text": "4", "isCorrect": true, "image": null}, {"id": "kzIj6", "text": "6", "isCorrect": false, "image": null}, {"id": "Ae8uC", "text": "8", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "If $\\mathrm{f}(x)$ is an even function then\r\n\r\n$\\int_{-a}^{a} f(x) d x=2 \\int_{0}^{a} f(x) d x$\r\n\r\nHere $\\mathrm{f}(x)=x^{8}-x^{4}+x^{2}+1$ is an even function, therefore $a=4$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c56f5bfc7ab78ae7bd", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "$\\int_{0}^{10} \\frac{x^{10}}{(10-x)^{10}+x^{10}} d x$ is equal to", "image": null}, "options": [{"id": "h8qpM", "text": "10", "isCorrect": false, "image": null}, {"id": "sqtxO", "text": "5", "isCorrect": true, "image": null}, {"id": "RCfvI", "text": ^2+2^2-3.2\\right)\\left(4^2+2^2-4.2\\right) \\ldots \\ldots . .\\left(n^2+2^2-n .2\\right)}\\right]}\\end{gathered}$\n$=\\left[\\frac{1 \\cdot 2 \\cdot 3.4 .5 .6 \\ldots \\ldots \\ldots .}{5 \\cdot 6.7 .8 \\ldots \\ldots \\ldots . .}\\right]\\left[\\frac{19 \\cdot 28 \\cdot 39.52 .63 \\ldots \\ldots \\ldots . .}{7 \\cdot 12 \\cdot 19.28 .39 .52 \\ldots \\ldots . .}\\right]$\n$=\\frac{2}{7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
