ear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "64c0e86f6f5bfc7ab78aee26", "title": "Geometric Probability", "totalQuestions": 2, "questions": [{"_id": "64c0e78c6f5bfc7ab78ae5cf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "The equation of the plane containing the line \\(\\frac{\\mathrm{x}-\\mathrm{x}_1}{\\ell}=\\frac{\\mathrm{y}-\\mathrm{y}_1}{\\mathrm{~m}}=\\frac{\\mathrm{z}-\\mathrm{z}_1}{\\mathrm{n}}\\) is \\(a\\left(x-x_1\\right)+b\\left(y-y_1\\right)+c\\left(z-z_1\\right)=0\\), then", "image": null}, "options": [{"id": "3ntom", "text": "\\(\\mathrm{ax}_1+\\mathrm{by}_1+\\mathrm{cz}_1=0\\)", "image": null, "isCorrect": false}, {"id": "ELGYU", "text": "\\(a \\ell+b m+c n=0\\)", "image": null, "isCorrect": true}, {"id": "jw90Q", "text": "\\(\\frac{\\mathrm{a}}{\\ell}=\\frac{\\mathrm{b}}{\\mathrm{m}}=\\frac{\\mathrm{c}}{\\mathrm{n}}\\)", "image": null, "isCorrect": false}, {"id": "qHtRX", "text": "\\(\\ell \\mathrm{x}_1+\\mathrm{my}_1+\\mathrm{nz}_1=0\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the given plane contains the given line then the normal to the plane, must be perpendicular to the line and the condition for the same is \\(a \\ell+b m+c n=0\\).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77e6f5bfc7ab78ae550", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "It is given that the events \\(A\\) and \\(B\\) are such that \\(P(A)=\\frac{1}{4}, P(A \\mid B)=\\frac{1}{2} \\quad\\) and \\(\\quad P(B \\mid A)=\\frac{2}{3}\\). Then \\(P(B)\\) is", "image": null}, "options": [{"id": "dAIgx", "text": "\\(\\frac{1}{6}\\)", "image": null, "isCorrect": false}, {"id": "z0qG0", "text": "\\(\\frac{1}{3}\\)", "image": null, "isCorrect": true}, {"id": "ifVrU", "text": "\\(\\frac{2}{3}\\)", "image": null, "isCorrect": false}, {"id": "Stdjl", "text": "\\(\\frac{1}{2}\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(P(A)=1 / 4, P(A / B)=\\frac{1}{2}, P(B / A)=2 / 3\\)\nBy conditional probability,\n\\(\\begin{aligned}\n& P(A \\cap B)=P(A) P(B / A)=P(B) P(A / B) \\\\\n& \\Rightarrow \\frac{1}{4} \\times \\frac{2}{3}=P(B) \\times \\frac{1}{2} \\Rightarrow P(B)=\\frac{1}{3}\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
