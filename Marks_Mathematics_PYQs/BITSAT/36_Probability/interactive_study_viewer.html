t the 10 th throw $=\\mathrm{P}($ the probability of hitting the target 4 times in the first 9 throws) $\\mathrm{P}($ the probability of hitting the target at the 10 th throw $)=$\r\n$\\left[{ }^{9} \\mathrm{C}_{4}\\left(\\frac{1}{2}\\right)^{4}\\left(\\frac{1}{2}\\right)^{5}\\right]\\left(\\frac{1}{2}\\right)=\\frac{9 !}{4 ! 5 !} \\times\\left(\\frac{1}{2}\\right)^{10}=\\frac{63}{2^{9}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78a6f5bfc7ab78ae5ba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "If the mean, mode and S.D. of a frequency distribution are 41, 45 and 8 respectively, then its Pearson's coefficient of skewness is", "image": null}, "options": [{"id": "BW2hX", "text": "\\(\\frac{1}{3}\\)", "image": null, "isCorrect": false}, {"id": "SKMpG", "text": "\\(\\frac{-1}{2}\\)", "image": null, "isCorrect": true}, {"id": "QHPuO", "text": "\\(\\frac{2}{3}\\)", "image": null, "isCorrect": false}, {"id": "Xf07f", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(-\\frac{1}{2}\\), We have \\(\\mathrm{S}_{\\mathrm{K}}=\\frac{\\text { Mean }- \\text { Mode }}{\\mathrm{S} . \\mathrm{D} \\text {. }}\\)\n\\(\\frac{41-45}{8}=-\\frac{1}{2}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e86f6f5bfc7ab78aee29", "title": "Addition and Subtraction Theorems", "totalQuestions": 5, "questions": [{"_id": "65b7b88297ae24e9e2db8d0d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "If $\\mathrm{E}$ and $\\mathrm{F}$ are events such that $0 < \\mathrm{P}(\\mathrm{F}) < 1$, then", "image": null}, "options": [{"id": "0st74", "text": "$P(E \\mid F)+P(\\bar{E} \\mid F)=1$", "image": null, "isCorrect": true}, {"id": "uWgYN", "text": "$P(E \\mid F)+P(E \\mid \\bar{F})=1$", "image": null, "isCorrect": false}, {"id": "aTrgz", "text": "$P(\\bar{E} \\mid F)+P(E \\mid \\bar{F})=1$", "image": null, "isCorrect": false}, {"id": "vvWNL", "text": "$P(E \\mid \\bar{F})+P(\\bar{E} \\mid \\bar{F})=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$P(E \\mid F)+P(\\bar{E} \\mid F)$<br />$=\\frac{P(E \\cap F)+P(\\bar{E} \\cap F)}{P(F)}=\\frac{P((E \\cup \\bar{E}) \\cap F)}{P(F)}=\\frac{P(F)}{P(F)}=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b88197ae24e9e2db8d08", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "If $A$ and $B$ are mutually exclusive events and if $\\mathrm{P}(\\mathrm{B})=\\frac{1}{3}, \\mathrm{P}(\\mathrm{A} \\cup \\mathrm{B})=\\frac{13}{21}$, then $\\mathrm{P}(\\mathrm{A})$ is equal to", "image": null}, "options": [{"id": "Dfln3", "text": "<br />1/7", "image": null, "isCorrect": false}, {"id": "cW5p4", "text": "<br />4/7", "image": null, "isCorrect": false}, {"id": "GcryI", "text": "<br />2/7", "image": null, "isCorrect": true}, {"id": "cEUvA", "text": "<br />5/7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For mutually exclusive events<br />$\\mathrm{P}(\\mathrm{A} \\cup \\mathrm{B})=\\mathrm{P}(\\mathrm{A})+\\mathrm{P}(\\mathrm{B}) \\Rightarrow \\mathrm{P}(\\mathrm{A})=\\frac{2}{7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a66f5bfc7ab78ae6b4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "The probability of simultaneous occurrence of atleast one of two events $A$ and $B$ is $p .$ If the probability that exactly one of $A, B$ occurs is $q$ then $P\\left(A^{\\prime}\\right)+P\\left(B^{\\prime}\\right)$ is equal to", "image": null}, "options": [{"id": "wLLGA", "text": "$2-2 p+q$", "isCorrect": true, "image": null}, {"id": "mDpbC", "text": "$2+2 p-q$", "isCorrect": false, "image": null}, {"id": "I0rwA", "text": "$3-3 p+q$", "isCorrect": false, "image": null}, {"id": "dyhEJ", "text": "$2-p+q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since, $P($ exactly one of $A, B$ occurs $)=q$.\r\n$\\therefore \\quad P(A \\cup B)-P(A \\cap B)=q$\r\n$\\Rightarrow \\quad p-P(A \\cap B)=q \\Rightarrow P(A \\cap B)=p-q$\r\n$\\Rightarrow \\quad 1-P\\left(A^{\\prime} \\cup B^{\\prime}\\right)=p-q \\Rightarrow P\\left(A^{\\prime} \\cup B^{\\prime}\\right)=1-p+q$\r\n$\\Rightarrow \\quad P\\left(A^{\\prime}\\right)+P\\left(B^{\\prime}\\right)-P\\left(A^{\\prime} \\cap B^{\\prime}\\right)=1-p+q$\r\n$\\Rightarrow \\quad P\\left(A^{\\prime}\\right)+P\\left(B^{\\prime}\\right)=(1-p+q)+[1-P(A \\cup B)]$\r\n$=(1-p+q)+(1-p)=2-2 p+q$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7986f5bfc7ab78ae63e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "A die is loaded such that the probability of throwing the number \\(i\\) is proportional to its reciprocal. The probability that 3 appears in a single throw is-", "image": null}, "options": [{"id": "9lz3A", "text": "\\(3 / 22\\)", "image": null, "isCorrect": false}, {"id": "TGEex", "text": "\\(3 / 11\\)", "image": null, "isCorrect": false}, {"id": "DrBX2", "text": "\\(9 / 22\\)", "image": null, "isCorrect": false}, {"id": "cb6Vi", "text": "None of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\mathrm{P}(\\mathrm{i})=\\frac{\\mathrm{k}}{\\mathrm{i}} \\Rightarrow \\mathrm{1}=\\sum_{\\mathrm{i}=1}^6 \\mathrm{P}(\\mathrm{i})=\\mathrm{k} \\sum_{\\mathrm{i}=1}^6 \\frac{1}{\\mathrm{i}}=\\mathrm{k} \\frac{49}{20} \\\\\n& \\Rightarrow \\mathrm{k}=\\frac{20}{49} . \\mathrm{P}(3)=\\frac{20}{147}\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7986f5bfc7ab78ae63d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "If \\(A\\) and \\(\\mathrm{B}\\) are mutually exclusive events and if \\(\\mathrm{P}(\\mathrm{B})=\\frac{1}{3}, \\mathrm{P}(\\mathrm{A} \\cup \\mathrm{B})=\\frac{13}{21}\\), then \\(\\mathrm{P}(\\mathrm{A})\\) is equal to", "image": null}, "options": [{"id": "XgLMa", "text": "\\(1 / 7\\)", "image": null, "isCorrect": false}, {"id": "TdpTV", "text": "\\(4 / 7\\)", "image": null, "isCorrect": false}, {"id": "gS3x5", "text": "\\(2 / 7\\)", "image": null, "isCorrect": true}, {"id": "oY3Fn", "text": "\\(5 / 7\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For mutually exclusive events\n\\(\\mathrm{P}(\\mathrm{A} \\cup \\mathrm{B})=\\mathrm{P}(\\mathrm{A})+\\mathrm{P}(\\mathrm{B}) \\Rightarrow \\mathrm{P}(\\mathrm{A})=\\frac{2}{7}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e86f6f5bfc7ab78aee25", "title": "Conditional Probability and Multiplication Theorem", "totalQuestions": 6, "questions": [{"_id": "67726d02c49e8ef28ee2b38e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "For two events A and B , if $\\mathrm{P}(\\mathrm{A})=\\mathrm{P}\\left(\\frac{\\mathrm{A}}{\\mathrm{B}}\\right)=\\frac{1}{4}$ and $P\\left(\\frac{B}{A}\\right)=\\frac{1}{2}$, then which of the following is not true?", "image": null}, "options": [{"id": "bcDwx", "text": "A and B are independent", "image": null, "isCorrect": false}, {"id": "RwfJX", "text": "$\\mathrm{P}\\left(\\frac{\\mathrm{A}^{\\prime}}{\\mathrm{B}}\\right)=\\frac{3}{4}$", "image": null, "isCorrect": false}, {"id": "rCRbR", "text": "$\\mathrm{P}\\left(\\frac{\\mathrm{B}^{\\prime}}{\\mathrm{A}^{\\prime}}\\right)=\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "FqZxb", "text": "None of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{P}\\left(\\frac{\\mathrm{B}}{\\mathrm{A}}\\right)=\\frac{1}{2} \\Rightarrow \\frac{\\mathrm{P}(\\mathrm{B} \\cap \\mathrm{A})}{\\mathrm{P}(\\mathrm{A})}=\\frac{1}{2} \\Rightarrow \\mathrm{P}(\\mathrm{B} \\cap \\mathrm{A})=\\frac{1}{8}$\n$\\mathrm{P}\\left(\\frac{\\mathrm{A}}{\\mathrm{B}}\\right)=\\frac{1}{4} \\Rightarrow \\frac{\\mathrm{P}(\\mathrm{A} \\cap \\mathrm{B})}{\\mathrm{P}(\\mathrm{B})}=\\frac{1}{4} \\Rightarrow \\mathrm{P}(\\mathrm{B})=\\frac{1}{2}$\n$\\mathrm{P}(\\mathrm{A} \\cap \\mathrm{B})=\\frac{1}{8}=\\mathrm{P}(\\mathrm{A}) \\cdot \\mathrm{P}(\\mathrm{B})$\n$\\therefore$ Events A and B are independent.\nNow, $\\mathrm{P}\\left(\\frac{\\mathrm{A}^{\\prime}}{\\mathrm{B}}\\right)=\\frac{\\mathrm{P}(\\mathrm{A} \\cap \\mathrm{B})}{\\mathrm{P}(\\mathrm{B})}=\\frac{\\mathrm{P}(\\mathrm{A}) \\mathrm{P}(\\mathrm{B})}{\\mathrm{P}(\\mathrm{B})}=\\frac{3}{4}$\nand $\\mathrm{P}\\left(\\frac{\\mathrm{B}^{\\prime}}{\\mathrm{A}^{\\prime}}\\right)=\\frac{\\mathrm{P}\\left(\\mathrm{B}^{\\prime} \\cap \\mathrm{A}^{\\prime}\\right)}{\\mathrm{P}\\left(\\mathrm{A}^{\\prime}\\right)}=\\frac{\\mathrm{P}\\left(\\mathrm{B}^{\\prime}\\right) \\mathrm{P}\\left(\\mathrm{A}^{\\prime}\\right)}{\\mathrm{P}\\left(\\mathrm{A}^{\\prime}\\right)}=\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87997ae24e9e2db8cb4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "If $\\mathrm{P}(\\mathrm{B})=\\frac{3}{5}, \\mathrm{P}(\\mathrm{A} \\mid \\mathrm{B})=\\frac{1}{2}$ and $\\mathrm{P}(\\mathrm{A} \\cup \\mathrm{B})=\\frac{4}{5}$, then $\\mathrm{P}(\\mathrm{A} \\cup \\mathrm{B})^{\\prime}+\\mathrm{P}\\left(\\mathrm{A}^{\\prime} \\cup \\mathrm{B}\\right)=$", "image": null}, "options": [{"id": "jJjUM", "text": "$\\frac{1}{5}$", "image": null, "isCorrect": false}, {"id": "8gR0w", "text": "$\\frac{4}{5}$", "image": null, "isCorrect": false}, {"id": "Gmxtc", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "eqndb", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$P(B)=\\frac{3}{5}, P(A \\mid B)=\\frac{1}{2}$ and $P(A \\cup B)=\\frac{4}{5}$<br />$P(A \\cap B)=P(A \\mid B) P(B)=\\frac{1}{2} \\cdot \\frac{3}{5}=\\frac{3}{10}$<br />$\\mathrm{P}(\\mathrm{A} \\cup \\mathrm{B})=\\mathrm{P}(\\mathrm{A})+\\mathrm{P}(\\mathrm{B})-\\mathrm{P}(\\mathrm{A} \\cap \\mathrm{B})$<br />$\\mathrm{P}(\\mathrm{A})=\\frac{4}{5}-\\frac{3}{10}=\\frac{1}{2} . \\quad \\mathrm{P}\\left(\\mathrm{A}^{\\prime}\\right)=1-\\mathrm{P}(\\mathrm{A})=\\frac{1}{2}$<br />We know, $\\mathrm{P}(\\mathrm{A} \\cap \\mathrm{B})+\\mathrm{P}\\left(\\mathrm{A}^{\\prime} \\cap \\mathrm{B}\\right)=\\mathrm{P}(\\mathrm{B})$<br />[as $A \\cap B$ and $A^{\\prime} \\cap B$ are mutually exclusive events]<br />$\\Rightarrow \\quad \\frac{3}{10}+\\mathrm{P}\\left(\\mathrm{A}^{\\prime} \\cap \\mathrm{B}\\right)=\\frac{3}{5}$<br />$\\Rightarrow \\mathrm{P}\\left(\\mathrm{A}^{\\prime} \\cap \\mathrm{B}\\right)=\\frac{3}{5}-\\frac{3}{10}=\\frac{3}{10}$<br />Now, $\\mathrm{P}\\left(\\mathrm{A}^{\\prime} \\cup \\mathrm{B}\\right)=\\mathrm{P}\\left(\\mathrm{A}^{\\prime}\\right)+\\mathrm{P}(\\mathrm{B})-\\mathrm{P}\\left(\\mathrm{A}^{\\prime} \\cap \\mathrm{B}\\right)$<br />$=\\frac{1}{2}+\\frac{3}{5}-\\frac{3}{10}=\\frac{5+6-3}{10}=\\frac{4}{5}$<br />$\\mathrm{P}\\left((\\mathrm{A} \\cup \\mathrm{B})^{\\prime}\\right)=1-\\mathrm{P}(\\mathrm{A} \\cup \\mathrm{B})=1-\\frac{4}{5}=\\frac{1}{5}$<br />$\\therefore \\mathrm{P}\\left((\\mathrm{A} \\cup \\mathrm{B})^{\\prime}\\right)+\\mathrm{P}\\left(\\mathrm{A}^{\\prime} \\cup \\mathrm{B}\\right)=\\frac{1}{5}+\\frac{4}{5}=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8346f5bfc7ab78aeb83", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 1, "question": {"text": "A six faced die is a biased one. It is thrice more likely to show an odd numbers than show an even number. It is thrown twice. The probability that the sum of the numbers in two throws is even, is", "image": null}, "options": [{"id": "Zvi4E", "text": "\r\n$\\frac{5}{9}$\r\n", "isCorrect": false, "image": null}, {"id": "T8pjS", "text": "\r\n$\\frac{5}{8}$\r\n", "isCorrect": true, "image": null}, {"id": "gFC3N", "text": "\r\n$\\frac{1}{2}$\r\n", "isCorrect": false, "image": null}, {"id": "h69WU", "text": "\r\nNone of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $P$ be the probability of getting an even number. Then by hypothesis the probability of getting an odd number is $3 P$. Since the events of getting an even number and an odd number are mutually exclusive and exhaustive.\r\n$$\r\n\\therefore \\quad P+3 P=1 \\Rightarrow P=1 / 4\r\n$$\r\nThus, the probability of getting an odd number in a single throw is $\\frac{3}{4}$ and that of an even number is $\\frac{1}{4}$.\r\nIf the die is thrown twice, then the sum of the numbers in two throws is even if both the numbers are even or both are odd.\r\n$$\r\n\\therefore \\text { Required probability }=\\frac{3}{4} \\times \\frac{3}{4}+\\frac{1}{4} \\times \\frac{1}{4}=\\frac{10}{16}=\\frac{5}{8}\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f16f5bfc7ab78ae935", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 3, "question": {"text": "If the papers of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> students can be checked by any one of the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math> teachers, then the probability that all the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> papers are checked by exactly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> teachers, is equal to", "image": null}, "options": [{"id": "ETKZ1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>49</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "e4tNG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>6</mn><mn>49</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "1F4LZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>49</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "zO5Cu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>49</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Total ways in which papers can be checked is equal&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>7</mn><mn>4</mn></msup></math>. Now, two teachers who have to check all the papers can be selected in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>7</mn></mmultiscripts></math> ways and papers can be checked by them is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mn>2</mn><mn>4</mn></msup><mo>-</mo><mn>2</mn></mrow></mfenced></math> favourable ways.</p><p>Thus, required probability</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mmultiscripts><mi>C</mi><mn>2</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts><mfenced><mrow><msup><mn>2</mn><mn>4</mn></msup><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><msup><mn>7</mn><mn>4</mn></msup></mfrac><mo>=</mo><mfrac><mn>6</mn><mn>49</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b86f5bfc7ab78ae74a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "For $k=1,2,3$ the box $\\mathrm{B}_{k}$ contains $k$ red balls and $(k+1)$ white balls. Let $\\mathrm{P}\\left(\\mathrm{B}_{1}\\right)=\\frac{1}{2}, \\mathrm{P}\\left(\\mathrm{B}_{2}\\right)=\\frac{1}{3}$ and\r\n\r\n$\\mathrm{P}\\left(\\mathrm{B}_{3}\\right)=\\frac{1}{6} . \\mathrm{A}$ box is selected at random and a ball is drawn from it. If a red ball is drawn, then the probability that it has come from box $\\mathrm{B}_{2},$ is", "image": null}, "options": [{"id": "c0ebK", "text": "$\\frac{35}{78}$", "isCorrect": false, "image": null}, {"id": "E26hH", "text": "$\\frac{14}{39}$", "isCorrect": true, "image": null}, {"id": "yQFVg", "text": "$\\frac{10}{13}$", "isCorrect": false, "image": null}, {"id": "xqb3a", "text": "$\\frac{12}{13}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\operatorname{In}$ a box, $B_{1}=1 R, 2 W ; B_{2}=2 R, 3 W$ and $B_{3}=3 R, 4 W$\r\n\r\nAlso, given that, $\\mathrm{P}\\left(\\mathrm{B}_{1}\\right)=\\frac{1}{2}, \\mathrm{P}\\left(\\mathrm{B}_{2}\\right)=\\frac{1}{3}$\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n& \\text { and } P\\left(B_{3}\\right)=\\frac{1}{6} \\\\\r\n\r\n\\therefore \\quad & P\\left(\\frac{B_{2}}{R}\\right)=\\frac{P\\left(B_{2}\\right) P\\left(\\frac{R}{B_{2}}\\right)}{P\\left(B_{1}\\right) P\\left(\\frac{R}{B_{1}}\\right)+P\\left(B_{2}\\right) P\\left(\\frac{R}{B_{2}}\\right)+P\\left(B_{3}\\right) P\\left(\\frac{R}{B_{3}}\\right)} \\\\\r\n\r\n=& \\frac{\\frac{1}{3} \\times \\frac{2}{5}}{\\frac{1}{2} \\times \\frac{1}{3}+\\frac{1}{3} \\times \\frac{2}{5}+\\frac{1}{6} \\times \\frac{3}{7}}=\\frac{\\frac{2}{15}}{\\frac{1}{6}+\\frac{2}{15}+\\frac{1}{14}}=\\frac{14}{39} .\r\n\r\n\\end{aligned}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77e6f5bfc7ab78ae54f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "A line segment has length 63 and direction ratios are \\(3,-2,6\\). If the line makes an obtuse angle with \\(\\mathrm{x}\\)-axis, the components of the line vector are", "image": null}, "options": [{"id": "6q1dO", "text": "\\(27,-18,54\\)", "image": null, "isCorrect": false}, {"id": "VwFlH", "text": "\\(-27,18,54\\)", "image": null, "isCorrect": false}, {"id": "PTNap", "text": "\\(-27,18,-54\\)", "image": null, "isCorrect": true}, {"id": "6IUeh", "text": "\\(27,-18,-54\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the components of the line vector be a, b, c. Then \\(\\mathrm{a}^2+\\mathrm{b}^2+\\mathrm{c}^2=(63)^2\\) ...(i)\nAlso \\(\\frac{\\mathrm{a}}{3}=\\frac{\\mathrm{b}}{-2}=\\frac{\\mathrm{c}}{6}=\\lambda\\) (say), then \\(\\mathrm{a}=3 \\lambda\\), \\(\\mathrm{b}=-2 \\lambda\\) and \\(\\mathrm{c}=6 \\lambda\\) and from (i) we have \\(9 \\lambda^2+4 \\lambda^2+36 \\lambda^2=(63)^2\\)\n\\(\\Rightarrow 49 \\lambda^2=(63)^2\\)\n\\(\\Rightarrow \\lambda= \\pm \\frac{63}{7}= \\pm 9\\)\nSince \\(a=3 \\lambda  < 0\\) as the line makes an obtuse angle with \\(x\\)-axis, \\(\\lambda=-9\\) and the required components are \\(-27,18,-54\\).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e86f6f5bfc7ab78aee28", "title": "Independent Events", "totalQuestions": 2, "questions": [{"_id": "64c0e8006f5bfc7ab78ae9ba", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> are two independent events. If the probability that both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> occur together is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>6</mn></mfrac></math> and the probability that neither of them occurs is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math>, then the probability of occurrence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is", "image": null}, "options": [{"id": "QtMpA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mtext>&#160;or&#160;</mtext><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "N9DZR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext>&#160;or&#160;</mtext><mfrac><mn>1</mn><mn>3</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "c50rX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext>&#160;or&#160;</mtext><mfrac><mn>1</mn><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "YHWeg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><mtext>&#160;or&#160;</mtext><mfrac><mn>1</mn><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>6</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><msup><mi>A</mi><mi>C</mi></msup><mo>&#8745;</mo><msup><mi>B</mi><mi>C</mi></msup></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mfenced><mrow><mi>A</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced><mi>C</mi></msup><mo>=</mo><mi>P</mi><mfenced><mrow><msup><mi>A</mi><mi>C</mi></msup><mo>&#8745;</mo><msup><mi>B</mi><mi>C</mi></msup></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>-</mo><mi>P</mi><mfenced><mrow><mi>A</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mfenced><mrow><mi>A</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math></p><p>But&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mi>A</mi><mo>&#8746;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mi>P</mi><mfenced><mi>A</mi></mfenced><mo>+</mo><mi>P</mi><mfenced><mi>B</mi></mfenced><mo>-</mo><mi>P</mi><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mfenced><mi>A</mi></mfenced><mo>+</mo><mi>P</mi><mfenced><mi>B</mi></mfenced><mo>=</mo><mfrac><mn>5</mn><mn>6</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> are independent events</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>P</mi><mfenced><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mi>P</mi><mfenced><mi>A</mi></mfenced><mi>P</mi><mfenced><mi>B</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mfenced><mi>A</mi></mfenced><mi>P</mi><mfenced><mi>B</mi></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>6</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced open=\"[\" close=\"]\"><mrow><mi>P</mi><mfenced><mi>A</mi></mfenced><mo>-</mo><mi>P</mi><mfenced><mi>B</mi></mfenced></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mfenced open=\"[\" close=\"]\"><mrow><mi>P</mi><mfenced><mi>A</mi></mfenced><mo>+</mo><mi>P</mi><mfenced><mi>B</mi></mfenced></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>P</mi><mfenced><mi>A</mi></mfenced><mi>P</mi><mfenced><mi>B</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>25</mn><mn>36</mn></mfrac><mo>-</mo><mfrac><mn>4</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>36</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mfenced><mi>A</mi></mfenced><mo>-</mo><mi>P</mi><mfenced><mi>B</mi></mfenced><mo>=</mo><mo>&#177;</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>ii</mi></mfenced></math></p><p>On solving Eqs. (i) and (ii), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mi>A</mi></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext>&#160;or&#160;</mtext><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>Hence, option (b) is correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78c6f5bfc7ab78ae5d0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "If mean of a poisson distribution of a random variable \\(X\\) is 2 , then the value of \\(P(X > 1.5)\\) is", "image": null}, "options": [{"id": "rifGI", "text": "\\(\\frac{3}{e^2}\\)", "image": null, "isCorrect": false}, {"id": "u3YIL", "text": "\\(\\frac{3}{e}\\)", "image": null, "isCorrect": false}, {"id": "K0dji", "text": "\\(1-\\frac{3}{e}\\)", "image": null, "isCorrect": false}, {"id": "jNFfP", "text": "\\(1-\\frac{3}{e^2}\\)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Since, \\(\\mathrm{P}(\\mathrm{X}=\\mathrm{r})=\\frac{e^{-\\lambda} \\lambda^r}{r !}\\) (where \\(\\lambda=\\) mean)\n\\(\\begin{aligned}\n\\therefore \\quad & \\mathrm{P}(\\mathrm{X}=\\mathrm{r} > 1.5)=\\mathrm{P}(2)+\\mathrm{P}(3)+\\ldots \\infty \\\\\n& =1-\\mathrm{P}(\\mathrm{X}=\\mathrm{r} \\leq 1)=1-\\mathrm{P}(0)-\\mathrm{P}(1) \\\\\n& =1-\\left(e^{-2}+\\frac{e^{-2} \\times 2}{1 !}\\right)=1-\\frac{3}{e^2}\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8706f5bfc7ab78aee2b", "title": "Total Probability", "totalQuestions": 9, "questions": [{"_id": "67726d0fc49e8ef28ee2b3ed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "The probability that certain electronic component fails when first used is 0.10 . If it does not fail immediately, the probability that it lasts for one year is 0.99 . The probability that a new component will last for one year is", "image": null}, "options": [{"id": "2sjnL", "text": "$0.9$", "image": null, "isCorrect": false}, {"id": "ze0b3", "text": "$0.01$", "image": null, "isCorrect": false}, {"id": "0RDlt", "text": "$0.119$", "image": null, "isCorrect": false}, {"id": "f65sZ", "text": "$0.891$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$P$ (The electronic component fails when first\n$\\begin{aligned}\n& \\text { used })=P(F)=0.10 \\\\\n& \\therefore P(\\bar{F})=1-P(F)=0.90\n\\end{aligned}$\nLet $E$ be the event that a new component will last for one year, then\n$P(E)=P(F) \\cdot P\\left(\\frac{E}{F}\\right)+P(\\bar{F}) P\\left(\\frac{E}{\\bar{F}}\\right)$\n[Total probability theorem]\n$=0.10 \\times 0+0.90 \\times 0.99=0.891$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cffc49e8ef28ee2b377", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "A book contains 1000 pages. A page is chosen at random. The probability that the sum of the digits of the marked number on the page is equal to 9 , is", "image": null}, "options": [{"id": "6xBQ9", "text": "$\\frac{23}{500}$", "image": null, "isCorrect": false}, {"id": "cBPcv", "text": "$\\frac{11}{200}$", "image": null, "isCorrect": true}, {"id": "MdWgX", "text": "$\\frac{7}{100}$", "image": null, "isCorrect": false}, {"id": "bGrVz", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$n(S)=$ Total number of ways $=1000$\nThe favourable cases that the sum of the digits of the marked number on the page is equal to 9 are one digit number or two digits numbers or three digits numbers, if three digit number is $a b c$. \nThen,\n$a+b+c=9 ; 0 \\leq a, b, c \\leq 9$.\n$\\therefore n(E)=$ Number of favourable ways\n$=$ Number of solutions of the equation\n$={ }^{9+3-1} C_{3-1}={ }^{11} C_2=55$\n$\\therefore$ Required probability\n$=\\frac{n(E)}{n(S)}=\\frac{55}{1000}=\\frac{11}{200}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87897ae24e9e2db8caa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "Bag $P$ contains 6 red and 4 blue balls and bag $Q$ contains 5 red and 6 blue balls. A ball is transferred from bag $P$ to bag $Q$ and then a ball is drawn from bag $Q$. What is the probability that the ball drawn is blue?", "image": null}, "options": [{"id": "ijFNW", "text": "$\\frac{7}{15}$", "image": null, "isCorrect": false}, {"id": "Tp3I7", "text": "$\\frac{8}{15}$", "image": null, "isCorrect": true}, {"id": "8WTgB", "text": "$\\frac{4}{19}$", "image": null, "isCorrect": false}, {"id": "iqakS", "text": "$\\frac{8}{19}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $E_1, E_2$ and $A$ be the events defined as follows:<br />$\\mathrm{E}_1=$ red ball is transferred from bag $\\mathrm{P}$ to bag $\\mathrm{Q}$<br />$\\mathrm{E}_2=$ blue ball is transferred from bag $\\mathrm{P}$ to bag $\\mathrm{Q}$<br />$\\mathrm{A}=$ the ball drawn from bag $\\mathrm{Q}$ is blue<br />As the bag $\\mathrm{P}$ contains 6 red and 4 blue balls,<br />$P\\left(E_1\\right)=\\frac{6}{10}=\\frac{3}{5} \\text { and } P\\left(E_2\\right)=\\frac{4}{10}=\\frac{2}{5}$<br />Note that $E_1$ and $E_2$ are mutually exclusive and exhaustive events.<br />When $E_1$ has occurred i.e., a red ball has already been transferred from bag $P$ to $Q$, then bag $Q$ will contain 6 red and 6 blue balls, So, $P\\left(A \\mid E_1\\right)=$$\\frac{6}{12}=\\frac{1}{2}$<br />When $E_2$ has occurred i.e., a blue ball has already been transferred from bag $P$ to $Q$, then bag $Q$ will contain 5 red and 7 blue balls, So, $P\\left(A \\mid E_2\\right)=$$\\frac{7}{12}$<br />By using law of total probability, we get<br />$P(A)=P\\left(E_1\\right) P\\left(A \\mid E_1\\right)+P\\left(E_2\\right) P\\left(A \\mid E_2\\right)$<br />$=\\frac{3}{5} \\times \\frac{1}{2}+\\frac{2}{5} \\times \\frac{7}{12}=\\frac{8}{15}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e81a6f5bfc7ab78aeaa0", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 3, "question": {"text": "The probability that certain electronic component fails when first used is 0.10 . If it does not fail immediately, the probability that it lasts for one year is $0.99 .$ The probability that a new component will last for one year is", "image": null}, "options": [{"id": "p5ZOv", "text": "0.99", "isCorrect": false, "image": null}, {"id": "m56Ns", "text": "0.871", "isCorrect": false, "image": null}, {"id": "yhZKn", "text": "0.891", "isCorrect": true, "image": null}, {"id": "laxkL", "text": "0.762", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Probability that the electronic component fails when first used is $P(F)=0.10$. Therefore, $P\\left(F^{\\prime}\\right)=1-P(F)=0.90$\r\n\r\nLet $E$ be the event that a new component will last for one year.\r\n\r\n$\\text { Then, } P(E)=P(F) P\\left(\\frac{E}{F}\\right)+P\\left(F^{\\prime}\\right) P\\left(\\frac{E}{F^{\\prime}}\\right)$\r\n\r\n[total probability theorem] $=0.10 \\times 0+0.90 \\times 0.99=0.891$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d46f5bfc7ab78ae831", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "A bag contains 3 red and 3 white balls. Two balls are drawn one by one. The probability that they are of different colours is.", "image": null}, "options": [{"id": "NpQpJ", "text": "$3 / 10$", "isCorrect": false, "image": null}, {"id": "yQg7w", "text": "$2 / 5$", "isCorrect": false, "image": null}, {"id": "vjrDt", "text": "$3 / 5$", "isCorrect": true, "image": null}, {"id": "tQADv", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\mathrm{A} \\equiv$ event that drawn ball is red $\\mathrm{B} \\equiv$ event that drawn ball is white Then $\\mathrm{AB}$ and $\\mathrm{BA}$ are two disjoint cases of the given event.\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\therefore P(A B+B A)=P(A B)+P(B A) \\\\\r\n\r\n=P(A) \\quad P\\left(\\frac{B}{A}\\right)+P(B) \\quad P\\left(\\frac{A}{B}\\right)\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\n$=\\frac{3}{6} \\cdot \\frac{3}{5}+\\frac{3}{6} \\cdot \\frac{3}{5}=\\frac{3}{5}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d16f5bfc7ab78ae822", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "A bag contains $(2 n+1)$ coins. It is known that n of these coins have a head on both sides, whereas the remaining $(\\mathrm{n}+1)$ coins are fair. A coin is picked up at random from the bag and tossed. If the probability that the toss results in a head is $31 / 42,$ then $\\mathrm{n}$ is equal to", "image": null}, "options": [{"id": "tjw82", "text": "10", "isCorrect": true, "image": null}, {"id": "WMUzE", "text": "11", "isCorrect": false, "image": null}, {"id": "Mq41E", "text": "12", "isCorrect": false, "image": null}, {"id": "zv4gu", "text": "13", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total number of coins $=2 \\mathrm{n}+1$\r\n\r\nConsider the following events:\r\n\r\n$\\mathrm{E}_{1}=$ Getting a coin having head on both\r\n\r\nsides from the bag.\r\n\r\n$\\mathrm{E}_{2}=$ Getting a fair coin from the bag\r\n\r\n$\\mathrm{A}=$ Toss results in a head\r\n\r\nGiven: $\\mathrm{P}(\\mathrm{A})=\\frac{31}{42}, \\mathrm{P}\\left(\\mathrm{E}_{1}\\right)=\\frac{\\mathrm{n}}{2 \\mathrm{n}+1}$\r\n\r\nand $\\mathrm{P}\\left(\\mathrm{E}_{2}\\right)=\\frac{\\mathrm{n}+1}{2 \\mathrm{n}+1}$\r\n\r\nThen,\r\n\r\n$\\mathrm{P}(\\mathrm{A})=\\mathrm{P}\\left(\\mathrm{E}_{1}\\right) \\mathrm{P}\\left(\\mathrm{A} / \\mathrm{E}_{1}\\right)+\\mathrm{P}\\left(\\mathrm{E}_{2}\\right) \\mathrm{P}\\left(\\mathrm{A} / \\mathrm{E}_{2}\\right)$\r\n\r\n$\\Rightarrow \\frac{31}{42}=\\frac{n}{2 n+1} \\times 1+\\frac{n+1}{2 n+1} \\times \\frac{1}{2}$\r\n\r\n$\\frac{31}{42}=\\frac{n}{2 n+1}+\\frac{n+1}{2(2 n+1)}$\r\n\r\n$\\Rightarrow \\frac{31}{42}=\\frac{3 n+1}{2(2 n+1)}$\r\n\r\n$\\Rightarrow \\frac{31}{21}=\\frac{3 n+1}{2 n+1}$\r\n\r\n$n=10$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c66f5bfc7ab78ae7c4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "A bag contains $n+1$ coins. It is known that one of these coins shows heads on both sides, whereas the other coins are fair. One coin is selected at random and tossed. If the probability that toss results in heads is $\\frac{7}{12},$ then the value of $n$ is.", "image": null}, "options": [{"id": "Idxen", "text": "3", "isCorrect": false, "image": null}, {"id": "c5jX7", "text": "4", "isCorrect": false, "image": null}, {"id": "IQXXI", "text": "5", "isCorrect": true, "image": null}, {"id": "DnzZF", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $E_{1}$ denote the event \"a coin with head on both sides is selected\" and $\\mathrm{E}_{2}$ denotes the event \" a fair coin is selected\". Let $A$ be\r\n\r\nthe event \" he toss, results in heads\".\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\therefore \\mathrm{P}\\left(\\mathrm{E}_{1}\\right)=\\frac{1}{n+1}, \\mathrm{P}\\left(\\mathrm{E}_{2}\\right)=\\frac{n}{n+1} \\text { and } \\\\\r\n\r\n\\mathrm{P}\\left(\\frac{\\mathrm{A}}{\\mathrm{E}_{1}}\\right)=1, \\mathrm{P}\\left(\\frac{\\mathrm{A}}{\\mathrm{E}_{2}}\\right)=\\frac{1}{2} \\\\\r\n\r\n\\therefore \\mathrm{P}(\\mathrm{A})=\\mathrm{P}\\left(\\mathrm{E}_{1}\\right) \\mathrm{P}\\left(\\frac{\\mathrm{A}}{\\mathrm{E}_{1}}\\right)+\\mathrm{P}\\left(\\mathrm{E}_{2}\\right) \\mathrm{P}\\left(\\frac{\\mathrm{A}}{\\mathrm{E}_{2}}\\right) \\\\\r\n\r\n\\Rightarrow \\frac{7}{12}=\\frac{1}{n+1} \\times 1+\\frac{n}{n+1} \\times \\frac{1}{2} \\\\\r\n\r\n\\Rightarrow 14 n+14=24+12 n \\Rightarrow n=5\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c46f5bfc7ab78ae7b3", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "A bag contains 5 brown and 4 white socks. $A$ man pulls out 2 socks. Find the probability that they are of the same colour.", "image": null}, "options": [{"id": "eMWcY", "text": "$\\frac{4}{9}$", "isCorrect": true, "image": null}, {"id": "7kcMV", "text": "$\\frac{2}{9}$", "isCorrect": false, "image": null}, {"id": "zK30e", "text": "$\\frac{5}{9}$", "isCorrect": false, "image": null}, {"id": "plWlb", "text": "$\\frac{7}{9}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $A \\equiv$ event of two socks being brown. $\\mathrm{B} \\equiv$ event of two socks being white.\r\n\r\n$$\r\n\r\n\\text { Then } \\begin{aligned}\r\n\r\n& P(A)=\\frac{{ }^{5} C_{2}}{{ }^{9} C_{2}}=\\frac{5.4}{9.8}=\\frac{5}{18}, \\mathrm{P}(\\mathrm{B}) \\\\\r\n\r\n&=\\frac{{ }^{4} \\mathrm{C}_{2}}{{ }^{9} \\mathrm{C}_{2}}=\\frac{4.3}{9.8}=\\frac{3}{18}\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\nNow, since $\\mathrm{A}$ and $\\mathrm{B}$ are mutually exclusive events, so required probability\r\n\r\n$$\r\n\r\n=\\mathrm{P}(\\mathrm{A})+\\mathrm{P}(\\mathrm{B})=\\frac{5}{18}+\\frac{3}{18}=\\frac{4}{9}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b86f5bfc7ab78ae74b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "The probability of India winning a test match against West Indies is $1 / 2$. Assuming independence from match to match, the probability that in a 5 match series India's second win occurs at the third test, is -", "image": null}, "options": [{"id": "H2xdx", "text": "$2 / 3$", "isCorrect": false, "image": null}, {"id": "l7dgU", "text": "$1 / 2$", "isCorrect": false, "image": null}, {"id": "PalNC", "text": "$1 / 4$", "isCorrect": true, "image": null}, {"id": "JRfT6", "text": "$1 / 8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The sample space is [LWW, WLW]\r\n\r\n$$\r\n\r\n\\therefore P(\\mathrm{LWW})+\\mathrm{P}(\\mathrm{WLW})\r\n\r\n$$\r\n\r\n= Probability that in 5 match series, it is India's second win\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n=P(\\mathrm{~L}) \\mathrm{P}(\\mathrm{W}) \\mathrm{P}(\\mathrm{W})+\\mathrm{P}(\\mathrm{W}) \\mathrm{P}(\\mathrm{L}) \\mathrm{P}(\\mathrm{W}) \\\\\r\n\r\n=\\frac{1}{8}+\\frac{1}{8}=\\frac{2}{8}=\\frac{1}{4}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64c0e8706f5bfc7ab78aee2d", "title": "Baye's Theorem", "totalQuestions": 2, "questions": [{"_id": "64c0e82a6f5bfc7ab78aeb2b", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "Girl students constitute $10 \\%$ of I year and $5 \\%$ of II year at Roorkee University. During summer holidays $70 \\%$ of the I year and $30 \\%$ of II year students are given a project. The girls take turns on duty in canteen. The chance that I year girl student is on duty in a randomly selected day is", "image": null}, "options": [{"id": "0A61E", "text": "$\\frac{3}{17}$", "isCorrect": false, "image": null}, {"id": "XwWRx", "text": "$\\frac{14}{17}$", "isCorrect": true, "image": null}, {"id": "gJbUy", "text": "$\\frac{3}{10}$", "isCorrect": false, "image": null}, {"id": "Xjtyu", "text": "$\\frac{7}{10}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The desired probability\r\n\r\n$=\\frac{\\frac{10}{100} \\times \\frac{70}{100}}{\\frac{10}{100} \\times \\frac{70}{100}+\\frac{5}{100} \\times \\frac{30}{100}}=\\frac{14}{17}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8006f5bfc7ab78ae9bb", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 2, "question": {"text": "In a test an examiner either guesses or copies or knows the answer to a multiple choice question with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> choices. The probability that he/she makes a guess is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math>. The probability that he/she copies the answer is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>6</mn></mfrac></math>.&nbsp;If the probability that the answer is correct, given that he/she copied it is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>8</mn></mfrac></math>, then the probability that he/she knows the answer to a question given that he/she correctly answered it, is", "image": null}, "options": [{"id": "87rtO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>27</mn><mn>29</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "MR2cc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>26</mn><mn>29</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "MSUXu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>29</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "qR888", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>29</mn></mfrac></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> be the event that the examinee gives the correct answer.</p><p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>G</mi><mo>,</mo><mo>&#160;</mo><mi>C</mi><mo>,</mo><mo>&#160;</mo><mi>K</mi></math> stand for guessing, copying and knowing. respectively.</p><p>Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mi>C</mi></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>,</mo><mo>&#160;</mo><mi>P</mi><mfenced><mi>G</mi></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mfrac><mi>A</mi><mi>C</mi></mfrac></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>8</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mfenced><mi>C</mi></mfenced><mo>+</mo><mi>P</mi><mfenced><mi>G</mi></mfenced><mo>+</mo><mi>P</mi><mfenced><mi>K</mi></mfenced><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>+</mo><mi>P</mi><mfenced><mi>K</mi></mfenced><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>P</mi><mfenced><mi>K</mi></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mfrac><mi>A</mi><mi>K</mi></mfrac></mfenced><mo>=</mo><mn>1</mn><mo>,</mo></math> for if the examinee knows, he/she will correctly answer it and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mfrac><mi>A</mi><mi>G</mi></mfrac></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>,</mo></math></p><p>&nbsp;since there are four choices.</p><p>Now, total probability&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mi>A</mi></mfenced><mo>=</mo><mi>P</mi><mfenced><mi>G</mi></mfenced><mi>P</mi><mfenced><mfrac><mi>A</mi><mi>G</mi></mfrac></mfenced><mo>+</mo><mi>P</mi><mfenced><mi>C</mi></mfenced><mi>P</mi><mfenced><mfrac><mi>A</mi><mi>C</mi></mfrac></mfenced><mo>+</mo><mi>P</mi><mfenced><mi>K</mi></mfenced><mi>P</mi><mfenced><mfrac><mi>A</mi><mi>K</mi></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#183;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>&#183;</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#183;</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>12</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>48</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>24</mn></mrow><mn>48</mn></mfrac><mo>=</mo><mfrac><mn>29</mn><mn>48</mn></mfrac></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mfrac><mi>K</mi><mi>A</mi></mfrac></mfenced><mo>=</mo><mfrac><mrow><mi>P</mi><mfenced><mi>K</mi></mfenced><mi>P</mi><mfenced><mfrac><mi>A</mi><mi>K</mi></mfrac></mfenced></mrow><mrow><mi>P</mi><mfenced><mi>A</mi></mfenced></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#183;</mo><mn>1</mn></mrow><mfrac><mn>29</mn><mn>48</mn></mfrac></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#183;</mo><mfrac><mn>48</mn><mn>29</mn></mfrac><mo>=</mo><mfrac><mn>24</mn><mn>29</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "64c0e8706f5bfc7ab78aee2a", "title": "Bernoulli Trial and Binomial Distribution", "totalQuestions": 7, "questions": [{"_id": "67726d19c49e8ef28ee2b43c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "In a binomial distribution, the mean is 4 and variance is 3 . Then, its mode is", "image": null}, "options": [{"id": "Fpjdu", "text": "5", "image": null, "isCorrect": false}, {"id": "klI18", "text": "6", "image": null, "isCorrect": false}, {"id": "ArMSv", "text": "4", "image": null, "isCorrect": true}, {"id": "13NOr", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n\\text {  } \\text { Mean } & =n p=4 \\\\\n\\text { Variance } & =n p q=3 \\\\\n\\Rightarrow \\quad q & =\\frac{3}{4}\n\\end{aligned}$\nand \n$p=1-q=1-\\frac{3}{4}=\\frac{1}{4}$\n$\\Rightarrow \\quad n=16$\nNow, Mode of Binomial distribution is given by $(n+1) P$\nCase IIf $(n+1) P=\\operatorname{Integer}(I)$, then Mode $=\\{I, I-1\\}$\nCase II If $(n+1) P \\neq \\operatorname{Integer}(I+f)$, then Mode $=\\{I\\}$\n$\\begin{aligned}\n\\therefore(n+1) P & =(16+1) \\frac{1}{4} \\\\\n& =\\frac{17}{4}=4.25 \\\\\n& =4+0.25 \\\\\n\\Rightarrow \\text { Mode } & =4\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d0fc49e8ef28ee2b3ef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "Given below is the distribution of a random variable $X$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Q5-heWLThC6NnXin5HS3O4UMpq5gvwowxwGjoQPYuuU.original.fullsize.png\"/>\nIf $\\alpha=\\mathrm{P}(X \\lt 3)$ and $\\beta=\\mathrm{P}(X\\gt2)$, then $\\alpha: \\beta=$", "image": null}, "options": [{"id": "kgybr", "text": "$2: 5$", "image": null, "isCorrect": false}, {"id": "W1ziH", "text": "$3: 4$", "image": null, "isCorrect": false}, {"id": "CtzUn", "text": "$4: 5$", "image": null, "isCorrect": false}, {"id": "40XCG", "text": "$3: 7$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a distribution of random variable $x$, $\\alpha=P\\left(X^6 \\lt 3\\right)=P\\left(X^6=1\\right)+P\\left(X^6=2\\right)$\n$\\begin{aligned} & =\\lambda+2 \\lambda=3 \\lambda \\\\ & \\text { and } \\beta=P\\left(X^6 \\lt 2\\right)=P\\left(X^6=3\\right)+P\\left(X^6=4\\right) \\\\ & =3 \\lambda+4 \\lambda=3 \\lambda \\\\ & \\therefore \\quad \\alpha: \\beta=3: 7\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f26f5bfc7ab78ae93b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "A coin is tossed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math> times. Each time a man calls head. The probability that he wins the toss at least four times is", "image": null}, "options": [{"id": "tQbfx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "Rhv8s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>8</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "nadym", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "QP7DD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>6</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The man has to win atleast <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> times.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Required probability</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mmultiscripts><mi>C</mi><mn>4</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mn>4</mn></msup><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mn>3</mn></msup><mo>+</mo><mmultiscripts><mi>C</mi><mn>5</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mn>5</mn></msup><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mmultiscripts><mi>C</mi><mn>6</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mn>6</mn></msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mo>+</mo><mmultiscripts><mi>C</mi><mn>7</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mn>7</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mmultiscripts><mi>C</mi><mn>4</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts><mo>+</mo><mmultiscripts><mi>C</mi><mn>5</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts><mo>+</mo><mmultiscripts><mi>C</mi><mn>6</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts><mo>+</mo><mmultiscripts><mi>C</mi><mn>7</mn><none/><mprescripts/><none/><mn>7</mn></mmultiscripts></mrow></mfenced><mo>&#215;</mo><mfrac><mn>1</mn><msup><mn>2</mn><mn>7</mn></msup></mfrac><mo>=</mo><mfrac><mn>64</mn><msup><mn>2</mn><mn>7</mn></msup></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e46f5bfc7ab78ae8c4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 3, "question": {"text": "A man takes a step forward with probability 0.4 and backward with probability 0.6 . The probability that at the end of eleven steps he is one step away from the starting point is", "image": null}, "options": [{"id": "CFdg1", "text": "$\\frac{2^{5} \\cdot 3^{5}}{5^{10}}$", "isCorrect": false, "image": null}, {"id": "GQZRR", "text": "$462 \\times\\left(\\frac{6}{25}\\right)^{5}$", "isCorrect": true, "image": null}, {"id": "bZxC9", "text": "$231 \\times \\frac{3^{5}}{5^{10}}$", "isCorrect": false, "image": null}, {"id": "tE5Zu", "text": "none of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "As $0.4+0.6=1$, the man either takes a step forward or a step backward. Let a step forward be a success and a step backward be a failure. Then, the probability of success in one step\r\n\r\n$=p=0.4=\\frac{2}{5}$\r\n\r\nThe probability of failure in one step\r\n\r\n$=\\mathrm{q}=0.6=\\frac{3}{5}$\r\n\r\nIn 11 steps he will be one step away from the starting point if the numbers of successes and failures differ by 1 . So, the number of successes $=6$\r\n\r\nThe number of failures $=5$\r\n\r\nor the number of successes $=5$, The number of failures $=6$\r\n\r\n$\\therefore$ the required probability\r\n\r\n$={ }^{11} \\mathrm{C}_{6} \\mathrm{p}^{6} \\mathrm{q}^{5}+{ }^{11} \\mathrm{C}_{5} \\mathrm{p}^{5} \\mathrm{q}^{6}$\r\n\r\n$={ }^{11} \\mathrm{C}_{6}\\left(\\frac{2}{5}\\right)^{6} \\cdot\\left(\\frac{3}{5}\\right)^{5}+{ }^{11} \\mathrm{C}_{5}\\left(\\frac{2}{5}\\right)^{5}\\left(\\frac{3}{5}\\right)^{6}$\r\n\r\n$=\\frac{11 !}{6 ! 5 !}\\left(\\frac{2}{5}\\right)^{5} \\cdot\\left(\\frac{3}{5}\\right)^{5}\\left\\{\\frac{2}{5}+\\frac{3}{5}\\right\\}$\r\n\r\n$=\\frac{11.10 .9 .8 .7}{120} \\cdot \\frac{2^{5} \\cdot 3^{5}}{5^{10}}=462 \\times\\left(\\frac{6}{25}\\right)^{5}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d66f5bfc7ab78ae845", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "If in a binomial distribution $\\mathrm{n}=4, \\mathrm{P}(\\mathrm{X}=0)=\\frac{16}{81}$, then $\\mathrm{P}(\\mathrm{X}=4)$ equals", "image": null}, "options": [{"id": "GapeH", "text": "$\\frac{1}{16}$", "isCorrect": false, "image": null}, {"id": "CxnJk", "text": "$\\frac{1}{81}$", "isCorrect": true, "image": null}, {"id": "TfiPq", "text": "$\\frac{1}{27}$", "isCorrect": false, "image": null}, {"id": "WMdb3", "text": "$\\frac{1}{8}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $n=4$ and $P(X=0)=\\frac{16}{81}$\r\n\r\nLet $\\mathrm{p}$ be the probability of success and $\\mathrm{q}$ that of failure in a trial.\r\n\r\n$$\r\n\r\n\\text { Then, } \\mathrm{P}(\\mathrm{X}=0)={ }^{4} \\mathrm{C}_{0} \\mathrm{p}^{0} \\mathrm{q}^{4}=\\frac{16}{81}\r\n\r\n$$\r\n\r\n$\\Rightarrow \\quad \\mathrm{q}^{4}=\\left(\\frac{2}{3}\\right)^{4}$\r\n\r\n$\\left(\\because{ }^{n} C_{0}=1\\right)$\r\n\r\n$\\Rightarrow \\quad \\mathrm{q}=\\frac{2}{3} \\Rightarrow \\mathrm{p}=\\frac{1}{3}$\r\n\r\n$\\therefore \\quad \\mathrm{P}(\\mathrm{X}=4)={ }^{4} \\mathrm{C}_{4} \\mathrm{p}^{4} \\mathrm{q}^{0}=\\mathrm{p}^{4}=\\left(\\frac{1}{3}\\right)^{4}=\\frac{1}{81}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c66f5bfc7ab78ae7c5", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "A coin is tossed 7 times. Each time a man calls head. Find the probability that he wins the toss on more occasions.", "image": null}, "options": [{"id": "WmGn1", "text": "$\\frac{2}{3}$", "isCorrect": false, "image": null}, {"id": "0kgXF", "text": "$\\frac{1}{2}$", "isCorrect": true, "image": null}, {"id": "C9BiN", "text": "$\\frac{3}{4}$", "isCorrect": false, "image": null}, {"id": "RM3mB", "text": "$\\frac{1}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The man has to win at least 4 times.\r\n\r\n$$\r\n\r\n\\begin{array}{r}\r\n\r\n\\therefore \\text { Reqd. probability }= \\\\\r\n\r\n\\qquad \\begin{array}{r}\r\n\r\n7 \\mathrm{C}_{4}\\left(\\frac{1}{2}\\right)^{4} \\cdot\\left(\\frac{1}{2}\\right)^{3}+{ }^{7} \\mathrm{C}_{5}\\left(\\frac{1}{2}\\right)^{5} \\cdot\\left(\\frac{1}{2}\\right)^{2} \\\\\r\n\r\n+{ }^{7} \\mathrm{C}_{6}\\left(\\frac{1}{2}\\right)^{6} \\cdot \\frac{1}{2}+{ }^{7} \\mathrm{C}_{7}\\left(\\frac{1}{2}\\right)^{7} \\\\\r\n\r\n=\\left({ }^{7} \\mathrm{C}_{4}+{ }^{7} \\mathrm{C}_{5}+{ }^{7} \\mathrm{C}_{6}+{ }^{7} \\mathrm{C}_{7}\\right) \\cdot \\frac{1}{2^{7}}=\\frac{64}{2^{7}}=\\frac{1}{2}\r\n\r\n\\end{array}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a96f5bfc7ab78ae6ca", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "Two dice are thrown
