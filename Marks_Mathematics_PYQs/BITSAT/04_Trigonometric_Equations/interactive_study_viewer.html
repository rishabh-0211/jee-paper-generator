\pi / 4\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We shall first consider values of \\(\\theta\\) between 0\n\\(\\begin{aligned}\n& \\text { and } 2 \\pi \\sin \\theta=-\\frac{1}{2}=-\\sin \\frac{\\pi}{6}=\\sin \\left(\\pi+\\frac{\\pi}{6}\\right) \\\\\n& \\text { or } \\sin (2 \\pi-\\pi / 6) \\\\\n& \\therefore \\theta=7 \\pi / 6 ; 11 \\pi / 6 \\\\\n& \\tan \\theta=1 / \\sqrt{3}=\\tan (\\pi / 6) \\text { or } \\tan (\\pi+\\pi / 6) \\\\\n& \\therefore \\theta=\\pi / 6,7 \\pi / 6\n\\end{aligned}\\)\nThe value of \\(\\theta\\) which satisfies both the equations is \\(7 \\pi / 6\\)\nHence the general value of \\(\\theta\\) is \\(2 n \\pi+7 \\pi / 6\\) where \\(\\mathrm{n} \\in \\mathrm{I}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8676f5bfc7ab78aedc5", "title": "Solving Trigonometric Equation", "totalQuestions": 15, "questions": [{"_id": "67726d18c49e8ef28ee2b430", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "Number of solutions of equations $\\sin 9 \\theta=\\sin \\theta$ in the interval $[0,2 \\pi]$ is", "image": null}, "options": [{"id": "rfTFA", "text": "16", "image": null, "isCorrect": false}, {"id": "cmHM6", "text": "17", "image": null, "isCorrect": true}, {"id": "ifPIt", "text": "18", "image": null, "isCorrect": false}, {"id": "E1eH1", "text": "15", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\text {  Given, } \\quad \\sin 9 \\theta=\\sin \\theta \\\\\n& \\Rightarrow \\quad \\sin 9 \\theta-\\sin \\theta=0 \\\\\n& \\Rightarrow \\quad 2 \\cos \\left(\\frac{9 \\theta+\\theta}{2}\\right) \\sin \\left(\\frac{9 \\theta-\\theta}{2}\\right)=0 \\\\\n& {\\left[\\because \\sin C-\\sin D=2 \\cos \\left(\\frac{C+D}{2}\\right) \\sin \\left(\\frac{C-D}{2}\\right)\\right]} \\\\\n& \\Rightarrow \\quad 2 \\cos 5 \\theta \\sin 4 \\theta=0 \\\\\n& \\Rightarrow \\text { Either } \\cos 5 \\theta=0 \\text { or } \\sin 4 \\theta=0 \\text {, also } \\theta \\in[0,2 \\pi] \\\\\n& \\Rightarrow \\quad 5 \\theta=(2 n+1) \\frac{\\pi}{2} \\\\\n& \\text { or } \\quad 4 \\theta=n \\pi \\\\\n& \\Rightarrow \\quad \\theta=(2 n+1) \\frac{\\pi}{10} \\text { or } \\theta=\\frac{n \\pi}{4} \\\\\n& \\therefore \\quad \\theta=\\frac{\\pi}{10}, \\frac{3 \\pi}{10}, \\frac{\\pi}{2}, \\frac{7 \\pi}{10}, \\frac{9 \\pi}{10}, \\frac{11 \\pi}{10}, \\frac{13 \\pi}{10}, \\frac{3 \\pi}{2}, \\frac{17 \\pi}{10}, \\frac{19 \\pi}{10} \\\\\n& \\text { or } \\quad 0, \\frac{\\pi}{4}, \\frac{\\pi}{2}, \\frac{3 \\pi}{4}, \\pi, \\frac{5 \\pi}{4}, \\frac{3 \\pi}{2}, \\frac{7 \\pi}{4}, 2 \\pi \\\\\n& \\therefore \\text { Total number of solutions }=17 \\\\\n& \\left(\\because \\frac{\\pi}{2} \\text { and } \\frac{3 \\pi}{2} \\text { are common }\\right)\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8346f5bfc7ab78aeb84", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022" ><mn>3</mn><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>x</mi><mo>-</mo><mn>3</mn><mi>sin</mi><mn>2</mn><mi>x</mi><mo>+</mo><mi>sin</mi><mn>3</mn><mi>x</mi><mo>=</mo><mi>cos</mi><mi>x</mi><mo>-</mo><mn>3</mn><mi>cos</mi><mn>2</mn><mi>x</mi><mo>+</mo><mi>cos</mi><mn>3</mn><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>sin</mi><mi>x</mi><mo>+</mo><mi>sin</mi><mn>3</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>sin</mi><mn>2</mn><mi>x</mi><mo>=</mo><mi>cos</mi><mi>x</mi><mo>+</mo><mi>cos</mi><mn>3</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>cos</mi><mn>2</mn><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>sin</mi><mn>2</mn><mi>x</mi><mi>cos</mi><mi>x</mi><mo>-</mo><mn>3</mn><mi>sin</mi><mn>2</mn><mi>x</mi><mo>-</mo><mn>2</mn><mi>cos</mi><mn>2</mn><mi>x</mi><mi>cos</mi><mi>x</mi><mo>+</mo><mn>3</mn><mi>cos</mi><mn>2</mn><mi>x</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>sin</mi><mn>2</mn><mi>x</mi><mo>(</mo><mn>2</mn><mi>cos</mi><mi>x</mi><mo>-</mo><mn>3</mn><mo>)</mo><mo>-</mo><mi>cos</mi><mn>2</mn><mi>x</mi><mo>(</mo><mn>2</mn><mi>cos</mi><mi>x</mi><mo>-</mo><mn>3</mn><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>(</mo><mi>sin</mi><mn>2</mn><mi>x</mi><mo>-</mo><mi>cos</mi><mn>2</mn><mi>x</mi><mo>)</mo><mo>(</mo><mn>2</mn><mi>cos</mi><mi>x</mi><mo>-</mo><mn>3</mn><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>sin</mi><mn>2</mn><mi>x</mi><mo>=</mo><mi>cos</mi><mn>2</mn><mi>x</mi><mo>&#160;&#160;</mo><mo>[</mo><mo>&#8757;</mo><mi>cos</mi><mi>x</mi><mo>&#8800;</mo><mn>3</mn><mo>/</mo><mn>2</mn><mo>]</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mn>2</mn><mi>x</mi><mo>=</mo><mn>2</mn><mi>n</mi><mi>&#960;</mi><mo>&#177;</mo><mfenced><mrow><mfrac><mi>&#960;</mi><mn>2</mn></mfrac><mo>-</mo><mn>2</mn><mi>x</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mi>&#960;</mi></mrow><mn>2</mn></mfrac><mo>+</mo><mfrac><mi>&#960;</mi><mn>8</mn></mfrac></math>&nbsp;[<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo></math>&nbsp;neglect&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>ve</mi></math>&nbsp;sign]</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e06f5bfc7ab78ae89d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 3, "question": {"text": "The general solution of the equation $\\sin 2 x+2 \\sin x+2 \\cos x+1=0$ is", "image": null}, "options": [{"id": "6JZl2", "text": "$3 \\mathrm{n} \\pi-\\frac{\\pi}{4}$", "isCorrect": false, "image": null}, {"id": "so4J6", "text": "$2 \\mathrm{n} \\pi+\\frac{\\pi}{4}$", "isCorrect": false, "image": null}, {"id": "f2qRK", "text": "$2 \\mathrm{n} \\pi+(-1)^{\\mathrm{n}} \\sin ^{-1}\\left(\\frac{1}{\\sqrt{3}}\\right)$", "isCorrect": false, "image": null}, {"id": "uuRqX", "text": "$\\mathrm{n} \\pi-\\frac{\\pi}{4}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given, $\\sin 2 \\mathrm{x}+2 \\sin \\mathrm{x}+2 \\cos \\mathrm{x}+1=0$\r\n\r\n$\\Rightarrow 1+\\sin 2 \\mathrm{x}+2(\\sin \\mathrm{x}+\\cos \\mathrm{x})=0$\r\n\r\n$\\Rightarrow(\\sin x+\\cos x)^{2}+2(\\sin x+\\cos x)=0$\r\n\r\n$\\Rightarrow(\\sin x+\\cos x)(\\sin x+\\cos x+2)=0$\r\n\r\n$\\therefore \\sin x+\\cos x=0$ or $\\sin x+\\cos x=-2$\r\n\r\nBut, $\\sin x+\\cos x=-2$ is inadmissible.\r\n\r\nSince, $|\\sin x| \\leq 1,|\\cos x| \\leq 1$\r\n\r\n$\\therefore \\sin x+\\cos x=0 \\Rightarrow \\sin \\left(x+\\frac{\\pi}{4}\\right)=0$\r\n\r\n$\\Rightarrow x+\\frac{\\pi}{4}=n \\pi \\Rightarrow x=n \\pi-\\frac{\\pi}{4}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e06f5bfc7ab78ae89c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $\\tan (\\cot x)=\\cot (\\tan x)$, then $\\sin 2 x$ is equal to:", "image": null}, "options": [{"id": "z4GVw", "text": "$\\frac{2}{(2 n+1) \\pi}$", "isCorrect": false, "image": null}, {"id": "TV9Rf", "text": "$\\frac{4}{(2 n+1) \\pi}$", "isCorrect": true, "image": null}, {"id": "ZRSUG", "text": "$\\frac{2}{n(n+1) \\pi}$", "isCorrect": false, "image": null}, {"id": "i8itz", "text": "$\\frac{4}{n(n+1) \\pi}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, $\\tan (\\cot x)=\\cot (\\tan x)=\\tan \\left(\\frac{\\pi}{2}-\\tan x\\right)$\r\n\r\n$\\Rightarrow \\cot x=n \\pi+\\frac{\\pi}{2}-\\tan x$\r\n\r\n$\\Rightarrow \\cot x+\\tan x=n \\pi+\\frac{\\pi}{2}$\r\n\r\n$\\Rightarrow \\frac{1}{\\sin x \\cos x}=n \\pi+\\frac{\\pi}{2} \\Rightarrow \\frac{1}{\\sin 2 x}=\\frac{n \\pi}{2}+\\frac{\\pi}{4}$\r\n\r\n$\\Rightarrow \\sin 2 x=\\frac{1}{\\frac{n \\pi}{2}+\\frac{\\pi}{4}}=\\frac{4}{(2 n+1) \\pi}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e06f5bfc7ab78ae89b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "If $\\sin \\theta_{1}+\\sin \\theta_{2}+\\sin \\theta_{3}=3,$ then $\\cos \\theta_{1}+\\cos \\theta_{2}$$+\\cos \\theta^{3}=$", "image": null}, "options": [{"id": "aMXiH", "text": "0", "isCorrect": true, "image": null}, {"id": "9WhXP", "text": "1", "isCorrect": false, "image": null}, {"id": "616bf", "text": "2", "isCorrect": false, "image": null}, {"id": "ndhTF", "text": "3", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since, $\\sin \\theta_{1}+\\sin \\theta_{2}+\\sin \\theta_{3}=3$\r\n\r\n$\\begin{array}{ll}\\therefore & \\sin \\theta_{1}=\\sin \\theta_{2}=\\sin \\theta_{3}=1 \\Rightarrow \\theta_{1}=\\theta_{2}=\\theta_{3}= \\\\ & \\frac{\\pi}{2} \\\\ \\therefore & \\cos \\theta_{1}+\\cos \\theta_{2}+\\cos \\theta_{3}=0\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c26f5bfc7ab78ae7a1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "The solution of $(2 \\cos x-1)(3+2 \\cos x)=0$ in the interval $0 \\leq x \\leq 2 \\pi$ is", "image": null}, "options": [{"id": "xZrT6", "text": "$\\frac{\\pi}{3}$", "isCorrect": false, "image": null}, {"id": "FrPNd", "text": "$\\frac{\\pi}{3}, \\frac{5 \\pi}{3}$", "isCorrect": true, "image": null}, {"id": "70ZWC", "text": "$\\frac{\\pi}{3}, \\frac{5 \\pi}{3}, \\cos ^{-1}\\left(-\\frac{3}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "8esKm", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have $(2 \\cos x-1)(3+2 \\cos x)=0$\r\n\r\nIf $2 \\cos x-1=0,$ then $\\cos x=\\frac{1}{2}$\r\n\r\n$\\therefore x=\\pi / 3,5 \\pi / 3$\r\n\r\nIf $3+2 \\cos x=0,$ the $\\cos x=-3 / 2$\r\n\r\nwhich is not possible.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b46f5bfc7ab78ae723", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "$\\quad$ If $\\cos 7 \\theta=\\cos \\theta-\\sin 4 \\theta,$ then the general value\r\n\r\nof $\\theta$ is", "image": null}, "options": [{"id": "VokfD", "text": "$\\frac{n \\pi}{6}, \\frac{n \\pi}{3}+(-1)^{n} \\frac{\\pi}{18}$", "isCorrect": false, "image": null}, {"id": "r929k", "text": "$\\frac{n \\pi}{3}, \\frac{n \\pi}{3}+(-1)^{n} \\frac{\\pi}{18}$", "isCorrect": false, "image": null}, {"id": "ZXfCd", "text": "$\\frac{n \\pi}{4}, \\frac{n \\pi}{3} \\pm \\frac{\\pi}{18}$", "isCorrect": false, "image": null}, {"id": "Yq5ga", "text": "$\\frac{n \\pi}{4}, \\frac{n \\pi}{3}+(-1)^{n} \\frac{\\pi}{18}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\cos 7 \\theta=\\cos \\theta-\\sin 4 \\theta$\r\n\r\n$\\Rightarrow \\sin 4 \\theta=\\cos \\theta-\\cos 7 \\theta$\r\n\r\n$\\Rightarrow \\sin 4 \\theta=2 \\sin 4 \\theta \\sin 3 \\theta$\r\n\r\n$\\Rightarrow \\sin 4 \\theta(1-2 \\sin 3 \\theta)=0$\r\n\r\n$\\therefore \\sin 4 \\theta=0$ or $\\sin 3 \\theta=\\frac{1}{2}$\r\n\r\n$\\Rightarrow 4 \\theta=n \\pi$ or $3 \\theta=n \\pi+(-1)^{n} \\frac{\\pi}{6}$\r\n\r\n$\\Rightarrow \\quad \\theta=\\frac{n \\pi}{4}$ or $\\frac{n \\pi}{3}+(-1)^{n} \\frac{\\pi}{18}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78a6f5bfc7ab78ae5bd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "If \\(f(x)=\\frac{x}{\\sqrt{1+x^2}}\\), then (fof of \\()(x)\\) is", "image": null}, "options": [{"id": "x54Y0", "text": "\\(\\frac{3 x}{\\sqrt{1+x^2}}\\)", "image": null, "isCorrect": false}, {"id": "Pu3uv", "text": "\\(\\frac{\\mathrm{x}}{\\sqrt{1+3 \\mathrm{x}^2}}\\)", "image": null, "isCorrect": true}, {"id": "icS5M", "text     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
