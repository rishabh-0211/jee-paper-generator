nced><mi>x</mi></mfenced></math> is decreasing in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><mn>5</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "m0OET", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math> is decreasing in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mo>&#8734;</mo><mo>,</mo><mn>2</mn></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "fPM9G", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math> is increasing in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mo>&#8734;</mo><mo>,</mo><mn>1</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "hJs9p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math> is increasing in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mo>&#8734;</mo><mo>,</mo><mn>2</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mo>-</mo><mn>2</mn><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mn>21</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>60</mn><mi>x</mi><mo>+</mo><mn>41</mn></math></p><p>On differentiating w.r.t. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mo>-</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>42</mn><mi>x</mi><mo>-</mo><mn>60</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mo>-</mo><mn>6</mn><mfenced><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>7</mn><mi>x</mi><mo>+</mo><mn>10</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mo>-</mo><mn>6</mn><mfenced><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mn>5</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>&#60;</mo><mn>2</mn><mo>&#160;</mo><mi>or</mi><mo>&#160;</mo><mi>x</mi><mo>&#62;</mo><mn>5</mn><mo>,</mo><mo>&#160;</mo><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>&#60;</mo><mn>0</mn></math>&nbsp;i.e., <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math> is decreasing</p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#60;</mo><mi>x</mi><mo>&#60;</mo><mn>5</mn><mo>,</mo><mo>&#160;</mo><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>&#62;</mo><mn>0</mn></math>&nbsp;i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;is increasing</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e26f5bfc7ab78ae8b3", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "Consider the following statements in respect of the function $f(x)=x^{3}-1, x \\in[-1,1]$\r\n\r\nI. $f(x)$ is increasing in [-1,1] \r\n\r\nII. $f(x)$ has no root in (-1,1) . \r\n\r\nWhich of the statements given above is/are correct?", "image": null}, "options": [{"id": "rOZ7z", "text": "Only I", "isCorrect": true, "image": null}, {"id": "iYkA9", "text": "Only II", "isCorrect": false, "image": null}, {"id": "EBZkG", "text": "Both I and II", "isCorrect": false, "image": null}, {"id": "ZiDGm", "text": "Neither I nor II", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $f(x)$ is an increasing function in [-1,1] and it has a root in (-1,1) $\\therefore \\quad$ Only statement $I$ is correct.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c56f5bfc7ab78ae7ba", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "The interval in which the function $2 \\mathrm{x}^{3}+15$ increases less rapidly than the function $9 x^{2}-12 x,$ is $-$", "image": null}, "options": [{"id": "ON3lx", "text": "$(-\\infty, 1)$", "isCorrect": false, "image": null}, {"id": "7iBfv", "text": "(1,2)", "isCorrect": true, "image": null}, {"id": "5qcQ2", "text": "$(2, \\infty)$", "isCorrect": false, "image": null}, {"id": "z3F7D", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x)=2 x^{3}+15$ and $g(x)=9 x^{2}-12 x$ then $\\mathrm{f}^{\\prime}(\\mathrm{x})=6 \\mathrm{x}^{2} \\forall \\mathrm{x} \\in \\mathrm{R}$\r\n\r\n$\\therefore \\mathrm{f}(\\mathrm{x})$ is increasing function $\\forall \\mathrm{x} \\in \\mathrm{R}$\r\n\r\n$$\r\n\r\n\\text { Also, } g^{\\prime}(x)>0 \\Rightarrow 18 x-12>0 \\Rightarrow x>\\frac{2}{3}\r\n\r\n$$\r\n\r\nThus, $\\mathrm{f}(\\mathrm{x})$ and $\\mathrm{g}(\\mathrm{x})$ both increases for $\\mathrm{x}>\\frac{2}{3}$\r\n\r\n$$\r\n\r\n\\text { Let } F(x)=f(x)-g(x), F^{\\prime}(x)<0\r\n\r\n$$\r\n\r\n$(\\because \\mathrm{f}(\\mathrm{x})$ increases less rapidly than the function $\\mathrm{g}(\\mathrm{x}))$\r\n\r\n$$\r\n\r\n\\Rightarrow 6 \\mathrm{x}^{2}-18 \\mathrm{x}+12<0 \\Rightarrow 1<\\mathrm{x}<2\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b76f5bfc7ab78ae73f", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "The function $\\mathrm{f}(\\mathrm{x})=(\\mathrm{x}(\\mathrm{x}-2))^{2}$ is increasing in the set", "image": null}, "options": [{"id": "l3u9R", "text": "$(-\\infty, 0) \\cup(2, \\infty)$", "isCorrect": false, "image": null}, {"id": "NJyxr", "text": "$(-\\infty, 1)$", "isCorrect": false, "image": null}, {"id": "lP0Kn", "text": "(0,1)$\\cup(2, \\infty)$", "isCorrect": true, "image": null}, {"id": "b9h6H", "text": "(1,2)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$$\r\n\r\n\\text { } \\begin{array}{l}\r\n\r\n\\text { Here, } \\mathrm{f}(\\mathrm{x})=(\\mathrm{x}(\\mathrm{x}-2))^{2} \\\\\r\n\r\n\\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=4 \\mathrm{x}(\\mathrm{x}-2)(\\mathrm{x}-1)\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nFor $\\mathrm{f}(\\mathrm{x})$ as increasing, $\\mathrm{f}^{\\prime}(\\mathrm{x})>0$\r\n\r\n$$\r\n\r\n\\text { So, } 4 x(x-1)(x-2)>0 \\Rightarrow x(x-1)(x-2)>0\r\n\r\n$$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/lSKQqu4_r-O0TQCuFzGXYtr4R0q6W-FA-qe_tBAQ7TI.original.fullsize.png\"><br>\r\n\r\nFrom the above figure required interval is, (0,1)$\\cup(2, \\infty)$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a76f5bfc7ab78ae6bd", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "If $\\mathrm{f}(\\mathrm{x})=\\frac{\\mathrm{a}^{2}-1}{\\mathrm{a}^{2}+1} \\mathrm{x}^{3}-3 \\mathrm{x}+5$ is a decreasing\r\nfunction of $\\mathrm{x}$ in $\\mathbf{R}$, then the set of possible values of a (independent of $\\mathrm{x}$ ) is", "image": null}, "options": [{"id": "3sZXC", "text": "$(1, \\infty)$", "isCorrect": false, "image": null}, {"id": "hvfUN", "text": "$(-\\infty,-1)$", "isCorrect": false, "image": null}, {"id": "Noekr", "text": "[-1,1]", "isCorrect": true, "image": null}, {"id": "rj9Ky", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$f^{\\prime}(x)=3\\left(\\frac{a^{2}-1}{a^{2}+1}\\right) x^{2}-3$\r\n$\\mathrm{f}^{\\prime}(\\mathrm{x})<0$ for all $\\mathrm{x}$ if $\\mathrm{a}^{2}-1 \\leq 0 \\Rightarrow-1 \\leq \\mathrm{a} \\leq 1$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7996f5bfc7ab78ae646", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "The function \\(f(x)=\\sin x-k x-c\\), where \\(k\\) and \\(c\\) are constants, decreases always when", "image": null}, "options": [{"id": "wJJ8e", "text": "\\(k > 1\\)", "image": null, "isCorrect": false}, {"id": "kP0cg", "text": "\\(k \\geq 1\\)", "image": null, "isCorrect": true}, {"id": "ZIJ3k", "text": "\\(k  < 1\\)", "image": null, "isCorrect": false}, {"id": "JwLAN", "text": "\\(k \\leq 1\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let \\(f(x)=\\sin x-k x-c\\) where \\(k\\) and \\(c\\) are constants. \\(f^{\\prime}(x)=\\cos x-k\\)\n\\(\\therefore f\\) decreases if \\(\\cos x \\leq k\\)\nThus, \\(f(x)=\\sin x-k x-c\\) decrease always when \\(k \\geq 1\\).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78b6f5bfc7ab78ae5c2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "If a circular plate is heated uniformly, its area expands \\(3 c\\) times as fast as its radius, then the value of \\(c\\) when the radius is 6 units, is", "image": null}, "options": [{"id": "9D88L", "text": "\\(4 \\pi\\)", "image": null, "isCorrect": true}, {"id": "MEqor", "text": "\\(2 \\pi\\)", "image": null, "isCorrect": false}, {"id": "91yG1", "text": "\\(6 \\pi\\)", "image": null, "isCorrect": false}, {"id": "aWQWJ", "text": "\\(3 \\pi\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let \\(A\\) sq. units in the area measure when the radius is \\(r\\) units.\ntheir \\(A=\\pi r^2\\)\nDifferentiate both side w.r.t ' \\(t\\) '\n\\(\\frac{d A}{d t}=2 \\pi r \\frac{d r}{d t}\\) ...(i))\nWe have, \\(\\frac{d A}{d t}=3 c \\frac{d r}{d t}\\)\nFrom eqn (i), we get\n\\(3 c \\cdot \\frac{d r}{d t}=2 \\pi r \\cdot \\frac{d r}{d t} \\Rightarrow 3 c=2 \\pi r\\)\nNow, \\(c=\\frac{2}{3} \\pi(6)=4 \\pi\\) when \\(r=6\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77d6f5bfc7ab78ae545", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The minimum value of the function \\(y=x^4-2 x^2+1\\) in the interval \\(\\left[\\frac{1}{2}, 2\\right]\\) is", "image": null}, "options": [{"id": "nGT4c", "text": "0", "image": null, "isCorrect": true}, {"id": "1nlax", "text": "2", "image": null, "isCorrect": false}, {"id": "TZTqe", "text": "8", "image": null, "isCorrect": false}, {"id": "aulhK", "text": "9", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\frac{\\mathrm{d}}{\\mathrm{dx}}\\left(\\mathrm{x}^4-2 \\mathrm{x}^2+1\\right)=4 \\mathrm{x}\\left(\\mathrm{x}^2-1\\right)\\)\nFor \\(\\max\\). or \\(\\min , \\frac{\\mathrm{dy}}{\\mathrm{dx}}=0\\)\n\\(4 \\mathrm{x}\\left(\\mathrm{x}^2-1\\right)=0 ;\\), either \\(\\mathrm{x}=0\\) or \\(\\mathrm{x}= \\pm 1\\)\n\\(x=0\\) and \\(x=-1\\) does not belong to \\(\\left[\\frac{1}{2}, 2\\right]\\)\n\\(\\frac{d^2 y}{d x^2}=12 x^2-4 \\therefore\\left(\\frac{d^2 y}{d x^2}\\right)_{x=1}\\)\n\\(=12(1)^2-4=8 > 0\\)\n\\(\\therefore \\quad\\) there is minimum value of function at \\(\\mathrm{x}=1\\)\n\\(\\therefore \\quad\\) minimum value is\n\\(y(1)=1^4-2(1)^2+1=1-2+1=0\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e86d6f5bfc7ab78aee0b", "title": "Maxima Minima", "totalQuestions": 22, "questions": [{"_id": "67726d19c49e8ef28ee2b43d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "The maximum area of rectangle inscribed in a circle of diameter $R$ is", "image": null}, "options": [{"id": "LKMXN", "text": "$R^2$", "image": null, "isCorrect": false}, {"id": "hO0LI", "text": "$\\frac{R^2}{2}$", "image": null, "isCorrect": true}, {"id": "dRRSe", "text": "$\\frac{R^2}{4}$", "image": null, "isCorrect": false}, {"id": "SJbZm", "text": "$\\frac{R^2}{8}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to question,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/PnfORxYZ6NuNwfD7jzpHvOI_MDyENgO28V3fdQmzN2o.original.fullsize.png\"/>\nDiameter $=R$\nDiagonals, $d_1=d_2=R$\n$\\begin{aligned}\n\\text { Max Area of rectangle (any quadrilateral) } & =\\frac{1}{2} d_1 \\times d_2 \\\\\n= & \\frac{1}{2} \\times R \\times R=\\frac{R^2}{2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8366f5bfc7ab78aeb95", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 2, "question": {"text": "A spherical balloon is filled with $4500 ~\\pi$ cubic meters of helium gas. If a leak in the balloon causes the gas to escape at the rate of $72 ~\\pi$ cubic meters per minute then the rate (in meters per minute) at which the radius of the balloon decreases $49 \\mathrm{~min}$ after the leakage began is", "image": null}, "options": [{"id": "mqRK2", "text": "\r\n$\\frac{9}{7}$\r\n", "isCorrect": false, "image": null}, {"id": "k7WbW", "text": "\r\n$\\frac{7}{9}$\r\n", "isCorrect": false, "image": null}, {"id": "xXUX5", "text": "\r\n$\\frac{2}{9}$\r\n", "isCorrect": true, "image": null}, {"id": "U1y33", "text": "\r\n$9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$V=\\frac{4}{3} \\pi r^3 \\Rightarrow 4500 \\pi=\\frac{4 \\pi r^3}{3}$\r\n$\\Rightarrow \\quad r=15 \\mathrm{~m}$\r\nAfter $49 \\min =(4500-49.72) \\pi$\r\n$=972 \\pi \\mathrm{m}^3$\r\n$\\begin{aligned} \\Rightarrow & & 972 \\pi & =\\frac{4}{3} \\pi r^3 \\\\ \\Rightarrow & & r^3 & =3 \\times 243=3 \\times 3^5\\end{aligned}$\r\n$\\begin{aligned} r & =9 \\\\ \\frac{d v}{d t} & =4 \\pi r^2\\left(\\frac{d r}{d t}\\right) \\\\ 72 \\pi & =4 \\pi \\times 9 \\times 9\\left(\\frac{d r}{d t}\\right) \\\\ \\frac{d r}{d t} & =\\left(\\frac{2}{9}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8336f5bfc7ab78aeb7c", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 1, "question": {"text": "A running track of $440 \\mathrm{ft}$ is to be laid out enclosing a football field, the shape of which is a rectangle with a semi-circle at each end. If the area of the rectangular portion is to be maximum, then the lengths of its side are", "image": null}, "options": [{"id": "edsPp", "text": "\r\n$70 \\mathrm{ft}$ and $110 \\mathrm{ft}$\r\n", "isCorrect": false, "image": null}, {"id": "82mQI", "text": "\r\n$80 \\mathrm{ft}$ and $120 \\mathrm{ft}$\r\n", "isCorrect": false, "image": null}, {"id": "VR5De", "text": "\r\n$35 \\mathrm{ft}$ and $110 \\mathrm{ft}$\r\n", "isCorrect": true, "image": null}, {"id": "9SA0H", "text": "\r\n$35 \\mathrm{ft}$ and $120 \\mathrm{ft}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/aibsGJb8SAnd0AlzAIOjNYoNfQTsHZOd1upqzr5sx14.original.fullsize.png\"><br>\r\nPerimeter $=440 \\mathrm{ft}$\r\n$\\Rightarrow \\quad 2 x+\\pi r+\\pi r=440$\r\n$2 x+2 \\pi r=440$\r\n$$\r\n\\begin{aligned}\r\nA & =\\text { Area of the rectangular portion }=x 2 r \\\\\r\nA & =x \\frac{(440-2 x)}{\\pi}=\\frac{1}{\\pi}\\left(440 x-2 x^2\\right)\r\n\\end{aligned}\r\n$$\r\nLet $\\frac{d A}{d x}=\\frac{1}{\\pi}(440-4 x)=0$\r\n$$\r\n\\begin{aligned}\r\n& \\Rightarrow x=110 \\text { for which } \\frac{d^2 A}{d x^2} < 0 \\\\\r\n& \\Rightarrow A \\text { is maximum when } x=110 \\\\\r\n& \\Rightarrow 2 r=\\frac{440-2 x}{\\pi}=\\frac{440-220}{22 / 7}=70 \\\\\r\n& \\therefore \\quad r=35 \\mathrm{ft} \\text { and } x=110 \\mathrm{ft}\r\n\\end{aligned}\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e81b6f5bfc7ab78aeaa1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "Let $x+y=3-\\cos 4 \\theta$ and $x-y=4 \\sin 2 \\theta$ then the greatest of $x y$ is", "image": null}, "options": [{"id": "AF9ae", "text": "$\\frac{3}{4}$", "isCorrect": false, "image": null}, {"id": "Vdwh4", "text": "1", "isCorrect": true, "image": null}, {"id": "yTM7v", "text": "$\\frac{1}{2}$", "isCorrect": false, "image": null}, {"id": "ErXlk", "text": "2", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$x=\\frac{3-\\cos 4 \\theta+4 \\sin 2 \\theta}{2}$\r\n\r\n$=\\frac{3-\\left(1-\\sin ^{2} 2 \\theta\\right)+4 \\sin 2 \\theta}{2}=(1+\\sin 2 \\theta)^{2}$\r\n\r\n$y=\\frac{3-\\cos 4 \\theta-4 \\sin 2 \\theta}{2}$\r\n\r\n$=\\frac{3-\\left(1-\\sin ^{2} 2 \\th th xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>(</mo><mn>1</mn><mo>)</mo><mo>=</mo><mn>6</mn><mo>-</mo><mn>2</mn><mo>(</mo><mn>2</mn><mo>)</mo></math>&nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mo>&#8757;</mo><mi>f</mi><mfenced><mn>1</mn></mfenced><mo>=</mo><mn>6</mn><mo>,</mo><mi>g</mi><mfenced><mn>1</mn></mfenced><mo>=</mo><mn>2</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mfenced><mn>1</mn></mfenced><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mfenced><mn>0</mn></mfenced><mo>=</mo><mi>h</mi><mfenced><mn>1</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>h</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>-</mo><mn>2</mn><msup><mi>g</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced></math></p><p>By Rolle&#39;s theorem <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>h</mi><mo>'</mo></msup><mfenced><mi>c</mi></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>c</mi></mfenced><mo>-</mo><mn>2</mn><msup><mi>g</mi><mo>'</mo></msup><mfenced><mi>c</mi></mfenced><mo>=</mo><mn>0</mn><mo>,</mo><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>c</mi></mfenced><mo>=</mo><mn>2</mn><msup><mi>g</mi><mo>'</mo></msup><mfenced><mi>c</mi></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ff6f5bfc7ab78ae9ad", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "An inverted conical flask is being filled with water at the rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><msup><mi>cm</mi><mn>3</mn></msup><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The height of the flask is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math> and the radius of the base is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math>. How fast is the water level rising when the level is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>cm</mi><mo>?</mo></math>", "image": null}, "options": [{"id": "aWp7O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>&#960;</mi><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "yYB1T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mrow><mn>4</mn><mi>&#960;</mi></mrow></mfrac><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "a9DUy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>&#960;</mi></mrow><mn>4</mn></mfrac><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "VJmug", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mrow><mn>3</mn><mi>&#960;</mi></mrow></mfrac><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let depth of water at time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> and the radius of the base of water level be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/5d86d575-45f8-404b-9b22-ae93feacf861-d51.png\" style=\"width: 277px; height: 250px;\" /></p><p>From similar <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>O</mi><mi>M</mi><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>O</mi><mi>N</mi><mi>Q</mi></math>, we have</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>O</mi><mi>M</mi></mrow><mrow><mi>O</mi><mi>N</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>P</mi><mi>M</mi></mrow><mrow><mi>Q</mi><mi>N</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>h</mi><mn>10</mn></mfrac><mo>=</mo><mfrac><mi>r</mi><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mi>h</mi></mrow><mn>10</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mfrac><mi>h</mi><mn>2</mn></mfrac></math></p><p>We have,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mi>h</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>&#960;</mi><msup><mfenced><mfrac><mi>h</mi><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mi>h</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>V</mi><mo>=</mo><mfrac><mrow><mi>&#960;</mi><msup><mi>h</mi><mn>3</mn></msup></mrow><mn>12</mn></mfrac></math></p><p>On differentiating both sides, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mi>&#960;</mi><mn>12</mn></mfrac><mo>&#183;</mo><mn>3</mn><msup><mi>h</mi><mn>2</mn></msup><mfrac><mrow><mi>d</mi><mi>h</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>&#960;</mi><msup><mi>h</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac><mfrac><mrow><mi>d</mi><mi>h</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>3</mn><mo>&#160;</mo><msup><mi>cm</mi><mn>3</mn></msup><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi>cm</mi><mo>,</mo></math>&nbsp;so we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mo>&#215;</mo><msup><mn>4</mn><mn>2</mn></msup></mrow><mn>4</mn></mfrac><mfrac><mrow><mi>d</mi><mi>h</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>h</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mn>3</mn><mrow><mn>4</mn><mi>&#960;</mi></mrow></mfrac><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Hence, the water level is rising at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mrow><mn>4</mn><mi>&#960;</mi></mrow></mfrac><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Option (b) is correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f36f5bfc7ab78ae941", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "The shortest distance between the parabolas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>6</mn></math> is", "image": null}, "options": [{"id": "nq3y3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "A0kWF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>5</mn></msqrt></math>", "isCorrect": true, "image": null}, {"id": "x0BlF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "isCorrect": false, "image": null}, {"id": "jYTTD", "text": "None", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Shortest distance between two curves occured along the common normal.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Normal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msup><mi>m</mi><mn>2</mn></msup><mo>,</mo><mn>2</mn><mi>m</mi></mrow></mfenced></math> is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mi>m</mi><mi>x</mi><mo>-</mo><mn>2</mn><mi>m</mi><mo>-</mo><msup><mi>m</mi><mn>3</mn></msup><mo>=</mo><mn>0</mn></math></p><p>Normal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mfenced><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><msup><mi>m</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>+</mo><mn>3</mn><mo>,</mo><mi>m</mi></mrow></mfenced></math> is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mi>m</mi><mfenced><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mo>-</mo><mi>m</mi><mo>-</mo><mfrac><msup><mi>m</mi><mn>3</mn></msup><mn>2</mn></mfrac><mo>=</mo><mn>0</mn></math></p><p>Both normals are same, if</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mi>m</mi><mo>-</mo><msup><mi>m</mi><mn>3</mn></msup><mo>=</mo><mo>-</mo><mn>4</mn><mi>m</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>m</mi><mn>3</mn></msup><mo>&#8658;</mo><mi>m</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>2</mn></math></p><p>So, points will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>,</mo><mn>4</mn><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>5</mn><mo>,</mo><mn>2</mn><mo>)</mo></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>,</mo><mo>-</mo><mn>4</mn><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>5</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>)</mo></math>.</p><p>Hence, shortest distance will be&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mo>(</mo><mn>1</mn><mo>+</mo><mn>4</mn><mo>)</mo></msqrt><mo>=</mo><msqrt><mn>5</mn></msqrt></math>&nbsp;unit.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e36f5bfc7ab78ae8b5", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The curve $y=x e^{x}$ has minimum value equal to", "image": null}, "options": [{"id": "PJ9ik", "text": "$-\\frac{1}{\\mathrm{e}}$", "isCorrect": true, "image": null}, {"id": "9Gfzt", "text": "$\\frac{1}{\\mathrm{e}}$", "isCorrect": false, "image": null}, {"id": "x0KAH", "text": "$-\\mathrm{e}$", "isCorrect": false, "image": null}, {"id": "9d0eR", "text": "e", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $y=x e^{x}$. Differentiate both side w.r.t. 'x'.\r\n\r\n$$\r\n\r\n\\Rightarrow \\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\mathrm{e}^{\\mathrm{x}}+\\mathrm{xe}^{\\mathrm{x}}=\\mathrm{e}^{\\mathrm{x}}(1+\\mathrm{x})\r\n\r\n$$\r\n\r\nPut $\\frac{\\mathrm{dy}}{\\mathrm{dx}}=0$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\Rightarrow \\mathrm{e}^{\\mathrm{x}}(1+\\mathrm{x})=0 \\\\\r\n\r\n\\Rightarrow \\mathrm{x}=-1\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nNow, $\\frac{\\mathrm{d}^{2} \\mathrm{y}}{\\mathrm{dx}^{2}}=\\mathrm{e}^{\\mathrm{x}}+\\mathrm{e}^{\\mathrm{x}}(1+\\mathrm{x})=\\mathrm{e}^{\\mathrm{x}}(\\mathrm{x}+2)$\r\n\r\n$$\r\n\r\n\\left(\\frac{\\mathrm{d}^{2} \\mathrm{y}}{\\mathrm{dx}^{2}}\\right)_{(\\mathrm{x}=-1)}=\\frac{1}{\\mathrm{e}}+0>0\r\n\r\n$$\r\n\r\nHence, $\\mathrm{y}=\\mathrm{xe}^{\\mathrm{x}}$ is minimum function and\r\n\r\n$$\r\n\r\n\\mathrm{y}_{\\min }=-\\frac{1}{\\mathrm{e}} \\text { . }\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e26f5bfc7ab78ae8b4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "At an extreme point of a function $f(x),$ the tangent to the curve is", "image": null}, "options": [{"id": "N3yV7", "text": "parallel to the $\\mathrm{x}$ -axis", "isCorrect": true, "image": null}, {"id": "ZJD3e", "text": "perpendicular to the $\\mathrm{x}$ -axis", "isCorrect": false, "image": null}, {"id": "IcBfU", "text": "inclined at an angle $45^{\\circ}$ to the $\\mathrm{x}$ -axis", "isCorrect": false, "image": null}, {"id": "GsVUh", "text": "inclined at an angle $60^{\\circ}$ to the $x$ -axis", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At an extreme point of a function $f(x)$, slope is always zero. Thus, At an extreme point of a function $f(x)$, the tangent to the curve is parallel to the x-axis.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e26f5bfc7ab78ae8af", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The set of all values of a for which the function $f(x)=\\left(a^{2}-3 a+2\\right)\\left(\\cos ^{2} x / 4-\\sin ^{2} x / 4\\right)+(a-1) x+$\r\n\r\n$\\sin 1$ does not possess critical points is", "image": null}, "options": [{"id": "bgFeJ", "text": "$[1, \\infty)$", "isCorrect": false, "image": null}, {"id": "WZoSj", "text": "(0,1)$\\cup(1,4)$", "isCorrect": true, "image": null}, {"id": "RdXGw", "text": "(-2,4)", "isCorrect": false, "image": null}, {"id": "c6Rxu", "text": "(1,3)$\\cup(3,5)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "\\(f(x)=\\left(a^{2}=-3 a+2\\right)\\left(\\cos ^{2} x / 4-\\sin ^{2} x / 4\\right)+(a-1) x+\\sin 1\\)\r\n\r\n\\(\\Rightarrow \\mathrm{f}(\\mathrm{x})=(\\mathrm{a}-1)(\\mathrm{a}-2) \\cos \\mathrm{x} / 2+(\\mathrm{a}-1) \\mathrm{x}+\\sin 1\\)\r\n\r\n\\(\\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=-\\frac{1}{2}(\\mathrm{a}-1)(\\mathrm{a}-2) \\sin \\frac{\\mathrm{x}}{2}+(\\mathrm{a}-1)\\)\r\n\r\n\\(\\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=(\\mathrm{a}-1)\\left[1-\\frac{(\\mathrm{a}-2)}{2} \\sin \\frac{\\mathrm{x}}{2}\\right]\\)\r\n\r\nIf \\(f(x)\\) does not possess critical points, then \\(f^{\\prime}(x)\\) = 0 for any \\(x \\in R\\)\r\n\r\n\\(\\Rightarrow(a-1)\\left[1-\\frac{(a-2)}{2} \\sin \\frac{x}{2}\\right]\\) = 0 for any \\(x \\in R\\)\r\n\r\n\\(\\Rightarrow \\mathrm{a}=1\\) and \\(1-\\left(\\frac{\\mathrm{a}-2}{2}\\right) \\sin \\frac{\\mathrm{x}}{2}=0\\)\r\n\r\nmust not have any solution in \\(\\mathrm{R}\\).\r\n\r\n\\(\\Rightarrow \\mathrm{a}=1\\) and \\(\\sin \\frac{\\mathrm{x}}{2}=\\frac{2}{\\mathrm{a}-2}\\) is not solvable in \\(\\mathrm{R}\\).\r\n\r\n\\(\\Rightarrow \\mathrm{a} =  1\\) and \\(\\left|\\frac{2}{\\mathrm{a}-2}\\right|>1\\left[\\right.\\) For \\(\\mathrm{a}=2, \\mathrm{f}(\\mathrm{x})=\\mathrm{x}+\\sin 1 \\therefore \\mathrm{f}^{\\prime}(\\mathrm{x})=1\\)\r\n\r\n\\(\\Rightarrow \\mathrm{a}=1\\) and \\(0<\\mathrm{a}<4 \\Rightarrow \\mathrm{a} \\in(0,1) \\cup(1,4)\\).", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d56f5bfc7ab78ae83d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let $f(x)$ be a polynomial of degree three satisfying $\\mathrm{f}(0)=-1$ and $\\mathrm{f}(1)=0 . \\mathrm{Also}, 0$ is a stationary point of $f(x)$ If $f(x)$ does not have an extremum at $x=0$, then the value of $\\int \\frac{f(x)}{x^{3}-1} d x$ is", "image": null}, "options": [{"id": "agQdh", "text": "$\\frac{x^{2}}{2}+C$", "isCorrect": false, "image": null}, {"id": "2Dphu", "text": "$x+C$", "isCorrect": true, "image": null}, {"id": "OnKqu", "text": "$\\frac{x^{3}}{6}+C$", "isCorrect": false, "image": null}, {"id": "ItUaB", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x)=a x^{3}+b x^{2}+c x+d$\r\n\r\nPut $x=0$ and $x=1$\r\n\r\nThen, we get $f(0)=-1$ and $f(1)=0$ $\\Rightarrow \\mathrm{d}=-1$ and $\\mathrm{a}+\\mathrm{b}+\\mathrm{c}+\\mathrm{d}=0$\r\n\r\n$\\Rightarrow \\mathrm{a}+\\mathrm{b}+\\mathrm{c}=1$\r\n\r\nIt is given that $x=0$ is a stationary point of $\\mathrm{f}(\\mathrm{x})$, but it is not a point of extremum.\r\n\r\nTherefore, $f(0)=0=f^{\\prime \\prime}(0)$ and $f^{\\prime \\prime \\prime}(0)=0$\r\n\r\nNow, $\\mathrm{f}(\\mathrm{x})=\\mathrm{ax}^{3}+\\mathrm{bx}^{2}+\\mathrm{cx}+\\mathrm{d}$\r\n\r\n$\\Rightarrow f(x)=3 a x^{2}+2 b x+c$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\nf^{\\prime \\prime}(x)=6 a x+2 b \\text { and } f^{\\prime \\prime}(x)=6 a \\\\\r\n\r\nf^{\\prime}=0, f^{\\prime \\prime}(0)=0 \\text { and } f^{\\prime \\prime \\prime}(0)=0 \\neq 0\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\n$\\Rightarrow c=0, b=0$ and $a \\neq 0$\r\n\r\nFrom Eqs. (i) and (ii), we get $\\mathrm{a}=1, \\mathrm{~b}=\\mathrm{c}=0$ and $\\mathrm{d}=-1$\r\n\r\nPut these values in $\\mathrm{f}(\\mathrm{x})$ we get $f(x)=x^{3}-1$\r\n\r\nHence, $\\int \\frac{\\mathrm{f}(\\mathrm{x})}{\\mathrm{x}^{3}-1} \\mathrm{dx}=\\int \\frac{\\mathrm{x}^{3}-1}{\\mathrm{x}^{3}-1} \\mathrm{~d} \\mathrm{x}=\\int 1 \\mathrm{~d} \\mathrm{x}=\\mathrm{x}+\\mathrm{C}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d56f5bfc7ab78ae83b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "If \\(0<x<\\frac{\\pi}{2}\\), then", "image": null}, "options": [{"id": "9kUks", "text": "\\(\\tan x<x<\\sin x\\)", "isCorrect": false, "image": null}, {"id": "lOvQN", "text": "\\(x<\\sin x<\\tan x\\)", "isCorrect": false, "image": null}, {"id": "RwaMY", "text": "\\(\\sin x<\\tan x<x\\)", "isCorrect": false, "image": null}, {"id": "pDdCj", "text": "None of the above", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let us assume the functions $\\mathrm{f}(\\mathrm{x})$ and $\\mathrm{g}(\\mathrm{x})$ given by $\\mathrm{f}(\\mathrm{x})=\\tan \\mathrm{x}-\\mathrm{x}$ and $\\mathrm{g}(\\mathrm{x})=\\mathrm{x}-\\sin \\mathrm{x},$ for\r\n\r\n$0<\\mathrm{x}<\\frac{\\pi}{2}$\r\n\r\nNow, $\\mathrm{f}^{\\prime}(\\mathrm{x})=\\sec ^{2} \\mathrm{x}-1$ and\r\n\r\n$\\mathrm{g}^{\\prime}(\\mathrm{x})=1-\\cos \\mathrm{x}$\r\n\r\n$\\Rightarrow \\mathrm{f}(\\mathrm{x})>0$ and $\\mathrm{g}^{\\prime}(\\mathrm{x})>0, \\forall \\mathrm{x} \\in\\left(0, \\frac{\\pi}{2}\\right)$\r\n\r\n$\\Rightarrow \\mathrm{f}(\\mathrm{x})>\\mathrm{f}(0)$ and $\\mathrm{g}(\\mathrm{x})>\\mathrm{g}(0) \\forall \\mathrm{x} \\in\\left(0, \\frac{\\pi}{2}\\right)$\r\n\r\n$\\Rightarrow \\quad \\tan \\mathrm{x}-\\mathrm{x}>0$ and $\\mathrm{x}-\\sin \\mathrm{x}>0,$\r\n\r\n$\\forall \\mathrm{x} \\in\\left(0, \\frac{\\pi}{2}\\right)$\r\n\r\n$\\Rightarrow \\quad \\tan \\mathrm{x}>\\mathrm{x}$ and $\\mathrm{x}>\\sin \\mathrm{x}, \\forall \\mathrm{x} \\in\\left(0, \\frac{\\pi}{2}\\right)$\r\n\r\n$\\Rightarrow \\quad \\sin \\mathrm{x}<\\mathrm{x}<\\tan \\mathrm{x}, \\forall \\mathrm{x} \\in\\left(0, \\frac{\\pi}{2}\\right)$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d46f5bfc7ab78ae837", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "The function $\\mathrm{f}(\\mathrm{x})=\\frac{\\mathrm{x}}{2}+\\frac{2}{\\mathrm{x}}$ has a local minimum at", "image": null}, "options": [{"id": "FUoi0", "text": "$x=2$", "isCorrect": false, "image": null}, {"id": "JHhMK", "text": "$x=-2$", "isCorrect": false, "image": null}, {"id": "wg6iY", "text": "$x=0$", "isCorrect": false, "image": null}, {"id": "A6K8p", "text": "$x=1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\frac{x}{2}+\\frac{2}{x}$ is of the form $x+\\frac{1}{x} \\geq 2$ and equality holds for $x=1$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c56f5bfc7ab78ae7bb", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "The fuel charges for running a train are proportional to the square of the speed generated in miles per hour and costs ' 48 per hour at 16 miles per hour. The most economical speed if the fixed charges i.e. salaries etc. amount to 300 per hour is", "image": null}, "options": [{"id": "pWwKr", "text": "10", "isCorrect": false, "image": null}, {"id": "dMuIC", "text": "20", "isCorrect": false, "image": null}, {"id": "8mx12", "text": "30", "isCorrect": false, "image": null}, {"id": "gnI8B", "text": "40", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the speed of the train be $\\mathrm{v}$ and distance to be covered be so that total time taken is $\\mathrm{s} / \\mathrm{v}$ hours. Cost of fuel per hour $=\\mathrm{kv}^{2}(\\mathrm{k}$ is constant) Also $48=\\mathrm{k} .16^{2}$ by given condition $\\therefore \\mathrm{k}=\\frac{3}{16}$\r\n\r\n$\\therefore$ Cost to fuel per hour $\\frac{3}{16} \\mathrm{v}^{2}$. Other charges per hour are 300 . Total running cost,\r\n\r\n$$\r\n\r\n\\begin{array}{r}\r\n\r\nC=\\left(\\frac{3}{16} \\mathrm{v}^{2}+300\\right) \\frac{\\mathrm{s}}{\\mathrm{v}}=\\frac{3 \\mathrm{~s}}{16} \\mathrm{v}+\\frac{300 \\mathrm{~s}}{\\mathrm{v}} \\\\\r\n\r\n\\frac{\\mathrm{dC}}{\\mathrm{dv}}=\\frac{3 \\mathrm{~s}}{16}-\\frac{300 \\mathrm{~s}}{\\mathrm{v}^{2}}=0 \\Rightarrow \\mathrm{v}=40\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\n$\\frac{\\mathrm{d}^{2} \\mathrm{C}}{\\mathrm{dv}^{2}}=\\frac{600 \\mathrm{~s}}{\\mathrm{v}^{3}}>0 \\therefore \\mathrm{v}=40$ results in minimum\r\n\r\nrunning cost", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b76f5bfc7ab78ae740", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $a^{2} x^{4}+b^{2} y^{4}=c^{4}$, then the maximum value of xy is", "image": null}, "options": [{"id": "NHrlY", "text": "$\\frac{\\mathrm{c}}{\\sqrt{\\mathrm{ab}}}$", "isCorrect": false, "image": null}, {"id": "GJ6c2", "text": "$\\frac{c^{2}}{2 \\sqrt{a b}}$", "isCorrect": false, "image": null}, {"id": "RxT99", "text": "$\\frac{\\mathrm{c}}{2 \\sqrt{\\mathrm{ab}}}$", "isCorrect": false, "image": null}, {"id": "t5Qe5", "text": "$\\frac{c^{2}}{\\sqrt{2 a b}}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "If the sum of two positive quantities is a constant, then their product is maximum, when they are equal. $\\therefore \\mathrm{a}^{2} \\mathrm{x}^{4} \\cdot \\mathrm{b}^{2} \\mathrm{y}^{2}$ is maximum when\r\n\r\n$$\r\n\r\na^{2} x^{4}=b^{2} y^{4}=\\frac{1}{2}\\left(a^{2} x^{4}=\\frac{1}{2}\\left(a^{2} x^{4}+b^{2} y^{4}\\right)=\\frac{c^{4}}{2}\\right.\r\n\r\n$$\r\n\r\n$\\therefore$ maximum value of $a^{2} x^{4} \\cdot b^{2} y^{4}=\\frac{c^{4}}{2} \\cdot \\frac{c^{4}}{2}=\\frac{c^{8}}{4}$\r\n\r\nMaximum value of $x y=\\left(\\frac{c^{8}}{4 a^{2} b^{2}}\\right)^{1 / 4}=\\frac{c^{2}}{\\sqrt{2 a b}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79a6f5bfc7ab78ae649", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "The function \\(\\mathrm{f}(\\mathrm{x})=2 \\mathrm{x}^3-3 \\mathrm{x}^2-12 \\mathrm{x}+4\\), has", "image": null}, "options": [{"id": "Jcy1i", "text": "two points of local maximum", "image": null, "isCorrect": false}, {"id": "96oBQ", "text": "two points of local minimum", "image": null, "isCorrect": false}, {"id": "ezceD", "text": "one maxima and one minima", "image": null, "isCorrect": true}, {"id": "rJXkv", "text": "nomaxima or minima", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& f(x)=2 x^3-3 x^2-12 x+4 \\\\\n& \\Rightarrow \\quad f^{\\prime}(x)=6 x^2-6 x-12=6\\left(x^2-x-2\\right) \\\\\n& =6(x-2)(x+1)\n\\end{aligned}\\)\nFor maxima and minima \\(\\mathrm{f}^{\\prime}(\\mathrm{x})=0\\)\n\\(\\therefore \\quad 6(\\mathrm{x}-2)(\\mathrm{x}+1)=0 \\Rightarrow \\mathrm{x}=2,-1\\)\nNow, \\(\\mathrm{f}^{\\prime \\prime}(\\mathrm{x})=12 \\mathrm{x}-6\\)\n\\(\\begin{aligned}\n& \\text { At } \\mathrm{x}=2 ; \\mathrm{f}^{\\prime \\prime}(\\mathrm{x})=24-6=18 > 0 \\\\\n& \\therefore \\quad \\mathrm{x}=2, \\text { local min. point } \\\\\n& \\text { At } \\mathrm{x}=-1 ; \\mathrm{f}^{\\prime \\prime}(\\mathrm{x})=12(-1)-6=-18  < 0 \\\\\n& \\therefore \\mathrm{x}=-1 \\text { local max. point }\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7996f5bfc7ab78ae647", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "The minimum value of \\(f(x)=\\sin ^4 x+\\cos ^4 x\\) in the interval \\(\\left(0, \\frac{\\pi}{2}\\right)\\) is", "image": null}, "options": [{"id": "OdOAa", "text": "\\(\\frac{1}{2}\\)", "image": null, "isCorrect": true}, {"id": "vtbdb", "text": "2", "image": null, "isCorrect": false}, {"id": "39UUs", "text": "\\(\\sqrt{2}\\)", "image": null, "isCorrect": false}, {"id": "h4L85", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let \\(y=\\sin ^4 x+\\cos ^4 x\\)\n\\(\\begin{aligned}\n& \\frac{d y}{d x}=4 \\sin ^3 x \\cos x+4 \\cos ^3 x(-\\sin x) \\\\\n& =4 \\sin x \\operatorname{cox}\\left(\\sin ^2 x-\\cos ^2 x\\right) \\\\\n& =(2 \\sin 2 x)(-\\cos 2 x)=-\\sin 4 x \\\\\n& \\therefore \\frac{d y}{d x}=0 \\Rightarrow \\sin 4 x=0 \\Rightarrow 4 x=0, \\pi, 2 \\pi, 3 \\pi\n\\end{aligned}\\)\nor \\(\\mathrm{x}=0, \\frac{\\pi}{4}, \\frac{\\pi}{2}, \\frac{3 \\pi}{4}, \\ldots \\ldots \\ldots, \\Rightarrow \\mathrm{x}=\\frac{\\pi}{4}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78c6f5bfc7ab78ae5d2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "If a flagstaff of 6 metres high placed on the top of a tower throws a shadow of \\(2 \\sqrt{3}\\) metres along the ground, then the angle (in degrees) that the sun makes with the ground is", "image": null}, "options": [{"id": "XSZrZ", "text": "\\(60^{\\circ}\\)", "image": null, "isCorrect": true}, {"id": "7JH2p", "text": "\\(80^{\\circ}\\)", "image": null, "isCorrect": false}, {"id": "yalCb", "text": "\\(75^{\\circ}\\)", "image": null, "isCorrect": false}, {"id": "tOMCJ", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Accordingly,\n\\(\\tan \\theta=\\frac{h}{x}=\\frac{h+6}{x+2 \\sqrt{3}}=\\frac{6}{2 \\sqrt{3}} \\Rightarrow \\theta=60^{\\circ}\\)\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/tQkcpar07B9fqdYJWQ12ih7PgndRF2IP_v_OdhX8gvc.original.fullsize.png\"><br>\n[Since the triangles \\(A E C\\) and \\(B D C\\) are similar] \\(h \\cot \\alpha=(h-100) \\cot \\beta\\)\n\\(\\therefore h=\\frac{100 \\cot \\beta}{\\cot \\beta-\\cot \\alpha}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77e6f5bfc7ab78ae555", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "A person standing on the bank of a river observes that the angle subtended by a tree on the opposite bank is \\(60^{\\circ}\\). when he retreats 20 feet from the bank, he finds the angle to be \\(30^{\\circ}\\). The breadth of the river in feet is :", "image": null}, "options": [{"id": "AQN4y", "text": "15", "image": null, "isCorrect": false}, {"id": "jOwYV", "text": "\\(15 \\sqrt{3}\\)", "image": null, "isCorrect": false}, {"id": "D5059", "text": "\\(10 \\sqrt{3}\\)", "image": null, "isCorrect": false}, {"id": "Se1o7", "text": "10", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "et \\(h\\) be the height of tree PQ and breadth of river PS be \\(x \\mathrm{~ft}\\). Angle of elevation subtended by a tree is \\(60^{\\circ}\\). Also, when he retreats 20 feet, the angle becomes \\(30^{\\circ}\\).\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/jOllLNiEMLkHgFUugK12xCQ7Ec8Jb8rofS_ArBzIMR8.original.fullsize.png\"><br>\nAlso, in \\(\\triangle \\mathrm{PQS}\\),\n\\(\\begin{aligned}\n& \\tan 60^{\\circ}=\\frac{h}{x} \\\\\n& \\Rightarrow h=\\sqrt{3} x\n\\end{aligned}\\)\nand in \\(\\triangle \\mathrm{PQR}\\),\n\\(\\begin{aligned}\n& \\tan 30^{\\circ}=\\frac{h}{x+20} \\Rightarrow \\frac{1}{\\sqrt{3}}=\\frac{h}{x+20} \\\\\n& \\Rightarrow x+20=\\sqrt{3} h \\\\\n& \\Rightarrow x+20=3 x \\Rightarrow 2 x=20 \\Rightarrow x=10\n\\end{aligned}\\)\nHence breadth of river is \\(10 \\mathrm{ft}\\).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e86d6f5bfc7ab78aee0c", "title": "Mean Value Theorem", "totalQuestions": 4, "questions": [{"_id": "64c0e81c6f5bfc7ab78aeab1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "Suppose that $f(0)=-3$ and $f^{\\prime}(x) \\leq 5$ for all values of $x$ Then, the largest value which $f(2)$ can attain is", "image": null}, "options": [{"id": "m4wum", "text": "7", "isCorrect": true, "image": null}, {"id": "UuZ9t", "text": "10", "isCorrect": false, "image": null}, {"id": "CQ9ET", "text": "2", "isCorrect": false, "image": null}, {"id": "FGUY4", "text": "9", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using LMVT in [0,2] $\\frac{f(2)-f(0)}{2-0}=f^{\\prime}(c),$ where $c \\in(0,2)$\r\n\r\n$\\frac{f(2)+3}{2} \\leq 5 \\Rightarrow f(2) \\leq 7$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f06f5bfc7ab78ae92d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "Rolle&#39;s theorem is not applicable for the function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mo>|</mo><mi>x</mi><mo>|</mo></math> in the interval <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mo>-</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>]</mo></math> because", "image": null}, "options": [{"id": "tBcAu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>'</mo></msup><mo>(</mo><mn>1</mn><mo>)</mo></math>&nbsp;does not exist", "isCorrect": false, "image": null}, {"id": "n6nvr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>'</mo></msup><mo>(</mo><mo>-</mo><mn>1</mn><mo>)</mo></math> does not exist", "isCorrect": false, "image": null}, {"id": "DEBKY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo></math> is discontinuous at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "1AYAx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>'</mo></msup><mo>(</mo><mn>0</mn><mo>)</mo></math> does not exist", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>We have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mo>|</mo><mi>x</mi><mo>|</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/ffce6ca3-49aa-4259-a0a0-8ee87b381d58-image.png\" style=\"width: 250px; height: 190px;\" /></p><p>We know that the function is not differentiable at the sharp edges. Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;is not differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>.&nbsp; Therefore,&nbsp;Rolle&#39;s theorem is not applicable for the function</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mo>|</mo><mi>x</mi><mo>|</mo></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mo>-</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>]</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mo>(</mo><mn>0</mn><mo>)</mo></math> does not exist.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d36f5bfc7ab78ae82f", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "The number of real roots of the equation e $\\mathrm{e}^{(x-1)}+\\mathrm{x}$ $-2=0$ is", "image": null}, "options": [{"id": "irndo", "text": "1", "isCorrect": true, "image": null}, {"id": "hhtGr", "text": "2", "isCorrect": false, "image": null}, {"id": "e61e7", "text": "$\\frac{3}{3}$", "isCorrect": false, "image": null}, {"id": "F75xY", "text": "4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x)=e^{x-1}+x-2$\r\n\r\ncheck for $x=1$ Then, $\\mathrm{f}(1)=\\mathrm{e}^{0}+1-2=0$\r\n\r\nSo, $x=1$ is a real root of the equation $f(x)=0$ Let $x=\\alpha$ be the other root such that $\\alpha>1$ or\r\n\r\n$\\alpha<1$. Consider the interval $[1, \\alpha]$ or $[\\alpha, 1]$\r\n\r\nClearly $\\mathrm{f}(1)=\\mathrm{f}(\\alpha)=0$\r\n\r\nBy Rolle's theorem $\\mathrm{f}(\\mathrm{x})=0$ has a root in $(1, \\alpha)$ or in $(\\alpha, 1)$. But $f^{\\prime}(x)=e^{x-1}+1>0,$ for all $x$. Thus\r\n\r\n$\\mathrm{f}^{\\prime}(\\mathrm{x}) \\neq 0,$ for any $\\mathrm{x} \\in(1, \\alpha)$ or $\\mathrm{x} \\in(\\alpha, 1)$\r\n\r\nwhich is a contradiction. Hence, $\\mathrm{f}(\\mathrm{x})=0$ has no real root other than 1 .", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a76f5bfc7ab78ae6bb", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $f(x)=x^{\\alpha} \\log x$ and $f(0)=0,$ then the value of $\\alpha$ for which Rolle's theorem can be applied in [0,1] is", "image": null}, "options": [{"id": "ozX4u", "text": "-2", "isCorrect": false, "image": null}, {"id": "SrDVi", "text": "-1", "isCorrect": false, "image": null}, {"id": "xeKQm", "text": "0", "isCorrect": false, "image": null}, {"id": "DB6JI", "text": "$1 / 2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For Rolle's theorem in $[\\mathrm{a}, \\mathrm{b}], \\mathrm{f}(\\mathrm{a})=\\mathrm{f}(\\mathrm{b}),$\r\n$\\operatorname{In}[0,1] \\Rightarrow \\mathrm{f}(0)=\\mathrm{f}(1)=0$\r\n$\\because$ the function has to be continuous in [0,1] $\\Rightarrow f(0)=\\lim _{x \\rightarrow 0^{+}} f(x)=0$\r\n$\\Rightarrow \\lim _{x \\rightarrow 0} x^{\\alpha} \\log x=0 \\Rightarrow \\lim _{x \\rightarrow 0} \\frac{\\log x}{x^{-\\alpha}}=0$\r\nApplying L.H. Rule $\\lim _{x \\rightarrow 0} \\frac{1 / x}{-\\alpha x^{-\\alpha-1}}=0$\r\n$\\Rightarrow \\lim _{x \\rightarrow 0} \\frac{-x^{\\alpha}}{\\alpha}=0 \\Rightarrow \\alpha>0$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};

    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
