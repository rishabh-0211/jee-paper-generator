\\therefore \\mathrm{Q} \\text { is }\\left(\\frac{9}{4}, \\frac{3}{8}\\right)\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8286f5bfc7ab78aeb1a", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "The points at which the tangent passes through the origin for the curve $y=4 x^{3}-2 x^{5}$ are", "image": null}, "options": [{"id": "VwGuz", "text": "$(0,0),(2,1)$ and $(-1,-2)$", "isCorrect": false, "image": null}, {"id": "v7sCb", "text": "$(0,0),(2,1)$ and $(-2,-1)$", "isCorrect": false, "image": null}, {"id": "AsoHj", "text": "$(2,0),(2,1)$ and $(-3,1)$", "isCorrect": false, "image": null}, {"id": "7YzZG", "text": "$(0,0),(1,2)$ and $(-1,-2)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The equation of the given curve is\r\n\r\n$\\begin{array}{l}\r\n\r\ny=4 x^{3}-2 x^{5} \\\\\r\n\r\n\\frac{\\mathrm{dy}}{\\mathrm{dx}}=12 x^{2}-10 x^{4}\r\n\r\n\\end{array}$\r\n\r\nTherefore, the slope of the tangent at point $(x, y)$ is $12 x^{2}-10 x^{4}$. The equation of the tangent at $(x, y)$ is given by\r\n\r\n$\\mathrm{Y}-y=\\left(12 x^{2}-10 x^{4}\\right)(\\mathrm{X}-x) \\ldots \\text { (i) }$\r\n\r\nWhen, the tangent passes through the origin $(0,0)$, then $\\mathrm{X}=\\mathrm{Y}=0$ Therefore, eq. (i) reduce to\r\n\r\n$\\begin{array}{l}\r\n\r\n-y=\\left(12 x^{2}-10 x^{4}\\right)(-x) \\\\\r\n\r\n\\Rightarrow y=12 x^{3}-10 x^{5}\r\n\r\n\\end{array}$\r\n\r\nAlso, we have $y=4 x^{3}-2 x^{5}$\r\n\r\n$\\begin{array}{l}\r\n\r\n\\therefore 12 x^{3}-10 x^{5} \\\\\r\n\r\n=4 x^{3}-2 x^{5} \\\\\r\n\r\n\\Rightarrow 8 x^{5}-8 x^{3}=0 \\\\\r\n\r\n\\Rightarrow x^{5}-x^{3}=0 \\\\\r\n\r\n\\Rightarrow x^{3}\\left(x^{2}-1\\right)=0 \\\\\r\n\r\n\\Rightarrow x=0, \\pm 1\r\n\r\n\\end{array}$\r\n\r\nWhen, $x=0$\r\n\r\n$y=4(0)^{3}-2(0)^{5}=0$\r\n\r\nWhen, $x=1$,\r\n\r\n$y=4(1)^{3}-2(1)^{5}=2$\r\n\r\nWhen, $x=-1$,\r\n\r\n$y=4(-1)^{3}-2(-1)^{5}=-2$\r\n\r\nHence, the require points are $(0,0),(1,2)$ and $(-1,-2)$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e81c6f5bfc7ab78aeaac", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "The equation of the tangent to the curve $y=b e^{-x/a}$ at the point where it crosses the $y$ -axis is", "image": null}, "options": [{"id": "SwkRG", "text": "$\\frac{x}{a}-\\frac{y}{b}=1$", "isCorrect": false, "image": null}, {"id": "0wAgK", "text": "$a x+b y=1$", "isCorrect": false, "image": null}, {"id": "kjguC", "text": "$a x-b y=1$", "isCorrect": false, "image": null}, {"id": "glVf5", "text": "$\\frac{x}{a}+\\frac{y}{b}=1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$y=b e^{-x / a}$ meets the $y$ -axis at $(0, b)$. Again,\r\n\r\n$\\frac{d y}{d x}=b e^{-x / a}\\left(-\\frac{1}{a}\\right)$\r\n\r\n$\\operatorname{At}(0, b), \\frac{d y}{d x}=b e^{0}\\left(-\\frac{1}{a}\\right)=-\\frac{b}{a}$\r\n\r\nTherefore, required tangent is\r\n\r\n$y-b=-\\frac{b}{a}(x-0) \\text { or } \\frac{x}{a}+\\frac{y}{b}=1$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e80f6f5bfc7ab78aea39", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "The distance between the origin and the normal to curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math> is", "image": null}, "options": [{"id": "OYtGA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><msqrt><mn>3</mn></msqrt></mfrac></math>", "isCorrect": false, "image": null}, {"id": "cWvLT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><msqrt><mn>5</mn></msqrt></mfrac></math>", "isCorrect": true, "image": null}, {"id": "h69yb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math>", "isCorrect": false, "image": null}, {"id": "JNuc3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>5</mn></msqrt></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup></math></p><p>at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn><mo>,</mo><mi>y</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mn>2</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>x</mi></mrow></msup><mo>+</mo><mn>2</mn><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mfenced><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow></msub><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Equation of normal at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo></math> is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>(</mo><mi>x</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Distance from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo>)</mo></math> from normal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2</mn><msqrt><mn>5</mn></msqrt></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f26f5bfc7ab78ae940", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "Line joining the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>5</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>)</mo></math> is a tangent to the curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mfrac><mrow><mi>a</mi><mi>x</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>x</mi></mrow></mfrac></math>, then", "image": null}, "options": [{"id": "60TeN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>1</mn><mo>&#177;</mo><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "4UqUL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>&#8712;</mo><mi>&#981;</mi></math>", "isCorrect": true, "image": null}, {"id": "F6MB7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>&#177;</mo><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "7gc80", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mn>2</mn><mo>&#177;</mo><mn>2</mn><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Equation of line joining the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>5</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>)</mo></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>3</mn><mo>-</mo><mi>x</mi></math>.</p><p>If this line is tangent to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mfrac><mrow><mi>a</mi><mi>x</mi></mrow><mrow><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo></mrow></mfrac></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>3</mn><mo>-</mo><mi>x</mi><mo>)</mo><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo><mo>=</mo><mi>a</mi><mi>x</mi></math> should have equal roots.&nbsp;</p><p>Thus, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>a</mi><mo>-</mo><mn>2</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mn>12</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math> No value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>&#8658;</mo><mi>a</mi><mo>&#8712;</mo><mi>&#981;</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f06f5bfc7ab78ae92e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the curve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msup><mi>a</mi><mi>x</mi></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msup><mi>b</mi><mi>x</mi></msup></math> intersect at angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>, then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&#945;</mi></math> is equal to", "image": null}, "options": [{"id": "9oFVz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>a</mi><mo>-</mo><mi>b</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>a</mi><mi>b</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "Tebrb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>log</mi><mi>a</mi><mo>-</mo><mi>log</mi><mi>b</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>log</mi><mi>a</mi><mi>log</mi><mi>b</mi></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "2p07q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi>a</mi><mi>b</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "2Y4wj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>log</mi><mi>a</mi><mo>+</mo><mi>log</mi><mi>b</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi>log</mi><mi>a</mi><mi>log</mi><mi>b</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Clearly, the point of intersection of curves is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo></math>.</p><p>Now, slope of tangent of first curve</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><msup><mi>a</mi><mi>x</mi></msup><mi>log</mi><mi>a</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mfenced><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mfenced><mrow><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo></mrow></msub><mo>=</mo><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mi>log</mi><mi>a</mi></math></p><p>Slope of tangent of second curve,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><msup><mi>b</mi><mi>x</mi></msup><mi>log</mi><mi>b</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><msub><mfenced><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mfenced><mrow><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo></mrow></msub><mo>=</mo><mi>log</mi><mi>b</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>tan</mi><mi>&#945;</mi><mo>=</mo><mfenced open=\"|\" close=\"|\"><mfrac><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>-</mo><msub><mi>m</mi><mn>2</mn></msub></mrow><mrow><mn>1</mn><mo>+</mo><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></mrow></mfrac></mfenced><mo>=</mo><mfrac><mrow><mi>log</mi><mi>a</mi><mo>-</mo><mi>log</mi><mi>b</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>log</mi><mi>a</mi><mi>log</mi><mi>b</mi></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e26f5bfc7ab78ae8b1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "What is the $x$ -coordinate of the point on the curve $f(x)=\\sqrt{x}(7 x-6),$ where the tangent is parallel to $\\mathrm{x}$ -axis?", "image": null}, "options": [{"id": "oLz6E", "text": "$-\\frac{1}{3}$", "isCorrect": false, "image": null}, {"id": "eZ9tb", "text": "$\\frac{2}{7}$", "isCorrect": true, "image": null}, {"id": "bNQNF", "text": "$\\frac{6}{7}$", "isCorrect": false, "image": null}, {"id": "AtU8c", "text": "$\\frac{1}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$f(x)=\\sqrt{x}(7 x-6)=7 x^{3 / 2}-6 x^{1 / 2}$\r\n\r\n$f^{\\prime}(x)=7 \\times \\frac{3}{2} x^{1 / 2}-6 \\times \\frac{1}{2} x^{-1 / 2}$\r\n\r\nWhen tangent is parallel to $x$ axis $f^{\\prime}(x)=0$\r\n\r\nor, $\\quad \\frac{21}{2} \\mathrm{x}^{1 / 2}-3 \\mathrm{x}^{-1 / 2}=0$\r\n\r\n$\\frac{21}{2} \\sqrt{x}=\\frac{3}{\\sqrt{x}}$\r\n\r\nor, $7 x=2 \\Rightarrow x=\\frac{2}{7}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d46f5bfc7ab78ae834", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "The slope of the tangent to the curve $y=e^{x}$ cos $x$ is minimum at $x=\\alpha, 0 \\leq a \\leq 2 \\pi$, then the value of $\\alpha$ is", "image": null}, "options": [{"id": "qT5C7", "text": "$\\underline{0}$", "isCorrect": false, "image": null}, {"id": "TyOBg", "text": "$\\pi$", "isCorrect": true, "image": null}, {"id": "YP4Z9", "text": "$2 \\pi$", "isCorrect": false, "image": null}, {"id": "ic0S8", "text": "$3 \\pi 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $m$ be the slope of the tangent to the curve\r\n\r\n$y=e^{x} \\cos x$\r\n\r\nThen, $m=\\frac{d y}{d x}=e^{x}(\\cos x-\\sin x)$\r\n\r\nDiff. w.r.t 'x'\r\n\r\n$$\r\n\r\n\\begin{array}{r}\r\n\r\n\\Rightarrow \\frac{\\mathrm{dm}}{\\mathrm{dx}}=\\mathrm{e}^{\\mathrm{x}}(\\cos \\mathrm{x}-\\sin \\mathrm{x})+\\mathrm{e}^{\\mathrm{x}}(-\\sin \\mathrm{x}-\\cos \\mathrm{x}) \\\\\r\n\r\n=-2 \\mathrm{e}^{\\mathrm{x}} \\sin \\mathrm{x}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nand $\\frac{\\mathrm{d}^{2} \\mathrm{~m}}{\\mathrm{dx}^{2}}=-2 \\mathrm{e}^{\\mathrm{x}}(\\sin \\mathrm{x}+\\cos \\mathrm{x})$\r\n\r\nPut $\\frac{\\mathrm{dm}}{\\mathrm{dx}}=0 \\Rightarrow \\sin \\mathrm{x}=0 \\Rightarrow \\mathrm{x}=0, \\pi, 2 \\pi$\r\n\r\nClearly, $\\frac{\\mathrm{d}^{2} \\mathrm{~m}}{\\mathrm{dx}^{2}}>0$ for $\\mathrm{x}=\\pi$\r\n\r\nThus, $y$ is minimum at $x=\\pi$.\r\n\r\nHence the value of $\\alpha=\\pi$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d46f5bfc7ab78ae833", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "Tangents are drawn from the origin to the curve $\\mathrm{y}=\\cos \\mathrm{x} .$ Their points of contact lie on", "image": null}, "options": [{"id": "0YF2U", "text": "$x^{2} y^{2}=y^{2}-x^{2}$", "isCorrect": false, "image": null}, {"id": "awn3w", "text": "$x^{2} y^{2}=x^{2}+y^{2}$", "isCorrect": false, "image": null}, {"id": "4EFok", "text": "$x^{2} y^{2}=x^{2}-y^{2}$", "isCorrect": true, "image": null}, {"id": "BhZOz", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\left(x_{1}, y_{1}\\right)$ be one of the points of contact. Given curve is $y=\\cos x$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\Rightarrow \\frac{\\mathrm{dy}}{\\mathrm{dx}}=-\\sin \\mathrm{x} \\\\\r\n\r\n\\left.\\Rightarrow \\frac{\\mathrm{dy}}{\\mathrm{dx}}\\right|_{\\left(\\mathrm{x}_{1}, \\mathrm{y}_{1}\\right)}=-\\sin \\mathrm{x}_{1}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nNow the equation of the tangent at $\\left(\\mathrm{x}_{1}, \\mathrm{y}_{1}\\right)$ is\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n& y-y_{1}\\left(\\frac{d y}{d x}\\right)_{\\left(x_{1}, y_{1}\\right)}\\left(x-x_{1}\\right) \\\\\r\n\r\n\\Rightarrow & y-y_{1}=-\\sin x_{1}\\left(0-x_{1}\\right)\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\nSince, it is given that equation of tangent passes through origin.\r\n\r\n$$\r\n\r\n\\begin{array}{lr}\r\n\r\n\\therefore & 0-y_{1}=-\\sin x_{1}\\left(0-x_{1}\\right) \\\\\r\n\r\n\\Rightarrow & y_{1}=-x_{1} \\sin x_{1}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nAlso, point $\\left(x_{1}, y_{1}\\right)$ lies on $y=\\cos x$\r\n\r\n$$\r\n\r\n\\therefore \\quad y_{1}=\\cos x_{1}\r\n\r\n$$\r\n\r\nFrom Eqs. (i), (ii), we get\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n& \\sin ^{2} x_{1}+\\cos ^{2} x_{1}=\\frac{y_{1}^{2}}{x_{1}^{2}}+y_{1}^{2}=1 \\\\\r\n\r\n\\Rightarrow & x_{1}^{2}=y_{1}^{2}+y_{1}^{2} x_{1}^{2}\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\nHence, the locus of $\\left(x_{1}, y_{1}\\right)$ is\r\n\r\n$$\r\n\r\nx^{2}=y^{2}+y^{2} x^{2} \\Rightarrow x^{2} y^{2}=x^{2}-y^{2}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d36f5bfc7ab78ae82a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "The line which is parallel to X-axis and crosses the curve $y=\\sqrt{x}$ at an angle of $45^{\\circ}$, is", "image": null}, "options": [{"id": "7v2Zz", "text": "$x=\\frac{1}{4}$", "isCorrect": false, "image": null}, {"id": "9G1xd", "text": "$y=\\frac{1}{4}$", "isCorrect": false, "image": null}, {"id": "XIlt0", "text": "$y=\\frac{1}{2}$", "isCorrect": true, "image": null}, {"id": "OUFhh", "text": "$y=1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation of a line parallel to X-axis is $\\mathrm{y}=\\mathrm{k}$\r\n\r\nGiven equation of the curve is $y=\\sqrt{x}$, On solving equation of line with the equation of curve, we get $x=k^{2}$ Thus the intersecting point is $\\left(\\mathrm{k}^{2}, \\mathrm{k}\\right)$ It is given that the line $\\mathrm{y}=\\mathrm{k}$ intersect the curve $y=\\sqrt{x}$ at an angle of $\\pi / 4$. This means that the slope of the tangent to\r\n\r\n$$\r\n\r\n\\mathrm{y}=\\sqrt{\\mathrm{x}} \\text { at }\\left(\\mathrm{k}^{2}, \\mathrm{k}\\right) \\text { is } \\tan \\left(\\pm \\frac{\\pi}{4}\\right)=\\pm 1\r\n\r\n$$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\Rightarrow\\left(\\frac{\\mathrm{dy}}{\\mathrm{dx}}\\right)_{\\left(\\mathrm{k}^{2}, \\mathrm{k}\\right)}=\\pm 1 \\Rightarrow\\left(\\frac{1}{2 \\sqrt{\\mathrm{x}}}\\right)_{\\left(\\mathrm{k}^{2}, \\mathrm{k}\\right)}=\\pm 1 \\\\\r\n\r\n\\Rightarrow \\mathrm{k}=\\pm \\frac{1}{2}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b76f5bfc7ab78ae73e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "The equation of all lines having slope 2 which are tangent to the curve $y=\\frac{1}{x-3}, x \\neq 3,$ is", "image": null}, "options": [{"id": "MiESn", "text": "$y=2$", "isCorrect": false, "image": null}, {"id": "aeUS3", "text": "$y=2 x$", "isCorrect": false, "image": null}, {"id": "uL27y", "text": "$y=2 x+3$", "isCorrect": false, "image": null}, {"id": "kppMk", "text": "None of these", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The equation of the given curve is $\\mathrm{y}=\\frac{1}{\\mathrm{x}-3}, \\mathrm{x} \\neq 3$\r\n\r\nThe slope of the tangent to the given curve\r\n\r\nat any point $(\\mathrm{x}, \\mathrm{y})$ is given by $\\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\frac{-1}{(\\mathrm{x}-3)^{2}}$\r\n\r\nFor tangent having slope $2,$ we must have\r\n\r\n$2=\\frac{-1}{(x-3)^{2}}$\r\n\r\n$$\r\n\r\n\\Rightarrow 2(x-3)^{2}=-1 \\Rightarrow(x-3)^{2}=-\\frac{1}{2}\r\n\r\n$$\r\n\r\nwhich is not possible as square of a real number cannot be negative. Hence, there is no tangent to the given curve having slope 2 .", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a76f5bfc7ab78ae6bf", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 3, "question": {"text": "If the normal to the curve $y=f(x)$ at the point (3,4) makes an angle $3 \\pi / 4$ with the positive $\\mathrm{x}$ -axis, then $\\mathrm{f}^{\\prime}(3)=$", "image": null}, "options": [{"id": "igwvd", "text": "-1", "isCorrect": false, "image": null}, {"id": "i9ZB6", "text": "$-3 / 4$", "isCorrect": false, "image": null}, {"id": "ipxD1", "text": "$4 / 3$", "isCorrect": false, "image": null}, {"id": "KbLf0", "text": "1", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Slope of normal to $y=f(x)$ at (3,4) is $\\frac{-1}{f^{\\prime}(3)}$.\r\n$\\text { Thus, } \\begin{array}{c}\r\n\\frac{-1}{\\mathrm{f}^{\\prime}(3)}=\\tan \\left(\\frac{3 \\pi}{4}\\right)=\\tan \\left(\\frac{\\pi}{2}+\\frac{\\pi}{4}\\right) \\\\\r\n=-\\cot \\frac{\\pi}{4}=-1 \\Rightarrow \\mathrm{f}^{\\prime}(3)=1\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79a6f5bfc7ab78ae648", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "The curve \\(y-e^{x y}+x=0\\) has a vertical tangent at", "image": null}, "options": [{"id": "cv2Fy", "text": "\\((1,1)\\)", "image": null, "isCorrect": false}, {"id": "LUPbk", "text": "\\((0,1)\\)", "image": null, "isCorrect": false}, {"id": "HNQOp", "text": "\\((1,0)\\)", "image": null, "isCorrect": true}, {"id": "evtXy", "text": "no point", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& y-e^{x y}+x=0 \\\\\n& \\therefore \\frac{d y}{d x}-e^{x y}\\left(y+x \\frac{d y}{d x}\\right)+1=0 \\\\\n& \\text {i.e., } \\frac{d y}{d x}-y(x+y)-x(x+y) \\frac{d y}{d x}+1=0 \\\\\n& \\text {i.e., }[1-x(x+y)] \\frac{d y}{d x}=y(x+y)-1\n\\end{aligned}\\)\nfor the vertical tangents\n\\(1-x(x+y)=0\\) i.e., \\(\\quad y=\\frac{1-x^2}{x}\\)\n\\(\\therefore \\mathrm{x}=1\\) and \\(\\mathrm{y}=0\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78b6f5bfc7ab78ae5c3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "The function \\(\\mathrm{f}(\\mathrm{x})=\\tan \\mathrm{x}-4 \\mathrm{x}\\) is strictly decreasing on", "image": null}, "options": [{"id": "EnQB0", "text": "\\(\\left(-\\frac{\\pi}{3}, \\frac{\\pi}{3}\\right)\\)", "image": null, "isCorrect": true}, {"id": "p3xEY", "text": "\\(\\left(\\frac{\\pi}{3}, \\frac{\\pi}{2}\\right)\\)", "image": null, "isCorrect": false}, {"id": "TEAnZ", "text": "\\(\\left(-\\frac{\\pi}{3}, \\frac{\\pi}{2}\\right)\\)", "image": null, "isCorrect": false}, {"id": "IWBnp", "text": "\\(\\left(\\frac{\\pi}{2}, \\pi\\right)\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(f(x)=\\tan x-4 x \\Rightarrow f^{\\prime}(x)=\\sec ^2 x-4\\)\nWhen \\(\\frac{-\\pi}{3}  < \\mathrm{x} < \\frac{\\pi}{3}, 1 < \\sec \\mathrm{x} < 2\\)\nTherefore, \\(1 < \\sec ^2 x < 4\\)\n\\(\\Rightarrow-3 < \\left(\\sec ^2 x-4\\right) < 0\\)\nThus, for \\(\\frac{-\\pi}{3} < \\mathrm{x} < \\frac{\\pi}{3}, \\mathrm{f}^{\\prime}(\\mathrm{x}) < 0\\)\nHence, \\(\\mathrm{f}\\) is strictly decreasing on \\(\\left(\\frac{-\\pi}{3}, \\frac{\\pi}{3}\\right)\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77d6f5bfc7ab78ae546", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The value of \\(a\\) in order that \\(f(x)=\\sin x-\\cos x-a x+b\\) decreases for all real values is given by", "image": null}, "options": [{"id": "2oCyr", "text": "\\(a \\geq \\sqrt{2}\\)", "image": null, "isCorrect": true}, {"id": "6nZVC", "text": "a \\(  < \\sqrt{2}\\)", "image": null, "isCorrect": false}, {"id": "ZQme5", "text": "\\(a \\geq 1\\)", "image": null, "isCorrect": false}, {"id": "0SoXo", "text": "\\(a  < 1\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have; \\(f(x)=\\sin x-\\cos x-a x+b\\)\n\\(\\Rightarrow f^{\\prime}(x)=\\cos x+\\sin x-a\\)\n\\(\\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})  < 0 ~\\forall~ \\mathrm{x} \\in \\mathrm{R}\\)\n\\(\\Rightarrow(\\cos x+\\sin x) < a ~\\forall~ x \\in R\\)\nAs the max. value of \\((\\cos x+\\sin x)\\) is \\(\\sqrt{2}\\)\nThe above is possible when \\(a \\geq \\sqrt{2}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77c6f5bfc7ab78ae544", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The set of points of discontinuity of the function \\(1 / \\log |\\mathrm{x}|\\) is -", "image": null}, "options": [{"id": "BhUbl", "text": "\\(\\{-1,0,1\\}\\)", "image": null, "isCorrect": true}, {"id": "kJgaH", "text": "\\(\\{0\\}\\)", "image": null, "isCorrect": false}, {"id": "qPi63", "text": "\\(\\{0,1\\}\\)", "image": null, "isCorrect": false}, {"id": "s1RWi", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let \\(f(x)=\\frac{1}{\\log |x|}\\)\nThe points of disconinuity of \\(f(x)\\) are those points where \\(f(x)\\) is undefined or infinite. It is undefined when \\(x=0\\) and is infinite when \\(\\log |x|=0,|x|=1\\), i.e. \\(x= \\pm 1\\).\n\\(\\therefore \\quad\\) Set of points of discontinuity \\(=\\{-1,0,1\\}\\).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e86d6f5bfc7ab78aee08", "title": "Rate Measure Error and Approximation", "totalQuestions": 6, "questions": [{"_id": "67726d0ec49e8ef28ee2b3e6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "The maximum volume (in cu. units) of the cylinder which can be inscribed in a sphere of radius 12 units is", "image": null}, "options": [{"id": "n9JC4", "text": "$384 \\sqrt{3} \\pi$", "image": null, "isCorrect": false}, {"id": "TJYRw", "text": "$768 \\sqrt{3} \\pi$", "image": null, "isCorrect": true}, {"id": "cwzJ7", "text": "$\\frac{768 \\pi}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "HrxKR", "text": "$\\frac{1152 \\pi}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$12^2=r^2+\\left(\\frac{h}{2}\\right)^2 \\Rightarrow V=\\pi r^2 h$\n$\\Rightarrow \\quad V=\\pi\\left(144-\\frac{h^2}{4}\\right) h$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/iz6kZkvCfLIqhDLfZ-07Sf825wujqkWx95TpgxB0YRk.original.fullsize.png\"/>\n$\\Rightarrow \\quad V=144 \\pi h-\\frac{\\pi}{4} h^3 \\Rightarrow \\frac{d V}{d h}=144 \\pi-\\frac{3 \\pi}{4} h^2$\n$\\Rightarrow \\frac{d V}{d h}=0 \\Rightarrow 144 \\pi=\\frac{3 \\pi}{4} h^2$\n$\\Rightarrow \\quad h^2=48 \\times 4 \\Rightarrow h=8 \\sqrt{3}$\n$\\therefore \\quad 12^2=r^2+48 \\Rightarrow r^2=96$\nVolume $=\\pi r^2 h=\\pi \\times 96 \\times 8 \\sqrt{3}=768 \\sqrt{3} \\pi \\mathrm{~cm}^3$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d02c49e8ef28ee2b38c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "The population $p(t)$ at time $t$ of a certain mouse species satisfies the differential equation $\\frac{d p(t)}{d t}=0.5 \\mathrm{p}(\\mathrm{t})-450$. If $p(0)=850$, then the time at which the population becomes zero is :", "image": null}, "options": [{"id": "bWa1b", "text": "$2 \\ln 18$", "image": null, "isCorrect": true}, {"id": "S9WlF", "text": "$\\ln 9$", "image": null, "isCorrect": false}, {"id": "hcmLp", "text": "$\\frac{1}{2} \\ln 18$", "image": null, "isCorrect": false}, {"id": "OvVoU", "text": "$\\ln 18$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given differential equation is\n$\\frac{d p(t)}{d t}=0.5 p(t)-450$\n$\\Rightarrow \\frac{d p(t)}{d t}=\\frac{1}{2} p(t)-450$\n$\\Rightarrow \\quad \\frac{d p(t)}{d t}=\\frac{p(t)-900}{2}$\n$\\Rightarrow \\quad 2 \\frac{d p(t)}{d t}=-[900-p(t)]$\n$\\Rightarrow \\quad 2 \\frac{d p(t)}{900-p(t)}=-d t$\nIntegrate both the side, we get :\n$-2 \\int \\frac{d p(t)}{900-p(t)}=\\int d t$\nLet $900-p(t)=u \\Rightarrow-d p(t)=d u$\n$\\therefore \\quad$ We have; $2 \\int \\frac{d u}{u}=\\int d t \\Rightarrow 2 \\ln u=t+c$\n$\\Rightarrow \\quad 2 \\ln [900-p(t)]=t+c$ when $t=0, p(0)=850$\n$2 \\ln (50)=c \\quad \\Rightarrow 2\\left[\\ln \\left(\\frac{900-p(t)}{50}\\right)\\right]=t$\n$\\Rightarrow \\quad 900-p(t)=50 e^{\\frac{t}{2}}$\n$\\Rightarrow \\quad p(t)=900-50 e^{\\frac{t}{2}}$\nlet $p\\left(t_1\\right)=0$\n$0=900-50 e^{\\frac{t_1}{2}} \\quad \\therefore t_1=2 \\ln 18$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d01c49e8ef28ee2b383", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "The altitude of a cone is 20 cm and its semivertical angle is $30^{\\circ}$. If the semi-vertical angle is increasing at the rate of $2^{\\circ}$ per second, then the radius of the base is increasing at the rate of", "image": null}, "options": [{"id": "1v85c", "text": "$30 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "WXBNt", "text": "$\\frac{160}{3} \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "8f0Bn", "text": "$10 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "Md1oC", "text": "$160 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\theta$ be the semi-vertical angle and $r$ be the radius of the cone at time $t$.\nthe radius of the cone at time $t$.\nThen, $r=20 \\tan \\theta$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/NE02Q4z9X8qvOISoepQbHctTBA4BIo362VuUkZhwL7s.original.fullsize.png\"/>\n$\\Rightarrow \\quad \\frac{d r}{d t}=20 \\sec ^2 \\theta \\frac{d \\theta}{d t}$\n$\\Rightarrow \\quad \\frac{d r}{d t}=20 \\sec ^2 30^{\\circ} \\times 2$\n$\\left[\\because \\theta=30^{\\circ}\\right.$ and $\\left.\\frac{d \\theta}{d t}=2\\right]$\n$\\Rightarrow \\quad \\frac{d r}{d t}=20 \\times \\frac{4}{3} \\times 2 \\mathrm{~cm} / \\mathrm{s}=\\frac{160}{3} \\mathrm{~cm} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8286f5bfc7ab78aeb1b", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the radius of a sphere is measured as $9 \\mathrm{~cm}$ with an error of $0.03 \\mathrm{~cm}$, then find the approximating error in calculating its volume.", "image": null}, "options": [{"id": "QIsfY", "text": "$2.46 \\pi \\mathrm{cm}^{3}$", "isCorrect": false, "image": null}, {"id": "QqbJl", "text": "$8.62 \\pi \\mathrm{cm}^{3}$", "isCorrect": false, "image": null}, {"id": "l0OdA", "text": "$9.72 \\pi \\mathrm{cm}^{3}$", "isCorrect": true, "image": null}, {"id": "mvsO2", "text": "$7.6 \\pi \\mathrm{cm}^{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of the sphere and $\\Delta r$ be the error in measuring the radius. Then, $r=9 \\mathrm{~cm}$ and $\\Delta r=0.03 \\mathrm{~cm}$\r\n\r\nLet $V$ be the volume of the sphere. Then,\r\n\r\n$\\begin{array}{l}\r\n\r\n\\mathrm{V}=\\frac{4}{3} \\pi r^{3} \\\\\r\n\r\n\\Rightarrow \\frac{\\mathrm{dV}}{\\mathrm{dr}}=4 \\pi r^{2} \\\\\r\n\r\n\\Rightarrow\\left(\\frac{\\mathrm{dV}}{\\mathrm{dr}}\\right)_{r=9}=4 \\pi \\times 9^{2}=324 \\pi\r\n\r\n\\end{array}$\r\n\r\nLet $\\Delta \\mathrm{V}$ be the error in $\\mathrm{V}$ due to error $\\Delta \\mathrm{r}$ in $r$.\r\n\r\nThen,\r\n\r\n$\\begin{array}{l}\r\n\r\n\\Delta \\mathrm{V}=\\frac{\\mathrm{dV}}{\\mathrm{dr}} \\Delta r \\\\\r\n\r\n\\Rightarrow \\Delta \\mathrm{V}=324 \\pi \\times 0.03=9.72 \\pi \\mathrm{cm}^{3}\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78a6f5bfc7ab78ae5c1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "Let \\(\\mathrm{f}(\\mathrm{x})=\\) \\(\\left\\{\\begin{array}{l}a x^2+1, x > 1 \\\\ x+a, x \\leq 1\\end{array}\\right.\\). Then \\(f(x)\\) is derivable at \\(x=1\\), if", "image": null}, "options": [{"id": "WMogt", "text": "\\(a=2\\)", "image": null, "isCorrect": false}, {"id": "cFRdG", "text": "\\(a=1\\)", "image": null, "isCorrect": false}, {"id": "WvAAG", "text": "\\(a=0\\)", "image": null, "isCorrect": false}, {"id": "LSwCz", "text": "\\(a=1 / 2\\)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\operatorname{Lf}^{\\prime}(1)=\\lim _{h \\rightarrow 0} \\frac{f(1-h)-f(1)}{-h} \\\\\n& =\\lim _{h \\rightarrow 0} \\frac{(1-h+a)-(1+a)}{-h}=\\lim _{h \\rightarrow 0} \\frac{-h}{-h}=1 \\\\\n& \\operatorname{Rf}^{\\prime}(1)=\\lim _{h \\rightarrow 0} \\frac{f(1+h)-f(1)}{h} \\\\\n& =\\lim _{h \\rightarrow 0} \\frac{\\left[a(1+h)^2+1\\right]-(1+a)}{h} \\\\\n& =\\lim _{h \\rightarrow 0}(a h+2 a)=2 a\n\\end{aligned}\\)\nSince f' (1) exists, \\(\\therefore L f^{\\prime}(1)=R f^{\\prime}(1) \\Rightarrow a=1 / 2\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77c6f5bfc7ab78ae542", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "If \\(M(\\alpha)=\\left[\\begin{array}{ccc}\\cos \\alpha & -\\sin \\alpha & 0 \\\\ \\sin \\alpha & \\cos \\alpha & 0 \\\\ 0 & 0 & 1\\end{array}\\right]\\); \\(M(\\beta)=\\left[\\begin{array}{ccc}\\cos \\beta & 0 & \\sin \\beta \\\\ 0 & 1 & 0 \\\\ -\\sin \\beta & 0 & \\cos \\beta\\end{array}\\right]\\) then \\([M(\\alpha) M(\\beta)]^{-1}\\) is equal to -", "image": null}, "options": [{"id": "QanXI", "text": "\\(\\mathrm{M}(\\beta) \\mathrm{M}(\\alpha)\\)", "image": null, "isCorrect": false}, {"id": "xWP6b", "text": "\\(\\mathrm{M}(-\\alpha) \\mathrm{M}(-\\beta)\\)", "image": null, "isCorrect": false}, {"id": "lQbyl", "text": "\\(\\mathrm{M}(-\\beta) \\mathrm{M}(-\\alpha)\\)", "image": null, "isCorrect": true}, {"id": "nIXX2", "text": "\\(-\\mathrm{M}(\\beta) \\mathrm{M}(\\alpha)\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\left.[\\mathrm{M}(\\alpha) \\mathrm{M}(\\beta)]^{-1}=\\mathrm{M}(\\beta)^{-1} \\mathrm{M}(\\alpha)^{-1}\\right] \\\\\n& \\operatorname{Now~M(\\alpha )^{-1}}=\\left[\\begin{array}{ccc}\n\\cos \\alpha & \\sin \\alpha & 0 \\\\\n-\\sin \\alpha & \\cos \\alpha & 0 \\\\\n0 & 0 & 1\n\\end{array}\\right] \\\\\n& =\\left[\\begin{array}{ccc}\n\\cos (-\\alpha) & -\\sin (-\\alpha) & 0 \\\\\n\\sin (-\\alpha) & \\cos (-\\alpha) & 0 \\\\\n0 & 0 & 1\n\\end{array}\\right]=\\mathrm{M}(-\\alpha) \\\\\n& M(\\beta)^{-1}=\\left[\\begin{array}{ccc}\n\\cos \\beta & 0 & -\\sin \\beta \\\\\n0 & 1 & 0 \\\\\n\\sin \\beta & 0 & \\cos \\beta\n\\end{array}\\right] \\\\\n& =\\left[\\begin{array}{ccc}\n\\cos (-\\beta) & 0 & \\sin (-\\beta) \\\\\n0 & 1 & 0 \\\\\n-\\sin (-\\beta) & 0 & \\cos (-\\beta)\n\\end{array}\\right]=\\mathrm{M}(-\\beta) \\\\\n& {[\\mathrm{M}(\\alpha) \\mathrm{M}(\\beta)]^{-1}=\\mathrm{M}(-\\beta) \\mathrm{M}(-\\alpha)} \\\\\n&\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e86d6f5bfc7ab78aee0a", "title": "Monotonicity", "totalQuestions": 17, "questions": [{"_id": "67726d1ac49e8ef28ee2b443", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "Consider the function $f(x)=\\frac{|x-1|}{x^2}$, then $f(x)$ is", "image": null}, "options": [{"id": "Jwkqi", "text": "increasing in $(0,1) \\cup(2, \\infty)$", "image": null, "isCorrect": false}, {"id": "tgy34", "text": "increasing in $(-\\infty, 0) \\cup(0,1)$", "image": null, "isCorrect": false}, {"id": "RO6Vd", "text": "decreasing in $(-\\infty, 0) \\cup(2, \\infty)$", "image": null, "isCorrect": false}, {"id": "2SUnf", "text": "decreasing in $(0,1) \\cup(2, \\infty)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, $f(x)=\\left\\{\\begin{aligned} \\frac{x-1}{x^2} ; & x \\geq 1 \\\\ \\frac{-x+1}{x^2} ; & x \\lt 1\\end{aligned}\\right.$\n$\\begin{aligned}\n& f(x)= \\begin{cases}\\frac{1}{x}-\\frac{1}{x^2} ; & x \\geq 1 \\\\\n-\\frac{1}{x}+\\frac{1}{x^2} ; & x \\lt 1\\end{cases} \\\\\n& f^{\\prime}(x)= \\begin{cases}\\frac{-1}{x^2}+\\frac{2}{x^3} ; & x \\geq 1 \\\\\n\\frac{1}{x^2}-\\frac{2}{x^3} ; & x \\lt 1\\end{cases} \\\\\n& f^{\\prime}(x)= \\begin{cases}\\frac{2-x}{x^3} ; & x \\geq 1 \\\\\n\\frac{x-2}{x^3} ; & x \\lt 1\\end{cases}\n\\end{aligned}$\nBy observation, $f^{\\prime}(x)$ will be<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/mZpWNRtakll5g4R_qPQjO8-Xlgu9YWyJyuF1K2KsqOc.original.fullsize.png\"/>\nDecreasing in $(0,1) \\cup(2, \\infty)$\nand increasing in $(-\\infty, 0) \\cup(1,2)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d02c49e8ef28ee2b387", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "The point of inflexion for the curve $y=(x-a)^n$, where n is odd integer and $n \\geq 3$ is", "image": null}, "options": [{"id": "sdIjQ", "text": "$(a, 0)$", "image": null, "isCorrect": true}, {"id": "tpndW", "text": "$(0, a)$", "image": null, "isCorrect": false}, {"id": "fqsYG", "text": "$(0,0)$", "image": null, "isCorrect": false}, {"id": "qehYt", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here $\\frac{d^2 y}{d x^2}=n(n-1)(x-a)^{n-2}$\nNow, $\\frac{d^2 y}{d x^2}=0 \\Rightarrow x=a$\nDifferentiating equation of the curve $n$ times,\nwe get, $\\frac{d^n y}{d x^n}=n$ !\n$\\therefore \\quad$ at $x=a, \\frac{d^n y}{d x^n} \\neq 0$ and $\\frac{d^{n-1} y}{d x^{n-1}}=0$,\nwhere $n$ is odd.\nTherefore $(a, 0)$ is the point of inflexion", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b88297ae24e9e2db8d16", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "If $f(x)=\\cos x, g(x)=\\cos 2 x, h(x)=\\cos 3 x$ and $I(x)$ $=\\tan x$, then which of the following option is correct?", "image": null}, "options": [{"id": "4ud8g", "text": "$f(x)$ and $g(x)$ are strictly decreasing in $(0, \\pi /$ 2)", "image": null, "isCorrect": false}, {"id": "Mu4ew", "text": "$h(x)$ is neither increasing nor decreasing in $(0, \\pi / 2)$", "image": null, "isCorrect": false}, {"id": "7Mhtk", "text": "$\\mathrm{I}(\\mathrm{x})$ is strictly increasing in $(0, \\pi / 2)$", "image": null, "isCorrect": false}, {"id": "t081W", "text": "<br />All are correct", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(a) Let $f(x)=\\cos x$, then $f^{\\prime}(x)=-\\sin x$.<br />In interval $\\left(0, \\frac{\\pi}{2}\\right), f^{\\prime}(x) < 0$<br />Therefore, $f(x)$ is strictly decreasing on $\\left(0, \\frac{\\pi}{2}\\right)$<br />(b) Let $f(x)=\\cos 2 x \\Rightarrow f^{\\prime}(x)=-2 \\sin x 2 x$<br />In interval $\\left(0, \\frac{\\pi}{2}\\right), f^{\\prime}(x) < 0$<br />Because $\\sin 2 x$ will either lie in the first or second quadrant which will give a positive value.<br />Therefore, $f(x)$ is strictly decreasing on $\\left(0, \\frac{\\pi}{2}\\right)$<br />(c) Let $f^{\\prime}(x)=\\cos 3 x$<br />$\\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=-3 \\sin 3 \\mathrm{x}$. In Interval $\\left(0, \\frac{\\pi}{3}\\right), \\mathrm{f}^{\\prime}(\\mathrm{x}) < 0$<br />Because $\\sin 3 \\mathrm{x}$ will either lie in the first or second quadrant which will give a positive value.<br />Therefore, $\\mathrm{f}(\\mathrm{x})$ irstrictly decreasing on $\\left(0, \\frac{\\pi}{3}\\right)$.<br />When $\\mathrm{x} \\in\\left(\\frac{\\pi}{3}, \\frac{\\pi}{2}\\right)$, then $\\mathrm{f}^{\\prime}(\\mathrm{x})>0$<br />Because $\\sin 3 x$ will lie in the third quadrant. Therefore, $f(x)$ is not strictly decreasing on<br />$\\left(0, \\frac{\\pi}{2}\\right)$<br />(d) Let $f(x)=\\tan x \\Rightarrow f^{\\prime}(x)=\\sec ^2 x$.<br />In Interval $\\mathrm{x} \\in\\left(0, \\frac{\\pi}{2}\\right), \\mathrm{f}^{\\prime}(\\mathrm{x})>0$<br />Therefore, $f(x)$ is not strictly decreasing on<br />$\\left(0, \\frac{\\pi}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b88097ae24e9e2db8d00", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "The function $f(x)=\\log (1+x)-\\frac{2 x}{2+x}$ is increasing on", "image": null}, "options": [{"id": "n66HC", "text": "$(0, \\infty)$", "image": null, "isCorrect": true}, {"id": "gPSs2", "text": "$(-\\infty, 0)$", "image": null, "isCorrect": false}, {"id": "9i6Pg", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": false}, {"id": "rzbRC", "text": "<br />None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x)=\\log (1+x)-\\frac{2 x}{2+x}$<br />$\\begin{aligned}<br />& f^{\\prime}(x)=\\frac{1}{1+x}-\\frac{(2+x)(2)-2 x}{(2+x)^2} \\\\<br />& =\\frac{1}{1+x}-\\frac{4}{(2+x)^2} \\\\<br />& =\\frac{(2+x)^2-4-4 x}{(1+x)(2+x)^2}=\\frac{x^2}{(1+x)(2+x)^2}>0 \\text { for all } \\\\<br />& x \\in(0, \\infty)<br />\\end{aligned}$<br />Thus, given function $\\mathrm{f}(\\mathrm{x})$ is increasing on $(0$, $\\infty)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87997ae24e9e2db8caf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "The function $f(x)=\\tan ^{-1}(\\sin x+\\cos x)$ is an increasing function in", "image": null}, "options": [{"id": "hsuZj", "text": "$\\left(\\frac{\\pi}{4}, \\frac{\\pi}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "NiXHg", "text": "$\\left(-\\frac{\\pi}{2}, \\frac{\\pi}{4}\\right)$", "image": null, "isCorrect": true}, {"id": "7rXGP", "text": "$\\left(0, \\frac{\\pi}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "iYXMK", "text": "$\\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, $f(x)=\\tan ^{-1}(\\sin x+\\cos x)$<br />$\\therefore \\mathrm{f}^{\\prime}(\\mathrm{x})=\\frac{1}{1+(\\sin \\mathrm{x}+\\cos \\mathrm{x})^2}(\\cos \\mathrm{x}-\\sin \\mathrm{x})$<br />$=\\frac{\\sqrt{2} \\cos \\left(x+\\frac{\\pi}{4}\\right)}{1+(\\sin x+\\cos x)^2}$<br />$f(x)$ is increasing if $f^{\\prime}(x)>0 \\Rightarrow \\cos \\left(x+\\frac{\\pi}{4}\\right)>0$<br />$\\Rightarrow \\quad-\\frac{\\pi}{2} < x+\\frac{\\pi}{4} < \\frac{\\pi}{2} \\Rightarrow-\\frac{3 \\pi}{2} < x+\\frac{\\pi}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87797ae24e9e2db8ca0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "The interval in which the function $f(x)=$ $\\frac{4 x^2+1}{x}$ is decreasing is :", "image": null}, "options": [{"id": "yfByP", "text": "$\\left(-\\frac{1}{2}, \\frac{1}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "yhjNH", "text": "$\\left[-\\frac{1}{2}, \\frac{1}{2}\\right]$", "image": null, "isCorrect": false}, {"id": "0iC8n", "text": "$(-1,1)$", "image": null, "isCorrect": false}, {"id": "Olw9T", "text": "$[-1,1]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x)=\\frac{4 x^2+1}{x}$ Thus $f^{\\prime}(x)=4-\\frac{1}{x^2}$<br />$\\mathrm{f}(\\mathrm{x})$ will be decreasing if $\\mathrm{f}^{\\prime}(\\mathrm{x}) < 0$<br />Thus $4-\\frac{1}{x^2} < 0 \\Rightarrow \\frac{1}{x^2}>4 \\Rightarrow \\frac{-1}{2} < x < \\frac{1}{2}$<br />Thus interval in which $f(x)$ is decreasing, is $\\left(-\\frac{1}{2}, \\frac{1}{2}\\right)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8296f5bfc7ab78aeb20", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "$f(x)=\\left(\\frac{e^{2 x}-1}{e^{2 x}+1}\\right)$ is", "image": null}, "options": [{"id": "Ivzax", "text": "an increasing function", "isCorrect": true, "image": null}, {"id": "NKMqd", "text": "a decreasing function", "isCorrect": false, "image": null}, {"id": "esMcK", "text": "an even function", "isCorrect": false, "image": null}, {"id": "wdpwC", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{array}{l}\r\n\r\n\\because \\mathrm{f}(x)=\\left(\\frac{e^{2 x}-1}{e^{2 x}+1}\\right) \\\\\r\n\r\n\\therefore \\mathrm{f}(-x)=\\frac{e^{-2 x}-1}{e^{-2 x}+1}=\\frac{1-e^{2 x}}{1+e^{2 x}} \\\\\r\n\r\n\\Rightarrow \\mathrm{f}(-x)=\\frac{-\\left(e^{2 x}-1\\right)}{e^{2 x}+1}=-\\mathrm{f}(x)\r\n\r\n\\end{array}$\r\n\r\n$\\therefore \\mathrm{f}(x)$ is an odd function.\r\n\r\nAgain, $\\mathrm{f}^{\\prime}(x)=\\frac{4 e^{2 x}}{\\left(1+e^{2 x}\\right)^{2}}>0, \\forall x \\in R$ $\\Rightarrow \\mathrm{f}(x)$ is an increasing function.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ff6f5bfc7ab78ae9b1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "For which interval the given function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mo>-</mo><mn>2</mn><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>9</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><mi>x</mi><mo>+</mo><mn>1</mn></math> is decreasing?", "image": null}, "options": [{"id": "PIdwn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mo>&#8734;</mo></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "wB3MA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "gHVU5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mo>&#8734;</mo><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "TyjxM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mo>&#8734;</mo><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mo>&#8734;</mo></mrow></mfenced></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mo>-</mo><mn>2</mn><msup><mi>x</mi><mn>3</mn></msup><mo>-</mo><mn>9</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><mi>x</mi><mo>+</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mo>-</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>18</mn><mi>x</mi><mo>-</mo><mn>12</mn></math></p><p>To be decreasing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>-</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>18</mn><mi>x</mi><mo>-</mo><mn>12</mn><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>+</mo><mn>2</mn><mo>&#62;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mi>x</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>&#62;</mo><mn>0</mn></math></p><p>Therefore, either <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#60;</mo><mo>-</mo><mn>2</mn></math>&nbsp;or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#62;</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8712;</mo><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mo>&#8734;</mo></mrow></mfenced></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mo>&#8734;</mo><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math></p><p>Hence, option (d) correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f16f5bfc7ab78ae930", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "si
