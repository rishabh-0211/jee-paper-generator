-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "The equation of the circle, which touches the line $y=5$ and passes through $(-1,2)$ and $(1,2)$ is", "image": null}, "options": [{"id": "5PWVP", "text": "$9 x^{2}+9 y^{2}-60 y+75=0$", "isCorrect": true, "image": null}, {"id": "Xbkxl", "text": "$9 x^{2}+9 y^{2}-60 x-75=0$", "isCorrect": false, "image": null}, {"id": "q1UCb", "text": "$9 x^{2}+9 y^{2}+60 y-75=0$", "isCorrect": false, "image": null}, {"id": "oMDhL", "text": "$9 x^{2}+9 y^{2}+60 x+75=0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/qSv62DZUInezs9OtYo4L1dI8LmR24DBWnsy_SoSgY6A.original.fullsize.png\"><br>\r\n\r\nThe centre of the circle is on the perpendicular bisector of the line joining $(-1,2)$ and $(1,2)$, which is the $y$-axis. The ordinate of the centre is given by\r\n\r\n$\\begin{array}{l}\r\n\r\n(5-y)^{2}=1+(y-2)^{2} \\\\\r\n\r\n\\Rightarrow y=\\frac{10}{3}\r\n\r\n\\end{array}$\r\n\r\nHence, eq. of the circle is:\r\n\r\n$\\begin{array}{l}\r\n\r\nx^{2}+\\left(y-\\frac{10}{3}\\right)^{2}=\\left(\\frac{5}{3}\\right)^{2} \\\\\r\n\r\n\\Rightarrow 9 x^{2}+9 y^{2}-60 y+75=0\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8196f5bfc7ab78aea98", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the coordinates at one end of a diameter of the circle $x^{2}+y^{2}-8 x-4 y+c=0$ are (-3,2) , then the coordinates at the other end are", "image": null}, "options": [{"id": "9RP8j", "text": "(5,3)", "isCorrect": false, "image": null}, {"id": "5D5ba", "text": "(6,2)", "isCorrect": false, "image": null}, {"id": "OaDNq", "text": "(1,-8)", "isCorrect": false, "image": null}, {"id": "JLTpq", "text": "(11,2)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The centre of the given circle is $\\mathrm{C} \\equiv(4,2)$\r\n\r\nLet $A \\equiv(-3,2)$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/oPn8SV17oF4gRa73rlmL9sWyWstn65noHV_Lechikcs.original.fullsize.png\"><br>\r\n\r\nIf $(\\alpha, \\beta)$ are the coordinates of the other end of the diameter, then, as the middle ploint of the diameter is the centre,\r\n\r\n$\\therefore \\quad \\frac{\\alpha-3}{2}=4$ and $\\frac{\\beta+2}{2}=2 \\Rightarrow \\alpha=11, \\beta=2$\r\n\r\nThus, the coordinates of the other end of diameter are (11,2)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8186f5bfc7ab78aea8e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "In the given figure, the equation of the larger circle is $x^{2}+y^{2}+4 y-5=0$ and the distance between centres is 4 . Then the equation of smaller circle is\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/XO5x82sLhpvVZjtM7P65tDrKkKEzFvjh-JRXhpSCYKw.original.fullsize.png\">", "image": null}, "options": [{"id": "LKReT", "text": "$(x-\\sqrt{7})^{2}+(y-1)^{2}=1$", "isCorrect": true, "image": null}, {"id": "rwUpg", "text": "$\\quad(x+\\sqrt{7})^{2}+(y-1)^{2}=1$", "isCorrect": false, "image": null}, {"id": "bLzz7", "text": "$x^{2}+y^{2}=2 \\sqrt{7} x+2 y$", "isCorrect": false, "image": null}, {"id": "yMpVu", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have $x^{2}+y^{2}+4 y-5=0$. Its centre is $\\mathrm{C}_{1}(0,-2)$\r\n\r\n$\\mathrm{r}_{1}=\\sqrt{4+5}=3$. Let $\\mathrm{C}_{2}(\\mathrm{~h}, \\mathrm{k})$ be the centre of the\r\n\r\nsmaller circle and its radius $\\mathrm{r}_{2}$. Then $\\mathrm{C}_{1} \\mathrm{C}_{2}=4$ $\\Rightarrow \\sqrt{\\mathrm{h}^{2}+(\\mathrm{k}+2)^{2}}=3+\\mathrm{r}_{2}=4$\r\n\r\n$\\Rightarrow \\mathrm{r}_{2}=1$\r\n\r\nBut $\\mathrm{k}=\\mathrm{r}_{2}=1 \\quad$ [it touches $\\mathrm{x}$ -axis\r\n\r\n$\\therefore$ From eq $(1), 4=\\sqrt{\\mathrm{h}^{2}+(1+2)^{2}}$\r\n\r\n$\\Rightarrow 16=\\mathrm{h}^{2}+9 \\Rightarrow \\mathrm{h}^{2}=7 \\Rightarrow \\mathrm{h}=\\pm \\sqrt{7}$\r\n\r\nSince $\\mathrm{h}>0 \\quad \\therefore \\mathrm{h}=\\sqrt{7}$\r\n\r\nHence, required circle is $(x-\\sqrt{7})^{2}+(y-1)^{2}=1$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fd6f5bfc7ab78ae9a1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 3, "question": {"text": "The area of the triangle formed by joining the origin to the point of intersection of the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>3</mn><msqrt><mn>5</mn></msqrt></math> and circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>10</mn></math>&nbsp;is", "image": null}, "options": [{"id": "AWQp9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "isCorrect": false, "image": null}, {"id": "T19zz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "isCorrect": false, "image": null}, {"id": "teP44", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "isCorrect": true, "image": null}, {"id": "VnjNO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Length of perpendicular from origin to the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>3</mn><msqrt><mn>5</mn></msqrt></math> is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>L</mi><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>5</mn></msqrt></mrow><msqrt><msup><mfenced><msqrt><mn>5</mn></msqrt></mfenced><mn>2</mn></msup><mo>+</mo><msup><mn>2</mn><mn>2</mn></msup></msqrt></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>5</mn></msqrt></mrow><msqrt><mn>9</mn></msqrt></mfrac><mo>=</mo><msqrt><mn>5</mn></msqrt></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/6fa9b97b-9eb2-4746-8765-3fb218060d92-d46.png\" style=\"width: 294px; height: 230px;\" /></p><p>Radius of the given circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mn>10</mn></msqrt><mo>=</mo><mi>O</mi><mi>Q</mi><mo>=</mo><mi>O</mi><mi>P</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><mn>2</mn><mi>Q</mi><mi>L</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><msqrt><mi>O</mi><msup><mi>Q</mi><mn>2</mn></msup><mo>-</mo><mi>O</mi><msup><mi>L</mi><mn>2</mn></msup></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><msqrt><mn>10</mn><mo>-</mo><mn>5</mn></msqrt><mo>=</mo><mn>2</mn><msqrt><mn>5</mn></msqrt></math></p><p>Thus, area of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>O</mi><mi>P</mi><mi>Q</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mi>P</mi><mi>Q</mi><mo>&#215;</mo><mi>O</mi><mi>L</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><msqrt><mn>5</mn></msqrt><mo>&#215;</mo><msqrt><mn>5</mn></msqrt><mo>=</mo><mn>5</mn></math>&nbsp;sq units</p><p>Hence, option (c) is correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e36f5bfc7ab78ae8b9", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The number of integral values of $\\lambda$ for which $\\mathrm{x}^{2}+\\mathrm{y}^{2}+\\lambda \\mathrm{x}+(1-\\lambda) \\mathrm{y}+5=0$ is the equation of a ircle whose radius cannot exceed $5,$ is", "image": null}, "options": [{"id": "8fD39", "text": "14", "isCorrect": false, "image": null}, {"id": "7Pzaa", "text": "18", "isCorrect": false, "image": null}, {"id": "jCGL7", "text": "16", "isCorrect": true, "image": null}, {"id": "ZwMA6", "text": "None", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Radius $\\leq 5$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\sqrt{\\frac{\\lambda^{2}}{4}+\\frac{(1-\\lambda)^{2}}{4}-5} \\leq 5 \\Rightarrow \\lambda^{2}+(1-\\lambda)^{2}-20 \\leq 100 \\\\\r\n\r\n\\Rightarrow 2 \\lambda^{2}-2 \\lambda-119 \\leq 0 \\\\\r\n\r\n\\therefore \\frac{1-\\sqrt{239}}{2} \\leq \\lambda \\leq \\frac{1+\\sqrt{239}}{2} \\Rightarrow-7.2 \\leq \\lambda \\leq 8.2 \\\\\r\n\r\n\\quad(\\text { approx. }) \\\\\r\n\r\n\\therefore \\lambda=-7,-6,-5, \\ldots \\ldots .7,8, \\text { in all } 16\r\n\r\n\\end{array}\r\n\r\n$$ values", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d56f5bfc7ab78ae840", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "Area of the circle in which a chord of length $\\sqrt{2}$ makes an angle $\\pi / 2$ at the centre, is", "image": null}, "options": [{"id": "s9aBk", "text": "$\\pi / 2$ sq units", "isCorrect": false, "image": null}, {"id": "jfMal", "text": "$2 \\pi$ sq units", "isCorrect": false, "image": null}, {"id": "EKk45", "text": "$\\pi$ sq units", "isCorrect": true, "image": null}, {"id": "Jw3jm", "text": "$\\pi / 4 \\mathrm{sq}$ units", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\mathrm{AB}$ be the chord of length $\\sqrt{2}$. Let $\\mathrm{O}$ be the centre of the circle and let $O C$ be the perpendicular from $\\mathrm{O}$ on $\\mathrm{AB}$.\r\n\r\nThen $, \\mathrm{AC}=\\mathrm{BC}=\\frac{\\sqrt{2}}{2}=\\frac{1}{\\sqrt{2}}$\r\n\r\nIn $\\Delta \\mathrm{OBC},$ we have\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n\\mathrm{OB} &=\\mathrm{BC} \\operatorname{cosec} 45^{\\circ} \\\\\r\n\r\n&=\\frac{1}{\\sqrt{2}} \\times \\sqrt{2}=1\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\n$\\therefore$ Area of the circle $=\\pi(\\mathrm{OB})^{2}=\\pi$ sq units\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/rkS101Yo4ZfgZ7sOrAb33YtaA4es0JxVX1sCGTXbd48.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65b7b89d97ae24e9e2db8d37", "title": "General Equation of 2nd degree curve", "totalQuestions": 1, "questions": [{"_id": "65b7b88297ae24e9e2db8d15", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "The equation of the circle with centre $(0,2)$ and radius 2 is $x^2+y^2-m y=0$. The value of $m$ is", "image": null}, "options": [{"id": "zSGKW", "text": "<br />1", "image": null, "isCorrect": false}, {"id": "WLztJ", "text": "<br />2", "image": null, "isCorrect": false}, {"id": "fpUAC", "text": "<br />4", "image": null, "isCorrect": true}, {"id": "8vS4C", "text": "<br />3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here $h=0, k=2$ and $r=2$. Therefore, the required equation of the circle is :<br />$(x-0)^2+(y-2)^2=(2)^2$<br />or $x^2+y^2-4 y+4=4$ or $x^2+y^2-4 y=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8716f5bfc7ab78aee39", "title": "line and circle", "totalQuestions": 1, "questions": [{"_id": "64c0e8186f5bfc7ab78aea8d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "If a chord of the circle $x^{2}+y^{2}=8$ makes equal intercets of length a on the coordinate axes, then", "image": null}, "options": [{"id": "qV3qP", "text": "$|\\mathrm{a}|<8$", "isCorrect": false, "image": null}, {"id": "lW4e0", "text": "$|\\mathrm{a}|<4 \\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "LmFY7", "text": "$|\\mathrm{a}|<4$", "isCorrect": true, "image": null}, {"id": "ayVTk", "text": "$|\\mathrm{a}|>4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since the chord makes equal intercepts of length a on the coordinate axes. So, its equation can be written as $\\mathrm{x} \\pm \\mathrm{y}=\\pm \\mathrm{a}$. This line meets the given circle at two distinct points. So, length of the perpendicular from the centre (0,0) of the given circle must be less than the radius.\r\n\r\ni.e. $\\left|\\pm \\frac{\\mathrm{a}}{\\sqrt{2}}\\right|<\\sqrt{8} \\Rightarrow \\mathrm{a}^{2}<16 \\Rightarrow|\\mathrm{a}|<4$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8706f5bfc7ab78aee32", "title": "Tangent to circle", "totalQuestions": 4, "questions": [{"_id": "64c0e7e36f5bfc7ab78ae8ba", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The lengths of the tangent drawn from any point\r\n\r\non the circle $15 x^{2}+15 y^{2}-48 x+64 y=0$ to the two circles $5 x^{2}+5 y^{2}-24 x+32 y+75=0$ and $5 x^{2}+5 y^{2}-48 x$ $+64 y+300=0$ are in the ratio of", "image": null}, "options": [{"id": "Gb1hR", "text": "1: 2", "isCorrect": true, "image": null}, {"id": "vZEam", "text": "2: 3", "isCorrect": false, "image": null}, {"id": "iiZpo", "text": "3: 4", "isCorrect": false, "image": null}, {"id": "MJlSB", "text": "None", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let \\(\\mathrm{P}(\\mathrm{h}, \\mathrm{k})\\) be a point on the circle\r\n\r\n\\(15 x^{2}+15 y^{2}-48 x+64 y=0\\)\r\n\r\nThen the lengths of the tangents from \\(\\mathrm{P}(\\mathrm{h}, \\mathrm{k})\\) to\r\n\r\n\\(\\begin{aligned} &5 x^{2}+5 y^{2}-24 x+32 y+75=0 \\\\ &5 x^{2}+5 y^{2}-48 x+64 y+300=0 \\text { are } \\\\ &P T_{1}=\\sqrt{h^{2}+k^{2}-\\frac{24}{5} h+\\frac{32}{5} k+15} \\\\ &\\text { and } P T_{2}=\\sqrt{h^{2}+k^{2}-\\frac{48}{5} h+\\frac{64}{5} k+60} \\\\ &\\text { or } P T_{1}=\\sqrt{\\frac{48}{15} h-\\frac{64}{15} k-\\frac{24}{5} h+\\frac{32}{5} k+15}=\\sqrt{\\frac{32}{15} k-\\frac{24}{15} h+15} \\end{aligned}\\)\r\n\r\n(Since \\((\\mathrm{h}, \\mathrm{k})\\) lies on \\(15 \\mathrm{x}^{2}-15 \\mathrm{y}^{2}-48 \\mathrm{x}+64 \\mathrm{y}=0\\)\r\n\r\n\\(\\begin{aligned} &\\left.\\therefore \\mathrm{h}^{2}+\\mathrm{k}^{2}-\\frac{48}{15} \\mathrm{~h}+\\frac{64}{15} \\mathrm{k}=0\\right) \\\\ &\\text { and } \\mathrm{PT}_{2}=\\sqrt{\\frac{48}{15} \\mathrm{~h}-\\frac{64}{5} \\mathrm{k}-\\frac{48}{5} \\mathrm{~h}+\\frac{64}{5} \\mathrm{k}+60} \\\\ &=\\sqrt{-\\frac{96}{15} \\mathrm{~h}+\\frac{128}{15} \\mathrm{k}+60}=2 \\sqrt{-\\frac{24}{15} \\mathrm{~h}+\\frac{32}{15} \\mathrm{k}+15}=2 \\mathrm{PT}_{1} \\\\ &\\Rightarrow \\mathrm{PT}_{1}: \\mathrm{PT}_{2}=1: 2 \\end{aligned}\\)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a66f5bfc7ab78ae6af", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "The length of the tangent drawn from any point on the circle $x^{2}+y^{2}+2 f y+\\lambda=0$ to the circle $\\mathrm{x}^{2}+\\mathrm{y}^{2}+2 \\mathrm{fy}+\\mu=0,$ where $\\mu>\\lambda>0,$ is", "image": null}, "options": [{"id": "XY0BX", "text": "$\\sqrt{\\mu-\\lambda}$", "isCorrect": true, "image": null}, {"id": "7t9k9", "text": "$\\sqrt{\\mu+\\lambda}$", "isCorrect": false, "image": null}, {"id": "mYEH3", "text": "$\\sqrt{\\mu^{2}-\\lambda^{2}}$", "isCorrect": false, "image": null}, {"id": "3CIwX", "text": "$\\mu+\\lambda$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the first circle be $\\mathrm{CT}=\\mathrm{r}_{1}$. Also, let the radius of the second circle be $\\mathrm{CP}=\\mathrm{r}_{2}$\r\nIn the triangle $\\mathrm{PCT}, \\mathrm{T}$ is a right angle\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Vx6mkKDSQTkMXkiFF9Z4ygG5UGK_UM5zCD04GOUxX60.original.fullsize.png\"><br>\r\n$\\begin{aligned} \\text { So, } P T &=\\sqrt{P C^{2}-C T^{2}}=\\sqrt{r_{1}^{2}-r_{2}^{2}} \\\\ &=\\sqrt{\\left(f^{2}-\\lambda\\right)-\\left(f^{2}-\\mu\\right)}=\\sqrt{\\mu-\\lambda} \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7986f5bfc7ab78ae639", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "If the lines \\(3 x-4 y+4=0\\) and \\(6 x-8 y-7=0\\) are tangents to a circle, then the radius of the circle is", "image": null}, "options": [{"id": "IZ2Aq", "text": "\\(3 / 2\\)", "image": null, "isCorrect": false}, {"id": "xqnq6", "text": "\\(3 / 4\\)", "image": null, "isCorrect": true}, {"id": "5zChJ", "text": "\\(1 / 10\\)", "image": null, "isCorrect": false}, {"id": "mnTAa", "text": "\\(1 / 20\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The diameter of the circle is perpendicular distance between the parallel lines (tangents) \\(3 x-4 y+4=0\\) and \\(3 x-4 y-\\frac{7}{2}=0\\) and so it is equal to\n\\(\\frac{4}{\\sqrt{9+16}}+\\frac{7 / 2}{\\sqrt{9+16}}=\\frac{3}{2}\\). Hence radius is \\(\\frac{3}{4}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77f6f5bfc7ab78ae557", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "If \\(|r| > \\) land \\(x=a+\\frac{a}{r}+\\frac{a}{r^2}+\\ldots\\) to \\(\\infty\\),\n\\(\\mathrm{y}=\\mathrm{b}-\\frac{\\mathrm{b}}{\\mathrm{r}}+\\frac{\\mathrm{b}}{\\mathrm{r}^2}-\\ldots . \\text { to } \\infty\\)\nand \\(z=c+\\frac{c}{r^2}+\\frac{c}{r^4}+\\ldots\\) to \\(\\infty\\), then \\(\\frac{x y}{z}=\\)", "image": null}, "options": [{"id": "et8AC", "text": "\\(\\frac{\\mathrm{ab}}{\\mathrm{c}}\\)", "image": null, "isCorrect": true}, {"id": "rvtRZ", "text": "\\(\\frac{\\mathrm{ac}}{\\mathrm{b}}\\)", "image": null, "isCorrect": false}, {"id": "Bufmy", "text": "\\(\\frac{\\mathrm{bc}}{\\mathrm{a}}\\)", "image": null, "isCorrect": false}, {"id": "aqIXa", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since \\(|\\mathrm{r}| > 1, \\frac{1}{|\\mathrm{r}|}  < 1\\)\n\\(\\therefore \\mathrm{x}=\\frac{\\mathrm{a}}{1-\\frac{1}{\\mathrm{r}}}=\\frac{\\mathrm{ar}}{\\mathrm{r}-1}\\)\nSimilarly, \\(y=\\frac{b}{1-\\left(-\\frac{1}{r}\\right)}=\\frac{b r}{r+1}\\) and\n\\(\\begin{gathered}\nz=\\frac{c}{1-\\frac{1}{r^2}}=\\frac{cr^2}{r^2-1} \\quad ...(1)\\\\\n\\therefore \\quad x y=\\frac{a r}{r-1} \\times \\frac{b r}{r+1}=\\frac{a b r^2}{r^2-1} \\quad ...(2)\n\\end{gathered}\\)\nDividing (2) by (1), we get\n\\(\\frac{\\mathrm{xy}}{\\mathrm{z}}=\\frac{\\mathrm{abr}^2}{\\mathrm{r}^2-1} \\times \\frac{\\mathrm{r}^2-1}{\\mathrm{cr}^2}=\\frac{\\mathrm{ab}}{\\mathrm{c}}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8716f5bfc7ab78aee36", "title": "Pair of Tangents", "totalQuestions": 1, "questions": [{"_id": "64c0e7b56f5bfc7ab78ae72f", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "A pair of tangents are drawn from the origin to the circle $x^{2}+y^{2}+20(x+y)+20=0,$ then the equation of the pair of tangent are", "image": null}, "options": [{"id": "GoHFA", "text": "$x^{2}+y^{2}-5 x y=0$", "isCorrect": false, "image": null}, {"id": "lgze3", "text": "$x^{2}+y^{2}+2 x+y=0$", "isCorrect": false, "image": null}, {"id": "avO9S", "text": "$x^{2}+y^{2}-x y+7=0$", "isCorrect": false, "image": null}, {"id": "D1y8s", "text": "$2 x^{2}+2 y^{2}+5 x y=0$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Equation of pair of tangents is given by $\\mathrm{SS}_{1}=\\mathrm{T}^{2}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\text { or } \\quad \\mathrm{S}=\\mathrm{x}^{2}+\\mathrm{y}^{2}+20(\\mathrm{x}+\\mathrm{y})+20, \\mathrm{~S}_{1}=20 \\\\\r\n\r\n\\mathrm{~T}=10(\\mathrm{x}+\\mathrm{y})+20=0 \\\\\r\n\r\n\\therefore \\quad \\mathrm{SS}_{1}=\\mathrm{T}^{2} \\\\\r\n\r\n\\Rightarrow \\quad 20\\left(\\mathrm{x}^{2}+\\mathrm{y}^{2}+20(\\mathrm{x}+\\mathrm{y})+20\\right)=10^{2} \\\\\r\n\r\n\\quad(\\mathrm{x}+\\mathrm{y}+2)^{2} \\\\\r\n\r\n\\Rightarrow \\quad 4 \\mathrm{x}^{2}+4 \\mathrm{y}^{2}+10 \\mathrm{xy}=0 \\Rightarrow 2 \\mathrm{x}^{2}+2 \\mathrm{y}^{2}+5 \\mathrm{xy}=0\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64c0e8706f5bfc7ab78aee33", "title": "Chord with given Middle Point", "totalQuestions": 3, "questions": [{"_id": "64c0e8356f5bfc7ab78aeb8d", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 3, "question": {"text": "The locus of the mid-point of the chord if contact of tangents drawn from points lying on the straight line $4 x-5 y=20$ to the circle $x^2+y^2=9$ is", "image": null}, "options": [{"id": "OjAZw", "text": "\r\n$20\\left(x^2+y^2\\right)-36 x+45 y=0$\r\n", "isCorrect": true, "image": null}, {"id": "RpHnC", "text": "\r\n$20\\left(x^2+y^2\\right)+36 x-45 y=0$\r\n", "isCorrect": false, "image": null}, {"id": "uS0vI", "text": "\r\n$36\\left(x^2+y^2\\right)-20 x+45 y=0$\r\n", "isCorrect": false, "image": null}, {"id": "l1xBG", "text": "\r\n$36\\left(x^2+y^2\\right)+20 x-45 y=0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $P\\left(t, \\frac{4 t-20}{5}\\right)$ be a point on the line\r\n$4 x-5 y=20$. Then the chord of contact of tangents drawn from $P$ to the circle $x^2+y^2=9$ is\r\n$t x+\\left(\\frac{4 t-20}{5}\\right) y=9\\quad \\quad \\dots(i)$\r\nLet $\\theta(h, k)$ be the mid-point of this chord of contact, then its equation is also $h x+k y=h^2+k^2\\quad \\quad \\dots(ii)$\r\n$\\left[\\right.$ using $\\left.T=S^{\\prime}\\right]$\r\nClearly Eqs. (i) and (ii) represent the same line\r\n$\\begin{aligned}\r\n& \\therefore \\frac{t}{h}=\\frac{4 t-20}{5 k}=\\frac{9}{h^2+k^2} \\\\\r\n& \\Rightarrow \\frac{t}{h}=\\frac{9}{h^2+k^2} \\text { and } \\frac{t}{h}=\\frac{4 t-20}{5 k} \\\\\r\n& \\Rightarrow t=\\frac{9 h}{h^2+k^2} \\text { and } t=\\frac{20 h}{4 h-5 k} \\\\\r\n& \\Rightarrow \\frac{9 h}{h^2+k^2}=\\frac{20 h}{4 h-5 k} \\\\\r\n& \\Rightarrow  h\\left\\{20\\left(h^2+k^2\\right)-36 h+45 k\\right\\}=0 \\\\\r\n& x=0, \\text { or }\\left[20\\left(x^2+y^2\\right)-36 x+45 y\\right]=0\r\n\\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e36f5bfc7ab78ae8bb", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The length of the chord $x+y=3$ intercepted by the circle $x^{2}+y^{2}-2 x-2 y-2=0$ is", "image": null}, "options": [{"id": "tzneE", "text": "$\\frac{7}{2}$", "isCorrect": false, "image": null}, {"id": "jhl3j", "text": "$\\frac{3 \\sqrt{3}}{2}$", "isCorrect": false, "image": null}, {"id": "wM7Uj", "text": "$\\sqrt{14}$", "isCorrect": true, "image": null}, {"id": "Xtv8X", "text": "$\\frac{\\sqrt{7}}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The centre of the circle is \\(\\mathrm{C}(1,1)\\) and radius of the circle is 2 , perpendicular distance from \\(\\mathrm{C}\\) on \\(\\mathrm{AB}\\), the chord \\(\\mathrm{x}+\\mathrm{y}=3\\)\r\n\r\n\\(\\begin{aligned} &\\mathrm{CD}=\\left|\\frac{1+1-3}{\\sqrt{2}}\\right|=\\frac{1}{\\sqrt{2}} \\\\ &\\Rightarrow \\mathrm{AD}=\\sqrt{4-\\frac{1}{2}}=\\sqrt{\\frac{7}{2}}\\left[\\mathrm{AD}=\\sqrt{\\mathrm{AC}^{2}-\\mathrm{CD}^{2}}\\right] \\end{aligned}\\)\r\n\r\nHence, the length of the chord \\(\\mathrm{AB}=2 \\mathrm{AD}=2 \\sqrt{\\frac{7}{2}}=\\sqrt{14}\\).\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/hse6532ghg73.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7896f5bfc7ab78ae5b6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "The line \\(a x+b y=1\\) cuts ellipse \\(c x^2+d y^2=1\\) only once if", "image": null}, "options": [{"id": "twjDD", "text": "\\(\\mathrm{ca}^2+\\mathrm{db}^2=1\\)", "image": null, "isCorrect": false}, {"id": "drOCG", "text": "\\(\\frac{\\mathrm{c}}{\\mathrm{a}^2}+\\frac{\\mathrm{d}}{\\mathrm{b}^2}=1\\)", "image": null, "isCorrect": false}, {"id": "wO5zU", "text": "\\(\\frac{\\mathrm{a}^2}{\\mathrm{c}}+\\frac{\\mathrm{b}^2}{\\mathrm{~d}}=1\\)", "image": null, "isCorrect": true}, {"id": "dXdXE", "text": "\\(a c^2+b d^2=1\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Clearly \\(a x+b y=1\\)\ni.e \\(y=-\\frac{a}{b} x+\\frac{1}{b}\\) is tangent to\n\\(\\begin{aligned}\n& \\mathrm{cx}^2+\\mathrm{dy}^2=1 \\Rightarrow \\frac{\\mathrm{x}^2}{\\frac{1}{c}}+\\frac{\\mathrm{y}^2}{\\frac{1}{d}}=1 \\\\\n& \\therefore\\left(\\frac{1}{b}\\right)^2=\\left(\\frac{1}{c}\\right)\\left(-\\frac{a}{b}\\right)^2+\\left(\\frac{1}{d}\\right) \\\\\n& \\Rightarrow 1=\\frac{a^2}{c}+\\frac{b^2}{d}\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "64c0e8706f5bfc7ab78aee34", "title": "Intersection of Circles", "totalQuestions": 2, "questions": [{"_id": "64c0e7c46f5bfc7ab78ae7af", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "The angle of intersection of the two circles $x^{2}+y^{2}-2 x-2 y=0$ and $x^{2}+y^{2}=4,$ is", "image": null}, "options": [{"id": "EcaRP", "text": "$30^{\\circ}$", "isCorrect": false, "image": null}, {"id": "yTiiX", "text": "$60^{\\circ}$", "isCorrect": false, "image": null}, {"id": "kjstp", "text": "$90^{\\circ}$", "isCorrect": false, "image": null}, {"id": "SH7Yl", "text": "$45^{\\circ}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Here circles are\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\nx^{2}+y^{2}-2 x-2 y=0...(1) \\\\\r\n\r\nx^{2}+y^{2}=4...(2) \\\\\r\n\r\n\\text { Now, } \\mathrm{C}_{1}(1,1), r_{1}=\\sqrt{1^{2}+1^{2}}=\\sqrt{2} \\\\\r\n\r\nC_{2}(0,0), r_{2}=2\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nIf $\\theta$ is the angle of intersection then\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\cos \\theta=\\frac{r_{1}^{2}+r_{2}^{2}-\\left(c_{1} c_{2}\\right)^{2}}{2 r_{1} r_{2}} \\\\\r\n\r\n=\\frac{2+4-(\\sqrt{2})^{2}}{2 \\cdot \\sqrt{2.2}}=\\frac{1}{\\sqrt{2}} \\Rightarrow \\theta=45^{\\circ}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7986f5bfc7ab78ae638", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "For what value of \\(k\\) the circles \\(x^2+y^2+5 x+3 y+7=0\\) and \\(x^2+y^2-8 x+6 y+k=0\\) cuts orthogonally", "image": null}, "options": [{"id": "pwB4s", "text": "16", "image": null, "isCorrect": false}, {"id": "iBrjE", "text": "-18", "image": null, "isCorrect": true}, {"id": "LA9EM", "text": "-13", "image": null, "isCorrect": false}, {"id": "L8Cax", "text": "-10", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the two circles be \\(x^2+y^2+2 g_1 x+2 f_1 y\\) \\(+c_1=0\\) and \\(x^2+y^2+2 g_2 x+2 f_2 y+c_2=0\\) where \\(g_1=5 / 2, f_1=3 / 2, c_1=7, g_2=4, f_2=3\\) and \\(\\mathrm{c}_2=\\mathrm{k}\\)\nIf the two circles intersects orthogonally, then\n\\(\\begin{aligned}\n& 2~\\left(\\mathrm{g}_1 \\mathrm{~g}_2+\\mathrm{f}_1 \\mathrm{f}_2\\right)=\\mathrm{c}_1+\\mathrm{c}_2 \\Rightarrow 2\\left(-10+\\frac{9}{2}\\right)=7+\\mathrm{k} \\\\\n& \\Rightarrow 11=7+\\mathrm{k} \\Rightarrow \\mathrm{k}=-18\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "64c0e8716f5bfc7ab78aee35", "title": "Common Chord", "totalQuestions": 2, "questions": [{"_id": "64c0e7ef6f5bfc7ab78ae923", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "If two distinct chords drawn from the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>p</mi><mo>,</mo><mi>q</mi><mo>)</mo></math> on the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mi>p</mi><mi>x</mi><mo>+</mo><mi>q</mi><mi>y</mi></math> (where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mi>q</mi><mo>&#8800;</mo><mn>0</mn></math>) are bisected by the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>-axis, then", "image": null}, "options": [{"id": "b3mlx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mo>=</mo><msup><mi>q</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "asxam", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mo>=</mo><mn>8</mn><msup><mi>q</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "TAhvl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mo>&#60;</mo><mn>8</mn><msup><mi>q</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "SonqO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mo>&#62;</mo><mn>8</mn><msup><mi>q</mi><mn>2</mn></msup></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>t</mi><mo>,</mo><mo>&#160;</mo><mi>m</mi><mo>)</mo></math> be the other end of the chord drawn from the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>p</mi><mo>,</mo><mo>&#160;</mo><mi>q</mi><mo>)</mo></math> on the circle</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mi>p</mi><mi>x</mi><mo>+</mo><mi>q</mi><mi>y</mi></math></p><p>Their mid-point is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mrow><mi>t</mi><mo>+</mo><mi>p</mi></mrow><mn>2</mn></mfrac><mo>,</mo><mfrac><mrow><mi>m</mi><mo>+</mo><mi>q</mi></mrow><mn>2</mn></mfrac></mrow></mfenced></math></p><p>since, mid-point lies on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>-axis i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>+</mo><mi>q</mi><mo>=</mo><mn>0</mn></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p>Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>t</mi><mo>,</mo><mo>&#160;</mo><mi>m</mi><mo>)</mo></math> lies on the circle.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup><mo>-</mo><mi>p</mi><mi>t</mi><mo>-</mo><mi>q</mi><mi>m</mi><mo>=</mo><mn>0</mn></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p>From Eqs. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>ii</mi><mo>)</mo></math>, we get <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>t</mi><mn>2</mn></msup><mo>-</mo><mi>p</mi><mi>t</mi><mo>+</mo><mn>2</mn><msup><mi>q</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn></math></p><p>Which is quadratic in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> such that, Discriminant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#62;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msup><mi>p</mi><mn>2</mn></msup><mo>-</mo><mn>8</mn><msup><mi>q</mi><mn>2</mn></msup><mo>&#62;</mo><mn>0</mn><mo>&#8658;</mo><msup><mi>p</mi><mn>2</mn></msup><mo>&#62;</mo><mn>8</mn><msup><mi>q</mi><mn>2</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7aa6f5bfc7ab78ae6cf", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the line $x \\cos \\alpha+y \\sin \\alpha=p$ represents the common chord of the circles $x^{2}+y^{2}=a^{2}$ and $\\mathrm{x}^{2}+\\mathrm{y}^{2}+\\mathrm{b}^{2}(\\mathrm{a}>\\mathrm{b}),$ where $\\mathrm{A}$ and $\\mathrm{B}$ lie ont he first circle and $\\mathrm{P}$ and $\\mathrm{Q}$ lie on the second circle, then AP is equal to", "image": null}, "options": [{"id": "PjCIr", "text": "$\\sqrt{a^{2}+p^{2}}+\\sqrt{b^{2}+p^{2}}$", "isCorrect": false, "image": null}, {"id": "IfInY", "text": "$\\sqrt{a^{2}-p^{2}}+\\sqrt{b^{2}-p^{2}}$", "isCorrect": false, "image": null}, {"id": "JqhMu", "text": "$\\sqrt{a^{2}-p^{2}}-\\sqrt{b^{2}-p^{2}}$", "isCorrect": true, "image": null}, {"id": "PXzik", "text": "$\\sqrt{a^{2}+p^{2}}-\\sqrt{b^{2}+p^{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given circles are concentric with centre at (0,0) and the length of the perpendicular from (0,0) on the given line is $\\mathrm{p}$. Let $\\mathrm{OL}=\\mathrm{p}$\r\nthen, $\\mathrm{AL}=\\sqrt{\\mathrm{OA}^{2}-\\mathrm{OL}^{2}}=\\sqrt{\\mathrm{a}^{2}-\\mathrm{p}^{2}}$\r\nand $\\mathrm{PL}=\\sqrt{\\mathrm{OP}^{2}-\\mathrm{OL}^{2}}=\\sqrt{\\mathrm{b}^{2}-\\mathrm{p}^{2}}$\r\n$\\Rightarrow \\mathrm{AP}=\\sqrt{\\mathrm{a}^{2}-\\mathrm{p}^{2}}-\\sqrt{\\mathrm{b}^{2}-\\mathrm{p}^{2}}$\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/I7c8MVgqVnzEIH0N6EFDLp_CwP9Wef5DEKrZcfzvT_Y.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "64c0e8716f5bfc7ab78aee3a", "title": "Family of Circle", "totalQuestions": 1, "questions": [{"_id": "64c0e8356f5bfc7ab78aeb86", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 3, "question": {"text": "For each parabola $y=x^2+p x+q$, meeting coordinate axes at 3-distinct points, if circles are drawn through these points, then the family of circles must pass through", "image": null}, "options": [{"id": "kStDG", "text": "\r\n$(1,0)$\r\n", "isCorrect": false, "image": null}, {"id": "WVLoY", "text": "\r\n$(0,1)$\r\n", "isCorrect": true, "image": null}, {"id": "czxNU", "text": "\r\n$(1,1)$\r\n", "isCorrect": false, "image": null}, {"id": "Gz9I6", "text": "\r\n$(p, q)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Suppose the parabola $y=x^2+p x+q$ cuts $X$-axis at $A(\\alpha, 0)$ and $B(\\beta, 0)$.\r\nThen, $\\alpha, \\beta$ are roots of the equation $x^2+p x+q=0$\r\n$$\r\n\\therefore \\quad \\alpha+\\beta=-p \\text { and } \\alpha \\beta=q\r\n$$\r\nThe parabola $y=x^2+p x+q$ cuts $Y$-axis at $(0, q)$.\r\nLet the equation of the circle passing through $A, B$ and $C$ be\r\n$$\r\n\\begin{aligned}\r\n& x^2+y^2+2 g x+2 f y+c  =0 &...(i)\\\\\r\n\\therefore & \\alpha^2+2 g \\alpha+c  =0 &...(ii)\\\\\r\n& \\beta^2+2 g \\beta+c  =0 &...(iii)\\\\\r\n\\text { and } & q^2+2 f q+c  =0 &...(iv)\r\n\\end{aligned}\r\n$$\r\nSubtracting Eq. (iii) from Eq. (ii), we get\r\n$$\r\n\\begin{array}{rlrl}\r\n\\alpha+\\beta+2 g & =0 \\\\\r\n\\Rightarrow & g = p / 2\r\n\\end{array}\r\n$$\r\nAdding Eqs. (ii) and (iii), we get\r\n$$\r\n\\begin{array}{r}\r\n\\alpha^2+\\beta^2+2 g(\\alpha+\\beta)+2 c=0 \\\\\r\n(\\alpha+\\beta)^2-2 \\alpha \\beta+2 g(\\alpha+\\beta)+2 c=0 \\\\\r\np^2-2 q-p^2+2 c=0\r\n\\end{array}\r\n$$\r\n$$\r\n\\left[\\because \\alpha+\\beta=p \\text { and } g=\\frac{p}{2}\\right]\r\n$$\r\nPutting $c=q$ in Eq. (iv), we get $f=-\\left(\\frac{q+1}{2}\\right)$\r\nSubstituting the values of $g, f$ and $c$ in Eq. (i), we obtain the equation of family of circles passing through $A, B$ and $C$ as\r\n$$\r\nx^2+y^2+p x-(q+1) y+q=0\r\n$$\r\nClearly, it passes through $(0,1)$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 10, "topicId": "64c0e8716f5bfc7ab78aee38", "title": "Locus", "totalQuestions": 4, "questions": [{"_id": "67726d1bc49e8ef28ee2b44b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "The locus of the mid-point of a chord of the circle $x^2+y^2=4$, which subtends a right angle at the origin is", "image": null}, "options": [{"id": "G9xrc", "text": "$x+y=2$", "image": null, "isCorrect": false}, {"id": "7cJ4b", "text": "$x^2+y^2=1$", "image": null, "isCorrect": false}, {"id": "NAfxi", "text": "$x^2+y^2=2$", "image": null, "isCorrect": true}, {"id": "vLBiw", "text": "$x+y=1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to question,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/jvg9c3Zka7t7QF2oTFKW8xth6yvoHLIS0A-ToLqA5tw.original.fullsize.png\"/>\n$O C=\\sqrt{h^2+k^2}$\nIn $\\triangle O C B$,\n$\\begin{aligned}\n& \\cos 45^{\\circ}=\\frac{\\sqrt{h^2+k^2}}{2} \\\\\n& \\Rightarrow \\quad \\frac{\\sqrt{h^2+k^2}}{2}=\\frac{1}{\\sqrt{2}} \\\\\n& \\Rightarrow \\quad h^2+k^2=2\n\\end{aligned}$\nReplacing $h \\rightarrow x$ and $k \\rightarrow y$\n$\\text { Locus } \\Rightarrow x^2+y^2=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cffc49e8ef28ee2b371", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "From a point $\\mathrm{A}(0,3)$ on the circle $(x+2)^2$ $+(y-3)^2=4$, a chord $A B$ is drawn and it is extended to a point $Q$ such that $A Q=2 A B$. Then the locus of $Q$ is", "image": null}, "options": [{"id": "p3Z8O", "text": "$(x+4)^2+(y-3)^2=16$", "image": null, "isCorrect": true}, {"id": "6E6NO", "text": "$(x+1)^2+(y-3)^2=32$", "image": null, "isCorrect": false}, {"id": "9wTto", "text": "$(x+1)^2+(y-3)^2=4$", "image": null, "isCorrect": false}, {"id": "uwwPP", "text": "$(x+1)^2+(y-3)^2=1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation of circle\n$(x+2)^2+(y-3)^2=4$\nLet the coordinates of Q is $(h, k)$.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/IlAohDphww2iGkev2LAbgZbSEN_KF6fEqfAi4AMYV8o.original.fullsize.png\"/>\nCoordinate of B which is midpoint of AQ because $\\mathrm{AQ}=2 \\mathrm{AB}$.\nThen, $\\mathrm{B}=\\left(\\frac{0+h}{2}, \\frac{k+3}{2}\\right) \\rightarrow\\left(\\frac{h}{2}, \\frac{k+3}{2}\\right)$\nPoint B also satisfy the equation of circle.\n$(x+2)^2+(y-3)^2=4$\n$\\left(\\frac{h}{2}+2\\right)^2+\\left(\\frac{k+3}{2}-3\\right)^2=4$\n$\\frac{(h+4)^2}{4}+\\frac{(k-3)^2}{4}=4$\n$(h+4)^2+(k-3)^2=16$\nReplace $(h, k)$ by $(x, y)$, then, the required equation is $(x+4)^2+(y-3)^2=16$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fe6f5bfc7ab78ae9a2", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 2, "question": {"text": "Radius of the largest circle which passes through the focus of the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> and contained in it, is", "image": null}, "options": [{"id": "J1yEB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "isCorrect": false, "image": null}, {"id": "YRn9M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "isCorrect": true, "image": null}, {"id": "8u9pL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "jIacE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> be the radius of the largest circle passing through the focus <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/807de1a8-d722-452e-8c32-2df7ef662bcd-d48.png\" style=\"width: 325px; height: 250px;\" /></p><p>Clearly, centre of the circle will be on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>-axis and its coordinates are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>+</mo><mi>r</mi><mo>,</mo><mn>0</mn></mrow></mfenced></math>.</p><p>The equation of the circle, is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>1</mn><mo>-</mo><mi>r</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math>.</p><p>It touches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>x</mi></math>. Therefore, the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mi>r</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mn>4</mn><mi>x</mi><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math> must have equal roots.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mn>4</mn><msup><mfenced><mrow><mn>1</mn><mo>-</mo><mi>r</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>4</mn><mfenced><mrow><mn>2</mn><mi>r</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mn>4</mn></math></p><p>Hence, option (b) is correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e36f5bfc7ab78ae8b8", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The line joining (5,0) to $((10 \\cos \\theta, 10 \\sin \\theta)$ is divided internally in the ratio 2: 3 at $P$. If $\\theta$ varies, then the locus of $\\mathrm{P}$ is", "image": null}, "options": [{"id": "aaSHp", "text": "a pair of straight lines", "isCorrect": false, "image": null}, {"id": "6G4ai", "text": "a circle", "isCorrect": true, "image": null}, {"id": "1s5RA", "text": "a straight line", "isCorrect": false, "image": null}, {"id": "YxAmR", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\mathrm{P}(\\mathrm{x}, \\mathrm{y})$ be the point dividing the join of $\\mathrm{A}$ and $\\mathrm{B}$ in the ratio 2: 3 internally, then\r\n\r\n$$\r\n\r\n\\begin{array}{c}\r\n\r\n\\mathrm{x}=\\frac{20 \\cos \\theta+15}{5}=4 \\cos \\theta+3 \\Rightarrow \\cos \\theta=\\frac{\\mathrm{x}-3}{4} \\\\\r\n\r\n\\mathrm{y}=\\frac{20 \\sin \\theta+0}{5}=4 \\sin \\theta \\Rightarrow \\sin \\theta=\\frac{\\mathrm{y}}{4} \\ldots \\text { (ii) }\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nSquaring and adding (i) and (ii), we get the\r\n\r\nrequired locus $(x-3)^{2}+y^{2}=16,$ which is\r\n\r\na circle.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 11, "topicId": "67726da4c49e8ef28ee2b4b0", "title": "Distance of a point from any point on the circle", "totalQuestions": 1, "questions": [{"_id": "67726d0cc49e8ef28ee2b3d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "If p and q be the longest and the shortest distance respectively of the point $(-7,2)$ from any point $(\\alpha, \\beta)$ on the curve whose equation is $x^2+y^2-10 x-14 y-51=0$, then G.M. of p", "image": null}, "options": [{"id": "SvNZ6", "text": "$2 \\sqrt{11}$", "image": null, "isCorrect": true}, {"id": "laewq", "text": "$5 \\sqrt{5}$", "image": null, "isCorrect": false}, {"id": "NDEoa", "text": "$13$", "image": null, "isCorrect": false}, {"id": "vEj9W", "text": "$11$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The centre $C$ of the circle $=(5,7)$ and the radius\n$=\\sqrt{5^2+7^2+51}=5 \\sqrt{5}$\n$\\mathrm{PC}=\\sqrt{12^2+5^2}=13 \\Rightarrow q=P A=13-5 \\sqrt{5}$\nand $p=P B=13+5 \\sqrt{3}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/wf2Brex5t8NNHNPL_K5j5jggOlMntFYf9ncI-NbY-bM.original.fullsize.png\"/>\n$\\therefore$ G.M. of $p$ and $q$\n$=\\sqrt{p q}=\\sqrt{(13-5 \\sqrt{5})(13+5 \\sqrt{5})}$\n$=\\sqrt{169-125}=2 \\sqrt{11}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
