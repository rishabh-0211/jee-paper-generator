      font-weight: 700;
      color: var(--primary);

      border-radius: 8px;

      color: #0f172a;

      padding: 10px;
      border: 1px solid #cbd5e1;

      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;

      display: flex;

      gap: 14px;

      border: 1px solid var(--option-border);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      line-height: 1.6;

      padding-top: 16px;

      background: var(--solution-bg);
      border: 1px solid var(--solution-border);
      border-radius: 8px;
      overflow: hidden;
    }

      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      color: var(--success);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
      outline: none;
      font-size: 15px;

      font-size: 11px;

      font-size: 16px;
      line-height: 1.85;

hall meet any friends and s : I shall go for a movie, then which of the following is the proposition : 'If it does not rain or if I do not go to school, then I shall meet my friend and go for a movie'?", "image": null}, "options": [{"id": "zmKIE", "text": "$\\sim(p \\wedge q) \\Rightarrow(r \\wedge s)$", "image": null, "isCorrect": true}, {"id": "jJ9vr", "text": "$\\sim(\\mathrm{p} \\wedge \\sim \\mathrm{q}) \\Rightarrow(\\mathrm{r} \\wedge \\mathrm{s})$", "image": null, "isCorrect": false}, {"id": "NnbIo", "text": "$\\sim(p \\wedge q) \\Rightarrow(r \\vee s)$", "image": null, "isCorrect": false}, {"id": "ztQk0", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Correct result is $(\\sim \\mathrm{p} \\vee \\sim \\mathrm{q}) \\Rightarrow(\\mathrm{r} \\wedge \\mathrm{s})$\nSo, $\\sim(p \\wedge q) \\Rightarrow(r \\wedge s)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87f97ae24e9e2db8cf2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "The negation of the Boolean expression $((\\sim q)$ $\\wedge p) \\Rightarrow((\\sim p) \\vee q)$ is logically equivalent to", "image": null}, "options": [{"id": "p96Yz", "text": "$p \\Rightarrow q$", "image": null, "isCorrect": false}, {"id": "ECx8g", "text": "$q \\Rightarrow p$", "image": null, "isCorrect": false}, {"id": "x2DsK", "text": "$\\sim(p \\Rightarrow q)$", "image": null, "isCorrect": true}, {"id": "7GsSq", "text": "$\\sim(q \\Rightarrow p)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given boolen expression are<br />$\\begin{aligned}<br />& \\sim p \\vee q \\equiv p \\rightarrow q \\text { and } \\sim q \\wedge p \\equiv \\sim(p \\rightarrow q) \\\\<br />& \\text { Negation of } \\sim(p \\rightarrow q) \\rightarrow(p \\rightarrow q) \\\\<br />& \\text { is } \\sim(p \\rightarrow q) \\wedge(\\sim(p \\rightarrow q)) \\text { i.e., } \\sim(p \\rightarrow q)<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87897ae24e9e2db8ca7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "Negation of the Boolean expression $\\mathrm{p} \\Leftrightarrow(\\mathrm{q} \\Rightarrow \\mathrm{p})$ is", "image": null}, "options": [{"id": "afIwP", "text": "$(\\sim p) \\wedge q$", "image": null, "isCorrect": false}, {"id": "awYQv", "text": "$(\\mathrm{p}) \\wedge(\\sim \\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "g0Ifl", "text": "$(\\sim \\mathrm{p}) \\vee(\\sim \\mathrm{q})$", "image": null, "isCorrect": false}, {"id": "xBWcN", "text": "$(\\sim p) \\wedge(\\sim q)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given expression is $p \\Leftrightarrow(q \\Rightarrow p)$<br />$\\sim(\\mathrm{p} \\leftrightarrow(\\mathrm{q} \\rightarrow \\mathrm{p}))$<br />$\\sim(\\mathrm{p} \\leftrightarrow \\mathrm{q})=(\\mathrm{p} \\wedge \\sim \\mathrm{q}) \\vee(\\mathrm{q} \\wedge \\sim \\mathrm{p})$<br />$\\sim(\\mathrm{p} \\leftrightarrow(\\mathrm{q} \\rightarrow \\mathrm{p}))$ $=(\\mathrm{p} \\wedge \\sim(\\mathrm{q} \\rightarrow \\mathrm{p})) \\vee((\\mathrm{q} \\rightarrow \\mathrm{p}) \\wedge \\sim \\mathrm{p})$<br />$(\\mathrm{p} \\wedge \\sim(\\mathrm{q} \\rightarrow \\mathrm{p}))=\\mathrm{p} \\wedge(\\mathrm{q} \\wedge \\sim \\mathrm{p})$ $=(p \\wedge \\sim p) \\wedge q=c$<br />$(q \\rightarrow p) \\wedge \\sim p=(\\sim q \\vee p) \\wedge \\sim p$ $=\\sim p \\wedge(\\sim q \\vee p)$<br />$=(\\sim \\mathrm{p} \\wedge \\sim \\mathrm{q}) \\vee(\\sim \\mathrm{p} \\wedge \\mathrm{p})=\\sim \\mathrm{p} \\wedge \\sim \\mathrm{q}$<br />$\\sim(p \\leftrightarrow(\\dot{q} \\rightarrow p))=c \\vee(\\sim p \\wedge \\sim q)=\\sim p \\wedge \\sim q$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e82b6f5bfc7ab78aeb32", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "The statement $p:$ For any real numbers $x, y$ if $x=y$, then $2 x+a=2 y+a$ when $a \\in \\mathrm{Z}$.", "image": null}, "options": [{"id": "gOrDH", "text": "is true", "isCorrect": true, "image": null}, {"id": "O0Dpx", "text": "is false", "isCorrect": false, "image": null}, {"id": "Gx6QM", "text": "its contrapositive is not true", "isCorrect": false, "image": null}, {"id": "e4R9o", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We prove the statement $p$ is true by contrapositive method and by direct method.\r\n\r\nDirect method: For any real number $x$ and $y$,\r\n\r\n$\\begin{array}{l}\r\n\r\nx=y \\\\\r\n\r\n\\Rightarrow 2 x=2 y \\\\\r\n\r\n\\Rightarrow 2 x+a=2 y+a \\text { a for some } a \\in Z\r\n\r\n\\end{array}$\r\n\r\nContrapositive method: The contrapositive statement of $p$ is \"For any real numbers $x, y$ if $2 \\mathrm{x}+\\mathrm{a} \\neq 2 \\mathrm{y}+\\mathrm{a}$, where $\\mathrm{a} \\in \\mathrm{Z}$, then $\\mathrm{x} \\neq \\mathrm{y}$.\"\r\n\r\nGiven, $2 x+a \\neq 2 y+a$\r\n\r\n$\\begin{array}{l}\r\n\r\n\\Rightarrow 2 x \\neq 2 y \\\\\r\n\r\n\\Rightarrow x \\neq y\r\n\r\n\\end{array}$\r\n\r\nHence, the given statement is true.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8016f5bfc7ab78ae9bc", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>:</mo><mn>4</mn></math>&nbsp;is an even prime number, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mo>:</mo><mn>6</mn></math>&nbsp;is a divisor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>:</mo></math> the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><m p</mi><mo>&#8744;</mo><mfenced><mrow><mi>q</mi><mo>&#8743;</mo><mi>r</mi></mrow></mfenced></math> is correct.</p><p>Hence, option (d) is correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fc6f5bfc7ab78ae999", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following statement is a tautology?", "image": null}, "options": [{"id": "izHzC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>&#8744;</mo><mi>q</mi></mrow></mfenced><mo>&#8744;</mo><mfenced><mrow><mo>~</mo><mi>p</mi></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "ORdvS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>~</mo><mi>q</mi><mo>&#8743;</mo><mi>p</mi></mrow></mfenced><mo>&#8744;</mo><mfenced><mrow><mi>p</mi><mo>&#8744;</mo><mo>~</mo><mi>p</mi></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "i6yiJ", "text": "Both (a) and (b)", "isCorrect": true, "image": null}, {"id": "dUeWU", "text": "None of the above", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Truth table</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math></td>\ ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "Negation of \"Paris in France and London is in England\" is", "image": null}, "options": [{"id": "oRn94", "text": "Paris is in England and London is in France", "image": null, "isCorrect": false}, {"id": "ZBfRf", "text": "Paris is not in France or London is not in England", "image": null, "isCorrect": true}, {"id": "ffkkM", "text": "Paris is in England or London is in France", "image": null, "isCorrect": false}, {"id": "wnChf", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let \\(p\\) : Paris is in France, \\(q\\) : London is in England\n\\(\\therefore \\quad\\) we have \\(p \\wedge q\\)\nIts negation is \\(\\sim(p \\wedge q)=\\sim p \\vee \\sim q\\)\ni.e., Paris is not in France or London is not in England.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77b6f5bfc7ab78ae53a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "If \\(f(t)=\\frac{1-t}{1+t}\\), then \\(f^{\\prime}(1 / t)\\) is equal to", "image": null}, "options": [{"id": "uUqJX", "text": "\\(\\frac{1}{(1+t)^2}\\)", "image": null, "isCorrect": false}, {"id": "a9Hp4", "text": "\\(\\frac{1}{(t-1)^2}\\)", "image": null, "isCorrect": false}, {"id": "D5CWf", "text": "\\(\\frac{-2 t^2}{(t+1)^2}\\)", "image": null, "isCorrect": true}, {"id": "wrGDY", "text": "\\(\\frac{2}{(t-1)^2}\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& f^{\\prime}(t)=\\frac{d}{d t}\\left[\\frac{1-t}{1+t}\\right]=\\frac{(1+t)(-1)-(1-t) \\times(1)}{(1+t)^2} \\\\\n& =\\frac{-1-t-1+t}{(1+t)^2}=\\frac{-2}{(1+t)^2}\n\\end{aligned}\\)\n\\(f^{\\prime}[1 / t]=\\frac{-2}{\\left(1+\\frac{1}{t}\\right)^2}=\\frac{-2 t^2}{(t+1)^2}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
