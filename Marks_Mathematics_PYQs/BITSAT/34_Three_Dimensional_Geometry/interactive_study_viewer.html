2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math> is the angle between the vectors <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mfenced><mrow><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>+</mo><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover><mo>,</mo></math>&nbsp;then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>sin</mi><mi>&#952;</mi><mo>+</mo><mi>cos</mi><mi>&#952;</mi></mrow></mfenced></math> equals to", "image": null}, "options": [{"id": "rIwz8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "iqf8t", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "ZjUXc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "isCorrect": true, "image": null}, {"id": "pr1hv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>a</mi><mo>&#8594;</mo></mover><mo>=</mo><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>+</mo><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>b</mi><mo>&#8594;</mo></mover><mo>=</mo><mn>4</mn><mfenced><mrow><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced></math></p><p>Then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mover><mi>a</mi><mo>&#8594;</mo></mover></mfenced><mo>=</mo><msqrt><msup><mn>1</mn><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mover><mi>b</mi><mo>&#8594;</mo></mover></mfenced><mo>=</mo><msqrt><msup><mn>4</mn><mn>2</mn></msup><mo>+</mo><msup><mn>0</mn><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mo>-</mo><mn>4</mn></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mn>4</mn><msqrt><mn>2</mn></msqrt></math></p><p>Now,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mover><mi>a</mi><mo>&#8594;</mo></mover><mo>&#183;</mo><mover><mi>b</mi><mo>&#8594;</mo></mover></mrow><mrow><mfenced close=\"|\" open=\"|\"><mover><mi>a</mi><mo>&#8594;</mo></mover></mfenced><mfenced close=\"|\" open=\"|\"><mover><mi>b</mi><mo>&#8594;</mo></mover></mfenced></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mfenced><mrow><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>+</mo><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced><mo>&#183;</mo><mfenced><mrow><mn>4</mn><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mn>4</mn><mover><mi>k</mi><mo>^</mo></mover></mrow></mfenced></mrow><mrow><mfenced close=\"|\" open=\"|\"><mover><mi>a</mi><mo>&#8594;</mo></mover></mfenced><mfenced close=\"|\" open=\"|\"><mover><mi>b</mi><mo>&#8594;</mo></mover></mfenced></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mo>-</mo><mn>4</mn></mrow><mrow><mfenced close=\"|\" open=\"|\"><mover><mi>a</mi><mo>&#8594;</mo></mover></mfenced><mfenced close=\"|\" open=\"|\"><mover><mi>b</mi><mo>&#8594;</mo></mover></mfenced></mrow></mfrac><mo>=</mo><mn>0</mn></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#952;</mi></msqrt><mo>=</mo><mn>1</mn></math></p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>+</mo><mi>cos</mi><mi>&#952;</mi><mo>=</mo><mn>1</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fd6f5bfc7ab78ae99e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "A line makes angles <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>,</mo><mo>&#160;</mo><mi>&#947;</mi></math> with the coordinate axes. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><mfrac><mi>&#960;</mi><mn>2</mn></mfrac></math>,&nbsp;then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>cos</mi><mi>&#945;</mi><mo>+</mo><mi>cos</mi><mi>&#946;</mi><mo>+</mo><mi>cos</mi><mi>&#947;</mi></mrow></mfenced><mn>2</mn></msup></math> is equal to", "image": null}, "options": [{"id": "Atwzr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><mi>sin</mi><mn>2</mn><mi>&#945;</mi></math>", "isCorrect": true, "image": null}, {"id": "gUawi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>-</mo><mi>sin</mi><mn>2</mn><mi>&#945;</mi></math>", "isCorrect": false, "image": null}, {"id": "cLecO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><mi>cos</mi><mn>2</mn><mi>&#945;</mi></math>", "isCorrect": false, "image": null}, {"id": "LjC5h", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We have,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>cos</mi><mn>2</mn></msup><mi>&#945;</mi><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#946;</mi><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#947;</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#945;</mi><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mfenced><mrow><mfrac><mi>&#960;</mi><mn>2</mn></mfrac><mo>-</mo><mi>&#945;</mi></mrow></mfenced><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#947;</mi><mo>=</mo><mn>1</mn></math>&nbsp; [given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>=</mo><mfrac><mi>&#960;</mi><mn>2</mn></mfrac></math>]</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#945;</mi><mo>+</mo><msup><mi>sin</mi><mn>2</mn></msup><mi>&#945;</mi><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#947;</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#947;</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>&#947;</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cos</mi><mi>&#947;</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msup><mfenced><mrow><mi>cos</mi><mi>&#945;</mi><mo>+</mo><mi>cos</mi><mi>&#946;</mi><mo>+</mo><mi>cos</mi><mi>&#947;</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mfenced><mrow><mi>cos</mi><mi>&#945;</mi><mo>+</mo><mi>sin</mi><mi>&#945;</mi></mrow></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>sin</mi><mi>&#945;</mi><mo>&#183;</mo><mi>cos</mi><mi>&#945;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>sin</mi><mn>2</mn><mi>&#945;</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d66f5bfc7ab78ae844", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "A line makes the same angle $\\theta$ with each of the $\\mathrm{X}$ and $\\mathrm{Z}$ -axes. If the angle $\\beta$, which it makes with Y-axis, is such that $\\sin ^{2} \\beta=3 \\sin ^{2} \\theta,$ then $\\cos ^{2} \\theta$ equals", "image": null}, "options": [{"id": "DlTQc", "text": "$2 / 5$", "isCorrect": false, "image": null}, {"id": "3Dyf1", "text": "$1 / 5$", "isCorrect": false, "image": null}, {"id": "C9CYg", "text": "$3 / 5$", "isCorrect": true, "image": null}, {"id": "nBLVx", "text": "$2 / 3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $l, \\mathrm{~m}$ and $\\mathrm{n}$ be the direction cosines. Then, $l=\\cos \\theta, \\mathrm{m}=\\cos \\beta, \\mathrm{n}=\\cos \\theta$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\text { we have } l^{2}+m^{2}+n^{2}=1 \\\\\r\n\r\n\\Rightarrow \\cos ^{2} \\theta+\\cos ^{2} \\beta+\\cos ^{2} \\theta=1 \\\\\r\n\r\n\\Rightarrow 2 \\cos ^{2} \\theta+1-\\sin ^{2} \\beta=1 \\\\\r\n\r\n\\Rightarrow 2 \\cos ^{2} \\theta-\\sin ^{2} \\beta=0 \\\\\r\n\r\n\\Rightarrow 2 \\cos ^{2} \\theta-3 \\sin ^{2} \\beta=0 \\\\\r\n\r\n\\quad\\left[\\because \\sin ^{2} \\beta=3 \\sin ^{2} 0(\\text { given })\\right] \\\\\r\n\r\n\\Rightarrow \\tan ^{2} \\theta=2 / 3 \\\\\r\n\r\n\\therefore \\cos ^{2} \\theta=\\frac{1}{1+\\tan ^{2} \\theta}=\\frac{1}{1+2 / 3}=\\frac{3}{5}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65b7b89697ae24e9e2db8d33", "title": "Basics of point in 3 dimension", "totalQuestions": 2, "questions": [{"_id": "65b7b87f97ae24e9e2db8cf7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "If the co-ordinates of the point in which the line joining the points $(3,5,-7)$ and $(-2,1,8)$ is intersected by the plane $y z$ is $\\left[\\mathrm{a}, \\frac{13}{\\mathrm{~b}}, \\mathrm{c}\\right]$, then $(a+b-c)=$", "image": null}, "options": [{"id": "DsnUb", "text": "<br />2", "image": null, "isCorrect": false}, {"id": "LS3cG", "text": "<br />3", "image": null, "isCorrect": true}, {"id": "rOy0E", "text": "<br />4", "image": null, "isCorrect": false}, {"id": "kQiQ2", "text": "<br />5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ratio $=-\\left(\\frac{3}{-2}\\right)=\\frac{3}{2}$<br />$\\therefore \\quad$ Required co-ordinates of the points are<br />$\\begin{aligned}<br />& {\\left[\\frac{6-6}{5}, \\frac{10+3}{5}, \\frac{-14+24}{5}\\right]=\\left(0, \\frac{13}{5}, 2\\right) .} \\\\<br />& \\therefore a+b-c=0+5-2=3<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87597ae24e9e2db8c8f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "The ratio in which the YZ-plane divide the line segment formed by joining the points $(-2,4,7)$ and $(3,-5,8)$ is $2: \\mathrm{m}$. The value of $\\mathrm{m}$ is", "image": null}, "options": [{"id": "ToHgq", "text": "2", "image": null, "isCorrect": false}, {"id": "esNtY", "text": "3", "image": null, "isCorrect": true}, {"id": "PWSAF", "text": "4", "image": null, "isCorrect": false}, {"id": "QK2Qj", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the points be $A(-2,4,7)$ and $B(3,-5,8)$ on $Y Z$-plane, $x$-coordinate $=0$.<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/U3gdRe4rjERxY6nARZ6_prnRjGEwHH0AQrCCMdLDNDM.original.fullsize.png\"><br><br />Let the ratio be $K: 1$. <br />The coordinates of $C$ are $\\left(\\frac{3 K-2}{K+1}, \\frac{-5 K+4}{K+1}, \\frac{8 K+7}{K+1}\\right)$<br />Clearly $\\frac{3 K-2}{K+1}=0 \\Rightarrow 3 K=2 \\Rightarrow K=\\frac{2}{3}$ <br />Hence required ratio is $2: 3$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e86f6f5bfc7ab78aee22", "title": "Line in Space", "totalQuestions": 11, "questions": [{"_id": "67726d19c49e8ef28ee2b439", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "The magnitude of projection of line joining $(3,4$, $5)$ and $(4,6,3)$ on the line joining $(-1,2,4)$ and $(1,0,5)$ is", "image": null}, "options": [{"id": "ruX3x", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": true}, {"id": "mQFAg", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "n592I", "text": "$\\frac{8}{3}$", "image": null, "isCorrect": false}, {"id": "00rWn", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that, projection of $\\mathbf{a}$ on $\\mathbf{b}$ is given by projection, $|\\mathrm{a}| \\cos \\theta=\\frac{(\\mathbf{a} \\cdot \\mathbf{b})}{|\\mathbf{b}|}$\nLet line joining points $(3,4,5)$ and $(4,6,3)$ is $L_1$ and line joining points $(-1,2,4)$ and $(1,0,5)$ is $L_2$\n$\\Rightarrow \\quad \\begin{aligned}\n& L_1=\\hat{\\mathbf{i}}+2 \\hat{\\mathbf{j}}-2 \\hat{\\mathbf{k}} \\\\\n& L_2=2 \\hat{\\mathbf{i}}-2 \\hat{\\mathbf{j}}+\\hat{\\mathbf{k}}\n\\end{aligned}$\n$\\therefore$ Projection of $L_1$ and $L_2=\\frac{L_1 \\cdot L_2}{\\left|L_2\\right|}$\n$=\\frac{2-4-2}{\\sqrt{4+4+1}}=\\frac{-4}{3}$\n$\\therefore$ Magnitude $=\\frac{4}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b88297ae24e9e2db8d0e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "The shortest distance between the lines $\\mathrm{x}=\\mathrm{y}+$ $2=6 z-6$ and $x+1=2 y=-12 z$ is", "image": null}, "options": [{"id": "zV0lf", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "zKLIH", "text": "<br />2", "image": null, "isCorrect": true}, {"id": "n7wUn", "text": "<br />1", "image": null, "isCorrect": false}, {"id": "uQe6Q", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The lines are $\\frac{x}{6}=\\frac{y+2}{6}=\\frac{z-1}{1}$<br />and $\\frac{x+1}{12}=\\frac{y}{6}=\\frac{z}{-1}$<br />Here,<br />$\\begin{aligned}<br />& \\vec{a}_1=-2 \\hat{j}+\\hat{k}, b_1+6 \\hat{i}+6 \\hat{j}+\\hat{k}, \\vec{a}_2=-\\hat{i}, \\\\<br />& \\vec{b}_2=12 \\hat{i}+6 \\hat{j}-\\hat{k} \\\\<br />& \\vec{b}_1 \\times \\vec{b}_2=\\left|\\begin{array}{ccc}<br />\\hat{i} & \\hat{j} & k \\\\<br />6 & 6 & 1 \\\\<br />12 & 6 & -1<br />\\end{array}\\right|=-12 \\hat{i}+18 \\hat{j}-36 \\hat{k} \\\\<br />& \\text { Shortest distance }=\\frac{\\left|\\left(\\vec{a}_2-\\vec{a}_1\\right) \\cdot\\left(\\vec{b}_1-\\vec{b}_2\\right)\\right|}{\\left|\\vec{b}_1 \\times \\vec{b}_2\\right|}<br />\\end{aligned}$<br />$\\begin{aligned} & =\\frac{|(-\\hat{i}+2 \\hat{j}-\\hat{k}) \\cdot(-12 i+18 \\hat{j}-36 \\hat{k})|}{\\sqrt{(-12)^2+(18)^2+(-36)^2}} \\\\ & =\\frac{|+12+36+36|}{\\sqrt{1764}}=\\frac{84}{42}=2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b88097ae24e9e2db8cf8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "If the straight lines $\\frac{x-1}{k}=\\frac{y-2}{2}=\\frac{z-3}{3}$ and $\\frac{x-2}{3}=\\frac{y-3}{k}=\\frac{z-1}{2}$ intersect at a point, then the integer $\\mathrm{k}$ is equal to", "image": null}, "options": [{"id": "0NaYo", "text": "<br />-5", "image": null, "isCorrect": true}, {"id": "vzusm", "text": "<br />5", "image": null, "isCorrect": false}, {"id": "fC5w1", "text": "<br />2", "image": null, "isCorrect": false}, {"id": "Mnmts", "text": "<br />-2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the two lines intersect then shortes distance between them is zero i.e.<br />$\\begin{aligned}<br />& \\frac{\\left(\\vec{a}_2-\\vec{a}_1\\right) \\cdot \\vec{b}_1 \\times \\vec{b}_2}{\\left|\\vec{b}_1 \\times \\vec{b}_2\\right|}=0 \\\\<br />& \\Rightarrow\\left(\\vec{a}_2-\\vec{a}_1\\right) \\cdot \\vec{b}_1 \\times \\vec{b}_2=0<br />\\end{aligned}$<br />where $\\vec{a}_1=\\hat{i}+2 \\hat{j}+3 \\hat{k}, \\vec{b}_1=k \\hat{i}+2 \\hat{j}+3 \\hat{k}$<br />$\\begin{aligned}<br />& \\vec{a}_2=2 \\hat{i}+3 \\hat{j}+\\hat{k}, \\hat{b}_2=3 \\hat{i}+k \\hat{j}+2 \\hat{k} \\\\<br />& \\Rightarrow\\left|\\begin{array}{ccc}<br />1 & 1 & -2 \\\\<br />k & 2 & 3 \\\\<br />3 & k & 2<br />\\end{array}\\right|=0 \\\\<br />& \\Rightarrow \\quad 1(4-3 k)-1(2 k-9)-2\\left(k^2-6\\right)=0 \\\\<br />& \\Rightarrow \\quad-2 k^2-5 k+25=0 \\Rightarrow k=-5 \\text { or } \\frac{5}{2}<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87997ae24e9e2db8cb3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "The shortest distance between the lines $\\frac{x-3}{2}=\\frac{y-2}{3}=\\frac{z-1}{-1}$ and $\\frac{x+3}{2}=\\frac{y-6}{1}=\\frac{z-5}{3}$ is :", "image": null}, "options": [{"id": "7R6eO", "text": "$\\frac{18}{\\sqrt{5}}$", "image": null, "isCorrect": true}, {"id": "AOEq9", "text": "$\\frac{22}{3 \\sqrt{5}}$", "image": null, "isCorrect": false}, {"id": "8wHUe", "text": " $\\frac{46}{3 \\sqrt{5}}$", "image": null, "isCorrect": false}, {"id": "Rnata", "text": "$6 \\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Give lines are $\\frac{x-3}{2}=\\frac{y-2}{3}=\\frac{z-1}{-1}$ and $\\frac{x+3}{2}=\\frac{y-6}{1}=\\frac{z-5}{3}$<br />Lines passes through the points<br />$\\vec{a}_1=(3,2,1) \\text { and } \\vec{a}_2=(-3,6,5) \\text {, }$<br />$\\vec{b}_1=2 \\hat{i}+3 \\hat{j}-\\hat{k}$<br />$\\vec{b}_1=2 \\hat{i}+\\hat{j}-3 \\hat{k}, \\vec{a}_2-\\vec{a}_1=6 \\hat{i}-4 j-4 \\hat{k}$<br />Shortest distance $=\\frac{\\left|\\left(\\vec{a}_2-\\vec{a}_1\\right)\\left(\\vec{b}_1 \\times \\vec{b}_2\\right)\\right|}{\\left|\\left(\\vec{b}_1 \\times \\vec{b}_2\\right)\\right|}$<br />$\\vec{b}_1 \\times \\vec{b}_2=\\left|\\begin{array}{ccc}\\hat{i} & \\hat{j} & \\hat{k} \\\\ 2 & 3 & -1 \\\\ 2 & 1 & 3\\end{array}\\right|=10 \\hat{i}-8 \\hat{j}-4 \\hat{k}$<br />$\\left(\\vec{a}_2-\\vec{a}_1\\right) \\cdot\\left(\\vec{b}_1 \\times \\vec{b}_2\\right)=60+32+16=108$<br />$\\left|\\vec{b}_1 \\times \\vec{b}_2\\right|=\\sqrt{100+64+16}=\\sqrt{180}$<br />$S . D=\\frac{108}{\\sqrt{180}}=\\frac{108}{6 \\sqrt{5}}=\\frac{18}{\\sqrt{5}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8286f5bfc7ab78aeb14", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 3, "question": {"text": "The length of the perpendicular drawn from the point $(3,-1,11)$ to the line $\\frac{x}{2}=\\frac{y-2}{3}=\\frac{z-3}{4}$ is :", "image": null}, "options": [{"id": "oORCZ", "text": "$\\sqrt{29}$", "isCorrect": false, "image": null}, {"id": "fW05S", "text": "$\\sqrt{33}$", "isCorrect": false, "image": null}, {"id": "2Nxbz", "text": "$\\sqrt{53}$", "isCorrect": true, "image": null}, {"id": "g7Cbu", "text": "$\\sqrt{66}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let feet of perpendicular is\r\n\r\n$(2 \\alpha, 3 \\alpha+2,4 \\alpha+3)$\r\n\r\n$\\Rightarrow$ Direction ratio of the $\\perp$ line is\r\n\r\n$2 \\alpha-3,3 \\alpha+3,4 \\alpha-8$. and\r\n\r\n$\\Rightarrow$ Direction ratio of the line are $2,3,4$\r\n\r\n$\\Rightarrow 2(2 \\alpha-3)+3(3 \\alpha+3)+4(4 \\alpha-8)=0$\r\n\r\n$\\Rightarrow \\alpha=1$\r\n\r\n$\\Rightarrow$ Feet of $\\perp$ is $(2,5,7)$\r\n\r\n$\\Rightarrow$ Length $\\perp$ is $\\sqrt{1^{2}+6^{2}+4^{2}}=\\sqrt{53}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ef6f5bfc7ab78ae925", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "The image of the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> in the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>2</mn></mrow><mn>3</mn></mfrac></math> is", "image": null}, "options": [{"id": "yup2J", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>-</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>7</mn><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "NRWbD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>-</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>,</mo><mo>-</mo><mn>7</mn><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "lu1Ir", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>7</mn><mo>)</mo></math>", "isCorrect": true, "image": null}, {"id": "2Ym0q", "text": "<span style=\"background-color:null;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>7</mn><mo>)</mo></math></span>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><mn>1</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> be the given point and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;be the foot of perpendicular from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> to the given line. The coordinates of a general point on the given line are</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/86a34f73-b58a-4256-9a66-d25f58d4e491-image.png\" style=\"width: 250px; height: 290px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>0</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>2</mn></mrow><mn>3</mn></mfrac><mo>=</mo><mi>&#955;</mi></math>&nbsp; &nbsp;(say)</p><p>i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>&#955;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>2</mn><mi>&#955;</mi><mo>+</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>z</mi><mo>=</mo><mn>3</mn><mi>&#955;</mi><mo>+</mo><mn>2</mn></math>&nbsp;</p><p>If the coordinates of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>&#955;</mi><mo>,</mo><mn>2</mn><mi>&#955;</mi><mo>+</mo><mn>1</mn><mo>,</mo><mn>3</mn><mi>&#955;</mi><mo>+</mo><mn>2</mn><mo>)</mo></math>, then the direction ratios of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>L</mi></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>&#955;</mi><mo>-</mo><mn>1</mn><mo>,</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>5</mn><mo>,</mo><mn>3</mn><mi>&#955;</mi><mo>-</mo><mn>1</mn><mo>)</mo></math>.</p><p>Since, the direction ratios of given line which is perpendicular to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>L</mi></math>,&nbsp;are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>,</mo><mn>2</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>. Therefore, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>&#955;</mi><mo>-</mo><mn>1</mn><mo>)</mo><mn>1</mn><mo>+</mo><mo>(</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>5</mn><mo>)</mo><mn>2</mn><mo>+</mo><mo>(</mo><mn>3</mn><mi>&#955;</mi><mo>-</mo><mn>1</mn><mo>)</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>,which gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>1</mn></math>.</p><p>Hence, coordinates of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>5</mn><mo>)</mo></math>.</p><p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><msub><mi>y</mi><mn>1</mn></msub><mo>,</mo><msub><mi>z</mi><mn>1</mn></msub></mrow></mfenced></math> be the image of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><mn>1</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> in the given line. Then, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> is the mid-point of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>.</p><p>Therefore, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><mfrac><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><mn>6</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>3</mn><mo>,</mo><mfrac><mrow><msub><mi>z</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>,</mo><mi>y</mi><mo>=</mo><mn>0</mn><mo>,</mo><mi>z</mi><mo>=</mo><mn>7</mn></math></p><p>Hence, the image of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> in the given line is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>7</mn><mo>)</mo></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ef6f5bfc7ab78ae924", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "The length of perpendicular drawn from the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>)</mo></math> to line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mo>-</mo><mi>x</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mi>y</mi><mn>6</mn></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>-</mo><mi>z</mi></mrow><mn>3</mn></mfrac></math>, is", "image": null}, "options": [{"id": "b8p3e", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>7</mn></mfrac><msqrt><mn>101</mn></msqrt></math>", "isCorrect": true, "image": null}, {"id": "bSKBL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>7</mn></mfrac><msqrt><mn>101</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "gJu78", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>7</mn></mfrac><msqrt><mn>103</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "fMkDO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>7</mn></mfrac><msqrt><mn>103</mn></msqrt></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> be the foot of the perpendicular drawn from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>(</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>)</mo></math> to the given line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>.</p><p>Then, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>4</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mi>y</mi><mn>6</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></mfrac></math></p><p>Now, any point on the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>4</mn><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>,</mo><mi>y</mi><mo>=</mo><mn>6</mn><mi>&#955;</mi><mo>,</mo><mi>z</mi><mo>=</mo><mn>1</mn><mo>-</mo><mn>3</mn><mi>&#955;</mi></math></p><p>The coordinates of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>,</mo><mn>6</mn><mi>&#955;</mi><mo>,</mo><mn>1</mn><mo>-</mo><mn>3</mn><mi>&#955;</mi><mo>)</mo></math></p><p>The direction ratios of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AP</mi></math> are</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>2</mn><mo>,</mo><mn>6</mn><mi>&#955;</mi><mo>-</mo><mn>3</mn><mo>,</mo><mn>1</mn><mo>-</mo><mn>3</mn><mi>&#955;</mi><mo>-</mo><mn>4</mn><mo>)</mo></math></p><p>i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>,</mo><mn>6</mn><mi>&#955;</mi><mo>-</mo><mn>3</mn><mo>,</mo><mo>-</mo><mn>3</mn><mo>-</mo><mn>3</mn><mi>&#955;</mi><mo>)</mo></math></p><p>And the direction ratios of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> are<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mo>,</mo><mn>6</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>3</mn></math>.</p><p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>P</mi><mo>&#8869;</mo><mi>l</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>(</mo><mn>2</mn><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>)</mo><mo>+</mo><mn>6</mn><mo>(</mo><mn>6</mn><mi>&#955;</mi><mo>-</mo><mn>3</mn><mo>)</mo><mo>-</mo><mn>3</mn><mo>(</mo><mo>-</mo><mn>3</mn><mo>-</mo><mn>3</mn><mi>&#955;</mi><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#955;</mi><mo>=</mo><mfrac><mn>13</mn><mn>49</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>A</mi><msup><mi>P</mi><mn>2</mn></msup><mo>=</mo><mo>(</mo><mn>4</mn><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>2</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>6</mn><mi>&#955;</mi><mo>-</mo><mn>3</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>1</mn><mo>-</mo><mn>3</mn><mi>&#955;</mi><mo>-</mo><mn>4</mn><msup><mo>)</mo><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>22</mn><mo>-</mo><mn>26</mn><mi>&#955;</mi><mo>+</mo><mn>49</mn><msup><mi>&#955;</mi><mn>2</mn></msup></math></p><p>Put <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mfrac><mn>13</mn><mn>49</mn></mfrac></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><msup><mi>P</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>909</mn><mn>49</mn></mfrac><mo>&#8658;</mo><mi>A</mi><mi>P</mi><mo>=</mo><mfrac><mn>3</mn><mn>7</mn></mfrac><msqrt><mn>101</mn></msqrt></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d46f5bfc7ab78ae835", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "Two lines $L_{1}: x=5, \\frac{y}{3-\\alpha}=\\frac{z}{-2}$\r\n\r\n$\\mathrm{L}_{2}: \\mathrm{x}=\\alpha, \\frac{\\mathrm{y}}{-1}=\\frac{\\mathrm{z}}{2-\\alpha}$ are coplanar. Then, $\\alpha \\mathrm{can}$ take value (s)", "image": null}, "options": [{"id": "J7fIo", "text": "1,4,5", "isCorrect": true, "image": null}, {"id": "fJBoL", "text": "1,2,5", "isCorrect": false, "image": null}, {"id": "9Hnmq", "text": "3,4,5", "isCorrect": false, "image": null}, {"id": "5O7eN", "text": "2,4,5", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equations of given lines can be written\r\n\r\nas\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\mathrm{L}_{1}: \\mathrm{x}-5=\\frac{\\mathrm{y}}{3-\\alpha}=\\frac{\\mathrm{z}}{-2} \\\\\r\n\r\n\\mathrm{~L}_{2}: \\mathrm{x}-\\alpha=\\frac{\\mathrm{y}}{-1}=\\frac{\\mathrm{z}}{2-\\alpha}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nSince, these lines are coplanar.\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\text { Therefore, }\\left|\\begin{array}{ccc}\r\n\r\n5-\\alpha & 0-0 & 0-0 \\\\\r\n\r\n0 & 3-\\alpha & -2 \\\\\r\n\r\n0 & -1 & 2-\\alpha\r\n\r\n\\end{array}\\right|=0 \\\\\r\n\r\n\\Rightarrow \\quad(5-\\alpha)(3-\\alpha)(2-\\alpha)-2=0 \\\\\r\n\r\n\\Rightarrow \\quad(5-\\alpha)\\left(6-3 \\alpha-2 \\alpha+\\alpha^{2}-2\\right]=0 \\\\\r\n\r\n\\Rightarrow \\quad(5-\\alpha)\\left(\\alpha^{2}-5 \\alpha+4\\right]=0 \\\\\r\n\r\n\\Rightarrow \\quad(5-\\alpha)(\\alpha-1)(\\alpha-4)=0 \\\\\r\n\r\n\\Rightarrow \\quad \\alpha=1,4,5\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c66f5bfc7ab78ae7c3", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "The equation of the right bisector plane of the segment joining (2,3,4) and (6,7,8) is", "image": null}, "options": [{"id": "wh77M", "text": "$x+y+z+15=0$", "isCorrect": false, "image": null}, {"id": "frEu9", "text": "$x+y+z-15=0$", "isCorrect": true, "image": null}, {"id": "wAnEk", "text": "$x-y+z-15=0$", "isCorrect": false, "image": null}, {"id": "4xr7b", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "If the given points be $A(2,3,4)$ and $B$ $(6,7,8),$ then their mid-point $\\mathrm{N}(4,5,6)$ must lie on the plane. The direction ratios of $\\mathrm{AB}$ are $4,4,4,$ i.e. 1,1,1\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/FWpePhV8gc4X4C6HfEhqdq70nJpMuPNrtv7yGm7p36k.original.fullsize.png\"><br>\r\n\r\n$\\therefore$ The required plane passes through $\\mathrm{N}(4,5,6)$ and is normal to $\\mathrm{AB}$. Thus its equation is\r\n\r\n$$\r\n\r\n1(x-4)+1(y-5)+1(z-6)=0 \\Rightarrow x+y+z=15\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a86f5bfc7ab78ae6c6", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "What is the value of $n$ so that the angle between the lines having direction ratios (1,1,1) and $(1,-1, n)$ is $60^{\\circ} ?$", "image": null}, "options": [{"id": "UMkRh", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "1Jykp", "text": "$\\sqrt{6}$", "isCorrect": true, "image": null}, {"id": "pL3EO", "text": "3", "isCorrect": false, "image": null}, {"id": "aHMV6", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "If $\\left(l_{1}, m_{1}, n_{1}\\right)$ and $\\left(l_{2}, m_{2}, n_{2}\\right)$ are the direction ratios then angle between the lines is\r\n$\\cos \\theta=\\frac{l_{1} l_{2}+m_{1} m_{2}+n_{1} n_{2}}{\\sqrt{l_{1}^{2}+m_{1}^{2}+n_{1}^{2}} \\sqrt{l_{2}^{2}+m_{2}^{2}+n_{2}^{2}}}$\r\nHere $l_{1}=1, m_{1}=1, n_{1}=1$ and\r\n$l_{2}=1, m_{2}=-1, n_{2}=n$ and $\\theta=60^{\\circ}$\r\n$\\therefore \\cos 60^{\\circ}=\\frac{1 \\times 1+1 \\times(-1)+1 \\times n}{\\sqrt{h^{2}+1^{2}+1^{2} \\times} \\sqrt{1^{2}+1^{2}+y^{2}}}$\r\n$\\Rightarrow \\frac{1}{2}=\\frac{1}{\\sqrt{3} \\sqrt{2+n^{2}}} \\Rightarrow 3\\left(2+n^{2}\\right)=4 n^{2}$\r\n$\\Rightarrow n^{2}=6 \\Rightarrow n=\\pm \\sqrt{6}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78c6f5bfc7ab78ae5cd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "If the middle points of sides \\(\\mathrm{BC}, \\mathrm{CA} ~\\&~ \\mathrm{AB}\\) of triangle \\(A B C\\) are respectively \\(D, E, F\\) then position vector of centre of triangle \\(\\mathrm{DEF}\\), when position vector of \\(A, B, C\\) are respectively \\(\\hat{i}+\\hat{j}\\), \\(\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}}, \\hat{\\mathrm{k}}+\\hat{\\mathrm{i}}\\) is -", "image": null}, "options": [{"id": "5RO6W", "text": "\\((1 / 3)(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})\\)", "image": null, "isCorrect": false}, {"id": "CWxq4", "text": "\\((\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})\\)", "image": null, "isCorrect": false}, {"id": "Op1aX", "text": "\\(2(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})\\)", "image": null, "isCorrect": false}, {"id": "QxXtH", "text": "\\((2 / 3)(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})\\)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The position vector of points \\(D, E, F\\) are respectively\n\\(\\frac{\\mathrm{i}+\\mathrm{j}}{2}+\\mathrm{k}, \\mathrm{i}+\\frac{\\mathrm{k}+\\mathrm{j}}{2} \\text { and } \\frac{\\mathrm{i}+\\mathrm{k}}{2}+\\mathrm{j}\\)\nSo, position vector of centre of \\(\\triangle \\mathrm{DEF}\\)\n\\(=\\frac{1}{3}\\left[\\frac{\\mathrm{i}+\\mathrm{j}}{2}+\\mathrm{k}+\\mathrm{i} \\frac{\\mathrm{k}+\\mathrm{j}}{2}+\\frac{\\mathrm{i}+\\mathrm{k}}{2}+\\mathrm{j}\\right]=\\frac{2}{3}[\\mathrm{i}+\\mathrm{j}+\\mathrm{k}]\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e86f6f5bfc7ab78aee23", "title": "Plane in Space", "totalQuestions": 6, "questions": [{"_id": "67726d0fc49e8ef28ee2b3f0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "Let the acute angle bisector of the two planes $x-2 y-2 z+1=0$ and $2 x-3 y-6 z+1=0$ be the plane $P$. Then which of the following points lies on P?", "image": null}, "options": [{"id": "SIilL", "text": "$\\left(3,1,-\\frac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "SBQbi", "text": "$\\left(-2,0,-\\frac{1}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "naM8s", "text": "$(0,2,-4)$", "image": null, "isCorrect": false}, {"id": "bFu85", "text": "$(4,0,-2)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given that $P_1: x-2 y-2 z+1=0$\n$P_2: 2 x-3 y-6 z+1=0$\nEquation of plane bisectors\n$\\begin{aligned}\n& \\left|\\frac{x-2 y-2 z+1}{\\sqrt{1+4+4}}\\right|=\\left|\\frac{2 x-3 y-6 z+1}{\\sqrt{2^2+3^2+6^2}}\\right| \\\\\n& \\frac{x-2 y-2 z+1}{3}= \\pm \\frac{2 x-3 y-6 z+1}{7}\n\\end{aligned}$\nSince $\\mathrm{a}_1 \\mathrm{a}_2+\\mathrm{b}_1 \\mathrm{~b}_2+\\mathrm{c}_1 \\mathrm{c}_2=20\\gt0$\n$\\therefore$ Negative sign will be taken for acute bisector.\n$\\begin{aligned}\n& \\Rightarrow 7 x-14 y-14 z+7=-[6 x-9 y-18 z+3] \\\\\n& \\Rightarrow 13 x-23 y-32 z+10=0 \\\\\n& \\left(-2,0,-\\frac{1}{2}\\right) \\text { satisfy it }\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e80c6f5bfc7ab78aea21", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "An equation of plane parallel to plane <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>-</mo><mn>5</mn><mo>=</mo><mn>0</mn></math> and at a unit distance from the origin is", "image": null}, "options": [{"id": "JOk3U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>=</mo><mn>3</mn></math>", "isCorrect": true, "image": null}, {"id": "Rzfih", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "gqqE0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "DXU72", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Equation of plane parallel to the plane&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>-</mo><mn>5</mn><mo>=</mo><mn>0</mn></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>+</mo><mi>&#955;</mi><mo>=</mo><mn>0</mn></math></p><p>Since, this plane is unit distance from origin</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mn>1</mn><mo>=</mo><mfenced open=\"|\" close=\"|\"><mfrac><mi>&#955;</mi><msqrt><mn>1</mn><mo>+</mo><mn>4</mn><mo>+</mo><mn>4</mn></msqrt></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>|</mo><mi>&#955;</mi><mo>|</mo><mo>=</mo><mn>3</mn><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mo>&#177;</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Equation of plane is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>=</mo><mn>3</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fe6f5bfc7ab78ae9aa", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the planes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>&#183;</mo><mfenced><mrow><mn>2</mn><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mi mathvariant=\"normal\">&#955;</mi><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>+</mo><mn>3</mn><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>&#183;</mo><mfenced><mrow><mi mathvariant=\"normal\">&#955;</mi><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mn>5</mn><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>-</mo><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced><mo>=</mo><mn>5</mn></math>&nbsp;are perpendicular to each other, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#955;</mi><mn>2</mn></msup><mo>+</mo><mi>&#955;</mi></math> is", "image": null}, "options": [{"id": "erukD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>", "isCorrect": true, "image": null}, {"id": "3TQzg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "mlzsW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "Qnslx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>&#183;</mo><mfenced><mrow><mi mathvariant=\"normal\">&#955;</mi><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mn>5</mn><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>-</mo><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced><mo>=</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>&#183;</mo><mfenced><mrow><mn>2</mn><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mi mathvariant=\"normal\">&#955;</mi><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>+</mo><mn>3</mn><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p>We know that two planes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>&#183;</mo><msub><mover><mi>n</mi><mo>&#8594;</mo></mover><mn>1</mn></msub><mo>=</mo><msub><mi>d</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>&#183;</mo><msub><mover><mi>n</mi><mo>&#8594;</mo></mover><mn>2</mn></msub><mo>=</mo><msub><mi>d</mi><mn>2</mn></msub></math>&nbsp;are perpendicular if</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mi>n</mi><mo>&#8594;</mo></mover><mn>1</mn></msub><mo>&#183;</mo><msub><mover><mi>n</mi><mo>&#8594;</mo></mover><mn>2</mn></msub><mo>=</mo><mn>0</mn></math></p><p>Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi mathvariant=\"normal\">&#955;</mi><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mn>5</mn><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>-</mo><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced><mo>&#183;</mo><mfenced><mrow><mn>2</mn><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mi mathvariant=\"normal\">&#955;</mi><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>+</mo><mn>3</mn><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>&#955;</mi><mo>-</mo><mn>5</mn><mi>&#955;</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>-</mo><mn>3</mn><mi>&#955;</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#955;</mi><mn>2</mn></msup><mo>+</mo><mi>&#955;</mi><mo>=</mo><mn>0</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fe6f5bfc7ab78ae9a4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": </mn><mo>,</mo><mo>&#160;</mo><mi>x</mi><mo>-</mo><mi>z</mi><mo>=</mo><mn>0</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>0</mn></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi></mrow><msqrt><mn>3</mn></msqrt></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mi>x</mi><mo>-</mo><mi>z</mi></mrow><msqrt><mn>2</mn></msqrt></mfrac></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mi>z</mi></mrow><msqrt><mn>6</mn></msqrt></mfrac></math> respectively, then the sum of the squares of distances, is as</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced><mfrac><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi></mrow><msqrt><mn>3</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mrow><mi>x</mi><mo>-</mo><mi>z</mi></mrow><msqrt><mn>2</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mrow><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mi>z</mi></mrow><msqrt><mn>6</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><msup><mi>p</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msup><mfenced><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mn>3</mn><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mi>z</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>+</mo><mi>z</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>6</mn><msup><mi>p</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><msup><mi>y</mi><mn>2</mn></msup><mo>
