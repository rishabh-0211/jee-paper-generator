o>)</mo></math> from the plane <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>5</mn></math> measured along a straight line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>y</mi><mo>=</mo><mi>z</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>k</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> is", "image": null}, "options": [{"id": "mk3i4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "isCorrect": true, "image": null}, {"id": "pHAP2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "isCorrect": false, "image": null}, {"id": "rtIR9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "kg2tw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given equation of plane is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>5</mn></math>.</p><p>The distance measured along the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>y</mi><mo>=</mo><mi>z</mi></math>.</p><p>Direction ratios of the given line is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>)</mo></math>.</p><p>So, the equation of line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math> is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>+</mo><mn>5</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>9</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mi>&#955;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>x</mi><mo>=</mo><mi>&#955;</mi><mo>+</mo><mn>1</mn><mo>,</mo><mi>y</mi><mo>=</mo><mi>&#955;</mi><mo>-</mo><mn>5</mn><mo>,</mo><mi>z</mi><mo>=</mo><mi>&#955;</mi><mo>+</mo><mn>9</mn></math></p><p>lies on the plane <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>(</mo><mi>&#955;</mi><mo>+</mo><mn>1</mn><mo>)</mo><mo>-</mo><mo>(</mo><mo>-</mo><mi>&#955;</mi><mo>+</mo><mn>5</mn><mo>)</mo><mo>+</mo><mo>(</mo><mi>&#955;</mi><mo>+</mo><mn>9</mn><mo>)</mo><mo>=</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#955;</mi><mo>=</mo><mo>-</mo><mn>10</mn></math></p><p>The coordinate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>-</mo><mn>9</mn><mo>,</mo><mo>-</mo><mn>15</mn><mo>,</mo><mo>-</mo><mn>1</mn><mo>)</mo></math> and the coordinate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>,</mo><mo>-</mo><mn>5</mn><mo>,</mo><mn>9</mn><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><msqrt><mo>(</mo><mn>10</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>10</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>10</mn><msup><mo>)</mo><mn>2</mn></msup></msqrt><mo>=</mo><mn>10</mn><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>k</mi><mo>=</mo><mn>10</mn><msqrt><mn>3</mn></msqrt><mo>&#8658;</mo><mi>k</mi><mo>=</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b86f5bfc7ab78ae749", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "Find the angle between the two planes $2 \\mathrm{x}+\\mathrm{y}-2 \\mathrm{z}=5$ and $3 x-6 y-2 z=7$", "image": null}, "options": [{"id": "ywDnk", "text": "$\\cos ^{-1}(4 / 21)$", "isCorrect": true, "image": null}, {"id": "UyBgx", "text": "$\\cos ^{-1}(2 / 21)$", "isCorrect": false, "image": null}, {"id": "neceY", "text": "$\\cos ^{-1}(1 / 21)$", "isCorrect": false, "image": null}, {"id": "ZhLne", "text": "$\\cos ^{-1}(5 / 21)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The angle between two planes is the angle between their normals. From the equation of the planes, the normal vectors are $\\overrightarrow{\\mathrm{N}}_{1}=2 \\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-2 \\hat{\\mathrm{k}}$ and $\\overrightarrow{\\mathrm{N}}_{2}=3 \\hat{\\mathrm{i}}-6 \\hat{\\mathrm{j}}-2 \\hat{\\mathrm{k}}$\r\n\r\nTherefore, $\\cos \\theta=\\left|\\frac{\\overrightarrow{\\mathrm{N}}_{1} \\cdot \\overrightarrow{\\mathrm{N}}_{2}}{\\left|\\overrightarrow{\\mathrm{N}}_{1}\\right|\\left|\\overrightarrow{\\mathrm{N}}_{2}\\right|}\\right|$\r\n\r\n$$\r\n\r\n=\\left|\\frac{(2 \\hat{i}+\\hat{j}-2 \\hat{k}) \\cdot(3 \\hat{i}-6 \\hat{j}-2 \\hat{k})}{\\sqrt{4+1+4} \\sqrt{9+36+4}}\\right|=\\left(\\frac{4}{21}\\right)\r\n\r\n$$\r\n\r\nHence, $\\theta=\\cos ^{-1}\\left(\\frac{4}{21}\\right)$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e86f6f5bfc7ab78aee21", "title": "Line and Plane", "totalQuestions": 15, "questions": [{"_id": "67726d02c49e8ef28ee2b38d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "Let the foot of perpendicular from a point $\\mathrm{P}(1,2,-1)$ to the straight line $\\mathrm{L}: \\frac{\\mathrm{x}}{1}=\\frac{\\mathrm{y}}{0}=\\frac{\\mathrm{z}}{-1}$ be $N$. Let a line be drawn from $P$ parallel to the plane $x+y+2 z=0$ which meets $L$ at point $Q$. If $\\alpha$ is the acute angle between the lines PN and PQ , then $\\cos \\alpha$ is equal to $\\qquad$", "image": null}, "options": [{"id": "08xkU", "text": "$\\frac{1}{\\sqrt{5}}$", "image": null, "isCorrect": false}, {"id": "O6Wx2", "text": "$\\frac{\\sqrt{3}}{2}$", "image": null, "isCorrect": false}, {"id": "wsd7Z", "text": "$\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "MbyiW", "text": "$\\frac{1}{2 \\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\frac{x}{1}=\\frac{y}{0}=\\frac{z}{-1}=\\lambda$\n$\\Rightarrow \\mathrm{N}(\\lambda, 0,-\\lambda)$\n$\\overrightarrow{\\mathrm{b}}=\\hat{\\mathrm{i}}-\\hat{\\mathrm{k}}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Sq2CaVc2ymsIj3zDCnU6ZC0qMrA4so0-N7mGjbcDrIE.original.fullsize.png\"/>\n$\\because \\overrightarrow{\\mathrm{PN}} \\cdot \\overrightarrow{\\mathrm{b}}=0$\n$\\Rightarrow 1(1-\\lambda)-(\\lambda-1)=0 \\Rightarrow \\lambda=1$\n$\\Rightarrow \\mathrm{N}(1,0,-1)$\n$\\operatorname{Let} \\mathrm{Q}(\\mu, 0,-\\mu)$\n$\\because \\overrightarrow{\\mathrm{n}}=\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+2 \\hat{\\mathrm{k}}$\nNow,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/6unOMAyTnWZMACvs2t66E6nwWN4793o0Dz0qlm2yeVU.original.fullsize.png\"/>\n$\\because \\overrightarrow{\\mathrm{PQ}} \\cdot \\overrightarrow{\\mathrm{n}}=0$\n$\\Rightarrow \\mu=-1$\n$\\Rightarrow \\mathrm{Q}(-1,0,1)$\n$\\overrightarrow{\\mathrm{PN}}=2 \\hat{\\mathrm{j}}$ and $\\overrightarrow{\\mathrm{PQ}}=2 \\hat{i}+2 \\hat{j}-2 \\hat{k}$\n$\\Rightarrow \\cos \\alpha=\\frac{1}{\\sqrt{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87897ae24e9e2db8ca6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "The lines $\\frac{x-2}{1}=\\frac{y-3}{1}=\\frac{z-4}{-k}$ and $\\frac{x-1}{k}=\\frac{y-4}{2}=\\frac{z-5}{1}$ are coplanar if", "image": null}, "options": [{"id": "nAidx", "text": "$\\mathrm{k}=3$ or -2", "image": null, "isCorrect": false}, {"id": "MCAwH", "text": "$\\mathrm{k}=0$ or -1", "image": null, "isCorrect": false}, {"id": "Hyf3x", "text": "$\\mathrm{k}=1$ or -1", "image": null, "isCorrect": false}, {"id": "iFMCB", "text": "$\\mathrm{k}=0$ or -3", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Two planes are coplanar if<br />$\\left|\\begin{array}{ccc}x_2-x_1 & y_2-y_1 & z_2-z_1 \\\\ l_1 & m_1 & n_1 \\\\ l_2 & m_2 & n_2\\end{array}\\right|=0$<br />$\\left|\\begin{array}{ccc}1 & -1 & -1 \\\\ 1 & 1 & -k \\\\ k & 2 & 1\\end{array}\\right|=0$<br />Applying $\\mathrm{C}_2 \\rightarrow \\mathrm{C}_2+\\mathrm{C}_1, \\mathrm{C}_3 \\rightarrow \\mathrm{C}_3+\\mathrm{C}_1$<br />$\\Rightarrow\\left|\\begin{array}{ccc}1 & 0 & 0 \\\\ 1 & 2 & 1-k \\\\ k & k+2 & 1+k\\end{array}\\right|=0$<br />$\\Rightarrow \\quad 1[2+2 k-(k+2)(1-k)]=0$<br />$\\Rightarrow \\quad 2+2 k-\\left(-k^2-k+2\\right)=0$<br />$k^2+3 k=0 \\Rightarrow k(k+3)=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8356f5bfc7ab78aeb89", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the plane $3 x+y+2 z+6=0$ is parallel to the line $\\frac{3 x-1}{2 b}=3-y=\\frac{z-1}{a}$, then the value of $3 a+3 b$ is", "image": null}, "options": [{"id": "Ea7rK", "text": "\r\n$\\frac{1}{2}$\r\n", "isCorrect": false, "image": null}, {"id": "LKuyv", "text": "\r\n$\\frac{3}{2}$\r\n", "isCorrect": true, "image": null}, {"id": "ak4dn", "text": "\r\n3\r\n", "isCorrect": false, "image": null}, {"id": "th4Nj", "text": "\r\n4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given plane $3 x+y+2 z+6=0$\r\nand line $\\frac{x-\\frac{1}{3}}{\\frac{2 b}{3}}=\\frac{y-3}{-1}=\\frac{z-1}{a}$\r\nSince, plane is parallel to line, then\r\n$$\r\n\\begin{aligned}\r\n& 3\\left(\\frac{2 b}{3}\\right)+(1)(-1)+2(a)=0 \\\\\r\n& 2 b-1+2 a=0 \\\\\r\n& \\Rightarrow \\quad a+b=\\frac{1}{2} \\\\\r\n&\r\n\\end{aligned}\r\n$$\r\nNow, $3 a+3 b=\\frac{3}{2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e81d6f5bfc7ab78aeab8", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "The distance from the point (3,4,5) to the point where the line $\\frac{x-3}{1}=\\frac{y-4}{2}=\\frac{z-5}{2}$ meets the plane $x+y+z=17$ is", "image": null}, "options": [{"id": "28s5y", "text": "1", "isCorrect": false, "image": null}, {"id": "l4oHR", "text": "2", "isCorrect": false, "image": null}, {"id": "MmW8R", "text": "3", "isCorrect": true, "image": null}, {"id": "aPf5d", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Anypoint on the line is $(r+3,2 r+4,2 r+5)$. It lies on the plane $x+y+z=17$ $\\therefore(r+3)+(2 r+4)+(2 r+5)=17$ i.e $r=1$\r\n\r\nThus the point of intersection of the plane and the line is (4,6,7) Required distance $=$ distance between (3,4,5) and (4,6,7)\r\n\r\n$=\\sqrt{\\left\\{(4-3)^{2}+(6-4)^{2}+(7-5)^{2}\\right\\}}=3$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e80f6f5bfc7ab78aea3a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 3, "question": {"text": "Reflection of the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>4</mn></mrow><mn>1</mn></mfrac></math> in the plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>7</mn></math> is", "image": null}, "options": [{"id": "JX4cB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>4</mn></mrow><mn>1</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "8VwWO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>4</mn></mrow><mn>1</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "UUfpx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>4</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "iCOpn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>4</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>4</mn></mrow><mn>1</mn></mfrac></math> is passes through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>4</mn><mo>)</mo></math>.</p><p>To find the reflection of line we need one more point on the line clearly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>(</mo><mn>0</mn><mo>,</mo><mn>5</mn><mo>,</mo><mn>5</mn><mo>)</mo></math>&nbsp;also lie on line.</p><p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>(</mo><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi><mo>,</mo><mi>&#947;</mi><mo>)</mo></math> be the reflection <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> in the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>7</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfrac><mi>&#945;</mi><mn>2</mn></mfrac><mo>+</mo><mfrac><mrow><mi>&#946;</mi><mo>+</mo><mn>5</mn></mrow><mn>2</mn></mfrac><mo>+</mo><mfrac><mrow><mi>&#947;</mi><mo>+</mo><mn>5</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>7</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>+</mo><mi>&#947;</mi><mo>=</mo><mn>4</mn></math></p><p>Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>N</mi></math> is perpendicular, i.e. parallel to the normal of the plane</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfrac><mi>&#945;</mi><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>&#946;</mi><mo>-</mo><mn>5</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>&#947;</mi><mo>-</mo><mn>5</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mi>&#955;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#945;</mi><mo>=</mo><mi>&#955;</mi><mo>,</mo><mi>&#946;</mi><mo>=</mo><mi>&#955;</mi><mo>+</mo><mn>5</mn><mo>,</mo><mi>&#947;</mi><mo>=</mo><mi>&#955;</mi><mo>+</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>&#955;</mi><mo>+</mo><mi>&#955;</mi><mo>+</mo><mn>5</mn><mo>+</mo><mi>&#955;</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#955;</mi><mo>=</mo><mo>-</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>N</mi><mo>=</mo><mo>(</mo><mo>-</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>5</mn><mo>)</mo></math></p><p>Equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>N</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>4</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e80b6f5bfc7ab78aea17", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 1, "question": {"text": "The equation of plane containing line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>1</mn><mo>,</mo><mi>z</mi><mo>=</mo><mn>1</mn></math> and parallel to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mn>2</mn></mfrac><mo>-</mo><mfrac><mi>z</mi><mn>3</mn></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><mi>y</mi><mo>=</mo><mn>3</mn></math>&nbsp;is", "image": null}, "options": [{"id": "wckeX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>2</mn><mi>z</mi><mo>=</mo><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "gNTXx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>2</mn><mi>z</mi><mo>=</mo><mn>1</mn></math>", "isCorrect": true, "image": null}, {"id": "yuqHv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>=</mo><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "i85Le", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Equation of plane containing line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>x</mi><mo>-</mo><mi>y</mi><mo>-</mo><mn>1</mn><mo>)</mo><mo>+</mo><mi>&#955;</mi><mo>(</mo><mi>z</mi><mo>-</mo><mn>1</mn><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>x</mi><mo>-</mo><mi>y</mi><mo>+</mo><mi>&#955;</mi><mi>z</mi><mo>-</mo><mn>1</mn><mo>-</mo><mi>&#955;</mi><mo>=</mo><mn>0</mn></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p>Since, this plane is parallel to line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mn>2</mn></mfrac><mo>-</mo><mfrac><mi>z</mi><mn>3</mn></mfrac><mo>=</mo><mn>1</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>3</mn></mrow><mn>0</mn></mfrac><mo>=</mo><mfrac><mi>z</mi><mn>3</mn></mfrac></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mn>2</mn><mo>(</mo><mn>1</mn><mo>)</mo><mo>+</mo><mo>(</mo><mn>0</mn><mo>)</mo><mo>(</mo><mo>-</mo><mn>1</mn><mo>)</mo><mo>+</mo><mn>3</mn><mo>(</mo><mi>&#955;</mi><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#955;</mi><mo>=</mo><mo>-</mo><mn>2</mn><mo>/</mo><mn>3</mn></math></p><p>Putting the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math> in Eq. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mi>y</mi><mo>-</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mi>z</mi><mo>-</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>=</mo><mn>0</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mn>3</mn><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>2</mn><mi>z</mi><mo>=</mo><mn>1</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fe6f5bfc7ab78ae9a5", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "Line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mfenced><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mi>&#955;</mi></mfrac><mo>=</mo><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mfrac><mfenced><mrow><mi>z</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mrow><mo>-</mo><mn>4</mn></mrow></mfrac></math> is perpendicular to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>8</mn><mi>z</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math> is", "image": null}, "options": [{"id": "3REap", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "isCorrect": true, "image": null}, {"id": "y1RlC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>4</mn></math>", "isCorrect": false, "image": null}, {"id": "qvtwB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>5</mn></math>", "isCorrect": false, "image": null}, {"id": "wqIkd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>3</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>When line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><msub><mi>x</mi><mn>1</mn></msub></mrow><msub><mi>a</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><msub><mi>y</mi><mn>1</mn></msub></mrow><msub><mi>b</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><msub><mi>z</mi><mn>1</mn></msub></mrow><msub><mi>c</mi><mn>1</mn></msub></mfrac></math>&nbsp;is perpendicular to plane <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>x</mi><mo>+</mo><mi>b</mi><mi>y</mi><mo>+</mo><mi>c</mi><mi>z</mi><mo>+</mo><mi>d</mi><mo>=</mo><mn>0</mn></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>a</mi><mn>1</mn></msub><mi>a</mi></mfrac><mo>=</mo><mfrac><msub><mi>b</mi><mn>1</mn></msub><mi>b</mi></mfrac><mo>=</mo><mfrac><msub><mi>c</mi><mn>1</mn></msub><mi>c</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfrac><mi>&#955;</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>4</mn></mrow><mrow><mo>-</mo><mn>8</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mn>1</mn></math></p><p>Hence, option (a) is correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c66f5bfc7ab78ae7c2", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "Find the angle between the line $\\frac{x+1}{2}=\\frac{y}{3}=\\frac{z-3}{6}$\r\n\r\nand the plane $10 \\mathrm{x}+2 \\mathrm{y}-11 \\mathrm{z}=3$", "image": null}, "options": [{"id": "PCa5R", "text": "$\\sin ^{-1}\\left(\\frac{8}{21}\\right)$", "isCorrect": true, "image": null}, {"id": "VNNjv", "text": "$\\sin ^{-1}\\left(\\frac{5}{21}\\right)$", "isCorrect": false, "image": null}, {"id": "BJBsR", "text": "$\\sin ^{-1}\\left(\\frac{7}{21}\\right)$", "isCorrect": false, "image": null}, {"id": "qCie9", "text": "$\\sin ^{-1}\\left(\\frac{1}{21}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\theta$ be the angle between the line and the normal to the plane. Converting the given equations into vector form, we have $\\overrightarrow{\\mathrm{r}}=(-\\hat{\\mathrm{i}}+3 \\hat{\\mathrm{k}})+\\lambda(2 \\hat{\\mathrm{i}}+3 \\hat{\\mathrm{j}}+6 \\hat{\\mathrm{k}})$ and\r\n\r\n$$\r\n\r\n\\overrightarrow{\\mathrm{r}} \\cdot(10 \\hat{\\mathrm{i}}+2 \\hat{\\mathrm{j}}-11 \\hat{\\mathrm{k}})=3\r\n\r\n$$\r\n\r\nHere, $\\overrightarrow{\\mathrm{b}}=2 \\hat{\\mathrm{i}}+3 \\hat{\\mathrm{j}}+6 \\hat{\\mathrm{k}}$ and $\\overrightarrow{\\mathrm{n}}=10 \\hat{\\mathrm{i}}+2 \\hat{\\mathrm{j}}-11 \\hat{\\mathrm{k}}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\sin \\phi=\\left|\\frac{(2 \\hat{i}+3 \\hat{j}+6 \\hat{k}) \\cdot(10 \\hat{i}+2 \\hat{j}-11 \\hat{k})}{\\sqrt{2^{2}+3^{2}+6^{2}} \\sqrt{10^{2}+2^{2}+11^{2}}}\\right| \\\\\r\n\r\n=\\left|\\frac{-40}{7 \\times 15}\\right|=\\left|\\frac{-8}{21}\\right|=\\frac{8}{21} \\text { or } \\phi=\\sin ^{-1}\\left(\\frac{8}{21}\\right)\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b86f5bfc7ab78ae748", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "The coordinates of the point where the line through the points $\\mathrm{A}(3,4,1)$ and $\\mathrm{B}(5,1,6)$ crosses the XY-plane are", "image": null}, "options": [{"id": "W8ejB", "text": "$\\left(\\frac{13}{5}, \\frac{23}{5}, 0\\right)$", "isCorrect": true, "image": null}, {"id": "zjG2a", "text": "$\\left(-\\frac{13}{5}, \\frac{23}{5}, 0\\right)$", "isCorrect": false, "image": null}, {"id": "Tx99I", "text": "$\\left(\\frac{13}{5},-\\frac{23}{5}, 0\\right)$", "isCorrect": false, "image": null}, {"id": "LBzXv", "text": "$\\left(-\\frac{13}{5}, \\frac{-23}{5}, 0\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Equation of the line through the given points is $\\frac{x-3}{5-3}=\\frac{y-4}{1-4}=\\frac{z-1}{6-1}$\r\n\r\n$\\Rightarrow \\frac{x-3}{2}=\\frac{y-4}{-3}=\\frac{z-1}{5}$\r\n\r\nAny point on this line can be taken as $(3+$ $2 \\lambda, 4-3 \\lambda, 1+5 \\lambda)$\r\n\r\nIf this point lies on XY-plane then the z-coordinate is zero\r\n\r\n$$\r\n\r\n\\Rightarrow 1+5 \\lambda=0 \\Rightarrow \\lambda=-\\frac{1}{5}\r\n\r\n$$\r\n\r\nThus the required coordinates of the point are\r\n\r\n$$\r\n\r\n\\left(3-\\frac{2}{5}, 4-3\\left(-\\frac{1}{5}\\right), 0\\right) \\equiv\\left(\\frac{13}{5}, \\frac{23}{5}, 0\\right)\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a96f5bfc7ab78ae6c8", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "Find the coordinates of the point where the line joining the points (2,-3,1) and (3,-4,-5) cuts the plane $2 x+y+z=7$", "image": null}, "options": [{"id": "lgCoX", "text": "(1,2,-7)", "isCorrect": false, "image": null}, {"id": "KDmSo", "text": "(1,-2,7)", "isCorrect": true, "image": null}, {"id": "VNG1i", "text": "(-1,-2,7)", "isCorrect": false, "image": null}, {"id": "OEanY", "text": "(1,2,7)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The direction ratios of the line are $3-2,-4-(-3),-5-1$ i.e. 1,-1,-6\r\nHence equation of the line joining the given points is $\\frac{x-2}{1}=\\frac{y+3}{-1}=\\frac{z-1}{-6}=r($ say $)$\r\nCoordinates of any point on this line are $(r+2,-r-3,-6 r+1)$\r\nIf this point lies on the given plane $2 x+y+z=7$ then $2(r+2)+(-r-3)+(-6 r+1)=7 \\Rightarrow r=-1$\r\nCoordinates of any point on this line are $(-1+2,-(-1)-3,-6(-1)+1)$ i.e. (1,-2,7)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a96f5bfc7ab78ae6c7", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "The foot of the perpendicular from the point (7,14,5) to the plane $2 \\mathrm{x}+4 \\mathrm{y}-\\mathrm{z}=2$ are", "image": null}, "options": [{"id": "uovd0", "text": "(1,2,8)", "isCorrect": true, "image": null}, {"id": "JoEQn", "text": "(3,2,8)", "isCorrect": false, "image": null}, {"id": "NXhf0", "text": "(5,10,6)", "isCorrect": false, "image": null}, {"id": "WnnOV", "text": "(9,18,4)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We know that the length of the perpendicular from the point $\\left(x_{1}, y_{1}, z_{1}\\right)$ to the plane $a x+b y+c z+d=0$ is $\\frac{\\left|a x_{1}+b y_{1}+c z_{1}+d\\right|}{\\sqrt{a^{2}+b^{2}+c^{2}}}$\r\nand the co-ordinate $(\\alpha, \\beta, \\gamma)$ of the foot of the $\\perp$ are given by $\\frac{\\alpha-x_{1}}{a}=\\frac{\\beta-y_{1}}{b}=\\frac{\\gamma-z_{1}}{c}$\r\n$=-\\left(\\frac{a x_{1}+b y_{1}+c z_{1}+d}{a^{2}+b^{2}+c^{2}}\\right)$ ...(1)\r\nIn the given ques, $x_{1}=7, y_{1}=14, z_{1}=5$,\r\n$a=2 b=4, c=-1, d=-2$\r\nBy putting these values in (1), we get $\\frac{\\alpha-7}{2}=\\frac{\\beta-14}{4}=\\frac{\\gamma-5}{-1}=-\\frac{63}{21}$\r\n$\\Rightarrow \\alpha=1, \\beta=2$ and $\\gamma=8$\r\nHence, foot of $\\perp$ is (1,2,8)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79a6f5bfc7ab78ae650", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "Gives the line \\(L: \\frac{x-1}{3}=\\frac{y+1}{2}=\\frac{z-3}{-1}\\) and the plane \\(\\pi: x-2 y-z=0\\). Of the following assertions, the only one that is always true is", "image": null}, "options": [{"id": "iAHrn", "text": "L is \\(\\perp\\) to \\(\\pi\\)", "image": null, "isCorrect": false}, {"id": "bg6Fc", "text": "L lies in \\(\\pi\\)", "image": null, "isCorrect": true}, {"id": "Hm4A6", "text": "L is not parallel to \\(\\pi\\)", "image": null, "isCorrect": false}, {"id": "tKlKO", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since \\(3(1)+2(-2)+(-1)(-1)=3-4+1=0\\)\n\\(\\therefore\\) Given line is \\(\\perp\\) to the normal to the plane i.e., given line is parallel to the given plane.\nAlso, \\((1,-1,3)\\) lies on the plane \\(x-2 y-z=0\\) if \\(1-2(-1)-3=0\\) i.e., \\(1+2-3=0\\) which is true \\(\\therefore\\) L lies in plane \\(\\pi\\).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78c6f5bfc7ab78ae5ce", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "The perpendicular distance of \\(P(1,2,3)\\) from the line \\(\\frac{x-6}{3}=\\frac{y-7}{2}=\\frac{z-7}{-2}\\) is", "image": null}, "options": [{"id": "uljSE", "text": "7", "image": null, "isCorrect": true}, {"id": "NKGoc", "text": "5", "image": null, "isCorrect": false}, {"id": "y1Z9H", "text": "0", "image": null, "isCorrect": false}, {"id": "IoIEU", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The point \\(\\mathrm{A}(6,7,7)\\) is on the line. Let the perpendicular from \\(\\mathrm{P}\\) meet the line in \\(\\mathrm{L}\\). Then\n\\(\\mathrm{AP}^2=(6-1)^2+(7-2)^2+(7-3)^2=66\\)\nAlso \\(\\mathrm{AL}=\\) projection of AP on line\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/HO8MjbUXtl1LsNl2QTeKVPzlF5PrqFegm-npoYcSQXQ.original.fullsize.png\"><br>\n\\(\\begin{aligned}\n& \\left(\\text {actual d.c.'s } \\frac{3}{\\sqrt{17}}, \\frac{2}{\\sqrt{17}}, \\frac{-2}{\\sqrt{17}}\\right) \\\\\n\\Rightarrow & (6-1) \\cdot \\frac{3}{\\sqrt{17}}+(7-2) \\cdot \\frac{2}{\\sqrt{17}}+(7-3) \\frac{-2}{\\sqrt{17}} \\\\\n& =\\sqrt{17}\n\\end{aligned}\\)\n\\(\\therefore \\perp\\) distance \\(\\mathrm{d}\\) of \\(\\mathrm{P}\\) from the line is given by\n\\(\\mathrm{d}^2=\\mathrm{AP}^2-\\mathrm{AL}^2=66-17=49 \\text { so that } \\mathrm{d}=7\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77e6f5bfc7ab78ae54e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "If the line \\(\\frac{x-4}{1}=\\frac{y-2}{1}=\\frac{z-k}{2}\\) lies in the plane \\(2 x-4 y+z=7\\), then the value of \\(k\\) is", "image": null}, "options": [{"id": "yyYUY", "text": "4", "image": null, "isCorrect": false}, {"id": "OJ8UM", "text": "-7", "image": null, "isCorrect": false}, {"id": "tPnnF", "text": "7", "image": null, "isCorrect": true}, {"id": "smyWd", "text": "No real value", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The point \\((4,2, k)\\) on the line also lies on the plane \\(2 x-4 y+z=7\\)\nSo, \\(8-8+\\mathrm{k}=7 \\Rightarrow \\mathrm{k}=7\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77d6f5bfc7ab78ae54d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "Solution of the differential equation \\(\\frac{d y}{d x}+\\frac{y}{x}=\\sin x\\) is", "image": null}, "options": [{"id": "LHzIH", "text": "\\(x(y+\\cos x)=\\cos x+C\\)", "image": null, "isCorrect": false}, {"id": "0i40D", "text": "\\(x(y-\\cos x)=\\sin x+C\\)", "image": null, "isCorrect": false}, {"id": "x41DK", "text": "\\(x(y+\\cos x)=\\sin x+C\\)", "image": null, "isCorrect": true}, {"id": "zEq0p", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\frac{d y}{d x}+\\frac{1}{x} \\cdot y=\\sin x\\left[\\text { Type } \\frac{d y}{d x}+P y=Q\\right] \\\\\n& e^{\\int P d x}=e^{\\int \\frac{1}{x} d x}=e^{\\log x}=x\n\\end{aligned}\\)\n\\(\\therefore\\) Sol. is \\(\\mathrm{yx}=\\int \\mathrm{x} \\sin \\mathrm{xdx}+\\mathrm{C}\\)\n\\(\\begin{aligned}\n& =x(-\\cos x)-\\int 1 \\cdot(-\\cos x) d x+C \\\\\n& =-x \\cos x+\\sin x+C \\Rightarrow x(y+\\cos x)=\\sin x+C\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
