{3}=10000 \\quad \\Rightarrow h=50 \\sqrt{3}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d1bc49e8ef28ee2b44d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "From the top of a cliff 50 m high, the angles of depression of the top and bottom of a tower are observed to be $30^{\\circ}$ and $45^{\\circ}$. The height of tower is", "image": null}, "options": [{"id": "Umu7i", "text": "50 m", "image": null, "isCorrect": false}, {"id": "X8131", "text": "$50 \\sqrt{3} \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "jTyUg", "text": "$50(\\sqrt{3}-1) \\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "3YG2U", "text": "$50\\left(1-\\frac{\\sqrt{3}}{3}\\right) \\mathrm{m}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Accoding to condition,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/S-za6gK9MOlwEMop04Bh1Vi8uXSmp7yxhyO-lxrmfco.original.fullsize.png\"/>\nLet, height of tower $=h$\nIn $\\triangle A B D, \\quad \\tan 45^{\\circ}=\\frac{A B}{B D} \\Rightarrow B D=50 \\mathrm{~m}$\nNow, In $\\triangle A C C^{\\prime}$\n$\\begin{aligned}\n& & \\tan 30^{\\circ} & =\\frac{A C^{\\prime}}{C^{\\prime} C} \\\\\n\\Rightarrow & & \\frac{1}{\\sqrt{3}} & =\\frac{50-h}{50} \\\\\n\\Rightarrow & & 50 & =50 \\sqrt{3}-h \\sqrt{3} \\\\\n\\Rightarrow & & h \\sqrt{3} & =50(\\sqrt{3}-1) \\\\\n& & h & =50\\left(1-\\frac{1}{\\sqrt{3}}\\right) \\\\\n& & & =50\\left(1-\\frac{\\sqrt{3}}{3}\\right) \\mathrm{m}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8366f5bfc7ab78aeb94", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 1, "question": {"text": "A house subtends a right angle at the window of a opposite house and the angle of elevation of the window from the bottom of the first house is $60$. If the distance between two houses be $6 \\mathrm{~m}$, then the height of the first house is", "image": null}, "options": [{"id": "44nHh", "text": "\r\n$8 \\sqrt{3} \\mathrm{~m}$\r\n", "isCorrect": true, "image": null}, {"id": "rf0NQ", "text": "\r\n$6 \\sqrt{3} \\mathrm{~m}$\r\n", "isCorrect": false, "image": null}, {"id": "1fL75", "text": "\r\n$4 \\sqrt{3} \\mathrm{~m}$\r\n", "isCorrect": false, "image": null}, {"id": "cvxDk", "text": "\r\nNone of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $P Q$ be the house subtending a right angle at the window $B$ of opposite house $A B$\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/0V7dsPYHXJPSlfmOThYsY38RGsVYM4qnm7QqqLpWp0s.original.fullsize.png\"><br>\r\nIn $\\triangle P A B$, we have \r\n$\\tan 60^{\\circ}=\\frac{A B}{6}=A B=6 \\sqrt{3} \\mathrm{~m}$\r\nIn $\\triangle C B Q$, we have\r\n$\\tan 30^{\\circ}=\\frac{h-C P}{B C}$\r\n$\\begin{array}{ll}\\Rightarrow & \\frac{1}{\\sqrt{3}}=\\frac{h-6 \\sqrt{3}}{6} \\quad[\\because A B=C P, B C=A P] \\\\ \\Rightarrow & h=6\\left(\\sqrt{3}+\\frac{1}{\\sqrt{3}}\\right) \\\\ \\Rightarrow & h=8 \\sqrt{3} \\mathrm{~m}\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8346f5bfc7ab78aeb85", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let $\\alpha$ be the solution of $16^{\\sin ^2 \\theta}+16^{\\cos ^2 \\theta}=10$ in $\\left(0, \\frac{\\pi}{4}\\right)$. If the shadow of a vertical pole is $\\frac{1}{\\sqrt{3}}$ of its height, then the altitude of the sun is", "image": null}, "options": [{"id": "CD83W", "text": "\r\n$\\alpha$\r\n", "isCorrect": false, "image": null}, {"id": "5PAPU", "text": "\r\n$\\frac{\\alpha}{2}$\r\n", "isCorrect": false, "image": null}, {"id": "Pkc7b", "text": "\r\n$2 \\alpha$\r\n", "isCorrect": true, "image": null}, {"id": "cbONo", "text": "\r\n$\\frac{\\alpha}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have,\r\n$16^{\\sin ^2 \\theta}+16^{\\cos ^2 \\theta}=10$\r\n$\\Rightarrow \\quad 16^{\\sin ^2 \\theta}+16^{1-\\sin ^2 \\theta}=10$\r\n$\\Rightarrow x+\\frac{16}{x}=10$, where $x=16^{\\sin ^2 \\theta}$\r\n$\\Rightarrow \\quad x^2-10 x+16=0 \\Rightarrow x=2,8$\r\n$\\therefore \\quad 16^{\\sin ^2 \\theta}=2,8 \\Rightarrow 2^{4 \\sin ^2 \\theta}=2,2^3$\r\n$\\Rightarrow \\quad 4 \\sin ^2 \\theta=1,3 \\Rightarrow \\sin ^2 \\theta=\\frac{1}{4},\\left(\\frac{\\sqrt{3}}{2}\\right)^2$\r\n$\\Rightarrow \\quad \\sin \\theta=\\frac{1}{2}, \\frac{\\sqrt{3}}{2} \\Rightarrow \\theta=\\frac{\\pi}{6}, \\frac{\\pi}{3}$\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/S5pOq2wkF-enUh0phx2RJpTLusnmaGSnw_vsT1ydx70.original.fullsize.png\"><br>\r\nLet the altitude of the sun be $\\theta$. Then,\r\n$$\r\n\\begin{aligned}\r\n& & \\tan \\theta & =\\frac{h}{h / \\sqrt{3}} \\Rightarrow \\tan \\theta=\\sqrt{3} \\\\\r\n\\Rightarrow \\quad & & \\theta & =\\pi / 3 \\Rightarrow \\theta=2 \\alpha\r\n\\end{aligned}\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e81b6f5bfc7ab78aeaa8", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "$\\mathrm{ABC}$ is a triangular park with $\\mathrm{AB}=\\mathrm{AC}=100 \\mathrm{~m} . \\mathrm{A}$ TV tower stands at the mid-point of $\\mathrm{BC}$. The angles of elevation of the top of the tower at A, B, C are $45^{\\circ}, 60^{\\circ}, 60^{\\circ}$ respectively. The height of the tower is", "image": null}, "options": [{"id": "npMLF", "text": "$50 \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "fRvfP", "text": "$50 \\sqrt{3} \\mathrm{~m}$", "isCorrect": true, "image": null}, {"id": "jiM2l", "text": "$50 \\sqrt{2} \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "cc6bS", "text": "$50(3-\\sqrt{3}) \\mathrm{m}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\tan 45^{\\circ}=\\frac{\\mathrm{PQ}}{\\mathrm{AQ}}=\\frac{\\mathrm{h}}{\\mathrm{AQ}} \\Rightarrow \\mathrm{h}=\\mathrm{AQ}$\r\n\r\nWhere $\\mathrm{PQ}$ is tower and $\\mathrm{ABC}$ is the park, with $\\mathrm{Q}$ being mid point of the side $\\mathrm{BC}$ and $\\mathrm{PQ}=\\mathrm{h}$ Also, $A Q^{2}+B Q^{2}=100^{2}$\r\n\r\n$\\Rightarrow \\mathrm{h}^{2}+\\mathrm{h}^{2} \\cot ^{2} 60^{\\circ}=100^{2}$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/tuAM6FNFOsmKk75aDThfd9hkBNGpcAj1vMCBk-QdOjY.original.fullsize.png\"><br>\r\n\r\n$\\Rightarrow \\mathrm{h}^{2}\\left[1+\\frac{1}{3}\\right]=100^{2}$\r\n\r\n$\\Rightarrow \\mathrm{h}^{2}=\\frac{3 \\times 100^{2}}{4} \\Rightarrow \\mathrm{h}=50 \\sqrt{3}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79b6f5bfc7ab78ae651", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "A ladder rests against a wall so that its top touches the roof of the house. If the ladder makes an angle of \\(60^{\\circ}\\) with the horizontal and height of the house be \\(6 \\sqrt{3}\\) meters, then the length of the ladder in meters is", "image": null}, "options": [{"id": "Im9WX", "text": "\\(12 \\sqrt{3}\\)", "image": null, "isCorrect": false}, {"id": "8Qo17", "text": "12", "image": null, "isCorrect": true}, {"id": "09lfJ", "text": "\\(12 / \\sqrt{3}\\)", "image": null, "isCorrect": false}, {"id": "FFrPg", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Length of ladder \\(=\\frac{6 \\sqrt{3}}{\\sin 60^{\\circ}}=12 \\mathrm{~m}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77e6f5bfc7ab78ae552", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "In a triangle \\(\\mathrm{ABC}, \\angle \\mathrm{C}=90^{\\circ}\\), then \\(\\frac{a^2-b^2}{a^2+b^2}\\) is equal to :", "image": null}, "options": [{"id": "hr5z9", "text": "\\(\\sin (\\mathrm{A}+\\mathrm{B})\\)", "image": null, "isCorrect": false}, {"id": "OsfPb", "text": "\\(\\sin (A-B)\\)", "image": null, "isCorrect": true}, {"id": "mbTPP", "text": "\\(\\cos (\\mathrm{A}+\\mathrm{B})\\)", "image": null, "isCorrect": false}, {"id": "PrTK9", "text": "\\(\\sin \\left(\\frac{\\mathrm{A}-\\mathrm{B}}{2}\\right)\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\mathrm{A}+\\mathrm{B}=180^{\\circ}-\\mathrm{C}=90^{\\circ} \\\\\n& \\mathrm{a}=2 \\mathrm{R} \\sin \\mathrm{A}, b=2 \\mathrm{R} \\sin \\mathrm{B}, c=2 \\mathrm{R} \\sin \\mathrm{C} \\\\\n& \\begin{array}{l}\n\\therefore \\frac{a^2-b^2}{a^2+b^2}=\\frac{\\sin ^2 \\mathrm{~A}-\\sin ^2 \\mathrm{~B}}{\\sin ^2 \\mathrm{~A}+\\sin ^2 \\mathrm{~B}} \\\\\n\\quad=\\frac{\\sin (\\mathrm{A}+\\mathrm{B}) \\sin (\\mathrm{A}-\\mathrm{B})}{\\sin ^2 \\mathrm{~A}+\\sin ^2\\left(90^{\\circ}-\\mathrm{A}\\right)} \\\\\n{\\left[\\because \\mathrm{A}+\\mathrm{B}=90^{\\circ}\\right]} \\\\\n=\\frac{\\sin 90^{\\circ} \\sin (\\mathrm{A}-\\mathrm{B})}{\\sin ^2 \\mathrm{~A}+\\cos ^2 \\mathrm{~A}}=\\sin (\\mathrm{A}-\\mathrm{B})\n\\end{array}\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
