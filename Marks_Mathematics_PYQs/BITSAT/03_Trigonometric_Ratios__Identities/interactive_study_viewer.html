d": null}, {"_id": "64c0e7d56f5bfc7ab78ae841", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "If $\\frac{\\cos A}{\\cos B}=n, \\frac{\\sin A}{\\sin B}=m$, then the value of $\\left(m^{2}-n^{2}\\right) \\sin ^{2} B$ is", "image": null}, "options": [{"id": "gZ5gT", "text": "$1+\\mathrm{n}^{2}$", "isCorrect": false, "image": null}, {"id": "rWbmR", "text": "$1-\\mathrm{n}^{2}$", "isCorrect": true, "image": null}, {"id": "gH7NL", "text": "$\\mathrm{n}^{2}$", "isCorrect": false, "image": null}, {"id": "8HVZ1", "text": "$-\\mathrm{n}^{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\cos A=n \\cos B$ and $\\sin A=m \\sin B$\r\n\r\nSquaring and adding, we get $1=n^{2} \\cos ^{2} B+m^{2} \\sin ^{2} B$\r\n\r\n$$\r\n\r\n\\begin{array}{ll}\r\n\r\n\\Rightarrow & 1=n^{2}\\left(1-\\sin ^{2} B\\right)+m^{2} \\sin ^{2} B \\\\\r\n\r\n\\therefore & \\left(m^{2}-n^{2}\\right) \\sin ^{2} B=1-n^{2}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c46f5bfc7ab78ae7b0", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "An arch of a bridge is semi-elliptical with major axis horizontal. If the length the base is 9 meter and the highest part of the bridge is 3 meter from the horizontal; the best approximation of the height of the arch. 2 meter from the centre of the base is", "image": null}, "options": [{"id": "GDvbY", "text": "$11 / 4 \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "bzApR", "text": "$8 / 3 \\mathrm{~m}$", "isCorrect": true, "image": null}, {"id": "1gxkH", "text": "$7 / 2 \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "9YRIH", "text": "$2 \\mathrm{~m}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/2hq8a_AlD6WCdS2CUiDQ8R63IEfVVdLzZaSb81arPZ0.original.fullsize.png\"><br>\r\n\r\nThe equation of the ellipse is\r\n\r\n$$\r\n\r\n\\frac{x^{2}}{\\left(\\frac{9}{2}\\right)^{2}}+\\frac{y^{2}}{9}=1\r\n\r\n$$\r\n\r\nWhere centre is assumed as origin and base as $x$ -axis. Put $x=2,$ we get\r\n\r\n$$\r\n\r\n\\frac{16}{81}+\\frac{\\mathrm{y}^{2}}{9}=1 \\Rightarrow \\mathrm{y}=\\frac{\\sqrt{65}}{3} \\approx \\frac{8}{3} \\mathrm{~m}\r\n\r\n$$\r\n\r\n(approximately)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b46f5bfc7ab78ae722", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $x \\sin ^{3} \\theta+y \\cos ^{3} \\theta=\\sin \\theta \\cos \\theta$ and\r\n\r\n$x \\sin \\theta=y \\cos \\theta,$ then $x^{2}+y^{2}=$", "image": null}, "options": [{"id": "gKf84", "text": "1", "isCorrect": true, "image": null}, {"id": "wCaVg", "text": "2", "isCorrect": false, "image": null}, {"id": "QVfF7", "text": "0", "isCorrect": false, "image": null}, {"id": "6BK26", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$x \\sin ^{3} \\theta+y \\cos ^{3} \\theta=\\sin \\theta \\cos \\theta$\r\n\r\nand $x \\sin \\theta=y \\cos \\theta$\r\n\r\nEquation (i) may be written as $x \\sin \\theta \\cdot \\sin ^{2} \\theta+y \\cos ^{3} \\theta=\\sin \\theta \\cos \\theta$\r\n\r\n$\\Rightarrow y \\cos \\theta \\sin ^{2} \\theta+y \\cos ^{3} \\theta=\\sin \\theta \\cos \\theta$\r\n\r\n$\\Rightarrow y \\cos \\theta\\left(\\sin ^{2} \\theta+\\cos ^{2} \\theta\\right)=\\sin \\theta \\cos \\theta$\r\n\r\n$\\Rightarrow y \\cos \\theta=\\sin \\theta \\cos \\theta \\therefore y=\\sin \\theta \\quad \\ldots$\r\n\r\nPutting the value of y from\r\n\r\n(iii) in (ii), we get $\\mathrm{x} \\sin \\theta=\\sin \\theta \\cdot \\cos \\theta \\Rightarrow \\mathrm{x}=\\cos \\theta \\quad \\ldots$ (iv)\r\n\r\nSquaring (iii) and (iv) and adding, we get $\\mathrm{x}^{2}+\\mathrm{y}^{2}=\\cos ^{2} \\theta+\\sin ^{2} \\theta=1$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7966f5bfc7ab78ae62a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "\\(\\frac{\\cos \\theta}{1-\\tan \\theta}+\\frac{\\sin \\theta}{1-\\cot \\theta}\\) is equal to", "image": null}, "options": [{"id": "14pVg", "text": "\\(\\sin \\theta-\\cos \\theta\\)", "image": null, "isCorrect": false}, {"id": "uCSJT", "text": "\\(\\sin \\theta+\\cos \\theta\\)", "image": null, "isCorrect": true}, {"id": "iSb7W", "text": "\\(\\tan \\theta+\\cot \\theta\\)", "image": null, "isCorrect": false}, {"id": "No2ak", "text": "\\(\\tan \\theta-\\cot \\theta\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\frac{\\cos \\theta}{1-\\tan \\theta}+\\frac{\\sin \\theta}{1-\\cot \\theta}=\\frac{\\cos \\theta}{1-\\frac{\\sin \\theta}{\\cos \\theta}}+\\frac{\\sin \\theta}{1-\\frac{\\cos \\theta}{\\sin \\theta}} \\\\\n= & \\frac{\\cos ^2 \\theta}{\\cos \\theta-\\sin \\theta}-\\frac{\\sin ^2 \\theta}{\\cos \\theta-\\sin \\theta}=\\cos \\theta+\\sin \\theta\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e86b6f5bfc7ab78aedfa", "title": "Sum and Difference & Multiple angle Formula", "totalQuestions": 5, "questions": [{"_id": "67726d0bc49e8ef28ee2b3cf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "The sum of all values of $x$ in $[0,2 \\pi]$, for which $\\sin x+\\sin 2 x+\\sin 3 x+\\sin 4 x=0$, is equal to :", "image": null}, "options": [{"id": "BB480", "text": "$8 \\pi$", "image": null, "isCorrect": false}, {"id": "vmQ9P", "text": "$11 \\pi$", "image": null, "isCorrect": false}, {"id": "tBcie", "text": "$12 \\pi$", "image": null, "isCorrect": false}, {"id": "tbH3f", "text": "$9 \\pi$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$(\\sin x+\\sin 4 x)+(\\sin 2 x+\\sin 3 x)=0$\n$\\Rightarrow 2 \\sin \\frac{5 x}{2} \\cdot \\cos \\frac{3 x}{2}+2 \\sin \\frac{5 x}{2} \\cdot \\cos \\frac{x}{2}=0$\n$\\Rightarrow 2 \\sin \\frac{5 x}{2}\\left\\{\\cos \\frac{3 x}{2}+\\cos \\frac{x}{2}\\right\\}=0$\n$\\Rightarrow 2 \\sin \\frac{5 x}{2}\\left\\{2 \\cos x \\cos \\frac{x}{2}\\right\\}=0$\n$2 \\sin \\frac{5 x}{2}=0 \\Rightarrow \\frac{5 x}{2}=0, \\pi, 2 \\pi, 3 \\pi, 4 \\pi, 5 \\pi, \\ldots$\n$\\Rightarrow x=0, \\frac{2 \\pi}{5}, \\frac{4 \\pi}{5}, \\frac{6 \\pi}{5}, \\frac{8 \\pi}{5}, 2 \\pi$\n$\\cos \\frac{x}{2}=0 \\Rightarrow \\frac{x}{2}=\\frac{\\pi}{2} \\Rightarrow x=\\pi ;$\n$\\cos x=0 \\Rightarrow x=\\frac{\\pi}{2}, \\frac{3 \\pi}{2}$\nSo, sum $=6 \\pi+\\pi+2 \\pi=9 \\pi$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c26f5bfc7ab78ae7a0", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "$\\cos ^{2}\\left(\\frac{\\pi}{6}+\\theta\\right)-\\sin ^{2}\\left(\\frac{\\pi}{6}-\\theta\\right)=$", "image": null}, "options": [{"id": "ByFBj", "text": "$\\frac{1}{2} \\cos 2 \\theta$", "isCorrect": true, "image": null}, {"id": "K2J2g", "text": "0", "isCorrect": false, "image": null}, {"id": "zmazA", "text": "$-\\frac{1}{2} \\cos 2 \\theta$", "isCorrect": false, "image": null}, {"id": "jTiHp", "text": "$\\frac{1}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\cos ^{2}\\left(\\frac{\\pi}{6}+\\theta\\right)-\\sin ^{2}\\left(\\frac{\\pi}{6}-\\theta\\right) \\\\ &=\\cos \\left(\\frac{\\pi}{6}+\\theta+\\frac{\\pi}{6}-\\theta\\right) \\cos \\left(\\frac{\\pi}{6}+\\theta-\\frac{\\pi}{6}+\\theta\\right) \\\\ &=\\cos \\frac{2 \\pi}{6} \\cos 2 \\theta=\\frac{1}{2} \\cos 2 \\theta \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b86f5bfc7ab78ae74c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 3, "question": {"text": "An object is obseved from the points $A, B$ and C lying in a horizontal straight line which passes directly underneath the object. The angular elevation at $\\mathrm{B}$ is twice that at $\\mathrm{A}$ and at $\\mathrm{C}$ three times that at $\\mathrm{A} .$ It $\\mathrm{AB}=a, \\mathrm{BC}=b$, then the height of the object is", "image": null}, "options": [{"id": "jRlLS", "text": "$\\frac{b}{2 a} \\sqrt{(a+b)(3 b-a)}$", "isCorrect": false, "image": null}, {"id": "h9zt5", "text": "$\\frac{a}{b} \\sqrt{(a+b)(3 b-a)}$", "isCorrect": false, "image": null}, {"id": "cgM78", "text": "$\\frac{\\mathrm{a}}{2 \\mathrm{~b}} \\sqrt{(\\mathrm{a}+\\mathrm{b})(3 \\mathrm{~b}-\\mathrm{a})}$", "isCorrect": true, "image": null}, {"id": "LTkVT", "text": "$\\frac{2 a}{b} \\sqrt{(a+b)(3 b-a)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/rwdKoQrfKyk9Z0EX5JJEz95pGwrs8huU3BDOAEBcdXk.original.fullsize.png\"><br>\r\n\r\nLet $\\mathrm{ED}=h, \\angle \\mathrm{EAB}=\\alpha$\r\n\r\n$\\therefore \\quad \\angle \\mathrm{EBD}=2 \\alpha, \\angle \\mathrm{ECD}=3 \\alpha$\r\n\r\nNow, $\\angle \\mathrm{DBE}=\\angle \\mathrm{EAB}+\\angle \\mathrm{BEA}$\r\n\r\n$\\Rightarrow \\quad 2 \\alpha=\\alpha+\\angle \\mathrm{BEA}$\r\n\r\n$\\Rightarrow \\quad \\angle \\mathrm{BEA}=\\alpha=\\angle \\mathrm{EAB}$\r\n\r\n$\\Rightarrow \\mathrm{AB}=\\mathrm{EB}=a$\r\n\r\nSimilarly, $\\angle \\mathrm{EBC}=\\alpha$ $\\operatorname{In} \\Delta \\mathrm{EBC}, \\frac{\\mathrm{BC}}{\\sin \\alpha}=\\frac{\\mathrm{EB}}{\\sin \\left(180^{\\circ}-3 \\alpha\\right)}$\r\n\r\n$\\Rightarrow \\frac{b}{\\sin \\alpha}=\\frac{a}{\\sin 3 \\alpha} \\Rightarrow \\frac{a}{b}=\\frac{\\sin 3 \\alpha}{\\sin 3 \\alpha}$\r\n\r\n$\\Rightarrow \\quad \\frac{a}{b}=\\frac{3 \\sin \\alpha-4 \\sin ^{3} \\alpha}{\\sin \\alpha}=3-4 \\sin ^{2} \\alpha$\r\n\r\n$\\Rightarrow 4 \\sin ^{2} \\alpha=3-\\frac{a}{b}=\\frac{3 b-a}{b}$\r\n\r\n$\\Rightarrow \\sin \\alpha=\\sqrt{\\frac{3 b-a}{4 b}}$\r\n\r\nIn $\\Delta \\mathrm{EBD}, \\sin 2 \\alpha=\\frac{E D}{E B}$\r\n\r\n$\\Rightarrow \\quad \\mathrm{ED}=\\mathrm{a} \\cdot 2 \\sin \\alpha \\cdot \\cos \\alpha$\r\n\r\n$\\Rightarrow h=2 a \\sqrt{\\frac{3 b-a}{4 b}}, \\sqrt{1-\\frac{3 b-a}{4 b}}$\r\n\r\n$=2 a \\sqrt{\\frac{3 b-a}{4 b}} \\sqrt{\\frac{b-a}{4 b}}$\r\n\r\n$=\\frac{a}{2 b} \\sqrt{(a+b)(3 b-a)}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a46f5bfc7ab78ae6a6", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 3, "question": {"text": "If $\\sin ^{2} \\theta+\\sin ^{2} \\phi=1 / 2, \\cos ^{2} \\theta+\\cos ^{2} \\phi=3 / 2,$ then $\\cos ^{2}(\\theta-\\phi)$ is equal to", "image": null}, "options": [{"id": "KEmF1", "text": "$3 / 8$", "isCorrect": false, "image": null}, {"id": "3p7H8", "text": "$5 / 8$", "isCorrect": true, "image": null}, {"id": "dccqN", "text": "$3 / 4$", "isCorrect": false, "image": null}, {"id": "oozdH", "text": "$5 / 4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using cosine formula \r\n$2 \\sin (\\theta+\\phi) \\cos (\\theta-\\phi)=1 / 2$ ...(i)\r\n$2 \\cos (\\theta+\\phi) \\cos (\\theta-\\phi)=3 / 2$ ...(ii)\r\nSquaring (1) and (2) and then adding $\\cos ^{2}(\\theta-\\phi)=\\frac{1}{4}+\\frac{9}{4}=\\frac{5}{2} \\Rightarrow \\cos ^{2}(\\theta-\\phi)=\\frac{5}{8}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7966f5bfc7ab78ae628", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "If, \\(\\tan \\mathrm{A}=\\frac{1}{2}\\) and \\(\\tan B=\\frac{1}{3}\\), then find the value of \\(\\mathrm{A}+\\mathrm{B}\\)", "image": null}, "options": [{"id": "s0jD3", "text": "\\(\\pi\\)", "image": null, "isCorrect": false}, {"id": "GhI1P", "text": "\\(\\frac{\\pi}{2}\\)", "image": null, "isCorrect": false}, {"id": "crgYa", "text": "\\(\\frac{\\pi}{4}\\)", "image": null, "isCorrect":     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
