t": true, "image": null}], "correctValue": null, "solution": {"text": "The position vector of points $D, E, F$ are respectively $\\hat{i}+\\hat{j}+\\hat{k}, \\hat{i}+\\frac{\\hat{k}+\\hat{j}}{2}$ and $\\frac{\\hat{i}+\\hat{k}}{2}+\\hat{j}$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/0a-Uy1XmUWvPVWLHzrK4nTHUIIX4kCwelvlDzp_CzjA.original.fullsize.png\"><br>\r\n\r\nSo, position vector of centre of $\\Delta \\mathrm{DEF}$ $=\\frac{1}{3}\\left[\\frac{\\hat{i}+\\hat{j}}{2}+\\hat{k}+\\hat{i} \\frac{\\hat{k}+\\hat{j}}{2}+\\frac{\\hat{i}+\\hat{k}}{2}+\\hat{j}\\right]$\r\n\r\n$=\\frac{2}{3}[\\hat{i}+\\hat{j}+\\hat{k}]$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b86f5bfc7ab78ae747", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "If vectors $2 \\mathrm{i}-\\mathrm{j}+\\mathrm{k}, \\mathrm{i}+2 \\mathrm{j}-3 \\mathrm{k}$ and $3 \\mathrm{i}+\\mathrm{aj}+5 \\mathrm{k}$ are\r\n\r\ncoplanar, then the value of a is", "image": null}, "options": [{"id": "LPegY", "text": "2", "isCorrect": false, "image": null}, {"id": "wMq4A", "text": "-2", "isCorrect": false, "image": null}, {"id": "xlmQv", "text": "-1", "isCorrect": false, "image": null}, {"id": "jZR9f", "text": "-4", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "If given vectors are coplanar, then there exists two scalar quantities $\\mathrm{x}$ and $\\mathrm{y}$ such that $2 \\hat{i}-\\hat{j}+\\hat{k}=x(\\hat{i}+2 \\hat{j}-3 \\hat{k})+y(3 \\hat{i}+a \\hat{j}+5 \\hat{k})$\r\n\r\nComparing coefficient of $\\hat{i}, \\hat{j}$ and $\\hat{k}$ on both sides of (1) we get $x+3 y=2,2 x+a y=-1,-3 x+5 y=1 \\ldots(2)$\r\n\r\nSolving first and third equations, we get $\\mathrm{x}=1 / 2, \\mathrm{y}=1 / 2$\r\n\r\nSince the vectors are coplanar, therefore these values of $x$ and $y$ will satisfy the equation $2 x+a y=-1$\r\n\r\n$\\therefore 2(1 / 2)+a(1 / 2)=-1 \\Rightarrow a=-4$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b86f5bfc7ab78ae746", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $\\vec{a}, \\vec{b}, \\vec{c}$ are three unit vectors such that $\\vec{a}+\\vec{b}+\\vec{c}=\\overrightarrow{0},$ where $\\overrightarrow{0}$ is null vector, then $\\vec{a} \\cdot \\vec{b}+\\vec{b} \\cdot \\vec{c}+\\vec{c} \\cdot \\vec{a}$ is :", "image": null}, "options": [{"id": "PUpEg", "text": "-3", "isCorrect": false, "image": null}, {"id": "v4ZoO", "text": "-2", "isCorrect": false, "image": null}, {"id": "cohpV", "text": "$-\\frac{3}{2}$", "isCorrect": true, "image": null}, {"id": "9X4GG", "text": "0", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have $\\vec{a}+\\vec{b}+\\vec{c}=\\overrightarrow{0}$\r\n\r\n$|\\vec{a}+\\vec{b}+\\vec{c}|=0 \\Rightarrow|\\vec{a}+\\vec{b}+\\vec{c}|^{2}=0$\r\n\r\n$\\Rightarrow|\\vec{a}|^{2}+|\\vec{b}|^{2}+|\\vec{c}|^{2}$\r\n\r\n$+2(\\vec{a} \\cdot \\vec{b}+\\vec{b} \\cdot \\vec{c}+\\vec{c} \\cdot \\vec{a})=0$\r\n\r\n$\\Rightarrow 1+1+1+2(\\vec{a} \\cdot \\vec{b}+\\vec{b} \\cdot \\vec{c}+\\vec{c} \\cdot \\vec{a})=0$\r\n\r\n$\\Rightarrow \\vec{a} \\cdot \\vec{b}+\\bar{b} \\cdot \\vec{c}+\\bar{c} \\cdot \\bar{a}=-\\frac{3}{2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79a6f5bfc7ab78ae64f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "Two vectors \\(\\vec{A}\\) and \\(\\vec{B}\\) are such that \\(|\\overrightarrow{\\mathrm{A}}+\\overrightarrow{\\mathrm{B}}|=|\\overrightarrow{\\mathrm{A}}-\\overrightarrow{\\mathrm{B}}|\\). The angle between the two vectors will be-", "image": null}, "options": [{"id": "YPoSF", "text": "\\(60^{\\circ}\\)", "image": null, "isCorrect": false}, {"id": "QVOga", "text": "\\(90^{\\circ}\\)", "image": null, "isCorrect": true}, {"id": "C0uM3", "text": "\\(180^{\\circ}\\)", "image": null, "isCorrect": false}, {"id": "OxhnK", "text": "\\(0^{\\circ}\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\overrightarrow{\\mathrm{A}}+\\overrightarrow{\\mathrm{B}}|=| \\overrightarrow{\\mathrm{A}}-\\overrightarrow{\\mathrm{B}} \\mid\\)\n\\(\\Rightarrow \\sqrt{\\mathrm{A}^2+\\mathrm{B}^2+2 \\mathrm{AB} \\cos \\theta}=\\sqrt{\\mathrm{A}^2+\\mathrm{B}^2-2 \\mathrm{AB} \\cos \\theta}\\)\nSquaring both the sides, we get\n\\(\\overrightarrow{\\mathrm{A}}^2+\\overrightarrow{\\mathrm{B}}^2+2 \\overrightarrow{\\mathrm{A}} \\overrightarrow{\\mathrm{B}} \\cos \\theta=\\overrightarrow{\\mathrm{A}}^2+\\overrightarrow{\\mathrm{B}}^2-2 \\overrightarrow{\\mathrm{A}} \\overrightarrow{\\mathrm{B}} \\cos \\theta\\)\nor \\(4 \\overrightarrow{\\mathrm{A}} \\overrightarrow{\\mathrm{B}} \\cos \\theta=0\\) or \\(\\cos \\theta=0\\) (since the scalar or dot product is zero). Therefore angle between \\(\\overrightarrow{\\mathrm{A}}\\) to \\(\\overrightarrow{\\mathrm{B}}\\) is \\(90^{\\circ}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78c6f5bfc7ab78ae5cc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "With respect to a rectangular cartesian coordinate system, three vectors are expressed as :\n\\(\\vec{a}=4 \\hat{i}-\\hat{j}, \\vec{b}=-3 \\hat{i}+2 \\hat{j}\\) and \\(\\vec{c}=-\\hat{k} \\quad\\) where \\(\\hat{\\mathrm{i}}, \\hat{\\mathrm{j}}, \\hat{\\mathrm{k}}\\) are unit vectors, along the \\(X\\), \\(Y\\) and \\(Z\\)-axis respectively. The unit vector \\(\\hat{r}\\) along the direction of sum of these vector is -", "image": null}, "options": [{"id": "6j5Sd", "text": "\\(\\hat{\\mathrm{r}}=\\frac{1}{\\sqrt{3}}(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-\\hat{\\mathrm{k}})\\)", "image": null, "isCorrect": true}, {"id": "3Jesv", "text": "\\(\\hat{\\mathrm{r}}=\\frac{1}{\\sqrt{2}}(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-\\hat{\\mathrm{k}})\\)", "image": null, "isCorrect": false}, {"id": "CXTRZ", "text": "\\(\\hat{\\mathrm{i}}=\\frac{1}{3}(\\hat{\\mathrm{i}}-\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})\\)", "image": null, "isCorrect": false}, {"id": "W0fPb", "text": "\\(\\hat{\\mathrm{r}}=\\frac{1}{\\sqrt{2}}(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\overrightarrow{\\mathrm{r}}=\\overrightarrow{\\mathrm{a}}+\\overrightarrow{\\mathrm{b}}+\\overrightarrow{\\mathrm{c}}=4 \\hat{\\mathrm{i}}-\\hat{\\mathrm{j}}-3 \\hat{\\mathrm{i}}+2 \\hat{\\mathrm{j}}-\\hat{\\mathrm{k}}=\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-\\hat{\\mathrm{k}} \\\\\n& \\hat{\\mathrm{r}}=\\frac{\\overrightarrow{\\mathrm{r}}}{|\\mathrm{r}|}=\\frac{\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-\\hat{\\mathrm{k}}}{\\sqrt{1^2+1^2+(-1)^2}}=\\frac{\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-\\hat{\\mathrm{k}}}{\\sqrt{3}}\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78c6f5bfc7ab78ae5cb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "Which one of the following is the unit vector perpendicular to both \\(\\vec{a}=-\\hat{i}+\\hat{j}+\\hat{k}\\) and \\(\\overrightarrow{\\mathrm{b}}=\\hat{\\mathrm{i}}-\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}}\\) ?", "image": null}, "options": [{"id": "PyRnT", "text": "\\(\\frac{\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}}{\\sqrt{2}}\\)", "image": null, "isCorrect": true}, {"id": "yVTiv", "text": "\\(\\hat{\\mathrm{k}}\\)", "image": null, "isCorrect": false}, {"id": "Xq4Zq", "text": "\\(\\frac{\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}}}{\\sqrt{2}}\\)", "image": null, "isCorrect": false}, {"id": "GAg6j", "text": "\\(\\frac{\\hat{\\mathrm{i}}-\\hat{\\mathrm{j}}}{\\sqrt{2}}\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to question \\(\\mathrm{a}=-\\hat{i}+\\hat{j}+\\hat{k}\\) and \\(\\mathrm{b}=\\hat{i}-\\hat{j}+\\hat{k}\\)\nThen, \\(\\mathrm{a} \\times \\mathrm{b}=\\left|\\begin{array}{lll}\\hat{i} & \\hat{j} & \\hat{k} \\\\ -1 & 1 & 1 \\\\ 1 & -1 & 1\\end{array}\\right|\\)\n\\(\\begin{gathered}\n=\\hat{i}[1+1]-\\hat{j}[-1-1]+\\hat{k}[1-1]=2(\\hat{i}+\\hat{j}) \\\\\n\\quad \\text { and }|\\mathrm{a} \\times \\mathrm{b}|=\\sqrt{4+4}=2 \\sqrt{2}\n\\end{gathered}\\)\n\\(\\therefore \\text { Required unit vector }= \\pm \\frac{2(\\hat{i}+\\hat{j})}{2 \\sqrt{2}}= \\pm \\frac{\\hat{i}+\\hat{j}}{\\sqrt{2}}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8756f5bfc7ab78aee6e", "title": "Product of 2 vectors", "totalQuestions": 9, "questions": [{"_id": "65b7b87f97ae24e9e2db8cf3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "A vector perpendicular to the plane containing the vectors $\\hat{i}-2 \\hat{j}-\\hat{k}$ and $3 \\hat{i}-2 \\hat{j}-\\hat{k}$ is inclined to the vector $\\hat{i}+\\hat{j}+\\hat{k}$ at an angle", "image": null}, "options": [{"id": "nQmeH", "text": "$\\tan ^{-1} \\sqrt{14}$", "image": null, "isCorrect": true}, {"id": "PbGFX", "text": "$\\sec ^{-1} \\sqrt{14}$", "image": null, "isCorrect": false}, {"id": "m4erq", "text": "$\\tan ^{-1} \\sqrt{15}$", "image": null, "isCorrect": false}, {"id": "b6tgl", "text": "<br />None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A vector perpendicular to the plane is<br />$\\begin{aligned}<br />& (\\hat{i}-2 \\hat{j}-\\hat{k}) \\times(3 \\hat{i}-2 \\hat{j}-\\hat{k}) \\\\<br />& =\\left|\\begin{array}{ccc}<br />\\hat{i} & \\hat{j} & \\hat{k} \\\\<br />1 & -2 & -1 \\\\<br />3 & -2 & -1<br />\\end{array}\\right|=-2 \\hat{j}+4 \\hat{k} \\\\<br />& \\Rightarrow \\text { unit vector } \\hat{a}=\\frac{-2 \\hat{j}+4 \\hat{k}}{\\sqrt{4+16}}=\\frac{-2 \\hat{j}+4 \\hat{k}}{2 \\sqrt{5}}<br />\\end{aligned}$<br />Angle between the unit vector and $\\vec{r}=\\hat{i}+\\hat{j}+\\hat{k}$<br />$=\\cos ^{-1} \\frac{\\vec{r} \\cdot \\hat{a}}{|\\vec{r}| \\cdot|\\hat{a}|}=\\cos ^{-1} \\frac{1}{\\sqrt{15}}=\\tan ^{-1} \\sqrt{14}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87897ae24e9e2db8ca4", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "If $\\vec{a}=\\hat{i}+\\hat{j}+\\hat{k}, \\vec{a} \\cdot \\vec{b}=1$ and $\\vec{a} \\times \\vec{b}=\\vec{j}-\\vec{k}$, then $\\vec{b}$ is", "image": null}, "options": [{"id": "0CVlf", "text": "$\\hat{i}-\\hat{j}+\\hat{k}$ ortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
