ML\"><mi>&#955;</mi><mo>&#62;</mo><mn>2</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a66f5bfc7ab78ae6b0", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "Find the eccentricity of the conic represented by $x^{2}-y^{2}-4 x+4 y+16=0$", "image": null}, "options": [{"id": "kYk7K", "text": "2", "isCorrect": false, "image": null}, {"id": "ZMUD6", "text": "$\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "u1xsR", "text": "$2 \\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "ldHOz", "text": "$3 \\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have $x^{2}-y^{2}-4 x+4 y+16=0$\r\n$\\Rightarrow\\left(x^{2}-4 x\\right)-\\left(y^{2}-4 y\\right)=16$\r\n$\\Rightarrow\\left(x^{2}-4 x+4\\right)-\\left(y^{2}-4 y+4\\right)=-16$\r\n$\\Rightarrow(x-2)^{2}-(y-2)^{2}=-16$\r\n$\\Rightarrow \\frac{(x-2)^{2}}{4^{2}}-\\frac{(y-2)^{2}}{4^{2}}=1$\r\nThis is rectangular hyperbola, whose eccentricity is always $\\sqrt{2}$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8786f5bfc7ab78aee8e", "title": "Equation of hyperbola", "totalQuestions": 3, "questions": [{"_id": "67726d19c49e8ef28ee2b43f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "The foci of hyperbola $4 x^2-9 y^2-1=0$ are", "image": null}, "options": [{"id": "aoNin", "text": "$( \\pm \\sqrt{13}, 0)$", "image": null, "isCorrect": false}, {"id": "JPkVG", "text": "$\\left( \\pm \\frac{\\sqrt{13}}{6}, 0\\right)$", "image": null, "isCorrect": true}, {"id": "R3UQw", "text": "$\\left(0, \\pm \\frac{\\sqrt{3}}{6}\\right)$", "image": null, "isCorrect": false}, {"id": "Mcd1x", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, Hyperbola $=4 x^2-9 y^2-1=0$\r\n$\\begin{aligned}\r\n& \\Rightarrow \\frac{x^2}{\\left(\\frac{1}{4}\\right)}-\\frac{y^2}{\\left(\\frac{1}{9}\\right)}=1 \\\\\r\n& \\Rightarrow \\frac{x^2}{\\frac{1}{2}^2}-\\frac{y^2}{\\frac{1}{3}^2}=1\r\n\\end{aligned}$\r\nWe know that. if hyperbola is $\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$. then Eccentricity: \r\n$e=\\sqrt{1+\\frac{b^2}{a^2}}$\r\n$\\begin{aligned}\r\n& \\text {and focus } \\equiv( \\pm \\text{be}, 0)=\\left( \\pm \\frac{1}{2} \\times \\frac{\\sqrt{1 / 3}}{3}, 0\\right)=\\left( \\pm \\frac{\\sqrt{13}}{6}, 0\\right)\r\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87797ae24e9e2db8c9e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "If the eccentricity and length of latus rectum of a hyperbola are $\\frac{\\sqrt{13}}{3}$ and $\\frac{10}{3}$ units respectively, then what is the length of the transverse axis?", "image": null}, "options": [{"id": "kUjx8", "text": "$\\frac{7}{2}$ unit", "image": null, "isCorrect": false}, {"id": "RzEoD", "text": "12 unit", "image": null, "isCorrect": false}, {"id": "in5Y4", "text": "$\\frac{15}{2}$ unit", "image": null, "isCorrect": false}, {"id": "5Z3Sy", "text": "$\\frac{15}{4}$ unit", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Length of latus rectum of a hyperbola is $\\frac{2 b^2}{a}$ where $a$ is the half of the distance between two vertex of the hyperbola.<br />Latus rectum $=\\frac{2 b^2}{a}=\\frac{10}{3}$ or, $b^2=\\frac{5 a}{3}$ ...(i)<br />In case of hyperbola, $\\mathrm{b}^2=\\mathrm{a}^2\\left(\\mathrm{e}^2-1\\right)$ ...(ii)<br />Putting value of $b^2$ from equation (i) and $e=$<br />$\\frac{\\sqrt{13}}{3}$ in equation (ii), $\\frac{5 \\mathrm{a}}{3}=\\mathrm{a}^2\\left(\\frac{13}{9}-1\\right)$ or,<br />$\\frac{5 a}{3}=\\frac{4 a^2}{9}$<br />$\\Rightarrow 4 a^2-15 a=0$ or, $a(4-15 a)=0$<br />$a \\neq 0$, hence, $a=\\frac{15}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fe6f5bfc7ab78ae9a8", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mn>2</mn></msub></math> are the eccentricities of a hyperbola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn></math>&nbsp;and its conjugate, then", "image": null}, "options": [{"id": "JUV2N", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>e</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>e</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "q5jPz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>e</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>e</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mn>4</mn></math>", "isCorrect": true, "image": null}, {"id": "NvEqs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mn>1</mn></msub><mo>+</mo><msub><mi>e</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn></math>", "isCorrect": false, "image": null}, {"id": "lgYII", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mn>1</mn></msub><mo>+</mo><msub><mi>e</mi><mn>2</mn></msub><mo>=</mo><msqrt><mn>2</mn></msqrt></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given equation can be written as</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>25</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msub><mi>e</mi><mn>1</mn></msub><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mn>1</mn></msqrt><mo>=</mo><msqrt><mn>2</mn></msqrt></math></p><p>The equation of conjugate hyperbola is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>25</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msub><mi>e</mi><mn>2</mn></msub><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac></msqrt><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mn>1</mn></msqrt><mo>=</mo><msqrt><mn>2</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msubsup><mi>e</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>e</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><msup><mfenced><msqrt><mn>2</mn></msqrt></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><msqrt><mn>2</mn></msqrt></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>e</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>e</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mn>4</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8786f5bfc7ab78aee8d", "title": "Tangent to hyperbola", "totalQuestions": 1, "questions": [{"_id": "64c0e7fe6f5bfc7ab78ae9a3", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 3, "question": {"text": "A tangent drawn to hyperbola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>1</mn></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mfrac><mi>&#960;</mi><mn>6</mn></mfrac></mfenced></math> forms a triangle of area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></math> square units, with coordinate axes. If the eccentricity of hyperbola is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mn>2</mn></msup><mo>-</mo><mn>9</mn></math> is", "image": null}, "options": [{"id": "Ej8ee", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math>", "isCorrect": false, "image": null}, {"id": "FQ8Fw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>", "isCorrect": false, "image": null}, {"id": "auCr0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn></math>", "isCorrect": false, "image": null}, {"id": "Tjn5w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>The point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mfrac><mi>&#960;</mi><mn>6</mn></mfrac></mfenced></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>a</mi><mi>sec</mi><mfrac><mi>&#960;</mi><mn>6</mn></mfrac><mo>,</mo><mi>b</mi><mi>tan</mi><mfrac><mi>&#960;</mi><mn>6</mn></mfrac></mrow></mfenced></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><msqrt><mn>3</mn></msqrt></mfrac><mo>,</mo><mfrac><mi>b</mi><msqrt><mn>3</mn></msqrt></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Equation of tangent at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>a</mi></mrow><mn>2</mn></mfrac></mfrac><mo>-</mo><mfrac><mi>y</mi><mrow><msqrt><mn>3</mn></msqrt><mi>b</mi></mrow></mfrac><mo>=</mo><mn>1</mn></math>1$</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Area of the triangle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>a</mi></mrow><mn>2</mn></mfrac><mo>&#215;</mo><msqrt><mn>3</mn></msqrt><mi>b</mi><mo>=</mo><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfrac><mi>b</mi><mi>a</mi></mfrac><mo>=</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>17</mn></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mn>2</mn></msup><mo>-</mo><mn>9</mn><mo>=</mo><mn>17</mn><mo>-</mo><mn>9</mn><mo>=</mo><mn>8</mn></math></p><p>Hence, option (d) is correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
