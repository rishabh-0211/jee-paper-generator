x},$ for all $\\mathrm{x}$\r\n\r\nDifferentiate both side,w.r.tx\r\n\r\n$\\Rightarrow \\frac{\\mathrm{d}}{\\mathrm{dx}}\\{\\operatorname{fog}(\\mathrm{x})\\}=\\frac{\\mathrm{d}}{\\mathrm{dx}}(\\mathrm{x}),$ for all $\\mathrm{x}$\r\n\r\n$\\Rightarrow \\mathrm{f}^{\\prime}[\\mathrm{g}(\\mathrm{x})] \\mathrm{g}^{\\prime}(\\mathrm{x})=1,$ for all $\\mathrm{x}$\r\n\r\n$\\Rightarrow \\sin \\{\\mathrm{g}(\\mathrm{x})\\} \\mathrm{g}^{\\prime}(\\mathrm{x})=1,$ for all $\\mathrm{x}$\r\n\r\n(By defn of $\\left.f^{\\prime}(x)\\right)$\r\n\r\n$\\Rightarrow \\mathrm{g}^{\\prime}(\\mathrm{x})=\\frac{1}{\\sin \\{\\mathrm{g}(\\mathrm{x})\\}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b76f5bfc7ab78ae73c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "If $y=1+x+\\frac{x^{2}}{2 !}+\\frac{x^{3}}{3 !}+\\ldots . \\infty,$ then $\\frac{d y}{d x}$ is equal to", "image": null}, "options": [{"id": "tXhGl", "text": "$x$", "isCorrect": false, "image": null}, {"id": "XeDsY", "text": "1", "isCorrect": false, "image": null}, {"id": "u9r1V", "text": "$y$", "isCorrect": true, "image": null}, {"id": "25Ayx", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$y=e^{x} \\Rightarrow \\frac{d y}{d x}=e^{x}=y$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a76f5bfc7ab78ae6be", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "The diagonal of a square is changing at the rate of $0.5 \\mathrm{~cm} / \\mathrm{sec}$. Then the rate of change of area, when the area is $400 \\mathrm{~cm}^{2}$, is equal to", "image": null}, "options": [{"id": "MDhYy", "text": "$20 \\sqrt{2} \\mathrm{~cm}^{2} / \\mathrm{sec}$", "isCorrect": false, "image": null}, {"id": "tB2EB", "text": "$10 \\sqrt{2} \\mathrm{~cm}^{2} / \\mathrm{sec}$", "isCorrect": true, "image": null}, {"id": "GSNwJ", "text": "$\\frac{1}{10 \\sqrt{2}} \\mathrm{~cm}^{2} / \\mathrm{sec}$", "isCorrect": false, "image": null}, {"id": "fx90f", "text": "$\\frac{10}{\\sqrt{2}} \\mathrm{~cm}^{2} / \\mathrm{sec}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Diagonal $\\mathrm{D}=\\sqrt{2}$ a\r\nDifferentiating w.r.t.\r\nt: $\\frac{\\mathrm{dD}}{\\mathrm{dt}}=\\sqrt{2} \\frac{\\mathrm{da}}{\\text { at }}$\r\nor $\\frac{\\mathrm{da}}{\\mathrm{dt}}=\\frac{1}{\\sqrt{2}} \\frac{\\mathrm{da}}{\\mathrm{dt}}=\\frac{1}{\\sqrt{2}} \\times 0.5 \\mathrm{~cm} / \\mathrm{s}$\r\nLet Area is denoted by $\\underline{A}$ $\\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dt}}=2 \\mathrm{a} \\frac{\\mathrm{da}}{\\mathrm{dt}}$\r\nwhen area $A$ is $400 \\mathrm{~cm}^{2}$ then $\\mathrm{a}=20$ $\\therefore \\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dt}}=2 \\times 20 \\times \\frac{0.5}{\\sqrt{2}}=10 \\sqrt{2} \\mathrm{~cm}^{2} / \\mathrm{sec}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8776f5bfc7ab78aee7e", "title": "Differentiation of implicit functions", "totalQuestions": 3, "questions": [{"_id": "67726d0ec49e8ef28ee2b3e5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "At $x=\\frac{\\pi^2}{4}, \\frac{d}{d x}\\left(\\tan ^{-1}(\\cos \\sqrt{x})+\\sec ^{-1}\\left(e^x\\right)\\right)=$", "image": null}, "options": [{"id": "let3c", "text": "$\\frac{1}{\\sqrt{\\mathrm{e}^{\\frac{\\pi^2}{2}}}-1}-\\frac{1}{\\pi}$", "image": null, "isCorrect": true}, {"id": "9rZi5", "text": "$\\frac{\\pi}{4}+\\frac{1}{\\sqrt{\\mathrm{e}^{\\pi^2}+\\mathrm{e}^{\\pi^2 / 2}}}$", "image": null, "isCorrect": false}, {"id": "6XueD", "text": "$\\frac{1}{\\sqrt{\\mathrm{e}^{\\pi^2}+\\mathrm{e}^{\\pi^2 / 2}}}+\\frac{2}{\\pi} \\cot \\left(\\frac{\\sqrt{\\pi}}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "13WIv", "text": "$\\frac{1}{\\sqrt{\\mathrm{e}^\\pi}}+\\frac{1}{\\pi}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{d}{d x}\\left(\\tan ^{-1}(\\cos \\sqrt{x})+\\sec ^{-1}\\left(\\mathrm{e}^x\\right)\\right)$\n$=\\frac{(-\\sin \\sqrt{x})}{1+\\cos ^2 \\sqrt{x}} \\cdot\\left(\\frac{1}{2 \\sqrt{x}}\\right)+\\frac{1}{e^x \\sqrt{e^{2 x}-1}} \\cdot e^x$\nbut when $x=\\frac{\\pi^2}{4}$\n$=-\\frac{-\\sin \\frac{\\pi}{2}}{1+\\cos ^2 \\frac{\\pi}{2}}\\left(\\frac{1}{2}\\right)\\left(\\frac{2}{\\pi}\\right)+\\frac{1}{\\sqrt{e^{\\pi^2 / 2}-1}}$\n$=-\\frac{1}{\\pi}+\\frac{1}{\\sqrt{e^{\\pi^2 / 2}-1}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8286f5bfc7ab78aeb18", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "$\\text { If } 2^{x}+2^{y}=2^{x+y} \\text {, then } \\frac{d y}{d x}=$", "image": null}, "options": [{"id": "SGOv6", "text": "$2^{x-y} \\frac{2^{y}-1}{2^{x}-1}$", "isCorrect": false, "image": null}, {"id": "yu0BC", "text": "$2^{x-y} \\frac{2^{y}-1}{1-2^{x}}$", "isCorrect": false, "image": null}, {"id": "8cogH", "text": "$\\frac{2^{x}+2^{y}}{2^{x}-2^{y}}$", "isCorrect": false, "image": null}, {"id": "U9WQQ", "text": "None of these", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "On differentiating\r\n\r\n$\\begin{array}{l}\r\n\r\n2^{x} \\log 2+2^{y} \\log 2 \\cdot \\frac{\\mathrm{dy}}{\\mathrm{dx}} \\\\\r\n\r\n=2^{x} \\cdot 2^{y} \\frac{\\mathrm{dy}}{\\mathrm{dx}} \\cdot \\log 2+2^{y} \\cdot 2^{x} \\log 2 \\\\\r\n\r\n\\Rightarrow 2^{x}+2^{y} \\frac{\\mathrm{dy}}{\\mathrm{dx}}=2^{x+y} \\frac{\\mathrm{dy}}{\\mathrm{dx}}+2^{x+y} \\\\\r\n\r\n\\Rightarrow \\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\frac{2^{x+y}-2^{x}}{2^{y}-2^{x+y}} \\\\\r\n\r\n\\Rightarrow \\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\frac{2^{x}+2^{y}-2^{x}}{2^{y}-2^{x}-2^{y}}=-2^{y-x}\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e81a6f5bfc7ab78aea9f", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $x y+y^{2}=\\tan x+y,$ then find $\\frac{d y}{d x}$ is", "image": null}, "options": [{"id": "W14D9", "text": "$\\frac{\\sec ^{2} x}{x+2 y}$", "isCorrect": false, "image": null}, {"id": "2VhI3", "text": "$\\frac{\\sec ^{2} x-y}{(x+2 y-1)}$", "isCorrect": true, "image": null}, {"id": "UoC7Y", "text": "$(x+2 y-1) \\sec ^{2} x$", "isCorrect": false, "image": null}, {"id": "ig2mu", "text": "$\\sec ^{2} x \\cdot y$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given relation is $x y+y^{2}=\\tan x+y$. Differentiating both sides with respect to $x$, we get\r\n\r\n$\\frac{d}{d x}(x y)+\\frac{d}{d x}\\left(y^{2}\\right)=\\frac{d}{d x}(\\tan x)+\\frac{d y}{d x}$\r\n\r\nor $\\left[y \\cdot 1+x \\cdot \\frac{d y}{d x}\\right]+2 y \\frac{d y}{d x}=\\sec ^{2} x+\\frac{d y}{d x}$\r\n\r\nor $(x+2 y-1) \\frac{d y}{d x}=\\sec ^{2} x-y$\r\n\r\n$\\therefore \\frac{d y}{d x}=\\frac{\\sec ^{2} x-y}{(x+2 y-1)}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8776f5bfc7ab78aee7f", "title": "Parametric differentiation", "totalQuestions": 1, "questions": [{"_id": "64c0e8286f5bfc7ab78aeb19", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "If $x=\\frac{1-t^{2}}{1+t^{2}}$ and $y=\\frac{2 t}{1+t^{2}}$, then $\\frac{d y}{d x}$ is equal to :", "image": null}, "options": [{"id": "dSmW5", "text": "$-\\frac{y}{x}$", "isCorrect": false, "image": null}, {"id": "4zREr", "text": "$\\frac{y}{x}$", "isCorrect": false, "image": null}, {"id": "3kzae", "text": "$-\\frac{x}{y}$", "isCorrect": true, "image": null}, {"id": "iwtv5", "text": "$\\frac{x}{y}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $x=\\frac{1-t^{2}}{1+t^{2}}$ and $y=\\frac{2 t}{1+t^{2}}$\r\n\r\nPut $t=\\tan \\theta$, we get\r\n\r\n$x=\\frac{1-\\tan ^{2} \\theta}{1+\\tan ^{2} \\theta}$ and $y=\\frac{2 \\tan \\theta}{1+\\tan ^{2} \\theta}$\r\n\r\n$\\Rightarrow x=\\cos 2 \\theta$ and $y=\\sin 2 \\theta$\r\n\r\n$\\therefore \\frac{\\mathrm{dx}}{\\mathrm{d} \\theta}=-2 \\sin 2 \\theta$ and $\\frac{\\mathrm{dy}}{\\mathrm{d} \\theta}=2 \\cos 2 \\theta$\r\n\r\nNow, $\\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\frac{\\mathrm{dy}}{\\mathrm{d} \\theta} \\times \\frac{\\mathrm{d} \\theta}{\\mathrm{dx}}=-\\frac{\\cos 2 \\theta}{\\sin 2 \\theta}=-\\frac{x}{y}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8776f5bfc7ab78aee7a", "title": "Logarithmic differentiation", "totalQuestions": 2, "questions": [{"_id": "65b7b88197ae24e9e2db8d05", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "If $y^x=e^{y-x}$, then $\\frac{d y}{d x}$ is equal to", "image": null}, "options": [{"id": "9CX7i", "text": "$\\frac{1+\\log y}{y \\log y}$", "image": null, "isCorrect": false}, {"id": "AW4t6", "text": "$\\frac{(1+\\log y)^2}{y \\log y}$", "image": null, "isCorrect": false}, {"id": "icRrE", "text": "$\\frac{1+\\log y}{(\\log y)^2}$", "image": null, "isCorrect": false}, {"id": "FDr2R", "text": "$\\frac{(1+\\log y)^2}{\\log y}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Here, $\\mathrm{y}^{\\mathrm{x}}=\\mathrm{e}^{\\mathrm{y}-\\mathrm{x}}$<br />Taking log on both sides, we get<br />$\\begin{aligned}<br />& \\log y^x=\\log e^{y-x} \\\\<br />& \\quad\\left(\\because \\log a^b=b \\log a \\text { and } \\log e=1\\right)<br />\\end{aligned}$<br />$\\Rightarrow x \\log y=(y-x) \\log e \\Rightarrow x \\log y=y-x \\ldots(i)$<br />On differentiating w.r.t. $x$, we get<br />$\\frac{d}{d x}(x \\log y)=\\frac{d}{d x}(y-x)$<br />(using product rule)<br />$\\begin{aligned}<br />& \\Rightarrow x\\left(\\frac{1}{y}\\right) \\frac{d y}{d x}+\\log y(1)=\\frac{d y}{d x}-1 \\\\<br />& \\Rightarrow \\frac{d y}{d x}\\left(\\frac{x}{y}-1\\right)=-1-\\log y \\\\<br />& \\Rightarrow \\frac{d y}{d x}\\left[\\frac{y}{(1+\\log y) y}-1\\right]=-(1+\\log y) \\\\<br />& \\qquad \\quad\\left[\\because \\text { from eq. }(i) \\cdot x=\\frac{y}{(1+\\log y)}\\right] \\\\<br />& \\Rightarrow \\frac{d y}{d x}\\left[\\frac{1-1-\\log y}{1+\\log y}\\right]=-(1+\\log y)<br />\\end{aligned}$<br />$\\Rightarrow \\frac{d y}{d x}=-\\frac{(1+\\log y)^2}{-\\log y}$<br />$\\Rightarrow \\frac{d y}{d x}=\\frac{(1+\\log y)^2}{\\log y}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7996f5bfc7ab78ae644", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "If \\(y=x^{x^2}\\), then \\(\\frac{d y}{d x}\\) is equal to", "image": null}, "options": [{"id": "CAFsM", "text": "\\((2 \\ln x)\\)", "image": null, "isCorrect": false}, {"id": "8vyC8", "text": "\\((2 \\ln x+1)\\)", "image": null, "isCorrect": false}, {"id": "wjz12", "text": "\\((\\ln \\ln x+1) x^{x^2}\\)", "image": null, "isCorrect": false}, {"id": "hISP9", "text": "None of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider \\(y=x^{x^2} \\Rightarrow \\ln y=x^2 \\ln x\\)\n\\(\\begin{aligned}\n& \\frac{1}{y} \\frac{d y}{d x}=2 x \\ln x+x^2 \\cdot \\frac{1}{x}=x(1+2 \\ln x) \\\\\n& \\frac{d y}{d x}=x^{x^2} \\cdot x(1+2 \\ln x)=x^{x^2+1}(1+2 \\ln x)\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8776f5bfc7ab78aee80", "title": "Derivative of f(x) wrt g(x)", "totalQuestions": 2, "questions": [{"_id": "65b7b87f97ae24e9e2db8cf4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "The slope of the tangent to the curve $x=3 t^2+1$, $y=t^3-1$ at $x=1$ is:", "image": null}, "options": [{"id": "zqzMj", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "rhEYn", "text": "<br />0", "image": null, "isCorrect": true}, {"id": "PaV5X", "text": "<br />-2", "image": null, "isCorrect": false}, {"id": "Cdcr9", "text": "$\\infty$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given curve is $x=3 t^2+1$<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/i96DNHHTo_FW52n7W2lHdlYYGcu7QfMaYWl6ffqxwB0.original.fullsize.png\"><br><br />Second curve is $y=t^3-1$<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Amt76KEG_dlbSyhjkiFOkKWDMGfdWOuylzm_d0Px6vA.original.fullsize.png\"><br><br />$\\therefore \\frac{d y}{d x}=\\frac{d y}{d t} \\times \\frac{d t}{d x}=3 t^2 \\times \\frac{1}{6 t}=\\frac{t}{2}$<br />But from (i) when $x=1$<br />we have $1=3 t^2+1 \\Rightarrow 3 t^2=0 \\Rightarrow t=0$<br />$\\therefore$ When $\\mathrm{x}=1$ then $\\mathrm{t}=0 \\quad \\therefore \\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\mathbf{0}$<br />Hence, slope of the tangent to the curve $=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8296f5bfc7ab78aeb1f", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "$\\frac{d}{d x}\\left(\\tan ^{-1} \\sqrt{\\frac{1+\\cos \\frac{x}{2}}{1-\\cos \\frac{x}{2}}}\\right)$ is equal to", "image": null}, "options": [{"id": "nXC4W", "text": "$-\\frac{1}{4}$", "isCorrect": true, "image": null}, {"id": "zJiAJ", "text": "$\\frac{1}{4}$", "isCorrect": false, "image": null}, {"id": "sZ0Fr", "text": "$-\\frac{1}{2}$", "isCorrect": false, "image": null}, {"id": "UN4kx", "text": "$\\frac{1}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have $\\frac{d}{d x}\\left(\\tan ^{-1} \\sqrt{\\frac{1+\\cos \\frac{x}{2}}{1-\\cos \\frac{x}{2}}}\\right)$\r\n\r\n$=\\frac{d}{d x}\\left[\\tan ^{-1} \\sqrt{\\frac{1+\\left(2 \\cos ^{2} \\frac{x}{4}-1\\right)}{1-\\left(1-2 \\sin ^{2} \\frac{x}{4}\\right)}}\\right]$\r\n\r\n$=\\frac{d}{d x}\\left(\\tan ^{-1} \\sqrt{\\left.\\frac{2 \\cos ^{2} \\frac{x}{4}}{2 \\sin ^{2} \\frac{x}{4}}\\right)}\\right.$\r\n\r\n$=\\frac{d}{d x}\\left(\\tan ^{-1} \\sqrt{\\cot ^{2} \\frac{x}{4}}\\right)=\\frac{d}{d x}\\left(\\tan ^{-1} \\cot \\frac{x}{4}\\right)$\r\n\r\n$=\\frac{d}{d x}\\left(\\tan ^{-1} \\tan \\left(\\frac{\\pi}{2}-\\frac{x}{4}\\right)\\right)=\\frac{d}{d x}\\left(\\frac{\\pi}{2}-\\frac{x}{4}\\right)=0-\\frac{1}{4}=-\\frac{1}{4}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64c0e8776f5bfc7ab78aee7c", "title": "Higher order derivatives", "totalQuestions": 1, "questions": [{"_id": "64c0e7a76f5bfc7ab78ae6ba", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "If $x=a \\sin \\theta$ and $y=b \\cos \\theta,$ then $\\frac{d^{2} y}{d x^{2}}$ is", "image": null}, "options": [{"id": "kPb7m", "text": "$\\frac{a}{b^{2}} \\sec ^{2} \\theta$", "isCorrect": false, "image": null}, {"id": "NEHKR", "text": "$\\frac{-b}{a} \\sec ^{2} \\theta$", "isCorrect": true, "image": null}, {"id": "arufp", "text": "$\\frac{-b}{a^{2}} \\sec ^{3} \\theta$", "isCorrect": false, "image": null}, {"id": "MJGUD", "text": "$\\frac{b}{a^{2}} \\sec ^{3} \\theta$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "(b) Given $x=a \\sin \\theta$ and $y=b \\cos \\theta$\r\n$\\Rightarrow \\frac{d x}{d \\theta}=a \\cos \\theta$ and $\\frac{d y}{d \\theta}=-b \\sin \\theta$\r\n$\\therefore \\quad \\frac{d y}{d x}=\\frac{d y}{d \\theta} \\times \\frac{d \\theta}{d x}=-\\frac{b}{a} \\tan \\theta \\Rightarrow \\frac{d^{2} y}{d x^{2}}=\\frac{-b}{a} \\sec ^{2} \\theta$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "64c0e8776f5bfc7ab78aee7b", "title": "Functional Equation", "totalQuestions": 4, "questions": [{"_id": "67726d1ac49e8ef28ee2b442", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "If $x \\sqrt{1+y}+y \\sqrt{1+x}=0$, then $\\frac{d y}{d x}=$", "image": null}, "options": [{"id": "tZQwZ", "text": "$\\frac{x+1}{x}$", "image": null, "isCorrect": false}, {"id": "it1kS", "text": "$\\frac{1}{1+x}$", "image": null, "isCorrect": false}, {"id": "769Rn", "text": "$\\frac{-1}{(1+x)^2}$", "image": null, "isCorrect": true}, {"id": "MnDMk", "text": "$\\frac{x}{1+x}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\text {  Given, } x \\sqrt{1+y}+y \\sqrt{1+x}=0 \\\\\n& \\Rightarrow \\quad x \\sqrt{1+y}=-y \\sqrt{1+x} \\\\\n& \\Rightarrow \\quad(x \\sqrt{1+y})^2=(-y \\sqrt{1+x})^2\n\\end{aligned}$\n$\\begin{array}{lr}\n\\Rightarrow & x^2(1+y)=y^2(1+x) \\\\\n\\Rightarrow & x^2-y^2=y^2 x-x^2 y \\\\\n\\Rightarrow & (x-y)(x+y)=x y(y-x) \\\\\n\\Rightarrow & x+y=-x y \\\\\n\\Rightarrow & x+y+x y=0 \\\\\n\\Rightarrow & y=\\frac{-x}{1+x}=-1+\\frac{1}{1+x}\n\\end{array}$\nDifferentiating w.r.t, $x$\n$\\frac{d y}{d x}=-\\frac{1}{(1+x)^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b88197ae24e9e2db8d0b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "If $\\mathrm{f}(\\mathrm{x})=\\sqrt{1+\\cos ^2\\left(\\mathrm{x}^2\\right)}$, then the value of $f^{\\prime}\\left(\\frac{\\sqrt{\\pi}}{2}\\right)$", "image": null}, "options": [{"id": "ayXHK", "text": "$\\frac{\\sqrt{\\pi}}{6}$", "image": null, "isCorrect": false}, {"id": "b8YKd", "text": "$-\\sqrt{\\frac{\\pi}{6}}$", "image": null, "isCorrect": true}, {"id": "p9I22", "text": "$\\frac{1}{\\sqrt{6}}$", "image": null, "isCorrect": false}, {"id": "bIxB2", "text": "$\\frac{\\pi}{\\sqrt{6}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/_NTjqRT8hKJ5THfUNdP4T3sWIILr9OmymI6oIXX4-EQ.original.fullsize.png\"><br><br />On differentiating (i) w.r.t.x, we get<br />$f^{\\prime}(x)=\\frac{-2 \\sin x^2 \\cos x^2}{\\sqrt{1+\\cos ^2 x^2}}(x)$<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/EdpMz33XoOBGACcfTnTZM5cxVVi4UlbFmlVTJTu-wOM.original.fullsize.png\"><br><br />Put, $x=\\frac{\\sqrt{\\pi}}{2}$ in (ii), we get<br />$\\begin{aligned}<br />& \\mathrm{f}^{\\prime}\\left(\\frac{\\sqrt{\\pi}}{2}\\right)=-\\frac{\\sqrt{\\pi}}{2} \\cdot \\frac{\\sin 2\\left(\\frac{\\pi}{4}\\right)}{\\sqrt{1+\\frac{1}{2}}} \\\\<br />& =-\\frac{\\sqrt{\\pi}}{2} \\cdot \\frac{\\sin \\frac{\\pi}{2}}{\\sqrt{\\frac{3}{2}}}=-\\sqrt{\\frac{\\pi}{6}}<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a96f5bfc7ab78ae6cd", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "For the function\r\n$f(x)=\\frac{x^{100}}{100}+\\frac{x^{99}}{99}+\\ldots \\frac{x^{2}}{2}+x+1$\r\n$\\mathrm{f}^{\\prime}(1)=\\mathrm{mf}^{\\prime}(0),$ where $\\mathrm{m}$ is equal to", "image": null}, "options": [{"id": "3k56E", "text": "50", "isCorrect": false, "image": null}, {"id": "bX1UL", "text": "0", "isCorrect": false, "image": null}, {"id": "4XTZn", "text": "100", "isCorrect": true, "image": null}, {"id": "wTiAF", "text": "200", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, $f(x)=\\frac{x^{100}}{100}+\\frac{x^{99}}{99}+\\ldots+\\frac{x^{2}}{2}+x+1$\r\n$\\Rightarrow \\quad f^{\\prime}(x)=\\frac{100 x^{99}}{100}+\\frac{99 x^{98}}{99}+\\ldots+\\frac{2 x}{2}+1+0$\r\n$\\left[\\because \\mathrm{f}(\\mathrm{x})=\\mathrm{x}^{\\mathrm{n}} \\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=\\mathrm{nx}^{\\mathrm{n}-1}\\right]$\r\n$\\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=\\mathrm{x}^{99}+\\mathrm{x}^{98}+\\ldots+\\mathrm{x}+1$ ...(i)\r\nPutting $\\mathrm{x}=1$, we get $f^{\\prime}(1)=\\underbrace{(1)^{99}+1^{98}+\\ldots+1+1}_{100 \\text { times }}=\\underbrace{1+1+1 \\ldots+1+1}_{100 \\text { times }}$\r\n$\\Rightarrow \\quad \\mathrm{f}^{\\prime}(1)=100$ ...(ii)\r\nAgain, putting $\\mathrm{x}=0$, we get $\\mathrm{f}^{\\prime}(0)=0+0+\\ldots+0+1 \\quad \\Rightarrow \\mathrm{f}^{\\prime}(0)=1$ ...(iii)\r\nFrom eqs. (ii) and(iii), we get; $\\mathrm{f}^{\\prime}(1)=100 \\mathrm{f}^{\\prime}(0)$ Hence, $m=100$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a66f5bfc7ab78ae6b2", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let $f(x+y)=f(x) \\cdot f(y)$ for all $x, y$ where $f(0) \\neq 0$ If $f(5)=2$ and $f^{\\prime}(0)=3,$ then $f^{\\prime}(5)$ is equal to-", "image": null}, "options": [{"id": "VlVT8", "text": "6", "isCorrect": true, "image": null}, {"id": "O6ch9", "text": "0", "isCorrect": false, "image": null}, {"id": "h6bv5", "text": "1", "isCorrect": false, "image": null}, {"id": "C5ZIn", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$f^{\\prime}(5)=\\lim _{h \\rightarrow 0} \\frac{f(5+h)-f(5)}{h}$\r\n$=\\lim _{h \\rightarrow 0} \\frac{f(5+h)-f(5+0)}{h}$\r\n$=\\lim _{h \\rightarrow 0} \\frac{f(5) \\cdot f(h)-f(5)+f(0)}{h}$\r\n$(\\because f(x+y)=f(x), f(y)$ for all $x, y)$\r\n$=\\left(\\lim _{h \\rightarrow 0} \\frac{f(h)-f(0)}{h}\\right) \\cdot f(5)=f^{\\prime}(0) \\cdot f(5)$\r\n$=3 \\times 2=6$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "67726db1c49e8ef28ee2b4b8", "title": "Differentiation of Inverse Trigonometric Functions", "totalQuestions": 1, "questions": [{"_id": "67726d1bc49e8ef28ee2b44e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "If $y=\\tan ^{-1}\\left(\\frac{\\sqrt{x}-x}{1+x^{\\frac{3}{2}}}\\right)$, then $y^{\\prime}(1)$ is equal to", "image": null}, "options": [{"id": "RZfm1", "text": "0", "image": null, "isCorrect": false}, {"id": "gcSGZ", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "DBMdO", "text": "-1", "image": null, "isCorrect": false}, {"id": "niL6Q", "text": "$-\\frac{1}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, $\\begin{aligned} y & =\\tan ^{-1}\\left(\\frac{\\sqrt{x}-x}{1+x^{\\frac{3}{2}}}\\right) \\\\ y & =\\tan ^{-1}\\left(\\frac{\\sqrt{x}-x}{1+\\sqrt{x} \\cdot x}\\right) \\\\ y & =\\tan ^{-1}(\\sqrt{x})-\\tan ^{-1} x \\\\ & {\\left[\\because \\tan ^{-1}\\left(\\frac{x-y}{1+x y}\\right)=\\tan ^{-1} x-\\tan ^{-1} y\\right] }\\end{aligned}$\nDifferentiating w.r.t $x$\n$y^{\\prime}(x)=\\frac{d y}{d x}=\\frac{1}{1+x} \\times \\frac{1}{2 \\sqrt{x}}-\\frac{1}{1+x^2}$\nNow, $\\quad y^{\\prime}(1)=\\frac{1}{2} \\times \\frac{1}{2}-\\frac{1}{2}=-\\frac{1}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};

    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
