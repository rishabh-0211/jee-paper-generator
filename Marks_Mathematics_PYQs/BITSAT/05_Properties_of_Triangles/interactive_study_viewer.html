Papers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "In a triangle $\\mathrm{ABC},$ if $\\mathrm{a}=2, \\mathrm{~B}=60^{\\circ}$ and $\\mathrm{C}=75^{\\circ}$, then b equals", "image": null}, "options": [{"id": "kmlz2", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "0nXjS", "text": "$\\sqrt{6}$", "isCorrect": true, "image": null}, {"id": "qZ24A", "text": "$\\sqrt{9}$", "isCorrect": false, "image": null}, {"id": "ZTCqf", "text": "$1+\\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{A}=180^{\\circ}-60^{\\circ}-75^{\\circ}=180^{\\circ}-135^{\\circ}=45^{\\circ}$\r\nNow, $\\frac{\\mathrm{a}}{\\sin \\mathrm{A}}=\\frac{\\mathrm{b}}{\\sin \\mathrm{B}}$\r\n$\\Rightarrow \\frac{2}{\\sin 45^{\\circ}}=\\frac{\\mathrm{b}}{\\sin 60^{\\circ}} \\Rightarrow \\mathrm{b}=\\frac{2 \\cdot(\\sqrt{3} / 2)}{1 / \\sqrt{2}}=\\sqrt{6}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77e6f5bfc7ab78ae551", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The random variable \\(\\mathrm{X}\\) has the following probability distribution\n\\(\\begin{array}{|c|c|c|c|c|c|}\n\\hline \\mathrm{x} & 0 & 1 & 2 & 3 & 4 \\\\\n\\hline \\mathrm{P}(\\mathrm{X}=\\mathrm{x}) & \\mathrm{k} & 3 \\mathrm{k} & 5 \\mathrm{k} & 2 \\mathrm{k} & \\mathrm{k} \\\\\n\\hline\n\\end{array}\\)\nThen the value of \\(P(X \\geq 2)\\) is", "image": null}, "options": [{"id": "k6L3F", "text": "\\(\\frac{1}{3}\\)", "image": null, "isCorrect": false}, {"id": "8m2In", "text": "\\(\\frac{2}{3}\\)", "image": null, "isCorrect": true}, {"id": "XhL9O", "text": "\\(\\frac{3}{4}\\)", "image": null, "isCorrect": false}, {"id": "zXB1Y", "text": "\\(\\frac{1}{4}\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, \\(\\Sigma \\mathrm{P}_{\\mathrm{i}}(\\mathrm{X}=\\mathrm{x})=1\\)\n\\(\\begin{aligned}\n& \\therefore \\mathrm{k}+3 \\mathrm{k}+5 \\mathrm{k}+2 \\mathrm{k}+\\mathrm{k}=1 \\therefore 12 \\mathrm{k}=1 \\therefore \\mathrm{k}=\\frac{1}{12} \\\\\n& \\text { Now, } \\mathrm{P}(\\mathrm{X} \\geq 2)=\\mathrm{P}(\\mathrm{X}=2)+\\mathrm{P}(\\mathrm{X}=3)+\\mathrm{P}(\\mathrm{X}=4) \\\\\n& =5 \\mathrm{k}+2 \\mathrm{k}+\\mathrm{k}=8 \\mathrm{k}=8\\left(\\frac{1}{12}\\right)=\\frac{2}{3}\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8706f5bfc7ab78aee30", "title": "Cosine Rule and Projection Formula", "totalQuestions": 1, "questions": [{"_id": "64c0e7d36f5bfc7ab78ae82b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "In a $\\triangle A B C$, the lengths of the two larger sides are 10 and 9 units, respectively. If the angles are in $\\mathrm{AP}$, then the length of the third side can be", "image": null}, "options": [{"id": "FEeiK", "text": "$5 \\pm \\sqrt{6}$", "isCorrect": true, "image": null}, {"id": "3lvdY", "text": "$3 \\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "omNsO", "text": "$\\underline{5}$", "isCorrect": false, "image": null}, {"id": "wqGEc", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let A, B and $C$ be the three angles of $\\Delta A B C$ and Let $a=10$ and $b=9$ It is given that the angles are in $\\mathrm{AP}$. $\\therefore 2 \\mathrm{~B}=\\mathrm{A}+\\mathrm{C}$ on adding $\\mathrm{B}$ both the sides,\r\n\r\nwe get\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n3 \\mathrm{~B}=\\mathrm{A}+\\mathrm{B}+\\mathrm{C} \\\\\r\n\r\n\\Rightarrow 3 \\mathrm{~B}=180^{\\circ} \\Rightarrow \\mathrm{B}=60^{\\circ}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nNow, we know $\\cos \\mathrm{B}=\\frac{\\mathrm{a}^{2}+\\mathrm{c}^{2}-\\mathrm{b}^{2}}{2 \\mathrm{ac}}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\Rightarrow \\cos 60^{\\circ}=\\frac{10^{2}+\\mathrm{c}^{2}-9^{2}}{2 \\times 10 \\times \\mathrm{c}} \\\\\r\n\r\n\\Rightarrow \\frac{1}{2}=\\frac{100+\\mathrm{c}^{2}-81}{20 \\mathrm{c}} \\\\\r\n\r\n\\Rightarrow \\mathrm{c}^{2}-10 \\mathrm{c}+19=0 \\Rightarrow \\mathrm{c}=5 \\pm \\sqrt{6}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8706f5bfc7ab78aee2f", "title": "Circle Connected to Triangle", "totalQuestions": 1, "questions": [{"_id": "64c0e79b6f5bfc7ab78ae652", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "In an equilateral triangle, the in radius, circumradius and one of the ex-radii are in the ratio", "image": null}, "options": [{"id": "zLIaP", "text": "\\(2: 3: 5\\)", "image": null, "isCorrect": false}, {"id": "Ytq1Y", "text": "\\(1: 2: 3\\)", "image": null, "isCorrect": true}, {"id": "V9tbt", "text": "\\(3: 7: 9\\)", "image": null, "isCorrect": false}, {"id": "YP1Hv", "text": "\\(3: 7: 9\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have \\(\\Delta=\\frac{\\sqrt{3}}{4} \\mathrm{a}^2, \\mathrm{~s}=\\frac{3 \\mathrm{a}}{2}\\)\n\\(\\therefore \\quad r=\\frac{\\Delta}{\\mathrm{s}}=\\frac{\\mathrm{a}}{2 \\sqrt{3}}, \\mathrm{R}=\\frac{\\mathrm{abc}}{4 \\Delta}=\\frac{\\mathrm{a}^3}{\\sqrt{3} \\mathrm{a}^2}=\\frac{\\mathrm{a}}{\\sqrt{3}}\\) and \\(r_1=\\frac{\\Delta}{s-a}=\\frac{\\sqrt{3} / 4 a^2}{a / 2}=\\frac{\\sqrt{3}}{2} a\\)\nHence, \\(\\mathrm{r}: \\mathrm{R}: \\mathrm{r}_1=\\frac{\\mathrm{a}}{2 \\sqrt{3}}: \\frac{\\mathrm{a}}{\\sqrt{3}}: \\frac{\\sqrt{3}}{2} \\mathrm{a}=1: 2: 3\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
