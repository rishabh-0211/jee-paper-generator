</mfenced><mi>p</mi></msup><msup><mfenced><mrow><mo>-</mo><mi>h</mi></mrow></mfenced><mrow><mi>p</mi><mo>-</mo><mn>1</mn></mrow></msup><mi>sin</mi><mfenced><mfrac><mn>1</mn><mi>h</mi></mfrac></mfenced></mrow></mfenced></math></p><p>Since,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;is not differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>, therefore</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>&#8804;</mo><mn>1</mn></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#60;</mo><mi>p</mi><mo>&#8804;</mo><mn>1</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f06f5bfc7ab78ae92a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mn>0</mn><mo>)</mo></math>, so that the function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mfrac><mrow><mn>2</mn><mi>x</mi><mo>-</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi></mrow><mrow><mn>2</mn><mi>x</mi><mo>+</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi></mrow></mfrac></math> is continuous at each point in its domain, is", "image": null}, "options": [{"id": "Rpk22", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "YUxtR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "etsip", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "UHpTo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Since, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>,</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi><mo>,</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi></math> are continuous functions, so the<br />function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi></math> is clearly continuous at each point of its domain except possibly at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>.</p><p>So, for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi></math> to be continuous at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mn>0</mn></mfenced><mo>=</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mfrac><mrow><mn>2</mn><mo>-</mo><mfrac><mrow><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi></mrow><mi>x</mi></mfrac></mrow><mrow><mn>2</mn><mo>+</mo><mfrac><mrow><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi></mrow><mi>x</mi></mfrac></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mo>&#8757;</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mfrac><mrow><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi></mrow><mi>x</mi></mfrac><mo>=</mo><mn>1</mn><mo>,</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mfrac><mrow><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi></mrow><mi>x</mi></mfrac><mo>=</mo><mn>1</mn></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e16f5bfc7ab78ae8ac", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "The number of points at which the function $\\mathrm{f}(\\mathrm{x})=\\frac{1}{\\log |\\mathrm{x}|}$ is discontinuous is:", "image": null}, "options": [{"id": "W3dJT", "text": "1", "isCorrect": false, "image": null}, {"id": "oncn8", "text": "2", "isCorrect": false, "image": null}, {"id": "D7Jbl", "text": "3", "isCorrect": true, "image": null}, {"id": "e3oWM", "text": "4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The function $\\log |x|$ is not defined at $x=0$, so, $\\mathrm{x}=0$ is a point of discontinuity. Also for $\\mathrm{f}(\\mathrm{x})$ to be defined, $\\log |\\mathrm{x}| \\neq 0 \\Rightarrow \\mathrm{x} \\neq\\pm 1$\r\n\r\nHence, 0,1,-1 are three points of discontinuity.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d66f5bfc7ab78ae846", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let $f: R \\rightarrow R$ be a function such that $f(x+y)=f(x)+f(y), \\forall x, y \\in \\mathbb{R}$\r\n\r\nIf $\\mathrm{f}(\\mathrm{x})$ is differentiable at $\\mathrm{x}=0$, then which one of the following is incorrect?", "image": null}, "options": [{"id": "0Jmi8", "text": "$\\mathrm{f}(\\mathrm{x})$ is continuous, $\\forall \\mathrm{x} \\in \\mathrm{R}$", "isCorrect": false, "image": null}, {"id": "VlnPx", "text": "$\\mathrm{f}^{\\prime}(\\mathrm{x})$ is constant, $\\forall \\mathrm{x} \\in \\mathrm{R}$", "isCorrect": false, "image": null}, {"id": "MAcpr", "text": "$\\mathrm{f}(\\mathrm{x})$ is differentiable, $\\forall \\mathrm{x} \\in \\mathrm{R}$", "isCorrect": false, "image": null}, {"id": "OB32Y", "text": "$\\mathrm{f}(\\mathrm{x})$ is differentiable only in a finite interval containing zera.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x+y)=f(x)+f(y), \\forall x, y \\in R$\r\n\r\nPut $x=0=y$\r\n\r\n$\\Rightarrow f(0)=f(0)+f(0)$\r\n\r\n$\\Rightarrow f(0)=0$\r\n\r\nNow, $f^{\\prime}(0)=\\lim _{h \\rightarrow 0} \\frac{f(0+h)-f(0)}{h}$\r\n\r\n$f^{\\prime \\prime}(0)=\\lim _{h \\rightarrow 0} \\frac{f(h)}{h}$\r\n\r\nNow, $f(x)=\\lim _{h \\rightarrow 0} \\frac{f(x+h)-f(x)}{h}$\r\n\r\n$=\\lim _{h \\rightarrow 0} \\frac{f(x)+f(h)-f(x)}{h}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=\\lim _{\\mathrm{h} \\rightarrow 0} \\frac{\\mathrm{f}(\\mathrm{h})}{\\mathrm{h}}=\\mathrm{f}^{\\prime}(0) \\\\\r\n\r\n\\Rightarrow \\mathrm{f}(\\mathrm{x})=\\mathrm{x} \\mathrm{f}(0)+\\mathrm{C}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nBut $f(0)=0$\r\n\r\n$$\r\n\r\n\\therefore \\mathrm{C}=0\r\n\r\n$$\r\n\r\nHence, $f(x)=x f(0), \\forall x \\in R$\r\n\r\nClearly, $\\mathrm{f}(\\mathrm{x})$ is everywhere continuous and differentiable and $\\mathrm{f}^{\\prime}(\\mathrm{x})$ is constant.\r\n\r\n$\\forall \\mathrm{x} \\in \\mathrm{R}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d16f5bfc7ab78ae820", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 3, "question": {"text": "If a function $f(x)$ is given by\r\n\r\n$f(x)=\\frac{x}{1+x}+\\frac{x}{(x+1)(2 x+1)}$\r\n\r\n$+\\frac{x}{(2 x+1)(3 x+1)}+\\ldots, \\infty$, then at $x=0, f(x)$", "image": null}, "options": [{"id": "7LyUn", "text": "has no limit", "isCorrect": false, "image": null}, {"id": "ygzQr", "text": "is not continuous", "isCorrect": true, "image": null}, {"id": "Jqcxl", "text": "is continuous but not differentiable", "isCorrect": false, "image": null}, {"id": "raLhn", "text": "is differentiable", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let\r\n\r\n$f(x)=\\frac{x}{1+x}+\\frac{x}{(x+1)(2 x+1)}+\\frac{x}{(2 x+1)(3 x+1)}+\\ldots \\infty$\r\n\r\n$=\\lim _{n \\rightarrow \\infty} \\sum_{r=1}^{n} \\frac{x}{[(r-1) x+1](r x+1)}$\r\n\r\n$=\\lim _{x \\rightarrow \\infty} \\sum_{\\mathrm{r}=1}^{\\mathrm{n}}\\left[\\frac{\\mathrm{x}}{[(\\mathrm{r}-1) \\mathrm{x}+1]}-\\frac{1}{\\mathrm{rx}+1}\\right]$\r\n\r\n$=\\lim _{n \\rightarrow \\infty}\\left[1-\\frac{1}{n x+1}\\right]=1$\r\n\r\nFor $x=0,$ we have $f(x)=0$\r\n\r\nThus, we have $f(x)=\\left\\{\\begin{array}{ll}1, & x \\neq 0 \\\\ 0, & x=0\\end{array}\\right.$\r\n\r\nClearly, $\\lim _{x \\rightarrow 0^{-}} \\mathrm{f}(\\mathrm{x})=\\lim _{\\mathrm{x} \\rightarrow 0^{+}} \\mathrm{f}(\\mathrm{x}) \\neq \\mathrm{f}(0)$\r\n\r\nSo, $\\mathrm{f}(\\mathrm{x})$ is not continuous at $\\mathrm{x}=0$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c76f5bfc7ab78ae7ca", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let $\\mathrm{f}(\\mathrm{x})=\\left\\{\\begin{array}{l}\\frac{1-\\sin ^{3} \\mathrm{x}}{3 \\cos ^{2} \\mathrm{x}}, \\mathrm{x}<\\frac{\\pi}{2} \\\\ \\mathrm{p}, \\quad \\mathrm{x}=\\frac{\\pi}{2} \\\\ \\frac{\\mathrm{q}(1-\\sin \\mathrm{x})}{(\\pi-2 \\mathrm{x})^{2}}, \\mathrm{x}>\\frac{\\pi}{2}\\end{array}\\right.$\r\n\r\nIf $f(x)$ is continuous at $x=\\frac{\\pi}{2},(p, q)=$", "image": null}, "options": [{"id": "aXp7t", "text": "(1,4)", "isCorrect": false, "image": null}, {"id": "BKmOk", "text": "$\\left(\\frac{1}{2}, 2\\right)$", "isCorrect": false, "image": null}, {"id": "WYGuC", "text": "$\\left(\\frac{1}{2}, 4\\right)$", "isCorrect": true, "image": null}, {"id": "wo1pz", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{f}\\left[(\\pi / 2)^{-}\\right]=\\lim _{\\mathrm{h} \\rightarrow 0} \\frac{1-\\sin ^{3}[(\\pi / 2)-\\mathrm{h}]}{3 \\cos ^{2}[(\\pi / 2)-\\mathrm{h}]}$\r\n\r\n$\\quad=\\lim _{\\mathrm{h} \\rightarrow 0} \\frac{1-\\cos ^{3} \\mathrm{~h}}{3 \\sin ^{2} \\mathrm{~h}}=\\frac{1}{2}$\r\n\r\n$\\mathrm{f}\\left[(\\pi / 2)^{+}\\right]=\\lim _{\\mathrm{h} \\rightarrow 0} \\frac{\\mathrm{q}[1-\\sin \\{(\\pi / 2)+\\mathrm{h}\\}]}{[\\pi-2\\{(\\pi / 2)+\\mathrm{h}\\}]^{2}}$\r\n\r\n$=\\lim _{\\mathrm{h} \\rightarrow 0} \\frac{\\mathrm{q}(1-\\cosh )}{4 \\mathrm{~h}^{2}}=\\frac{\\mathrm{q}}{8}$\r\n\r\n$\\therefore \\mathrm{p}=\\frac{1}{2}=\\frac{\\mathrm{q}}{8} \\Rightarrow \\mathrm{p}=\\frac{1}{2}, \\mathrm{q}=4$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a76f5bfc7ab78ae6bc", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the function $f(x)=\\begin{cases}A x-B, & x \\leq 1 \\\\ 3 x & , 1<x<2 \\\\ B x^{2}-A, & x \\geq 2\\end{cases}$\r\nis continuous at $x=2$ and $4,$ then the values of a and $b$ are", "image": null}, "options": [{"id": "UmHmq", "text": "3,5", "isCorrect": false, "image": null}, {"id": "08wDk", "text": "3,-5", "isCorrect": true, "image": null}, {"id": "AmDuh", "text": "0,3", "isCorrect": false, "image": null}, {"id": "6HS2Y", "text": "0,5", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $\\mathrm{f}(\\mathrm{x})$ is continuous at $\\mathrm{x}=2$\r\n$\\therefore \\mathrm{f}(2)=\\lim _{\\mathrm{x} \\rightarrow 2^{+}} \\mathrm{f}(\\mathrm{x}) \\Rightarrow 1=\\lim _{\\mathrm{x} \\rightarrow 2^{+}}(\\mathrm{ax}+\\mathrm{b})$\r\n$\\therefore 1=2 \\mathrm{a}+\\mathrm{b}$\r\nAgain $\\mathrm{f}(\\mathrm{x})$ is continuous at $\\mathrm{x}=4$\r\n$\\therefore \\mathrm{f}(4)=\\lim _{x \\rightarrow 4^{-}} \\mathrm{f}(\\mathrm{x}) \\Rightarrow 7=\\lim _{\\mathrm{x} \\rightarrow 4^{-}}(\\mathrm{ax}+\\mathrm{b})$\r\n$\\therefore 7=4 \\mathrm{a}+\\mathrm{b}$\r\nSolving (1) and $(2),$ we get $a=3, b=-5$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8756f5bfc7ab78aee69", "title": "Differentiability", "totalQuestions": 8, "questions": [{"_id": "67726d01c49e8ef28ee2b386", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "$f(x)=\\left\\{\\begin{array}{cc}4 & -\\infty \\lt x \\lt -\\sqrt{5} \\\\ x^2-1 & -\\sqrt{5} \\leq x \\leq \\sqrt{5} \\\\ 4 & \\sqrt{5} \\leq x \\lt \\infty\\end{array}\\right.$\nIf $k$ is the number of points where $f(x)$ is not differentiable then $k-2=$", "image": null}, "options": [{"id": "u8yrT", "text": "$2$", "image": null, "isCorrect": false}, {"id": "rX78U", "text": "$1$", "image": null, "isCorrect": false}, {"id": "s8p9w", "text": "$0$", "image": null, "isCorrect": true}, {"id": "FnLnp", "text": "$3$", "image": null, " ": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
