: false, "image": null}], "correctValue": null, "solution": {"text": "Since, $|a-a|=0 \\leq 1,$ so $a R a, \\forall a \\in R$ $\\therefore R$ is reflexive. Now, $a R b \\Rightarrow|a-b| \\leq 1 \\Rightarrow|b-a| \\leq 1 \\Rightarrow b R a$\r\n\r\n$\\therefore R$ is symmetric. But $R$ is not transitive as\r\n\r\n$1 R 2,2 R 3$ but $1 \\not R^{\\prime} 3$\r\n\r\n$$\r\n\r\n[\\because|1-3|=2>1]\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8666f5bfc7ab78aedb9", "title": "Questions on Venn Diagram", "totalQuestions": 10, "questions": [{"_id": "67726d19c49e8ef28ee2b43e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "In a statistical investigation of 1003 families of Calcutta, it was found that 63 families has neither a radio nor a TV, 794 families has a radio and 187 has TV. The number of families in that group having both a radio and a TV is", "image": null}, "options": [{"id": "ejQdc", "text": "36", "image": null, "isCorrect": false}, {"id": "36Y3q", "text": "41", "image": null, "isCorrect": true}, {"id": "h380Z", "text": "32", "image": null, "isCorrect": false}, {"id": "FtnsP", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n\\text {  Given, } n(R) & =794 \\\\\nn(T) & =187 \\\\\nn(R \\cup T)^{\\prime} & =63 \\\\\nn(\\mathrm{Total}) & =n(R \\cup T)+n(R \\cup T)^{\\prime} \\\\\n\\Rightarrow \\quad 1003 & =n(R \\cup T)+63 \\\\\n\\Rightarrow \\quad n(R \\cup T) & =940\n\\end{aligned}$\nBy set theory\n$\\begin{array}{lc}\n\\Rightarrow & n(R \\cup T)=n(R)+n(T)-n(R \\cap T) \\\\\n\\Rightarrow & 940=794+187-n(R \\cap T) \\\\\n\\Rightarrow & n(R \\cap T)=981-940=41\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cfec49e8ef28ee2b36b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "In an examination, $62 \\%$ of the candidates failed in English, 42% in Mathematics and 20% in both. The number of those who passed in both the subjects is", "image": null}, "options": [{"id": "uWXDM", "text": "$11$", "image": null, "isCorrect": false}, {"id": "O4feV", "text": "$16$", "image": null, "isCorrect": true}, {"id": "zBzfF", "text": "$18$", "image": null, "isCorrect": false}, {"id": "FpA7S", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/9I5DBY6wMJkndyAmE6yLVCTcpiLnHc7dbS0ZZNkrNDw.original.fullsize.png\"/>\nFrom the given condition,\n$\\mathrm{a}+\\mathrm{c}=62 \\mathrm{k} ; \\mathrm{b}+\\mathrm{c}=42 \\mathrm{k}$ and $\\mathrm{c}=20 \\mathrm{k}$\nHence $\\mathrm{a}=42 \\mathrm{k}$ and $\\mathrm{b}=22 \\mathrm{k}$\nNumber of students who failed in none means passed in both $=\\mathrm{n}=100 \\mathrm{k}-(\\mathrm{a}+\\mathrm{b}+\\mathrm{c})$\n$=100 \\mathrm{k}-(42 \\mathrm{k}+22 \\mathrm{k}+20 \\mathrm{k})=16 \\mathrm{k}$. or $16 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87697ae24e9e2db8c90", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "A set $A$ has 3 elements and another set B has 6 elements. Then", "image": null}, "options": [{"id": "d9ubV", "text": "$3 \\leq \\mathrm{n}(\\mathrm{A} \\cup \\mathrm{B}) \\leq 6$", "image": null, "isCorrect": false}, {"id": "Sytl9", "text": "$3 \\leq \\mathrm{n}(\\mathrm{A} \\cup \\mathrm{B}) \\leq 9$", "image": null, "isCorrect": false}, {"id": "UrHYN", "text": "$6 \\leq \\mathrm{n}(\\mathrm{A} \\cup \\mathrm{B}) \\leq 9$", "image": null, "isCorrect": true}, {"id": "ph5qB", "text": "$0 \\leq n(A \\cup B) \\leq 9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have<br />$\\min n(A \\cup B)=\\max \\{n(A), n(B)\\}=\\max \\{3,6\\}=6$<br />$\\operatorname{Max} n(A \\cup B)=n(A)+n(B)=9$<br />$\\therefore 6 \\leq n(A \\cup B) \\leq 9$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8326f5bfc7ab78aeb73", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 1, "question": {"text": "If $A=\\{x: x$ is a multiple of 4$\\}$ and, $B=\\{x: x$ is a multiple of 6$\\}$, then $A \\cap B$ consists of multiples of", "image": null}, "options": [{"id": "ZquZF", "text": "\r\n16\r\n", "isCorrect": false, "image": null}, {"id": "1GQqS", "text": "\r\n12\r\n", "isCorrect": true, "image": null}, {"id": "S0Afh", "text": "\r\n88\r\n", "isCorrect": false, "image": null}, {"id": "7zpNb", "text": "\r\n4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $x \\in A \\cap B$. Then,\r\n$x \\in A$ and $x \\in B$\r\n$\\Rightarrow x$ is a multiple of 4 and $x$ is a multiple of 6\r\n$\\Rightarrow x$ is a multiple of 4 and 6 both\r\n$\\therefore x$ is a multiple of 12", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8196f5bfc7ab78aea96", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "In a statistical investigation of 1003 families of Calcutta, it was found that 63 families has neither a radio nor a T.V, 794 families has a radio and 187 has T.V. The number of families in that group having both a radio and a T.V is", "image": null}, "options": [{"id": "hG8B4", "text": "36", "isCorrect": false, "image": null}, {"id": "JHRGI", "text": "41", "isCorrect": true, "image": null}, {"id": "B7wk1", "text": "32", "isCorrect": false, "image": null}, {"id": "vbDa2", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/9Jni0yQvN0bRVYO4WI8L2yws0JP2EPtvxPPdAPz7vIs.original.fullsize.png\"><br>\r\n\r\nLet $\\mathrm{R}$ be the set of families having a radio and $T$ the set families having a T.V. then $\\mathrm{n}(\\mathrm{R} \\cup \\mathrm{T})=$ The number of families having at least on of the radio and $\\mathrm{T} \\mathrm{V}=1003-63=940$ $n(\\mathrm{R})=794$ and $\\mathrm{n}(\\mathrm{T})=187$\r\n\r\nLet $x$ families have both a radio and a T.V. Then number of families who have only radio $=$ $794-x$\r\n\r\nAnd the number of families who have only T.V. $=187-x$\r\n\r\nErom Venn diagram, $794-x+x-187-x=940$ $\\Rightarrow 981-x=940$ or $x=981-940=41$\r\n\r\nHence, the required number of families having both a radio and a T.V.=41", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ef6f5bfc7ab78ae91f", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> be two sets such that <math xmlns=\"htt </mo><mo>(</mo><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>)</mo><mo>&#8746;</mo><mi>&#981;</mi><mo>&#160;</mo><mo>[</mo><mo>&#8757;</mo><mi>A</mi><mo>&#8745;</mo><mi>X</mi><mo>=</mo><mi>&#981;</mi><mo>]</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>A</mi><mo>=</mo><mi>A</mi><mo>&#8745;</mo><mi>B</mi></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p>Again, consider <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8746;</mo><mi>X</mi><mo>=</mo><mi>B</mi><mo>&#8746;</mo><mi>X</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>B</mi><mo>&#8745;</mo><mo>(</mo><mi>A</mi><mo>&#8746;</mo><mi>X</mi><mo>)</mo><mo>=</mo><mi>B</mi><mo>&#8745;</mo><mo>(</mo><mi>B</mi><mo>&#8746;</mo><mi>X</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>(</mo><mi>B</mi><mo>&#8745;</mo><mi>A</mi><mo>)</mo><mo>&#8746;</mo><mo>(</mo><mi>B</mi><mo>&#8745;</mo><mi>X</mi><mo>)</mo><mo>=</mo><mo>(</mo><mi>B</mi><mo>&#8745;</mo><mi>B</mi><mo>)</mo><mo>&#8746;</mo><mo>(</mo><mi>B</mi><mo>&#8745;</mo><mi>X</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>(</mo><mi>B</mi><mo>&#8745;</mo><mi>A</mi><mo>)</mo><mo>&#8746;</mo><mi>&#981;</mi><mo>=</mo><mi>B</mi><mo>&#8746;</mo><mi>&#981;</mi><mo>[</mo><mi>B</mi><mo>&#8745;</mo><mi>X</mi><mo>=</mo><mi>&#981;</mi><mo>]</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>=</mo><mi>B</mi></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p>Thus from Eq. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>ii</mi><mo>)</mo></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mi>B</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d26f5bfc7ab78ae825", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "Universal set,\r\n$U=\\left\\{x \\mid x^{5}-6 x^{4}+11 x^{3}-6 x^{2}=0\\right\\}$\r\n $A=\\left\\{x \\mid x^{2}-5 x+6=0\\right\\}$  $\\mathrm{B}=\\left\\{\\mathrm{x} \\mid \\mathrm{x}^{2}-3\\mathrm{x}+2=0\\right\\}$\r\n\r\nWhat is $(A \\cap B)^{\\prime}$ equal to ?", "image": null}, "options": [{"id": "qZAbs", "text": "{1,3}", "isCorrect": false, "image": null}, {"id": "2T3KF", "text": "{1,2,3}", "isCorrect": false, "image": null}, {"id": "sUt3I", "text": "{0,1,3}", "isCorrect": true, "image": null}, {"id": "kXZgB", "text": "{0,1,2,3}", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$U=\\left\\{x: x^{5}-6 x^{4}+11 x^{3}-6 x^{2}=0\\right\\}$\r\n\r\nSolving for values of $x$, we get $\\mathrm{U}=\\{0,1,2,3\\}$\r\n\r\n$\\mathrm{A}=\\left\\{\\mathrm{x}: \\mathrm{x}^{2}-5 \\mathrm{x}+6=0\\right\\}$\r\n\r\nSolving for values of $x$, we get $\\mathrm{A}=\\{2,3\\}$\r\n\r\nand $\\mathrm{B}=\\left\\{\\mathrm{x}: \\mathrm{x}^{2}-3 \\mathrm{x}+2=0\\right\\}$\r\n\r\nSolving for values of $x$, we get $\\mathrm{B}=\\{2,1\\}$\r\n\r\n$A \\cap B=\\{2\\}$\r\n\r\n$\\therefore(A \\cap B)^{\\prime}=U-(A \\cap B)$\r\n\r\n$=\\{0,1,2,3\\}-\\{2\\}=\\{0,1,3\\}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c26f5bfc7ab78ae79e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "The set $(A \\backslash B) \\cup(B \\backslash A)$ is equal to]", "image": null}, "options": [{"id": "KVqxc", "text": "$[A \\backslash(A \\cap B)] \\cap[B \\backslash(A \\cap B)]$", "isCorrect": false, "image": null}, {"id": "51wAO", "text": "$(A \\cup B) \\backslash(A \\cap B)$", "isCorrect": true, "image": null}, {"id": "bk23l", "text": "$A \\backslash(A \\cap B)$", "isCorrect": false, "image": null}, {"id": "9ggXP", "text": "$\\overrightarrow{A \\cap B} \\backslash A \\cup B$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given set can be written as $(A-B) \\cup(B-A)=(A \\cup B)-(A \\cap B)$\r\n\r\n(By definition of symmetric difference) Hence, $(\\mathrm{A} \\backslash \\mathrm{B}) \\cup(\\mathrm{B} \\backslash \\mathrm{A})=(\\mathrm{A} \\cup \\mathrm{B}) \\backslash(\\mathrm{A} \\cap \\mathrm{B})$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b46f5bfc7ab78ae721", "previousYearPapers": 00Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "Let \\(\\mathrm{A}=\\{x: x \\in \\mathrm{R},|x|  < 1\\}\\);\n\\(\\mathrm{B}=\\{x: x \\in \\mathrm{R},|x-1| \\geq 1\\} \\text { and } \\mathrm{A} \\cup \\mathrm{B}=\\mathrm{R}-\\mathrm{D} \\text {, }\\)\nthen the set \\(\\mathrm{D}\\) is", "image": null}, "options": [{"id": "dmMSU", "text": "\\(\\{x: 1  < x \\leq 2\\}\\)", "image": null, "isCorrect": false}, {"id": "KGc2i", "text": "\\(\\{x: 1 \\leq x  < 2\\}\\)", "image": null, "isCorrect": true}, {"id": "WuDWJ", "text": "\\(\\{x: 1 \\leq x \\leq 2\\}\\)", "image": null, "isCorrect": false}, {"id": "CFXpF", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned}\n& \\mathrm{A}=[x: x \\in \\mathrm{R},-1  < x < 1] \\\\\n& \\mathrm{B}=[x: x \\in \\mathrm{R}: x-1 \\leq-1 \\text { or } x-1 \\geq 1] \\\\\n&=[x: x \\in R: x \\leq 0 \\text { or } x \\geq 2] \\\\\n& \\therefore A \\cup B=R-D,\n\\end{aligned}\\)\nwhere \\(D=[x: x \\in R, 1 \\leq x < 2]\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77a6f5bfc7ab78ae52b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "If \\(A=\\{1,2,3,4,5\\}\\), then the number of proper subsets of \\(A\\) is", "image": null}, "options": [{"id": "IRsPc", "text": "31", "image": null, "isCorrect": true}, {"id": "fJiMx", "text": "38", "image": null, "isCorrect": false}, {"id": "aKM1z", "text": "48", "image": null, "isCorrect": false}, {"id": "1VrEQ", "text": "54", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of proper subsets of \\(A=2^n-1\\) Given: \\(A=\\{1,2,3,4,5\\}\\)\nHere \\(n=5\\)\n\\(\\therefore\\) no. of proper subsets \\(=2^5-1\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
