or 2nd degree equationto represent pair of straight lines", "totalQuestions": 2, "questions": [{"_id": "64c0e8196f5bfc7ab78aea94", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "$Statement- 1$: If the general equation $x^{2}+y^{2}+2 x y+2 g x+2 f y+4=0$ represents a pair of real lines then $|\\mathrm{g}| \\geq 2$. \r\n\r\n$Statement- 2$: The equation $a x^{2}+2 h x y+b y^{2}+2 g x+2 f y+c=0$ represents pair\r\n\r\nof real lines if $a b c+2 f g h-a f^{2}-b g^{2}-c h^{2}=0$", "image": null}, "options": [{"id": "KVhyg", "text": "Statement -1 is false, Statement- 2 is true", "isCorrect": false, "image": null}, {"id": "CUPsv", "text": "Statement -1 is true, Statement- 2 is true; Statement -2 is a correct explanation for Statement-1", "isCorrect": false, "image": null}, {"id": "vWYOq", "text": "Statement -1 is true, Statement- 2 is true; Statement -2 is not a correct explanation for Statement-1", "isCorrect": false, "image": null}, {"id": "VfCkI", "text": "Statement -1 is true, Statement- 2 is false", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The equation represents a pair of lines if $1 \\cdot 1 \\cdot 4+2 \\cdot \\mathrm{f} \\cdot \\mathrm{g} \\cdot 1-1 \\cdot \\mathrm{f}^{2}-1 \\cdot \\mathrm{g}^{2}-4 \\cdot 1^{2}=0$\r\n\r\n$\\Rightarrow(f-g)^{2}=0 \\Rightarrow f=g$\r\n\r\nThe equation becomes $(x+y)^{2}+2 g(x+y)+4=0$ Which represents pair of parallel lines, which are real provided $(2 \\mathrm{~g})^{2}-4 \\cdot 4 \\cdot 1 \\geq 0 \\Rightarrow|\\mathrm{g}| \\geq 2$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e36f5bfc7ab78ae8b7", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "The equation $x^{2}-2 \\sqrt{3} x y+3 y^{2}-3 x+3 \\sqrt{3} y-4=0 \\quad$ represents", "image": null}, "options": [{"id": "jRDil", "text": "a pair of intersecting lines", "isCorrect": false, "image": null}, {"id": "vJrIh", "text": "a pair of parallel lines with distance between\r\n\r\nthem $\\frac{5}{2}$", "isCorrect": true, "image": null}, {"id": "RzYel", "text": "a pair of parallel lines with distance between them $5 \\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "OkRWq", "text": "a conic section, which is not a pair of straight lines", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We have $a=1, h=-\\sqrt{3}, b=3, g=-\\frac{3}{2}$, $\\mathrm{f}=\\frac{3 \\sqrt{3}}{2}, \\mathrm{c}=-4$\r\n\r\nThus $a b c+2 f g h-a f^{2}-b g^{2}-c h^{2}=0$\r\n\r\nHence the equation represents a pair of straight lines.\r\n\r\nAgain $\\frac{\\mathrm{a}}{\\mathrm{h}}=\\frac{\\mathrm{h}}{\\mathrm{b}}=\\frac{\\mathrm{g}}{\\mathrm{f}}=-\\frac{1}{\\sqrt{3}}$\r\n\r\n$\\therefore$ the lines are parallel. The distance between them\r\n\r\n$$\r\n\r\n=2 \\sqrt{\\frac{g^{2}-a c}{a(a+b)}}=2 \\sqrt{\\frac{\\frac{9}{4}+4}{1(1+3)}}=\\frac{5}{2}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};

    function selectTopic(index) {

      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}

              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
