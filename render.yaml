services:
  - type: web
    name: jee-paper-generator
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 180 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
